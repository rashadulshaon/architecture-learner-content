slides:
  - slug: why-we-forget
    title: 'Read it, got it… forgot it'
    kind: story
    tldr: 'Reading alone fades within a week. To remember something, you have to keep asking yourself about it.'
    keywords: ['forgetting curve', 'active recall', 'memory', 'how to remember', 'learning technique']
    blocks:
      - type: metaphor
        icon: pencil
        title: 'Writing in the sand'
        body: |
          Write your name in the sand on a beach and the first wave wipes half of it away. Fresh learning works the same way: the brain erases what it is not using. But trace the same letters again and again and the grooves get deep enough that the waves can no longer reach them.
      - type: visual
        kind: bars
        caption: 'How much you still remember after reading something once (roughly)'
        items:
          - {label: 'Right after reading', value: 100, display: '100%', tone: good, tip: 'You have just read it, so it all feels clear — and that feeling is exactly what fools you.'}
          - {label: 'After 20 minutes', value: 58, display: '~60%', tip: 'Not even half an hour later, almost half of it has already gone blurry.'}
          - {label: 'After 1 day', value: 33, display: '~35%', tone: warn, tip: 'By the next day two thirds are gone. This is the best moment to review.'}
          - {label: 'After 1 week', value: 25, display: '~25%', tone: bad, tip: 'Without review, a week later only the rough outline of the idea is left.'}
      - type: quote
        body: 'Reading is not learning. Trying to remember is.'
    aside:
      - type: problem
        body: 'After a tutorial you feel you understood everything, yet nothing comes back when you need it at work. This whole platform is designed to fix exactly that.'
      - type: terms
        items:
          - {term: 'Forgetting curve', meaning: 'A graph of how quickly we lose what we learned as time passes.'}
          - {term: 'Active recall', meaning: 'Trying to bring the answer back from memory before you look at it.'}
    check:
      q: 'What is the most effective way to make something stick?'
      a: 'Not re-reading it. Try to recall it without looking at the answer, and do that again every few days.'

  - slug: learning-loop
    title: 'The four-step learning loop'
    kind: concept
    tldr: 'See → recall → check → come back. This loop is what turns small pieces of knowledge into lasting ones.'
    keywords: ['spaced repetition', 'learning loop', 'review', 'interleaving', 'study routine']
    blocks:
      - type: text
        body: |
          Every topic here is taught in four small steps. Each step makes your brain do a different kind of work, so skipping one breaks the loop. One small step (a sub-segment) per sitting is enough — no more.
      - type: visual
        kind: steps
        caption: 'Four steps to make a topic stick'
        steps:
          - {title: '1. See', body: 'Understand one idea on a slide, through a picture and an example.', tip: 'Seeing a picture and words together lets the brain store the idea in two ways. This is called dual coding.'}
          - {title: '2. Recall', body: 'On a flashcard, say the answer yourself before you look.', tip: 'The harder it is to remember, the stronger the memory gets. That is active recall.'}
          - {title: '3. Check', body: 'Get quiz questions wrong and read why. Mistakes teach you the most.', tip: 'The brain takes an explanation far more seriously when it arrives right after a wrong answer.'}
          - {title: '4. Come back', body: 'Bookmark what felt hard and look at it again a few days later.', tone: accent, tip: 'Reviewing with gaps of a few days is called spaced repetition, the best weapon against forgetting.'}
      - type: points
        title: 'Your daily routine'
        style: check
        items:
          - 'One sub-segment at a time: 10 to 15 minutes.'
          - 'Answer the "Ask yourself" question under each slide in your head before you reveal it.'
          - 'Before starting something new, do one round of yesterday''s flashcards.'
    aside:
      - type: remember
        body: 'See → recall → check → come back. Stay stuck on the first step and nothing sticks.'
      - type: tips
        items:
          - 'Stop when you feel tired. Short sessions with breaks stay with you longer.'
          - 'Quiz questions come in a shuffled order on purpose: mixing topics makes memories stronger (interleaving).'
    check:
      q: 'Which of the four steps teach you the most, and why?'
      a: '"Recall" and "Check", because they make your brain work. Just looking takes no effort.'

  - slug: four-rooms
    title: 'The four rooms of the platform'
    kind: concept
    tldr: 'Slides teach, flashcards make you recall, the quiz checks you and bookmarks bring you back.'
    keywords: ['slides', 'flashcards', 'quiz', 'bookmarks', 'using the platform', 'search']
    blocks:
      - type: text
        body: |
          The menu at the top has four rooms. Each one has a different job, but all four follow the same list of topics (A to U). So whatever you learn in one room, you can review in the room next door.
      - type: visual
        kind: table
        caption: 'What happens in each room, and when to go there'
        headers: ['Room', 'What is inside', 'When to go']
        rows:
          - cells: ['Learn', 'Slides with pictures, code and examples', 'To start a new topic']
            tip: 'The list on the left, the slide in the middle, extra context on the right — like a slide deck.'
          - cells: ['Flashcards', '15-second question-and-answer cards', 'After learning, in spare minutes']
            tip: 'Cards play one after another like stories. Tap a card to flip it and see the answer.'
          - cells: ['Quiz', 'Multiple-choice questions with explanations, no time limit', 'To test yourself']
            tip: 'When you get one wrong, the right-hand side explains why and which answer is right, with a link to the slide.'
          - cells: ['Bookmarks', 'The slides and cards you saved', 'To review between tasks']
            tip: 'Save what feels hard. Everything is grouped by topic, so it is easy to find later.'
    aside:
      - type: tips
        items:
          - 'Can''t remember something mid-task? Open search (Ctrl/⌘ + K) and type any word.'
          - 'Every link opens in a new tab, so you can keep a slide in one tab and the quiz in another.'
      - type: refs
        items:
          - {to: learning-loop, label: 'The four-step learning loop'}
    check:
      q: 'You forgot what an idempotency key is in the middle of a task. What is the quickest way to find it?'
      a: 'Open search (Ctrl/⌘ + K) and type "idempotency": it takes you straight to that slide.'

  - slug: read-a-slide
    title: 'How to read a slide'
    kind: howto
    tldr: 'The list on the left, the main idea in the middle, extra context on the right. Hover over any part of a picture to see what it means.'
    keywords: ['how to use', 'shortcuts', 'tooltip', 'reading a slide', 'keyboard']
    blocks:
      - type: visual
        kind: flow
        caption: 'The three parts of a slide page, and the question at the bottom'
        nodes:
          - {id: outline, label: 'Left: the list', sub: 'topic → step → slide', icon: list, col: 0, row: 0, tip: 'A map of the whole course. Jump to any slide in one click; slides you have read get a tick.'}
          - {id: slide, label: 'Middle: the slide', sub: 'one idea only', icon: book, tone: accent, col: 2, row: 0, tip: 'Short text, a picture and code. Hover over any part of the picture for a short explanation.'}
          - {id: notes, label: 'Right: context', sub: 'stories, commands, links', icon: lightbulb, col: 4, row: 0, tip: 'Useful things around the main idea: the problem it solves, handy commands, links to related slides.'}
          - {id: recall, label: 'Bottom: a question', sub: 'Ask yourself', icon: target, col: 2, row: 1.5, tip: 'Every slide ends with a question. The answer stays hidden: think first, then reveal it.'}
        edges:
          - {from: outline, to: slide, label: 'Pick a slide from the list.'}
          - {from: slide, to: notes, label: 'Want to know more? Look to the right.'}
          - {from: slide, to: recall, label: 'At the end, answer the question before you peek.'}
          - {from: recall, to: outline, label: 'Got it? Move on. Not quite? Read the slide again.', tone: good}
      - type: code
        lang: php
        file: 'Hover over the highlighted line'
        code: |
          $order = $orders->find($id);

          // This line is highlighted: hover over it to see why it matters
          $this->denyAccessUnlessGranted('view', $order);

          return $this->json($order);
        marks:
          - {line: 4, tip: 'Without this one line, anyone could change the id in the URL and read someone else''s order.'}
      - type: points
        title: 'Reading order'
        style: number
        items:
          - 'Look at the picture first, then read the text.'
          - 'Quotes set apart in bold are non-negotiable rules. Learn them word for word.'
          - 'Finally, answer the question at the bottom yourself, then compare.'
    aside:
      - type: commands
        title: 'Keyboard shortcuts'
        items:
          - {cmd: '→   ←', desc: 'Next or previous slide'}
          - {cmd: 'B', desc: 'Bookmark the slide, or remove the bookmark'}
          - {cmd: 'Ctrl + K   or   /', desc: 'Open search'}
      - type: remember
        body: 'Picture → text → code → question. Read in this order and it sticks best.'
    check:
      q: 'What do you do when you don''t understand a box in a picture?'
      a: 'Hover over the box (or tap it on a phone): a short explanation pops up.'

flashcards:
  - q: 'What does the forgetting curve tell us?'
    a: 'Without review, we forget most of what we learn within a day.'
    more: |
      The brain does not keep everything. Whatever it does not need again, it drops quickly, and the drop is steepest in the first day. That is why a short review the day after learning pays off the most.
    ref: why-we-forget
  - q: 'What is active recall?'
    a: 'Trying to remember the answer yourself, before looking at it.'
    more: |
      Re-reading only makes things feel familiar; the brain does no real work. When you try to remember, the brain has to dig the information out, and that digging is what strengthens the path to it. Flashcards and the quiz make you do exactly this.
    ref: why-we-forget
  - q: 'What is spaced repetition?'
    a: 'Reviewing a little every few days, instead of ten times in one day.'
    more: |
      A memory gets strongest when you review it just as you are about to forget it. So review today, tomorrow, in three days and in a week, letting the gaps grow. The Bookmarks room exists for exactly this.
    ref: learning-loop
  - q: 'What are the four steps of the learning loop?'
    a: 'See → recall → check → come back.'
    more: |
      See it on a slide, recall it with flashcards, check yourself with the quiz, and come back a few days later through your bookmarks. Most people stop after the first step, which is why they forget.
    ref: learning-loop
  - q: 'What is dual coding?'
    a: 'Taking in the same idea in two forms: a picture and words.'
    more: |
      The brain stores pictures and words along separate paths. When an idea is stored both ways, you can pull it back through one even if the other has faded. That is why almost every slide here has a picture.
    ref: learning-loop
  - q: 'Where do you find the slides and cards you saved?'
    a: 'In the Bookmarks room, grouped by topic.'
    more: |
      The Bookmarks room has two tabs: slides and flashcards. The left side lists each topic and how many items you saved in it. Whenever you have five spare minutes at work, review from here.
    ref: four-rooms
  - q: 'What is the shortcut to open search?'
    a: 'Ctrl + K (⌘ + K on a Mac), or just press /.'
    more: |
      Type any word into search, such as "cache" or "payment". Results are grouped by topic and each one shows a one-line summary underneath, so you can tell which one you need without opening it.
    ref: read-a-slide

quiz:
  - q: 'Ratul has read a tutorial three times, yet he still can''t remember it when he needs it at work. Which change would help him most?'
    hint: 'Which activity makes the brain work hardest?'
    options:
      - text: 'Reading it a fourth time, more carefully'
        correct: false
        why: 'Re-reading makes it feel familiar, but the brain never has to work, so the memory stays weak.'
      - text: 'Closing the tutorial and trying to recall it on his own'
        correct: true
        why: 'The effort of remembering (active recall) is what makes a memory strong.'
      - text: 'Copying the whole thing word for word into a notebook'
        correct: false
        why: 'Copying is just reading once more. He is still not recalling anything by himself.'
      - text: 'Finding a longer tutorial'
        correct: false
        why: 'The problem is not a lack of information. It is a lack of review.'
    ref: why-we-forget
  - q: 'Which of these genuinely help you remember?'
    hint: 'All but one of them work. Which one gives the brain no time to settle?'
    options:
      - text: 'Reviewing every few days'
        correct: true
        why: 'Reviewing with gaps (spaced repetition) slows down forgetting.'
      - text: 'Thinking of the answer before looking at it'
        correct: true
        why: 'This is active recall, the most powerful learning technique there is.'
      - text: 'Finishing a whole topic in one night'
        correct: false
        why: 'Cram it all in one sitting and most of it is gone the next day; the brain gets no time to organise it.'
      - text: 'Looking at pictures and text together'
        correct: true
        why: 'The idea gets stored two ways (dual coding), so you have two routes back to it.'
    ref: learning-loop
  - q: 'You got a quiz question wrong. What is the best thing to do next?'
    hint: 'If you never find out why you got it wrong, you will make the same mistake again.'
    options:
      - text: 'Read the explanation on the right and open the slide it links to'
        correct: true
        why: 'An explanation that arrives right after a mistake is the one you remember best.'
      - text: 'Move on to the next question quickly'
        correct: false
        why: 'Moving on without knowing why leaves the wrong idea in your head.'
      - text: 'Feel bad and close the quiz'
        correct: false
        why: 'Getting things wrong is the whole point of a quiz: it shows you where the gaps are.'
    ref: learning-loop
  - q: 'How much should you study in one sitting to learn best?'
    hint: 'Small pieces are easier to remember.'
    options:
      - text: 'One sub-segment: 10 to 15 minutes'
        correct: true
        why: 'The brain can easily organise a small piece, and you don''t get tired.'
      - text: 'A whole topic, from start to finish'
        correct: false
        why: 'When that much comes in at once, the new pieces push the earlier ones out.'
      - text: 'Until you feel sleepy'
        correct: false
        why: 'A tired brain stores nothing; you are just spending time.'
    ref: learning-loop
  - q: 'Why is the answer hidden in the "Ask yourself" box under each slide?'
    hint: 'If the answer were right in front of you, would you think for yourself?'
    options:
      - text: 'So that you try to recall it yourself first'
        correct: true
        why: 'Thinking before you look is active recall. With the answer visible, your eyes would jump straight to it.'
      - text: 'To save space on the page'
        correct: false
        why: 'Space is not the issue. It is a learning technique, not a design limitation.'
      - text: 'Because the answer is not important'
        correct: false
        why: 'The opposite: it is the most important part of the slide, which is why you are asked to work it out yourself.'
    ref: read-a-slide
