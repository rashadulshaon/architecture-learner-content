    ref: alarm-that-always-rings
  - q: 'এই alert rule-এর কোন অংশ runbook-এর সাথে সরাসরি জড়িত?'
    lang: yaml
    code: |
      - alert: CheckoutErrorsHigh
        expr: error_ratio > 0.05
        for: 5m
        labels: {severity: page, team: payments}
        annotations:
          runbook_url: 'https://wiki.shop.example/runbooks/checkout-errors'
    hint: 'on-call ঘুম ভেঙে কোথায় যাবে?'
    options:
      - text: 'annotations.runbook_url'
        correct: true
        why: 'alert-এর সাথে নির্দেশনার লিংক এক ক্লিকে পাওয়া যায়।'
      - text: 'for: 5m'
        correct: false
        why: 'এটা অপেক্ষার সময়, নির্দেশনা নয়।'
      - text: 'labels.severity'
        correct: false
        why: 'এটা জরুরিতার মাত্রা; কী করতে হবে, বলে না।'
    ref: alert-rule-runbook
