flashcards:
  - q: 'Incident-এ সবচেয়ে আগে কী করবে: কারণ খোঁজা না ক্ষতি থামানো?'
    a: 'ক্ষতি থামানো (mitigate)। কারণ খোঁজা ক্ষতি থামার পর, শান্তভাবে।'
    more: |
      ফাটা পাইপে আগে ভালভ বন্ধ করো, তারপর কারণ খোঁজো। Rollback, feature flag বন্ধ, scale up বা failover হলো দ্রুত ক্ষতি থামানোর উপায়। ক্ষতি চলতে থাকলে প্রতি মিনিট ক্রেতার ক্ষতি আর টাকার ক্ষতি।
    ref: mitigate-first
  - q: 'Triage কী?'
    a: 'ক্ষতি মেপে (কার, কতটা, কখন থেকে) অগ্রাধিকার ঠিক করা, যাতে সবচেয়ে জরুরি কাজে আগে মনোযোগ যায়।'
    more: |
      হাসপাতালের ইমার্জেন্সির মতো: যার ক্ষতি বেশি, তাকে আগে। প্রথম পাঁচ মিনিটে প্রশ্ন করো: কার ক্ষতি, কতটা, কখন থেকে, কী বদলেছে, টাকা বা ডেটা ঝুঁকিতে কি না। উত্তর থেকে severity ঠিক হয়।
    ref: triage-severity
  - q: 'SEV1, SEV2, SEV3 কী?'
    a: 'ঘটনার ক্ষতির মাত্রার স্তর: SEV1 সবচেয়ে গুরুতর (টাকা বা ডেটা ঝুঁকিতে), SEV3 সবচেয়ে সামান্য।'
    more: |
      প্রতিটা স্তরের জন্য আগে থেকে ঠিক থাকে কতজন জড়াবে, কত দ্রুত সাড়া, আর কত পরপর আপডেট। সন্দেহ হলে severity বাড়িয়ে ধরো, পরে কমানো যায়। সংজ্ঞাগুলো লিখে রাখলে রাত ৩টায় তর্ক হয় না।
    ref: triage-severity
  - q: 'আগে থেকে "কী বদলেছে" জিজ্ঞেস করা কেন সবচেয়ে কাজের প্রশ্ন?'
    a: 'বেশিরভাগ outage সাম্প্রতিক deploy, config বা traffic বদলের পরে ঘটে, তাই সেটাই সবচেয়ে সম্ভাব্য অনুমান।'
    more: |
      Outage-এর শুরুর সময় দেখো, তার ঠিক আগে কী deploy হলো তা মেলাও। মিললে rollback সবচেয়ে দ্রুত আর নিরাপদ পথ। না মিললে traffic বা বাইরের নির্ভরতা বদলেছে কি না দেখো।
    ref: mitigate-first
  - q: 'Mitigation-এর কোন উপায় সবচেয়ে নিরাপদ, কোনটা সবচেয়ে ঝুঁকিপূর্ণ?'
    a: 'নিরাপদ: rollback, feature flag বন্ধ। তারপর scale, শেষে hotfix: নতুন কোড, নতুন ঝুঁকি।'
    more: |
      Rollback আগের পরীক্ষিত অবস্থায় ফেরে। Hotfix মানে ঘটনার চাপে লেখা নতুন কোড, প্রায়ই ঠিকমতো test ছাড়া। তাই সম্ভব হলে rollback আগে, আর migration হলে সাবধানে (কলাম মুছে ফেলা ফেরানো যায় না)।
    ref: mitigate-first
  - q: 'Incident Commander কী করেন, আর কী করেন না?'
    a: 'সমন্বয়, সিদ্ধান্ত আর কাজ ভাগ করেন। নিজে debug বা কিবোর্ডে কাজ করেন না।'
    more: |
      সমন্বয়ক ছবিটা পুরো ধরে রাখেন: কে কী করছে, কী বদলেছে, কাকে ডাকা দরকার। হাত লাগালে মনোযোগ একটা জিনিসে আটকে যায়, আর বাকি সব হারায়। অন্য ভূমিকা: Ops lead, Comms lead, Scribe।
    ref: roles-communication
  - q: 'ভালো status update-এ কী কী থাকে?'
    a: 'প্রভাব (সংখ্যায়), যা জানি, যা করছি, যা জানি না, আর পরের আপডেটের সময়।'
    more: |
      "যা জানি না" লেখা সততার চিহ্ন; আন্দাজকে তথ্য বলে চালিয়ে দিলে আস্থা যায়। পরের আপডেটের সময় বলে দিলে কেউ বারবার জিজ্ঞেস করে না। সংশ্লিষ্টদের আপডেট দেওয়া একজনের নির্দিষ্ট দায়িত্ব।
    ref: roles-communication
  - q: 'Blameless postmortem কী?'
    a: 'ঘটনার পরে "কে দোষী" নয়, "সিস্টেম কেন ভুল করতে দিল" খোঁজা, আর মালিক-তারিখসহ কাজের তালিকা বানানো।'
    more: |
      মানুষ ভুল করবেই; সিস্টেমকে এমন করতে হয় যাতে একটা ভুল বিপর্যয় না হয়। দোষ খুঁজলে মানুষ ভুল লুকায়, আর শেখা বন্ধ। Postmortem-এ সময়রেখা, প্রভাব, মূল কারণ, যা ভালো আর যা খারাপ হলো, আর কাজের তালিকা থাকে।
    ref: blameless-postmortem
  - q: 'Postmortem-এর কাজের তালিকায় প্রতিটা কাজে কী থাকতে হবে?'
    a: 'একজন মালিক আর একটা তারিখ। মালিকহীন কাজ সাধারণত কখনো হয় না।'
    more: |
      কাজ ticket-এ নিয়ে ট্র্যাক করো, আর পরের সভায় দেখো কতটা হলো। সবচেয়ে ভালো কাজ সেগুলো, যা পুনরাবৃত্তি ঠেকায়: নতুন alert, নতুন test, নতুন guardrail। শুধু "আরও সাবধান থাকব" কাজ নয়।
    ref: blameless-postmortem

quiz:
  - q: 'সুমির অ্যাপে ১৪:০০-তে নতুন deploy হলো, ১৪:১০ থেকে ৩০% payment ব্যর্থ। সবচেয়ে ভালো প্রথম পদক্ষেপ কোনটা?'
    hint: 'ক্ষতি থামানো আগে, কারণ পরে।'
    options:
      - text: 'ওই deploy rollback করা, তারপর কারণ খোঁজা'
        correct: true
        why: 'সাম্প্রতিক বদল সবচেয়ে সম্ভাব্য কারণ, আর rollback দ্রুত ও নিরাপদ।'
      - text: 'লাইভ সার্ভারে ঢুকে সন্দেহের কোড ঘেঁটে সরাসরি ঠিক করা'
        correct: false
        why: 'ক্ষতি চলতে থাকে, আর সরাসরি বদল হিসাবের বাইরে নতুন ঝুঁকি আনে।'
      - text: 'ক্রেতাদের জানিয়ে অপেক্ষা করা'
        correct: false
        why: 'জানানো দরকার, কিন্তু ক্ষতি থামানোর পাশাপাশি; শুধু জানিয়ে বসে থাকা নয়।'
      - text: 'আরও লগ চালু করে দেখা'
        correct: false
        why: 'তদন্ত পরে। সাম্প্রতিক বদল জানা থাকলে আগে ক্ষতি থামাও।'
    ref: mitigate-first
  - q: 'কোন ঘটনাটা SEV1 হিসেবে ধরা উচিত?'
    hint: 'টাকা বা ডেটার সরাসরি ক্ষতি আছে কি?'
    options:
      - text: 'সব ক্রেতার checkout বন্ধ'
        correct: true
        why: 'সরাসরি আয় বন্ধ: সর্বোচ্চ জরুরি।'
      - text: 'ব্যবহারকারীর ব্যক্তিগত তথ্য ফাঁসের সম্ভাবনা'
        correct: true
        why: 'ডেটা ঝুঁকিতে, আইনি দায়ও আছে (যেমন GDPR-এ ৭২ ঘণ্টা)। SEV1।'
      - text: 'অ্যাডমিন রিপোর্ট পাতা একটু ধীর'
        correct: false
        why: 'ভেতরের টিমের অসুবিধা, ক্রেতার ক্ষতি নেই। SEV3।'
      - text: 'একটা ছোট বানান ভুল ওয়েবসাইটে'
        correct: false
        why: 'অগ্রাধিকারে একদম নিচে; ticket।'
    ref: triage-severity
  - q: 'Incident চলছে। দুজন ডেভেলপার একসাথে prod-এ বদল করছে, আর কেউ জানে না অন্যজন কী করছে। সবচেয়ে ভালো সমাধান কী?'
    hint: 'সমন্বয় কে করছে?'
    options:
      - text: 'একজন Incident Commander ঠিক করা; সব বদল তাঁর অনুমতিতে ও একটা চ্যানেলে লেখা'
        correct: true
        why: 'বদলগুলো একে অপরকে কাটে না, আর কী ঘটছে সবাই জানে।'
      - text: 'যে আগে শুরু করেছে সে চলুক, অন্যজন থামুক, কারণ জানিয়ে ছাড়া'
        correct: false
        why: 'কে কী করছে জানা না থাকলে এটাও ঠিক হয় না; সমন্বয়ক লাগে।'
      - text: 'দুজনই চলুক, কেউ না কেউ ঠিক করবেই'
        correct: false
        why: 'এভাবে বদলে বদলে একে অপরকে নষ্ট করে ফেলে।'
      - text: 'সবাইকে ডেকে আরও লোক বাড়ানো'
        correct: false
        why: 'আরও লোক মানে আরও বিশৃঙ্খলা, যদি সমন্বয়ক না থাকে।'
    ref: roles-communication
  - q: 'ইমনের status update: "কিছু সমস্যা হচ্ছে, দেখছি।" এটা কেন দুর্বল?'
    hint: 'ম্যানেজার এটা পড়ে কী জানল?'
    options:
      - text: 'প্রভাব সংখ্যায় নেই, কী করছে বলা নেই, পরের আপডেটের সময়ও নেই'
        correct: true
        why: 'ভালো update-এ প্রভাব, যা জানি, যা করছি, যা জানি না আর পরের সময় থাকে।'
      - text: 'বাংলায় লেখা উচিত ছিল না'
        correct: false
        why: 'ভাষা সমস্যা নয়; বিষয়বস্তু অস্পষ্ট।'
      - text: 'আপডেট দেওয়া উচিতই নয়, আগে সমস্যা ঠিক করতে হয়'
        correct: false
        why: 'আপডেট না পেলে সবাই ডেভেলপারকে ফোন করে; Comms lead-এর কাজই এটা।'
    ref: roles-communication
  - q: 'নিচের postmortem লাইনগুলোর কোনটা blameless ধারার?'
    hint: 'কোনটা ঠিক করার মতো কিছু দেয়?'
    options:
      - text: '"রহিম ভুল কমান্ডে production মুছে দিয়েছে।"'
        correct: false
        why: 'দোষ একজনের ওপর; ঠিক করার কিছু নেই, আর পরের জনেরও একই ভুল হতে পারে।'
      - text: '"production আর staging-এর কমান্ড দেখতে একই, আর নিশ্চিতকরণ ধাপ ছিল না; তাই ভুল সহজ হয়েছিল।"'
        correct: true
        why: 'সিস্টেমের দুর্বলতা চিহ্নিত: ঠিক করার কাজ বের হয় (আলাদা রং, নিশ্চিতকরণ, অনুমতি)।'
      - text: '"আরও সাবধান থাকতে হবে।"'
        correct: false
        why: 'কাজ নয়, শুভেচ্ছা। মালিক বা তারিখ নেই, কিছু বদলাবে না।'
    ref: blameless-postmortem
