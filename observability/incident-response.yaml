slides:
  - slug: everyone-jumps-in
    title: 'রাত ৩টা: সবাই একসাথে হাঁড়িতে হাত'
    kind: story
    tldr: 'Outage-এ সবচেয়ে বড় বিপদ প্রায়ই মূল সমস্যা নয়, বিশৃঙ্খলা: পাঁচজন একসাথে প্রোডাকশনে বদল করে, কেউ জানে না কী বদলেছে।'
    keywords: ['incident', 'outage', 'on-call', 'chaos', 'live debugging', 'ঘটনা সামলানো']
    blocks:
      - type: metaphor
        icon: fire
        title: 'পাড়ার আগুন'
        body: |
          পাড়ায় আগুন লাগলে সবাই বালতি নিয়ে ছোটে, কেউ ভুল দিকে পানি ছিটায়, কেউ দরজা আটকে দাঁড়ায়, কেউ জানে না আগুন কোথা থেকে শুরু। ফায়ার সার্ভিসে একজন নেতা থাকে, কাজ ভাগ থাকে, আর সবার আগে থাকে আগুন ছড়ানো থামানো, কারণ খোঁজা পরে।
      - type: visual
        kind: compare
        caption: 'একই outage, দুই রকম সামলানো'
        columns:
          - title: 'বিশৃঙ্খল'
            tone: bad
            icon: warning
            tip: 'ভালো উদ্দেশ্যে সবাই কাজ করছে, কিন্তু সমন্বয় নেই বলে সময় আর ক্ষতি দুটোই বাড়ছে।'
            items:
              - 'পাঁচজন একসাথে server-এ ঢুকে বদল করছে'
              - 'কে কী বদলাল কেউ জানে না'
              - 'ম্যানেজার প্রতি ৫ মিনিটে "কী হলো?" জিজ্ঞেস করছে'
              - 'কারণ খুঁজতে খুঁজতে ক্রেতারা অপেক্ষায়'
          - title: 'সংগঠিত'
            tone: good
            icon: check
            tip: 'আগে থেকে ঠিক করা ভূমিকা আর নিয়ম থাকলে ঘুম-জড়ানো মাথাতেও কাজ চলে।'
            items:
              - 'একজন সমন্বয়ক, বাকিরা নিজ নিজ কাজে'
              - 'প্রতিটা বদল একটা জায়গায় লেখা হয়'
              - 'নির্দিষ্ট সময় পরপর একজন সবাইকে জানায়'
              - 'আগে ক্ষতি থামানো, কারণ খোঁজা পরে'
      - type: quote
        body: 'Outage-এ সবার আগে ক্ষতি থামাও; কারণ খোঁজা পরে, শান্ত মাথায়।'
    aside:
      - type: story
        title: 'দুই বদলে একে অপরকে কাটা'
        body: 'রাত ৩টায় checkout ভেঙে গেল। একজন rollback করলেন, ঠিক একই সময়ে আরেকজন hotfix deploy করলেন। দুটো বদল একে অপরকে কাটল, অ্যাপ আরও খারাপ হলো। দুজনই জানতেন না, অন্যজন কী করছে।'
      - type: problem
        body: 'Incident-এর সময় মাথা চাপে থাকে, ঘুম কম, আতঙ্ক বেশি। তাই ভালো সিদ্ধান্তের জন্য নিয়ম আর ভূমিকা আগে থেকে ঠিক রাখতে হয়।'
    check:
      q: 'Incident-এ পাঁচজন একসাথে প্রোডাকশনে বদল করলে কী সমস্যা?'
      a: 'কে কী বদলাল কেউ জানে না, বদলগুলো একে অপরকে কাটতে পারে, আর কোনটা কাজ করল তা বোঝা যায় না। একজন সমন্বয়ক আর একটা জায়গায় বদলের তালিকা লাগে।'

  - slug: triage-severity
    title: 'Triage: আগে ক্ষতি মাপো, তারপর ঠিক করো কতটা জরুরি'
    kind: concept
    tldr: 'সমস্যা শুনে ছুটে না গিয়ে আগে জিজ্ঞেস করো: কার ক্ষতি, কতটা, কতক্ষণ ধরে; তারপর severity ঠিক করো, তাতে ঠিক হয় কতজন, কত দ্রুত।'
    keywords: ['triage', 'severity', 'SEV1', 'impact', 'priority', 'incident level', 'গুরুত্ব নির্ধারণ']
    blocks:
      - type: metaphor
        icon: building
        title: 'হাসপাতালের ইমার্জেন্সি'
        body: |
          ইমার্জেন্সিতে রোগী এলে আগে নার্স দেখেন কার অবস্থা সবচেয়ে গুরুতর: রক্তক্ষরণ আগে, সর্দি পরে। সবাইকে একই গতিতে দেখলে যার দরকার বেশি সে মরে যায়। Triage মানে সীমিত মানুষ আর সময় সঠিক জায়গায় ঢালা।
      - type: points
        title: 'প্রথম পাঁচ মিনিটের প্রশ্ন'
        style: number
        items:
          - 'কার ক্ষতি? সব ক্রেতার, কিছু অঞ্চলের, না শুধু ভেতরের টিমের?'
          - 'কতটা? সম্পূর্ণ বন্ধ, ধীর, না কিছু ফিচার কাজ করছে না?'
          - 'কখন শুরু? এর ঠিক আগে কী বদলেছে (deploy, config, traffic)?'
          - 'টাকা বা ডেটা ঝুঁকিতে আছে কি?'
      - type: visual
        kind: table
        caption: 'Severity: কত বড় ঘটনা, কী প্রতিক্রিয়া'
        headers: ['স্তর', 'কেমন ঘটনা', 'প্রতিক্রিয়া']
        rows:
          - cells: ['SEV1', 'সবার checkout বা payment বন্ধ, ডেটা ঝুঁকিতে', 'এখনই সবাই, সমন্বয়ক, ৩০ মিনিটে আপডেট']
            tip: 'টাকা বা ডেটার সরাসরি ক্ষতি। সবকিছু ফেলে এটা আগে।'
          - cells: ['SEV2', 'বড় ফিচার ভাঙা বা অনেক ধীর, বিকল্প আছে', 'এখনই on-call, ঘণ্টায় আপডেট']
            tip: 'ক্রেতারা কষ্টে, কিন্তু কিছু উপায়ে কাজ চলছে।'
          - cells: ['SEV3', 'ছোট ফিচার বা কম সংখ্যক ব্যবহারকারী', 'কাজের সময়ে, ticket']
            tip: 'রাতে ঘুম না ভাঙিয়ে সকালে ঠিক করা চলে।'
      - type: quote
        body: 'ছুটে যাওয়ার আগে মাপো: কার ক্ষতি, কতটা, কখন থেকে।'
    aside:
      - type: tips
        items:
          - 'সন্দেহ হলে severity বাড়িয়ে ধরো; পরে কমানো যায়, দেরিতে বাড়ানো যায় না।'
          - 'Severity-র সংজ্ঞা আগে থেকে লিখে রাখো। রাত ৩টায় "এটা কি SEV1?" তর্ক করার সময় থাকে না।'
      - type: terms
        items:
          - {term: 'Triage', meaning: 'ক্ষতি মেপে অগ্রাধিকার ঠিক করা, যাতে সীমিত মানুষ সবচেয়ে জরুরি কাজে লাগে।'}
          - {term: 'Blast radius', meaning: 'সমস্যা কতজন ব্যবহারকারী বা কতটা সিস্টেমে ছড়িয়েছে।'}
      - type: refs
        items:
          - {to: 'observability/metrics-slos', label: 'SLO দিয়ে ক্ষতির মাপ'}
    check:
      q: 'রাত ৩টায় alert: "রিপোর্ট পাতা ধীর", আর একই সময়ে "checkout ব্যর্থ ২০%"। প্রথমে কোনটা?'
      a: 'Checkout: সরাসরি টাকার ক্ষতি, তাই SEV1 বা SEV2। রিপোর্ট ধীর, SEV3, সকালে দেখা যায়। Triage-এর কাজই এই ক্রম ঠিক করা।'

  - slug: mitigate-first
    title: 'আগে থামাও, কারণ খোঁজা পরে'
    kind: howto
    tldr: 'Mitigation (rollback, feature flag বন্ধ, scale, failover) দ্রুত ক্ষতি থামায়; root cause খোঁজা তখনই, যখন ক্রেতারা আর ক্ষতির মধ্যে নেই।'
    keywords: ['mitigation', 'rollback', 'root cause', 'hypothesis', 'feature flag', 'kubectl rollout undo', 'live debugging']
    blocks:
      - type: metaphor
        icon: home
        title: 'ফুটো পাইপ আর প্লাবিত ঘর'
        body: |
          ঘরে পাইপ ফেটে পানি ভাসছে। আগে মেইন ভালভ বন্ধ করো: পানি থামল। তারপর শান্তভাবে খোঁজো কোন পাইপ ফাটল আর কেন। ভালভ না বন্ধ করে কারণ খুঁজলে পুরো ঘর ডুবে যায়। Rollback আর feature flag হলো তোমার মেইন ভালভ।
      - type: visual
        kind: steps
        caption: 'ঘটনার সময় ঘুরে ঘুরে চলা পাঁচ ধাপ'
        steps:
          - {title: '১. লক্ষণ দেখো', body: 'ড্যাশবোর্ড: error, latency, queue', tip: 'আন্দাজ নয়, সংখ্যা দেখো। RED আর queue-র গভীরতা।'}
          - {title: '২. কী বদলেছে?', body: 'শুরুর ঠিক আগে deploy, config, traffic', tip: 'বেশিরভাগ outage-এর পেছনে সাম্প্রতিক বদল থাকে। এটাই সবচেয়ে সম্ভাব্য অনুমান।'}
          - {title: '৩. অনুমান করো', body: 'একটা অনুমান, একটা সস্তা পরীক্ষা', tip: 'একসাথে অনেক বদল করলে কোনটা কাজ করল বোঝা যায় না।'}
          - {title: '৪. থামাও', body: 'rollback, flag বন্ধ, scale, failover', tip: 'নিরাপদতম উপায় আগে: rollback > flag > scale > hotfix।'}
          - {title: '৫. যাচাই করো', body: 'metric ফিরল কি না দেখো', tip: 'ক্ষতি থেমেছে প্রমাণ না দেখে ঘটনা বন্ধ ঘোষণা করো না।'}
      - type: code
        lang: bash
        file: 'terminal: প্রথম কয়েক মিনিটের কমান্ড'
        variant: good
        code: |
          # কখন শুরু? তার আগে কী deploy হলো?
          kubectl rollout history deployment/shop-api

          # সন্দেহ হলে আগে ফেরত যাও, কারণ পরে খুঁজবে
          kubectl rollout undo deployment/shop-api

          # queue জমছে কি?
          php bin/console messenger:stats

          # একটা ব্যর্থ request-এর পুরো গল্প: correlation id দিয়ে
          kubectl logs deploy/shop-api --since=15m | grep 0191-ab
        marks:
          - {line: 2, tip: 'revision-এর তালিকা, কোনটা কখন। শুরুর সময়ের সাথে মিলিয়ে দেখো।'}
          - {line: 5, tip: 'আগের revision-এ ফেরা। কোড rollback নিরাপদ, কিন্তু ডেটাবেস migration হলে আলাদা সাবধানতা।'}
          - {line: 11, tip: 'logging-tracing-এ বানানো correlation id দিয়ে একটা ক্রেতার ঘটনা এক সারিতে।'}
      - type: quote
        body: 'ক্ষতি থামানো আগে, কারণ খোঁজা পরে; আর একবারে একটাই বদল।'
    aside:
      - type: pitfalls
        items:
          - 'Rollback ভেবে নিয়ে migration ফেরত করা: কলাম মুছে ফেলা migration undo করা যায় না। এজন্য migration হবে ধাপে ধাপে (expand, তারপর contract)।'
          - 'Rollback-এর জন্য deploy-এর সাথে feature flag ব্যবহার করো: নতুন ফিচার flag-এর পেছনে থাকলে বন্ধ করা এক ক্লিকে।'
          - 'সার্ভারে ঢুকে সরাসরি কোড বদল (hot patch): ফাঁকে কোথায় কী বদলাল কেউ জানে না। সব বদল পাইপলাইনে।'
      - type: refs
        items:
          - {to: 'data/zero-downtime-migrations', label: 'নিরাপদ migration'}
          - {to: 'config/feature-flags', label: 'Feature flag'}
    check:
      q: 'Checkout ভাঙার ১০ মিনিট আগে নতুন deploy হয়েছে। প্রথমে rollback নাকি কারণ খোঁজা, আর কেন?'
      a: 'Rollback। সাম্প্রতিক বদলই সবচেয়ে সম্ভাব্য কারণ, আর ফেরা দ্রুত ও নিরাপদ। ক্ষতি থামলে তবেই শান্তভাবে কারণ খোঁজা যায়।'

  - slug: roles-communication
    title: 'ভূমিকা আর যোগাযোগ: কে কী করে, কে কী জানায়'
    kind: howto
    tldr: 'একজন Incident Commander সমন্বয় করে (হাতে কিবোর্ড ধরে না), একজন ঠিক করে, একজন সবাইকে নিয়মিত জানায়, আর একজন সময়রেখা লেখে।'
    keywords: ['incident commander', 'communications lead', 'scribe', 'status update', 'war room', 'ভূমিকা']
    blocks:
      - type: metaphor
        icon: users
        title: 'বিয়েবাড়ির ম্যানেজার'
        body: |
          বিয়েবাড়িতে ম্যানেজার নিজে রান্না করেন না, তিনি দেখেন কে কী করছে, কোথায় লোক লাগবে, অতিথিকে কী বলা হবে। বাবুর্চিরা রান্না করে, অন্য একজন অতিথিদের খবর দেয়। কাজ ভাগ না থাকলে সবাই রান্নায় লেগে যায়, আর অতিথি অজানা অপেক্ষায় থাকে।
      - type: visual
        kind: table
        caption: 'চার ভূমিকা: কাজ আর কী করে না'
        headers: ['ভূমিকা', 'কাজ', 'যা করে না']
        rows:
          - cells: ['Incident Commander', 'সমন্বয়, সিদ্ধান্ত, কাজ ভাগ', 'নিজে debug করে না']
            tip: 'যিনি ছবি পুরোটা দেখেন। হাতে কাজ ধরলে ছবি হারান, তাই কিবোর্ড ধরেন না।'
          - cells: ['Ops / Tech lead', 'তদন্ত আর ঠিক করা', 'যোগাযোগ করে না']
            tip: 'যিনি কিবোর্ডে। একসাথে অনেকে চাইলে IC-র মাধ্যমে।'
          - cells: ['Comms lead', 'সংশ্লিষ্টদের নিয়মিত আপডেট', 'debug করে না']
            tip: 'ম্যানেজার, সাপোর্ট আর status page: যাতে টেকনিক্যাল টিমকে বারবার জিজ্ঞেস না করে।'
          - cells: ['Scribe', 'সময়রেখা: কে কখন কী করল', 'সিদ্ধান্ত নেয় না']
            tip: 'পরে postmortem-এর মূল উপাদান। ঘটনার সময় লেখা সময়রেখা স্মৃতির চেয়ে নির্ভুল।'
      - type: code
        lang: text
        file: 'status update: প্রতি ৩০ মিনিটে একই ছাঁচে'
        variant: good
        code: |
          [১৪:২০] আপডেট #২ — SEV1, checkout ব্যর্থ

          প্রভাব:    প্রায় ২০% ক্রেতা অর্ডার করতে পারছে না (১৩:৫০ থেকে)
          যা জানি:   ১৩:৪৫-এর deploy-এর পর থেকে payment call time out হচ্ছে
          যা করছি:   ওই deploy rollback করা হচ্ছে; ১৪:৩০-এর মধ্যে ফল
          যা জানি না: কেন time out; rollback-এর পরে তদন্ত

          পরের আপডেট: ১৪:৫০ (অথবা আগে, যদি কিছু বদলায়)
        marks:
          - {line: 3, tip: 'সংখ্যায়: কতজন, কখন থেকে। "কিছু সমস্যা" নয়।'}
          - {line: 6, tip: '"যা জানি না" লেখা সততা: আন্দাজকে তথ্য বলে চালিয়ে দিলে পরে আস্থা যায়।'}
          - {line: 8, tip: 'পরের আপডেটের সময় বলে দিলে কেউ বারবার জিজ্ঞেস করে না।'}
      - type: quote
        body: 'যিনি ছবি দেখেন, তিনি হাত লাগান না; যিনি হাত লাগান, তিনি ছবি দেখেন না।'
    aside:
      - type: tips
        items:
          - 'ছোট দলে একজন একাধিক ভূমিকা নিতে পারে, কিন্তু IC আর Ops কখনো একজন নয়।'
          - 'একটাই incident চ্যানেল রাখো (chat room বা call); সব সিদ্ধান্ত আর বদল ওখানে লেখো। পাশের আলোচনা নয়।'
          - 'ক্রেতার জন্য status page-এ সৎ ভাষায় লেখো: কী ভাঙা, কবে ফেরার আশা, কখন পরের আপডেট।'
      - type: story
        title: 'আপডেট না পেয়ে ম্যানেজারের ফোন'
        body: 'একটা outage-এ ৪০ মিনিট কেউ বাইরে কিছু জানায়নি। ম্যানেজার, সাপোর্ট আর পার্টনার প্রত্যেকে ডেভেলপারকে সরাসরি ফোন করল, আর আসল কাজ থেমে গেল। নিয়মিত আপডেট থাকলে এই ফোনগুলো আসত না।'
    check:
      q: 'Incident Commander নিজে কিবোর্ড ধরে debug করলে কী হারাবে?'
      a: 'সামগ্রিক ছবি। কে কী করছে, কী বদলেছে, কাকে ডাকা দরকার, তা আর কেউ দেখে না। তাই সমন্বয়ক হাত লাগান না।'

