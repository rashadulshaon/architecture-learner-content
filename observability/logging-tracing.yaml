slides:
  - slug: needle-in-log-haystack
    title: 'রাত ২টা, ৪০ হাজার লাইন, একটা হারানো অর্ডার'
    kind: story
    tldr: 'সাধারণ লেখার log-এ একজন ক্রেতার ঘটনা আলাদা করা যায় না — সব request-এর লাইন মিশে একাকার হয়ে থাকে।'
    keywords: ['logging', 'debugging', 'production log', 'observability', 'লগ', 'log খোঁজা']
    blocks:
      - type: text
        body: |
          রাত ২টায় সাপোর্ট থেকে ফোন: অর্ডার ৫৫১২-র টাকা কেটেছে, কিন্তু অর্ডার হয়নি। তুমি সার্ভারে ঢুকে log খুললে — ৪০ হাজার লাইন, তিনটা সার্ভার আর একটা worker-এর লেখা একসাথে মেশানো। কোন লাইনটা ওই ক্রেতার, তা বোঝার কোনো উপায় নেই।
      - type: code
        lang: text
        file: 'var/log/prod.log'
        variant: bad
        code: |
          [02:01:13] app.INFO: Checkout started
          [02:01:13] app.INFO: Checkout started
          [02:01:14] app.INFO: Calling payment gateway
          [02:01:14] app.ERROR: Payment failed for user rahim@example.com
          [02:01:14] app.INFO: Order saved
          [02:01:15] app.ERROR: Something went wrong
          [02:01:15] app.INFO: Sending confirmation email
        marks:
          - {line: 2, tip: 'দুইটা আলাদা ক্রেতার request — কিন্তু লাইন দেখে কোনটা কার, আলাদা করার উপায় নেই।'}
          - {line: 4, tip: 'কোন অর্ডার? কোন gateway? কত টাকা? কিছুই নেই — উল্টো ক্রেতার ইমেইল log-এ ফাঁস হচ্ছে।'}
          - {line: 6, tip: 'এই লাইন কোনো প্রশ্নের উত্তর দেয় না — কী ভাঙল, কার ভাঙল, কিছুই না।'}
      - type: quote
        body: 'যে log থেকে একটা request-এর পুরো গল্প বের করা যায় না, সেটা তথ্য নয় — শুধু গোলমাল।'
    aside:
      - type: problem
        body: 'প্রোডাকশনে debugger বসানো যায় না, breakpoint দেওয়া যায় না। সেখানে তোমার চোখ একটাই — সিস্টেম নিজে যা লিখে রাখে। তাই কী লিখবে আর কীভাবে লিখবে, তা আগে থেকে নকশা করতে হয়।'
      - type: terms
        items:
          - {term: 'Log', meaning: 'সিস্টেমে ঘটা একটা ঘটনার লিখিত রেকর্ড — কখন, কোথায়, কী হলো।'}
          - {term: 'Observability', meaning: 'বাইরে থেকে দেখে ভেতরে কী চলছে তা বুঝতে পারার ক্ষমতা। তিন ভিত্তি: log, metric, trace।'}
    check:
      q: 'উপরের log-এ অর্ডার ৫৫১২-র ঘটনা খুঁজে পাওয়া প্রায় অসম্ভব কেন?'
      a: 'কোনো লাইনে অর্ডার বা request-এর পরিচয় নেই, আর সব request-এর লাইন মিশে আছে — তাই কোন লাইন কার, বোঝা যায় না।'

  - slug: structured-logging
    title: 'Structured log: চিঠি নয়, ঘরকাটা ফর্ম'
    kind: concept
    tldr: 'প্রতিটা log লাইন একটা JSON: বার্তা স্থির, আর বদলানো তথ্য (order_id, gateway) আলাদা ঘরে — তাই খোঁজা ও গোনা যায়।'
    keywords: ['structured logging', 'JSON log', 'context', 'Monolog', 'log level', 'স্ট্রাকচার্ড লগ']
    blocks:
      - type: metaphor
        icon: truck
        title: 'কুরিয়ারের ঘরকাটা ফর্ম'
        body: |
          কুরিয়ার অফিসে পার্সেল বুক করতে গেলে হাতে লেখা চিঠি কেউ নেয় না — দেয় ঘরকাটা ফর্ম: প্রেরক, প্রাপক, ওজন, গন্তব্য। ঘর আলাদা বলেই পরে "আজ খুলনায় কয়টা পার্সেল গেল" এক মিনিটে বের হয়। Structured log ঠিক তা-ই: প্রতিটা লাইন একটা JSON, যেখানে বার্তাটা স্থির আর বদলানো তথ্যগুলো আলাদা ঘরে (context) থাকে।
      - type: visual
        kind: compare
        caption: 'একই ঘটনা, দুইভাবে লেখা'
        columns:
          - title: 'সাধারণ লেখা'
            tone: bad
            icon: pencil
            tip: 'মানুষের পড়ার জন্য লেখা বাক্য। মেশিন এর ভেতর থেকে তথ্য আলাদা করতে পারে না।'
            items:
              - 'Payment failed for order 5512: timeout'
              - 'খুঁজতে হয় grep আর regex দিয়ে'
              - 'প্রতিবার বাক্য আলাদা, তাই "কতবার হলো" গোনা যায় না'
          - title: 'Structured (JSON)'
            tone: good
            icon: list
            tip: 'প্রতিটা তথ্য নিজের ঘরে। Log খোঁজার টুল (Loki, Elasticsearch, CloudWatch) ঘর ধরে filter ও যোগফল করতে পারে।'
            items:
              - '{"message":"payment.failed","order_id":5512,"reason":"timeout"}'
              - 'order_id = 5512 লিখলেই ওই অর্ডারের সব লাইন হাজির'
              - 'payment.failed ঘণ্টায় কতবার — এক query-তে গোনা যায়'
      - type: code
        lang: php
        file: 'src/Payment/CheckoutService.php'
        variant: good
        code: |
          try {
              $this->gateway->charge($order);
          } catch (GatewayException $e) {
              // বার্তা স্থির; বদলানো তথ্য সব context-এ
              $this->logger->error('payment.failed', [
                  'order_id' => $order->getId(),
                  'gateway' => 'bkash',
                  'amount_minor' => $order->getTotalMinor(),
                  'exception' => $e,
              ]);

              throw $e;
          }
        marks:
          - {line: 5, tip: 'বার্তায় কোনো variable নেই। তাই সব "payment.failed" এক নামে group হয় — গোনা, গ্রাফ আঁকা, alert দেওয়া সহজ।'}
          - {line: 6, tip: 'আলাদা ঘর: পরে order_id দিয়ে সরাসরি filter করা যাবে।'}
          - {line: 9, tip: 'exception নামের key-তে পুরো exception দিলে Monolog নিজেই class, বার্তা আর stack trace গুছিয়ে লেখে।'}
      - type: code
        lang: yaml
        file: 'config/packages/monolog.yaml'
        code: |
          when@prod:
              monolog:
                  handlers:
                      main:
                          type: stream
                          path: php://stderr
                          level: info
                          formatter: monolog.formatter.json
        marks:
          - {line: 6, tip: 'Container-এ ফাইলে নয়, stderr-এ লেখো। Log তুলে নিয়ে জমা রাখার দায়িত্ব প্ল্যাটফর্মের।'}
          - {line: 8, tip: 'এই এক লাইনেই প্রতিটা log রেকর্ড এক লাইনের JSON হয়ে বের হয়।'}
      - type: quote
        body: 'বার্তা স্থির রাখো; যা বদলায়, তা context-এ দাও।'
    aside:
      - type: terms
        items:
          - {term: 'Context', meaning: 'log লাইনের সাথে জোড়া key–value তথ্য: order_id, user_id, gateway।'}
          - {term: 'Log level', meaning: 'লাইনটা কত গুরুতর: debug < info < warning < error < critical।'}
          - {term: 'Formatter', meaning: 'log রেকর্ড কোন চেহারায় (সাধারণ লাইন, না JSON) লেখা হবে, তা ঠিক করে।'}
      - type: pitfalls
        items:
          - 'পাসওয়ার্ড, token, কার্ড নম্বর বা পুরো request body কখনো log-এ নয় — log অনেকের চোখে পড়ে, বহুদিন জমা থাকে।'
          - 'error level শুধু তখন, যখন কারো কিছু করা দরকার। সবকিছু error হলে আসল error চাপা পড়ে।'
          - 'loop-এর ভেতরে প্রতি ধাপে info log লিখো না — log জমানোর বিল GB হিসাবে আসে।'
      - type: refs
        items:
          - {to: 'security/data-protection', label: 'ব্যক্তিগত তথ্য আর log'}
    check:
      q: 'বার্তায় "Payment failed for order 5512" না লিখে payment.failed আর context-এ order_id দিলে লাভ কী?'
      a: 'বার্তা স্থির থাকায় ঘটনাটা গোনা ও group করা যায়, আর order_id আলাদা ঘরে থাকায় regex ছাড়াই সরাসরি filter করা যায়।'

  - slug: correlation-id
    title: 'Correlation ID: প্রতিটা request-এর ট্র্যাকিং নম্বর'
    kind: howto
    tldr: 'দরজায় ঢোকার সময় request-কে একটা নম্বর দাও, আর Monolog processor দিয়ে সেটা প্রতিটা log লাইনে নিজে থেকে বসাও।'
    keywords: ['correlation id', 'request id', 'Monolog processor', 'X-Correlation-Id', 'ট্র্যাকিং নম্বর']
    blocks:
      - type: metaphor
        icon: tag
        title: 'পার্সেলের ট্র্যাকিং নম্বর'
        body: |
          কুরিয়ার পার্সেল বুক করার সময়ই গায়ে একটা ট্র্যাকিং নম্বর সেঁটে দেয়। ঢাকা হাব, গাড়ি, খুলনা হাব — যেখানেই স্ক্যান হোক, খাতায় ওই নম্বরটাই ওঠে। পরে নম্বর দিয়ে খুঁজলে পুরো যাত্রা এক সারিতে চলে আসে।
      - type: text
        body: |
          **Correlation ID** হলো request-এর সেই ট্র্যাকিং নম্বর। দরজায় একবার বানাও — আর আগের সার্ভিস header-এ পাঠিয়ে থাকলে সেটাই নাও। তারপর একটা Monolog **processor** (প্রতিটা log রেকর্ড লেখার ঠিক আগে চলা ছোট্ট কোড) নম্বরটা সব লাইনে বসিয়ে দেয়; কাউকে হাতে লিখতে হয় না।
      - type: code
        lang: php
        file: 'src/Observability/CorrelationId.php'
        variant: good
        code: |
          #[AsMonologProcessor]
          final class CorrelationId implements ResetInterface
          {
              private ?string $id = null;

              public function get(): string
              {
                  return $this->id ??= Uuid::v7()->toRfc4122();
              }

              public function set(string $id): void
              {
                  $this->id = $id;
              }

              // Monolog প্রতিটা log রেকর্ড লেখার আগে এটা ডাকে
              public function __invoke(LogRecord $record): LogRecord
              {
                  $record->extra['correlation_id'] = $this->get();

                  return $record;
              }

              public function reset(): void
              {
                  $this->id = null;
              }
          }
        marks:
          - {line: 1, tip: 'Monolog\Attribute\AsMonologProcessor — এটা থাকলেই MonologBundle class-টাকে সব log channel-এর processor বানিয়ে দেয়।'}
          - {line: 8, tip: 'কেউ নম্বর না দিলে প্রথমবার চাওয়ার সময় নতুন UUID বানায় — তাই console command বা worker-এও নম্বর থাকে।'}
          - {line: 19, tip: 'extra-তে বসালে JSON formatter প্রতিটা লাইনে correlation_id ছাপে। Log লেখার কোডে কিছুই বদলাতে হয় না।'}
          - {line: 26, tip: 'worker বা long-running সার্ভারে এক কাজের নম্বর যেন পরের কাজে লেগে না থাকে — Symfony প্রতি কাজের পরে reset() ডাকে।'}
      - type: code
        lang: php
        file: 'src/Observability/CorrelationIdListener.php'
        variant: good
        code: |
          final class CorrelationIdListener
          {
              public function __construct(private readonly CorrelationId $correlationId)
              {
              }

              #[AsEventListener(priority: 1024)]
              public function onRequest(RequestEvent $event): void
              {
                  $incoming = $event->getRequest()->headers->get('X-Correlation-Id');

                  // আগের সার্ভিস নম্বর পাঠালে সেটাই চলবে — তবে যাচাই করে
                  if ($event->isMainRequest() && null !== $incoming && Uuid::isValid($incoming)) {
                      $this->correlationId->set($incoming);
                  }
              }

              #[AsEventListener]
              public function onResponse(ResponseEvent $event): void
              {
                  $event->getResponse()->headers->set('X-Correlation-Id', $this->correlationId->get());
              }
          }
        marks:
          - {line: 7, tip: 'উঁচু priority — যাতে security বা routing-এর log লেখার আগেই নম্বরটা বসে যায়।'}
          - {line: 13, tip: 'বাইরে থেকে আসা মান যাচাই ছাড়া log-এ বসালে কেউ নকল log লাইন গুঁজে দিতে পারে (log injection)।'}
          - {line: 21, tip: 'Response-এও নম্বরটা ফেরত যায় — ক্রেতার স্ক্রিনশট থেকেই সাপোর্ট টিম নম্বর পেয়ে যাবে।'}
    aside:
      - type: remember
        body: 'দরজায় নম্বর বানাও, সব log-এ বসাও, বাইরে গেলে সাথে পাঠাও।'
      - type: terms
        items:
          - {term: 'Request ID', meaning: 'এক সার্ভিসের ভেতরে একটা request-এর নম্বর।'}
          - {term: 'Correlation ID', meaning: 'পুরো যাত্রার নম্বর — সব সার্ভিস, queue আর worker-এ একই থাকে।'}
      - type: tips
        items:
          - 'Vue অ্যাপে error দেখানোর সময় response header-এর নম্বরটাও দেখাও: "সমস্যা হয়েছে, কোড: 0191…" — খোঁজা এক মিনিটের কাজ হয়ে যায়।'
          - 'user_id বা tenant_id-ও একই কায়দায় আরেকটা processor দিয়ে সব লাইনে বসানো যায়।'
    check:
      q: 'প্রতিটা logger call-এ হাতে correlation_id না দিয়ে processor ব্যবহার করা হয় কেন?'
      a: 'হাতে দিলে কেউ না কেউ ভুলে যাবে। Processor প্রতিটা log রেকর্ডে নিজে থেকে নম্বর বসায় — এক জায়গায় লিখে সব জায়গায় কাজ হয়।'

  - slug: id-across-boundaries
    title: 'নম্বরটা queue আর অন্য সার্ভিসেও যাবে'
    kind: howto
    tldr: 'বাইরের HTTP call-এর header-এ আর queue-র message-এর stamp-এ correlation ID পাঠাও; ওপাশে পৌঁছে সেটাই আবার তুলে নাও।'
    keywords: ['Messenger middleware', 'stamp', 'propagation', 'queue', 'worker log', 'নম্বর পাঠানো']
    blocks:
      - type: text
        body: |
          Request শেষ হলেও কাজ শেষ হয় না — ইমেইল যায় worker থেকে, পেমেন্ট হয় অন্য সার্ভিসে। নম্বরটা সীমানা পার না করলে গল্পটা মাঝপথে ছিঁড়ে যায়। তাই বাইরে যাওয়া প্রতিটা HTTP call-এর header-এ, আর queue-তে যাওয়া প্রতিটা message-এর গায়ে (Messenger-এর ভাষায় **stamp**) নম্বরটা সেঁটে দিতে হয়।
      - type: visual
        kind: flow
        caption: 'এক নম্বর, তিন জায়গার log — সবাই 0191-ab লিখছে'
        nodes:
