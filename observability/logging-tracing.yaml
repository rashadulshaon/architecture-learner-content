      - type: code
        lang: php
        file: 'src/Observability/CorrelationIdMiddleware.php'
        variant: good
        code: |
          final class CorrelationIdStamp implements StampInterface
          {
              public function __construct(public readonly string $id)
              {
              }
          }

          final class CorrelationIdMiddleware implements MiddlewareInterface
          {
              public function __construct(private readonly CorrelationId $correlationId)
              {
              }

              public function handle(Envelope $envelope, StackInterface $stack): Envelope
              {
                  $stamp = $envelope->last(CorrelationIdStamp::class);

                  if (null === $stamp) {
                      // পাঠানোর সময়: চলতি নম্বরটা message-এর গায়ে সেঁটে দাও
                      $envelope = $envelope->with(new CorrelationIdStamp($this->correlationId->get()));
                  } elseif (null !== $envelope->last(ReceivedStamp::class)) {
                      // worker-এ: message-এর নম্বরটাই এখন চলতি নম্বর
                      $this->correlationId->set($stamp->id);
                  }

                  return $stack->next()->handle($envelope, $stack);
              }
          }
        marks:
          - {line: 1, tip: 'Stamp = message-এর খামে সাঁটা বাড়তি তথ্য। Message-এর সাথেই serialize হয়ে queue-তে যায়।'}
          - {line: 20, tip: 'dispatch()-এর সময় চলে — request-এর নম্বরটা message-এর সাথে রওনা দেয়।'}
          - {line: 21, tip: 'ReceivedStamp থাকা মানে message-টা transport থেকে এসেছে, অর্থাৎ আমরা এখন worker-এর ভেতরে।'}
      - type: code
        lang: yaml
        file: 'config/packages/messenger.yaml'
        code: |
          framework:
              messenger:
                  buses:
                      messenger.bus.default:
                          middleware:
                              - App\Observability\CorrelationIdMiddleware
    aside:
      - type: tips
        items:
          - 'অন্য সার্ভিস ডাকার সময় HttpClient-এর `headers` option-এ `X-Correlation-Id` দাও; ওপাশের listener সেটা তুলে নেবে।'
          - 'Worker এক message শেষ করে service reset করে — `reset()` থাকায় পুরনো নম্বর পরের message-এ লেগে থাকে না।'
          - 'Retry হওয়া message-এও stamp থাকে, তাই প্রথম চেষ্টা আর পরের চেষ্টার log একই নম্বরে মেলে।'
      - type: refs
        items:
          - {to: 'messaging/events-vs-commands', label: 'Symfony Messenger-এর ভিত্তি'}
          - {to: correlation-id, label: 'নম্বরটা কোথায় তৈরি হয়'}
    check:
      q: 'API-র log-এ নম্বর আছে, কিন্তু worker-এর log-এ নেই। ফাঁকটা কোথায়?'
      a: 'Message পাঠানোর সময় নম্বরটা stamp হিসেবে জোড়া হয়নি, অথবা worker-এ stamp থেকে তুলে চলতি নম্বর করা হয়নি। Middleware দুই কাজই করে।'

  - slug: traces-and-spans
    title: 'Trace ও span: সময়টা গেল কোথায়?'
    kind: concept
    tldr: 'Trace একটা request-এর পুরো যাত্রা, span তার একেকটা ধাপ ও সেই ধাপের সময় — দেরিটা ঠিক কোথায়, এক নজরে দেখা যায়।'
    keywords: ['distributed tracing', 'span', 'trace', 'OpenTelemetry', 'traceparent', 'sampling', 'ট্রেসিং']
    blocks:
      - type: metaphor
        icon: map
        title: 'ট্র্যাকিং পাতার সময়ের হিসাব'
        body: |
          কুরিয়ারের ট্র্যাকিং পাতা শুধু "কোথায় কোথায় গেছে" দেখায় না — প্রতিটা হাবে কতক্ষণ পড়ে ছিল, তা-ও দেখায়: ঢাকা হাব ২ ঘণ্টা, গাড়িতে ৬ ঘণ্টা, খুলনা হাব ১৯ ঘণ্টা। দেরিটা কোথায়, আর বলে দিতে হয় না।
      - type: text
        body: |
          Distributed tracing এই ছবিটাই দেয়। একটা request-এর পুরো যাত্রা হলো **trace**; যাত্রার প্রতিটা ধাপ — একটা query, একটা বাইরের call — হলো একটা **span**, যার শুরুর সময়, মেয়াদ আর parent span লেখা থাকে। Log বলে কী ঘটেছে; trace বলে সময়টা কোথায় গেছে।
      - type: visual
        kind: bars
        caption: 'POST /checkout — এক trace-এর span-গুলো আর তাদের সময়'
        items:
          - {label: 'POST /checkout', value: 820, display: '820ms', tone: accent, tip: 'Root span — পুরো request। নিচের সব span এর সন্তান; তাদের সময় এর ভেতরেই পড়ে, বাকি ~১০০ms PHP-র নিজের কাজ।'}
          - {label: 'SELECT cart', value: 35, display: '35ms', tone: good, tip: 'ডেটাবেস থেকে cart পড়া। দ্রুত — এখানে খোঁজার কিছু নেই।'}
          - {label: 'bKash API call', value: 640, display: '640ms', tone: bad, tip: 'মোট সময়ের প্রায় ৮০% এখানে। Log-এ কোনো error নেই, অথচ ধীরগতির আসল কারণ এটাই।'}
          - {label: 'INSERT order', value: 25, display: '25ms', tone: good, tip: 'অর্ডার ডেটাবেসে লেখা — স্বাভাবিক সময়।'}
          - {label: 'queue-তে message', value: 12, display: '12ms', tone: good, tip: 'ইমেইলের কাজ queue-তে ফেলা। Worker-এর span-ও একই trace-এ জোড়া লাগে।'}
      - type: code
        lang: env
        file: '.env — OpenTelemetry auto-instrumentation'
        code: |
          OTEL_PHP_AUTOLOAD_ENABLED=true
          OTEL_SERVICE_NAME=shop-api
          OTEL_TRACES_EXPORTER=otlp
          OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
          OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
          OTEL_PROPAGATORS=tracecontext,baggage
          OTEL_TRACES_SAMPLER=parentbased_traceidratio
          OTEL_TRACES_SAMPLER_ARG=0.1
        marks:
          - {line: 1, tip: 'opentelemetry PHP extension আর auto-symfony package থাকলে request, HttpClient call ইত্যাদির span নিজে থেকেই তৈরি হয়।'}
          - {line: 6, tip: 'tracecontext = W3C-র traceparent header। এর ভেতরে trace ID আর parent span ID এক সার্ভিস থেকে পরেরটায় যায়।'}
          - {line: 8, tip: '১০% request-এর trace রাখা হয় (sampling)। সব রাখলে জমানোর খরচ আর বাড়তি চাপ — দুটোই বাড়ে।'}
      - type: code
        lang: php
        file: 'src/Payment/BkashGateway.php'
        variant: good
        code: |
          $span = Globals::tracerProvider()->getTracer('shop')
              ->spanBuilder('bkash.charge')
              ->startSpan();
          $scope = $span->activate();

          try {
              return $this->client->charge($order);
          } catch (\Throwable $e) {
              $span->recordException($e);
              $span->setStatus(StatusCode::STATUS_ERROR);

              throw $e;
          } finally {
              $scope->detach();
              $span->end();
          }
        marks:
          - {line: 2, tip: 'নিজের জরুরি ধাপের জন্য হাতে span খোলা — নামটা log-এর বার্তার মতোই স্থির রাখো।'}
          - {line: 15, tip: 'end() না ডাকলে span কখনো পাঠানোই হয় না; তাই finally-তে।'}
    aside:
      - type: remember
        body: 'Log: ঠিক কী ঘটল। Metric: কতবার, কত দ্রুত। Trace: সময়টা কোথায় গেল।'
