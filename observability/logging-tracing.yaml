          - {cmd: 'composer require open-telemetry/sdk open-telemetry/exporter-otlp', desc: 'SDK আর OTLP exporter'}
          - {cmd: 'composer require open-telemetry/opentelemetry-auto-symfony', desc: 'Symfony request-এর span নিজে থেকে বানায়'}
      - type: when
        use:
          - 'একটা request একাধিক সার্ভিস, queue বা বাইরের API ছুঁয়ে যায়।'
          - 'ধীর request-এর সময় কোন ধাপে যাচ্ছে, তা বুঝতে হবে।'
        avoid:
          - 'এক সার্ভার, এক ডেটাবেসের ছোট অ্যাপ — সেখানে correlation ID আর Symfony Profiler-ই যথেষ্ট।'
      - type: refs
        items:
          - {to: 'observability/metrics-slos', label: 'Metric, SLI ও SLO'}
    check:
      q: 'Checkout ৩ সেকেন্ড নিচ্ছে, অথচ log-এ কোনো error নেই। কী দেখলে দেরির জায়গাটা ধরা পড়বে?'
      a: 'ওই request-এর trace। প্রতিটা span-এর মেয়াদ পাশাপাশি দেখলে বোঝা যায় কোন ধাপ — কোন query বা বাইরের call — সবচেয়ে বেশি সময় খেয়েছে।'

flashcards:
  - q: 'Structured logging কী?'
    a: 'প্রতিটা log লাইনকে JSON-এর মতো নির্দিষ্ট ঘরে ভাগ করে লেখা, যাতে মেশিন দিয়ে filter করা ও গোনা যায়।'
    more: |
      সাধারণ বাক্যের log মানুষ পড়তে পারে, কিন্তু মেশিন তার ভেতর থেকে order_id বা gateway আলাদা করতে পারে না। JSON log-এ প্রতিটা তথ্য নিজের ঘরে থাকে। তাই log খোঁজার টুলে "order_id = 5512" লিখলেই ওই অর্ডারের সব লাইন চলে আসে।
    ref: structured-logging
  - q: 'Log-এর বার্তা স্থির রেখে বদলানো তথ্য context-এ দিতে হয় কেন?'
    a: 'বার্তা স্থির থাকলে একই ঘটনা এক নামে group হয় — গোনা, গ্রাফ আর alert সহজ। বদলানো তথ্য আলাদা ঘরে থাকলে filter করা যায়।'
    more: |
      "Payment failed for order 5512" আর "Payment failed for order 5513" মেশিনের চোখে দুইটা আলাদা বার্তা। কিন্তু বার্তা যদি সবসময় "payment.failed" হয় আর order_id থাকে context-এ, তাহলে "গত এক ঘণ্টায় payment.failed কতবার" এক query-তে বের হয়।
    ref: structured-logging
  - q: 'Correlation ID কী?'
    a: 'একটা request-এর ট্র্যাকিং নম্বর, যা সব সার্ভিস, queue, worker আর প্রতিটা log লাইনে একই থাকে।'
    more: |
      কুরিয়ারের পার্সেলের ট্র্যাকিং নম্বরের মতো: যেখানেই স্ক্যান হোক, একই নম্বর ওঠে। Log খোঁজার টুলে নম্বরটা লিখলে API, payment সার্ভিস আর worker — সবার লাইন সময়ের ক্রমে এক সারিতে চলে আসে। তখন একটা request-এর পুরো গল্প পড়া যায়।
    ref: correlation-id
  - q: 'Correlation ID কোথায় তৈরি হয়, আর request-এ আগে থেকেই থাকলে কী করবে?'
    a: 'সিস্টেমে ঢোকার প্রথম দরজায় তৈরি হয়। আগের সার্ভিস header-এ পাঠিয়ে থাকলে নতুন না বানিয়ে, যাচাই করে সেটাই ব্যবহার করো।'
    more: |
      প্রতিটা সার্ভিস নিজের মতো নতুন নম্বর বানালে শিকল ছিঁড়ে যায় — এক সার্ভিসের log আরেকটার সাথে মেলানো যায় না। তবে বাইরে থেকে আসা মান অন্ধভাবে নিয়ো না: আকার ঠিক আছে কি না (যেমন UUID) দেখে নাও, নইলে কেউ log-এ আজেবাজে লেখা ঢুকিয়ে দিতে পারে।
    ref: correlation-id
  - q: 'Monolog processor কী কাজ করে?'
    a: 'প্রতিটা log রেকর্ড লেখার ঠিক আগে চলে, আর রেকর্ডে বাড়তি তথ্য (যেমন correlation ID, user ID) জুড়ে দেয়।'
    more: |
      Symfony-তে একটা class-এ `#[AsMonologProcessor]` বসালে সেটা processor হয়ে যায়। সে `LogRecord` হাতে পায় আর তার `extra` অংশে তথ্য বসায়। লাভ হলো, log লেখার শত শত জায়গায় কিছুই বদলাতে হয় না — এক জায়গায় লিখে সব লাইনে তথ্যটা চলে আসে।
    ref: correlation-id
  - q: 'Queue পার হয়ে correlation ID কীভাবে worker-এ পৌঁছায়?'
    a: 'Message-এর সাথে একটা stamp হিসেবে যায়; worker-এর দিকে Messenger middleware stamp থেকে নম্বরটা তুলে চলতি নম্বর বানায়।'
    more: |
      Worker আলাদা process, অনেক সময় আলাদা সার্ভার — request-এর memory-তে থাকা নম্বর সে দেখতে পায় না। তাই dispatch-এর সময় middleware নম্বরটা stamp করে message-এর সাথে পাঠায়। ওপাশে একই middleware `ReceivedStamp` দেখে বোঝে এটা worker, আর নম্বরটা আবার বসিয়ে নেয়।
    ref: id-across-boundaries
  - q: 'Trace আর span-এর পার্থক্য কী?'
    a: 'Trace একটা request-এর পুরো যাত্রা। Span সেই যাত্রার একটা ধাপ — যার শুরুর সময়, মেয়াদ আর parent span আছে।'
    more: |
      একটা checkout request-এর trace-এ থাকতে পারে পাঁচটা span: পুরো request, cart পড়ার query, payment API call, অর্ডার লেখা আর queue-তে message। Span-গুলো পাশাপাশি সাজালে দেখা যায় কোনটা সবচেয়ে লম্বা — সেটাই ধীরগতির কারণ। Trace ID সার্ভিস থেকে সার্ভিসে যায় `traceparent` header-এ।
    ref: traces-and-spans
  - q: 'Log, metric আর trace — কোনটা কোন প্রশ্নের উত্তর দেয়?'
    a: 'Log: ঠিক কী ঘটল। Metric: কতবার ও কত দ্রুত ঘটছে। Trace: একটা request-এর সময় কোথায় গেল।'
    more: |
      তিনটা একে অপরের বদলি নয়। Metric দেখে বোঝা যায় সমস্যা আছে ("error বেড়েছে")। Trace দেখায় সমস্যাটা কোন ধাপে। Log বলে ওই ধাপে ঠিক কী হয়েছিল। তিনটাতেই একই correlation বা trace ID থাকলে একটা থেকে আরেকটায় লাফ দেওয়া যায়। বিস্তারিত: [[observability/metrics-slos|metric ও SLO]]।
    ref: traces-and-spans
  - q: 'কোন জিনিসগুলো কখনো log-এ লেখা যাবে না?'
    a: 'পাসওয়ার্ড, token, API key, কার্ড নম্বর আর অপ্রয়োজনীয় ব্যক্তিগত তথ্য।'
    more: |
      Log অনেক মানুষ আর অনেক টুলের হাতে যায়, মাসের পর মাস জমা থাকে, আর সাধারণত ডেটাবেসের মতো কড়া পাহারায় থাকে না। তাই log-এ secret গেলে সেটা ফাঁস হওয়ারই সমান। পরিচয়ের জন্য user_id বা order_id-ই যথেষ্ট — ইমেইল বা ফোন নম্বর লাগে না।
    ref: structured-logging

quiz:
  - q: 'এই log লাইনে কী কী সমস্যা আছে?'
    lang: php
    code: |
      $this->logger->info(
          "User {$user->getEmail()} paid {$amount} for order {$order->getId()}"
      );
    hint: 'মেশিন কি এই বাক্য থেকে অর্ডার নম্বর আলাদা করতে পারবে? আর log-এ কার কী তথ্য যাচ্ছে?'
    options:
      - text: 'বার্তা প্রতিবার আলাদা, তাই ঘটনাটা group করা বা গোনা কঠিন'
        correct: true
        why: 'বার্তার ভেতরে variable থাকায় প্রতিটা লাইন মেশিনের চোখে আলাদা বার্তা। স্থির বার্তা (order.paid) হলে গোনা যেত।'
      - text: 'order ID আলাদা ঘরে নেই, তাই filter করতে regex লাগবে'
        correct: true
        why: 'তথ্যটা বাক্যের ভেতরে গাঁথা। context-এ order_id থাকলে সরাসরি filter করা যেত।'
      - text: 'ক্রেতার ইমেইল (ব্যক্তিগত তথ্য) log-এ চলে যাচ্ছে'
        correct: true
        why: 'পরিচয়ের জন্য user_id-ই যথেষ্ট। ইমেইল log-এ গেলে সেটা অনেকের চোখে পড়ে আর বহুদিন জমা থাকে।'
      - text: 'info level ভুল — সব পেমেন্টের log error level-এ হওয়া উচিত'
        correct: false
        why: 'সফল পেমেন্ট স্বাভাবিক ঘটনা, তাই info-ই ঠিক। error শুধু তখন, যখন কিছু ভেঙেছে আর কারো দেখা দরকার।'
    ref: structured-logging
  - q: 'সুমির অ্যাপে API-র সব log-এ correlation ID আছে। কিন্তু ইমেইল পাঠানো worker-এর log-এ নেই, তাই "ইমেইল কেন যায়নি" খুঁজে পাওয়া যাচ্ছে না। ঠিক সমাধান কোনটা?'
    hint: 'Worker আলাদা process। Request-এর memory-তে থাকা নম্বর সে কীভাবে জানবে?'
    options:
      - text: 'Worker-এ প্রতিটা message-এর জন্য একটা নতুন ID বানানো'
        correct: false
        why: 'নতুন ID দিয়ে worker-এর log আলাদা করা যাবে, কিন্তু API-র log-এর সাথে জোড়া লাগবে না — গল্পটা ছেঁড়াই থাকবে।'
      - text: 'dispatch-এর সময় ID-টা stamp হিসেবে message-এ জুড়ে, worker-এ সেটা তুলে নেওয়া'
        correct: true
        why: 'নম্বরটা message-এর সাথেই queue পার হয়। একটা Messenger middleware দুই দিকের কাজই করে।'
      - text: 'সময় (timestamp) মিলিয়ে API আর worker-এর লাইন জোড়া দেওয়া'
        correct: false
        why: 'একই সেকেন্ডে শত শত message চলে, আর worker অনেক পরেও কাজ করতে পারে। সময় দিয়ে নিশ্চিতভাবে মেলানো যায় না।'
      - text: 'Worker-এর log level debug করে দেওয়া'
        correct: false
        why: 'লাইন বাড়বে, কিন্তু কোন লাইন কোন request-এর — সেই পরিচয় তবুও থাকবে না।'
    ref: id-across-boundaries
  - q: 'রিয়াদের টিম প্রতিটা logger call-এ হাতে correlation_id দিচ্ছে, আর মাঝে মাঝে ভুলে যাচ্ছে। সবচেয়ে ভালো উপায় কোনটা?'
    hint: 'কোন জিনিসটা প্রতিটা log রেকর্ড লেখার ঠিক আগে নিজে থেকে চলে?'
    options:
      - text: 'বার্তার শুরুতে ID-টা string হিসেবে জুড়ে দেওয়া'
        correct: false
        why: 'তাতে বার্তা আর স্থির থাকে না, ID-ও আলাদা ঘরে যায় না — filter আর group দুটোই কঠিন হয়।'
      - text: 'একটা Monolog processor লেখা, যা সব রেকর্ডে নম্বরটা বসায়'
        correct: true
        why: 'এক জায়গায় লেখা, সব channel-এর সব লাইনে কাজ করে — কারো মনে রাখার দরকার পড়ে না।'
      - text: 'শুধু error log-এ ID দেওয়া, বাকিগুলোতে দরকার নেই'
        correct: false
        why: 'error-এর আগে কী কী ঘটেছিল, সেই গল্প থাকে info লাইনে। সেগুলোতে নম্বর না থাকলে গল্পটা মেলানো যায় না।'
      - text: 'Code review-এ কড়া নিয়ম করা যে কেউ ভুলতে পারবে না'
        correct: false
        why: 'মানুষ ভুলবেই। যা যন্ত্র দিয়ে নিশ্চিত করা যায়, তা মানুষের স্মৃতির ওপর ছাড়া ঠিক নয়।'
    ref: correlation-id
  - q: 'API gateway থেকে আসা request-এ আগে থেকেই X-Correlation-Id header আছে। তোমার সার্ভিসের কী করা উচিত?'
    hint: 'পার্সেল এক হাব থেকে আরেক হাবে গেলে কি নতুন ট্র্যাকিং নম্বর দেওয়া হয়?'
    options:
      - text: 'মানটা ঠিক আকারের কি না যাচাই করে সেটাই ব্যবহার করা'
        correct: true
        why: 'একই নম্বর চললে gateway আর তোমার সার্ভিসের log এক সারিতে মেলে; যাচাই করলে আজেবাজে মান log-এ ঢোকে না।'
      - text: 'সবসময় নতুন ID বানানো, যাতে নিজের সার্ভিসের ID নিজের হাতে থাকে'
        correct: false
        why: 'তাহলে শিকল ছিঁড়ে যায় — gateway-র log আর তোমার log আর এক নম্বরে খোঁজা যায় না।'
      - text: 'যা এসেছে হুবহু তা-ই, কোনো যাচাই ছাড়া log-এ বসানো'
        correct: false
        why: 'Header ব্যবহারকারীও পাঠাতে পারে। যাচাই না করলে বিশাল বা বানোয়াট লেখা log-এ ঢুকে যায় (log injection)।'
    ref: correlation-id
  - q: 'Checkout মাঝে মাঝে ৪ সেকেন্ড নেয়। পথে আছে API, ডেটাবেস, payment সার্ভিস আর queue; কোথাও error নেই। সময়টা কোথায় যাচ্ছে, তা সবচেয়ে সরাসরি কী দেখাবে?'
    hint: 'কোন জিনিসটা প্রতিটা ধাপের মেয়াদ আলাদা করে মাপে?'
    options:
      - text: 'error log'
        correct: false
        why: 'ধীর হওয়া মানে error নয়। কিছু ভাঙেনি বলে error log-এ কিছুই থাকবে না।'
      - text: 'সার্ভারের CPU গ্রাফ'
        correct: false
        why: 'বাইরের সার্ভিসের জবাবের অপেক্ষায় বসে থাকলে CPU খরচই হয় না। গ্রাফ শান্ত থাকবে, অথচ request ধীর।'
      - text: 'ধীর request-টার trace — span ধরে ধরে সময়'
        correct: true
        why: 'প্রতিটা span-এর মেয়াদ পাশাপাশি দেখালে সবচেয়ে লম্বা ধাপটা সাথে সাথে চোখে পড়ে।'
      - text: 'কোডের সব জায়গায় আরও debug log যোগ করে আবার deploy'
        correct: false
        why: 'শেষ পর্যন্ত হয়তো ধরা পড়বে, কিন্তু ধীর ও আন্দাজনির্ভর। Trace এই মাপটাই তৈরি অবস্থায় দেয়।'
    ref: traces-and-spans
  - q: 'নিচের কোনগুলো log-এর context-এ রাখা নিরাপদ?'
    hint: 'কোনগুলো ফাঁস হলে কেউ টাকা বা account হাতিয়ে নিতে পারে?'
    options:
      - text: 'order_id আর user_id'
        correct: true
        why: 'এগুলো ভেতরের পরিচয়-নম্বর; এগুলো ছাড়া খোঁজাই সম্ভব নয়, আর এগুলো দিয়ে বাইরের কেউ কিছু করতে পারে না।'
      - text: 'Payment gateway-র নাম আর error code'
        correct: true
        why: 'সমস্যা বুঝতে এটাই লাগে, আর এতে গোপন কিছু নেই।'
      - text: 'Authorization header-এর token'
        correct: false
        why: 'Token হাতে পেলে যে কেউ ওই ব্যবহারকারী সেজে API ডাকতে পারে। Log পড়তে পারা প্রত্যেকে তখন সেই ক্ষমতা পেয়ে যায়।'
      - text: 'পুরো কার্ড নম্বর'
        correct: false
        why: 'কার্ডের তথ্য log-এ রাখা PCI DSS-এর সরাসরি লঙ্ঘন, আর ফাঁস হলে আর্থিক ক্ষতি।'
      - text: 'ব্যবহারকারীর দেওয়া পাসওয়ার্ড'
        correct: false
        why: 'পাসওয়ার্ড কোথাও সাধারণ লেখায় থাকার কথা নয় — ডেটাবেসেও না, log-এ তো নয়ই।'
    ref: structured-logging
  - q: 'প্রতি সেকেন্ডে ২,০০০ request আসে। প্রতিটার পুরো trace জমিয়ে রাখলে সমস্যা কী, আর প্রচলিত সমাধান কী?'
    hint: 'ধীর request খুঁজতে কি সত্যিই সবগুলো trace লাগে?'
    options:
      - text: 'কোনো সমস্যা নেই — সব trace রাখাই নিয়ম'
        correct: false
        why: 'প্রতিটা request-এর সব span পাঠানো ও জমানো মানে বিপুল ডেটা, খরচ আর অ্যাপের ওপর বাড়তি চাপ।'
      - text: 'খরচ আর চাপ অনেক বেশি; তাই sampling করে একটা অংশের trace রাখা হয়'
        correct: true
        why: 'যেমন ১০% রাখলেও ধীর আর ভাঙা request-এর যথেষ্ট নমুনা মেলে, অথচ খরচ দশ ভাগের এক ভাগ।'
      - text: 'Trace বাদ দিয়ে শুধু log রাখা উচিত'
        correct: false
        why: 'Log বলে কী ঘটল, কিন্তু কোন ধাপে কত সময় গেল তা দেখায় না। দুটোর কাজ আলাদা।'
    ref: traces-and-spans
