slides:
  - slug: more-waiters-same-queue
    title: 'সার্ভার দ্বিগুণ হলো, গতি বাড়ল না'
    kind: story
    tldr: 'কোথায় আটকাচ্ছে তা না মেপে সার্ভার বাড়ালে টাকা যায়, গতি আসে না — ধীর ধাপটা হয়তো অন্য কোথাও।'
    keywords: ['bottleneck', 'scaling', 'slow site', 'বটলনেক', 'ধীর সাইট', 'সার্ভার বাড়ানো']
    blocks:
      - type: metaphor
        icon: shop
        title: 'বিরিয়ানির হোটেলের লম্বা লাইন'
        body: |
          দুপুরে হোটেলের সামনে লম্বা লাইন দেখে মালিক ওয়েটার ৫ জন থেকে ১০ জন করলেন। লাইন একটুও কমল না — সবাই আটকে ছিল একটাই ক্যাশ কাউন্টারে, যেখানে একজন মানুষ বিল কাটেন।
      - type: text
        body: |
          রাতুলের শপ অ্যাপেও তাই হলো। সেলের দিনে সাইট ধীর দেখে টিম অ্যাপ সার্ভার ৪টা থেকে ৮টা করল, তবু checkout ৩ সেকেন্ডই রইল — কারণ সময়টা যাচ্ছিল ডেটাবেসের একটা ধীর query-তে। যে ধাপে সবাই আটকে থাকে, তার নাম **bottleneck** (বোতলের সরু গলা)।
      - type: visual
        kind: bars
        caption: 'checkout-এর ৩ সেকেন্ড কোন ধাপে কত গেল'
        items:
          - {label: 'নেটওয়ার্ক ও nginx', value: 50, display: '50ms', tone: muted, tip: 'request সার্ভার পর্যন্ত পৌঁছানো আর উত্তর ফেরার সময়। এখানে লাভ করার মতো কিছু নেই।'}
          - {label: 'PHP কোড', value: 150, display: '150ms', tip: 'অ্যাপ সার্ভারের নিজের কাজ। সার্ভার দ্বিগুণ করে টিম শুধু এই অংশটাকেই সাহায্য করেছিল — মোট সময়ের মাত্র ৫%।'}
          - {label: 'ডেটাবেস query', value: 2550, display: '2550ms', tone: bad, tip: 'এটাই ক্যাশ কাউন্টার। index ছাড়া একটা query পুরো টেবিল ঘেঁটে দেখছিল; সময়ের ৮৫% এখানেই।'}
          - {label: 'Payment API', value: 250, display: '250ms', tip: 'বাইরের সার্ভিসের উত্তরের অপেক্ষা। তোমার সার্ভার যত বাড়াও, এই সময় কমবে না।'}
      - type: quote
        body: 'আগে মাপো, তারপর বাড়াও। যেখানে আটকায়নি, সেখানে শক্তি ঢেলে লাভ নেই।'
    aside:
      - type: problem
        body: 'সাইট ধীর হলে প্রথম প্রতিক্রিয়া হয় "আরও সার্ভার দাও"। এই ধাপ শেখায় কোন সংখ্যাগুলো মাপলে বোঝা যায় আসলে কোথায় আটকাচ্ছে — যাতে ঠিক জায়গায় হাত দাও।'
      - type: terms
        items:
          - {term: 'Bottleneck', meaning: 'সবচেয়ে ধীর ধাপ — পুরো ব্যবস্থার গতি এটাই ঠিক করে দেয়।'}
          - {term: 'Scaling', meaning: 'বাড়তি চাপ সামলাতে সিস্টেমের ক্ষমতা বাড়ানো।'}
      - type: pitfalls
        items:
          - 'ডেটাবেস আটকে থাকা অবস্থায় অ্যাপ সার্ভার বাড়ালে connection আর query আরও বাড়ে — অবস্থা উল্টো খারাপ হয়।'
    check:
      q: 'ওয়েটার দ্বিগুণ করেও হোটেলের লাইন কমল না কেন?'
      a: 'কারণ সবাই আটকে ছিল ক্যাশ কাউন্টারে, ওয়েটারে নয়। সবচেয়ে ধীর ধাপটা (bottleneck) দ্রুত না করলে অন্য কোথাও শক্তি বাড়িয়ে মোট গতি বাড়ে না।'

  - slug: load-throughput-latency
    title: 'তিনটা সংখ্যা: load, throughput, latency'
    kind: concept
    tldr: 'Load = কত request আসছে, throughput = কত শেষ হচ্ছে, latency = একটায় কত সময় লাগছে। ক্ষমতার কাছাকাছি গেলে latency লাফিয়ে বাড়ে।'
    keywords: ['load', 'throughput', 'latency', 'RPS', 'capacity', 'utilization', 'লোড', 'অপেক্ষার সময়']
    blocks:
      - type: metaphor
        icon: shop
        title: 'হোটেলের দরজায় দাঁড়িয়ে গোনা'
        body: |
          মিনিটে কতজন হোটেলে ঢুকছে — সেটা **load**। মিনিটে কতজন খেয়ে, বিল দিয়ে বেরোচ্ছে — সেটা **throughput**। আর একজনের ঢোকা থেকে বেরোনো পর্যন্ত সময় হলো **latency**। ক্যাশ কাউন্টার মিনিটে ১০ জনের বেশি সামলাতে না পারলে ১২ জন করে ঢুকলেও বেরোবে ১০ জনই; বাকিরা লাইনে জমবে, আর সবার অপেক্ষা বাড়তেই থাকবে।
      - type: visual
        kind: table
        caption: 'তিনটা সংখ্যা — হোটেলে আর অ্যাপে'
        headers: ['', 'হোটেলে', 'অ্যাপে', 'একক']
        rows:
          - cells: ['Load', 'মিনিটে কতজন ঢুকছে', 'সেকেন্ডে কত request আসছে', 'req/s (RPS)']
            tip: 'চাপটা বাইরে থেকে আসে — এটা তোমার হাতে নেই। ঈদের সেলে load নিজে থেকেই দশ গুণ হয়ে যায়।'
          - cells: ['Throughput', 'মিনিটে কতজন বেরোচ্ছে', 'সেকেন্ডে কত request শেষ হচ্ছে', 'req/s']
            tip: 'সিস্টেম আসলে যতটা কাজ শেষ করতে পারছে। এর একটা সর্বোচ্চ সীমা আছে, যাকে বলে capacity।'
          - cells: ['Latency', 'একজনের মোট সময়', 'একটা request-এর উত্তর পেতে সময়', 'ms']
            tip: 'লাইনে দাঁড়ানোর সময় আর আসল কাজের সময় — দুটো মিলিয়ে। ব্যবহারকারী শুধু এই সংখ্যাটাই টের পায়।'
      - type: visual
        kind: bars
        caption: 'সার্ভার যত ব্যস্ত, latency তত লাফায় (প্রতিটা কাজ 10ms, সরল queue মডেল)'
        items:
          - {label: '৫০% ব্যস্ত', value: 20, display: '20ms', tone: good, tip: 'অর্ধেক সময় সার্ভার ফাঁকা থাকে, তাই প্রায় কাউকে লাইনে দাঁড়াতে হয় না।'}
          - {label: '৮০% ব্যস্ত', value: 50, display: '50ms', tip: 'কাজের সময় 10ms-ই আছে, কিন্তু লাইনে অপেক্ষা যোগ হয়ে মোট সময় পাঁচ গুণ।'}
          - {label: '৯০% ব্যস্ত', value: 100, display: '100ms', tone: warn, tip: 'মাত্র ১০% বাড়তি চাপে latency দ্বিগুণ হয়ে গেল — এখান থেকেই বিপদের শুরু।'}
          - {label: '৯৫% ব্যস্ত', value: 200, display: '200ms', tone: bad, tip: 'আরও ৫% চাপে আবার দ্বিগুণ। ১০০%-এ পৌঁছালে লাইন আর কখনো শেষ হয় না।'}
      - type: quote
        body: 'সার্ভারকে ১০০% ব্যস্ত রাখার পরিকল্পনা কোরো না। ৭০–৮০% পেরোলেই লাইন জমে, latency লাফায়।'
    aside:
      - type: remember
        body: 'Load ঢোকে, throughput বেরোয়, latency হলো মাঝখানের অপেক্ষা।'
      - type: terms
        items:
          - {term: 'RPS / QPS', meaning: 'Requests (বা queries) per second — load আর throughput মাপার একক।'}
          - {term: 'Capacity', meaning: 'সিস্টেম সর্বোচ্চ যত throughput দিতে পারে।'}
          - {term: 'Utilization', meaning: 'কোনো resource তার ক্ষমতার কত শতাংশ ব্যস্ত আছে।'}
      - type: refs
        items:
          - {to: 'resilience/load-shedding', label: 'ক্ষমতার বেশি load এলে কী করবে'}
          - {to: 'thinking/estimation', label: 'খাতার পাতায় QPS-এর হিসাব'}
    check:
      q: 'load বাড়ছে, throughput এক জায়গায় আটকে আছে, আর latency বাড়ছে — এর মানে কী?'
      a: 'সিস্টেম তার capacity-তে পৌঁছে গেছে। বাড়তি request শেষ হচ্ছে না, লাইনে জমছে — তাই প্রত্যেকের অপেক্ষা বাড়ছে।'

  - slug: percentiles-tail-latency
    title: 'গড় মিথ্যা বলে: p50, p95, p99'
    kind: concept
    tldr: 'গড় latency ধীর request-গুলোকে লুকিয়ে ফেলে। p95 আর p99 দেখায় সবচেয়ে ভোগা ব্যবহারকারীরা কত অপেক্ষা করছে।'
    keywords: ['percentile', 'p50', 'p95', 'p99', 'tail latency', 'average', 'গড়', 'পার্সেন্টাইল']
    blocks:
      - type: metaphor
        icon: stopwatch
        title: '৯৫ জন খুশি, ৫ জন রেগে আগুন'
        body: |
          হোটেলের ১০০ জন খদ্দেরের ৯৫ জন খাবার পেল ১০ মিনিটে, আর ৫ জন পেল ১ ঘণ্টা পরে। গড় দাঁড়ায় সাড়ে ১২ মিনিট — শুনতে ভালো, অথচ ৫ জন রেগে বেরিয়ে গেছে। তাই সবাইকে সময় অনুযায়ী সাজিয়ে দেখতে হয়: **p50** মানে অর্ধেক খদ্দের এর চেয়ে কম সময়ে পেয়েছে, **p95** মানে ১০০ জনে ৯৫ জন, **p99** মানে ৯৯ জন। শেষের ওই ধীর অংশটুকুর নাম **tail latency**।
      - type: visual
        kind: bars
        caption: 'একই checkout endpoint, গত এক ঘণ্টা — গড় বনাম percentile'
        items:
          - {label: 'p50 (median)', value: 120, display: '120ms', tone: good, tip: 'অর্ধেক request এর চেয়ে দ্রুত শেষ হয়েছে। "সাধারণ" ব্যবহারকারীর অভিজ্ঞতা এটাই।'}
          - {label: 'গড় (average)', value: 310, display: '310ms', tone: muted, tip: 'অল্প কয়েকটা খুব ধীর request গড়টাকে টেনে তুলেছে। এই সময়ে আসলে প্রায় কেউই উত্তর পায়নি — সংখ্যাটা কারও অভিজ্ঞতা নয়।'}
          - {label: 'p95', value: 900, display: '900ms', tone: warn, tip: 'প্রতি ২০ request-এর ১টা এর চেয়েও ধীর। SLO সাধারণত এই সংখ্যা দিয়ে লেখা হয়।'}
          - {label: 'p99', value: 4200, display: '4200ms', tone: bad, tip: 'প্রতি ১০০ request-এর ১টা ৪ সেকেন্ডের বেশি নিচ্ছে। গড় দেখে এটা কখনো ধরা পড়ত না।'}
      - type: text
        body: |
          p99 শুনতে বিরল মনে হলেও বিরল নয়। একটা পাতা বানাতে ভেতরে ২০টা call লাগলে প্রায় ১৮% পাতায় — মানে প্রতি ৫–৬ জনে ১ জনের বেলায় — অন্তত একটা call p99-এর মতো ধীর হয়।
      - type: code
        lang: sql
        file: 'request_log থেকে percentile (PostgreSQL)'
        code: |
          SELECT
              round(avg(duration_ms))                                    AS avg_ms,
              percentile_cont(0.50) WITHIN GROUP (ORDER BY duration_ms)  AS p50,
              percentile_cont(0.95) WITHIN GROUP (ORDER BY duration_ms)  AS p95,
              percentile_cont(0.99) WITHIN GROUP (ORDER BY duration_ms)  AS p99
          FROM request_log
          WHERE route = 'checkout'
            AND created_at > now() - interval '1 hour';
        marks:
          - {line: 2, tip: 'গড় শুধু তুলনার জন্য রাখা হয়েছে। সিদ্ধান্ত নাও নিচের তিন লাইনের সংখ্যা দেখে।'}
          - {line: 5, tip: 'সব সারি duration_ms অনুযায়ী সাজিয়ে ৯৯% অবস্থানের মানটা তুলে আনে — এটাই p99।'}
          - {line: 7, tip: 'প্রতিটা endpoint আলাদা করে মাপো। সব route মিশিয়ে ফেললে ধীর endpoint দ্রুতগুলোর ভিড়ে হারিয়ে যায়।'}
      - type: quote
        body: 'গড় দিয়ে latency মেপো না। p50 বলে সাধারণ অভিজ্ঞতা, p99 বলে সবচেয়ে খারাপটা — দুটোই দেখো।'
    aside:
      - type: terms
        items:
          - {term: 'p50 (median)', meaning: 'মাঝের মান: অর্ধেক request এর চেয়ে দ্রুত, অর্ধেক ধীর।'}
          - {term: 'p99', meaning: '৯৯% request এর চেয়ে দ্রুত; বাকি ১% এর চেয়েও ধীর।'}
          - {term: 'Tail latency', meaning: 'সবচেয়ে ধীর অল্প কিছু request-এর latency (p99, p99.9)।'}
      - type: tips
        items:
          - 'লক্ষ্য লেখো percentile দিয়ে: "checkout-এর p95 300ms-এর নিচে" — "গড়ে দ্রুত" কোনো লক্ষ্য নয়।'
          - 'আলাদা সার্ভারের p99 যোগ বা গড় করা যায় না; সব সার্ভারের histogram জুড়ে তারপর হিসাব করতে হয়।'
          - 'সবচেয়ে বেশি কেনাকাটা করা ক্রেতারাই বেশি request পাঠায়, তাই tail-এ তারাই বেশি পড়ে।'
      - type: refs
        items:
          - {to: 'observability/metrics-slos', label: 'Metric, SLI, SLO ও error budget'}
    check:
      q: 'গড় latency 310ms দেখে "সব ঠিক আছে" বলা ভুল কেন?'
      a: 'গড় ধীর request-গুলোকে দ্রুতগুলোর আড়ালে লুকায়। এখানে p99 ৪ সেকেন্ডের বেশি — প্রতি ১০০ request-এর ১টা খুব ধীর, আর গড় দেখে তা বোঝার উপায় নেই।'

  - slug: littles-law
    title: 'Little''s Law: ভেতরে একসাথে কতজন?'
    kind: concept
    tldr: 'একসাথে চলমান request = প্রতি সেকেন্ডে আসা request × গড় latency। এই এক গুণ দিয়েই worker আর connection-এর সংখ্যা ঠিক করা যায়।'
    keywords: ['Little''s Law', 'concurrency', 'php-fpm', 'max_children', 'worker', 'একসাথে কতজন', 'লিটলের সূত্র']
    blocks:
      - type: metaphor
        icon: users
        title: 'কয়টা চেয়ার লাগবে?'
        body: |
          হোটেলে মিনিটে ২ জন ঢোকে, আর প্রত্যেকে গড়ে ৩০ মিনিট থাকে। তাহলে যেকোনো মুহূর্তে ভেতরে থাকে ২ × ৩০ = ৬০ জন, অর্থাৎ ৬০টা চেয়ার লাগবে। রান্না ধীর হয়ে থাকার সময় ৬০ মিনিট হলে একই খদ্দেরের জন্য লাগবে ১২০টা চেয়ার। এই গুণটাই **Little's Law**: L = λ × W।
      - type: visual
        kind: steps
        caption: 'অ্যাপের জন্য একই হিসাব — কয়টা PHP-FPM worker লাগবে'
        steps:
          - {title: '১. Load মাপো (λ)', body: 'ব্যস্ত সময়ে সেকেন্ডে 200 request আসে।', tip: 'λ (ল্যাম্বডা) হলো আসার হার। nginx access log বা metric থেকে ব্যস্ততম সময়ের সংখ্যাটা নাও, সারা দিনের গড় নয়।'}
          - {title: '২. গড় latency মাপো (W)', body: 'একটা request গড়ে 0.25 সেকেন্ড নেয়।', tip: 'W হলো একটা request সিস্টেমের ভেতরে গড়ে যত সময় থাকে। এই সূত্রে গড়টাই লাগে, percentile নয়।'}
          - {title: '৩. গুণ করো (L)', body: '200 × 0.25 = 50টা request একসাথে চলমান।', tone: accent, tip: 'L হলো একই মুহূর্তে ভেতরে থাকা request। PHP-FPM-এ প্রতিটা চলমান request একটা worker দখল করে, তাই অন্তত 50টা worker চাই।'}
          - {title: '৪. বাড়তি রাখো', body: '২০% বাড়তি ধরে max_children = 60।', tip: 'হঠাৎ ঢেউ সামলাতে কিছু ফাঁকা worker রাখতে হয়। তবে RAM-এ ধরে কি না মিলিয়ে নাও: 60 × 60MB ≈ 3.6GB।'}
          - {title: '৫. ধীর দিনের কথা ভাবো', body: 'W যদি 1 সেকেন্ড হয়, L = 200 — চার গুণ worker।', tone: bad, tip: 'load একটুও বাড়েনি, শুধু ডেটাবেস ধীর হয়েছে। তবু সব worker আটকে গিয়ে নতুন request লাইনে পড়ে — ধীর query এভাবেই পুরো সাইট থামায়।'}
      - type: code
        lang: ini
        file: '/etc/php/8.3/fpm/pool.d/www.conf'
        code: |
          ; L = 200 req/s × 0.25s = 50 চলমান request  →  ২০% বাড়তি রেখে 60
          pm = static
          pm.max_children = 60

          ; "active processes" আর "listen queue" দেখার পাতা
          pm.status_path = /fpm-status

          ; আটকে থাকা request যেন চিরকাল একটা worker ধরে না রাখে
          request_terminate_timeout = 30s
        marks:
          - {line: 3, tip: 'একসাথে সর্বোচ্চ ৬০টা request চলবে। ৬১ নম্বরটা লাইনে (listen queue) অপেক্ষা করবে।'}
          - {line: 6, tip: 'listen queue শূন্যের বেশি থাকলে বুঝবে worker কম পড়ছে — অথবা latency বেড়ে গেছে।'}
    aside:
      - type: remember
        body: 'ভেতরে কতজন = কত দ্রুত আসছে × কতক্ষণ থাকছে।'
      - type: terms
        items:
          - {term: 'λ (arrival rate)', meaning: 'প্রতি সেকেন্ডে কতটা request আসছে।'}
          - {term: 'W', meaning: 'একটা request সিস্টেমে গড়ে কতক্ষণ থাকে (লাইনের অপেক্ষাসহ)।'}
          - {term: 'L (concurrency)', meaning: 'একই মুহূর্তে সিস্টেমের ভেতরে থাকা request-এর গড় সংখ্যা।'}
      - type: tips
        items:
          - 'একই সূত্র ডেটাবেস connection pool, queue worker, এমনকি কল সেন্টারের লোকসংখ্যা ঠিক করতেও খাটে।'
          - 'worker বাড়ানোর আগে দেখো W কমানো যায় কি না — latency অর্ধেক হলে দরকারি worker-ও অর্ধেক।'
    check:
      q: 'সেকেন্ডে ১০০ request আসে, গড় latency 0.5 সেকেন্ড। একসাথে কয়টা request চলমান থাকে?'
      a: '১০০ × ০.৫ = ৫০টা। তাই অন্তত ৫০টা worker লাগবে, সাথে কিছু বাড়তি। latency বেড়ে ১ সেকেন্ড হলে লাগবে ১০০টা।'

  - slug: find-the-bottleneck
    title: 'স্কেল করার আগে bottleneck খুঁজে বের করো'
    kind: howto
    tldr: 'একটা request-এর সময় কোন ধাপে কত যাচ্ছে তা মাপো। যে ধাপ সবচেয়ে বেশি সময় নেয় বা সবার আগে ভরে যায়, আগে সেটাই ঠিক করো।'
    keywords: ['bottleneck', 'profiling', 'Stopwatch', 'USE method', 'saturation', 'বটলনেক খোঁজা', 'মাপা']
    blocks:
      - type: text
        body: |
          হোটেল মালিককে শুধু দেখতে হতো, লাইনটা ঠিক কোথায় জমছে। অ্যাপে সেই দেখার কাজটা করে মাপজোখ: ধীর request-এর প্রতিটা ধাপের সময় আলাদা করে লেখো, আর প্রতিটা resource কতটা ভরে আছে তা দেখো।
      - type: points
        title: 'খোঁজার চার ধাপ'
        style: number
        items:
          - 'ধীর endpoint বেছে নাও p95/p99 দেখে — অনুমানে নয়।'
          - 'তার সময় ভাগ করো: PHP কোড, ডেটাবেস query, বাইরের API, লাইনের অপেক্ষা।'
          - 'প্রতিটা resource-এ তিনটা জিনিস দেখো: কতটা ব্যস্ত, লাইন জমছে কি না, error আসছে কি না।'
          - 'সবচেয়ে বড় অংশটা ঠিক করো, তারপর আবার মাপো — bottleneck এবার অন্য জায়গায় সরে যাবে।'
      - type: code
        lang: php
        file: 'src/Checkout/CheckoutService.php'
        variant: good
        code: |
          final class CheckoutService
          {
              public function __construct(
                  private readonly StockReserver $stock,
                  private readonly PaymentGateway $gateway,
                  private readonly Stopwatch $stopwatch,
                  private readonly LoggerInterface $logger,
              ) {
              }

              public function checkout(Cart $cart): Receipt
              {
                  $this->stopwatch->start('stock');
                  $this->stock->reserve($cart);                 // ডেটাবেসের কাজ
                  $stockMs = $this->stopwatch->stop('stock')->getDuration();

                  $this->stopwatch->start('payment');
                  $receipt = $this->gateway->charge($cart);     // বাইরের API
                  $paymentMs = $this->stopwatch->stop('payment')->getDuration();

                  $this->logger->info('checkout.timing', [
                      'stock_ms' => $stockMs,
                      'payment_ms' => $paymentMs,
                  ]);

                  return $receipt;
              }
          }
        marks:
          - {line: 6, tip: 'Symfony-র Stopwatch component — autowire হয়ে আসে। dev-এ এই ধাপগুলো Profiler-এর Performance ট্যাবেও দেখা যায়।'}
          - {line: 15, tip: 'stop() একটা event ফেরত দেয়; getDuration() মিলিসেকেন্ডে সময় বলে। ধাপ ধরে আলাদা সংখ্যা পেলেই বোঝা যায় কে দোষী।'}
          - {line: 21, tip: 'প্রোডাকশনে সংখ্যাগুলো structured log-এ যায়। সেখান থেকে ধাপ ধরে p95/p99 বের করা যায়।'}
      - type: visual
        kind: table
        caption: 'কোন resource ভরে গেলে কী লক্ষণ, আর কোথায় দেখবে'
        headers: ['Resource', 'ভরে যাওয়ার লক্ষণ', 'কোথায় দেখবে']
        rows:
          - cells: ['অ্যাপ সার্ভারের CPU', '৯০%+ ব্যস্ত, load average core-এর বেশি', 'top, সার্ভারের metric']
            tip: 'শুধু এই ক্ষেত্রেই অ্যাপ সার্ভার বাড়ালে সরাসরি লাভ হয়।'
          - cells: ['PHP-FPM worker', 'active = max_children, listen queue > 0', '/fpm-status পাতা']
            tip: 'সব worker ব্যস্ত মানেই CPU কম পড়েছে তা নয় — বেশিরভাগ সময় তারা ধীর ডেটাবেস বা API-র অপেক্ষায় বসে থাকে।'
          - cells: ['ডেটাবেস connection', 'max_connections-এর কাছাকাছি, অনেকে waiting', 'pg_stat_activity']
            tip: 'connection ফুরিয়ে গেলে নতুন request ডেটাবেসে ঢুকতেই পারে না। অ্যাপ সার্ভার বাড়ালে এটা আরও দ্রুত ফুরায়।'
          - cells: ['ডেটাবেস query', 'কিছু query সেকেন্ডের পর সেকেন্ড চলছে', 'slow query log, EXPLAIN ANALYZE']
            tip: 'CRUD অ্যাপে সবচেয়ে বেশি bottleneck এখানেই পাওয়া যায়: index নেই, অথবা N+1 query।'
          - cells: ['বাইরের API', 'timeout আর ধীর উত্তর বাড়ছে', 'নিজের timing log']
            tip: 'এটা তোমার সার্ভার বাড়িয়ে ঠিক হবে না। timeout, cache অথবা কাজটা queue-তে সরানো লাগবে।'
    aside:
      - type: commands
        title: 'হাতের কাছের মাপার যন্ত্র'
        items:
          - {cmd: 'EXPLAIN (ANALYZE, BUFFERS) SELECT ...', desc: 'query আসলে কোথায় সময় খরচ করছে'}
          - {cmd: 'SELECT state, count(*) FROM pg_stat_activity GROUP BY state;', desc: 'কয়টা ডেটাবেস connection ব্যস্ত, কয়টা অলস'}
          - {cmd: 'curl -s http://127.0.0.1/fpm-status', desc: 'active worker আর listen queue'}
          - {cmd: 'top', desc: 'CPU, মেমোরি আর load average'}
      - type: pitfalls
        items:
          - 'লোকাল মেশিনে মেপে প্রোডাকশনের সিদ্ধান্ত নিও না — ১০০ সারির টেবিলে সব query-ই দ্রুত।'
          - 'একসাথে পাঁচটা জিনিস বদলালে বুঝবে না কোনটায় লাভ হলো। একবারে একটা বদলাও, তারপর মাপো।'
      - type: refs
        items:
          - {to: 'hands-on/prototyping-profiling', label: 'Profiling: মেপে তারপর optimise'}
          - {to: 'data/indexing', label: 'Index ও query plan পড়া'}
    check:
      q: 'checkout-এর ৩ সেকেন্ডের ২.৫ সেকেন্ড যায় একটা query-তে। অ্যাপ সার্ভার দ্বিগুণ করলে কী হবে?'
      a: 'latency প্রায় একই থাকবে, বরং ডেটাবেসে চাপ বাড়বে। আগে query-টা ঠিক করতে হবে (index, query-র আকার), তারপর আবার মেপে পরের bottleneck খুঁজতে হবে।'

flashcards:
  - q: 'Load আর throughput-এর পার্থক্য কী?'
    a: 'Load = প্রতি সেকেন্ডে কত request আসছে। Throughput = প্রতি সেকেন্ডে কত request আসলে শেষ হচ্ছে।'
    more: |
      সিস্টেম সুস্থ থাকলে দুটো সমান থাকে — যা আসে, তা-ই শেষ হয়। load যখন capacity ছাড়িয়ে যায়, throughput আর বাড়ে না; বাড়তি request লাইনে জমতে থাকে। তখন throughput-এর গ্রাফ সমান হয়ে যায়, আর latency-র গ্রাফ খাড়া উঠতে থাকে।
    ref: load-throughput-latency
  - q: 'Latency কী?'
    a: 'একটা request পাঠানো থেকে উত্তর পাওয়া পর্যন্ত মোট সময় — লাইনে অপেক্ষা আর আসল কাজ, দুটো মিলিয়ে।'
    more: |
      ব্যবহারকারী শুধু এই সংখ্যাটাই টের পায়। কাজের সময় একই থাকলেও সার্ভার ব্যস্ত হলে লাইনে অপেক্ষা যোগ হয়ে latency বেড়ে যায়। একক সাধারণত মিলিসেকেন্ড (ms)।
    ref: load-throughput-latency
  - q: 'গড় (average) latency দিয়ে সিস্টেমের গতি বিচার করা ভুল কেন?'
    a: 'গড় ধীর request-গুলোকে দ্রুতগুলোর আড়ালে লুকিয়ে ফেলে। গড় ভালো দেখালেও ১–৫% ব্যবহারকারী খুব খারাপ অভিজ্ঞতা পেতে পারে।'
    more: |
      ৯৫ জন ১০ মিনিটে আর ৫ জন ১ ঘণ্টায় খাবার পেলে গড় দাঁড়ায় সাড়ে ১২ মিনিট — অথচ এই সময়ে আসলে কেউই খাবার পায়নি। তাই latency সবসময় percentile দিয়ে দেখা হয়: p50, p95, p99। বিস্তারিত: [[observability/metrics-slos|metric ও SLO]]।
    ref: percentiles-tail-latency
  - q: 'p99 latency 2 সেকেন্ড — এর মানে কী?'
    a: '৯৯% request ২ সেকেন্ডের মধ্যে শেষ হয়েছে; বাকি ১% এর চেয়েও বেশি সময় নিয়েছে।'
    more: |
      সব request সময় অনুযায়ী সাজালে ৯৯% অবস্থানে যে মান পড়ে, সেটাই p99। একইভাবে p50 (median) মাঝের মান, p95 হলো ৯৫% অবস্থানের মান। দিনে ১০ লাখ request এলে ওই ১% মানে ১০ হাজার ধীর request।
    ref: percentiles-tail-latency
  - q: 'Tail latency (p99) বিরল মনে হলেও বড় সমস্যা কেন?'
    a: 'একটা পাতায় অনেকগুলো ভেতরের call থাকলে অন্তত একটা ধীর হওয়ার সম্ভাবনা দ্রুত বাড়ে — ২০টা call-এ প্রায় ১৮%।'
    more: |
      প্রতিটা call ৯৯% ক্ষেত্রে দ্রুত হলে ২০টার সবগুলো দ্রুত হওয়ার সম্ভাবনা ০.৯৯-এর ২০তম ঘাত, মানে প্রায় ৮২%। বাকি ১৮% পাতায় অন্তত একটা call ধীর, আর পাতাটা সেই ধীর call-এর জন্যই আটকে থাকে। তাছাড়া যারা বেশি ব্যবহার করে, তারাই tail-এ বেশি পড়ে।
    ref: percentiles-tail-latency
  - q: 'Little''s Law কী বলে?'
    a: 'L = λ × W: একসাথে চলমান request-এর গড় সংখ্যা = প্রতি সেকেন্ডে আসা request × একটা request-এর গড় সময়।'
    more: |
      হোটেলে মিনিটে ২ জন ঢুকলে আর প্রত্যেকে ৩০ মিনিট থাকলে ভেতরে সবসময় ৬০ জন থাকে। অ্যাপে এই L-ই বলে দেয় কয়টা PHP-FPM worker বা ডেটাবেস connection লাগবে। সূত্রটা খাটে যতক্ষণ সিস্টেম স্থির অবস্থায় আছে, অর্থাৎ যা আসছে তা শেষও হচ্ছে।
    ref: littles-law
  - q: 'সেকেন্ডে 200 request, গড় latency 0.25s — কয়টা PHP-FPM worker লাগবে?'
    a: '200 × 0.25 = 50টা চলমান request, তাই অন্তত 50টা worker; ২০% বাড়তি ধরে প্রায় 60টা।'
    more: |
      PHP-FPM-এ প্রতিটা চলমান request একটা worker দখল করে রাখে। latency যদি বেড়ে 1 সেকেন্ড হয়, একই load-এ লাগবে 200টা worker — তাই ধীর ডেটাবেস খুব দ্রুত সব worker আটকে ফেলে। worker বাড়ানোর আগে RAM-এ ধরে কি না হিসাব করো।
    ref: littles-law
  - q: 'Bottleneck কী, আর অন্য জায়গা দ্রুত করলে কী হয়?'
    a: 'সবচেয়ে ধীর বা সবার আগে ভরে যাওয়া ধাপ। bottleneck ছাড়া অন্য কিছু দ্রুত করলে মোট গতি প্রায় বদলায় না।'
    more: |
      হোটেলে সবাই ক্যাশ কাউন্টারে আটকে থাকলে ওয়েটার বাড়িয়ে লাইন কমে না। অ্যাপে ৩ সেকেন্ডের ২.৫ সেকেন্ড যদি query-তে যায়, অ্যাপ সার্ভার দ্বিগুণ করলে লাভ হয় না, উল্টো ডেটাবেসে চাপ বাড়ে। একটা bottleneck ঠিক করলে পরেরটা অন্য জায়গায় দেখা দেয়, তাই আবার মাপতে হয়।
    ref: find-the-bottleneck
  - q: 'সার্ভার ৮০%-এর বেশি ব্যস্ত হলে latency-র কী হয়?'
    a: 'লাইন জমতে শুরু করে, আর latency সোজা রেখায় নয় — লাফিয়ে লাফিয়ে বাড়ে। ১০০%-এর কাছে গেলে অপেক্ষা সীমাহীন হয়ে যায়।'
    more: |
      সরল queue মডেলে কাজের সময় 10ms হলে ৫০% ব্যস্ততায় latency 20ms, ৯০%-এ 100ms, ৯৫%-এ 200ms। তাই capacity-র হিসাব করার সময় ৭০–৮০% ব্যস্ততাকেই সীমা ধরা হয়, যাতে হঠাৎ ঢেউ সামলানোর জায়গা থাকে।
    ref: load-throughput-latency

quiz:
  - q: 'রাতুলের শপে checkout নিতে ৩ সেকেন্ড লাগে। মেপে দেখা গেল ২.৫ সেকেন্ড যায় একটা ডেটাবেস query-তে, আর অ্যাপ সার্ভারের CPU মাত্র ২০% ব্যস্ত। প্রথম কাজ কোনটা হওয়া উচিত?'
    hint: 'হোটেলে লাইনটা কোথায় জমেছিল — ওয়েটারের কাছে, নাকি ক্যাশ কাউন্টারে?'
    options:
      - text: 'অ্যাপ সার্ভার ৪টা থেকে ৮টা করা'
        correct: false
        why: 'অ্যাপ সার্ভার তো ফাঁকাই বসে আছে (CPU ২০%)। সংখ্যা বাড়ালে ডেটাবেসে connection আর query আরও বাড়বে, latency কমবে না।'
      - text: 'EXPLAIN ANALYZE দিয়ে query-টা দেখে index বা query-র আকার ঠিক করা'
        correct: true
        why: 'সময়ের ৮৫% এই এক জায়গায় যাচ্ছে, তাই এটাই bottleneck। এটা ঠিক করলেই মোট latency সবচেয়ে বেশি কমবে।'
      - text: 'PHP-FPM-এর max_children দ্বিগুণ করা'
        correct: false
        why: 'worker বাড়ালে আরও বেশি request একসাথে একই ধীর query চালাবে — ডেটাবেস আরও ধীর হবে।'
      - text: 'Vue অ্যাপে একটা সুন্দর loading animation যোগ করা'
        correct: false
        why: 'অপেক্ষাটা দেখতে সুন্দর হবে, কিন্তু ৩ সেকেন্ড ৩ সেকেন্ডই থাকবে।'
    ref: find-the-bottleneck
  - q: 'টিম নিচের query চালিয়ে বলল, "checkout দ্রুতই আছে, গড় 280ms।" এই সিদ্ধান্তে ফাঁকটা কোথায়?'
    lang: sql
    code: |
      SELECT round(avg(duration_ms)) AS avg_ms
      FROM request_log
      WHERE route = 'checkout';
      -- avg_ms: 280
    hint: '৯৫ জন ১০ মিনিটে আর ৫ জন ১ ঘণ্টায় খাবার পেলে গড় কত আসে?'
    options:
      - text: 'গড় দেখে বোঝা যায় না কতজন খুব ধীর উত্তর পাচ্ছে; p95 আর p99 দেখা দরকার'
        correct: true
        why: 'অল্প কিছু ৪–৫ সেকেন্ডের request গড়ে প্রায় ধরা পড়ে না। percentile_cont দিয়ে p95/p99 বের করলেই tail দেখা যাবে।'
      - text: 'avg()-এর বদলে max() ব্যবহার করা উচিত ছিল'
        correct: false
        why: 'max একটা মাত্র অস্বাভাবিক request-এই লাফ দেয় (যেমন একবারের নেটওয়ার্ক বিভ্রাট), তাই সেটা দিয়ে সিস্টেমের সাধারণ অবস্থা বোঝা যায় না।'
      - text: 'round() ব্যবহার করায় সংখ্যাটা ভুল এসেছে'
        correct: false
        why: 'round শুধু দশমিকের পরের অংশ ছাঁটে; সমস্যা হিসাবের নির্ভুলতায় নয়, ভুল মাপকাঠি বেছে নেওয়ায়।'
      - text: 'কোনো ফাঁক নেই — 280ms মানে সবাই দ্রুত উত্তর পাচ্ছে'
        correct: false
        why: 'গড় 280ms হলেও p99 কয়েক সেকেন্ড হতে পারে; গড় কারও আসল অভিজ্ঞতা নয়।'
    ref: percentiles-tail-latency
  - q: 'percentile নিয়ে নিচের কোন কথাগুলো ঠিক?'
    hint: 'p-এর পরের সংখ্যাটা বলে শতকরা কত request ওই সময়ের মধ্যে শেষ হয়েছে।'
    options:
      - text: 'p50 হলো median — অর্ধেক request এর চেয়ে দ্রুত শেষ হয়'
        correct: true
        why: 'সাজানো তালিকার মাঝের মানটাই p50, যা সাধারণ ব্যবহারকারীর অভিজ্ঞতা দেখায়।'
      - text: 'p99 = 2s মানে প্রতি ১০০ request-এর প্রায় ১টা ২ সেকেন্ডের বেশি নেয়'
        correct: true
        why: '৯৯% request ওই সময়ের মধ্যে শেষ হয়; বাকি ১% তার চেয়েও ধীর।'
      - text: 'তিনটা সার্ভারের p99 গড় করলে পুরো সিস্টেমের p99 পাওয়া যায়'
        correct: false
        why: 'percentile গড় করা যায় না। সব সার্ভারের request (বা histogram) একসাথে করে তারপর হিসাব করতে হয়।'
      - text: 'p99 সবসময় গড়ের চেয়ে বড় বা সমান হয় না, তাই এটা দেখার দরকার নেই'
        correct: false
        why: 'বাস্তব latency-তে p99 প্রায় সবসময় গড়ের অনেক ওপরে থাকে — আর ঠিক সেই কারণেই এটা আলাদা করে দেখতে হয়।'
    ref: percentiles-tail-latency
  - q: 'একটা API-তে সেকেন্ডে 300 request আসে, গড় latency 200ms। PHP-FPM-এ max_children = 40। কী ঘটবে?'
    hint: 'Little''s Law: একসাথে চলমান request = আসার হার × গড় সময়।'
    options:
      - text: 'কিছুই হবে না — 40টা worker সেকেন্ডে 300 request-এর জন্য যথেষ্ট'
        correct: false
        why: '300 × 0.2 = 60টা request একসাথে চলমান থাকে, যা 40-এর চেয়ে বেশি।'
      - text: 'প্রায় 60টা worker দরকার, তাই request লাইনে জমবে আর latency বাড়তে থাকবে'
        correct: true
        why: 'L = 300 × 0.2 = 60। worker মাত্র 40টা হওয়ায় বাকি request listen queue-তে অপেক্ষা করবে, ফলে latency আরও বাড়বে।'
      - text: '300টা worker লাগবে, কারণ প্রতিটা request-এর জন্য একটা করে worker চাই'
        correct: false
        why: 'একটা worker এক সেকেন্ডে পাঁচটা 200ms-এর request সারতে পারে; worker লাগে একসাথে চলমান request-এর সমান, মোট request-এর সমান নয়।'
      - text: 'worker-এর সংখ্যা latency-র ওপর নির্ভর করে না'
        correct: false
        why: 'latency দ্বিগুণ হলে একই load-এ দ্বিগুণ worker লাগে — সূত্রের W অংশটাই latency।'
    ref: littles-law
  - q: 'ড্যাশবোর্ডে দেখা যাচ্ছে: load সেকেন্ডে 500 থেকে 800-তে উঠেছে, throughput 600-তে আটকে আছে, আর latency মিনিটে মিনিটে বাড়ছে। সবচেয়ে সঠিক ব্যাখ্যা কোনটা?'
    hint: 'যা ঢুকছে আর যা বেরোচ্ছে — এই দুইয়ের ফারাকটা কোথায় যাচ্ছে?'
    options:
      - text: 'সিস্টেমের capacity প্রায় 600 req/s; বাড়তি 200 প্রতি সেকেন্ডে লাইনে জমছে'
        correct: true
        why: 'throughput আর না বাড়া মানে capacity-র সীমা। ঢোকা আর বেরোনোর ফারাকটুকু লাইনে জমছে, তাই latency থামছে না।'
      - text: 'মনিটরিং টুল ভুল সংখ্যা দেখাচ্ছে, কারণ load আর throughput সবসময় সমান হয়'
        correct: false
        why: 'সমান হয় শুধু সুস্থ অবস্থায়। capacity ছাড়ালে throughput পিছিয়ে পড়ে — এটাই overload-এর চিহ্ন।'
      - text: 'ব্যবহারকারীদের ইন্টারনেট ধীর হয়ে গেছে'
        correct: false
        why: 'তাহলে throughput ঠিক capacity-র মতো একটা সংখ্যায় আটকে থাকত না, আর load বাড়ার সাথে তাল মিলিয়ে latency বাড়ত না।'
      - text: 'সব ঠিক আছে, কারণ throughput কমেনি'
        correct: false
        why: 'throughput না কমলেও প্রতি সেকেন্ডে 200 request জমছে; কিছুক্ষণের মধ্যে timeout শুরু হবে।'
    ref: load-throughput-latency
  - q: 'কোন লক্ষণগুলো বলে যে bottleneck অ্যাপ সার্ভারে নয়, ডেটাবেসে?'
    hint: 'যে জায়গা ভরে গেছে সেখানে লাইন জমে; যে জায়গা ফাঁকা সেখানে resource অলস পড়ে থাকে।'
    options:
      - text: 'অ্যাপ সার্ভারের CPU ২০% ব্যস্ত, অথচ request ধীর'
        correct: true
        why: 'অ্যাপ সার্ভার অলস বসে আছে মানে সে অন্য কারও উত্তরের অপেক্ষায় — সাধারণত ডেটাবেসের।'
      - text: 'pg_stat_activity-তে প্রায় সব connection ব্যস্ত বা অপেক্ষায়'
        correct: true
        why: 'ডেটাবেসের connection ভরে যাওয়া মানে সেখানেই লাইন জমছে।'
      - text: 'অ্যাপ সার্ভার বাড়ানোর পর latency আরও বেড়ে গেল'
        correct: true
        why: 'বেশি অ্যাপ সার্ভার মানে আটকে থাকা ডেটাবেসে আরও বেশি চাপ — bottleneck ডেটাবেসে থাকলে ঠিক এটাই ঘটে।'
      - text: 'সব অ্যাপ সার্ভারের CPU ৯৫% ব্যস্ত, ডেটাবেস প্রায় ফাঁকা'
        correct: false
        why: 'এখানে লাইন জমেছে অ্যাপ সার্ভারে — এই এক ক্ষেত্রেই অ্যাপ সার্ভার বাড়ানো সঠিক সমাধান।'
    ref: find-the-bottleneck
  - q: 'একটা পণ্যের পাতা বানাতে ভেতরে ২০টা সার্ভিস call লাগে। প্রতিটা call-এর p99 latency ১ সেকেন্ড। মোটামুটি কত শতাংশ পাতায় অন্তত একটা call ১ সেকেন্ডের বেশি নেবে?'
    hint: 'সব ২০টা call দ্রুত হওয়ার সম্ভাবনা বের করো, তারপর ১০০% থেকে বাদ দাও।'
    options:
      - text: 'প্রায় ১%'
        correct: false
        why: '১% হলো একটা মাত্র call ধীর হওয়ার সম্ভাবনা; ২০টা call থাকলে ঝুঁকি অনেক বেড়ে যায়।'
      - text: 'প্রায় ১৮%'
        correct: true
        why: '২০টাই দ্রুত হওয়ার সম্ভাবনা ০.৯৯-এর ২০তম ঘাত ≈ ৮২%। তাই প্রায় ১৮% পাতায় অন্তত একটা call ধীর।'
      - text: 'প্রায় ৫০%'
        correct: false
        why: '৫০% ছুঁতে প্রায় ৭০টা call লাগত; ২০টায় ঝুঁকি প্রায় ১৮%।'
      - text: '০% — p99 মানে তো ৯৯% দ্রুত'
        correct: false
        why: '৯৯% দ্রুত মানে ১% ধীর; অনেকগুলো call একসাথে করলে সেই ১%-গুলো যোগ হয়ে বড় হয়ে ওঠে।'
