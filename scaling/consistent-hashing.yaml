slides:
  - slug: mod-n-breaks
    title: 'নোড বাড়াতেই সব cache উধাও'
    kind: story
    tldr: '`hash(key) % N` দিয়ে key-কে নোডে ভাগ করলে N বদলানোর সাথে প্রায় সব key জায়গা বদলায়। ৪ থেকে ৫ নোডে গেলে ৮০% cache একসাথে miss হয়।'
    keywords: ['hash mod N', 'modulo hashing', 'cache miss', 'resharding', 'rehash', 'cache cluster']
    blocks:
      - type: metaphor
        icon: book
        title: 'লাইব্রেরির তাকে বই সাজানো'
        body: |
          লাইব্রেরিতে ৪টা তাক, আর নিয়ম: বইয়ের নম্বরকে ৪ দিয়ে ভাগ করলে যে ভাগশেষ, সেই তাকে বই। ভিড় বাড়ায় ৫ম তাক বসানো হলো, নিয়ম হলো ৫ দিয়ে ভাগ। এখন ১০০টা বইয়ের প্রায় ৮০টাই ভুল তাকে, ফলে সবাই বই খুঁজে পায় না। cache cluster-এও ঠিক তাই হয়।
      - type: code
        lang: php
        file: 'src/Cache/NaiveShardedCache.php'
        variant: bad
        code: |
          public function nodeFor(string $key): string
          {
              // $this->nodes = ['redis-1', 'redis-2', 'redis-3', 'redis-4']
              return $this->nodes[crc32($key) % count($this->nodes)];
          }
        marks:
          - {line: 4, tip: 'count($this->nodes) বদলালেই প্রতিটা key-র ফল বদলে যায়। নোড ৪ থেকে ৫ হলে ৮০% key অন্য নোডে চলে যায়।'}
      - type: visual
        kind: bars
        caption: '৪ থেকে ৫ নোডে গেলে কত শতাংশ key জায়গা বদলায়'
        items:
          - {label: 'hash % N', value: 80, display: '৮০%', tone: bad, tip: 'প্রতি ২০টা key-র মধ্যে মাত্র ৪টা আগের নোডে থাকে। বাকি সব miss, সবাই একসাথে ডেটাবেসে ছোটে।'}
          - {label: 'Consistent hashing', value: 20, display: '২০%', tone: good, tip: 'নতুন নোডটা শুধু নিজের ভাগ (১/৫) নেয়। বাকি ৮০% key যেখানে ছিল সেখানেই থাকে।'}
      - type: quote
        body: 'Cache-এ নোড বাড়ানো-কমানোর সময় সব key নাড়ানো যাবে না; যতটুকু দরকার, শুধু ততটুকু নড়বে।'
    aside:
      - type: story
        title: 'সেলের আগের রাতের scale-out'
        body: 'ভিড়ের প্রস্তুতিতে টিম ৪টা Redis নোডে একটা যোগ করল। মিনিট খানেকের মধ্যে hit rate ৯৫% থেকে ২০%-এ নেমে গেল, আর ডেটাবেস হঠাৎ ৫ গুণ query পেয়ে ধীর হয়ে গেল। ভিড় কমানোর আয়োজনই ভিড় বাড়াল।'
      - type: refs
        items:
          - {to: 'caching/cache-stampede', label: 'একসাথে সব miss হলে কী হয়'}
    check:
      q: 'hash % N নিয়মে ৪টা নোডের cache-এ আরেকটা নোড যোগ করলে কী ঘটে?'
      a: 'প্রায় ৮০% key-র নোড বদলে যায়, তাই সেগুলো একসাথে miss করে। বাড়তি চাপ গিয়ে পড়ে ডেটাবেসে।'

  - slug: the-ring
    title: 'বৃত্তে বসাও: ঘড়ির কাঁটার প্রথম নোড'
    kind: concept
    tldr: 'নোড আর key দুটোকেই একটা বৃত্তে hash করে বসাও। key-র দায়িত্ব তার পর ঘড়ির কাঁটার দিকে প্রথম নোডের। নোড যোগ বা বাদ দিলে শুধু প্রতিবেশীর ভাগ নড়ে।'
    keywords: ['hash ring', 'consistent hashing', 'ring', 'clockwise', 'ketama', 'কনসিস্টেন্ট হ্যাশিং']
    blocks:
      - type: metaphor
        icon: map
        title: 'গোলচত্বরের চার চা-ওয়ালা'
        body: |
          গোলচত্বরে ৪ জন চা-ওয়ালা ঘুরে ঘুরে দাঁড়িয়ে। তুমি যেখানেই দাঁড়াও, ঘড়ির কাঁটার দিকে হাঁটলে প্রথম যাকে পাবে, চা তার কাছ থেকেই। একজন উঠে গেলে তার আগের জায়গার খদ্দেররা পরের জনের কাছে যায়, বাকিদের কিছু বদলায় না।
      - type: visual
        kind: table
        caption: 'বৃত্ত ০–৯৯। নোড: A=10, B=40, C=70, D=90'
        headers: ['key', 'hash', 'ঘড়ির কাঁটায় প্রথম নোড']
        rows:
          - cells: ['cart:17', '25', 'B (৪০)']
            tip: '২৫ থেকে এগোলে প্রথম নোড ৪০-এ B, তাই cart:17 B-তে যায়।'
          - cells: ['cart:42', '62', 'C (৭০)']
            tip: '৬২ থেকে এগোলে ৭০-এ C পাওয়া যায়।'
          - cells: ['cart:88', '95', 'A (১০)']
            tip: '৯৫-এর পরে কোনো নোড নেই, তাই বৃত্ত ঘুরে ০-তে এসে ১০-এ A-কে পায়। এটাই wrap-around।'
          - cells: ['cart:05', '05', 'A (১০)']
            tip: '৫ থেকে এগোলে ১০-এ A। অর্থাৎ A ৯১ থেকে ১০ পর্যন্ত অংশের দায়িত্ব পায়।'
      - type: visual
        kind: steps
        caption: 'নোড বদলালে কী নড়ে'
        steps:
          - {title: '১. নোড B উঠে গেল', body: 'আগের ১১–৪০-এর key-গুলো C-র ঘরে যায়', tip: 'শুধু B-র নিজের key-গুলো নড়ে। A, C, D-র নিজের key আগের জায়গাতেই থাকে।'}
          - {title: '২. নতুন নোড E=55 যোগ হলো', body: 'C-র ৪১–৫৫ অংশ E নিয়ে নেয়', tip: 'E শুধু তার ঠিক পরের নোড (C) থেকে একটা টুকরো নেয়। বাকি নোডগুলো টেরও পায় না।'}
          - {title: '৩. মোট নড়াচড়া', body: 'গড়ে প্রায় ১/N অংশ', tip: 'N নোডের মধ্যে একজন বাড়লে বা কমলে মোট key-র আনুমানিক ১/N নড়ে — hash % N-এর ৮০%-এর তুলনায় অনেক কম।', tone: good}
    aside:
      - type: terms
        items:
          - {term: 'Hash ring', meaning: 'hash-এর পুরো সীমাকে (যেমন ০ থেকে ২³²) একটা বৃত্ত ধরা, যেখানে শেষের পরে আবার শুরু।'}
          - {term: 'Wrap-around', meaning: 'বৃত্তের শেষে পৌঁছে আবার শুরুর নোডে ফিরে যাওয়া।'}
      - type: remember
        body: 'key বসাও, ঘড়ির কাঁটায় হাঁটো, প্রথম নোডই মালিক।'
    check:
      q: 'ring-এ নোড C (৭০) বাদ গেলে ৪১–৭০-এর key-গুলো কোন নোডে যাবে, আর A-র key নড়বে কি?'
      a: 'ঘড়ির কাঁটায় পরের নোড D (৯০)-তে যাবে। A-র key নড়বে না, কারণ A-র কোনো key C-র দায়িত্বে ছিল না।'

  - slug: hash-ring-in-php
    title: 'PHP-তে ছোট একটা hash ring'
    kind: howto
    tldr: 'ring মানে sort করা hash-এর তালিকা আর binary search। প্রতিটা নোডকে ১৫০টা virtual position-এ বসাও, তারপর ৫ম নোড যোগ করে মেপে দেখো কতটা নড়ল।'
    keywords: ['PHP', 'HashRing', 'crc32', 'binary search', 'virtual nodes', 'ring implementation']
    blocks:
      - type: text
        body: |
          ভেতরের কাজ ছোট: প্রতিটা নোডকে অনেকবার `নোড#i` নামে hash করে একটা sort করা তালিকায় রাখো। key এলে তার hash বের করে সেই তালিকায় binary search করে প্রথম বড় position খোঁজো। তালিকার শেষ পেরোলে আবার শুরুতে ফিরে যাও।
      - type: code
        lang: php
        file: 'src/Cache/HashRing.php'
        variant: good
        code: |
          final class HashRing
          {
              /** @var array<int, string> position => node */
              private array $ring = [];
              /** @var list<int> sort করা position */
              private array $positions = [];

              public function __construct(private readonly int $vnodes = 150) {}

              public function add(string $node): void
              {
                  for ($i = 0; $i < $this->vnodes; $i++) {
                      $this->ring[crc32($node.'#'.$i)] = $node;
                  }
                  ksort($this->ring);
                  $this->positions = array_keys($this->ring);
              }

              public function nodeFor(string $key): string
              {
                  $h = crc32($key);
                  $lo = 0;
                  $hi = count($this->positions);
                  while ($lo < $hi) {                       // binary search
                      $mid = intdiv($lo + $hi, 2);
                      if ($this->positions[$mid] < $h) { $lo = $mid + 1; } else { $hi = $mid; }
                  }

                  return $this->ring[$this->positions[$lo % count($this->positions)]];
              }
          }
        marks:
          - {line: 8, tip: 'প্রতি নোডে ১৫০টা virtual position। কম হলে ভাগ অসমান হয়, বেশি হলে মেমরি আর add() ধীর হয়।'}
          - {line: 13, tip: 'প্রতিটা position-কে আসল নোডের নামে বেঁধে রাখা হচ্ছে। একই নোডের position বৃত্তে ছড়িয়ে যায়।'}
          - {line: 29, tip: '% count(...) হলো wrap-around: h সব position-এর বড় হলে $lo শেষে পৌঁছায়, আর % দিয়ে ০ হয়ে প্রথম position-এ ফেরে।'}
      - type: code
        lang: php
        file: 'tests/HashRingTest.php'
        code: |
          $ring = new HashRing();
          foreach (['redis-1', 'redis-2', 'redis-3', 'redis-4'] as $n) { $ring->add($n); }

          $before = [];
          foreach (range(1, 10000) as $i) { $before[$i] = $ring->nodeFor("cart:$i"); }

          $ring->add('redis-5');
          $moved = 0;
          foreach ($before as $i => $node) {
              if ($ring->nodeFor("cart:$i") !== $node) { $moved++; }
          }
          // $moved প্রায় ২০০০ (≈২০%); hash % N হলে হতো প্রায় ৮০০০
    aside:
      - type: tips
        items:
          - 'প্রোডাকশনে নিজে লিখো না: memcached client-এর ketama mode, nginx-এর `hash ... consistent`, বা Redis Cluster ব্যবহার করো। উপরের কোড কীভাবে কাজ করে তা বোঝার জন্য।'
          - 'crc32 ছোট ও দ্রুত বলে শেখার জন্য ঠিক আছে। বড় সিস্টেমে ভালো ছড়ানোর জন্য MurmurHash বা xxHash বেছে নেওয়া হয়।'
      - type: pitfalls
        items:
          - 'সব client-কে একই hash function, একই নোডের নাম আর একই vnode সংখ্যা দিতে হবে। না হলে দুজন একই key দুই নোডে খোঁজে।'
    check:
      q: 'nodeFor()-এ `$lo % count($this->positions)` কেন দরকার?'
      a: 'key-র hash যদি সব position-এর চেয়ে বড় হয়, ঘড়ির কাঁটার প্রথম নোড হলো বৃত্তের একদম শুরুর position। % দিয়ে সেই wrap-around হয়।'

  - slug: virtual-nodes
    title: 'Virtual node: সবার ভাগ সমান করা'
    kind: concept
    tldr: 'প্রতিটা নোডের ring-এ মাত্র একটা position থাকলে ভাগ বেজায় অসমান হয়। প্রতিটাকে অনেকগুলো virtual position দিলে ভাগ সমান হয়, আর নোড মরলে তার ভাগ সবার মধ্যে ছড়ায়।'
    keywords: ['virtual nodes', 'vnodes', 'load distribution', 'hotspot', 'ভার্চুয়াল নোড', 'weight']
    blocks:
      - type: metaphor
        icon: shop
        title: 'ঠেলাগাড়ি ছড়িয়ে দাও'
        body: |
          গোলচত্বরে ৩ চা-ওয়ালা একটা করে স্টলে দাঁড়ালে দুজনের মধ্যে বড় ফাঁক পড়লে একজন অনেক বেশি খদ্দের পায়। সমাধান: প্রত্যেকে ১৫০টা ছোট ঠেলাগাড়ি পুরো চত্বরে ছড়িয়ে দেয়। এখন যে যেখানেই দাঁড়াক, কাছাকাছি সবার গাড়ি আছে, আর ভাগ প্রায় সমান।
      - type: visual
        kind: bars
        caption: 'তিন নোডের ভাগ (উদাহরণ সংখ্যা): ১টা position বনাম ১৫০টা'
        items:
          - {label: 'A — ১টা position', value: 55, display: '৫৫%', tone: bad, tip: 'ভাগ্যে বড় ফাঁকের পাশে বসে গেছে, তাই অর্ধেকের বেশি key এর ঘাড়ে।'}
          - {label: 'B — ১টা position', value: 30, display: '৩০%', tone: warn, tip: 'মাঝারি ভাগ। এখনো সমান নয়।'}
          - {label: 'C — ১টা position', value: 15, display: '১৫%', tone: muted, tip: 'ছোট ফাঁকে আটকে প্রায় ফাঁকা বসে থাকে।'}
          - {label: 'A — ১৫০টা position', value: 34, display: '৩৪%', tone: good, tip: 'অনেক ছোট ছোট টুকরো যোগ হয়ে ভাগ প্রায় সমান।'}
          - {label: 'B — ১৫০টা position', value: 33, display: '৩৩%', tone: good, tip: 'প্রায় এক-তৃতীয়াংশ, যেটা হওয়ার কথা।'}
          - {label: 'C — ১৫০টা position', value: 33, display: '৩৩%', tone: good, tip: 'বেশি position মানে গড়ের নিয়মে ভাগ সমান হয়ে আসে।'}
      - type: points
        title: 'Virtual node আরও যা দেয়'
        style: check
        items:
          - 'নোড মরলে তার key সব নোডে ছড়ায়, শুধু এক প্রতিবেশীর ঘাড়ে পড়ে না।'
          - 'বড় মেশিনকে বেশি vnode দিলে বেশি ভাগ পায় — weight-এর মতো।'
          - 'খরচ: মেমরি আর add/remove-এর সময় সামান্য বাড়ে।'
    aside:
      - type: pitfalls
        items:
          - 'নোড মরলে তার key-র cache হারাবে। সেগুলোই একসাথে পুরনো ডেটাবেসে যাবে, তাই stampede ঠেকানোর ব্যবস্থা রাখো।'
      - type: remember
        body: 'এক নোড, বহু position — এতে ভাগ সমান হয়, আর ব্যথাও সবাই ভাগ করে নেয়।'
      - type: refs
        items:
          - {to: 'caching/cache-stampede', label: 'নোড মরলে miss-এর ঝড় সামলানো'}
    check:
      q: 'vnode ছাড়া, প্রতি নোডে মাত্র ১টা position থাকলে সমস্যা কী?'
      a: 'ভাগ অসমান হয় — কোনো নোড বড় ফাঁকের দায়িত্ব পেয়ে অতিরিক্ত বোঝা বয়, কেউ প্রায় ফাঁকা থাকে। আর নোড মরলে পুরো ভার এক প্রতিবেশীর ঘাড়ে পড়ে।'

  - slug: where-its-used
