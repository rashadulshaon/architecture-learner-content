          - 'ডেটা সরানো: স্থায়ী ডেটার জন্য নতুন নোডে ডেটা সত্যিই কপি করতে হয় (rebalance)।'
          - 'replication: key-র একাধিক কপি আলাদা কাজ, ring শুধু প্রথম নোড বলে।'
