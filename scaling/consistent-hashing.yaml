      a: 'না। key একটাই, তাই ring তাকে একটা নোডেই রাখে। hot key-র জন্য আলাদা কৌশল লাগে, যেমন অ্যাপের ভেতরে ছোট local cache বা key-র একাধিক কপি।'

flashcards:
  - q: 'hash(key) % N দিয়ে cache নোড বেছে নিলে কী সমস্যা?'
    a: 'N বদলালে প্রায় সব key-র নোড বদলায়। ৪ থেকে ৫ নোডে গেলে ৮০% key miss করে।'
    more: |
      ভাগশেষের নিয়ম N-এর ওপর নির্ভর করে, তাই N বদলালেই নতুন করে সব key জায়গা বদলায়। একসাথে বেশিরভাগ cache miss করে ডেটাবেসে চাপ ফেলে। এজন্য cache cluster-এ এই নিয়ম এড়ানো হয়।
    ref: mod-n-breaks
  - q: 'Consistent hashing-এর ring কীভাবে কাজ করে?'
    a: 'নোড ও key দুটোকেই বৃত্তে hash করে বসানো হয়। key-র মালিক তার পর ঘড়ির কাঁটার দিকে প্রথম নোড।'
    more: |
      hash-এর পুরো সীমাকে (যেমন ০ থেকে ২³²) বৃত্ত ধরা হয়। বৃত্তের শেষে পৌঁছালে আবার শুরুতে ফিরে যাওয়া হয় (wrap-around)। এভাবে ভাগ নির্ভর করে বৃত্তে নোডের অবস্থানের ওপর, মোট নোডের সংখ্যার ওপর নয়।
    ref: the-ring
  - q: 'ring-এ নোড যোগ বা বাদ দিলে কত key নড়ে?'
    a: 'গড়ে প্রায় ১/N অংশ, শুধু ওই নোডের পাশের টুকরোটা। বাকি key-র কিছু বদলায় না।'
    more: |
      নতুন নোড তার ঠিক পরের নোড থেকে একটা টুকরো নেয়। কোনো নোড বাদ গেলে তার টুকরোটা ঘড়ির কাঁটার পরের নোডে যায়। তাই ৪ থেকে ৫ নোডে গেলে প্রায় ২০% key নড়ে, hash % N-এর ৮০%-এর বদলে।
    ref: the-ring
  - q: 'Virtual node কী, কেন লাগে?'
    a: 'একটা আসল নোডকে ring-এ অনেকগুলো position-এ বসানো। এতে key-র ভাগ প্রায় সমান হয়।'
    more: |
      প্রতি নোডে একটা position থাকলে ভাগ্যের ফাঁকে ভাগ অসমান হয়। প্রতিটাকে ১০০–২০০টা position দিলে গড়ের নিয়মে ভাগ সমান হয়ে আসে। নোড মরলে তার key সব নোডে ছড়ায়, আর বড় মেশিনকে বেশি vnode দিয়ে বেশি ভাগও দেওয়া যায়।
    ref: virtual-nodes
  - q: 'ring-এর key খোঁজার সময় sort করা তালিকায় কী করতে হয়?'
    a: 'key-র hash-এর চেয়ে বড় বা সমান প্রথম position binary search দিয়ে খুঁজতে হয়; না পেলে তালিকার শুরুতে ফিরতে হয়।'
    more: |
      positions sort করা থাকে, তাই খোঁজা O(log n)। PHP-তে `$lo % count($positions)` দিয়ে wrap-around হয়। প্রতিটা client-কে একই hash function, একই নোডের নাম আর একই vnode সংখ্যা ব্যবহার করতে হয়।
    ref: hash-ring-in-php
  - q: 'Redis Cluster কি ring ব্যবহার করে?'
    a: 'না। Redis Cluster ১৬৩৮৪টা স্থির hash slot ব্যবহার করে; slot = CRC16(key) % 16384, আর প্রতিটা slot একটা নোডের।'
    more: |
      নোড বাড়ালে পুরো slot এক নোড থেকে অন্য নোডে সরানো হয়। আইডিয়া একই: key-কে সরাসরি নোডে না বেঁধে মাঝখানে একটা স্তর রাখা, যাতে নোড বদলালে অল্প অংশ নড়ে। বিস্তারিত: [[data/sharding|sharding]]।
    ref: where-its-used
  - q: 'Consistent hashing hot key সমস্যা সারায় না কেন?'
    a: 'একটা key সবসময় একটাই নোডে যায়। ring শুধু key-গুলো সমানভাবে ভাগ করে, কোন key কত ঘন ঘন পড়া হচ্ছে তা দেখে না।'
    more: |
      একটা ভাইরাল পণ্যের key সব ব্যবহারকারী পড়লে সেই নোডটাই জ্বলে। সমাধান: অ্যাপের ভেতরে অল্প সময়ের local cache, key-র একাধিক কপি (key suffix দিয়ে ছড়িয়ে), বা আলাদা hot-key পথ।
    ref: where-its-used

quiz:
  - q: 'একটা cache cluster-এ ৪টা নোড, নোড বাছা হয় `crc32($key) % 4` দিয়ে। সেলের আগে ৫ম নোড বসালে প্রথম মিনিটে কী দেখবে?'
    hint: 'চারটা key-র মধ্যে কয়টা আগের নোডে থাকবে?'
    options:
      - text: 'প্রায় ৮০% key অন্য নোডে চলে যাবে, hit rate ধসবে আর ডেটাবেসে ঝড়'
        correct: true
        why: '৪ আর ৫ দিয়ে ভাগশেষ ২০টা পর্যায়ক্রমে মাত্র ৪ বার মেলে (২০%), তাই বাকি ৮০% key নতুন নোডে খোঁজা হবে আর পাবে না।'
      - text: 'প্রায় ২০% key নড়বে, বাকি সব ঠিক'
        correct: false
        why: 'এটা consistent hashing-এর ফল। hash % N-এ নড়ে ৮০%।'
      - text: 'কিছুই বদলাবে না, শুধু নতুন নোড ফাঁকা থাকবে'
        correct: false
        why: 'নিয়মটা N-এর ওপর নির্ভর করে, তাই N বদলালেই প্রায় সব key-র ফল বদলায়।'
      - text: 'সব key ১০০% নড়বে'
        correct: false
        why: 'প্রায় সব নড়ে, কিন্তু মোটামুটি ২০% নিজের জায়গায় থেকে যায়।'
    ref: mod-n-breaks
  - q: 'ring-এ নোড A=10, B=40, C=70, D=90 (বৃত্ত ০–৯৯)। hash ৯৫ হলে key কোন নোডে যায়?'
    hint: '৯৫-এর পর ঘড়ির কাঁটায় এগোলে কী আসে?'
    options:
      - text: 'A (১০) — বৃত্ত ঘুরে প্রথম নোড'
        correct: true
        why: '৯৫-এর পর কোনো নোড নেই, তাই ০-তে ঘুরে ১০-এ A। এটাই wrap-around।'
      - text: 'D (৯০) — সবচেয়ে কাছের নোড'
        correct: false
        why: 'নিয়ম "সবচেয়ে কাছের" নয়, "ঘড়ির কাঁটার দিকে প্রথম"। ৯০ হলো পেছনে।'
      - text: 'C (৭০)'
        correct: false
        why: '৭০ অনেক পেছনে, ঘড়ির কাঁটার উল্টো দিকে।'
      - text: 'কোনো নোডে নয় — key হারিয়ে যায়'
        correct: false
        why: 'ring বৃত্তাকার, তাই সবসময় একটা মালিক থাকে।'
    ref: the-ring
  - q: 'Virtual node নিয়ে নিচের কোন কথাগুলো ঠিক?'
    hint: 'একটা আসল নোড ring-এ কয়টা জায়গায় বসে?'
    options:
      - text: 'একটা আসল নোড ring-এ অনেকগুলো position নেয়'
        correct: true
        why: 'প্রতিটা position নোডের নামে আলাদা hash করা হয়, যেমন `redis-1#0`, `redis-1#1`।'
      - text: 'ভাগ আরও সমান হয়'
        correct: true
        why: 'অনেক ছোট টুকরো যোগ হলে গড়ের নিয়মে প্রতিটা নোডের ভাগ ১/N-এর কাছাকাছি আসে।'
      - text: 'নোড মরলে তার key সব নোডে ছড়িয়ে যায়, এক প্রতিবেশীর ঘাড়ে পড়ে না'
        correct: true
        why: 'তার position-গুলো ring-এ ছড়ানো ছিল, তাই পরের নোডগুলো আলাদা আলাদা আসল নোডের।'
      - text: 'এতে মেমরি বা add()-এর কাজ একটুও বাড়ে না'
        correct: false
        why: 'N×১৫০টা position জমা রাখতে হয় ও sort করতে হয়; খরচ সামান্য কিন্তু শূন্য নয়।'
    ref: virtual-nodes
  - q: 'HashRing দিয়ে ৪ নোডের ring (প্রতিটায় ১৫০ vnode) চলছে। redis-3 মরে গেল এবং ring থেকে বাদ দেওয়া হলো। এরপর কী ঘটবে?'
    hint: 'কোন key-গুলোর মালিক ছিল redis-3?'
    options:
      - text: 'শুধু redis-3-এর ভাগ, প্রায় ২৫% key miss করবে; বাকি নোডের key আগের জায়গাতেই থাকবে'
        correct: true
        why: 'ring-এ কেবল মরা নোডের টুকরোগুলো ঘড়ির কাঁটার পরের নোডে যায়। vnode থাকায় সেগুলো তিন নোডে প্রায় সমানে ছড়ায়।'
      - text: 'প্রায় ৮০% key miss করবে, কারণ নোডের সংখ্যা বদলেছে'
        correct: false
        why: '৮০% হলো hash % N-এর হিসাব। ring-এ নোডের সংখ্যা সরাসরি key-র জায়গা ঠিক করে না।'
      - text: 'সব key নতুন করে hash হবে, তাই পুরো cache খালি'
        correct: false
        why: 'key-র hash বদলায় না; শুধু কোন position কার মালিক সেটা বদলায়, আর তাও শুধু মরা নোডের অংশে।'
      - text: 'সব key-র বোঝা redis-4 একাই নেবে'
        correct: false
        why: 'vnode-এর কারণে redis-3-এর position পুরো ring-এ ছড়ানো ছিল; তাই বোঝা তিন নোডে ভাগ হয়, একজনের ঘাড়ে পড়ে না।'
    ref: virtual-nodes
  - q: 'একটা প্রোডাক্ট পাতার key (`product:iphone`) সেলের দিনে সবচেয়ে বেশি পড়া হচ্ছে, আর তার নোড ৯৫% CPU-তে। কী করবে?'
