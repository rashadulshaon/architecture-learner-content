slides:
  - slug: one-slide-four-confusions
    title: 'একই স্লাইড, চারজনের চার রকম বিভ্রান্তি'
    kind: story
    tldr: 'ডিজাইন ঠিক থাকলেও ভুল ভাষায় বললে কেউ বোঝে না। প্রতিটা শ্রোতার প্রশ্ন আলাদা, তাই উত্তরও আলাদা।'
    keywords: ['communication', 'audience', 'stakeholder', 'যোগাযোগ', 'ডিজাইন বোঝানো']
    blocks:
      - type: text
        body: |
          সুমি একটা ভালো ডিজাইন বানিয়েছে: পেমেন্টের পর বাকি কাজ queue-তে যাবে। সে একই স্লাইড নিয়ে গেল চারজনের কাছে। ইঞ্জিনিয়ার জানতে চাইল retry কীভাবে হবে, সে সংক্ষেপে বলল "event-driven।" ফিনান্স জানতে চাইল খরচ কত, সে বলল "scalable।" কেউ সন্তুষ্ট হয়নি, প্রকল্প আটকে গেল।
      - type: visual
        kind: flow
        caption: 'এক স্লাইড চারজনের কাছে গেল, কেউ উত্তর পেল না'
        nodes:
          - {id: slide, label: 'সুমির স্লাইড', sub: 'event-driven, scalable', icon: file, tone: accent, col: 0, row: 1.5, tip: 'একটাই স্লাইড, যেখানে শুধু প্রযুক্তির শব্দ আছে। কোনো শ্রোতার প্রশ্নের জবাব নেই।'}
          - {id: eng, label: 'ইঞ্জিনিয়ার', sub: 'retry কীভাবে?', icon: code, col: 3, row: 0, tip: 'জানতে চেয়েছিল ব্যর্থতার পথ ও retry। পেয়েছে শুধু একটা শব্দ।'}
          - {id: prod, label: 'প্রোডাক্ট', sub: 'ব্যবহারকারীর কী হবে?', icon: user, col: 3, row: 1, tip: 'জানতে চেয়েছিল ব্যবহারকারীর অভিজ্ঞতা কেমন বদলাবে।'}
          - {id: fin, label: 'ফিনান্স', sub: 'কত খরচ?', icon: money, col: 3, row: 2, tip: 'জানতে চেয়েছিল খরচ। উত্তর পেয়েছে "scalable"।'}
          - {id: aud, label: 'অডিটর', sub: 'প্রমাণ কী?', icon: shield, col: 3, row: 3, tip: 'জানতে চেয়েছিল নিয়ম মানার প্রমাণ।'}
        edges:
          - {from: slide, to: eng, label: 'ইঞ্জিনিয়ার জানতে চাইল retry কীভাবে, উত্তর এল "event-driven"', tone: bad}
          - {from: slide, to: prod, label: 'প্রোডাক্ট জানতে চাইল ব্যবহারকারীর কী বদলাবে, কোনো উত্তর নেই', tone: bad}
          - {from: slide, to: fin, label: 'ফিনান্স খরচ জানতে চাইল, উত্তর এল "scalable"', tone: bad}
          - {from: slide, to: aud, label: 'অডিটর প্রমাণ চাইল, স্লাইডে কিছুই নেই', tone: bad}
      - type: points
        title: 'কী ভুল হলো'
        style: cross
        items:
          - 'একই স্লাইড চার শ্রোতাকে দেখানো হয়েছে।'
          - 'প্রতিটা শ্রোতা আলাদা প্রশ্ন নিয়ে এসেছিল, কেউ উত্তর পায়নি।'
          - 'শব্দ ছিল "event-driven", "scalable"; সংখ্যা বা পরিণতি ছিল না।'
      - type: metaphor
        icon: id
        title: 'ফার্মেসিতে একই ওষুধ'
        body: |
          একই ওষুধ রোগীকে বলা হয় "দিনে দুইবার, খাবার পরে।" ডাক্তারকে বলা হয় মাত্রা আর সময়ের ব্যবধান, ফার্মাসিস্টকে ব্যাচ আর মেয়াদ। ওষুধ এক, তথ্য একই; শ্রোতা বুঝে কথা বদলায়।
      - type: quote
        body: 'ডিজাইন একটাই, বলার ভাষা শ্রোতাভেদে আলাদা।'
    aside:
      - type: story
        title: 'ফিনান্সের তিন প্রশ্ন'
        body: |
          এক ইঞ্জিনিয়ার নতুন ক্লাউড খরচ চাইতে গিয়ে CPU আর autoscaling বোঝাল। CFO শুধু তিনটা প্রশ্ন করলেন: কত লাগবে, কী পাব, না করলে কী হবে। ওই তিনটার উত্তর এক লাইনে দিলে ১০ মিনিটেই অনুমোদন মিলত।
      - type: problem
        body: 'এই segment শেখায় কীভাবে একই ডিজাইন চার শ্রোতাকে বোঝানো যায়, কীভাবে এক পাতার design doc লেখা যায় আর কীভাবে রিভিউ চালালে সেটা আদালত হয় না।'
    check:
      q: 'সুমির স্লাইড কেন ব্যর্থ হলো, যদিও ডিজাইনটা ঠিক ছিল?'
      a: 'প্রতিটা শ্রোতার প্রশ্ন আলাদা ছিল, কিন্তু উত্তর ছিল এক। "event-driven" বা "scalable" কারো প্রশ্নের জবাব নয়।'

  - slug: four-audiences
    title: 'চার শ্রোতা, চার প্রশ্ন'
    kind: concept
    tldr: 'ইঞ্জিনিয়ার জানতে চায় কীভাবে, প্রোডাক্ট জানতে চায় ব্যবহারকারীর কী বদলাবে, ফিনান্স জানতে চায় খরচ, নিয়ন্ত্রক জানতে চায় প্রমাণ।'
    keywords: ['stakeholder', 'audience', 'product', 'finance', 'regulator', 'শ্রোতা']
    blocks:
      - type: text
        body: |
          প্রতিটা শ্রোতা একটাই প্রশ্ন বারবার করে, সেটা আগে থেকে জেনে নাও। তুমি তার ভাষায় সেই প্রশ্নের উত্তর দিলে সে বাকিটা বিশ্বাস করে। তোমার দেওয়া প্রযুক্তির বিস্তারিত তার কাজে আসে না। নিচের ছকে চার শ্রোতার মূল প্রশ্ন আর তাকে কী দিতে হবে।
      - type: visual
        kind: table
        caption: 'চার শ্রোতা: কী জানতে চায়, কী দেবে'
        headers: ['শ্রোতা', 'মূল প্রশ্ন', 'তাকে দাও']
        rows:
          - cells: ['ইঞ্জিনিয়ার', 'কীভাবে কাজ করবে, কীভাবে ভাঙবে?', 'ডায়াগ্রাম, failure case, trade-off']
            tip: 'ইঞ্জিনিয়ার গভীরে যেতে চায়। আগে দেখাও কোথায় ভাঙতে পারে; সে সেটাই খুঁজবে।'
          - cells: ['প্রোডাক্ট', 'ব্যবহারকারী কী পাবে, কবে?', 'অভিজ্ঞতার বদল, তারিখ, সীমাবদ্ধতা']
            tip: 'প্রোডাক্টের কাছে "queue" অর্থহীন; "ইমেইল ২ মিনিট দেরিতে আসবে" অর্থবহ।'
          - cells: ['ফিনান্স', 'কত টাকা, কী ফেরত, না করলে কী?', 'খরচ, লাভ বা ক্ষতি এড়ানো, সময়সীমা']
            tip: 'সংখ্যা না থাকলে ফিনান্স সিদ্ধান্ত নিতে পারে না। অনুমান হলেও পরিসর দাও।'
          - cells: ['নিয়ন্ত্রক / অডিটর', 'নিয়ম মানা হচ্ছে তার প্রমাণ কী?', 'নিয়ন্ত্রণ, log, ডেটা কোথায় আছে']
            tip: 'অডিটরের কাছে "আমরা ঠিকঠাক করি" যথেষ্ট নয়; কে কখন কী করেছে, তার রেকর্ড দেখাতে হয়।'
      - type: quote
        body: 'আগে জানো শ্রোতা কোন প্রশ্ন নিয়ে এসেছে, তারপর মুখ খোলো।'
    aside:
      - type: tips
        items:
          - 'মিটিংয়ের আগে শ্রোতাকে জিজ্ঞেস করো: "এই সিদ্ধান্তে আপনার কোন জিনিসটা সবচেয়ে বেশি জরুরি?"'
          - 'চারজনের জন্য আলাদা স্লাইড নয়; একই ডিজাইনের চারটা সারাংশ, প্রতিটা এক অনুচ্ছেদ।'
      - type: remember
        body: 'ইঞ্জিনিয়ার: কীভাবে। প্রোডাক্ট: কী বদলাবে। ফিনান্স: কত টাকা। অডিটর: প্রমাণ কী।'
    check:
      q: 'ফিনান্সকে বোঝাতে গিয়ে "autoscaling" ব্যাখ্যা করার চেয়ে কী বলা ভালো?'
      a: 'মাসে আনুমানিক কত খরচ, কী সুবিধা মিলবে, আর না করলে কী ক্ষতি। সংখ্যা ও পরিণতি, প্রযুক্তি নয়।'

  - slug: one-design-four-ways
    title: 'একই ডিজাইন, চার ভাষায়'
    kind: howto
    tldr: 'ডিজাইন: পেমেন্টের পর বাকি কাজ queue-তে। চারজনের জন্য চারটা সারাংশ, প্রতিটা শ্রোতার প্রশ্নের উত্তরে লেখা।'
    keywords: ['explain design', 'outbox', 'queue', 'one design four audiences', 'উদাহরণ']
    blocks:
      - type: text
        body: |
          ডিজাইনটা এই: ক্রেতার পেমেন্টের পর ইমেইল, ইনভয়েস আর হিসাবের কাজ request-এর ভেতরে না করে queue-তে পাঠানো হবে। নিচে একই ডিজাইন চার শ্রোতার জন্য লেখা হলো। সংখ্যাগুলো উদাহরণ; নিজের তথ্য বসাবে।
      - type: code
        lang: text
        file: 'one-design-four-audiences.txt'
        variant: good
        code: |
          [ইঞ্জিনিয়ার]
          POST /checkout শুধু payment আর order status লেখে, একই transaction-এ outbox
          row রাখে। Messenger worker বাকি কাজ নেয়; handler idempotent, ৩ বার retry,
          তারপর failed queue। p95 ৪ সেকেন্ড থেকে ~৩০০ms-এর লক্ষ্য।

          [প্রোডাক্ট]
          চেকআউট ৪ সেকেন্ডের বদলে ১ সেকেন্ডে শেষ হবে। "অর্ডার নিশ্চিত" সাথে সাথে
          দেখাবে; ইমেইল ২ মিনিট পর্যন্ত দেরিতে আসতে পারে। ছাড় দিতে হচ্ছে: ইমেইল
          তাৎক্ষণিক নয়। লক্ষ্য: কার্ট ছেড়ে যাওয়া কমানো।

          [ফিনান্স]
          অতিরিক্ত খরচ: ১টা worker, মাসে প্রায় ৮ হাজার টাকা (উদাহরণ)। প্রত্যাশিত লাভ:
          ধীর চেকআউটে হারানো অর্ডারের একাংশ ফেরত। না করলে: বিক্রির মৌসুমে ক্ষতি
          বাড়বে। পরীক্ষামূলক চালু ২ সপ্তাহে।

          [নিয়ন্ত্রক / অডিটর]
          কার্ডের তথ্য আমরা রাখি না, পেমেন্ট প্রদানকারী রাখে। প্রতিটা পেমেন্ট ও
          পরবর্তী কাজের event তারিখসহ audit log-এ থাকে, বদলানো যায় না। log মেয়াদ:
          নিয়ম অনুযায়ী (উদাহরণ: ৫ বছর)।
        marks:
          - {line: 2, tip: 'ইঞ্জিনিয়ারের জন্য কাঠামো ও ব্যর্থতার পথ: কোথায় লেখে, ভাঙলে কী হয়।'}
          - {line: 7, tip: 'প্রোডাক্টের জন্য ব্যবহারকারীর অভিজ্ঞতা, আর কী ছাড় দিতে হচ্ছে তা স্পষ্ট বলা।'}
          - {line: 12, tip: 'ফিনান্সের জন্য খরচ, লাভ আর না করার দাম: তিনটাই সংখ্যাসহ।'}
          - {line: 17, tip: 'অডিটরের জন্য প্রমাণ: কোথায় তথ্য থাকে আর কেন তা বদলানো যায় না।'}
      - type: quote
        body: 'প্রতিটা সারাংশ শুরু হয় শ্রোতার প্রশ্ন দিয়ে, প্রযুক্তি দিয়ে নয়।'
    aside:
      - type: pitfalls
        items:
          - 'ফিনান্সকে অনুমান দেখিয়ে সেটাকে নিশ্চিত বলে ধরানো। পরিসর বলো: "৬–১০ হাজার"।'
          - 'প্রোডাক্টের কাছে ছাড় লুকানো। "ইমেইল দেরিতে আসবে" না বললে পরে সেটা বিস্ময় হয়ে ফেরে।'
      - type: refs
        items:
          - {to: 'messaging/background-jobs', label: 'queue ও background job'}
    check:
      q: 'একই queue-ডিজাইন ফিনান্স আর অডিটরকে বলার মূল পার্থক্য কী?'
      a: 'ফিনান্সকে দাও খরচ, লাভ আর না করার দাম। অডিটরকে দাও প্রমাণ: কোন তথ্য কোথায় থাকে, কে কখন কী করেছে।'

  - slug: design-doc-rfc
    title: 'Design doc / RFC: এক পাতায় সিদ্ধান্ত'
    kind: howto
    tldr: 'ভালো RFC-তে সমস্যা, বিকল্প, প্রস্তাব, ঝুঁকি আর কী চাওয়া হচ্ছে — সব এক জায়গায়, যাতে পড়ে মতামত দেওয়া যায়।'
    keywords: ['RFC', 'design doc', 'ADR', 'ডিজাইন ডক', 'proposal']
    blocks:
      - type: text
        body: |
          মুখে মুখে সিদ্ধান্ত পরে কেউ মনে রাখে না। RFC (Request for Comments) হলো এক-দুই পাতার লেখা, যেটা সবাইকে মতামত দেওয়ার সুযোগ দেয়। নিচের কাঠামো কপি করে ব্যবহার করো। লম্বা লেখার চেয়ে স্পষ্ট লেখা বেশি কাজের।
      - type: code
        lang: text
        file: 'docs/rfc/0012-order-queue.md'
        variant: good
        code: |
          # RFC-0012: অর্ডারের পরের কাজ queue-তে
          লেখক: সুমি   স্ট্যাটাস: Draft   সিদ্ধান্তদাতা: রহিম   মতামতের শেষ তারিখ: ২০ ডিসেম্বর

          ## ১. সমস্যা (২-৩ লাইন)
          চেকআউট ৪ সেকেন্ড লাগে; ৩ সেকেন্ডের বেশি হলে ক্রেতা ছেড়ে যায়।

          ## ২. লক্ষ্য ও যা নিয়ে কাজ করছি না
          লক্ষ্য: p95 ১ সেকেন্ডের নিচে। লক্ষ্য নয়: নতুন ইমেইল ডিজাইন।

          ## ৩. বিকল্প (কমপক্ষে দুটো, "কিছু না করা" সহ)
          A. কিছু না করা  B. query ঠিক করা  C. queue-তে সরানো

          ## ৪. প্রস্তাব ও কেন
          C। B-তে ধীরতা ১.৫ সেকেন্ড পর্যন্ত নামে, লক্ষ্য ছোঁয় না।

          ## ৫. ঝুঁকি ও ফেরার পথ
          ইমেইল দেরি। flag দিয়ে পুরনো পথে ফেরা যাবে।

          ## ৬. কী চাইছি
          ২০ ডিসেম্বরের মধ্যে ইঞ্জিনিয়ারিং ও প্রোডাক্টের মতামত; তারপর রহিম সিদ্ধান্ত দেবেন।
        marks:
          - {line: 2, tip: 'সিদ্ধান্তদাতা ও শেষ তারিখ শুরুতেই। নইলে RFC অনন্তকাল খোলা থাকে।'}
          - {line: 4, tip: 'সমস্যা আগে। সমাধান যতই ভালো হোক, সমস্যাটা না বুঝলে কেউ মূল্যায়ন করতে পারে না।'}
          - {line: 7, tip: 'কী করছি না, তা লিখলে মতামত মূল প্রশ্নে থাকে; পাশের তর্ক কমে।'}
          - {line: 10, tip: 'বিকল্প না দেখালে বোঝা যায় না আর কিছু ভাবা হয়েছে কি না। "কিছু না করা" সবসময় একটা বিকল্প।'}
          - {line: 16, tip: 'ঝুঁকি আর ফেরার পথ লিখলে সিদ্ধান্ত নেওয়া সহজ হয়।'}
