flashcards:
  - q: 'একই ডিজাইন চার শ্রোতাকে কীভাবে বলা উচিত?'
    a: 'প্রতিজনের মূল প্রশ্নের উত্তর দিয়ে শুরু করে: ইঞ্জিনিয়ারকে কীভাবে, প্রোডাক্টকে কী বদলাবে, ফিনান্সকে কত টাকা, অডিটরকে প্রমাণ।'
    more: |
      চার শ্রোতার জন্য চারটা আলাদা সিদ্ধান্ত লাগে না; ডিজাইন এক। বদলায় শুধু বলার ক্রম আর ভাষা। শ্রোতার প্রশ্নের উত্তর দিয়ে শুরু করলে সে বাকিটা মন দিয়ে শোনে।
    ref: four-audiences
  - q: 'ফিনান্স শ্রোতা কোন তিনটা প্রশ্ন করে?'
    a: 'কত টাকা লাগবে? কী পাব? না করলে কী ক্ষতি?'
    more: |
      এই তিনটার উত্তর সংখ্যাসহ এক লাইনে দাও। সংখ্যা অনুমান হলে পরিসর বলো (যেমন ৬–১০ হাজার)। প্রযুক্তির বিস্তারিত ফিনান্সের কাছে অবান্তর, সিদ্ধান্তের জন্য লাগে খরচ ও ঝুঁকির তুলনা।
    ref: four-audiences
  - q: 'প্রোডাক্ট ম্যানেজারকে ডিজাইন বোঝাতে কোন ভুল সবচেয়ে বেশি হয়?'
    a: 'ব্যবহারকারীর অভিজ্ঞতায় কী ছাড় দিতে হচ্ছে তা লুকানো বা প্রযুক্তির শব্দে বলা।'
    more: |
      "ইমেইল ২ মিনিট দেরিতে আসবে" বললে প্রোডাক্ট সিদ্ধান্ত নিতে পারে। "আমরা queue ব্যবহার করব" বললে পারে না। ছাড় লুকালে পরে ব্যবহারকারীর অভিযোগে সেটা বিস্ময় হয়ে ফেরে।
    ref: one-design-four-ways
  - q: 'অডিটর বা নিয়ন্ত্রক কী চায়?'
    a: 'প্রমাণ: কে কখন কী করেছে, ডেটা কোথায় আছে, কোন নিয়ন্ত্রণ কীভাবে কাজ করছে।'
    more: |
      "আমরা নিরাপদভাবে কাজ করি" বললে যথেষ্ট নয়। audit log, access control আর ডেটার অবস্থানের রেকর্ড দেখাতে হয়। ডিজাইনের সময়েই এসব ভেবে রাখলে অডিটে ভাবতে হয় না।
    ref: four-audiences
  - q: 'RFC-এর পুরো নাম ও কাজ কী?'
    a: 'Request for Comments: সমস্যা, বিকল্প, প্রস্তাব ও ঝুঁকি লেখা ১-২ পাতার দলিল, যা মতামত নিয়ে সিদ্ধান্তে পৌঁছাতে ব্যবহার হয়।'
    more: |
      মুখের সিদ্ধান্ত সময়ের সাথে হারিয়ে যায়। RFC লেখা থাকলে ছয় মাস পরে নতুন সদস্যও জানতে পারে সিদ্ধান্তটা কেন নেওয়া হয়েছিল। শুরুতেই সিদ্ধান্তদাতা ও মতামতের শেষ তারিখ লিখে রাখতে হয়।
    ref: design-doc-rfc
  - q: 'RFC-তে সবসময় কোন বিকল্প রাখা উচিত?'
    a: '"কিছু না করা" — যাতে বোঝা যায় কাজটা করার দাম আসলেই দেওয়ার যোগ্য।'
    more: |
      অনেক প্রস্তাবে একটাই সমাধান দেখানো হয়, তাই মনে হয় আর কিছু ভাবা হয়নি। কমপক্ষে দুটো বিকল্প, তার মধ্যে "কিছু না করা", দেখালে পাঠক নিজে তুলনা করতে পারে।
    ref: design-doc-rfc
  - q: 'ADR বলতে কী বোঝায়?'
    a: 'Architecture Decision Record: একটা সিদ্ধান্তের প্রসঙ্গ, সিদ্ধান্ত আর পরিণতি লেখা ছোট নোট, repo-তে সংরক্ষিত।'
    more: |
      RFC বড় প্রস্তাবের জন্য, ADR সিদ্ধান্ত হয়ে যাওয়ার পর তার রেকর্ড। প্রতিটা ADR-এ কয়েক লাইন: কী ঠিক হলো, কেন, আর পরিণতি কী। কোড repo-র পাশেই রাখলে খুঁজে পাওয়া সহজ।
    ref: design-doc-rfc
  - q: 'ডিজাইন রিভিউ আদালত হয়ে উঠলে কী ক্ষতি হয়?'
    a: 'লেখক ভয়ে দুর্বলতা লুকোয়, তাই আসল ঝুঁকি প্রোডাকশনে গিয়ে ধরা পড়ে।'
    more: |
      যে প্রশ্ন মানুষকে লক্ষ্য করে ("তুমি কেন ভাবলে না?"), লেখক তাতে আত্মরক্ষায় নামে। প্রশ্ন ডিজাইনকে লক্ষ্য করলে ("ভাঙলে কী হবে?") সে নিজেই আগে দুর্বল জায়গা বলে। বিস্তারিত: [[thinking/design-review|ডিজাইন রিভিউ]]।
    ref: review-not-trial

quiz:
  - q: 'CFO-র কাছে নতুন ক্লাউড খরচের প্রস্তাব নিয়ে যাচ্ছ। কোন শুরুটা সবচেয়ে ভালো?'
    hint: 'CFO-র মূল তিনটা প্রশ্ন কী?'
    options:
      - text: 'autoscaling কীভাবে CPU ধরে কাজ করে তার ব্যাখ্যা'
        correct: false
        why: 'এটা ইঞ্জিনিয়ারের প্রশ্নের উত্তর; ফিনান্সের সিদ্ধান্তে লাগে না।'
      - text: 'মাসে আনুমানিক খরচ, কী সুবিধা পাওয়া যাবে, আর না করলে কী ক্ষতি'
        correct: true
        why: 'ফিনান্স ঠিক এই তিন প্রশ্নের উত্তর খোঁজে: কত, কী পাব, না করলে কী।'
      - text: 'বিভিন্ন ক্লাউডের feature তুলনা'
        correct: false
        why: 'তুলনা পরে লাগতে পারে, কিন্তু প্রথমে সিদ্ধান্তের সংখ্যা ও পরিণতি চাই।'
      - text: 'বলো "এটা আধুনিক best practice"'
        correct: false
        why: 'এটা কোনো খরচ বা লাভের হিসাব নয়; সিদ্ধান্তে লাগে না।'
    ref: four-audiences
  - q: 'queue ডিজাইনে ইমেইল ২ মিনিট দেরিতে আসবে। প্রোডাক্ট ম্যানেজারকে কীভাবে বলবে?'
    hint: 'প্রোডাক্ট কী ছাড় দিচ্ছে, সেটা জানতে চায়।'
    options:
      - text: '"আমরা async মডেলে যাচ্ছি, eventual consistency আছে।"'
        correct: false
        why: 'প্রযুক্তির শব্দ, ব্যবহারকারীর অভিজ্ঞতা নিয়ে কিছুই বলে না।'
      - text: 'কিছু বলার দরকার নেই, এটা প্রযুক্তির ব্যাপার'
        correct: false
        why: 'ইমেইল দেরি ব্যবহারকারীর কাছে দৃশ্যমান; প্রোডাক্টকে না জানালে পরে বিস্ময় আসবে।'
      - text: '"চেকআউট ১ সেকেন্ডে শেষ হবে, কিন্তু রসিদের ইমেইল ২ মিনিট পর্যন্ত দেরিতে আসতে পারে।"'
        correct: true
        why: 'লাভ ও ছাড় দুটোই ব্যবহারকারীর ভাষায়, তাই প্রোডাক্ট সিদ্ধান্ত নিতে পারে।'
      - text: '"ইমেইলে সমস্যা হলে আমাদের জানাবেন।"'
        correct: false
        why: 'এটা ছাড় স্বীকার নয়, দায় সরানো।'
    ref: one-design-four-ways
  - q: 'নিচের কোনগুলো একটা ভালো RFC-তে থাকা উচিত?'
    hint: 'পাঠক সিদ্ধান্ত নিতে কী কী চায়?'
    options:
      - text: 'সমস্যার বিবরণ ও লক্ষ্য'
        correct: true
        why: 'সমস্যা না বুঝলে কেউ প্রস্তাব মূল্যায়ন করতে পারে না।'
      - text: 'কমপক্ষে দুটো বিকল্প, "কিছু না করা"-সহ'
        correct: true
        why: 'বিকল্প দেখালে বোঝা যায় ভেবে-চিন্তে প্রস্তাব এসেছে।'
      - text: 'ঝুঁকি ও ফেরার পথ'
        correct: true
        why: 'সিদ্ধান্তদাতা জানতে চান ভুল হলে কত ক্ষতি আর কীভাবে ফেরা যায়।'
      - text: 'প্রতিটা class-এর পুরো কোড'
        correct: false
        why: 'কোড RFC-কে লম্বা করে, পাঠক মূল সিদ্ধান্ত হারায়। কোড PR-এর জায়গা।'
    ref: design-doc-rfc
  - q: 'রাকিবের RFC দুই সপ্তাহ ধরে ঝুলে আছে, কেউ সিদ্ধান্ত নিচ্ছে না। কী ভুল হয়েছিল?'
    hint: 'RFC-এর শুরুর অংশে কোন দুটো জিনিস না থাকলে এমন হয়?'
    options:
      - text: 'সিদ্ধান্তদাতার নাম ও মতামতের শেষ তারিখ লেখা হয়নি'
        correct: true
        why: 'এ দুটো না থাকলে কেউ দায় নেয় না, আর আলোচনা কখন শেষ তা কেউ জানে না।'
      - text: 'RFC খুব ছোট ছিল'
        correct: false
        why: 'ছোট RFC বরং পড়া সহজ; দেরি হয় দায়িত্ব স্পষ্ট না থাকলে।'
      - text: 'আরও বেশি মানুষকে মতামতের জন্য ডাকা দরকার ছিল'
        correct: false
        why: 'বেশি মানুষ মানে বেশি তর্ক; আসল সমস্যা সিদ্ধান্তদাতা না থাকা।'
      - text: 'diagram ছিল না'
        correct: false
        why: 'diagram সাহায্য করে, কিন্তু ঝুলে থাকার কারণ কাঠামোর অভাব।'
    ref: design-doc-rfc
  - q: 'রিভিউতে একজন বলল, "তুমি এটা কেন ভাবলে না?" সে কথাটা কীভাবে বললে ভালো হতো?'
    hint: 'প্রশ্নটা মানুষকে লক্ষ্য করছে, না ডিজাইনকে?'
    options:
      - text: '"এটা তো বোকামি, আবার ভাবো।"'
        correct: false
        why: 'আরও কড়া ব্যক্তিগত আক্রমণ; লেখক দুর্বলতা লুকোবে।'
      - text: 'কিছু না বলে রিভিউ-এর পরে আলাদা করে বলা'
        correct: false
        why: 'ঝুঁকিটা টিমের সবার জানা দরকার; গোপনে বললে আলোচনা হারায়।'
      - text: '"payment gateway ধীর হলে এই অংশ কী করবে? বিকল্প কিছু দেখেছ?"'
        correct: true
        why: 'প্রশ্ন ডিজাইনের একটা ব্যর্থতার পথ নিয়ে, আর বিকল্প ভাবার সুযোগ দেয়।'
      - text: 'রিভিউ শেষ না হওয়া পর্যন্ত চুপ থাকা'
        correct: false
        why: 'চুপ থাকলে ঝুঁকি ধরা পড়ে না। আসল সমস্যা ভঙ্গি, প্রশ্ন নয়।'
    ref: review-not-trial
  - q: 'নিয়ন্ত্রক সংস্থার অডিটরকে নতুন পেমেন্ট ডিজাইন বোঝাচ্ছ। কোনটা তার সবচেয়ে বেশি কাজে লাগবে?'
    hint: 'অডিটর কী প্রমাণ চায়?'
    options:
      - text: 'চেকআউট কত দ্রুত হবে'
        correct: false
        why: 'এটা প্রোডাক্টের চিন্তা। অডিটরের প্রশ্ন নিয়ম মানা নিয়ে।'
      - text: 'কার্ডের তথ্য কোথায় থাকে, আর প্রতিটা লেনদেনের audit log কে কখন দেখতে পারে'
        correct: true
        why: 'এটা ডেটার অবস্থান আর নিয়ন্ত্রণের প্রমাণ, যা অডিটর যাচাই করতে চায়।'
      - text: 'টিমের আকার ও sprint-এর পরিকল্পনা'
        correct: false
        why: 'এটা অডিটের বিষয় নয়, সংগঠনের ভেতরের ব্যাপার।'
      - text: '"আমরা অনেক সতর্ক থাকি" এই আশ্বাস'
        correct: false
        why: 'আশ্বাস প্রমাণ নয়; অডিটর রেকর্ড দেখতে চায়।'
    ref: four-audiences
