        kind: steps
        caption: 'RFC-এর যাত্রা: লেখা থেকে সিদ্ধান্ত'
        steps:
          - {title: '১. লেখো', body: 'সমস্যা, বিকল্প, প্রস্তাব — ১-২ পাতায়।', tip: 'দীর্ঘ হলে কেউ পড়বে না। ২ পাতার বেশি হলে ভাগ করো।'}
          - {title: '২. মতামত নাও', body: 'নির্দিষ্ট সময় দাও, নাম ধরে দু-তিনজনকে জানাও।', tip: 'সবাইকে বলা মানে কাউকে না বলা। নাম ধরে জানালে মতামত আসে।'}
          - {title: '৩. সিদ্ধান্ত', body: 'সিদ্ধান্তদাতা সময় শেষে সিদ্ধান্ত লেখেন, কারণসহ।', tip: 'আলোচনা শেষ হলে একজন সিদ্ধান্ত দেয়। সবাই একমত না হলেও।'}
          - {title: '৪. সংরক্ষণ', body: 'স্ট্যাটাস Accepted করো, repo-তে রাখো।', tip: 'ছয় মাস পরে নতুন সদস্য জানতে চায় "কেন?"; তখন এটাই উত্তর।'}
