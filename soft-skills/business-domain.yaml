slides:
  - slug: perfect-but-late
    title: 'A flawless app, and Eid has come and gone'
    kind: story
    tldr: 'Design without understanding the business goal solves the wrong problem, however good the code. An engineer''s job is to turn goals into constraints.'
    keywords: ['business domain', 'time to market', 'business goals', 'understanding the business', 'domain knowledge']
    blocks:
      - type: text
        body: |
          Marketing wanted to launch an "Eid offer" two weeks before Eid. Rakib's team said it would take two months, because they wanted to build everything "properly". The offer went live a week after Eid. The code was flawless, but the selling season was over.
      - type: metaphor
        icon: shop
        title: 'The tailor before Eid'
        body: |
          Before Eid, a tailor knows that however beautiful the design, an outfit that doesn't reach the customer before chand raat, the night of the moon sighting, means nothing to them. So he first works out what is needed by tomorrow and what can take two more days.
      - type: visual
        kind: compare
        caption: 'The same two months, seen two ways'
        columns:
          - title: 'Seeing only the technology'
            tone: bad
            icon: cross
            tip: 'The engineer''s care for good code is right, but the business deadline was dropped.'
            items:
              - '"I''ll release when it''s all done properly"'
              - 'The deadline is the business''s, and was forgotten'
              - 'Season over, customers at another shop'
          - title: 'Understanding the business goal'
            tone: good
            icon: check
            tip: 'It first found out what the offer cannot live without, and left the rest for later.'
            items:
              - '"What must be there before Eid?"'
              - 'Core in 2 weeks, the rest later'
              - 'Sales in season, polish afterwards'
      - type: quote
        body: 'Without knowing the business goal, even the best code solves the wrong problem.'
    aside:
      - type: problem
        body: 'This segment teaches you to turn business goals into design constraints, work out ROI, balance time against quality, and treat legal rules as design input.'
      - type: remember
        body: 'Ask: "What does the business want, and what does it lose if it doesn''t get it?"'
    check:
      q: 'Why was Rakib''s team''s flawless app no use to the business?'
      a: 'The Eid season was the offer''s whole value. The deadline was a business constraint, and by holding out for quality the team missed the chance.'

  - slug: goals-to-constraints
    title: 'From business goals to design constraints'
    kind: concept
    tldr: 'Turn each business goal into a measurable quality attribute, and only then choose the design.'
    keywords: ['quality attributes', 'constraints', 'business goals', 'requirements', 'non-functional requirements']
    blocks:
      - type: text
        body: |
          "Customers must never lose money" is business talk. In engineering terms, it means correctness and an audit trail you can check later. "Lots of customers at Eid" means scalability, coping when many arrive at once. This translation is the architect's job. Without it, a design stands on guesswork.
      - type: visual
        kind: table
        caption: 'From a business goal to a design decision'
        headers: ['Business says', 'Technical constraint', 'What changes in the design']
        rows:
          - cells: ['10x sales at Eid', 'Handle peak load', 'Cache, queue, horizontal scaling']
            tip: 'Get the numbers: how many times more, and for how long. You can''t design from "a lot".'
          - cells: ['Customers never lose money', 'Correctness and audit', 'Transactions, ledger, idempotency']
            tip: 'With money, correctness beats speed. There is no room to compromise here.'
          - cells: ['To market in 3 months', 'Fast delivery', 'A simple monolith, buy rather than build']
            tip: 'A deadline is the hardest constraint on a design; a complex architecture is a burden here.'
          - cells: ['Must follow regulator''s rules', 'Data and audit rules', 'Data location, logs, retention period']
            tip: 'The law can''t be changed. It is a constraint to assume before design starts.'
      - type: code
        lang: text
        file: 'goals-to-constraints.txt'
        variant: good
        code: |
          Goal:         Handle 10x orders in Eid week without losing a single order
          Measure:      peak 500 orders/min; p95 checkout < 1 second; lost orders = 0
          Assumption:   last year's peak was 50 orders/min (from analytics); no new hires in 3 months
          Constraint:   small team -> no new services; add a queue to the current monolith
          Will give up: admin reports will stay slow
          Won't give up: accuracy of money and orders
        marks:
          - {line: 2, tip: 'Numbers make "a lot" measurable: 500 orders a minute is about 8 every second, like 8 people reaching a tea-stall counter each second. p95 means 95 of every 100 customers finish checkout in under 1 second.'}
          - {line: 3, tip: 'Write the assumptions down; everyone then knows the design must change if they turn out wrong.'}
          - {line: 5, tip: 'Say what you''ll give up in advance, so nobody is surprised later.'}
      - type: quote
        body: 'If you don''t turn the business goal into numbers, a design has no yardstick.'
    aside:
      - type: tips
        items:
          - 'Ask product or the business: "What do we lose if we don''t?" The answer shows how much it matters.'
          - 'When you hear "properly" or "fast", ask for numbers: how many seconds, how many people, how much money.'
      - type: refs
        items:
          - {to: 'thinking/quality-attributes', label: 'Quality attributes and trade-offs'}
    check:
      q: 'You hear "lots of customers will come at Eid." What do you ask before designing?'
      a: 'How many? Orders per minute, for how long, and what last year''s figure was. Without numbers you can''t say which design is enough.'

  - slug: roi-thinking
    title: 'ROI: which work comes first?'
    kind: howto
    tldr: 'Measure each project''s cost and yearly gain, then see how long payback takes. Whatever earns back its cost soonest goes first.'
    keywords: ['ROI', 'payback', 'cost benefit', 'prioritization', 'return on investment']
    blocks:
      - type: text
        body: |
          To the business, every project is an investment. Before buying a fridge, a shopkeeper asks, "How many days until it pays for itself?" An engineer can ask the same. ROI (Return on Investment) = (yearly gain − cost) ÷ cost. Payback = cost ÷ monthly gain. The numbers here are examples.
      - type: code
        lang: text
        file: 'roi-comparison.txt'
        variant: good
        code: |
          Project                       Cost       Yearly gain       ROI      Payback
          A. Add a cache to checkout    300,000    600,000           +100%    6 months
             (server cost saved 200,000 + lost orders recovered 400,000)
          B. New admin dashboard        500,000    200,000           -60%     30 months
             (saves support hours)
          C. Split into services        1,200,000  900,000           -25%     16 months
             (pays off if the team grows later)

          Calculation: A = (6-3)/3 = 1.0 -> 100%; payback = 3/(6/12) = 6 months (in units of 100,000)
          Caution: the gain figures are estimates; risk reduction isn't counted here.
        marks:
          - {line: 3, tip: 'Write down where the gain comes from. If you don''t explain how 600,000 arrives, nobody will believe it.'}
          - {line: 9, tip: 'The ROI formula worked by hand. Anyone can check it for themselves.'}
          - {line: 10, tip: 'Not all value can be put in taka, such as reduced security risk. ROI is only one lens.'}
      - type: visual
        kind: bars
        caption: 'Months until the cost is earned back (lower is better)'
        items:
          - {label: 'A. cache', value: 6, display: '6 months', tone: good, tip: 'It earns back its cost fastest, so it goes first.'}
          - {label: 'C. split services', value: 16, display: '16 months', tone: warn, tip: 'The gain depends on the future, so it is uncertain.'}
          - {label: 'B. dashboard', value: 30, display: '30 months', tone: bad, tip: 'It doesn''t earn back its cost even in a year; this one can wait.'}
      - type: quote
        body: 'ROI doesn''t make the decision. It only shows how quickly each project earns back its cost.'
    aside:
      - type: pitfalls
        items:
          - 'Taking the ROI numbers as truth. They are estimates, so present them as a range.'
          - 'Security, compliance and risk-reduction work looks small in ROI, yet the loss from skipping it is big. Treat it separately.'
      - type: refs
        items:
          - {to: 'infra/finops', label: 'Accounting for cloud costs'}
    check:
      q: 'Which project goes first: A, which pays back in 6 months, or B at 30 months?'
      a: 'A, because it earns back its cost quickly. If B has a risk or legal side, that is a separate consideration, even though its gain is smaller.'

  - slug: time-vs-quality
    title: 'Fast or good: where to give, where not to'
    kind: compare
    tldr: 'Not every place needs the same quality. Cut corners where a mistake is cheap, but never on money, security or data.'
    keywords: ['time to market', 'quality', 'speed vs quality', 'tech debt', 'cutting corners']
    blocks:
      - type: text
        body: |
          On the night before Eid, a tailor might make the inner seams a little coarser, but he never gets the fabric measurements wrong. He cuts corners where the customer won't notice or where it's easy to fix. Software works the same way: when time is short, decide first where you can give.
      - type: visual
        kind: compare
        caption: 'Where you can give, and where you can''t'
        columns:
          - title: 'Can give when time is short'
            tone: good
            icon: check
            tip: 'A mistake here costs little, and it is easy to fix later.'
            items:
              - 'Styling of the admin pages'
              - 'Speed of a rarely used report'
              - 'Internal code polish (log the debt)'
              - 'A friendly message for a rare edge case'
          - title: 'Cannot give'
            tone: bad
            icon: shield
            tip: 'A mistake here means losing money or trust, and it is hard to fix later.'
            items:
              - 'Accuracy of money and orders'
              - 'Permission checks and security'
              - 'Data loss or backups'
              - 'Users'' personal data'
      - type: points
        title: 'What you must do when you give'
        style: check
        items:
          - 'Write down what you gave up, as a debt.'
          - 'Set when you''ll pay it back: a date or a sprint.'
          - 'Tell the business what risk you are taking.'
      - type: quote
        body: 'You can trade quality for speed, but a hidden debt keeps growing.'
    aside:
      - type: story
        title: 'Cutting corners on the seams'
        body: |
          In its rush to launch, one startup left the admin pages unfinished but wrote the payment tests in full. Two months later the admin pages were fixed, and nothing ever went wrong with payments. The corner was cut in the right place.
      - type: pitfalls
        items:
          - 'Imagine a team skipping the duplicate-charge test to launch a week sooner. One slow-network day, 300 customers are charged twice; refunds and lost trust cost more than that week.'
          - 'Calling everything "cuttable". If an admin page holds the refund button, it isn''t cosmetic: check what a page can do before you cut it.'
      - type: refs
        items:
          - {to: 'thinking/tech-debt', label: 'Tech debt: borrowing and repaying'}
    check:
      q: 'Time is short. Which do you cut: the polish on the admin pages, or the payment tests?'
      a: 'The admin page polish. A payment bug costs both money and trust, and is hard to fix later.'

  - slug: regulation-as-input
    title: 'Legal rules: an input at the start of design'
    kind: concept
    tldr: 'Legal rules decide where data lives, for how long, and who may see it. Learn them at the start of design, not at the end.'
    keywords: ['regulation', 'compliance', 'data residency', 'audit', 'retention', 'regulator']
    blocks:
      - type: text
        body: |
          To open a pharmacy you need a licence from the drug regulator, and there are rules on where medicines may be stored. Draw the shop layout first and you'll have to tear it down and rebuild. Software is the same. Picture a small loan app that keeps customer records in a cloud region abroad. A year in, the regulator says financial data must stay inside the country. Now the database, the backups and the logs all have to move while live customers keep paying, and that can take months. One question in week one would have cost an afternoon.
      - type: visual
        kind: steps
        caption: 'From legal rules to design decisions: five questions'
        steps:
          - {title: '1. What data?', body: 'Is there personal, financial or health data?', tip: 'The kind of data decides which rules apply. Start by listing your data.'}
          - {title: '2. Where will it live?', body: 'Must it stay in the country? Which cloud regions are allowed?', tip: 'Some rules require data to stay inside the country. That affects your choice of cloud region.'}
          - {title: '3. How long do we keep it?', body: 'How long must we keep it, and when must we delete it?', tip: 'There are minimum retention periods, but personal data also can''t be kept longer than needed.'}
          - {title: '4. Who can see it?', body: 'Who has access to which data, and where is the record?', tip: 'Limiting access and keeping an audit log are common demands of almost every set of rules.'}
          - {title: '5. What is the proof?', body: 'What will you show when an auditor comes?', tip: 'Following the rules is not enough; you have to show it. Proof is part of the design.'}
      - type: quote
        body: 'Legal rules can''t be changed. So they are a constraint at the start of design, not a hassle at the end.'
    aside:
      - type: pitfalls
        items:
          - 'Putting the legal side off with "I''ll look at it later". Moving data to a different location later is very expensive.'
          - 'Interpreting the law yourself. For a specific rule, talk to compliance or a legal expert.'
      - type: refs
        items:
          - {to: 'security/data-protection', label: 'Data protection'}
          - {to: 'security/supply-chain-compliance', label: 'Compliance and the supply chain'}
    check:
      q: 'Why do you need to know the legal rules at the start of design?'
      a: 'Because if data location, retention and access aren''t settled early, changing them later takes months. With the rules assumed up front, the design is right the first time.'

  - slug: regulation-worked-example
    title: 'Worked example: the five questions for a small loan app'
    kind: howto
    tldr: 'Answer the five questions in writing before design. Each answer becomes something you can build or check: a region, a purge job, an access rule, an audit table.'
    keywords: ['compliance', 'retention', 'audit log', 'data residency', 'decision record', 'purge job']
    blocks:
      - type: text
        body: |
          Back to the loan app. Before any design, fill in one page. The numbers and rules below are examples; your real ones come from a compliance person or a lawyer. Notice that every answer ends in something you can build or check.
      - type: code
        lang: text
        file: 'docs/compliance/loan-app.txt'
        variant: good
        code: |
          App: small loan app (name, phone, national ID photo, loan history)

          1. What data?   Personal (name, phone, ID photo) and financial (loan history).
          2. Where?       Database, backups and logs: a data centre inside Bangladesh.
                          (assumed rule: financial data stays in the country)
          3. How long?    Loan records: keep 7 years after the loan closes (assumed).
                          Rejected applicant's ID photo: delete after 90 days.
          4. Who sees?    Support: name and phone only. Collections: loan history.
                          ID photos: 2 named admins. Every view is logged.
          5. Proof?       audit_log table (append-only) + a monthly export for the auditor.

          Without this page: the region is picked by habit, photos are kept forever,
          and the auditor hears "we think so".
        marks:
          - {line: 4, tip: 'The region is now a design input, chosen on day one. Backups and logs count too: a copy abroad breaks the rule as much as the database does.'}
          - {line: 7, tip: 'A rule with a number can become a job. The next block builds this line.'}
          - {line: 9, tip: 'Access is by role, not by default. Logging every view is what makes question 5 answerable.'}
      - type: code
        lang: sql
        file: 'jobs/purge-rejected-id-photos.sql'
        variant: good
        code: |
          -- Nightly job (PostgreSQL), run by the Symfony Scheduler. Rule from question 3.
          WITH purged AS (
            DELETE FROM id_documents d
            USING applications a
            WHERE d.application_id = a.id
              AND a.status = 'rejected'
              AND a.decided_at < now() - interval '90 days'
            RETURNING d.id
          )
          INSERT INTO audit_log (action, subject_id, at)
          SELECT 'id_document_purged', id, now() FROM purged;
        marks:
          - {line: 7, tip: 'The 90 days from question 3, written once, in the one place that enforces it.'}
          - {line: 10, tip: 'Delete and log are one statement, so a photo is never gone without a record. This row is the proof for question 5.'}
    aside:
      - type: pitfalls
        items:
          - 'Copying the example numbers. The 7 years and 90 days here are made up; yours come from compliance.'
          - 'Deleting from the live table but forgetting backups, logs and exports. The rule covers every copy.'
      - type: when
        use:
          - 'The app holds personal, financial or health data'
          - 'Before you pick a cloud region or a database'
        avoid:
          - 'A throw-away prototype with fake data (redo this page before real data arrives)'
          - 'Deciding what the law says; that is for compliance or a lawyer'
    check:
      q: 'In the loan app, which answer tells you to build a nightly purge job, and what else must the job write?'
      a: 'Question 3: rejected ID photos are deleted after 90 days. For each deletion the job also writes an audit_log row, which is the proof for the auditor.'

flashcards:
  - q: 'What does it mean to turn a business goal into a design constraint?'
    a: 'To convert business talk ("lots of customers at Eid") into a measurable quality with numbers ("500 orders/min").'
    more: |
      You can't design from words like "fast", "secure" or "a lot". Asking for numbers shows how much is needed and how much is spare. This translation is one of the architect's most important jobs.
    ref: goals-to-constraints
  - q: 'Which design decisions follow from "customers must never lose money"?'
    a: 'Correctness and audit: transactions, a ledger, idempotency. Here, accuracy matters more than speed.'
    more: |
      There is no room to compromise with money. A double charge or a lost transaction damages trust. So you decide up front that this part gets the strictest rules. More in [[ledgers/modeling-money|modelling money]].
    ref: goals-to-constraints
  - q: 'How is ROI calculated?'
    a: 'ROI = (yearly gain − cost) ÷ cost. A cost of 300,000 taka and a gain of 600,000 taka is 100%.'
    more: |
      ROI shows what percentage comes back. Look at payback alongside it: how many months until the cost is earned back. With a cost of 300,000 and a yearly gain of 600,000, you gain 50,000 a month, so payback is 6 months.
    ref: roi-thinking
  - q: 'What are the limits of ROI?'
    a: 'The gain figures are estimates, and value like security or risk reduction is hard to measure in money.'
    more: |
      Compliance and backup work looks small in ROI, yet skipping it can cost enormously. So look at ROI and the risk list together. When you quote numbers, give a range, such as "400,000 to 600,000".
    ref: roi-thinking
  - q: 'When time is short, where can you cut corners?'
    a: 'Where a mistake is cheap and easy to fix later, such as admin pages and rarely used reports. Never on money, security or data.'
    more: |
      Not all trade-offs are equal. You can give where customers don't directly notice and where it is easy to fix. When you do, write it down as a debt, set a date to repay it, and tell the business about the risk.
    ref: time-vs-quality
  - q: 'What should you do when you take on debt to ship faster?'
    a: 'Write it down, set a date to repay it, and tell the business.'
    more: |
      A hidden debt grows: nobody knows about it, so nobody repays it, and one day it turns up as a big problem. A written-down debt is a deliberate choice, not a regret. More in [[thinking/tech-debt|tech debt]].
    ref: time-vs-quality
  - q: 'Why do you need to know legal rules at the start of design?'
    a: 'Changing data location, retention and access later is expensive. Assume the rules up front and the design is right first time.'
    more: |
      Cloud region, database and log structure are settled early. Changing them later to follow a rule can take months. Don't interpret a specific law yourself; talk to compliance or a legal expert.
    ref: regulation-as-input
  - q: 'What five questions turn legal rules into design?'
    a: 'What data? Where will it live? For how long? Who can see it? What proof will you show an auditor?'
    more: |
      The five questions start from a list of your data. The answers decide where the database sits, how deletion works, how access is controlled and what the audit log holds. Write the answer to each one down.
    ref: regulation-as-input
  - q: 'What can go wrong if you learn the legal rules only after launch?'
    a: 'Data, backups and logs may have to move while live customers keep using the app, which can take months.'
    more: |
      Say a loan app keeps its data in a cloud region abroad, and a rule later says financial data must stay in the country. Now the database, backups, logs and analytics exports all have to move. One question in the first week avoids that bill.
    ref: regulation-as-input
  - q: 'How does a rule like "delete rejected ID photos after 90 days" become part of the system?'
    a: 'As a scheduled job that deletes the data and writes an audit_log row for each deletion, so you can prove it ran.'
    more: |
      The 90 days is written once, in the job's query. Delete and log happen in one statement, so a photo is never gone without a record. The 90 days and 7 years in this example are made up; the real figures come from compliance.
    ref: regulation-worked-example

quiz:
  - q: 'Marketing says, "We want the offer two weeks before Eid." Rakib''s team wants two months to perfect the whole system. What is the best first step?'
    hint: 'What is the offer''s real value to the business?'
    options:
      - text: 'Tell them it will simply take two months'
        correct: false
        why: 'It ignores the business deadline; miss the season and the offer has no value.'
      - text: 'Ask marketing which parts are essential before Eid, then ship the core in two weeks'
        correct: true
        why: 'Understanding the goal, you ship the minimum useful part first and polish the rest afterwards.'
      - text: 'Try to do everything in two weeks without asking questions'
        correct: false
        why: 'Cutting corners on money or security as well causes big losses.'
      - text: 'Ask them to cancel the offer'
        correct: false
        why: 'It wastes a business opportunity; finding alternatives is the engineer''s job.'
    ref: perfect-but-late
  - q: 'The business says, "The site must be fast." What do you do before designing?'
    hint: 'How fast is "fast"?'
    options:
      - text: 'Add an index to every query'
        correct: false
        why: 'Adding indexes without knowing what is slow, or how slow, is wasted work and slows writes.'
      - text: 'Ask for numbers: which page, under how many seconds, for how many users'
        correct: true
        why: 'You can''t measure "fast" without numbers. Once the target is set, you can decide which design is enough.'
      - text: 'Move the whole app to a new framework'
        correct: false
        why: 'A huge decision without knowing the problem, with high risk and cost.'
      - text: 'Buy a more powerful server'
        correct: false
        why: 'Spending without knowing the cause; if the problem is in the code or a query, a server won''t fix it.'
    ref: goals-to-constraints
  - q: 'Two projects: X costs 400,000 taka and earns 800,000 a year; Y costs 600,000 and earns 300,000 a year. What is X''s payback?'
    hint: 'Monthly gain = 800,000 ÷ 12.'
    options:
      - text: '6 months'
        correct: true
        why: 'Monthly gain is about 67,000; 400,000 ÷ 67,000 ≈ 6 months. (X earns 800,000 a year, twice its cost.)'
      - text: '12 months'
        correct: false
        why: 'If a year''s gain is twice the cost, the cost is earned back in half a year.'
      - text: '24 months'
        correct: false
        why: 'This is closer to Y. X''s gain is much higher.'
      - text: 'It can''t be said'
        correct: false
        why: 'With the cost and the monthly gain, payback is easy to calculate.'
    ref: roi-thinking
  - q: 'Which of these can be cut when time is short?'
    hint: 'A mistake is cheap and easy to fix.'
    options:
      - text: 'Styling of the admin pages'
        correct: true
        why: 'Customers don''t see them, and they are easy to fix later.'
      - text: 'Speed of a rarely used report'
        correct: true
        why: 'It slows down a few people''s work, so the harm is small, and it can be fixed later.'
      - text: 'Payment tests'
        correct: false
        why: 'A money mistake is hard to fix, and trust is lost too.'
      - text: 'The rules for storing users'' passwords'
        correct: false
        why: 'There is no room to give on security; once leaked, it can''t be undone.'
    ref: time-vs-quality
  - q: 'A new project will store users'' personal data. When should you look at the legal rules?'
    hint: 'How hard is it to move data to a different location?'
    options:
      - text: 'The week before launch'
        correct: false
        why: 'By then the database and region are fixed, and changing them takes months.'
      - text: 'At the start of design, with a data list and the five questions'
        correct: true
        why: 'If location, retention and access are settled at the start, the design is right the first time.'
      - text: 'When the auditor arrives'
        correct: false
        why: 'By then the problem is deep, and building proof is hard.'
      - text: 'Never; the law is not an engineer''s concern'
        correct: false
        why: 'Engineers own the design; they have to take the constraints on board together with a legal expert.'
    ref: regulation-as-input
  - q: 'A rule says rejected applicants'' ID photos must be deleted after 90 days. What do you build?'
    hint: 'A rule you can''t prove you followed is only half followed.'
    options:
      - text: 'A note in the team wiki asking admins to delete old photos when they remember'
        correct: false
        why: 'Manual steps get forgotten, and nothing proves they happened.'
      - text: 'Hide the photos in the admin screen but keep them in the database'
        correct: false
        why: 'Hidden is not deleted. The data still exists, so the rule is broken, and a leak would still expose it.'
      - text: 'A nightly job that deletes the photos and writes an audit_log row for each one'
        correct: true
        why: 'The rule is enforced automatically, and the audit rows are the proof for the auditor.'
      - text: 'Nothing yet; wait until the auditor asks'
        correct: false
        why: 'By then photos older than 90 days exist, and you can''t show a history of following the rule.'
    ref: regulation-worked-example
  - q: 'You took on debt to launch quickly. What is the best next step?'
    hint: 'The interest on hidden debt keeps growing.'
    options:
      - text: 'Write the debt down, set a sprint to repay it, and tell the business about the risk'
        correct: true
        why: 'Visible debt stays under control: everyone knows, and there is a repayment plan.'
      - text: 'Tell nobody and hope nothing happens'
        correct: false
        why: 'A hidden debt shows up as a sudden big problem.'
      - text: 'Get busy with the next feature'
        correct: false
        why: 'If a debt isn''t written down, nobody remembers it, and it never gets repaid.'
      - text: 'Stop all work and repay the debt first'
        correct: false
        why: 'Repaying matters, but the timing has to be set against the business''s priorities.'
    ref: time-vs-quality
