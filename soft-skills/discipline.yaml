slides:
  - slug: hype-train
    title: 'সবাই যাচ্ছে, তাই আমরাও?'
    kind: story
    tldr: 'নতুন প্রযুক্তি আকর্ষণীয়, কিন্তু অন্যের সমস্যার সমাধান নিজের ঘাড়ে চাপালে ছয় মাস ফিচার বন্ধ থাকে।'
    keywords: ['hype', 'resume driven development', 'trend', 'microservices', 'হাইপ', 'প্রযুক্তি বাছাই']
    blocks:
      - type: text
        body: |
          ৫ জনের টিমে রাকিব বলল, "বড় কোম্পানিগুলো microservices আর Kubernetes ব্যবহার করে, আমরাও করি।" ছয় মাস গেল ইনফ্রাস্ট্রাকচারে। এই সময়ে একটাও নতুন ফিচার বেরোয়নি, আর ব্যবহারকারী ছিল দুই হাজার। সমস্যাটা প্রযুক্তির ছিল না; প্রশ্নটাই করা হয়নি, "আমাদের কোন সমস্যার জন্য?"
      - type: metaphor
        icon: tag
        title: 'এ বছরের ঈদ-ট্রেন্ড পোশাক'
        body: |
          ঈদ-বাজারে সবাই যে পোশাক কিনছে, তা তোমার মাপে না-ও লাগতে পারে। দাম বেশি, ফোলা হাতা, আর সব দোকানে একই। আগে নিজের মাপ জানা দরকার, তারপর ট্রেন্ড দেখা।
      - type: visual
        kind: compare
        caption: 'ছয় মাস পরে দুই টিমের অবস্থা'
        columns:
          - title: 'হাইপের পেছনে'
            tone: bad
            icon: fire
            tip: 'সমস্যা জানার আগেই সমাধান কিনে ফেলা।'
            items:
              - 'ইনফ্রাস্ট্রাকচারে ৬ মাস'
              - 'নতুন ফিচার শূন্য'
              - 'জটিলতা সামলাতে আলাদা লোক দরকার'
          - title: 'সমস্যা আগে'
            tone: good
            icon: target
            tip: 'আগে নিজের সমস্যা মেপেছে, তারপর যতটুকু দরকার ততটুকু নিয়েছে।'
            items:
              - 'একটা monolith, ভালোভাবে চলছে'
              - 'ছয়টা ফিচার বেরিয়েছে'
              - 'প্রয়োজন দেখা দিলে তখন ভাগ করবে'
      - type: quote
        body: 'কেউ ব্যবহার করে বলেই তোমারও দরকার, এমন নয়। আগে নিজের সমস্যা মাপো।'
    aside:
      - type: problem
        body: 'এই segment শেখায় নতুন কিছু শেখার সময় সংশয়ী থাকা, নিয়মের চেয়ে বাস্তবতাকে গুরুত্ব দেওয়া, আর নিজের সিদ্ধান্তের দীর্ঘমেয়াদি ফলের দায় নেওয়া।'
      - type: refs
        items:
          - {to: 'thinking/monolith-microservices', label: 'Monolith বনাম microservices'}
    check:
      q: 'রাকিবের টিমের ছয় মাস নষ্ট হলো কেন?'
      a: 'তারা নিজেদের সমস্যা মাপেনি। বড় কোম্পানির সমাধান তাদের ছোট সমস্যার জন্য বাড়তি জটিলতা, আর কেউ জিজ্ঞেস করেনি "আমাদের কোন সমস্যার জন্য?"'

  - slug: skeptical-learning
    title: 'নতুন কিছু শেখো, কিন্তু প্রশ্ন করো'
    kind: howto
    tldr: 'নতুন প্রযুক্তি দেখলে পাঁচ প্রশ্ন করো: কী সমস্যা, কার সমস্যা, কত খরচ, কেউ বছর ধরে চালিয়েছে কি না, ফেরা যায় কি না।'
    keywords: ['skepticism', 'technology evaluation', 'spike', 'adoption', 'সংশয়', 'মূল্যায়ন']
    blocks:
      - type: text
        body: |
          শেখা থামানো ঠিক নয়, আবার সবকিছু ঝাঁপিয়ে নেওয়াও নয়। বাজারে নতুন ওষুধ এলে ফার্মাসিস্ট জিজ্ঞেস করে: কাদের জন্য, কী পরীক্ষা হয়েছে, পার্শ্বপ্রতিক্রিয়া কী। প্রযুক্তির বেলায়ও একই সংশয় দরকার। নিচের পাঁচ প্রশ্ন একটা ছোট মূল্যায়ন ছকে বসিয়ে নাও।
      - type: code
        lang: text
        file: 'tech-evaluation.txt'
        variant: good
        code: |
          প্রযুক্তি: ...........   মূল্যায়নকারী: ........   তারিখ: ........

          ১. কোন সমস্যা সমাধান করে?
             আমাদের সেই সমস্যা আছে? প্রমাণ (সংখ্যা): ........
          ২. বিকল্প কী? বর্তমান উপায়ে কেন চলছে না?
          ৩. খরচ: শেখা + চালানো + বদলানো। কত মানুষ-মাস?
          ৪. প্রমাণ: কেউ আমাদের মতো আকারে ≥ ২ বছর প্রোডাকশনে চালিয়েছে?
             (বিক্রেতার blog নয়, ব্যবহারকারীর অভিজ্ঞতা)
          ৫. ফেরা যায়? ফেরার খরচ কত?

          পরীক্ষা: এক সপ্তাহের spike, একটা ছোট ও কম ঝুঁকির কাজে।
          সিদ্ধান্ত: গ্রহণ / পরীক্ষা চালাও / পরে দেখব / না     কারণ: ........
        marks:
          - {line: 3, tip: 'সমস্যা না থাকলে সমাধান অর্থহীন। সংখ্যায় দেখাও আমাদের সমস্যাটা কত বড়।'}
          - {line: 6, tip: 'শিখতে সময় লাগে, চালাতে লোক লাগে, বদলাতে আবার সময় লাগে। তিনটাই ধরো।'}
          - {line: 8, tip: 'নতুন প্রযুক্তির সমস্যাগুলো প্রোডাকশনে বছর ধরে চালালে বেরোয়। অন্যের অভিজ্ঞতা তাই মূল্যবান।'}
          - {line: 12, tip: 'আগে সীমিত পরীক্ষা (spike); সফল হলে ধীরে ধীরে বাড়াও।'}
      - type: visual
        kind: steps
        caption: 'নতুন প্রযুক্তি গ্রহণের চার ধাপ'
        steps:
          - {title: '১. সমস্যা মাপো', body: 'নিজেদের কোন সমস্যা, কত বড়, সংখ্যায়।', tip: 'সমস্যা না থাকলে সমাধান কেনার দরকার নেই।'}
          - {title: '২. প্রশ্ন করো', body: 'পাঁচ প্রশ্নের উত্তর লেখো।', tip: 'উত্তর লেখার সময় অনেক হাইপ নিজেই ধরা পড়ে।'}
          - {title: '৩. ছোট spike', body: 'এক সপ্তাহ, কম ঝুঁকির কাজে।', tip: 'বড় সিদ্ধান্তের আগে ছোট অভিজ্ঞতা সংগ্রহ।'}
          - {title: '৪. সিদ্ধান্ত ও রেকর্ড', body: 'গ্রহণ বা বাতিল, কারণসহ লিখে রাখো।', tip: 'পরের বছর কেউ প্রশ্ন করলে উত্তর থাকে।'}
      - type: quote
        body: 'আগে সমস্যা, তারপর সমাধান। উল্টোটা করলে সমাধানটাই সমস্যা হয়ে দাঁড়ায়।'
    aside:
      - type: pitfalls
        items:
          - 'বিক্রেতার কনফারেন্স বক্তৃতাকে নিরপেক্ষ প্রমাণ ধরা।'
          - 'Resume-driven development: নিজের জীবনবৃত্তান্তের জন্য প্রযুক্তি বাছা।'
      - type: refs
        items:
          - {to: 'hands-on/prototyping-profiling', label: 'ছোট spike ও prototype'}
    check:
      q: 'নতুন প্রযুক্তি বিবেচনায় সবচেয়ে প্রথম কোন প্রশ্ন, আর কেন?'
      a: '"আমাদের কোন সমস্যার জন্য, আর সেই সমস্যা কত বড়?" সমস্যা না জানলে সমাধান যতই ভালো হোক, তা বাড়তি খরচ হয়ে দাঁড়ায়।'

  - slug: fundamentals-vs-tools
    title: 'কী শিখলে ১০ বছর কাজে লাগে'
    kind: compare
    tldr: 'টুল বদলায় প্রতি কয়েক বছরে, মৌলিক ধারণা বদলায় না। শেখার সময়ের বেশিরভাগ মৌলিকে, কিছুটা টুলে দাও।'
    keywords: ['fundamentals', 'learning', 'T-shaped', 'career', 'মৌলিক', 'শেখা']
    blocks:
      - type: text
        body: |
          পুরনো দিনের হিসাবরক্ষকরা খাতা-কলমে হিসাব রাখতেন, এখন সবাই এক্সেল ব্যবহার করে। টুল বদলেছে, কিন্তু ডেবিট-ক্রেডিটের নিয়ম একই। প্রযুক্তিতেও তা-ই। framework-এর নতুন সংস্করণ শিখতে হয় বারবার; transaction, caching বা consistency-র ধারণা শিখলে বছরের পর বছর কাজে লাগে।
      - type: visual
        kind: compare
        caption: 'টুল বনাম মৌলিক: শেখার বিনিয়োগ'
        columns:
          - title: 'টুল (দ্রুত বদলায়)'
            tone: warn
            icon: tools
            tip: 'কাজে লাগে, কিন্তু কয়েক বছরে পুরনো হয়। দরকারমতো শেখো।'
            items:
              - 'framework-এর নতুন সংস্করণ'
              - 'নতুন ORM বা library'
              - 'নির্দিষ্ট ক্লাউডের কনসোল'
          - title: 'মৌলিক (দীর্ঘস্থায়ী)'
            tone: good
            icon: book
            tip: 'এগুলো যেকোনো টুলেই কাজে লাগে। দীর্ঘ মেয়াদে সবচেয়ে বড় বিনিয়োগ।'
            items:
              - 'ডেটা মডেলিং ও transaction'
              - 'concurrency ও failure'
              - 'network, caching, security'
              - 'trade-off ও যোগাযোগ'
      - type: points
        title: 'সাপ্তাহিক শেখার অভ্যাস'
        style: number
        items:
          - 'সপ্তাহে ২ ঘণ্টা মৌলিক: একটা বই-অধ্যায় বা নিবন্ধ পড়ে নিজের ভাষায় লেখো।'
          - 'মাসে একটা ছোট প্রজেক্ট বা spike, শেখা জিনিস হাতে চালাও।'
          - 'কাজে ঠেকলে তখনই টুল শেখো (just in time), বাকি টুল নিয়ে দুশ্চিন্তা নয়।'
      - type: quote
        body: 'টুল ভাড়া করা জামা, মৌলিক নিজের শরীর। শরীর গড়ো আগে।'
    aside:
      - type: tips
        items:
          - 'যা শিখলে অন্যকে বুঝিয়ে বলো, বা টিমে ছোট আলোচনা করো; বোঝা গভীর হয়।'
          - 'কোনো ধারণা বছরের পর বছর টিকে থাকলে সেটা মৌলিক; তিন বছরে বদলে গেলে টুল।'
      - type: remember
        body: 'নীতি ১০ বছর, টুল ৩ বছর। শেখার সময়ও সেই অনুপাতে ভাগ করো।'
    check:
      q: 'সপ্তাহে ২ ঘণ্টা শেখার সময় আছে। কোনটায় বেশি দেবে: framework-এর নতুন version, নাকি transaction-এর ধারণা?'
      a: 'transaction-এর ধারণা। এটা যেকোনো টুলে কাজে লাগে, আর framework-এর নতুন version কাজে ঠেকলে তখন শেখা যায়।'

  - slug: pragmatism-over-purity
    title: 'নিয়ম ভাঙার আগে উদ্দেশ্য বোঝো'
    kind: concept
    tldr: 'প্রতিটা নিয়মের পেছনে একটা সমস্যা আছে। সমস্যাটা তোমার প্রকল্পে না থাকলে নিয়ম মানার চেয়ে সরল পথ ভালো।'
    keywords: ['pragmatism', 'purity', 'YAGNI', 'over-engineering', 'বাস্তববাদ', 'নিয়ম']
    blocks:
      - type: text
        body: |
          ঘরে চারজনের রান্নায় বিয়েবাড়ির মতো সংগঠন বানালে রান্না শেষ হয় না। নিয়মগুলোর একটা উদ্দেশ্য আছে। উদ্দেশ্য তোমার ক্ষেত্রে না থাকলে নিয়মটা বাড়তি ভার। পরিমিত জটিলতা রাখো: যতটুকু সমস্যা, ততটুকু সমাধান।
      - type: visual
        kind: table
        caption: 'নিয়মের উদ্দেশ্য আর কখন সরল পথ ভালো'
        headers: ['নিয়ম', 'উদ্দেশ্য', 'কখন সরল পথ চলে']
        rows:
          - cells: ['সব কিছুতে interface আর repository', 'ডেটা-উৎস বদলানো সহজ', 'উৎস বদলানোর সম্ভাবনা নেই']
            tip: 'বদলানোর সম্ভাবনা না থাকলে বাড়তি স্তর শুধু পড়া কঠিন করে।'
          - cells: ['১০০% test coverage', 'গুরুত্বপূর্ণ আচরণ সুরক্ষিত', 'সরল অ্যাডমিন CRUD-এ নয়; টাকার কাজে অবশ্যই']
            tip: 'শতাংশ নয়, ঝুঁকিপূর্ণ আচরণ পরীক্ষা হয়েছে কি না, সেটাই মূল।'
          - cells: ['microservices', 'স্বাধীন deploy ও scale', 'ছোট টিম, কম ট্রাফিক হলে monolith']
            tip: 'বেশি টিম বা ভিন্ন scale দরকার হলে ভাগ করো, তার আগে নয়।'
          - cells: ['পুরোপুরি normalized schema', 'ডেটার সঙ্গতি', 'রিপোর্টিংয়ে ইচ্ছাকৃত denormalization']
            tip: 'কারণ লিখে নেওয়া denormalization ঠিক আছে; কারণ না জেনে করলে ঋণ।'
      - type: quote
        body: 'নিয়ম মানো তার উদ্দেশ্য বুঝে। উদ্দেশ্য না থাকলে সরল পথে যাও, আর কারণ লিখে রাখো।'
    aside:
      - type: pitfalls
        items:
          - 'নিয়ম ভাঙার কারণ না লিখে রাখা; পরে কেউ বুঝবে না এটা ইচ্ছাকৃত।'
          - '"পরে লাগতে পারে" ভেবে এখনই জটিল কিছু বানানো (YAGNI: You Aren''t Gonna Need It)।'
      - type: when
        use:
          - 'সমস্যাটা এখনই বাস্তব এবং প্রমাণযোগ্য'
          - 'ভুলের দাম বড়: টাকা, নিরাপত্তা, ডেটা'
        avoid:
          - 'শুধু "ভবিষ্যতে হতে পারে" ভেবে বাড়তি স্তর যোগ'
          - 'অন্যের মনগড়া নিয়ম না বুঝেই মেনে নেওয়া'
    check:
      q: 'ছোট অ্যাডমিন CRUD-এ প্রতিটা class-এর জন্য interface আর repository বানানো কি ভালো?'
      a: 'সাধারণত না। উৎস বদলানোর সম্ভাবনা না থাকলে বাড়তি স্তর শুধু জটিলতা বাড়ায়। সমস্যা বাস্তব হলে তখন যোগ করো।'

  - slug: owning-consequences
    title: 'তোমার সিদ্ধান্ত তিন বছর পরেও চলছে'
    kind: howto
    tldr: 'সিদ্ধান্ত নেওয়ার দায় সেখানেই শেষ নয়। ফলাফল মাপো, নির্দিষ্ট সময়ে ফিরে দেখো, আর ঋণ জমতে দিও না।'
    keywords: ['ownership', 'long term', 'decision review', 'accountability', 'দায়িত্ব', 'দীর্ঘমেয়াদি']
    blocks:
      - type: text
        body: |
          যিনি বাড়ি বানান, তিনি জানেন নকশার ভুল বছর কয়েক পরে ফাটল হয়ে ফোটে। সফটওয়্যারেও আজকের সিদ্ধান্তের ফল পরে এসে ঠেকে, প্রায়ই অন্য কারো ঘাড়ে। দায় নেওয়ার অর্থ: সিদ্ধান্তের ফল মাপা, ছয় মাস পরে ফিরে দেখা, আর ভুল হলে নিজে বলা।
      - type: code
        lang: text
        file: 'docs/decisions/review-after-6-months.txt'
        variant: good
        code: |
          সিদ্ধান্ত: নোটিফিকেশন মূল অ্যাপের ভেতরে module (RFC-0012)
          মালিক: রহিম          তারিখ: ১২ ডিসেম্বর         রিভিউ: ১২ জুন

          আমরা ধরেছিলাম:       দিনে ২ হাজারের কম বার্তা; টিম ৪ জন
          মাপা হবে (সূচক):      দিনে বার্তা, queue-র দেরি (p95), কতবার এই module ভেঙেছে
          ফিরে দেখার প্রশ্ন:
            - ধারণা কি ঠিক ছিল? (বার্তা এখন কত?)
            - যা ভেবেছিলাম, তার চেয়ে কোনটা কঠিন হলো?
            - আজ হলে একই সিদ্ধান্ত নিতাম?
          ফল: ........   পরবর্তী পদক্ষেপ: রাখো / বদলাও / শোধ করো (ঋণ)
        marks:
          - {line: 2, tip: 'একজন মালিক ও আগেই ঠিক করা রিভিউ তারিখ। নইলে "পরে দেখব" কখনো হয় না।'}
          - {line: 4, tip: 'ধারণা লিখে রাখলে পরে মেলানো যায়; ভুল হলে শেখাও যায়।'}
          - {line: 5, tip: 'সংখ্যা ঠিক করা আছে, তাই রিভিউয়ে মত নয়, তথ্য দেখা হবে।'}
          - {line: 9, tip: 'শেষ প্রশ্ন সবচেয়ে সৎ: জেনে-বুঝে আজ আবার একই সিদ্ধান্ত নিতাম কি?'}
      - type: visual
        kind: steps
        caption: 'সিদ্ধান্তের দায় নেওয়ার পাঁচ ধাপ'
        steps:
          - {title: '১. লিখে রাখো', body: 'সিদ্ধান্ত, কারণ, ধারণা: ADR বা RFC-তে।', tip: 'লেখা না থাকলে ছয় মাস পরে কারণটাই হারায়।'}
          - {title: '২. মালিক ঠিক করো', body: 'একজন নাম ধরে দায়িত্বে।', tip: 'সবার দায় মানে কারো দায় নয়।'}
          - {title: '৩. মাপার সূচক', body: 'কোন সংখ্যা দেখলে বুঝব ঠিক চলছে?', tip: 'সূচক আগে ঠিক না থাকলে পরে নিজের পছন্দমতো সংখ্যা বেছে নেওয়া যায়।'}
          - {title: '৪. ফিরে দেখো', body: 'ছয় মাস বা এক বছর পরে রিভিউ।', tip: 'ক্যালেন্ডারে বসিয়ে রাখো; ভুলে যাওয়াই সবচেয়ে স্বাভাবিক।'}
          - {title: '৫. ঋণ শোধ', body: 'ভুল বা জমা ঋণ থাকলে তালিকায় তুলে সময় দাও।', tone: accent, tip: 'বলা আর শোধ করার মধ্যে ফাঁক থাকলে বিশ্বাস কমে।'}
      - type: quote
        body: 'যে সিদ্ধান্ত নেয়, ফলও তার। অন্য কেউ সামলাবে ভেবে ফেলে রেখো না।'
    aside:
      - type: story
        title: 'ছয় মাস পরের রিভিউ'
        body: |
          এক টিম ছয় মাস পরে নিজেদের queue-সিদ্ধান্ত ফিরে দেখল। বার্তা প্রত্যাশার দশ গুণ। তারা সময়ে বুঝে অন্য transport-এ গেল, আর বড় ঘটনা ঘটার আগেই সমস্যা মিটল।
      - type: refs
        items:
          - {to: 'thinking/tech-debt', label: 'tech debt ও তার শোধ'}
    check:
      q: 'সিদ্ধান্তের সাথে "মাপার সূচক" আগে থেকে ঠিক রাখা হয় কেন?'
      a: 'সূচক আগে ঠিক থাকলে রিভিউয়ে মত নয়, তথ্য দেখা হয়। নইলে পরে নিজের পছন্দের সংখ্যা বেছে নেওয়ার প্রবণতা আসে।'

flashcards:
  - q: 'Resume-driven development কী?'
    a: 'প্রকল্পের দরকারে নয়, নিজের জীবনবৃত্তান্ত ভারী করতে নতুন প্রযুক্তি বাছা।'
    more: |
      এতে প্রকল্পে বাড়তি জটিলতা আসে, আর সেটা সামলাতে হয় দলকে। প্রযুক্তি বাছার আগে সমস্যা, বিকল্প আর খরচ লিখে নিলে এই ঝোঁক ধরা পড়ে।
    ref: skeptical-learning
  - q: 'নতুন প্রযুক্তি মূল্যায়নের প্রথম প্রশ্ন কী?'
    a: 'আমাদের কোন সমস্যার সমাধান করে, আর সেই সমস্যা কি আমাদের সত্যিই আছে?'
    more: |
      সমস্যা না থাকলে সমাধান যত ভালোই হোক, তা বাড়তি খরচ। সমস্যাটা সংখ্যায় দেখাও: কত ধীর, কত ঘণ্টা নষ্ট। তারপর খরচ, বিকল্প আর প্রমাণের প্রশ্ন।
    ref: skeptical-learning
  - q: 'নতুন প্রযুক্তির জন্য কেমন প্রমাণ বিশ্বাসযোগ্য?'
    a: 'আমাদের মতো আকারে কেউ কমপক্ষে দুই বছর প্রোডাকশনে চালিয়েছে, তার অভিজ্ঞতা। বিক্রেতার blog নয়।'
    more: |
      নতুন প্রযুক্তির বেশিরভাগ সমস্যা প্রোডাকশনে মাস-বছর পরে বেরোয়। তাই ব্যবহারকারীর অভিজ্ঞতা, সীমাবদ্ধতার আলোচনা আর ব্যর্থতার গল্প দেখো। নিজের আকারের সাথে মেলাও।
    ref: skeptical-learning
  - q: 'Spike কী?'
    a: 'ছোট, সময়-বাঁধা পরীক্ষা (যেমন এক সপ্তাহ), যা দেখে নেয় প্রযুক্তি আমাদের ক্ষেত্রে কাজ করে কি না।'
    more: |
      বড় সিদ্ধান্তের আগে কম ঝুঁকির একটা কাজে নতুন প্রযুক্তি চালিয়ে দেখো। ফল দেখে গ্রহণ, বাতিল বা আরও পরীক্ষা ঠিক করো। spike-এর কোড ফেলে দেওয়া যায়। বিস্তারিত: [[hands-on/prototyping-profiling|prototype ও profiling]]।
    ref: skeptical-learning
  - q: 'টুল বনাম মৌলিক: শেখার সময় কীভাবে ভাগ করবে?'
    a: 'বেশি সময় মৌলিকে (transaction, concurrency, network, trade-off), টুল দরকারমতো, কাজে ঠেকলে।'
    more: |
      টুল ও framework প্রতি কয়েক বছরে বদলায়, মৌলিক ধারণা বদলায় না। মৌলিক জানলে নতুন টুল শিখতে সহজ হয়, কারণ তার পেছনের সমস্যাটা চেনা থাকে। সপ্তাহে ২ ঘণ্টা মৌলিক ও মাসে একটা spike একটা ভালো অভ্যাস।
    ref: fundamentals-vs-tools
  - q: 'Pragmatism over purity মানে কী?'
    a: 'নিয়মের উদ্দেশ্য বুঝে যেখানে সমস্যাটা আছে সেখানে মানা, যেখানে নেই সেখানে সরল পথে যাওয়া।'
    more: |
      প্রতিটা নিয়মের পেছনে একটা সমস্যা। সমস্যা তোমার প্রকল্পে না থাকলে নিয়ম বাড়তি ভার। তবে টাকা, নিরাপত্তা ও ডেটার মতো জায়গায় ছাড় নয়। নিয়ম ভাঙলে কারণ লিখে রাখো।
    ref: pragmatism-over-purity
  - q: 'YAGNI মানে কী?'
    a: 'You Aren''t Gonna Need It: "পরে লাগতে পারে" ভেবে আজ বাড়তি জটিলতা বানিও না।'
    more: |
      ভবিষ্যতের কাল্পনিক দরকারের জন্য আজ স্তর বা সুবিধা বানালে বেশিরভাগ সময় তা কখনো লাগে না, কিন্তু ভার থেকে যায়। সমস্যা বাস্তব হলে তখন যোগ করা সস্তা, বিশেষ করে ফেরা যায় এমন ক্ষেত্রে।
    ref: pragmatism-over-purity
  - q: 'সিদ্ধান্তের সাথে কেন রিভিউ তারিখ ও মাপার সূচক ঠিক করা হয়?'
    a: 'যাতে ছয় মাস পরে ফিরে দেখা যায় ধারণা ঠিক ছিল কি না — মতের ভিত্তিতে নয়, তথ্যের ভিত্তিতে।'
    more: |
      সিদ্ধান্তের ফল সময়ের সাথে আসে। রিভিউ তারিখ ও সূচক আগে ঠিক না থাকলে "পরে দেখব" কখনো হয় না, আর পরে নিজের পছন্দমতো সংখ্যা বাছা যায়। মালিক একজন হলে দায়ও স্পষ্ট থাকে।
    ref: owning-consequences

quiz:
  - q: 'টিমের ২ হাজার ব্যবহারকারী, ৫ জন ডেভেলপার। সবাই বলছে "microservices-এ যাই।" কী প্রশ্ন করবে?'
    hint: 'সমস্যা কোথায়?'
    options:
      - text: '"কোন সমস্যার জন্য? সংখ্যায় দেখাও, আর বিকল্পের খরচ কত?"'
        correct: true
        why: 'সমস্যা মাপলে বোঝা যায় বাড়তি জটিলতা ন্যায্য কি না; ৫ জনের টিমে প্রায়ই নয়।'
      - text: '"বড় কোম্পানিগুলো করে, তাই আমরাও করি।"'
        correct: false
        why: 'তাদের সমস্যা (লক্ষ ব্যবহারকারী, শত ইঞ্জিনিয়ার) আমাদের নয়।'
      - text: '"ভালো হবে কি না জানি না, চলো করে দেখি, ছয় মাস সময় নিয়ে।"'
        correct: false
        why: 'সমস্যা না মেপে বড় বিনিয়োগ; ছোট spike দিয়ে শুরু করা উচিত।'
      - text: '"না, microservices সবসময় খারাপ।"'
        correct: false
        why: 'সবসময় খারাপ নয়; বড় টিম বা ভিন্ন scale-এ কাজের। উত্তর নির্ভর করে সমস্যার ওপর।'
    ref: hype-train
  - q: 'নতুন database-এর মূল্যায়নে নিচের কোন প্রমাণ সবচেয়ে বিশ্বাসযোগ্য?'
    hint: 'কার স্বার্থ আছে?'
    options:
      - text: 'ভেন্ডরের কনফারেন্স বক্তৃতা'
        correct: false
        why: 'ভেন্ডরের বিক্রয়ের স্বার্থ আছে, দুর্বলতা বলে না।'
