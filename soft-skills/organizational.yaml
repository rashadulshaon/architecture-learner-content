slides:
  - slug: marriage-hall-chaos
    title: 'When the wedding arrangements fall apart'
    kind: story
    tldr: 'Even with sound technology, a project runs late if the team, the plan, the time estimates, the vendors and the hiring aren''t right.'
    keywords: ['organizational', 'team', 'roadmap', 'estimation', 'vendor', 'hiring']
    blocks:
      - type: text
        body: |
          In September, Rahim said, "The app launches in November." In November it turned out that the payment team's API wasn't built, the SMS vendor was stuck on contract terms, the new hire never arrived, and the estimate had been a single number: "6 weeks." There was nothing wrong with the code.
      - type: metaphor
        icon: building
        title: 'Arranging a wedding'
        body: |
          A wedding has separate crews for cooking, decorating and looking after guests. If the caterer doesn't show up, everything stalls, so you talk to them well in advance. Who delivers what, and when, is written down. A software project is an event to organise too.
      - type: visual
        kind: table
        caption: 'Where projects break, and which slide in this segment fixes it'
        headers: ['What broke', 'Wedding example', 'Topic']
        rows:
          - cells: ['Unclear who does what', 'The cooking crew is also decorating', 'Team structure']
            tip: 'When responsibilities and boundaries are unclear, nobody finishes anything, and everyone interferes with everyone else''s work.'
          - cells: ['Waiting on another team', 'No caterer, no meal', 'Roadmap and dependencies']
            tip: 'If another team or an outsider doesn''t deliver on time, your work stalls too.'
          - cells: ['A wrong estimate', '"The cooking will be done in fifteen minutes"', 'Estimation']
            tip: 'A single number is a false promise; give a range and your assumptions, and trust stays intact.'
          - cells: ['An outside supplier', 'Not reading the caterer''s terms', 'Vendors and contracts']
            tip: 'A small clause in a contract can do big damage later.'
          - cells: ['The wrong people, or too few', 'A wedding with no cook', 'Hiring']
            tip: 'Fixing a bad hire is the most expensive fix of all.'
      - type: quote
        body: 'Projects most often break outside the code: in people, time and contracts.'
    aside:
      - type: problem
        body: 'A technically strong engineer can still sink under organisational weakness. This segment teaches five fundamentals of organising work.'
      - type: refs
        items:
          - {to: 'thinking/conways-law', label: 'Conway''s Law: how teams and design relate'}
    check:
      q: 'Why did Rahim''s project run late when there was nothing wrong with the code?'
      a: 'The other team''s API, the vendor''s contract and the hiring delay weren''t planned for in advance, and the estimate was a single number, not a range.'

  - slug: team-topology
    title: 'Four kinds of teams'
    kind: concept
    tldr: 'One clear job per team cuts overload and hand-offs. The four kinds: stream-aligned, platform, enabling, complicated-subsystem. Under about 10 engineers, one team is enough.'
    keywords: ['team topologies', 'stream-aligned', 'platform team', 'Conway', 'cognitive load', 'team structure']
    blocks:
      - type: text
        body: |
          Rahim's company had 16 engineers in one team that owned checkout, a pricing model and the deploy pipeline (the machinery that tests and ships code). A pricing bug waited three weeks because its one expert was busy fixing the pipeline, and checkout releases stopped whenever she was away.
      - type: visual
        kind: compare
        caption: 'One team holding everything vs teams with one job each'
        columns:
          - title: 'One team holds everything'
            tone: bad
            icon: cross
            tip: 'Too much for any head to hold. Every job queues behind the same few experts.'
            items:
              - 'Checkout, pricing model and pipeline in one team'
              - 'A pricing bug waits three weeks for its one expert'
              - 'Releases stop when the pipeline person is away'
          - title: 'Each team has one job'
            tone: good
            icon: check
            tip: 'Each team can hold its whole area in its head, so work stops queueing behind one person.'
            items:
              - 'A checkout team that owns only the buying flow'
              - 'Pricing specialists own the model; checkout just calls it'
              - 'A platform team keeps the pipeline healthy for everyone'
      - type: text
        body: |
          A wedding avoids this: one person looks after guests, one supplies kitchen equipment, one trains newcomers, and one cook alone makes the special dish (say, kacchi biryani). The book Team Topologies names the same four roles for teams.
      - type: visual
        kind: table
        caption: 'The four kinds of teams (Team Topologies)'
        headers: ['Type', 'Job', 'Example']
        rows:
          - cells: ['Stream-aligned', 'One flow of the business, start to finish', 'Checkout team']
            tip: 'Most teams are this type. They create value directly for users.'
          - cells: ['Platform', 'Tools that make others'' work easier', 'CI/CD, database platform']
            tip: 'It lowers the load on stream teams. Run the platform like a product, not as a mandatory rulebook.'
          - cells: ['Enabling', 'Teaches other teams new skills', 'Security or testing coach']
            tip: 'It helps for a while, then steps away. It doesn''t create a permanent dependency.'
          - cells: ['Complicated-subsystem', 'Hard specialist work', 'Pricing, ML models']
            tip: 'A part that takes deep expertise to understand, so it lives in its own team.'
      - type: points
        title: 'Rules for splitting teams, and when to skip them'
        style: dot
        items:
          - 'Keep teams small (about 5 to 9 people), so everyone can talk to everyone.'
          - 'Cognitive load is how much a team must keep in its head at once. When it is too much, split the team.'
          - 'Team structure shapes system structure, so decide first what you want to split.'
          - 'Fewer than about 10 engineers? Keep one team; four types would be paperwork. Split when work queues behind one person or nobody understands the whole.'
    aside:
      - type: pitfalls
        items:
          - 'A platform team imposes rules without listening to what its user teams need.'
          - 'Creating one team per service, so nobody sees the whole picture.'
      - type: refs
        items:
          - {to: 'thinking/conways-law', label: 'Conway''s Law'}
    check:
      q: 'One team handles checkout, complex payment rules and CI/CD all at once. What goes wrong, and what do you do?'
      a: 'The cognitive load is too high. Move the hard part to a complicated-subsystem team and CI/CD to a platform team, so the checkout team can focus on its own flow.'

  - slug: roadmap-dependencies
    title: 'Roadmap and dependencies'
    kind: howto
    tldr: 'Write outcomes, not features, in the roadmap (Now / Next / Later). Give every dependency an owner and a date, or the delay shows up at the end.'
    keywords: ['roadmap', 'dependency', 'Now Next Later', 'planning', 'dependency register']
    blocks:
      - type: text
        body: |
          A wedding organiser keeps a list: who delivers what, and when. A project's roadmap and dependency list are the same thing. Put dates on features and you make false promises; give outcomes and time stages and you keep some flexibility.
      - type: code
        lang: text
        file: 'roadmap-and-dependencies.txt'
        variant: good
        code: |
          BEFORE: "Refund feature, 15 Nov"   <- a date that breaks the day the payment API slips

          ROADMAP (Now / Next / Later)
          Now   (this quarter, committed):  checkout p95 under 1 second
          Next  (next quarter, likely):     coupons and offers
          Later (afterwards, uncertain):    payments in foreign currency

          DEPENDENCY REGISTER
          # Dependency              Owner          We need it by   Status       Risk
          1 Payment team refund API  Payment team   15 Nov          In design    High
          2 SMS vendor sandbox       Vendor/Sumi    20 Nov          Contract open  Medium
          3 Security review          Security team  25 Nov          Booked       Low

          Rule: any dependency needed in under 2 weeks with status "In design" or behind
                gets a red flag at the weekly stand-up.
        marks:
          - {line: 1, tip: 'A feature with a date is a promise. It breaks the moment something the feature waits on slips.'}
          - {line: 4, tip: 'Now is a firm commitment, Next is likely, Later is a wish. p95 under 1 second means 95 of every 100 checkouts finish within a second.'}
          - {line: 10, tip: 'Each dependency has one owner and the date we need it. Nobody watches a dependency with no owner.'}
          - {line: 14, tip: 'The needed-by date is close and the work is behind, so it gets a red flag early. Finding out at the last minute does the most damage.'}
      - type: visual
        kind: flow
        caption: 'What our feature stands on'
        nodes:
          - {id: ours, label: 'Refund feature', sub: 'our team', icon: rocket, tone: accent, col: 0, row: 1, tip: 'What we want to deliver on time.'}
          - {id: pay, label: 'Payment team API', sub: 'needed 15 Nov', icon: api, tone: bad, col: 2, row: 0, tip: 'Still in design. The biggest risk.'}
          - {id: sms, label: 'SMS vendor', sub: 'needed 20 Nov', icon: send, tone: warn, col: 2, row: 1, tip: 'The contract is still open, and we need it to get the sandbox, a safe test copy of the vendor''s service. It will take time, but it won''t block the work for now.'}
          - {id: sec, label: 'Security review', sub: 'needed 25 Nov', icon: shield, tone: good, col: 2, row: 2, tip: 'Already booked.'}
        edges:
          - {from: ours, to: pay, label: 'Without the refund API, our work can''t even start'}
          - {from: ours, to: sms, label: 'To text customers, we need the vendor''s sandbox'}
          - {from: ours, to: sec, label: 'The security review must pass before launch'}
      - type: quote
        body: 'A dependency with no owner is the one whose delay surprises you most.'
    aside:
      - type: tips
        items:
          - 'Write outcomes, not features: not "feature X" but "cut checkout drop-off by 20%".'
          - 'Spend 5 minutes a week on the dependency list. If one is red, ask the owner directly.'
      - type: pitfalls
        items:
          - 'Putting exact feature dates on a roadmap; later, the promises break.'
          - 'Hiding a date that really is fixed. If a law or Eid fixes it, write that date down; Now / Next / Later is for work whose date is soft.'
    check:
      q: 'Why use Now / Next / Later on a roadmap instead of exact dates?'
      a: 'Far-off dates carry more uncertainty. Three levels keep committed, likely and uncertain work apart, and avoid false promises.'

  - slug: estimation-ranges
    title: 'Estimation: a range, not a single number'
    kind: howto
    tldr: 'An estimate is a range plus its assumptions, not one number. Three points per task (best, likely, worst) give the expected time and the range.'
    keywords: ['estimation', 'three point', 'PERT', 'range', 'cone of uncertainty']
    blocks:
      - type: text
        body: |
          When someone asks, "How long will this take?", saying "6 weeks" is easy, and wrong. A single number sounds like a promise. A range (say, 15 to 21 days) with the assumptions it depends on lets everyone see the uncertainty up front. The range isn't a feeling: it comes from how far apart each task's best and worst are.
      - type: code
        lang: text
        file: 'estimate-with-ranges.txt'
        variant: good
        code: |
          Task                 best  likely  worst   expected = (best + 4×likely + worst) ÷ 6
          A. OTP at login         3      5     10    (3 + 20 + 10) ÷ 6 = 5.5 days
          B. Coupon model         2      3      6    (2 + 12 + 6) ÷ 6 = 3.3 days
          C. Add SMS vendor       5      8     20    (5 + 32 + 20) ÷ 6 = 9.5 days
          ----------------------------------------------------------------
          Total expected                                           ≈ 18 days

          Spread of one task = (worst - best) ÷ 6:    A 1.2    B 0.7    C 2.5
          Spread of the total = √(1.2² + 0.7² + 2.5²) = √8.2 ≈ 2.9 days
          Range = 18 ± 2.9  ->  15 to 21 days (roughly 2 times in 3)

          Announce: "About 18 days, most likely 15 to 21."
          Assumptions: the vendor sandbox arrives by the 20th; nobody is dedicated to testing.
          Risk: if the vendor is late, C hits its worst case: 5.5 + 3.3 + 20 ≈ 29 days.
        marks:
          - {line: 1, tip: 'Three points: the best case, the most likely, and the worst. This is called the PERT formula.'}
          - {line: 8, tip: 'Spread is the give-or-take. The more a task''s worst case sits above its best, the wider it is. C alone adds 6.25 of the 8.2 under the root.'}
          - {line: 9, tip: 'Spreads are squared, added and rooted, not simply added: tasks rarely all go badly at once. This holds only if they fail independently.'}
          - {line: 12, tip: 'Announce it with a range; avoid giving a single number.'}
          - {line: 13, tip: 'With the assumptions written down, it''s easy to discuss the cause if they turn out wrong.'}
      - type: visual
        kind: bars
        caption: 'Expected days per task (best-worst in brackets)'
        items:
          - {label: 'A. login OTP', value: 5.5, display: '5.5 (3-10)', tone: default, tip: 'Medium uncertainty.'}
          - {label: 'B. coupon model', value: 3.3, display: '3.3 (2-6)', tone: good, tip: 'Small and certain work.'}
          - {label: 'C. SMS vendor', value: 9.5, display: '9.5 (5-20)', tone: bad, tip: 'The widest range, because of an outside dependency.'}
      - type: quote
        body: 'A single number turns into a promise. State the range and the assumptions, and you stay honest.'
    aside:
      - type: pitfalls
        items:
          - 'Treating an estimate as a deadline. An estimate is a guess; a deadline is a promise.'
          - 'Quoting a lower number under pressure. The work doesn''t shrink; the delay just shows up later.'
          - 'Treating the range as a guarantee. It assumes tasks go wrong independently; one shared cause, like a late vendor, hits several at once, so state it as an assumption.'
      - type: refs
        items:
          - {to: 'thinking/estimation', label: 'Estimation in architecture'}
    check:
      q: 'Why is the estimate for task C so wide, 5 to 20 days, and what do you do about it?'
      a: 'It depends on a vendor, which adds uncertainty. First make sure you get the vendor''s sandbox, or run a small spike, to narrow the range.'

  - slug: vendor-contract
    title: 'Vendors and contracts: what to check before signing'
    kind: howto
    tldr: 'If you don''t read the contract, you may have no way out later. Check the SLA, data return, price rises, liability and exit terms first.'
    keywords: ['vendor', 'contract', 'SLA', 'exit clause', 'lock-in', 'negotiation']
    blocks:
      - type: text
        body: |
          A contract with a caterer says how many people's food, what happens if they're late, and what compensation applies if the food is bad. A software vendor is no different. Imagine Sumi's team signs with an SMS gateway for its low first-year price. In year two the price doubles on 30 days' notice, and leaving means waiting 90 days for an export of their data. The salesperson talked nicely, but what counts is in the contract. Run through the list below before you sign.
      - type: code
        lang: text
        file: 'vendor-checklist.txt'
        variant: good
        code: |
          Vendor: SMS gateway X    Evaluator: Sumi    Decision date: 30 November

          [ ] SLA: what is the uptime (say, 99.9%)? What compensation if they miss it?
          [ ] Data return: if we leave, in what format and how fast do we get our data back?
          [ ] Price: fixed for how long? How much notice before a price rise?
          [ ] Exit: how many days' notice? Any minimum term or penalty?
          [ ] Security: where do they keep the data? Which certifications?
          [ ] Liability: if they cause a loss, what is the maximum they owe?
          [ ] Alternative: is a second vendor identified? How fast could we switch?

          Most important for us: data return + exit (to avoid lock-in)
        marks:
          - {line: 3, tip: 'An SLA is a promised uptime. 99.9% still allows about 43 minutes of downtime a month (99% allows over 7 hours). Without compensation, the number is worthless.'}
          - {line: 4, tip: 'You can''t switch vendors without getting your data back. This is the main trap of lock-in.'}
          - {line: 8, tip: 'The liability cap is often tiny, such as one month''s fee. Find out.'}
          - {line: 9, tip: 'With no alternative, you have no bargaining power.'}
      - type: visual
        kind: steps
        caption: 'Five steps to choosing a vendor'
        steps:
          - {title: '1. Write the need', body: 'What problem to solve, which numbers matter?', tip: 'If you don''t write down your needs, the salesperson decides what you want.'}
          - {title: '2. Compare two or three', body: 'Build a matrix and score the options.', tip: 'Talk to only one and you have no room to negotiate.'}
          - {title: '3. Ask for proof', body: 'A sandbox, reference customers, an uptime record.', tip: 'Don''t take their word. Test it yourself.'}
          - {title: '4. Read the contract', body: 'Check the risk terms with the legal team.', tip: 'It''s the small print that divides responsibility. Get legal advice.'}
          - {title: '5. Plan the exit', body: 'Write down in advance how long it would take to switch.', tip: 'Before you sign, know how you would leave.'}
    aside:
      - type: pitfalls
        items:
          - 'Treating a salesperson''s promise as the contract. If it''s not in the contract, it''s nothing.'
          - 'Signing for the low first-year price without reading the price-rise terms.'
      - type: when
        use:
          - 'The vendor holds your data or sits on a critical path, such as payments or SMS login codes'
          - 'The contract has a minimum term or a long notice period'
        avoid:
          - 'A low-spend tool billed monthly that you could swap in a day: read the price and exit terms only'
      - type: refs
        items:
          - {to: 'thinking/build-vs-buy', label: 'Build vs buy'}
    check:
      q: 'To keep a way out of a vendor, which two terms do you check most closely before signing?'
      a: 'Data return (what format, how fast) and the exit terms (notice, penalty). Without those two, you get caught in the vendor''s net.'

  - slug: hiring-scorecard
    title: 'Hiring: a scorecard, not a gut feeling'
    kind: howto
    tldr: 'Ask every candidate the same questions, score them on the same criteria, with evidence. Otherwise "I liked them" becomes the decision.'
    keywords: ['hiring', 'interview', 'scorecard', 'structured interview', 'recruiting']
    blocks:
      - type: text
        body: |
          Two candidates at an interview. One talks the way we do, and we liked them. The other gives less polished answers but is stronger at code. Choose by "liked them" and the first wins. With a scorecard, you compare by scoring against criteria fixed in advance.
      - type: code
        lang: text
        file: 'interview-scorecard.txt'
        variant: good
        code: |
          Role: Backend Engineer    Candidate: A    Interviewer: Sumi    Date: 10 December

          Skill                           Weight  Score (1-4)  Evidence (what they said/did)
          Design (understands trade-offs)    3        3        "separated the cost of queue and cache"
          Code and debugging                 3        4        "spotted N+1 on their own, and fixed it"
          Communication                      2        2        "started without asking, assuming"
          Eagerness to learn                 2        3        "admitted a mistake, had read up"

          Total: 3×3 + 3×4 + 2×2 + 2×3 = 9 + 12 + 4 + 6 = 31 / 40
          Recommendation: Hire / No hire / Another round    Reason: ........
          Rule: each person writes their score first, then we discuss.
        marks:
          - {line: 3, tip: 'The criteria and weights are fixed before the interview; they aren''t changed after seeing a candidate.'}
          - {line: 4, tip: 'Without the evidence column, a score is just an opinion. Write what the candidate said or did.'}
          - {line: 9, tip: 'The arithmetic: 9 + 12 + 4 + 6 = 31, out of a maximum of 40.'}
          - {line: 11, tip: 'If everyone writes their score before the discussion, one person''s view doesn''t sway the rest.'}
      - type: visual
        kind: compare
        caption: 'A chat-style interview vs a structured interview'
        columns:
          - title: 'A casual chat'
            tone: bad
            icon: cross
            tip: 'Each candidate gets a different experience, so comparing is hard, and bias creeps in.'
            items:
              - 'Different questions each time'
              - 'The decision is "I liked them"'
              - 'More points for people like me'
          - title: 'Structured'
            tone: good
            icon: check
            tip: 'The same questions and the same yardstick. Less bias, a fairer comparison.'
            items:
              - 'The same questions for everyone'
              - 'Criteria and weights set in advance'
              - 'Scores with evidence, written separately'
      - type: quote
        body: 'Hiring is one of the costliest decisions: criteria first, gut feeling after.'
    aside:
      - type: pitfalls
        items:
          - 'Picking people like yourself in the name of culture fit. A mix of skills is also a team''s strength.'
          - 'Asking only trivia or algorithm puzzles, with no link to real work situations.'
          - 'Treating the total as the verdict. A weighted total can hide a fatal gap: set a minimum for the must-have skills before you add up.'
      - type: tips
        items:
          - 'Ask questions from real work: "Fix this slow query" or "What are the risks in this design?"'
          - 'Write up your scores as soon as possible after the interview, before memory fades.'
    check:
      q: 'Why does a scorecard have an "evidence" column?'
      a: 'Without evidence, a score is only an opinion. Writing what the candidate said or did makes the comparison fair and exposes bias.'

flashcards:
  - q: 'What are the four kinds of teams in Team Topologies?'
    a: 'Stream-aligned, Platform, Enabling and Complicated-subsystem.'
    more: |
      A stream-aligned team handles one flow of the business. A platform team provides tools to the others. An enabling team teaches new skills. A complicated-subsystem team looks after a hard specialist part. More in [[thinking/conways-law|Conway's Law]].
    ref: team-topology
  - q: 'Why does cognitive load matter when splitting teams?'
    a: 'A team can hold only so much in its head. Give it too much and both quality and speed suffer.'
    more: |
      Split teams so that each one fully understands its own area. If the hard specialist part or the tooling goes to a separate team, the stream team can focus on the business work.
    ref: team-topology
  - q: 'When should you not split engineers into the four team types?'
    a: 'With fewer than about 10 engineers. One team can cover everything, and four labelled teams add hand-offs and no help.'
    more: |
      Split when you can see the pain: releases queue behind one person, a bug waits for its one expert, or nobody understands the whole system. Until then, a single small team talks faster than four.
    ref: team-topology
  - q: 'What is a "Now / Next / Later" roadmap?'
    a: 'Three levels instead of exact dates: Now is committed, Next is likely, Later is uncertain.'
    more: |
      Far-off dates carry more uncertainty, and exact feature dates make false promises. With three levels, the business knows what it can rely on and what may change. Writing outcomes, not features, is a good habit too. If a law or a festival fixes a date, write that date down; the three levels are for work whose date is soft.
    ref: roadmap-dependencies
  - q: 'What do you record for each dependency in a dependency register?'
    a: 'The owner, the date we need it, the current status and the risk.'
    more: |
      Nobody watches a dependency with no owner. When the needed-by date is close and the status is behind, flag it red every week, so the delay is caught early and not at the last minute.
    ref: roadmap-dependencies
  - q: 'What is the three-point estimate formula?'
    a: 'Expected = (best + 4 × likely + worst) ÷ 6. This is known as PERT.'
    more: |
      For example, with best 3, likely 5 and worst 10, (3 + 20 + 10) ÷ 6 = 5.5 days. The most likely value gets four times the weight. The formula doesn't remove estimation error, but it does bring the bad case into the calculation.
    ref: estimation-ranges
  - q: 'Instead of a single number, what do you give when asked for an estimate?'
    a: 'A range and assumptions: "About 18 days, most likely 15 to 21, if the vendor sandbox arrives on time."'
    more: |
      People hear a single number as a promise. A range shows the uncertainty, and written assumptions make it easy to discuss the cause if they prove wrong. Shrink the biggest source of uncertainty first.
    ref: estimation-ranges
  - q: 'How do you turn three-point estimates into a range for the whole job?'
    a: 'Spread of a task = (worst − best) ÷ 6. Total spread = square root of the sum of the squares. Range = expected total ± that spread.'
    more: |
      Take tasks with spreads 1.2, 0.7 and 2.5: the squares add to about 8.2 and the root is 2.9. With an expected total of 18, the range is 15 to 21 days, about two chances in three. A shared risk, like one late vendor, sits outside this maths: write it as an assumption.
    ref: estimation-ranges
  - q: 'Which two terms do you check in a vendor contract to avoid lock-in?'
    a: 'The format and timing of getting your data back, and the exit terms (notice and penalty).'
    more: |
      If you can't get your data back, or leaving is expensive, you can't switch vendors, and you lose your bargaining power. Also check the SLA and its compensation, the price-rise terms and the liability cap. More in [[thinking/build-vs-buy|build vs buy]].
    ref: vendor-contract
  - q: 'What does a 99.9% uptime promise (SLA) still allow?'
    a: 'About 43 minutes of downtime a month. 99% allows over 7 hours. The promise is only worth the compensation behind it.'
    more: |
      A month has about 43,200 minutes, and 0.1% of that is about 43. Ask what the vendor pays you when it misses the number, and how downtime is measured.
    ref: vendor-contract
  - q: 'Why use a hiring scorecard?'
    a: 'To score every candidate on the same criteria with evidence, so the decision rests on skill, not on "I liked them".'
    more: |
      The criteria and weights are fixed first. Each interviewer writes their own scores and evidence separately, and only then do you discuss. That reduces one person's influence and exposes bias.
    ref: hiring-scorecard

quiz:
  - q: 'Our feature depends on the payment team''s API, which is still in design. We need it in 2 weeks. What do you do?'
    hint: 'What happens when the delay is only found at the last minute?'
    options:
      - text: 'Wait; they will surely deliver on time'
        correct: false
        why: 'Hoping is not a plan. The delay will surface when there is no time left to act.'
      - text: 'Flag it red in the dependency register, talk to the owner directly, and line up a fallback or a stub if needed'
        correct: true
        why: 'Knowing the risk early leaves time for a fix, and talking directly to the owner works best.'
      - text: 'Write the payment team''s code yourself'
        correct: false
        why: 'Stepping across another team''s boundary breeds conflict and mistakes.'
      - text: 'Drop the feature from the roadmap'
        correct: false
        why: 'It hurts the business. Look for a solution first.'
    ref: roadmap-dependencies
  - q: 'One team handles checkout, a complex pricing ML model and CI/CD, and everything is slow. What do you do?'
    hint: 'Where is the cognitive load highest?'
    options:
      - text: 'Add five more people to the team'
        correct: false
        why: 'A bigger team adds coordination cost. The core problem is load, not headcount.'
      - text: 'Move CI/CD to a platform team and the model to a complicated-subsystem team; checkout stays with its own flow'
        correct: true
        why: 'Separating the hard and tooling work lowers the stream team''s load.'
      - text: 'Train everyone in everything'
        correct: false
        why: 'The load doesn''t drop; trying to learn everything, nobody goes deep on anything.'
      - text: 'Change nothing and tell them to "work harder"'
        correct: false
        why: 'A structural problem isn''t fixed by effort.'
    ref: team-topology
  - q: 'A start-up with 6 engineers is told to form a stream-aligned, a platform, an enabling and a complicated-subsystem team. What is the best response?'
    hint: 'Does the pain the types cure exist yet?'
    options:
      - text: 'Do it; four teams of one or two people each'
        correct: false
        why: 'Each tiny team still needs the same skills, and the hand-offs between them cost more than they save.'
      - text: 'Keep one team for now, and split when work queues behind one person or nobody understands the whole system'
        correct: true
        why: 'The types cure overload. With 6 people one team can hold the whole system, so splitting only adds hand-offs.'
      - text: 'Hire 20 more engineers so there are enough people for four teams'
        correct: false
        why: 'Hiring to fit a diagram reverses the logic. Structure follows the load, not the other way round.'
      - text: 'Ignore team design for ever'
        correct: false
        why: 'Revisit it as the team grows. The caveat is about timing, not about never splitting.'
    ref: team-topology
  - q: 'Which of these are part of a good estimate?'
    hint: 'Why is a single number dangerous?'
    options:
      - text: 'A range (say, 15 to 21 days)'
        correct: true
        why: 'A range shows the uncertainty and avoids a false promise.'
      - text: 'The assumptions the estimate depends on'
        correct: true
        why: 'If the assumptions are wrong, you can see why it ran late.'
      - text: 'Identifying the biggest source of uncertainty'
        correct: true
        why: 'Shrink that first and the whole estimate becomes more reliable.'
      - text: 'A fixed number that the manager prefers'
        correct: false
        why: 'Changing the number to suit the manager doesn''t shrink the work; the delay just shows up later.'
    ref: estimation-ranges
  - q: 'Three tasks have (best, likely, worst) of 2, 4 and 10. What is the expected time?'
    hint: '(best + 4 × likely + worst) ÷ 6.'
    options:
      - text: '4.7 days'
        correct: true
        why: '(2 + 16 + 10) ÷ 6 = 28 ÷ 6 ≈ 4.7 days.'
      - text: '5.3 days'
        correct: false
        why: 'That is the simple average of the three numbers (16 ÷ 3); PERT weights the likely value more.'
      - text: '10 days'
        correct: false
        why: 'That is only the worst case; the worst doesn''t always happen.'
      - text: '2 days'
        correct: false
        why: 'That is only the best case, an optimistic guess.'
    ref: estimation-ranges
  - q: 'Two tasks have a spread of 3 days and 4 days. What is the spread of the two together?'
    hint: 'Spreads are squared, added, then rooted.'
    options:
      - text: '7 days'
        correct: false
        why: 'Adding spreads assumes both tasks go badly at the same time. They rarely do, so you add the squares and take the root.'
      - text: '5 days'
        correct: true
        why: '√(3² + 4²) = √(9 + 16) = √25 = 5 days.'
      - text: '3.5 days'
        correct: false
        why: 'That is the average. Two tasks together are less certain than their average, not equally so.'
      - text: '12 days'
        correct: false
        why: 'Multiplying has no meaning here; spreads combine through their squares.'
    ref: estimation-ranges
  - q: 'A new vendor''s salesperson says, "You will always get your data back, don''t worry." What do you do?'
    hint: 'Which is binding: a spoken word or the contract?'
    options:
      - text: 'Sign, trusting them; the vendor seems good'
        correct: false
        why: 'A spoken promise is not proof. Once the relationship sours, nobody will honour it.'
      - text: 'Get the data-return format and timing written into the contract, and have legal check the terms'
        correct: true
        why: 'If it isn''t in the contract, it isn''t binding; only written terms protect you.'
      - text: 'Skip the vendor and build everything ourselves'
        correct: false
        why: 'Build vs buy is a separate decision. The problem here is getting the terms clear.'
      - text: 'Sign because of the low price'
        correct: false
        why: 'Deciding on price without knowing the price-rise terms and exit costs is dangerous.'
    ref: vendor-contract
  - q: 'After the interview, everyone liked candidate A, but on the scorecard candidate B scored higher. What do you do?'
    hint: 'Which is more reliable: a liking, or evidence?'
    options:
      - text: 'Hire A, because everybody liked them'
        correct: false
        why: 'A liking can be full of bias; evidence should come first.'
      - text: 'Look at the evidence column, discuss why liking and scores differ, and run another round if needed'
        correct: true
        why: 'Finding where they differ exposes bias, and the decision rests on evidence.'
      - text: 'Throw out the scorecard and take a vote'
        correct: false
        why: 'In a vote, liking wins again.'
      - text: 'Hire neither'
        correct: false
        why: 'With evidence, there is a case for hiring B. Rejecting both is an overreaction.'
    ref: hiring-scorecard
