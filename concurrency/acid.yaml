flashcards:
  - q: 'ডেটাবেস transaction কী?'
    a: 'কয়েকটা পরিবর্তনের একটা দল, যা পুরোটা একসাথে পাকা হয় (commit), নয়তো পুরোটাই বাতিল হয় (rollback)।'
    more: |
      টাকা পাঠানোর মতো কাজে একাধিক ধাপ থাকে: একজনের কমাও, আরেকজনের বাড়াও। ধাপগুলো আলাদা আলাদা save হলে মাঝপথের error-এ অর্ধেক কাজ থেকে যায়। transaction ধাপগুলোকে একটা অবিভাজ্য কাজ বানায়, তাই মাঝামাঝি অবস্থা কখনো জমা হয় না।
    ref: half-transfer
  - q: 'ACID-এর A (Atomicity) কী প্রতিশ্রুতি দেয়?'
    a: 'Transaction-এর সব ধাপ হবে, নয়তো একটাও হবে না। মাঝপথের অবস্থা কখনো জমা থাকবে না।'
    more: |
      মাঝপথে exception, constraint ভাঙা বা সার্ভার crash — যা-ই হোক, ডেটাবেস আগের ধাপগুলো নিজে মুছে দেয়। বিকাশের ভাষায়: টাকা কাটা আর পৌঁছানো দুটোই হবে, নয়তো কোনোটাই না। এখানে atomic মানে অবিভাজ্য, “দ্রুত” নয়।
    ref: four-promises
  - q: 'ACID-এর C (Consistency) কার ওপর নির্ভর করে?'
    a: 'তোমার লেখা constraint-এর ওপর: NOT NULL, UNIQUE, foreign key, CHECK। ডেটাবেস শুধু ঘোষণা করা নিয়মই পাহারা দেয়।'
    more: |
      Consistency বলে, transaction ডেটাবেসকে এক বৈধ অবস্থা থেকে আরেক বৈধ অবস্থায় নেবে। কিন্তু কোনটা “বৈধ”, তা ডেটাবেস জানে শুধু constraint থেকে। “ব্যালেন্স শূন্যের নিচে নামবে না” নিয়মটা CHECK constraint হিসেবে না লিখলে সেটা রক্ষা করা পুরোপুরি তোমার কোডের কাজ।
    ref: four-promises
  - q: 'ACID-এর I (Isolation) কী?'
    a: 'একসাথে চলা transaction-গুলো একে অন্যের আধা-করা কাজ দেখে না। কতটা আলাদা থাকবে, তা isolation level ঠিক করে।'
    more: |
      টাকা পাঠানোর মাঝপথে অন্য কেউ ব্যালেন্স দেখলে পুরনো, commit-হওয়া মানটাই দেখে। তবে isolation হ্যাঁ/না নয় — কয়েকটা level আছে, আর ডিফল্ট level সব গোলমাল ঠেকায় না। বিস্তারিত: [[concurrency/isolation-levels|isolation level ও anomaly]]।
    ref: four-promises
  - q: 'ACID-এর D (Durability) কী?'
    a: 'commit সফল হলে পরিবর্তনটা স্থায়ী। এরপর crash বা বিদ্যুৎ গেলেও সেটা হারায় না।'
    more: |
      ডেটাবেস commit-এর উত্তর দেওয়ার আগে পরিবর্তনটা ডিস্কের write-ahead log-এ লিখে ফেলে। crash-এর পরে চালু হয়ে সে ওই log পড়ে সব commit-হওয়া কাজ ফিরিয়ে আনে। তাই “সফল” উত্তর পাওয়া মানে ডেটা নিরাপদ।
    ref: four-promises
  - q: 'Doctrine-এ flush() কি transaction ব্যবহার করে?'
    a: 'হ্যাঁ। জমে থাকা সব পরিবর্তন সে এক transaction-এ পাঠায়; একটা ব্যর্থ হলে সবগুলো rollback হয়।'
    more: |
      এজন্যই এক কাজে একাধিকবার flush() ডাকা বিপজ্জনক: প্রতিটা flush আলাদা transaction, তাই প্রথমটা পাকা হয়ে দ্বিতীয়টা ব্যর্থ হতে পারে। সব entity বদলে শেষে একবার flush() ডাকলে পুরো কাজটা নিজে থেকেই atomic হয়।
    ref: doctrine-transactions
  - q: 'Doctrine-এ wrapInTransaction() কখন দরকার?'
    a: 'যখন এক কাজে একাধিক ধাপ, lock, DQL বা raw SQL মিলিয়ে সবটা এক transaction-এ রাখতে হয়। শেষে সে নিজেই flush ও commit করে।'
    more: |
      সে BEGIN দিয়ে শুরু করে closure চালায়, তারপর flush() ও COMMIT করে, আর closure-এর return value ফেরত দেয়। exception হলে ROLLBACK করে, EntityManager বন্ধ করে এবং exception আবার ছুড়ে দেয়। pessimistic lock নিতে হলে খোলা transaction লাগেই, তাই তখন এটা বাধ্যতামূলক।
    ref: doctrine-transactions
  - q: 'Transaction-এর ভেতরে ইমেইল, SMS বা HTTP call করা কেন বিপজ্জনক?'
    a: 'Rollback হলেও সেগুলো ফেরে না, আর call যতক্ষণ চলে transaction খোলা থেকে lock ধরে রাখে।'
    more: |
      ডেটাবেস শুধু নিজের পরিবর্তন ফেরাতে পারে। SMS পাঠানোর পর commit ব্যর্থ হলে গ্রাহক ভুল খবর পায়। আবার ধীর gateway-র জন্য transaction লম্বা হলে অন্য request ওই সারিগুলোতে আটকে যায়। নিয়ম: আগে commit, তারপর বাইরের কাজ — সম্ভব হলে queue দিয়ে।
    ref: side-effects-inside
  - q: 'Transaction কি নিজে থেকে race condition ঠেকায়?'
    a: 'না। ডিফল্ট isolation level-এ দুই transaction একই পুরনো মান পড়ে হিসাব করতে পারে; ঠেকাতে lock বা atomic update লাগে।'
    more: |
      Transaction নিশ্চিত করে প্রতিটা কাজ পুরোটা হবে বা একদমই হবে না। কিন্তু দুইটা transaction একসাথে ব্যালেন্স ৫০০ পড়ে দুটোই ৪০০ কাটলে প্রতিটা নিজে নিখুঁত, ফল তবু ভুল। সমাধান: [[concurrency/locking|lock]] অথবা [[concurrency/atomic-operations|atomic update]]।
    ref: what-it-protects

quiz:
  - q: 'নিচের কোডে দ্বিতীয় flush()-এর ঠিক আগে exception হলে ডেটাবেসে কী থাকবে?'
    lang: php
    code: |
      $order->markPaid();
      $em->flush();

      $wallet->withdraw($order->getTotal());
      $em->flush();
    hint: 'প্রতিটা flush() কয়টা transaction চালায়, আর কখন সেটা commit হয়?'
    options:
      - text: 'অর্ডার paid থাকবে, কিন্তু ওয়ালেট থেকে টাকা কাটা হবে না'
        correct: true
        why: 'প্রথম flush() আলাদা transaction হিসেবে আগেই commit হয়ে গেছে। পরের exception সেটাকে আর ফেরাতে পারে না।'
      - text: 'দুটো পরিবর্তনই নিজে থেকে rollback হবে'
        correct: false
        why: 'rollback শুধু চলমান transaction-এর পরিবর্তন ফেরায়। প্রথম flush()-এর transaction অনেক আগেই শেষ।'
      - text: 'কিছুই জমা হবে না, কারণ Doctrine request-এর শেষে সব একসাথে save করে'
        correct: false
        why: 'Doctrine request-এর শেষের অপেক্ষা করে না; flush() ডাকার মুহূর্তেই SQL যায় আর commit হয়।'
      - text: 'ওয়ালেট থেকে টাকা কাটবে, কিন্তু অর্ডার pending থাকবে'
        correct: false
        why: 'উল্টো। withdraw() শুধু মেমোরির entity বদলেছে; দ্বিতীয় flush() না চলায় সেটা ডেটাবেসে যায়নি।'
    ref: half-transfer
  - q: 'একটা transaction rollback হলে নিচের কোনগুলো আগের অবস্থায় ফিরে যায়?'
    hint: 'ডেটাবেস কোন জিনিসগুলোর খবর রাখে, আর কোনগুলো তার নাগালের বাইরে?'
    options:
      - text: 'ওই transaction-এ করা UPDATE'
        correct: true
        why: 'একই transaction-এর সব পরিবর্তন ডেটাবেস নিজে মুছে দেয় — এটাই Atomicity।'
      - text: 'ওই transaction-এ করা INSERT'
        correct: true
        why: 'নতুন সারিও transaction-এর অংশ; rollback হলে সেটা কখনো ছিলই না।'
      - text: 'transaction-এর ভেতর থেকে পাঠানো ইমেইল'
        correct: false
        why: 'ইমেইল সার্ভার ডেটাবেসের transaction-এর অংশ নয়; একবার পাঠালে তা আর ফেরে না।'
      - text: 'transaction-এর ভেতর থেকে পেমেন্ট গেটওয়েতে করা charge'
        correct: false
        why: 'গেটওয়ে আলাদা সিস্টেম। তোমার ডেটাবেসের rollback তাকে কিছুই জানায় না; আলাদা refund করতে হবে।'
      - text: 'transaction-এর ভেতর থেকে Redis cache-এ লেখা মান'
        correct: false
        why: 'Redis আলাদা সিস্টেম; SQL ডেটাবেসের rollback সেখানে পৌঁছায় না, বাসি মান থেকে যায়।'
    ref: side-effects-inside
  - q: 'balance কলামে CHECK (balance >= 0) দেওয়া আছে। একটা transaction ব্যালেন্স −১০০ করতে গেলে ডেটাবেস commit করতে দেয় না। এটা ACID-এর কোন প্রতিশ্রুতি?'
    hint: 'এখানে একটা ঘোষণা করা নিয়ম পাহারা দেওয়া হচ্ছে।'
    options:
      - text: 'Atomicity'
        correct: false
        why: 'Atomicity বলে সব ধাপ হবে বা একটাও না। এখানে মূল ঘটনা একটা নিয়ম ভাঙতে না দেওয়া।'
      - text: 'Consistency'
        correct: true
        why: 'ঘোষণা করা constraint ভাঙে এমন অবস্থা ডেটাবেস জমা হতে দেয় না — এটাই Consistency।'
      - text: 'Isolation'
        correct: false
        why: 'Isolation একসাথে চলা একাধিক transaction-এর পারস্পরিক প্রভাব নিয়ে; এখানে transaction একটাই।'
      - text: 'Durability'
        correct: false
        why: 'Durability বলে commit-হওয়া ডেটা crash-এও টিকবে। এখানে commit-ই হচ্ছে না।'
    ref: four-promises
  - q: 'সুমির handler তিনটা entity বদলে শেষে একবার flush() ডাকে। তৃতীয় UPDATE একটা constraint ভাঙল। প্রথম দুইটার কী হবে?'
    hint: 'flush() জমে থাকা পরিবর্তনগুলো কীভাবে পাঠায়?'
    options:
      - text: 'প্রথম দুইটা জমা থাকবে, শুধু তৃতীয়টা বাদ যাবে'
        correct: false
        why: 'এমন হলে আধা-আধি অবস্থা তৈরি হতো। flush() ঠিক সেটা ঠেকাতেই সব পরিবর্তন এক transaction-এ চালায়।'
      - text: 'সেগুলোও rollback হবে, কারণ flush() সব পরিবর্তন এক transaction-এ চালায়'
        correct: true
        why: 'flush() নিজে BEGIN … COMMIT করে। একটা SQL ব্যর্থ হলে পুরোটাই rollback হয়, আর EntityManager বন্ধ হয়ে যায়।'
      - text: 'Doctrine নিজে থেকে তৃতীয়টা ঠিক করে আবার চেষ্টা করবে'
        correct: false
        why: 'Doctrine কিছু ঠিক করে না বা retry করে না; exception ছুড়ে দেয়।'
    ref: doctrine-transactions
  - q: 'wrapInTransaction() সম্পর্কে কোনগুলো সত্যি?'
    hint: 'সে ডেটাবেসের ভেতরে কী করে, আর কোনটা তার ক্ষমতার বাইরে?'
    options:
      - text: 'closure শেষ হলে নিজেই flush() ও COMMIT করে'
        correct: true
        why: 'তাই ভেতরে আলাদা flush() লিখতে হয় না; closure-এর return value-ও ফেরত পাওয়া যায়।'
      - text: 'exception হলে ROLLBACK করে আর EntityManager বন্ধ করে দেয়'
        correct: true
        why: 'ব্যর্থ transaction-এর পরে মেমোরির entity-গুলোর অবস্থা আর বিশ্বাসযোগ্য নয়, তাই EntityManager বন্ধ হয়।'
      - text: 'ভেতর থেকে করা HTTP call-ও rollback করে'
        correct: false
        why: 'সে শুধু ডেটাবেসের পরিবর্তন ফেরায়; বাইরের সিস্টেমে যা গেছে তা তার নাগালের বাইরে।'
      - text: 'একই সারি ছোঁয়া দুই request-কে নিজে থেকেই লাইনে দাঁড় করায়'
        correct: false
        why: 'লাইনে দাঁড় করাতে lock লাগে (যেমন PESSIMISTIC_WRITE)। শুধু transaction থাকলে দুটোই একসাথে পুরনো মান পড়তে পারে।'
    ref: doctrine-transactions
  - q: 'একটা transaction-এর ভেতর থেকে SMS gateway-তে call করা হয়, যেটা মাঝে মাঝে ২০ সেকেন্ড নেয়। সবচেয়ে বড় ঝুঁকি কোনটা?'
    hint: 'ওই ২০ সেকেন্ড ডেটাবেসের transaction-টা কী অবস্থায় থাকে?'
    options:
      - text: 'ডেটাবেস ২০ সেকেন্ড পরে নিজে থেকেই transaction-টা commit করে দেবে'
        correct: false
        why: 'ডেটাবেস নিজে থেকে commit করে না; তোমার কোড যতক্ষণ না বলছে, transaction খোলাই থাকে।'
      - text: 'transaction খোলা থেকে lock ধরে রাখে, তাই ওই সারিগুলোতে অন্য request আটকে যায়'
        correct: true
        why: 'লম্বা transaction মানে লম্বা lock। চাপের সময় আটকে থাকা request জমতে জমতে পুরো সাইট ধীর হয়ে যায়।'
      - text: 'কোনো ঝুঁকি নেই; transaction যত লম্বা, ডেটা তত নিরাপদ'
        correct: false
        why: 'উল্টো। transaction যত ছোট, lock তত কম সময় ধরা থাকে। নিরাপত্তা আসে সঠিক সীমানা থেকে, দৈর্ঘ্য থেকে নয়।'
      - text: 'SMS ব্যর্থ হলে ডেটাবেস নিজেই আবার পাঠানোর চেষ্টা করবে'
        correct: false
        why: 'ডেটাবেস SMS সম্পর্কে কিছুই জানে না। retry করতে চাইলে queue আর worker লাগে।'
    ref: side-effects-inside
  - q: 'দুইটা request একসাথে একই ওয়ালেটের ব্যালেন্স পড়ে, হিসাব করে, লেখে। দুটোই wrapInTransaction()-এর ভেতরে, কিন্তু কোনো lock নেই। কী হতে পারে?'
    hint: 'দুটোই শুরুতে কোন ব্যালেন্সটা দেখেছে?'
