slides:
  - slug: half-transfer
    title: 'টাকা কাটল, কিন্তু পৌঁছাল না'
    kind: story
    tldr: 'এক কাজের দুই ধাপ আলাদা আলাদা save হলে মাঝপথের একটা error-এই টাকা হাওয়া হয়ে যায়।'
    keywords: ['transaction', 'partial write', 'atomicity', 'টাকা পাঠানো', 'অর্ধেক কাজ']
    blocks:
      - type: text
        body: |
          রহিম ওয়ালেট অ্যাপ থেকে করিমকে ৫০০ টাকা পাঠাল। কোডে দুইটা ধাপ: রহিমের ব্যালেন্স কমাও, করিমের ব্যালেন্স বাড়াও। প্রতিটা service method নিজের ভেতরে `flush()` ডাকে, তাই প্রতিটা ধাপ আলাদাভাবে ডেটাবেসে পাকা হয়ে যায়। প্রথম ধাপের পরে একটা exception এলে রহিমের টাকা কাটা থাকে, অথচ করিম কিছুই পায় না।
      - type: code
        lang: php
        file: 'src/Controller/TransferController.php'
        variant: bad
        code: |
          #[Route('/api/transfers', methods: ['POST'])]
          public function send(#[MapRequestPayload] SendMoney $dto): JsonResponse
          {
              // ভেতরে flush() — রহিমের ৫০০ টাকা কাটা পাকা হয়ে গেল
              $this->wallets->withdraw($dto->fromWalletId, $dto->amount);

              // এই লাইন চলার আগে exception বা সার্ভার বন্ধ হলে?
              $this->wallets->deposit($dto->toWalletId, $dto->amount);

              return $this->json(['status' => 'sent']);
          }
        marks:
          - {line: 5, tip: 'এই লাইন শেষ হতেই প্রথম পরিবর্তনটা ডেটাবেসে স্থায়ী। পরে যা-ই ঘটুক, এটা আর নিজে থেকে ফিরবে না।'}
          - {line: 8, tip: 'করিমের ওয়ালেট বন্ধ, id ভুল, বা ঠিক এই মুহূর্তে deploy — যে কারণেই এই লাইন না চলুক, ৫০০ টাকা হাওয়া।'}
      - type: visual
        kind: sequence
        caption: 'দুই ধাপের মাঝখানে error — কার কাছে কী জমা থাকল'
        actors:
          - {id: rahim, label: 'রহিম', icon: user, tip: 'করিমকে ৫০০ টাকা পাঠাতে চায়। তার ব্যালেন্স ছিল ১০০০ টাকা।'}
          - {id: app, label: 'Symfony অ্যাপ', icon: api, tip: 'দুই ধাপে কাজ করে: আগে withdraw(), পরে deposit() — প্রতিটায় আলাদা flush()।'}
          - {id: db, label: 'ডেটাবেস', icon: db, tip: 'প্রতিটা flush()-কে আলাদা transaction হিসেবে পাকা করে; দুই ধাপ যে একই কাজের অংশ, তা সে জানে না।'}
        messages:
          - {from: rahim, to: app, label: 'করিমকে ৫০০ টাকা পাঠাও'}
          - {from: app, to: db, label: 'রহিমের ব্যালেন্স ১০০০ → ৫০০', tip: 'withdraw()-এর ভেতরের flush()। এই পরিবর্তন সাথে সাথে commit হয়ে গেল।'}
          - {from: db, to: app, label: 'পাকা হলো', dashed: true}
          - {at: app, note: 'exception — কোড এখানেই থামল', tone: bad, tip: 'deposit() আর ডাকা হলো না। PHP থেমে গেলে আগের commit ফেরানোর কেউ নেই।'}
          - {from: app, to: rahim, label: '500 error', dashed: true, tone: bad, tip: 'রহিম দেখল “ব্যর্থ”, অথচ তার টাকা কাটা হয়ে গেছে।'}
          - {at: db, note: 'রহিম −৫০০, করিম +০', tone: bad, tip: 'মোট টাকা থেকে ৫০০ হারিয়ে গেছে। এই আধা-আধি অবস্থাটাই transaction ঠেকায়।'}
    aside:
      - type: story
        title: '“টাকা কেটেছে, পায়নি” অভিযোগ'
        body: |
          একটা ওয়ালেট অ্যাপে মাসে দুই-তিনটা অভিযোগ আসত: টাকা কেটেছে, প্রাপক পায়নি। একা টেস্ট করলে কখনো ধরা পড়ত না। পরে দেখা গেল, দুই ধাপের মাঝে কখনো timeout, কখনো deploy — আর প্রতিবারই প্রথম অর্ধেকটা ডেটাবেসে থেকে যাচ্ছে।
      - type: terms
        items:
          - {term: 'Transaction', meaning: 'কয়েকটা পরিবর্তনকে একটাই অবিভাজ্য কাজ হিসেবে চালানো।'}
          - {term: 'Commit', meaning: 'transaction-এর সব পরিবর্তন পাকা করে ফেলা।'}
          - {term: 'Rollback', meaning: 'transaction-এর সব পরিবর্তন মুছে আগের অবস্থায় ফেরা।'}
    check:
      q: 'দুই ধাপের মাঝে সার্ভার বন্ধ হলে এই কোডে রহিম আর করিমের ব্যালেন্সের কী হয়?'
      a: 'রহিমের ৫০০ টাকা কাটা থাকে, কারণ প্রথম flush() আগেই commit হয়ে গেছে। করিমের ব্যালেন্স বাড়ে না। মোট টাকা থেকে ৫০০ হারিয়ে যায়।'

  - slug: four-promises
    title: 'ACID: transaction-এর চার প্রতিশ্রুতি'
    kind: concept
    tldr: 'Atomicity, Consistency, Isolation, Durability — সব অথবা কিছুই না, নিয়ম অটুট, অন্যের আধা কাজ অদৃশ্য, পাকা মানে পাকা।'
    keywords: ['ACID', 'atomicity', 'consistency', 'isolation', 'durability', 'প্রতিশ্রুতি']
    blocks:
      - type: metaphor
        icon: wallet
        title: 'বিকাশে টাকা পাঠানো'
        body: |
          বিকাশে Send Money চাপলে তুমি দুইটার একটা দেখো: “সফল” অথবা “ব্যর্থ”। “তোমার টাকা কেটেছে, কিন্তু ওপাশে যায়নি” — এমন মাঝামাঝি অবস্থা কখনো দেখো না। ডেটাবেসের transaction ঠিক এই নিশ্চয়তা দেয়। নিশ্চয়তাটাকে চার ভাগে ভাঙলে যা হয়, তার নাম ACID।
      - type: visual
        kind: table
        caption: 'ACID-এর চার অক্ষর, বিকাশের লেনদেন দিয়ে'
        headers: ['অক্ষর', 'প্রতিশ্রুতি', 'বিকাশের ভাষায়']
        rows:
          - cells: ['A — Atomicity', 'সব ধাপ হবে, নয়তো একটাও না', 'কাটা আর পৌঁছানো — দুটোই, নয়তো কোনোটাই না']
            tip: 'মাঝপথে error হলে ডেটাবেস নিজেই আগের ধাপগুলো মুছে দেয় (rollback)। আধা-আধি অবস্থা কখনো জমা থাকে না।'
          - cells: ['C — Consistency', 'নিয়ম ভাঙা অবস্থা জমা হবে না', 'ব্যালেন্স শূন্যের নিচে নামবে না']
            tip: 'ডেটাবেস শুধু সেই নিয়ম পাহারা দেয়, যা তুমি constraint হিসেবে লিখে দিয়েছ: NOT NULL, UNIQUE, foreign key, CHECK। বাকি নিয়ম তোমার কোডের দায়িত্ব।'
          - cells: ['I — Isolation', 'অন্যের আধা-করা কাজ দেখা যাবে না', 'মাঝপথে কেউ দেখলে পুরনো ব্যালেন্সই দেখে']
            tip: 'একসাথে চলা transaction-গুলো কতটা আলাদা থাকবে, তা isolation level ঠিক করে। ডিফল্ট level সব ধরনের গোলমাল ঠেকায় না।'
          - cells: ['D — Durability', 'commit হলে আর হারাবে না', '“সফল” আসার পর বিদ্যুৎ গেলেও টাকা থাকে']
            tip: 'commit-এর উত্তর দেওয়ার আগেই ডেটাবেস পরিবর্তনটা ডিস্কের log-এ (WAL) লিখে ফেলে, তাই crash-এর পরে চালু হয়ে সেটা ফিরিয়ে আনতে পারে।'
      - type: quote
        body: 'Transaction মানে: সব হবে, নয়তো কিছুই হবে না।'
    aside:
      - type: remember
        body: 'A = সব অথবা কিছুই না। C = নিয়ম অটুট। I = অন্যের আধা কাজ দেখি না। D = পাকা মানে পাকা।'
      - type: tips
        items:
          - 'C-এর জোর আসে তোমার লেখা constraint থেকে। constraint না দিলে ডেটাবেস জানেই না কোন অবস্থাটা “ভুল”।'
          - 'চারটার মধ্যে I-ই সবচেয়ে পিচ্ছিল: এটা হ্যাঁ/না নয়, কয়েক ধাপের একটা মাত্রা।'
      - type: refs
        items:
          - {to: 'data/schema-design', label: 'Constraint দিয়ে ডেটা পাহারা'}
          - {to: 'concurrency/isolation-levels', label: 'Isolation level ও anomaly'}
    check:
      q: '“সফল” দেখানোর এক সেকেন্ড পরে ডেটাবেস সার্ভার crash করল। ACID-এর কোন অক্ষর বলে টাকাটা হারাবে না, আর কীভাবে?'
      a: 'D — Durability। commit-এর উত্তর দেওয়ার আগেই পরিবর্তনটা ডিস্কের log-এ লেখা হয়ে যায়, তাই আবার চালু হয়ে ডেটাবেস সেটা ফিরিয়ে আনে।'

  - slug: doctrine-transactions
    title: 'Doctrine-এ transaction: flush() আর wrapInTransaction()'
    kind: howto
    tldr: 'flush() নিজেই একটা transaction; একাধিক ধাপ, lock বা raw SQL থাকলে পুরো কাজটা wrapInTransaction()-এ মুড়ে দাও।'
    keywords: ['wrapInTransaction', 'flush', 'Doctrine', 'EntityManager', 'rollback', 'ট্রানজ্যাকশন']
    blocks:
      - type: text
        body: |
          Doctrine-এ `flush()` নিজেই একটা transaction: জমে থাকা সব পরিবর্তন সে একসাথে পাঠায়, একটা ব্যর্থ হলে সবগুলো rollback করে। তাই প্রথম নিয়ম — এক কাজে একটাই `flush()`, একদম শেষে। মাঝখানে যখন পড়তে, lock নিতে বা সরাসরি SQL চালাতে হয়, তখন পুরো কাজটা `wrapInTransaction()`-এর ভেতরে রাখো।
      - type: code
        lang: php
        file: 'src/Service/TransferService.php'
        variant: good
        code: |
          final readonly class TransferService
          {
              public function __construct(private EntityManagerInterface $em)
              {
              }

              public function send(int $fromId, int $toId, int $amount): Transfer
              {
                  return $this->em->wrapInTransaction(function () use ($fromId, $toId, $amount) {
                      $from = $this->em->find(Wallet::class, $fromId, LockMode::PESSIMISTIC_WRITE)
                          ?? throw new WalletNotFound($fromId);
                      $to = $this->em->find(Wallet::class, $toId, LockMode::PESSIMISTIC_WRITE)
                          ?? throw new WalletNotFound($toId);

                      $from->withdraw($amount);   // টাকা কম থাকলে exception ছোড়ে
                      $to->deposit($amount);

                      $transfer = new Transfer($from, $to, $amount);
                      $this->em->persist($transfer);

                      return $transfer;           // এরপর flush() আর COMMIT নিজে থেকেই
                  });
              }
          }
        marks:
          - {line: 9, tip: 'এখানে BEGIN। ভেতরের সব কাজ — পড়া, lock, লেখা — একটাই transaction-এর অংশ। closure যা return করে, সেটাই ফেরত আসে।'}
          - {line: 10, tip: 'SELECT … FOR UPDATE: commit না হওয়া পর্যন্ত অন্য transaction এই সারি বদলাতে পারে না। এটা না থাকলে দুইটা transfer একই পুরনো ব্যালেন্স পড়ে ভুল হিসাব করত।'}
          - {line: 15, tip: 'এখান থেকে exception বেরোলে wrapInTransaction() নিজেই ROLLBACK করে — রহিমের টাকা কাটা অবস্থায় আর থাকে না।'}
          - {line: 21, tip: 'closure শেষ হলে Doctrine নিজে flush() ডাকে, তারপর COMMIT। আলাদা করে flush() লিখতে হয় না।'}
      - type: points
        title: 'তিনটা নিয়ম'
        style: check
        items:
          - 'Service method-এর ভেতরে ছড়িয়ে-ছিটিয়ে `flush()` নয়; পুরো কাজের শেষে একবার।'
          - 'একাধিক ধাপ, lock, DQL বা raw SQL একসাথে থাকলে `wrapInTransaction()`।'
          - 'Exception-এর পরে EntityManager বন্ধ হয়ে যায় — একই request-এ তা দিয়ে আবার লেখার চেষ্টা কোরো না।'
    aside:
      - type: terms
        items:
          - {term: 'Unit of Work', meaning: 'Doctrine-এর ভেতরের খাতা: কোন entity বদলেছে মনে রাখে, flush()-এ সব SQL একসাথে পাঠায়।'}
          - {term: 'FOR UPDATE', meaning: 'পড়ার সময়ই সারিতে lock নেওয়া, যাতে commit পর্যন্ত অন্য কেউ সেটা বদলাতে না পারে।'}
      - type: pitfalls
        items:
          - 'রহিম→করিম আর করিম→রহিম একসাথে চললে দুই lock উল্টো ক্রমে নেওয়া হয়, deadlock হতে পারে। সমাধান: সবসময় ছোট id আগে lock।'
          - '“The EntityManager is closed” মানে আগের একটা transaction ব্যর্থ হয়েছে। সেই request-এ error response দিয়ে শেষ করো।'
      - type: tips
        items:
          - 'Messenger-এর `doctrine_transaction` middleware প্রতিটা message handler-কে নিজে থেকেই একটা transaction-এ মুড়ে দেয়।'
      - type: refs
        items:
          - {to: 'concurrency/locking', label: 'FOR UPDATE lock আর deadlock'}
    check:
      q: 'wrapInTransaction()-এর closure-এর ভেতর থেকে exception বেরোলে Doctrine কী কী করে?'
      a: 'ডেটাবেসে ROLLBACK পাঠায়, ফলে কোনো পরিবর্তনই জমা হয় না; EntityManager বন্ধ করে দেয়; আর exception-টা আবার ছুড়ে দেয় যাতে তুমি error response দিতে পারো।'

  - slug: side-effects-inside
    title: 'Rollback ইমেইল বা SMS ফেরত আনতে পারে না'
    kind: pitfall
    tldr: 'Transaction শুধু নিজের ডেটাবেসের পরিবর্তন ফেরায়; ভেতর থেকে করা SMS, ইমেইল বা HTTP call ফেরে না, উল্টো lock আটকে রাখে।'
    keywords: ['side effect', 'rollback', 'long transaction', 'HTTP call', 'SMS', 'বাইরের সার্ভিস']
    blocks:
      - type: text
        body: |
          Transaction শুধু **নিজের ডেটাবেসের** পরিবর্তন ফেরাতে পারে। ভেতর থেকে SMS, ইমেইল বা অন্য সার্ভিসে HTTP call করলে সেটা বাইরে চলে যায়, পরে rollback হলেও ফেরে না। বিকাশ যদি “টাকা পেয়েছেন” SMS পাঠানোর পরে লেনদেন বাতিল করত, ঠিক তা-ই হতো। আরেক বিপদ: ধীর call যতক্ষণ চলে, transaction খোলা থাকে আর lock ধরা সারিতে বাকিরা আটকে থাকে।
      - type: code
        lang: php
        file: 'src/Service/TransferService.php'
        variant: bad
        code: |
          $this->em->wrapInTransaction(function () use ($from, $to, $amount): void {
              $from->withdraw($amount);
              $to->deposit($amount);

              // বাইরের দুনিয়ায় চলে গেল — rollback এটা ফেরাতে পারবে না
              $this->sms->send($to->getPhone(), '৫০০ টাকা পেয়েছেন');
          });   // এখানে COMMIT ব্যর্থ হলে SMS গেছে, টাকা যায়নি
        marks:
          - {line: 6, tip: 'gateway ২০ সেকেন্ড ঝুলে থাকলে transaction-ও ২০ সেকেন্ড খোলা; এই দুই ওয়ালেটে আর কেউ লেনদেন করতে পারে না।'}
          - {line: 7, tip: 'flush() আর COMMIT হয় closure-এর পরে। constraint ভাঙলে বা সংযোগ কাটলে সব rollback — কিন্তু SMS ততক্ষণে পৌঁছে গেছে।'}
      - type: code
        lang: php
        file: 'src/Controller/TransferController.php'
        variant: good
        code: |
          // ১. আগে ডেটাবেসের কাজ — ভেতরে শুধু ডেটাবেস, তারপর COMMIT
          $transfer = $this->transfers->send($dto->fromWalletId, $dto->toWalletId, $dto->amount);

          // ২. টাকা পাকা হওয়ার পরেই খবর — queue-তে, যাতে ধীর gateway request না আটকায়
          $this->bus->dispatch(new SendTransferSms($transfer->getId()));

          return $this->json(['status' => 'sent'], 201);
        marks:
          - {line: 5, tip: 'commit সফল না হলে এই লাইনে পৌঁছানোই যায় না, তাই ভুল SMS যাওয়ার সুযোগ নেই। worker পরে gateway-তে call করবে।'}
      - type: quote
        body: 'Transaction-এর ভেতরে শুধু ডেটাবেসের কাজ। বাইরের দুনিয়ার কাজ commit-এর পরে।'
    aside:
      - type: pitfalls
        items:
          - 'File লেখা, cache মোছা, queue-তে message পাঠানো, পেমেন্ট গেটওয়েতে charge — এগুলোর কোনোটাই rollback হয় না।'
          - 'commit-এর পরে dispatch ব্যর্থ হলে টাকা ঠিক থাকে, শুধু SMS হারায়। সেটাও সহ্য না হলে outbox প্যাটার্ন লাগে।'
      - type: remember
        body: 'ডেটাবেসের ভেতরে যা, rollback তা-ই ফেরায়। তার বাইরে যা গেছে, তা গেছেই।'
      - type: refs
        items:
          - {to: 'concurrency/distributed-transactions', label: 'ডেটাবেস আর বাইরের সার্ভিস একসাথে ঠিক রাখা'}
          - {to: 'messaging/events-vs-commands', label: 'Messenger দিয়ে কাজ পরে করা'}
    check:
      q: 'Transaction-এর ভেতর থেকে SMS পাঠানোর পরে COMMIT ব্যর্থ হলো। করিম কী দেখবে, আর কেন?'
      a: 'সে “টাকা পেয়েছেন” SMS পাবে, কিন্তু ব্যালেন্স বাড়বে না। ডেটাবেসের পরিবর্তন rollback হয়েছে, অথচ SMS বাইরের সিস্টেমে চলে গেছে — সেটা ফেরানোর উপায় নেই।'

  - slug: what-it-protects
    title: 'Transaction কী রক্ষা করে, কী করে না'
    kind: recap
