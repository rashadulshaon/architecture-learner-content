          Transaction শক্তিশালী, কিন্তু জাদু নয়। সে চার প্রতিশ্রুতি দেয় শুধু নিজের ডেটাবেসের ভেতরে। সবচেয়ে বেশি ভুল বোঝা হয় এই জায়গায়: দুইটা transaction একই মুহূর্তে রহিমের ব্যালেন্স ৫০০ পড়ে দুটোই ৪০০ কাটতে পারে — প্রতিটা transaction নিজে নিখুঁত, তবু ফল ভুল।
