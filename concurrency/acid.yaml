      - text: 'ডেটাবেস দুটো transaction-ই বাতিল করে দেবে'
        correct: false
        why: 'ডিফল্ট isolation level-এ ডেটাবেস এখানে কোনো সমস্যাই দেখে না; দুটোকেই commit করতে দেয়।'
      - text: 'একটার পরিবর্তন অন্যটা মুছে দেবে, ফলে ব্যালেন্স ভুল হবে'
        correct: true
        why: 'দুটোই একই পুরনো ব্যালেন্স থেকে হিসাব করেছে; যে পরে লেখে তার মানটাই থাকে। এটাই lost update।'
      - text: 'commit-এর পরে ডেটা হারিয়ে যাবে'
        correct: false
