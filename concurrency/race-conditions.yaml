slides:
  - slug: two-phones
    title: 'Two phones, one balance, spent twice'
    kind: story
    tldr: 'When two requests read the same stale balance at once, both pass the check, and money that doesn''t exist gets spent.'
    keywords: ['race condition', 'double spend', 'check then act', 'balance', 'concurrent requests']
    blocks:
      - type: text
        body: |
          Ryan has $1,000 in his wallet. From two phones, within the same second, he sends $800 each time. The code does check the balance on every request, yet both transfers succeed. Testing alone will never catch this, because the bug only appears when the **timing of two requests lines up**. The fix, shown below the diagram, is to let the database check and subtract in one statement.
      - type: code
        lang: php
        file: 'src/Service/WalletService.php'
        variant: bad
        code: |
          public function send(int $walletId, int $amount): void
          {
              $wallet = $this->em->find(Wallet::class, $walletId);

              if ($wallet->getBalance() < $amount) {      // 1. check first
                  throw new InsufficientFunds();
              }

              $wallet->setBalance($wallet->getBalance() - $amount);  // 2. then write
              $this->em->flush();
          }
        marks:
          - {line: 5, tip: 'Both requests see 1000 here. Nobody has written anything yet, so both conclude "there is enough money".'}
          - {line: 9, tip: 'Both write 1000 − 800 = 200. The second write silently wipes out the first.'}
      - type: visual
        kind: sequence
        caption: 'Ryan''s two phones read the same balance, and $800 leaves twice'
        actors:
          - {id: p1, label: 'Ryan''s phone 1', icon: phone, tip: 'First request: send $800.'}
          - {id: p2, label: 'Ryan''s phone 2', icon: phone, tip: 'Second request: send $800 again, at almost the same moment.'}
          - {id: db, label: 'Database', icon: db, tip: 'Ryan''s wallet row holds a balance of $1,000.'}
        messages:
          - {from: p1, to: db, label: 'Read the balance', tip: 'SELECT balance. There is no lock, so nobody blocks anybody.'}
          - {from: db, to: p1, label: '$1,000', dashed: true}
          - {from: p2, to: db, label: 'Read the balance', tip: 'The first request hasn''t written yet, so this one gets the stale value too.'}
          - {from: db, to: p2, label: '$1,000', dashed: true}
          - {from: p1, to: db, label: 'balance = 1000 − 800 = 200'}
          - {from: p2, to: db, label: 'balance = 1000 − 800 = 200', tone: bad, tip: 'Phone 2 has no idea phone 1 already changed the balance.'}
          - {at: db, note: '$1,600 left, balance is $200', tone: bad, tip: 'Correctly, the second transfer should have failed. $600 was created out of thin air.'}
      - type: code
        lang: php
        file: 'src/Service/WalletService.php'
        variant: good
        code: |
          // One statement: the check and the subtraction happen together
          $changed = $this->em->getConnection()->executeStatement(
              'UPDATE wallet SET balance = balance - ? WHERE id = ? AND balance >= ?',
              [$amount, $walletId, $amount],
          );

          if ($changed === 0) {           // phone 2: balance is now 200, so no row matches
              throw new InsufficientFunds();
          }
        marks:
          - {line: 3, tip: 'The WHERE is the check, the SET is the write. The database does both on one row, one request at a time, so phone 2 finds $200 < $800 and matches nothing.'}
          - {line: 7, tip: '0 rows changed means the check failed. Phone 1 changed 1 row and succeeded; phone 2 changed 0 and is refused.'}
    aside:
      - type: story
        title: 'The coupon on campaign night'
        body: |
          An app offered "$10 off your first order", once per user. On the night of the offer, some users double-tapped the button, and others tapped again because the network looked slow. By morning, about a hundred users had received the coupon twice.
      - type: terms
        items:
          - {term: 'Race condition', meaning: 'A bug where the result depends on how two operations happen to be timed: fine when run alone, wrong when run together.'}
          - {term: 'Double-spend', meaning: 'The same money being spent twice.'}
      - type: refs
        items:
          - {to: 'concurrency/atomic-operations', label: 'Atomic updates in depth, and where they stop working'}
          - {to: 'concurrency/locking', label: 'Locks, for decisions that span several rows'}
    check:
      q: 'Both requests ran exactly as the code says, so why is the balance wrong?'
      a: 'Both read the same stale balance before either wrote. The other request slipped into the gap between the check and the write.'

  - slug: read-modify-write
    title: 'Where the gap is: check-then-act and read-modify-write'
    kind: concept
    tldr: 'Nearly every race condition has the same shape: read something, think, then write, and someone else can get in between the read and the write.'
    keywords: ['check-then-act', 'read-modify-write', 'lost update', 'double booking', 'race window']
    blocks:
      - type: metaphor
        icon: book
        title: 'The grocery store''s stock ledger'
        body: |
          A grocery store keeps one ledger, and two clerks use it. Both look and see "rice: 10 lb in stock". Each sells 8 lb and writes "2 lb". The store actually has −6 lb of rice. Neither clerk made a mistake; the trouble is that a second clerk read the ledger between the first one's look and his write.
      - type: visual
        kind: table
        caption: 'One gap, four faces'
        headers: ['Name', 'What it looks like in code', 'Result', 'The fix']
        rows:
          - cells: ['Check-then-act', 'if (free) { book it }', 'The same seat booked twice', 'One statement that checks and acts, or lock first']
            tip: 'The state can change after the condition is checked, but the code carries on as if the earlier look were still true.'
          - cells: ['Read-modify-write', '$n = read; write $n + 1', 'Counter or stock updates are lost', 'Atomic UPDATE: SET stock = stock - 1']
            tip: 'Two requests read the same value and each writes its own result; the last write wipes out the earlier one. This is called a lost update.'
          - cells: ['Double-spend', 'Check the balance, then deduct', 'Money that doesn''t exist gets spent', 'UPDATE … WHERE balance >= the amount']
            tip: 'The money version of check-then-act. Wallets, points, credits, coupons: it is the same everywhere.'
          - cells: ['Double-booking', 'Check a seat or slot, then take it', 'One thing assigned to two people', 'Unique constraint on the seat or slot']
            tip: 'Seats, doctor slots, meeting rooms, delivery slots: anything meant for one person can suffer this.'
      - type: quote
        body: 'Another request can get in between the read and the write.'
    aside:
      - type: remember
        body: 'Look-then-do in two steps means a gap. Close the gap, or merge the two steps into one.'
      - type: problem
        body: 'The gap lasts milliseconds, so with low traffic it hits once a year. With heavy traffic or retries it hits daily, and that is when it is hardest to catch.'
      - type: refs
        items:
          - {to: 'concurrency/isolation-levels', label: 'Isolation levels and lost updates'}
          - {to: 'concurrency/acid', label: 'What a transaction does not protect'}
          - {to: 'concurrency/atomic-operations', label: 'The fixes in depth'}
    check:
      q: 'The counter code `$n = $row->count; $row->count = $n + 1;` is which kind of race, and why?'
      a: 'Read-modify-write. Two requests read the same `$n` and both write `$n + 1`, so the counter goes up once where it should have gone up twice.'

  - slug: spot-and-reproduce
    title: 'How to catch a race condition in your own code'
    kind: howto
    tldr: 'Be suspicious of any read-then-write in code, then fire 20 identical requests at once and check the result.'
    keywords: ['finding race conditions', 'parallel request', 'xargs', 'review checklist', 'reproduce']
    blocks:
      - type: points
        title: 'Smells to look for in code review'
        style: check
        items:
          - 'A `find` or `findOneBy`, then an `if`, then `persist` or a setter.'
          - 'Reading a value with a getter, doing arithmetic, and passing it back to a setter: `setStock($s->getStock() - 1)`.'
          - '"Check if it exists, create it if not" code.'
          - 'A comment beside the code saying "two people won''t do this at once". They will.'
      - type: text
        body: |
          If you suspect a race, prove it. Send many identical requests at the same time, then reconcile the numbers in the database. If you fire twenty $100 transfers at once from a $1,000 wallet, exactly 10 should succeed. If more than 10 succeed, or the balance isn't 0, there is a race. After you fix the code, run the same script again: exactly 10 successes and a balance of 0 is your proof.
      - type: code
        lang: bash
        file: 'scripts/race-test.sh'
        code: |
          # 20 requests, with up to 20 running at the same time
          seq 1 20 | xargs -P 20 -I{} curl -s -o /dev/null -w '%{http_code}\n' \
            -X POST http://localhost:8000/api/wallets/1/send \
            -H 'Content-Type: application/json' \
            -d '{"amount": 100}' | sort | uniq -c

          # then reconcile the numbers
          psql app -c "SELECT balance FROM wallet WHERE id = 1;"
        marks:
          - {line: 2, tip: '-P 20 means 20 curl processes run at once. Run them one after another and you will never see the race.'}
          - {line: 8, tip: 'With correct code, balance = 0 and there are exactly 10 responses with status 200. A negative balance or more than 10 successes means you caught a race.'}
    aside:
      - type: tips
        items:
          - 'In development, add an artificial `usleep(200000)` between the read and the write. The gap widens and the race becomes easy to see. Remove it afterwards.'
          - 'Tests like this are easier as a separate script or with k6 than in PHPUnit, because you need genuinely parallel HTTP requests.'
      - type: commands
        title: 'Useful commands'
        items:
          - {cmd: 'xargs -P 20', desc: 'runs 20 processes at the same time'}
          - {cmd: 'sort | uniq -c', desc: 'counts how many times each status appeared'}
    check:
      q: 'You fire twenty $100 transfers at once at a $1,000 wallet and 12 succeed. What does that tell you?'
      a: 'There is a race condition. At most 10 should succeed; 12 successes means some requests passed the check on the same stale balance.'

  - slug: unique-check-trap
    title: 'The "check if it exists first" trap, and its fix'
    kind: pitfall
    tldr: 'Searching before inserting a new row races; the real guard is the database''s unique constraint, and you handle its exception.'
    keywords: ['unique constraint', 'duplicate', 'UniqueConstraintViolationException', 'exists check', 'duplicates']
    blocks:
      - type: text
        body: |
          The most familiar race is "check whether anyone has already registered with this email, and if not, create a new account". If another request slips in between the check and the insert, two accounts get created. Your application code is fine at **checking** here, but it can't **guard**. Only the database can guard, because it lines every request up in a single queue.
      - type: code
        lang: php
        file: 'src/Service/RegistrationService.php'
        variant: bad
        code: |
          public function register(string $email): User
          {
              if ($this->users->findOneBy(['email' => $email])) {
                  throw new EmailTaken($email);          // the check: both will find "none"
              }

              $user = new User($email);
              $this->em->persist($user);
              $this->em->flush();                         // both will create
              return $user;
          }
        marks:
          - {line: 3, tip: 'If two requests hear "none" at the same moment, both carry on. This if guarantees nothing.'}
      - type: code
        lang: php
        file: 'src/Service/RegistrationService.php'
        variant: good
        code: |
          #[ORM\Entity]
          #[ORM\UniqueConstraint(name: 'uniq_user_email', columns: ['email'])]
          class User { /* ... */ }

          public function register(string $email): User
          {
              try {
                  $user = new User($email);
                  $this->em->persist($user);
                  $this->em->flush();
                  return $user;
              } catch (UniqueConstraintViolationException) {
                  throw new EmailTaken($email);   // the database itself says: someone got there first
              }
          }
        marks:
          - {line: 2, tip: 'This constraint lives inside the database. Even if two requests arrive together, only one insert survives.'}
          - {line: 12, tip: 'The losing request gets an exception from the database; turn it into a friendly error for the user. The EntityManager is closed after this, so the next request starts fresh.'}
      - type: quote
        body: 'The app can''t fix this, the database can: add a unique constraint to stop duplicates.'
    aside:
      - type: pitfalls
        items:
          - 'A PHP static variable, a file flag or a session lock can''t stop this race. With several servers or workers, they never see each other.'
          - 'Disabling the button is only UX. It does nothing when someone sends the request straight with curl, or when a retry happens.'
          - 'A unique constraint only stops duplicates. A rule like "balance never below 0" needs an atomic UPDATE or a lock instead.'
      - type: refs
        items:
          - {to: 'concurrency/atomic-operations', label: 'Atomic updates and unique constraints'}
          - {to: 'concurrency/locking', label: 'Closing the gap with locks'}
    check:
      q: 'Two accounts were created despite the email-exists `if`. What one thing would have prevented it properly?'
      a: 'A unique constraint on the email column. When two inserts arrive together, one fails, and you catch that exception to tell the user "email already taken".'

flashcards:
  - q: 'What is a race condition?'
    a: 'A bug where the result depends on how the timing of several requests or threads works out. Fine when run alone, wrong when run together.'
    more: |
      Every line of the code is correct on its own. The error comes when the steps of two requests interleave in the middle. That's why the bug doesn't always show up, and with low traffic it can hide almost completely.
    ref: two-phones
  - q: 'What is check-then-act, and why is it dangerous?'
    a: 'Checking a condition and then acting on the strength of it. The condition can change between the check and the action, so the result is wrong.'
    more: |
      For example, "check that the seat is free, then book it". If two requests check at once, both find it "free". Unless checking the condition and acting on it are one indivisible step, this gap will always exist.
    ref: read-modify-write
  - q: 'What is read-modify-write?'
    a: 'Reading a value, changing it in memory, then writing it back. If two requests read the same value, one write wipes out the other.'
    more: |
      Code like `$stock = $p->getStock(); $p->setStock($stock - 1);`. Two requests both read 10 and both write 9, when the answer should be 8. This is called a lost update.
    ref: read-modify-write
  - q: 'What is the difference between double-spend and double-booking?'
    a: 'The root mistake is the same (check-then-act). In double-spend, money or a balance gets spent twice; in double-booking, one seat or slot goes to two people.'
    more: |
      The names differ because the damage differs: one loses money, the other puts two customers face to face. The remedies belong to one family: locks, atomic updates, or unique constraints.
    ref: read-modify-write
  - q: 'When should you suspect a race condition in code?'
    a: 'Wherever something is read, then checked or calculated, then written, especially around balances, stock, seats, coupons, or "check if it exists" logic.'
    more: |
      Two signs are especially telling: reading with a getter and putting a new value into a setter, and a `findOneBy` followed by `if (!$x) { persist }`. When you see either, stop and ask, "what if two people arrive at once?"
    ref: spot-and-reproduce
  - q: 'How do you fix the wallet double-spend with one SQL statement?'
    a: 'UPDATE wallet SET balance = balance - 800 WHERE id = 1 AND balance >= 800. If 0 rows changed, the balance was too low: refuse the transfer.'
    more: |
      The WHERE is the check and the SET is the write, done together on one row by the database. With $1,000 and two phones, phone 1 changes 1 row (balance $200); phone 2 finds $200 < $800, matches nothing and gets 0 rows. It works for one row's arithmetic; a rule across several rows needs a lock or SERIALIZABLE.
    ref: two-phones
  - q: 'How do you test for a race condition?'
    a: 'Send 20 identical requests at the same time (for example with xargs -P) and reconcile the final numbers. Running them one after another won''t reveal a race.'
    more: |
      What you need is genuinely parallel requests. Twenty $100 requests against a $1,000 wallet should give exactly 10 successes and a balance of 0. More successes, or a negative balance, proves the race.
    ref: spot-and-reproduce
  - q: 'How do you stop two people registering with the same email?'
    a: 'Put a unique constraint on the email column and catch the insert''s UniqueConstraintViolationException to show a friendly error. An `if` search alone isn''t enough.'
    more: |
      The application's `if` tells both requests "none". The database's unique index lines every insert up in a queue, so only one survives. All you have to do is explain the failed request to the user in plain language.
    ref: unique-check-trap
  - q: 'Does disabling the button or keeping a PHP static flag prevent a race?'
    a: 'No. The button is only UX, and curl or retries get around it. A PHP flag lives inside one process; other workers and servers never see it.'
    more: |
      The protection has to sit where every request meets: the database. There, a constraint, a row lock or an atomic update is what you can rely on.
    ref: unique-check-trap

quiz:
  - q: 'What can go wrong if two requests run this code at the same time?'
    lang: php
    code: |
      $product = $em->find(Product::class, $id);
      $product->setStock($product->getStock() - 1);
      $em->flush();
    hint: 'What value do both requests start their calculation from?'
    options:
      - text: 'Both read the same stock and write the same new value, so one sale is lost from the count'
        correct: true
        why: 'This is read-modify-write. Both read 10 and write 9, when the correct value is 8.'
      - text: 'Doctrine automatically makes the second request wait'
        correct: false
        why: 'Doctrine does nothing of the kind; without a lock, both run at the same time.'
      - text: 'The second flush() always throws an exception'
        correct: false
        why: 'No constraint is violated, so flush() succeeds; it is only the arithmetic that comes out wrong.'
      - text: 'Nothing, because flush() uses a transaction'
        correct: false
        why: 'A transaction prevents half-done work, but it doesn''t stop two transactions from reading the same stale value.'
    ref: read-modify-write
  - q: 'Which change closes the gap in the wallet code from the first slide?'
    hint: 'Which version leaves no moment between the check and the write?'
    options:
      - text: 'One UPDATE … SET balance = balance - ? WHERE id = ? AND balance >= ?, treating 0 changed rows as "insufficient funds"'
        correct: true
        why: 'The check and the subtraction happen in one statement, so phone 2 sees 200, matches no row and is refused.'
      - text: 'Read the balance a second time just before writing'
        correct: false
        why: 'A second read is just another gap. Someone can still write between it and your write.'
      - text: 'Keep the PHP check and add usleep() before the write'
        correct: false
        why: 'Waiting only shifts the timing; both requests can still read the same stale balance.'
      - text: 'Add a unique constraint on wallet.id'
        correct: false
        why: 'The id is already unique, and no duplicate row is involved. The trouble is two writes to the same row.'
    ref: two-phones
  - q: 'Which of these are examples of a check-then-act race condition?'
    hint: 'Ask of each one: is there a "look first, then act" in it?'
    options:
      - text: 'Booking a seat after seeing it is free'
        correct: true
        why: 'Between the look and the booking, someone else can take the seat.'
      - text: 'Deducting money after seeing the balance is enough'
        correct: true
        why: 'If the balance you saw has gone stale, money that doesn''t exist gets spent.'
      - text: 'Creating a new account after seeing the email is unused'
        correct: true
        why: 'In the gap between the check and the creation, someone can register with the same email.'
      - text: 'Validating every field of a form before sending a response'
        correct: false
        why: 'No shared database state is read and then written, so there is no gap against other requests.'
    ref: read-modify-write
  - q: 'Ryan may use a coupon only once. He taps from two tabs at the same time and gets it twice. The code is `if (!$used) { apply(); $used = true; }`. What is the real problem?'
    hint: 'What happened between the check and the change?'
    options:
      - text: 'Both requests saw `$used` as false'
        correct: true
        why: 'The second one read before the first had written true. That is the check-then-act gap.'
      - text: 'The server''s clock is wrong'
        correct: false
        why: 'The clock has nothing to do with it; the error comes from the steps of two requests interleaving.'
      - text: 'The coupon table has no index'
        correct: false
        why: 'An index makes queries faster, not correct. Even with an index, both would read the same value.'
      - text: 'The user''s browser is out of date'
        correct: false
        why: 'The problem is in the server''s database, not the browser. A direct API call would behave the same.'
    ref: two-phones
  - q: 'You fire twenty $100 requests at once at a $1,000 wallet, and 13 succeed. What could the final balance be?'
    hint: 'What did each successful request write, and does the last write win?'
    options:
      - text: 'Exactly 0'
        correct: false
        why: 'The correct arithmetic would give 0, but more than 10 successes means some requests wrote from the same stale value, so the balance usually isn''t 0.'
      - text: 'Most likely above zero, even though $1,300 went out'
        correct: true
        why: 'Some requests wiped out each other''s writes (lost updates), so the balance shows more than it should: $300 was created from nothing.'
      - text: 'Definitely −300'
        correct: false
        why: 'It can''t go below 0: every request checked for at least 100 before writing, so no write is negative. Lost updates push the balance up, not down.'
    ref: spot-and-reproduce
  - q: 'To keep emails unique, a colleague says "just check with findOneBy before registering". Which view is right?'
    hint: 'Where would a guard have to sit for all requests to meet at one place?'
    options:
      - text: 'That works, because PHP handles one request at a time'
        correct: false
        why: 'Several worker processes run at once; a single thread inside PHP doesn''t prevent that.'
      - text: 'It will work if you add usleep() after findOneBy'
        correct: false
        why: 'Waiting doesn''t shrink the gap, it only shifts the timing. The race remains.'
      - text: 'It isn''t enough; you need a unique constraint on email and you must catch the exception'
        correct: true
        why: 'The database lines up every insert and lets only one survive. findOneBy is only good for giving a nicer error message.'
      - text: 'Keeping the used emails in a static variable will do'
        correct: false
        why: 'A static variable is separate for each process; other workers and servers don''t see it.'
    ref: unique-check-trap
  - q: 'Which approaches do NOT reliably prevent a race condition?'
    hint: 'A method confined to one process or one browser can''t see every request.'
    options:
      - text: 'Disabling the submit button'
        correct: true
        why: 'It is only UX. A direct API call, a retry or a second device walks right around it.'
      - text: 'Keeping a PHP static flag'
        correct: true
        why: 'The flag lives in each process''s own memory; other workers and servers know nothing about it.'
      - text: 'Adding a unique constraint'
        correct: false
        why: 'This is a reliable approach: the database itself blocks duplicate inserts.'
      - text: 'Running a conditional atomic UPDATE'
        correct: false
        why: 'When the read and the write happen in one SQL statement, there is no gap in between, so this is reliable too.'
    ref: unique-check-trap
