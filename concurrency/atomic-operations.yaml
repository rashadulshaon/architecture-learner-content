slides:
  - slug: oversold-stock
    title: 'শেষ ফোনটা দুজনের কাছে বিক্রি'
    kind: story
    tldr: 'শর্ত আর বদল এক SQL-এ লিখলে ডেটাবেস নিজেই ফাঁক বন্ধ করে: UPDATE … WHERE stock >= n, তারপর কয়টা সারি বদলাল দেখো।'
    keywords: ['atomic update', 'oversell', 'stock', 'UPDATE WHERE', 'affected rows', 'স্টক']
    blocks:
      - type: metaphor
        icon: ticket
        title: 'বাসের কন্ডাক্টরের সিট-কার্ড'
        body: |
          কন্ডাক্টর ভাই সিটে কার্ড ঝুলিয়ে দেন: দেখা আর ঝোলানো একই এক ঝটকায়। “সিট খালি কি না দেখি, তারপর ভাবি, তারপর কার্ড দিই” — এমন তিন ধাপ হলে মাঝখানে আরেক যাত্রী বসে পড়ত। Atomic operation ঠিক সেই এক ঝটকা: শর্ত দেখা আর বদলানো ডেটাবেসের এক ধাপেই।
      - type: visual
        kind: sequence
        caption: 'স্টকে ১টা ফোন, দুজন একসাথে কিনতে এল। এক UPDATE-এ একজনই পায়'
        actors:
          - {id: r1, label: 'রহিমের অর্ডার', icon: user, tip: 'শেষ ফোনটা কিনতে চায়।'}
          - {id: r2, label: 'করিমের অর্ডার', icon: user, tip: 'প্রায় একই মুহূর্তে একই ফোন কিনতে চায়।'}
          - {id: db, label: 'ডেটাবেস', icon: db, tip: 'প্রোডাক্ট সারিতে stock = ১।'}
        messages:
          - {from: r1, to: db, label: 'stock = stock − 1 WHERE stock >= 1', tip: 'শর্ত আর বদল একই statement-এ। ডেটাবেস সারিটা লক করেই করে।'}
          - {from: db, to: r1, label: '১টা সারি বদলেছে', dashed: true, tone: good, tip: 'affected rows = ১ মানে রহিম পেয়ে গেছে।'}
          - {from: r2, to: db, label: 'stock = stock − 1 WHERE stock >= 1', tip: 'এবার stock ০, তাই WHERE মেলে না।'}
          - {from: db, to: r2, label: '০টা সারি বদলেছে', dashed: true, tone: warn, tip: 'affected rows = ০ মানে স্টক শেষ। করিমকে “শেষ হয়ে গেছে” বলা হয়।'}
          - {at: db, note: 'stock = ০, কখনো −১ নয়', tone: good, tip: 'ফাঁক ছিল না, তাই overselling-ও নেই।'}
      - type: quote
        body: 'শর্ত WHERE-এ রাখো, তারপর কয়টা সারি বদলাল সেটা দেখো।'
    aside:
      - type: problem
        body: '“পড়ো, ভাবো, লেখো” তিন ধাপে। এক SQL-এ শর্ত আর বদল করলে ডেটাবেস নিজেই সারিটা লক করে করে, তাই ফাঁক থাকেই না।'
      - type: terms
        items:
          - {term: 'Atomic operation', meaning: 'এক অবিভাজ্য ধাপ: মাঝখানে অন্য কেউ ঢুকতে পারে না।'}
          - {term: 'Affected rows', meaning: 'একটা UPDATE বা DELETE কয়টা সারি বদলাল, সেই সংখ্যা।'}
      - type: refs
        items:
          - {to: 'concurrency/race-conditions', label: 'Read-modify-write ফাঁক'}
    check:
      q: 'দুই request একসাথে `UPDATE … SET stock = stock - 1 WHERE stock >= 1` চালাল, স্টক ১। কে কী পায়?'
      a: 'একজনের affected rows = ১ (সে ফোন পায়), অন্যজনের ০ (স্টক শেষ)। stock কখনো নেগেটিভ হয় না।'

  - slug: atomic-update-doctrine
    title: 'Symfony-তে atomic UPDATE: DQL আর DBAL'
    kind: howto
    tldr: 'getter-setter-এর বদলে DQL বা DBAL-এ `SET stock = stock - :n WHERE … AND stock >= :n` চালাও; ফল 0 হলে স্টক নেই।'
    keywords: ['DQL UPDATE', 'executeStatement', 'Doctrine', 'stock', 'atomic', 'CHECK constraint']
    blocks:
      - type: text
        body: |
          Doctrine-এ সবচেয়ে সহজ উপায় DQL-এর bulk `UPDATE`। `execute()` ফেরত দেয় কয়টা সারি বদলাল। সেই সংখ্যাটা নিজেই তোমার “শর্ত মিলল কি না”র উত্তর। সংখ্যা ০ হলে exception ছোড়ো, স্টক কখনো নেগেটিভ যাবে না।
      - type: code
        lang: php
        file: 'src/Service/StockService.php'
        variant: good
        code: |
          public function take(int $productId, int $qty): void
          {
              $updated = $this->em->createQuery(
                  'UPDATE App\Entity\Product p
                   SET p.stock = p.stock - :qty
                   WHERE p.id = :id AND p.stock >= :qty'
              )
                  ->setParameter('qty', $qty)
                  ->setParameter('id', $productId)
                  ->execute();                        // বদলানো সারির সংখ্যা

              if ($updated === 0) {
                  throw new OutOfStock($productId);   // শর্ত মেলেনি
              }
          }
        marks:
          - {line: 5, tip: 'অঙ্কটা ডেটাবেসে হচ্ছে, PHP-তে নয়। তাই অন্য request-এর সাথে মেশে না।'}
          - {line: 6, tip: 'শর্ত আর বদল একই statement-এ। এই `p.stock >= :qty`-ই overselling আটকায়।'}
          - {line: 12, tip: '০ মানে কেউ আগেই স্টক নিয়ে গেছে। এটাকে বিজনেস error হিসেবে সামলাও, bug নয়।'}
      - type: code
        lang: sql
        file: 'migrations/Version2026….php (SQL)'
        code: |
          -- শেষ রক্ষা: কোডে ভুল থাকলেও ডেটাবেস নেগেটিভ স্টক নেবে না
          ALTER TABLE product
              ADD CONSTRAINT product_stock_non_negative CHECK (stock >= 0);
        marks:
          - {line: 3, tip: 'CHECK constraint সবশেষের পাহারাদার। অন্য কোনো কোড বা script ভুল করলেও এখানে আটকে যায়।'}
    aside:
      - type: pitfalls
        items:
          - 'DQL bulk UPDATE Unit of Work এড়ায়; আগে লোড করা `$product` পুরনো stock দেখাবে, তাই `$em->refresh($product)` ডাকো। #[ORM\Version] থাকলে `p.version = p.version + 1`-ও লেখো।'
          - 'শুধু `execute()`-এর ফল না দেখলে লাভ নেই; ০ হলেও কোড এগিয়ে গেলে সেই oversell-ই।'
      - type: tips
        items:
          - 'Doctrine ছাড়া সরাসরি SQL চালালে `$connection->executeStatement($sql, $params)` একই সংখ্যা ফেরত দেয়।'
    check:
      q: 'DQL bulk UPDATE চালানোর পরে আগে লোড করা `$product->getStock()` ঠিক মান দেয় কি?'
      a: 'না, সেটা পুরনো মানই দেয়, কারণ bulk UPDATE Unit of Work-কে বাইপাস করে। নতুন মান চাইলে `$em->refresh($product)` ডাকো।'

  - slug: compare-and-swap
    title: 'Compare-and-swap: “এখনো আগের অবস্থাতেই আছে?”'
    kind: concept
    tldr: 'UPDATE-এর WHERE-এ আগের অবস্থা বসাও (status = ''pending''); affected rows ১ মানে তুমি জিতেছ, ০ মানে অন্যজন আগে করেছে।'
    keywords: ['compare and swap', 'CAS', 'state transition', 'webhook', 'duplicate', 'status']
    blocks:
      - type: text
        body: |
          Compare-and-swap (CAS) হলো: “মান যদি আমার ধারণার সমান হয়, তবেই নতুন মান বসাও”। SQL-এ এটা `WHERE status = 'pending'`। একই পেমেন্টের webhook দুইবার এলে দুজনেই “paid করতে চাই” বলে, কিন্তু ডেটাবেস একজনকেই জেতায়। যে জেতে শুধু সেই রসিদ পাঠায়।
      - type: visual
        kind: sequence
        caption: 'একই পেমেন্টের দুই webhook: শুধু প্রথমজন রসিদ পাঠায়'
        actors:
          - {id: w1, label: 'webhook ১', icon: bolt, tip: 'পেমেন্ট গেটওয়ে থেকে প্রথম বার্তা।'}
          - {id: w2, label: 'webhook ২', icon: bolt, tip: 'গেটওয়ের retry বা ডুপ্লিকেট বার্তা, প্রায় একই সময়ে।'}
          - {id: db, label: 'ডেটাবেস', icon: db, tip: 'অর্ডার ১২-এর status এখন pending।'}
        messages:
          - {from: w1, to: db, label: 'pending হলে paid করো', tip: 'UPDATE … SET status = ''paid'' WHERE id = 12 AND status = ''pending''।'}
          - {from: db, to: w1, label: '১টা সারি বদলেছে', dashed: true, tone: good, tip: 'w1 জিতেছে। এখন রসিদের কাজ শুধু সে-ই করবে।'}
          - {from: w2, to: db, label: 'pending হলে paid করো', tip: 'এই UPDATE-এ status ততক্ষণে paid, তাই WHERE মেলে না।'}
          - {from: db, to: w2, label: '০টা সারি বদলেছে', dashed: true, tone: warn, tip: 'w2 বুঝল, কাজটা আগে হয়ে গেছে; চুপচাপ 200 ফেরত দিয়ে শেষ।'}
      - type: code
        lang: sql
        file: 'src/Repository/OrderRepository.php (SQL)'
        code: |
          UPDATE orders
          SET status = 'paid', paid_at = NOW()
          WHERE id = 12 AND status = 'pending';
          -- affected rows = 1 → আমি জিতেছি; 0 → অন্যজন আগে পৌঁছেছে
        marks:
          - {line: 3, tip: 'এই `status = pending` অংশটাই compare। আগের অবস্থা না মিললে কিছুই বদলায় না।'}
    aside:
      - type: remember
        body: 'WHERE-এ আগের অবস্থা, তারপর affected rows গোনো: ১ হলে তুমি জিতেছ।'
      - type: refs
        items:
          - {to: 'payments/payment-state-machine', label: 'বৈধ transition আর state machine'}
          - {to: 'payments/webhooks', label: 'ডুপ্লিকেট webhook সামলানো'}
    check:
      q: 'দুই webhook একসাথে `WHERE status = ''pending''` দিয়ে paid করতে গেল। কীভাবে বুঝবে কোনটা জিতেছে?'
      a: 'affected rows দেখো। যার ১, সে জিতেছে এবং রসিদ পাঠাবে; যার ০, তার কাজটা আগেই হয়ে গেছে, সে চুপচাপ সরে যাবে।'

  - slug: unique-and-upsert
    title: 'Unique constraint আর upsert: নিয়মটাই ডেটাবেসে'
    kind: concept
    tldr: 'অনন্য থাকার নিয়ম index-এ লিখলে ডেটাবেস নিজে ডুপ্লিকেট আটকায়; “না থাকলে বানাও, থাকলে বদলাও” এক statement-এ করে upsert।'
    keywords: ['unique constraint', 'upsert', 'ON CONFLICT', 'ON DUPLICATE KEY', 'partial unique index']
    blocks:
      - type: text
        body: |
          Unique index শুধু পারফরম্যান্সের জিনিস নয়, এটা শুদ্ধতার যন্ত্র। “একজন ব্যবহারকারী একটা পোলে একবারই ভোট দেবে” নিয়মটা কোডে `if` দিয়ে নয়, `UNIQUE (poll_id, user_id)` দিয়ে লেখো। আর “আগে দেখি আছে কি না” দুই ধাপের জায়গায় **upsert**: না থাকলে বানাও, থাকলে বদলাও, সব এক statement-এ।
      - type: visual
        kind: table
        caption: 'নিয়ম যখন index হয়ে ডেটাবেসে বসে'
        headers: ['নিয়ম', 'ডেটাবেসের পাহারা']
        rows:
          - cells: ['ইমেইল ইউনিক', 'UNIQUE (email)']
            tip: 'দুই একাউন্ট একই ইমেইলে হতে পারে না, দুই request একসাথে এলেও।'
          - cells: ['এক পোলে এক ভোট', 'UNIQUE (poll_id, user_id)']
            tip: 'দুই কলামের জোড়া ইউনিক। দুইবার চাপলেও একটাই সারি থাকে।'
          - cells: ['এক সিটে একটাই সক্রিয় বুকিং', 'UNIQUE (seat_id) WHERE status = ''active''']
            tip: 'Partial unique index (PostgreSQL)। বাতিল বুকিং অনেক থাকতে পারে, কিন্তু সক্রিয় একটাই।'
          - cells: ['একই idempotency key একবারই', 'UNIQUE (idempotency_key)']
            tip: 'রিট্রাই এলে দ্বিতীয় insert ব্যর্থ হয়; তখন আগের উত্তরটাই ফেরত দিলে হয়।'
      - type: code
        lang: sql
        file: 'upsert — PostgreSQL / MySQL'
        code: |
          -- PostgreSQL: পেজ ভিউ গোনা, race ছাড়াই
          INSERT INTO page_view (page_id, day, views)
          VALUES (7, CURRENT_DATE, 1)
          ON CONFLICT (page_id, day)
          DO UPDATE SET views = page_view.views + 1;

          -- MySQL-এ একই কাজ
          INSERT INTO page_view (page_id, day, views) VALUES (7, CURDATE(), 1)
          ON DUPLICATE KEY UPDATE views = views + 1;
        marks:
          - {line: 4, tip: 'এই unique কলামজোড়াতেই conflict ধরা হয়। ওই index না থাকলে upsert কাজ করে না।'}
          - {line: 5, tip: 'conflict হলে নতুন সারি না বানিয়ে পুরনোটাতেই +১ হয়। পড়া ছাড়াই, তাই race ছাড়া।'}
      - type: quote
        body: 'যে নিয়ম ভাঙা চলবে না, সেটা unique index বা CHECK হয়ে ডেটাবেসে থাকুক।'
    aside:
      - type: tips
        items:
          - 'শুধু “আছে কি না” চাইলে `ON CONFLICT DO NOTHING` (MySQL-এ `INSERT IGNORE`) আর affected rows দেখো।'
          - 'Doctrine ORM-এর কোনো বিল্ট-ইন upsert নেই; এ ক্ষেত্রে `$connection->executeStatement()` দিয়ে নেটিভ SQL চালাও।'
      - type: refs
        items:
          - {to: 'data/schema-design', label: 'Constraint দিয়ে স্কিমা পাহারা'}
    check:
      q: 'দৈনিক পেজ ভিউ গুনতে “আছে কি না দেখো, থাকলে +১, না থাকলে বানাও” দুই ধাপের বদলে কী ব্যবহার করবে, আর কেন?'
      a: 'Upsert (`ON CONFLICT … DO UPDATE SET views = views + 1`)। unique index সব request-কে এক সারিতে মেলায়, আর +১ ডেটাবেসেই হয়, তাই কোনো ফাঁক থাকে না।'

  - slug: ignored-count
    title: 'ফল না দেখলে atomic-ও কাজ করে না'
    kind: pitfall
    tldr: 'atomic UPDATE চালিয়ে affected rows না দেখলে কোড ধরে নেয় সবসময় জিতেছে; ০ হলেও অর্ডার সম্পন্ন করে ফেলে।'
    keywords: ['affected rows', 'ignore result', 'oversell', 'silent failure', 'atomic pitfall']
    blocks:
      - type: text
        body: |
          অনেকে atomic UPDATE ঠিকই লেখে, কিন্তু তার ফল ফেলে দেয়। ডেটাবেস ঠিকই `stock` নেগেটিভ করেনি, তবু কোড অর্ডার “confirmed” করে দেয়, কারণ সে জানেই না UPDATE কিছু বদলায়নি। ফলে ক্রেতা ভাবে ফোন পেয়েছে, অথচ স্টকে ফোনই নেই।
      - type: code
        lang: php
        file: 'src/Service/OrderService.php'
        variant: bad
        code: |
          $this->em->createQuery(
              'UPDATE App\Entity\Product p SET p.stock = p.stock - 1
               WHERE p.id = :id AND p.stock >= 1'
          )->setParameter('id', $productId)->execute();   // ফল ফেলে দিল

          $order->confirm();             // স্টক ছিল না, তবুও confirmed
          $this->em->flush();
        marks:
          - {line: 4, tip: '০ ফেরত এলে মানে স্টক ছিল না, কিন্তু কোড সেটা দেখেই না।'}
          - {line: 6, tip: 'এখান থেকেই oversell শুরু। UPDATE নিরাপদ ছিল, কিন্তু কোড অন্ধ।'}
      - type: code
        lang: php
        file: 'src/Service/OrderService.php'
        variant: good
        code: |
          $taken = $this->em->createQuery(
              'UPDATE App\Entity\Product p SET p.stock = p.stock - 1
               WHERE p.id = :id AND p.stock >= 1'
          )->setParameter('id', $productId)->execute();

          if ($taken === 0) {
              throw new OutOfStock($productId);   // transaction-এ থাকলে rollback হবে
          }

          $order->confirm();
          $this->em->flush();
        marks:
          - {line: 6, tip: 'ফল ০ হলে এখানেই থামো। বাকি কাজের আগে সিদ্ধান্ত।'}
    aside:
      - type: pitfalls
        items:
          - 'একাধিক ধাপ থাকলে (স্টক কমানো, অর্ডার বানানো, পয়েন্ট কাটা) সবটা wrapInTransaction()-এ রাখো, নইলে স্টক কমে অর্ডার না-ও হতে পারে।'
          - 'MySQL-এ affected rows ডিফল্টে “বদলানো” সারি গোনে; যে UPDATE মান বদলায় না তার ফল ০। এখানে stock কমানোয় সমস্যা নেই, তবে অন্য কাজে খেয়াল রাখো।'
      - type: refs
        items:
          - {to: 'concurrency/reservations', label: 'স্টক আটকে রাখা reservation-এ'}
    check:
      q: 'atomic UPDATE নিরাপদ হলেও উপরের bad কোডে overselling কেন হলো?'
      a: 'কোড UPDATE-এর ফল (বদলানো সারির সংখ্যা) দেখেনি। ০ আসা মানে স্টক ছিল না, কিন্তু কোড তবুও অর্ডার confirm করে ফেলেছে।'

flashcards:
  - q: 'Atomic operation কী?'
    a: 'এমন একটা ধাপ, যার মাঝখানে অন্য কেউ ঢুকতে পারে না। শর্ত দেখা আর বদলানো একসাথে হয়ে ফাঁক বন্ধ হয়।'
    more: |
      “পড়ো, ভাবো, লেখো” তিন ধাপে ফাঁক থাকে। ডেটাবেসের এক UPDATE statement-এ শর্ত ও বদল দুটোই থাকলে সারিটা লক করে একসাথে করা হয়, তাই অন্য request মাঝখানে ঢুকতে পারে না।
    ref: oversold-stock
  - q: 'স্টক নিরাপদে কমানোর SQL কী?'
    a: '`UPDATE product SET stock = stock - :n WHERE id = :id AND stock >= :n`। তারপর affected rows দেখো: ০ মানে স্টক নেই।'
    more: |
      গণনা ডেটাবেসে হয়, PHP-তে নয়, তাই অন্য request-এর সাথে মেশে না। `stock >= :n` অংশটা নেগেটিভ স্টক আটকায়। কোডে ফল ০ হলে OutOfStock ছুড়ে দাও।
    ref: atomic-update-doctrine
  - q: 'Affected rows কেন গুরুত্বপূর্ণ?'
    a: 'এটা বলে WHERE শর্ত মিলেছিল কি না। ১ মানে তুমি কাজটা পেয়েছ, ০ মানে অন্য কেউ আগে করে ফেলেছে বা শর্ত মেলেনি।'
    more: |
      Doctrine DQL-এ `execute()` আর DBAL-এ `executeStatement()` এই সংখ্যা ফেরত দেয়। atomic UPDATE চালিয়ে এটা না দেখলে কোড অন্ধ থেকে যায়।
    ref: ignored-count
  - q: 'DQL bulk UPDATE-এর একটা সীমাবদ্ধতা কী?'
    a: 'এটা Unit of Work-কে এড়িয়ে যায়, তাই আগে লোড করা entity পুরনো মান দেখায়। দরকারে `$em->refresh($entity)` ডাকো।'
    more: |
      Doctrine তার identity map-এ রাখা অবজেক্ট আপডেট করে না, যেহেতু query সরাসরি ডেটাবেসে যায়। optimistic version থাকলে DQL-এ `p.version = p.version + 1`-ও নিজে লিখতে হয়।
    ref: atomic-update-doctrine
  - q: 'Compare-and-swap (CAS) কী?'
    a: 'মান যদি আমার ধারণার সমান হয়, তবেই নতুন মান বসাও। SQL-এ `UPDATE … SET status = ''paid'' WHERE status = ''pending''`।'
    more: |
      একই transition দুজন একসাথে করতে চাইলে ডেটাবেস একজনকেই জেতায়। affected rows ১ হলে তুমি জিতেছ, ০ হলে হারলে। রসিদ পাঠানো বা টাকা ফেরত দেওয়ার মতো কাজ কেবল জিতেছে যে, সেই করবে।
    ref: compare-and-swap
  - q: 'ডুপ্লিকেট webhook এলে কীভাবে একবারই কাজ হবে?'
    a: 'অবস্থা বদলের UPDATE-এ আগের অবস্থা শর্ত করো (WHERE status = ''pending'')। শুধু যার affected rows ১, সে কাজ করবে।'
    more: |
      গেটওয়ে retry করে, তাই একই webhook একসাথে দুইবার আসতে পারে। দ্বিতীয়জন ০ পেয়ে বুঝে যায় কাজ হয়ে গেছে, চুপচাপ 200 দিয়ে বেরিয়ে যায়।
    ref: compare-and-swap
  - q: 'Unique constraint কেন শুদ্ধতার যন্ত্র?'
    a: 'অনন্যতার নিয়মটা ডেটাবেসে বসে, তাই একসাথে আসা সব insert-এর মধ্যে একটাই টেকে। কোডের `if` যা পারে না।'
    more: |
      ইমেইল, এক-পোলে-এক-ভোট, idempotency key — সবই unique index দিয়ে সুরক্ষিত করা যায়। হেরে যাওয়া insert UniqueConstraintViolationException দেয়, সেটা ধরে ভালো error দেখাও।
    ref: unique-and-upsert
  - q: 'Upsert কী, আর কেন ভালো?'
    a: 'এক statement-এ “না থাকলে বানাও, থাকলে বদলাও”। PostgreSQL-এ ON CONFLICT DO UPDATE, MySQL-এ ON DUPLICATE KEY UPDATE।'
    more: |
      “আগে SELECT, তারপর INSERT বা UPDATE” দুই ধাপের race এড়ানো যায়। counter বাড়ানো, দৈনিক হিসাব বা cache-ঘরের মতো জায়গায় কাজে লাগে। unique index না থাকলে এটা কাজই করে না।
    ref: unique-and-upsert
  - q: 'Partial unique index কী কাজে লাগে?'
    a: 'শুধু কিছু সারির ওপর unique নিয়ম, যেমন এক সিটে একটাই সক্রিয় বুকিং, বাতিলগুলো যত খুশি। PostgreSQL-এ `WHERE status = ''active''`।'
    more: |
      `CREATE UNIQUE INDEX one_active ON booking (seat_id) WHERE status = 'active'`। double-booking ডেটাবেস নিজেই আটকায়, কোডে ফাঁক থাকলেও। MySQL-এ সরাসরি নেই; জেনারেটেড কলাম দিয়ে ঘোরানো যায়।
    ref: unique-and-upsert
  - q: 'কোডে ভুল থাকলেও নেগেটিভ স্টক কীভাবে আটকাবে?'
    a: 'কলামে CHECK (stock >= 0) দাও। এটা শেষ রক্ষা: যেকোনো কোড বা script ভুল করলেও ডেটাবেস নেগেটিভ মান নেবে না।'
    more: |
      atomic UPDATE প্রথম প্রতিরক্ষা, CHECK constraint দ্বিতীয়। দুটো থাকলে একটা ভুলের জন্য আরেকটা ধরে ফেলে। migration দিয়ে যোগ করো, সরাসরি SQL-এ নয়।
    ref: atomic-update-doctrine

quiz:
  - q: 'স্টক ১টা। দুই request নিচের কোড একসাথে চালাল। শেষে কী হতে পারে?'
    lang: php
    code: |
      $p = $em->find(Product::class, $id);
      if ($p->getStock() >= 1) {
          $p->setStock($p->getStock() - 1);
          $em->flush();
      }
    hint: 'দুজনেই স্টক কত পড়েছে?'
    options:
      - text: 'দুজনেই স্টক ১ পড়ে দুটো অর্ডার confirm হতে পারে; ফোন একটা, বিক্রি দুটো'
        correct: true
        why: 'পড়া আর লেখার মাঝে ফাঁক আছে। দুটোই ১ পড়ে ০ লিখেছে, কোনোটাই ব্যর্থ হয়নি।'
      - text: 'দ্বিতীয় flush() exception ছোড়ে কারণ স্টক নেগেটিভ'
        correct: false
        why: 'দুজনেই ০ লেখে, −১ নয়। কোনো constraint ভাঙে না।'
      - text: 'Doctrine একটাকে নিজে বাতিল করে'
        correct: false
        why: 'Doctrine কোনো lock বা বাতিল করে না; সেটা তোমাকে ঠিক করতে হয়।'
    ref: oversold-stock
  - q: 'নিচের কোনগুলো সঠিকভাবে স্টক কমানোর উপায়?'
    hint: 'যেখানে শর্ত আর কমানো এক ধাপে আছে।'
    options:
      - text: '`UPDATE product SET stock = stock - 1 WHERE id = 7 AND stock >= 1` চালিয়ে affected rows দেখা'
        correct: true
        why: 'শর্ত আর বদল এক ধাপে, ফল দেখে সিদ্ধান্ত। race-এর ফাঁক নেই।'
      - text: 'wrapInTransaction()-এ PESSIMISTIC_WRITE দিয়ে লোড করে stock চেক করে কমানো'
        correct: true
        why: 'row lock ফাঁক বন্ধ করে। অন্যরা লাইনে থাকে, তবে atomic UPDATE-এর চেয়ে ভারী।'
      - text: 'stock পড়ে `if` দেখে `setStock($s - 1)` করা'
        correct: false
        why: 'এটাই read-modify-write; কোনো lock নেই, ফাঁক রয়ে গেছে।'
      - text: 'PHP-র static counter দিয়ে স্টক গোনা'
        correct: false
        why: 'static ভ্যারিয়েবল প্রতি প্রসেসে আলাদা; একাধিক worker তা দেখে না।'
    ref: atomic-update-doctrine
  - q: 'দুই webhook একসাথে `UPDATE orders SET status=''paid'' WHERE id=12 AND status=''pending''` চালাল। দ্বিতীয়টার affected rows কত, আর সে কী করবে?'
    hint: 'প্রথমজন status বদলে দেওয়ার পরে WHERE মেলে কি?'
    options:
      - text: '১ — সে-ও রসিদ পাঠাবে'
        correct: false
        why: 'status ততক্ষণে paid, তাই WHERE মেলে না। ১ হলে রসিদ দুইবার যেত।'
      - text: '০ — সে বুঝবে কাজ হয়ে গেছে, চুপচাপ সফল উত্তর দিয়ে বেরোবে'
        correct: true
        why: 'ডুপ্লিকেট webhook-এ এটাই নিরাপদ আচরণ: কাজ একবারই, উত্তর দুই বারই 200।'
      - text: 'exception, কারণ দুই UPDATE একসাথে চলা নিষিদ্ধ'
        correct: false
        why: 'ডেটাবেস দুটোকে সিরিয়ালি চালায়, কোনো exception নয়; শুধু দ্বিতীয়টা কিছু বদলায় না।'
    ref: compare-and-swap
  - q: 'এক পোলে এক ভোট নিশ্চিত করার সবচেয়ে নির্ভরযোগ্য উপায় কোনটা?'
    hint: 'সব request কোথায় এসে মেলে?'
    options:
      - text: 'ভোট দেওয়ার আগে `findOneBy(poll, user)` দিয়ে দেখা'
        correct: false
        why: 'দেখা আর insert-এর মাঝে আরেকটা ভোট ঢুকতে পারে; এটা race।'
      - text: 'ফ্রন্টএন্ডে বাটন disable করা'
        correct: false
        why: 'শুধু UX; সরাসরি API call এটা এড়ায়।'
      - text: '`UNIQUE (poll_id, user_id)` দেওয়া আর exception ধরা'
        correct: true
        why: 'ডেটাবেস সব insert-কে লাইনে দাঁড় করিয়ে একটাকেই টিকতে দেয়।'
      - text: 'একটা PHP static array-তে ভোটারদের রাখা'
        correct: false
        why: 'প্রসেসের মেমোরি অন্য worker ও রিস্টার্টের পরে নেই।'
    ref: unique-and-upsert
  - q: 'কোনগুলো upsert-এর সঠিক ব্যবহারের জায়গা?'
    hint: 'যেখানে “না থাকলে বানাও, থাকলে বদলাও” দরকার।'
    options:
      - text: 'প্রতিদিনের পেজ ভিউ counter বাড়ানো'
        correct: true
        why: '(page_id, day) unique থাকলে `ON CONFLICT DO UPDATE SET views = views + 1` race ছাড়াই গোনে।'
      - text: 'ব্যবহারকারীর সর্বশেষ সক্রিয়তার সময় ধরে রাখা (প্রতি user এক সারি)'
        correct: true
        why: 'user_id unique হলে upsert এক statement-এ বানায় বা বদলায়।'
      - text: 'ব্যালেন্স থেকে টাকা কাটার জন্য অ্যাকাউন্ট না থাকলে বানিয়ে ফেলা'
        correct: false
        why: 'টাকা কাটা শর্তসাপেক্ষ (ব্যালেন্স যথেষ্ট কি না); এখানে `UPDATE … WHERE balance >= n` সঠিক।'
      - text: 'unique index ছাড়া কোনো কলামে ON CONFLICT'
        correct: false
        why: 'conflict ধরার জন্য unique index বা constraint লাগেই, না থাকলে statement ব্যর্থ হয়।'
    ref: unique-and-upsert
  - q: 'নিচের কোডে সমস্যা কোনটা?'
    lang: php
    code: |
      $em->createQuery(
          'UPDATE App\Entity\Product p SET p.stock = p.stock - 1
           WHERE p.id = :id AND p.stock >= 1'
      )->setParameter('id', $id)->execute();

      $order->confirm();
      $em->flush();
    hint: 'execute() যে সংখ্যা ফেরত দেয়, কোড তা দিয়ে কী করছে?'
    options:
      - text: 'UPDATE সারি বদলায়নি (০) হলেও অর্ডার confirm হয়ে যাচ্ছে'
        correct: true
        why: 'ফল না দেখায় স্টকহীন অবস্থাতেও অর্ডার সম্পন্ন। `=== 0` হলে exception ছোড়ো।'
      - text: 'WHERE-এ `stock >= 1` থাকায় ডেটাবেসে নেগেটিভ স্টক হবে'
        correct: false
        why: 'এই শর্তই নেগেটিভ স্টক আটকায়; সমস্যাটা কোডে, ডেটাবেসে নয়।'
      - text: 'DQL-এ stock = stock − 1 লেখা নিষিদ্ধ'
        correct: false
        why: 'এটা বৈধ আর প্রচলিত atomic অভ্যাস।'
    ref: ignored-count
