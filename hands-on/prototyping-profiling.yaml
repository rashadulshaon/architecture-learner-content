slides:
  - slug: two-weeks-wrong-thing
    title: 'দুই সপ্তাহ ধরে ভুল জিনিস দ্রুত করা'
    kind: story
    tldr: 'না মেপে অনুমানে optimise করলে সময় যায়, আসল ধীরতা থেকেই যায়; আগে মাপো, তারপর বদলাও।'
    keywords: ['profiling', 'premature optimization', 'performance', 'bottleneck', 'measure first', 'optimise']
    blocks:
      - type: text
        body: |
          রহিমের `/api/orders` ১.৪ সেকেন্ড লাগে। দল ধরে নিল JSON বানানোটাই ধীর, আর দুই সপ্তাহ লাগিয়ে সুন্দর একটা custom serializer লিখল। ফল? ১.৪ সেকেন্ড হলো ১.৩৬ সেকেন্ড। কেউ একবারও মাপেনি আসল সময় কোথায় যাচ্ছে। এক সপ্তাহ পরে একজন profiler খুলে দেখল, একটা query-ই ১.১৮ সেকেন্ড খাচ্ছে, কারণ একটা index নেই।
      - type: visual
        kind: compare
        caption: 'অনুমানে কাজ বনাম মেপে কাজ'
        columns:
          - title: 'অনুমানে optimise'
            tone: bad
            icon: cross
            tip: 'অভিজ্ঞ ডেভেলপারের অনুমানও প্রায়ই ভুল হয়, কারণ ধীরতা থাকে অপ্রত্যাশিত জায়গায়।'
            items: ['"মনে হয় serializer ধীর"', '২ সপ্তাহ কোড বদল', '১.৪ সে → ১.৩৬ সে', 'আসল সমস্যা যেমন ছিল তেমনই']
          - title: 'মেপে optimise'
            tone: good
            icon: check
            tip: 'আগে profiler, তারপর একটাই বদল, তারপর আবার মাপা। ফল তৎক্ষণাৎ বোঝা যায়।'
            items: ['Profiler খুলে সময়ের হিসাব দেখা', 'একটা index যোগ, ৫ মিনিট', '১.৪ সে → ০.২৫ সে', 'বদলের আগে-পরে সংখ্যা হাতে']
    aside:
      - type: story
        title: 'Knuth-এর বিখ্যাত কথা'
        body: |
          "অকাল optimisation সব অনিষ্টের মূল" — Donald Knuth। মানে এটা নয় যে ধীর কোড চলবে; মানে হলো না মেপে optimise কোরো না, কারণ ৯৭% জায়গার জন্য তা অর্থহীন আর ঐ ৩% আগে খুঁজে বের করতে হয়।
    check:
      q: 'দল দুই সপ্তাহে serializer দ্রুত করেও কেন সামান্যই লাভ পেল?'
      a: 'Serializer মোট সময়ের ছোট ভাগ মাত্র (প্রায় ৯০ms)। আসল সময় যাচ্ছিল একটা query-তে, যেটা তারা মাপেইনি। যেখানে সময় নেই সেখানে optimise করলে মোট সময় প্রায় বদলায় না।'

  - slug: measure-loop
    title: 'মাপো, বাছো, একটা বদলাও, আবার মাপো'
    kind: concept
    tldr: 'Optimise-এর চক্র: বেসলাইন মাপো, সবচেয়ে বড় ভাগটা খোঁজো, একটাই জিনিস বদলাও, আবার মাপো; লাভ না হলে বদল ফেরাও।'
    keywords: ['baseline', 'bottleneck', 'Amdahl', 'profiling loop', 'p95', 'বটলনেক', 'মাপা']
    blocks:
      - type: metaphor
        icon: heart
        title: 'ডাক্তারের পরীক্ষা'
        body: |
          পেট ব্যথা নিয়ে গেলে ভালো ডাক্তার না দেখে ওষুধ লেখে না: আগে পরীক্ষা, তারপর কারণ, তারপর একটা চিকিৎসা, তারপর আবার পরীক্ষা। ধীর অ্যাপও একই। **Profiler** হলো এক্স-রে মেশিন, আর **bottleneck** হলো ব্যথার জায়গা। সবকিছুতে একসাথে ওষুধ দিলে কোনটা কাজ করেছে বোঝা যায় না।
      - type: visual
        kind: bars
        caption: '/api/orders-এর ১৪০০ms কোথায় যাচ্ছে'
        items:
          - {label: 'ডেটাবেস query', value: 1180, display: '1180ms', tone: bad, tip: 'মোট সময়ের প্রায় ৮৪%। index-হীন query। এটাই bottleneck।'}
          - {label: 'Serializer', value: 90, display: '90ms', tone: warn, tip: 'রহিমের দল এটাকেই দোষ দিয়েছিল; আসলে মাত্র ৬%।'}
          - {label: 'বাকি PHP কোড', value: 80, display: '80ms', tone: default, tip: 'controller, voter, listener সব মিলিয়ে।'}
          - {label: 'নেটওয়ার্ক ও অন্যান্য', value: 50, display: '50ms', tone: muted, tip: 'ডেটাবেস সংযোগ, response পাঠানো ইত্যাদি।'}
      - type: quote
        body: 'না মেপে optimise কোরো না। সবচেয়ে বড় ভাগটাই আগে, আর প্রতিবারে একটা বদল।'
    aside:
      - type: remember
        body: 'আগে মাপো, তারপর বদলাও, তারপর আবার মাপো।'
    check:
      q: 'যদি ডেটাবেস query সময়ের ৮৪% খায়, তাহলে সব PHP কোড দ্বিগুণ দ্রুত করলে মোট সময় কতটা কমবে?'
      a: 'PHP-র ভাগ ছোট (~১৬%), তাই দ্বিগুণ দ্রুত করলে মোট সময় বড়জোর ৮% কমে। সবচেয়ে বড় ভাগে হাত না দিলে লাভ সামান্য (Amdahl-এর নিয়ম)।'

  - slug: profiler-stopwatch-explain
    title: 'Symfony Profiler, Stopwatch আর EXPLAIN'
    kind: howto
    tldr: 'Profiler দেখায় কোন request-এ কোন query কতক্ষণ; Stopwatch নিজের কোডের টুকরোর সময় মাপে; EXPLAIN ANALYZE দেখায় ডেটাবেস query কীভাবে চালাচ্ছে।'
    keywords: ['Symfony Profiler', 'Stopwatch', 'EXPLAIN ANALYZE', 'Blackfire', 'Doctrine panel', 'debug toolbar', 'seq scan', 'index']
    blocks:
      - type: text
        body: |
          তিন ধাপে খোঁজো। প্রথমে **Symfony Profiler** (`/_profiler`) খোলো: Doctrine ট্যাবে প্রতিটা query-র সময় আর সংখ্যা দেখা যায়, Performance ট্যাবে timeline। তারপর সন্দেহজনক অংশে **Stopwatch** বসাও। শেষে ধীর query-টা **EXPLAIN ANALYZE** দিয়ে ডেটাবেসকে জিজ্ঞেস করো সে কীভাবে চালিয়েছে।
      - type: code
        lang: php
        file: 'src/Service/OrderExporter.php'
        variant: good
        code: |
          public function __construct(private readonly ?Stopwatch $stopwatch = null) {}

          public function export(): array
          {
              $this->stopwatch?->start('export.load', 'app');
              $orders = $this->repo->findRecent(500);
              $this->stopwatch?->stop('export.load');

              $this->stopwatch?->start('export.serialize', 'app');
              $data = $this->serializer->normalize($orders, 'json');
              $this->stopwatch?->stop('export.serialize');

              return $data;
          }
        marks:
          - {line: 1, tip: 'Stopwatch শুধু debug-এ থাকে; nullable রাখলে production-এ কোড না ভেঙেই চলে।'}
          - {line: 5, tip: 'event-এর নাম আর "app" ক্যাটাগরি দিলে Profiler-এর timeline-এ রঙিন ব্লক হয়ে ফুটে ওঠে।'}
      - type: code
        lang: sql
        file: 'psql'
        code: |
          EXPLAIN (ANALYZE, BUFFERS)
          SELECT * FROM orders WHERE customer_id = 42 ORDER BY created_at DESC LIMIT 50;

          -- আগে: Seq Scan on orders (actual time=0.02..1180.4 rows=50 loops=1)
          --        সব row পড়ছে, তাই ধীর

          CREATE INDEX idx_orders_customer_created ON orders (customer_id, created_at DESC);

          -- পরে: Index Scan using idx_orders_customer_created (actual time=0.03..0.9 ...)
        marks:
          - {line: 1, tip: 'ANALYZE query সত্যিই চালিয়ে আসল সময় দেখায়। শুধু EXPLAIN অনুমান দেখায়।'}
          - {line: 4, tip: 'Seq Scan মানে পুরো টেবিল পড়া। বড় টেবিলে এটাই ধীরতার সবচেয়ে সাধারণ কারণ।'}
          - {line: 7, tip: 'WHERE আর ORDER BY-র কলাম মিলিয়ে index। ক্রম কলাম জুড়ে ঠিক রাখা জরুরি।'}
    aside:
      - type: commands
        title: 'আরও মাপার টুল'
        items:
          - {cmd: 'composer require --dev symfony/profiler-pack', desc: 'Profiler আর debug toolbar'}
          - {cmd: 'blackfire curl https://localhost/api/orders', desc: 'একটা request-এর call-graph ও সময়'}
          - {cmd: 'blackfire run php bin/console app:export', desc: 'console command profile করা'}
      - type: pitfalls
        items:
          - 'EXPLAIN ANALYZE সত্যিই query চালায়। UPDATE বা DELETE-এ চালালে ডেটা বদলে যায়; transaction-এ মুড়ে ROLLBACK করো।'
      - type: refs
        items:
          - {to: 'data/indexing', label: 'কোন কলামে কোন index'}
          - {to: 'data/n-plus-one', label: 'Profiler-এ ডুপ্লিকেট query ধরা'}
    check:
      q: 'Profiler-এর Doctrine ট্যাবে একই ধরনের query ২০০ বার দেখা গেলে এটা কীসের লক্ষণ, আর কী করবে?'
      a: 'N+1 query-র লক্ষণ। eager loading (`JOIN FETCH`) বা batch query দিয়ে সংখ্যা কমাও, তারপর আবার মেপে দেখো।'

  - slug: spike-first
    title: 'Spike: বড় সিদ্ধান্তের আগে ছোট পরীক্ষা'
    kind: howto
    tldr: 'Spike হলো সময়-বাঁধা, ফেলে-দেওয়া পরীক্ষামূলক কোড, যা একটা নির্দিষ্ট প্রশ্নের (এই লাইব্রেরি ১০ লাখ row সামলাবে?) সংখ্যায় উত্তর দেয়।'
    keywords: ['spike', 'prototype', 'throwaway code', 'proof of concept', 'timebox', 'de-risk', 'প্রোটোটাইপ']
    blocks:
      - type: metaphor
        icon: shop
        title: 'বিয়েবাড়ির রান্না'
        body: |
          পাঁচশ লোকের বিরিয়ানি রাঁধার আগে বাবুর্চি এক হাঁড়িতে ছোট করে রেঁধে লবণ-ঝাল চেখে দেখে। ছোট হাঁড়ির নাম **spike**: প্রশ্ন একটাই, সময় বাঁধা, আর শেষে হাঁড়িটা ধুয়ে ফেলা। ভুল ধরা পড়লে ক্ষতি এক হাঁড়ির, পাঁচশ প্লেটের নয়। চেখে যা শিখল, সেটাই আসল ফল, হাঁড়ি নয়।
      - type: visual
        kind: steps
        caption: 'একটা spike-এর জীবনচক্র'
        steps:
          - {title: '১. একটা প্রশ্ন', body: 'যেমন: ১০ লাখ row import ৫ মিনিটে হবে?', tip: 'প্রশ্ন সংখ্যায় উত্তরযোগ্য হলে ফল পরিষ্কার হয়। "ভালো লাগে কি না" নয়।'}
          - {title: '২. সময় বাঁধো', body: 'সর্বোচ্চ ১–২ দিন', tip: 'সময় না বাঁধলে spike নিজেই প্রজেক্ট হয়ে যায়।'}
          - {title: '৩. সবচেয়ে সস্তা কোড', body: 'টেস্ট নেই, সুন্দর structure নেই', tip: 'উদ্দেশ্য শেখা। কোড ফেলে দেবে বলেই এখানে তাড়াহুড়ো ঠিক।'}
          - {title: '৪. সংখ্যা লেখো', body: 'সময়, মেমোরি, অসুবিধা', tip: 'শেষ ফল একটা ছোট নোট: কী চেষ্টা করলাম, কী মাপলাম, সিদ্ধান্ত কী।'}
          - {title: '৫. কোড ফেলো', body: 'আসলটা নতুন করে লেখো', tip: 'spike-এর কোড production-এ ঢুকে গেলে ঋণ হয়ে বছর ধরে ভোগায়।'}
      - type: code
        lang: php
        file: 'spikes/bulk-insert.php'
        code: |
          // spike: ১০ লাখ row Doctrine-এ ঢোকাতে কত সময়? — এই ফাইল ফেলে দেওয়া হবে
          $start = hrtime(true);

          foreach ($rows as $i => $row) {
              $em->persist(new Product($row['sku'], $row['name']));

              if (0 === $i % 500) {          // ৫০০টা পরপর flush আর memory পরিষ্কার
                  $em->flush();
                  $em->clear();
              }
          }
          $em->flush();

          printf("%d row, %.0f ms, %.0f MB\n",
              count($rows), (hrtime(true) - $start) / 1e6, memory_get_peak_usage() / 1048576);
        marks:
          - {line: 2, tip: 'hrtime(true) ন্যানোসেকেন্ডে monotonic সময় দেয়; microtime-এর চেয়ে বেশি নির্ভরযোগ্য মাপে।'}
          - {line: 7, tip: 'ব্যাচ আকার বদলে বদলে চালিয়ে সংখ্যা মিলিয়ে দেখো। এটাই spike-এর আসল কাজ।'}
    aside:
      - type: tips
        items:
          - 'Spike-এর ফল একটা ছোট নোটে লেখো: প্রশ্ন, পদ্ধতি, সংখ্যা, সিদ্ধান্ত। ছয় মাস পরে কেউ জিজ্ঞেস করলে উত্তর থাকবে।'
          - 'আসল ডেটার আকারে (লাখ-কোটি row) চালাও, ১০০ row-তে নয়; ছোট ডেটায় সব কিছুই দ্রুত।'
      - type: refs
        items:
          - {to: 'thinking/reversible-decisions', label: 'কোন সিদ্ধান্ত ফেরানো যায়'}
    check:
      q: 'Spike শেষে কোডটা ফেলে দেওয়া হয় কেন, আর আসল ফল কী?'
      a: 'কোড তাড়াহুড়োর, টেস্ট বা কাঠামো ছাড়া; production-এ ঢুকলে ঋণ হয়। আসল ফল শেখা সংখ্যা ও সিদ্ধান্ত, যা নোটে থাকে।'

  - slug: measuring-mistakes
    title: 'মাপার ছয়টা ভুল'
    kind: pitfall
    tldr: 'ছোট ডেটায় মাপা, শুধু গড় দেখা, debug mode-এ মাপা, cache গরম না করা, একসাথে অনেক কিছু বদলানো — এসবে সংখ্যা মিথ্যা বলে।'
    keywords: ['benchmark mistakes', 'p95', 'warm cache', 'APP_DEBUG', 'micro benchmark', 'production-like data', 'মাপার ভুল']
    blocks:
      - type: text
        body: |
          ভুল মাপা, না মাপার চেয়েও খারাপ: ভুল সংখ্যা তোমাকে আত্মবিশ্বাস দিয়ে ভুল পথে হাঁটায়। নিচের ভুলগুলো সবচেয়ে সাধারণ।
      - type: visual
        kind: table
        caption: 'মাপার ফাঁদ আর ঠিক উপায়'
        headers: ['ভুল', 'কী ঘটে', 'ঠিক উপায়']
        rows:
          - cells: ['ডেভ ডেটাবেসে ১০০ row', 'index ছাড়াও দ্রুত লাগে', 'production-সমান আকারের ডেটায় মাপো']
            tip: 'ছোট টেবিলে Seq Scan-ও দ্রুত। সমস্যা প্রকাশ পায় লাখ-কোটি row-তে।'
          - cells: ['শুধু গড় (average)', 'ধীর ১% লুকিয়ে যায়', 'p50, p95, p99 দেখো']
            tip: 'গড় ১০০ms হলেও p99 ৫ সেকেন্ড হতে পারে; ব্যবহারকারী ঐ ধীর ভাগটাই মনে রাখে।'
          - cells: ['APP_DEBUG=1 বা dev পরিবেশে মাপা', 'profiler নিজেই বোঝা হয়', 'prod মোডে, cache গরম করে মাপো']
            tip: 'dev মোডে Symfony বাড়তি কাজ করে। cache warmup না করলে প্রথম request অস্বাভাবিক ধীর।'
          - cells: ['একবার চালিয়ে সংখ্যা ধরা', 'noise-কে ফল ভাবা', 'কয়েকবার চালিয়ে মাঝামাঝি নাও']
            tip: 'OS cache, ডেটাবেস buffer আর অন্য প্রসেস একবারের সংখ্যাকে নড়িয়ে দেয়।'
          - cells: ['একসাথে পাঁচটা বদল', 'কোনটা কাজ করেছে জানা যায় না', 'একবারে একটা বদল, প্রতিবার মাপো']
            tip: 'একসাথে বদলালে লাভ আর ক্ষতি গুলিয়ে যায়। একটা বদল মানে একটা সংখ্যার ফারাক।'
      - type: quote
        body: 'Production-এর মতো ডেটা, production মোড, কয়েকবার চালানো, p95 দেখা — তবেই সংখ্যা বিশ্বাসযোগ্য।'
    aside:
      - type: pitfalls
        items:
          - 'Micro-benchmark (যেমন `foreach` বনাম `array_map`) প্রায়ই অর্থহীন; আসল অ্যাপে I/O-ই সময় খায়।'
          - 'Spike-এর কোড "শুধু একটু" production-এ তুলে দেওয়া। প্রশ্ন শেষ হলে কোড ফেলো।'
      - type: refs
        items:
          - {to: 'observability/metrics-slos', label: 'p95 আর SLO কেন'}
    check:
      q: 'গড় response ১২০ms, কিন্তু ব্যবহারকারীরা "ধীর" বলছে। কী দেখবে?'
      a: 'p95 ও p99, কারণ গড় ধীর ভাগকে লুকিয়ে দেয়। হয়তো ১% request ৪ সেকেন্ড নিচ্ছে, আর সেটাই ব্যবহারকারীর স্মৃতিতে থাকে।'

flashcards:
  - q: 'Optimise করার আগে কী করা উচিত?'
    a: 'মাপা। Profiler দিয়ে দেখা সময় কোথায় যাচ্ছে, তারপর সবচেয়ে বড় ভাগটা বদলানো।'
    more: |
      অনুমান প্রায়ই ভুল হয়: রহিমের দল serializer-কে দোষ দিয়েছিল, অথচ ৮৪% সময় যাচ্ছিল একটা query-তে। মাপলে সেটা ৫ মিনিটে ধরা পড়ে।
    ref: two-weeks-wrong-thing
  - q: 'Optimise-এর চক্রটা কী?'
    a: 'বেসলাইন মাপো, bottleneck খোঁজো, একটা জিনিস বদলাও, আবার মাপো। লাভ না হলে বদল ফেরাও।'
    more: |
      একবারে একটা বদল রাখার কারণ: কোনটা কাজ করেছে জানতে। সংখ্যা না নড়লে বদলটা অকেজো, কোডে রাখার দরকার নেই।
    ref: measure-loop
  - q: 'Symfony Profiler-এ কোথায় ধীরতা খুঁজবে?'
    a: 'Doctrine ট্যাবে প্রতিটা query-র সময় ও ডুপ্লিকেট (N+1), আর Performance ট্যাবে timeline। `/_profiler`-এ খোলে।'
    more: |
      `composer require --dev symfony/profiler-pack` দিয়ে debug toolbar পাওয়া যায়। প্রতিটা request-এর একটা profile সংরক্ষিত থাকে, যা পরে খুলে দেখা যায়।
    ref: profiler-stopwatch-explain
  - q: 'Symfony Stopwatch কীসের জন্য?'
    a: 'নিজের কোডের নির্দিষ্ট টুকরোর সময় মাপতে। `start()`/`stop()` দিলে Profiler-এর timeline-এ ব্লক হয়ে দেখা যায়।'
    more: |
      সন্দেহের জায়গায় `$stopwatch->start('export.load', 'app')` দিয়ে শুরু, `stop()` দিয়ে শেষ। Stopwatch debug-এ থাকে, তাই nullable inject করা নিরাপদ।
    ref: profiler-stopwatch-explain
  - q: 'EXPLAIN আর EXPLAIN ANALYZE-এর পার্থক্য কী?'
    a: 'EXPLAIN শুধু পরিকল্পনা (অনুমান) দেখায়। EXPLAIN ANALYZE query সত্যিই চালিয়ে আসল সময় ও row দেখায়।'
    more: |
      ANALYZE সত্যিই চালায়, তাই UPDATE/DELETE-এ transaction-এ মুড়ে ROLLBACK করো। প্ল্যানে `Seq Scan` মানে পুরো টেবিল পড়া; বড় টেবিলে সাধারণত index-এর অভাবের লক্ষণ।
    ref: profiler-stopwatch-explain
  - q: 'Spike কী?'
    a: 'একটা প্রশ্নের উত্তর খুঁজতে সময়-বাঁধা, ফেলে-দেওয়া পরীক্ষামূলক কোড। ফল হলো শেখা, কোড নয়।'
    more: |
      যেমন "১০ লাখ row import ৫ মিনিটে হবে?" একটা স্পষ্ট প্রশ্ন। ১–২ দিন সময় দাও, সংখ্যা লিখে রাখো, কোড ফেলে দাও। আসলটা পরিষ্কারভাবে নতুন করে লেখো।
    ref: spike-first
  - q: 'Spike-এর কোড production-এ ঢুকলে কী ক্ষতি?'
    a: 'টেস্টহীন, তাড়াহুড়োর কোড ঋণ হয়ে বছর ধরে ভোগায়। তাই spike শেষে কোড ফেলাই নিয়ম।'
    more: |
      "শুধু একটু সাফ করে নিই" দিয়ে শুরু, আর দুই বছর পরে সবাই ভয় পায় ফাইলটা ছুঁতে। শেখা সংখ্যা নোটে রাখো, আর implement করো সঠিকভাবে।
    ref: spike-first
  - q: 'কেন শুধু গড় নয়, p95/p99 দেখতে হয়?'
    a: 'গড় ধীর ১–৫% request লুকিয়ে ফেলে। p95/p99 দেখায় সবচেয়ে খারাপ ব্যবহারকারী কী অভিজ্ঞতা পাচ্ছে।'
    more: |
      গড় ১২০ms হলেও p99 ৫ সেকেন্ড হতে পারে, আর ব্যবহারকারীরা ঐ ধীর অভিজ্ঞতাটাই মনে রাখে ও নালিশ করে। SLO সাধারণত p95/p99-এ লেখা হয়।
    ref: measuring-mistakes

quiz:
  - q: '`/api/orders` ১.৪ সেকেন্ড লাগছে। প্রথমে কী করবে?'
    hint: 'অনুমান, নাকি প্রমাণ?'
    options:
      - text: 'Serializer নতুন করে লেখা'
        correct: false
        why: 'এটা অনুমান; না মেপে বড় কাজে নামা দুই সপ্তাহ নষ্ট করতে পারে।'
      - text: 'Profiler/Stopwatch দিয়ে মাপা কোথায় সময় যাচ্ছে'
        correct: true
        why: 'আগে bottleneck জেনে নিলে ঠিক জায়গায় একটা বদলেই বড় লাভ।'
      - text: 'সার্ভারের RAM বাড়ানো'
        correct: false
        why: 'কারণ না জেনে হার্ডওয়্যার বাড়ালে খরচ বাড়ে, আসল সমস্যা থাকে।'
      - text: 'cache বসিয়ে দেওয়া'
        correct: false
        why: 'ধীর query ঢেকে রাখে, সারায় না; আর cache invalidation নতুন সমস্যা আনে।'
    ref: measure-loop
  - q: 'Profiler-এর Doctrine ট্যাবে একই query ৩০০ বার। কোনটা সম্ভাব্য কারণ?'
    hint: 'একটা তালিকা লোড করে প্রতিটার সম্পর্ক আলাদা করে আনা।'
    options:
      - text: 'N+1 — তালিকার প্রতিটা item-এর জন্য আলাদা query'
        correct: true
        why: 'লুপের ভেতরে lazy loading হলে এমনই হয়। `JOIN FETCH` বা batch query দাও।'
      - text: 'ডেটাবেস সংযোগ ধীর'
        correct: false
        why: 'সংযোগ ধীর হলে এক query-ই ধীর হতো, ৩০০ বার হতো না।'
      - text: 'Index নেই'
        correct: false
        why: 'index না থাকলে একটা query ধীর; সংখ্যা ৩০০ হয় না।'
    ref: profiler-stopwatch-explain
  - q: 'নিচের EXPLAIN ANALYZE আউটপুট কী বলছে?'
    lang: text
    code: |
      Seq Scan on orders  (cost=0.00..18334.00 rows=1 width=64)
                          (actual time=0.02..1180.4 rows=50 loops=1)
        Filter: (customer_id = 42)
        Rows Removed by Filter: 999950
    hint: 'প্রায় ১০ লাখ row পড়ে ৫০টা পাওয়া গেছে।'
    options:
      - text: 'পুরো টেবিল পড়ে ফিল্টার করছে; `customer_id`-তে index দরকার'
        correct: true
        why: 'Seq Scan আর Rows Removed by Filter ৯৯৯৯৫০ — index থাকলে সরাসরি দরকারি row-তে যেত।'
      - text: 'Query ঠিকই আছে, কিছু বদলানো লাগবে না'
        correct: false
        why: '১১৮০ms একটা সাধারণ lookup-এর জন্য অনেক বেশি।'
      - text: 'টেবিলে row কম, তাই দ্রুত'
        correct: false
        why: '১০ লাখ row-এর বেশি ছিল; কম row-র কথা বলা ভুল।'
    ref: profiler-stopwatch-explain
  - q: 'Spike সম্পর্কে কোন কথাগুলো ঠিক?'
    hint: 'spike-এর আসল পণ্য কী?'
    options:
      - text: 'একটা নির্দিষ্ট প্রশ্নের উত্তর খোঁজাই উদ্দেশ্য'
        correct: true
        why: 'প্রশ্ন স্পষ্ট না হলে spike দিশাহীন হয়ে যায়।'
      - text: 'সময় বাঁধা থাকে (যেমন ১–২ দিন)'
        correct: true
        why: 'নইলে spike আস্ত প্রজেক্ট হয়ে ওঠে।'
      - text: 'কোড ভালো করে লিখে সরাসরি production-এ তুলে দেওয়া যায়'
        correct: false
        why: 'spike-এর কোড টেস্টহীন, তাড়াহুড়োর; production-এ ঢুকলে ঋণ হয়।'
      - text: 'ফল শুধু "কাজ করেছে" বললেই চলে'
        correct: false
        why: 'সংখ্যা (সময়, মেমোরি) আর সিদ্ধান্ত লিখে রাখা দরকার।'
    ref: spike-first
  - q: 'রহিম নতুন ডেভেলপমেন্ট ল্যাপটপে ১০০ row নিয়ে মেপে বলল "query ঠিক আছে, ২ms"। production-এ ১ কোটি row। সমস্যা কী?'
    hint: 'ছোট ডেটায় Seq Scan কেমন লাগে?'
    options:
      - text: 'ছোট ডেটায় index ছাড়াও দ্রুত লাগে; বড় ডেটায় সমস্যা বেরোবে'
        correct: true
        why: 'ধীরতা ডেটার আকারের সাথে বাড়ে। production-সমান ডেটায় মাপা দরকার।'
      - text: 'ল্যাপটপের CPU দ্রুত বলে মাপ ভুল'
        correct: false
        why: 'CPU নয়, ডেটার আকারই মূল ফারাক।'
      - text: 'কোনো সমস্যা নেই'
        correct: false
        why: '১০০ row-তে পাওয়া সংখ্যা ১ কোটি row-র ভবিষ্যদ্বাণী নয়।'
    ref: measuring-mistakes
  - q: 'নির্ভরযোগ্য মাপার জন্য কোন কাজগুলো ঠিক?'
    hint: 'dev মোড, একবার চালানো, গড়, একসাথে অনেক বদল — কোনটা ভুল?'
    options:
      - text: 'প্রোডাকশন-সমান ডেটা ও prod মোডে (APP_DEBUG=0) মাপা'
        correct: true
        why: 'debug মোডে Symfony বাড়তি কাজ করে, সংখ্যা বিকৃত হয়।'
      - text: 'কয়েকবার চালিয়ে p95 দেখা'
        correct: true
        why: 'একবারের সংখ্যা noise-এ ভরা; p95 ধীর ভাগ ধরে।'
      - text: 'একবারে পাঁচটা optimisation বদল করে মাপা'
        correct: false
        why: 'কোনটা কাজ করল তা আলাদা করা যায় না।'
      - text: 'শুধু গড় response time দেখা'
        correct: false
        why: 'গড় ধীর কয়েক শতাংশকে লুকায়।'
    ref: measuring-mistakes
