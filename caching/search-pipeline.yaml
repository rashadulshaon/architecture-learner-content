            tip: 'নতুন পণ্য হলে document তৈরি হয়, পুরনো হলে বদলে যায় — দুটোই একই request।'
          - cells: ['পণ্য মোছা বা লুকানো', 'DELETE /products/_doc/42', 'search থেকে সরে যায়']
            tip: 'document আগে থেকেই না থাকলে 404 আসে; সেটাকে সফল ধরা হয়।'
          - cells: ['একই বার্তা দুইবার এল', 'একই PUT আবার পাঠায়', 'কোনো ক্ষতি নেই']
            tip: 'queue বার্তা অন্তত একবার পৌঁছায়, কখনো কখনো দুইবার। handler idempotent বলে তাতে সমস্যা হয় না।'
          - cells: ['Elasticsearch বন্ধ', 'exception ছোড়ে', 'Messenger পরে আবার চালায়']
            tip: 'retry_strategy অনুযায়ী ২, ৬, ১৮… সেকেন্ড পরে চেষ্টা হয়; শেষে failed transport-এ জমা পড়ে।'
