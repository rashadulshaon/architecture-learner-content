      a: 'একটাই। পণ্যের আইডি-ই document-এর আইডি, আর PUT প্রতিবার সেই একই document পুরোটা বদলে দেয় — নতুন কিছু তৈরি হয় না।'

  - slug: eventual-consistency
    title: 'কয়েক সেকেন্ডের ফাঁক: eventual consistency'
