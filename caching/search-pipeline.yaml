slides:
  - slug: dual-write-drift
    title: 'ডেটাবেসে আছে, search-এ নেই'
    kind: story
    tldr: 'Controller থেকে ডেটাবেস আর search index — দুই জায়গায় আলাদা করে লিখলে একটা ব্যর্থ হলেই দুটো আলাদা কথা বলে; এর নাম dual write।'
    keywords: ['dual write', 'drift', 'search index', 'অমিল', 'ডেটাবেস ও index', 'sync']
    blocks:
      - type: text
        body: |
          রহিম পণ্য save করার পরেই controller থেকে সরাসরি Elasticsearch-এ লিখে দেয়। লাইব্রেরির ভাষায়: বই তাকে তোলা আর ক্যাটালগ খাতায় নাম লেখা — দুই কাজ, দুই জায়গা। একদিন Elasticsearch আধা মিনিট বন্ধ ছিল। সেই ফাঁকে ৪০টা পণ্য ডেটাবেসে উঠল, কিন্তু index-এ উঠল না। বিক্রেতারা ফোন করছে: "পণ্য তুলেছি, খুঁজে পাচ্ছি না।" দুই জায়গায় আলাদা করে লেখার এই ফাঁদের নাম **dual write**।
      - type: code
        lang: php
        file: 'src/Controller/ProductController.php'
        variant: bad
        code: |
          #[Route('/api/products', methods: ['POST'])]
          public function create(#[MapRequestPayload] ProductInput $input): JsonResponse
          {
              $product = Product::fromInput($input);
              $this->em->persist($product);
              $this->em->flush();                          // ১. ডেটাবেসে লেখা

              $this->searchClient->request('PUT', '/products/_doc/'.$product->getId(), [
                  'json' => $product->toSearchDocument(),  // ২. search index-এ লেখা
              ])->getContent();

              return $this->json(['id' => $product->getId()], 201);
          }
        marks:
          - {line: 6, tip: 'এখানেই commit হয়ে গেল। এরপর যা-ই ঘটুক, পণ্যটা ডেটাবেসে থেকে যাবে।'}
          - {line: 8, tip: 'এই request ব্যর্থ হলে বা মাঝপথে প্রসেস মরে গেলে index-এ পণ্যটা কোনোদিন উঠবে না — কেউ পরে আবার চেষ্টা করে না।'}
          - {line: 10, tip: 'খদ্দের বসে থাকে যতক্ষণ না Elasticsearch উত্তর দেয়। search ধীর হলে পণ্য save করাও ধীর।'}
      - type: visual
        kind: sequence
        caption: 'এক request, দুই জায়গায় লেখা — দ্বিতীয়টা ব্যর্থ'
        actors:
          - {id: api, label: 'Controller', icon: api, tip: 'নিজেই দুই জায়গায় লেখার দায়িত্ব নিয়েছে।'}
          - {id: db, label: 'ডেটাবেস', icon: db, tip: 'আসল সত্য এখানে। এর commit আর ফেরানো যায় না।'}
          - {id: es, label: 'Elasticsearch', icon: search, tip: 'search index — ডেটাবেসের কপি, আলাদা সার্ভারে চলে।'}
        messages:
          - {from: api, to: db, label: 'পণ্য ৪২ save করো'}
          - {from: db, to: api, label: 'commit হয়ে গেছে', dashed: true}
          - {at: es, note: 'Elasticsearch ৩০ সেকেন্ড বন্ধ', tone: bad}
          - {from: api, to: es, label: 'পণ্য ৪২ index-এ তোলো', tone: bad}
          - {from: es, to: api, label: 'উত্তর নেই — timeout', dashed: true, tone: bad}
          - {at: api, note: 'খদ্দের পায় 500 error', tone: bad, tip: 'খদ্দের ভাবে পণ্য ওঠেনি, তাই আবার চেষ্টা করে — ডেটাবেসে তখন একই পণ্য দুইবার।'}
          - {at: db, note: 'পণ্য ৪২ আছে, search-এ নেই', tone: bad, tip: 'দুই জায়গার অমিলটা নিজে থেকে কখনো সারবে না।'}
    aside:
      - type: problem
        body: 'দুইটা আলাদা সিস্টেমে একসাথে "হয় দুটোই, নয় কোনোটাই না" লেখা যায় না। তাই একটাকে আসল ধরে অন্যটাকে তার পেছনে পেছনে চালাতে হয়।'
      - type: terms
        items:
          - {term: 'Dual write', meaning: 'একই তথ্য দুইটা আলাদা সিস্টেমে আলাদা করে লেখা; একটা ব্যর্থ হলেই অমিল।'}
          - {term: 'Drift', meaning: 'সময়ের সাথে কপি আর আসলের মধ্যে জমে ওঠা অমিল।'}
      - type: refs
        items:
          - {to: 'concurrency/distributed-transactions', label: 'Dual write সমস্যা ও 2PC'}
    check:
      q: 'flush() সফল হওয়ার পরে Elasticsearch-এর request ব্যর্থ হলে ডেটাবেস আর index-এর অবস্থা কী দাঁড়ায়?'
      a: 'ডেটাবেসে পণ্য আছে, index-এ নেই। ডেটাবেসের commit ফেরানো যায় না, আর কেউ পরে আবার চেষ্টাও করে না — তাই অমিলটা থেকেই যায়।'

  - slug: index-pipeline
    title: 'ডেটাবেস আসল, index তার কপি — মাঝে একটা pipeline'
    kind: concept
    tldr: 'আগে ডেটাবেসে লেখো, তারপর শুধু আইডি-সহ একটা বার্তা queue-তে দাও; worker ডেটাবেস থেকে তাজা অবস্থা পড়ে index বদলায়।'
    keywords: ['source of truth', 'indexing pipeline', 'queue', 'worker', 'derived data', 'আসল সত্য', 'কপি']
    blocks:
      - type: metaphor
        icon: book
        title: 'তাকের বই আর ক্যাটালগ খাতা'
        body: |
          লাইব্রেরিতে তাকের বই আসল, ক্যাটালগ খাতা তার কপি। নতুন বই এলে লাইব্রেরিয়ান বইটা তাকে রেখে ঝুড়িতে একটা চিরকুট ফেলেন: "বই ৪২ বদলেছে"। সহকারী পরে চিরকুট তুলে **নিজে তাকে গিয়ে বইটা দেখে**, তারপর খাতায় তোলে। চিরকুটে বইয়ের বিবরণ নেই, শুধু নম্বর। তাই চিরকুট দুইবার এলে বা উল্টো ক্রমে এলেও খাতায় ওঠে তাকের সর্বশেষ অবস্থাই।
      - type: visual
        kind: flow
        caption: 'ডেটাবেস থেকে search index পর্যন্ত pipeline'
        nodes:
          - {id: api, label: 'API', sub: 'Symfony', icon: api, col: 0, row: 1, tip: 'লাইব্রেরিয়ান। শুধু ডেটাবেসে লেখে আর একটা ছোট বার্তা পাঠায়; Elasticsearch-এর সাথে তার কোনো কথা নেই।'}
          - {id: db, label: 'ডেটাবেস', sub: 'আসল সত্য', icon: db, tone: accent, col: 1.5, row: 0, tip: 'তাকের বই। সব লেখা আগে এখানে হয়, আর সব প্রশ্নের চূড়ান্ত উত্তরও এখান থেকে আসে।'}
          - {id: queue, label: 'Queue', sub: 'পণ্য ৪২ বদলেছে', icon: queue, col: 1.5, row: 2, tip: 'চিরকুটের ঝুড়ি। Elasticsearch বন্ধ থাকলেও বার্তা এখানে নিরাপদে অপেক্ষা করে।'}
          - {id: worker, label: 'Worker', sub: 'index handler', icon: worker, col: 3, row: 2, tip: 'সহকারী। বার্তা তুলে ডেটাবেস থেকে পণ্যটা নতুন করে পড়ে, তারপর index-এ লেখে। ব্যর্থ হলে আবার চেষ্টা করে।'}
          - {id: es, label: 'Search index', sub: 'কপি', icon: search, col: 4, row: 1, tip: 'ক্যাটালগ খাতা। হারিয়ে গেলে ডেটাবেস থেকে পুরোটা আবার বানানো যায়।'}
        edges:
          - {from: api, to: db, label: 'আগে ডেটাবেসে লেখা হয় — এটাই আসল সত্য'}
          - {from: api, to: queue, label: 'তারপর শুধু "পণ্য ৪২ বদলেছে" বার্তা queue-তে যায়'}
          - {from: queue, to: worker, label: 'worker নিজের সময়ে বার্তাটা তোলে'}
          - {from: worker, to: db, label: 'ডেটাবেস থেকে পণ্য ৪২-এর সর্বশেষ অবস্থা পড়ে', dashed: true}
          - {from: worker, to: es, label: 'সেই অবস্থা দিয়ে index-এর document বদলে দেয়', tone: good}
      - type: points
        title: 'এই নকশায় তিনটা বিপদ কাটে'
        style: check
        items:
          - 'Elasticsearch বন্ধ? বার্তা queue-তে থাকে, worker পরে আবার চেষ্টা করে।'
          - 'একই বার্তা দুইবার এল? একই document আবার লেখা হয় — কোনো ক্ষতি নেই।'
          - 'বার্তা উল্টো ক্রমে এল? worker তো ডেটাবেসের সর্বশেষ অবস্থাই পড়ে।'
      - type: quote
        body: 'বার্তায় ডেটা নয়, শুধু আইডি। লেখার আগে worker সবসময় ডেটাবেস থেকে তাজা অবস্থা পড়বে।'
    aside:
      - type: terms
        items:
          - {term: 'Source of truth', meaning: 'যে জায়গার তথ্যকে চূড়ান্ত ধরা হয়; বাকি সব তার কপি।'}
          - {term: 'Derived data', meaning: 'আসল ডেটা থেকে বানানো কপি, যা মুছে আবার বানানো যায় — search index, cache, রিপোর্ট।'}
      - type: tips
        items:
          - 'বড় সিস্টেমে বার্তা পাঠানোর বদলে ডেটাবেসের পরিবর্তনের log পড়ে index বদলানো হয় (CDC)। নীতি একই: ডেটাবেস আগে, index পেছনে।'
      - type: refs
        items:
          - {to: 'messaging/events-vs-commands', label: 'Messenger ও queue-এর গোড়ার কথা'}
          - {to: 'data/oltp-olap', label: 'Derived data ও CDC'}
    check:
      q: 'বার্তায় পণ্যের নতুন দাম না পাঠিয়ে শুধু আইডি পাঠালে কোন দুইটা সমস্যা আপনাআপনি মিটে যায়?'
      a: 'একই বার্তা দুইবার আসা আর বার্তা উল্টো ক্রমে আসা। দুই ক্ষেত্রেই worker ডেটাবেস থেকে সর্বশেষ অবস্থা পড়ে, তাই index-এ পুরনো দাম ওঠার সুযোগ নেই।'

  - slug: dispatch-index-message
    title: 'লেখার দিক: flush, তারপর একটা ছোট বার্তা'
    kind: howto
    tldr: 'লেখার কোড শুধু ডেটাবেসে flush করে আর IndexProduct বার্তা dispatch করে; বার্তাটা আলাদা transport-এ যায়, retry-সহ।'
    keywords: ['Symfony Messenger', 'dispatch', 'transport', 'retry strategy', 'routing', 'বার্তা পাঠানো']
    blocks:
      - type: text
        body: |
          লেখার কোডের কাজ এখন মাত্র দুইটা: ডেটাবেসে flush করা, তারপর Symfony Messenger দিয়ে একটা ছোট বার্তা পাঠানো। Elasticsearch-এর নামও সে জানে না। বার্তাটা যায় আলাদা একটা transport-এ, অর্থাৎ আলাদা একটা লাইনে — যাতে search-এর কাজ ইমেইল বা পেমেন্টের বার্তার লাইন আটকে না রাখে।
      - type: code
        lang: php
        file: 'src/Catalog/ProductCatalog.php'
        variant: good
        code: |
          // src/Message/IndexProduct.php
          final readonly class IndexProduct
          {
              public function __construct(public int $productId)
              {
              }
          }

          // src/Catalog/ProductCatalog.php
          final readonly class ProductCatalog
          {
              public function __construct(
                  private EntityManagerInterface $em,
                  private MessageBusInterface $bus,
              ) {
              }

              public function changePrice(Product $product, int $priceInPaisa): void
              {
                  $product->changePrice($priceInPaisa);
                  $this->em->flush();                                         // ১. আগে সত্য

                  $this->bus->dispatch(new IndexProduct($product->getId()));  // ২. পরে খবর
              }
          }
        marks:
          - {line: 4, tip: 'বার্তায় শুধু আইডি। নাম, দাম — কিছুই নয়। তাই বার্তা কখনো "পুরনো" হয়ে যায় না।'}
          - {line: 21, tip: 'ডেটাবেসে commit না হওয়া পর্যন্ত বার্তা পাঠিয়ো না; নইলে worker এসে পুরনো অবস্থাই পড়বে।'}
          - {line: 23, tip: 'dispatch শুধু queue-তে একটা সারি লেখে — কয়েক মিলিসেকেন্ডের কাজ। খদ্দেরকে Elasticsearch-এর জন্য অপেক্ষা করতে হয় না।'}
      - type: code
        lang: yaml
        file: 'config/packages/messenger.yaml'
        code: |
          framework:
              messenger:
                  failure_transport: failed
                  transports:
                      search_index:
                          dsn: 'doctrine://default?queue_name=search_index'
                          retry_strategy:
                              max_retries: 5
                              delay: 2000      # প্রথম retry ২ সেকেন্ড পরে
                              multiplier: 3    # তারপর ৬, ১৮, ৫৪, ১৬২ সেকেন্ড
                      failed: 'doctrine://default?queue_name=failed'
                  routing:
                      App\Message\IndexProduct: search_index
        marks:
          - {line: 6, tip: 'আলাদা queue। RabbitMQ বা Redis ব্যবহার করলে শুধু এই dsn বদলাবে, বাকি কোড একই থাকবে।'}
          - {line: 8, tip: 'পাঁচবার চেষ্টা করেও না পারলে বার্তা failed transport-এ জমা হয় — হারায় না, পরে হাতে আবার চালানো যায়।'}
    aside:
      - type: commands
        title: 'Messenger কমান্ড'
        items:
          - {cmd: 'php bin/console messenger:consume search_index', desc: 'search-এর worker চালু করো'}
          - {cmd: 'php bin/console messenger:stats', desc: 'কোন queue-তে কয়টা বার্তা জমে আছে'}
          - {cmd: 'php bin/console messenger:failed:retry', desc: 'ব্যর্থ বার্তাগুলো আবার চালাও'}
      - type: pitfalls
        items:
          - 'flush আর dispatch-এর মাঝখানে প্রসেস মরলে বার্তাটা হারায়। পাকা সমাধান হলো ডেটা আর বার্তা একই transaction-এ লেখা — outbox প্যাটার্ন।'
      - type: refs
        items:
          - {to: 'workflows/outbox-inbox', label: 'Outbox: ডেটা আর বার্তা একসাথে'}
          - {to: 'messaging/dlq-retries', label: 'Retry ও failure transport'}
    check:
      q: 'IndexProduct বার্তাটা flush()-এর আগে dispatch করলে কী ভুল হতে পারে?'
      a: 'worker হয়তো commit-এর আগেই বার্তা তুলে ডেটাবেস পড়বে — তখন সে পুরনো অবস্থা পাবে আর index-এ সেটাই লিখবে। তাই ক্রম সবসময়: আগে flush, পরে dispatch।'

  - slug: index-handler
    title: 'পড়ার দিক: handler যেটা বারবার চালালেও ক্ষতি নেই'
    kind: howto
    tldr: 'Handler ডেটাবেস থেকে পণ্য পড়ে: থাকলে নিজের আইডি দিয়ে PUT, না থাকলে DELETE, আর ব্যর্থ হলে exception — যাতে Messenger আবার চেষ্টা করে।'
    keywords: ['AsMessageHandler', 'idempotent', 'upsert', 'HttpClient', 'retry', 'handler', 'বারবার চালানো']
    blocks:
      - type: text
        body: |
          সহকারীর কাজটা এমন হতে হবে, যেন একই চিরকুট দশবার এলেও খাতা ঠিক থাকে। এই গুণের নাম **idempotent** — একবার করা আর বারবার করার ফল একই। কৌশলটা সহজ: পণ্যের আইডিকেই document-এর আইডি বানাও আর `PUT` দিয়ে পুরো document বদলে দাও। তাহলে দ্বিতীয়বার লিখলে নতুন কিছু তৈরি হয় না, আগেরটাই আবার বসে।
      - type: code
        lang: php
        file: 'src/MessageHandler/IndexProductHandler.php'
        variant: good
        code: |
          #[AsMessageHandler]
          final readonly class IndexProductHandler
          {
              public function __construct(
                  private ProductRepository $products,
                  private HttpClientInterface $searchClient,
              ) {
              }

              public function __invoke(IndexProduct $message): void
              {
                  $url = '/products/_doc/'.$message->productId;
                  $product = $this->products->find($message->productId);

                  if (null === $product || !$product->isPublished()) {
                      $status = $this->searchClient->request('DELETE', $url)->getStatusCode();
                      if (!\in_array($status, [200, 404], true)) {
                          throw new \RuntimeException('Search delete failed: '.$status);
                      }

                      return;
                  }

                  $this->searchClient->request('PUT', $url, [
                      'json' => [
                          'name' => $product->getName(),
                          'brand' => $product->getBrand(),
                          'price' => $product->getPrice(),
                          'updated_at' => $product->getUpdatedAt()->format(\DATE_ATOM),
                      ],
                  ])->getContent();
              }
          }
        marks:
          - {line: 13, tip: 'বার্তায় যা-ই থাকুক, সত্যটা সবসময় ডেটাবেস থেকে নতুন করে পড়া হয়।'}
          - {line: 15, tip: 'পণ্য মুছে গেছে বা লুকানো? তাহলে index থেকেও সরাও। মোছার জন্য আলাদা বার্তার দরকার পড়ে না।'}
          - {line: 17, tip: '404 মানে আগে থেকেই নেই — সেটাও সফল। অন্য কিছু হলে exception, যাতে Messenger আবার চেষ্টা করে।'}
          - {line: 24, tip: 'আইডি-সহ PUT পুরো document বদলে দেয়। দশবার চালালেও index-এ document একটাই থাকে।'}
          - {line: 31, tip: 'getContent() 4xx/5xx বা সংযোগ ব্যর্থ হলে exception ছোড়ে — এই এক লাইনেই retry চালু হয়ে যায়।'}
      - type: visual
        kind: table
        caption: 'চার পরিস্থিতিতে handler কী করে'
        headers: ['পরিস্থিতি', 'handler কী করে', 'ফল']
        rows:
