  - slug: reindex-with-alias
    title: 'পুরো index নতুন করে বানানো — ডাউনটাইম ছাড়া'
    kind: howto
    tldr: 'নতুন index বানিয়ে ডেটাবেস থেকে ব্যাচে ভরো, তারপর alias এক ধাপে ঘুরিয়ে দাও; অ্যাপ সবসময় alias-এর নাম জানে, আসল index-এর নয়।'
    keywords: ['reindex', 'alias', 'bulk API', 'zero downtime', 'mapping change', 'নতুন করে index', 'backfill']
    blocks:
      - type: text
        body: |
          analyzer বা mapping বদলালে পুরনো ক্যাটালগ খাতা কেটেকুটে ঠিক করা যায় না — নতুন খাতা বানিয়ে তাক ধরে ধরে সব বই আবার তুলতে হয়। পাঠক যেন টের না পায়, সেজন্য সে সবসময় "টেবিলের খাতা" দেখে; কোন খাতাটা টেবিলে রাখা আছে তা সে জানে না। Elasticsearch-এ এই টেবিলের নাম **alias**: একটা ডাকনাম, যা আসল index-এর দিকে তাক করে থাকে।
      - type: visual
        kind: steps
        caption: 'products alias-কে v1 থেকে v2-তে নেওয়া'
        steps:
          - {title: '১. নতুন index বানাও', body: 'নতুন mapping দিয়ে products_v2। অ্যাপ এখনো alias ধরে v1 পড়ছে।', tip: 'পুরনো index-এ হাত দেওয়া হয় না, তাই এই পুরো সময় search স্বাভাবিকভাবে চলে।'}
