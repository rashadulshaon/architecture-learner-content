          - {title: '৪. যাচাই করো', body: 'ডেটাবেস আর v2-র সংখ্যা মেলাও; চেনা কয়েকটা খোঁজ চালিয়ে দেখো।', tip: 'alias ঘোরানোর আগে এটাই শেষ সুযোগ। ভুল ধরা পড়লে v2 মুছে আবার শুরু করো — খদ্দের কিছুই টের পায়নি।'}
          - {title: '৫. alias ঘোরাও', body: 'এক atomic ধাপে products → v2।', tone: accent, tip: 'পরের search request থেকেই নতুন index ব্যবহার হয়। মাঝে এমন কোনো মুহূর্ত নেই, যখন alias খালি।'}
          - {title: '৬. worker চালু করো', body: 'জমে থাকা বার্তা এখন v2-তে যায়। v1 কয়েক দিন পরে মুছো।', tip: 'worker ডেটাবেস থেকে তাজা অবস্থা পড়ে, তাই জমা বার্তা চালালেই v2 হালনাগাদ। v1 থাকা পর্যন্ত rollback মানে শুধু alias ফেরানো।'}
      - type: code
        lang: php
        file: 'src/Search/ProductReindexer.php'
        variant: good
        code: |
          final readonly class ProductReindexer
          {
              public function __construct(
                  private EntityManagerInterface $em,
                  private HttpClientInterface $searchClient,
              ) {
              }
              public function fill(string $index): void          // যেমন: products_v2
              {
                  $query = $this->em->createQuery(
                      'SELECT p FROM App\Entity\Product p WHERE p.published = true ORDER BY p.id'
                  );
                  $lines = '';
                  foreach ($query->toIterable() as $i => $product) {
                      $lines .= json_encode(['index' => ['_id' => $product->getId()]])."\n"
                          .json_encode($product->toSearchDocument())."\n";
                      if (0 === ($i + 1) % 500) {
                          $this->send($index, $lines);
                          $lines = '';
                          $this->em->clear();
                      }
                  }
                  if ('' !== $lines) {
                      $this->send($index, $lines);
                  }
              }

              private function send(string $index, string $lines): void
              {
                  $result = $this->searchClient->request('POST', "/$index/_bulk", [
                      'headers' => ['Content-Type' => 'application/x-ndjson'],
                      'body' => $lines,
                  ])->toArray();
                  $result['errors'] && throw new \RuntimeException('Bulk indexing failed.');
              }
          }
        marks:
          - {line: 14, tip: 'toIterable() একটা একটা করে সারি আনে; ১০ লাখ পণ্যও একসাথে মেমোরিতে ওঠে না।'}
          - {line: 15, tip: 'bulk-এর প্রতিটা document দুই লাইন: প্রথমে কী করতে হবে (index, আইডি-সহ), তারপর document নিজে।'}
          - {line: 20, tip: 'প্রতি ব্যাচের পরে Doctrine-এর মেমোরি খালি করো, নইলে লম্বা কাজে মেমোরি ফুরিয়ে যাবে।'}
          - {line: 34, tip: 'bulk request নিজে 200 দেয়, এমনকি কিছু document ব্যর্থ হলেও। তাই উত্তরের errors ঘরটা দেখতেই হবে।'}
      - type: code
        lang: http
        file: 'Elasticsearch: alias ঘোরানো'
        code: |
          POST /_aliases
          {
            "actions": [
              { "remove": { "index": "products_v1", "alias": "products" } },
              { "add":    { "index": "products_v2", "alias": "products" } }
            ]
          }
        marks:
          - {line: 3, tip: 'তালিকার সব কাজ একসাথে ঘটে, নয়তো কোনোটাই না। তাই কোনো search request খালি alias পায় না।'}
      - type: quote
        body: 'অ্যাপ কখনো আসল index-এর নাম জানবে না — সবসময় alias।'
    aside:
      - type: when
        use:
          - 'analyzer বা field-এর ধরন বদলেছে।'
          - 'index আর ডেটাবেসে অমিল জমেছে, বা cluster-টাই হারিয়ে গেছে।'
        avoid:
          - 'শুধু নতুন একটা field যোগ হয়েছে — সেটা চলতি mapping-এ যোগ করে পণ্যগুলো আবার index করলেই চলে।'
      - type: tips
        items:
          - 'ভরতে ঘণ্টা লাগলে worker না থামিয়ে handler-কে দুই index-এই লেখাও, সাথে external version ব্যবহার করো।'
          - 'রাতে একটা job চালাও, যা গত ২৪ ঘণ্টায় বদলানো সব পণ্যের জন্য আবার IndexProduct পাঠায়। হারানো বার্তার ক্ষত নিজে থেকেই সারে।'
      - type: refs
        items:
          - {to: 'recovery/bulk-reprocessing', label: 'নিরাপদে bulk reprocessing'}
    check:
      q: 'অ্যাপের কোডে সরাসরি products_v1 নাম লেখা থাকলে নতুন index-এ যেতে কী সমস্যা হতো?'
      a: 'নাম বদলাতে কোড deploy করতে হতো, আর deploy-এর সময়টুকু কিছু সার্ভার পুরনো, কিছু নতুন index পড়ত। alias থাকলে এক request-এ সবাই একসাথে নতুন index-এ চলে যায়।'

flashcards:
  - q: 'Dual write সমস্যা কী?'
    a: 'একই তথ্য দুইটা আলাদা সিস্টেমে আলাদা করে লেখা; একটা সফল আর অন্যটা ব্যর্থ হলে দুটো আলাদা কথা বলে।'
    more: |
      যেমন controller-এ আগে ডেটাবেসে flush, তারপর সরাসরি Elasticsearch-এ লেখা। দ্বিতীয়টা ব্যর্থ হলে পণ্য ডেটাবেসে থাকে, search-এ থাকে না, আর কেউ পরে আবার চেষ্টাও করে না। দুই সিস্টেমে একসাথে "সব অথবা কিছুই না" লেখা যায় না, তাই একটাকে আসল ধরে অন্যটাকে queue দিয়ে পেছনে চালাতে হয়।
    ref: dual-write-drift
  - q: 'Search index আর ডেটাবেস — কোনটা source of truth?'
    a: 'ডেটাবেস। Search index তার কপি, যা যেকোনো দিন মুছে আবার বানানো যায়।'
    more: |
      সব লেখা আগে ডেটাবেসে হয়, আর index তাকে পেছন থেকে অনুসরণ করে। তাই দাম, স্টক বা অনুমতির মতো সিদ্ধান্ত সবসময় ডেটাবেস দেখে নিতে হয়। index হারালে শুধু সময় নষ্ট হয়; ডেটাবেস হারালে ব্যবসা যায়।
    ref: index-pipeline
  - q: 'Index করার বার্তায় পুরো ডেটা না পাঠিয়ে শুধু আইডি পাঠানো হয় কেন?'
    a: 'worker তখন ডেটাবেস থেকে সর্বশেষ অবস্থা পড়ে; ফলে বার্তা দুইবার বা উল্টো ক্রমে এলেও index-এ পুরনো তথ্য ওঠে না।'
    more: |
      বার্তায় দাম লেখা থাকলে দুইটা দাম বদলের বার্তা উল্টো ক্রমে পৌঁছালে index-এ পুরনো দামটাই থেকে যেত। শুধু আইডি থাকলে বার্তার মানে দাঁড়ায় "এই পণ্যটা আবার দেখো" — সেটা যখনই চালাও, ফল সঠিক। বার্তাও ছোট থাকে।
    ref: index-pipeline
  - q: 'Index handler-কে idempotent বানানোর সহজ উপায় কী?'
    a: 'পণ্যের আইডিকেই document-এর আইডি বানিয়ে PUT দিয়ে পুরো document বদলে দেওয়া।'
    more: |
      Idempotent মানে একবার করা আর বারবার করার ফল একই। queue বার্তা কখনো কখনো দুইবার পৌঁছে দেয়, তাই এই গুণ না থাকলে একই পণ্য search-এ দুইবার দেখাত। আইডি ছাড়া POST করলে ঠিক সেটাই ঘটে — প্রতিবার নতুন document তৈরি হয়।
    ref: index-handler
  - q: 'Elasticsearch বন্ধ থাকলে indexing pipeline-এ বার্তার কী হয়?'
    a: 'handler exception ছোড়ে, Messenger বিরতি বাড়িয়ে আবার চেষ্টা করে; সব চেষ্টা ব্যর্থ হলে বার্তা failed transport-এ জমা থাকে।'
    more: |
      ডেটাবেসের লেখা ঠিকই সফল হয়, খদ্দেরও কিছু টের পায় না। শুধু search কিছুক্ষণ পুরনো থাকে। Elasticsearch ফিরে এলে retry-তেই index হালনাগাদ হয়ে যায়; failed transport-এ জমা বার্তা `messenger:failed:retry` দিয়ে আবার চালানো যায়।
    ref: dispatch-index-message
  - q: 'Search-এর প্রসঙ্গে eventual consistency মানে কী?'
    a: 'ডেটাবেসে লেখার পর index এক-দুই সেকেন্ড পিছিয়ে থাকে, তারপর নিজে থেকেই মিলে যায়।'
    more: |
      ফাঁকটা তৈরি হয় queue-তে অপেক্ষা, worker-এর কাজ আর Elasticsearch-এর refresh interval (সাধারণত ১ সেকেন্ড) মিলিয়ে। এটা bug নয়, এই নকশার স্বাভাবিক দাম। চাপ বাড়লে ফাঁকও বাড়ে, তাই queue-তে জমা বার্তার সংখ্যা আর বয়স মাপা দরকার।
    ref: eventual-consistency
  - q: 'ব্যবহারকারী কিছু লেখার ঠিক পরে যে পাতা দেখে, সেটা কোথা থেকে পড়া উচিত?'
    a: 'ডেটাবেস থেকে — search index থেকে নয়।'
    more: |
      index পিছিয়ে থাকে, তাই সেখান থেকে পড়লে ব্যবহারকারী নিজের সদ্য লেখা জিনিস খুঁজে পায় না আর ভাবে save হয়নি। "আমার পণ্য" তালিকা, edit পাতা, অর্ডারের বিবরণ — এগুলো ডেটাবেস থেকে আসুক। search থাকুক শুধু অন্যদের খুঁজে পাওয়ার জন্য।
    ref: eventual-consistency
  - q: 'Elasticsearch-এ alias কী, আর কেন অ্যাপ সবসময় alias ব্যবহার করে?'
    a: 'alias হলো index-এর ডাকনাম। এটাকে এক atomic ধাপে নতুন index-এর দিকে ঘোরানো যায়, তাই কোড না বদলে ডাউনটাইম ছাড়া reindex হয়।'
    more: |
      অ্যাপ জানে শুধু `products`; পেছনে সেটা products_v1 না products_v2, তা alias ঠিক করে। নতুন index পুরো ভরে যাচাই করার পরে alias ঘোরানো হয়। পুরনো index কয়েক দিন রেখে দিলে rollback মানে শুধু alias আবার ফিরিয়ে দেওয়া।
    ref: reindex-with-alias
  - q: 'কখন পুরো search index নতুন করে বানাতে হয়?'
    a: 'analyzer বা field-এর ধরন বদলালে, ডেটাবেসের সাথে অমিল জমলে, অথবা index হারিয়ে গেলে।'
    more: |
      চলতি index-এ কোনো field-এর analyzer বা ধরন বদলানো যায় না, কারণ পুরনো document-গুলো পুরনো নিয়মে term হয়ে বসে আছে। তাই নতুন mapping দিয়ে নতুন index বানিয়ে ডেটাবেস থেকে ব্যাচে (`_bulk`) ভরতে হয়। এই কাজটা যেন সবসময় করা যায় — এটাই প্রমাণ যে index সত্যিই কপি।
    ref: reindex-with-alias

quiz:
  - q: 'নিচের কোডে কোন কোন সমস্যা আছে?'
    lang: php
    code: |
      $this->em->persist($product);
      $this->em->flush();

      $this->searchClient->request('PUT', '/products/_doc/'.$product->getId(), [
          'json' => $product->toSearchDocument(),
      ])->getContent();

      return $this->json(['id' => $product->getId()], 201);
    hint: 'Elasticsearch ধীর হলে কী হবে, আর একেবারে বন্ধ থাকলে কী হবে — দুটো আলাদা করে ভাবো।'
    options:
      - text: 'Elasticsearch-এর request ব্যর্থ হলে পণ্য ডেটাবেসে থাকে কিন্তু index-এ ওঠে না, আর কেউ পরে চেষ্টা করে না'
        correct: true
        why: 'এটাই dual write: প্রথম লেখা commit হয়ে গেছে, দ্বিতীয়টা হারিয়ে গেল — অমিলটা থেকে যায়।'
      - text: 'খদ্দেরকে Elasticsearch-এর উত্তরের জন্য অপেক্ষা করতে হয়'
        correct: true
        why: 'search-এর কাজ request-এর ভেতরে থাকায় search ধীর হলে পণ্য save করাও ধীর হয়।'
      - text: 'flush() Elasticsearch-এ লেখার পরে ডাকা উচিত ছিল'
        correct: false
        why: 'তাহলে উল্টো বিপদ: index-এ এমন পণ্য উঠত, যা ডেটাবেসে নেই। আর auto-increment আইডিও flush-এর আগে পাওয়া যায় না।'
      - text: 'PUT-এর বদলে POST ব্যবহার করা উচিত ছিল'
        correct: false
        why: 'আইডি-সহ PUT-ই ঠিক, কারণ সেটা idempotent। সমস্যা method-এ নয়, দুই জায়গায় আলাদা করে লেখায়।'
    ref: dual-write-drift
  - q: 'সুমির সিস্টেমে বার্তায় নতুন দামটাই পাঠানো হয়: {id: 7, price: 500}, তারপর {id: 7, price: 450}। দুই worker বার্তা দুটো উল্টো ক্রমে শেষ করল, index-এ দাম রয়ে গেল ৫০০। সবচেয়ে ভালো সমাধান কী?'
    hint: 'বার্তাটা যদি শুধু বলত "পণ্য ৭ আবার দেখো", তাহলে ক্রম কি আর জরুরি থাকত?'
    options:
      - text: 'বার্তায় শুধু আইডি পাঠানো; handler ডেটাবেস থেকে সর্বশেষ দাম পড়ে লিখবে'
        correct: true
        why: 'তখন যে ক্রমেই বার্তা চলুক, প্রতিবার ডেটাবেসের সর্বশেষ দাম (৪৫০) index-এ ওঠে।'
      - text: 'worker-এর সংখ্যা বাড়ানো'
        correct: false
        why: 'worker বাড়লে বার্তা উল্টো ক্রমে শেষ হওয়ার সম্ভাবনা আরও বাড়ে।'
      - text: 'retry-র সংখ্যা ৫ থেকে ২০ করা'
        correct: false
        why: 'এখানে কিছুই ব্যর্থ হয়নি। দুই বার্তাই সফল — শুধু ভুল ক্রমে।'
      - text: 'প্রতিটা লেখায় ?refresh=true দেওয়া'
        correct: false
        why: 'refresh ঠিক করে কত তাড়াতাড়ি লেখা খোঁজায় দেখা যাবে; কোন লেখাটা শেষে বসল, তা বদলায় না।'
    ref: index-pipeline
  - q: 'বিক্রেতা পণ্য তুলে সাথে সাথে "আমার পণ্য" পাতায় যায়, কিন্তু নতুন পণ্যটা দেখে না; ৩ সেকেন্ড পরে দেখা যায়। পাতাটা search index থেকে ডেটা নেয়। সঠিক সমাধান কোনটা?'
    hint: 'নিজের লেখা নিজে সাথে সাথে দেখতে চাইলে কোন জায়গাটা কখনো পিছিয়ে থাকে না?'
    options:
      - text: '"আমার পণ্য" পাতা ডেটাবেস থেকে পড়া'
        correct: true
        why: 'ডেটাবেসই source of truth; সেখান থেকে পড়লে ব্যবহারকারী নিজের লেখা সাথে সাথে দেখে।'
      - text: 'controller-এ save-এর পরে sleep(3) বসানো'
        correct: false
        why: 'সব request ৩ সেকেন্ড ধীর হবে, আর চাপের দিনে ফাঁক ৩ সেকেন্ডের বেশি হলে সমস্যা ফিরে আসবে।'
      - text: 'queue বাদ দিয়ে controller থেকেই সরাসরি index-এ লেখা'
        correct: false
        why: 'তাতে dual write ফিরে আসে — Elasticsearch ব্যর্থ হলে পণ্য কোনোদিনই index-এ ওঠে না।'
      - text: 'প্রতিটা index request-এ ?refresh=true দেওয়া'
        correct: false
        why: 'queue-র অপেক্ষা তাতে কমে না, আর প্রতিবার জোর করে refresh করলে index করা অনেক ধীর হয়ে যায়।'
    ref: eventual-consistency
  - q: 'কোন কোন কারণে IndexProductHandler একই বার্তা দুইবার পেলেও index ঠিক থাকে?'
    hint: 'দ্বিতীয়বার চালালে নতুন কিছু তৈরি হয়, নাকি আগেরটাই আবার বসে?'
    options:
      - text: 'পণ্যের আইডি-ই document-এর আইডি, আর PUT পুরো document বদলে দেয়'
        correct: true
        why: 'একই আইডিতে আবার লিখলে নতুন document হয় না; আগেরটাই বদলে যায়।'
      - text: 'handler প্রতিবার ডেটাবেস থেকে সর্বশেষ অবস্থা পড়ে'
        correct: true
        why: 'তাই দ্বিতীয়বার চালালেও index-এ যা ওঠে, তা সঠিক আর তাজা।'
      - text: 'DELETE-এর উত্তরে 404 এলে সেটাকে সফল ধরা হয়'
        correct: true
        why: 'আগের চেষ্টায় document মুছে গিয়ে থাকলে দ্বিতীয় চেষ্টায় 404 আসে; সেটাকে ব্যর্থ ধরলে অকারণে retry চলত।'
      - text: 'Messenger কখনো একই বার্তা দুইবার পাঠায় না'
        correct: false
        why: 'পাঠায় — যেমন worker কাজ শেষ করে স্বীকৃতি দেওয়ার আগেই মরে গেলে। এজন্যই handler idempotent হওয়া দরকার।'
    ref: index-handler
  - q: 'পণ্যের নামের analyzer বদলাতে হবে, ক্যাটালগে ২০ লাখ পণ্য, আর search এক মিনিটও বন্ধ রাখা যাবে না। কোন পথ ঠিক?'
    hint: 'পুরনো index-টা চালু রেখে পাশে নতুন একটা বানানো যায় কি?'
    options:
      - text: 'নতুন index বানিয়ে ডেটাবেস থেকে bulk-এ ভরা, যাচাই করা, তারপর alias ঘোরানো'
        correct: true
        why: 'পুরো সময় পুরনো index search সামলায়; alias এক atomic ধাপে নতুনটায় যায়।'
      - text: 'চলতি index-এর mapping-এ analyzer বদলে দেওয়া'
        correct: false
        why: 'চলতি field-এর analyzer বদলানো যায় না; পুরনো document-গুলো পুরনো নিয়মে term হয়ে বসে আছে।'
      - text: 'index মুছে একই নামে নতুন করে বানিয়ে ভরা'
        correct: false
        why: 'ভরা শেষ না হওয়া পর্যন্ত search ফাঁকা বা অর্ধেক ফলাফল দেখাবে — এটাই ডাউনটাইম।'
      - text: 'Elasticsearch restart করা'
        correct: false
        why: 'restart-এ জমা থাকা term বদলায় না; analyzer শুধু index করার সময় চলে।'
    ref: reindex-with-alias
  - q: 'Indexing pipeline চালু আছে। Elasticsearch ১০ মিনিট বন্ধ থাকল, তারপর ফিরে এল। এই সময়ে খদ্দেরদের পণ্য save করার কী হয়েছে?'
    hint: 'লেখার কোড কি Elasticsearch-এর সাথে কথা বলে?'
    options:
      - text: 'save স্বাভাবিকভাবে সফল হয়েছে; বার্তাগুলো retry-তে অপেক্ষা করেছে, পরে index হালনাগাদ হয়েছে'
        correct: true
        why: 'লেখার দিক শুধু ডেটাবেস আর queue ছোঁয়। search কিছুক্ষণ পুরনো ছিল, কিন্তু কোনো ডেটা হারায়নি।'
      - text: 'সব save 500 error দিয়েছে'
        correct: false
        why: 'সেটা হতো controller সরাসরি Elasticsearch-এ লিখলে। pipeline-এ লেখার পথ search-এর ওপর নির্ভর করে না।'
      - text: 'ওই ১০ মিনিটের পণ্যগুলো আর কখনো search-এ আসবে না'
        correct: false
        why: 'বার্তা হারায়নি। retry শেষ হয়ে গেলেও সেগুলো failed transport-এ থাকে, সেখান থেকে আবার চালানো যায়।'
      - text: 'ডেটাবেসের transaction rollback হয়ে গেছে'
        correct: false
        why: 'ডেটাবেসের commit আগেই শেষ; worker-এর ব্যর্থতা সেটাকে আর ছুঁতে পারে না।'
    ref: dispatch-index-message
