      - type: remember
        body: 'আইডি এক, PUT দিয়ে পুরোটা বদল, সত্য পড়ো ডেটাবেস থেকে — এই তিনে handler idempotent।'
      - type: pitfalls
        items:
          - 'আইডি ছাড়া `POST /products/_doc` দিলে প্রতিবার নতুন document তৈরি হয় — একই পণ্য search-এ দুইবার দেখাবে।'
          - 'দুই worker একসাথে একই পণ্য লিখলে পুরনো অবস্থা পরে পৌঁছাতে পারে। `?version=…&version_type=external` দিলে Elasticsearch পুরনোটা ফিরিয়ে দেয়।'
