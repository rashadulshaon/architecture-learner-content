          - {id: reader, label: 'পাঠক', icon: eye, tip: 'ঠিক ওই মুহূর্তে দাম দেখতে আসা অন্য request।'}
          - {id: cache, label: 'Cache', icon: cache, tip: 'দ্রুত পড়ার জন্য রাখা কপি, যেটা এখানে পুরনো হয়ে যাচ্ছে।'}
          - {id: db, label: 'ডেটাবেস', icon: db, tip: 'আসল সত্য এখানে; লেখার পরে এখানে নতুন মান থাকে।'}
        messages:
          - {from: writer, to: cache, label: 'cache থেকে দাম মুছো'}
          - {from: reader, to: cache, label: 'দাম আছে?'}
          - {from: cache, to: reader, label: 'নেই (miss)', dashed: true}
          - {from: reader, to: db, label: 'দাম পড়ো'}
          - {from: db, to: reader, label: '৫০০ (পুরনো)', dashed: true, tip: 'লেখক এখনো ডেটাবেসে লেখেনি, তাই পুরনো মানই আসে।'}
          - {from: writer, to: db, label: 'নতুন দাম ৪৫০ লেখো'}
          - {from: reader, to: cache, label: '৫০০ রেখে দাও', tone: bad}
          - {at: cache, note: 'cache-এ ৫০০, ডেটাবেসে ৪৫০', tone: bad, tip: 'কেউ আর মুছবে না। TTL শেষ হওয়া পর্যন্ত ভুল দাম থাকবে।'}
      - type: code
        lang: php
        file: 'src/Catalog/PriceUpdater.php'
        variant: good
        code: |
          public function changePrice(Product $product, int $paisa): void
          {
              $product->changePrice($paisa);
              $this->em->flush();                               // ১. আগে সত্য লেখা

              $this->cache->invalidateTags(['product_'.$product->getId()]);  // ২. তারপর মোছা
          }
        marks:
          - {line: 4, tip: 'flush সফল না হলে পরের লাইনেই যাওয়া হয় না; তাই cache কখনো এগিয়ে থাকে না।'}
          - {line: 6, tip: 'মোছার পর যে request আসে, সে miss পেয়ে ডেটাবেস থেকে নতুন মান আনে।'}
      - type: quote
        body: 'আগে ডেটাবেস commit, তারপর cache মোছা। আর সবসময় একটা TTL।'
    aside:
      - type: remember
        body: 'সত্য আগে, কপি পরে — লেখার বেলাতেও, মোছার বেলাতেও।'
      - type: pitfalls
        items:
          - 'এই ক্রমেও খুব ছোট একটা ফাঁক থাকে (একটা পুরনো পড়া মোছার পরে ভরে দেওয়া)। এজন্যই TTL ছাড়া cache রাখা ঠিক নয়।'
          - 'transaction চলাকালে নয়, commit-এর পরে মোছো; নইলে rollback হলে cache অকারণে খালি হবে।'
      - type: refs
        items:
          - {to: 'caching/cache-stampede', label: 'মোছার পর miss-এর ঝড়'}
    check:
      q: 'Cache মুছে তারপর ডেটাবেসে লিখলে কীভাবে পুরনো মান আবার cache-এ ফিরে আসতে পারে?'
      a: 'মোছা আর লেখার ফাঁকে অন্য request miss পেয়ে ডেটাবেস থেকে পুরনো মান পড়ে cache-এ রেখে দেয়, আর কেউ তাকে আবার মোছে না।'

flashcards:
  - q: 'Cache invalidation কী?'
    a: 'আসল ডেটা বদলালে cache-এর পুরনো কপি মুছে ফেলা বা অকেজো করা।'
    more: |
      cache আসল ডেটার কপি, তাই আসল বদলালে কপি নিজে বদলায় না। invalidate না করলে ব্যবহারকারী বাসি তথ্য দেখে। এটা এত কঠিন যে বলা হয়, কম্পিউটার সায়েন্সে দুটো কঠিন জিনিস আছে: cache invalidation আর নাম রাখা।
    ref: old-price-board
  - q: 'TTL কী, আর কেন প্রতিটা cache entry-তে TTL দেওয়া উচিত?'
    a: 'TTL হলো entry-র মেয়াদ। মেয়াদ ফুরালে সে মুছে যায়। invalidate করতে ভুলে গেলেও ভুলটা মেয়াদ পর্যন্তই থাকে।'
    more: |
      TTL একটা সুরক্ষা জাল। কোডে কোথাও invalidate করা বাদ পড়লে TTL ছাড়া বাসি ডেটা চিরকাল থেকে যেত। TTL ঠিক করার প্রশ্ন: "এই ডেটা সর্বোচ্চ কতক্ষণ পুরনো থাকলে চলে?"
    ref: ttl-design
  - q: 'দামের মতো গুরুত্বপূর্ণ ডেটায় TTL কেমন রাখবে?'
    a: 'ছোট, যেমন ১ মিনিট, আর দাম বদলালেই সরাসরি invalidate।'
    more: |
      লম্বা TTL-এ ভুল দাম বেশিক্ষণ থাকে, আবার ছোট TTL একা নিশ্চিত নয়। তাই দুই স্তর: বদলালেই মোছো (প্রধান উপায়), আর ছোট TTL (শেষ ভরসা)।
    ref: ttl-design
  - q: 'Cache key-তে কী কী থাকতে হয়?'
    a: 'যা কিছু উত্তরকে বদলায়: আইডি, ব্যবহারকারী, ভাষা, পাতা, sort, আর আকারের version।'
    more: |
      `products` চাবিতে পাতা বা ভাষা না থাকলে ২য় পাতা চাইলেও ১ম পাতা ফেরত আসবে। ব্যবহারকারীভেদে আলাদা ডেটায় ব্যবহারকারী না থাকলে তথ্য ফাঁস হয়। উদাহরণ: `products.v2.cat7.page2.sort-price.bn`।
    ref: cache-keys
  - q: 'Versioned cache key কী কাজে লাগে?'
    a: 'cache-এর ভেতরের আকার বদলালে চাবির version বাড়ালে (v1 থেকে v2) সব পুরনো entry একসাথে অকেজো হয়।'
    more: |
      নতুন কোড v2 চাবি খোঁজে, তাই v1 entry-গুলো আর কেউ পড়ে না আর TTL-এ নিজেই মরে। এতে একটা একটা মুছতে হয় না। আকার বদলানো deploy-এর সময় এটা প্রায় বাধ্যতামূলক, নইলে নতুন কোড পুরনো আকারের entry পেয়ে ভেঙে যেতে পারে।
    ref: cache-keys
  - q: 'Symfony-তে cache tag কী কাজে লাগে?'
    a: 'একাধিক entry-কে একটা tag দিয়ে চিহ্নিত রাখলে invalidateTags() একটা কলে সবগুলো মুছে দেয়।'
    more: |
      `TagAwareCacheInterface` ব্যবহার করে callback-এ `$item->tag(['product_42'])` দিলেই হয়। পণ্য বদলালে `invalidateTags(['product_42'])`। কোন কোন entry-তে পণ্যটা আছে, তা আলাদা করে মনে রাখতে হয় না। Redis-এ `cache.adapter.redis_tag_aware` ব্যবহার করো।
    ref: tag-invalidation
  - q: 'ডেটাবেস বদলে cache মুছতে হলে সঠিক ক্রম কী?'
    a: 'আগে ডেটাবেসে লেখো ও commit করো, তারপর cache মোছো।'
    more: |
      আগে মুছলে ফাঁকে অন্য request পুরনো মান পড়ে cache-এ ভরে দিতে পারে, আর কেউ তাকে আর মোছে না। commit-এর পরে মুছলে পরবর্তী miss নতুন মান আনে। তবুও ছোট ফাঁক থেকে যায়, তাই TTL-ও রাখো।
    ref: invalidate-after-commit

quiz:
  - q: 'বিক্রেতা পণ্যের দাম বদলাল, কিন্তু ক্রেতারা ঘণ্টাখানেক পুরনো দাম দেখল। সবচেয়ে সম্ভাব্য কারণ কী?'
    hint: 'cache কপি রাখে; কপি কে আপডেট করে?'
    options:
      - text: 'দাম বদলের কোড cache invalidate করেনি, আর TTL ছিল ১ ঘণ্টা'
        correct: true
        why: 'কপি আসলের সাথে বদলায় না; invalidate বা মেয়াদ শেষ না হওয়া পর্যন্ত বাসি থাকে।'
      - text: 'ডেটাবেসে দাম সেভ হয়নি'
        correct: false
        why: 'সেভ না হলে কেউই নতুন দাম দেখত না; এখানে ডেটাবেস ঠিক আর cache পিছিয়ে।'
      - text: 'Redis খুব ধীর'
        correct: false
        why: 'গতির সমস্যা ভুল উত্তর দেয় না, ধীর উত্তর দেয়।'
      - text: 'ক্রেতার ব্রাউজারে ভাষা ভুল'
        correct: false
        why: 'ভাষা দামের সংখ্যা বদলায় না।'
    ref: old-price-board
  - q: 'কোন ডেটার জন্য সবচেয়ে ছোট TTL (বা cache না করা) উচিত?'
    hint: 'ভুল দেখালে কার ক্ষতি সবচেয়ে বেশি?'
    options:
      - text: 'ব্যবহারকারীর টাকার ব্যালেন্স আর checkout-এর স্টক'
        correct: true
        why: 'ভুল মান সরাসরি আর্থিক ক্ষতি করে, তাই এখানে সঠিকতা গতির ওপরে।'
      - text: 'দেশের তালিকা'
        correct: false
        why: 'এটা প্রায় কখনো বদলায়; লম্বা TTL নিরাপদ।'
      - text: 'সেরা ১০ পণ্যের তালিকা'
        correct: false
        why: '১০ মিনিট পুরনো হলেও কারও ক্ষতি নেই।'
      - text: 'ব্লগের পুরনো পোস্ট'
        correct: false
        why: 'পুরনো পোস্ট বদলায় না, তাই লম্বা TTL চলে।'
    ref: ttl-design
  - q: 'নিচের কোডে সমস্যা কী?'
    lang: php
    code: |
      $this->cache->delete('product.'.$id);
      $product->changePrice($paisa);
      $this->em->flush();
    hint: 'মোছা আর flush-এর মাঝের সময়ে আরেকটা request এলে কী পড়বে?'
    options:
      - text: 'মোছা আর flush-এর ফাঁকে আসা request পুরনো মান পড়ে cache-এ আবার রেখে দিতে পারে'
        correct: true
        why: 'তখন ডেটাবেসে নতুন, cache-এ পুরনো — আর কেউ আবার মুছবে না।'
      - text: 'delete() কখনো কাজ করে না'
        correct: false
        why: 'কাজ করে; সমস্যা ক্রমে, মেথডে নয়।'
      - text: 'cache-এর চাবিতে বিন্দু থাকা নিষেধ'
        correct: false
        why: 'বিন্দু বৈধ; নিষিদ্ধ অক্ষর হলো { } ( ) / \ @ :।'
      - text: 'changePrice() flush-এর আগে ডাকা উচিত নয়'
        correct: false
        why: 'changePrice() flush-এর আগেই ডাকা সঠিক; flush তার পরে।'
    ref: invalidate-after-commit
  - q: 'কোন কোন কাজ cache key ঠিকভাবে সাজানোর অংশ?'
    hint: 'যা উত্তর বদলায়, তা চাবিতে।'
    options:
      - text: 'তালিকার চাবিতে পাতা, sort আর ভাষা যোগ করা'
        correct: true
        why: 'নইলে ২য় পাতা চাইলেও ১ম পাতার cache ফেরত আসতে পারে।'
      - text: 'ব্যবহারকারীভেদে আলাদা ডেটার চাবিতে ব্যবহারকারীর আইডি রাখা'
        correct: true
        why: 'এতে একজনের তথ্য আরেকজন দেখে ফেলার ভয় কাটে।'
      - text: 'cache-এর আকার বদলালে চাবিতে version বাড়ানো'
        correct: true
        why: 'পুরনো আকারের entry-গুলো আর কেউ পড়ে না, তারা TTL-এ মরে।'
      - text: 'সব তালিকার জন্য একটাই চাবি রাখা, যাতে মনে রাখা সহজ হয়'
        correct: false
        why: 'এক চাবিতে ভিন্ন উত্তর রাখলে একটা আরেকটার জায়গা নেয়।'
