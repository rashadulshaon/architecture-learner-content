slides:
  - slug: history-vanished
    title: 'The price changed, and so did the old invoices'
    kind: story
    tldr: 'UPDATE wipes out the old value, so you can''t answer "what was it before?", "who changed it?" or "which price applied then?".'
    keywords: ['audit', 'history', 'temporal data', 'overwrite', 'who changed it', 'price history']
    blocks:
      - type: metaphor
        icon: book
        title: 'The corner shop''s credit ledger'
        body: |
          When there's a mistake in the credit ledger, a sensible shopkeeper doesn't scratch it out. He writes a new line: "Correction: 50 taka less, date, signature". In a scratched-out ledger nobody can tell what was written before. UPDATE is exactly that scratching out: the old value is gone, and so is who changed it and why.
      - type: text
        body: |
          At Rahim's shop, the price of rice went from 80 to 90 taka. Someone ran `UPDATE products SET price = 90 WHERE id = 7`. The invoice page reads the price from `products`, so last week's invoice now shows 90 taka, and the customer says, "But I bought it at 80." There's no proof either way.
      - type: visual
        kind: compare
        caption: 'The same event: overwriting vs keeping history'
        columns:
          - title: 'UPDATE only'
            tone: bad
            icon: pencil
            tip: 'The table holds only the current state. The database knows nothing about the past.'
            items:
              - 'The invoice now says 90 taka'
              - 'Who changed it? Unknown'
              - 'What was last month''s price? Unknown'
          - title: 'Keeping history'
            tone: good
            icon: history
            tip: 'Every step of a change is stored as its own row.'
            items:
              - 'The invoice shows the 80 taka from the time of sale'
              - 'Who, when and why are all recorded'
              - 'The price on any date can be looked up'
      - type: code
        lang: sql
        file: 'invoice query: the same line before and after'
        code: |
          -- before: the invoice borrows today's price, so it changes with it
          SELECT i.qty, p.price FROM order_items i JOIN products p ON p.id = i.product_id;

          -- after: the price is copied onto the line at the moment of sale
          INSERT INTO order_items (order_id, product_id, qty, unit_price)
          SELECT :order, p.id, :qty, p.price FROM products p WHERE p.id = :product;
        marks:
          - {line: 2, tip: 'The join reads whatever the price is now. After the UPDATE to 90, every old invoice silently shows 90.'}
          - {line: 6, tip: 'unit_price is written once and never joined back to products. A later price change cannot touch it.'}
      - type: quote
        body: 'If a value might ever be questioned, don''t overwrite it. Add a new line.'
    aside:
      - type: story
        title: 'Who raised the salary?'
        body: |
          An audit found that an employee's salary had changed three times, but the table held only the last figure. Who changed it, when, and with whose approval? No answers. An app may have a "last updated" column, but it never keeps the previous value.
      - type: tips
        items:
          - 'Copying the price answers "what did this customer pay?". It can''t answer "what was the price on 10 February?" for a product nobody bought that day; that needs effective dating (slide 3).'
      - type: terms
        items:
          - {term: 'Audit trail', meaning: 'An unalterable list of who changed what, and when.'}
          - {term: 'Temporal data', meaning: 'Data that changes over time, where you also need to know its past states.'}
    check:
      q: 'What are two different ways to keep an old invoice''s price correct?'
      a: 'Copy the price into `order_items` at the time of sale (a snapshot), or keep a price history and look up which price applied on that date.'

  - slug: audit-history
    title: 'Audit history: who changed what, and when'
    kind: concept
    tldr: 'Every important change adds a new row to an audit table: who, when, which record, the old and new values. Rows are never changed or deleted.'
    keywords: ['audit log', 'append-only', 'audit table', 'Doctrine', 'before after', 'audit trail']
    blocks:
      - type: text
        body: |
          An audit table follows the ledger's rule: lines are only ever added, and nobody touches the old ones. Each row records **who** (the actor), **when**, **which** record, what action, and the old and new values. It has to be written in the same transaction as the main change: if the change succeeds the audit row exists, and if it fails both disappear. Written separately, a crash between the two would leave a price change with no record of who made it.
      - type: code
        lang: sql
        file: 'migrations/audit_log.sql'
        variant: good
        code: |
          CREATE TABLE audit_log (
              id          BIGSERIAL PRIMARY KEY,
              occurred_at TIMESTAMPTZ NOT NULL DEFAULT now(),
              actor_id    BIGINT,              -- NULL = system / console command
              entity_type VARCHAR(60) NOT NULL,
              entity_id   BIGINT NOT NULL,
              action      VARCHAR(20) NOT NULL, -- created | updated | deleted
              old_values  JSONB,
              new_values  JSONB
          );
          CREATE INDEX idx_audit_entity ON audit_log (entity_type, entity_id, occurred_at);
        marks:
          - {line: 4, tip: 'NULL means no user was involved, such as a cron job or console command. You need to know that too.'}
          - {line: 11, tip: 'Almost every question is "show me this record''s history", so the index follows that order.'}
      - type: code
        lang: php
        file: 'src/Service/PriceChanger.php'
        variant: good
        code: |
          public function change(Product $p, int $newPrice, User $by): void
          {
              $this->em->wrapInTransaction(function () use ($p, $newPrice, $by): void {
                  $old = $p->getPrice();
                  $p->setPrice($newPrice);

                  $this->db->insert('audit_log', [
                      'actor_id'    => $by->getId(),
                      'entity_type' => 'product',
                      'entity_id'   => $p->getId(),
                      'action'      => 'updated',
                      'old_values'  => json_encode(['price' => $old]),
                      'new_values'  => json_encode(['price' => $newPrice]),
                  ]);
              });
          }
        marks:
          - {line: 3, tip: '`wrapInTransaction` commits or rolls back the main change and the audit row together.'}
          - {line: 12, tip: 'Both the old and the new value: without knowing "what it was", the history is incomplete.'}
      - type: points
        title: 'Rules for the audit table'
        style: check
        items:
          - 'INSERT only: don''t grant the app''s database user UPDATE or DELETE.'
          - 'Store the actor''s id, not just the name (names change).'
          - 'Never put secrets like passwords or card numbers in old/new values.'
    aside:
      - type: tips
        items:
          - 'A database trigger catches every change, even hand-typed SQL, but it doesn''t know the app user unless you pass it (for example SET LOCAL app.user_id). Writing from the app knows the user but misses anything done outside it.'
      - type: pitfalls
        items:
          - 'An audit log is not an application log. App logs get rotated away; audit data is legal evidence.'
          - 'The table only grows, one row per change. Plan how long to keep it, and partition it by month once it gets big.'
      - type: refs
        items:
          - {to: 'data/data-lifecycle', label: 'How long to keep audit data'}
    check:
      q: 'Why must the audit row be written in the same transaction as the main change?'
      a: 'If the change happens but the audit row doesn''t (or the reverse), the history has a gap or false information. In one transaction, both succeed or both fail.'

  - slug: effective-dating
    title: 'Effective dating: which price on which date'
    kind: howto
    tldr: 'Each price row has `valid_from` and `valid_to`. One query answers "what was the price on 10 February?", and an exclusion constraint prevents overlapping periods.'
    keywords: ['effective dating', 'valid_from', 'valid_to', 'temporal table', 'EXCLUDE USING gist', 'tstzrange', 'as-of query']
    blocks:
      - type: text
        body: |
          An audit says who changed something and when; **effective dating** says which value was valid during which period. In a price table you don't edit a row. You close the old row's `valid_to` and add a new row. An empty `valid_to` means "still in force". You can even set a price for a future date, such as an Eid offer starting on the 1st. Without a guard, one typo can leave two rows covering 20 February, so the lookup returns two prices and nobody knows which is right. An exclusion constraint in PostgreSQL stops that.
      - type: code
        lang: sql
        file: 'migrations/product_prices.sql'
        variant: good
        code: |
          CREATE EXTENSION IF NOT EXISTS btree_gist;

          CREATE TABLE product_prices (
              id         BIGSERIAL PRIMARY KEY,
              product_id BIGINT NOT NULL REFERENCES products (id),
              amount     INT NOT NULL CHECK (amount >= 0),
              valid_from TIMESTAMPTZ NOT NULL,
              valid_to   TIMESTAMPTZ,            -- NULL = still in force
              EXCLUDE USING gist (
                  product_id WITH =,
                  (tstzrange(valid_from, valid_to)) WITH &&
              )
          );

          -- Which price applied at noon on 10 February?
          SELECT amount FROM product_prices
          WHERE product_id = 7
            AND valid_from <= '2026-02-10 12:00+06'
            AND (valid_to IS NULL OR valid_to > '2026-02-10 12:00+06');
        marks:
          - {line: 9, tip: 'Two rows for the same product can never have overlapping periods. The database itself blocks the mistake.'}
          - {line: 18, tip: 'It started at or before `t`, and either hasn''t ended or ends after `t`: these two conditions match exactly one row.'}
      - type: code
        lang: php
        file: 'src/Service/PriceScheduler.php'
        variant: good
        code: |
          public function setPrice(int $productId, int $amount, \DateTimeImmutable $from): void
          {
              $this->em->wrapInTransaction(function () use ($productId, $amount, $from): void {
                  // close the current price at the moment the new one starts
                  $this->db->executeStatement(
                      'UPDATE product_prices SET valid_to = :from
                       WHERE product_id = :p AND valid_to IS NULL',
                      ['from' => $from, 'p' => $productId],
                      ['from' => Types::DATETIMETZ_IMMUTABLE],
                  );
                  $this->db->insert('product_prices', [
                      'product_id' => $productId, 'amount' => $amount,
                      'valid_from' => $from->format('c'),
                  ]);
              });
          }
        marks:
          - {line: 5, tip: 'The old row isn''t deleted; it only gets a `valid_to`. The history stays intact.'}
      - type: visual
        kind: table
        caption: 'Price history for product 7'
        headers: ['Price', 'valid_from', 'valid_to']
        rows:
          - cells: ['80 taka', '01 Jan', '15 Feb']
            tip: 'Purchases made during this period were at 80 taka.'
          - cells: ['90 taka', '15 Feb', 'empty (in force)']
            tip: 'An empty `valid_to` means this is the current price.'
    aside:
      - type: remember
        body: 'Don''t edit the row; close the old one and open a new one.'
      - type: tips
        items:
          - 'Copying the price onto the invoice line is the simplest approach. Effective dating pays off when you regularly need to know "what was it on that date".'
      - type: refs
        items:
          - {to: 'time/time-zones', label: 'Time zones and time mistakes'}
    check:
      q: 'Two rows for the same product in the price table could end up with overlapping periods. How do you prevent that in the database?'
      a: 'In PostgreSQL, use an `EXCLUDE USING gist` constraint that rejects a row when the `product_id` matches and the time ranges overlap.'

  - slug: soft-delete-traps
    title: 'Soft delete: the convenience and the traps'
    kind: pitfall
    tldr: 'Soft delete means setting `deleted_at`. But unique constraints get in the way, and forgetting the filter in one query shows deleted data. The fixes are a partial unique index and a Doctrine filter.'
    keywords: ['soft delete', 'hard delete', 'deleted_at', 'partial unique index', 'Doctrine SQLFilter', 'unique constraint']
    blocks:
      - type: text
        body: |
          **Soft delete** means keeping the row and setting `deleted_at`, so that an accidental delete can be undone and history stays. **Hard delete** really removes the row. The first trap: `users.email` is unique. Rahim deletes his account and tries to sign up again with the same email, but the deleted row is still holding that email, so he gets a unique error. The second trap: forget `deleted_at IS NULL` in even one query and deleted users reappear.
      - type: code
        lang: sql
        file: 'migrations/users_email_unique.sql'
        variant: good
        code: |
          -- wrong: deleted rows still hold the email
          -- ALTER TABLE users ADD CONSTRAINT uq_users_email UNIQUE (email);

          -- right: unique only among live rows
          CREATE UNIQUE INDEX uq_users_email_active
              ON users (lower(email))
              WHERE deleted_at IS NULL;
        marks:
          - {line: 5, tip: 'A partial unique index: uniqueness is only required among the rows that match the `WHERE` condition.'}
          - {line: 6, tip: '`lower(email)` makes the check case-insensitive.'}
      - type: code
        lang: php
        file: 'src/Doctrine/SoftDeleteFilter.php'
        variant: good
        code: |
          final class SoftDeleteFilter extends SQLFilter
          {
              public function addFilterConstraint(
                  ClassMetadata $targetEntity,
                  string $targetTableAlias,
              ): string {
                  if (!$targetEntity->hasField('deletedAt')) {
                      return '';
                  }

                  return sprintf('%s.deleted_at IS NULL', $targetTableAlias);
              }
          }

          // config/packages/doctrine.yaml
          //   orm: { filters: { soft_delete: { class: App\Doctrine\SoftDeleteFilter,
          //                                    enabled: true } } }
        marks:
          - {line: 11, tip: 'Doctrine adds this condition to the WHERE of every query itself. Nobody can forget it.'}
          - {line: 7, tip: 'For entities without a `deletedAt` field, the filter adds nothing.'}
      - type: visual
        kind: compare
        caption: 'Soft delete or hard delete'
        columns:
          - title: 'Soft delete'
            tone: warn
            icon: archive
            tip: 'Use it when you need to undo deletes and keep history. But personal data stays behind.'
            items:
              - 'Accidental deletes can be undone'
              - 'History and references stay intact'
              - 'Needs a filter and a partial unique index'
              - 'Personal data isn''t really erased'
          - title: 'Hard delete'
            tone: default
            icon: trash
            tip: 'For when data really must go, such as privacy requests or expired data.'
            items:
              - 'The data is truly gone'
              - 'Can cause foreign key trouble'
              - 'Can''t be undone (without a backup)'
    aside:
      - type: pitfalls
        items:
          - 'To show or restore deleted rows (an admin screen), switch the filter off for that request: `$em->getFilters()->disable(''soft_delete'')`.'
          - 'Native SQL and reporting queries don''t get the Doctrine filter. There you must write `deleted_at IS NULL` by hand.'
          - 'Soft delete makes the database grow; run a hard-delete job 30 to 90 days after deletion.'
      - type: refs
        items:
          - {to: 'data/data-lifecycle', label: 'When to really remove deleted data'}
    check:
      q: 'Signing up again with a soft-deleted email gives a unique error. How do you fix it?'
      a: 'Drop the column-wide unique constraint and create a partial unique index with `WHERE deleted_at IS NULL`. Then uniqueness applies only to live rows.'

flashcards:
  - q: 'What is an audit trail?'
    a: 'An add-only list of who changed what and when, including the old and new values.'
    more: |
      Rows are only ever added to an audit table; they are never changed or deleted. It lets you settle disputes with evidence, repair mistakes, and meet legal obligations.
    ref: audit-history
  - q: 'Why is the audit log written in the same transaction as the main change?'
    a: 'So the change and its history succeed or fail together; if one slips through alone, the history has a gap or false data.'
    more: |
      In Doctrine, use `$em->wrapInTransaction()`. In a separate transaction, there would be a window where the change succeeds but the audit write fails. To catch writes made outside the app, a database trigger is safest.
    ref: audit-history
  - q: 'How do you stop old invoices changing when a product''s price changes?'
    a: 'Copy the price onto the order line (`unit_price`) at the time of sale, and never join back to `products.price` for invoices.'
    more: |
      The invoice then rests on its own row, so a later UPDATE of the product cannot touch it. The price of this simplicity: it only knows prices that were actually sold. To answer "what was the price on 10 February?" for any product, use effective dating.
    ref: history-vanished
  - q: 'What is effective dating?'
    a: 'Storing `valid_from` and `valid_to` with each value, so you can say which value was valid on any date.'
    more: |
      Instead of editing a row, you close the old row's `valid_to` and open a new row. An empty `valid_to` means still in force. That gives you both past prices and prices scheduled for the future.
    ref: effective-dating
  - q: 'How do you stop time ranges from overlapping in PostgreSQL?'
    a: 'With the constraint `EXCLUDE USING gist (product_id WITH =, tstzrange(valid_from, valid_to) WITH &&)`.'
    more: |
      It says that no two rows may have the same `product_id` and overlapping time ranges. It needs the `btree_gist` extension. Even if the application code has a bug, the database won't accept the bad data.
    ref: effective-dating
  - q: 'What is the difference between soft delete and hard delete?'
    a: 'Soft delete keeps the row and sets `deleted_at`; hard delete really removes the row.'
    more: |
      Soft delete lets you undo accidental deletes and keep history, but personal data stays and a forgotten filter exposes deleted rows. For privacy requests or expired data, you eventually need a hard delete.
    ref: soft-delete-traps
  - q: 'Why does an email unique constraint break with soft delete?'
    a: 'The deleted row still holds the email, so a new row with the same email can''t be inserted.'
    more: |
      The fix is a partial unique index instead of a plain `UNIQUE (email)`: `CREATE UNIQUE INDEX ... ON users (lower(email)) WHERE deleted_at IS NULL`. Then uniqueness applies only among live rows.
    ref: soft-delete-traps
  - q: 'How do you add `deleted_at IS NULL` to every query in Doctrine?'
    a: 'Write an `SQLFilter` and enable it in `doctrine.yaml`; Doctrine then adds the condition to every WHERE itself.'
    more: |
      Return `%s.deleted_at IS NULL` from `addFilterConstraint()`. The filter doesn't apply to native SQL or DBAL queries, where you must write it by hand. Forgetting it in report queries is a common source of mistakes.
    ref: soft-delete-traps
quiz:
  - q: 'After a sale, a product''s price changes. What is the simplest way to keep old invoices correct?'
    hint: 'What does an invoice rest on?'
    options:
      - text: 'Copy the unit price into `order_items` at the time of sale'
        correct: true
        why: 'The invoice no longer depends on the product''s current price.'
      - text: 'Read `products.price` when showing the invoice'
        correct: false
        why: 'When the price changes, old invoices change too.'
      - text: 'Forbid price changes'
        correct: false
        why: 'The business couldn''t operate.'
      - text: 'Email the customer each time'
        correct: false
        why: 'An email isn''t a record, and the database holds no proof.'
    ref: history-vanished
  - q: 'Which of these rules are right for an audit_log?'
    hint: 'You can''t scratch things out in a ledger.'
    options:
      - text: 'The app''s database user gets INSERT permission only'
        correct: true
        why: 'Nobody can alter or delete the history.'
      - text: 'Store the actor''s id instead of the name'
        correct: true
        why: 'Names change or repeat; an id is stable.'
      - text: 'Fix old rows with an UPDATE to keep them tidy'
        correct: false
        why: 'A correction should arrive as a new row; changing old rows destroys the value of the history.'
      - text: 'Also keep the password hash in old_values when a password changes'
        correct: false
        why: 'Putting secrets into a log is another risk; record only the fact that "the password was changed".'
    ref: audit-history
  - q: 'What does this query return if product 7''s price went from 80 to 90 on 15 February?'
    lang: sql
    code: |
      SELECT amount FROM product_prices
      WHERE product_id = 7
        AND valid_from <= '2026-02-20 10:00+06'
        AND (valid_to IS NULL OR valid_to > '2026-02-20 10:00+06');
    hint: 'Which row''s period contains the date being asked about?'
    options:
      - text: '90, because 20 February is after 15 February and the second row''s `valid_to` is empty'
        correct: true
        why: 'The first row''s `valid_to` is 15 February, which is before the 20th, so it is out. The second one matches.'
      - text: '80'
        correct: false
        why: 'The first row''s period ended on 15 February; the 20th falls outside it.'
      - text: 'Both rows'
        correct: false
        why: 'With the exclusion constraint, only one row can match at any moment.'
      - text: 'Nothing'
        correct: false
        why: 'The second row matches.'
    ref: effective-dating
  - q: 'A users table with soft delete has a plain UNIQUE on email. Rahim deleted his account and can''t register again with the same email. Why, and what is the fix?'
    hint: 'The deleted row isn''t really gone.'
    options:
      - text: 'The deleted row still holds the email; build a partial unique index with `WHERE deleted_at IS NULL`'
        correct: true
        why: 'Uniqueness will apply only among live rows, so deleted rows no longer get in the way.'
      - text: 'Always hard delete; give up on soft delete'
        correct: false
        why: 'Many cases need the history; once you know the traps, soft delete is manageable.'
      - text: 'Append a random number to the end of the email'
        correct: false
        why: 'It makes the data messy and destroys the identity of the real email.'
      - text: 'Remove the unique constraint'
        correct: false
        why: 'Then two live users could end up with the same email.'
    ref: soft-delete-traps
  - q: 'The admin report page shows deleted users, even though the rest of the app doesn''t. What is the likely cause?'
    hint: 'How is the report query written?'
    options:
      - text: 'The report is written in native SQL or DBAL, so the Doctrine soft-delete filter didn''t apply'
        correct: true
        why: 'The filter only applies to ORM/DQL queries; in native SQL you must add `deleted_at IS NULL` by hand.'
      - text: 'Doctrine wrongly returns deleted data'
        correct: false
        why: 'The filter works fine, just not for every kind of query.'
      - text: 'The data was never actually deleted in the database'
        correct: false
        why: 'The rest of the app doesn''t show them, so `deleted_at` was set correctly.'
      - text: 'The report is cached'
        correct: false
        why: 'Caching could be a cause, but check the native query''s filter first.'
    ref: soft-delete-traps
