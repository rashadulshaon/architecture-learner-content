        items:
          - {to: 'workflows/outbox-inbox', label: 'বার্তা পাঠানোর নির্ভরযোগ্য উপায়'}
    check:
      q: 'registry না থাকলে কোন ঝুঁকি বাড়ে, আর registry সেটা কীভাবে কমায়?'
      a: 'যে কেউ না জানিয়ে ভাঙা schema ছাড়তে পারে। registry জমা নেওয়ার আগেই compatibility যাচাই করে ভাঙা schema ঠেকিয়ে দেয়।'

flashcards:
  - q: 'Schema evolution কাকে বলে?'
    a: 'ডেটার গঠন (ফিল্ড) সময়ের সাথে বদলানো, এমনভাবে যে পুরনো ও নতুন পাঠক-লেখক একসাথে চলে।'
    more: |
      API, queue-র বার্তা বা ফাইল সবই একটা schema মেনে চলে। কিন্তু সব পক্ষ একসাথে deploy হয় না। তাই বদলকে এমন করতে হয় যেন মাঝের সময়েও কেউ না ভাঙে।
    ref: renamed-field-broke-app
  - q: 'JSON-এর তুলনায় Protobuf কেন ছোট?'
    a: 'Protobuf ফিল্ডের নামের বদলে ছোট নম্বর পাঠায় এবং সংখ্যাকে compact বাইনারিতে লেখে।'
    more: |
      JSON-এ প্রতিটা বার্তায় `"total_amount"` লেখা হয়। Protobuf-এ শুধু ফিল্ড নম্বর ও মান যায়। দাম হলো পড়তে টুল লাগে আর schema-ফাইল দুই পক্ষের কাছে থাকতে হয়।
    ref: json-protobuf-avro
  - q: 'Protobuf-এ কোনটা বদলানো নিরাপদ: ফিল্ডের নাম, না নম্বর?'
    a: 'নাম নিরাপদ, নম্বর নয়। তারে শুধু নম্বর যায়, তাই নম্বর বদলালে পুরনো ডেটা ভুল ফিল্ড হয়ে পড়ে।'
    more: |
      নাম শুধু কোডে কাজে লাগে, নম্বরই ডেটার পরিচয়। তাই .proto-তে নম্বর কখনো বদলাবে না ও পুনর্ব্যবহার করবে না। বাদ দিলে `reserved` দাও।
    ref: reuse-field-number
  - q: 'নতুন ফিল্ড যোগ করার নিরাপদ নিয়ম কী?'
    a: 'ফিল্ডটা optional বা ডিফল্টসহ রাখো, যেন পুরনো প্রেরকের বার্তায় না থাকলেও পাঠক ভাঙে না।'
    more: |
      PHP-তে constructor প্যারামিটারে ডিফল্ট (`string $currency = 'BDT'`) দিলে queue-তে থাকা পুরনো বার্তা পড়া যায়। বাধ্যতামূলক ফিল্ড যোগ করতে চাইলে আগে optional হিসেবে যোগ করো, সবাই পাঠানো শুরু করলে বাধ্যতামূলক করো।
    ref: safe-schema-changes
  - q: 'ফিল্ডের নাম নিরাপদে বদলানোর ধাপ কী?'
    a: 'নতুন নামে ফিল্ড যোগ করো, কিছুদিন দুটোই পাঠাও, সবাই নতুনটা পড়লে পুরনোটা বাদ দাও।'
    more: |
      নাম বদল আসলে একটা যোগ আর একটা বাদ। দুই নামেই ডেটা পাঠানোর সময়টা পুরনো ও নতুন পাঠক দুজনের জন্য সেতু। বাদ দেওয়ার আগে লগ দেখে নিশ্চিত হও, কেউ আর পুরনোটা পড়ছে না।
    ref: safe-schema-changes
  - q: 'Tolerant reader কী?'
    a: 'যে পাঠক অচেনা ফিল্ড উপেক্ষা করে আর অনুপস্থিত ফিল্ডে ডিফল্ট ধরে নেয়।'
    more: |
      পাঠক কঠোর হলে প্রেরক নতুন ফিল্ড যোগ করামাত্র সে ভাঙে। শুধু যা লাগে তা পড়ো, বাকি উপেক্ষা করো। এতে প্রেরককে বদল করার স্বাধীনতা থাকে।
    ref: safe-schema-changes
  - q: 'Schema registry কী কাজ করে?'
    a: 'সব schema-র সংস্করণ জমা রাখে আর নতুন schema ঢোকার আগে compatibility যাচাই করে ভাঙা schema ঠেকায়।'
    more: |
      বার্তায় পুরো schema না রেখে ছোট একটা schema id থাকে; consumer সেটা দিয়ে registry থেকে schema আনে। BACKWARD, FORWARD বা FULL মোডে নিয়ম ঠিক করা যায়।
    ref: schema-registry
quiz:
  - q: 'queue-তে হাজার হাজার `OrderPlaced` বার্তা জমে আছে। নতুন deploy-এ constructor-এ নতুন বাধ্যতামূলক `string $currency` (ডিফল্ট ছাড়া) যোগ হলো। কী হবে?'
    hint: 'পুরনো বার্তায় `currency` ফিল্ড নেই।'
    options:
      - text: 'পুরনো বার্তা ডিসিরিয়ালাইজ করতে গিয়ে ব্যর্থ হবে, কারণ `currency` পাওয়া যাবে না'
        correct: true
        why: 'ডিফল্ট না থাকলে object বানানো যায় না। ডিফল্টসহ optional যোগ করাই ঠিক পথ।'
      - text: 'সব ঠিক চলবে, PHP নিজে ফাঁকা স্ট্রিং বসাবে'
        correct: false
        why: 'PHP কিছু বসায় না; typed property-তে মান না থাকলে error।'
      - text: 'শুধু নতুন বার্তা প্রভাবিত হবে'
        correct: false
        why: 'ভাঙবে পুরনো বার্তা, কারণ নতুন কোডে ফিল্ডটা প্রয়োজন আর তাদের কাছে নেই।'
      - text: 'queue পুরনো বার্তা নিজে মুছে ফেলবে'
        correct: false
        why: 'queue-র নিজস্ব কোনো schema-জ্ঞান নেই; বার্তা retry হতে হতে failed হবে।'
    ref: safe-schema-changes
  - q: 'নিচের কোনগুলো সাধারণত নিরাপদ (পুরনো পাঠক না ভেঙে) বদল?'
    hint: 'যোগ আর বদল আলাদা; কী না জানলে পাঠক ভাঙবে?'
    options:
      - text: 'JSON response-এ ডিফল্টসহ নতুন optional ফিল্ড যোগ'
        correct: true
        why: 'tolerant reader অচেনা ফিল্ড উপেক্ষা করে।'
      - text: 'Protobuf-এ নতুন ফিল্ড নতুন নম্বরে যোগ'
        correct: true
        why: 'নতুন নম্বর পুরনো পাঠকের কাছে অচেনা বলে উপেক্ষিত হয়।'
      - text: '`total_amount`-এর ধরন `int` থেকে `string` করা'
        correct: false
        why: 'সব পাঠক টাইপ ধরে পড়ে; ধরন বদলালে ভাঙে। নতুন ফিল্ড যোগ করো।'
      - text: 'বাদ দেওয়া ফিল্ডের নম্বর নতুন ফিল্ডে ব্যবহার'
        correct: false
        why: 'পুরনো ডেটা নতুন ফিল্ডের মান হিসেবে ভুল পড়া হয়।'
    ref: reuse-field-number
  - q: 'দলের কেউ `.proto`-তে ফিল্ড নম্বর ২ থেকে ৭ করে দিল "ক্রম সুন্দর রাখতে"। সমস্যা কী?'
    hint: 'তারে শুধু নম্বর যায়।'
    options:
      - text: 'পুরনো বার্তা ও পুরনো পাঠক ওই ডেটাকে অন্য ফিল্ডের মান ধরে পড়বে, নীরবে ভুল'
        correct: true
        why: 'নম্বরই ফিল্ডের পরিচয়। নম্বর বদল মানে ফিল্ড বদল।'
      - text: 'কিছুই হবে না, নম্বর শুধু ক্রমের জন্য'
        correct: false
        why: 'ক্রম নয়, নম্বর হলো পরিচয়।'
      - text: 'compile হবে না'
        correct: false
        why: 'compile ঠিকই হবে; এটাই সমস্যা, ভুলটা চুপচাপ।'
      - text: 'ডেটার আকার বেড়ে যাবে'
        correct: false
        why: 'আকার সামান্য বদলাতে পারে, কিন্তু আসল ক্ষতি অর্থ বদল।'
    ref: reuse-field-number
  - q: 'মোবাইল অ্যাপ আর সার্ভার আলাদা সময়ে deploy হয়। সার্ভার নতুন `mobile` ফিল্ড যোগ করছে। সবচেয়ে ভালো ধাপ?'
    hint: 'পুরনো অ্যাপ এখনো `phone` পড়ে।'
    options:
      - text: 'কিছুদিন `phone` ও `mobile` দুটোই পাঠানো, পরে `phone` বাদ'
