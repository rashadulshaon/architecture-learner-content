slides:
  - slug: renamed-field-broke-app
    title: 'এক ফিল্ডের নাম বদলে মোবাইল অ্যাপ ভাঙল'
    kind: story
    tldr: 'API বা message-এর আকার (schema) বদলালে যারা পুরনো আকারে পড়ছে তারা ভাঙে। দুই পক্ষ এক সাথে deploy হয় না, তাই বদল সাবধানে করতে হয়।'
    keywords: ['schema evolution', 'breaking change', 'serialization', 'compatibility', 'ফিল্ডের নাম বদল']
    blocks:
      - type: metaphor
        icon: mail
        title: 'কুরিয়ারের ফর্ম'
        body: |
          কুরিয়ার অফিসের ফর্মে "ফোন" ঘরটা কেউ হঠাৎ "মোবাইল" করে দিলে পুরনো ফর্ম হাতে নেওয়া কর্মী সেই ঘর খুঁজে পাবে না, আর পার্সেল আটকে যাবে। ফর্ম যারা ছাপে আর যারা পড়ে, তারা আলাদা মানুষ এবং আলাদা সময়ে বদলায়। বদল তাই এমনভাবে হতে হবে, যেন পুরনো আর নতুন দুই ফর্মই পড়া যায়।
      - type: text
        body: |
          রহিমের টিম API-র response-এ `phone` নাম বদলে `mobile` করল। ওয়েব অ্যাপ একই দিনে ঠিক হলো, কিন্তু প্লে স্টোরে থাকা পুরনো মোবাইল অ্যাপ আরও দুই সপ্তাহ পুরনো নামই খুঁজবে। এই ফাঁকে সেটা ফাঁকা নম্বর দেখাল।
      - type: visual
        kind: sequence
        caption: 'নাম বদল: সার্ভার নতুন, অ্যাপ পুরনো'
        actors:
          - {id: old, label: 'পুরনো মোবাইল অ্যাপ', icon: mobile, tip: 'ব্যবহারকারীরা আপডেট না করা পর্যন্ত এটাই চলে। আমরা এর উপর নিয়ন্ত্রণ রাখি না।'}
          - {id: api, label: 'নতুন API', icon: api, tip: 'সার্ভার আমাদের হাতে, তাই এখানে deploy তাৎক্ষণিক।'}
        messages:
          - {from: old, to: api, label: 'আমার প্রোফাইল দাও'}
          - {from: api, to: old, label: '{"mobile": "01711..."}', dashed: true, tip: 'নতুন নাম। পুরনো অ্যাপ এই নাম চেনে না।'}
          - {at: old, note: 'user.phone = null, ফোন ঘর ফাঁকা', tone: bad, tip: 'ভাগ্য ভালো হলে শুধু ফাঁকা; খারাপ হলে crash।'}
      - type: quote
        body: 'যারা পড়ে আর যারা লেখে, তারা একসাথে বদলায় না। বদল হতে হবে দুই দিকেই চলার মতো।'
    aside:
      - type: story
        title: 'আপডেট না করা ব্যবহারকারী'
        body: |
          অনেক ব্যবহারকারী মাসের পর মাস অ্যাপ আপডেট করে না। সার্ভার যেদিন বদলায়, সেদিনও পুরনো সংস্করণ চালু থাকে। তাই API-র গঠন বদলানো যেন অর্ধেক-বদলানো ঘরে ঢোকা।
      - type: terms
        items:
          - {term: 'Serialization', meaning: 'মেমোরির object-কে JSON বা বাইনারি বাইট-এ রূপ দেওয়া, যাতে পাঠানো বা সেভ করা যায়।'}
          - {term: 'Schema', meaning: 'ডেটার গঠন: কোন ফিল্ড আছে, কী ধরনের, বাধ্যতামূলক কি না।'}
    check:
      q: 'সার্ভারের ফিল্ড `phone` থেকে `mobile` করা কেন বিপজ্জনক, যদি ওয়েব অ্যাপ একই সাথে ঠিক করা হয়?'
      a: 'পুরনো মোবাইল অ্যাপ, queue-তে থাকা বার্তা বা অন্য টিমের consumer পুরনো নামেই পড়ে। সবাই একসাথে বদলায় না, তাই তারা ভাঙে।'

  - slug: json-protobuf-avro
    title: 'JSON, Protobuf, Avro: কে কীভাবে ডেটা লেখে'
    kind: concept
    tldr: 'JSON মানুষ পড়তে পারে কিন্তু ভারী; Protobuf ও Avro ছোট ও schema-নির্ভর। Protobuf ফিল্ডকে নম্বর দিয়ে চেনে, Avro লেখার schema সাথে নিয়ে চলে।'
    keywords: ['JSON', 'Protobuf', 'Avro', 'binary format', 'field number', 'ফরম্যাট তুলনা']
    blocks:
      - type: text
        body: |
          চিঠি লেখার তিন ধরন ভাবো: খোলা ভাষায় পুরো বাক্য (JSON), ফর্মে ঘরের নম্বর ধরে ছোট কোড (Protobuf), আর চিঠির সাথে "ঘরগুলো কী কী" লেখা পাতা সংযুক্ত করা (Avro)। JSON-এ ফিল্ডের নাম প্রতিটা বার্তায় লেখা হয়, তাই বড়। Protobuf নামের বদলে **ফিল্ড নম্বর** (`= 1`, `= 2`) পাঠায়, তাই ছোট; আর নম্বরই ফিল্ডের আসল পরিচয়। Avro-তে ডেটায় নাম থাকে না; পড়ার সময় লেখার schema লাগে।
      - type: visual
        kind: table
        caption: 'তিন ফরম্যাট পাশাপাশি'
        headers: ['', 'JSON', 'Protobuf', 'Avro']
        rows:
          - cells: ['আকার', 'বড়', 'ছোট', 'ছোট']
            tip: 'বাইনারি ফরম্যাটে ফিল্ডের নাম বারবার লেখা হয় না।'
          - cells: ['মানুষ পড়তে পারে', 'হ্যাঁ', 'না', 'না']
            tip: 'ডিবাগে JSON সবচেয়ে সুবিধাজনক; বাইনারিতে টুল লাগে।'
          - cells: ['schema', 'ঐচ্ছিক', 'বাধ্যতামূলক (.proto)', 'বাধ্যতামূলক (.avsc)']
            tip: 'schema থাকলে কম্পাইলার বা registry বদল আগেই ধরে ফেলে।'
          - cells: ['ফিল্ড চেনে', 'নাম দিয়ে', 'নম্বর দিয়ে', 'schema-র ক্রম ধরে']
            tip: 'Protobuf-এ নাম বদলানো নিরাপদ, নম্বর বদলানো মারাত্মক।'
          - cells: ['সাধারণত কোথায়', 'public API, ব্রাউজার', 'gRPC, সার্ভিসের মাঝে', 'Kafka, ডেটা pipeline']
            tip: 'প্রতিটারই নিজের জায়গা আছে; ব্রাউজারের জন্য JSON প্রায় সবসময়।'
      - type: code
        lang: protobuf
        file: 'proto/order.proto'
        variant: good
        code: |
          syntax = "proto3";

          message OrderPlaced {
            int64  order_id     = 1;   // নম্বর ১ = ফিল্ডের চিরস্থায়ী পরিচয়
            int64  total_amount = 2;
            string currency     = 3;
          }
        marks:
          - {line: 4, tip: 'তারে যায় `1: <মান>`। নাম `order_id` পাঠানো হয় না; তাই নম্বর বদলানো মানে অন্য ফিল্ড হয়ে যাওয়া।'}
    aside:
      - type: remember
        body: 'JSON-এ নাম পরিচয়; Protobuf-এ নম্বর পরিচয়।'
      - type: when
        use:
          - 'JSON: browser-facing API, ডিবাগ সহজ রাখতে হবে'
          - 'Protobuf/Avro: সার্ভিসের মাঝে বিপুল বার্তা, ছোট আকার ও কঠোর schema দরকার'
        avoid:
          - 'বাইনারি ফরম্যাট শুধু "দ্রুত" শোনায় বলে বেছে নেওয়া; আগে মাপো'
    check:
      q: 'Protobuf-এ ফিল্ডের নাম বদলানো নিরাপদ, কিন্তু নম্বর বদলানো নয়। কেন?'
      a: 'তারের উপর নাম যায় না, শুধু নম্বর যায়। নম্বর বদলালে পুরনো পাঠক ওই ডেটাকে অন্য ফিল্ডের মান ধরে পড়ে ফেলে।'

  - slug: safe-schema-changes
    title: 'নিরাপদ বদল: ফিল্ড যোগ, বাদ, নাম পাল্টানো'
    kind: howto
    tldr: 'নতুন ফিল্ড ডিফল্ট বা optional দিয়ে যোগ করো। বাদ দেওয়ার আগে ব্যবহার বন্ধ করো। নাম বদল মানে নতুন যোগ, পুরনো কিছুদিন রেখে বাদ।'
    keywords: ['backward compatible', 'forward compatible', 'optional field', 'default value', 'Messenger serializer', 'tolerant reader']
    blocks:
      - type: text
        body: |
          পুরনো ফর্মও পড়া যাবে, নতুন ফর্মও পড়া যাবে, এটাই লক্ষ্য। নিয়ম সহজ: **যোগ** করা নিরাপদ যদি পাঠক ওই ফিল্ড না পেলে একটা ডিফল্ট ধরে নেয়। **বাদ** দেওয়া নিরাপদ শুধু তখন, যখন কেউ আর ফিল্ডটা পড়ছে না। **নাম বদল** আসলে যোগ আর বাদ, দুটো আলাদা ধাপে। Symfony Messenger-এ queue-তে পুরনো বার্তা জমে থাকে, তাই এটা সেখানেও প্রযোজ্য।
      - type: code
        lang: php
        file: 'src/Message/OrderPlaced.php'
        variant: good
        code: |
          final readonly class OrderPlaced
          {
              public function __construct(
                  public int $orderId,
                  public int $totalAmount,
                  // v2-তে যোগ: পুরনো বার্তায় নেই, তাই ডিফল্ট আছে
                  public string $currency = 'BDT',
                  public ?string $couponCode = null,
              ) {
              }
          }
        marks:
          - {line: 7, tip: 'queue-তে v1 বার্তা পড়ে থাকলেও এই ফিল্ড ছাড়াই object বানানো যায়, কারণ ডিফল্ট আছে।'}
          - {line: 8, tip: '`?string` ও `null` ডিফল্ট: "না থাকাও একটা বৈধ অবস্থা"।'}
      - type: code
        lang: yaml
        file: 'config/packages/messenger.yaml'
        variant: good
        code: |
          framework:
              messenger:
                  serializer:
                      default_serializer: messenger.transport.symfony_serializer
                      symfony_serializer:
                          format: json
          # PHP-র নিজস্ব serialize() নয়: ক্লাস বদলালে পুরনো বার্তা পড়া কঠিন
        marks:
          - {line: 4, tip: 'JSON-এ বার্তা রাখলে ক্লাস-নামের বদল ছাড়া বাকি বদল সামলানো সহজ, আর অন্য ভাষার consumer-ও পড়তে পারে।'}
      - type: visual
        kind: table
        caption: 'কোন বদল নিরাপদ'
        headers: ['বদল', 'নিরাপদ?', 'কীভাবে']
        rows:
          - cells: ['ডিফল্টসহ ফিল্ড যোগ', 'হ্যাঁ', 'পুরনো পাঠক নতুন ফিল্ড উপেক্ষা করে']
            tip: 'পাঠক অজানা ফিল্ড উপেক্ষা করবে, এটা ধরে নিয়েই API বানাও (tolerant reader)।'
          - cells: ['বাধ্যতামূলক ফিল্ড যোগ', 'না', 'আগে optional, পরে বাধ্যতামূলক']
            tip: 'পুরনো প্রেরক ফিল্ড পাঠায় না, তাই নতুন পাঠক ভেঙে পড়ে।'
          - cells: ['ফিল্ড বাদ', 'ধাপে ধাপে', 'ব্যবহার বন্ধ, তারপর বাদ']
            tip: 'কেউ এখনো পড়ছে কি না লগ বা মেট্রিক্স দেখে নিশ্চিত হও।'
          - cells: ['নাম বদল', 'দুই ধাপে', 'নতুন নাম যোগ, দুটোই পাঠাও, পরে পুরনো বাদ']
            tip: 'পুরনো ও নতুন দুই নামেই ডেটা পাঠালে দুই ধরনের পাঠকই চলে।'
          - cells: ['ফিল্ডের ধরন বদল', 'না', 'নতুন ফিল্ড বানাও']
            tip: '`int` থেকে `string` করা সব পাঠককে ভাঙে। নতুন নামে নতুন ধরনের ফিল্ড যোগ করো।'
    aside:
      - type: tips
        items:
          - 'consumer-এ strict validation কমাও: অজানা ফিল্ড উপেক্ষা করো। এটাই tolerant reader।'
          - 'public API-তে `version` ফিল্ড বা header রাখলে বদলের সময় নির্দিষ্ট পাঠক চেনা সহজ।'
      - type: refs
        items:
          - {to: 'api/contracts-versioning', label: 'API contract ও versioning'}
          - {to: 'messaging/events-vs-commands', label: 'Event ও message'}
    check:
      q: '`phone` ফিল্ডকে `mobile` নামে সরাতে কী কী ধাপে এগোবে?'
      a: 'প্রথমে `mobile` যোগ করে দুটো ফিল্ডই পাঠাও। সব পাঠক নতুনটা পড়া শুরু করলে পুরনো `phone` বাদ দাও।'

  - slug: reuse-field-number
    title: 'পুরনো নম্বর আর required ফিল্ডের ফাঁদ'
    kind: pitfall
    tldr: 'বাদ দেওয়া ফিল্ডের নম্বর বা নাম নতুন কিছুতে ব্যবহার করলে পুরনো ডেটা ভুল অর্থে পড়া হয়। reserved দিয়ে সেটা বন্ধ রাখো।'
    keywords: ['reserved', 'protobuf', 'field number reuse', 'required field', 'breaking change']
    blocks:
      - type: text
        body: |
          `phone` ফিল্ড (নম্বর ৪) বাদ গেল। কয়েক মাস পর কেউ নতুন ফিল্ড `discount_percent`-এ ওই ৪ নম্বর বসাল। কিন্তু ডিস্ক বা queue-তে পুরনো বার্তা পড়ে আছে, যেখানে ৪ মানে ফোন নম্বর। নতুন পাঠক সেই ফোন নম্বরকে ছাড়ের হার ধরে পড়বে, কোনো error ছাড়াই। এটা শব্দের ভুল নয়, অর্থের ভুল, তাই সবচেয়ে বিপজ্জনক।
      - type: code
        lang: protobuf
        file: 'proto/order.proto'
        variant: bad
        code: |
          message OrderPlaced {
            int64  order_id         = 1;
            int64  total_amount     = 2;
            string currency         = 3;
            // phone = 4 বাদ গেছে; নম্বর ৪ এখন ফাঁকা
            int32  discount_percent = 4;   // পুরনো ডেটায় এখানে ফোন নম্বর!
          }
        marks:
          - {line: 6, tip: 'পুরনো বার্তায় ৪ মানে ফোন নম্বর (string)। এখানে int32 পড়তে গিয়ে ভুল বা অর্থহীন মান আসে।'}
      - type: code
        lang: protobuf
        file: 'proto/order.proto'
        variant: good
        code: |
          message OrderPlaced {
            reserved 4;
            reserved "phone";

            int64  order_id         = 1;
            int64  total_amount     = 2;
            string currency         = 3;
            int32  discount_percent = 5;   // নতুন ফিল্ড নতুন নম্বর
          }
        marks:
          - {line: 2, tip: '`reserved` দিলে compiler ওই নম্বর বা নাম আবার ব্যবহার করতেই দেবে না। ভুলটা ডিপ্লয়ের আগেই ধরা পড়ে।'}
      - type: quote
        body: 'বাদ দেওয়া ফিল্ডের নম্বর বা নাম কখনো নতুন কিছুতে ব্যবহার করো না।'
    aside:
      - type: pitfalls
        items:
          - 'নতুন বাধ্যতামূলক ফিল্ড যোগ করলে পুরনো প্রেরকের বার্তা প্রত্যাখ্যাত হয়। প্রোটোবাফ proto3-এ `required` তুলে দেওয়া হয়েছে এই কারণেই।'
          - 'enum-এ নতুন মান যোগ করলে পুরনো পাঠক সেটা চেনে না; অজানা মানের জন্য ডিফল্ট আচরণ ঠিক করে রাখো।'
      - type: remember
        body: 'ফিল্ডের নম্বর কবর দাও, পুনর্জন্ম দিও না।'
    check:
      q: 'ফিল্ড বাদ দেওয়ার পর ওই নম্বরে `reserved` লেখার লাভ কী?'
      a: 'ভবিষ্যতে কেউ ভুল করে ওই নম্বর বা নাম নতুন ফিল্ডে দিলে compiler সাথে সাথে error দেয়। পুরনো ডেটা ভুল অর্থে পড়ার ঝুঁকি থাকে না।'

  - slug: schema-registry
    title: 'Schema registry: বদলের পাহারাদার'
    kind: concept
    tldr: 'Schema registry সব schema-র সংস্করণ জমা রাখে, নতুন schema ঢোকার আগে compatibility পরীক্ষা করে, আর বার্তায় থাকে শুধু schema id।'
    keywords: ['schema registry', 'Avro', 'compatibility mode', 'BACKWARD', 'Kafka', 'schema id']
    blocks:
      - type: text
        body: |
          অনেক টিম একই queue বা Kafka topic ব্যবহার করলে কেউ কাউকে জিজ্ঞেস না করেই schema বদলে ফেলতে পারে। **Schema registry** একটা কেন্দ্রীয় খাতা: প্রতিটা schema-র সংস্করণ সেখানে জমা থাকে। নতুন সংস্করণ জমা দিতে গেলে সে আগেই পরীক্ষা করে, পুরনোর সাথে মিলছে কি না। না মিললে জমাই নেয় না; ভাঙা schema প্রোডাকশনে পৌঁছাতেই পারে না। বার্তার ভেতরে পুরো schema না রেখে শুধু ছোট একটা **schema id** থাকে।
      - type: visual
        kind: flow
        caption: 'Producer থেকে consumer: registry কোথায় বসে'
        nodes:
          - {id: prod, label: 'Producer', sub: 'নতুন schema v2', icon: send, col: 0, row: 1, tip: 'বার্তা পাঠানোর আগে schema registry-তে জমা দেয়।'}
          - {id: reg, label: 'Schema registry', sub: 'v1, v2 জমা', icon: book, tone: accent, col: 1.5, row: 0, tip: 'প্রতিটা schema-র ইতিহাস রাখে আর compatibility নিয়ম খাটায়।'}
          - {id: topic, label: 'Kafka topic', sub: 'schema id সহ বার্তা', icon: queue, col: 1.5, row: 2, tip: 'বার্তায় শুধু `schema id` আর বাইনারি ডেটা, পুরো schema নয়।'}
          - {id: cons, label: 'Consumer', sub: 'নিজের schema v1', icon: worker, col: 3, row: 1, tip: 'বার্তার schema id দিয়ে registry থেকে লেখার schema আনে, নিজের schema-র সাথে মেলায়।'}
