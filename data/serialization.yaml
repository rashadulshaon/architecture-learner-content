      - type: points
        title: 'compatibility mode'
        style: dot
        items:
          - '**BACKWARD**: নতুন schema দিয়ে পুরনো বার্তা পড়া যায় (consumer আগে আপগ্রেড)।'
          - '**FORWARD**: পুরনো schema দিয়ে নতুন বার্তা পড়া যায় (producer আগে আপগ্রেড)।'
          - '**FULL**: দুটোই। অচেনা দলের মধ্যে সবচেয়ে নিরাপদ।'
