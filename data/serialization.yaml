      - type: terms
        items:
          - {term: 'Schema registry', meaning: 'schema-র সব সংস্করণ জমিয়ে রাখা ও compatibility যাচাই করার সেবা।'}
          - {term: 'Schema id', meaning: 'বার্তার সাথে যাওয়া ছোট নম্বর, যা registry-র একটা schema সংস্করণ চেনায়।'}
