slides:
  - slug: photos-in-the-wrong-place
    title: 'Photos in the database, photos on the server disk'
    kind: story
    tldr: 'Photos in the database bloat it. Photos on the server''s disk go missing on a second server and vanish on deploy.'
    keywords: ['blob', 'file upload', 'local disk', 'BLOB column', 'object storage', 'file storage']
    blocks:
      - type: metaphor
        icon: box
        title: 'The warehouse behind the store'
        body: |
          If a store owner stuffs every box of stock between the pages of the ledger, the ledger swells until it bursts. If the owner piles the boxes in one corner of the store, a new branch doesn't have the stock, and moving stores means losing it. What the owner needs is a separate warehouse; the ledger just notes "box 12, warehouse shelf 3".
      - type: text
        body: |
          In Ryan's app, a user's profile photo could be stored in two ways, and both hurt later. The code below saves the photo into the server's own `public/uploads` folder.
      - type: code
        lang: php
        file: 'src/Controller/AvatarController.php'
        variant: bad
        code: |
          #[Route('/avatar', methods: ['POST'])]
          public function upload(Request $request): JsonResponse
          {
              $file = $request->files->get('avatar');
              $name = $file->getClientOriginalName();   // the name the user supplied

              // onto this server's own disk
              $file->move($this->getParameter('kernel.project_dir').'/public/uploads', $name);

              return $this->json(['url' => '/uploads/'.$name]);
          }
        marks:
          - {line: 8, tip: 'A second server or a new container can''t see this file. If a deploy wipes the folder, the photos go with it.'}
          - {line: 5, tip: 'If two people upload the same name, one person''s photo overwrites the other''s.'}
      - type: visual
        kind: compare
        caption: 'Three places to keep files: two cause trouble, one is right'
        columns:
          - title: 'A database BLOB'
            tone: bad
            icon: db
            tip: 'A database is for small, fast, complex queries, not for holding large binaries.'
            items:
              - 'The database bloats and backups become huge'
              - 'Every photo read adds load on the database'
          - title: 'The server''s local disk'
            tone: bad
            icon: server
            tip: 'Fine while there is only one server; it breaks as soon as you add another.'
            items:
              - 'Other servers don''t have the file'
              - 'Lost on deploy or when the container changes'
          - title: 'Object storage'
            tone: good
            icon: storage
            tip: 'A service like S3, built for keeping files, and it doesn''t mind how many you store.'
            items:
              - 'Every server reaches the same place'
              - 'Much cheaper, durable, properly backed up'
    aside:
      - type: story
        title: 'The mystery of the two-server photos'
        body: |
          After a second server was added to the app, some users said their photo showed up sometimes and not other times. The load balancer was sending half the requests to the server that never had the photo.
      - type: terms
        items:
          - {term: 'BLOB', meaning: 'Binary Large Object: large binary data such as photos, PDFs and videos.'}
          - {term: 'Object storage', meaning: 'A service that keeps files under a key (S3, Cloudflare R2, MinIO).'}
    check:
      q: 'The app runs on two servers. What goes wrong if a photo is saved on one server''s disk?'
      a: 'The other server doesn''t have the file, so when the load balancer sends a request there, the photo isn''t found. Files must live somewhere every server can reach.'

  - slug: object-storage-flysystem
    title: 'Object storage: the database keeps only the key'
    kind: concept
    tldr: 'Files go to object storage; the database keeps the file''s key and metadata. Write through Flysystem and the code survives a change of storage.'
    keywords: ['Flysystem', 'S3', 'storage key', 'metadata', 'filesystem abstraction', 'object storage']
    blocks:
      - type: text
        body: |
          The box number in the warehouse is the **key**, for example `avatars/0192.../original.jpg`. The app's database holds just this key, plus the size, type and owner id. Whatever file name the user supplies, the server generates the key itself (a UUID), so nobody can overwrite anyone else's file. If you write through Symfony's **Flysystem**, it can be a local folder today and S3 tomorrow: only the config changes.
      - type: code
        lang: yaml
        file: 'config/packages/flysystem.yaml'
        variant: good
        code: |
          flysystem:
              storages:
                  uploads.storage:
                      adapter: 'aws'
                      options:
                          client: 'aws_s3_client'   # the Aws\S3\S3Client defined in services.yaml
                          bucket: '%env(S3_BUCKET)%'
                          prefix: 'uploads'
        marks:
          - {line: 3, tip: 'The storage name. Autowiring''s `$uploadsStorage` comes from this name.'}
          - {line: 4, tip: 'Swap the adapter (local, aws, gcs) and the rest of the code stays the same.'}
      - type: code
        lang: php
        file: 'src/Service/AvatarStorage.php'
        variant: good
        code: |
          final readonly class AvatarStorage
          {
              public function __construct(private FilesystemOperator $uploadsStorage) {}

              public function store(UploadedFile $file): string
              {
                  $key = sprintf('avatars/%s.%s', Uuid::v7(), $file->guessExtension());

                  $stream = fopen($file->getPathname(), 'rb');
                  $this->uploadsStorage->writeStream($key, $stream);   // stream, not all in RAM
                  is_resource($stream) && fclose($stream);

                  return $key;   // this is what goes into the database column
              }
          }
        marks:
          - {line: 7, tip: 'The server builds the key, so a user-supplied name can''t cause trouble.'}
          - {line: 10, tip: '`writeStream` sends the file piece by piece, so even large files don''t eat much memory.'}
      - type: quote
        body: 'Keep the key in the database; keep the file in object storage.'
    aside:
      - type: tips
        items:
          - 'Keep the bucket private by default. To show a file, use a signed URL or a CDN.'
          - 'Store `avatar_key VARCHAR(255)` in the column, not the full URL; if the domain changes later, the data stays valid.'
      - type: commands
        title: 'Packages'
        items:
          - {cmd: 'composer require league/flysystem-bundle', desc: 'The Flysystem bundle'}
          - {cmd: 'composer require league/flysystem-aws-s3-v3', desc: 'The S3 adapter'}
      - type: when
        use:
          - 'More than one server, or files that must outlive a deploy'
          - 'Any file your users upload'
        avoid:
          - 'One server and a few files shipped with the app: a plain folder is simpler'
          - 'Anything that must roll back with a database transaction: a file and a row are two places, so keep a pending state (see the upload slides)'
    check:
      q: 'What is the benefit of storing only the key, not the full file URL, in the database?'
      a: 'If the bucket, CDN or domain changes, the database data doesn''t need to change. You build the URL from the key when you need it.'

  - slug: presigned-direct-upload
    title: 'Presigned URLs: send the file straight to storage'
    kind: howto
    tldr: 'The server mints a time-limited signed form; the Vue app POSTs the file straight to storage, with a size cap the storage itself enforces. The file never passes through your server.'
    keywords: ['presigned URL', 'signed URL', 'direct upload', 'presigned POST', 'content-length-range', 'XMLHttpRequest progress']
    blocks:
      - type: text
        body: |
          The warehouse gate has to keep strangers out, but making every truck detour through the owner's office wastes time. So the owner hands over a signed slip good for 10 minutes (a **presigned URL**), and the truck unloads straight at the warehouse. Your PHP server never carries the weight of the file. It only grants permission, and afterwards confirms the file really arrived. The slip can also say "no box heavier than 5 MB". That needs a presigned **POST** with a policy: a presigned PUT can't cap the size.
      - type: visual
        kind: sequence
        caption: 'Three steps to upload: permission, direct upload, confirmation'
        actors:
          - {id: vue, label: 'Vue app', icon: browser, tip: 'The user picks the file in the browser.'}
          - {id: api, label: 'Symfony API', icon: server, tip: 'Grants permission and verifies at the end; it never touches the file.'}
          - {id: s3, label: 'Object storage', icon: storage, tip: 'The file arrives here directly.'}
        messages:
          - {from: vue, to: api, label: 'I want to upload an avatar'}
          - {from: api, to: vue, label: 'POST to this URL: max 5 MB, 10 minutes', dashed: true, tip: 'The signed policy fixes the key, the type, the size range and the expiry; storage rejects anything else.'}
          - {from: vue, to: s3, label: 'POST the file (directly)', tone: good, tip: 'It costs your server no CPU, memory or network. A file over 5 MB is refused by storage itself.'}
          - {from: vue, to: api, label: 'Upload finished'}
          - {from: api, to: s3, label: 'Is the file there? How big?', tip: 'Verify it yourself instead of trusting the client blindly.'}
          - {at: api, note: 'All good: save the key in the database', tone: good}
      - type: code
        lang: php
        file: 'src/Controller/UploadController.php'
        variant: good
        code: |
          #[Route('/uploads/presign', methods: ['POST'])]
          #[IsGranted('ROLE_USER')]
          public function presign(S3Client $s3): JsonResponse
          {
              $key = sprintf('avatars/%s.jpg', Uuid::v7());
              $this->pending->add($key, new \DateTimeImmutable('+1 hour'));   // next slide

              $post = new PostObjectV4(
                  $s3,
                  $this->bucket,
                  ['key' => $key, 'Content-Type' => 'image/jpeg'],   // fields the form must send
                  [
                      ['bucket' => $this->bucket],
                      ['key' => $key],
                      ['eq', '$Content-Type', 'image/jpeg'],
                      ['content-length-range', 1, 5 * 1024 * 1024],   // 1 byte to 5 MB
                  ],
                  '+10 minutes',
              );

              return $this->json([
                  'key' => $key,
                  'url' => $post->getFormAttributes()['action'],
                  'fields' => $post->getFormInputs(),
              ]);
          }
        marks:
          - {line: 6, tip: 'Remember the key as "pending" right now, so an upload that never gets confirmed can be cleaned up later.'}
          - {line: 16, tip: 'The size cap lives in the signed policy, so storage refuses a bigger file. A presigned PUT has no such rule.'}
      - type: code
        lang: vue
        file: 'src/components/AvatarUpload.vue'
        variant: good
        code: |
          <script setup lang="ts">
          import { ref } from 'vue'
          const progress = ref(0)

          async function upload(file: File) {
            const res = await fetch('/uploads/presign', { method: 'POST' })
            const { key, url, fields } = await res.json()

            const form = new FormData()
            for (const [name, value] of Object.entries(fields)) form.append(name, value as string)
            form.append('file', file)   // the file field must come last

            await new Promise<void>((resolve, reject) => {
              const xhr = new XMLHttpRequest()
              xhr.open('POST', url)
              xhr.upload.onprogress = (e) => (progress.value = Math.round((e.loaded / e.total) * 100))
              xhr.onload = () => (xhr.status < 300 ? resolve() : reject(new Error('upload failed')))
              xhr.onerror = () => reject(new Error('network'))
              xhr.send(form)
            })
            await fetch('/uploads/confirm', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ key }),
            })
          }
          </script>
        marks:
          - {line: 11, tip: 'Storage reads the form top to bottom. Every field from the server goes first, the file last.'}
          - {line: 16, tip: '`fetch` can''t report upload progress, but `XMLHttpRequest` can, so it is used here.'}
    aside:
      - type: pitfalls
        items:
          - 'If the bucket''s CORS rules don''t allow your domain and the `POST` method, the browser blocks the upload.'
          - 'A presigned PUT cannot limit size. If your S3-compatible store has no POST policies, check the size at confirm and delete what is too big.'
          - 'The client''s "done" proves nothing. The server must still check size and type with `headObject`.'
      - type: refs
        items:
          - {to: 'security/input-validation', label: 'Validating uploaded files'}
    check:
      q: 'Why must the Symfony server both set a size cap in the signed policy and check the file after the upload?'
      a: 'The policy makes storage refuse oversize files up front. The check afterwards proves the file really arrived with the right type, because the client''s "done" can be wrong or a lie.'

  - slug: confirm-and-cleanup
    title: 'Confirm or clean up: no upload left behind'
    kind: pitfall
    tldr: 'A client can fetch a URL and never upload, or upload and vanish before confirming. Record every upload as pending, promote it only after the server''s own check, and delete whatever stays pending.'
    keywords: ['pending upload', 'orphan files', 'cleanup', 'headObject', 'lifecycle rule', 'Scheduler']
    blocks:
      - type: text
        body: |
          Every presigned URL is a promise the client may break. Some users get a URL and close the tab. Others upload the file, then lose the connection before calling confirm. Either way, objects pile up in the bucket with no database row pointing at them, and you pay for them forever. The fix: write a `pending` row the moment you mint the URL, let confirm check the object and flip the row to `uploaded`, and have a scheduled job delete whatever is still pending after an hour.
      - type: visual
        kind: table
        caption: 'Four ways an upload goes wrong, and what removes the leftovers'
        headers: ['What happened', 'What is left behind', 'What cleans it']
        rows:
          - cells: ['URL minted, never used', 'A pending row only', 'The hourly job deletes the row']
            tip: 'Nothing was uploaded, so there is no file to remove.'
          - cells: ['File uploaded, confirm never called', 'An orphan object and a pending row', 'The hourly job deletes both']
            tip: 'The pending row is what lets you find the orphan file; without it nobody knows the object exists.'
          - cells: ['File uploaded, wrong size or type', 'A bad object', 'Confirm deletes it at once']
            tip: 'Confirm rejects the upload and removes the file in the same step.'
          - cells: ['Multipart upload abandoned', 'Half-stored parts you can''t see', 'A bucket lifecycle rule aborts it']
            tip: 'Unfinished multipart parts are billed but never show up in a file list.'
      - type: code
        lang: php
        file: 'src/Service/UploadLifecycle.php'
        variant: good
        code: |
          final readonly class UploadLifecycle
          {
              public function __construct(
                  private S3Client $s3,
                  private PendingUploadRepository $pending,
                  private string $bucket,
              ) {}

              public function confirm(PendingUpload $up): void
              {
                  $head = $this->s3->headObject(['Bucket' => $this->bucket, 'Key' => $up->key]);
                  $tooBig = $head['ContentLength'] > 5 * 1024 * 1024;
                  if ($tooBig || $head['ContentType'] !== 'image/jpeg') {
                      $this->discard($up);
                      throw new BadRequestHttpException('Upload rejected.');
                  }
                  $up->markUploaded();   // only now may the key go into the user's profile
              }

              #[AsMessageHandler]
              public function cleanUp(CleanUpPendingUploads $m): void
              {
                  foreach ($this->pending->olderThan(new \DateTimeImmutable('-1 hour')) as $up) {
                      $this->discard($up);
                  }
              }

              private function discard(PendingUpload $up): void
              {
                  $this->s3->deleteObject(['Bucket' => $this->bucket, 'Key' => $up->key]);
                  $this->pending->remove($up);   // deleting a missing object is not an error
              }
          }
        marks:
          - {line: 11, tip: 'The server asks storage itself about the object; nothing the client says is trusted.'}
          - {line: 17, tip: 'Only a confirmed upload leaves the pending state.'}
          - {line: 20, tip: 'Run this every hour with Symfony Scheduler: anything still pending after an hour is abandoned.'}
      - type: quote
        body: 'An upload is pending until the server has checked it, and what stays pending expires.'
    aside:
      - type: commands
        title: 'Hourly schedule'
        items:
          - {cmd: 'RecurringMessage::every(''1 hour'', new CleanUpPendingUploads())', desc: 'Add to your Scheduler provider'}
      - type: when
        use:
          - 'Every app that lets clients upload straight to storage'
        avoid:
          - 'A tiny app with few uploads can put new files under `tmp/` and let a bucket lifecycle rule expire that prefix after a day'
    check:
      q: 'A user gets an upload URL, uploads the file, then closes the tab before confirm. What stops that file from staying in the bucket forever?'
      a: 'The pending row made when the URL was minted. The hourly job finds it still pending and deletes both the row and the object.'

  - slug: large-uploads-multipart
    title: 'Large files: in pieces, and resumable'
    kind: howto
    tldr: 'Send a big file in one go and a dropped connection means starting over. Multipart upload splits it into parts, and only the failed part is resent.'
    keywords: ['multipart upload', 'resumable upload', 'chunk', 'CompleteMultipartUpload', 'large files']
    blocks:
      - type: text
        body: |
          Send a 2 GB video in a single request, lose the connection at 90%, and everything is wasted. Just as a big shipment reaches the warehouse split into small boxes, **multipart upload** cuts the file into parts of 5 to 100 MB. Each part goes to its own URL, and at the end you say "all parts have arrived" and they are stitched together. A failed part can simply be sent again, and the next slide shows how to carry on after a crash.
      - type: visual
        kind: steps
        caption: 'The steps of an S3 multipart upload'
        steps:
          - {title: '1. Create', body: 'The server gets an uploadId', tip: '`CreateMultipartUpload` returns an uploadId, which identifies this upload.'}
          - {title: '2. Sign parts', body: 'A presigned URL for each part', tip: 'A separate `UploadPart` URL is created for each part number.'}
          - {title: '3. Upload', body: 'The client PUTs the parts', tip: 'Storage keeps each part under the uploadId; a failed part can be resent on its own.'}
          - {title: '4. List', body: 'After a crash, ask what is stored', tip: '`ListParts` shows which parts have already arrived, so a resume skips them.'}
          - {title: '5. Complete', body: 'Stitch the parts together', tip: '`CompleteMultipartUpload` takes the list of part numbers and ETags and assembles the file.'}
      - type: code
        lang: php
        file: 'src/Service/MultipartUploader.php'
        variant: good
        code: |
          public function start(string $key): string
          {
              return $this->s3->createMultipartUpload([
                  'Bucket' => $this->bucket, 'Key' => $key,
              ])['UploadId'];
          }

          public function partUrl(string $key, string $uploadId, int $part): string
          {
              $cmd = $this->s3->getCommand('UploadPart', [
                  'Bucket' => $this->bucket, 'Key' => $key,
                  'UploadId' => $uploadId, 'PartNumber' => $part,
              ]);
              return (string) $this->s3->createPresignedRequest($cmd, '+1 hour')->getUri();
          }

          /** @param list<array{PartNumber:int, ETag:string}> $parts */
          public function finish(string $key, string $uploadId, array $parts): void
          {
              $this->s3->completeMultipartUpload([
                  'Bucket' => $this->bucket, 'Key' => $key, 'UploadId' => $uploadId,
                  'MultipartUpload' => ['Parts' => $parts],
              ]);
          }
        marks:
          - {line: 14, tip: 'The URL lifetime is longer here, because a large file takes a long time.'}
          - {line: 20, tip: 'The object appears only after this call. Until then the parts sit half-stored and nobody can read the file.'}
      - type: quote
        body: 'Split the big file, count the parts, and resend only the one that failed.'
    aside:
      - type: pitfalls
        items:
          - 'Incomplete multipart uploads cost money. Add a lifecycle rule to the bucket so they are aborted after 7 days.'
          - 'Every part except the last must be at least 5 MB, or S3 fails on complete.'
      - type: when
        use:
          - 'Videos, backups, large PDFs, or any file over 100 MB'
        avoid:
          - 'Small files such as profile photos: a plain presigned PUT is enough'
      - type: refs
        items:
          - {to: 'infra/cloud-primitives', label: 'Object storage and cloud building blocks'}
    check:
      q: 'A 2 GB file goes up in 400 parts and the connection drops at part 399. What must be resent?'
      a: 'Only that failed part (and any that never went). The earlier parts are already stored, so you don''t start from scratch.'

  - slug: resume-multipart
    title: 'Resume after a crash: ask storage what it already has'
    kind: howto
    tldr: 'Storage remembers every stored part of an open upload. After a crash or a refresh, ask it with ListParts and send only the missing parts.'
    keywords: ['resumable upload', 'ListParts', 'uploadId', 'localStorage', 'resume', 'multipart']
    blocks:
      - type: text
        body: |
          The browser died at part 251 of 400. Storage still holds parts 1 to 250 under the same `uploadId`, so none of them needs resending. The page keeps the `uploadId` in `localStorage`; after a refresh the user picks the same file again (a page can't keep a file across a reload). Then the app asks storage which parts it has and sends only the rest. Don't trust a list of ETags kept by the browser: let the server read storage's own list and complete from that.
      - type: visual
        kind: sequence
        caption: 'After a crash, ask which parts exist and continue from the gap'
        actors:
          - {id: vue, label: 'Vue app', icon: browser, tip: 'Reloaded after the crash; still knows the uploadId.'}
          - {id: api, label: 'Symfony API', icon: server, tip: 'Asks storage for its list of parts.'}
          - {id: s3, label: 'Object storage', icon: storage, tip: 'Holds the stored parts of the open upload.'}
        messages:
          - {from: vue, to: api, label: 'Which parts of this upload exist?'}
          - {from: api, to: s3, label: 'ListParts for this uploadId'}
          - {from: s3, to: api, label: 'Parts 1 to 250 are stored', dashed: true}
          - {from: api, to: vue, label: 'You have 1 to 250', dashed: true}
          - {from: vue, to: s3, label: 'PUT part 251, then 252, ...', tone: good, tip: 'Each part goes to its own presigned URL, as before.'}
          - {at: vue, note: 'Resumes at 251, not at 1', tone: good}
      - type: code
        lang: php
        file: 'src/Service/MultipartUploader.php'
        variant: good
        code: |
          /** @return list<array{PartNumber:int, ETag:string}> */
          public function uploadedParts(string $key, string $uploadId): array
          {
              $parts = [];
              $pages = $this->s3->getPaginator('ListParts', [
                  'Bucket' => $this->bucket, 'Key' => $key, 'UploadId' => $uploadId,
              ]);
              foreach ($pages as $page) {
                  foreach ($page['Parts'] ?? [] as $p) {
                      $parts[] = ['PartNumber' => $p['PartNumber'], 'ETag' => $p['ETag']];
                  }
              }
              return $parts;
          }

          public function complete(string $key, string $uploadId, int $expected): void
          {
              $parts = $this->uploadedParts($key, $uploadId);   // storage's list, not the client's
              if (count($parts) !== $expected) {
                  throw new \DomainException('Some parts are still missing.');
              }
              $this->finish($key, $uploadId, $parts);
          }
        marks:
          - {line: 5, tip: 'ListParts returns at most 1,000 parts per page; the paginator fetches the following pages for you.'}
          - {line: 18, tip: 'Complete from what storage really holds. A client can''t slip in a part that never arrived.'}
      - type: code
        lang: ts
        file: 'src/upload/resumable.ts'
        variant: good
        code: |
          const PART = 5 * 1024 * 1024   // 5 MB per part
          const call = (url: string, init?: RequestInit) => fetch(url, init).then((r) => r.json())

          export async function upload(file: File) {
            const id = `upload:${file.name}:${file.size}:${file.lastModified}`
            let up = JSON.parse(localStorage.getItem(id) ?? 'null')
            if (!up) {
              up = await call('/uploads/multipart', { method: 'POST' })   // { key, uploadId }
              localStorage.setItem(id, JSON.stringify(up))
            }
            const base = `/uploads/multipart/${up.uploadId}`
            const have = new Set<number>(await call(`${base}/parts`))   // part numbers storage holds
            const total = Math.ceil(file.size / PART)

            for (let n = 1; n <= total; n++) {
              if (have.has(n)) continue   // already stored: skip
              const { url } = await call(`${base}/part-url/${n}`)
              const res = await fetch(url, { method: 'PUT', body: file.slice((n - 1) * PART, n * PART) })
              if (!res.ok) throw new Error(`part ${n} failed`)   // call upload() again to resume
            }
            await call(`${base}/complete`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ total }),
            })
            localStorage.removeItem(id)
          }
        marks:
          - {line: 5, tip: 'Name, size and last-modified identify the file, so a different file can''t be mixed into the saved upload.'}
          - {line: 16, tip: 'This one line is the whole resume logic: parts already in storage are never sent again.'}
    aside:
      - type: pitfalls
        items:
          - 'An open upload keeps costing storage until it is completed or aborted. Call `AbortMultipartUpload` when the user cancels, and keep the lifecycle rule as a safety net.'
      - type: tips
        items:
          - 'Smaller parts make a retry cheaper but need more requests; 5 to 100 MB is the usual range.'
    check:
      q: 'After a refresh at part 251 of 400, how does the upload continue without starting over?'
      a: 'The page finds its saved uploadId, the server lists the parts storage holds, the page skips those and sends the rest, and the server completes from storage''s own list.'

flashcards:
  - q: 'What is wrong with storing photos in a database BLOB column?'
    a: 'The database bloats, backups become huge, and every photo read adds load on the database.'
    more: |
      A database is good at complex queries and small rows, not large binaries. BLOBs also raise cache and replication costs. Keep the photo in object storage and only the key in the database.
    ref: photos-in-the-wrong-place
  - q: 'When does saving uploads on the server''s local disk break?'
    a: 'When you have more than one server or container, and when a deploy wipes the files.'
    more: |
      Every server has its own disk. If the load balancer sends a request to a different server, the file isn't there. Rebuilding a container also erases the files on its disk. To keep servers stateless, keep files outside them.
    ref: photos-in-the-wrong-place
  - q: 'What is a "key" in object storage?'
    a: 'The unique path-like name of a file (such as `avatars/uuid.jpg`) that you use to find it in storage.'
    more: |
      The server builds the key itself, usually with a UUID, so two people's files never collide on a name. Storing the key rather than the URL in the database means the data stays valid when the domain or CDN changes.
    ref: object-storage-flysystem
  - q: 'What is Flysystem used for in Symfony?'
    a: 'It gives one API for local disk, S3, GCS and more; changing storage means changing only config.'
    more: |
      `FilesystemOperator`'s `write`, `writeStream`, `read` and `delete` stay the same in your code. The usual pattern is the local adapter in development and the aws adapter in production. For large files use `writeStream` so you don't run out of RAM.
    ref: object-storage-flysystem
  - q: 'What is a presigned URL?'
    a: 'A time-limited URL signed by the server, with which a client can put or read a file in storage directly.'
    more: |
      The signature covers the key, the HTTP method and the expiry; if any of those change, storage rejects it. When it expires, the URL stops working. That way you grant access without handing the client the storage credentials. It cannot limit the file size: for that you need a presigned POST.
    ref: presigned-direct-upload
  - q: 'Why must the server run a confirm step after an upload?'
    a: 'It doesn''t trust the client: it checks that the file exists and that its size and type are right, and only then saves the key.'
    more: |
      A client can claim "done" without uploading anything, or upload a file of a different size. The server uses `headObject` to check the size and content type. If everything matches, it moves the database record from `pending` to `uploaded`.
    ref: presigned-direct-upload
  - q: 'How do you cap the size of a direct upload to object storage?'
    a: 'Use a presigned POST with a `content-length-range` condition. Storage then refuses any body outside that range.'
    more: |
      A presigned PUT can't limit size, because the content length isn't part of its signature. With the PHP SDK, `PostObjectV4` builds the signed form fields; the browser sends them as `FormData` with the file as the last field. Also check the size at confirm, as a second line of defense.
    ref: presigned-direct-upload
  - q: 'How do you stop abandoned uploads piling up in the bucket?'
    a: 'Save a `pending` row when you mint the URL, flip it to `uploaded` at confirm, and delete rows still pending after an hour, with their objects.'
    more: |
      Without the pending row nobody knows an orphan object exists. A Symfony Scheduler job runs hourly. For abandoned multipart uploads add a bucket lifecycle rule that aborts them after about 7 days.
    ref: confirm-and-cleanup
  - q: 'When do you need multipart upload, and how does it work?'
    a: 'For big files (100 MB+): the file is cut into parts, each sent to its own URL, and finally all the parts are stitched together.'
    more: |
      The steps: `CreateMultipartUpload` (uploadId), a presigned `UploadPart` per part, collect the ETags, and finally `CompleteMultipartUpload`. If a part fails, you resend only that one. Add a lifecycle rule so abandoned parts don't keep costing you.
    ref: large-uploads-multipart
  - q: 'How does a multipart upload resume after a crash or refresh?'
    a: 'Keep the uploadId, ask storage for its parts with `ListParts`, skip those, send only the missing ones, then complete from storage''s list.'
    more: |
      The page saves the uploadId in `localStorage`, and the user picks the same file again. Never complete from a list of ETags the browser kept: the server reads `ListParts` itself and checks that the part count is what it expects.
    ref: resume-multipart

quiz:
  - q: 'The app runs on 2 servers. A user uploaded a photo, but it shows up sometimes and returns 404 other times. What is the likely cause?'
    hint: 'Where exactly was the photo saved?'
    options:
      - text: 'The photo is on one server''s local disk and not on the other'
        correct: true
        why: 'When the load balancer sends the request to the server without the file, you get a 404.'
      - text: 'The photo is too large'
        correct: false
        why: 'If size were the problem it would fail every time; this one is intermittent.'
      - text: 'The CDN cache is wrong'
        correct: false
        why: 'The problem changes with the server, which points to where the file lives.'
      - text: 'The database is slow'
        correct: false
        why: 'Slowness would cause delays; a 404 means the file wasn''t found.'
    ref: photos-in-the-wrong-place
  - q: 'What are the risks in this code?'
    lang: php
    code: |
      $name = $request->files->get('doc')->getClientOriginalName();
      $request->files->get('doc')->move($uploadDir, $name);
      $doc->setPath('/uploads/'.$name);
    hint: 'The user-supplied name is used directly.'
    options:
      - text: 'If two people upload the same name, one overwrites the other''s file'
        correct: true
        why: 'A client''s file name isn''t unique. The key should be a server-generated UUID.'
      - text: 'The file lives on only one server''s disk'
        correct: true
        why: 'Another server, or a new deploy, won''t find it.'
      - text: '`move()` is an old PHP method and won''t work'
        correct: false
        why: '`move()` works fine; the problem is where the file goes and what it is called.'
      - text: 'A name containing ../ could write outside the folder'
        correct: true
        why: 'Trusting a name sent by the client is dangerous; a key the server builds itself is safe.'
    ref: object-storage-flysystem
  - q: 'What is the benefit of uploading with a presigned URL?'
    hint: 'Which route does the file take?'
    options:
      - text: 'The file goes straight to storage, saving your server''s CPU, memory and network'
        correct: true
        why: 'The server only grants permission and does none of the heavy carrying.'
      - text: 'The upload needs no verification'
        correct: false
        why: 'Verification is still needed; in the confirm step the server checks size and type.'
      - text: 'The URL works forever'
        correct: false
        why: 'The URL has an expiry, and that is part of its security.'
      - text: 'You can leave the bucket public to everyone'
        correct: false
        why: 'A public bucket is dangerous; presigned URLs exist precisely to avoid that.'
    ref: presigned-direct-upload
  - q: 'After the upload, the client calls `/uploads/confirm`. What is the right server behavior?'
    hint: 'The client may lie.'
    options:
      - text: 'Go to storage, check with `headObject` that the file exists and its size and type are right, then save the key'
        correct: true
        why: 'A client can be wrong by accident or on purpose, so checking for yourself is the safe route.'
      - text: 'Save whatever the client said in the database'
        correct: false
        why: 'If the file isn''t there, you collect broken references in the database.'
      - text: 'Download every file and scan it on the server each time'
        correct: false
        why: 'That throws away the point of presigned URLs; `headObject` is enough for checking size and type.'
      - text: 'Do nothing, because there is a URL'
        correct: false
        why: 'A URL existing is not proof that a file was uploaded.'
    ref: presigned-direct-upload
  - q: 'A 500 MB video is going up in 50 parts, and part 23 fails when the connection drops. What is the right move?'
    hint: 'What happened to the other parts?'
    options:
      - text: 'Resend only part 23 (and any that never went), then complete'
        correct: true
        why: 'The other parts are stored under the uploadId; they needn''t be sent again.'
      - text: 'Start the whole file over'
        correct: false
        why: 'That is exactly the problem multipart upload is meant to avoid.'
      - text: 'Treat whatever arrived as the file'
        correct: false
        why: 'Without calling complete the file is never created, and with missing parts it would be corrupt.'
      - text: 'Call complete without the ETags'
        correct: false
        why: 'Complete needs every part''s number and ETag.'
    ref: large-uploads-multipart
  - q: 'A user''s upload to a presigned PUT URL is 2 GB, but your limit is 5 MB. What is wrong?'
    hint: 'What does a presigned PUT actually sign?'
    options:
      - text: 'A presigned PUT can''t enforce a maximum size; storage accepts the big file'
        correct: true
        why: 'The content length isn''t part of the signature. Use a presigned POST with a content-length-range condition.'
      - text: 'Nothing: the URL is time-limited, so it can''t be abused'
        correct: false
        why: 'The expiry limits when, not how much. A big file within 10 minutes is still accepted.'
      - text: 'The server should stream the file and count the bytes itself'
        correct: false
        why: 'That puts the file back through your server, which is exactly what direct upload avoids.'
      - text: 'The client must be trusted to check the size before it uploads'
        correct: false
        why: 'A client can send anything; the limit must be enforced by storage or the server.'
    ref: presigned-direct-upload
  - q: 'Which leftovers does an unconfirmed upload create, and what cleans them?'
    hint: 'The user got a URL and never called confirm.'
    options:
      - text: 'An orphan object and a pending row, removed by a scheduled job that deletes what is still pending'
        correct: true
        why: 'The pending row is how you find the orphan object; deleting both keeps the bucket and the table clean.'
      - text: 'Nothing is left, because storage deletes unconfirmed files by itself'
        correct: false
        why: 'Storage keeps every object it receives until something deletes it.'
      - text: 'A broken page, fixed by the user retrying'
        correct: false
        why: 'The user never sees it, and the object keeps costing money.'
    ref: confirm-and-cleanup
  - q: 'The browser refreshed at part 251 of 400 of a multipart upload. What should the page and server do?'
    hint: 'Storage still holds the earlier parts under the uploadId.'
    options:
      - text: 'Ask storage which parts it holds (ListParts), send only the missing ones, then complete from that list'
        correct: true
        why: 'Parts already stored are never sent again, and completing from storage''s own list means a client can''t slip in a bad part.'
      - text: 'Start a new upload from part 1'
        correct: false
        why: 'That throws away 250 stored parts and wastes the user''s time.'
      - text: 'Complete the upload now with whatever parts the browser remembers'
        correct: false
        why: 'The file would miss parts 251 to 400, and the browser''s list may be wrong.'
    ref: resume-multipart
