    check:
      q: 'Split brain কী, আর তা ঠেকাতে failover-এ কোন ধাপ অবশ্যই থাকতে হবে?'
      a: 'দুটো নোড একসাথে নিজেকে leader ভেবে লেখা নিলে split brain হয়। ঠেকাতে পুরনো leader-কে fencing করে লেখা থেকে আটকাতে হবে।'

flashcards:
  - q: 'Leader/follower replication কী?'
    a: 'একটা নোড (leader) সব লেখা নেয় আর বদলগুলো follower-দের পাঠায়; follower-রা কপি রাখে আর পড়ার অনুরোধ নেয়।'
    more: |
      লেখা শুধু leader-এ যায় বলে ক্রম ঠিক থাকে। follower দিয়ে পড়ার চাপ ছড়ানো যায়, আর leader মরলে একজন follower নতুন leader হতে পারে। প্রাইমারি/রেপ্লিকাও একই ধারণার নাম।
    ref: one-copy-is-risky
  - q: 'Replication কি লেখার ক্ষমতা বাড়ায়?'
    a: 'না। লেখা তবু একটা leader-এই যায়। replication বাড়ায় পড়ার ক্ষমতা আর বেঁচে থাকার সম্ভাবনা।'
    more: |
      লেখার চাপ এক সার্ভারের সীমা ছাড়ালে ডেটা ভাগ করতে হয়, মানে sharding। তার আগে index, cache, ভালো query আর বড় সার্ভার ভাবো।
    ref: one-copy-is-risky
  - q: 'Sync আর async replication-এর পার্থক্য কী?'
    a: 'Async-এ leader follower-এর অপেক্ষা না করে commit করে (দ্রুত, ক্র্যাশে ডেটা হারানোর ঝুঁকি)। Sync-এ অপেক্ষা করে (নিরাপদ, ধীর)।'
    more: |
      PostgreSQL-এ synchronous_standby_names = 'ANY 1 (a, b)' দিলে যেকোনো একটা follower নিশ্চিত করলেই commit সফল হয়। একটা follower মরলেও লেখা থামে না।
    ref: sync-vs-async
  - q: 'Replication lag কী?'
    a: 'leader-এর কোনো বদল follower-এ পৌঁছাতে যত সময় লাগে। async-এ এটা সামান্য হলেও শূন্য নয়।'
    more: |
      ভারী লেখা, নেটওয়ার্কের দেরি বা ধীর follower-এ lag বাড়ে। lag মাপা (pg_stat_replication) আর সীমা পেরোলে alert দেওয়া জরুরি; নাহলে ব্যবহারকারী বাসি ডেটা দেখতে থাকবে।
    ref: replication-lag
  - q: 'Read-your-own-writes কী?'
    a: 'ব্যবহারকারী নিজে যা লিখেছে তা পরের পড়ায় অবশ্যই দেখতে পাওয়ার নিশ্চয়তা। follower থেকে পড়লে এটা ভাঙতে পারে।'
    more: |
      সমাধান: লেখার পরে কিছুক্ষণ (বা সংশ্লিষ্ট পড়া) leader থেকে পড়া, অথবা follower কতদূর এগিয়েছে দেখে তবে পড়া। Doctrine-এ ensureConnectedToPrimary() দিয়ে এটা করা যায়।
    ref: doctrine-primary-replica
  - q: 'Doctrine-এ replica কীভাবে বসায়?'
    a: 'doctrine.yaml-এ মূল url (primary) রেখে তার নিচে replicas: লিখো; DoctrineBundle PrimaryReadReplicaConnection ব্যবহার করবে।'
    more: |
      লেখা বা transaction শুরু হওয়ার পরে সেই request-এর বাকি সব query primary-তে যায়। অর্থাৎ এক request-এর ভেতরে নিজের লেখা ঠিকই দেখা যায়; সমস্যা পরের request-এ, তাই sticky ব্যবস্থা লাগে।
    ref: doctrine-primary-replica
  - q: 'Split brain কী, কীভাবে ঠেকায়?'
    a: 'দুটো নোড একসাথে নিজেকে leader ভেবে লেখা নিলে split brain। ঠেকাতে পুরনো leader-কে fencing করে লেখা থেকে আটকাও।'
    more: |
      দুই leader মানে দুই ভিন্ন সত্য, যা পরে জোড়া দেওয়া খুব কঠিন, কখনো অসম্ভব। তাই failover-এ আগে পুরনোটাকে আটকানো, তারপর নতুন leader তোলা। Patroni বা ম্যানেজড সেবা এই কাজ ঠিকভাবে করে।
    ref: failover-split-brain

quiz:
  - q: 'নিচের কোডটা লেখার পরেই পড়ছে। replica থাকলে কী সমস্যা হতে পারে, আর কখন?'
    lang: php
    code: |
      // POST /comments
      $em->persist($comment);
      $em->flush();
      return $this->redirectToRoute('comments_list');

      // GET /comments (পরের request)
      $comments = $repo->findBy(['user' => $user]);
    hint: 'দ্বিতীয় request কোন সংযোগ ব্যবহার করবে?'
    options:
      - text: 'GET /comments নতুন request, তাই replica থেকে পড়তে পারে; তখন lag থাকলে নতুন মন্তব্য না-ও দেখা যেতে পারে'
        correct: true
        why: 'primary-তে স্যুইচ শুধু একই request-এর ভেতরে থাকে। পরের request আবার replica-তে যায়, আর সেখানে lag থাকতে পারে।'
      - text: 'কিছু হবে না, কারণ flush() সব replica আপডেট করে দেয়'
        correct: false
        why: 'flush() শুধু primary-তে লেখে। replica-র কাছে বদল পৌঁছানো ডেটাবেসের নিজস্ব কাজ, যাতে সময় লাগে।'
      - text: 'findBy() লেখা করে, তাই primary-তে যাবে'
        correct: false
        why: 'findBy() শুধু পড়ে, তাই replica-তে যেতে পারে।'
      - text: 'সমস্যা শুধু sync replication-এ হয়'
        correct: false
        why: 'sync-এ সমস্যা কমে, কিন্তু ঠিক এই সেটআপ (async ও lag) সাধারণত ব্যবহৃত হয়।'
    ref: replication-lag
  - q: 'নিচের কোন কাজগুলো follower থেকে করা নিরাপদ?'
    hint: 'ডেটা একটু বাসি হলে কি ক্ষতি?'
    options:
      - text: 'মাস শেষের বিক্রির রিপোর্ট তৈরি'
        correct: true
        why: 'কয়েক সেকেন্ডের পুরনো ডেটায় রিপোর্টের অর্থ বদলায় না, আর ভারী query leader-কে বাঁচায়।'
      - text: 'পণ্যের ক্যাটালগের তালিকা দেখানো'
        correct: true
        why: 'কয়েক সেকেন্ডের পুরনো ক্যাটালগে ক্ষতি নেই। বেশি পড়ার চাপ follower-এ সরে।'
      - text: 'অর্ডার নিশ্চিত করার আগে stock পড়া'
        correct: false
        why: 'বাসি stock দেখে সিদ্ধান্ত নিলে একই জিনিস দুবার বিক্রি হতে পারে; এটা leader থেকে পড়তে হবে।'
      - text: 'ব্যবহারকারী এইমাত্র যে ঠিকানা সংরক্ষণ করেছে, সেটা ফর্মে দেখানো'
        correct: false
        why: 'নিজের এইমাত্র লেখা তখনো follower-এ না-ও পৌঁছাতে পারে; read-your-own-writes ভাঙবে।'
    ref: replication-lag
  - q: 'একটা ডেটাবেসে async replication, leader হঠাৎ ক্র্যাশ করল। ম্যানেজার জানতে চান, কোনো ডেটা হারাতে পারে কি?'
    hint: 'leader "হয়েছে" বলার আগে follower-এর অপেক্ষা করেছিল?'
    options:
      - text: 'না, replication-এ কখনো ডেটা হারায় না'
        correct: false
        why: 'এটা sync-এর বৈশিষ্ট্য। async-এ নিশ্চয়তা নেই।'
      - text: 'হ্যাঁ, যেসব commit তখনো follower পর্যন্ত পৌঁছায়নি সেগুলো হারাতে পারে'
        correct: true
        why: 'async-এ leader follower-এর নিশ্চিতি ছাড়াই commit করে, তাই পথে থাকা বদল হারাতে পারে।'
      - text: 'সব ডেটা হারাবে'
        correct: false
        why: 'শুধু follower-এ না-পৌঁছানো শেষের অংশ; আগের সবটা follower-এ আছে।'
      - text: 'শুধু পড়া ডেটা হারায়, লেখা নয়'
        correct: false
        why: 'পড়া হারানোর কিছু নেই। ঝুঁকি লেখা বদল নিয়ে।'
    ref: sync-vs-async
  - q: 'টাকার লেনদেনের ডেটাবেসে commit সফল বলার পর কখনো ডেটা হারানো চলবে না, আবার একটা follower মরলেও লেখা থামা চলবে না। কোন সেটআপ মানায়?'
    hint: 'sync চাই, কিন্তু একটার ওপর নির্ভর নয়।'
    options:
      - text: 'শুধু async, দ্রুত বলে'
        correct: false
        why: 'ক্র্যাশে শেষ commit হারাতে পারে।'
      - text: 'তিনটা follower, একটা নির্দিষ্ট sync follower, বাকিরা async'
        correct: false
        why: 'ওই একটা sync follower মরলে লেখা আটকে যাবে।'
      - text: 'একাধিক follower আর ANY 1 ধরনের quorum sync: যেকোনো একটা নিশ্চিত করলেই commit'
        correct: true
        why: 'অন্তত একটা follower-এ ডেটা থাকে, আবার একটা মরলেও অন্যটা দিয়ে লেখা চলে।'
      - text: 'follower ছাড়াই শুধু ভালো ব্যাকআপ'
        correct: false
        why: 'ব্যাকআপ পুরনো ডেটায় ফেরায়, তাৎক্ষণিক failover আর শেষ commit সুরক্ষা দেয় না।'
    ref: sync-vs-async
  - q: 'নেটওয়ার্কের সমস্যায় অ্যাপ ভাবল leader মরে গেছে, তাই একটা follower-কে leader বানাল। পুরনো leader আসলে বেঁচে ছিল। কী ঘটবে, আর কী করা উচিত ছিল?'
    hint: 'দুই leader একসাথে লেখা নিলে?'
    options:
      - text: 'split brain: দুজনেই লেখা নেয়, ডেটা দুই ভাগ হয়। নতুন leader তোলার আগে পুরনোকে fencing করা উচিত ছিল'
        correct: true
        why: 'পুরনোটাকে আটকানো ছাড়া failover করলে দুটো leader একসাথে লেখা নিতে পারে, আর দুই খাতা জোড়া দেওয়া কঠিন।'
      - text: 'কিছু হবে না, ডেটাবেস নিজে মিলিয়ে নেবে'
        correct: false
        why: 'সাধারণ leader/follower ব্যবস্থা দুই leader-এর লেখা নিজে মেলাতে পারে না।'
