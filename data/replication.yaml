          - {title: '২. পুরনোটাকে আটকাও', body: 'পুরনো leader-কে বন্ধ করো বা লেখা আটকাও (fencing)।', tone: accent, tip: 'এই ধাপটাই split brain ঠেকায়। পুরনো leader কোনোভাবেই আর লেখা নিতে পারবে না।'}
          - {title: '৩. সবচেয়ে এগিয়ে থাকাকে তোলো', body: 'যে follower leader-এর সবচেয়ে কাছাকাছি, তাকে নতুন leader করো।', tip: 'কম পিছিয়ে থাকা follower তুললে হারানো লেখা কম হয়।'}
          - {title: '৪. অ্যাপকে জানাও', body: 'অ্যাপ নতুন leader-এ লেখা পাঠাবে; পুরনোটা follower হয়ে ফেরে।', tip: 'পুরনো leader ফিরলে তার অতিরিক্ত লেখা বাদ দিয়ে নতুন leader থেকে আবার কপি নিতে হয়।'}
      - type: quote
        body: 'Failover স্বয়ংক্রিয় না হলে ভরসা নেই, আর fencing ছাড়া স্বয়ংক্রিয় failover বিপজ্জনক।'
