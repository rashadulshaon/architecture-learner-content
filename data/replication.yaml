slides:
  - slug: one-copy-is-risky
    title: 'একটাই কপি থাকলে বিপদ'
    kind: story
    tldr: 'একটা ডেটাবেস সার্ভার মরলে সব বন্ধ, আর পড়ার চাপও একজনই সামলায়। Replication ডেটার একাধিক কপি রাখে: একজন leader লেখে, follower-রা কপি পায়।'
    keywords: ['replication', 'leader follower', 'primary replica', 'high availability', 'read scaling', 'রেপ্লিকেশন']
    blocks:
      - type: metaphor
        icon: building
        title: 'হেড অফিসের খাতা, শাখার কপি'
        body: |
          একটা ব্যাংকের সব হিসাব শুধু হেড অফিসের খাতায়। অফিসে আগুন লাগলে সব শেষ, আর সবাই হিসাব দেখতে এলে লাইন লম্বা। তাই হেড অফিস প্রতিটা নতুন এন্ট্রি শাখাগুলোতেও পাঠায়। নতুন লেখা শুধু হেড অফিসে (leader), বাকি শাখা (follower) কপি রাখে আর দেখার কাজ নেয়।
      - type: visual
        kind: flow
        caption: 'এক leader, দুই follower: লেখা এক জায়গায়, পড়া ছড়ানো'
        nodes:
          - {id: app, label: 'Symfony অ্যাপ', icon: api, col: 0, row: 1, tip: 'লেখা আর পড়া দুটোর অনুরোধই এখান থেকে যায়।'}
          - {id: leader, label: 'leader', sub: 'primary, লেখা নেয়', icon: db, tone: accent, col: 2, row: 0, tip: 'একমাত্র যে নোড লেখা গ্রহণ করে। প্রতিটা বদল WAL-এ লিখে follower-দের পাঠায়।'}
          - {id: f1, label: 'follower ১', sub: 'শুধু পড়া', icon: db, col: 4, row: 0, tip: 'leader-এর কপি। পড়ার অনুরোধ নেয়, লেখা নেয় না।'}
          - {id: f2, label: 'follower ২', sub: 'শুধু পড়া', icon: db, col: 4, row: 2, tip: 'আরেকটা কপি। leader মরলে এটাও নতুন leader হতে পারে।'}
        edges:
          - {from: app, to: leader, label: 'সব লেখা যায় একটাই leader-এ'}
          - {from: leader, to: f1, label: 'leader প্রতিটা বদল follower ১-কে পাঠায়', dashed: true}
          - {from: leader, to: f2, label: 'একই বদল follower ২-কেও যায়', dashed: true}
          - {from: app, to: f1, label: 'পড়ার চাপ follower-এ ছড়িয়ে দেওয়া হয়', tone: good}
      - type: points
        title: 'Replication কী কী দেয়'
        style: check
        items:
          - 'বেঁচে থাকা: leader মরলে follower থেকে নতুন leader বানানো যায়।'
          - 'পড়ার ক্ষমতা: বেশি follower মানে বেশি পড়ার অনুরোধ সামলানো।'
          - 'ব্যাকআপ আর রিপোর্ট: follower থেকে ভারী query চালালে leader বাঁচে।'
    aside:
      - type: problem
        body: 'Replication লেখার ক্ষমতা বাড়ায় না: লেখা তবু একটা leader-এই যায়। লেখার চাপ বাড়লে লাগবে sharding।'
      - type: refs
        items:
          - {to: 'data/sharding', label: 'লেখার চাপ ভাগ করা'}
          - {to: 'resilience/disaster-recovery', label: 'replica কি ব্যাকআপের বিকল্প?'}
    check:
      q: 'Replication-এ লেখা আর পড়া কে কে সামলায়?'
      a: 'লেখা শুধু leader সামলায়। পড়া leader আর follower-রা ভাগ করে নিতে পারে, কারণ follower-রা leader-এর কপি রাখে।'

  - slug: sync-vs-async
    title: 'Sync বনাম async replication'
    kind: concept
    tldr: 'Async-এ leader follower-এর অপেক্ষা না করে "হয়েছে" বলে: দ্রুত, কিন্তু ক্র্যাশে শেষ লেখা হারাতে পারে। Sync-এ অপেক্ষা করে: নিরাপদ, কিন্তু ধীর।'
    keywords: ['synchronous replication', 'asynchronous', 'semi-sync', 'quorum', 'data loss', 'sync async']
    blocks:
      - type: metaphor
        icon: mail
        title: 'ডাকে পাঠানো না ফোনে জানানো'
        body: |
          হেড অফিস নতুন এন্ট্রি ডাকে শাখায় পাঠালে নিজের কাজ সেরে ফেলে, শাখা কাল পাবে। এটা async। আর ফোন করে "পেয়েছেন?" জেনে তবে গ্রাহককে বলা হলো "হয়ে গেছে": এটা sync। ডাক দ্রুত, কিন্তু হেড অফিসে আগুন লাগলে পথে থাকা চিঠি হারায়। ফোন নিরাপদ, কিন্তু শাখার লাইন ব্যস্ত থাকলে গ্রাহক দাঁড়িয়ে থাকে।
      - type: visual
        kind: compare
        caption: 'দুই পদ্ধতির দাম'
        columns:
          - title: 'Async (default)'
            tone: good
            icon: bolt
            tip: 'বেশিরভাগ অ্যাপ এটা ব্যবহার করে। লেখার গতি leader-এর নিজের গতিতে।'
            items:
              - 'leader নিজের ডিস্কে লিখেই commit করে'
              - 'লেখা দ্রুত, follower ধীর হলেও আটকায় না'
              - 'leader ক্র্যাশ করলে শেষ কিছু commit হারাতে পারে'
          - title: 'Sync'
            tone: warn
            icon: lock
            tip: 'টাকার মতো ডেটায় ভাবার বিষয়। বেশি নিরাপদ, কিন্তু প্রতিটা লেখা ধীর।'
            items:
              - 'leader অন্তত একটা follower-এর নিশ্চিতির অপেক্ষা করে'
              - 'প্রতিটা লেখায় নেটওয়ার্কের একটা round trip যোগ'
              - 'সব sync follower মরলে লেখাও থেমে যেতে পারে'
      - type: code
        lang: ini
        file: 'postgresql.conf (leader)'
        code: |
          # অন্তত ১টা follower নিশ্চিত করলে তবে commit সফল
          synchronous_standby_names = 'ANY 1 (replica1, replica2)'
          synchronous_commit = on
        marks:
          - {line: 2, tip: 'ANY 1 (...): যেকোনো একটা follower নিশ্চিত করলেই হয়। একটা মরলেও লেখা থামে না। একে quorum-ধরন sync বলে।'}
      - type: quote
        body: 'Async মানে leader মরলে শেষ লেখা হারানোর ঝুঁকি। Sync মানে প্রতিটা লেখার দেরি। দুটোর একটা তোমাকে বাছতে হবে।'
    aside:
      - type: when
        use:
          - 'Async: বেশিরভাগ অ্যাপ, যেখানে ক্র্যাশে শেষের কয়েক সেকেন্ডের লেখা হারালে চলে'
          - 'Sync (ANY 1): টাকা, অর্ডার, যেখানে "সফল" বলার পরে ডেটা হারানো চলে না'
        avoid:
          - 'শুধু একটা sync follower রাখা: সে মরলে লেখা আটকে যাবে'
      - type: refs
        items:
          - {to: 'scaling/cap-pacelc', label: 'গতি আর সঠিকতার বিনিময়'}
    check:
      q: 'Async replication-এ leader ক্র্যাশ করলে কোন ঝুঁকি থাকে?'
      a: 'শেষের কিছু commit হারাতে পারে, কারণ leader follower-এর নিশ্চিতির অপেক্ষা না করেই "হয়েছে" বলেছিল, আর সেগুলো follower পর্যন্ত পৌঁছায়নি।'

  - slug: replication-lag
    title: 'Lag: নিজের লেখাই দেখা যায় না'
    kind: pitfall
    tldr: 'Async follower কিছুটা পিছিয়ে থাকে (replication lag)। লেখার পরেই follower থেকে পড়লে ব্যবহারকারী নিজের নতুন ডেটাই পায় না, এই সমস্যার নাম read-your-own-writes।'
    keywords: ['replication lag', 'read your own writes', 'stale read', 'follower lag', 'রেপ্লিকা পিছিয়ে']
    blocks:
      - type: text
        body: |
          রহিম মন্তব্য লিখে "পাঠান" চাপল। লেখা গেল leader-এ, কিন্তু পাতা রিফ্রেশে পড়া হলো এমন follower থেকে, যার কাছে খবর তখনো পৌঁছায়নি। রহিম দেখল তার মন্তব্য নেই। সে আবার পাঠাল, তখন দুটো মন্তব্য। ডেটাবেস ঠিকই আছে, ভুল ঘটেছে কোথা থেকে পড়া হলো তাতে।
      - type: visual
        kind: sequence
        caption: 'লেখার পর বাসি জায়গা থেকে পড়া'
        actors:
          - {id: rahim, label: 'রহিম', icon: user, tip: 'মন্তব্য লিখে সাথে সাথে পাতা রিফ্রেশ করে।'}
          - {id: leader, label: 'leader', icon: db, tip: 'লেখা এখানেই যায়; এখানে নতুন মন্তব্য আছে।'}
          - {id: follower, label: 'follower', icon: db, tip: 'প্রায় ২ সেকেন্ড পিছিয়ে আছে। নতুন মন্তব্য এখনো পায়নি।'}
        messages:
          - {from: rahim, to: leader, label: 'মন্তব্য #৯১ লেখো'}
          - {from: leader, to: rahim, label: 'সফল', dashed: true}
          - {from: rahim, to: follower, label: 'আমার মন্তব্যগুলো দাও'}
          - {at: follower, note: 'lag ২ সেকেন্ড, #৯১ এখনো নেই', tone: warn, tip: 'leader থেকে এই follower পর্যন্ত বদল পৌঁছাতে সময় লাগছে। এটাই replication lag।'}
          - {from: follower, to: rahim, label: '#৯১ ছাড়া তালিকা', dashed: true, tone: bad, tip: 'রহিম ভাবছে মন্তব্য হারিয়ে গেছে।'}
      - type: quote
        body: 'নিজের লেখা নিজেকে দেখাতে হবে। লেখার পরে প্রয়োজনীয় পড়া leader থেকে করো।'
    aside:
      - type: story
        title: 'ডবল পোস্ট'
        body: 'এক সোশ্যাল অ্যাপে পোস্টের পরে ফিড follower থেকে আসত। অনেকেই পোস্ট না দেখে আবার পোস্ট করত, তাই একই লেখা দুই-তিনবার ছাপা হতো।'
      - type: terms
        items:
          - {term: 'Replication lag', meaning: 'leader-এর কোনো বদল follower-এ পৌঁছাতে যত সময় লাগে।'}
          - {term: 'Read-your-own-writes', meaning: 'নিজের লেখা পরের পড়ায় সবসময় দেখতে পাওয়ার নিশ্চয়তা।'}
      - type: refs
        items:
          - {to: 'data/consistency-models', label: 'কে কখন কী দেখে'}
    check:
      q: 'লেখা সফল হয়েছে, তবু সাথে সাথে পড়লে নতুন ডেটা নেই। এখানে ডেটাবেস কি ভুল করেছে?'
      a: 'না। পড়াটা এমন follower থেকে হয়েছে যে তখনো পিছিয়ে আছে (replication lag)। সমাধান হলো লেখার পরে কিছুক্ষণ leader থেকে পড়া।'

  - slug: doctrine-primary-replica
    title: 'Doctrine-এ primary/replica সেটআপ'
    kind: howto
    tldr: 'doctrine.yaml-এ replicas দিলে DoctrineBundle পড়া replica-তে আর লেখা primary-তে পাঠায়; লেখার পর ওই request-এর সব পড়া নিজে থেকেই primary-তে যায়, আর বাকিটা sticky listener সামলায়।'
    keywords: ['PrimaryReadReplicaConnection', 'Doctrine replicas', 'ensureConnectedToPrimary', 'doctrine.yaml', 'read replica', 'Symfony']
    blocks:
      - type: code
        lang: yaml
        file: 'config/packages/doctrine.yaml'
        code: |
          doctrine:
            dbal:
              url: '%env(resolve:DATABASE_URL)%'        # primary
              replicas:
                replica1:
                  url: '%env(resolve:DATABASE_REPLICA1_URL)%'
                replica2:
                  url: '%env(resolve:DATABASE_REPLICA2_URL)%'
        marks:
          - {line: 3, tip: 'মূল url হলো primary: সব লেখা, transaction আর migration এখানে।'}
          - {line: 4, tip: 'replicas দিলে DoctrineBundle আপনাআপনি PrimaryReadReplicaConnection ব্যবহার করে। প্রতি request-এ একটা replica এলোমেলো বাছা হয়।'}
      - type: text
        body: |
          নিয়মটা এই: প্রথমে কোনো লেখা না হলে `executeQuery()` (find, SELECT) replica-তে যায়। কিন্তু একবার `flush()` বা transaction শুরু হলে সেই request-এর বাকি সব পড়া-লেখা primary-তে চলে যায়। তাই এক request-এর ভেতরে নিজের লেখা নিজে ঠিকই দেখে। সমস্যা শুধু পরের request-এ।
      - type: code
        lang: php
        file: 'src/EventListener/StickyPrimaryListener.php'
        variant: good
        code: |
          #[AsEventListener(event: KernelEvents::REQUEST)]
          final readonly class StickyPrimaryListener
          {
              public function __construct(private Connection $connection) {}

              public function __invoke(RequestEvent $event): void
              {
                  $request = $event->getRequest();
                  if (!$event->isMainRequest() || !$request->hasSession()) {
                      return;
                  }

                  $until = $request->getSession()->get('primary_until', 0);
                  if ($until > time() && $this->connection instanceof PrimaryReadReplicaConnection) {
                      $this->connection->ensureConnectedToPrimary();   // সময় পর্যন্ত primary
                  }
              }
          }
        marks:
          - {line: 14, tip: 'লেখার পর ৫ সেকেন্ডের মতো এই ব্যবহারকারী primary থেকে পড়ে, replica-র lag পেরিয়ে যাওয়ার সময় দিয়ে।'}
      - type: text
        body: |
          লেখার পর controller-এ শুধু একটা লাইন যোগ করো: `$request->getSession()->set('primary_until', time() + 5);`। তাহলে ওই ব্যবহারকারীর পরের ৫ সেকেন্ডের পড়া primary থেকে হবে, আর ততক্ষণে replica সাধারণত ধরে ফেলে।
    aside:
      - type: tips
        items:
          - 'সব পড়া replica-তে নয়: টাকার হিসাব, লগইনের পর প্রথম পাতা আর "আমার" ডেটা primary-তে রাখাই নিরাপদ।'
          - 'বেশি জটিল হলে লেখার সময় leader-এর WAL position (LSN) টুকে রেখে follower সেই পর্যন্ত পৌঁছেছে কি না দেখা যায়, তবে এর জন্য আলাদা কাজ লাগে।'
      - type: refs
        items:
          - {to: 'scaling/load-balancing', label: 'অনুরোধ ছড়ানোর ধারণা'}
    check:
      q: 'Doctrine-এ লেখার পরে একই request-এ find() করলে নিজের লেখা দেখা যায় কেন?'
      a: 'flush বা transaction শুরু হলেই PrimaryReadReplicaConnection primary-তে চলে যায়, আর সেই request-এর বাকি সব query primary-তেই চলে।'

  - slug: failover-split-brain
    title: 'Failover আর split brain'
    kind: pitfall
