slides:
  - slug: same-fact-three-places
    title: 'One fact, three places, three versions'
    kind: story
    tldr: 'Write the same fact in several places and one day the copies drift apart; then nobody can say which one is right.'
    keywords: ['duplication', 'data anomaly', 'update anomaly', 'duplicate data', 'schema design']
    blocks:
      - type: metaphor
        icon: book
        title: 'The corner shop''s credit ledger'
        body: |
          A corner-shop owner writes the customer's name and phone number beside every line of the credit ledger, where he records who owes what. Mr Rahim's number changes. The shopkeeper writes the new number on one line, and the other two lines keep the old one. At month end he goes to call and can't tell which number is real. Write the same fact again and again in your table and exactly this happens.
      - type: visual
        kind: table
        caption: 'The customer_order table, with name and phone copied into every row'
        headers: ['order_id', 'customer_name', 'customer_phone']
        rows:
          - cells: ['101', 'Rahim Uddin', '01711-000001']
            tip: 'The first order has Rahim''s name and his old number. Everything was correct at that point.'
          - cells: ['102', 'Rahim Uddeen', '01711-000001']
            tip: 'The spelling differs: someone typed it by hand in this row. Now one person has two names.'
          - cells: ['130', 'Rahim Uddin', '01711-000002']
            tip: 'Rahim changed his number, but only the new order picked it up. The two earlier rows still hold the old one.'
      - type: quote
        body: 'Every place you write a fact is a place you must update it, and forgetting just one makes your data lie.'
    aside:
      - type: terms
        items:
          - {term: 'Schema', meaning: 'The fixed design of tables, columns and the relationships between them.'}
          - {term: 'Update anomaly', meaning: 'A fact stored in several rows is changed in one, and the others are left stale.'}
      - type: story
        title: 'Which number do I call?'
        body: 'A courier company had copied the customer''s address into every row of its orders table. A customer moved and placed a new order. The parcel for the old order still went to the old address, because the delivery app was reading that row.'
    check:
      q: 'If a customer''s phone number is copied into every order row, what is the risk when the number changes?'
      a: 'Some rows will have the new number and some the old one. One person ends up with two different truths, and there is no way to know which is right.'

  - slug: normalization-one-home
    title: 'Normalization: one home for every fact'
    kind: concept
    tldr: 'Normalization means storing each fact once, in its own table; everything else holds only its ID (a foreign key).'
    keywords: ['normalization', 'foreign key', '3NF', 'normal form', 'relationships', 'database design']
    blocks:
      - type: metaphor
        icon: book
        title: 'A separate page per customer'
        body: |
          This time the shopkeeper opens one page in his ledger for each customer, with the name and number written exactly once. A credit line just says "page 12". When the number changes, he fixes it on that one page and everybody sees the new number. The page is a table row, the page number is the primary key, and the "page 12" on a credit line is the foreign key.
      - type: visual
        kind: flow
        caption: 'The phone number lives only in the customer table; the others point to it by ID'
        nodes:
          - {id: customer, label: 'customer', sub: 'id, name, phone', icon: user, tone: accent, col: 0, row: 1, tip: 'The name and phone number exist here once. To change them you change a single row.'}
          - {id: orders, label: 'customer_order', sub: 'id, customer_id', icon: receipt, col: 1.5, row: 1, tip: 'The order holds no name or phone, only customer_id: the page number of the customer it belongs to.'}
          - {id: item, label: 'order_item', sub: 'order_id, product_id', icon: list, col: 3, row: 1, tip: 'An order can contain many products, so each product gets its own row.'}
          - {id: product, label: 'product', sub: 'id, name, price', icon: box, col: 4, row: 1, tip: 'The product''s name and price are stored here exactly once.'}
        edges:
          - {from: orders, to: customer, label: 'The order keeps only the customer_id', tip: 'This customer_id is the foreign key. When the name or phone is needed, it is read from the customer table.'}
          - {from: item, to: orders, label: 'Every item is part of one order'}
          - {from: item, to: product, label: 'The item keeps only the product_id'}
          - {from: customer, to: orders, label: 'One customer can have many orders', dashed: true, tip: 'This is a one-to-many relationship: one customer, many orders.'}
      - type: points
        title: 'The rule in three lines'
        style: number
        items:
          - 'One value per cell, never a comma-separated list (phone: ''017.., 018..'' is not allowed).'
          - 'Each fact lives in the table of the thing that owns it: the name goes in customer, not in order.'
          - 'Every column in a row must describe that row''s subject and nothing else.'
      - type: code
        lang: sql
        file: 'Changing Rahim''s number, before and after'
        code: |
          -- Before: the number sits in every order row
          UPDATE customer_order SET customer_phone = '01711-000002'
          WHERE customer_name = 'Rahim Uddin';   -- misses the row typed 'Rahim Uddeen'

          -- After: the number sits in one row, so one UPDATE is the whole job
          UPDATE customer SET phone = '01711-000002' WHERE id = 12;
        marks:
          - {line: 3, tip: 'Finding Rahim''s rows by name only works if every copy is spelled the same. Order 102 is not matched, so it keeps the old number.'}
          - {line: 6, tip: 'The customer has one row, found by its id, so there is no copy to forget.'}
    aside:
      - type: remember
        body: 'The rule: write a fact once, and refer to it by ID from everywhere else.'
      - type: tips
        items:
          - 'The price: showing an order with the customer''s name now needs a JOIN. With an index on customer_id that is fast. The next slides cover guards, and the last one the cases where a copy is the better choice.'
      - type: terms
        items:
          - {term: 'Primary key', meaning: 'The column that identifies a row uniquely.'}
          - {term: 'Foreign key', meaning: 'A column that holds the primary key value of a row in another table.'}
          - {term: 'Normal form (1NF-3NF)', meaning: 'The formal name for the three-line rule above.'}
    check:
      q: 'What do you gain by storing customer_id in the order row instead of customer_name?'
      a: 'To change a name or phone you edit one row in the customer table. Every order reads the name from that single truth, so nothing can disagree.'

  - slug: constraints-as-guards
    title: 'Constraints: the database as a guard'
    kind: howto
    tldr: 'NOT NULL, UNIQUE, FOREIGN KEY and CHECK stop bad data from entering inside the database itself, even when the code gets it wrong.'
    keywords: ['NOT NULL', 'UNIQUE', 'foreign key', 'CHECK constraint', 'Doctrine', 'constraint', 'data integrity']
    blocks:
      - type: text
        body: |
          Form validation only guards the browser and the controller. But data also gets in through import scripts, console commands, old code and the endpoint everyone forgot about. So put a last guard in the database itself: a constraint. A bad row simply cannot get in, whichever way it tries.
      - type: code
        lang: php
        file: 'src/Entity/OrderItem.php'
        variant: good
        code: |
          #[ORM\Entity]
          #[ORM\Table(name: 'order_item')]
          #[ORM\UniqueConstraint(name: 'uniq_order_product', columns: ['order_id', 'product_id'])]
          class OrderItem
          {
              #[ORM\Id, ORM\GeneratedValue, ORM\Column]
              private ?int $id = null;

              #[ORM\ManyToOne(targetEntity: Order::class)]
              #[ORM\JoinColumn(name: 'order_id', nullable: false, onDelete: 'CASCADE')]
              private Order $order;

              #[ORM\ManyToOne(targetEntity: Product::class)]
              #[ORM\JoinColumn(name: 'product_id', nullable: false, onDelete: 'RESTRICT')]
              private Product $product;

              #[ORM\Column]
              private int $quantity;
          }
        marks:
          - {line: 3, tip: 'UNIQUE: the same product cannot appear in two rows of the same order. To add it again you raise the quantity.'}
          - {line: 10, tip: 'nullable: false means NOT NULL. Because of the FK, the order with this order_id must really exist in its table.'}
          - {line: 14, tip: 'RESTRICT: a product that is in any order cannot be deleted. The order history never ends up orphaned.'}
      - type: code
        lang: sql
        file: 'migrations/Version20260101000000.php (SQL)'
        code: |
          ALTER TABLE order_item
            ADD CONSTRAINT chk_order_item_quantity CHECK (quantity > 0);

          ALTER TABLE product
            ADD CONSTRAINT chk_product_price CHECK (price_in_poisha >= 0);
        marks:
          - {line: 2, tip: 'CHECK: if the condition is false, the database rejects the row. Doctrine attributes have no CHECK, so add it in a migration with addSql().'}
      - type: visual
        kind: table
        caption: 'The four constraints: which mistake each one stops'
        headers: ['Constraint', 'Stops', 'Example']
        rows:
          - cells: ['NOT NULL', 'Empty values', 'An order with no customer_id']
            tip: 'Make anything NOT NULL if the row is meaningless without it.'
          - cells: ['UNIQUE', 'Duplicates', 'Two accounts with one email']
            tip: 'Even if two people sign up at the same moment, the second is blocked. A "check first" in code cannot promise that.'
          - cells: ['FOREIGN KEY', 'Orphan rows', 'A customer_id that does not exist']
            tip: 'Without an FK, the orders of a deleted customer are left dangling.'
          - cells: ['CHECK', 'Impossible values', 'quantity = -3']
            tip: 'Simple business rules, such as a price that cannot be negative.'
      - type: quote
        body: 'Code changes and there is more of it every year; data stays. The database is the last guard of the rules.'
    aside:
      - type: tips
        items:
          - 'Show friendly errors with the validator (`UniqueEntity`), and also catch `UniqueConstraintViolationException` around `flush()`: when two requests race, only the database stops the second.'
          - 'Adding a constraint to a big live table means cleaning bad rows first; see [[data/zero-downtime-migrations|migrations without downtime]].'
      - type: refs
        items:
          - {to: 'concurrency/atomic-operations', label: 'Preventing races with UNIQUE'}
    check:
      q: 'Is it enough to check that an email is unique in the Symfony validator, or do you need UNIQUE in the database too?'
      a: 'You need it in the database too. The validator "looks first, then writes", and two simultaneous requests can both pass. Only a UNIQUE constraint stops the second one.'

  - slug: when-to-duplicate
    title: 'When copying is right, and when it is not'
    kind: pitfall
    tldr: 'Copy a snapshot of facts that change over time but must stay fixed in history (price, address); normalize the rest.'
    keywords: ['denormalization', 'snapshot', 'price snapshot', 'invoice', 'denormalize', 'copying data']
    blocks:
      - type: text
        body: |
          The opposite mistake exists too: normalizing everything and reading an order's price from the product's current price. If a product goes from 100 to 120 taka, last month's invoice for 3 of them quietly changes from 300 to 360. So the price at the moment of the order must be copied into the order's own row. That is legitimate denormalization: a copy made on purpose, for a known reason.
      - type: code
        lang: sql
        file: 'Dangerous: reading the price through a join'
        variant: bad
        code: |
          SELECT SUM(p.price_in_poisha * oi.quantity) AS total
          FROM order_item oi
          JOIN product p ON p.id = oi.product_id
          WHERE oi.order_id = 130;
        marks:
          - {line: 1, tip: 'p.price_in_poisha is the product''s price today. If the price changes tomorrow, the total of the old order changes too.'}
      - type: code
        lang: sql
        file: 'Safe: the price at order time, in the row itself'
        variant: good
        code: |
          ALTER TABLE order_item ADD COLUMN unit_price_in_poisha INT;
          UPDATE order_item oi SET unit_price_in_poisha = p.price_in_poisha
          FROM product p WHERE p.id = oi.product_id;
          ALTER TABLE order_item ALTER COLUMN unit_price_in_poisha SET NOT NULL;

          SELECT SUM(unit_price_in_poisha * quantity) AS total
          FROM order_item
          WHERE order_id = 130;
        marks:
          - {line: 2, tip: 'Old rows get today''s price once, the best value we have. From now on the order code copies `$product->getPriceInPoisha()` into every new order_item when it is created, and it never changes afterwards.'}
          - {line: 6, tip: 'No join is needed and the result is always the same: 3 × 100 = 300, even after the price becomes 120. This is a snapshot.'}
      - type: visual
        kind: compare
        caption: 'Which copies are fine and which are a danger'
        columns:
          - title: 'Copying is fine'
            tone: good
            icon: check
            tip: 'Every such copy has a clear reason behind it: freezing history, or removing a query that has been measured as slow.'
            items:
              - 'The price and address at the moment of the order (snapshot)'
              - 'items_count on the order, changed in the same transaction as the order'
              - 'A separate summary table for reports, built from the main data'
          - title: 'Copying is a danger'
            tone: bad
            icon: cross
            tip: 'Cases where the copy should follow the original when it changes, but nobody has arranged for that to happen.'
            items:
              - 'customer_name on every order, which is supposed to match the customer''s name'
              - 'Copying early because "the join will be slow", without knowing'
              - 'A copy exists, but nobody wrote down who updates it'
    aside:
      - type: when
        use:
          - 'A value that may change later but must stay as it was in old records (price, address, tax rate)'
          - 'You measured that the join really is slow, and it is settled who updates the copy'
        avoid:
          - 'Copying only because "we won''t need a join later"'
          - 'Facts that should always show the current value (a customer''s current name)'
      - type: refs
        items:
          - {to: 'data/indexing', label: 'If a join is slow, look at indexes first'}
    check:
      q: 'Is copying each product''s price into the order row for an invoice a normalization mistake?'
      a: 'No, it is a deliberate snapshot. A change to the product price must never alter an old invoice total, so the copy has a clear reason.'

flashcards:
  - q: 'What is normalization, in one sentence?'
    a: 'Storing each fact once, in its own table, while everything else refers to it by ID (a foreign key).'
    more: |
      The goal is that no fact lives in more than one place, so changing it in one place shows the new value to everyone. That is why the name and phone live in the customer table, and an order holds only the customer_id.
    ref: normalization-one-home
  - q: 'What is an update anomaly?'
    a: 'When the same fact is stored in several rows, one is changed and the rest stay stale.'
    more: |
      For example, if a phone number is copied into every order, forgetting a single row when the number changes leaves the same person with two numbers. After that nobody can say which one is right.
    ref: same-fact-three-places
  - q: 'What does a foreign key do?'
    a: 'It ties a row to a row in another table, and refuses any ID whose row does not exist.'
    more: |
      With an FK you cannot create an order with customer_id = 999 if customer 999 does not exist. Deletes follow the rules too: with RESTRICT the delete is blocked, with CASCADE the related rows are deleted as well.
    ref: constraints-as-guards
  - q: 'Why is a UNIQUE constraint better than a validator check alone?'
    a: 'Even when two requests arrive together, the database blocks the second one; a validator''s "look first" cannot.'
    more: |
      There is a gap between the validator's check and the save. In that gap another request can insert the same value. A UNIQUE index makes the check inside the database as one indivisible step.
    ref: constraints-as-guards
  - q: 'How do you add a CHECK constraint in Doctrine?'
    a: 'Write addSql(''ALTER TABLE ... ADD CONSTRAINT ... CHECK (...)'') in a migration; Doctrine attributes have no CHECK.'
    more: |
      NOT NULL, UNIQUE and FK come straight from the entity attributes. A business rule like CHECK has to be written in SQL and kept in a migration. That way the rule lives inside the database, whichever code the data comes through.
    ref: constraints-as-guards
  - q: 'When is denormalization justified?'
    a: 'When the reason is clear: a snapshot that freezes history (an order''s price), or a copy for a query measured as slow, with someone responsible for updating it.'
    more: |
      Copying just because you think the join will be slow is a mistake. Measure first and try an index. If you do copy, write down where the original fact lives and who updates the copy and when.
    ref: when-to-duplicate
  - q: 'Why is an order''s price copied into its row instead of joining the product''s current price?'
    a: 'So that a later change to the product price does not alter the total of an old invoice.'
    more: |
      This is called a snapshot. The price, tax rate or address at the moment of the order is part of history. The current value and the historical value are different facts, so it is right to keep them in different places.
    ref: when-to-duplicate
  - q: 'What does normalization cost you?'
    a: 'Reading a record with its related facts needs a JOIN (or a second query). With an index on the foreign key this is usually fast.'
    more: |
      That is the whole price: a few more tables and some joins. It is almost always worth it, because wrong data costs far more than a join. Only when you have measured that a specific join is too slow, and an index does not help, should you consider a copy.
    ref: normalization-one-home

quiz:
  - q: 'A table has customer_address copied into every order row. The customer changes their address. What problem arises?'
    hint: 'Where else is the address written?'
    options:
      - text: 'Old orders keep the old address and new ones get the new one; it is hard to tell which is the real address'
        correct: true
        why: 'When the same fact lives in many places, one change leaves the rest stale. This is the update anomaly.'
      - text: 'Nothing, because the database updates every row by itself'
        correct: false
        why: 'The database does not know which columns are copies of the same fact. It treats separate columns as separate facts.'
      - text: 'Only the database size grows a little, with no other problem'
        correct: false
        why: 'The storage cost is not the real problem; the real problem is the data disagreeing with itself.'
      - text: 'The table can no longer be written to'
        correct: false
        why: 'Writes keep working, but with wrong or stale facts. The problem grows silently.'
    ref: same-fact-three-places
  - q: 'Which of these are traits of a normalized design?'
    hint: 'How many homes should each fact have?'
    options:
      - text: 'The order holds customer_id, and the name and phone live in the customer table'
        correct: true
        why: 'The fact lives once in its owner''s table, and the order holds only the ID.'
      - text: 'One column holds several phone numbers separated by commas'
        correct: false
        why: 'It breaks the rule of one value per cell; you would need a separate phone table.'
      - text: 'Changing a name means changing only one row'
        correct: true
        why: 'Because the fact exists once, one change shows the new value everywhere.'
      - text: 'Every order has customer_name copied in so that no join is needed'
        correct: false
        why: 'That is a copying (denormalized) design, and its biggest risk is disagreement.'
    ref: normalization-one-home
  - q: 'Two users sign up with the same email at the very same moment. What can happen with the code below?'
    lang: php
    code: |
      if ($users->findOneBy(['email' => $email])) {
          throw new EmailTaken();
      }

      $em->persist(new User($email));
      $em->flush();
    hint: 'What if both requests get past the "look first" step?'
    options:
      - text: 'Both pass and two accounts get created, if the database has no UNIQUE constraint'
        correct: true
        why: 'Both requests see "not found" at the same time, then both write. A UNIQUE constraint would have blocked the second write.'
      - text: 'Nothing, because findOneBy() takes a lock in the database'
        correct: false
        why: 'A plain findOneBy() takes no lock; it only reads.'
      - text: 'flush() will catch the duplicate by itself'
        correct: false
        why: 'flush() just sends SQL. Catching duplicates takes a UNIQUE index in the database.'
      - text: 'A problem occurs only if the emails differ in upper and lower case'
        correct: false
        why: 'It is not about spelling; the real risk is two requests arriving together.'
    ref: constraints-as-guards
  - q: 'The product_id foreign key on order_item has onDelete: RESTRICT. What happens when you try to delete a product that is in an order?'
    hint: 'Think about what the word RESTRICT means.'
    options:
      - text: 'The order_item rows for that product are deleted too'
        correct: false
        why: 'That is CASCADE behaviour. RESTRICT is the exact opposite.'
      - text: 'The product_id on the order_item becomes NULL by itself'
        correct: false
        why: 'That is SET NULL behaviour, and it would not even work on a NOT NULL column.'
      - text: 'The database blocks the delete and raises an error'
        correct: true
        why: 'RESTRICT means that as long as another row refers to it, it cannot be deleted. History never ends up orphaned.'
      - text: 'The delete goes through and the order_item is left holding an orphan ID'
        correct: false
        why: 'An FK exists precisely to prevent orphan rows like this.'
    ref: constraints-as-guards
  - q: 'In which cases is copying data (denormalizing) reasonable?'
    hint: 'Which value should stay fixed in old records even after it changes?'
    options:
      - text: 'The price of each product on an invoice, as of the moment of the order'
        correct: true
        why: 'History has to stay fixed. Joining the current price would change the totals of old invoices.'
      - text: 'The customer''s current name on every order, so no join is needed'
        correct: false
        why: 'It is meant to always show the current name; the copy will go stale and cause disagreement.'
      - text: 'The delivery address as it was when the order was placed'
        correct: true
        why: 'Even if the address changes later, where the old parcel went is part of history.'
      - text: 'Any column at all, because joins are always slow'
        correct: false
        why: 'A join is usually fast when indexed. Copying without measuring only adds risk.'
    ref: when-to-duplicate
  - q: 'Rahim''s phone is copied into every order row. A developer runs the UPDATE below. What goes wrong?'
    lang: sql
    code: |
      UPDATE customer_order SET customer_phone = '01711-000002'
      WHERE customer_name = 'Rahim Uddin';
    hint: 'Look at how the name was typed in the other rows.'
    options:
      - text: 'Rows where the name was typed differently ("Rahim Uddeen") are missed and keep the old number'
        correct: true
        why: 'With copies, you find them by matching text, and any variant slips through. One person ends up with two numbers.'
      - text: 'Nothing, the UPDATE fixes every row of that customer'
        correct: false
        why: 'It fixes only rows whose text matches exactly.'
      - text: 'The database refuses because the column is duplicated'
        correct: false
        why: 'The database has no idea the columns are copies of one fact; it just runs the UPDATE.'
      - text: 'It is slow, but the result is correct'
        correct: false
        why: 'Speed is not the issue; the missed rows are.'
    ref: normalization-one-home
