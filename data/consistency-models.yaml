slides:
  - slug: time-travelling-page
    title: 'পাতা রিফ্রেশে সময় পিছিয়ে গেল'
    kind: story
    tldr: 'ডেটার একাধিক কপি থাকলে একই মুহূর্তে সবাই এক জিনিস দেখে না; কে কখন কী দেখবে, তার নিয়মের নামই consistency model।'
    keywords: ['consistency', 'consistency model', 'stale read', 'eventual consistency', 'কনসিস্টেন্সি', 'বাসি ডেটা']
    blocks:
      - type: metaphor
        icon: school
        title: 'স্কুলের নোটিশ বোর্ড'
        body: |
          স্কুলের তিন ভবনে তিনটা নোটিশ বোর্ড। হেডস্যার নতুন নোটিশ লিখলে পিয়ন এক এক করে সব বোর্ডে টাঙায়। যে ছাত্র প্রথম বোর্ডে নতুন নোটিশ দেখে, সে দ্বিতীয় ভবনের বোর্ডে গিয়ে সেই নোটিশ না-ও পেতে পারে, কারণ পিয়ন সেখানে পৌঁছায়নি। কপি যত বেশি, এমন অমিলের সুযোগ তত বেশি।
      - type: visual
        kind: sequence
        caption: 'রহিম দুবার রিফ্রেশ করল, আর সংখ্যা কমে গেল'
        actors:
          - {id: rahim, label: 'রহিম', icon: user, tip: 'একই পাতা পরপর দুইবার খুলছে।'}
          - {id: ra, label: 'replica A', icon: db, tip: 'ইতিমধ্যে নতুন মন্তব্য পেয়ে গেছে।'}
          - {id: rb, label: 'replica B', icon: db, tip: 'এখনো পিছিয়ে; নতুন মন্তব্য পায়নি।'}
        messages:
          - {from: rahim, to: ra, label: 'মন্তব্যগুলো দেখাও'}
          - {from: ra, to: rahim, label: '৩টা মন্তব্য', dashed: true}
          - {from: rahim, to: rb, label: 'রিফ্রেশ: আবার দেখাও', tip: 'load balancer এবার অন্য replica-তে পাঠাল।'}
          - {from: rb, to: rahim, label: '২টা মন্তব্য', dashed: true, tone: bad, tip: 'রহিম এইমাত্র ৩টা দেখেছে, এখন ২টা। সময় পিছিয়ে গেল।'}
          - {at: rahim, note: 'ডেটা কি মুছে গেল?', tone: bad}
      - type: quote
        body: 'কপি যত বেশি, "কে কখন কী দেখবে"-র নিয়ম ঠিক করা তত জরুরি।'
    aside:
      - type: story
        title: 'ফিরে আসা লাইক'
        body: 'এক অ্যাপে পোস্টের লাইক গুনতি রিফ্রেশে ১২ থেকে ১০ হয়ে আবার ১২ হয়ে যেত। ব্যবহারকারীরা ভাবত অ্যাপ ভাঙা। আসলে প্রতিটা অনুরোধ আলাদা replica-তে যাচ্ছিল।'
      - type: refs
        items:
          - {to: 'data/replication', label: 'replication lag কেন হয়'}
    check:
      q: 'দুইবার রিফ্রেশে মন্তব্যের সংখ্যা ৩ থেকে ২ হলো। ডেটা কি মুছে গেছে?'
      a: 'না। দুটো অনুরোধ আলাদা replica-তে গেছে; একটা নতুন ডেটা পেয়েছে, অন্যটা এখনো পায়নি। এটা consistency-র সমস্যা, ডেটা হারানো নয়।'

  - slug: consistency-ladder
    title: 'Strong থেকে eventual: নিয়মের সিঁড়ি'
    kind: concept
    tldr: 'Strong consistency সবাইকে সবসময় সর্বশেষ ডেটা দেখায় কিন্তু ধীর ও কম টেকসই; eventual সবচেয়ে দ্রুত কিন্তু সাময়িকভাবে পুরনো ডেটা দেখায়; মাঝখানে কয়েকটা সুবিধাজনক নিয়ম আছে।'
    keywords: ['strong consistency', 'eventual consistency', 'linearizable', 'causal consistency', 'session guarantees', 'নিয়মের সিঁড়ি']
    blocks:
      - type: metaphor
        icon: school
        title: 'নোটিশ টাঙানোর তিন নিয়ম'
        body: |
          কড়া নিয়ম: নোটিশ সব বোর্ডে না টাঙানো পর্যন্ত কেউ কিছু দেখবে না। সবাই একই নোটিশ দেখে, কিন্তু অপেক্ষা লম্বা, আর এক ভবনের পিয়ন না এলে সব আটকে যায়। ঢিলা নিয়ম: যেখানে পৌঁছেছে সেখানে দেখো, বাকি বোর্ডে পরে আসবে। এতে দ্রুত, কিন্তু কিছুক্ষণ অমিল। মাঝের নিয়মগুলো অমিলের নির্দিষ্ট কিছু ধরন ঠেকায়।
      - type: visual
        kind: layers
        caption: 'শক্ত থেকে ঢিলা, ওপরে নিরাপদ কিন্তু ভারী, নিচে দ্রুত কিন্তু অমিলের সুযোগ'
        layers:
          - {label: 'Strong (linearizable)', sub: 'সবাই সবসময় সর্বশেষ দেখে', tone: accent, tip: 'যেন একটাই কপি আছে। লেখা শেষ হওয়ার পর যে-ই পড়ুক, নতুন মান পায়। বেশি দেরি আর কম টেকসই।'}
          - {label: 'Causal', sub: 'কারণ আগে, ফল পরে', tip: 'প্রশ্ন দেখার আগে তার উত্তর কেউ দেখবে না। যেসব ঘটনা একটা আরেকটার ওপর নির্ভর করে, তাদের ক্রম বজায় থাকে।'}
          - {label: 'Read-your-writes', sub: 'নিজের লেখা নিজে দেখি', tip: 'যে লিখেছে সে অন্তত নিজের লেখাটা পরের পড়ায় দেখে, অন্যরা কিছু দেরিতে দেখলেও।'}
          - {label: 'Monotonic reads', sub: 'সময় পিছিয়ে যায় না', tip: 'একবার নতুন ডেটা দেখলে পরের পড়ায় আর পুরনো দেখবে না।'}
          - {label: 'Eventual', sub: 'অবশেষে সবাই একই দেখবে', tone: muted, tip: 'কিছুক্ষণ সবাই আলাদা দেখতে পারে, কিন্তু নতুন লেখা না এলে শেষে সব কপি সমান হয়। সবচেয়ে দ্রুত।'}
      - type: quote
        body: 'Strong সুবিধা দেয় কিন্তু দেরি ও ব্যর্থতার ঝুঁকি বাড়ায়। যেখানে সত্যিই দরকার, শুধু সেখানেই চাও।'
    aside:
      - type: remember
        body: 'শক্ত মানে ধীর। প্রতিটা ডেটার জন্য সবচেয়ে ঢিলা নিয়মটা বাছো, যেটা ব্যবহারকারীকে বিভ্রান্ত করে না।'
      - type: refs
        items:
          - {to: 'scaling/cap-pacelc', label: 'কেন শক্ত নিয়মে দাম দিতে হয়'}
    check:
      q: 'Eventual consistency-তে "eventual" শব্দটা কী বোঝায়?'
      a: 'নতুন লেখা বন্ধ থাকলে কিছুক্ষণ পরে সব কপি একই মানে পৌঁছাবে। মাঝের সময়ে কপিগুলো ভিন্ন মান দেখাতে পারে।'

  - slug: session-guarantees
    title: 'নিজের লেখা আর সময়ের সরলরেখা'
    kind: howto
    tldr: 'Read-your-writes আর monotonic reads কম খরচে পাওয়া যায়: লেখার পর প্রয়োজনে primary থেকে পড়ো, আর প্রতিটা ব্যবহারকারীকে সবসময় একই replica-তে পাঠাও।'
    keywords: ['read your writes', 'monotonic reads', 'sticky session', 'LSN', 'session guarantee', 'replica pinning']
    blocks:
      - type: visual
        kind: table
        caption: 'দুই session guarantee: সমস্যা আর সমাধান'
        headers: ['নিশ্চয়তা', 'ভাঙলে কী দেখো', 'কীভাবে দেবে']
        rows:
          - cells: ['Read-your-writes', 'নিজের নতুন লেখা পাতায় নেই', 'লেখার পর replica যথেষ্ট এগিয়েছে কি না দেখো, নাহলে primary']
            tip: 'শুধু যে লিখেছে তার জন্য। অন্যরা একটু দেরিতে দেখলে চলে, তাই খরচ কম।'
          - cells: ['Monotonic reads', 'রিফ্রেশে ডেটা পিছিয়ে যায়', 'ব্যবহারকারীকে সবসময় একই replica-তে পাঠাও']
            tip: 'একটা replica কখনো পেছনে যায় না। তাই এক replica-তে থাকলে সময় সামনেই এগোয়।'
      - type: code
        lang: php
        file: 'src/Data/FreshReadGuard.php'
        variant: good
        code: |
          final readonly class FreshReadGuard
          {
              public function __construct(
                  #[Autowire(service: 'doctrine.dbal.default_connection')]
                  private PrimaryReadReplicaConnection $db,
              ) {}

              public function rememberWrite(SessionInterface $session): void
              {
                  $this->db->ensureConnectedToPrimary();
                  $session->set('min_lsn', $this->db->fetchOne('SELECT pg_current_wal_lsn()'));
              }

              public function usePrimaryIfReplicaBehind(SessionInterface $session): void
              {
                  $min = $session->get('min_lsn');
                  if ($min === null) {
                      return;
                  }

                  $this->db->ensureConnectedToReplica();
                  $fresh = $this->db->fetchOne(
                      'SELECT pg_last_wal_replay_lsn() >= CAST(? AS pg_lsn)', [$min],
                  );
                  if (!$fresh) {
                      $this->db->ensureConnectedToPrimary();
                  }
              }
          }
        marks:
          - {line: 11, tip: 'লেখার পরে leader-এর WAL position (LSN) টুকে রাখি: "আমার লেখা এই বিন্দুর আগেই আছে"।'}
          - {line: 25, tip: 'replica যদি ওই LSN পর্যন্ত এখনো না পৌঁছায়, তাহলে এই পড়া primary থেকে হয়। নিজের লেখা না দেখার সুযোগই থাকে না।'}
      - type: points
        title: 'monotonic-এর সহজ উপায়'
        style: dot
        items:
          - 'load balancer-এ user_id ধরে hash করো, যাতে একই ব্যবহারকারী একই replica পায়।'
          - 'সেই replica মরলে অন্যটায় সরলে সময় পিছিয়ে যেতে পারে, এটুকু মেনে নেওয়া যায় (বিরল)।'
    aside:
      - type: tips
        items:
          - 'প্রতি পড়ায় LSN যাচাই ছোট একটা query, কিন্তু সব পড়ায় নয়। শুধু ব্যবহারকারী সম্প্রতি লিখেছে এমন সময়ে।'
          - 'সহজতম বিকল্প: লেখার পরে ৫ সেকেন্ড primary থেকে পড়া, দেখো [[data/replication|replication]]-এ।'
      - type: commands
        title: 'PostgreSQL LSN'
        items:
          - {cmd: 'SELECT pg_current_wal_lsn();', desc: 'primary-তে এখনকার WAL অবস্থান'}
          - {cmd: 'SELECT pg_last_wal_replay_lsn();', desc: 'replica এ পর্যন্ত কতটা প্রয়োগ করেছে'}
    check:
      q: 'ব্যবহারকারীকে সবসময় একই replica-তে পাঠালে কোন সমস্যা মেটে?'
      a: 'Monotonic reads: রিফ্রেশে ডেটা পিছিয়ে যায় না, কারণ একটা replica কখনো পেছনে যায় না। তবে নিজের লেখা দেখার (read-your-writes) নিশ্চয়তা এতে আসে না।'

  - slug: causal-order
    title: 'Causal: প্রশ্ন আগে, উত্তর পরে'
    kind: pitfall
    tldr: 'যেসব ঘটনা একটা আরেকটার ওপর নির্ভর করে (প্রশ্ন-উত্তর), তাদের ক্রম ভাঙলে ব্যবহারকারী অর্থহীন কিছু দেখে। Causal consistency এই ক্রম রক্ষা করে।'
    keywords: ['causal consistency', 'causality', 'happens before', 'ordering', 'orphan reply', 'কারণ-ফল']
    blocks:
      - type: text
        body: |
          করিম প্রশ্ন করল "ট্রেন কটায়?", রহিম উত্তর দিল "৯টায়"। দুটো আলাদা shard-এ আছে বলে প্রশ্নটা পাঠকের কাছে দেরিতে পৌঁছাল। পাঠক শুধু "৯টায়" দেখল, সঙ্গে কোনো প্রশ্ন নেই। Single-leader replica-তে লেখার ক্রম সাধারণত বজায় থাকে; এই অবস্থা আসে shard, multi-leader বা আলাদা সার্ভিসের ভিন্ন ভিন্ন পথে।
      - type: visual
        kind: sequence
        caption: 'উত্তর আগে পৌঁছাল, প্রশ্ন পরে'
        actors:
          - {id: pathok, label: 'পাঠক', icon: user, tip: 'কমেন্টের পাতা দেখছে।'}
          - {id: ans, label: 'উত্তরের shard', icon: db, tip: 'রহিমের উত্তর এখানে ইতিমধ্যে পৌঁছেছে।'}
          - {id: q, label: 'প্রশ্নের shard', icon: db, tip: 'করিমের প্রশ্ন আছে, কিন্তু এই পাঠকের কাছে এখনো পৌঁছায়নি।'}
        messages:
          - {from: pathok, to: ans, label: 'উত্তরগুলো দাও'}
          - {from: ans, to: pathok, label: '"৯টায়" (রহিমের উত্তর)', dashed: true}
          - {from: pathok, to: q, label: 'সেই প্রশ্নটা কই?'}
          - {from: q, to: pathok, label: 'এই প্রশ্ন নেই (দেরিতে আসছে)', dashed: true, tone: bad}
          - {at: pathok, note: 'উত্তর আছে, প্রশ্ন নেই: অর্থহীন', tone: bad}
      - type: code
        lang: vue
        file: 'CommentList.vue'
        variant: good
        code: |
          <script setup lang="ts">
          import { computed } from 'vue'

          interface Comment { id: string; parentId: string | null; text: string }
          const props = defineProps<{ comments: Comment[] }>()

          const known = computed(() => new Set(props.comments.map((c) => c.id)))

          // যে উত্তরের প্রশ্ন এখনো আসেনি, আপাতত তা লুকানো
          const visible = computed(() =>
            props.comments.filter((c) => c.parentId === null || known.value.has(c.parentId)),
          )
          </script>

          <template>
            <ul>
              <li v-for="c in visible" :key="c.id">{{ c.text }}</li>
            </ul>
          </template>
        marks:
          - {line: 10, tip: 'parentId ধরে কারণ-ফল সম্পর্ক ডেটাতেই লেখা থাকে, তাই ক্লায়েন্ট বুঝতে পারে কোন উত্তরের কারণ এখনো আসেনি।'}
    aside:
      - type: tips
        items:
          - 'প্রতিটা উত্তরে parent_id রাখো। ডেটায় সম্পর্ক লেখা থাকলেই ক্রমের নিয়ম প্রয়োগ করা যায়।'
          - 'ডেটাবেস নিজে causal ক্রম দিলে সবচেয়ে ভালো (যেমন কিছু distributed ডেটাবেসে বিকল্প আছে); না দিলে অ্যাপ লুকিয়ে বা অপেক্ষা করে সামলাতে পারে।'
      - type: refs
        items:
          - {to: 'time/ordering-events', label: 'ঘটনার ক্রম কীভাবে ঠিক হয়'}
    check:
      q: 'Causal consistency কোন ধরনের অর্থহীন দৃশ্য ঠেকায়?'
      a: 'কারণ ছাড়া ফল দেখা, যেমন প্রশ্ন না দেখেই তার উত্তর দেখা। যে ঘটনা আরেকটার ওপর নির্ভরশীল, তা আগে দেখানো হয়।'

