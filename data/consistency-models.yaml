flashcards:
  - q: 'Consistency model কী?'
    a: 'ডেটার একাধিক কপি থাকলে কে কখন কী দেখতে পাবে, তার নিয়ম বা নিশ্চয়তা।'
    more: |
      একটাই কপি থাকলে প্রশ্ন ওঠে না। replication, cache বা shard-এ কপি বাড়লে কপিগুলো সবসময় এক নয়। model ঠিক করে ঠিক কতটুকু অমিল সহ্য করা হবে।
    ref: time-travelling-page
  - q: 'Strong consistency কী দেয় আর কী দাম নেয়?'
    a: 'লেখা শেষ হওয়ার পর সবাই সর্বশেষ মান পায়, যেন কপি একটাই। বিনিময়ে দেরি আর ব্যর্থতার ঝুঁকি বাড়ে।'
    more: |
      সব কপির সম্মতির অপেক্ষা করতে হয়, তাই লেখা ধীর। কোনো কপি পৌঁছানো না গেলে লেখা বা পড়া আটকে যেতে পারে। তাই টাকা, stock-এর মতো জায়গায় শুধু।
    ref: consistency-ladder
  - q: 'Eventual consistency কী?'
    a: 'নতুন লেখা না এলে কিছুক্ষণ পরে সব কপি একই মানে পৌঁছায়। মাঝের সময়ে কপিগুলো ভিন্ন মান দেখাতে পারে।'
    more: |
      সবচেয়ে দ্রুত আর টেকসই নিয়ম, কারণ কাউকে অপেক্ষা করতে হয় না। লাইক, view count, ফিডে এটা বেশ চলে। টাকার হিসাবে চলে না।
    ref: consistency-ladder
  - q: 'Read-your-writes কী, কীভাবে দেওয়া যায়?'
    a: 'ব্যবহারকারী নিজের লেখা পরের পড়ায় দেখে। লেখার পর primary থেকে পড়া বা replica যথেষ্ট এগিয়েছে কি না যাচাই করে দেওয়া যায়।'
    more: |
      অন্যরা কিছু দেরিতে দেখলে ক্ষতি নেই, তাই এটা সস্তা নিয়ম। PostgreSQL-এ লেখার পরে pg_current_wal_lsn() টুকে রেখে replica-র pg_last_wal_replay_lsn() তার সমান বা বেশি কি না দেখা যায়।
    ref: session-guarantees
  - q: 'Monotonic reads কী?'
    a: 'একবার নতুন ডেটা দেখলে পরের পড়ায় আর পুরনো ডেটা দেখবে না: সময় পিছিয়ে যায় না।'
    more: |
      রিফ্রেশে লাইক বা মন্তব্য কমে গেলে এটা ভাঙে। সহজ সমাধান: ব্যবহারকারীকে সবসময় একই replica-তে পাঠানো, কারণ একটা replica কখনো পিছিয়ে যায় না।
    ref: session-guarantees
  - q: 'Causal consistency কী?'
    a: 'যে ঘটনা আরেকটার ওপর নির্ভর করে, তা পরের ঘটনার আগে দেখা যায়: প্রশ্ন আগে, উত্তর পরে।'
    more: |
      single-leader replica-তে লেখার ক্রম বজায় থাকে, কিন্তু আলাদা shard বা multi-leader-এ উত্তর আগে পৌঁছাতে পারে। parent_id রেখে অ্যাপ অপেক্ষা বা লুকিয়ে এটা সামলাতে পারে।
    ref: causal-order
  - q: 'ব্যালেন্স আর লাইক গোনায় কোন কোন consistency নিয়ম মানায়?'
    a: 'ব্যালেন্স: strong (primary থেকে পড়া)। লাইক গুনতি: eventual যথেষ্ট।'
    more: |
      সিদ্ধান্তের প্রশ্ন: বাসি ডেটায় কি টাকা, stock বা নিরাপত্তায় ভুল সিদ্ধান্ত হবে? হলে strong। না হলে যতটা ঢিলা নিয়ম ব্যবহারকারীকে বিভ্রান্ত করে না, ততটা।
    ref: choose-per-feature

quiz:
  - q: 'রহিম মন্তব্য লিখে পাতা রিফ্রেশ করল, তার মন্তব্য নেই। কোন নিশ্চয়তা ভাঙল?'
    hint: 'সমস্যাটা নিজের লেখা নিয়ে।'
    options:
      - text: 'Read-your-writes'
        correct: true
        why: 'ব্যবহারকারী নিজের লেখা পরের পড়ায় দেখতে পায়নি। এটাই এই নিশ্চয়তার সংজ্ঞা।'
      - text: 'Causal consistency'
        correct: false
        why: 'এখানে দুটো নির্ভরশীল ঘটনার ক্রমের প্রশ্ন নেই; প্রশ্নটা নিজের লেখার।'
      - text: 'Monotonic reads'
        correct: false
        why: 'এটা ভাঙে যখন নতুন দেখার পর পুরনো ফেরে। এখানে নতুন কখনো দেখাই হয়নি।'
      - text: 'কোনোটাই নয়, এটা ডেটা হারানো'
        correct: false
        why: 'ডেটা আছে, শুধু যে replica-তে পড়া হয়েছে সেখানে পৌঁছায়নি।'
    ref: session-guarantees
  - q: 'নিচের কোন ফিচারে strong consistency সবচেয়ে বেশি দরকার?'
    hint: 'বাসি ডেটা দেখে ভুল সিদ্ধান্ত হতে পারে কোথায়?'
    options:
      - text: 'পোস্টের লাইক সংখ্যা'
        correct: false
        why: 'এক-দুইটা কম-বেশি দেখালে কেউ ক্ষতিগ্রস্ত হয় না।'
      - text: 'bKash-এর মতো ওয়ালেটের ব্যালেন্স, খরচের আগে যাচাই'
        correct: true
        why: 'বাসি ব্যালেন্স দেখে দুবার খরচ করতে দিলে টাকা ভুল হবে।'
      - text: 'ব্লগের পড়ার সংখ্যা'
        correct: false
        why: 'আন্দাজি সংখ্যা যথেষ্ট; নির্ভুলতার প্রয়োজন নেই।'
      - text: 'সম্প্রতি-দেখা-পণ্যের তালিকা'
        correct: false
        why: 'কয়েক সেকেন্ডের পুরনো তালিকায় ক্ষতি নেই।'
    ref: choose-per-feature
  - q: 'নিচের কোডে সমস্যা কী, ধরো replica থেকে পড়া হচ্ছে?'
    lang: php
    code: |
      $em->persist($address);
      $em->flush();

      return $this->redirectToRoute('profile');   // পরের request-এ replica থেকে ঠিকানা পড়ে
    hint: 'redirect-এর পরের request কোন সংযোগ নেবে?'
    options:
      - text: 'ব্যবহারকারী প্রোফাইলে গিয়ে পুরনো ঠিকানা দেখতে পারে, মনে হবে সংরক্ষণ হয়নি'
        correct: true
        why: 'নতুন request replica-তে গেলে এবং সেটা পিছিয়ে থাকলে read-your-writes ভাঙে। লেখার পর কিছুক্ষণ primary বা LSN যাচাই লাগবে।'
      - text: 'কিছু হবে না, কারণ flush() শেষ'
        correct: false
        why: 'flush() শুধু primary-তে লেখে; replica পরে পায়।'
      - text: 'redirect ব্যবহার করা ভুল'
        correct: false
        why: 'redirect ঠিক আছে; সমস্যা কোথা থেকে পরের পড়া হচ্ছে তাতে।'
      - text: 'persist() না করে merge() করতে হবে'
        correct: false
        why: 'এটা ORM-এর প্রশ্ন নয়, ডেটা কোন কপি থেকে পড়া হচ্ছে সেটার।'
    ref: session-guarantees
  - q: 'ব্যবহারকারীকে সবসময় একই replica-তে পাঠালে কোন নিশ্চয়তা সহজে পাওয়া যায়?'
    hint: 'একটা replica কখনো সময়ে পিছায় না, কিন্তু সে কতটা এগিয়েছে তা অনিশ্চিত।'
    options:
      - text: 'Monotonic reads'
        correct: true
        why: 'একই replica সময়ে শুধু এগোয়, তাই পুরনো ডেটায় ফেরা হয় না।'
      - text: 'Read-your-writes'
        correct: false
        why: 'সেই replica লেখার খবর এখনো না-ও পেতে পারে; তাই আলাদা যাচাই বা primary লাগে।'
      - text: 'Strong consistency'
        correct: false
        why: 'একই replica হলেও সে leader-এর পিছিয়ে থাকতে পারে, তাই সর্বশেষ মানের নিশ্চয়তা নেই।'
      - text: 'কিছু লাগে না, eventual consistency-তে সময় কখনো পিছায় না'
        correct: false
        why: 'eventual-এ সময় পিছিয়ে যেতে পারে; sticky replica সেই সমস্যা কমায়।'
    ref: session-guarantees
  - q: 'কোন কোন পরিস্থিতিতে causal ক্রম ভাঙার সম্ভাবনা বেশি, আর কীভাবে সামলাবে?'
    hint: 'যেখানে সম্পর্কিত ডেটা আলাদা পথে ছড়ায়।'
    options:
      - text: 'প্রশ্ন আর উত্তর আলাদা shard-এ থাকলে'
        correct: true
