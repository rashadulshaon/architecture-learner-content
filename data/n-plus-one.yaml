slides:
  - slug: fifty-one-queries
    title: 'এক পাতায় ৫১টা query'
    kind: story
    tldr: 'তালিকা আনতে ১টা query, তারপর প্রতিটা সারির জন্য আরও ১টা — এটাই N+1। কোডে ভুল দেখা যায় না, অথচ ডেটা বাড়লেই পাতা ধীর।'
    keywords: ['n+1', 'n plus one', 'lazy loading', 'doctrine', 'ধীর পাতা', 'অনেক query']
    blocks:
      - type: metaphor
        icon: cart
        title: 'ফর্দ হাতে ৫১ বার বাজারে'
        body: |
          প্রথমবার বাজারে গিয়ে তুমি ৫০টা জিনিসের ফর্দটা নিয়ে এলে। তারপর প্রতিটা জিনিসের জন্য আলাদা করে একবার বাজারে গেলে — মোট ৫১ বার যাওয়া-আসা। কিনতে সময় লাগে না, সময় যায় রাস্তায়। ডেটাবেসের কাছে প্রতিটা query সেই একবার বাজারে যাওয়া।
      - type: text
        body: |
          রহিমের অর্ডার তালিকার কোডে একটাই query চোখে পড়ে। কিন্তু loop-এর ভেতরে `getCustomer()->getName()` প্রতিবার চুপচাপ আরেকটা query চালায়।
      - type: code
        lang: php
        file: 'src/Controller/OrderController.php'
        variant: bad
        code: |
          #[Route('/orders', methods: ['GET'])]
          public function list(OrderRepository $orders): JsonResponse
          {
              // ১টা query: সর্বশেষ ৫০টা অর্ডার
              $latest = $orders->findBy([], ['createdAt' => 'DESC'], 50);

              $rows = [];
              foreach ($latest as $order) {
                  $rows[] = [
                      'id' => $order->getId(),
                      'customer' => $order->getCustomer()->getName(),
                      'total' => $order->getTotalAmount(),
                  ];
              }

              return $this->json($rows);
          }
        marks:
          - {line: 5, tip: 'এটা ফর্দ আনার যাত্রা: `SELECT … FROM orders ORDER BY created_at DESC LIMIT 50`।'}
          - {line: 11, tip: 'প্রতি চক্করে একবার `SELECT … FROM customers WHERE id = ?`। ৫০ জন আলাদা ক্রেতা হলে ৫০টা বাড়তি query।'}
      - type: visual
        kind: bars
        caption: 'একই কোড — পাতায় অর্ডার বাড়লে query কয়টা চলে'
        items:
          - {label: '১০টা অর্ডার', value: 11, display: '১১টা query', tip: 'লোকাল মেশিনে এমনই থাকে, তাই কারো চোখে পড়ে না।'}
          - {label: '৫০টা অর্ডার', value: 51, display: '৫১টা query', tone: warn, tip: '১টা অর্ডারের তালিকার জন্য, ৫০টা ক্রেতাদের জন্য।'}
          - {label: '৫০০টা অর্ডার', value: 501, display: '৫০১টা query', tone: bad, tip: 'প্রতিটা query-তে ১ms যাওয়া-আসা ধরলেও আধা সেকেন্ড শুধু রাস্তায়।'}
          - {label: 'ঠিকভাবে লিখলে', value: 1, display: '১টা query', tone: good, tip: 'অর্ডার যতই হোক, query একটাই থাকে — পরের স্লাইডগুলোয় দেখবে কীভাবে।'}
    aside:
      - type: story
        title: 'ডেমোতে দ্রুত, প্রোডাকশনে ধীর'
        body: |
          লোকাল মেশিনে ডেটাবেস একই কম্পিউটারে, সারি ১০টা — পাতা খোলে চোখের পলকে। প্রোডাকশনে ডেটাবেস আলাদা সার্ভারে, পাতায় ৫০০টা সারি। কোড এক লাইনও বদলায়নি, শুধু যাওয়া-আসার সংখ্যা ৫০ গুণ হয়েছে।
      - type: terms
        items:
          - {term: 'N+1', meaning: '১টা query তালিকার জন্য, আর তালিকার N টা সারির প্রতিটার জন্য আরও ১টা।'}
          - {term: 'Round trip', meaning: 'অ্যাপ থেকে ডেটাবেসে একবার যাওয়া আর উত্তর নিয়ে ফেরা।'}
    check:
      q: '৫০টা অর্ডারের পাতায় ৫১টা query কোথা থেকে আসে?'
      a: '১টা query ৫০টা অর্ডার আনে। তারপর loop-এ প্রতিটা অর্ডারের ক্রেতা আনতে আলাদা ১টা করে — ৫০টা। মোট ৫০ + ১।'

  - slug: lazy-loading-proxy
    title: 'Doctrine চুপচাপ query চালায় কেন'
    kind: concept
    tldr: 'Doctrine সম্পর্কিত entity-র জায়গায় ফাঁকা proxy বসায়; প্রথমবার ছুঁলেই query চলে। এক request-এ query কয়টা — সেটা গুনলেই N+1 ধরা পড়ে।'
    keywords: ['proxy', 'lazy loading', 'profiler', 'query count', 'N+1 ধরা', 'হাইড্রেশন']
    blocks:
      - type: text
        body: |
          Doctrine অর্ডার আনার সময় ক্রেতাকে আনে না; তার জায়গায় বসায় একটা **proxy** — শুধু id জানা একটা ফাঁকা খোলস। তুমি `getName()` ডাকলেই proxy তখন ডেটাবেসে ছোটে। এর নাম **lazy loading**: যতক্ষণ না লাগে, ততক্ষণ আনে না। একটা entity-তে এটা সুবিধা; loop-এর ভেতরে এটাই ৫১ বার বাজারে যাওয়া।
      - type: visual
        kind: sequence
        caption: '৫০টা অর্ডারের পাতায় অ্যাপ আর ডেটাবেসের কথাবার্তা'
        actors:
          - {id: app, label: 'Symfony অ্যাপ', icon: server, tip: 'controller-এর loop এখানে চলে; প্রতিটা proxy ছোঁয়ায় একটা query বেরোয়।'}
          - {id: db, label: 'ডেটাবেস', icon: db, tip: 'প্রতিটা query আলাদাভাবে দ্রুতই উত্তর দেয় — সমস্যা সংখ্যায়।'}
        messages:
          - {from: app, to: db, label: 'সর্বশেষ ৫০টা অর্ডার দাও'}
          - {from: db, to: app, label: '৫০টা অর্ডার (ক্রেতা = proxy)', dashed: true, tip: 'অর্ডারের সারিতে শুধু customer_id আছে, তাই ক্রেতার জায়গায় খোলস বসে।'}
          - {from: app, to: db, label: 'ক্রেতা #৭ দাও', tip: 'loop-এর প্রথম চক্কর: `getName()` ডাকতেই proxy query চালাল।'}
          - {from: db, to: app, label: 'ক্রেতা #৭', dashed: true}
          - {from: app, to: db, label: 'ক্রেতা #১২ দাও'}
          - {from: db, to: app, label: 'ক্রেতা #১২', dashed: true}
          - {at: app, note: '… এভাবে আরও ৪৮ বার', tone: bad, tip: 'মোট ৫০টা প্রায় একই চেহারার query — শুধু id আলাদা।'}
      - type: points
        title: 'N+1 ধরার তিন উপায়'
        style: check
        items:
          - 'Symfony Profiler-এর Doctrine প্যানেল: এক পাতায় query কয়টা, আর একই চেহারার query কতবার।'
          - 'log-এ একই `SELECT … WHERE id = ?` সারি সারি দেখলে সেটাই N+1-এর সই।'
          - 'টেস্টে query-র সংখ্যা বেঁধে দাও, যাতে পরে কেউ ভুলটা ফিরিয়ে না আনে।'
      - type: code
        lang: php
        file: 'tests/Controller/OrderControllerTest.php'
        variant: good
        code: |
          public function testOrderListHasNoNPlusOne(): void
          {
              $client = static::createClient();
              $client->enableProfiler();

              $client->request('GET', '/orders');   // fixture-এ ৫০টা অর্ডার

              $this->assertResponseIsSuccessful();
              $queries = $client->getProfile()->getCollector('db')->getQueryCount();
              $this->assertLessThanOrEqual(3, $queries);
          }
        marks:
          - {line: 4, tip: 'test পরিবেশে profiler ডিফল্টে তথ্য জমায় না; এই লাইন শুধু পরের request-এর জন্য চালু করে।'}
          - {line: 10, tip: 'সারি ৫০ হোক বা ৫০০০ — query ৩টার বেশি হলে টেস্ট লাল। N+1 ফিরে এলে সাথে সাথে ধরা পড়বে।'}
      - type: quote
        body: 'query-র সংখ্যা কখনো সারির সংখ্যার সাথে বাড়বে না।'
    aside:
      - type: tips
        items:
          - 'পাতার নিচের debug toolbar-এ ডেটাবেস আইকনের পাশের সংখ্যাটাই query-র সংখ্যা। তালিকার পাতায় সেটা বড় দেখলেই সন্দেহ করো।'
          - 'প্রোডাকশনে APM টুলে "এক request-এ কয়টা query" মাপো; N+1 সেখানেই ধরা পড়ে।'
      - type: terms
        items:
          - {term: 'Proxy', meaning: 'আসল entity-র জায়গায় বসানো খোলস; শুধু id জানে, বাকিটা প্রথম ব্যবহারে আনে।'}
          - {term: 'Lazy loading', meaning: 'সম্পর্কিত ডেটা আগে না এনে, প্রথমবার চাইলে তখন আনা।'}
          - {term: 'Hydration', meaning: 'ডেটাবেসের সারি থেকে PHP object বানানোর কাজ।'}
      - type: refs
        items:
          - {to: 'hands-on/prototyping-profiling', label: 'Profiler দিয়ে মেপে দেখা'}
    check:
      q: 'N+1-এর প্রতিটা query আলাদাভাবে দ্রুত। তাহলে slow query log-এ এটা ধরা পড়ে না কেন, আর কী দেখে ধরবে?'
      a: 'কোনো একটা query ধীর নয় — ধীর হলো তাদের সংখ্যা। তাই দেখতে হবে এক request-এ মোট কয়টা query চলল: Profiler-এ, বা টেস্টের query count-এ।'

  - slug: fetch-join-and-dto
    title: 'এক query-তে আনা: fetch join ও DTO'
    kind: howto
    tldr: 'to-one সম্পর্ক fetch join দিয়ে একই query-তে আনো; শুধু পড়ার তালিকায় পুরো entity নয়, দরকারি কলাম দিয়ে DTO বানাও।'
    keywords: ['fetch join', 'addSelect', 'DTO', 'NEW operator', 'দরকারি কলাম', 'query builder']
    blocks:
      - type: text
        body: |
          ফর্দের সব জিনিস এক যাত্রায় আনার উপায় **fetch join**: JOIN করো, আর `addSelect()` দিয়ে বলো যুক্ত entity-টাও এখনই বানিয়ে দিতে। শুধু `join()` লিখলে কিছুই বদলায় না — ক্রেতা তখনো proxy। আর পাতায় যদি শুধু তিন-চারটা কলাম লাগে, entity-ই বানিও না; DQL-এর `NEW` দিয়ে সরাসরি ছোট একটা **DTO** (শুধু ডেটা বহনকারী object) বানাও।
      - type: code
        lang: php
        file: 'src/Repository/OrderRepository.php'
        variant: good
        code: |
          /** @return list<Order> ক্রেতা সহ — ১টা query */
          public function findLatestWithCustomer(int $limit = 50): array
          {
              return $this->createQueryBuilder('o')
                  ->addSelect('c')
                  ->join('o.customer', 'c')
                  ->orderBy('o.createdAt', 'DESC')
                  ->setMaxResults($limit)
                  ->getQuery()
                  ->getResult();
          }

          /** @return list<OrderRow> শুধু পড়ার তালিকা: দরকারি কলাম, entity নয় */
          public function findLatestRows(int $limit = 50): array
          {
              return $this->getEntityManager()->createQuery(<<<'DQL'
                  SELECT NEW App\Dto\OrderRow(o.id, c.name, o.totalAmount, o.createdAt)
                  FROM App\Entity\Order o JOIN o.customer c
                  ORDER BY o.createdAt DESC
                  DQL)
                  ->setMaxResults($limit)
                  ->getResult();
          }
        marks:
          - {line: 5, tip: 'এই লাইনই fetch join বানায়: ক্রেতার কলামও SELECT-এ আসে, আর Doctrine proxy-র বদলে আসল Customer বসায়।'}
          - {line: 6, tip: 'একা এই লাইন শুধু filter বা sort-এর জন্য JOIN করে; ক্রেতার ডেটা আনে না।'}
          - {line: 17, tip: 'চারটা কলাম সরাসরি `OrderRow`-এর constructor-এ যায়। কোনো entity তৈরি হয় না, তাই hydration হালকা।'}
      - type: code
        lang: php
        file: 'src/Dto/OrderRow.php'
        code: |
          final readonly class OrderRow
          {
              public function __construct(
                  public int $id,
                  public string $customerName,
                  public int $totalAmount,
                  public \DateTimeImmutable $createdAt,
              ) {
              }
          }
      - type: visual
        kind: compare
        caption: 'কখন পুরো entity, কখন DTO'
        columns:
          - title: 'Entity + fetch join'
            icon: pencil
            tip: 'object-টা বদলে আবার save করতে হলে entity লাগবেই — Doctrine তখন বদলগুলো নজরে রাখে।'
            items:
              - 'যখন বদলে `flush()` করবে'
              - 'টেবিলের সব কলাম আসে'
              - 'প্রতিটা object-এ Doctrine নজর রাখে, তাই মেমোরি বেশি'
          - title: 'DTO (NEW)'
            tone: good
            icon: list
            tip: 'তালিকা, রিপোর্ট আর API response-এর জন্য — যেখানে শুধু দেখানো হবে।'
            items:
              - 'যখন শুধু দেখাবে'
              - 'শুধু দরকারি কলাম আসে'
              - 'হালকা ও দ্রুত; কিন্তু বদলে save করা যায় না'
    aside:
      - type: pitfalls
        items:
          - '`join()` একা = শুধু JOIN; N+1 থেকেই যায়। `addSelect()` সহ হলে তবেই fetch join।'
          - 'entity-র mapping-এ `fetch: EAGER` বসিয়ে সমাধান কোরো না — তখন যেখানে দরকার নেই সেখানেও সবসময় আনবে।'
      - type: when
        use:
          - 'to-one সম্পর্ক (order → customer): fetch join প্রায় সবসময় নিরাপদ'
          - 'শুধু দেখানোর তালিকা, রিপোর্ট, API response: DTO'
        avoid:
          - 'একসাথে একাধিক to-many collection fetch join — সারি গুণ হয়ে ফুলে যায়'
      - type: refs
        items:
          - {to: batch-loading, label: 'Collection-এর জন্য batch loading'}
    check:
      q: '`join()` লিখেও N+1 গেল না। কোন method বাদ পড়েছে, আর সেটা ঠিক কী করে?'
      a: '`addSelect()`। এটা ছাড়া JOIN শুধু filter-এর কাজ করে; ক্রেতার কলাম SELECT-এ আসে না, তাই Doctrine ক্রেতাকে proxy-ই রাখে।'

  - slug: batch-loading
    title: 'Collection-এর জন্য batch loading'
    kind: howto
    tldr: 'to-many collection JOIN করলে সারি গুণ হয়ে ফোলে; বদলে দ্বিতীয় একটা query-তে `IN (…)` দিয়ে সব collection একবারে আনো — মোট ২টা query।'
    keywords: ['batch loading', 'collection', 'to-many', 'IN query', 'cartesian product', 'সারি গুণ']
    blocks:
      - type: text
        body: |
          এবার প্রতিটা অর্ডারের item-ও দেখাতে হবে। item একটা **collection** (to-many): JOIN করলে ৫০টা অর্ডার × গড়ে ৪টা item = ২০০টা সারি আসে, প্রতিটায় অর্ডার আর ক্রেতার কলাম আবার আবার। ভালো উপায় **batch loading**: আগে অর্ডারগুলো আনো, তারপর তাদের সব item এক query-তে `IN (…)` দিয়ে। ফর্দের ভাষায়: দুই দোকানে দুইবার যাওয়া — ৫১ বার নয়।
      - type: code
        lang: php
        file: 'src/Repository/OrderRepository.php'
        variant: good
        code: |
          /** @return list<Order> ক্রেতা ও item সহ — মোট ২টা query */
          public function findLatestWithItems(int $limit = 50): array
          {
              // query ১: অর্ডার + ক্রেতা (to-one, তাই LIMIT নিরাপদ)
              $orders = $this->createQueryBuilder('o')
                  ->addSelect('c')
                  ->join('o.customer', 'c')
                  ->orderBy('o.createdAt', 'DESC')
                  ->setMaxResults($limit)
                  ->getQuery()
                  ->getResult();

              // query ২: এই অর্ডারগুলোর সব item ও product একবারে
              $ids = array_map(static fn (Order $o): int => $o->getId(), $orders);
              $this->createQueryBuilder('o')
                  ->addSelect('i', 'p')
                  ->leftJoin('o.items', 'i')
                  ->leftJoin('i.product', 'p')
                  ->where('o.id IN (:ids)')
                  ->setParameter('ids', $ids)
                  ->getQuery()
                  ->getResult();

              return $orders;
          }
        marks:
          - {line: 9, tip: 'এই query-তে কোনো collection JOIN নেই, তাই এক অর্ডার = এক সারি, আর LIMIT ঠিক ৫০টা অর্ডারই দেয়।'}
          - {line: 19, tip: 'অর্ডার ৫০টা হোক বা ৫০০টা — item আনার query একটাই; শুধু IN-এর তালিকা লম্বা হয়।'}
          - {line: 24, tip: 'ফল আলাদা করে ধরার দরকার নেই। Doctrine একই id-র অর্ডার দ্বিতীয়বার বানায় না; আগের object-গুলোরই `items` ভরে দেয়।'}
      - type: visual
        kind: compare
        caption: '৫০টা অর্ডার, প্রতিটায় ৪টা item — তিন উপায়ে আনা'
        columns:
          - title: 'Lazy loading'
            tone: bad
            icon: cross
            tip: 'কোড সবচেয়ে ছোট, কিন্তু প্রতিটা অর্ডারের ক্রেতা আর item-এর জন্য আলাদা যাত্রা।'
            items:
              - '১ + ৫০ + ৫০ = ১০১টা query'
              - 'অর্ডার বাড়লে query বাড়ে'
          - title: 'সব এক JOIN-এ'
            tone: warn
            icon: warning
            tip: 'query একটা, কিন্তু অর্ডারের কলাম ৪ বার করে আসে; আরেকটা collection জুড়লে সারি গুণ হয়।'
            items:
              - '১টা query, ২০০টা সারি'
              - 'অর্ডারের কলাম বারবার আসে'
              - 'LIMIT আর ঠিকমতো কাজ করে না'
          - title: 'Batch loading'
            tone: good
            icon: check
            tip: 'প্রথম query ৫০টা সারি আনে, দ্বিতীয়টা ২০০টা item — কোনো কলাম দুইবার আসে না।'
            items:
              - '২টা query, সবসময়'
              - '৫০ + ২০০ সারি, পুনরাবৃত্তি নেই'
              - 'LIMIT ঠিক থাকে'
    aside:
      - type: remember
        body: 'to-one → fetch join। to-many → আলাদা query, IN দিয়ে।'
      - type: tips
        items:
          - 'শুধু item-এর সংখ্যা লাগলে collection এনো না — `COUNT(i.id)` আর `GROUP BY` দিয়ে একই query-তে গুনে আনো।'
          - 'Doctrine নিজেও এভাবে আনতে পারে: query-তে `setFetchMode()` দিয়ে collection-টা `FETCH_EAGER` করলে সে `IN (…)` দিয়ে ব্যাচে আনে।'
      - type: terms
        items:
          - {term: 'Cartesian product', meaning: 'দুই collection একসাথে JOIN করলে সারি গুণ হয়: ৪টা item × ৩টা payment = অর্ডার প্রতি ১২ সারি।'}
          - {term: 'Identity map', meaning: 'এক request-এ একই id-র entity Doctrine একবারই বানায়; পরের query সেই object-ই ফেরত দেয়।'}
    check:
      q: '৫০টা অর্ডার আর তাদের item আনতে batch loading-এ কয়টা query লাগে? অর্ডার ৫০০টা হলে?'
      a: 'দুই ক্ষেত্রেই ২টা: একটা অর্ডারের জন্য, একটা সব item-এর জন্য (`IN (…)`)। সারি বাড়লেও query বাড়ে না — এটাই লক্ষ্য।'

  - slug: pagination-with-joins
    title: 'JOIN-এর সাথে LIMIT: পাতায় অর্ডার কম কেন?'
    kind: pitfall
    tldr: 'collection fetch join-এর সাথে `setMaxResults(20)` দিলে LIMIT পড়ে SQL-এর সারিতে, অর্ডারে নয় — ২০টার বদলে ৫টা অর্ডার আসে।'
    keywords: ['pagination', 'setMaxResults', 'Paginator', 'LIMIT', 'fetch join', 'পাতা ভাগ']
    blocks:
      - type: text
        body: |
          `LIMIT 20` ডেটাবেসকে বলে "২০টা **সারি** দাও", "২০টা অর্ডার" নয়। item JOIN করার পর এক অর্ডার ৪টা সারি হয়ে যায়, তাই ২০ সারিতে আসে মাত্র ৫টা অর্ডার — শেষ অর্ডারটার item-ও মাঝপথে কাটা পড়তে পারে। কোনো error হয় না; পাতাটা শুধু চুপচাপ ভুল দেখায়।
      - type: code
        lang: php
        file: 'src/Repository/OrderRepository.php'
        variant: bad
        code: |
          // ২০টা অর্ডার চাই — কিন্তু আসবে ২০টা SQL সারি
          $orders = $this->createQueryBuilder('o')
              ->addSelect('i')
              ->leftJoin('o.items', 'i')
              ->orderBy('o.createdAt', 'DESC')
              ->setMaxResults(20)
              ->getQuery()
              ->getResult();
        marks:
          - {line: 4, tip: 'collection JOIN: এখান থেকে এক অর্ডার = যতগুলো item, ততগুলো সারি।'}
          - {line: 6, tip: 'LIMIT গোনে JOIN-এর পরের সারি। প্রতি অর্ডারে ৪টা item হলে ২০ সারি = ৫টা অর্ডার।'}
      - type: visual
        kind: bars
        caption: 'প্রতি অর্ডারে ৪টা item থাকলে এক পাতায় কয়টা অর্ডার আসে'
        items:
          - {label: 'তুমি চেয়েছ', value: 20, display: '২০টা অর্ডার', tip: '`setMaxResults(20)` লিখে তুমি ভেবেছ ২০টা অর্ডার আসবে।'}
          - {label: 'JOIN + LIMIT দিল', value: 5, display: '৫টা অর্ডার', tone: bad, tip: '২০টা সারি ÷ প্রতি অর্ডারে ৪টা সারি = ৫টা অর্ডার। বাকি ১৫টা পাতা থেকে হারিয়ে গেল।'}
          - {label: 'Paginator দিল', value: 20, display: '২০টা অর্ডার', tone: good, tip: 'আগে ২০টা অর্ডারের id বেছে নেয়, তারপর সেগুলোর সব item আনে।'}
      - type: code
        lang: php
        file: 'src/Repository/OrderRepository.php'
        variant: good
        code: |
          $query = $this->createQueryBuilder('o')
              ->addSelect('i')
              ->leftJoin('o.items', 'i')
              ->orderBy('o.createdAt', 'DESC')
              ->addOrderBy('o.id', 'DESC')
              ->setFirstResult($offset)
              ->setMaxResults(20)
              ->getQuery();

          $page = new Paginator($query, fetchJoinCollection: true);
          $total = count($page);                // আলাদা একটা COUNT query
          $orders = iterator_to_array($page);   // ঠিক ২০টা অর্ডার, item সহ
        marks:
          - {line: 5, tip: 'একই সময়ে দুইটা অর্ডার হলে ক্রম যেন না নড়ে — id দিয়ে tie ভাঙা হচ্ছে।'}
          - {line: 10, tip: '`Doctrine\ORM\Tools\Pagination\Paginator`: প্রথমে LIMIT দিয়ে শুধু অর্ডারের id আনে, তারপর `WHERE id IN (…)` দিয়ে পুরো ডেটা।'}
      - type: quote
        body: 'আগে মূল entity-কে পাতায় ভাগ করো, তারপর তার collection আনো।'
    aside:
      - type: remember
        body: 'LIMIT গোনে সারি, তুমি গোনো অর্ডার।'
      - type: pitfalls
        items:
          - 'দুইটা collection একসাথে fetch join (items + payments) করলে সারি গুণ হয় — পাতায় ভাগ না করলেও মেমোরি ফুলে যায়।'
          - 'অনেক পেছনের পাতায় `OFFSET` নিজেই ধীর; বড় তালিকায় keyset pagination নাও।'
      - type: refs
        items:
          - {to: 'api/pagination', label: 'Pagination: offset বনাম cursor'}
          - {to: batch-loading, label: 'আগে পাতা, পরে batch loading'}
    check:
      q: 'প্রতি অর্ডারে গড়ে ৪টা item। items fetch join করে `setMaxResults(20)` দিলে কয়টা অর্ডার পাবে, কেন?'
      a: 'প্রায় ৫টা। LIMIT ২০টা SQL সারি দেয়, আর JOIN-এর পরে প্রতিটা অর্ডার ৪টা সারি দখল করে।'

flashcards:
  - q: 'N+1 query সমস্যা কী?'
    a: 'তালিকা আনতে ১টা query, তারপর তালিকার N টা সারির প্রতিটার জন্য আরও ১টা করে — মোট N+1টা query।'
    more: |
      যেমন ৫০টা অর্ডারের পাতায় প্রতিটা অর্ডারের ক্রেতার নাম আলাদা query-তে আনলে মোট ৫১টা query চলে। প্রতিটা query দ্রুত, কিন্তু প্রতিবার ডেটাবেসে যাওয়া-আসার খরচ আছে। সারি বাড়লে query-ও বাড়ে, তাই পাতা ধীরে ধীরে ধীর হয়।
    ref: fifty-one-queries
  - q: 'Doctrine-এ lazy loading মানে কী?'
    a: 'সম্পর্কিত entity-র জায়গায় proxy বসানো; প্রথমবার তার ডেটা চাইলে তখন আলাদা query চলে।'
    more: |
      অর্ডার আনলে Doctrine ক্রেতাকে সাথে আনে না — শুধু id জানা একটা খোলস (proxy) বসায়। `getName()` ডাকলে proxy তখন `SELECT` চালায়। একটা entity-র বেলায় এটা সাশ্রয়ী, কিন্তু loop-এর ভেতরে প্রতি চক্করে একটা query হয়ে N+1 তৈরি করে।
    ref: lazy-loading-proxy
  - q: 'N+1 সমস্যা slow query log-এ ধরা পড়ে না কেন?'
    a: 'কারণ প্রতিটা query আলাদাভাবে দ্রুত; ধীর হলো এক request-এ তাদের মোট সংখ্যা।'
    more: |
      slow query log শুধু সেই query লেখে যেটা একাই অনেক সময় নেয়। N+1-এর প্রতিটা query হয়তো ১ms-এ শেষ, কিন্তু ৫০০টা মিলে আধা সেকেন্ড। তাই মাপতে হবে "এক request-এ কয়টা query" — Symfony Profiler, APM বা টেস্টের query count দিয়ে।
    ref: lazy-loading-proxy
  - q: 'টেস্ট দিয়ে N+1 ফিরে আসা ঠেকাবে কীভাবে?'
    a: 'functional test-এ profiler চালু করে `db` collector-এর `getQueryCount()` একটা সীমার নিচে আছে কি না assert করো।'
    more: |
      `$client->enableProfiler()` ডেকে request পাঠাও, তারপর `$client->getProfile()->getCollector('db')->getQueryCount()` থেকে সংখ্যাটা নাও। fixture-এ যথেষ্ট সারি রাখো (যেমন ৫০টা), নইলে N+1 থাকলেও সংখ্যা ছোট দেখাবে। সীমা পেরোলে টেস্ট ফেল করবে।
    ref: lazy-loading-proxy
  - q: 'Doctrine QueryBuilder-এ fetch join বানাতে কোন দুইটা জিনিস লাগে?'
    a: '`join()` (বা `leftJoin()`) এবং `addSelect()`। দ্বিতীয়টা ছাড়া যুক্ত entity proxy-ই থেকে যায়।'
    more: |
      `join()` শুধু SQL-এ JOIN যোগ করে, যা filter বা sort-এ কাজে লাগে। `addSelect('c')` বললে তবেই যুক্ত entity-র কলাম SELECT-এ আসে আর Doctrine সেটাকে একই query থেকে বানিয়ে দেয়। অনেকে শুধু `join()` লিখে ভাবে N+1 মিটে গেছে — মেটে না।
    ref: fetch-join-and-dto
  - q: 'তালিকার পাতায় পুরো entity-র বদলে DTO আনার লাভ কী?'
    a: 'শুধু দরকারি কলাম আসে, object বানানো হালকা হয়, আর Doctrine-কে এতগুলো entity-র বদল নজরে রাখতে হয় না।'
    more: |
      DQL-এ `SELECT NEW App\Dto\OrderRow(o.id, c.name, …)` লিখলে ফল সরাসরি ছোট readonly object-এ আসে। যে পাতায় শুধু দেখানো হবে — তালিকা, রিপোর্ট, API response — সেখানে এটাই মানানসই। বদলে save করতে হলে অবশ্য entity-ই লাগবে।
    ref: fetch-join-and-dto
  - q: 'to-many collection আনতে fetch join-এর বদলে batch loading কেন ভালো?'
    a: 'JOIN-এ সারি গুণ হয় আর parent-এর কলাম বারবার আসে; batch loading দ্বিতীয় একটা `IN (…)` query-তে সব collection আনে।'
    more: |
      ৫০টা অর্ডারে ৪টা করে item থাকলে JOIN দেয় ২০০টা সারি, প্রতিটায় অর্ডারের সব কলাম। দুইটা collection একসাথে JOIN করলে সারি গুণ হয় (cartesian product)। batch loading-এ প্রথম query অর্ডার আনে, দ্বিতীয়টা সব item — সবসময় ২টা query, কোনো পুনরাবৃত্তি নেই।
    ref: batch-loading
  - q: 'collection fetch join-এর সাথে `setMaxResults(20)` দিলে কী ভুল হয়?'
    a: 'LIMIT পড়ে SQL সারিতে, entity-তে নয়; তাই ২০টার চেয়ে কম entity আসে, আর শেষটার collection অসম্পূর্ণ থাকতে পারে।'
    more: |
      JOIN-এর পরে এক অর্ডার অনেক সারি হয়ে যায়। প্রতি অর্ডারে ৪টা item হলে `LIMIT 20` মানে মাত্র ৫টা অর্ডার। Doctrine কোনো error দেয় না, তাই ভুলটা চোখ এড়িয়ে যায়। সমাধান: আগে মূল entity-কে পাতায় ভাগ করা, পরে collection আনা।
    ref: pagination-with-joins
  - q: 'Doctrine Paginator collection join-সহ পাতা কীভাবে ঠিক রাখে?'
    a: 'আগে LIMIT দিয়ে শুধু মূল entity-র id বেছে নেয়, তারপর `WHERE id IN (…)` দিয়ে সেগুলো collection সহ আনে।'
    more: |
      `new Paginator($query, fetchJoinCollection: true)` লিখলে Doctrine তোমার একটা query-কে ভেঙে নেয়: id বাছাইয়ের query, তারপর পুরো ডেটার query; `count()` ডাকলে আরেকটা COUNT query। query দুই-তিনটা হয়, কিন্তু পাতায় ঠিক যতগুলো চেয়েছ ততগুলো entity আসে।
    ref: pagination-with-joins

quiz:
  - q: 'controller ১০০টা অর্ডার `findBy()` দিয়ে এনে এই template-এ পাঠায়। কোনো fetch join নেই, আর প্রতিটা অর্ডারের ক্রেতা আলাদা। সর্বোচ্চ কয়টা query চলবে?'
    lang: twig
    code: |
      {% for order in orders %}
        <tr>
          <td>{{ order.id }}</td>
          <td>{{ order.customer.name }}</td>
          <td>{{ order.items|length }}</td>
        </tr>
      {% endfor %}
    hint: 'loop-এর ভেতরে কয়টা আলাদা সম্পর্ক ছোঁয়া হচ্ছে, গুনে দেখো।'
    options:
      - text: '১টা'
        correct: false
        why: '১টা query শুধু অর্ডারগুলো আনে। ক্রেতা আর item তখনো আসেনি — template ছুঁলেই আলাদা query চলবে।'
      - text: '১০১টা'
        correct: false
        why: 'এতে শুধু ক্রেতাদের ১০০টা query ধরা হয়েছে। `order.items|length`-ও প্রতিটা অর্ডারে আরেকটা query চালায়।'
      - text: '২০১টা'
        correct: true
        why: '১টা অর্ডারের জন্য, ১০০টা ক্রেতার জন্য, আর ১০০টা items collection-এর জন্য — মোট ২০১।'
      - text: '১০,০০০টা'
        correct: false
        why: 'query গুণ হয় না, যোগ হয়: প্রতিটা অর্ডারে ক্রেতার জন্য ১টা আর item-এর জন্য ১টা।'
    ref: fifty-one-queries
  - q: 'রিনা N+1 সারাতে repository-তে `->join()` দিয়ে customer JOIN করল। Profiler-এ query এখনো ৫১টা। সবচেয়ে সম্ভাব্য কারণ কী?'
    hint: 'JOIN করা আর JOIN করা entity-টা বানিয়ে দেওয়া — দুটো আলাদা কাজ।'
    options:
      - text: '`addSelect()` দেওয়া হয়নি, তাই ক্রেতার কলাম আসেনি আর ক্রেতা proxy-ই আছে'
        correct: true
        why: '`join()` একা শুধু SQL JOIN যোগ করে। `addSelect()` সহ হলে তবেই Doctrine যুক্ত entity-টা একই query থেকে বানায়।'
      - text: '`join()`-এর বদলে `leftJoin()` লেখা দরকার ছিল'
        correct: false
        why: 'inner না left — এতে কোন সারি আসবে তা বদলায়, কিন্তু ক্রেতা hydrate হবে কি না তা বদলায় না।'
      - text: 'customers টেবিলে index নেই'
        correct: false
        why: 'index থাকলে প্রতিটা query দ্রুত হয়, কিন্তু query-র সংখ্যা ৫১-ই থাকে।'
      - text: 'cache clear করা হয়নি'
        correct: false
        why: 'এটা কোডের query-র আকারের সমস্যা; cache-এর সাথে সম্পর্ক নেই।'
    ref: fetch-join-and-dto
  - q: 'নিচের কোনগুলো N+1 ধরার কার্যকর উপায়?'
    hint: 'N+1-এ কোনো একটা query ধীর নয় — তাহলে কোন মাপটা কাজে লাগবে?'
    options:
      - text: 'Symfony Profiler-এর Doctrine প্যানেলে এক পাতার query-র সংখ্যা দেখা'
        correct: true
        why: 'তালিকার পাতায় query-র সংখ্যা সারির সংখ্যার কাছাকাছি হলে সেটাই N+1।'
      - text: 'functional test-এ query count-এর ওপর assert বসানো'
        correct: true
        why: 'এতে ভুলটা একবার সারানোর পর কেউ ফিরিয়ে আনলে CI-তেই ধরা পড়ে।'
      - text: '১ সেকেন্ডের বেশি লাগা query-র slow log দেখা'
        correct: false
        why: 'N+1-এর প্রতিটা query মিলিসেকেন্ডে শেষ হয়, তাই slow log-এ একটাও ওঠে না।'
      - text: 'log-এ একই `SELECT … WHERE id = ?` বারবার চলছে কি না দেখা'
        correct: true
        why: 'একই চেহারার query সারি সারি, শুধু id আলাদা — N+1-এর সবচেয়ে চেনা চিহ্ন।'
    ref: lazy-loading-proxy
  - q: '৫০টা অর্ডার; প্রতিটায় ৪টা item আর ৩টা payment। এক query-তে items আর payments — দুইটা collection-ই fetch join করলে ডেটাবেস কয়টা সারি ফেরত দেবে?'
    hint: 'দুই collection একসাথে JOIN করলে এক অর্ডারের সারি যোগ হয়, না গুণ?'
    options:
      - text: '৫০টা'
        correct: false
        why: 'collection JOIN করলে এক অর্ডার আর এক সারিতে থাকে না।'
      - text: '৩৫০টা'
        correct: false
        why: 'এটা ৫০ × (৪ + ৩)। কিন্তু দুই collection-এর সারি যোগ হয় না — প্রতিটা item প্রতিটা payment-এর সাথে জোড়া বাঁধে।'
      - text: '৬০০টা'
        correct: true
        why: '৫০ × ৪ × ৩ = ৬০০। এটাই cartesian product — আর এ কারণেই collection আলাদা query-তে আনা ভালো।'
      - text: '২০০টা'
        correct: false
        why: '২০০ হতো শুধু items JOIN করলে। payments যোগ হওয়ায় প্রতিটা সারি আরও ৩ গুণ হয়েছে।'
    ref: batch-loading
  - q: 'প্রতিটা অর্ডারে ৫টা item আছে। এই query কী ফেরত দেবে?'
    lang: php
    code: |
      $orders = $this->createQueryBuilder('o')
          ->addSelect('i')
          ->leftJoin('o.items', 'i')
          ->orderBy('o.id', 'DESC')
          ->setMaxResults(10)
          ->getQuery()
          ->getResult();
    hint: 'LIMIT কী গোনে — অর্ডার, নাকি JOIN-এর পরের সারি?'
    options:
      - text: '১০টা অর্ডার, প্রতিটায় ৫টা item'
        correct: false
        why: 'এটাই তুমি চেয়েছিলে, কিন্তু LIMIT ১০টা সারি দেয় — আর ১০টা অর্ডারের জন্য লাগত ৫০টা সারি।'
      - text: '২টা অর্ডার'
        correct: true
        why: 'LIMIT ১০টা SQL সারি দেয়; প্রতি অর্ডার ৫টা সারি দখল করে, তাই ১০ ÷ ৫ = ২টা অর্ডার।'
      - text: '১০টা অর্ডার, প্রতিটায় ১টা item'
        correct: false
        why: 'সারিগুলো অর্ডার ধরে সাজানো, তাই প্রথম ১০ সারি প্রথম ২টা অর্ডারের সব item — ১০টা আলাদা অর্ডারের নয়।'
      - text: 'Doctrine exception ছুড়ে থামিয়ে দেবে'
        correct: false
        why: 'Doctrine কোনো error দেয় না — ভুল ফলটাই চুপচাপ ফেরত দেয়, এজন্যই ফাঁদটা বিপজ্জনক।'
    ref: pagination-with-joins
  - q: 'অ্যাডমিনের রিপোর্ট পাতায় ৫০০০ সারি শুধু দেখানো হবে: অর্ডারের id, ক্রেতার নাম আর মোট টাকা। কিছুই বদলানো হবে না। কোনটা সবচেয়ে মানানসই?'
    hint: 'যা বদলাবে না, তার জন্য পুরো entity বানানোর দরকার আছে কি?'
    options:
      - text: 'DQL-এর `NEW` দিয়ে তিনটা কলামের DTO আনা'
        correct: true
        why: 'এক query, শুধু দরকারি কলাম, কোনো entity নয় — ৫০০০ সারিতে মেমোরি আর সময় দুটোই বাঁচে।'
      - text: 'সব Order entity এনে `fetch: EAGER` দিয়ে ক্রেতাকে সাথে আনা'
        correct: false
        why: '৫০০০টা পূর্ণ entity আর তাদের ক্রেতা hydrate হবে, অথচ লাগবে তিনটা কলাম। তাছাড়া EAGER সব জায়গায় প্রভাব ফেলে।'
      - text: 'lazy loading রেখে পাতার ওপরে cache বসানো'
        correct: false
        why: 'cache মিস হলেই আবার ৫০০১টা query; মূল সমস্যা ঢাকা পড়ে, মেটে না।'
      - text: 'প্রতিটা সারির ক্রেতার নাম আলাদা API call-এ আনা'
        correct: false
        why: 'এটা N+1-কে ডেটাবেস থেকে নেটওয়ার্কে তুলে আনা — আরও ধীর।'
    ref: fetch-join-and-dto
  - q: 'অর্ডার আর তার item (to-many) সহ ২০টা করে পাতায় ভাগ করা তালিকা বানাতে হবে। কোন কোন পদ্ধতিতে প্রতি পাতায় ঠিক ২০টা অর্ডার আসবে?'
    hint: 'কোন পদ্ধতিগুলোয় LIMIT পড়ছে অর্ডারের ওপর, আর কোনটায় JOIN-এর পরের সারির ওপর?'
    options:
      - text: '`new Paginator($query, fetchJoinCollection: true)` ব্যবহার করা'
        correct: true
        why: 'Paginator আগে ২০টা অর্ডারের id বেছে নেয়, তারপর `IN (…)` দিয়ে item সহ আনে।'
      - text: 'আগে ২০টা অর্ডার (শুধু to-one join সহ) এনে, পরে `IN (…)` দিয়ে তাদের item আনা'
        correct: true
        why: 'প্রথম query-তে এক অর্ডার = এক সারি, তাই LIMIT ঠিক ২০টা অর্ডার দেয়; দ্বিতীয় query collection ভরে।'
      - text: 'items fetch join করে সরাসরি `setMaxResults(20)` দেওয়া'
        correct: false
        why: 'LIMIT তখন JOIN-এর পরের সারিতে পড়ে; ২০টার চেয়ে অনেক কম অর্ডার আসে।'
      - text: 'সব অর্ডার এনে PHP-তে `array_slice()` দিয়ে ২০টা কাটা'
        correct: false
        why: 'সংখ্যাটা মিলবে, কিন্তু প্রতি request-এ পুরো টেবিল মেমোরিতে উঠবে — ডেটা বাড়লে সার্ভার বসে যাবে।'
    ref: pagination-with-joins
