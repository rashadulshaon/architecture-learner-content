slides:
  - slug: one-noisy-client
    title: 'One person''s loop slows the site for everyone'
    kind: story
    tldr: 'When one client (a buggy loop, a scraper, a malicious bot) fires thousands of requests, everyone else''s answers slow down. With no limit, one mistake can take the whole API down.'
    keywords: ['rate limit', 'noisy neighbor', 'abuse', 'DoS', 'request flood', 'throttling']
    blocks:
      - type: text
        body: |
          A script at one of Rahim's partner companies accidentally got a `while(true)` loop, and it started calling Rahim's API 30 times a second. Each call held a database connection for about a second, and the pool had only a few dozen, so within minutes none were left and ordinary users' pages wouldn't open even after 30 seconds. Nobody attacked anything: one person's mistake hurt everybody. The fix is a per-client cap, shown in the last bar.
      - type: visual
        kind: bars
        caption: 'Requests per minute by client (example)'
        items:
          - {label: 'User A', value: 12, display: '12', tone: good, tip: 'An ordinary user, making a handful of requests a minute.'}
          - {label: 'User B', value: 15, display: '15', tone: good, tip: 'Another ordinary user. Both are far below any limit.'}
          - {label: 'User C', value: 8, display: '8', tone: good, tip: 'Even fewer. All of these are just going about their work.'}
          - {label: 'Partner''s loop', value: 1800, display: '1800', tone: bad, tip: 'Because of the buggy loop, this one client alone is about 50 times the three users'' combined load (35 a minute).'}
          - {label: 'Same loop, 100/min limit', value: 100, display: '100', tone: good, tip: 'The same loop with a per-client limit: 100 requests get through each minute and the rest are refused with a 429. The three users above never notice.'}
      - type: quote
        body: 'An API without limits leaves its door open to everyone, so one person''s mistake or bad faith hurts all.'
    aside:
      - type: problem
        body: 'One client must not be able to eat all of the server''s capacity by itself. A limit exists to stop that one client so the others stay fine.'
      - type: terms
        items:
          - {term: 'Rate limit', meaning: 'The cap on how many requests one client may make in a given period of time.'}
          - {term: 'Quota', meaning: 'The total allowance of use over a day or a month. For example 100,000 requests a month.'}
    check:
      q: 'Why do you need a rate limit even when nobody is attacking you?'
      a: 'A buggy loop can fire huge numbers of requests too. You need a limit so that one person''s mistake doesn''t slow the service for everyone else.'

  - slug: bucket-and-windows
    title: 'The phuchka vendor''s ready plates: token bucket'
    kind: concept
    tldr: 'Token bucket: tokens collect in a bucket over time, each request spends one, and when the bucket is empty you wait. Short bursts pass, sustained pressure is stopped.'
    keywords: ['token bucket', 'fixed window', 'sliding window', 'burst', 'leaky bucket', 'rate limiting algorithm']
    blocks:
      - type: metaphor
        icon: ticket
        title: 'The phuchka vendor''s ready plates'
        body: |
          The street-food vendor selling phuchka (crispy shells filled with spiced chickpeas and tamarind water) prepares 10 plates a minute, and the stand has room for at most 20 ready plates. A customer takes one plate. When a crowd suddenly turns up, the 20 saved plates go out at once (a burst), but after that only 10 a minute. If no plate is ready, it is "wait a little".
      - type: visual
        kind: table
        caption: 'Comparing three common methods'
        headers: ['Method', 'How it works', 'Upside', 'Weakness']
        rows:
          - cells: ['Fixed window', 'At most 100 per minute, reset to zero at the end of the minute', 'The simplest', 'Twice the limit gets through at the boundary']
            tip: 'If someone sends 100 at 0:59 and another 100 at 1:00, 200 requests get in within 2 seconds, and no rule has been broken.'
          - cells: ['Sliding window', 'At most 100 in any 60-second window', 'No gap at the boundary', 'Needs more memory']
            tip: 'The window moves with every moment, so there is no gap at the boundary as in a fixed window.'
          - cells: ['Token bucket', 'Tokens accumulate, each request spends one', 'Handles bursts, keeps the average rate in check', 'You have to choose two numbers']
            tip: 'The size of the bucket (how big a burst) and the refill rate (the average) are two separate numbers, and you have to think about both.'
      - type: quote
        body: 'The refill speed sets the average rate, and the size of the bucket sets the burst. Two separate numbers.'
    aside:
      - type: remember
        body: 'A small bucket means no bursts. A big bucket lets you save up and pour it all out at once.'
      - type: tips
        items:
          - 'For most public APIs token bucket is a good default: a user''s natural bursts are tolerated.'
          - 'Symfony''s RateLimiter offers all three: fixed_window, sliding_window and token_bucket.'
    check:
      q: 'Why can twice the limit slip through at a fixed window''s boundary?'
      a: 'Because the count resets to zero the moment the minute ends. 100 at the end of one minute and 100 at the start of the next means 200 within a few seconds.'

  - slug: symfony-rate-limiter
    title: 'Adding a limit with Symfony RateLimiter'
    kind: howto
    tldr: 'Give a policy, limit and rate under framework.rate_limiter; in a listener, call consume() with the client''s key; past the limit, throw TooManyRequestsHttpException.'
    keywords: ['RateLimiterFactory', 'rate_limiter', 'consume', 'TooManyRequestsHttpException', 'Retry-After', 'symfony/rate-limiter']
    blocks:
      - type: text
        body: |
          First run `composer require symfony/rate-limiter`. Then declare a named limiter in the config. There, `limit` is the size of the bucket, and `rate` says how many tokens refill in what time. Keep the state somewhere all your app servers share, such as Redis, otherwise every server counts on its own.
      - type: code
        lang: yaml
        file: 'config/packages/rate_limiter.yaml'
        variant: good
        code: |
          framework:
              cache:
                  pools:
                      rate_limiter_pool:
                          adapter: cache.adapter.redis
              rate_limiter:
                  api_per_client:
                      policy: 'token_bucket'
                      limit: 100
                      rate: { interval: '1 minute', amount: 100 }
                      cache_pool: 'rate_limiter_pool'
        marks:
          - {line: 5, tip: 'All app servers count in the same Redis. With a file cache, every server has its own count, and the limit effectively becomes 3 or 4 times higher.'}
          - {line: 9, tip: 'limit: the size of the bucket, meaning at most 100 requests at once.'}
          - {line: 10, tip: 'rate: 100 tokens flow back in every minute, so the average is 100 a minute.'}
      - type: code
        lang: php
        file: 'src/EventListener/ApiRateLimitListener.php'
        variant: good
        code: |
          #[AsEventListener]
          final readonly class ApiRateLimitListener
          {
              public function __construct(private RateLimiterFactory $apiPerClientLimiter)
              {
              }

              public function __invoke(RequestEvent $event): void
              {
                  $request = $event->getRequest();
                  if (!$event->isMainRequest() || !str_starts_with($request->getPathInfo(), '/api/')) {
                      return;
                  }

                  $key = $request->headers->get('X-Api-Key') ?? $request->getClientIp() ?? 'anonymous';
                  $limit = $this->apiPerClientLimiter->create($key)->consume();

                  if (!$limit->isAccepted()) {
                      $wait = max(1, $limit->getRetryAfter()->getTimestamp() - time());

                      throw new TooManyRequestsHttpException($wait, 'Too many requests');
                  }
              }
          }
        marks:
          - {line: 4, tip: 'The limiter is named api_per_client in the config, so the autowired argument is called $apiPerClientLimiter.'}
          - {line: 15, tip: 'The key decides who is counted separately. Use a key you have checked (a known API key or the user id), else the IP. A header nobody verified can be invented anew on every request.'}
          - {line: 16, tip: 'consume() tries to take one token. If the bucket is empty, isAccepted() is false.'}
          - {line: 21, tip: 'This exception produces a response with a 429 and a Retry-After header.'}
    aside:
      - type: commands
        items:
          - {cmd: 'composer require symfony/rate-limiter', desc: 'Install the component'}
          - {cmd: 'php bin/console debug:container --env-vars', desc: 'Check that the Redis env vars are right'}
      - type: pitfalls
        items:
          - 'An API key read from a header without checking it is not a safe key: a client can invent a new one on every request and get a fresh bucket each time. Look the key up first, or fall back to the IP.'
          - 'Behind a load balancer without trusted_proxies, getClientIp() gives the same IP for everyone, and the limit blocks everybody at once.'
      - type: refs
        items:
          - {to: 'api/request-path', label: 'trusted_proxies and the real client IP'}
    check:
      q: 'With several app servers, why should the RateLimiter''s state live somewhere shared, like Redis?'
      a: 'Otherwise every server counts on its own. With three servers the limit effectively triples, and a client can step over it easily.'

  - slug: backoff-with-jitter
    title: 'What a client does on a 429'
    kind: howto
    tldr: 'The server sends 429 and Retry-After. The client obeys that time, and if it is missing, retries with exponential backoff and jitter (a random delay).'
    keywords: ['429', 'Retry-After', 'exponential backoff', 'jitter', 'thundering herd', 'retry']
    blocks:
      - type: text
        body: |
          If a client gets a 429 and sends again immediately, it makes the problem worse. The right behaviour: if the server sends `Retry-After`, hold off for that long, and if not, double the wait each time. And if a thousand clients all retry at the same instant, the crowd comes back, so keep the wait random. That is called **jitter**.
      - type: visual
        kind: bars
        caption: 'The maximum wait doubles on every attempt (with jitter the real wait is random between 0 and this)'
        items:
          - {label: 'Attempt 1', value: 1, display: '1s', tone: good, tip: 'After the first failure, any random delay between 0 and 1 second.'}
          - {label: 'Attempt 2', value: 2, display: '2s', tone: default, tip: 'The second time, between 0 and 2 seconds.'}
          - {label: 'Attempt 3', value: 4, display: '4s', tone: default, tip: 'The ceiling doubles each time, so the pressure on the server eases off gradually.'}
          - {label: 'Attempt 5', value: 16, display: '16s', tone: warn, tip: 'It grows up to a cap (say 30 seconds); after that it is better to give up and tell the user.'}
      - type: code
        lang: ts
        file: 'src/api/backoff.ts'
        variant: good
        code: |
          // Use only for idempotent requests (GET, PUT, DELETE)
          export async function fetchWithBackoff(
            url: string,
            init: RequestInit = {},
            maxRetries = 4,
          ): Promise<Response> {
            for (let attempt = 0; ; attempt++) {
              const res = await fetch(url, init)
              const retryable = res.status === 429 || res.status === 503
              if (!retryable || attempt >= maxRetries) return res

              const retryAfter = Number(res.headers.get('Retry-After'))
              const cap = Math.min(30_000, 2 ** attempt * 1000)
              const waitMs = retryAfter > 0 ? retryAfter * 1000 : Math.random() * cap

              await new Promise((resolve) => setTimeout(resolve, waitMs))
            }
          }
        marks:
          - {line: 12, tip: 'When the server tells you how long, obeying it is the most polite and correct thing to do. When it is a number of seconds, this is how to read it.'}
          - {line: 13, tip: 'The wait grows 1, 2, 4, 8 seconds and is held at 30: exponential backoff.'}
          - {line: 14, tip: 'Math.random() gives a random wait between 0 and the cap: jitter. A thousand clients then don''t return at the same instant.'}
    aside:
      - type: story
        title: 'Everyone came back at once'
        body: |
          A service went down for a minute, and thousands of clients came back together at exactly 1 second, 2 seconds and 4 seconds, knocking the service flat again and again. Without jitter, everyone's clocks tick in step.
      - type: tips
        items:
          - 'Retry-After can also be an HTTP date, not just seconds. Handle both in production code.'
          - 'Tell the user while they wait: "Trying again in a moment".'
      - type: refs
        items:
          - {to: 'api/error-design', label: 'Which errors can be retried'}
    check:
      q: 'Why add jitter to backoff?'
      a: 'Without jitter, all the clients return at the same moment and make another crowd. Random delays spread them out, so the server can recover.'

  - slug: choose-the-key
    title: 'Limit whom: IP, user or key'
    kind: pitfall
    tldr: 'Limit by IP and the thousand users of one mobile carrier count as one person. Use the user id or API key where you can, and a strict separate limit where it matters, like login.'
    keywords: ['rate limit key', 'per IP', 'per user', 'API key', 'login throttling', 'quota', 'CGNAT']
    blocks:
      - type: text
        body: |
          On mobile data in Bangladesh, thousands of users often come out of the same public IP. If you limit by IP alone, one person's fault blocks all their requests. On the other hand, with the user id alone you can't catch an attacker who hasn't logged in. So choose the key to suit the job.
      - type: visual
        kind: table
        caption: 'Choosing the key for a limit'
        headers: ['Key', 'Good when', 'Risk']
        rows:
          - cells: ['IP', 'Before login, unknown users', 'Many people behind one IP']
            tip: 'With carrier NAT, offices or schools, many people share one IP, so the limit has to be generous.'
          - cells: ['User id', 'Logged-in users', 'Doesn''t work before login']
            tip: 'The fairest, because you count per person. But nobody has logged in yet at the login endpoint.'
          - cells: ['API key', 'Partners, outside clients', 'If the key leaks, others use it']
            tip: 'Each partner can get a separate limit and a separate quota. If one leaks, you only revoke that key.'
          - cells: ['Endpoint', 'Login, OTP, password reset', 'If it is the only one, the rest stays open']
            tip: 'A separate strict limit on login to stop password guessing: for example 5 tries in 15 minutes.'
      - type: code
        lang: yaml
        file: 'config/packages/rate_limiter.yaml'
        variant: good
        code: |
          framework:
              rate_limiter:
                  api_free:
                      policy: 'token_bucket'
                      limit: 30
                      rate: { interval: '1 minute', amount: 30 }
                  api_partner:
                      policy: 'token_bucket'
                      limit: 600
                      rate: { interval: '1 minute', amount: 600 }
                  login:
                      policy: 'sliding_window'
                      limit: 5
                      interval: '15 minutes'
        marks:
          - {line: 3, tip: 'A small limit for users who don''t pay.'}
          - {line: 7, tip: 'A large limit for partners, as agreed in the contract. Each plan gets its own limiter.'}
          - {line: 11, tip: 'A sliding window on login: no more than 5 in any 15-minute window. It stops brute force.'}
      - type: code
        lang: php
        file: 'src/EventListener/ApiRateLimitListener.php'
        variant: good
        code: |
          // logged in: count the person; anonymous: count the IP
          $key = $user !== null ? 'user-'.$user->getUserIdentifier() : 'ip-'.$request->getClientIp();
          $this->apiFreeLimiter->create($key)->consume()->ensureAccepted();

          // login: IP + email, so an attacker can't lock the victim out from the victim's own IP
          $loginKey = $request->getClientIp().'|'.mb_strtolower($email);
          $this->loginLimiter->create($loginKey)->consume()->ensureAccepted();
        marks:
          - {line: 2, tip: 'A prefix keeps user and IP counters apart. A person on mobile data is counted as themselves, not as the thousand people sharing their IP.'}
          - {line: 6, tip: 'The email alone would let an attacker burn a victim''s 5 tries. With the IP in the key, only the attacker''s own bucket fills up.'}
      - type: quote
        body: 'A rate limit is the rate per minute; a quota is the total allowance for the month. You need both, and they are different things.'
    aside:
      - type: pitfalls
        items:
          - 'A quota is a separate thing: an allowance of 100,000 requests a month is usually kept in a database or Redis counter, not in the rate limiter.'
          - 'Keep the error message safe: "too many attempts" is fine, "limit reached for this email" is not, because it reveals whether the email exists.'
      - type: tips
        items:
          - 'For login, turn on Symfony Security''s `login_throttling` and you get much of this ready-made.'
          - 'Price of a strict login limit: a real user who mistypes 5 times is locked out for 15 minutes. Show a clear message and a reset link.'
      - type: refs
        items:
          - {to: 'security/authn-authz', label: 'Login and stopping password guessing'}
    check:
      q: 'Why does limiting by IP alone cause trouble for mobile-data users, and why does login get its own limit?'
      a: 'One carrier IP can hold thousands of people, so one person''s fault blocks everyone. Login needs a separate strict limit to stop password guessing.'

flashcards:
  - q: 'What is the difference between a rate limit and a quota?'
    a: 'Rate limit: how many requests in a short time (per minute). Quota: the total use over a day or a month.'
    more: |
      A rate limit stops sudden floods and buggy loops. A quota sets the business allowance, such as 100,000 requests a month depending on the plan. Both can return a 429, but they are kept in different places.
    ref: one-noisy-client
  - q: 'Why do you need a rate limit if nobody is attacking you?'
    a: 'A buggy loop or bug can fire huge numbers of requests too. One person''s mistake must not slow the service for everyone.'
    more: |
      This is called the noisy neighbour problem: one neighbour's racket wears out the whole street. With no limit, the database runs out of connections and ordinary users' pages won't open.
    ref: one-noisy-client
  - q: 'How does a token bucket work?'
    a: 'Tokens collect in a bucket over time. Each request spends one. When the bucket is empty, you have to wait.'
    more: |
      There are two numbers: the size of the bucket (how big a burst) and the refill rate (the average). Short bursts are tolerated, but under sustained pressure the average rate rules. In Symfony RateLimiter, `limit` is the size and `rate` is the rate.
    ref: bucket-and-windows
  - q: 'What is the weakness of a fixed window?'
    a: 'Twice the limit can get in at the window boundary: 100 at the end of one minute and 100 at the start of the next.'
    more: |
      That is because the count resets to zero when the window ends. A sliding window counts over any running 60 seconds, so there is no such gap. But it needs more memory.
    ref: bucket-and-windows
  - q: 'What status and header does an API send when the limit is exceeded?'
    a: '`429 Too Many Requests` and a `Retry-After` header saying how many seconds to wait before trying again.'
    more: |
      In Symfony, throwing `TooManyRequestsHttpException($retryAfterSeconds)` produces both. The client reads Retry-After and returns at the right time. If it is missing, the client backs off by itself.
    ref: symfony-rate-limiter
  - q: 'Why must a rate-limit key be something a client can''t invent for free?'
    a: 'If the key is an unchecked header, a client sends a new random value on every request and gets a fresh bucket each time. Use a verified key, the user id or the IP.'
    more: |
      Each distinct key gets its own bucket, so a limit only holds if a client can't mint keys at will. Look the API key up in your database first; if it isn't known, fall back to the IP. The same thinking applies to any value the client controls.
    ref: symfony-rate-limiter
  - q: 'Why use exponential backoff and jitter together?'
    a: 'Backoff doubles the wait each time. Jitter makes it random, so a thousand clients don''t return at the same instant.'
    more: |
      Without jitter every client comes back in step after 1, 2, 4 seconds, and the server goes down again. Random waits spread them over time. Retry only idempotent requests.
    ref: backoff-with-jitter
  - q: 'What goes wrong if you rate limit by IP alone?'
    a: 'Many people share one IP (mobile carriers, offices), so one person''s fault blocks everyone. Behind a load balancer, everyone''s IP can look the same.'
    more: |
      Use the user id for logged-in users, and the API key for outside clients. Keep the IP for unknown traffic before login. With a load balancer, unless `trusted_proxies` is right, you won't get the real IP.
    ref: choose-the-key

quiz:
  - q: 'A partner''s script is calling the API 30 times a second, and every other user is suffering slowness. What is the most correct remedy?'
    hint: 'The problem is one party''s load, not the others''.'
    options:
      - text: 'Give each client (each API key) its own rate limit, so that if one does too much, only that one is blocked'
        correct: true
        why: 'When the limit is per key, the damage stays with that one client, and the others carry on as normal.'
      - text: 'Add more servers'
        correct: false
        why: 'The loop can fire even more requests. Without a limit, however many servers you add, one person''s mistake will eat them all.'
      - text: 'One general limit for the whole API: 1000 a minute in total'
        correct: false
        why: 'Then the loop uses up all 1000, and ordinary users get no share of it. The limit has to be per separate key.'
      - text: 'Email the partner to fix the script, and do nothing else'
        correct: false
        why: 'Emailing is good, but if you don''t protect your own system, the same thing will happen next time.'
    ref: one-noisy-client
  - q: 'What do `limit` and `rate` separately set in the config below?'
    lang: yaml
    code: |
      api_per_client:
          policy: 'token_bucket'
          limit: 100
          rate: { interval: '1 minute', amount: 20 }
    hint: 'One is the size of the bucket, the other is the refill speed.'
    options:
      - text: 'The bucket holds at most 100 tokens (burst), and refills 20 a minute (the average rate)'
        correct: true
        why: 'limit is the burst ceiling, rate is the refill speed. Two separate numbers.'
      - text: '100 requests a minute and 20 a second'
        correct: false
        why: 'The interval of rate is a minute, not a second. And limit doesn''t mention any time.'
      - text: 'They are the same thing, written two ways'
        correct: false
        why: 'One is a size and the other a speed. If they weren''t separate, you couldn''t set the burst and the average independently.'
      - text: '100 requests in total a day, and 20 a minute'
        correct: false
        why: 'There is no mention of a day here. Counting over days or months is a quota, not the rate limiter.'
    ref: symfony-rate-limiter
  - q: 'The listener below keys the limit on the raw X-Api-Key header. How can a scripted client get around the limit?'
    lang: php
    code: |
      $key = $request->headers->get('X-Api-Key') ?? $request->getClientIp();
      $limit = $this->apiPerClientLimiter->create($key)->consume();
    hint: 'What does each new key value get?'
    options:
      - text: 'Send a different made-up X-Api-Key on every request, so each one lands in a fresh, full bucket'
        correct: true
        why: 'The header is never checked, and every distinct key has its own bucket. Verify the key before using it.'
      - text: 'Send the requests more slowly than the refill rate'
        correct: false
        why: 'That is just obeying the limit, not getting around it.'
      - text: 'Use a very long header value so the limiter overflows'
        correct: false
        why: 'The key length does not change how the bucket is counted.'
      - text: 'It can''t, because the limit also applies to the IP'
        correct: false
        why: 'The IP is used only when the header is missing, so sending any header value skips it.'
    ref: symfony-rate-limiter
  - q: 'A client gets a 429 and sees `Retry-After: 3`. What should it do?'
    hint: 'Has the server said anything itself?'
    options:
      - text: 'Send again immediately, maybe it will work this time'
        correct: false
        why: 'The limit is still exceeded. Sending again just gets another 429 and more load on the server.'
      - text: 'Wait about 3 seconds (with a little jitter) and send again'
        correct: true
        why: 'The server told you the time itself. Jitter keeps many clients from returning at once.'
      - text: 'Show the user "failed" and stop, no retry'
        correct: false
        why: 'The limit is temporary and it will work in a moment. Showing the user a failure for no reason isn''t right (for idempotent work).'
      - text: 'Create a new API key to get around the limit'
        correct: false
        why: 'That is dodging the limit, and it breaks the terms of service.'
    ref: backoff-with-jitter
  - q: 'For which of these reasons is it better to avoid an IP-based rate limit, or to pair it with another key?'
    hint: 'How many people can there be behind one IP?'
    options:
      - text: 'A mobile carrier sends thousands of users out through the same public IP'
        correct: true
        why: 'One person''s fault blocks the requests of thousands.'
      - text: 'Behind a load balancer without trusted_proxies set right, everyone''s IP looks the same'
        correct: true
        why: 'getClientIp() returns the load balancer''s IP, so everyone is counted as one person.'
      - text: 'Because an IP is short'
        correct: false
        why: 'That has nothing to do with setting a limit.'
      - text: 'For logged-in users, the user id is fairer'
        correct: true
        why: 'When you count per person, one person''s behaviour doesn''t affect another.'
    ref: choose-the-key
  - q: 'To stop password guessing, which measure for the `/login` endpoint makes the most sense?'
    hint: 'How should the limit compare with an ordinary API''s?'
    options:
      - text: 'The same limit as the ordinary API (100 a minute), to keep it simple'
        correct: false
        why: '100 password guesses a minute is far too many chances. Login needs a strict limit.'
      - text: 'A separate strict limiter, such as 5 tries in 15 minutes (sliding window), by IP and email'
        correct: true
        why: 'Brute force slows to a crawl, while an ordinary user''s normal mistakes are tolerated.'
      - text: 'No limit, just demand strong passwords'
        correct: false
        why: 'Strong passwords are good, but without a limit an attacker can fire millions of guesses.'
      - text: 'Sleep for 5 seconds on every request'
        correct: false
        why: 'It slows everybody down, and an attacker can get around it by firing many requests at once.'
    ref: choose-the-key
