  - q: 'Why is caching harder in GraphQL than in REST?'
    hint: 'What does an HTTP cache build its cache key from?'
    options:
      - text: 'GraphQL usually talks through POST to a single URL, so HTTP caching by URL doesn''t work'
        correct: true
        why: 'In REST every resource has its own URL and a GET, so browsers and CDNs cache it easily.'
      - text: 'GraphQL responses are always encrypted'
        correct: false
        why: 'Encryption has nothing to do with it; the reason is the URL and the method.'
      - text: 'Database queries are slower in GraphQL'
        correct: false
        why: 'Database speed doesn''t depend on the style. Caching is harder because of the shape of the request.'
      - text: 'Caching GraphQL is forbidden'
