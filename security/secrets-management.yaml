slides:
  - slug: key-on-the-wall
    title: 'সিন্দুকের চাবি দেয়ালে ঝুলছে'
    kind: story
    tldr: 'Secret একবার git-এ গেলে সেটা চিরকালের জন্য ফাঁস — repository private হলেও, ফাইল পরে মুছে দিলেও।'
    keywords: ['secrets', 'git leak', '.env', 'API key', 'গোপন তথ্য', 'secret ফাঁস']
    blocks:
      - type: metaphor
        icon: key
        title: 'সিন্দুক আর চাবির গল্প'
        body: |
          বাড়িতে দামি সিন্দুক আছে, কিন্তু চাবিটা সবার চোখের সামনে দেয়ালে ঝোলানো। যে কেউ বাড়িতে ঢুকলেই চাবি পায়। `.env`-এ লেখা live key git-এ তুললেও ঠিক তা-ই হয়: repository যে দেখতে পায়, সে-ই চাবির মালিক হয়ে যায়।
      - type: code
        lang: env
        file: '.env  (git-এ commit করা)'
        variant: bad
        code: |
          APP_ENV=prod
          DATABASE_URL="mysql://root:Sh0p@2024@db.shop.example:3306/shop"
          STRIPE_SECRET_KEY=sk_live_51H••••••••••••••••••••
          BKASH_APP_SECRET=7f3a9c1e8b2d4f60a5c7e1b9d3f2a8c4
        marks:
          - {line: 2, tip: 'root ইউজার, আর পাসওয়ার্ড সরাসরি লেখা। এই লাইনটা যে পাবে সে পুরো ডেটাবেসের মালিক।'}
          - {line: 3, tip: 'sk_live মানে আসল টাকা কাটার চাবি। test key হলে এত ভয় ছিল না।'}
      - type: quote
        body: 'Secret কখনো git-এ যায় না — একবার গেলে ধরে নাও সেটা ফাঁস হয়ে গেছে।'
    aside:
      - type: story
        title: 'দশ মিনিটে ক্লাউড বিল'
        body: 'একজন ডেভেলপার ভুলে cloud access key public repository-তে তুলেছিল। bot-রা এই ধরনের key খুঁজতেই GitHub স্ক্যান করে। কয়েক মিনিটের মধ্যে কেউ ওই key দিয়ে দামি সার্ভার চালিয়ে ক্রিপ্টো মাইনিং শুরু করল, মাস শেষে বিল এল লাখ টাকার।'
      - type: problem
        body: 'Code সবাই পড়তে পারে, কিন্তু চাবি পড়তে পারা উচিত শুধু সার্ভারের। Secret আর কোড আলাদা না করলে একজন ডেভেলপারের laptop চুরি মানেই পুরো প্রোডাকশন দখল।'
      - type: terms
        items:
          - {term: 'Secret', meaning: 'পাসওয়ার্ড, API key, token, private key — যা জানলে কেউ তোমার হয়ে কাজ করতে পারে।'}
    check:
      q: 'Repository private, আর পরের commit-এ .env মুছে দিয়েছি — তাহলে secret কি নিরাপদ?'
      a: 'না। git-এর history-তে পুরনো commit থেকে যায়, আর clone করা প্রতিটা কপিতে সেটা আছে। ধরে নাও ফাঁস হয়েছে, আর secret বদলে ফেলো।'

  - slug: symfony-vault
    title: 'Symfony secrets vault: তালা দেওয়া খাতা'
    kind: concept
    tldr: 'Secret এনক্রিপ্ট করে git-এ রাখা যায়; খোলার চাবি (private key) থাকে শুধু প্রোডাকশন সার্ভারে, কোডের সাথে নয়।'
    keywords: ['secrets vault', 'secrets:set', 'decrypt private key', 'Symfony secrets', 'এনক্রিপ্ট', 'env']
    blocks:
      - type: metaphor
        icon: lock
        title: 'বাড়ির সিন্দুক আর আলাদা চাবি'
        body: |
          Vault হলো তালা দেওয়া খাতা: ভেতরের লেখা সবার সামনে পড়ে থাকলেও কেউ পড়তে পারে না। যে কেউ খাতায় নতুন লাইন লিখে তালা দিতে পারে (public key)। কিন্তু খুলতে পারে শুধু সার্ভারের হাতে থাকা আলাদা চাবি (private key)।
      - type: visual
        kind: flow
        caption: 'এনক্রিপ্ট করা secret git-এ যায়, আর খোলার চাবি যায় আলাদা পথে'
        nodes:
          - {id: dev, label: 'ডেভেলপার', sub: 'secrets:set', icon: user, col: 0, row: 1, tip: 'শুধু public key দিয়ে নতুন secret এনক্রিপ্ট করতে পারে। প্রোডাকশনের মান পড়ার ক্ষমতা তার নেই।'}
          - {id: git, label: 'Git repository', sub: 'এনক্রিপ্টেড ফাইল', icon: archive, col: 1.5, row: 1, tip: 'config/secrets/prod/-এর ভেতরের ফাইলগুলো এনক্রিপ্ট করা। দেখলেও কিছু বোঝা যায় না, তাই commit করা নিরাপদ।'}
          - {id: key, label: 'Private key', sub: 'শুধু সার্ভারে', icon: key, tone: accent, col: 1.5, row: 0, tip: 'prod.decrypt.private.php ফাইল বা SYMFONY_DECRYPTION_SECRET। এটা কখনো git-এ যায় না।'}
          - {id: app, label: 'প্রোডাকশন অ্যাপ', sub: 'Symfony', icon: server, col: 3, row: 1, tip: 'চালু হওয়ার সময় private key দিয়ে secret খুলে মেমোরিতে নেয়।'}
        edges:
          - {from: dev, to: git, label: 'ডেভেলপার secret এনক্রিপ্ট করে git-এ রাখে'}
          - {from: git, to: app, label: 'Deploy-এর সময় এনক্রিপ্টেড ফাইল সার্ভারে পৌঁছায়'}
          - {from: key, to: app, label: 'Private key আলাদা পথে শুধু সার্ভারে বসানো হয়', tone: good}
      - type: quote
        body: 'এনক্রিপ্টেড secret আর তার খোলার চাবি — দুটো কখনো একই জায়গায় নয়।'
    aside:
      - type: commands
        title: 'Vault-এর কমান্ড'
        items:
          - {cmd: 'php bin/console secrets:generate-keys --env=prod', desc: 'prod-এর key জোড়া বানায়'}
          - {cmd: 'php bin/console secrets:set STRIPE_SECRET_KEY --env=prod', desc: 'নতুন secret এনক্রিপ্ট করে রাখে'}
          - {cmd: 'php bin/console secrets:list --env=prod', desc: 'নামগুলো দেখায়, মান নয় (--reveal দিলে মান)'}
          - {cmd: 'php bin/console secrets:decrypt-to-local --force --env=prod', desc: 'সার্ভারে secret খুলে local ফাইলে রাখে'}
      - type: terms
        items:
          - {term: 'Vault', meaning: 'এনক্রিপ্ট করা secret-এর ফাইল, যা git-এ রাখা নিরাপদ।'}
          - {term: 'Decryption key', meaning: 'খোলার private key। এটা হারালে secret আর খোলা যায় না, চুরি গেলে সব খুলে যায়।'}
    check:
      q: 'Vault-এর কোন ফাইলটা git-এ রাখা যাবে না, আর কেন?'
      a: 'private key (prod.decrypt.private.php)। এটা থাকলে git-এর এনক্রিপ্টেড secret যে কেউ খুলে পড়তে পারবে।'

  - slug: using-secrets
    title: 'Secret ব্যবহারের নিয়ম: env থেকে, কোড থেকে নয়'
    kind: howto
    tldr: 'secrets:set দিয়ে রাখো, #[Autowire(env: ...)] দিয়ে সার্ভিসে নাও; dev-এর জন্য .env.local, আর সবসময় test key।'
    keywords: ['Autowire env', '.env.local', 'secrets:set', 'parameter', 'DATABASE_URL', 'Symfony configuration']
    blocks:
      - type: text
        body: |
          প্রথমে vault-এ secret রাখো, তারপর service-এর constructor-এ `#[Autowire(env: ...)]` দিয়ে নাও। Vault-এর secret অ্যাপে environment variable-এর মতোই দেখা যায়। আর `.env` ফাইলে শুধু ফাঁকা বা নকল ডিফল্ট থাকবে, আসল মান থাকবে না। নিজের laptop-এ চালানোর জন্য git-ignored `.env.local`-এ শুধু test key রাখো, যেমন `sk_test_...`।
      - type: code
        lang: bash
        file: 'terminal'
        variant: good
        code: |
          # একবার key জোড়া বানাও; encrypt.public.php git-এ যাবে
          php bin/console secrets:generate-keys --env=prod

          # secret এনক্রিপ্ট করে রাখো (মান টার্মিনালে জিজ্ঞেস করবে)
          php bin/console secrets:set STRIPE_SECRET_KEY --env=prod

          # .gitignore-এ private key বাদ দাও
          echo '/config/secrets/prod/prod.decrypt.private.php' >> .gitignore
        marks:
          - {line: 5, tip: 'মান command-line-এ লিখো না, নইলে shell history-তে থেকে যায়। প্রশ্ন করলে তখন বসাও।'}
          - {line: 8, tip: 'private key ঠিক এই ফাইলে থাকে। এটা ভুলে commit হয়ে গেলে vault-এর সব নিরাপত্তা শেষ।'}
      - type: code
        lang: php
        file: 'src/Payment/StripeGateway.php'
        variant: good
        code: |
          final class StripeGateway
          {
              public function __construct(
                  #[Autowire(env: 'STRIPE_SECRET_KEY')]
                  private readonly string $secretKey,
                  private readonly HttpClientInterface $client,
              ) {
              }

              public function charge(Order $order): array
              {
                  return $this->client->request('POST', 'https://api.stripe.com/v1/charges', [
                      'auth_bearer' => $this->secretKey,
                      'body' => ['amount' => $order->getTotalMinor(), 'currency' => 'bdt'],
                  ])->toArray();
              }
          }
        marks:
          - {line: 4, tip: 'মান কোডে নেই, আছে environment-এ। কোড যে-ই পড়ুক, key পাবে না।'}
          - {line: 13, tip: 'Bearer token হিসেবে header-এ যায়। URL-এ বসিও না, URL অনেক জায়গায় log হয়।'}
    aside:
      - type: tips
        items:
          - '.env হলো ডিফল্টের ফাইল, commit হয়। আসল মান থাকে vault-এ, নয়তো .env.local-এ।'
          - 'প্রোডাকশনে deploy-এর সময় SYMFONY_DECRYPTION_SECRET environment variable দিয়ে private key দেওয়া যায়, ফাইল রাখতে হয় না।'
          - 'প্রতিটা environment-এর (dev, staging, prod) আলাদা secret রাখো, যেন staging ফাঁস হলে prod নিরাপদ থাকে।'
      - type: refs
        items:
          - {to: 'config/configuration', label: 'কনফিগারেশন ও environment'}
    check:
      q: 'ডেভেলপারদের নিজের laptop-এ কোন ধরনের key থাকা উচিত, আর কোথায়?'
      a: 'শুধু test বা dev key, git-ignored .env.local-এ। live key কখনো laptop-এ নয়; সেটা থাকে শুধু প্রোডাকশনের vault-এ।'

  - slug: rotate-and-scope
    title: 'Secret ফাঁস হলে: মোছা নয়, বদলানো'
    kind: pitfall
    tldr: 'ফাঁস হলে আগে নতুন secret চালু করে পুরনোটা বাতিল করো; আর প্রতিটা key-কে ঠিক যতটুকু দরকার, ততটুকুই ক্ষমতা দাও।'
    keywords: ['secret rotation', 'least privilege', 'scoped credentials', 'key revoke', 'অধিকার সীমিত', 'রোটেশন']
    blocks:
      - type: text
        body: |
          তালার চাবি হারালে দরজা না বদলে চাবি খুঁজে লাভ নেই। Secret ফাঁস হলেও তা-ই: commit মুছলে নয়, secret **rotate** (নতুন বানিয়ে পুরনোটা বাতিল) করলেই ঝুঁকি যায়। আর সেটা করতে হবে downtime ছাড়া, তাই আগে নতুনটা চালু হয়, তারপর পুরনোটা বন্ধ হয়।
      - type: visual
        kind: steps
        caption: 'Downtime ছাড়া rotation: নতুন আগে, পুরনো শেষে'
        steps:
          - {title: '১. নতুন বানাও', body: 'নতুন key বা DB ইউজার তৈরি করো; পুরনোটা এখনো চালু', tip: 'এই সময় দুটো key-ই বৈধ, তাই কোনো request আটকায় না।'}
          - {title: '২. vault-এ বসাও', body: 'secrets:set দিয়ে নতুন মান রাখো', tip: 'মান বদলালে অ্যাপ restart বা deploy দরকার হয়।'}
          - {title: '৩. Deploy করো', body: 'সব সার্ভার নতুন key নিয়ে চালু হয়', tip: 'rolling deploy-এ কিছু সার্ভার পুরনো key চালায়, তাই পুরনোটা তখনো বৈধ থাকা জরুরি।'}
          - {title: '৪. পুরনো বাতিল', body: 'সব ঠিক চললে পুরনো key revoke করো', tip: 'বাতিলের পর ফাঁস হওয়া key আর কোনো কাজেই লাগে না। এই ধাপ ছাড়া rotation অসম্পূর্ণ।'}
      - type: points
        title: 'Least privilege: key-র ক্ষমতা ছোট রাখো'
        style: check
        items:
          - 'প্রতিটা সার্ভিসের নিজের আলাদা key বা DB ইউজার, যাতে একটা ফাঁসলে সব না যায়।'
          - 'শুধু যা দরকার: অ্যাপের DB ইউজার সাধারণত SELECT/INSERT/UPDATE পায়, DROP বা root নয়।'
          - 'Stripe-এর মতো প্ল্যাটফর্মে restricted key বানাও, যা শুধু নির্দিষ্ট কাজ করতে পারে।'
          - 'মেয়াদ দাও: স্বল্পস্থায়ী token থাকলে ফাঁসের ক্ষতি সীমিত থাকে।'
      - type: quote
        body: 'ফাঁস হলে ধরে নাও সব ফাঁস — বদলাও, মুছে ক্ষান্ত হয়ো না।'
    aside:
      - type: pitfalls
        items:
          - 'Frontend-এ secret রাখা: Vue-র VITE_ দিয়ে শুরু হওয়া ভেরিয়েবল ব্রাউজারের bundle-এ চলে যায়, তাই সেখানে secret নয়।'
          - 'Docker image বা build log-এ secret ঢোকানো; image যে পায় সে-ই key পায়।'
          - 'একটাই "master" key সবখানে ব্যবহার করা।'
      - type: remember
        body: 'নতুন আগে, পুরনো পরে — আর কারো ক্ষমতা প্রয়োজনের বেশি নয়।'
      - type: refs
        items:
          - {to: 'resilience/zero-downtime-deploys', label: 'Zero-downtime deploy'}
    check:
      q: 'Rotation-এ পুরনো key আগে বাতিল করে নতুন key বসালে কী সমস্যা হয়?'
      a: 'মাঝখানের সময়টায় অ্যাপের কোনো key-ই কাজ করে না, ফলে downtime হয়। তাই আগে নতুনটা চালু করে সব সার্ভার বদলে, তারপর পুরনোটা বাতিল করতে হয়।'

flashcards:
  - q: 'Secret কী, আর তিনটা উদাহরণ দাও।'
    a: 'যে তথ্য জানলে কেউ তোমার হয়ে কাজ করতে পারে: পাসওয়ার্ড, API key, token, private key।'
    more: |
      Secret আর সাধারণ কনফিগারেশনের পার্থক্য হলো ফাঁসের ক্ষতি। `APP_ENV=prod` ফাঁস হলে কিছু যায় আসে না, কিন্তু `DATABASE_URL`-এর পাসওয়ার্ড ফাঁস হলে ডেটাবেস অন্যের হাতে। তাই দুটোকে আলাদা করে সামলাতে হয়।
    ref: key-on-the-wall
  - q: 'Private repository-তে secret commit করা কেন তবুও ভুল?'
    a: 'Repository-র সব সদস্য, CI আর প্রতিটা clone তা দেখতে পায়, আর history-তে সেটা চিরকাল থাকে।'
    more: |
      Private মানে শুধু বাইরের লোক দেখতে পায় না। ভেতরের প্রত্যেকের laptop-এ পুরো history থাকে। একটা ঘটনায় (কেউ repository public করলে, laptop চুরি হলে) সব ফাঁস। Secret আর কোড আলাদা রাখাই সঠিক অভ্যাস।
    ref: key-on-the-wall
  - q: 'Git-এ ভুলে secret তুলে ফেললে প্রথমে কী করবে?'
    a: 'Secret বাতিল করে নতুন বানাও (rotate)। commit মুছে দেওয়া যথেষ্ট নয়, কারণ ইতিমধ্যেই কপি হয়ে থাকতে পারে।'
    more: |
      ক্রম হলো: ১) নতুন secret চালু, ২) পুরনোটা revoke, ৩) log দেখে কেউ ব্যবহার করেছে কি না যাচাই। তারপর পরিষ্কার-পরিচ্ছন্নতার জন্য history থেকে মুছতে পারো, কিন্তু সেটা শুধু শৃঙ্খলার জন্য, নিরাপত্তার জন্য নয়।
    ref: rotate-and-scope
  - q: 'Symfony secrets vault কীভাবে কাজ করে?'
    a: 'Secret public key দিয়ে এনক্রিপ্ট হয়ে git-এ থাকে; শুধু প্রোডাকশনের private key দিয়ে খোলা যায়।'
    more: |
      `secrets:set` এনক্রিপ্ট করে `config/secrets/<env>/` ফোল্ডারে ফাইল বানায়, যা commit করা যায়। প্রোডাকশনে `prod.decrypt.private.php` ফাইল বা `SYMFONY_DECRYPTION_SECRET` দিয়ে অ্যাপ সেগুলো খোলে। private key git-এ গেলে vault-এর কোনো লাভ থাকে না।
    ref: symfony-vault
  - q: 'কোন key vault-এর জন্য git-এ যাবে না?'
    a: 'প্রোডাকশনের decrypt private key (prod.decrypt.private.php)।'
    more: |
      public key (`prod.encrypt.public.php`) আর এনক্রিপ্টেড ফাইল commit করা যায়। কিন্তু decrypt private key যে পাবে, সে সব secret পড়তে পারবে। তাই এটা `.gitignore`-এ থাকে আর প্রোডাকশন সার্ভারে আলাদা পথে পৌঁছায়।
    ref: symfony-vault
  - q: 'Service-এ env থেকে secret নেওয়ার Symfony উপায় কী?'
    a: 'Constructor parameter-এ `#[Autowire(env: ''STRIPE_SECRET_KEY'')]` বসানো।'
    more: |
      এতে secret-এর মান কোডে লিখতে হয় না, আর service কোথা থেকে পাচ্ছে সেটা এক লাইনেই দেখা যায়। `.env`-এ শুধু ডিফল্ট বা ফাঁকা মান থাকে; আসল মান আসে vault বা প্রোডাকশনের environment থেকে।
    ref: using-secrets
  - q: 'Secret rotation কী, আর downtime ছাড়া কীভাবে করবে?'
    a: 'নতুন secret বানিয়ে সব জায়গায় চালু করার পর পুরনোটা বাতিল করা। নতুন আগে, পুরনো শেষে।'
    more: |
      Deploy-এ সব সার্ভার একসাথে বদলায় না, তাই কিছুক্ষণ দুই key-ই বৈধ রাখতে হয়। DB পাসওয়ার্ডের ক্ষেত্রে নতুন ইউজার বানিয়ে অ্যাপ সেখানে সরাও, তারপর পুরনো ইউজার বন্ধ করো। নিয়মিত rotation করলে ফাঁস হলেও ক্ষতির মেয়াদ কমে।
    ref: rotate-and-scope
  - q: 'Least privilege বলতে কী বোঝায়?'
    a: 'প্রতিটা key বা ইউজারকে ঠিক ততটুকুই ক্ষমতা দেওয়া, যতটুকু তার কাজের জন্য লাগে।'
    more: |
      অ্যাপের DB ইউজার যদি root হয়, তবে SQL injection-এ পুরো ডেটাবেস মুছে যেতে পারে। শুধু দরকারি table-এ SELECT/INSERT/UPDATE দিলে একই bug-এর ক্ষতি অনেক কম হয়। প্রতিটা সার্ভিসের আলাদা key থাকলে একটা ফাঁসলে বাকিগুলো নিরাপদ থাকে।
    ref: rotate-and-scope

quiz:
  - q: 'নিচের .env commit করা হয়েছে। কোন কাজটা সবচেয়ে জরুরি?'
