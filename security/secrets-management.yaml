slides:
  - slug: key-on-the-wall
    title: 'The safe''s key is hanging on the wall'
    kind: story
    tldr: 'Once a secret reaches git, it is leaked for good, even if the repository is private and you delete the file later.'
    keywords: ['secrets', 'git leak', '.env', 'API key', 'credentials', 'secret leak']
    blocks:
      - type: metaphor
        icon: key
        title: 'The safe and its key'
        body: |
          Imagine a house with an expensive safe, but the key hangs on the wall where everyone can see it. Anyone who walks in gets the key. Pushing a live key from your `.env` to git has the same effect: whoever can see the repository now owns the key.
      - type: code
        lang: env
        file: '.env  (committed to git)'
        variant: bad
        code: |
          APP_ENV=prod
          DATABASE_URL="mysql://root:Sh0p-2024@db.shop.example:3306/shop"
          STRIPE_SECRET_KEY=sk_live_51H••••••••••••••••••••
          PAYPAL_CLIENT_SECRET=7f3a9c1e8b2d4f60a5c7e1b9d3f2a8c4
        marks:
          - {line: 2, tip: 'The root user, with the password written in plain text. Whoever finds this line owns the entire database.'}
          - {line: 3, tip: 'sk_live is a key that charges real money. A test key would have been far less scary.'}
      - type: quote
        body: 'A secret never goes into git. Once it does, assume it has leaked.'
    aside:
      - type: story
        title: 'A cloud bill in ten minutes'
        body: 'A developer accidentally pushed a cloud access key to a public repository. Bots scan GitHub looking for exactly this kind of key. Within minutes someone used it to spin up expensive servers for crypto mining, and the month ended with a bill of tens of thousands of dollars.'
      - type: problem
        body: 'Everyone can read the code, but only the server should be able to read the keys. If you don''t keep secrets apart from code, one stolen developer laptop means the whole production system is taken over.'
      - type: terms
        items:
          - {term: 'Secret', meaning: 'A password, API key, token or private key: anything that lets whoever knows it act as you.'}
    check:
      q: 'The repository is private, and I deleted .env in the next commit. Is the secret safe now?'
      a: 'No. The old commit stays in git history, and every clone has a copy. Assume it leaked and replace the secret.'

  - slug: symfony-vault
    title: 'Symfony secrets vault: the locked notebook'
    kind: concept
    tldr: 'You can keep encrypted secrets in git. The key that opens them (the private key) lives only on the production server, never with the code.'
    keywords: ['secrets vault', 'secrets:set', 'decrypt private key', 'Symfony secrets', 'encryption', 'env']
    blocks:
      - type: metaphor
        icon: lock
        title: 'The safe and its separate key'
        body: |
          A vault is a locked notebook: the pages lie in plain view, yet nobody can read them. Anyone can write a new line and lock it (that's the public key). But only the separate key held by the server (the private key) can open it.
      - type: visual
        kind: flow
        caption: 'The encrypted secret goes into git, and the key that opens it travels a separate way'
        nodes:
          - {id: dev, label: 'Developer', sub: 'secrets:set', icon: user, col: 0, row: 1, tip: 'Can encrypt a new secret with the public key only. Has no power to read the production values.'}
          - {id: git, label: 'Git repository', sub: 'encrypted files', icon: archive, col: 1.5, row: 1, tip: 'The files under config/secrets/prod/ are encrypted. Looking at them tells you nothing, so committing them is safe.'}
          - {id: key, label: 'Private key', sub: 'server only', icon: key, tone: accent, col: 1.5, row: 0, tip: 'The prod.decrypt.private.php file or SYMFONY_DECRYPTION_SECRET. It never goes into git.'}
          - {id: app, label: 'Production app', sub: 'Symfony', icon: server, col: 3, row: 1, tip: 'At startup it uses the private key to decrypt the secrets and loads them into memory.'}
        edges:
          - {from: dev, to: git, label: 'The developer encrypts the secret and commits it to git'}
          - {from: git, to: app, label: 'On deploy, the encrypted files reach the server'}
          - {from: key, to: app, label: 'The private key is placed on the server by a separate route', tone: good}
      - type: quote
        body: 'An encrypted secret and the key that opens it never live in the same place.'
    aside:
      - type: commands
        title: 'Vault commands'
        items:
          - {cmd: 'php bin/console secrets:generate-keys --env=prod', desc: 'creates the key pair for prod'}
          - {cmd: 'php bin/console secrets:set STRIPE_SECRET_KEY --env=prod', desc: 'encrypts and stores a new secret'}
          - {cmd: 'php bin/console secrets:list --env=prod', desc: 'shows the names, not the values (add --reveal for values)'}
          - {cmd: 'php bin/console secrets:decrypt-to-local --force --env=prod', desc: 'decrypts the secrets on the server into a local file'}
      - type: terms
        items:
          - {term: 'Vault', meaning: 'A set of encrypted secret files that are safe to keep in git.'}
          - {term: 'Decryption key', meaning: 'The private key that opens the vault. Lose it and the secrets can''t be decrypted any more; if it is stolen, everything opens.'}
    check:
      q: 'Which vault file must stay out of git, and why?'
      a: 'The private key (prod.decrypt.private.php). Whoever holds it can decrypt every secret stored in git.'

  - slug: using-secrets
    title: 'Using secrets: read them from env, not from code'
    kind: howto
    tldr: 'Store with secrets:set, inject with #[Autowire(env: ...)], use .env.local for development, and only ever use test keys there.'
    keywords: ['Autowire env', '.env.local', 'secrets:set', 'parameter', 'DATABASE_URL', 'Symfony configuration']
    blocks:
      - type: text
        body: |
          First put the secret in the vault, then inject it into your service's constructor with `#[Autowire(env: ...)]`. Inside the app, vault secrets look just like environment variables. The `.env` file holds only empty or fake defaults, never real values. For running on your own laptop, keep test keys such as `sk_test_...` in the git-ignored `.env.local`.
      - type: code
        lang: bash
        file: 'terminal'
        variant: good
        code: |
          # Generate the key pair once; encrypt.public.php goes into git
          php bin/console secrets:generate-keys --env=prod

          # Encrypt a secret (the value is asked for in the terminal)
          php bin/console secrets:set STRIPE_SECRET_KEY --env=prod

          # Keep the private key out of git
          echo '/config/secrets/prod/prod.decrypt.private.php' >> .gitignore
        marks:
          - {line: 5, tip: 'Don''t type the value on the command line, or it stays in your shell history. Let the command prompt you for it.'}
          - {line: 8, tip: 'The private key lives in exactly this file. If it gets committed by mistake, the vault protects nothing.'}
      - type: code
        lang: php
        file: 'src/Payment/StripeGateway.php'
        variant: good
        code: |
          final class StripeGateway
          {
              public function __construct(
                  #[Autowire(env: 'STRIPE_SECRET_KEY')]
                  private readonly string $secretKey,
                  private readonly HttpClientInterface $client,
              ) {
              }

              public function charge(Order $order): array
              {
                  return $this->client->request('POST', 'https://api.stripe.com/v1/charges', [
                      'auth_bearer' => $this->secretKey,
                      'body' => ['amount' => $order->getTotalMinor(), 'currency' => 'usd'],
                  ])->toArray();
              }
          }
        marks:
          - {line: 4, tip: 'The value isn''t in the code; it comes from the environment. Anyone can read the code and still not get the key.'}
          - {line: 13, tip: 'It goes in a header as a Bearer token. Never put it in the URL, because URLs get logged in many places.'}
    aside:
      - type: tips
        items:
          - '.env is the file of defaults and is committed. Real values live in the vault, or in .env.local.'
          - 'In production you can pass the private key at deploy time through the SYMFONY_DECRYPTION_SECRET environment variable, so no key file is needed.'
          - 'Give every environment (dev, staging, prod) its own secrets, so a leaked staging secret leaves prod safe.'
      - type: refs
        items:
          - {to: 'config/configuration', label: 'Configuration and environments'}
    check:
      q: 'What kind of key should a developer''s own laptop hold, and where?'
      a: 'Only test or dev keys, in the git-ignored .env.local. Live keys never go on a laptop; they exist only in the production vault.'

  - slug: rotate-and-scope
    title: 'When a secret leaks: replace it, don''t just delete it'
    kind: pitfall
    tldr: 'After a leak, bring the new secret online first, then revoke the old one. And give every key only as much power as it needs.'
    keywords: ['secret rotation', 'least privilege', 'scoped credentials', 'key revoke', 'revocation', 'key rotation']
    blocks:
      - type: text
        body: |
          If you lose the key to a lock, searching for it is pointless; you change the lock. A leaked secret is the same: deleting the commit doesn't help, but **rotating** the secret (creating a new one and revoking the old one) removes the risk. If nobody has used the key yet, do it without downtime: the new secret goes live first and the old one is switched off afterwards.
      - type: visual
        kind: steps
        caption: 'Rotation without downtime: new first, old last'
        steps:
          - {title: '1. Create the new one', body: 'Make a new key or DB user; the old one still works', tip: 'Both keys are valid at this point, so no request gets blocked.'}
          - {title: '2. Put it in the vault', body: 'Store the new value with secrets:set', tip: 'After a value changes, the app needs a restart or a deploy.'}
          - {title: '3. Deploy', body: 'Every server restarts with the new key', tip: 'In a rolling deploy some servers still run on the old key, so the old one has to stay valid for now.'}
          - {title: '4. Revoke the old one', body: 'Once all is well, revoke the old key', tip: 'After revocation the leaked key is useless. Without this step the rotation is unfinished.'}
      - type: code
        lang: sql
        file: 'MySQL, run by an admin'
        variant: good
        code: |
          -- Before: the app logs in as a user that can do everything
          -- GRANT ALL PRIVILEGES ON *.* TO 'shop_app'@'%';

          -- Step 1 of rotation and least privilege in one go: a new, narrow user
          CREATE USER 'shop_app_v2'@'10.0.%' IDENTIFIED BY '<new password>';
          GRANT SELECT, INSERT, UPDATE ON shop.orders TO 'shop_app_v2'@'10.0.%';
          GRANT SELECT, INSERT, UPDATE ON shop.payments TO 'shop_app_v2'@'10.0.%';

          -- Step 4, after every server has moved over: DROP USER 'shop_app'@'%';
        marks:
          - {line: 5, tip: 'A new user, so the old one keeps working until every server has switched over.'}
          - {line: 6, tip: 'No DROP, no DELETE, no other tables: a stolen password or an injected query can read and add rows but cannot wipe the database.'}
      - type: points
        title: 'Least privilege: keep each key''s power small'
        style: check
        items:
          - 'Every service gets its own key or DB user, so one leak doesn''t take everything down.'
          - 'Only what is needed: an app''s DB user usually gets SELECT/INSERT/UPDATE, not DROP or root.'
          - 'On platforms like Stripe, create restricted keys that can only do specific things.'
          - 'Give keys an expiry: with short-lived tokens, a leak does limited damage.'
      - type: quote
        body: 'After a leak, assume everything leaked. Replace the secret; deleting it is not enough.'
    aside:
      - type: pitfalls
        items:
          - 'Keeping secrets in the frontend: variables starting with VITE_ in Vue end up in the browser bundle, so no secrets there.'
          - 'Baking secrets into a Docker image or build log; whoever gets the image gets the key.'
          - 'Using a single "master" key everywhere.'
      - type: remember
        body: 'New first, old later, and nobody gets more power than the job needs.'
      - type: when
        use:
          - 'Nobody is known to have used the key yet, and downtime would hurt: new first, old last.'
        avoid:
          - 'The key is being abused right now (unknown charges, servers you didn''t start): revoke it first and accept a few minutes of downtime.'
      - type: refs
        items:
          - {to: 'resilience/zero-downtime-deploys', label: 'Zero-downtime deploys'}
    check:
      q: 'What goes wrong if you revoke the old key before installing the new one during rotation?'
      a: 'In between, none of the app''s keys work, so you get downtime. Bring the new key online and move all servers over first, then revoke the old one.'

flashcards:
  - q: 'What is a secret? Give three examples.'
    a: 'Information that lets whoever knows it act as you: a password, an API key, a token, a private key.'
    more: |
      What separates a secret from ordinary configuration is the damage a leak causes. If `APP_ENV=prod` leaks, nothing happens, but if the password in `DATABASE_URL` leaks, someone else owns your database. That's why the two are handled differently.
    ref: key-on-the-wall
  - q: 'Why is committing a secret to a private repository still wrong?'
    a: 'Every member of the repository, the CI system and every clone can see it, and it stays in history forever.'
    more: |
      Private only means outsiders can't see it. Every insider's laptop has the full history. A single incident (someone makes the repository public, a laptop is stolen) leaks everything. Keeping secrets apart from code is the right habit.
    ref: key-on-the-wall
  - q: 'You accidentally pushed a secret to git. What do you do first?'
    a: 'Revoke it and create a new one (rotate). Deleting the commit is not enough, because it may already have been copied.'
    more: |
      The order is: 1) bring the new secret online, 2) revoke the old one, 3) check the logs to see whether anyone used it. Afterwards you can scrub it from history for tidiness, but that is for discipline, not for security.
    ref: rotate-and-scope
  - q: 'How does the Symfony secrets vault work?'
    a: 'Secrets are encrypted with a public key and stored in git. Only the production private key can decrypt them.'
    more: |
      `secrets:set` encrypts the value and writes files under `config/secrets/<env>/`, which are safe to commit. In production the app decrypts them using the `prod.decrypt.private.php` file or `SYMFONY_DECRYPTION_SECRET`. If the private key reaches git, the vault is worthless.
    ref: symfony-vault
  - q: 'Which vault key must never go into git?'
    a: 'The production decrypt private key (prod.decrypt.private.php).'
    more: |
      The public key (`prod.encrypt.public.php`) and the encrypted files can be committed. But whoever gets the decrypt private key can read every secret. So it stays in `.gitignore` and reaches the production server by a separate route.
    ref: symfony-vault
  - q: 'What is the Symfony way to read a secret from env inside a service?'
    a: 'Put `#[Autowire(env: ''STRIPE_SECRET_KEY'')]` on the constructor parameter.'
    more: |
      That way the secret's value never appears in the code, and one line shows where the service gets it from. `.env` holds only defaults or empty values; the real value comes from the vault or the production environment.
    ref: using-secrets
  - q: 'What is secret rotation, and how do you do it without downtime?'
    a: 'Create a new secret, roll it out everywhere, then revoke the old one. New first, old last.'
    more: |
      A deploy doesn't switch every server at the same instant, so for a while both keys must stay valid. For a DB password, create a new user, move the app to it, then disable the old user. Rotating regularly also shortens how long a leak can hurt you.
    ref: rotate-and-scope
  - q: 'What does least privilege mean?'
    a: 'Give each key or user exactly as much power as its job needs, and no more.'
    more: |
      If the app's DB user is root, a SQL injection can wipe the whole database. If it only has SELECT/INSERT/UPDATE on the tables it needs, the same bug does far less damage. And when every service has its own key, one leak leaves the rest safe.
    ref: rotate-and-scope
  - q: 'An attacker is using your leaked key right now. Do you still rotate "new first, old last"?'
    a: 'No. Revoke the key at once and accept a short outage. "New first" is for leaks nobody has used yet.'
    more: |
      Every minute the old key stays valid, the attacker keeps spending your money or reading your data. A few minutes of downtime costs less than that. Once the key is dead, bring the new one up, then look through the logs for what was done with it.
    ref: rotate-and-scope

quiz:
  - q: 'The .env below was committed. What is the most urgent step?'
    lang: env
    code: |
      APP_ENV=prod
      DATABASE_URL="mysql://root:Sh0p-2024@db:3306/shop"
      STRIPE_SECRET_KEY=sk_live_51Hxxxx
    hint: 'Once you assume it has leaked, first shut the path to the damage.'
    options:
      - text: 'Delete the lines in the next commit'
        correct: false
        why: 'The values stay in the old commit, and anyone who cloned already has them.'
      - text: 'Rotate the DB password and the Stripe key, and revoke the old ones'
        correct: true
        why: 'Revoking a leaked secret is what makes it useless. Everything else comes after.'
      - text: 'Make the repository private'
        correct: false
        why: 'People who already copied it have the values, and a bot may have grabbed them earlier.'
      - text: 'Change only APP_ENV to dev'
        correct: false
        why: 'APP_ENV is not a secret; changing it does nothing about the leaked keys.'
    ref: rotate-and-scope
  - q: 'With the Symfony vault, which of these are safe to commit to git?'
    hint: 'Which ones can''t be used to read a secret on their own?'
    options:
      - text: 'The encrypted secret files (config/secrets/prod/*)'
        correct: true
        why: 'They are encrypted with the public key and can''t be read without the private key.'
      - text: 'The public key (prod.encrypt.public.php)'
        correct: true
        why: 'A public key can only encrypt, not decrypt. Leaking it does no harm.'
      - text: 'The private key (prod.decrypt.private.php)'
        correct: false
        why: 'Whoever gets this file can decrypt every secret, so it stays out of git.'
      - text: 'A .env.local containing the production values'
        correct: false
        why: '.env.local holds real values, which is exactly why it is git-ignored. Committing it would leak them directly.'
    ref: symfony-vault
  - q: 'What is wrong with the code below?'
    lang: php
    code: |
      final class StripeGateway
      {
          private const SECRET = 'sk_live_51Hxxxxxxxx';

          public function charge(Order $order): void
          {
              $this->client->request('POST', 'https://api.stripe.com/v1/charges', [
                  'auth_bearer' => self::SECRET,
              ]);
          }
      }
    hint: 'Who can read the code?'
    options:
      - text: 'The secret is written in the code, so anyone with the repository gets the live key'
        correct: true
        why: 'The secret should come from the environment or the vault, via #[Autowire(env: ...)].'
      - text: 'It should use a property instead of a const'
        correct: false
        why: 'Const or property, a value written in code ends up in git either way.'
      - text: 'Sending a Bearer token in a header is wrong'
        correct: false
        why: 'A header is the right place. It is putting it in the URL that leaks it into logs.'
    ref: using-secrets
  - q: 'You must rotate a DB password with no downtime. What is the right order?'
    hint: 'During the deploy, some servers will still be using the old password.'
    options:
      - text: 'Change the existing password, then deploy the app'
        correct: false
        why: 'Between the password change and the end of the deploy, the app can''t log in to the DB.'
      - text: 'Create a new DB user, move the app to it, then disable the old user'
        correct: true
        why: 'At least one valid credential exists the whole time, so no request is blocked.'
      - text: 'Shut everything down at 3 a.m. and change it'
        correct: false
        why: 'Even at night, that is downtime. If you can avoid it, you should.'
      - text: 'Disable the old user first, then create the new one'
        correct: false
        why: 'In between there is no credential at all, and the app is down.'
    ref: rotate-and-scope
  - q: 'Which of these follow the least privilege principle?'
    hint: 'Think about the most damage one leaked key could do.'
    options:
      - text: 'Giving the app''s DB user only SELECT/INSERT/UPDATE on the tables it needs'
        correct: true
        why: 'Even with SQL injection, it can''t DROP anything or touch other databases.'
      - text: 'A separate API key for every service'
        correct: true
        why: 'If one leaks, only that service is hurt; the others stay separate.'
      - text: 'One admin key shared by all services, so it is easy to remember'
        correct: false
        why: 'It is convenient, but one leak takes everything. That is the opposite of least privilege.'
      - text: 'Giving developers live keys on their laptops, so debugging is easier'
        correct: false
        why: 'A stolen laptop or some malware would hand over the production keys directly.'
    ref: rotate-and-scope
  - q: 'At 2 a.m. an alert shows 40 unknown servers started with your cloud access key. What is the first move?'
    hint: 'Is the key still being used while you decide?'
    options:
      - text: 'Create a new key, deploy it everywhere, and revoke the old one tomorrow'
        correct: false
        why: 'That is the no-downtime order, but here the attacker keeps spending for every hour the old key stays valid.'
      - text: 'Revoke the key immediately, then create a new one and deploy it'
        correct: true
        why: 'The key is being abused right now, so cutting it off beats avoiding a few minutes of downtime.'
      - text: 'Delete the commit that contained the key'
        correct: false
        why: 'The key has already been copied; deleting history does not stop anyone using it.'
      - text: 'Wait until morning, when the team is online'
        correct: false
        why: 'The bill grows every minute, and the attacker may be reading data too.'
    ref: rotate-and-scope
