      - text: 'DB পাসওয়ার্ড ও Stripe key বদলে (rotate) পুরনোগুলো বাতিল করা'
        correct: true
        why: 'ফাঁস হওয়া secret বাতিল করলেই সেটা অকেজো হয়। বাকি সব কাজ এর পরে।'
      - text: 'Repository-কে private করে দেওয়া'
        correct: false
        why: 'ইতিমধ্যে যারা কপি করেছে তাদের কাছে মান আছে, আর bot হয়তো আগেই নিয়ে গেছে।'
      - text: 'শুধু APP_ENV বদলে dev করা'
        correct: false
        why: 'APP_ENV secret নয়; এটা বদলালে ফাঁস হওয়া key-র কিছুই বদলায় না।'
    ref: rotate-and-scope
  - q: 'Symfony vault ব্যবহার করলে কোনগুলো git-এ commit করা নিরাপদ?'
    hint: 'কোনগুলো ছাড়া secret পড়া সম্ভব নয়?'
    options:
      - text: 'এনক্রিপ্ট করা secret ফাইল (config/secrets/prod/*)'
        correct: true
        why: 'এগুলো public key দিয়ে এনক্রিপ্ট করা; private key ছাড়া পড়া যায় না।'
      - text: 'Public key (prod.encrypt.public.php)'
        correct: true
        why: 'Public key দিয়ে শুধু এনক্রিপ্ট করা যায়, খোলা যায় না। এটা ফাঁস হলে ক্ষতি নেই।'
      - text: 'Private key (prod.decrypt.private.php)'
        correct: false
        why: 'এই ফাইল যে পাবে সে সব secret খুলে পড়তে পারবে, তাই এটা git-এ নয়।'
      - text: 'প্রোডাকশনের মান লেখা .env.local'
        correct: false
        why: '.env.local-এ আসল মান থাকে বলেই ওটা git-ignored; commit করলে সরাসরি ফাঁস।'
    ref: symfony-vault
  - q: 'নিচের কোডের সমস্যা কী?'
    lang: php
    code: |
      final class StripeGateway
      {
          private const SECRET = 'sk_live_51Hxxxxxxxx';

          public function charge(Order $order): void
          {
              $this->client->request('POST', 'https://api.stripe.com/v1/charges', [
                  'auth_bearer' => self::SECRET,
              ]);
          }
      }
    hint: 'কোড কারা কারা পড়তে পারে?'
    options:
      - text: 'Secret কোডে লেখা, তাই repository-র যে কেউ live key পাবে'
        correct: true
        why: 'Secret environment বা vault থেকে আসা উচিত, #[Autowire(env: ...)] দিয়ে।'
      - text: 'const-এর বদলে property ব্যবহার করা উচিত'
        correct: false
        why: 'const হোক বা property, কোডে লেখা মান git-এ যাবেই।'
      - text: 'Bearer token header-এ পাঠানো ঠিক নয়'
        correct: false
        why: 'header-এ পাঠানোই সঠিক পথ; URL-এ পাঠানোই বরং log-এ ফাঁস করে।'
    ref: using-secrets
  - q: 'DB পাসওয়ার্ড rotate করতে হবে, কিন্তু downtime চলবে না। সঠিক ক্রম কোনটা?'
    hint: 'Deploy চলার সময় কিছু সার্ভার পুরনো পাসওয়ার্ড চালাবে।'
    options:
      - text: 'পুরনো পাসওয়ার্ড বদলাও, তারপর অ্যাপ deploy করো'
        correct: false
        why: 'পাসওয়ার্ড বদলানো থেকে deploy শেষ হওয়া পর্যন্ত অ্যাপ DB-তে ঢুকতে পারবে না।'
      - text: 'নতুন DB ইউজার বানাও, অ্যাপ সেখানে সরাও, শেষে পুরনো ইউজার বন্ধ করো'
        correct: true
        why: 'পুরো সময় অন্তত একটা বৈধ credential থাকে, তাই কোনো request আটকায় না।'
      - text: 'রাত ৩টায় সব বন্ধ করে বদলাও'
        correct: false
        why: 'রাতে হলেও এটা downtime। এড়ানোর উপায় থাকলে তা-ই করা ভালো।'
      - text: 'পুরনো ইউজার বন্ধ করে তারপর নতুন বানাও'
        correct: false
        why: 'মাঝের সময়টায় কোনো credential নেই, অ্যাপ বন্ধ।'
