      a: 'আক্রমণকারী সামাজিক প্রতারণায় ভুয়া পরিচয় দিয়ে MFA বন্ধ করিয়ে অ্যাকাউন্ট নিতে পারে। আগে থেকে নেওয়া recovery code বা অপেক্ষার সময় আর সতর্কবার্তা লাগে।'

flashcards:
  - q: 'Account recovery কেন আক্রমণের প্রধান লক্ষ্য?'
    a: 'কারণ এটা পাসওয়ার্ড ছাড়াই অ্যাকাউন্টে ঢোকার পথ। লগইন যত মজবুতই হোক, recovery দুর্বল হলে সেটাই পেছনের দরজা।'
    more: |
      Reset, ইমেইল-পরিবর্তন, MFA বন্ধ করা, সাপোর্টকে বলা — সবই recovery। আক্রমণকারী সবচেয়ে দুর্বল পথটা খোঁজে, তাই এগুলো সামনের দরজার সমান কঠিন রাখতে হয়।
    ref: guessable-reset-link
  - q: 'ভালো reset token-এর চারটা গুণ কী?'
    a: 'Random (CSPRNG), ডেটাবেসে hash করা, ছোট মেয়াদ (যেমন ৩০ মিনিট), আর একবার-ব্যবহারযোগ্য।'
    more: |
      `bin2hex(random_bytes(32))` বানাও, ডেটাবেসে `hash('sha256', ...)` রাখো, মেয়াদ বসাও, ব্যবহারে used চিহ্নিত করো। একটাও বাদ গেলে সেই দিকে আক্রমণ চলে।
    ref: good-reset-token
  - q: 'Reset token বানাতে কী ব্যবহার করবে না?'
    a: '`md5(ইমেইল)`, `uniqid()`, `rand()`, সময় বা user id। এগুলো অনুমানযোগ্য। ব্যবহার করবে `random_bytes()`।'
    more: |
      `random_bytes()` অপারেটিং সিস্টেমের নিরাপদ random source (CSPRNG) ব্যবহার করে। `rand()` আর `uniqid()` সময়-নির্ভর, আন্দাজ করা যায়।
    ref: guessable-reset-link
  - q: 'User enumeration কী, আর কীভাবে ঠেকাবে?'
    a: 'ইমেইল আছে কি না জেনে ব্যবহারকারীর তালিকা বের করা। ঠেকাতে সবসময় একই বার্তা ও একই সময়ে উত্তর দাও।'
    more: |
      Forgot, লগইন আর নিবন্ধন — তিন জায়গাতেই এই ফাঁক দেখা যায়। আসল কাজ Messenger-এ পাঠিয়ে response-এ একই বার্তা দিলে সময় দেখেও কিছু বোঝা যায় না।
    ref: issue-reset
  - q: 'Reset লিংকের host কোথা থেকে নেওয়া উচিত?'
    a: 'কনফিগ (`framework.router.default_uri`) থেকে, request-এর Host header থেকে নয়।'
    more: |
      আক্রমণকারী Host header বদলে পাঠালে লিংকটা তার সাইটের নামে ইমেইলে চলে যায়, আর ভুক্তভোগী ক্লিক করে token তাকে দিয়ে দেয়। একে Host header poisoning বলে। কনফিগের host এই ফাঁক বন্ধ করে।
    ref: issue-reset
  - q: 'পাসওয়ার্ড reset হলে আর কী কী বাতিল করতে হবে?'
    a: 'ব্যবহারকারীর অন্য সব session, refresh token আর remember-me। তারপর "পাসওয়ার্ড বদলেছে" মেইল পাঠাও।'
    more: |
      Symfony-তে পাসওয়ার্ড hash বদলালে অন্য session নিজে থেকে অচল হয়। কিন্তু refresh token আলাদা তাই নিজে বাতিল করতে হয়। না করলে চোর আগেই লগইন করা থাকলে বদলের পরেও ঢুকে থাকে।
    ref: consume-reset
  - q: 'Reset-এ MFA কীভাবে সামলাবে?'
    a: 'Reset করলেও MFA চালু থাকবে। MFA হারালে recovery code বা অপেক্ষার সময় ও সতর্কবার্তা দিয়ে খুলতে হবে।'
    more: |
      শুধু ইমেইল-লিংকে MFA বন্ধ করা মানে ইমেইল দখল হলেই সব শেষ। ১০টা এককালীন recovery code (hash করা) আগে থেকে দাও। না থাকলে ২৪–৭২ ঘণ্টা অপেক্ষা ও সব ঠিকানায় মেইল।
    ref: recovery-back-doors
  - q: 'Recovery endpoint-এ rate limit কেন দরকার?'
    a: 'নইলে আক্রমণকারী হাজার ইমেইলে লিংক পাঠায় বা ছোট কোড (৬ অঙ্ক) brute force করে। IP আর ইমেইল দুই ধরেই সীমা দাও।'
    more: |
      Symfony RateLimiter-এ IP ধরে একটা, ইমেইল ধরে আরেকটা limiter বানানো যায়। সীমা পেরোলে 429 ও `Retry-After`। এতে ইমেইল-বোমা আর অনুমানও থামে।
    ref: issue-reset

quiz:
  - q: 'নিচের কোড কীভাবে দুর্বল?'
    lang: php
    code: |
      $token = sha1($user->getId() . time());
      $db->insert('reset_tokens', ['user_id' => $user->getId(), 'token' => $token]);
      mail($user->getEmail(), 'Reset', "https://app.bd/reset/$token");
    hint: 'token-এর উপাদান কী কী, আর ডেটাবেসে কী রাখা হচ্ছে?'
    options:
      - text: 'Token অনুমানযোগ্য (user id + সময়), plain অবস্থায় সংরক্ষিত, মেয়াদ বা used-চিহ্ন নেই'
        correct: true
        why: 'আক্রমণকারী id আর সময় আন্দাজ করে token বানাতে পারে; ডেটাবেস ফাঁসে সরাসরি ব্যবহারযোগ্য; আর চিরকাল চলে।'
      - text: 'শুধু sha1 পুরনো, sha256 হলে নিরাপদ হতো'
        correct: false
        why: 'hash-এর ধরন মূল সমস্যা নয়; ইনপুটই অনুমানযোগ্য, তাই যেকোনো hash আন্দাজ-যোগ্য।'
      - text: 'সমস্যা নেই, লিংক তো ইমেইলে যাচ্ছে'
        correct: false
        why: 'ইমেইলে পাঠানো নিরাপত্তা নয়; আক্রমণকারী ইনবক্স ছাড়াই token নিজে বানাতে পারে।'
    ref: guessable-reset-link
  - q: 'Forgot-password endpoint কোন আচরণে user enumeration ফাঁক খোলে?'
    hint: 'বাইরের কেউ ইমেইল আছে কি নেই কীভাবে বুঝবে?'
    options:
      - text: 'ইমেইল না থাকলে 404 "ব্যবহারকারী পাওয়া যায়নি", থাকলে 200'
        correct: true
        why: 'এই পার্থক্য দেখেই আক্রমণকারী বহু ইমেইল পরীক্ষা করে ব্যবহারকারীদের তালিকা পায়।'
      - text: 'সবসময় 202 আর একই বার্তা'
        correct: false
        why: 'এটাই সঠিক আচরণ, ফাঁক নয়।'
      - text: 'IP ধরে rate limit রাখা'
        correct: false
        why: 'এটা enumeration-এর গতি কমায়, ফাঁক খোলে না।'
    ref: issue-reset
  - q: 'কোনগুলো ঠিক reset প্রয়োগের অংশ?'
    hint: 'সম্পূর্ণ ও একবার-ব্যবহারযোগ্য প্রবাহ ভাবো।'
    options:
      - text: 'Token ডেটাবেসে শুধু SHA-256 hash হিসেবে'
        correct: true
        why: 'ফাঁস হলেও আসল token মেলে না।'
      - text: 'সফল reset-এর পরে ব্যবহারকারীর refresh token বাতিল'
        correct: true
        why: 'নইলে চোর পুরনো token দিয়ে ঢুকে থাকে।'
      - text: 'Token-এর মেয়াদ ৩০ দিন, যাতে ব্যবহারকারী পরে করতে পারে'
        correct: false
        why: 'লম্বা মেয়াদ আক্রমণের জানালা বাড়ায়; ১৫–৬০ মিনিট যথেষ্ট।'
