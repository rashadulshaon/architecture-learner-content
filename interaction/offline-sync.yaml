  - slug: client-outbox
    title: 'Vue-তে local-first: আগে ফোনে লেখো, পরে পাঠাও'
    kind: howto
    tldr: 'প্রতিটা বদল আগে IndexedDB-র outbox-এ জমাও, নেটওয়ার্ক এলে ক্রমে পাঠাও, আর প্রতিটা বদলে এমন id দাও যাতে আবার পাঠালেও ক্ষতি নেই।'
    keywords: ['IndexedDB', 'outbox', 'Vue 3', 'idb-keyval', 'navigator.onLine', 'local first', 'mutation id']
    blocks:
      - type: text
        body: |
          সিঙ্ক প্রোটোকলের তিন ধাপ: ব্যবহারকারী বদলালে আগে ফোনে লেখো (**outbox**), অনলাইন হলে বদলগুলো ক্রমে `push` করো, তারপর সার্ভার থেকে নতুন বদল `pull` করে ফোনের কপি হালনাগাদ করো। প্রতিটা বদলের একটা নিজস্ব `id` থাকে, যাতে নেটওয়ার্ক কেটে গিয়ে আবার পাঠালেও সার্ভার ডুপ্লিকেট চিনতে পারে।
      - type: code
        lang: vue
        file: 'src/composables/useOutbox.vue'
        variant: good
        code: |
          <script setup lang="ts">
          import { ref, onMounted, onUnmounted } from 'vue'
          import { get, set } from 'idb-keyval'

          interface Mutation { id: string; noteId: string; baseVersion: number; title: string }
          const pending = ref<Mutation[]>([])
          const conflicts = ref<Mutation[]>([])

          async function save(noteId: string, baseVersion: number, title: string) {
            pending.value.push({ id: crypto.randomUUID(), noteId, baseVersion, title })
            await set('outbox', JSON.parse(JSON.stringify(pending.value)))
            if (navigator.onLine) await flush()
          }

          async function flush() {
            while (pending.value.length) {
              const m = pending.value[0]
              const res = await fetch('/api/sync', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(m),
              })
              if (res.status === 409) conflicts.value.push(m)
              else if (!res.ok) return
              pending.value.shift()
              await set('outbox', JSON.parse(JSON.stringify(pending.value)))
            }
          }

          onMounted(async () => {
            pending.value = (await get('outbox')) ?? []
            window.addEventListener('online', flush)
          })
          onUnmounted(() => window.removeEventListener('online', flush))
          </script>
        marks:
          - {line: 10, tip: 'বদলের নিজস্ব id আর base version আছে। দুটোই সার্ভারের সংঘাত-ধরা আর ডুপ্লিকেট-ধরার কাজে লাগে।'}
          - {line: 11, tip: 'আগে ফোনের IndexedDB-তে লেখা। নেটওয়ার্ক না থাকলেও বদল হারায় না।'}
          - {line: 23, tip: '409 এলে বদলটা conflicts-এ যায় আর ব্যবহারকারীকে দুই কপি দেখানো হয়। আর retry হয় না।'}
          - {line: 24, tip: 'অন্য ব্যর্থতায় (সার্ভার ডাউন) outbox যেমন আছে তেমন থাকে, পরে আবার চেষ্টা হবে।'}
    aside:
      - type: tips
        items:
          - '`navigator.onLine` শুধু আন্দাজ দেয়। আসল সত্যি হলো fetch সফল হলো কি না।'
          - 'Background sync বা Service Worker যোগ করলে ট্যাব বন্ধ থাকলেও outbox খালি হয়।'
      - type: pitfalls
        items:
          - 'Outbox শুধু memory-তে রাখলে ট্যাব বন্ধ হলেই অফলাইন বদল হারায়।'
    check:
      q: 'প্রতিটা বদলে `crypto.randomUUID()` দিয়ে id দেওয়া হয় কেন?'
      a: 'নেটওয়ার্ক কেটে গিয়ে উত্তর হারালে ক্লায়েন্ট একই বদল আবার পাঠায়। সার্ভার id দেখে চিনতে পারে যে এটা আগেই প্রয়োগ হয়েছে, ফলে দুইবার লেখা হয় না।'

  - slug: server-sync-endpoint
    title: 'Symfony সার্ভার: version মেলাও, বদল ফেরত দাও'
    kind: howto
    tldr: 'সার্ভার mutation id দিয়ে ডুপ্লিকেট চেনে, Doctrine optimistic lock দিয়ে base version মেলায়, আর মিলে না গেলে 409-এ সার্ভারের কপি পাঠায়।'
    keywords: ['OptimisticLockException', 'ORM Version', 'LockMode', 'sync endpoint', '409', 'Symfony API', 'সিঙ্ক API']
    blocks:
      - type: code
        lang: php
        file: 'src/Entity/Note.php'
        variant: good
        code: |
          #[ORM\Entity]
          class Note
          {
              #[ORM\Id, ORM\Column(type: 'uuid')]
              private Uuid $id;

              #[ORM\Column(length: 200)]
              private string $title;

              #[ORM\Version, ORM\Column(type: 'integer')]
              private int $version = 1;

              public function rename(string $title): void
              {
                  $this->title = $title;   // flush-এ version নিজে বাড়ে
              }

              public function getVersion(): int
              {
                  return $this->version;
              }
          }
        marks:
          - {line: 10, tip: '`#[ORM\Version]` থাকলে Doctrine প্রতিটা UPDATE-এ version বাড়ায় আর মেলায়।'}
      - type: code
        lang: php
        file: 'src/Controller/SyncController.php'
        variant: good
        code: |
          #[Route('/api/sync', methods: ['POST'])]
          public function sync(#[MapRequestPayload] SyncMutation $m): JsonResponse
          {
              if ($this->applied->has($m->id)) {
                  return $this->json(['status' => 'duplicate']);   // আগেই প্রয়োগ হয়েছে
              }

              try {
                  $note = $this->em->find(Note::class, $m->noteId, LockMode::OPTIMISTIC, $m->baseVersion);
                  $note->rename($m->title);
                  $this->applied->record($m->id);
                  $this->em->flush();
              } catch (OptimisticLockException) {
                  $server = $this->em->find(Note::class, $m->noteId);
                  return $this->json(['status' => 'conflict', 'server' => $server], 409);
              }

              return $this->json(['status' => 'applied', 'version' => $note->getVersion()]);
          }
        marks:
          - {line: 9, tip: 'LockMode::OPTIMISTIC আর expected version দিলে ক্লায়েন্টের base version না মিললে Doctrine এখানেই exception ছোড়ে।'}
          - {line: 13, tip: 'version মিলল না বলেই এখানে আসা। ক্লায়েন্টকে সার্ভারের কপি পাঠাও, লেখা হয়নি।'}
    aside:
      - type: tips
        items:
          - 'Pull-এর জন্য `GET /api/changes?since=<cursor>` বানাও, cursor হলো সার্ভারের বাড়তে থাকা সংখ্যা, ঘড়ি নয়।'
          - '`applied->record()` ডেটার বদলের সাথে একই transaction-এ রাখো।'
      - type: refs
        items:
          - {to: 'payments/idempotency-keys', label: 'Idempotency key'}
    check:
      q: 'সার্ভার 409-এ শুধু "conflict" না বলে সার্ভারের কপিও পাঠায় কেন?'
      a: 'ক্লায়েন্টের দুই কপি পাশাপাশি দেখাতে আর মার্জ করতে সার্ভারের বর্তমান ডেটা দরকার। শুধু "conflict" শুনে ব্যবহারকারী কিছুই করতে পারে না।'

flashcards:
  - q: 'Local-first লেখা মানে কী?'
    a: 'ব্যবহারকারীর বদল আগে ডিভাইসের নিজের ডেটাবেসে (যেমন IndexedDB) লেখা হয়, নেটওয়ার্ক এলে পরে সার্ভারে যায়।'
    more: |
      এতে অ্যাপ অফলাইনেও সাথে সাথে সাড়া দেয়। দাম হলো সংঘাত: একই জিনিস দুই ডিভাইসে বদলালে সিঙ্কের সময় মেলাতে হয়। তাই outbox, version আর মার্জ নিয়ম জরুরি।
    ref: client-outbox
  - q: 'Lost update কী?'
    a: 'দুজন একই জিনিস বদলালে একজনের বদল আরেকজনকে না জেনে চুপচাপ মুছে দেওয়া, যেমন last-write-wins-এ।'
    more: |
      সবচেয়ে বিপজ্জনক কারণ কেউ ভুলটা টের পায় না। সংঘাত ধরা না পড়লে মেলানোর সুযোগও আসে না। সমাধানের প্রথম ধাপ হলো সংঘাত শনাক্ত করা।
    ref: silent-overwrite
  - q: 'সংঘাত ধরতে base version কীভাবে কাজ করে?'
    a: 'ক্লায়েন্ট বদলের সাথে পাঠায় সে কোন version দেখে লিখেছে। সার্ভারের version আলাদা হলে সার্ভার লেখে না, 409 ফেরত দেয়।'
    more: |
      Doctrine-এ `#[ORM\Version]` ফিল্ড আর `LockMode::OPTIMISTIC` একসাথে এটা করে। মিলে গেলে লেখা হয় আর version বাড়ে; না মিললে `OptimisticLockException` ওঠে।
    ref: detect-with-version
  - q: 'সংঘাত ধরতে timestamp কেন ভালো নয়?'
    a: 'ফোন আর সার্ভারের ঘড়ি মেলে না। ভুল ঘড়ির কারণে পুরনো বদল নতুন গণ্য হয়ে সঠিক ডেটা মুছে ফেলতে পারে। Version সংখ্যা নির্ভরযোগ্য।'
    more: |
      ফোনের ঘড়ি ব্যবহারকারী নিজে বদলাতে পারে, আর NTP-র লাফেও সময় পিছিয়ে যায়। তাই ক্রম ঠিক করতে সার্ভারের বাড়তে থাকা সংখ্যা ব্যবহার করো, ডিভাইসের সময় নয়।
    ref: detect-with-version
  - q: 'Last-write-wins কখন চলে, আর কখন চলে না?'
    a: 'কম গুরুত্বের ফিল্ডে চলে। টাকা, স্টক বা গুরুত্বপূর্ণ লেখায় চলে না, কারণ একজনের কাজ চুপচাপ হারায়।'
    more: |
      সহজ বলে LWW জনপ্রিয়, কিন্তু এটা সিদ্ধান্ত নয়, ডেটা ফেলে দেওয়ার নিয়ম। বেশিরভাগ অ্যাপে field merge আর ব্যবহারকারীকে জিজ্ঞাসা মিলিয়ে চালানো নিরাপদ।
    ref: resolve-strategies
  - q: 'Version vector আর CRDT কী কাজে লাগে?'
    a: 'Version vector দেখে বোঝা যায় দুই বদল concurrent কি না। CRDT এমন গঠন যা যেকোনো ক্রমে মিলিয়েও একই ফল দেয়।'
    more: |
      Version vector-এ প্রতিটা ডিভাইসের আলাদা counter থাকে। CRDT-এর সহজ উদাহরণ হলো "+২ কার্টন" ধরনের বদল পাঠানো, যেটা ক্রম বদলালেও একই মোট দেয়। সাধারণ অ্যাপে কমই লাগে।
    ref: resolve-strategies
  - q: 'অফলাইন বদলের outbox-এ প্রতিটা বদলে কী কী থাকা উচিত?'
    a: 'একটা নিজস্ব id (UUID), কোন জিনিস বদলাচ্ছে, base version আর বদলের ডেটা। id দিয়ে সার্ভার ডুপ্লিকেট চেনে।'
    more: |
      নেটওয়ার্ক কেটে উত্তর হারালে ক্লায়েন্ট একই বদল আবার পাঠায়। সার্ভার id চিনে "আগেই প্রয়োগ হয়েছে" বলে, তাই বদল দুইবার লাগে না। Outbox IndexedDB-তে থাকে, memory-তে নয়।
    ref: client-outbox

quiz:
  - q: 'রহিম অফলাইনে ক্রেতার ঠিকানা বদলাল, ইতিমধ্যে সার্ভারে সেটা বদলে গেছে। কী হওয়া উচিত?'
    hint: 'লিখে ফেলবে, নাকি জানাবে?'
    options:
      - text: 'সার্ভার শেষ আসা বদল রেখে দেবে, কিছু বলবে না'
        correct: false
        why: 'এটা last-write-wins; করিমের বদল নিঃশব্দে হারায়।'
      - text: 'সার্ভার base version না মিলিয়ে লিখবে না, 409 ফেরত দেবে আর দুই কপি দেখানো হবে'
        correct: true
        why: 'সংঘাত ধরা পড়ে, কেউ কিছু হারায় না, মিলিয়ে নেওয়ার সুযোগ থাকে।'
      - text: 'রহিমের ফোন ফেরার সময় সার্ভারের পুরো কপি দিয়ে নিজের বদল মুছে দেবে'
        correct: false
        why: 'এতে রহিমের কাজ হারায়। দুই পক্ষের কাজই বাঁচাতে হয়।'
    ref: detect-with-version
  - q: 'ক্লায়েন্ট একই বদল দুইবার পাঠাল (প্রথম উত্তর হারিয়ে গিয়েছিল)। সার্ভারে কী থাকলে ক্ষতি হবে না?'
    hint: 'সার্ভার কীভাবে চিনবে যে বদলটা আগেও এসেছে?'
    options:
      - text: 'প্রতিটা বদলের নিজস্ব mutation id আর "প্রয়োগ হয়েছে" তালিকা'
        correct: true
        why: 'দ্বিতীয়বার একই id দেখলে সার্ভার "duplicate" বলে আর কিছু করে না।'
      - text: 'বদলের সময়ের timestamp'
        correct: false
        why: 'ডিভাইসের timestamp দিয়ে ডুপ্লিকেট চেনা যায় না; আবার পাঠালেও সময় একই কিন্তু নির্ভরযোগ্য নয়।'
      - text: 'ক্লায়েন্টকে একবারই পাঠাতে বাধ্য করা'
        correct: false
        why: 'নেটওয়ার্ক কেটে গেলে ক্লায়েন্ট জানে না প্রথমবার সফল হয়েছিল কি না।'
    ref: server-sync-endpoint
  - q: 'কোন ক্ষেত্রে field-ভিত্তিক merge ঠিকঠাক কাজ করবে?'
    hint: 'বদল কি একই ফিল্ডে হয়েছে?'
    options:
      - text: 'একজন ঠিকানা বদলেছে, অন্যজন ফোন নম্বর'
        correct: true
        why: 'আলাদা ফিল্ড, তাই দুটো বদলই রাখা যায়।'
      - text: 'দুজনেই শিরোনাম আলাদা আলাদা বদলেছে'
        correct: false
        why: 'একই ফিল্ডে সংঘাত; merge দিয়ে মেটে না, ব্যবহারকারীকে বাছতে হয়।'
      - text: 'একজন মুছেছে, অন্যজন বদলেছে'
        correct: false
        why: 'এটাও আসল সংঘাত, তাই স্বয়ংক্রিয় merge নিরাপদ নয়।'
    ref: resolve-strategies
  - q: 'এই কোডে কোন সমস্যাগুলো আছে?'
    lang: ts
    code: |
      const pending: Mutation[] = []

      async function save(m: Mutation) {
        pending.push(m)
        const res = await fetch('/api/sync', {
          method: 'POST',
          body: JSON.stringify(m),
        })
        if (res.ok) pending.shift()
      }
    hint: 'ট্যাব বন্ধ হলে, আর সার্ভার 409 দিলে কী হবে?'
    options:
      - text: 'Outbox শুধু memory-তে, ট্যাব বন্ধ হলে অফলাইন বদল হারাবে'
        correct: true
        why: 'IndexedDB-তে না রাখলে আসল local-first হয় না।'
      - text: '409 আর অন্য ব্যর্থতা আলাদা করা হয়নি, তাই সংঘাত নীরবে বসে থাকবে'
        correct: true
        why: '`res.ok` মিথ্যা হলে বদল pending-এই থাকে, ব্যবহারকারীকে কিছু বলা হয় না।'
      - text: '`JSON.stringify` ব্যবহার করা ভুল'
        correct: false
        why: 'ঠিক আছে, JSON-ই এখানে স্বাভাবিক পদ্ধতি।'
      - text: '`fetch` অফলাইনে ব্যবহার করা যায় না, তাই কখনো চলবে না'
        correct: false
        why: 'অফলাইনে fetch ব্যর্থ হয়, যা ধরে outbox-এ রাখাই নিয়ম।'
    ref: client-outbox
  - q: 'মজুতের হিসাবে দুজন অফলাইনে বদলাচ্ছে। কোন পদ্ধতি সবচেয়ে নিরাপদ?'
    hint: 'বদল কি "মোট" না "যোগ-বিয়োগ"?'
    options:
      - text: 'প্রতিবার নতুন মোট সংখ্যা পাঠানো আর শেষটা রাখা'
        correct: false
        why: 'দুজনের পাঠানো মোট আলাদা হলে একজনেরটা হারায়, হিসাব ভুল হয়।'
      - text: '"+২ কার্টন", "−১ কার্টন"-ধরনের বদল পাঠানো, সার্ভার যোগ করে নেয়'
