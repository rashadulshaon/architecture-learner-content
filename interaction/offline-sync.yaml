      a: 'ফোন আর সার্ভারের ঘড়ি মেলে না, তাই timestamp ভুল ক্রম দেখাতে পারে। Version সংখ্যা সার্ভার নিজে বাড়ায়, তাই তাতে ঘড়ির ভুলের জায়গাই নেই।'

