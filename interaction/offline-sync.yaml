slides:
  - slug: silent-overwrite
    title: 'অফলাইনে লেখা বদল চুপচাপ মুছে গেল'
    kind: story
    tldr: 'দুজন ব্যবহারকারী অফলাইনে একই জিনিস বদলালে, ফেরার পরে শেষ যে পাঠায় সে জেতে আর অন্যের কাজ কাউকে না জানিয়ে হারায়।'
    keywords: ['offline', 'sync', 'conflict', 'last write wins', 'lost update', 'অফলাইন', 'সিঙ্ক']
    blocks:
      - type: metaphor
        icon: book
        title: 'ম্যানেজার আর সেলসম্যানের দুই খাতা'
        body: |
          গ্রামে মাল বেচতে গেছে সেলসম্যান রহিম, সাথে দোকানের খাতার ফটোকপি। ওদিকে দোকানে ম্যানেজার করিম মূল খাতায় একই খদ্দেরের ঠিকানা বদলে ফেলল। রহিম ফিরে এসে নিজের কপি মূল খাতায় তুলে দিলে করিমের লেখা মুছে যায়, আর কেউ জানতেই পারে না। অফলাইন অ্যাপে ঠিক এটাই ঘটে।
      - type: visual
        kind: sequence
        caption: 'শেষ যে পাঠায় সে জেতে: করিমের বদল নিঃশব্দে উধাও'
        actors:
          - {id: rahim, label: 'রহিমের ফোন', icon: mobile, tip: 'গ্রামে নেটওয়ার্ক নেই, তাই বদল ফোনেই জমা থাকে।'}
          - {id: server, label: 'সার্ভার', icon: server, tip: 'সবার জন্য একটাই মূল কপি রাখে।'}
          - {id: karim, label: 'করিমের ল্যাপটপ', icon: browser, tip: 'অফিসে অনলাইন, বদল সাথে সাথে সার্ভারে যায়।'}
        messages:
          - {at: rahim, note: 'অফলাইন: ঠিকানা = "মিরপুর"'}
          - {from: karim, to: server, label: 'ঠিকানা = "ধানমন্ডি"', tip: 'করিমের বদল আগেই সার্ভারে বসে গেল।'}
          - {from: rahim, to: server, label: 'ঠিকানা = "মিরপুর" (অনলাইন হয়ে)', tone: bad, tip: 'রহিম জানেই না যে করিম বদলেছে।'}
          - {at: server, note: 'শেষ লেখা জেতে: "ধানমন্ডি" নেই', tone: bad}
      - type: quote
        body: 'Last-write-wins মানে একজনের কাজ কাউকে না জানিয়ে মুছে ফেলা।'
    aside:
      - type: story
        title: 'ফিল্ড-ভিজিটের নোট'
        body: |
          এক NGO-র মাঠকর্মীরা অফলাইনে সমীক্ষা-ফর্ম ভরত। দুজন একই পরিবারের তথ্য আলাদা আলাদা বদলালে পরে সিঙ্কে একজনেরটা নিঃশব্দে হারাত, আর কয়েক সপ্তাহ পর্যন্ত কেউ টের পায়নি।
      - type: terms
        items:
          - {term: 'Local-first', meaning: 'আগে ফোনের নিজের ডেটাবেসে লেখা, নেটওয়ার্ক পরে।'}
          - {term: 'Lost update', meaning: 'এক বদল আরেক বদলকে না জেনে মুছে দেওয়া।'}
    check:
      q: 'রহিম আর করিম দুজনেই বদলেছে, আর সার্ভার শেষ আসাটা রাখল। কোন ক্ষতিটা হলো?'
      a: 'করিমের বদল হারিয়ে গেল, কেউ জানল না। এটাই lost update: সংঘাত ধরা পড়ল না বলে দুজনের কাজ মেলানোরও সুযোগ থাকল না।'

  - slug: detect-with-version
    title: 'সংঘাত ধরো: কোন version দেখে লিখেছ?'
    kind: concept
    tldr: 'প্রতিটা বদলের সাথে base version পাঠাও; সার্ভারের version আলাদা হলে নিঃশব্দে লিখো না, 409 conflict ফেরত দিয়ে দুই কপি দেখাও।'
    keywords: ['optimistic locking', 'base version', '409 conflict', 'version number', 'সংঘাত শনাক্ত', 'ভার্সন']
    blocks:
      - type: metaphor
        icon: ticket
        title: 'খাতায় "আমি এই সংস্করণ দেখেছি"'
        body: |
          সেলসম্যান খাতার ফটোকপির উপরে লিখে রাখে "সংস্করণ ৫"। মূল খাতায় তুলতে এসে বলে "আমি ৫ দেখে লিখেছি"। এর মধ্যে খাতা ৬ হয়ে গেলে ম্যানেজার বলেন, "থামো, তুমি পুরনো দেখে লিখেছ, আগে নতুনটা দেখো।" এটা সংঘাত **ধরা**, মুছে ফেলা নয়।
      - type: visual
