slides:
  - slug: weekly-discount-rules
    title: 'প্রতি সপ্তাহে বদলানো ছাড়ের নিয়ম'
    kind: story
    tldr: 'যে business rule ব্যবসার লোক সপ্তাহে একবার বদলায়, তার জন্য প্রতিবার ডেভেলপারের কোড আর deploy-এর অপেক্ষা ধীর ও বিরক্তিকর; সেই নিয়ম ডেটায় নেওয়ার প্রশ্ন ওঠে।'
    keywords: ['business rules', 'rules engine', 'discount rules', 'ডেটায় নিয়ম', 'hardcoded rules', 'ব্যবসার নিয়ম']
    blocks:
      - type: metaphor
        icon: bank
        title: 'বাসের ভাড়ার চার্ট'
        body: |
          বাসের কন্ডাক্টর ভাড়া নেওয়ার পদ্ধতি জানে: কোথা থেকে কোথা, চার্ট দেখো, টাকা নাও। ভাড়া বাড়লে সরকার নতুন চার্ট দেয়; কন্ডাক্টরকে নতুন করে কাজ শেখাতে হয় না। পদ্ধতি হলো কোড, চার্ট হলো ডেটা। প্রশ্ন একটাই: তোমার নিয়মটা কি চার্ট, নাকি পদ্ধতি?
      - type: text
        body: |
          রহিমের ই-কমার্সে মার্কেটিং টিম প্রতি সপ্তাহে ছাড়ের নিয়ম বদলায়: "প্রথম অর্ডারে ১০%", "২০০০ টাকার ওপরে ফ্রি ডেলিভারি"। প্রতিটা বদলের জন্য ticket, কোড, review, deploy। ছোট একটা সংখ্যা বদলাতে তিন দিন লাগে, আর ডেভেলপাররা বিরক্ত।
      - type: visual
        kind: bars
        caption: 'ছাড়ের একটা সংখ্যা বদলে চালু হতে কত সময় (মিনিট)'
        items:
          - {label: 'নিয়ম কোডে', value: 4320, display: '৩ দিন', tone: bad, tip: 'ticket, কোড বদল, review, test, deploy — প্রতিটা ধাপে অপেক্ষা।'}
          - {label: 'নিয়ম ডেটায়', value: 10, display: '১০ মিনিট', tone: good, tip: 'ব্যবসার লোক অ্যাডমিন থেকে বদলায়। কিন্তু এর সাথে আসে নিজস্ব ঝুঁকি, যা পরের স্লাইডগুলোতে।'}
      - type: quote
        body: 'নিয়ম ডেটায় নিলে সেটা আর "কোড review"-এর ভেতর দিয়ে যায় না। সুরক্ষা নিজে বানাতে হয়।'
    aside:
      - type: problem
        body: 'যে নিয়ম ঘন ঘন বদলায় আর যারা বদলায় তারা ডেভেলপার নয়, তাদের জন্য প্রতিবার deploy-এর অপেক্ষা।'
      - type: terms
        items:
          - {term: 'Business rule', meaning: 'ব্যবসার সিদ্ধান্ত যা কোডে ঢোকে: কে কত ছাড় পাবে, কোন অর্ডার আটকে রাখতে হবে।'}
          - {term: 'Rules engine', meaning: 'নিয়ম কোডের বাইরে ডেটা হিসেবে রেখে, চালানোর সময় মূল্যায়ন করার ব্যবস্থা।'}
    check:
      q: 'নিয়ম ডেটায় নিলে কী বাঁচে, আর কোন বাড়তি দায় আসে?'
      a: 'ডেভেলপার আর deploy-এর অপেক্ষা বাঁচে। কিন্তু code review, test আর version-এর সুরক্ষা যায়, তাই সেগুলো নিজে বানাতে হয়।'

  - slug: code-or-data
    title: 'নিয়ম কোডে থাকবে, না ডেটায়?'
    kind: concept
    tldr: 'বদলের হার, কে বদলায়, ভুলের দাম আর জটিলতা — চার প্রশ্ন দেখে ঠিক করো। সাধারণ, ঘন বদলানো আর সীমা দিয়ে ঘেরা নিয়ম ডেটায়; জটিল বা ঝুঁকিপূর্ণ নিয়ম কোডে।'
    keywords: ['rules in code', 'rules in data', 'decision criteria', 'when to use rules engine', 'কোডে না ডেটায়']
    blocks:
      - type: text
        body: |
          ভাড়ার চার্ট ডেটা, কিন্তু "ভাড়া কখনো শূন্য বা ঋণাত্মক হবে না" নিয়মটা পদ্ধতির অংশ। প্রতিটা নিয়মের জন্য চারটা প্রশ্ন করো। যত বেশি প্রশ্নের উত্তর "ডেটার দিকে" যায়, তত নিরাপদে নিয়মটা কোডের বাইরে নেওয়া যায়।
      - type: visual
        kind: table
        caption: 'চার প্রশ্নে সিদ্ধান্ত'
        headers: ['প্রশ্ন', 'কোডে রাখো', 'ডেটায় রাখো']
        rows:
          - cells: ['কত ঘন বদলায়?', 'বছরে কয়েকবার', 'সপ্তাহে বা দিনে']
            tip: 'কম বদলানো নিয়মে ডেটায় নেওয়ার খাটুনি কখনো উশুল হয় না।'
          - cells: ['কে বদলায়?', 'ডেভেলপার', 'বিশ্বস্ত ব্যবসার লোক']
            tip: 'ডেভেলপারই বদলালে কোডে রাখাই সহজ, review আর test সুবিধাসহ।'
          - cells: ['ভুলের দাম কত?', 'বড়: টাকা, আইন, নিরাপত্তা', 'সীমিত, বা কোডের সীমা দিয়ে ঘেরা']
            tip: 'ভুলে বড় ক্ষতি হলে নিয়ম কোডে থাকুক, অথবা কোডে একটা ঊর্ধ্বসীমা থাকুক।'
          - cells: ['কতটা জটিল?', 'অনেক শাখা, loop, অবস্থা', 'সহজ শর্ত আর সংখ্যা']
            tip: 'জটিল নিয়ম ডেটায় নিলে ডেটা ধীরে একটা খারাপ প্রোগ্রামিং ভাষা হয়ে ওঠে।'
          - cells: ['test আর audit?', 'সাধারণ CI আর review-ই যথেষ্ট', 'আলাদা version, অনুমোদন, replay দরকার']
            tip: 'ডেটায় নিলে এই দায় তোমার; নিজে বানাতে হবে।'
      - type: quote
        body: 'কোডে হবে: ঝুঁকি, জটিলতা, অপরিবর্তনীয় সীমা। ডেটায় হবে: সংখ্যা, তালিকা, সহজ শর্ত যা ঘন ঘন বদলায়।'
    aside:
      - type: when
        use:
          - 'ছাড়ের শতাংশ, কোন শহরে ডেলিভারি, কত টাকার ওপরে ফ্রি।'
        avoid:
          - 'কর হিসাব, ব্যালেন্স আপডেট, আইনি বাধ্যবাধকতা — এগুলো ভুল হলে সরাসরি ক্ষতি।'
      - type: remember
        body: 'চার্ট ডেটায়, পদ্ধতি কোডে।'
    check:
      q: 'কর হিসাবের নিয়ম আর "প্রথম অর্ডারে ১০% ছাড়" — কোনটা ডেটায় নেওয়ার ভালো প্রার্থী, কেন?'
      a: 'ছাড়ের নিয়ম। সেটা ঘন বদলায়, সহজ আর ভুলের ক্ষতি সীমিত। কর হিসাবে ভুল হলে আইনি ঝুঁকি, তাই সেটা কোডে।'

  - slug: expression-language-engine
    title: 'Symfony ExpressionLanguage দিয়ে নিয়ম চালানো'
    kind: howto
    tldr: 'নিয়মের শর্ত string হিসেবে ডেটাবেসে রাখো; ExpressionLanguage সেটা evaluate করে। শুধু ছোট facts DTO দাও, সংরক্ষণের সময় lint() দিয়ে যাচাই করো।'
    keywords: ['ExpressionLanguage', 'evaluate', 'lint', 'facts DTO', 'discount engine', 'Symfony']
    blocks:
      - type: text
        body: |
          ধরো প্রতিটা ছাড় ডেটাবেসে এক সারি: একটা শর্ত (`cart.total >= 200000 and user.firstOrder`), একটা শতাংশ আর অগ্রাধিকার। কোড শুধু সারিগুলো ঘুরে প্রথম মেলা শর্তের ছাড় দেয়। Symfony-র ExpressionLanguage এই শর্ত string-টা নিরাপদ, সীমিত ভাষায় চালায়। কিন্তু মনে রাখো, শর্ত আসলে কোড; তাই কে লিখবে তা সীমিত রাখো আর entity নয়, ছোট facts object দাও।
      - type: code
        lang: php
        file: 'src/Discount/DiscountEngine.php'
        variant: good
        code: |
          final readonly class CartFacts
          {
              public function __construct(public int $total, public int $items)
              {
              }
          }

          final class DiscountEngine
          {
              private ExpressionLanguage $language;

              public function __construct(private readonly DiscountRuleRepository $rules)
              {
                  $this->language = new ExpressionLanguage();
              }

              public function percentFor(CartFacts $cart, UserFacts $user): int
              {
                  foreach ($this->rules->activeByPriority() as $rule) {
                      $facts = ['cart' => $cart, 'user' => $user];
                      if ($this->language->evaluate($rule->expression(), $facts)) {
                          return min($rule->percent(), 30);   // কোডের ঊর্ধ্বসীমা
                      }
                  }

                  return 0;
              }
          }
        marks:
          - {line: 1, tip: 'নিয়মকে শুধু প্রয়োজনীয় তথ্য দাও: সংখ্যা আর flag। Doctrine entity দিলে নিয়ম অনেক বেশি জানতে ও ডাকতে পারে।'}
          - {line: 21, tip: 'শর্ত string-টা এখানে চলে। প্রথম যেটা মেলে, তার ছাড় প্রয়োগ হয়।'}
          - {line: 22, tip: 'ডেটায় যা-ই লেখা হোক, ৩০%-এর বেশি ছাড় কোড কখনো দেবে না। অপরিবর্তনীয় সীমা কোডে।'}
      - type: code
        lang: php
        file: 'src/Discount/RuleValidator.php'
        variant: good
        code: |
          public function assertValid(string $expression): void
          {
              try {
                  $this->language->lint($expression, ['cart', 'user']);
              } catch (SyntaxError $e) {
                  throw new InvalidRuleException('ভুল শর্ত: '.$e->getMessage(), previous: $e);
              }
          }
        marks:
          - {line: 4, tip: 'সংরক্ষণের আগেই lint। শুধু cart আর user নাম চিনবে; অন্য নাম লিখলে সাথে সাথে ধরা পড়বে।'}
    aside:
      - type: tips
        items:
          - 'প্রতি request-এ string parse না করে ExpressionLanguage-এ একটা cache pool দাও (constructor-এর আর্গুমেন্ট); parse করা ফল জমা থাকবে।'
          - 'যারা নিয়ম বদলাতে পারবে, তাদের সীমিত রাখো আর সব বদলের লগ রাখো।'
      - type: pitfalls
        items:
          - 'ExpressionLanguage-এ কোনো ব্যবহারকারীর ইনপুট (যেমন গ্রাহকের লেখা) expression হিসেবে চালানো যাবে না; কেবল বিশ্বস্ত স্টাফ।'
      - type: refs
        items:
          - {to: 'security/input-validation', label: 'ইনপুট যাচাই'}
    check:
      q: 'Entity না দিয়ে ছোট CartFacts DTO দেওয়ার কারণ কী?'
      a: 'নিয়ম শুধু যা দরকার তাই দেখতে পায়, entity-র অন্য মেথড ডাকতে পারে না। আর entity-র গঠন বদলালে ডেটাবেসে রাখা নিয়ম ভাঙে না।'

  - slug: version-and-test-rules
    title: 'নিয়মের version, test আর dry run'
    kind: howto
    tldr: 'ডেটায় নেওয়া নিয়মও কোডের মতো version, test আর অনুমোদনের মধ্য দিয়ে যাবে: নতুন version, test, পুরনো অর্ডারে dry run, তারিখ ধরে চালু, আর পুরনো version সংরক্ষণ।'
    keywords: ['rule versioning', 'rule testing', 'dry run', 'shadow mode', 'audit', 'PHPUnit DataProvider', 'valid_from']
    blocks:
      - type: text
        body: |
          নিয়ম ডেটায় গেলেও দায় কমে না। বরং এখন তুমি নিজে বানাও যা code review এমনিই দিত। একটা নিয়ম ঠিক করা মানে শুধু সারি বদলানো নয়; একটা নতুন version লেখা, যাতে পরে "অর্ডার ১০২৩ কোন নিয়মে ছাড় পেল" জানা যায়।
      - type: visual
        kind: steps
        caption: 'একটা নিয়ম বদলের নিরাপদ পথ'
        steps:
          - {title: '১. নতুন version লেখো', body: 'পুরনো সারি বদলিও না; v4 নামে নতুন সারি।', tip: 'পুরনো version থেকে যায়, তাই ফেরা আর audit দুটোই সম্ভব।'}
          - {title: '২. test চালাও', body: 'উদাহরণ-সহ test: কোন cart-এ কত ছাড় আসা উচিত।', tip: 'নিয়ম ঠিক করে লেখা হলো কি না, deploy ছাড়াই দেখা যায়।'}
          - {title: '৩. dry run', body: 'গত ৩০ দিনের অর্ডারে চালিয়ে দেখো কত ছাড় যেত।', tip: 'এতে ধরা পড়ে, নিয়ম হঠাৎ সবাইকে ছাড় দিয়ে ফেলছে কি না।'}
          - {title: '৪. অনুমোদন', body: 'দ্বিতীয় একজন দেখে নেয়।', tip: 'কোডে যেমন review, এখানে তেমন।'}
          - {title: '৫. তারিখ ধরে চালু', body: 'valid_from দিয়ে নির্দিষ্ট সময়ে।', tone: accent, tip: 'রাত ১২টায় সব কিছু নিজে থেকে বদলে যায়; হাত দিয়ে সুইচ নয়।'}
          - {title: '৬. অর্ডারে version লেখো', body: 'কোন ছাড় কোন version থেকে এল।', tip: 'অর্ডার নিয়ে প্রশ্ন এলে ঠিক কোন নিয়ম লেগেছিল বলা যায়।'}
      - type: code
        lang: php
        file: 'tests/Discount/RuleTest.php'
        variant: good
        code: |
          #[DataProvider('cases')]
          public function testRule(string $expr, int $total, bool $first, bool $expected): void
          {
              $result = (new ExpressionLanguage())->evaluate($expr, [
                  'cart' => new CartFacts($total, 3),
                  'user' => new UserFacts($first),
              ]);

              self::assertSame($expected, $result);
          }

          public static function cases(): iterable
          {
              $r = 'cart.total >= 200000 and user.firstOrder';
              yield 'প্রথম অর্ডার, ২০০০ টাকা' => [$r, 200000, true, true];
              yield 'প্রথম অর্ডার, ১৯৯৯ টাকা' => [$r, 199900, true, false];
              yield 'পুরনো ক্রেতা' => [$r, 500000, false, false];
          }
        marks:
