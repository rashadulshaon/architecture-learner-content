flashcards:
  - q: 'Business rule কী?'
    a: 'ব্যবসার সিদ্ধান্ত যা কোডে ঢোকে, যেমন কে কত ছাড় পাবে বা কোন অর্ডার আটকে রাখা হবে।'
    more: |
      ভাড়ার চার্ট আর ভাড়া নেওয়ার পদ্ধতি আলাদা: চার্ট বদলায়, পদ্ধতি বদলায় না। কিছু নিয়ম চার্টের মতো (সংখ্যা, তালিকা), কিছু পদ্ধতির মতো (জটিল হিসাব)।
    ref: weekly-discount-rules
  - q: 'কখন নিয়ম কোডে না রেখে ডেটায় রাখা যুক্তিসংগত?'
    a: 'যখন নিয়মটা ঘন ঘন বদলায়, ব্যবসার লোক বদলায়, সহজ আর ভুলের ক্ষতি সীমিত।'
    more: |
      চার প্রশ্ন: কত ঘন বদলায়, কে বদলায়, ভুলের দাম কত, কতটা জটিল। ছাড়ের শতাংশ বা ডেলিভারির এলাকা ডেটার প্রার্থী; কর হিসাব বা ব্যালেন্স আপডেট নয়।
    ref: code-or-data
  - q: 'কোন নিয়ম কোডে থাকাই ভালো?'
    a: 'যেটা ঝুঁকিপূর্ণ (টাকা, আইন, নিরাপত্তা), জটিল (শাখা, loop, অবস্থা), বা কম বদলায়।'
    more: |
      ডেটায় নিলে code review, test আর version-এর সুরক্ষা নিজে বানাতে হয়। কম বদলানো নিয়মে সেই খাটুনি কখনো উশুল হয় না। জটিল নিয়ম ডেটায় নিলে ধীরে একটা অপরীক্ষিত প্রোগ্রামিং ভাষা হয়ে ওঠে।
    ref: code-or-data
  - q: 'Symfony ExpressionLanguage কী কাজে লাগে?'
    a: 'string হিসেবে রাখা শর্ত (cart.total >= 200000) নিরাপদ, সীমিত ভাষায় চালিয়ে ফল বের করা।'
    more: |
      `$language->evaluate($expr, ['cart' => $cart])` শর্ত চালায়, আর `lint()` সংরক্ষণের আগে সিনট্যাক্স যাচাই করে। শর্ত আসলে কোড, তাই বদলানোর অধিকার সীমিত রাখো আর কোনো ব্যবহারকারীর ইনপুট এতে চালিও না।
    ref: expression-language-engine
  - q: 'নিয়মে Doctrine entity না দিয়ে ছোট facts DTO দিই কেন?'
    a: 'যাতে নিয়ম শুধু দরকারি তথ্য দেখে, অন্য মেথড ডাকতে না পারে, আর entity বদলালে সংরক্ষিত নিয়ম না ভাঙে।'
    more: |
      সংরক্ষিত নিয়ম ডেটাবেসে বহুদিন থাকে। সেগুলো `cart.getUser().getOrders()`-এর মতো গভীর ডাকের ওপর নির্ভর করলে entity-র যেকোনো পরিবর্তনে ভাঙে। facts DTO একটা স্থির চুক্তি।
    ref: expression-language-engine
  - q: 'ডেটায় রাখা নিয়ম বদলানোর নিরাপদ ধাপগুলো কী?'
    a: 'নতুন version লেখা, test, পুরনো অর্ডারে dry run, অনুমোদন, তারিখ ধরে চালু, আর অর্ডারে version লেখা।'
    more: |
      পুরনো version কখনো মুছো না; তাহলে audit আর ফেরা দুটোই সম্ভব। dry run দেখায় নিয়ম হঠাৎ কত ছাড় দিত। অর্ডারে version লেখা থাকলে "এই ছাড় কেন" প্রশ্নের উত্তর পাওয়া যায়।
    ref: version-and-test-rules
  - q: 'নিয়মের টাইপোতে বড় ক্ষতি ঠেকাতে কী করবে?'
    a: 'অপরিবর্তনীয় সীমা কোডে রাখো, যেমন min($percent, 30); আর ডেটায় সংরক্ষণের সময় validate ও lint করো।'
    more: |
      ডেটায় যা-ই লেখা হোক, কোডের সীমা ভাঙবে না। সীমা ছাড়ালে লগ আর alert, যাতে অ্যাডমিন পাতার ভুল ক্ষতির আগেই ধরা পড়ে। ডেটায় সংখ্যা, কোডে সীমা।
    ref: rules-gone-wrong

quiz:
  - q: 'কোন কোন নিয়ম ডেটায় নেওয়ার ভালো প্রার্থী?'
    hint: 'ঘন ঘন বদলায়, সহজ আর ভুলের ক্ষতি সীমিত।'
    options:
      - text: 'কত টাকার ওপরে ফ্রি ডেলিভারি'
        correct: true
        why: 'একটা সংখ্যা, ঘন বদলায়, ভুলের ক্ষতি সীমিত।'
      - text: 'কোন বিভাগের পণ্যে কত শতাংশ ছাড় (ঊর্ধ্বসীমা কোডে)'
        correct: true
        why: 'ঘন বদলায় আর ব্যবসার লোক বদলাতে পারে; সীমা কোডে থাকলে নিরাপদ।'
      - text: 'ভ্যাটের হিসাব'
