        why: 'আইনি ঝুঁকি, ভুল হলে সরাসরি ক্ষতি; কোডে, review আর test-সহ।'
      - text: 'ব্যালেন্স থেকে টাকা কাটার ক্রম'
        correct: false
        why: 'এটা পদ্ধতি, চার্ট নয়; অবস্থা আর ক্রম জড়িত, কোডেই থাকুক।'
    ref: code-or-data
  - q: 'নিচের কোডে কোন বিপদটা আছে?'
    lang: php
    code: |
      foreach ($this->rules->activeByPriority() as $rule) {
          if ($this->language->evaluate($rule->expression(), ['cart' => $cart])) {
              return $rule->percent();
          }
      }
    hint: 'ডেটায় ১০০ লেখা হলে কোডের আচরণ কী হবে?'
    options:
      - text: 'ছাড়ের কোনো ঊর্ধ্বসীমা নেই; ডেটায় ভুল সংখ্যা সরাসরি প্রয়োগ হবে'
        correct: true
        why: 'কোডে min($percent, 30)-এর মতো সীমা থাকলে টাইপোর ক্ষতি আটকে যেত।'
      - text: 'foreach-এর বদলে while ব্যবহার করা উচিত'
        correct: false
        why: 'লুপের ধরন সমস্যা নয়।'
      - text: 'evaluate() কখনো bool ফেরায় না'
        correct: false
        why: 'শর্ত bool-জাতীয় ফল দেয়; সেটা ঠিক আছে।'
      - text: 'নিয়ম ডেটাবেসে রাখা যায় না'
        correct: false
        why: 'যায়; সমস্যা সুরক্ষাহীনতায়, ডেটাবেসে থাকায় নয়।'
    ref: rules-gone-wrong
  - q: 'মার্কেটিং টিম একটা নিয়ম বদলাতে চায়। কোন ক্রমটা নিরাপদ?'
    hint: 'পুরনো ঘটনা ঘেঁটে দেখার সুযোগটা কোথায়?'
    options:
      - text: 'নতুন version লেখা, test, গত ৩০ দিনে dry run, অনুমোদন, তারিখ ধরে চালু'
        correct: true
        why: 'প্রতিটা ধাপ আলাদা ভুল ধরে; পুরনো version থাকায় ফেরা সম্ভব।'
      - text: 'সরাসরি আগের সারিতে নতুন মান বসিয়ে দেওয়া'
        correct: false
        why: 'আগের version হারায়; audit আর ফেরা দুটোই বন্ধ।'
      - text: 'অ্যাডমিন পাতায় বদলে প্রোডাকশনে সাথে সাথে চালু'
        correct: false
        why: 'test বা অনুমোদন ছাড়া টাইপো সরাসরি ক্ষতি করে।'
      - text: 'শুধু staging-এ বদলে দেখা'
