slides:
  - slug: one-slide-four-confusions
    title: 'One slide, four people, four kinds of confusion'
    kind: story
    tldr: 'A sound design explained in the wrong language lands with no one. Each listener asks a different question, so each needs a different answer.'
    keywords: ['communication', 'audience', 'stakeholder', 'explaining design', 'presenting architecture']
    blocks:
      - type: text
        body: |
          Sumi has built a good design: after payment, the remaining work goes onto a queue. She takes the same slide to four people. The engineer asks how retries will work, and she says "event-driven." Finance asks what it costs, and she says "scalable." Nobody is satisfied, and the project stalls.
      - type: visual
        kind: flow
        caption: 'One slide went to four people, and none got an answer'
        nodes:
          - {id: slide, label: 'Sumi''s slide', sub: 'event-driven, scalable', icon: file, tone: accent, col: 0, row: 1.5, tip: 'A single slide full of technology words. It answers nobody''s question.'}
          - {id: eng, label: 'Engineer', sub: 'how do retries work?', icon: code, col: 3, row: 0, tip: 'Wanted the failure path and the retries. Got one buzzword.'}
          - {id: prod, label: 'Product', sub: 'what changes for users?', icon: user, col: 3, row: 1, tip: 'Wanted to know how the user experience will change.'}
          - {id: fin, label: 'Finance', sub: 'what does it cost?', icon: money, col: 3, row: 2, tip: 'Wanted the cost. Got "scalable".'}
          - {id: aud, label: 'Auditor', sub: 'what''s the proof?', icon: shield, col: 3, row: 3, tip: 'Wanted evidence that the rules are being followed.'}
        edges:
          - {from: slide, to: eng, label: 'The engineer asked how retries work and heard "event-driven"', tone: bad}
          - {from: slide, to: prod, label: 'Product asked what changes for users and got no answer', tone: bad}
          - {from: slide, to: fin, label: 'Finance asked about cost and heard "scalable"', tone: bad}
          - {from: slide, to: aud, label: 'The auditor asked for proof and the slide had nothing', tone: bad}
      - type: points
        title: 'What went wrong'
        style: cross
        items:
          - 'The same slide was shown to four different audiences.'
          - 'Each listener came with a different question, and none got an answer.'
          - 'It had words like "event-driven" and "scalable", but no numbers and no consequences.'
      - type: metaphor
        icon: id
        title: 'One medicine, at the pharmacy'
        body: |
          Tell a patient "twice a day, after meals." Tell the doctor the dose and the gap between doses. Tell the pharmacist the batch and the expiry date. It's the same medicine and the same facts, but the words change with the listener.
      - type: quote
        body: 'One design, but the way you explain it changes with the listener.'
    aside:
      - type: story
        title: 'Finance''s three questions'
        body: |
          An engineer asking for a new cloud budget explained CPU and autoscaling. The CFO asked only three questions: what will it cost, what do we get, and what happens if we don't do it? Answering those three in one line would have won approval in 10 minutes.
      - type: problem
        body: 'This segment teaches you to explain one design to four audiences, write a one-page design doc, and run a review that doesn''t turn into a courtroom.'
    check:
      q: 'Why did Sumi''s slide fail, even though the design was right?'
      a: 'Every listener had a different question, but all got the same answer. "Event-driven" and "scalable" answer nobody''s question.'

  - slug: four-audiences
    title: 'Four audiences, four questions'
    kind: concept
    tldr: 'Engineers ask how. Product asks what changes for users. Finance asks what it costs. Regulators ask for proof.'
    keywords: ['stakeholder', 'audience', 'product', 'finance', 'regulator', 'know your audience']
    blocks:
      - type: text
        body: |
          Each audience keeps asking one question, so find out what it is before you speak. Answer it in their language and they'll trust the rest. The technical detail you care about is no use to them. The table below gives each audience's core question and what to hand them.
      - type: visual
        kind: table
        caption: 'Four audiences: what they ask, what you give'
        headers: ['Audience', 'Core question', 'Give them']
        rows:
          - cells: ['Engineer', 'How will it work, and how will it break?', 'Diagram, failure cases, trade-offs']
            tip: 'Engineers want depth. Show where it can break first; that is what they will look for anyway.'
          - cells: ['Product', 'What will users get, and when?', 'Experience changes, dates, limits']
            tip: 'To product, "queue" means nothing; "the email arrives up to 2 minutes late" means something.'
          - cells: ['Finance', 'How much money, what return, what if not?', 'Cost, gain or loss avoided, timeline']
            tip: 'Without numbers, finance can''t decide. Even if it''s an estimate, give a range.'
          - cells: ['Regulator / auditor', 'What proves we follow the rules?', 'Controls, logs, where the data lives']
            tip: 'To an auditor, "we do it properly" isn''t enough. Show a record of who did what, and when.'
      - type: quote
        body: 'Find out what question the listener came with, then open your mouth.'
    aside:
      - type: tips
        items:
          - 'Before the meeting, ask the listener: "What matters most to you in this decision?"'
          - 'Don''t make four slide decks. Write four summaries of the same design, one paragraph each.'
      - type: remember
        body: 'Engineer: how. Product: what changes. Finance: how much. Auditor: what proof.'
    check:
      q: 'Instead of explaining "autoscaling" to finance, what is better to say?'
      a: 'The approximate monthly cost, the benefit you get, and the loss if you don''t do it. Numbers and consequences, not technology.'

  - slug: one-design-four-ways
    title: 'One design, four languages'
    kind: howto
    tldr: 'The design: after payment, the rest of the work goes on a queue. Four summaries, each written as an answer to that audience''s question.'
    keywords: ['explain design', 'outbox', 'queue', 'one design four audiences', 'example']
    blocks:
      - type: text
        body: |
          Here is the design: after the customer pays, the email, invoice and accounting work moves onto a queue instead of running inside the request. Below, the same design is written for four audiences. The numbers are examples; put in your own facts.
      - type: code
        lang: text
        file: 'one-design-four-audiences.txt'
        variant: good
        code: |
          [Engineer]
          POST /checkout writes only the payment and order status, and stores an outbox
          row in the same transaction. A Messenger worker takes the rest; handlers are
          idempotent, retry 3 times, then go to the failed queue. Target: p95 from 4 s to ~300ms.

          [Product]
          Checkout will finish in 1 second instead of 4. "Order confirmed" shows
          immediately; the email can arrive up to 2 minutes late. The trade-off: the
          email is no longer instant. Goal: fewer abandoned carts.

          [Finance]
          Extra cost: 1 worker, about 8,000 taka a month (example). Expected gain: a
          share of the orders lost to slow checkout comes back. If we don't do it: losses
          grow in the sales season. Trial launch in 2 weeks.

          [Regulator / auditor]
          We don't store card data; the payment provider does. Every payment and each
          follow-up event goes into an audit log with a date, and cannot be altered. Log
          retention: as the rules require (example: 5 years).
        marks:
          - {line: 2, tip: 'For the engineer: the structure and the failure path, meaning where it writes and what happens when it breaks.'}
          - {line: 7, tip: 'For product: the user experience, and a clear statement of what is being given up.'}
          - {line: 12, tip: 'For finance: cost, gain and the price of not doing it, all with numbers.'}
          - {line: 17, tip: 'For the auditor: the evidence, meaning where the data lives and why it can''t be altered.'}
      - type: quote
        body: 'Every summary starts from the listener''s question, not from the technology.'
    aside:
      - type: pitfalls
        items:
          - 'Showing finance an estimate as if it were certain. Give a range: "6,000 to 10,000".'
          - 'Hiding the trade-off from product. If you don''t say "the email will be late", it comes back later as a surprise.'
      - type: refs
        items:
          - {to: 'messaging/background-jobs', label: 'Queues and background jobs'}
    check:
      q: 'What is the main difference in explaining the same queue design to finance and to the auditor?'
      a: 'Give finance the cost, the gain and the price of doing nothing. Give the auditor proof: where each piece of data lives, and who did what, when.'

  - slug: design-doc-rfc
    title: 'Design doc / RFC: a decision on one page'
    kind: howto
    tldr: 'A good RFC holds the problem, the options, the proposal, the risks and the ask, all in one place, so people can read it and respond.'
    keywords: ['RFC', 'design doc', 'ADR', 'proposal', 'architecture decision record']
    blocks:
      - type: text
        body: |
          A decision made out loud is forgotten later. An RFC (Request for Comments) is a page or two of writing that gives everyone a chance to respond. Copy the structure below. Clear writing is worth more than long writing.
      - type: code
        lang: text
        file: 'docs/rfc/0012-order-queue.md'
        variant: good
        code: |
          # RFC-0012: Move post-order work onto a queue
          Author: Sumi   Status: Draft   Decider: Rahim   Comments due: 20 December

          ## 1. Problem (2-3 lines)
          Checkout takes 4 seconds; customers leave when it takes more than 3.

          ## 2. Goals and non-goals
          Goal: p95 under 1 second. Non-goal: a new email design.

          ## 3. Options (at least two, including "do nothing")
          A. Do nothing  B. Fix the queries  C. Move work to a queue

          ## 4. Proposal and why
          C. With B, the delay only drops to 1.5 seconds and misses the goal.

          ## 5. Risks and the way back
          Delayed emails. A flag lets us return to the old path.

          ## 6. What I'm asking for
          Engineering and product feedback by 20 December; then Rahim decides.
        marks:
          - {line: 2, tip: 'The decider and the deadline go at the top. Otherwise an RFC stays open forever.'}
          - {line: 4, tip: 'The problem comes first. However good the solution, nobody can judge it without understanding the problem.'}
          - {line: 7, tip: 'Saying what you are not doing keeps the feedback on the main question and cuts side arguments.'}
          - {line: 10, tip: 'Without options, no one can tell whether anything else was considered. "Do nothing" is always an option.'}
          - {line: 16, tip: 'With the risks and the way back written down, the decision becomes easier to make.'}
      - type: visual
        kind: steps
        caption: 'An RFC''s journey: from writing to a decision'
        steps:
          - {title: '1. Write', body: 'Problem, options, proposal, in 1-2 pages.', tip: 'If it''s long, nobody reads it. Past 2 pages, split it.'}
          - {title: '2. Collect feedback', body: 'Set a deadline, and tell two or three people by name.', tip: 'Telling everyone means telling no one. Naming people gets you feedback.'}
          - {title: '3. Decide', body: 'When time is up, the decider writes the decision, with reasons.', tip: 'When the discussion ends, one person decides, even if not everyone agrees.'}
          - {title: '4. Keep it', body: 'Set the status to Accepted and store it in the repo.', tip: 'Six months on, a new member asks "why?"; this is the answer.'}
    aside:
      - type: tips
        items:
          - 'Write the risks of your own proposal first; an RFC whose author names its weaknesses is the one people trust more.'
          - 'For smaller decisions, use an ADR (Architecture Decision Record): context, decision, consequences, in three paragraphs.'
      - type: refs
        items:
          - {to: 'thinking/documentation', label: 'Architecture documentation'}
          - {to: 'thinking/design-review', label: 'Design review'}
    check:
      q: 'Why does the "Options" section of an RFC include "do nothing"?'
      a: 'It is always a real option. Without it, the reader can''t tell whether the work is really worth its price.'

  - slug: review-not-trial
    title: 'Run a review, not a trial'
    kind: compare
    tldr: 'A review judges the design, not the person. With the right rules, authors don''t hide weaknesses; they mention them up front.'
    keywords: ['design review', 'blameless', 'feedback', 'review culture', 'architecture review']
    blocks:
      - type: text
        body: |
          Rahim is presenting his design in a review, and someone asks, "How did you even come up with this?" He gets defensive. Next time, he'll come to the review without mentioning the weak spots. If a review is a courtroom, the author's only goal is not to get caught.
      - type: visual
        kind: compare
        caption: 'A courtroom review vs a collaborative review'
        columns:
          - title: 'Courtroom'
            tone: bad
            icon: cross
            tip: 'The questions are aimed at the person. The author gets scared and hides information.'
            items:
              - '"Why didn''t you think of this?"'
              - 'The reviewer hunts for fault'
              - 'Ends without a decision or next steps'
          - title: 'Collaboration'
            tone: good
            icon: check
            tip: 'The questions are aimed at the design. The author states the weaknesses first.'
            items:
              - '"What happens if this part breaks?"'
              - 'The reviewer looks for risks and offers alternatives'
              - 'Ends with a decision and an action list'
      - type: code
        lang: text
        file: 'A 30-minute review agenda'
        variant: good
        code: |
          0-5    Author: the problem and proposal, and the part they doubt most
          5-15   Reviewers: questions (questions first, opinions later)
          15-25  Discussion: risks and alternatives; the author takes notes, doesn't argue
          25-30  Decision: Accept / Accept with changes / Review again; action list
        marks:
          - {line: 1, tip: 'When the author names the doubtful part, the review''s attention goes there.'}
          - {line: 2, tip: 'Asking first cuts misunderstandings; opinions come afterwards.'}
          - {line: 4, tip: 'Choosing one of three defined outcomes keeps the review from dangling.'}
      - type: quote
        body: 'Question the design, not the designer.'
    aside:
      - type: story
        title: 'The hidden weakness'
        body: |
          On one team, the author knew his migration had a risk but didn't mention it in the review, because last time he'd taken harsh criticism. The risk was caught in production. In a safe review culture, he would have said it up front.
      - type: tips
        items:
          - 'Starting a comment with "Tell me if I''ve misunderstood" makes the question easier to take.'
          - 'At the end of the review, ask one person to send out the action list.'
    check:
      q: 'Instead of "How did you even come up with this?", what is better to say in a review?'
      a: 'A question about the design, such as "What happens if this part breaks?" or "Did you look at this alternative?" The question points at the design, not the person.'

flashcards:
  - q: 'How should you explain the same design to four audiences?'
    a: 'Start with each one''s core question: how for the engineer, what changes for product, how much for finance, and proof for the auditor.'
    more: |
      You don't need four different decisions for four audiences; the design is the same. Only the order and the language change. Start with the answer to the listener's question, and they will listen to the rest.
    ref: four-audiences
  - q: 'What three questions does a finance audience ask?'
    a: 'How much will it cost? What do we get? What is the loss if we don''t do it?'
    more: |
      Answer all three in one line, with numbers. If a number is an estimate, give a range (for example 6,000 to 10,000). Technical detail is beside the point for finance; a decision needs a comparison of cost and risk.
    ref: four-audiences
  - q: 'What mistake is most common when explaining a design to a product manager?'
    a: 'Hiding what is being given up in the user experience, or describing it in technology words.'
    more: |
      Say "the email will arrive 2 minutes late" and product can decide. Say "we'll use a queue" and they can't. If you hide the trade-off, it comes back later as a user complaint and a surprise.
    ref: one-design-four-ways
  - q: 'What does an auditor or regulator want?'
    a: 'Proof: who did what and when, where the data lives, and how each control works.'
    more: |
      Saying "we work securely" isn't enough. You have to show the audit log, the access controls and a record of where the data sits. If you think about this at design time, you won't scramble during the audit.
    ref: four-audiences
  - q: 'What does RFC stand for, and what is it for?'
    a: 'Request for Comments: a 1-2 page document with the problem, options, proposal and risks, used to gather feedback and reach a decision.'
    more: |
      Spoken decisions get lost over time. With an RFC on file, even a new member six months later can see why a decision was made. Put the decider and the feedback deadline at the very top.
    ref: design-doc-rfc
  - q: 'Which option should an RFC always include?'
    a: '"Do nothing", so the reader can see whether the work is really worth its price.'
    more: |
      Many proposals show just one solution, which makes it look as if nothing else was considered. Show at least two options, including "do nothing", and the reader can compare for themselves.
    ref: design-doc-rfc
  - q: 'What is an ADR?'
    a: 'Architecture Decision Record: a short note with a decision''s context, the decision and its consequences, stored in the repo.'
    more: |
      An RFC is for a larger proposal; an ADR is the record kept once the decision is made. Each ADR is a few lines: what was decided, why, and what follows. Keeping it next to the code makes it easy to find.
    ref: design-doc-rfc
  - q: 'What harm comes when a design review turns into a courtroom?'
    a: 'The author hides weaknesses out of fear, so the real risk is only caught in production.'
    more: |
      A question aimed at the person ("why didn't you think of this?") sends the author into self-defence. A question aimed at the design ("what if it breaks?") gets them to name the weak spot themselves. More in [[thinking/design-review|design review]].
    ref: review-not-trial

quiz:
  - q: 'You are taking a proposal for a new cloud budget to the CFO. Which opening is best?'
    hint: 'What are the CFO''s three core questions?'
    options:
      - text: 'An explanation of how autoscaling works from CPU load'
        correct: false
        why: 'That answers an engineer''s question. Finance doesn''t need it for the decision.'
      - text: 'The approximate monthly cost, the benefit you get, and the loss if you don''t do it'
        correct: true
        why: 'Finance looks for answers to exactly these three questions: how much, what do we get, what if not.'
      - text: 'A feature comparison of the cloud providers'
        correct: false
        why: 'A comparison may be needed later, but first they need the numbers and consequences for the decision.'
      - text: 'Say "this is modern best practice"'
        correct: false
        why: 'That is neither a cost nor a gain, so it doesn''t help the decision.'
    ref: four-audiences
  - q: 'In the queue design, emails arrive 2 minutes late. How do you tell the product manager?'
    hint: 'Product wants to know what is being given up.'
    options:
      - text: '"We''re moving to an async model, with eventual consistency."'
        correct: false
        why: 'Technology words that say nothing about the user experience.'
      - text: 'There is no need to say anything; it is a technical matter'
        correct: false
        why: 'The late email is visible to users. If product isn''t told, a surprise follows.'
      - text: '"Checkout will finish in 1 second, but the receipt email may arrive up to 2 minutes late."'
        correct: true
        why: 'It states both the gain and the trade-off in the user''s language, so product can decide.'
      - text: '"Let us know if there are problems with email."'
        correct: false
        why: 'That doesn''t acknowledge the trade-off. It passes the responsibility on.'
    ref: one-design-four-ways
  - q: 'Which of these belong in a good RFC?'
    hint: 'What does a reader need in order to decide?'
    options:
      - text: 'A description of the problem and the goals'
        correct: true
        why: 'Without understanding the problem, nobody can judge a proposal.'
      - text: 'At least two options, including "do nothing"'
        correct: true
        why: 'Showing the options shows the proposal was thought through.'
      - text: 'Risks and the way back'
        correct: true
        why: 'The decider wants to know how much a mistake would cost and how to undo it.'
      - text: 'The full code of every class'
        correct: false
        why: 'Code makes the RFC long, and the reader loses the main decision. Code belongs in the PR.'
    ref: design-doc-rfc
  - q: 'Rakib''s RFC has been hanging for two weeks and nobody is deciding. What went wrong?'
    hint: 'Which two things are missing from the top of the RFC when this happens?'
    options:
      - text: 'The decider''s name and the feedback deadline were never written'
        correct: true
        why: 'Without these, nobody takes responsibility, and nobody knows when the discussion ends.'
      - text: 'The RFC was too short'
        correct: false
        why: 'A short RFC is easier to read. Delay comes from unclear ownership.'
      - text: 'More people should have been asked for feedback'
        correct: false
        why: 'More people means more argument. The real problem is the missing decider.'
      - text: 'There was no diagram'
        correct: false
        why: 'A diagram helps, but the reason it stalled is the missing structure.'
    ref: design-doc-rfc
  - q: 'In a review, someone said, "How did you even come up with this?" How should they have said it?'
    hint: 'Is the question aimed at the person or at the design?'
    options:
      - text: '"That''s silly, think again."'
        correct: false
        why: 'An even harsher personal attack. The author will hide weaknesses.'
      - text: 'Say nothing, and mention it separately after the review'
        correct: false
        why: 'The whole team needs to know about the risk. Raised in private, the discussion is lost.'
      - text: '"What does this part do if the payment gateway is slow? Did you look at any alternatives?"'
        correct: true
        why: 'The question is about one failure path in the design, and it gives room to think of alternatives.'
      - text: 'Stay quiet until the review is over'
        correct: false
        why: 'If you stay quiet, the risk goes uncaught. The problem is the tone, not the question.'
    ref: review-not-trial
  - q: 'You are explaining the new payment design to a regulator''s auditor. What helps most?'
    hint: 'What proof does an auditor want?'
    options:
      - text: 'How fast checkout will be'
        correct: false
        why: 'That is product''s concern. The auditor''s question is about following the rules.'
      - text: 'Where card data is kept, and who can view each transaction''s audit log, and when'
        correct: true
        why: 'It is proof of where the data sits and what controls exist, which is what the auditor wants to verify.'
      - text: 'The team size and the sprint plan'
        correct: false
        why: 'This is not an audit matter. It is internal to the organisation.'
      - text: 'The assurance "we are very careful"'
        correct: false
        why: 'An assurance is not proof. An auditor wants to see records.'
    ref: four-audiences
