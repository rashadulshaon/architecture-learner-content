slides:
  - slug: three-week-debate
    title: 'Three weeks of debate, zero decisions'
    kind: story
    tldr: 'Not deciding has a price: features stall, the loudest voice wins, and the reasoning gets lost.'
    keywords: ['decision making', 'analysis paralysis', 'decisions', 'debate', 'trade-off']
    blocks:
      - type: text
        body: |
          Monday stand-up. Sumi says, "Let's use RabbitMQ for the queue." Rakib says, "We already have Redis. Why add something new?" Three weeks later, nobody has said anything wrong, and nobody has decided anything either. The feature has been stuck the whole time.
      - type: points
        title: 'What not deciding costs'
        style: cross
        items:
          - 'The feature stays stuck and the business earns later.'
          - 'Whoever speaks loudest wins, not whoever has the better reasoning.'
          - 'Everyone digs in on their favourite, and nobody asks "why" any more.'
      - type: visual
        kind: compare
        caption: 'A debating meeting vs a deciding meeting'
        columns:
          - title: 'Debating meeting'
            tone: bad
            icon: cross
            tip: 'Everyone fights for their own pick, and nobody has agreed on what the options will be judged by.'
            items:
              - 'Starts with "I feel that…"'
              - 'No agreed criteria'
              - 'Ends with "let''s see later"'
          - title: 'Deciding meeting'
            tone: good
            icon: check
            tip: 'The criteria are agreed first, then the options are measured, so everyone looks at the same scale.'
            items:
              - 'Criteria and weights set first'
              - 'Options side by side on one page'
              - 'One decision-maker, with a date'
      - type: quote
        body: 'Not deciding is also a decision. It''s just one nobody chose on purpose.'
    aside:
      - type: story
        title: 'The notification queue'
        body: |
          At one startup, the argument over which queue to use ran for a month. Then the CTO wrote four criteria on a single page and made the call within an hour. For the next three months, nobody questioned it.
      - type: problem
        body: 'This segment shows how to turn an argument into criteria, reach a decision, and recover quickly when the decision turns out wrong.'
    check:
      q: 'Nobody is wrong, yet three weeks went by without a decision. What is the core gap?'
      a: 'The criteria were never agreed in advance, and nobody owned the decision. So the debate was only a contest of preferences.'

  - slug: trade-off-everywhere
    title: 'All the good things never come together'
    kind: concept
    tldr: 'Every option gives you something and costs you something. The question is not "which is best?" but "which quality do we need most?"'
    keywords: ['trade-off', 'criteria', 'which option is better', 'weighing options', 'decision criteria']
    blocks:
      - type: metaphor
        icon: truck
        title: 'Going home for Eid'
        body: |
          Before Eid, you can head home by bus, train or launch (the river ferry). The bus ticket is easy to get, but you may sit in a traffic jam. The train arrives on time, but its tickets are hard to find. Which one is "best" depends on whether time, cost or comfort matters most to you.
      - type: visual
        kind: table
        caption: 'The Eid journey: three options, four criteria'
        headers: ['', 'Bus', 'Train', 'Launch']
        rows:
          - cells: ['Getting a ticket', 'Easy', 'Hard', 'Medium']
            tip: 'The bus wins on this criterion. But an easy ticket does not mean a good journey.'
          - cells: ['Arrival certainty', 'Low (traffic)', 'High', 'Medium']
            tip: 'For someone who must be home by a fixed time, this is the train''s biggest advantage.'
          - cells: ['Cost', 'High (Eid fares)', 'Low', 'Medium']
            tip: 'If keeping costs down is the goal, the train comes out ahead.'
          - cells: ['Comfort', 'Medium', 'Medium', 'High (cabin)']
            tip: 'None of them wins on every criterion. That is what a trade-off is.'
      - type: quote
        body: 'There is no best option. There is only the option that best fits your criteria.'
    aside:
      - type: tips
        items:
          - 'Write down the criteria before you look at the options. Do it the other way round and you''ll be tempted to build criteria that favour your pick.'
          - 'Keep at least two options. "Do nothing" counts as one.'
      - type: refs
        items:
          - {to: 'thinking/what-is-architectural', label: 'Which decisions deserve more time'}
    check:
      q: 'Bus, train or launch: why is there no single answer to "which is best?"'
      a: 'Because none of them wins on every criterion. The answer depends on whether time, cost or comfort matters most to you.'

  - slug: decision-matrix
    title: 'Decision matrix: weighing options on one page'
    kind: howto
    tldr: 'Write the criteria, give each a weight, score each option, multiply and add. Then change the weights to see whether the result holds.'
    keywords: ['decision matrix', 'weighted scoring', 'scoring options', 'sensitivity', 'Messenger transport']
    blocks:
      - type: text
        body: |
          Let's put Sumi and Rakib's debate on one page. There are three options for the Symfony Messenger transport. Weights run from 1 to 5, and so do the scores. Each total below is the sum of score times weight.
      - type: code
        lang: text
        file: 'docs/decisions/queue-transport.txt'
        variant: good
        code: |
          Question: Which Messenger transport?   Decider: Sumi   Date: 12 December

          Criterion (weight)          Doctrine   Redis   RabbitMQ
          ----------------------------------------------
          Easy to operate (3)            5         4        2
          Messages never lost (3)        4         3        5
          Team experience (2)            4         4        2
          Future throughput (2)          2         4        5
          ----------------------------------------------
          Total                         39        37       35

          Sensitivity: raise the weight of "future throughput" from 2 to 5 and
          Doctrine 45, Redis 49, RabbitMQ 50 - the winner changes.

          Decision: Doctrine transport. We handle fewer than 2,000 messages a day.
          Revisit if: volume passes 100,000 a day, or a message is ever lost.
        marks:
          - {line: 3, tip: 'The weights are fixed before any scoring. Otherwise you''ll be tempted to change them to help your favourite win.'}
          - {line: 10, tip: 'Take Doctrine: 3×5 + 3×4 + 2×4 + 2×2 = 15 + 12 + 8 + 4 = 39.'}
          - {line: 12, tip: 'When the totals are close, the decision hangs on the weights. Change them and see whether the result holds.'}
          - {line: 13, tip: 'The winner changed, so the real discussion is about weights: how much do we care about growth we may never reach?'}
          - {line: 16, tip: 'Both the reason and the trigger for rethinking are written down, so someone asking in six months gets an answer.'}
      - type: visual
        kind: bars
        caption: 'Same options, different weights, different winner'
        items:
          - {label: 'Doctrine (original)', value: 39, display: '39', tone: accent, tip: 'Wins under the first weights: easy operation and team experience count for a lot here.'}
          - {label: 'Redis (original)', value: 37, display: '37', tone: muted, tip: 'Only 2 points behind, which means close to a tie.'}
          - {label: 'RabbitMQ (original)', value: 35, display: '35', tone: muted, tip: 'Behind on operation and experience, so third.'}
          - {label: 'Doctrine (throughput 5)', value: 45, display: '45', tone: muted, tip: 'Same scores, new weight: Doctrine gains only a little, because it scores low on throughput.'}
          - {label: 'RabbitMQ (throughput 5)', value: 50, display: '50', tone: good, tip: 'Give future throughput more weight and RabbitMQ wins.'}
      - type: quote
        body: 'A matrix doesn''t find the truth. It only shows which assumptions each decision rests on.'
    aside:
      - type: pitfalls
        items:
          - 'Numbers are not science. They are estimates made by judgement, so write the reasoning next to them.'
          - 'Skip the matrix for a choice you can undo in a day. Pick one, ship it and learn.'
          - 'With more than 10 criteria, the two or three that really matter get lost.'
      - type: remember
        body: 'Criteria first, then weights, then scores. Finally, change the weights and see whether the result holds.'
      - type: refs
        items:
          - {to: 'thinking/design-review', label: 'Bringing a decision to review'}
    check:
      q: 'Two options have nearly equal totals in a matrix. What is the next step?'
      a: 'Change the weights and see whether the winner changes. If it does, discuss the weights, because that is where the real disagreement is.'

  - slug: decide-under-uncertainty
    title: 'Deciding without all the facts: which way does the door swing?'
    kind: compare
    tldr: 'Make reversible decisions fast and irreversible ones slowly. Waiting for every fact means the chance is gone.'
    keywords: ['uncertainty', 'two-way door', 'reversible', 'incomplete information', 'assumption']
    blocks:
      - type: text
        body: |
          Eid train tickets go on sale at 8 a.m. There is no way to know in advance how big the crowd at the counter will be. If you wait, the tickets sell out, so you have to buy on a guess. In software, 100% of the facts never arrive either. The real question is whether you can undo the decision if it turns out wrong.
      - type: visual
        kind: compare
        caption: 'Two kinds of doors, two kinds of speed'
        columns:
          - title: 'Reversible (decide fast)'
            tone: good
            icon: check
            tip: 'A mistake here costs little. It''s better to move fast and learn.'
            items:
              - 'New behaviour behind a feature flag'
              - 'Swapping a library'
              - 'A one-week experiment (spike)'
          - title: 'Irreversible (decide slowly)'
            tone: bad
            icon: warning
            tip: 'A mistake here takes months to fix. So take time to think, and ask others.'
            items:
              - 'Public API responses'
              - 'The data model, ID types'
              - 'Getting locked into a database or cloud'
      - type: points
        title: 'Five rules for deciding under uncertainty'
        style: number
        items:
          - 'First, decide which way the door swings.'
          - 'For reversible decisions, go ahead once you have about 70% of the facts.'
          - 'For irreversible ones, write an RFC and let two or three people review it before you commit.'
          - 'Write down the assumptions you are making.'
          - 'Decide in advance what sign will make you rethink.'
    aside:
      - type: story
        title: 'The ID type'
        body: |
          A team stored order IDs as plain counting numbers (1, 2, 3...) because "we need to move now". Two years later, those IDs had spread through their partners' systems. Changing them took six months. One afternoon of thought at the start, and a random ID like a UUID, would have cost almost nothing. A door that doesn't swing back should never have been walked through in a hurry.
      - type: terms
        items:
          - {term: 'Feature flag', meaning: 'A switch in configuration that turns a feature on or off without a new deploy.'}
          - {term: 'Spike', meaning: 'A short, throwaway experiment whose only job is to teach you something.'}
      - type: refs
        items:
          - {to: 'thinking/reversible-decisions', label: 'Can you walk back through the door?'}
    check:
      q: 'Which decision deserves more time: a new button behind a feature flag, or changing a public API response?'
      a: 'The public API response. Changing it breaks mobile apps and partners, and you can''t take it back. The button can be switched off with the flag in a minute.'

  - slug: risk-prioritization
    title: 'The risk list: impact × likelihood'
    kind: howto
    tldr: 'You can''t handle every risk. Score each one''s likelihood and impact from 1 to 5, multiply, and tackle the biggest first.'
    keywords: ['risk register', 'impact likelihood', 'risk', 'risk matrix', 'mitigation']
    blocks:
      - type: text
        body: |
          A pharmacy owner doesn't stock every medicine equally. A medicine that is rarely needed but fatal to be without comes first. Risks work the same way: pick the big ones by combining likelihood and impact. Write them down in a risk register.
      - type: code
        lang: text
        file: 'docs/risk-register.txt'
        variant: good
        code: |
          # Risk                         Likelihood  Impact  Score  Action               Owner
          R1 Payment gateway down 2 hrs       3         5      15   circuit breaker +    Rakib
                                                                    "try again later" msg
          R2 Migration locks the table        3         4      12   run on a quiet night, Sumi
                                                                    try on staging first
          R3 Only expert is on leave          4         2       8   write a runbook      Rahim
          R4 Complaints about login colour    5         1       5   do nothing           -

          Score = likelihood × impact (1-5 × 1-5)
          Rule: 12 or more -> work on it this sprint. 6-11 -> backlog, with a date.
                5 or less -> accept it knowingly.
        marks:
          - {line: 2, tip: 'The highest score, so it comes first. The likelihood is only medium, but the impact is enormous.'}
          - {line: 6, tip: 'Likelihood is high but impact is small, so the score is low. A runbook is a cheap fix here.'}
          - {line: 7, tip: '"Do nothing" is also a decision. Written down, it gives you an answer when someone asks later.'}
          - {line: 10, tip: 'With the rules agreed in advance, there is less arguing about which work to pick by score.'}
      - type: visual
        kind: bars
        caption: 'Risk scores (likelihood × impact), maximum 25'
        items:
          - {label: 'R1 gateway down', value: 15, display: '15', tone: bad, tip: 'The biggest risk: if payments fail, revenue stops.'}
          - {label: 'R2 migration lock', value: 12, display: '12', tone: warn, tip: 'By the rule, this is also work for this sprint.'}
          - {label: 'R3 expert on leave', value: 8, display: '8', tone: warn, tip: 'Important, but there is a cheap fix: a runbook.'}
          - {label: 'R4 login colour', value: 5, display: '5', tone: muted, tip: 'A small risk. Accepting it is reasonable.'}
    aside:
      - type: pitfalls
        items:
          - 'Listing only what frightens you. What is uncomfortable but real gets left out.'
          - 'Scores are rough guesses. Don''t spend an hour arguing whether something is a 3 or a 4.'
          - 'Writing it once and forgetting it. Review the register every month.'
      - type: remember
        body: 'Likelihood × impact = priority. Every risk gets one owner and one action.'
      - type: terms
        items:
          - {term: 'Circuit breaker', meaning: 'A switch that stops calling a broken service for a while, so one failure doesn''t drag everything else down.'}
          - {term: 'Runbook', meaning: 'A step-by-step page, "if X breaks, do this", so anyone on the team can fix it, not just the expert.'}
    check:
      q: 'R3 has a likelihood of 4, so why is its score low, and what was done about it?'
      a: 'Its impact is only 2, so 4×2 = 8. A cheap action was taken instead of spending a lot: writing a runbook.'

  - slug: admit-error-fast
    title: 'When you spot a mistake: the sooner you admit it, the cheaper it is'
    kind: pitfall
    tldr: 'Carrying on down the wrong path because you''ve already spent a lot is the sunk cost trap. Say it fast, reverse, and write down the lesson.'
    keywords: ['sunk cost', 'blameless', 'admit mistake', 'owning errors', 'postmortem']
    blocks:
      - type: text
        body: |
          Rakib has spent three months building his own search module. Now it turns out a standard Symfony approach does the same job. He thinks, "I've worked so hard. How can I throw it away?" That thought is the sunk cost fallacy: what's already spent won't come back, so it has no place in the calculation of the future.
      - type: visual
        kind: steps
        caption: 'Four steps after you spot a mistake'
        steps:
          - {title: '1. Say it plainly', body: 'Tell the team: "I found a mistake, and it was my decision."', tip: 'Saying it first builds trust. If someone else finds it, it looks like it was being hidden.'}
          - {title: '2. Stop the damage', body: 'Spend nothing more yet. First find a way back.', tip: 'Stop the bleeding before repairing: turn off the feature flag, roll back, or pause the work.'}
          - {title: '3. Weigh what remains', body: 'Compare only what it costs from now: to finish vs to replace.', tip: 'The three months already spent are equal on both sides, so leave them out of the calculation.'}
          - {title: '4. Write the lesson', body: 'A blameless postmortem: what happened, why, and what will change.', tip: 'Look for the gap in the process, not someone to blame. Otherwise next time everyone will hide mistakes.'}
      - type: code
        lang: text
        file: 'sunk-cost-check.txt'
        variant: good
        code: |
          Already spent: 12 weeks. Gone on both paths, so leave it out of the sum.

          Path A, finish our own search module:      4 more weeks, and we maintain it for good
          Path B, switch to the standard Symfony way: 1 week, and it is maintained for us

          Cheaper from today: B (1 week vs 4). Switch, and write down why.
          Flip the numbers (A = 1 week, B = 4) and the answer flips: finish it.
        marks:
          - {line: 1, tip: 'The 12 weeks are identical whether you carry on or stop, so they cannot tip the choice.'}
          - {line: 3, tip: 'Only the future cost of each path goes in the comparison.'}
          - {line: 7, tip: 'The rule is the comparison, not "always throw it away". Sometimes finishing is cheaper.'}
      - type: quote
        body: 'Admitting a mistake is cheapest today. Every day it gets dearer.'
    aside:
      - type: story
        title: 'Who spoke first'
        body: |
          At one team, a bad migration wiped some order data. The junior developer reported it himself within ten minutes. By the next few hours everything was restored from backup. Word got around the next day. Had it been hidden, the damage could have run on for a week.
      - type: tips
        items:
          - 'Thank a junior who admits a mistake instead of punishing them. Otherwise nobody will report the next one.'
          - 'Learn to say, "I misjudged it, and now I know." It makes you more credible as a leader.'
      - type: refs
        items:
          - {to: 'observability/incident-response', label: 'The postmortem after an incident'}
    check:
      q: '"I''ve worked on it for three months, so let''s carry on." What is wrong with this reasoning?'
      a: 'The time already spent won''t come back either way. The decision should rest on the remaining cost and the future benefit.'

flashcards:
  - q: 'What is a decision matrix?'
    a: 'A grid that compares options on one page, scoring each against weighted criteria.'
    more: |
      First you agree the criteria (for example cost, security, time) and give each a weight. Then you score every option on each one. Score times weight, summed, gives the total. That moves the argument from "my favourite" to "which criterion matters more".
    ref: decision-matrix
  - q: 'Why must the criteria weights be fixed before scoring?'
    a: 'Otherwise you''re tempted to change the weights so your favourite wins, and the result is decided in advance.'
    more: |
      Arranging the criteria in favour of the option you like happens without you noticing. Writing the weights down and getting the team to agree first blocks that bias. If people disagree about a weight, that is the moment to discuss it.
    ref: decision-matrix
  - q: 'What is a sensitivity check, and why do it?'
    a: 'Changing the weights to see if the winner changes. If it does, the decision hangs on an assumption about the weights.'
    more: |
      When the totals are close, a small change in weights can flip the result. That shows the real disagreement is not about the options but about which criterion matters more. Discussing that makes the decision stronger.
    ref: decision-matrix
  - q: 'Which decisions can be made quickly, and which slowly?'
    a: 'Reversible ones (flag, library) quickly. Irreversible ones (public API, data model) slowly, and with discussion.'
    more: |
      When the cost of reversing is low, you can learn even from a mistake, so delay only wastes the chance. When reversing takes months, give yourself time to think and ask others. More in [[thinking/reversible-decisions|reversible decisions]].
    ref: decide-under-uncertainty
  - q: 'Why write down your assumptions when deciding under uncertainty?'
    a: 'When real data arrives, you can check it against them, see which one was wrong, and know when to revisit the decision.'
    more: |
      If the decision notes "we assume 2,000 messages a day", everyone knows it's time to rethink the moment the number is passed. If it isn't written down, the assumption lives in one person's head, and when they leave, the reason goes with them.
    ref: decide-under-uncertainty
  - q: 'How is a risk score calculated?'
    a: 'Likelihood × impact, each scored 1 to 5. Handle the larger scores first.'
    more: |
      When likelihood is high but impact is small (an expert on leave), a cheap action is enough. When likelihood is low but impact is huge (payments down), it still needs attention. Taking both together makes the priority clear.
    ref: risk-prioritization
  - q: 'What does it mean to "accept" a risk?'
    a: 'To decide knowingly that you will do nothing about it, and to write that down.'
    more: |
      You can't remove every risk, and you don't need to. But quietly ignoring a risk is not the same as accepting it in writing. A written acceptance shows someone thought it through, and lets you look again if circumstances change.
    ref: risk-prioritization
  - q: 'What is the sunk cost fallacy?'
    a: 'Carrying on down the wrong path because you''ve already spent on it. The decision should rest only on future cost and benefit.'
    more: |
      Three months of effort won't come back, whether you carry on or throw it away. So the new question is: from here, what does it cost to finish, and what does the alternative cost? Pick the cheaper one. It feels hard because it means admitting your earlier decision was wrong.
    ref: admit-error-fast
  - q: 'You''ve spent 12 weeks on a module. Finishing needs 4 more weeks; a standard replacement needs 1. What now?'
    a: 'Switch. Compare only the future: 4 weeks against 1. The 12 weeks are gone either way. If the numbers were the other way round, you would finish.'
    more: |
      The rule is not "always drop what you built". It is "judge each path by what is still to be paid". Often that means switching, and sometimes it means finishing. Either way, write down the numbers you used.
    ref: admit-error-fast

quiz:
  - q: 'Your team has argued Redis vs RabbitMQ for 3 weeks and nobody is deciding. As team lead, what do you do first?'
    hint: 'Is the argument about the options, or about what to judge them by?'
    options:
      - text: 'Ask everyone to go with the most senior person''s preference'
        correct: false
        why: 'When rank decides, the reasoning is lost, and the others don''t want to stand behind the result later.'
      - text: 'Agree criteria and weights, build a one-page decision matrix, then name one decision-maker'
        correct: true
        why: 'The debate moves from preferences to criteria, and one person takes responsibility, with a date.'
      - text: 'Give everyone another week to research'
        correct: false
        why: 'Without criteria, extra research just becomes new ammunition for the argument. It never reaches a decision.'
      - text: 'Run both and see later'
        correct: false
        why: 'Running two systems adds cost and complexity. You''ve only postponed the decision.'
    ref: three-week-debate
  - q: 'In a matrix, Doctrine scores 39 and Redis 37. What is the wisest next step?'
    hint: 'The gap is only 2 points.'
    options:
      - text: 'Doctrine won, end of discussion'
        correct: false
        why: 'A 2-point gap is within the error of the estimates. Don''t be confident about it.'
      - text: 'Re-score so Redis wins'
        correct: false
        why: 'Bending the result to your preference defeats the whole purpose of a matrix.'
      - text: 'Change the weights to check sensitivity, and discuss which assumption the result hangs on'
        correct: true
        why: 'When the results are close, the real argument is about weights or assumptions, not the options.'
      - text: 'Drop the matrix and take a vote'
        correct: false
        why: 'A vote brings preferences back and loses the transparency of the criteria.'
    ref: decision-matrix
  - q: 'Which of these decisions deserve more thinking time?'
    hint: 'How hard would it be to undo in six months?'
    options:
      - text: 'Changing the structure of a public API response'
        correct: true
        why: 'Mobile apps and partners depend on it. Changing it breaks them, so it is hard to undo.'
      - text: 'Switching the main database engine'
        correct: true
        why: 'In a system full of data, it is months of work and a big risk.'
      - text: 'Turning on a new button behind a feature flag'
        correct: false
        why: 'Turning the flag off restores the old state. Undoing takes a minute, so decide quickly.'
      - text: 'Renaming a helper method'
        correct: false
        why: 'It can be reverted with a single commit today. It isn''t expensive.'
    ref: decide-under-uncertainty
  - q: 'Sumi wants to launch a feature-flag experiment with 60% of the facts. Rakib says, "Not until we are 100% sure." Who is right?'
    hint: 'Can you walk back through the door?'
    options:
      - text: 'Rakib, because someone will be blamed if it goes wrong'
        correct: false
        why: 'For a reversible decision, waiting for 100% certainty loses the opportunity, and a mistake costs little.'
      - text: 'Sumi, because the flag can be switched off to go back. The sign that should trigger a reversal ought to be written down first'
        correct: true
        why: 'In a small, reversible experiment, learning is the payoff. Written assumptions and triggers cut the risk further.'
      - text: 'Neither. You should stop until more data arrives'
        correct: false
        why: 'All the facts never arrive. Waiting is also a decision, and it has a price.'
    ref: decide-under-uncertainty
  - q: 'Your risk register has four risks. Which do you tackle first?'
    hint: 'Work out likelihood × impact.'
    options:
      - text: 'Complaints about the login page colour (likelihood 5, impact 1)'
        correct: false
        why: 'The likelihood is high but the impact is small, so the score is only 5.'
      - text: 'Only expert on leave (likelihood 4, impact 2)'
        correct: false
        why: 'The score is 8. It matters, but a cheap action like a runbook is enough.'
      - text: 'Payment gateway down for 2 hours (likelihood 3, impact 5)'
        correct: true
        why: 'The score is 15, the top of the list. The loss from stopped revenue is enormous.'
      - text: 'Whichever sounds scariest'
        correct: false
        why: 'Priorities should come from the measured score, not from fear.'
    ref: risk-prioritization
  - q: 'Two months in, Rakib realises the library he chose doesn''t suit the team, though he has written a lot of code with it. What is the best step?'
    hint: 'What is already spent won''t come back on either path.'
    options:
      - text: 'Say nothing and carry on, so the time isn''t wasted'
        correct: false
        why: 'This is the sunk cost trap: spending on the wrong path just keeps growing.'
      - text: 'Admit the mistake himself and weigh what remains: the cost to finish vs the cost to replace'
        correct: true
        why: 'Speaking first builds trust, and comparing only future costs leads to the right decision.'
      - text: 'Wait for someone else to notice'
        correct: false
        why: 'The longer you wait, the dearer reversing gets, and a hidden mistake that''s found costs you trust.'
      - text: 'Blame the library and tell the team so'
        correct: false
        why: 'Dodging responsibility destroys trust in your leadership and loses the lesson.'
    ref: admit-error-fast
