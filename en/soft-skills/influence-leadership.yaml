slides:
  - slug: right-but-ignored
    title: 'The design is right, but nobody is listening'
    kind: story
    tldr: 'You can build influence without a title. Being right isn''t enough; people listen to the person they trust.'
    keywords: ['influence', 'leadership', 'without authority', 'persuasion', 'trust']
    blocks:
      - type: text
        body: |
          Sumi realises that direct database queries to the order service are scattered everywhere and will break soon. She posts in Slack, "This needs fixing." Nobody replies. Six months later, exactly that breaks, and everyone says, "You should have told us!" She did. But she never brought anyone along.
      - type: metaphor
        icon: users
        title: 'The captain of the neighbourhood cricket team'
        body: |
          Nobody appointed the captain of the street team. Yet everyone listens to him, because he plays alongside them, takes the risks first, and explains what needs to happen on the field. Influence doesn't come from a title. It comes from trust.
      - type: visual
        kind: compare
        caption: 'The power of position vs the power of influence'
        columns:
          - title: 'Power of position'
            tone: muted
            icon: lock
            tip: 'You can give orders, but people won''t do the work wholeheartedly.'
            items:
              - '"The manager said so, do it"'
              - 'Change the title and the power goes'
              - 'No real buy-in inside'
          - title: 'Power of influence'
            tone: good
            icon: heart
            tip: 'Influence built on trust works even without a title.'
            items:
              - '"What they say is usually right"'
              - 'Everyone feels the decision is theirs'
              - 'Buy-in comes from within'
      - type: quote
        body: 'Being right is one job. Bringing people with you is another.'
    aside:
      - type: problem
        body: 'This segment teaches you to bring people along without a title, to grow newer colleagues, and to know when to stop arguing and decide.'
      - type: remember
        body: 'Trust first, argument second. We listen closely to the people we trust.'
    check:
      q: 'Why did Sumi''s warning go nowhere, even though she was right?'
      a: 'She only said it and never brought anyone along. Influence is built on trust, numbers and small proofs, not just on saying the right thing.'

  - slug: persuading-without-authority
    title: 'Influence without a title: four steps'
    kind: howto
    tldr: 'Listen first, then show evidence, run a small pilot and find an ally. Persuade with proof, not pressure.'
    keywords: ['persuasion', 'pilot', 'allies', 'influence', 'proof of concept', 'convince']
    blocks:
      - type: text
        body: |
          This time Sumi goes about it differently. She first goes to people on the team and asks what problems they have. Then she brings real evidence. These four steps turn an idea into a team decision, with no title required.
      - type: visual
        kind: steps
        caption: 'Four steps to turn an idea into a team decision'
        steps:
          - {title: '1. Listen first', body: 'Ask each person about their problems, and frame the problem in their words.', tip: 'Understand their problem before you pitch your solution. People want to hear a solution to their own problem.'}
          - {title: '2. Show numbers', body: 'How often it broke, how many hours it cost, what could happen next month.', tip: '"This needs fixing" is an opinion. "It cost us 14 hours in the last three months" is a fact.'}
          - {title: '3. Run a small pilot', body: 'Try the new approach in one module and show the result.', tip: 'It''s easier to get permission for a small trial than for a big change, and you get proof.'}
          - {title: '4. Find an ally', body: 'Win over one respected colleague first.', tip: 'When a second person says the same thing in the meeting, trust doubles.'}
      - type: code
        lang: text
        file: 'A one-page proposal'
        variant: good
        code: |
          Problem:   Order queries are spread over 12 places; a schema change breaks all.
          Evidence:  3 hotfixes for this in the last 3 months, 14 hours in total.
          Proposal:  Move all queries into one OrderRepository, starting with reports.
          Cost:      2 days, I'll do it; nobody else's work is blocked.
          Way back:  If it doesn't work out, reverting one PR restores the old state.
          Ask:       In a week, look at the result and decide together.
        marks:
          - {line: 2, tip: 'Evidence in numbers. Facts, not opinions.'}
          - {line: 4, tip: 'The cost is small and in your own hands, so there are fewer reasons to say no.'}
          - {line: 5, tip: 'Showing a way back lowers the risk and makes it easier to say yes.'}
      - type: quote
        body: 'Don''t ask permission for a big change. Ask for a small trial, and bring the proof.'
    aside:
      - type: pitfalls
        items:
          - 'Presenting the idea for the first time in a meeting. Talk to people one by one first and learn where they stand.'
          - 'Winning by proving someone wrong. They''ll accept it, but they won''t cooperate.'
          - 'Using a pilot to stall. If the problem is urgent or dangerous, such as a security hole, skip the campaign and escalate now.'
      - type: refs
        items:
          - {to: 'thinking/tech-debt', label: 'Explaining the cost of tech debt'}
    check:
      q: 'Why is running a small pilot smarter than asking permission for a big refactor?'
      a: 'A small pilot carries little risk, so permission comes easily. And once you have the result, you have evidence for the bigger decision.'

  - slug: mentoring
    title: 'Mentoring: questions, not answers'
    kind: compare
    tldr: 'A good mentor doesn''t pour out answers. They ask questions that teach thinking, meet regularly and share stories of their own mistakes.'
    keywords: ['mentoring', 'coaching', '1:1', 'one on one', 'junior', 'growth']
    blocks:
      - type: text
        body: |
          Junior developer Rakib comes over and says, "This query is slow. What should I do?" If the senior just tells him the answer, he'll fix it today and be back next time. If the senior asks, "What does EXPLAIN, the command that shows how the database runs a query, tell you?", he'll dig around on his own and manage alone next time.
      - type: visual
        kind: compare
        caption: 'Giving the answer vs asking a question'
        columns:
          - title: 'Direct answer'
            tone: warn
            icon: send
            tip: 'Today''s problem is solved, but nothing is learned. The mentor becomes a bottleneck.'
            items:
              - '"Add an index."'
              - 'The problem goes away today'
              - 'Another question next time'
          - title: 'Asking questions'
            tone: good
            icon: lightbulb
            tip: 'Slower, but Rakib does the thinking. That habit is an asset for life.'
            items:
              - '"What do you see in EXPLAIN?"'
              - 'He finds the cause himself'
              - 'Next time he solves it alone'
      - type: code
        lang: text
        file: 'A question ladder for one slow query'
        variant: good
        code: |
          Rakib:   "This query is slow."
          Senior:  "How slow, and how do you know?"          -> learns to measure
          Rakib:   "About 4 seconds."
          Senior:  "What is the biggest step in EXPLAIN?"    -> learns to read the plan
          Rakib:   "It reads every row of the orders table."
          Senior:  "How could it find the rows without reading all?"   -> the index is his idea
          Rakib:   "An index on customer_id?"
        marks:
          - {line: 2, tip: 'First question: measure. "Slow" is a feeling; 4 seconds is a fact.'}
          - {line: 4, tip: 'Second: read the evidence. He learns to open EXPLAIN himself.'}
          - {line: 6, tip: 'Third: let him name the fix. Three questions take longer than one sentence, but next time he asks himself all three.'}
      - type: code
        lang: text
        file: 'A 1:1 template (30 minutes, weekly)'
        variant: good
        code: |
          1. What went well this week?            (5 min, morale)
          2. Where are you stuck?                 (10 min; questions, not solutions)
          3. One skill to grow this month         (5 min; a specific goal)
          4. What do you need from me?            (5 min)
          5. A mistake or lesson of mine          (5 min; it opens people up)
        marks:
          - {line: 2, tip: 'Questions instead of solutions: "What have you tried? What do you think the cause is?"'}
          - {line: 3, tip: 'Mentoring runs on small goals: this month, learn to read one EXPLAIN.'}
          - {line: 5, tip: 'Telling your own mistake story shows a junior that mistakes are normal, not shameful.'}
      - type: quote
        body: 'Don''t hand a junior a fish. Give them a net.'
    aside:
      - type: tips
        items:
          - 'Make code review a chance to teach: write comments that explain "why".'
          - 'Sometimes a direct answer is right: if production is down, fix it first, then teach.'
      - type: when
        use:
          - 'The junior has tried, and the problem is not new to them'
          - 'There is time, and the problem isn''t urgent'
        avoid:
          - 'Production is down and you''re in a hurry'
          - 'They are brand new and have no base to ask questions from'
    check:
      q: 'When is a direct answer right, and when should you ask questions?'
      a: 'In an emergency, or on a topic that is completely new to them, answer directly. When there is time and the junior has tried something, ask questions and make them think.'

  - slug: consensus-building
    title: 'Consensus doesn''t mean everyone agrees'
    kind: concept
    tldr: 'Consensus means "I may not fully agree, but I can live with this." No serious objection is enough; full agreement isn''t required.'
    keywords: ['consensus', 'consent', 'buy-in', 'agreement', 'pre-wire', 'alignment']
    blocks:
      - type: text
        body: |
          In a village shalish, where the neighbourhood elders settle a dispute, not everyone agrees on everything. The head elder asks, "Does anyone have an objection that can't be accepted?" If nobody does, the ruling stands. A team decision works the same way: the goal isn't 100% support, it's no serious objection.
      - type: visual
        kind: table
        caption: 'Three levels of agreement, person by person'
        headers: ['Level', 'Meaning', 'What happens']
        rows:
          - cells: ['Support', 'I want this', 'Move ahead']
            tip: 'Fully on board. These people are the energy that carries the work forward.'
          - cells: ['Can live with it', 'I''d do it differently, but I won''t block it', 'Note the concern, move ahead']
            tip: 'The common and healthy state. Not everyone gets their first choice.'
          - cells: ['Objection', 'This causes me a serious problem', 'Resolve it first, then proceed']
            tip: 'This is the objection that matters; it may carry a risk or a fact the others don''t know.'
      - type: points
        title: 'The path to agreement'
        style: number
        items:
          - 'Before the meeting, talk one by one with the main objectors about the proposal (pre-wire).'
          - 'In the meeting, ask: "Does anyone have a serious objection?" Look for objections, not a head count.'
          - 'If there is an objection, write down its reason and look for a fix or an alternative.'
      - type: quote
        body: 'Don''t wait for everyone to agree. Ask whether anyone has a serious objection.'
    aside:
      - type: story
        title: 'Silent agreement'
        body: |
          In one meeting, everyone stayed quiet and the chair assumed everyone agreed. Later it turned out two people had serious objections but hadn't voiced them in front of the seniors. Each person's view should have been collected separately first.
      - type: pitfalls
        items:
          - 'Taking silence for agreement. Ask each person by name.'
          - 'When a senior speaks first, the rest follow. Let the juniors speak first.'
          - 'Chasing consensus on every decision. It costs time; for small, reversible choices let the owner decide (next slide).'
    check:
      q: 'Sumi said "I can live with it." What does that mean, and what does the team do?'
      a: 'She would have done it differently but won''t block it. The team can note her concern and move ahead.'

  - slug: disagree-and-commit
    title: 'When to stop arguing: disagree and commit'
    kind: howto
    tldr: 'Set a time limit, then one person decides and everyone moves ahead wholeheartedly. Only for decisions you can undo; never for safety, security or ethics.'
    keywords: ['disagree and commit', 'timebox', 'decision log', 'ending debate', 'decider']
    blocks:
      - type: text
        body: |
          An argument can run forever. A good team knows when to end it. The rule: one person is the decider, the discussion has a time limit, and at the end a decision is made. Whoever disagrees writes down their view, then works wholeheartedly for the decision.
      - type: visual
        kind: steps
        caption: 'Four steps from argument to decision'
        steps:
          - {title: '1. Set a time limit', body: 'Fix the end of the discussion (say, Thursday).', tip: 'Without a deadline, arguments don''t end. The cost of extra debate is higher than the value of the decision.'}
          - {title: '2. One decider', body: 'Name them up front: whoever carries the most responsibility.', tip: 'Whoever is accountable decides. Not a committee.'}
          - {title: '3. Write down dissent', body: 'Record the other view and its reasons.', tip: 'When a dissenting view is written down, the person feels heard.'}
          - {title: '4. Commit fully', body: 'No working around the decision by the back door.', tone: accent, tip: 'Commit doesn''t mean obeying reluctantly. It means trying to make the decision succeed.'}
      - type: code
        lang: text
        file: 'docs/decisions/log.txt'
        variant: good
        code: |
          Date: 14 December    Decider: Rahim
          Question: Should notifications be a separate service?
          Decision: No, for now a module inside the main app.
          Reason: The team is 4 people; a separate service's operating cost is too much now.
          Dissent: Sumi - a separate service would make scaling easier later.
          Reversible: Yes. Extracting the module later costs about 2 weeks.
          Revisit: When the team reaches 8, or notifications pass 1,000,000 a day.
        marks:
          - {line: 1, tip: 'The decider''s name and the date: who, and when.'}
          - {line: 5, tip: 'With her dissent recorded, Sumi feels heard, and if she turns out right, everyone will know.'}
          - {line: 6, tip: 'The test for using this method at all. If this line said "No, it can''t be undone", we would not simply commit and move on.'}
          - {line: 7, tip: 'It says when to rethink. 1,000,000 a day is about 12 every second, so the trigger is real growth.'}
      - type: points
        title: 'When not to "disagree and commit"'
        style: cross
        items:
          - 'The decision is hard to undo: deleting data, or signing a contract with no exit. Slow down and ask for evidence first.'
          - 'The objection is about safety, security, law or ethics, such as logging full card numbers to debug faster. That is not a dissent to file away; stop it and escalate.'
          - 'New facts arrived after the decision. Bring them to the decider and ask for a rethink.'
      - type: quote
        body: 'You can follow a decision you disagree with, but a team drowns in argument without one.'
    aside:
      - type: when
        use:
          - 'The decision is reversible and the cost of arguing is high'
          - 'Both options are about equally good'
        avoid:
          - 'There is a serious security or legal risk; you can''t stay silent'
          - 'New facts have arrived since the decision; think again'
      - type: remember
        body: 'Open in the discussion, one voice in the decision, everyone together in the work.'
    check:
      q: 'After the decision is made, what should Sumi do if she still disagrees?'
      a: 'Her dissent is already on record, so she works wholeheartedly for the decision. If new facts arrive, she can raise the question again.'

flashcards:
  - q: 'What does influence without a title rest on?'
    a: 'Trust: being regularly right, bringing numbers and evidence, and understanding other people''s problems.'
    more: |
      A title can force people to follow orders, but it can't win their real agreement. Trust grows when you keep small promises, listen first and admit your own mistakes. That trust stays even when the title changes.
    ref: right-but-ignored
  - q: 'What do you do first when you want the team to accept a proposal?'
    a: 'Listen first: understand everyone''s problems, then present your proposal as the answer to them.'
    more: |
      When you learn other people's problems before sharing your idea, the proposal becomes a way to make their own work easier. It turns from "your idea" into "our solution". It is the cheapest and most effective route.
    ref: persuading-without-authority
  - q: 'Why is a small pilot good for a big change?'
    a: 'Low risk means permission comes easily, and with evidence in hand, the case for the big decision gets stronger.'
    more: |
      Ask permission for a refactor of the whole system and the answer is "no". Ask for a two-day trial in one module and the answer is "yes". A week later, show the result with numbers, and you won't need to persuade people again for the next step.
    ref: persuading-without-authority
  - q: 'Why ask questions instead of giving answers in mentoring?'
    a: 'The junior works it out and can solve it alone next time. A direct answer fixes only today''s problem.'
    more: |
      Questions such as "What have you tried?" and "What do you see in EXPLAIN?" teach a way of thinking. But if production is down, or the topic is completely new, help directly first and teach afterwards.
    ref: mentoring
  - q: 'Does consensus mean everyone agrees?'
    a: 'No. It means there is no serious objection, and everyone is ready to move ahead with the decision.'
    more: |
      If you wait for everyone to agree completely, no decision ever happens. The question to ask is "Does anyone have a serious objection?" If not, you can move ahead even if nobody is fully on board, and you record the dissent.
    ref: consensus-building
  - q: 'What is a pre-wire?'
    a: 'Talking one on one, before the meeting, with the main objectors or the people the decision affects.'
    more: |
      When people hear an idea for the first time in a meeting, they say "no" to protect themselves. Talk privately first and they get time to think and raise objections, and there are no surprises in the meeting.
    ref: consensus-building
  - q: 'What is "disagree and commit"?'
    a: 'Working wholeheartedly for a decision even though you disagree with it. Your dissent is recorded beforehand.'
    more: |
      In discussion, you can state your disagreement openly, but once a decision is made, you can't work against it by the back door. If new facts come in, you can raise the question again. That way the team doesn't get stuck in arguments.
    ref: disagree-and-commit
  - q: 'When should you not use "disagree and commit"?'
    a: 'When the decision is hard to undo, when the objection is about safety, security, law or ethics, or when new facts have arrived.'
    more: |
      The method cuts the cost of argument on decisions you can reverse. Deleting data or signing a contract with no exit needs evidence first. A safety, security or legal objection is not a dissent to log; it is a reason to stop and escalate.
    ref: disagree-and-commit
  - q: 'What do you need to stop an argument and decide?'
    a: 'A deadline for the discussion, one decider, a record of dissent, and a condition for revisiting.'
    more: |
      With these four, the argument stays bounded, responsibility is clear, dissent is heard, and the decision isn't locked in forever. If you write them in a decision log, you can find the reason even six months later.
    ref: disagree-and-commit

quiz:
  - q: 'Sumi wants to change the team''s whole query layer, but she holds no manager title. Which approach works best?'
    hint: 'Big permission, or small proof?'
    options:
      - text: 'Post a long message in Slack telling everyone this is urgent'
        correct: false
        why: 'An opinion is easy to write and easy to ignore. There is no evidence and no ally.'
      - text: 'Show the problem with numbers, run a pilot in one small module, and win over one respected colleague first'
        correct: true
        why: 'Evidence, low risk and an ally are all effective ingredients of influence without a title.'
      - text: 'Change the whole system alone and open a PR'
        correct: false
        why: 'With nobody on board, the PR is large and risky, and there''ll be no reviews or support.'
      - text: 'Get the manager to give the order'
        correct: false
        why: 'An order gets the work done, but not real buy-in, and cooperation will suffer later.'
    ref: persuading-without-authority
  - q: 'Junior developer Rakib says, "My query is slow." There is time, and it isn''t urgent. What does the senior do?'
    hint: 'What do you want him to learn?'
    options:
      - text: 'Tell him straight which index to add'
        correct: false
        why: 'Today''s problem gets solved, but Rakib doesn''t learn to think.'
      - text: 'Fix the code for him'
        correct: false
        why: 'He learns even less, and he''ll depend on you again.'
      - text: 'Ask, "What do you see in EXPLAIN? Which step takes the most time?" and let him think'
        correct: true
        why: 'Questions teach him to find the cause himself, so next time he can do it alone.'
      - text: 'Say, "It''s your job, work it out yourself."'
        correct: false
        why: 'Leaving someone with no help is not mentoring. He''ll just stay stuck.'
    ref: mentoring
  - q: 'Which of these are signs of good mentoring?'
    hint: 'Is the goal the junior''s ability to think independently?'
    options:
      - text: 'Regular 1:1s where the junior says where they''re stuck'
        correct: true
        why: 'Regularity builds trust, and open conversation catches problems early.'
      - text: 'Sharing stories of your own mistakes'
        correct: true
        why: 'The junior sees that mistakes are normal, so they don''t hide their own.'
      - text: 'Giving a complete answer to every question straight away'
        correct: false
        why: 'It builds dependence and cuts learning. Outside an emergency, questions are better.'
      - text: 'Fixing every one of the junior''s PRs yourself'
        correct: false
        why: 'They won''t learn from any mistake, and your own time gets tied up.'
    ref: mentoring
  - q: 'Everyone in the meeting was quiet, and the chair said, "So everyone agrees." Later, two people raised serious objections. What went wrong?'
    hint: 'What does silence mean?'
    options:
      - text: 'Silence was taken as agreement; each person should have been asked by name'
        correct: true
        why: 'Many people don''t voice objections in front of seniors. Asking separately brings them out.'
      - text: 'The meeting was too short'
        correct: false
        why: 'Even with more time, the quiet people wouldn''t have spoken. The gap is elsewhere in the process.'
      - text: 'The proposal was wrong'
        correct: false
        why: 'The proposal may be fine. The problem was that there was no way to voice an objection.'
      - text: 'More people should have been invited'
        correct: false
        why: 'The more people in the room, the more likely they are to stay quiet.'
    ref: consensus-building
  - q: 'The team has argued for two weeks, and both options are about equally good. What should Rahim do?'
    hint: 'Does the cost of arguing exceed the difference between the options?'
    options:
      - text: 'Let the argument run another week'
        correct: false
        why: 'When the options are equal, more argument just wastes time.'
      - text: 'Set a time limit, name a decider, record dissent and decide'
        correct: true
        why: 'For a reversible decision between near-equal options, deciding quickly is worth more.'
      - text: 'Take a vote and follow the majority'
        correct: false
        why: 'A vote makes winning the point and not the reasoning the focus, and nobody owns the decision.'
      - text: 'Drop the subject'
        correct: false
        why: 'Not deciding is also a decision, and it has a price.'
    ref: disagree-and-commit
  - q: 'After the decision, Sumi notices that new facts show the basis of the decision was wrong. What should she do?'
    hint: 'Does disagree and commit apply to new facts too?'
    options:
      - text: 'Stay quiet, because the decision is made'
        correct: false
        why: 'When new facts arrive, you can go back. Staying silent lets the mistake grow.'
      - text: 'Take the new facts to the decider and ask for a rethink'
        correct: true
        why: 'Commit doesn''t mean blind obedience. When the basis changes, the decision can be reconsidered.'
      - text: 'Quietly do it her own way'
        correct: false
        why: 'Secretly ignoring the decision destroys the team''s trust.'
      - text: 'Rally the whole team to her side and rebel'
        correct: false
        why: 'That is factionalism, not discussion. The right path is to bring the new facts to the decider.'
    ref: disagree-and-commit
  - q: 'The decider says full card numbers will be logged to make debugging easier. Sumi believes this breaks security rules. What does "disagree and commit" say?'
    hint: 'Can this decision be undone, and is it only a matter of taste?'
    options:
      - text: 'The decision is made; Sumi records her dissent and commits'
        correct: false
        why: 'A serious security or legal risk is not a dissent to file away. Once the numbers leak, nothing can be undone.'
      - text: 'Sumi raises it as a security objection with the decider and the security or legal team, and the decision waits'
        correct: true
        why: 'The method is for reversible choices between reasonable options. A serious safety, security or legal objection stops the decision first.'
      - text: 'Sumi quietly builds it her own way without logging the numbers'
        correct: false
        why: 'Secretly ignoring a decision destroys trust, and the real objection is never answered.'
      - text: 'Take a vote'
        correct: false
        why: 'A security risk is not settled by votes; it needs an expert''s assessment.'
    ref: disagree-and-commit
