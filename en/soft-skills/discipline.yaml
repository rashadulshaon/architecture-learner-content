slides:
  - slug: hype-train
    title: 'Everyone''s going, so should we?'
    kind: story
    tldr: 'New technology is exciting, but shouldering a solution built for someone else''s problem can freeze features for six months.'
    keywords: ['hype', 'resume driven development', 'trend', 'microservices', 'technology choice']
    blocks:
      - type: text
        body: |
          On a team of 5, Rakib said, "The big companies use microservices and Kubernetes, so let's do it too." Six months went into infrastructure. In that time not a single new feature shipped, and the app had 2,000 users. The problem wasn't the technology. Nobody had asked, "Which problem of ours is this for?"
      - type: metaphor
        icon: tag
        title: 'This year''s trendy Eid outfit'
        body: |
          The outfit everyone is buying in the Eid market may not fit you. It costs more, has puffy sleeves, and every shop sells the same one. Know your own size first, then look at the trend.
      - type: visual
        kind: compare
        caption: 'Two teams, six months later'
        columns:
          - title: 'Chasing the hype'
            tone: bad
            icon: fire
            tip: 'Buying the solution before knowing the problem.'
            items:
              - '6 months on infrastructure'
              - 'Zero new features'
              - 'Extra people needed to manage the complexity'
          - title: 'Problem first'
            tone: good
            icon: target
            tip: 'Measured its own problem first, then took only what it needed.'
            items:
              - 'One monolith, running well'
              - 'Six features shipped'
              - 'Will split it when a real need appears'
      - type: quote
        body: 'Just because someone else uses it doesn''t mean you need it. Measure your own problem first.'
    aside:
      - type: problem
        body: 'This segment teaches you to stay sceptical while learning something new, to put reality ahead of rules, and to own the long-term consequences of your decisions.'
      - type: refs
        items:
          - {to: 'thinking/monolith-microservices', label: 'Monolith vs microservices'}
    check:
      q: 'Why did Rakib''s team lose six months?'
      a: 'They never measured their own problem. A big company''s solution was extra complexity for their small problem, and nobody asked "Which problem of ours is this for?"'

  - slug: skeptical-learning
    title: 'Learn the new thing, but ask questions'
    kind: howto
    tldr: 'When you see a new technology, ask five questions: what problem, whose problem, what cost, has anyone run it for years, and can we go back?'
    keywords: ['skepticism', 'technology evaluation', 'spike', 'adoption', 'evaluating tools']
    blocks:
      - type: text
        body: |
          You shouldn't stop learning, and you shouldn't jump at everything either. When a new medicine reaches the market, the pharmacist asks: for whom, what trials were done, what are the side effects? Technology needs the same scepticism. Fit the five questions below into a short evaluation template.
      - type: code
        lang: text
        file: 'tech-evaluation.txt'
        variant: good
        code: |
          Technology: ...........   Evaluator: ........   Date: ........

          1. What problem does it solve?
             Do we have that problem? Evidence (numbers): ........
          2. What are the alternatives? Why isn't the current way working?
          3. Cost: learning + running + replacing. How many person-months?
          4. Proof: has someone our size run it in production for 2+ years?
             (a user's experience, not the vendor's blog)
          5. Can we go back? What would going back cost?

          Trial: a one-week spike, on one small, low-risk piece of work.
          Decision: Adopt / Run a trial / Look again later / No     Reason: ........
        marks:
          - {line: 3, tip: 'If there is no problem, the solution is pointless. Show in numbers how big our problem is.'}
          - {line: 6, tip: 'Learning takes time, running takes people, and replacing takes time again. Count all three.'}
          - {line: 8, tip: 'A new technology''s problems appear after years in production. That is why other people''s experience is valuable.'}
          - {line: 12, tip: 'Start with a limited trial (a spike); if it works, grow it slowly.'}
      - type: visual
        kind: steps
        caption: 'Four steps to adopting new technology'
        steps:
          - {title: '1. Measure the problem', body: 'Which problem of ours, and how big, in numbers.', tip: 'If you have no problem, there is no need to buy the solution.'}
          - {title: '2. Ask the questions', body: 'Write down the answers to the five questions.', tip: 'A lot of hype gets caught just by writing the answers.'}
          - {title: '3. A small spike', body: 'One week, on low-risk work.', tip: 'Gather some small experience before a big decision.'}
          - {title: '4. Decide and record', body: 'Adopt or reject, and write the reason.', tip: 'If someone asks next year, you have an answer.'}
      - type: quote
        body: 'Problem first, then solution. Do it the other way round and the solution becomes the problem.'
    aside:
      - type: pitfalls
        items:
          - 'Treating a vendor''s conference talk as neutral evidence.'
          - 'Resume-driven development: choosing technology for your own CV.'
      - type: refs
        items:
          - {to: 'hands-on/prototyping-profiling', label: 'Small spikes and prototypes'}
    check:
      q: 'When evaluating new technology, what is the very first question, and why?'
      a: '"Which problem of ours is this for, and how big is it?" Without a problem, however good the solution, it is just extra cost.'

  - slug: fundamentals-vs-tools
    title: 'What to learn so it still pays off in 10 years'
    kind: compare
    tldr: 'Tools change every few years; fundamental ideas don''t. Put most of your learning time into fundamentals and a little into tools.'
    keywords: ['fundamentals', 'learning', 'T-shaped', 'career', 'basics vs tools']
    blocks:
      - type: text
        body: |
          Accountants of the old days kept their books with pen and ledger; now everyone uses a spreadsheet. The tool changed, but the debit-and-credit rules are the same. Technology works that way too. You have to learn a new version of a framework again and again, but learn the ideas of transactions, caching or consistency and they serve you for years.
      - type: visual
        kind: compare
        caption: 'Tools vs fundamentals: where to invest your learning'
        columns:
          - title: 'Tools (change fast)'
            tone: warn
            icon: tools
            tip: 'Useful, but out of date within a few years. Learn them as needed.'
            items:
              - 'A new framework version'
              - 'A new ORM or library'
              - 'One cloud''s console'
          - title: 'Fundamentals (long-lasting)'
            tone: good
            icon: book
            tip: 'These help in any tool. The biggest long-term investment.'
            items:
              - 'Data modelling and transactions'
              - 'Concurrency and failure'
              - 'Networks, caching, security'
              - 'Trade-offs and communication'
      - type: points
        title: 'A weekly learning habit'
        style: number
        items:
          - 'Spend 2 hours a week on fundamentals: read a book chapter or an article, then write it up in your own words.'
          - 'Do one small project or spike a month, and run what you''ve learned by hand.'
          - 'Learn a tool when work needs it (just in time), and don''t worry about the rest.'
      - type: quote
        body: 'Tools are rented clothes; fundamentals are your own body. Build the body first.'
    aside:
      - type: tips
        items:
          - 'Explain what you''ve learned to someone else, or give a short talk to the team; your understanding gets deeper.'
          - 'An idea that survives year after year is fundamental; if it changes in three years, it''s a tool.'
      - type: remember
        body: 'Principles last 10 years, tools last 3. Split your learning time in the same proportion.'
    check:
      q: 'You have 2 hours a week to learn. Which gets more: a new framework version, or the idea of transactions?'
      a: 'The idea of transactions. It helps in any tool, and a framework''s new version can be learned when work needs it.'

  - slug: pragmatism-over-purity
    title: 'Understand the purpose before you break the rule'
    kind: concept
    tldr: 'Behind every rule there is a problem. If your project doesn''t have that problem, a simpler path beats following the rule.'
    keywords: ['pragmatism', 'purity', 'YAGNI', 'over-engineering', 'best practices']
    blocks:
      - type: text
        body: |
          Cook for four people at home with a wedding-hall organisation and the cooking never finishes. Rules have a purpose. If the purpose doesn't apply to you, the rule is just extra weight. Keep complexity proportionate: only as much solution as there is problem.
      - type: visual
        kind: table
        caption: 'What a rule is for, and when the simple way is fine'
        headers: ['Rule', 'Purpose', 'When the simple path works']
        rows:
          - cells: ['An interface and repository for everything', 'Easy to swap the data source', 'The source is never going to change']
            tip: 'If there''s no chance of change, the extra layer only makes the code harder to read.'
          - cells: ['100% test coverage', 'Protect the important behaviour', 'Not for a plain admin CRUD; always for money']
            tip: 'What matters is not the percentage but whether the risky behaviour is tested.'
          - cells: ['Microservices', 'Independent deploy and scale', 'A small team with little traffic: a monolith']
            tip: 'Split when you have more teams or need a different scale, not before.'
          - cells: ['A fully normalised schema', 'Data consistency', 'Deliberate denormalisation in reporting']
            tip: 'Denormalisation with a written reason is fine; done without knowing why, it is debt.'
      - type: quote
        body: 'Follow a rule by understanding its purpose. Without the purpose, take the simple path, and write down why.'
    aside:
      - type: pitfalls
        items:
          - 'Not writing down why you broke a rule; later, nobody will know it was deliberate.'
          - 'Building something complex now because "we might need it later" (YAGNI: You Aren''t Gonna Need It).'
      - type: when
        use:
          - 'The problem is real and provable right now'
          - 'A mistake is costly: money, security, data'
        avoid:
          - 'Adding an extra layer only because "it could happen in the future"'
          - 'Accepting someone else''s made-up rule without understanding it'
    check:
      q: 'In a small admin CRUD, is it good to build an interface and a repository for every class?'
      a: 'Usually not. If the source is unlikely to change, the extra layer just adds complexity. Add it when the problem becomes real.'

  - slug: owning-consequences
    title: 'Your decision is still running three years later'
    kind: howto
    tldr: 'Responsibility for a decision doesn''t end when you make it. Measure the outcome, look back at a set time, and don''t let debt pile up.'
    keywords: ['ownership', 'long term', 'decision review', 'accountability', 'consequences']
    blocks:
      - type: text
        body: |
          Anyone who builds a house knows a design mistake turns into a crack a few years later. In software too, today's decision lands later, often on someone else's shoulders. Owning it means measuring the result, looking back after six months, and speaking up yourself when you got it wrong.
      - type: code
        lang: text
        file: 'docs/decisions/review-after-6-months.txt'
        variant: good
        code: |
          Decision: notifications as a module inside the main app (RFC-0012)
          Owner: Rahim          Date: 12 December         Review: 12 June

          We assumed:        fewer than 2,000 messages a day; a team of 4
          What we'll measure: messages a day, queue delay (p95), how often this module broke
          Questions for the review:
            - Was the assumption right? (How many messages now?)
            - What turned out harder than we thought?
            - Would we make the same decision today?
          Result: ........   Next step: keep / change / repay (debt)
        marks:
          - {line: 2, tip: 'One owner and a review date fixed in advance. Otherwise "we''ll look later" never happens.'}
          - {line: 4, tip: 'With the assumptions written down, you can check them later, and learn if they were wrong.'}
          - {line: 5, tip: 'The numbers are agreed already, so the review looks at facts, not opinions.'}
          - {line: 9, tip: 'The last question is the most honest: knowing what we know, would we make the same decision today?'}
      - type: visual
        kind: steps
        caption: 'Five steps to owning a decision'
        steps:
          - {title: '1. Write it down', body: 'The decision, the reason, the assumptions: in an ADR or RFC.', tip: 'If it isn''t written, the reason is lost after six months.'}
          - {title: '2. Pick an owner', body: 'One person, by name.', tip: 'Everyone''s responsibility means no one''s.'}
          - {title: '3. Choose the measures', body: 'Which number tells us it''s going well?', tip: 'If the measures aren''t fixed first, you can pick numbers you like later.'}
          - {title: '4. Look back', body: 'A review after six months or a year.', tip: 'Put it in the calendar; forgetting is the most natural thing.'}
          - {title: '5. Repay the debt', body: 'If there are mistakes or accumulated debt, list them and make time.', tone: accent, tip: 'If there''s a gap between saying and repaying, trust falls.'}
      - type: quote
        body: 'Whoever makes the decision owns the outcome. Don''t leave it assuming someone else will handle it.'
    aside:
      - type: story
        title: 'The six-month review'
        body: |
          A team looked back at its queue decision after six months. Message volume was ten times what they had expected. They saw it in time and moved to another transport, and the problem was fixed before any major incident.
      - type: refs
        items:
          - {to: 'thinking/tech-debt', label: 'Tech debt and repaying it'}
    check:
      q: 'Why are the measures agreed in advance, together with the decision?'
      a: 'When they''re fixed first, the review looks at facts, not opinions. Otherwise there is a tendency to pick the numbers you like.'

flashcards:
  - q: 'What is resume-driven development?'
    a: 'Choosing new technology to beef up your own CV, not because the project needs it.'
    more: |
      It adds complexity to the project, and the team has to handle it. Writing down the problem, the alternatives and the cost before choosing a technology helps you catch this tendency.
    ref: skeptical-learning
  - q: 'What is the first question when evaluating new technology?'
    a: 'Which of our problems does it solve, and do we really have that problem?'
    more: |
      Without a problem, a solution is extra cost however good it is. Show the problem in numbers: how slow, how many hours lost. After that come the questions about cost, alternatives and proof.
    ref: skeptical-learning
  - q: 'What kind of proof is credible for new technology?'
    a: 'Experience from someone our size who has run it in production for at least two years. Not the vendor''s blog.'
    more: |
      Most problems with new technology appear months or years into production. So look for user experience, discussions of its limits and failure stories, and match them to your own size.
    ref: skeptical-learning
  - q: 'What is a spike?'
    a: 'A small, time-boxed experiment (say, one week) to see whether a technology works in our situation.'
    more: |
      Before a big decision, run the new technology on one low-risk piece of work. Use the result to decide whether to adopt, reject or test more. Spike code can be thrown away. More in [[hands-on/prototyping-profiling|prototyping and profiling]].
    ref: skeptical-learning
  - q: 'Tools vs fundamentals: how do you split your learning time?'
    a: 'Most of it on fundamentals (transactions, concurrency, networks, trade-offs); tools as needed, when work requires them.'
    more: |
      Tools and frameworks change every few years, but fundamental ideas don't. Knowing the fundamentals makes new tools easier to learn, because you already recognise the problem behind them. 2 hours a week on fundamentals plus one spike a month is a good habit.
    ref: fundamentals-vs-tools
  - q: 'What does pragmatism over purity mean?'
    a: 'Follow a rule where its problem exists, and take the simple path where it doesn''t, once you understand the rule''s purpose.'
    more: |
      Behind every rule is a problem. If your project doesn't have it, the rule is extra weight. But don't compromise on money, security and data. When you break a rule, write down why.
    ref: pragmatism-over-purity
  - q: 'What does YAGNI mean?'
    a: 'You Aren''t Gonna Need It: don''t build extra complexity today just because "we might need it later".'
    more: |
      Layers or features built for an imagined future need mostly never get used, but the weight stays. When the problem becomes real, adding the solution then is cheap, especially where you can reverse it.
    ref: pragmatism-over-purity
  - q: 'Why fix a review date and measures along with a decision?'
    a: 'So that six months later you can check whether the assumptions held, on facts, not opinions.'
    more: |
      A decision's results arrive over time. If the review date and measures aren't fixed in advance, "we'll look later" never happens, and you can pick the numbers you like afterwards. With one owner, the responsibility stays clear too.
    ref: owning-consequences

quiz:
  - q: 'The team has 2,000 users and 5 developers. Everyone says, "Let''s move to microservices." What do you ask?'
    hint: 'Where is the problem?'
    options:
      - text: '"For which problem? Show it in numbers, and what do the alternatives cost?"'
        correct: true
        why: 'Measuring the problem shows whether the extra complexity is justified; for a team of 5, it often isn''t.'
      - text: '"The big companies do it, so we do too."'
        correct: false
        why: 'Their problems (millions of users, hundreds of engineers) aren''t ours.'
      - text: '"I don''t know if it''ll be good, let''s just try it, for six months."'
        correct: false
        why: 'A big investment without measuring the problem; start with a small spike instead.'
      - text: '"No, microservices are always bad."'
        correct: false
        why: 'They aren''t always bad; they work for bigger teams or different scale. The answer depends on the problem.'
    ref: hype-train
  - q: 'In evaluating a new database, which proof is the most credible?'
    hint: 'Who has a stake?'
    options:
      - text: 'The vendor''s conference talk'
        correct: false
        why: 'The vendor has a sales interest and won''t talk about weaknesses.'
      - text: 'A write-up of two years in production from a company of our size, with its limitations'
        correct: true
        why: 'They know the problems that only show up in real use, and the size matches.'
      - text: 'How many stars it has on GitHub'
        correct: false
        why: 'Popularity doesn''t mean it solves our problem.'
      - text: 'The announcement of the newest version'
        correct: false
        why: 'The newer it is, the more unknown problems it has.'
    ref: skeptical-learning
  - q: 'You have 2 hours a week to learn. Which of these are good investments?'
    hint: 'What will still be useful in 10 years?'
    options:
      - text: 'Reading about transactions and isolation levels and writing it up in your own words'
        correct: true
        why: 'Fundamental ideas help in any tool.'
      - text: 'Getting stuck on a problem at work and running a small spike on it'
        correct: true
        why: 'Learning by doing, tied to real work, lasts.'
      - text: 'Building a "hello world" in a new framework every week'
        correct: false
        why: 'You don''t get depth, and most of it is never used.'
      - text: 'Scrolling tech trends on social media without doing anything'
        correct: false
        why: 'Watching passively isn''t learning; it feeds the hype and not your understanding.'
    ref: fundamentals-vs-tools
  - q: 'For a small admin page, Sumi wants an interface and a repository for every class; Rakib says use Doctrine directly. What do you say?'
    hint: 'Is there any chance of change?'
    options:
      - text: 'Sumi is right; rules must always be followed'
        correct: false
        why: 'The rule''s purpose is absent here; the extra layer only adds complexity.'
      - text: 'Rakib''s simple path works if the data source is unlikely to change. Write down the reason for the decision.'
        correct: true
        why: 'With no purpose, the simple path is better; a written reason helps later if it needs to change.'
      - text: 'Whoever is older gets their way'
        correct: false
        why: 'Age or rank is not an argument.'
      - text: 'Even for money work, take the simple path'
        correct: false
        why: 'Simplifying around money and security is risky; that needs separate thought.'
    ref: pragmatism-over-purity
  - q: 'Which of these are part of owning a decision?'
    hint: 'What do you do after making the decision?'
    options:
      - text: 'Fixing in advance which numbers will tell you the decision is right'
        correct: true
        why: 'With the measures fixed first, you can''t pick numbers you like afterwards.'
      - text: 'Putting a six-month review in the calendar'
        correct: true
        why: 'Forgetting is natural; fixing the date in advance makes sure you look back.'
      - text: 'Speaking up yourself first when a mistake is spotted'
        correct: true
        why: 'Saying it first cuts the damage and builds trust.'
      - text: 'Forgetting the matter after the decision and moving on to other work'
        correct: false
        why: 'Responsibility doesn''t end there; the results arrive over time.'
    ref: owning-consequences
  - q: 'At the six-month review, message volume turns out to be ten times what was expected. What is Rahim''s best response?'
    hint: 'What do you do when an assumption was wrong?'
    options:
      - text: 'Bury the number, since the decision was Rahim''s'
        correct: false
        why: 'Hiding it makes the problem grow, and it comes back later as a major incident.'
      - text: 'Say the assumption was wrong, and start a rethink with a new decision and a plan to repay the debt'
        correct: true
        why: 'Honestly admitting the mistake and correcting it quickly is what owning a decision means.'
      - text: 'Ask the business to cut the messages'
        correct: false
        why: 'Treating real business growth as the problem points the wrong way.'
      - text: 'What was known at the time was enough, and nothing needs to change'
        correct: false
        why: 'When new facts arrive, changing the decision is the smart thing to do.'
    ref: owning-consequences
