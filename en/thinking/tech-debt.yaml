slides:
  - slug: interest-grows
    title: 'A loan taken in the Eid rush, with interest six months later'
    kind: story
    tldr: 'A rushed job left unfixed piles up like a loan, and the interest is that every new feature gets a little slower.'
    keywords: ['technical debt', 'interest', 'shortcut', 'tech debt', 'copy paste']
    blocks:
      - type: text
        body: |
          Rahim's team built an Eid-offer feature in three days. There was no time, so they copied the old checkout code and half-edited it. Eid sales were great and everyone was happy. But since then, every change to checkout has to be made in two places, and one of them is often forgotten.
      - type: visual
        kind: bars
        caption: 'Time to build a feature of the same size, month by month'
        items:
          - {label: 'Before Eid', value: 2, display: '2 days', tone: good, tip: 'The code was clean then, so a change went in one place only.'}
          - {label: 'After month 1', value: 3, display: '3 days', tip: 'The copied code has to be changed in two places, so the work grew a little.'}
          - {label: 'After month 3', value: 6, display: '6 days', tone: warn, tip: 'Time goes on hunting bugs in the forgotten copy and double-checking every change.'}
          - {label: 'After month 6', value: 10, display: '10 days', tone: bad, tip: 'Nobody is sure what breaks where they touch, so everyone moves slowly out of fear.'}
      - type: quote
        body: 'Tech debt doesn''t come free. You pay in interest, as extra time on every feature.'
    aside:
      - type: story
        title: 'The corner shop''s credit ledger'
        body: |
          When a shopkeeper sells on credit, sales go up, and it can be a smart move. But if the credit ledger isn't kept, nobody remembers who owes what. The debt stops being a debt and becomes lost money.
      - type: refs
        items:
          - {to: 'thinking/evolutionary-architecture', label: 'Architecture that can change'}
    check:
      q: 'The feature shipped in three days with copied code. Where do you pay the "interest"?'
      a: 'On every later change. The same work is done in two places, mistakes happen and checking takes time, so each feature gets a little slower.'

  - slug: debt-quadrants
    title: 'Two kinds of debt: knowing and unknowing'
    kind: concept
    tldr: 'Debt taken on knowingly, with a repayment plan, is a tactic; debt that piles up unnoticed or ignored is the real danger.'
    keywords: ['deliberate debt', 'accidental debt', 'prudent', 'reckless', 'Ward Cunningham', 'Martin Fowler', 'technical debt quadrant']
    blocks:
      - type: metaphor
        icon: bank
        title: 'A bank loan versus a loan shark'
        body: |
          Taking a bank loan to grow your business is smart: you know the amount, the interest and the instalments up front. But borrow from a loan shark without working it out and the interest just keeps growing. Code debt is the same: taken knowingly and written down, it's a loan; allowed to pile up unknowingly, it's a trap.
      - type: visual
        kind: table
        caption: 'The four boxes of tech debt: deliberate or inadvertent, prudent or reckless'
        headers: ['', 'Deliberate', 'Inadvertent']
        rows:
          - cells: ['Prudent', '"Ship now, fix it next sprint"', '"Now I see there was a better way back then"']
            tip: 'Both are normal. In the first you borrowed knowingly; in the second, what you learned made the old code look dated.'
          - cells: ['Reckless', '"No time for design, just make it work"', '"What''s layering? We never knew"']
            tip: 'This is the dangerous row. In the first, everyone knows and nobody thinks about repaying; in the second, nobody even knows the debt exists.'
      - type: points
        title: 'Three conditions for good debt'
        style: check
        items:
          - 'You know the amount: exactly which shortcut you took is written down.'
          - 'You know the interest: what gets harder if you don''t fix it is stated.'
          - 'There''s a repayment date: who will fix it, when, and how much time they get.'
    aside:
      - type: remember
        body: 'Borrowing isn''t the sin. Not writing it down and forgetting to repay is.'
      - type: terms
        items:
          - {term: 'Principal', meaning: 'The work you must do now to fix the shortcut.'}
          - {term: 'Interest', meaning: 'The extra time and risk each change costs until the shortcut is fixed.'}
    check:
      q: 'When is tech debt a good tactic, and when is it a trap?'
      a: 'A tactic when taken knowingly, written down, with a repayment date. A trap when it piles up unknowingly or ignored, or when nobody thinks about repaying.'

  - slug: debt-register
    title: 'The debt ledger: where to write it and how'
    kind: howto
    tldr: 'Write a one-page entry for each debt: what, why, interest, repayment terms and date; leave a marker with a ticket number in the code.'
    keywords: ['debt register', 'tech debt backlog', 'TODO ticket', 'debt ledger', 'ADR', 'deadline test']
    blocks:
      - type: text
        body: |
          To manage debt, you first have to write it down. A plain file or a list of tickets is enough, as long as each entry answers four questions: what, why, how much interest, and when it will be repaid. If you write a `TODO` in code, include the ticket number, or nobody will ever find it.
      - type: code
        lang: yaml
        file: 'docs/tech-debt.yaml'
        variant: good
        code: |
          - id: DEBT-12
            what: 'Copied the Eid checkout: CheckoutService and EidCheckoutService are nearly identical'
            why: 'Three-day Eid deadline, no time for design'
            interest: 'Every checkout change goes in two places, 2-3 extra bugs a month'
            repay: 'Merge them into one class and separate the differences with a strategy, about 3 days'
            owner: 'Rahim'
            due: '2027-02-01'
            trigger: 'Before the third campaign'
        marks:
          - {line: 4, tip: 'Writing the interest means counting the cost of the debt. Leave it out and nobody will see why repaying matters.'}
          - {line: 7, tip: 'Without an owner and a due date an entry is just a complaint. Put a name and a date on it.'}
      - type: code
        lang: php
        file: 'src/Checkout/EidCheckoutService.php'
        variant: good
        code: |
          // DEBT-12: a copy of CheckoutService. Must be merged by 2027-02-01.
          // Once the campaign ends, this class gets deleted anyway.
          final readonly class EidCheckoutService
          {
              public function pay(Cart $cart): Receipt
              {
                  return new Receipt($cart->total());
              }
          }

          // tests/DebtDeadlineTest.php
          public function testDebt12IsRepaidByDeadline(): void
          {
              $deadline = new \DateTimeImmutable('2027-02-01');
              self::assertLessThan($deadline, new \DateTimeImmutable('now'),
                  'The repayment deadline for DEBT-12 has passed');
          }
        marks:
          - {line: 1, tip: 'A marker with the ticket number. One grep finds every debt in an instant.'}
          - {line: 16, tip: 'When the date passes, the test goes red. That''s a harsh tactic, so keep it for important debts and agree it with the team.'}
    aside:
      - type: tips
        items:
          - 'Keep each entry to one page; nobody reads long essays. Use a short, regular template like an ADR.'
          - 'At the start of each sprint, spend 5 minutes on the register: which debts have passed their date?'
      - type: refs
        items:
          - {to: 'thinking/documentation', label: 'ADRs and writing down design'}
    check:
      q: 'Which four questions should each entry in the debt ledger answer?'
      a: 'Which shortcut was taken, why, what the interest (cost) is if it stays unfixed, and how and when it will be repaid, and by whom.'

  - slug: paying-down
    title: 'Three habits for paying off debt'
    kind: howto
    tldr: 'Fix small debts whenever you touch them (boy scout rule), set aside time each sprint for big ones, and pick the debt with the highest interest.'
    keywords: ['boy scout rule', 'sprint budget', 'refactoring', 'repay', 'paying down debt']
    blocks:
      - type: text
        body: |
          "Drop everything and rewrite" isn't a way to repay debt; it's a big risk in itself. Pay in small instalments instead. Leave the code a little cleaner wherever you touch it, reserve some time for debt in every sprint, and repay the debt with the highest interest first.
      - type: code
        lang: php
        file: 'src/Order/OrderService.php'
        variant: good
        code: |
          // came to fix a bug, and cleaned up only what I touched
          // before: if ($order->getTotal() > 5000) { ... }  // what is 5000?
          private const FREE_DELIVERY_FROM_TAKA = 5000;

          public function deliveryFee(Order $order): int
          {
              return $order->getTotalInTaka() >= self::FREE_DELIVERY_FROM_TAKA
                  ? 0
                  : 80;
          }
        marks:
          - {line: 3, tip: 'The magic number got a name. Five minutes of work, but the next person won''t have to guess.'}
      - type: visual
        kind: bars
        caption: 'Splitting a 10-day sprint: a separate instalment for debt'
        items:
          - {label: 'New features', value: 70, display: '7 days', tone: good, tip: 'The core business work. Most of the time goes here.'}
          - {label: 'Debt repayment', value: 20, display: '2 days', tone: accent, tip: 'A regular instalment every sprint. A big debt gets repaid in small pieces.'}
          - {label: 'Buffer', value: 10, display: '1 day', tone: muted, tip: 'For surprise bugs and urgent work. Without one, debt time is the first thing to get cut.'}
      - type: quote
        body: 'Whatever file you touch, leave it a little cleaner than you found it.'
        by: 'Boy-scout rule'
    aside:
      - type: when
        use:
          - 'If a debt hurts every week, repay it first.'
          - 'Repay debt in the code you change often before the rest.'
        avoid:
          - 'Don''t fix code nobody ever touches just because it''s ugly.'
      - type: pitfalls
        items:
          - 'Big refactoring without tests: you introduce new bugs while repaying.'
          - 'Pushing debt time to "next sprint" again and again.'
    check:
      q: 'Which debt do you repay first: code you change every week, or code you change once a year?'
      a: 'The one you change every week. Interest is paid each time you touch the code, so the more it''s touched, the costlier the debt there.'

flashcards:
  - q: 'What is tech debt?'
    a: 'A shortcut taken in today''s rush, whose price is paid later as extra time and risk on every change.'
    more: |
      A shortcut saves time now, but until the code is fixed every new job goes slower. That slowdown is the interest. Fix the debt and the interest stops.
    ref: interest-grows
  - q: 'What are the "principal" and "interest" of tech debt?'
    a: 'Principal: the work needed now to fix the shortcut. Interest: the extra cost on every change until it''s fixed.'
    more: |
      A small principal can carry big interest if the code is touched often. A big principal can carry little interest if nobody touches the code. Measuring interest is what helps you decide the order of repayment.
    ref: debt-quadrants
  - q: 'What separates deliberate debt from inadvertent debt?'
    a: 'Deliberate debt is written down and comes with a repayment plan; inadvertent debt piles up without anyone knowing.'
    more: |
      The first is a tactic, because business races against time. The second comes from lack of knowledge or neglect. So learning and code review are the main protection against inadvertent debt.
    ref: debt-quadrants
  - q: 'What are the three conditions for good tech debt?'
    a: 'You know what was cut, you know the interest, and there''s a repayment date and an owner.'
    more: |
      If any of the three is missing, the debt gets out of control. The third is the one most often forgotten, which is why "we'll fix it later" never comes.
    ref: debt-quadrants
  - q: 'What should an entry in a debt register contain?'
    a: 'What, why it was taken, the interest, the way to repay, an owner and a due date.'
    more: |
      A one-page entry is enough. Add a marker with the ticket number in the code and one grep finds every debt. A glance at the register each sprint shows which debts have passed their date.
    ref: debt-register
  - q: 'What is the boy-scout rule?'
    a: 'Leave any file you touch a little cleaner than you found it, such as naming a magic number.'
    more: |
      This means big refactoring doesn't need separate time, and the most-touched code gets cleaned the most. The condition: the change must be small and safe, and tests must exist.
    ref: paying-down
  - q: 'How much of a sprint is reasonable to set aside for debt?'
    a: 'Many teams reserve roughly 15-20 percent. The number varies by team; being regular is what matters.'
    more: |
      A fixed share means debt repayment doesn't get dropped every time business pressure rises. Even if the share is small, keep it in every sprint, because regular small instalments are far safer than one big repayment.
    ref: paying-down

quiz:
  - q: 'Rahim''s team wants to take a shortcut under deadline pressure. Which of these make it "good debt"?'
    hint: 'What is known and what is settled in good debt?'
    options:
      - text: 'Writing the shortcut in the debt register, with its interest'
        correct: true
        why: 'Written down, the debt stays in everyone''s sight, and knowing the interest shows why repaying matters.'
      - text: 'Settling who repays it and by when'
        correct: true
        why: 'Without an owner and a date, "we''ll fix it later" never arrives.'
      - text: 'Leaving a small comment in the code without telling anyone'
        correct: false
        why: 'If nobody knows and there''s no ticket, nobody will ever look for that comment.'
      - text: 'Assuming the rules can''t be followed and taking shortcuts in the rest too'
        correct: false
        why: 'One shortcut invites another. That sends the debt out of control.'
    ref: debt-quadrants
  - q: 'A new developer says, "We never knew about layering, so we put queries in every controller." Which kind of tech debt is this?'
    hint: 'Was the debt known beforehand?'
    options:
      - text: 'Inadvertent and reckless: nobody knew the debt existed'
        correct: true
        why: 'Debt built from lack of knowledge, which nobody wrote down. This is the most dangerous box.'
      - text: 'Deliberate and prudent: a tactic to save time'
        correct: false
        why: 'Deliberate would mean taken knowingly, but here they didn''t even know the alternative.'
      - text: 'It isn''t tech debt, just personal preference'
        correct: false
        why: 'Preference or not, the result is the same: every future change gets slower.'
      - text: 'Deliberate and reckless'
        correct: false
        why: 'Deliberate and reckless means knowing the better way and avoiding it; here nobody knew the better way.'
    ref: debt-quadrants
  - q: 'What important piece of debt management is missing from the comment below?'
    lang: php
    code: |
      // TODO: fix this later
      public function pay(Cart $cart): Receipt
      {
          // ...
      }
    hint: 'Who will look for it later, where is it recorded, and when must it be done?'
    options:
      - text: 'A ticket number, an owner and a repayment date, so someone can track it'
        correct: true
        why: 'Without a ticket nobody finds a TODO, without an owner nobody does it, and without a date it always waits for later.'
      - text: 'A PHPDoc type annotation'
        correct: false
        why: 'Types improve code quality, but they have nothing to do with tracking debt.'
      - text: 'A longer comment written in more detail'
        correct: false
        why: 'Length doesn''t make something tracked; you need a ticket and a date.'
      - text: 'Nothing, writing TODO is enough'
        correct: false
        why: 'Numberless TODOs pile up and turn into lost debt.'
    ref: debt-register
  - q: 'You have two debts. A: code touched every week, 2 days to repay. B: code nobody touches, 1 day to repay. Which first?'
    hint: 'Where is the interest piling up faster?'
    options:
      - text: 'A, because interest piles up faster where it''s touched every time'
        correct: true
        why: 'Interest is paid whenever you touch the code. The higher the interest, the bigger the gain from repaying.'
      - text: 'B, because it takes less time to repay'
        correct: false
        why: 'The order depends on interest, not on how quick the fix is. Nobody touches B, so it has no interest.'
      - text: 'Both together, because all debts are equal'
        correct: false
        why: 'Debts aren''t equal. Without ordering by interest, your time goes to the wrong place.'
      - text: 'Neither, new features come first'
        correct: false
        why: 'Neglect A and every new feature will be slower.'
    ref: paying-down
  - q: 'The team lead says, "Let''s pause features for two months and rewrite the whole system." What is the biggest risk of this approach?'
    hint: 'Where do the small rules hidden in the old system go?'
    options:
      - text: 'The old code''s hidden rules get dropped, and it doesn''t finish in two months'
        correct: true
        why: 'Old code carries years of bug fixes and rules. A rewrite loses many of them, and it takes longer than estimated.'
      - text: 'The new code will be slower than the old'
        correct: false
        why: 'Speed isn''t the main problem here; the risk is losing rules and not finishing.'
      - text: 'The team won''t learn anything new'
        correct: false
        why: 'They''d actually learn. The risk is elsewhere.'
      - text: 'There''s no risk, because new code is always clean'
        correct: false
        why: 'New code also piles up debt quickly under pressure, especially around rules nobody knew about.'
    ref: paying-down
