slides:
  - slug: three-team-queue
    title: 'One coupon feature, three teams'' queues'
    kind: story
    tldr: 'Work follows the way teams are split: with teams divided by layer, even a small feature waits in three queues.'
    keywords: ['Conway', 'team structure', 'handoff', 'queue', 'feature speed', 'lead time']
    blocks:
      - type: text
        body: |
          A company has split its teams by layer: a UI team, a Backend team and a Database team. The "coupon code" feature needs just three changes: a form, an API and a table. But each change belongs to a different team, so the ticket finishes in one team's queue and then waits in the next. Two days of work takes three weeks.
      - type: visual
        kind: flow
        caption: 'The coupon ticket passes through three teams'' queues'
        nodes:
          - {id: ticket, label: 'Coupon ticket', sub: 'feature request', icon: ticket, col: 0, row: 1, tip: 'The business wants a discount when a coupon code is entered. It is really one piece of work.'}
          - {id: ui, label: 'UI team', sub: 'Vue form', icon: browser, col: 1, row: 1, tip: 'Sees only the frontend. Without the API, a finished form does nothing.'}
          - {id: api, label: 'Backend team', sub: 'Symfony API', icon: api, col: 2, row: 1, tip: 'Sees only the API and business code. Without a column in the table, it is stuck.'}
          - {id: dbt, label: 'Database team', sub: 'tables and migrations', icon: db, col: 3, row: 1, tip: 'Schema and migrations are in this team''s hands. They already have 12 other tickets in their own queue.'}
          - {id: done, label: 'Live', sub: 'after 3 weeks', icon: flag, tone: bad, col: 4, row: 1, tip: 'Two days of work, three weeks of waiting. The delay isn''t in the code but in the handoffs.'}
        edges:
          - {from: ticket, to: ui, label: 'The ticket first joins the UI team''s queue'}
          - {from: ui, to: api, label: 'The UI team builds the form, then files a ticket for the Backend team', tone: warn}
          - {from: api, to: dbt, label: 'The Backend team needs a column, so it files a ticket for the Database team', tone: warn}
          - {from: dbt, to: done, label: 'After three weeks in queues, the feature goes live', tone: bad}
    aside:
      - type: story
        title: 'Nobody made a mistake, yet it was late'
        body: |
          Every team did its own job properly and quickly. The delay came because each handoff means writing up a request, waiting, and fitting into another team's priorities. The problem wasn't the people, it was the way the work was divided.
      - type: problem
        body: 'This slide shows how the way teams are split sets the speed of work. The next slide shows why.'
    check:
      q: 'Why did a two-day coupon feature take three weeks?'
      a: 'The feature was split across three teams. At each handoff the ticket joined a queue, and that waiting ate the time.'

  - slug: conway-mirror
    title: 'As the teams are, so is the system'
    kind: concept
    tldr: 'Conway''s Law: a system is built along the lines of how the organisation communicates, so system boundaries are a shadow of team boundaries.'
    keywords: ['Conway''s Law', 'organizational boundaries', 'communication', 'teams and systems', 'team boundaries']
    blocks:
      - type: metaphor
        icon: users
        title: 'Three cooks at a wedding'
        body: |
          At a wedding, three separate cooks make the pulao, the rezala and the borhani. They talk little, so the pulao's flavour doesn't match the rezala's spice, and the joins between dishes are a mess. And two cooks who stand at the same stove end up blending their cooking into a single dish. The way the food divides follows the way the cooks divide.
      - type: quote
        body: 'A system''s structure copies the communication structure of the organisation that builds it.'
        by: 'Conway''s Law'
      - type: visual
        kind: table
        caption: 'As the teams communicate, so the code is shaped'
        headers: ['Team situation', 'What you see in the system']
        rows:
          - cells: ['Two teams work together every day', 'The code blends into one module']
            tip: 'When people talk constantly they feel no need to respect a boundary, so the code has none either.'
          - cells: ['Two teams talk little', 'A clear API and contract in the middle']
            tip: 'Because they talk less, their agreement has to be written and clear. That pressure is what creates an API.'
          - cells: ['Teams split by layer (UI, Backend, DB)', 'The system is split by layer too']
            tip: 'The incident from the first slide. Every feature touches every layer, so every feature involves every team.'
          - cells: ['No team owns a part', 'That part belongs to everyone, so to no one']
            tip: 'In ownerless code nobody refactors and nobody writes tests. In time it becomes the messiest part.'
    aside:
      - type: story
        title: 'The four-team compiler'
        body: |
          In 1968 Melvin Conway wrote that if an organisation with four groups builds a compiler, you get a four-pass compiler. He offered it as an observation, not a rule, and for decades it has kept holding true.
      - type: terms
        items:
          - {term: 'Boundary', meaning: 'The line between two parts, where one part''s responsibility ends and the other''s begins.'}
          - {term: 'Handoff', meaning: 'Work passing from one team to another, with waiting and a risk of misunderstanding.'}
    check:
      q: 'If two teams work in the same file every day, will a clear boundary form between them?'
      a: 'No. With constant contact they don''t need a boundary, so the code blends together. A boundary forms only when the teams have to talk through a contract.'

  - slug: inverse-conway
    title: 'The other way round: system first, then teams'
    kind: howto
    tldr: 'The inverse Conway maneuver: arrange teams along the architecture you want, with one owner and one written contract for each boundary.'
    keywords: ['inverse Conway maneuver', 'team topology', 'CODEOWNERS', 'module ownership', 'team design', 'ownership']
    blocks:
      - type: text
        body: |
          If the law holds, you can use it in reverse: decide first how you want the system divided, then arrange the teams along those lines. This is the **inverse Conway maneuver**. In wedding terms: first decide which dishes you need, then give each dish one cook who is fully responsible for it.
      - type: visual
        kind: steps
        caption: 'Five steps from the architecture you want to the teams you need'
        steps:
          - {title: '1. Draw boundaries', body: 'By business area: Catalog, Checkout, Billing', tip: 'Split by business capability, not by layer, so a feature can finish inside one part.'}
          - {title: '2. Give each an owner', body: 'One team per boundary', tip: 'Two owners for one boundary means no owner. A team may own several boundaries, but not the reverse.'}
          - {title: '3. Make teams full-stack', body: 'UI to table, in the same team', tip: 'With frontend, backend and data people in one team, a feature finishes without a handoff.'}
          - {title: '4. Write the contract', body: 'An interface or API at the boundary', tip: 'Other teams don''t touch your internals; they talk only through the contract.'}
          - {title: '5. Measure', body: 'How long a feature takes to finish', tip: 'Watch whether lead time shrinks. If it doesn''t, the boundary was drawn in the wrong place.'}
      - type: code
        lang: text
        file: '.github/CODEOWNERS'
        code: |
          # each module has exactly one owning team
          /src/Catalog/    @shop/catalog-team
          /src/Checkout/   @shop/checkout-team
          /src/Billing/    @shop/billing-team
        marks:
          - {line: 2, tip: 'A pull request touching this path can''t merge without the Catalog team''s review. Ownership is written right here in the code.'}
      - type: code
        lang: php
        file: 'src/Checkout/Cart/AddToCart.php'
        variant: good
        code: |
          // src/Catalog/Api/CatalogApi.php: the contract the Catalog team publishes
          interface CatalogApi
          {
              public function priceOf(string $sku): Money;
          }

          // The Checkout team knows only the contract, not Catalog's Doctrine entities
          final class AddToCart
          {
              public function __construct(private CatalogApi $catalog)
              {
              }

              public function __invoke(Cart $cart, string $sku): void
              {
                  $cart->add($sku, $this->catalog->priceOf($sku));
              }
          }
        marks:
          - {line: 4, tip: 'The Catalog team can change its internal tables freely; as long as this method stays the same, Checkout won''t even notice.'}
          - {line: 10, tip: 'The dependency is on the interface. If Catalog''s entity or repository crept in here, the boundary would be broken.'}
    aside:
      - type: tips
        items:
          - 'Before a big reorganisation, run a small experiment with one or two teams.'
          - 'Draw boundaries a single team can handle (usually 5 to 9 people); if one is bigger, split it.'
      - type: refs
        items:
          - {to: 'thinking/monolith-microservices', label: 'Monolith or microservices as teams grow'}
          - {to: 'thinking/hexagonal', label: 'Ports and adapters at the boundary'}
    check:
      q: 'In the inverse Conway maneuver, what is decided first: the teams, or the system''s divisions?'
      a: 'The system''s divisions. Teams are arranged along them, so the teams'' natural communication produces the architecture you want.'

  - slug: team-service-mismatch
    title: 'When teams and services don''t line up'
    kind: pitfall
    tldr: 'Three teams on one service, or one team with eight services: both are wrong; and changing only the org chart doesn''t change the code.'
    keywords: ['service ownership', 'reorg', 'team size', 'cognitive load', 'team service mismatch', 'org chart']
    blocks:
      - type: text
        body: |
          Many people think that splitting teams ends the problem. But if the team split and the code split don't match, friction remains. It's like three cooks trying to cook in one pot: one cook's spices ruin another's flavour. Below are four kinds of mismatch, each with its fix.
      - type: visual
        kind: compare
        caption: 'Mismatch vs match: team and code boundaries'
        columns:
          - title: 'What doesn''t line up'
            tone: bad
            icon: cross
            tip: 'In all four cases the team split and the code split run along different lines, so work and responsibility spread out.'
            items:
              - 'Three teams commit to one service'
              - 'One small team holds eight services'
              - 'The org chart changed, the code didn''t'
              - 'Everyone edits an ownerless shared library'
          - title: 'What lines up'
            tone: good
            icon: check
            tip: 'Each boundary has one owner, and the boundary''s size fits what the owner can handle.'
            items:
              - 'One service or module, one owning team'
              - 'Services only as big as a team can understand'
              - 'When teams change, the boundaries are redrawn'
              - 'Shared code has an owning team too'
      - type: quote
        body: 'One boundary, one owner. When the team changes, change the boundary.'
    aside:
      - type: pitfalls
        items:
          - 'Building microservices and assuming the teams are now independent. If one team changes every service, you only added network calls.'
          - 'Splitting services without looking at team capacity. A team of 3 will struggle to run 10 services.'
      - type: when
        use: ['The team has grown and people keep stepping on each other', 'Feature lead time keeps getting stuck in handoffs']
        avoid: ['The team is under 5 people; a modular monolith is enough']
    check:
      q: 'After building eight services, every feature still makes one team change all of them. What went wrong?'
      a: 'The service boundaries don''t match how the team actually works. Work that spreads across several services within one team means they are really one boundary, so keep them together or redraw the boundaries.'

flashcards:
  - q: 'What is Conway''s Law in one line?'
    a: 'The structure of a system copies the communication structure of the organisation that builds it.'
    more: |
      Code takes the shape of the lines along which teams talk. Three teams usually produce a system in three parts. It isn't a law of nature but an observation that has held many times.
    ref: conway-mirror
  - q: 'What goes wrong when you split teams by layer (UI, Backend, DB)?'
    a: 'Every feature touches every layer, so every feature involves every team. Tickets get handed off and wait.'
    more: |
      Two days of work waits through three teams' queues and becomes three weeks. Each team does its job well, yet it is still slow, because the delay is in the handoffs. The fix is full-stack teams split by business capability.
    ref: three-team-queue
  - q: 'What is the inverse Conway maneuver?'
    a: 'Arrange teams along the architecture you want, so the teams'' natural communication produces that architecture.'
    more: |
      Normally the teams come first and the system grows in their mould. Here you reverse the order: draw the boundaries you want, then put an owning team on each. Details: [[inverse-conway|the five steps]].
    ref: inverse-conway
  - q: 'How should teams and services be matched?'
    a: 'Each service or module gets one owning team, and its size stays within what that team can handle.'
    more: |
      When three teams commit to one service, nobody is accountable. When one small team holds eight services, it can run none of them well. Friction grows in both cases.
    ref: team-service-mismatch
  - q: 'How can you write down a module''s ownership in code?'
    a: 'In a CODEOWNERS file, listing the owning team per path, so a pull request on that path can''t merge without the owner''s review.'
    more: |
      On GitHub or GitLab, writing `/src/Billing/ @shop/billing-team` makes the Billing team an automatic reviewer for any change to Billing code. Ownership stops being talk and becomes something you can see.
    ref: inverse-conway
  - q: 'What should you take from another team''s module?'
    a: 'Only the interface or API they publish, never their Doctrine entities or internal classes.'
    more: |
      If you depend on internal classes, your code breaks whenever the owning team changes anything. If you depend on an interface, they can change anything inside as long as the contract holds. That is the whole point of a boundary.
    ref: inverse-conway
  - q: 'Why does changing only the org chart not help?'
    a: 'The code boundaries stay as they were. New teams on the old code split keep the friction.'
    more: |
      Conway's Law works both ways: change the teams and the system slowly follows; leave the system alone and the teams drift back to the old shape. A reorganisation needs the code boundaries and ownership redrawn too.
    ref: team-service-mismatch

quiz:
  - q: 'A company with three layer teams (UI, Backend, DB) takes 3 weeks for every feature. What is the best step?'
    hint: 'Is the delay in writing code, or in the handoffs?'
    options:
      - text: 'Form full-stack teams around business capabilities (such as Catalog and Checkout)'
        correct: true
        why: 'A feature finishes inside one team, so handoffs and waiting shrink.'
      - text: 'Hire two more people into each team'
        correct: false
        why: 'More people don''t shorten the queue; the delay is in handoffs and waiting, not in the amount of work.'
      - text: 'Write a more detailed ticket template'
        correct: false
        why: 'Better tickets reduce misunderstandings, but they don''t cut the wait in three queues.'
      - text: 'Move all the code into a single repository'
        correct: false
        why: 'Even in one repository the teams'' ownership split remains, so the handoffs stay the same.'
    ref: three-team-queue
  - q: 'Which of these are part of the inverse Conway maneuver?'
    hint: 'Remember the order: system divisions first, then the teams.'
    options:
      - text: 'Drawing the boundaries of the modules you want first'
        correct: true
        why: 'This is step one. Without the architecture you want, there is nothing to arrange the teams against.'
      - text: 'Deciding on one owning team for each boundary'
        correct: true
        why: 'A boundary without an owner doesn''t last. The owning team''s natural communication is what protects it.'
      - text: 'Keeping existing teams as they are and building the system in their mould'
        correct: false
        why: 'That is just letting Conway''s Law do what it likes, not using it on purpose.'
      - text: 'Writing a contract (interface or API) between teams'
        correct: true
        why: 'A boundary isn''t only a line; it is also the rules for crossing it.'
    ref: inverse-conway
  - q: 'A company splits into two big teams, but the code stays as it was and everyone works in the same folder. What will you see after a few months?'
    hint: 'If the boundary isn''t in the code, what will hold the team split?'
    options:
      - text: 'The two teams will step on each other''s code, with more merge conflicts and surprise breakage'
        correct: true
        why: 'With no boundary in the code, the team split exists only on paper. The friction stays as it was.'
      - text: 'The code will split in two by itself'
        correct: false
        why: 'Code doesn''t split by itself. You have to do it deliberately, with boundaries and ownership.'
      - text: 'All the problems will go away because the teams are smaller'
        correct: false
        why: 'Even with smaller teams, if they share the same code their work will collide.'
      - text: 'Nothing will change, because organisation and code are unrelated'
        correct: false
        why: 'Conway''s Law says they are related. A mismatch increases friction.'
    ref: team-service-mismatch
  - q: 'What is wrong with the Checkout team''s code below, from a boundary point of view?'
    lang: php
    code: |
      use App\Catalog\Entity\Product;

      final class AddToCart
      {
          public function __construct(private EntityManagerInterface $em)
          {
          }

          public function __invoke(Cart $cart, string $sku): void
          {
              $product = $this->em->getRepository(Product::class)
                  ->findOneBy(['sku' => $sku]);
              $cart->add($sku, $product->getPrice());
          }
      }
    hint: 'What happens if the Catalog team renames a column?'
    options:
      - text: 'Checkout depends directly on Catalog''s entity, so a change in Catalog will break Checkout'
        correct: true
        why: 'The internal entity is the Catalog team''s private business. Depending on it without a contract means there is no boundary.'
      - text: 'findOneBy is slow and find should be used'
        correct: false
        why: 'Speed isn''t the issue here. The issue is whose code has reached into whose internals.'
      - text: 'The class is final, so it can''t be tested'
        correct: false
        why: '`final` doesn''t prevent testing. The broken boundary is the real problem.'
      - text: 'Nothing, because both modules are in the same database'
        correct: false
        why: 'Even with one database, the code is owned separately; sharing it only raises the risk of breakage.'
    ref: inverse-conway
  - q: 'In which situation can teams and services be called well matched?'
    hint: 'Look at both ownership and capacity.'
    options:
      - text: 'Every service has one owning team, and the team can handle it'
        correct: true
        why: 'Responsibility is clear and the boundary fits the team''s capacity. You need both.'
      - text: 'All three teams can commit to every service, so nobody gets blocked'
        correct: false
        why: 'When everyone owns it, no one is responsible, and the code gets messy fast.'
      - text: 'There are twice as many services as teams'
        correct: false
        why: 'The count isn''t the measure. Ownership and team capacity are.'
      - text: 'One team looks after every service, so everything is in one place'
        correct: false
        why: 'If the team is large and the load heavy, no service runs well, and then splitting into services means little.'
    ref: team-service-mismatch
