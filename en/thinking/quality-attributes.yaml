slides:
  - slug: everything-at-once
    title: '"Fast, always up, secure, and cheap, please"'
    kind: story
    tldr: 'Asking for the maximum of everything isn''t a requirement, it''s a decision avoided; and vague wishes can''t be measured, so nobody knows when the work is done.'
    keywords: ['quality attributes', 'non-functional requirements', 'NFR', 'vague requirements', 'requirements', 'measurable goals']
    blocks:
      - type: text
        body: |
          An e-commerce client told Rahim's team, "The app has to be fast, always up, the most secure possible, and cheap to run." The team said, "Sure." Six months later the site crawled on sale day, and the client said, "I told you it had to be fast!" The team replied, "Nobody said how fast."
      - type: visual
        kind: compare
        caption: 'What the client asked for, and the questions nobody could answer'
        columns:
          - title: 'What was asked'
            tone: warn
            icon: star
            tip: 'All five were requested at "the best". In practice they pull against each other.'
            items:
              - 'Fast'
              - 'Always up'
              - 'Completely secure'
              - 'Cheap'
              - 'Easy to change'
          - title: 'Questions with no answer'
            tone: bad
            icon: warning
            tip: 'Behind every wish hides a number that nobody asked for.'
            items:
              - 'How fast: 200ms or 2 seconds?'
              - 'How available: 99% or 99.99%?'
              - 'What budget, how many taka a month?'
              - 'How many people arrive at once, and when?'
    aside:
      - type: problem
        body: 'A vague wish can''t be measured, and if you can''t measure it you can''t say whether the work is finished. So the argument happens after the release, when changing things costs the most.'
      - type: terms
        items:
          - {term: 'Quality attribute', meaning: 'Not what the system does but how well it does it: speed, uptime, security and so on.'}
          - {term: 'NFR', meaning: 'Non-functional requirement: another name for a quality attribute.'}
    check:
      q: 'What mistake did Rahim''s team make when the client said "it has to be fast"?'
      a: 'They never asked "how fast, and under what conditions?" Without a number, "fast" can''t be measured, so nobody knows when the goal has been met.'

  - slug: five-attributes-tradeoff
    title: 'Five qualities, and each one is paid for by another'
    kind: concept
    tldr: 'Speed, availability, security, maintainability and cost can''t all be maxed out together; raising one lowers another.'
    keywords: ['performance', 'availability', 'security', 'maintainability', 'cost', 'trade-off']
    blocks:
      - type: metaphor
        icon: truck
        title: 'The bus ticket: fast, comfortable, cheap'
        body: |
          Travelling from Dhaka to Chattogram, you can't have fast, comfortable and cheap all at once. An AC coach is comfortable but pricey, and a local bus is cheap but slow. Software is the same: every quality has a price, and you pay it out of another quality.
      - type: visual
        kind: table
        caption: 'Raise one quality and something else gives'
        headers: ['Quality', 'What you do to raise it', 'What drops or grows']
        rows:
          - cells: ['Speed', 'Cache, more RAM', 'Risk of stale data, cost']
            tip: 'A cache is a stored answer. It can go stale, and keeping it clean is a whole new job.'
          - cells: ['Availability', 'Two servers, replicas', 'Cost and complexity double']
            tip: 'To survive a failure you must keep spares of everything, and every spare brings its own problems.'
          - cells: ['Security', 'More checks, 2FA, encryption', 'Slower, harder to use']
            tip: 'Each extra guard is an extra step for the user or extra work for the database.'
          - cells: ['Maintainability', 'Clean layers, tests', 'Slower today']
            tip: 'You can skip it in today''s rush. But every later feature pays interest on that choice.'
          - cells: ['Low cost', 'Small servers, fewer copies', 'Speed and availability drop']
            tip: 'Saving money usually means fewer resources, which can mean less speed or less security.'
      - type: quote
        body: 'No system maxes out every quality. Deciding what to pay for what is the architecture decision.'
    aside:
      - type: remember
        body: 'Every time, ask: "To raise this quality, which other quality am I giving up?"'
      - type: refs
        items:
          - {to: 'scaling/load-latency', label: 'Measuring speed and load'}
          - {to: 'observability/metrics-slos', label: 'Measuring goals with SLOs'}
    check:
      q: 'You run two servers to raise availability. What does it cost you in the other qualities?'
      a: 'Cost roughly doubles and complexity grows: a load balancer, data syncing, and keeping the two servers consistent. In return the system stays up when one of them dies.'

  - slug: measurable-requirements
    title: 'Turn vague wishes into numbers'
    kind: howto
    tldr: 'Write each quality as a scenario, a measure and a target, and everyone can tell whether the work is done.'
    keywords: ['quality attribute scenario', 'SLO', 'p95', 'uptime', 'measurable requirement', 'load test']
    blocks:
      - type: text
        body: |
          Here's a template that makes a vague word measurable: in what situation, what do we measure, and what value counts as good. "Fast" becomes "when 100 people check out at once during a sale, p95 latency stays under 300ms." p95 means 95 out of 100 requests are faster than that figure. The same target is later checked by tests and monitoring.
      - type: visual
        kind: table
        caption: 'From vague wish to measurable target'
        headers: ['Vague', 'Measurable']
        rows:
          - cells: ['Fast', 'Checkout p95 < 300ms under 100 concurrent users']
            tip: 'It has a situation, a measure and a number. Now a load test can actually verify it.'
          - cells: ['Always up', 'Monthly uptime >= 99.9% (no more than about 43 minutes down a month)']
            tip: '99.9% allows roughly 43 minutes of downtime a month. Knowing that number lets you work out the cost.'
          - cells: ['Secure', 'Login locked 15 minutes after 5 wrong passwords; critical CVEs fixed in 7 days']
            tip: 'A few specific, checkable rules. Saying "completely secure" says nothing.'
          - cells: ['Cheap', 'Monthly infra cost <= 30,000 taka']
            tip: 'With a budget ceiling, you choose the other qualities inside that limit.'
          - cells: ['Easy to change', 'Adding a new payment gateway takes <= 3 days']
            tip: 'The test: time how long this change really takes. If it takes longer, the structure is wrong.'
      - type: code
        lang: yaml
        file: 'docs/quality-requirements.yaml'
        code: |
          - id: QA-1
            attribute: performance
            scenario: 'When 100 people press checkout at once during a sale'
            measure: 'p95 latency of the checkout API'
            target: '< 300ms'
            verify: 'k6 load test, in CI before every release'

          - id: QA-2
            attribute: availability
            scenario: 'When one app server dies'
            measure: 'monthly uptime'
            target: '>= 99.9%'
            verify: 'health check + external uptime monitor'
        marks:
          - {line: 6, tip: 'Without a verify line the target is only on paper. Write down how it will be checked, too.'}
    aside:
      - type: commands
        title: 'Measuring speed'
        items:
          - {cmd: 'k6 run checkout-test.js', desc: 'run a load test and get the p95'}
      - type: refs
        items:
          - {to: 'observability/metrics-slos', label: 'SLIs, SLOs and error budgets'}
    check:
      q: 'Which three things do you add to "the system should be fast" to make it measurable?'
      a: 'A scenario (how many users, when), a measure (such as p95 latency) and a target value (such as under 300ms).'

  - slug: choose-the-top-two
    title: 'Pick the top two first, then put limits on the rest'
    kind: howto
    tldr: 'For each system pick the two most important qualities, set a minimum bar for the others, and keep the price of each extra "nine" in mind.'
    keywords: ['prioritize quality attributes', 'nines', 'availability cost', 'trade-off decision', 'priorities', 'ADR']
    blocks:
      - type: text
        body: |
          You can't give every quality equal weight. In a money app like bKash, security and availability come first and cost comes last. On a personal blog, cost and maintainability come first and availability comes last. Write the decision down, because six months from now someone will ask, "Why didn't we go for 99.99%?"
      - type: visual
        kind: steps
        caption: 'Four steps to prioritise qualities'
        steps:
          - {title: '1. List all five', body: 'Speed, availability, security, maintainability, cost.', tip: 'With all five in front of you, you notice the one you were forgetting.'}
          - {title: '2. Pick two', body: 'Which two hurt the business most if they break?', tip: 'Think in terms of damage: which failure would wreck the business or its users'' trust?'}
          - {title: '3. Bound the rest', body: 'Set a minimum measurable bar for each of them.', tip: 'The others aren''t dropped, just lower priority. They still must not fall below a bar.'}
          - {title: '4. Write it down', body: 'Record the decision and why in an ADR.', tip: 'A short ADR is enough. If you skip the reason, the same argument returns later.'}
      - type: visual
        kind: bars
        caption: 'Maximum downtime allowed per month (in minutes, approximately)'
        items:
          - {label: '99%', value: 432, display: '~7 hours', tone: warn, tip: 'Fine for small or internal systems. Cheap, but you accept hours of downtime.'}
          - {label: '99.9%', value: 43, display: '~43 minutes', tone: good, tip: 'A reasonable target for most business systems. It needs a standby server that is ready to go.'}
          - {label: '99.99%', value: 4.3, display: '~4 minutes', tone: accent, tip: 'No time for a human to step in, so recovery must be fully automatic. Cost climbs sharply.'}
          - {label: '99.999%', value: 0.4, display: '~26 seconds', tone: bad, tip: 'Overkill almost everywhere. Unless it''s something like banking or telecom, it isn''t worth the price.'}
      - type: quote
        body: 'Every extra "nine" costs many times more than the last. Don''t ask for more than you really need.'
    aside:
      - type: tips
        items:
          - 'Ask the users: "What does an hour of downtime cost you?" The answer tells you how much availability you need.'
          - 'Revisit the priorities every few months; when the business changes, the targets change.'
      - type: refs
        items:
          - {to: 'thinking/documentation', label: 'Writing ADRs'}
    check:
      q: 'Why is 99.999% availability not always a good goal?'
      a: 'Each extra nine multiplies the cost, and most businesses don''t need it. If it costs more than the downtime would, it''s wasted money.'

flashcards:
  - q: 'What is a quality attribute?'
    a: 'Not what a system does but how well it does it: speed, availability, security, maintainability, cost.'
    more: |
      The same feature can be slow or fast, safe or unsafe. These qualities steer architecture decisions because they are the hardest things to change later.
    ref: five-attributes-tradeoff
  - q: 'What are the five main quality attributes?'
    a: 'Performance (speed), availability, security, maintainability and cost.'
    more: |
      There are more, such as scalability, observability and usability, but these five start most discussions. The key point is that each has a price, and that price is paid out of another quality.
    ref: five-attributes-tradeoff
  - q: 'What goes up when you raise availability?'
    a: 'Cost and complexity, because you need extra servers, replicas, a load balancer and data syncing.'
    more: |
      To stay up when one thing dies, you must keep a spare. That spare needs its own maintenance, monitoring and data syncing.
    ref: five-attributes-tradeoff
  - q: 'Why is "the system should be fast" a bad requirement?'
    a: 'It can''t be measured. Without knowing how fast and under what conditions, nobody can say when it''s done.'
    more: |
      A good requirement has a scenario, a measure and a target: "with 100 people checking out at once, p95 latency stays under 300ms." Then a load test can really verify it.
    ref: measurable-requirements
  - q: 'What does p95 latency mean?'
    a: 'The time within which 95 out of every 100 requests finish. The other 5 are slower.'
    more: |
      An average hides slow requests. p95 or p99 shows how bad the worst experiences are, and those slow requests are exactly what users remember. More in [[observability/metrics-slos|metrics and SLOs]].
    ref: measurable-requirements
  - q: 'How much downtime a month does 99.9% availability allow?'
    a: 'About 43 minutes. At 99% it is about 7 hours, and at 99.99% about 4 minutes.'
    more: |
      Each extra nine cuts the allowed downtime to a tenth, but the cost grows many times over. So first find out what an hour of downtime costs the business.
    ref: choose-the-top-two
  - q: 'Why can''t all quality attributes get equal priority?'
    a: 'Raising one lowers another. So pick the two most important for the business first, then put a bar under the rest.'
    more: |
      A money app puts security and availability first; a personal blog puts cost and maintainability first. Writing down why you chose them is the real work, because everyone will later ask "why this and not that?"
    ref: choose-the-top-two

quiz:
  - q: 'Which of these are good, measurable requirements?'
    hint: 'Does it have a scenario, a measure and a number?'
    options:
      - text: '"With 500 people arriving at once in a flash sale, the product page p95 is under 400ms"'
        correct: true
        why: 'It has a scenario, a measure and a target, and a load test can verify it.'
      - text: '"Monthly uptime >= 99.9%"'
        correct: true
        why: 'It has a measure and a number. It means no more than about 43 minutes of downtime a month.'
      - text: '"The system will be very secure"'
        correct: false
        why: 'There is no way to measure it, nor any value that would count as "very".'
      - text: '"The site should never be slow"'
        correct: false
        why: '"Never" and "slow" are both vague; it doesn''t say how slow, or in what situation.'
    ref: measurable-requirements
  - q: 'What is missing from this requirement?'
    lang: yaml
    code: |
      - id: QA-3
        attribute: performance
        scenario: 'When a user searches'
        target: 'fast response'
    hint: 'How fast? What will be measured?'
    options:
      - text: 'A measure (such as p95 latency) and a numeric target (such as < 200ms)'
        correct: true
        why: '"Fast response" can''t be measured. Without a number, nobody can say whether the work is done.'
      - text: 'A longer scenario description'
        correct: false
        why: 'A longer description doesn''t help without a measure.'
      - text: 'A different id format'
        correct: false
        why: 'The id isn''t the problem here.'
      - text: 'Nothing, it''s fine as it is'
        correct: false
        why: '"Fast" means five different things to five people, so there is no way to verify it.'
    ref: measurable-requirements
  - q: 'A client says, "We need 99.999% uptime." What''s the best response?'
    hint: 'Get the client to think in terms of business loss.'
    options:
      - text: 'Ask "What does an hour of downtime cost you?" and match the target to that loss and the price'
        correct: true
        why: 'Each extra nine costs many times more. If the cost exceeds the loss, it''s wasted money.'
      - text: 'Say "OK" and move on'
        correct: false
        why: 'Cost and complexity will multiply, and the client doesn''t know that.'
      - text: 'Say "That''s impossible" and end the conversation'
        correct: false
        why: 'It isn''t impossible, just very expensive. It needs a discussion.'
      - text: 'Quietly decide on 99% yourself'
        correct: false
        why: 'Choosing a number without knowing the client''s losses is just a guess.'
    ref: choose-the-top-two
  - q: 'Imran added a cache and made the product page 10 times faster. What price might he pay in other qualities?'
    hint: 'What does a cache store, and when does stored data get old?'
    options:
      - text: 'A risk of stale data, plus the cost and complexity of running the cache'
        correct: true
        why: 'A cache serves stored answers, so it may show an old price after a change. Invalidating it correctly is extra complexity.'
      - text: 'Security improves'
        correct: false
        why: 'A cache doesn''t improve security; a misconfigured one can even show one user''s data to another.'
      - text: 'There is no price, only benefit'
        correct: false
        why: 'Every quality has a price. For a cache it is stale data and complexity.'
      - text: 'Availability drops because a cache shuts the whole server down'
        correct: false
        why: 'A cache usually helps availability or leaves it unchanged. The cost is elsewhere.'
    ref: five-attributes-tradeoff
  - q: 'How should quality priorities differ between a personal blog and a mobile banking app?'
    hint: 'Which one does more damage when it breaks?'
    options:
      - text: 'Banking puts security and availability first; the blog puts cost and maintainability first'
        correct: true
        why: 'The damage is different. A banking failure costs money and trust, while a blog can survive a few hours down.'
      - text: 'Both should max out every quality'
        correct: false
        why: 'Paying for top availability on a blog is a waste.'
      - text: 'The blog puts security first, banking puts cost first'
        correct: false
        why: 'That''s backwards. A money app can''t cut corners on security to save money.'
      - text: 'There is no need to set priorities'
        correct: false
        why: 'If you don''t, the argument comes after the release, when changes are most expensive.'
    ref: choose-the-top-two
