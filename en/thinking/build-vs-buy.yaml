slides:
  - slug: too-many-machines
    title: 'Five hundred users, six technologies'
    kind: story
    tldr: 'Every new technology brings the cost of running it for life, not just of installing it, and a small team sinks under that weight.'
    keywords: ['complexity', 'tech stack', 'over-engineering', 'new technology', 'running cost', 'operational cost']
    blocks:
      - type: metaphor
        icon: shop
        title: 'New machines at the biryani restaurant'
        body: |
          Karim's biryani restaurant has two stoves and three staff. After visiting a big restaurant, he buys a tandoor, a coffee machine and an ice-cream machine. Now each machine needs its own repairman, its own spare parts and its own training. In the Friday lunch rush the tandoor breaks down, and nobody in the restaurant knows how to fix it.
      - type: text
        body: |
          A team of three does exactly this when it puts MongoDB, Kafka, Elasticsearch and Kubernetes under an app with 500 users, thinking "that's what the big companies run."
      - type: visual
        kind: compare
        caption: 'The same app with two different stacks: which one costs more sleep?'
        columns:
          - title: 'What would have worked fine'
            tone: good
            icon: check
            tip: 'Two familiar technologies. All three people know both well, so anyone can fix any problem.'
            items:
              - 'Symfony: a single app'
              - 'PostgreSQL: data, search and queue in one'
              - 'One server, a simple deploy'
          - title: 'What got installed'
            tone: bad
            icon: warning
            tip: 'Six technologies, three people. Each needs its own deploy, backup, monitoring and upgrades, and nobody knows them all deeply.'
            items:
              - 'Symfony + PostgreSQL (as before)'
              - 'MongoDB: because someone said "fast"'
              - 'Kafka: because "we''ll need to scale later"'
              - 'Elasticsearch: for search'
              - 'Kubernetes: to run all of the above'
    aside:
      - type: story
        title: 'The 3 a.m. phone call'
        body: |
          At one startup, the person who had set up Kafka quit. Three months later one night messages got stuck and orders started piling up. The other two spent the whole night reading documentation, because the technology wasn't known by the team. It was known by one person.
      - type: terms
        items:
          - {term: 'Stack', meaning: 'All the technologies it takes to run an app, taken together.'}
          - {term: 'Over-engineering', meaning: 'Building a bigger, more complex solution than the problem needs.'}
    check:
      q: 'Even when a technology is free, where does it still cost the team?'
      a: 'In learning, deploying, monitoring, backups, upgrades and fixing it when it breaks. Each takes team time, and the bill keeps coming for as long as the technology stays.'

  - slug: complexity-budget
    title: 'The complexity budget and boring technology'
    kind: concept
    tldr: 'A team''s attention is a limited budget: spend it on new technology only where it moves the business forward, and use familiar tools everywhere else.'
    keywords: ['complexity budget', 'boring technology', 'innovation token', 'familiar technology', 'tech choices']
    blocks:
      - type: text
        body: |
          Just as the restaurant's three staff can learn to run only a few machines well, a team can know only a few technologies deeply. That limit is the **complexity budget**: the amount of complexity you can afford to spend. Every new database, queue or language draws from it. **Boring technology** doesn't mean old or weak. It means technology whose ways of breaking are already well known to everyone.
      - type: visual
        kind: table
        caption: 'Five costs that come with every new technology'
        headers: ['Cost', 'What it involves', 'How long it lasts']
        rows:
          - cells: ['Learning', 'Teaching the whole team', 'Again with every new hire']
            tip: 'One person knowing it isn''t enough. When they go on holiday or quit, the rest are helpless, so everyone has to learn.'
          - cells: ['Running', 'Deploy, monitoring, backup, alerts', 'Every day']
            tip: 'Every technology needs its own dashboard, its own backup method and its own alerts, built and watched.'
          - cells: ['Upgrading', 'Version upgrades, security patches', 'Several times a year']
            tip: 'Postpone upgrades and you leave security holes; do them and something may break. Both take time.'
          - cells: ['Breaking', 'Unfamiliar errors, midnight outages', 'Any time']
            tip: 'A familiar technology''s error is one search away from a fix. With an unfamiliar one, the same problem eats the whole night.'
          - cells: ['Leaving', 'Moving the data to something else', 'Once, but the costliest']
            tip: 'Easy to put in, hard to take out. Once the data piles up, dropping a technology becomes a project of its own.'
      - type: points
        title: 'Rules for spending the budget'
        style: check
        items:
          - 'Ask first: can what we already have do the job? If yes, add nothing new.'
          - 'Only one unfamiliar technology at a time; the next one only after the team knows the last.'
          - 'Adopt new technology only where it puts the business ahead of its competitors.'
      - type: quote
        body: 'Buying a new technology is a one-time cost. Running it is a lifetime one.'
    aside:
      - type: story
        title: 'Three innovation tokens'
        body: |
          In his well-known essay "Choose Boring Technology", Dan McKinley suggests that every company has only about three "innovation tokens". An unfamiliar database spends one, an unfamiliar language spends another. So spend your tokens carefully, where the payoff is greatest.
      - type: remember
        body: 'Boring doesn''t mean bad. Boring means no surprises, and in production no surprises is what you want.'
      - type: refs
        items:
          - {to: 'soft-skills/discipline', label: 'Reality over hype'}
    check:
      q: 'What does "boring technology" really mean?'
      a: 'Not old or weak technology, but technology whose failure modes are well known from years of use. So there are fewer surprises, and fixes are easy to find.'

  - slug: three-roads
    title: 'Three roads: build, buy, open source'
    kind: compare
    tldr: 'Build what sets your business apart, buy what everyone needs in the same way, and take open source when you can run a mature tool.'
    keywords: ['build vs buy', 'open source', 'SaaS', 'make or buy', 'core domain', 'vendor']
    blocks:
      - type: metaphor
        icon: shop
        title: 'Three ways to get the restaurant''s firni'
        body: |
          Karim can **make** firni (a rice pudding) from his own recipe: the taste is entirely his, but it takes a month of testing and cooking every day. He can **buy** it every day from a sweet shop: it's available from tomorrow, but the price and taste are in the shop's hands. Or he can use a **free recipe** published by a famous chef: the recipe costs nothing, but shopping, cooking and any spoiled batch are on him. Open source is that third option.
      - type: visual
        kind: table
        caption: 'What you get and what you give on each road'
        headers: ['', 'Build', 'Buy (SaaS)', 'Open source']
        rows:
          - cells: ['Upfront cost', 'High: weeks to months', 'Low: live in days', 'Medium: setup and learning']
            tip: 'Buying gets you started fastest. If you build, you don''t get any benefit from day one.'
          - cells: ['Ongoing cost', 'Your team maintains it', 'Monthly bill, grows with use', 'Servers + people to run it']
            tip: 'No road is free. The cost just lands in different places: sometimes the bill, sometimes people''s time.'
          - cells: ['Control', 'All yours', 'As much as the vendor allows', 'Code is open, you can change it']
            tip: 'With something you bought, a new feature means waiting for the vendor. With your own or open code you can change it yourself.'
          - cells: ['Main risk', 'Takes long, every bug is yours', 'Price rises, lock-in, shutdown', 'Lacking the skills to run it']
            tip: 'Each road has a different risk. Before deciding, ask: can my team handle this one?'
          - cells: ['Fits when', 'It is your real edge', 'Everyone needs the same thing', 'Tool is mature, you can run it']
            tip: 'For example: build your own pricing rules; buy payments, SMS and email; take a framework and database as open source.'
      - type: quote
        body: 'Build what sets you apart from competitors. For what everyone needs in the same way, buy or use something ready-made.'
    aside:
      - type: terms
        items:
          - {term: 'SaaS', meaning: 'A service that runs on someone else''s servers and is used for a monthly fee. You run nothing yourself.'}
          - {term: 'Core domain', meaning: 'The part of the business that customers come to you for.'}
          - {term: 'Not Invented Here', meaning: 'Insisting on building it yourself even when a good solution already exists.'}
      - type: pitfalls
        items:
          - 'Building your own login, payments or encryption: a small mistake there is very costly, and tested solutions are right at hand.'
          - 'Putting production on one person''s hobby open source project.'
    check:
      q: 'For a food delivery app, which should you build and which buy: the rider assignment rules, or sending SMS?'
      a: 'Build the rider assignment rules, because that''s what sets the business apart. Sending SMS is the same for everyone, so buy it.'

  - slug: tco-worked-example
    title: 'TCO: working out the real three-year price'
    kind: howto
    tldr: 'The price isn''t just the licence or the monthly bill: setup + running + people''s time + exit cost. Compare three-year totals.'
    keywords: ['TCO', 'total cost of ownership', 'total cost', 'engineer time', 'calculation', 'exit cost']
    blocks:
      - type: text
        body: |
          **TCO** (total cost of ownership) is the total cost of a thing over the whole time you keep it. The biggest and best-hidden item in it is engineer time. Below is a calculation for adding product search to a shop app: **build** = write it yourself on PostgreSQL full-text search, **buy** = a SaaS search service, **open source** = OpenSearch on your own server. We assume one engineer-day costs 5,000 taka.
      - type: visual
        kind: table
        caption: 'Product search: three-year cost in thousands of taka (assumed figures for the example)'
        headers: ['Cost item', 'Build', 'Buy', 'Open source']
        rows:
          - cells: ['Initial build or setup', '30 days = 150', '5 days = 25', '15 days = 75']
            tip: 'Engineer-days x 5,000 taka. If you buy, you only plug in an API, so the start is cheapest.'
          - cells: ['36 months of bills or servers', '0 (runs in the existing database)', '15 x 36 = 540', '20 x 36 = 720']
            tip: 'OpenSearch is free to license but needs its own server, assumed at 20,000 a month. The SaaS bill is 15,000 a month.'
          - cells: ['36 months of maintenance', '2 days a month = 360', 'half a day a month = 90', '3 days a month = 540']
            tip: 'Upgrades, backups, monitoring, fixing problems: days per month x 5,000 x 36. This is the line everyone forgets.'
          - cells: ['Total over three years', '510', '655', '1,335']
            tip: 'In this example the "free" open source option is the most expensive, because it needs both a server and running time. Your numbers may give a different result.'
      - type: visual
        kind: bars
        caption: 'The three-year totals side by side'
        items:
          - {label: 'Build', value: 510, display: '510,000 taka', tone: good, tip: '30 days of work upfront, but no new server and no bill. Richer features would still cost more time later.'}
          - {label: 'Buy', value: 655, display: '655,000 taka', tip: 'Most of the cost is the monthly bill. If usage grows tenfold the bill will too, so work that out separately.'}
          - {label: 'Open source', value: 1335, display: '1,335,000 taka', tone: bad, tip: 'The licence costs nothing, yet the total is highest: 720,000 on the server and 540,000 on running it.'}
      - type: points
        title: 'The four steps of the calculation'
        style: number
        items:
          - 'Initial cost: engineer-days to build or set up x the cost of one day.'
          - 'Running cost: monthly bill or server + maintenance days per month, over 36 months.'
          - 'Exit cost: also write down how many days it would take to drop this tomorrow.'
          - 'Add it up and compare, then decide with risk and your team''s skills in mind.'
    aside:
      - type: pitfalls
        items:
          - 'Counting engineer time as zero: the most common mistake.'
          - 'Looking only at the first month''s bill and not at what it will be if usage grows tenfold.'
          - 'When the numbers are about equal, picking the shiny new option over the familiar one.'
      - type: remember
        body: 'Price = setup + running + exit. The licence is only one line of it.'
      - type: refs
        items:
          - {to: 'thinking/estimation', label: 'Quick sums on paper'}
          - {to: 'infra/finops', label: 'FinOps: working out costs'}
    check:
      q: 'If an open source tool''s licence is free, which costs still remain in its TCO?'
      a: 'Setup and learning time, the server bill, the monthly time for upgrades, backups and monitoring, and the cost of moving to something else later.'

  - slug: no-exit-door
    title: 'You bought it, but left no exit door'
    kind: pitfall
    tldr: 'If a vendor''s SDK spreads across your code, switching vendors is nearly impossible; behind an interface, the change happens in one place.'
    keywords: ['vendor lock-in', 'exit plan', 'interface', 'Notifier', 'switching vendors', 'lock-in']
    blocks:
      - type: text
        body: |
          Buying isn't the mistake. Letting the vendor into every corner of your code is. If the sweet shop's name were printed on all of Karim's menus, bills and signboards, he couldn't leave even when the shop doubled its prices. In software this is called **vendor lock-in**. In the code below, the SMS vendor's class sits right inside business code.
      - type: code
        lang: php
        file: 'src/Service/OrderService.php'
        variant: bad
        code: |
          // code like this is scattered across 40 more services
          public function confirm(Order $order): void
          {
              $order->confirm();
              $this->em->flush();

              $twilio = new \Twilio\Rest\Client($this->sid, $this->token);
              $twilio->messages->create($order->getPhone(), [
                  'from' => $this->from,
                  'body' => 'Your order has been confirmed',
              ]);
          }
        marks:
          - {line: 7, tip: 'The vendor''s name is inside business code. To switch vendors, each of these 40 places must be rewritten and retested.'}
          - {line: 8, tip: 'Even the way you call it is vendor-specific. Another vendor''s SDK will name its methods and options differently.'}
      - type: code
        lang: php
        file: 'src/Service/OrderService.php'
        variant: good
        code: |
          public function __construct(
              private EntityManagerInterface $em,
              private TexterInterface $texter,   // Symfony Notifier's interface
          ) {
          }

          public function confirm(Order $order): void
          {
              $order->confirm();
              $this->em->flush();

              $this->texter->send(
                  new SmsMessage($order->getPhone(), 'Your order has been confirmed'),
              );
          }
        marks:
          - {line: 3, tip: 'The code knows only an interface. Which vendor sends the SMS is decided by a DSN in config, and this class never knows.'}
          - {line: 12, tip: 'To switch vendors you change the DSN in .env and one composer package; this line stays exactly as it is.'}
      - type: quote
        body: 'Only one place should know the vendor. Everything else knows only the interface.'
    aside:
      - type: commands
        title: 'The whole job of switching vendors'
        items:
          - {cmd: 'composer require symfony/twilio-notifier', desc: 'Install the Notifier bridge for the vendor you want'}
          - {cmd: 'TWILIO_DSN=twilio://SID:TOKEN@default?from=FROM', desc: 'The DSN in .env.local; the vendor''s name lives only here'}
      - type: tips
        items:
          - 'If Symfony has no bridge for your vendor, write a small interface of your own and keep all the vendor''s code in a single adapter class.'
          - 'Before signing, ask: in what format can I get my data out, and how easily?'
      - type: refs
        items:
          - {to: 'thinking/hexagonal', label: 'Keeping vendors apart with ports and adapters'}
          - {to: 'ledgers/third-party-integrations', label: 'Integrating with outside services'}
    check:
      q: 'In a good design, how many places do you touch to change SMS vendors, and why?'
      a: 'One: the config or a single adapter class. The rest of the code knows only the interface and never learns the vendor''s name.'

flashcards:
  - q: 'What is a complexity budget?'
    a: 'The limit on how much complexity a team can handle at once. Every new technology spends from this budget.'
    more: |
      A team's attention and time are limited. Every new database, queue or language brings learning, running and fixing. When the budget runs out, the team can no longer build features and only tends machinery. So before adding anything, check whether what you already have can do the job.
    ref: complexity-budget
  - q: 'What does "boring technology" mean?'
    a: 'Mature, widely used technology whose failure modes and fixes are already well known, such as PostgreSQL.'
    more: |
      Boring doesn't mean old or weak. It means few surprises: errors have known fixes, experienced people are easy to find, and the tooling is mature. New technology hides unknown problems that are found only in production.
    ref: complexity-budget
  - q: 'What ongoing costs does a new technology bring?'
    a: 'Learning, running (deploy, monitoring, backup), upgrading (versions, patches), fixing when it breaks, and finally the cost of removing it.'
    more: |
      Installing is a one-time cost, but these five continue for as long as the technology stays. Most are paid in team time, not money, so they don't show up on a bill. If the technology lives in one person's head, the whole team is in trouble when they leave.
    ref: complexity-budget
  - q: 'What should you build yourself, and what should you buy?'
    a: 'Build what sets your business apart. Buy what everyone needs in the same way (payments, SMS, email).'
    more: |
      Building takes time and attention, so spend it where the business is really strong, its core domain. For things everyone needs, others have spent years making good solutions, and rebuilding them wastes time. For a detailed comparison see [[three-roads|the three roads]].
    ref: three-roads
  - q: 'Open source software is "free", so where is the cost?'
    a: 'The licence is free, but servers, setup, upgrades, backups, monitoring and fixing problems are all on you.'
    more: |
      It's like a free recipe: the recipe costs nothing, but the shopping, the cooking and any spoiled batch are yours. A self-run open source tool often has a higher total cost than SaaS, because people's time is the most expensive part. Still, with a mature tool and skilled people to run it, it can be the best road.
    ref: three-roads
  - q: 'What is TCO (total cost of ownership)?'
    a: 'The total cost of a thing for as long as you keep it: setup + running + people''s time + eventually leaving it.'
    more: |
      Deciding by the licence or the first month's bill alone is a mistake. A typical TCO covers three years: initial engineer-days, 36 months of bills or servers, maintenance days each month, and the cost of moving away. Add everything up before you compare.
    ref: tco-worked-example
  - q: 'Which cost does a TCO calculation most often leave out?'
    a: 'Engineer time: the days spent on setup, learning and monthly maintenance.'
    more: |
      You can see a bill, but people's time never shows up on an invoice. Yet 3 days of maintenance a month, at 5,000 taka a day, comes to 540,000 taka over three years. And the features you couldn't build in that time are a separate loss.
    ref: tco-worked-example
  - q: 'What is vendor lock-in, and how do you prevent it?'
    a: 'Depending on a vendor so much that leaving is nearly impossible. Prevent it by putting the vendor behind an interface.'
    more: |
      If a vendor's SDK is spread through your code, then when the vendor raises prices or shuts down, you have to rewrite everything. If business code knows only an interface, a change touches one adapter or config file. Also make sure you can export your data. More: [[thinking/hexagonal|ports and adapters]].
    ref: no-exit-door

quiz:
  - q: 'A team of four has 2,000 users and needs to do some work, like sending email, in the background. Someone says, "Let''s install Kafka, we''ll need to scale later." What is the best decision?'
    hint: 'First check whether what you already have can do the job.'
    options:
      - text: 'Use Symfony Messenger with the PostgreSQL or Redis you already run as the queue'
        correct: true
        why: 'There is no new technology to run, yet the job gets done. If you really need more later, you can change Messenger''s transport.'
      - text: 'Install Kafka, because changing later will be hard'
        correct: false
        why: 'This load needs no Kafka, but you''d carry its running burden from day one. With Messenger, changing transport later isn''t hard anyway.'
      - text: 'Write your own queue system'
        correct: false
        why: 'Everyone needs a queue in the same way, and tested solutions are close at hand. Building it wastes time, and the bugs would be yours.'
      - text: 'Send the email inside the request, since any queue is complexity'
        correct: false
        why: 'Adding Messenger on an existing database costs almost no complexity, and it really does solve the problem of making users wait.'
    ref: complexity-budget
  - q: 'If you run an open source search engine on your own server, which of these costs will you pay?'
    hint: 'Think of the free recipe: what is free, and what is on you?'
    options:
      - text: 'The monthly server bill'
        correct: true
        why: 'The software may be free, but the machine to run it isn''t.'
      - text: 'The time to apply version upgrades and security patches'
        correct: true
        why: 'When you run it, keeping it updated is your job; skip it and you leave security holes.'
      - text: 'The software licence fee'
        correct: false
        why: 'This is usually the one cost that is zero in open source, and people look only at it and think everything is free.'
      - text: 'Your own team''s time to fix it when it breaks at midnight'
        correct: true
        why: 'With SaaS that''s the vendor''s job. When you run it yourself, the phone call comes to your team.'
    ref: three-roads
  - q: 'For building reports there are two roads: SaaS at 20,000 taka a month, or build it yourself for 60 engineer-days, then 3 days of maintenance a month. One engineer-day costs 5,000 taka. Which is right on a three-year view?'
    hint: 'Build = initial days x 5,000 + monthly days x 5,000 x 36. SaaS = monthly bill x 36.'
    options:
      - text: 'SaaS is cheaper: 720,000 vs 840,000 for building'
        correct: true
        why: 'SaaS: 20,000 x 36 = 720,000. Build: 60 x 5,000 = 300,000, plus 3 x 5,000 x 36 = 540,000, total 840,000.'
      - text: 'Building is cheaper: 300,000 vs SaaS at 720,000'
        correct: false
        why: '300,000 is only the initial cost. It leaves out 540,000 of 36-month maintenance, the most familiar TCO mistake.'
      - text: 'Building is cheaper because there is no monthly bill'
        correct: false
        why: 'There is no bill, but there is engineer time, and that is the largest cost.'
      - text: 'They are equal, so pick the more modern one'
        correct: false
        why: 'The numbers aren''t equal. And even if they were, risk and team skills would decide, not novelty.'
    ref: tco-worked-example
  - q: 'What is the long-term problem in the code below?'
    lang: php
    code: |
      final class InvoiceService
      {
          public function send(Invoice $invoice): void
          {
              $pdf = (new \AcmePdf\Client($_ENV['ACME_PDF_KEY']))
                  ->render('invoice', $invoice->toArray());

              (new \AcmeMail\Client($_ENV['ACME_MAIL_KEY']))
                  ->send($invoice->getEmail(), 'Invoice', $pdf);
          }
      }
    hint: 'If AcmePdf triples its price tomorrow, how many files must change?'
    options:
      - text: 'Vendor classes sit directly in business code, so switching vendors means rewriting every such place'
        correct: true
        why: 'With no interface in between, the vendor''s name and way of calling it spread through the code. That is lock-in.'
      - text: 'Two vendors are used together when one would have been enough'
        correct: false
        why: 'Using different vendors for different jobs is normal. The problem isn''t the number but how tangled they are with your code.'
      - text: 'Buying PDF and email services was the mistake; they should have been built in-house'
        correct: false
        why: 'Both are things everyone needs in the same way, so buying is the right call. The mistake was not leaving an exit door.'
      - text: 'The class being final prevents switching vendors'
        correct: false
        why: '`final` only blocks inheritance. What blocks switching is the vendor''s class sitting right inside.'
    ref: no-exit-door
  - q: 'For an online bookshop, which of these are reasonable to build yourself?'
    hint: 'Which jobs set this shop apart from other shops?'
    options:
      - text: 'Your own rules for recommending books from a reader''s history'
        correct: true
        why: 'This could be the shop''s edge; a ready-made solution doesn''t know this business''s special knowledge.'
      - text: 'Your own password-hashing algorithm'
        correct: false
        why: 'Building security primitives yourself is dangerous. Symfony''s password hasher has been tested for years.'
      - text: 'Your own payment gateway for taking cards'
        correct: false
        why: 'It involves licences, compliance and huge risk, and customers see no added benefit. Buy it.'
      - text: 'Your own rules for an offer that swaps old books for new ones'
        correct: true
        why: 'This rule is specific to this business, no ready-made tool will have it, and it is what attracts customers.'
    ref: three-roads
  - q: 'A new project is starting. Everyone on the team knows PostgreSQL well. An ad for a new database says "twice as fast". What should you do?'
    hint: 'Is speed a measured problem right now, or just something in an ad?'
    options:
      - text: 'Start with PostgreSQL, and consider alternatives only if a measured problem appears'
        correct: true
        why: 'A familiar technology means fewer surprises and quicker fixes. Spending complexity budget on a problem you don''t yet have makes no sense.'
      - text: 'Take the new database, because faster means better'
        correct: false
        why: 'There is no guarantee the ad''s speed applies to your workload, and the team doesn''t know how the unfamiliar technology fails.'
      - text: 'Use both at once, to cover every angle'
        correct: false
        why: 'Two databases means double the running cost and the extra work of keeping data in sync, with no gain.'
      - text: 'Delay the decision and benchmark both for six months'
        correct: false
        why: 'Six months of benchmarks for a problem you don''t have is waste too. Starting with the familiar tool is fastest and safest.'
    ref: complexity-budget
