slides:
  - slug: everyone-jumps-in
    title: '3 a.m.: everyone''s hands in the same pot'
    kind: story
    tldr: 'In an outage the biggest danger is often not the root problem but the chaos: five people change production at once and nobody knows what changed.'
    keywords: ['incident', 'outage', 'on-call', 'chaos', 'live debugging', 'incident handling']
    blocks:
      - type: metaphor
        icon: fire
        title: 'A fire in the neighborhood'
        body: |
          When a fire breaks out in the neighborhood, everyone runs with a bucket. Someone throws water the wrong way, someone blocks the door, and nobody knows where it started. The fire service has a leader, split duties, and one first rule: stop the fire spreading. Finding the cause comes later.
      - type: visual
        kind: compare
        caption: 'The same outage, handled two ways'
        columns:
          - title: 'Chaotic'
            tone: bad
            icon: warning
            tip: 'Everyone means well, but without coordination both time and damage grow.'
            items:
              - 'Five people log into the server and make changes at once'
              - 'Nobody knows who changed what'
              - 'A manager asks "what''s happening?" every 5 minutes'
              - 'Customers wait while people hunt for the cause'
          - title: 'Organized'
            tone: good
            icon: check
            tip: 'With roles and rules decided in advance, work goes on even in a sleepy head.'
            items:
              - 'One coordinator, everyone else on their own tasks'
              - 'Every change is written down in one place'
              - 'One person updates everyone at fixed intervals'
              - 'Stop the harm first, find the cause later'
      - type: quote
        body: 'In an outage, stop the harm first; find the cause later, with a calm head.'
    aside:
      - type: story
        title: 'Two changes cancelling each other'
        body: 'At 3 a.m. checkout broke. One person rolled back while, at the very same moment, another deployed a hotfix. The two changes cancelled each other out and the app got worse. Neither knew what the other was doing.'
      - type: problem
        body: 'During an incident minds are under pressure, sleep is short and panic is high. So for good decisions you have to settle rules and roles beforehand.'
    check:
      q: 'What goes wrong when five people change production at once during an incident?'
      a: 'Nobody knows who changed what, changes can cancel each other out, and you can''t tell which one worked. You need one coordinator and one place that lists the changes.'

  - slug: triage-severity
    title: 'Triage: measure the harm first, then decide how urgent'
    kind: concept
    tldr: 'Don''t rush off on hearing about a problem. First ask who is hurt, how badly and for how long; then set a severity, which decides how many people respond and how fast.'
    keywords: ['triage', 'severity', 'SEV1', 'impact', 'priority', 'incident level']
    blocks:
      - type: metaphor
        icon: building
        title: 'The hospital emergency room'
        body: |
          When patients arrive at the emergency room, the nurse first checks who is in the worst shape: bleeding before a cold. Treat everyone at the same speed and the one who needs it most dies. Triage means putting limited people and time where they matter most.
      - type: points
        title: 'The questions of the first five minutes'
        style: number
        items:
          - 'Who is hurt? All customers, some regions, or only the internal team?'
          - 'How badly? Completely down, slow, or just some features not working?'
          - 'Since when? What changed right before (deploy, config, traffic)?'
          - 'Is money or data at risk?'
      - type: visual
        kind: table
        caption: 'Severity: how big the incident is, what the response is'
        headers: ['Level', 'What it looks like', 'Response']
        rows:
          - cells: ['SEV1', 'Checkout or payment down for everyone, data at risk', 'Everyone now, a coordinator, update every 30 minutes']
            tip: 'Direct harm to money or data. Drop everything else for this.'
          - cells: ['SEV2', 'A major feature broken or very slow, a workaround exists', 'On-call now, hourly updates']
            tip: 'Customers are hurting, but some paths still work.'
          - cells: ['SEV3', 'A minor feature or a small number of users', 'Working hours, a ticket']
            tip: 'It can be fixed in the morning without waking anyone at night.'
      - type: quote
        body: 'Measure before you run: who is hurt, how badly, since when.'
    aside:
      - type: tips
        items:
          - 'When in doubt, rate the severity higher. You can lower it later, but raising it late costs you.'
          - 'Write down severity definitions beforehand. At 3 a.m. there is no time to argue "is this a SEV1?".'
      - type: terms
        items:
          - {term: 'Triage', meaning: 'Measuring the harm and setting priorities so limited people go to the most urgent work.'}
          - {term: 'Blast radius', meaning: 'How many users, or how much of the system, the problem has spread to.'}
      - type: refs
        items:
          - {to: 'observability/metrics-slos', label: 'Measuring harm with SLOs'}
    check:
      q: 'At 3 a.m. two alerts arrive: "report page slow" and "checkout failing at 20%". Which comes first?'
      a: 'Checkout: direct money loss, so SEV1 or SEV2. A slow report page is SEV3 and can wait until morning. Setting that order is exactly triage''s job.'

  - slug: mitigate-first
    title: 'Stop it first, find the cause later'
    kind: howto
    tldr: 'Mitigation (rollback, feature flag off, scale, failover) stops the harm fast. Hunt for the root cause only when customers are no longer being hurt.'
    keywords: ['mitigation', 'rollback', 'root cause', 'hypothesis', 'feature flag', 'kubectl rollout undo', 'live debugging']
    blocks:
      - type: metaphor
        icon: home
        title: 'A burst pipe and a flooded house'
        body: |
          A pipe has burst and water is spreading through the house. First shut the main valve: the water stops. Then, calmly, find which pipe cracked and why. Hunt for the cause without closing the valve and the whole house floods. Rollback and feature flags are your main valve.
      - type: visual
        kind: steps
        caption: 'Five steps you loop through during an incident'
        steps:
          - {title: '1. Read the symptoms', body: 'Dashboards: errors, latency, queue', tip: 'Look at numbers, not guesses: RED and queue depth.'}
          - {title: '2. What changed?', body: 'Deploys, config, traffic just before the start', tip: 'Behind most outages sits a recent change. It is the likeliest guess.'}
          - {title: '3. Form a hypothesis', body: 'One guess, one cheap test', tip: 'Change many things at once and you can''t tell which one worked.'}
          - {title: '4. Stop it', body: 'Rollback, flag off, scale, failover', tip: 'Safest first: rollback > flag > scale > hotfix.'}
          - {title: '5. Verify', body: 'Check that the metrics recovered', tip: 'Don''t declare the incident over until you have seen proof that the harm stopped.'}
      - type: code
        lang: bash
        file: 'terminal: commands for the first few minutes'
        variant: good
        code: |
          # when did it start? what was deployed just before?
          kubectl rollout history deployment/shop-api

          # when in doubt, go back first and look for the cause later
          kubectl rollout undo deployment/shop-api

          # is the queue piling up?
          php bin/console messenger:stats

          # the whole story of one failed request, via its correlation id
          kubectl logs deploy/shop-api --since=15m | grep 0191-ab
        marks:
          - {line: 2, tip: 'The list of revisions and when each happened. Compare it with the start time.'}
          - {line: 5, tip: 'Going back to the previous revision. A code rollback is safe, but a database migration needs separate care.'}
          - {line: 11, tip: 'With the correlation id built in logging-tracing, one customer''s incident comes up in one list.'}
      - type: quote
        body: 'Stop the harm first, find the cause after, and change one thing at a time.'
    aside:
      - type: pitfalls
        items:
          - 'Assuming a migration can be rolled back: a migration that dropped a column can''t be undone. So migrations go step by step (expand, then contract).'
          - 'Use a feature flag alongside the deploy for rollback: if the new feature sits behind a flag, turning it off is one click.'
          - 'Logging into a server and editing code directly (a hot patch): in the chaos nobody knows what changed where. Every change goes through the pipeline.'
      - type: refs
        items:
          - {to: 'data/zero-downtime-migrations', label: 'Safe migrations'}
          - {to: 'config/feature-flags', label: 'Feature flags'}
    check:
      q: 'A new deploy went out 10 minutes before checkout broke. Roll back first or find the cause first, and why?'
      a: 'Roll back. A recent change is the likeliest cause, and going back is fast and safe. Only once the harm stops can you look for the cause calmly.'

  - slug: roles-communication
    title: 'Roles and communication: who does what, who tells whom'
    kind: howto
    tldr: 'One Incident Commander coordinates (and doesn''t touch the keyboard), one person fixes, one keeps everyone informed, and one writes the timeline.'
    keywords: ['incident commander', 'communications lead', 'scribe', 'status update', 'war room', 'roles']
    blocks:
      - type: metaphor
        icon: users
        title: 'The wedding-feast manager'
        body: |
          At a wedding feast the manager doesn't cook. They watch who is doing what, where more hands are needed, and what the guests are told. The cooks cook, and someone else keeps the guests informed. Without that split everyone ends up cooking, and the guests wait with no news.
      - type: visual
        kind: table
        caption: 'Four roles: what they do and what they don''t'
        headers: ['Role', 'Job', 'What they don''t do']
        rows:
          - cells: ['Incident Commander', 'Coordination, decisions, dividing the work', 'Doesn''t debug themselves']
            tip: 'The one who sees the whole picture. Pick up a task and you lose the picture, so they stay off the keyboard.'
          - cells: ['Ops / Tech lead', 'Investigating and fixing', 'Doesn''t communicate']
            tip: 'The one on the keyboard. When many people want something, they go through the IC.'
          - cells: ['Comms lead', 'Regular updates to stakeholders', 'Doesn''t debug']
            tip: 'Managers, support and the status page: so nobody keeps pinging the technical team.'
          - cells: ['Scribe', 'The timeline: who did what, when', 'Doesn''t make decisions']
            tip: 'The raw material of the later postmortem. A timeline written during the incident beats memory.'
      - type: code
        lang: text
        file: 'status update: the same template every 30 minutes'
        variant: good
        code: |
          [14:20] Update #2 — SEV1, checkout failing

          Impact:      about 20% of customers can't place orders (since 13:50)
          What we know: payment calls have timed out since the 13:45 deploy
          What we're doing: rolling that deploy back; result expected by 14:30
          What we don't know: why it timed out; we'll investigate after the rollback

          Next update: 14:50 (sooner if anything changes)
        marks:
          - {line: 3, tip: 'In numbers: how many, since when. Not "some issues".'}
          - {line: 6, tip: 'Writing "what we don''t know" is honesty: passing a guess off as fact costs trust later.'}
          - {line: 8, tip: 'Name the time of the next update and nobody keeps asking.'}
      - type: quote
        body: 'Whoever sees the picture doesn''t pick up tools; whoever picks up tools doesn''t see the picture.'
    aside:
      - type: tips
        items:
          - 'On a small team one person can hold several roles, but the IC and Ops are never the same person.'
          - 'Keep a single incident channel (a chat room or a call) and write every decision and change there. No side conversations.'
          - 'On the customer-facing status page, write honestly: what is broken, when you expect it back, when the next update is.'
      - type: story
        title: 'The manager''s calls for lack of updates'
        body: 'In one outage nobody told the outside world anything for 40 minutes. The manager, support and a partner each phoned a developer directly, and the real work stopped. A regular update would have prevented those calls.'
    check:
      q: 'What does the Incident Commander lose by grabbing the keyboard and debugging?'
      a: 'The overall picture. Nobody is then watching who is doing what, what has changed, or who needs to be called. That is why the coordinator stays hands-off.'

  - slug: blameless-postmortem
    title: 'Learning, not blaming: the blameless postmortem'
    kind: pitfall
    tldr: 'Ask "who made the mistake?" and people hide mistakes. Ask "why did the system let it happen?" and mistakes get fixed. So write postmortems blameless, with an action list.'
    keywords: ['postmortem', 'blameless', 'root cause', 'action items', 'five whys', 'retrospective', 'learning']
    blocks:
      - type: metaphor
        icon: rocket
        title: 'A plane crash investigation'
        body: |
          After a plane crash, the investigators open the black box. The aim isn't to punish the pilot but to learn: what happened, and why the system let one mistake grow into a disaster. That is why flying gets safer year after year. Pilots admit their mistakes because they know the result will be improvement.
      - type: visual
        kind: compare
        caption: 'Two kinds of question, two kinds of outcome'
        columns:
          - title: 'Hunting for blame'
            tone: bad
            icon: cross
            tip: 'When people are afraid, they hide mistakes, and next time the problem is caught even later.'
            items:
              - '"Who made the mistake?"'
              - 'Result: people hide mistakes and say less'
              - 'The same mistake happens again, in someone else''s hands'
          - title: 'Blameless'
            tone: good
            icon: check
            tip: 'People will make mistakes. Build the system so that one mistake doesn''t become a disaster.'
            items:
              - '"Why did the system let this mistake happen?"'
              - 'Result: everyone speaks openly and you get the full picture'
              - 'The system gets fixed: tests, guardrails, alerts'
      - type: code
        lang: text
        file: 'postmortem template'
        variant: good
        code: |
          Title:      Checkout down for 35 minutes (SEV1), 2026-09-12
          Summary:    one sentence on what happened and how many were affected

          Impact:     35 minutes, ~20% of customers, 180 orders lost
          Timeline:   (from the scribe's notes, minute by minute)
          Root cause: (the system, not a person: "why could this happen?")
          What went well: the rollback took 5 minutes
          What went badly: the alert arrived 12 minutes late

          Action items:
            - add an alert on payment timeouts. Owner: Rina, by September 26
            - add a payment smoke test before deploys. Owner: Imon, by October 3
        marks:
          - {line: 6, tip: 'Not "Rahim made a mistake" but "no test caught this before the deploy": something you can fix.'}
          - {line: 7, tip: 'Write down what went well too; what worked needs to be kept.'}
          - {line: 11, tip: 'Every action has one owner and a date. An action with no owner never gets done.'}
      - type: quote
        body: 'A human mistake is a signal: ask why the system let it grow into a disaster.'
    aside:
      - type: pitfalls
        items:
          - 'A postmortem gets written and nobody does the action list. Put the actions in tickets, track them, and check on them in the next meeting.'
          - 'Writing "human error" as the root cause: that is a starting point, not a stopping point. Ask: why was it so easy to make this mistake?'
          - 'Holding postmortems only for big incidents. You can learn from near-misses too.'
      - type: tips
        items:
          - 'Hold the postmortem within 2 to 3 days of the incident, while memories are fresh, and keep it open to everyone.'
          - '"Five whys": after every answer, ask "why?" again to reach the root.'
      - type: refs
        items:
          - {to: 'recovery/backups-restore', label: 'Restoring data and runbooks'}
          - {to: 'observability/health-alerts', label: 'Fixing alerts and runbooks'}
    check:
      q: 'Why is "Rahim ran the wrong command" the least useful line in a postmortem?'
      a: 'Replace Rahim and someone else can make the same mistake. The useful question: which guardrail (a test, a confirmation, a permission) would have made it impossible to run that command?'

flashcards:
  - q: 'In an incident, what comes first: finding the cause or stopping the harm?'
    a: 'Stopping the harm (mitigate). Finding the cause comes after the harm stops, calmly.'
    more: |
      With a burst pipe, shut the valve first and look for the cause afterwards. Rollback, turning a feature flag off, scaling up or failing over are the fast ways to stop harm. While the harm continues, every minute costs customers and money.
    ref: mitigate-first
  - q: 'What is triage?'
    a: 'Measuring the harm (who, how badly, since when) and setting priorities, so attention goes to the most urgent work first.'
    more: |
      Like a hospital emergency room: the person hurt worst goes first. In the first five minutes, ask who is hurt, how badly, since when, what changed, and whether money or data is at risk. The answers set the severity.
    ref: triage-severity
  - q: 'What are SEV1, SEV2 and SEV3?'
    a: 'Levels of incident severity: SEV1 is the most serious (money or data at risk), SEV3 the most minor.'
    more: |
      For each level it is decided in advance how many people get involved, how fast they respond, and how often updates go out. When in doubt, rate it higher; you can lower it later. With definitions written down, nobody argues at 3 a.m.
    ref: triage-severity
  - q: 'Why is "what changed?" the most useful question to ask early?'
    a: 'Most outages follow a recent deploy, config or traffic change, so that is the likeliest guess.'
    more: |
      Find the outage's start time and match it against what was deployed just before. If they line up, rollback is the fastest and safest path. If not, check whether traffic or an outside dependency changed.
    ref: mitigate-first
  - q: 'Which mitigation is the safest, and which the riskiest?'
    a: 'Safest: rollback, turning the feature flag off. Then scaling, and last a hotfix: new code, new risk.'
    more: |
      A rollback returns to a previously tested state. A hotfix is new code written under incident pressure, often without proper tests. So roll back first where you can, and be careful with migrations (a dropped column can't be restored).
    ref: mitigate-first
  - q: 'What does an Incident Commander do, and not do?'
    a: 'They coordinate, decide and divide the work. They don''t debug or work on the keyboard themselves.'
    more: |
      The commander holds the whole picture: who is doing what, what has changed, who needs to be called. Pick up a task and your attention locks onto one thing and you lose the rest. The other roles are the Ops lead, Comms lead and Scribe.
    ref: roles-communication
  - q: 'What goes in a good status update?'
    a: 'The impact (in numbers), what we know, what we''re doing, what we don''t know, and the time of the next update.'
    more: |
      Writing "what we don't know" is a sign of honesty; passing a guess off as fact costs trust. Naming the next update's time means nobody keeps asking. Keeping stakeholders informed is one person's specific job.
    ref: roles-communication
  - q: 'What is a blameless postmortem?'
    a: 'After an incident, asking "why did the system let this happen?" instead of "who is to blame?", and writing an action list with owners and dates.'
    more: |
      People will make mistakes; the system has to be built so one mistake doesn't become a disaster. Hunt for blame and people hide mistakes, and learning stops. A postmortem holds a timeline, the impact, the root cause, what went well and badly, and an action list.
    ref: blameless-postmortem
  - q: 'What must every item in a postmortem''s action list have?'
    a: 'One owner and one date. An action with no owner usually never gets done.'
    more: |
      Put the actions in tickets and track them, and check at the next meeting how many are done. The best actions prevent a repeat: a new alert, a new test, a new guardrail. "We'll be more careful" is not an action.
    ref: blameless-postmortem

quiz:
  - q: 'Sumi''s app was deployed at 14:00, and from 14:10 30% of payments fail. What is the best first step?'
    hint: 'Stop the harm first, find the cause later.'
    options:
      - text: 'Roll back that deploy, then look for the cause'
        correct: true
        why: 'A recent change is the likeliest cause, and a rollback is fast and safe.'
      - text: 'Log into the live server, dig through the suspect code and fix it directly'
        correct: false
        why: 'The harm continues, and a direct change brings new, untracked risk.'
      - text: 'Tell the customers and wait'
        correct: false
        why: 'Telling them is needed, but alongside stopping the harm, not instead of it.'
      - text: 'Turn on more logging and watch'
        correct: false
        why: 'Investigation comes later. When you know about a recent change, stop the harm first.'
    ref: mitigate-first
  - q: 'Which incident should be treated as SEV1?'
    hint: 'Is there direct harm to money or data?'
    options:
      - text: 'Checkout is down for all customers'
        correct: true
        why: 'Revenue stops directly: the highest urgency.'
      - text: 'Users'' personal data may have leaked'
        correct: true
        why: 'Data is at risk and there is legal liability too (for example 72 hours under GDPR). SEV1.'
      - text: 'The admin report page is a little slow'
        correct: false
        why: 'An inconvenience to the internal team, no customer harm. SEV3.'
      - text: 'A small typo on the website'
        correct: false
        why: 'At the very bottom of the priorities; a ticket.'
    ref: triage-severity
  - q: 'An incident is under way. Two developers are changing prod at the same time and neither knows what the other is doing. What is the best fix?'
    hint: 'Who is coordinating?'
    options:
      - text: 'Appoint an Incident Commander; every change goes through them and is written in one channel'
        correct: true
        why: 'The changes stop cancelling each other and everyone knows what is going on.'
      - text: 'Let whoever started first carry on and have the other stop, without telling them why'
        correct: false
        why: 'Without knowing who is doing what, this fails too; you need a coordinator.'
      - text: 'Let both carry on; one of them will fix it'
        correct: false
        why: 'This way the changes keep undoing each other.'
      - text: 'Call everyone in and add more people'
        correct: false
        why: 'More people means more chaos, if there is no coordinator.'
    ref: roles-communication
  - q: 'Imon''s status update says: "Some issues, looking into it." Why is that weak?'
    hint: 'What did the manager learn from reading it?'
    options:
      - text: 'The impact isn''t in numbers, it doesn''t say what is being done, and there is no next-update time'
        correct: true
        why: 'A good update has the impact, what we know, what we''re doing, what we don''t know and the next time.'
      - text: 'It shouldn''t have been written in that language'
        correct: false
        why: 'Language isn''t the problem; the content is vague.'
      - text: 'There should be no update at all; fix the problem first'
        correct: false
        why: 'Without updates everyone phones the developer. Giving updates is the Comms lead''s job.'
    ref: roles-communication
  - q: 'Which of these postmortem lines is in the blameless spirit?'
    hint: 'Which one gives you something to fix?'
    options:
      - text: '"Rahim deleted production with the wrong command."'
        correct: false
        why: 'The blame lands on one person. There is nothing to fix, and the next person could make the same mistake.'
      - text: '"Production and staging commands look the same and there was no confirmation step, so the mistake was easy to make."'
        correct: true
        why: 'It names a weakness in the system, and fixes follow from it (a different color, confirmation, permissions).'
      - text: '"We need to be more careful."'
        correct: false
        why: 'A wish, not an action. With no owner or date, nothing will change.'
    ref: blameless-postmortem
