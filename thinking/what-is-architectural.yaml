slides:
  - slug: wrong-meeting
    title: 'Three days on dark mode, five minutes on the parcel ID'
    kind: story
    tldr: 'Teams pour days into decisions that could wait and settle expensive ones in five minutes, because they never learned to tell which is which.'
    keywords: ['architectural decision', 'bikeshedding', 'cost of change', 'significant decisions', 'design review']
    blocks:
      - type: text
        body: |
          Rahim's team started a courier app. In the first sprint, one developer spent three days on dark mode: a second set of colours, a toggle in settings, and fixes for the screens that looked wrong in it. It was nice to have, but no customer had asked for it yet. The parcel ID took five minutes: just use the database's auto-incrementing 1, 2, 3. A year later they found that anyone could open another person's parcel by typing the next number, and a rival could count Rahim's daily volume the same way. An ownership check closed the first leak in an afternoon. Hiding the volume needed IDs nobody can guess, which meant changing the ID type, and by then the old one was printed on hundreds of thousands of receipts, built into the mobile app and stored in three partners' systems. Five more minutes at the start, weighing auto-increment against a random ID, would have saved three months.
      - type: visual
        kind: bars
        caption: 'What each decision cost to add or change a year later'
        items:
          - {label: 'Dark mode', value: 3, display: '3 days', tone: good, tip: 'The same three days in any month: no stored data or partner depends on it, so waiting costs nothing. Yet it went first.'}
          - {label: 'Logging library', value: 3, display: '3 days', tip: 'It touches a few places in the code, but nobody outside notices, so the effort ends within days.'}
          - {label: 'Parcel ID type', value: 90, display: '3 months', tone: bad, tip: 'A five-minute decision. Changing it meant running old and new IDs side by side for months.'}
      - type: quote
        body: 'The decision that will cost the most to change deserves the most thought.'
    aside:
      - type: story
        title: 'Why did the ID take three months?'
        body: |
          Old mobile apps still send the numeric ID, and you can't force everyone to update. Partners had stored the old IDs in their own databases. And you can't recall a printed receipt. So both kinds of ID had to run side by side while everything moved over slowly.
      - type: terms
        items:
          - {term: 'Bikeshedding', meaning: 'Long arguments over trivial, easy topics, because everyone understands them and so everyone has an opinion.'}
          - {term: 'Cost of change', meaning: 'The time, money and risk it takes to change a decision later.'}
      - type: refs
        items:
          - {to: 'data/id-generation', label: 'Ways to generate IDs'}
    check:
      q: 'What was the real mistake in Rahim''s team: choosing the ID type, or how they spent their time?'
      a: 'How they spent their time. They gave three days to something that would cost the same three days at any later time, and five minutes to something that took three months to change, without considering any alternative.'

  - slug: cost-of-change-test
    title: 'The touchstone: what will it cost to change later?'
    kind: concept
    tldr: 'Three questions tell you if a decision is architectural: how much stands on it, whether data has piled up, and whether outsiders use it.'
    keywords: ['cost of change', 'blast radius', 'significant decision', 'foundation', 'dependencies', 'touchstone']
    blocks:
      - type: metaphor
        icon: building
        title: 'Six floors on a two-floor foundation'
        body: |
          Uncle built his house with a foundation sized for two floors. Ten years later he wanted six, and the engineer said the whole thing would have to come down. Yet he had changed the window grilles, the tiles and the paint as often as he liked. The foundation is expensive because everything else stands on it.
      - type: points
        title: 'Spotting a foundation with three questions'
        style: number
        items:
          - '**How much stands on it?** The more code, teams and systems depend on it, the more a change costs.'
          - '**Has data piled up?** Stored data must be poured into the new mould, which is far harder than changing code.'
          - '**Does anyone outside your control use it?** You can''t force an old mobile app or a partner to change.'
      - type: visual
        kind: flow
        caption: 'Everything that stood on Rahim''s parcel ID'
        nodes:
          - {id: parcel_id, label: 'Parcel ID type', sub: 'A five-minute decision', icon: id, tone: accent, col: 2, row: 1, tip: 'This is the foundation. Four things lean on it from four sides, so moving it moves them all.'}
          - {id: mobile, label: 'Mobile app', sub: 'Old versions live', icon: mobile, col: 0, row: 0, tip: 'An app installed on a user''s phone is outside your control. Some people won''t update for a year.'}
          - {id: partner, label: 'Partner systems', sub: 'Three companies', icon: building, col: 4, row: 0, tip: 'Another company''s code. They change on their schedule, not yours.'}
          - {id: receipt, label: 'Printed receipts', sub: 'Hundreds of thousands', icon: receipt, col: 0, row: 2, tip: 'An ID printed on paper can''t be changed. Customers will look up parcels by that old number.'}
          - {id: tables, label: 'Database', sub: '12 tables', icon: db, col: 4, row: 2, tip: 'Stored data. Every row has to be migrated to the new ID, without taking the live system down.'}
        edges:
          - {from: mobile, to: parcel_id, label: 'Old apps still send the numeric ID', tip: 'Question 3: users outside your control.'}
          - {from: partner, to: parcel_id, label: 'Partners have stored this ID in their own databases', tip: 'Question 3 again — this time another company.'}
          - {from: receipt, to: parcel_id, label: 'The ID on printed receipts can''t be recalled', tone: bad}
          - {from: tables, to: parcel_id, label: 'Millions of rows across 12 tables are joined by this ID', tip: 'Questions 1 and 2: a lot stands on it, and data has piled up.'}
      - type: quote
        body: 'Architecture represents the significant design decisions that shape a system, where significant is measured by cost of change.'
        by: 'Grady Booch'
    aside:
      - type: remember
        body: 'Ask yourself: "A year from now, how many days will changing this take, and who will I have to convince?"'
      - type: tips
        items:
          - 'A decision confined to one file is cheap; the wider it spreads, the more it costs.'
          - 'The same decision is cheap on day one and expensive two years later, because a lot has been built on it since.'
          - 'This is a judgement aid, not a calculator. "Days or months?" is precise enough; don''t spend a meeting estimating.'
      - type: refs
        items:
          - {to: 'thinking/reversible-decisions', label: 'Is there a door back, or not?'}
    check:
      q: 'What are the three questions for telling whether a decision is architectural?'
      a: 'How much stands on it, whether data has piled up, and whether someone outside your control uses it. The more "yes" answers, the more a change costs.'

  - slug: four-pillars
    title: 'Four familiar foundations — and the things that are just paint'
    kind: concept
    tldr: 'Stop for the database choice, the data model, service boundaries and the public API contract; move fast on most other decisions.'
    keywords: ['database choice', 'data model', 'service boundary', 'API contract', 'foundation decisions']
    blocks:
      - type: text
        body: |
          In almost every project, four kinds of decision behave like foundations. When you face one, stop, think through at least two alternatives and write down your reason. Most other decisions are like window grilles and paint: let one person decide and the team moves on.
      - type: visual
        kind: table
        caption: 'The four foundations: why they''re hard to change'
        headers: ['Decision', 'Why it''s hard to change', 'Example']
        rows:
          - cells: ['Which database', 'Every query and all stored data is tied to its shape', 'PostgreSQL or MongoDB']
            tip: 'Changing it means rewriting every query and moving all the data from one database to another.'
          - cells: ['Data model', 'Millions of rows must be poured into a new mould', 'Money as float or as integer cents']
            tip: 'Which tables, which columns, which types, how they relate. Once data piles up, fixing a mistake here is the most painful.'
          - cells: ['Service boundaries', 'Code, data and teams all get re-split', 'Orders and payments together or apart']
            tip: 'Where the system is cut into pieces. Cut in the wrong place and every feature has to touch both pieces.'
          - cells: ['Public API contract', 'External clients aren''t in your hands', 'Field names, ID types, URLs']
            tip: 'A promise to the outside world. Once someone writes code against it, you can''t change it alone.'
      - type: points
        title: 'These are paint — no long meetings'
        items:
          - 'Variable, method and folder names — the IDE changes them in a minute.'
          - 'Code formatting — let `php-cs-fixer` handle it.'
          - 'The internals of a class — nobody outside sees them.'
          - 'A library hidden behind an interface — changing it means changing one class.'
    aside:
      - type: tips
        items:
          - 'A few more are often foundations: language and framework, the login method, and how you keep many customers'' data apart in one system.'
          - 'Write the reason for a foundation decision on one page ([[thinking/documentation|ADR]]) — in six months someone will ask, "Why did we do this?"'
          - 'Stopping has a price too. For a throwaway prototype you plan to bin, skip the ceremony: the cost of change never comes due.'
      - type: refs
        items:
          - {to: 'data/choosing-database', label: 'Which database for which job?'}
          - {to: 'api/contracts-versioning', label: 'API contracts and versioning'}
    check:
      q: 'What are the four familiar architectural decisions, and what do they share?'
      a: 'Database choice, data model, service boundaries and the public API contract. In all four, either stored data or someone else''s dependency is involved.'

  - slug: triage-a-feature
    title: 'Sorting a feature''s decisions'
    kind: howto
    tldr: 'List every decision in the feature and put its cost of change beside it: minutes, days, weeks, months. Spend your time only on weeks and months.'
    keywords: ['decision triage', 'checklist', 'feature planning', 'design review', 'prioritising decisions']
    blocks:
      - type: text
        body: |
          When a new feature arrives, first list all its decisions, then write the cost of changing each one later. Take the "parcel tracking" feature in the courier app. Below is Rahim's team's list: only three of the seven are foundations, so those three got the whole review meeting.
      - type: visual
        kind: table
        caption: 'Seven decisions of the "parcel tracking" feature, sorted by cost'
        headers: ['Decision', 'Cost of change', 'What to do']
        rows:
          - cells: ['Tracking number format', 'Months — spreads to receipts and partners', 'Stop, write options']
            tip: 'Part of the public contract. Once it''s in a customer''s hands, you can''t take it back.'
          - cells: ['Partner API response', 'Months — partners are out of your hands', 'Stop, write options']
            tip: 'Another company will write code against it. Even removing one field later would break their system.'
          - cells: ['Which table holds status, and its shape', 'Weeks — stored data must move', 'Stop, write options']
            tip: 'The data model. Thousands of status rows pile up every day, so a wrong shape gets costlier every day.'
          - cells: ['Which company sends the SMS', 'Days — behind an interface', 'One person decides']
            tip: 'If SMS sending sits behind an interface, switching company means rewriting one class.'
          - cells: ['Map display library', 'Days — contained in one component', 'One person decides']
            tip: 'Only one Vue component uses it, so the impact of a change stops at that one file.'
          - cells: ['Controller and class names', 'Minutes', 'Whoever writes it']
            tip: 'The IDE''s rename changes them safely. One comment in review is enough.'
          - cells: ['Status colours', 'Minutes', 'The designer']
            tip: 'One line of CSS. If it''s wrong, the next deploy fixes it.'
      - type: points
        title: 'A five-minute routine'
        style: number
        items:
          - 'Write all the feature''s decisions in one list.'
          - 'Put the cost of change beside each: minutes, days, weeks or months.'
          - 'For every "weeks" and "months" entry, write two alternatives and a reason, and get a review.'
          - 'Let one person decide the rest and move on — fixing a mistake later is cheap.'
    aside:
      - type: remember
        body: 'Minutes or days: decide alone. Weeks or months: stop, write it down, show it.'
      - type: pitfalls
        items:
          - 'Giving every decision equal time, leaving no time for the three that matter.'
          - 'Saying "we''ll see later" and making a foundation decision without thinking.'
    check:
      q: 'Why did choosing the SMS company land under "days" rather than "months"?'
      a: 'Because the SMS-sending code sits behind an interface. Switching company means rewriting one class; the rest of the code, the data and outsiders never notice.'

  - slug: accidental-architecture
    title: 'Turning paint into a foundation by accident'
    kind: pitfall
    tldr: 'Return an entity as JSON and your table columns become the public contract; a separate response class keeps the inside cheap to change.'
    keywords: ['response DTO', 'leaky abstraction', 'entity exposure', 'API contract', 'DTO']
    blocks:
      - type: text
        body: |
          The best-known mistake: returning a Doctrine entity straight from a controller as JSON. Every column name then becomes part of the public API. Renaming a column used to be as cheap as repainting; now it breaks the mobile app, which means the paint itself has turned into a foundation. The fix: a separate response class for whatever leaves the system.
      - type: code
        lang: php
        file: 'src/Controller/ParcelController.php'
        variant: bad
        code: |
          #[Route('/api/parcels/{id}', methods: ['GET'])]
          public function show(Parcel $parcel): JsonResponse
          {
              // every property of the entity goes straight out
              return $this->json($parcel);
          }
        marks:
          - {line: 1, tip: 'The database id is now part of the URL. Change the id type and every old link and client breaks.'}
          - {line: 5, tip: 'Rename a column tomorrow, or add a secret one, and it goes straight to every client.'}
      - type: code
        lang: php
        file: 'src/Api/ParcelResponse.php + ParcelController.php'
        variant: good
        code: |
          final readonly class ParcelResponse
          {
              public function __construct(
                  public string $trackingCode,
                  public string $status,
                  public string $updatedAt,
              ) {
              }

              public static function fromEntity(Parcel $parcel): self
              {
                  return new self(
                      $parcel->getTrackingCode(),
                      $parcel->getStatus()->value,
                      $parcel->getUpdatedAt()->format(\DATE_ATOM),
                  );
              }
          }

          // in the controller
          #[Route('/api/parcels/{trackingCode:parcel}', methods: ['GET'])]
          public function show(Parcel $parcel): JsonResponse
          {
              return $this->json(ParcelResponse::fromEntity($parcel));
          }
        marks:
          - {line: 4, tip: 'Clients see only these three fields — that is the contract. Change the table however you like; as long as this class stays put, nobody breaks.'}
          - {line: 21, tip: '`{trackingCode:parcel}` means: look up the Parcel by its trackingCode property using the URL value. The internal id no longer leaks out.'}
          - {line: 24, tip: 'The response class is sent, not the entity. The internal structure and the outside promise are now separate.'}
      - type: quote
        body: 'Keep the inside structure and the outside promise separate, and the inside stays as cheap as paint.'
    aside:
      - type: problem
        body: 'A cheap decision turns expensive on its own when many things lean on it directly. A thin layer in between stops the shock of a change right there.'
      - type: pitfalls
        items:
          - 'When two separate apps read the same table directly, the whole schema becomes the contract between them.'
          - 'When a vendor''s SDK classes spread through the code, switching vendor goes from "days" to "months".'
      - type: when
        use: ['Anything that leaves the system: a public API, a partner feed, a mobile app''s responses']
        avoid: ['A screen only your own team uses: the extra class and mapping code buy nothing there']
      - type: refs
        items:
          - {to: 'api/contracts-versioning', label: 'Changing an API without breaking the contract'}
          - {to: 'thinking/hexagonal', label: 'Hexagonal: keeping outside things at arm''s length'}
    check:
      q: 'Why does returning an entity as JSON make renaming a column expensive?'
      a: 'The column name is now an API field. Mobile apps and partners wrote code against that name, so renaming it breaks everything of theirs, and their code isn''t in your hands.'

flashcards:
  - q: 'What makes a decision "architectural"?'
    a: 'It takes a lot of time, money and risk to change later — like the data model or the public API contract.'
    more: |
      A decision isn't measured by how big or technical it looks, but by what it costs to change. You can repaint a house or swap the grilles as often as you like, but changing the foundation means demolishing it. An architect's job is to recognise the software foundations and spend the most time there.
    ref: cost-of-change-test
  - q: 'Which three questions show whether a decision will be costly to change?'
    a: 'How much stands on it? Has data piled up? Does anyone outside your control use it?'
    more: |
      The first question measures how far the shock of a change will spread. The second measures how much data must move into a new mould. The third measures whether you can change it alone or must wait for someone else. The more "yes" answers, the more the decision behaves like a foundation.
    ref: cost-of-change-test
  - q: 'What are the four familiar architectural decisions?'
    a: 'Database choice, data model, service boundaries and the public API contract.'
    more: |
      All four involve either stored data or an outside dependency, so changing them later takes weeks or months. When you face one, stop, think of at least two alternatives and write down your reason. Language, framework and the login method often belong in this group too.
    ref: four-pillars
  - q: 'What is bikeshedding?'
    a: 'Arguing at length over trivial, easy topics while rushing hard, expensive decisions through.'
    more: |
      Everyone understands the easy topics, so everyone has an opinion; on hard ones people stay quiet. So a design review spends 40 minutes on button colours and the data model passes in five minutes. The cure is to ask before the discussion: "What will it cost to change this later?"
    ref: wrong-meeting
  - q: 'Why is changing a public API contract so hard?'
    a: 'Because the clients aren''t in your hands: old mobile apps and partner systems change on their own schedule, not yours.'
    more: |
      You can change your own code in a single deploy. But an old app on a user's phone will keep asking for the old fields for months. So when you change a contract, old and new must run side by side for a long time. More in [[api/contracts-versioning|contracts and versioning]].
    ref: four-pillars
  - q: 'Why does stored data make a decision expensive?'
    a: 'Changing code isn''t enough — millions of rows must move into a new shape, without taking the live system down.'
    more: |
      On day one the tables are empty, so changing the data model takes a minute. Two years later the same change needs a migration, step-by-step data moves and verification. That's why a data-model mistake gets costlier the later it's caught.
    ref: cost-of-change-test
  - q: 'What''s the danger of returning a Doctrine entity directly as JSON?'
    a: 'Your table columns become API fields: renaming a column breaks clients, and secret columns can leak out.'
    more: |
      A cheap decision (a column name) quietly becomes expensive because everyone outside starts depending on it. The fix is a separate response class (a DTO) holding only the fields you are willing to promise to the outside.
    ref: accidental-architecture
  - q: 'How should you split your time across a feature''s decisions?'
    a: 'List every decision with its cost of change: minutes, days, weeks, months. Spend review time only on weeks and months.'
    more: |
      A feature usually holds many decisions, but only two or three behave like foundations. Write two alternatives and a reason for those and have them reviewed. One person can decide the rest and move on, since fixing a mistake there is cheap.
    ref: triage-a-feature
  - q: 'How do you keep a cheap decision cheap?'
    a: 'Put a thin layer between the inside and the outside promise: a response class, an interface or an adapter.'
    more: |
      When many things lean directly on one thing, it gets hard to move. The layer in between absorbs the shock: if a column or a vendor changes inside, only one class in that layer changes and nobody outside notices. The price is an extra class and some mapping code, so skip it for screens only your own team uses.
    ref: accidental-architecture

quiz:
  - q: 'Sumi''s team is building a hostel booking app. Which of these decisions should they stop on, writing alternatives and getting a review?'
    hint: 'Which ones involve stored data or an outside system?'
    options:
      - text: 'Which type to use for storing booking money in the database'
        correct: true
        why: 'That''s the data model. Once hundreds of thousands of bookings exist, changing the type means moving every row, and a wrong type muddles the money totals too.'
      - text: 'The shape of the API response given to partner hostels'
        correct: true
        why: 'A public contract. Partners will write code against it, so you won''t be able to change it alone later.'
      - text: 'Which folder the test files live in'
        correct: false
        why: 'A folder can be moved in an hour any day, and nobody outside notices.'
      - text: 'Which Vue component handles date picking'
        correct: false
        why: 'It''s confined to one or two files; if it''s wrong, you can swap it in a day or two.'
    ref: triage-a-feature
  - q: 'What is the long-term problem in the code below?'
    lang: php
    code: |
      #[Route('/api/users/{id}', methods: ['GET'])]
      public function show(User $user): JsonResponse
      {
          return $this->json($user);
      }
    hint: 'Exactly which fields does the client receive, and who decides that list?'
    options:
      - text: '`$this->json()` is slow; `new JsonResponse()` should be used'
        correct: false
        why: 'The two do almost the same job. Speed isn''t the problem here.'
      - text: 'The User table''s structure becomes the public contract — changing a column will break clients'
        correct: true
        why: 'The entity''s properties are the JSON fields. So every internal change reaches the outside, and even secret fields can leak.'
      - text: 'It should be POST rather than GET'
        correct: false
        why: 'GET is the right method for reading data.'
      - text: 'There''s no problem — the less code, the better'
        correct: false
        why: 'Less code today, but the moment you change a column tomorrow you''ll have to coordinate with every client.'
    ref: accidental-architecture
  - q: '"Which database to use" is cheap to change on day one and very expensive two years later. What is the main reason?'
    hint: 'What has been built on top of the decision in two years?'
    options:
      - text: 'The database software gets old'
        correct: false
        why: 'Version upgrades are a separate, comparatively easy job. That isn''t where the cost comes from.'
      - text: 'The licence price goes up over two years'
        correct: false
        why: 'Prices may rise, but the effort of changing comes from somewhere else.'
      - text: 'Two years of stored data, and hundreds of queries written in that database''s dialect'
        correct: true
        why: 'The more stands on a decision and the more data piles up, the costlier a change gets.'
      - text: 'Developers don''t want to learn another database'
        correct: false
        why: 'Learning takes a few weeks; moving data and queries takes months.'
    ref: cost-of-change-test
  - q: 'A team lead says, "Every decision is important, so we''ll hold a meeting on each." What is the real harm?'
    hint: 'Time is limited. If every decision gets an equal share, how much do the expensive ones get?'
    options:
      - text: 'The expensive decisions get no special attention, and the whole team slows down'
        correct: true
        why: 'If button colours and the data model get equal time, it''s the data model that loses out, though mistakes there cost the most.'
      - text: 'No harm — more discussion always means better decisions'
        correct: false
        why: 'A long discussion of a cheap decision saves nothing, because a mistake can be fixed in an hour anyway.'
      - text: 'More meetings make the code quality worse'
        correct: false
        why: 'The number of meetings isn''t the problem; the problem is spending the time in the wrong place.'
    ref: wrong-meeting
  - q: 'Which of these quietly turn a cheap decision into an expensive one?'
    hint: 'Where are many things leaning directly on something internal?'
    options:
      - text: 'Two separate apps reading and writing the same table directly'
        correct: true
        why: 'The table''s structure becomes the contract between the two apps — even renaming one column forces both teams to deploy together.'
      - text: 'Using a vendor''s SDK classes directly in 40 files'
        correct: true
        why: 'Switching vendor means touching 40 places. Behind an interface it would be one class.'
      - text: 'Splitting one private method into three smaller ones'
        correct: false
        why: 'Nobody outside sees a private method; it''s tidying inside a class and can be changed any time.'
      - text: 'Using the database''s auto-increment id in public URLs'
        correct: true
        why: 'The internal id becomes an outside promise; changing the id type breaks every old link and client.'
    ref: accidental-architecture
  - q: 'Which of these is usually NOT an architectural decision?'
    hint: 'Which one can be changed by touching just one class?'
    options:
      - text: 'Whether orders and payments live in one service or two'
        correct: false
        why: 'That''s a service boundary, one of the four foundations. If it''s wrong, code, data and teams must be re-split.'
      - text: 'Whether money is a float or integer cents'
        correct: false
        why: 'That''s the data model. It''s hard to change once data has piled up, and a wrong type gives wrong totals too.'
      - text: 'Which email-sending library sits behind an interface'
        correct: true
        why: 'The rest of the code knows only the interface. Switching libraries means rewriting one class — a paint-like decision.'
      - text: 'The field names in the API given to the mobile app'
        correct: false
        why: 'A public contract. You can''t force an old app on a phone to change.'
    ref: four-pillars
