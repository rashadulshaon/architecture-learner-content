slides:
  - slug: two-languages
    title: 'The business speaks one language, the code another'
    kind: story
    tldr: 'When the business and the developers don''t use the same words, misunderstandings seep into the code. A ubiquitous language is one shared vocabulary, and the code uses it too.'
    keywords: ['ubiquitous language', 'DDD', 'domain-driven design', 'business language', 'misunderstanding', 'domain expert']
    blocks:
      - type: text
        body: |
          The head of the business said, "When an order is canceled, no refund, just store credit." Ryan built a refund. Two weeks later it emerged that the business uses "canceled" in two senses: if the customer cancels, it's credit; if we cancel, it's a refund. All the code said was `setStatus(3)`, and nobody knew which cancellation a 3 meant.
      - type: visual
        kind: table
        caption: 'What the business says vs what the code says'
        headers: ['The business says', 'The code says', 'What''s wrong']
        rows:
          - cells: ['The customer canceled the order', 'setStatus(3)', 'Only the author knows what 3 means']
            tip: 'The business sentence and the code sentence don''t match, so neither a newcomer nor the business can read the code.'
          - cells: ['The customer''s credit balance', 'balance < 0', 'What does a negative balance mean?']
            tip: 'The business calls the same number credit and the code calls it debt. When words don''t match, the rules go wrong too.'
          - cells: ['The coupon has been used up', 'used_cnt++', 'After how many uses is it "finished"?']
            tip: 'The rule ("can be used only once") isn''t in the code; there is just a counter.'
          - cells: ['We rejected the order', 'flag2 = true', 'What is flag2, really?']
            tip: 'Flags with meaningless names pile up until the code is a puzzle.'
    aside:
      - type: story
        title: 'The price of two "cancels"'
        body: |
          Because of the wrong refund, about 300 customers got money back who shouldn't have. There was no bug in the code: it did exactly what the developer understood. The mistake was in the understanding.
      - type: terms
        items:
          - {term: 'Domain', meaning: 'The business or field of work the software is being built for.'}
          - {term: 'Domain expert', meaning: 'The person who understands that business best, usually a staff member or business owner, not a developer.'}
    check:
      q: 'The code ran fine, so why did 300 customers get a wrong refund?'
      a: 'Because "canceled" had two meanings and nobody separated them. The code did what the developer understood, not what the business needed.'

  - slug: words-in-code
    title: 'Turn the business sentence into a method name'
    kind: howto
    tldr: 'Give each business sentence its own method, named in the business''s words, with the rule inside. A refund after a customer cancellation then looks wrong at a glance.'
    keywords: ['ubiquitous language', 'refactoring', 'rename', 'domain method', 'cancelByCustomer', 'status enum']
    blocks:
      - type: text
        body: |
          Back to Ryan's order. The business has two sentences: "when the customer cancels, they get store credit" and "when we cancel, they get a refund". Store credit is money kept in the customer's account for the next purchase; a refund sends the money back. The fix is one method per sentence, named in those exact words.
      - type: code
        lang: php
        file: 'src/Sales/CancelOrderHandler.php'
        variant: bad
        code: |
          // Before: both cancellations are the same number, so both get a refund
          $order->setStatus(3);
          $payments->refund($order);
          // The business has two rules here; nothing in these lines tells them apart.
        marks:
          - {line: 2, tip: 'Is 3 "canceled by the customer" or "canceled by us"? Only whoever wrote it knows, and a month later even they may not.'}
          - {line: 3, tip: 'Always refunding is right for one cancellation and wrong for the other. This is how about 300 customers got money they should not have.'}
      - type: code
        lang: php
        file: 'src/Sales/Order.php'
        variant: good
        code: |
          final class Order
          {
              public function cancelByCustomer(): void
              {
                  $this->cancel(OrderStatus::CanceledByCustomer);
              }

              public function cancelByUs(): void
              {
                  $this->cancel(OrderStatus::CanceledByUs);
              }

              private function cancel(OrderStatus $to): void
              {
                  if ($this->status !== OrderStatus::Placed) {
                      throw new OrderCannotBeCanceled($this->id);
                  }
                  $this->status = $to;
              }
          }

          // In the handlers, each business sentence is now a readable pair of lines:
          $order->cancelByCustomer();
          $customer->addCredit($order->total());   // store credit, no refund

          $order->cancelByUs();
          $payments->refund($order);               // we canceled: the money goes back
        marks:
          - {line: 3, tip: 'The business sentence "the customer cancels" is now a method. Whoever reads the code reads the same words the business says.'}
          - {line: 15, tip: 'One shared guard: an order that is already canceled or shipped can''t be canceled again.'}
          - {line: 24, tip: 'Store credit is added; there is no refund call here. A refund on this path would stand out in review.'}
      - type: quote
        body: 'Name the method the way the business says the sentence.'
    aside:
      - type: pitfalls
        items:
          - 'Inventing the words yourself. Take them from the business person, or you have created a third language.'
          - 'Renaming the whole codebase in one go. Add the new method, move callers one at a time, then delete `setStatus()`.'
      - type: when
        use:
          - 'Rules the business talks about out loud: cancel, refund, approve, expire.'
        avoid:
          - 'Plain CRUD screens with no business rules, where `setName()` is perfectly fine.'
          - 'The price: time with a domain expert up front, and renaming old code.'
    check:
      q: 'Where, in the new code, can a reviewer see that a customer-canceled order must not be refunded?'
      a: 'In the handler: `cancelByCustomer()` is followed by `addCredit()`, never `refund()`. The method name carries the business rule, so a wrong refund looks wrong at a glance.'

  - slug: bounded-contexts
    title: 'Bounded context: one word, one meaning, one boundary'
    kind: concept
    tldr: 'In a big system the same word means different things in different places. Draw a boundary (a bounded context) around each meaning, and keep one meaning per word inside it.'
    keywords: ['bounded context', 'ubiquitous language', 'context map', 'DDD', 'boundary', 'same word different meaning']
    blocks:
      - type: metaphor
        icon: shop
        title: 'Three kinds of "order" in a pizza place'
        body: |
          At the cash counter, an "order" is a bill with prices and payment. In the kitchen, the same "order" is a list of what to cook in which oven. To the delivery driver, an "order" is a box with an address. All three are right, because each holds one meaning inside their own job. The trouble starts when all three share one table: the kitchen renames an oven column, and the cash counter's bill stops working.
      - type: visual
        kind: table
        caption: 'The same word "order", three meanings in three contexts'
        headers: ['', 'Sales', 'Kitchen', 'Delivery']
        rows:
          - cells: ['"Order" means', 'prices, coupon, payment', 'what to cook', 'a packet with an address']
            tip: 'Each context keeps inside "order" only what its own job needs.'
          - cells: ['Key data', 'items, total price', 'items, timing', 'address, phone']
            tip: 'Instead of one giant 60-column Order table, three small, clear models in three contexts.'
          - cells: ['Changes when', 'pricing rules change', 'the menu changes', 'the route changes']
            tip: 'The reasons for change differ, so in separate contexts a change in one doesn''t break another.'
          - cells: ['In Symfony', 'src/Sales/', 'src/Kitchen/', 'src/Delivery/']
            tip: 'An easy start: each context gets its own folder and namespace, with its own Order class. They talk only through ids or events.'
      - type: code
        lang: php
        file: 'src/Sales/OrderPlaced.php + src/Kitchen/StartCooking.php'
        variant: good
        code: |
          // Sales publishes only what others need: ids and dish names, no prices
          final readonly class OrderPlaced
          {
              public function __construct(public string $orderId, public array $dishes)
              {
              }
          }

          // Kitchen builds its own, much smaller Order from that message
          #[AsMessageHandler]
          final class StartCooking
          {
              public function __construct(private KitchenOrders $kitchen)
              {
              }

              public function __invoke(OrderPlaced $event): void
              {
                  $this->kitchen->add(Order::fromDishes($event->orderId, $event->dishes));
              }
          }
        marks:
          - {line: 1, tip: 'The message crosses the boundary carrying an id and dish names only. Prices and coupons stay inside Sales.'}
          - {line: 19, tip: 'Kitchen turns the message into its own Order, with only what it needs to cook. It never reads the Sales tables.'}
      - type: quote
        body: 'One word, one meaning, inside one context. Change the context and the meaning may change.'
    aside:
      - type: remember
        body: 'Not one giant Order, but a small Order of its own in each context.'
      - type: tips
        items:
          - 'Sit with the business people, write down their own words, and use exactly those words as class and method names.'
          - 'Contexts talk through ids or events, never by reaching into each other''s database tables.'
      - type: when
        use:
          - 'The same word means different things to different teams or jobs.'
        avoid:
          - 'A small app with one team and one meaning per word: a single model is simpler.'
          - 'The price: some data lives in two places, and you write hand-off code between contexts.'
      - type: refs
        items:
          - {to: 'messaging/events-vs-commands', label: 'Talking between contexts with events'}
    check:
      q: 'If Sales and Kitchen share a single Order class, what trouble lies ahead?'
      a: 'Each team will change the class for its own needs, and one team''s change will break the other''s code. The class will pile up fields for every meaning and become huge and confusing.'

  - slug: entity-and-value-object
    title: 'Entity and value object'
    kind: howto
    tldr: 'An entity is recognized by its identity (id), a value object by its value. Make things like money and addresses value objects and the rules become safe on their own.'
    keywords: ['entity', 'value object', 'Embeddable', 'Money', 'immutable', 'Doctrine embedded']
    blocks:
      - type: text
        body: |
          A $10 bill can be swapped for any other $10 bill, because all you care about is the value. That's a **value object**: no identity, equal values mean the same thing, and once created it never changes. But your Social Security number and mine are different, even if we share a name. That's an **entity**: it has an identity (an id), and it's the same person even when everything else about them changes.
      - type: code
        lang: php
        file: 'src/Sales/Money.php'
        variant: good
        code: |
          #[ORM\Embeddable]
          final class Money
          {
              private function __construct(
                  #[ORM\Column(type: 'integer')]
                  private int $cents,
                  #[ORM\Column(length: 3)]
                  private string $currency,
              ) {
              }

              public static function cents(int $cents): self
              {
                  return new self($cents, 'USD');
              }

              public static function dollars(int $dollars): self
              {
                  return self::cents($dollars * 100);
              }

              public function plus(self $other): self
              {
                  if ($other->currency !== $this->currency) {
                      throw new \DomainException('Cannot add different currencies');
                  }

                  return new self($this->cents + $other->cents, $this->currency);
              }

              public function equals(self $other): bool
              {
                  return $this->cents === $other->cents
                      && $this->currency === $other->currency;
              }
          }
        marks:
          - {line: 4, tip: 'A private constructor: you can''t push in just any value. You have to create one through a named static method.'}
          - {line: 6, tip: 'Money is stored in cents (an integer). With floats, 0.1 + 0.2 is not exactly 0.3, which is terrifying in money math.'}
          - {line: 28, tip: 'plus() doesn''t change itself; it returns a new Money. That is immutability: once created, the value never changes.'}
      - type: code
        lang: php
        file: 'src/Sales/Customer.php'
        variant: good
        code: |
          #[ORM\Entity]
          class Customer
          {
              #[ORM\Id]
              #[ORM\Column(type: 'uuid')]
              private Uuid $id;

              #[ORM\Embedded(columnPrefix: 'credit_')]
              private Money $credit;

              public function equals(self $other): bool
              {
                  return $this->id->equals($other->id);   // compare identity, not values
              }
          }
        marks:
          - {line: 6, tip: 'The id is fixed once and never changes. The Customer stays the same even if the name or phone changes.'}
          - {line: 9, tip: 'Money is stored right in the customer table, in the columns credit_cents and credit_currency. It needs no table or id of its own.'}
    aside:
      - type: tips
        items:
          - 'Money, addresses, date ranges, emails: these are usually value objects. If "are these two equal?" is decided by looking at the values, it is a value object.'
          - 'Avoid primitive obsession: use an `Email` class instead of `string $email`, so an invalid value can''t even be created.'
      - type: pitfalls
        items:
          - 'Storing money as a float. Store an int in cents, or use a dedicated money library.'
    check:
      q: 'Two Customers have the same name, phone, everything. Are they the same entity? And what about Money(500) and Money(500)?'
      a: 'Customer: no, if the ids differ they are different entities. Money: yes, equal values mean the same value object.'

  - slug: money-as-primitive
    title: 'What goes wrong with float money and raw strings'
    kind: pitfall
    tldr: 'A float or a raw string accepts anything, so mistakes slip in silently. A Money or Email object refuses wrong values at the door.'
    keywords: ['primitive obsession', 'float money', 'rounding error', 'Money', 'Email', 'value object']
    blocks:
      - type: text
        body: |
          A **float** is how a computer stores a number like 19.99: very close, but rarely exact. Convert $19.99 to cents with `19.99 * 100` and you get 1998.9999999999998, and `(int)` cuts it to 1998. One cent vanishes on every sale of that item. Over 100,000 sales that is $1,000, and no error appears anywhere.
      - type: code
        lang: php
        file: 'src/Sales/Checkout.php'
        variant: bad
        code: |
          // A price of $19.99, converted to cents for the database
          $cents = (int) (19.99 * 100);             // 1998, not 1999: a cent is lost

          // Dollars and euros are both "just numbers", so PHP adds them happily
          $total = $creditInDollars + $feeInEuros; // 500 + 5 = 505 of what?

          // An email is "just a string", so a broken one gets in
          $customer->setEmail('ryan@');
        marks:
          - {line: 2, tip: 'The float 19.99 is stored as a close-but-not-exact value, so times 100 lands just under 1999 and (int) throws the rest away.'}
          - {line: 5, tip: 'Nothing says one number is dollars and the other euros. The sum is meaningless, and PHP raises no error.'}
          - {line: 8, tip: 'A plain string accepts anything. The broken address is saved, and the first welcome email fails later, far from here.'}
      - type: code
        lang: php
        file: 'src/Sales/Checkout.php'
        variant: good
        code: |
          $price = Money::cents(1999);            // integer from the start: exact
          $total = $price->plus(Money::dollars(5)); // 2499 cents, exact

          $total->plus($feeInEuros);              // DomainException: $feeInEuros is EUR

          Email::fromString('ryan@');            // InvalidArgumentException: can't exist
        marks:
          - {line: 1, tip: 'The price enters as whole cents, so there is no float and no conversion to get wrong.'}
          - {line: 4, tip: 'Adding different currencies is refused inside Money::plus(), exactly where the rule belongs.'}
          - {line: 6, tip: 'An Email value object checks the format in its constructor, so an invalid one can''t exist in the first place.'}
      - type: quote
        body: 'Never store money in a float. Store whole cents, inside a Money.'
    aside:
      - type: pitfalls
        items:
          - 'Percentages still need a rounding rule: 5% of 1,999 cents is 99.95 cents. Decide how to round, and test it.'
          - 'Several currencies, taxes and exchange rates: use a library such as moneyphp/money instead of growing your own.'
      - type: when
        use:
          - 'Any amount you add, compare or store: prices, balances, fees.'
        avoid:
          - 'A number nobody does arithmetic on, like a likes counter: a plain int is enough.'
    check:
      q: '`(int) (19.99 * 100)` returns 1998. Why does it, and what is the fix?'
      a: 'The float 19.99 is not stored exactly, so times 100 lands just under 1999 and `(int)` cuts it. Keep integer cents from the start, inside a Money object.'

  - slug: aggregate-boundary
    title: 'Aggregate: the boundary that guards the rules'
    kind: pitfall
    tldr: 'Make the things that change together into one aggregate and let its root guard the rules. If outside code changes the inner parts directly, the rules break.'
    keywords: ['aggregate', 'aggregate root', 'invariant', 'encapsulation', 'Doctrine collection', 'transaction boundary']
    blocks:
      - type: text
        body: |
          An order has rules: at most 20 items, and once confirmed nothing can change. Rules like these are called **invariants**: things that must always be true. In the code below the rules are scattered around the controller, so it is easy to break them from somewhere else.
      - type: code
        lang: php
        file: 'src/Controller/OrderController.php'
        variant: bad
        code: |
          // The order already has 20 lines. The inner collection is changed directly, with no rules
          $order->getLines()->add(new OrderLine($order, $productId, 1, $price));

          // And the status can be changed from any code
          $order->setStatus(OrderStatus::Confirmed);
        marks:
          - {line: 2, tip: 'The order already had 20 lines and this made 21: nobody checked the limit. If another controller or command does the same, the rule will be broken for sure.'}
          - {line: 5, tip: 'Even an empty order could be confirmed. Nobody is guarding the rule.'}
      - type: code
        lang: php
        file: 'src/Sales/Order.php'
        variant: good
        code: |
          #[ORM\Entity]
          class Order
          {
              private const MAX_LINES = 20;

              #[ORM\OneToMany(targetEntity: OrderLine::class, mappedBy: 'order',
                  cascade: ['persist'], orphanRemoval: true)]
              private Collection $lines;

              #[ORM\Column(enumType: OrderStatus::class)]
              private OrderStatus $status = OrderStatus::Draft;

              public function addLine(ProductId $product, int $qty, Money $price): void
              {
                  if ($this->status !== OrderStatus::Draft) {
                      throw new OrderAlreadyConfirmed($this->id);
                  }
                  if ($this->lines->count() >= self::MAX_LINES) {
                      throw new TooManyLines(self::MAX_LINES);
                  }
                  $this->lines->add(new OrderLine($this, $product, $qty, $price));
              }

              public function confirm(): void
              {
                  if ($this->lines->isEmpty()) {
                      throw new CannotConfirmEmptyOrder($this->id);
                  }
                  $this->status = OrderStatus::Confirmed;
              }
          }

          // The controller, after the fix: the 21st line is refused
          $order->addLine($productId, 1, $price);   // throws TooManyLines
        marks:
          - {line: 13, tip: 'The only way to add an item. The rules live inside this method, so everyone has to obey them.'}
          - {line: 21, tip: 'Instead of holding a Product directly, it keeps only a ProductId; there is no need to reach inside another aggregate.'}
          - {line: 26, tip: 'confirm() checks for itself whether the order is empty. With no setStatus(), this guard can''t be bypassed.'}
      - type: visual
        kind: flow
        caption: 'From outside, you can only enter through the root''s door'
        nodes:
          - {id: ctrl, label: 'Controller', sub: 'outside code', icon: browser, col: 0, row: 1, tip: 'Only calls the public methods of the aggregate root. It never touches the inner OrderLine directly.'}
          - {id: order, label: 'Order', sub: 'aggregate root', icon: shield, tone: accent, col: 2, row: 1, tip: 'The guardian of the rules. Every change goes through its methods.'}
          - {id: line, label: 'OrderLine', sub: 'inner part', icon: list, col: 4, row: 0, tip: 'It has no separate existence without Order. Only Order creates and changes it.'}
          - {id: product, label: 'Product', sub: 'a separate aggregate', icon: box, col: 4, row: 2, tip: 'A separate boundary. Order keeps only its id, not the whole object.'}
        edges:
          - {from: ctrl, to: order, label: 'Calls addLine(), and the rules are enforced.'}
          - {from: order, to: line, label: 'Creates the OrderLine, within the rules.'}
          - {from: order, to: product, label: 'Holds on to only the ProductId.', dashed: true}
      - type: quote
        body: 'To change an inner part, go through the root''s door. Change only one aggregate per transaction.'
    aside:
      - type: pitfalls
        items:
          - 'A giant aggregate: put everything under one root and transactions grow and locking gets painful. Keep them small.'
          - 'Pushing DDD into every little class. Use an aggregate only when you have complex rules; plain CRUD doesn''t need it.'
      - type: refs
        items:
          - {to: 'thinking/hexagonal', label: 'How a repository becomes a port'}
    check:
      q: 'The code has `confirm()` but no `setStatus()`. How does that protect the invariant?'
      a: 'confirm() checks the condition inside (the order isn''t empty), and it is the only way to change the status. Nobody outside can change the status and skip the check.'

flashcards:
  - q: 'What is a ubiquitous language?'
    a: 'One shared vocabulary for business people and developers, the same in conversation, in documents and in class and method names.'
    more: |
      Writing `cancelByCustomer()` instead of `setStatus(3)` lets a business person read the code and spot a mistake. Misunderstandings shrink and newcomers learn faster. Take the words from the business people; don't invent them yourself.
    ref: two-languages
  - q: 'How do you turn "when the customer cancels, give store credit" into code?'
    a: 'Give that sentence its own method in the business''s words, such as `cancelByCustomer()`, and put the rule inside it instead of a status number.'
    more: |
      `cancelByCustomer()` and `cancelByUs()` replace `setStatus(3)`. Each one is followed by its own step, credit or refund, so a wrong refund looks wrong at a glance. Do it gradually: add the new method, move callers one by one, then delete the setter.
    ref: words-in-code
  - q: 'What is a bounded context?'
    a: 'A boundary inside which every word has exactly one meaning and there is exactly one model.'
    more: |
      The same "order" is a bill in Sales, a cooking list in Kitchen and a packet in Delivery. Giving each its own boundary (often its own folder or module) and its own class prevents one huge, confusing model.
    ref: bounded-contexts
  - q: 'How do bounded contexts talk to each other?'
    a: 'Through ids, APIs or events, never by reaching into each other''s database tables or inner classes.'
    more: |
      A boundary works only if it can't be breached from outside. When Sales publishes an "order placed" event, Kitchen listens and builds its own cooking list in its own language. More in [[messaging/events-vs-commands|events and commands]].
    ref: bounded-contexts
  - q: 'What does splitting into bounded contexts cost, and when is it not worth it?'
    a: 'Some data lives in two places and you write hand-off code between contexts. With one team and one meaning per word, a single model is simpler.'
    more: |
      Sales and Kitchen both know an order id and the dish names, and an event carries them across. That is a small price when the meanings really differ. In a small app where every word means one thing, it is just extra code.
    ref: bounded-contexts
  - q: 'What is the main difference between an entity and a value object?'
    a: 'An entity has an identity (id) and stays the same when its data changes. A value object has no identity: equal values mean they are the same.'
    more: |
      A Customer entity keeps the same id and is the same person even if the name changes. A Money value object is interchangeable: $500 is $500. Value objects are usually immutable.
    ref: entity-and-value-object
  - q: 'Why store money in cents as an int, or as a Money object, instead of a float?'
    a: 'Because floats give slightly wrong results (0.1 + 0.2 is not exactly 0.3), which is unacceptable for money.'
    more: |
      Integers in cents keep addition and subtraction exact. A Money value object also carries the currency, and throws an exception if you try to add different currencies.
    ref: entity-and-value-object
  - q: 'What goes wrong with `(int) (19.99 * 100)` in PHP?'
    a: 'It gives 1998, not 1999. The float 19.99 is not exact, so a cent disappears. Keep money as integer cents from the start.'
    more: |
      One lost cent per sale looks harmless, but over 100,000 sales it is $1,000, and no error is ever raised. A Money object built from whole cents never does this conversion.
    ref: money-as-primitive
  - q: 'What are an aggregate and an aggregate root?'
    a: 'An aggregate is a cluster of classes that change together and obey the rules together. The root is the cluster''s only door.'
    more: |
      Order is the root and OrderLine is an inner part. Outside code never changes OrderLine directly; it goes through Order's methods (`addLine`). The repository exists only for the root.
    ref: aggregate-boundary
  - q: 'What is an invariant, and how does an aggregate protect it?'
    a: 'An invariant is a rule that must always be true. The aggregate root checks it inside its own methods and keeps its setters hidden.'
    more: |
      Example: "an order has at most 20 items". `addLine()` checks this, so no route lets a 21st item in. When the rule is scattered around controllers, it breaks the moment one person forgets.
    ref: aggregate-boundary

quiz:
  - q: 'The business says "the customer canceled the order", and the code says `$order->setStatus(3)`. From a ubiquitous-language point of view, which change is best?'
    hint: 'The business sentence should show up in the code almost word for word.'
    options:
      - text: '`$order->cancelByCustomer()`'
        correct: true
        why: 'The business''s words made it into the code. Business people can read it, and "canceled by us" can be a separate method.'
      - text: '`$order->setStatus(OrderStatus::CANCELLED)`'
        correct: false
        why: 'Better than a number, but it still doesn''t separate who canceled, and the rules are still easy to break from outside.'
      - text: '`$order->setStatus(3); // 3 = canceled`'
        correct: false
        why: 'A comment doesn''t fix the language, and it doesn''t say which cancellation the 3 means.'
      - text: '`$order->flag3 = true;`'
        correct: false
        why: 'A meaningless name moves you even further from the business language.'
    ref: two-languages
  - q: 'The business says: "customer cancels, store credit; we cancel, refund." Which design makes the wrong-refund mistake hardest to repeat?'
    hint: 'Which version lets a reader see the rule from the method name alone?'
    options:
      - text: 'One `cancel(bool $byCustomer)` method'
        correct: false
        why: 'Better than numbers, but `cancel(true)` at the call site still says nothing, and both rules end up tangled in one method.'
      - text: '`cancelByCustomer()` and `cancelByUs()` as two methods, each followed by its own step (credit or refund)'
        correct: true
        why: 'Each business sentence is a method name, so a refund after `cancelByCustomer()` looks wrong at a glance.'
      - text: 'One `cancel(int $type)` where 1 means customer and 2 means us'
        correct: false
        why: 'Numbers again: every caller must remember what 1 and 2 mean, which was the original problem.'
      - text: 'Keep `setStatus(3)` and describe the numbers on a wiki page'
        correct: false
        why: 'The wiki and the code drift apart, and nobody opens the wiki at the moment they write the line.'
    ref: words-in-code
  - q: 'In an e-commerce system both the Sales and Support teams use the word "Customer", but their needs differ. What is the best decision?'
    hint: 'What happens when one class keeps changing for two teams'' needs?'
    options:
      - text: 'Keep a separate Customer class in each context, linked by id'
        correct: true
        why: 'Each context models only what its own job needs, so one team''s change doesn''t break the other.'
      - text: 'Put both teams'' fields in one giant Customer class'
        correct: false
        why: 'The class becomes huge and confusing, and the two teams'' changes break each other.'
      - text: 'Force one team to use the other team''s words'
        correct: false
        why: 'The meanings differ because the needs differ. Forcing it would hamper one team''s work.'
      - text: 'Drop the word Customer and run on numbers'
        correct: false
        why: 'Taking the language away makes the misunderstanding worse.'
    ref: bounded-contexts
  - q: 'Which of these are usually value objects?'
    hint: 'Is "are they equal?" decided by an id or by the value?'
    options:
      - text: 'Money ($500, USD)'
        correct: true
        why: 'Equal values mean the same thing; no identity of its own is needed.'
      - text: 'Email (user@example.com)'
        correct: true
        why: 'The same address is the same email. Kept in a class, an invalid format can''t even be created.'
      - text: 'Customer (with an id)'
        correct: false
        why: 'It stays the same Customer even if the name and address change. It has an identity, so it is an entity.'
      - text: 'Order (with an id)'
        correct: false
        why: 'The order stays the same even if its items change. It has an identity (id), so it is an entity.'
    ref: entity-and-value-object
  - q: 'A developer writes `$cents = (int) ($price * 100);` with `$price = 19.99`. What is true?'
    hint: 'What does (int) do to the decimals of a float: round or cut?'
    options:
      - text: 'It is always 1999, because PHP rounds when casting a float to int'
        correct: false
        why: 'PHP truncates when casting a float to an int; it does not round.'
      - text: 'It can give 1998, because 19.99 * 100 is 1998.9999999999998 and (int) cuts off the decimals'
        correct: true
        why: 'The float is not exact, so the product lands just under 1999 and the cast drops the rest.'
      - text: 'It only goes wrong for amounts above a million dollars'
        correct: false
        why: 'Size does not matter. The tiny representation gap shows up at small amounts too.'
      - text: 'Keeping the price as integer cents (1999) from the start avoids the conversion altogether'
        correct: true
        why: 'With whole cents there is no float and no multiplication, so nothing can be lost.'
    ref: money-as-primitive
  - q: 'Where does the aggregate''s rule get broken in the code below?'
    lang: php
    code: |
      #[Route('/orders/{id}/lines', methods: ['POST'])]
      public function add(Order $order, Request $request, EntityManagerInterface $em): Response
      {
          $line = new OrderLine($order, new ProductId($request->get('p')), 5, $price);
          $order->getLines()->add($line);
          $em->flush();

          return new Response(status: 201);
      }
    hint: 'Who is checking the item limit or the confirmed-order rule?'
    options:
      - text: 'The controller changes the inner collection directly, so none of Order''s rules (limit, status) are checked'
        correct: true
        why: 'It skips the root''s `addLine()` and goes straight inside, so nobody is protecting the invariant.'
      - text: 'Using status 201 is wrong'
        correct: false
        why: '201 is correct for creating a new resource; the architectural problem isn''t here.'
      - text: 'EntityManagerInterface shouldn''t be injected into the action'
        correct: false
        why: 'That might be a style argument, but the real problem in this code is bypassing the rules.'
      - text: 'Using the ProductId value object was a mistake'
        correct: false
        why: 'Using ProductId is actually good; it keeps the aggregate light.'
    ref: aggregate-boundary
  - q: 'Why does the Order aggregate hold only a ProductId instead of the whole Product object?'
    hint: 'How many aggregates should change in one transaction?'
    options:
      - text: 'Product is a separate aggregate; holding the id keeps the boundary clear and only one aggregate changes per transaction'
        correct: true
        why: 'Holding the whole object tangles two aggregates together, so transactions grow and locks multiply.'
      - text: 'A ProductId is small and saves memory, which is the only reason'
        correct: false
        why: 'Memory is a minor reason. The main one is a clean boundary and clean rules.'
      - text: 'Doctrine can''t hold more than one entity'
        correct: false
        why: 'Doctrine can; this is a design decision, not a framework limitation.'
      - text: 'When a Product''s price changes the order''s price changes too, so only the id is kept'
        correct: false
        why: 'Quite the opposite: the order keeps the price from when it was created, stored in the Order itself.'
    ref: aggregate-boundary
