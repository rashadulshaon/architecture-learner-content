slides:
  - slug: two-teams-two-habits
    title: 'Two teams, two stacks, two kinds of pain'
    kind: story
    tldr: 'Both teams picked a stack by fashion or habit instead of by the job, and each paid for it in the part of the system that mattered most.'
    keywords: ['choosing a stack', 'framework choice', 'language choice', 'fashion', 'habit', 'insurance system', 'video streaming']
    blocks:
      - type: metaphor
        icon: truck
        title: 'Choosing a vehicle for the route'
        body: |
          A delivery company owner in Dallas buys the same vehicle his neighbor just bought. A cargo van is perfect for a narrow alley downtown, but it can't haul ten tons of produce to Houston. A semi truck can, but it won't fit down the alley.
      - type: text
        body: |
          Neither vehicle is bad. The load and the road decide. Ryan's team is building a policy and claims system for an insurance company, and Nicole's team is building a video-streaming site. Both picked a stack the way the owner picked his vehicle.
      - type: visual
        kind: compare
        caption: 'Same mistake, different pain: the stack was chosen before the job was understood'
        columns:
          - title: 'Ryan: insurance, chosen by fashion'
            tone: bad
            icon: warning
            tip: 'A trendy minimal toolkit looked fast in a conference talk. But an insurance system lives on money rules, permissions and records, and the toolkit left all of that to the team.'
            items:
              - 'Picked a trendy, minimal toolkit after a conference talk'
              - 'Nothing built in for roles, audit trail or nightly batch jobs'
              - 'Premiums kept as floating-point numbers; totals drifted by a few cents'
              - 'Months spent hand-building what other stacks ship ready and tested'
          - title: 'Nicole: video, chosen by habit'
            tone: warn
            icon: warning
            tip: 'The team knew this stack from a bank project, so they never asked where a video site spends its effort. The real work is converting and delivering big files, not rendering pages.'
            items:
              - 'Picked the stack the team already knew from a bank project'
              - 'Converted uploads inside the web request, so the site froze'
              - 'Streamed every video straight from the app server; lag and bills grew'
              - 'The web framework was never the bottleneck'
    aside:
      - type: story
        title: 'The cent that did not add up'
        body: |
          At month-end the auditors found that the premium report was a few dollars away from the sum of the individual policies. Money had been stored as floating-point numbers, which can't hold a value like 0.1 exactly, and rounded in different places. With no audit trail, nobody could prove which figure was right.
      - type: terms
        items:
          - {term: 'Stack', meaning: 'The language, framework, database and supporting tools you build an application on.'}
          - {term: 'Audit trail', meaning: 'A record of who changed what and when, kept so a change can be traced later.'}
          - {term: 'Transcoding', meaning: 'Converting an uploaded video into several sizes and formats so any phone or screen can play it.'}
    check:
      q: 'Neither stack was bad. So why did both teams end up in trouble?'
      a: 'Each chose by fashion or habit before asking what the job needed. The insurance team had no built-in safety for money and audit; the video team put the heavy work in the wrong place.'

  - slug: start-from-the-job
    title: 'Start from the job: six questions'
    kind: concept
    tldr: 'Write down what the application needs first (workload, correctness, built-ins, integrations, people, support), then see which stack fits, not the other way around.'
    keywords: ['stack selection', 'workload shape', 'correctness', 'team skills', 'hiring', 'long-term support', 'integration']
    blocks:
      - type: text
        body: |
          The transport owner asks what he carries, on which road, and who will drive. A stack decision has the same questions. Answer them before you look at any framework, and the shortlist nearly writes itself.
      - type: visual
        kind: table
        caption: 'Six vehicle questions, six stack questions'
        headers: ['Vehicle question', 'Stack question', 'Example']
        rows:
          - cells: ['What do we carry?', 'Workload shape', 'Video bytes, or many small money transactions']
            tip: 'What the system spends its time on: moving big files, waiting on other services, applying many rules, or recording many small changes safely.'
          - cells: ['How fragile is the cargo?', 'Correctness needs', 'Exact decimals, strict transactions, audit trail']
            tip: 'For money and legal records a wrong value is a real loss. For a video thumbnail it is not. The more fragile the cargo, the more you want proven built-in protection.'
          - cells: ['Which fittings come with it?', 'Built-in features', 'Transactions, security, batch jobs, scheduling, ORM']
            tip: 'Each feature the framework already ships is one you do not write, test, patch or explain to every new hire.'
          - cells: ['Which roads must it join?', 'Integration', 'Legacy systems, banks, file formats']
            tip: 'A stack that talks easily to your existing systems saves more than a faster one that needs glue code everywhere.'
          - cells: ['Who can drive and repair it?', 'Team and hiring', 'Skills you have, people you can hire']
            tip: 'A great stack that nobody on the team knows is a risk. Also ask who you can hire in your city when someone leaves.'
          - cells: ['How long are spare parts made?', 'Support and stability', 'Release cycle, long-term support, maturity']
            tip: 'An application may live ten years. Check how long a version gets security fixes and how painful upgrades usually are.'
      - type: quote
        body: 'Let the job choose the stack. Never let the stack choose the job.'
    aside:
      - type: terms
        items:
          - {term: 'Workload shape', meaning: 'What the system mostly does: move big files, wait on other services, crunch numbers, or record many small changes safely.'}
          - {term: 'Operational maturity', meaning: 'How well known the ways to deploy, monitor, back up and repair it are.'}
      - type: when
        use:
          - 'The job has clear needs, such as money, audit or heavy media, that a stack either serves well or does not.'
        avoid:
          - 'The needs are ordinary CRUD and your team already knows a mature stack. Then the team''s skill decides, and you can stop here.'
      - type: refs
        items:
          - {to: 'thinking/build-vs-buy', label: 'The complexity budget'}
    check:
      q: 'Name three things about the job you should settle before shortlisting any framework.'
      a: 'For example: the workload shape, how strict the correctness needs are (money, audit), and what the framework already provides. Integration, team skills and support length are the other three.'

  - slug: two-jobs-worked-example
    title: 'Worked example: a video site and an insurance system'
    kind: howto
    tldr: 'Ask the same six questions of both jobs. The answers differ, so what you look for in a stack differs, and several stacks can still fit either job.'
    keywords: ['worked example', 'video streaming', 'insurance', 'accounting', 'transcoding', 'CDN', 'object storage']
    blocks:
      - type: text
        body: |
          Here are the six questions answered for both teams. Read each row across: the same question gets a different answer, and so a different shopping list.
      - type: visual
        kind: table
        caption: 'Same questions, two jobs, two shopping lists'
        headers: ['Question', 'Video streaming', 'Insurance and accounting']
        rows:
          - cells: ['Workload shape', 'Big files, many viewers, a lot of I/O waiting', 'Many small writes, rules, reports, month-end batches']
            tip: 'Video is mostly bytes moving. Insurance is mostly rules applied to records, safely, again and again.'
          - cells: ['Correctness', 'A dropped frame annoys, it does not cost money', 'A wrong cent or lost record becomes a legal problem']
            tip: 'This row decides how much you value ready-made, long-tested protection for money and records.'
          - cells: ['Built-ins that help', 'Upload handling, queues, background workers', 'Transactions, roles, batch, scheduler, audit']
            tip: 'List the features you would otherwise write by hand. Those are the ones to look for in the framework.'
          - cells: ['Integration', 'Object storage, CDN, ffmpeg-style converters', 'Legacy core systems, banks, regulators']
            tip: 'Video integrates with infrastructure tools. Insurance integrates with old systems and outside institutions.'
          - cells: ['People', 'Any strong web team; most of the pipeline is tools', 'Engineers who know the rules and the legacy']
            tip: 'For video the team can learn the pipeline tools. For insurance, years of knowledge of the business rules are the scarce part.'
          - cells: ['What to look for', 'Many languages work; invest in the pipeline', 'Mature transactions, security, typing, long support']
            tip: 'The conclusion is not one winning stack. It is a list of properties, and several stacks may have them.'
      - type: visual
        kind: flow
        caption: 'Where the video work really happens: the web backend only hands files over'
        nodes:
          - {id: creator, label: 'Creator', sub: 'uploads a video', icon: user, col: 0, row: 0, tip: 'The person who uploads a new video.'}
          - {id: app, label: 'Web app', sub: 'any web language', icon: api, col: 1, row: 0, tip: 'The web backend. It accepts the upload and the logins, then hands the heavy work to other parts.'}
          - {id: store, label: 'Object storage', sub: 'files', icon: storage, col: 2, row: 0, tip: 'A service that stores big files cheaply: the originals and every converted version.'}
          - {id: worker, label: 'Converter', sub: 'ffmpeg-style worker', icon: worker, tone: accent, col: 2, row: 1, tip: 'A background worker that converts each video into several sizes. This is where the real effort goes.'}
          - {id: cdn, label: 'CDN', sub: 'copies near viewers', icon: cdn, col: 3, row: 0, tip: 'A content delivery network: servers around the world that keep copies of popular files close to viewers.'}
          - {id: viewer, label: 'Viewer', sub: 'watches', icon: mobile, col: 4, row: 0, tip: 'The person watching on a phone or laptop.'}
        edges:
          - {from: creator, to: app, label: 'The creator uploads a video and the web app accepts it.'}
          - {from: app, to: store, label: 'The app saves the original in object storage and replies at once.'}
          - {from: store, to: worker, label: 'A background worker picks up the file and converts it into several sizes.'}
          - {from: worker, to: store, label: 'The converted versions are saved back to storage.', dashed: true}
          - {from: store, to: cdn, label: 'The CDN copies the popular files and keeps them near viewers.'}
          - {from: cdn, to: viewer, label: 'Viewers stream from the CDN, not from the app server.', tone: good}
    aside:
      - type: tips
        items:
          - 'For a video site the budget goes into queues, storage, the CDN and the cost of delivery. The web layer can stay thin.'
          - 'An insurance system is the reverse: the framework itself carries the rules, so its built-in features matter most.'
      - type: pitfalls
        items:
          - 'Treating the two shopping lists as one verdict. The table says what to look for, not which brand to buy.'
      - type: refs
        items:
          - {to: 'thinking/quality-attributes', label: 'Quality attributes: what the system must be good at'}
    check:
      q: 'Why does the web backend language matter less for the video site than for the insurance system?'
      a: 'The video site''s heavy work (converting and delivering files) runs in storage, workers and a CDN, not in the web framework. The insurance system''s core job, safe money rules, runs inside its framework.'

  - slug: what-the-framework-gives
    title: 'Built in, or build it yourself?'
    kind: compare
    tldr: 'Mature stacks ship transactions, security, batch and scheduling ready-made. Check what yours ships before you hand-build it, and know what that convenience costs.'
    keywords: ['Spring Boot', '.NET', 'Symfony', 'Django', 'built-in features', 'declarative transactions', 'enterprise']
    blocks:
      - type: text
        body: |
          A feature you don't write is a feature you don't test, patch or explain to every new hire. That's why Java with Spring Boot and C# with .NET are common in banks and insurers: they ship years-tested answers to the needs of money work. They aren't the only fit. Django can run accounting software, and so can Symfony, which this course uses.
      - type: visual
        kind: compare
        caption: 'Three stacks and some of what each gives you built in'
        columns:
          - title: 'Java + Spring Boot'
            tone: default
            icon: code
            tip: 'A large, mature ecosystem used widely in enterprise systems. Strongly typed, with long-term-support Java releases.'
            items:
              - 'Declarative transactions with @Transactional'
              - 'Spring Security for login and permissions'
              - 'Spring Batch for large, restartable jobs'
              - 'Strong typing; long-term-support releases'
          - title: 'C# + .NET'
            tone: default
            icon: code
            tip: 'Microsoft''s stack, also common in enterprises. Strongly typed, with long-term-support releases and good tooling.'
            items:
              - 'Entity Framework Core: ORM and migrations'
              - 'Dependency injection built into the platform'
              - 'ASP.NET Core Identity for users and roles'
              - 'Strong typing; long-term-support releases'
          - title: 'PHP + Symfony'
            tone: accent
            icon: code
            tip: 'The stack of this course. It ships many of the same building blocks, so a CRUD developer can grow into money-heavy work without switching language.'
            items:
              - 'Doctrine ORM: transactions and migrations'
              - 'Security voters for fine-grained permissions'
              - 'Messenger for queues, Workflow for state rules'
              - 'Lock and Scheduler for exclusivity and timed jobs'
      - type: text
        body: |
          Without these built-ins you write them: transaction handling, permission checks, a batch loop that can restart. Each is code you must test, and a bug in it touches money. The price of using them is learning the framework's way, more ceremony for small jobs, and a pull toward its ecosystem. All of it spends the [[thinking/build-vs-buy|complexity budget]].
    aside:
      - type: terms
        items:
          - {term: 'Declarative transaction', meaning: 'You mark a method, and the framework opens, commits or rolls back the database transaction for you.'}
          - {term: 'Batch job', meaning: 'A large job run on a schedule, such as month-end premiums, that must be able to resume after a failure.'}
      - type: when
        use:
          - 'Money, audit and long-lived rules dominate: favor mature built-ins, strong typing and long support.'
          - 'Your team already masters a stack that meets the needs: use it.'
        avoid:
          - 'Picking a stack only because a bank or a famous company uses it.'
          - 'Ignoring who you can hire in your city when you choose.'
    check:
      q: 'Can Django run accounting software? Why do many insurers still pick Spring or .NET?'
      a: 'Yes, if you add and test what it lacks. Spring and .NET are common because transactions, security and batch ship built in, they are strongly typed, and their releases are supported for a long time.'

  - slug: fashion-and-benchmarks
    title: 'The trap: a fashionable rewrite or a benchmark winner'
    kind: pitfall
    tldr: 'Rewriting a working system into a trendy stack, or choosing by one speed benchmark, spends your complexity budget on a problem you never measured.'
    keywords: ['rewrite', 'benchmark', 'fashion', 'technology hype', 'decision checklist', 'complexity budget']
    blocks:
      - type: text
        body: |
          Kevin's old insurance system is slow at month-end. A new developer says, "Let's rewrite it in the stack from the benchmark charts." A year later the team runs two systems, the old rules are half re-created, and month-end is still slow. The cause was one missing database index.
      - type: visual
        kind: compare
        caption: 'What the fashionable rewrite does, and what fixing the measured problem does'
        columns:
          - title: 'Rewrite for fashion'
            tone: bad
            icon: cross
            tip: 'It feels bold, but it spends a huge amount of effort before it touches the real cause.'
            items:
              - 'Re-creates rules that took years to get right'
              - 'Two systems run side by side for a long time'
              - 'The team learns a new stack and ships nothing'
              - 'The real cause, one slow query, is never measured'
          - title: 'Fix the measured problem'
            tone: good
            icon: check
            tip: 'It is small, quick to try and easy to undo, and it keeps the stack that your rules and people already live in.'
            items:
              - 'Measure first: find the slow query or step'
              - 'Change the smallest part: add an index, queue the job'
              - 'Keep the stack the team and the rules live in'
              - 'Rewrite only when a measured limit has no other fix'
      - type: points
        title: 'Before you choose or change a stack'
        style: check
        items:
          - 'Write the needs down: workload, correctness, built-ins, integrations.'
          - 'Check what the stack ships built in and how mature it is.'
          - 'Count the team: skills today, hiring tomorrow, who is on call.'
          - 'Check how long a version is supported and how upgrades go.'
          - 'If the familiar option meets the needs, keep it. Spend budget only on a measured gap.'
      - type: quote
        body: 'A benchmark answers one question. The stack decision asks six.'
    aside:
      - type: story
        title: 'Why rewrites run long'
        body: |
          Teams that rewrite a working system often find it takes far longer than planned. The old code holds years of small rules that nobody wrote down, and they only show up when the new system gets something wrong.
      - type: when
        use:
          - 'The stack has lost security support and cannot be upgraded.'
          - 'A measured limit cannot be fixed inside the current stack.'
        avoid:
          - 'Boredom, fashion, or one benchmark chart.'
      - type: refs
        items:
          - {to: 'thinking/build-vs-buy', label: 'Complexity budget and boring technology'}
          - {to: 'thinking/reversible-decisions', label: 'Making decisions you can undo'}
    check:
      q: 'A month-end report is slow. What should you do before proposing a new stack?'
      a: 'Measure where the time goes and fix that part first. Change the stack only when a measured limit cannot be fixed inside the current one.'

flashcards:
  - q: 'What should drive the choice of a language and framework?'
    a: 'What the application needs: workload, correctness, built-in features, integrations, team skills and support length. Not fashion or habit.'
    more: |
      A stack is a tool for a job. Write the job's needs down first, then see which stacks fit. Choosing by fashion or by what the team happens to know pushes the cost to later, when the mismatch shows up as slow delivery or bugs in the parts that matter most.
    ref: start-from-the-job
  - q: 'What six questions should you answer before choosing a stack?'
    a: 'Workload shape, correctness needs, built-in features, integration, team and hiring, and support and stability.'
    more: |
      Think of the vehicle: what you carry, how fragile it is, which fittings come with it, which roads it must join, who can drive and repair it, and how long spare parts are made. The answers form a shopping list of properties, not one winning brand.
    ref: start-from-the-job
  - q: 'What is workload shape?'
    a: 'What the system mostly does: move big files, wait on other services, apply many rules, or record many small changes safely.'
    more: |
      A video site is mostly bytes moving and background conversion. An insurance system is mostly many small, careful writes under strict rules. The shape tells you which parts of a stack will matter most for the job.
    ref: start-from-the-job
  - q: 'Why does the web backend language matter less for video streaming?'
    a: 'The heavy work, converting and delivering video, runs in storage, background workers like ffmpeg and a CDN, not in the web framework.'
    more: |
      The web app mostly accepts uploads and logins, then hands files to object storage and a converter. Viewers stream from a CDN. So many web languages work, and the effort goes into the pipeline, queues and delivery cost instead.
    ref: two-jobs-worked-example
  - q: 'What needs does an insurance or accounting system put on a stack?'
    a: 'Exact decimals, strict transactions, an audit trail, access rules, batch jobs and long support, because wrong values become legal problems.'
    more: |
      Money and records must add up to the cent and every change must be traceable. A stack that ships transactions, security, batch and scheduling ready-made lets the team spend its time on the insurance rules instead of the plumbing.
    ref: two-jobs-worked-example
  - q: 'Why are Spring Boot and .NET common in enterprise accounting and insurance?'
    a: 'They ship tested transactions, security and batch tools built in, are strongly typed, and have long-term-support releases.'
    more: |
      Spring has declarative `@Transactional`, Spring Security and Spring Batch. .NET has Entity Framework Core, built-in dependency injection and ASP.NET Core Identity. Long support cycles suit systems that live for ten years. This does not make them the only good choice.
    ref: what-the-framework-gives
  - q: 'Can Django or Symfony run accounting software?'
    a: 'Yes. No stack is wrong. Check that the pieces you need exist and are mature, and add and test what is missing.'
    more: |
      Symfony, the stack of this course, ships Doctrine transactions, Security voters, Messenger, Workflow, Lock and Scheduler. Django can use exact decimal fields and database transactions. The honest question is not which language, but who writes and tests each missing piece.
    ref: what-the-framework-gives
  - q: 'What is the price of a framework with many built-in features?'
    a: 'More to learn, more ceremony for small jobs, and a pull toward its ecosystem. It also spends complexity budget.'
    more: |
      The other side is real too. Without built-ins you write transaction handling, permission checks and restartable batches yourself, and bugs there touch money. Choose the price you can pay: for money-heavy work, learning the framework usually costs less than hand-building.
    ref: what-the-framework-gives
  - q: 'Why is rewriting a working system into a trendy stack risky?'
    a: 'It re-creates years of hidden rules, runs two systems for a long time, and often leaves the real, unmeasured problem unfixed.'
    more: |
      Measure first. A slow report may need one index, not a new language. Rewrite only when a measured limit cannot be fixed inside the current stack, for example when it has lost security support. Otherwise you spend the [[thinking/build-vs-buy|complexity budget]] on a guess.
    ref: fashion-and-benchmarks

quiz:
  - q: 'Nicole''s video site freezes whenever someone uploads a video, because the conversion runs inside the web request. What is the best fix?'
    hint: 'Where does the heavy work belong in a video pipeline?'
    options:
      - text: 'Rewrite the web app in a language that benchmarks faster'
        correct: false
        why: 'The web language was not the bottleneck. The conversion would still block the request, just in a different language.'
      - text: 'Save the upload to object storage, and convert it in a background worker'
        correct: true
        why: 'The request returns at once, and a worker handles the slow conversion. The web app stays responsive whatever language it uses.'
      - text: 'Buy a bigger server so conversion finishes sooner'
        correct: false
        why: 'It only postpones the problem. Ten uploads at the same time still tie up ten web requests.'
      - text: 'Ask creators to upload smaller videos'
        correct: false
        why: 'This hides the design flaw behind a user rule, and it hurts the product.'
    ref: two-teams-two-habits
  - q: 'Which of these are questions about the job to settle before shortlisting a framework?'
    hint: 'Pick the questions about the job, the team and support, not about popularity.'
    options:
      - text: 'How strict are the correctness needs, such as money and audit?'
        correct: true
        why: 'It decides how much you value ready-made, proven protection.'
      - text: 'Which stack got the most stars on GitHub this month?'
        correct: false
        why: 'Popularity says nothing about your workload or your team, and it changes every month.'
      - text: 'What can the team run and operate, and who can we hire?'
        correct: true
        why: 'A stack nobody can maintain is a risk, however good it is.'
      - text: 'What does the framework already provide built in?'
        correct: true
        why: 'Every built-in is code you do not write, test or patch.'
      - text: 'Which stack did the last conference speaker use?'
        correct: false
        why: 'That is fashion. The speaker''s job is not your job.'
    ref: start-from-the-job
  - q: 'A claims system must apply discounts to the exact cent and keep every change traceable. What should weigh most in choosing the stack?'
    hint: 'Think about the fragile cargo question.'
    options:
      - text: 'Raw requests per second in a benchmark'
        correct: false
        why: 'Speed matters little if the totals are wrong. Correctness comes first in this job.'
      - text: 'Exact decimal handling, strict transactions and an audit trail, preferably ready-made and proven'
        correct: true
        why: 'These are the needs that cost real money when they fail, and a mature stack gives them to you tested.'
      - text: 'How good the stack is at serving video'
        correct: false
        why: 'It is a different job with a different workload shape.'
      - text: 'How new and exciting the syntax is'
        correct: false
        why: 'Novelty adds learning cost and unknown failure modes, which this job can''t afford.'
    ref: two-jobs-worked-example
  - q: 'Which parts of a video site are usually handled outside the web framework?'
    hint: 'Follow the file from upload to the viewer''s phone.'
    options:
      - text: 'Converting videos into several sizes in a background worker'
        correct: true
        why: 'It is slow work, so it runs in a worker with a converter such as ffmpeg, not inside a request.'
      - text: 'Delivering popular videos from a CDN'
        correct: true
        why: 'A CDN keeps copies close to viewers, so the app server is not carrying the video traffic.'
      - text: 'Storing the original and converted files in object storage'
        correct: true
        why: 'Big files go to a store built for them, not to the application database.'
      - text: 'Deciding whether a logged-in user may edit a channel'
        correct: false
        why: 'This permission check is business logic. It lives in the web backend.'
    ref: two-jobs-worked-example
  - q: 'A team of five knows Django well and must build accounting software for a small firm. What is a sensible decision?'
    hint: 'No stack is wrong. What must you check?'
    options:
      - text: 'Switch to Java, because accounting needs Java'
        correct: false
        why: 'No stack is required. Switching spends complexity budget and loses the skills the team already has.'
      - text: 'Use Django, but store money as floats since the team knows them'
        correct: false
        why: 'Floats cannot hold some decimal values exactly. Money needs exact decimal types whatever the stack.'
      - text: 'Use Django with exact decimal fields and database transactions, and add a tested audit-log library'
        correct: true
        why: 'It uses the team''s skill and adds what the job needs. The checks are the right ones: decimals, transactions, audit.'
      - text: 'Delay the project until every framework has been benchmarked'
        correct: false
        why: 'A benchmark doesn''t answer the correctness and audit questions, and the delay costs more than it saves.'
    ref: what-the-framework-gives
  - q: 'Which is a real price of choosing a framework that ships many built-in features?'
    hint: 'There are two sides to the trade-off. Which side is this?'
    options:
      - text: 'More to learn and more ceremony, even for small jobs'
        correct: true
        why: 'A bigger framework has more concepts, and a small job pays for them too.'
      - text: 'You must write your own transaction handling'
        correct: false
        why: 'The reverse: built-ins mean you do not write it.'
      - text: 'It can no longer integrate with other systems'
        correct: false
        why: 'Frameworks do not stop integration. They often make it easier.'
      - text: 'Its releases are never supported for long'
        correct: false
        why: 'Mature frameworks often offer long-term-support releases, which is part of why enterprises pick them.'
    ref: what-the-framework-gives
  - q: 'Kevin''s month-end report is slow, and someone proposes rewriting the system in a benchmark-winning stack. What should happen first?'
    hint: 'What would you do before spending a year?'
    options:
      - text: 'Start the rewrite and migrate module by module'
        correct: false
        why: 'It spends a lot of effort on a guess, and the real cause may be a single query.'
      - text: 'Adopt the benchmark winner for new modules only'
        correct: false
        why: 'This mixes two stacks and spends complexity budget without evidence of a need.'
      - text: 'Measure where the time goes and fix that part, for example with an index'
        correct: true
        why: 'It is cheap, quick and reversible, and it keeps the stack where the rules and people already live.'
      - text: 'Add a second database so reports can run on both'
        correct: false
        why: 'A second database doubles the running cost, and you still have not found the cause.'
    ref: fashion-and-benchmarks
