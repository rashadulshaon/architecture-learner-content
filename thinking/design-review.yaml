slides:
  - slug: unstated-assumptions
    title: 'নকশায় যা লেখা নেই, সেটাই বিপদ'
    kind: story
    tldr: 'প্রতিটা ডিজাইন ডকুমেন্টে সুখী পথটা লেখা থাকে; ভাঙনগুলো লুকিয়ে থাকে না-বলা ধারণার ভেতরে — রিভিউয়ারের কাজ সেগুলো টেনে বের করা।'
    keywords: ['design review', 'assumptions', 'happy path', 'ডিজাইন রিভিউ', 'না-বলা ধারণা', 'সুখী পথ']
    blocks:
      - type: text
        body: |
          রহিম চেকআউটের ডিজাইন লিখেছে: "ব্যবহারকারী Pay চাপলে Payment API ডাকা হবে, সফল হলে অর্ডার paid হবে, আর ইমেইল যাবে।" পড়তে পরিষ্কার, সবাই মাথা নাড়ল। কিন্তু প্রতিটা বাক্যের পেছনে একটা না-বলা ধারণা বসে আছে, আর প্রতিটা ধারণা এক রাতে ভুল প্রমাণিত হতে পারে।
      - type: visual
        kind: table
        caption: 'ডিজাইনে যা লেখা আছে আর যা ধরে নেওয়া হয়েছে'
        headers: ['নকশায় লেখা', 'যা ধরে নেওয়া হয়েছে']
        rows:
          - cells: ['Payment API ডাকা হয়', 'সে সবসময় ২ সেকেন্ডে উত্তর দেয়']
            tip: 'আসলে API ধীর হতে পারে, উত্তর না-ও দিতে পারে। অপেক্ষার সীমা না থাকলে আমাদের সার্ভারও আটকে থাকবে।'
          - cells: ['সফল হলে অর্ডার paid হয়', 'সফলতার খবর আমাদের কাছে পৌঁছাবেই']
            tip: 'টাকা কেটে গেল, কিন্তু উত্তর আসার আগে connection ছিঁড়ল — তখন আমরা জানি না টাকা কাটল কি না।'
          - cells: ['ইমেইল যায়', 'ইমেইল সার্ভিস কখনো বন্ধ থাকে না']
            tip: 'ইমেইল ফেল করলে যদি পুরো অর্ডারই ফেল করে, তবে একটা অপ্রয়োজনীয় ধাপ মূল কাজ ভেঙে দিচ্ছে।'
          - cells: ['ব্যবহারকারী Pay চাপে', 'সে মাত্র একবারই চাপে']
            tip: 'ধীর নেটওয়ার্কে মানুষ দুই-তিনবার চাপে। প্রতিবার আলাদা request হয়ে টাকা কয়েকবার কাটতে পারে।'
    aside:
      - type: story
        title: 'শুক্রবার রাতের দুইবার টাকা কাটা'
        body: |
          ডিজাইন রিভিউতে কেউ জিজ্ঞেস করেনি, "Pay দুইবার চাপলে কী হবে?" শুক্রবার রাতে ধীর নেটওয়ার্কে ১৭ জন ক্রেতার টাকা দুইবার কাটল। কোডে কোনো লাইন ভুল ছিল না, ভুল ছিল একটা না-বলা ধারণায়: "ব্যবহারকারী একবারই চাপবে।"
      - type: remember
        body: 'ডিজাইনের সবচেয়ে বিপজ্জনক বাক্য হলো যেটা কেউ লেখেনি।'
    check:
      q: 'ডিজাইনে লেখা "Payment API ডাকা হয়" বাক্যটার পেছনে কোন না-বলা ধারণাটা বিপজ্জনক?'
      a: 'ধরে নেওয়া হচ্ছে API সবসময় দ্রুত উত্তর দেয়। ধীর বা নীরব হলে অপেক্ষার সীমা না থাকলে আমাদের সার্ভারও আটকে যায়।'

  - slug: four-questions
    title: 'চার প্রশ্নের তালিকা'
    kind: concept
    tldr: 'প্রতিটা ধাপের সামনে চারটা প্রশ্ন: ফেল করলে কী? দুইবার এলে কী? ধীর হলে কী? আবার চালালে কী? — ভালো রিভিউ এগুলো দিয়েই শুরু হয়।'
    keywords: ['review checklist', 'failure modes', 'idempotency', 'timeout', 'retry', 'রিভিউ চেকলিস্ট', 'ব্যর্থতার পথ']
    blocks:
      - type: metaphor
        icon: building
        title: 'বাড়ির নকশা অনুমোদনের ইঞ্জিনিয়ার'
        body: |
          নকশা দেখে ইঞ্জিনিয়ার বলেন না "সুন্দর"। তিনি জিজ্ঞেস করেন: পানির পাইপ ফাটলে কী হবে? লোডশেডিং হলে লিফট কোথায় থামবে? দুই তলা বাড়ানো হলে ভিত টানবে তো? তিনি বাড়িটা তৈরি করেননি, তাই তাঁর চোখ খারাপ দিনের ওপর। ডিজাইন রিভিউয়ারও ঠিক সেই ইঞ্জিনিয়ার।
      - type: visual
        kind: table
        caption: 'প্রতিটা ধাপে চারটা প্রশ্ন আর ভালো উত্তরের নমুনা'
        headers: ['প্রশ্ন', 'কী খুঁজবে', 'ভালো উত্তর']
        rows:
          - cells: ['ফেল করলে কী?', 'timeout, আংশিক সফলতা', 'timeout + fallback + অবস্থা লেখা']
            tip: 'টাকা কেটেছে কিন্তু অর্ডার paid হয়নি — এমন মাঝামাঝি অবস্থাগুলো কে ঠিক করবে, তা লেখা থাকতে হবে।'
          - cells: ['দুইবার এলে কী?', 'double click, message দুইবার', 'idempotency key বা unique constraint']
            tip: 'একই কাজ দুইবার এলে ফল একই থাকবে কি না। না থাকলে টাকা, ইমেইল বা stock দুইবার ঘটবে।'
          - cells: ['ধীর হলে কী?', 'নির্ভরশীল সিস্টেম ধীর', 'ছোট timeout, queue, সীমা']
            tip: 'অপেক্ষা সবচেয়ে খরচের জিনিস: ধীর একটা সিস্টেম বাকিদের thread আটকে রেখে সবাইকে ধীর করে দেয়।'
          - cells: ['আবার চালালে কী?', 'retry-র ঝড়, অজানা ফল', 'retry-তে নিরাপদ, backoff আছে']
            tip: 'retry মানে একই অনুরোধ আবার। কাজটা আবার চালানো নিরাপদ না হলে retry নিজেই নতুন দুর্ঘটনা।'
      - type: quote
        body: 'প্রতিটা তীরের সামনে জিজ্ঞেস করো: এই ধাপ ফেল করলে, দুইবার এলে, ধীর হলে, আর আবার চালালে কী ঘটে?'
    aside:
      - type: tips
        items:
          - 'চারটা প্রশ্ন নিজের ডিজাইনেও করো। নিজের লেখা ডিজাইনের ভুল নিজে ধরা কঠিন, তাই প্রশ্নগুলো লিখে হাতে রাখো।'
          - 'প্রশ্ন করো, রায় দিয়ো না: "এটা ভুল" না বলে "টাকা কেটে timeout হলে কী হবে?"'
      - type: refs
        items:
          - {to: 'payments/idempotency-keys', label: 'দুইবার এলে: idempotency key'}
          - {to: 'resilience/containing-failure', label: 'ফেল করলে: ক্ষতি আটকে রাখা'}
    check:
      q: '"আবার চালালে কী?" প্রশ্নটা কেন আলাদা করে করতে হয়, যখন "দুইবার এলে কী?" আগেই করা হয়েছে?'
      a: 'দুইবার আসা বাইরের কারণ (ব্যবহারকারী, message)। আবার চালানো আমাদের নিজেদের সিদ্ধান্ত (retry)। retry-র জন্য আলাদা করে ভাবতে হয় অজানা ফল আর retry-র ঝড় নিয়ে।'

  - slug: review-worked-example
    title: 'একটা ডিজাইন রিভিউ হাতে-কলমে'
    kind: howto
    tldr: 'চেকআউটের সুখী পথের কোডে চার প্রশ্ন করে চারটা ফাঁক বের করা, তারপর প্রতিটার জন্য কোড বদল আর প্রশ্নসহ review মন্তব্য লেখা।'
    keywords: ['worked example', 'timeout', 'Idempotency-Key', 'Messenger', 'রিভিউ মন্তব্য', 'checkout']
    blocks:
      - type: text
        body: |
          এটাই রহিমের ডিজাইনের কোড। চারটা প্রশ্ন নিয়ে এর ওপর চোখ বোলাও: কোথায় timeout নেই, কোথায় দুইবার চলতে পারে, কোথায় ইমেইলের ধীরতা পুরো কাজ আটকাচ্ছে।
      - type: code
        lang: php
        file: 'src/Controller/CheckoutController.php'
        variant: bad
        code: |
          public function pay(Order $order): JsonResponse
          {
              $this->http->request('POST', 'https://pay.example/charge', [
                  'json' => ['amount' => $order->total(), 'order' => (string) $order->id()],
              ])->toArray();                 // timeout নেই, key নেই

              $order->markPaid();
              $this->em->flush();
              $this->mailer->send($this->receiptFor($order));   // ইমেইল ধীর বা ফেল

              return $this->json(['ok' => true]);
          }
        marks:
          - {line: 3, tip: 'কোনো timeout বা Idempotency-Key নেই। ধীর উত্তরে সার্ভার আটকাবে, আর retry বা double click-এ টাকা দুইবার কাটতে পারে।'}
          - {line: 9, tip: 'ইমেইল সার্ভার ধীর বা বন্ধ হলে টাকা কাটার পরেও request ফেল করে। অথচ ইমেইলটা পরে পাঠালেও চলত।'}
      - type: code
        lang: php
        file: 'src/Controller/CheckoutController.php'
        variant: good
        code: |
          public function pay(Order $order): JsonResponse
          {
              $this->http->request('POST', 'https://pay.example/charge', [
                  'timeout' => 5,
                  'headers' => ['Idempotency-Key' => $order->paymentKey()],
                  'json' => ['amount' => $order->total(), 'order' => (string) $order->id()],
              ])->toArray();

              $order->markPaid();
              $this->em->flush();
              $this->bus->dispatch(new SendReceipt($order->id()));   // ইমেইল পরে, worker-এ

              return $this->json(['ok' => true]);
          }
        marks:
          - {line: 4, tip: 'পাঁচ সেকেন্ডের বেশি অপেক্ষা নয়। ধীর API পুরো সার্ভারকে আটকে রাখতে পারবে না।'}
          - {line: 5, tip: 'প্রতিটা order-এর একটা স্থির key। একই order দুইবার এলে Payment API দ্বিতীয়বার টাকা কাটে না।'}
          - {line: 11, tip: 'ইমেইল queue-তে গেল। ফেল করলে Messenger নিজে retry করবে, ক্রেতার অর্ডার তাতে আটকাবে না।'}
      - type: points
        title: 'ভালো review মন্তব্যের তিন অংশ'
        style: number
        items:
          - 'প্রশ্ন: "Pay দুইবার এলে Payment API-তে কী পৌঁছায়?"'
          - 'ঝুঁকি: "টাকা দুইবার কাটতে পারে, ক্রেতা অভিযোগ করবে।"'
          - 'প্রস্তাব: "Idempotency-Key পাঠানো যায় কি?"'
    aside:
      - type: pitfalls
        items:
          - 'এই কোডেও একটা ছোট ফাঁক আছে: flush সফল হলো কিন্তু dispatch-এর আগে প্রসেস মরে গেলে ইমেইল হারায়। পূর্ণ সমাধান outbox।'
          - '`timeout` ঠিক করা মানেই ফল জানা নয়: timeout হলে টাকা কেটেছে কি না তা অজানা থাকে, তাই status চেক বা webhook লাগে।'
      - type: refs
        items:
          - {to: 'workflows/outbox-inbox', label: 'DB আর message একসাথে নিরাপদে: outbox'}
          - {to: 'payments/unknown-outcomes', label: 'timeout হলে ফল অজানা'}
    check:
      q: 'ভালো কোডে ইমেইল পাঠানোকে request-এর বাইরে নেওয়া হলো কেন, আর কোন প্রশ্নের উত্তরে?'
      a: '"ধীর হলে বা ফেল করলে কী?" প্রশ্নে। ইমেইল ধীর বা ফেল হলেও অর্ডার আটকায় না, আর queue-তে retry হয়।'

  - slug: pre-mortem
    title: 'Pre-mortem: ব্যর্থতা আগেই ঘটিয়ে দেখো'
    kind: pitfall
    tldr: 'সবাই সুখী পথ দেখলে রিভিউ ব্যর্থ হয়; pre-mortem-এ ধরে নাও প্রজেক্ট ইতিমধ্যে ডুবেছে, তারপর কারণগুলো খোঁজো।'
    keywords: ['pre-mortem', 'risk', 'failure scenarios', 'প্রি-মর্টেম', 'ঝুঁকি খোঁজা', 'optimism bias']
    blocks:
      - type: text
        body: |
          ডিজাইন রিভিউ প্রায়ই ব্যর্থ হয়, কারণ সবাই লেখকের আনন্দে শরিক থাকে আর কেউ অপ্রিয় প্রশ্ন তুলতে চায় না। **Pre-mortem** এই চাপ ভেঙে দেয়। ময়নাতদন্ত হয় মৃত্যুর পরে, আর pre-mortem হয় আগে: "ধরো, ছয় মাস পরে প্রজেক্ট ডুবে গেছে। কেন ডুবল?" তখন ভয় তোলাটাই কাজ হয়ে যায়।
      - type: visual
        kind: steps
        caption: 'Pre-mortem-এর পাঁচ ধাপ, মোট প্রায় ৩০ মিনিট'
        steps:
          - {title: '১. ভবিষ্যতে যাও', body: '"আজ থেকে ৬ মাস পরে, প্রজেক্ট ব্যর্থ"', tip: 'ব্যর্থতাকে ঘটে-যাওয়া ঘটনা ধরলে মানুষ "যদি" বলার বদলে "কারণ" বলে, আর ভয় কমে।'}
          - {title: '২. একা লেখো', body: 'প্রত্যেকে ৫ মিনিটে কারণ লেখে', tip: 'আগে একা লিখলে সবচেয়ে জোরালো গলা পুরো আলোচনা দখল করতে পারে না।'}
          - {title: '৩. সব তোলো', body: 'সবার তালিকা এক জায়গায় জড়ো', tip: 'যে ভয় একজনের মাথায় ছিল, সেটা এখন সবার চোখের সামনে।'}
          - {title: '৪. ভোট দাও', body: 'কোনটা সবচেয়ে সম্ভাব্য ও ক্ষতিকর', tip: 'সব ঝুঁকি সমান নয়। সম্ভাবনা আর ক্ষতি দুটো মিলিয়ে সবচেয়ে ওপরের তিনটা বেছে নাও।'}
          - {title: '৫. কাজ ঠিক করো', body: 'প্রতিটার একজন মালিক, একটা প্রতিকার', tip: 'মালিক আর প্রতিকার ছাড়া তালিকা শুধু দুশ্চিন্তার তালিকা। কাজ ধরিয়ে দিলে তবেই ডিজাইন বদলায়।'}
      - type: code
        lang: text
        file: 'pre-mortem-result.md'
        code: |
          ধরে নিলাম: ৬ মাস পরে চেকআউট প্রজেক্ট ব্যর্থ।

          কারণ                         সম্ভাবনা  ক্ষতি   মালিক   প্রতিকার
          টাকা দুইবার কাটল               উচ্চ      উচ্চ    রহিম    Idempotency-Key
          Payment API ধীর, সার্ভার আটকাল  মাঝারি   উচ্চ    করিম    timeout ৫s, circuit breaker
          ইমেইলের জন্য অর্ডার ফেল         মাঝারি   নিম্ন   সালমা   queue-তে ইমেইল
    aside:
      - type: pitfalls
        items:
          - 'রিভিউয়ার ডিজাইন নয়, মানুষকে আক্রমণ করা: "তুমি এটা ভাবোনি কেন?" — বদলে "এটা ভাবা হয়েছে কি?"'
          - 'ছোট ব্যাপারে (নাম, ফরম্যাট) অনেক সময় দেওয়া, আর কঠিন-ফেরানো সিদ্ধান্ত (ডেটা মডেল, API) চোখ এড়িয়ে যাওয়া।'
          - 'মন্তব্য করে চুপ থাকা। প্রতিটা ঝুঁকির একজন মালিক আর প্রতিকার না থাকলে রিভিউ শেষ হয়নি।'
      - type: when
        use: ['বড় বা কঠিন-ফেরানো ডিজাইন চূড়ান্ত করার আগে', 'নতুন প্রযুক্তি বা নতুন integration বসানোর আগে']
        avoid: ['এক বিকেলে বদলানো যায় এমন ছোট সিদ্ধান্তে']
    check:
      q: 'Pre-mortem-এ "প্রজেক্ট ডুবেছে" ধরে নেওয়া হয় কেন, "ডুবতে পারে" বলার বদলে?'
      a: 'ব্যর্থতাকে ঘটে-যাওয়া ধরলে মানুষ ভয়-ঝুঁকির কারণ খুলে বলতে সাহস পায়। "ডুবতে পারে" বললে আশাবাদের চাপে সবাই চুপ থাকে।'

flashcards:
  - q: 'ডিজাইন রিভিউয়ারের আসল কাজ কী?'
    a: 'লেখকের না-বলা ধারণা আর ব্যর্থতার পথ টেনে বের করা, শুধু সুখী পথ সমর্থন করা নয়।'
    more: |
      ডিজাইন ডকুমেন্টে প্রায় সবসময় সুখী পথ লেখা থাকে। রিভিউয়ার ইঞ্জিনিয়ারের মতো জিজ্ঞেস করে "পাইপ ফাটলে কী?" — কারণ সে নিজে বানায়নি, তাই তার চোখ খারাপ দিনের ওপর।
    ref: unstated-assumptions
  - q: 'ডিজাইন রিভিউয়ের চারটা মূল প্রশ্ন কী?'
    a: 'ফেল করলে কী? দুইবার এলে কী? ধীর হলে কী? আবার চালালে (retry) কী?'
    more: |
      প্রতিটা তীর বা ধাপের সামনে এই চারটা প্রশ্ন করা যায়। এগুলোর পেছনে থাকে timeout, idempotency, queue আর নিরাপদ retry-র ধারণা। বিস্তারিত: [[four-questions|চার প্রশ্ন]]।
    ref: four-questions
  - q: '"দুইবার এলে কী?" প্রশ্নের ভালো উত্তর কী?'
    a: 'কাজটাকে idempotent করা: একই কাজ কয়েকবার এলেও ফল একই, যেমন Idempotency-Key বা unique constraint।'
    more: |
      double click, retry বা message দুইবার পৌঁছানো — সবই বাস্তব ঘটনা। idempotency key থাকলে Payment API দ্বিতীয় request-এ নতুন charge না করে প্রথমটার ফলই ফেরত দেয়।
    ref: four-questions
  - q: 'অন্য সিস্টেম ডাকলে ন্যূনতম কী নিরাপত্তা থাকা চাই?'
    a: 'একটা timeout, retry-তে নিরাপদ হওয়া (idempotency), আর ফেল করলে কী হবে তার পরিকল্পনা।'
    more: |
      timeout না থাকলে ধীর সিস্টেম তোমার thread আটকে রেখে তোমাকেও ধীর করে দেয়। Symfony HttpClient-এ `timeout` option দিয়ে অপেক্ষার সীমা বসানো যায়।
    ref: review-worked-example
  - q: 'কেন ইমেইলের মতো ধাপ request-এর বাইরে queue-তে নেওয়া ভালো?'
    a: 'ইমেইল ধীর বা ফেল করলেও মূল কাজ আটকায় না, আর queue নিজে retry করে।'
    more: |
      যে ধাপ মূল কাজের শর্ত নয়, তাকে আলাদা করা ডিজাইন রিভিউয়ের একটা সাধারণ ফল। Symfony Messenger-এ message dispatch করলে worker পরে কাজটা সারে, ব্যবহারকারী অপেক্ষা করে না।
    ref: review-worked-example
  - q: 'ভালো review মন্তব্যে কী কী থাকে?'
    a: 'প্রশ্ন, ঝুঁকি আর প্রস্তাব — তিনটাই, আর ব্যক্তি নয়, ডিজাইনের ওপর ফোকাস।'
    more: |
      "ভুল হয়েছে" বললে লেখক আত্মরক্ষায় নামে। "দুইবার চাপলে কী হবে?" প্রশ্নে সে নিজেই ফাঁকটা দেখে। সাথে ঝুঁকি আর প্রস্তাব দিলে আলোচনা সমাধানের দিকে যায়।
    ref: review-worked-example
  - q: 'Pre-mortem কী?'
    a: 'প্রজেক্ট শুরুর আগেই ধরে নেওয়া যে সেটা ব্যর্থ হয়েছে, তারপর সবাই মিলে ব্যর্থতার কারণ খোঁজা।'
    more: |
      ময়নাতদন্ত হয় মৃত্যুর পরে; pre-mortem হয় আগে। ব্যর্থতাকে ঘটে-যাওয়া ধরলে মানুষ খোলাখুলি ভয় বলে। শেষে প্রতিটা বড় ঝুঁকির একজন মালিক আর একটা প্রতিকার ঠিক করা হয়।
    ref: pre-mortem

quiz:
  - q: 'নকশায় লেখা: "ব্যবহারকারী Pay চাপলে Payment API ডাকা হবে।" রিভিউতে কোন প্রশ্নটা সবচেয়ে কাজের?'
    hint: 'নেটওয়ার্ক ধীর হলে মানুষ কী করে?'
    options:
      - text: 'Pay দুইবার চাপলে বা request retry হলে Payment API-তে কী পৌঁছাবে?'
        correct: true
        why: 'এটা "দুইবার এলে কী?" প্রশ্ন, আর এখান থেকেই Idempotency-Key-এর প্রয়োজন বেরোয়।'
      - text: 'বাটনের রং কী হবে?'
        correct: false
        why: 'এক বিকেলে বদলানো যায় এমন ব্যাপার; ডিজাইন রিভিউর মূল্যবান সময় এতে খরচ হয় না।'
      - text: 'কোন PHP ভার্সনে চালানো হবে?'
        correct: false
        why: 'দরকারি তথ্য, কিন্তু ব্যর্থতার পথ খুঁজে বের করার প্রশ্ন নয়।'
      - text: 'এই ডিজাইন কে লিখেছে, সে কি অভিজ্ঞ?'
        correct: false
        why: 'ডিজাইন মূল্যায়ন করো, লেখককে নয়। অভিজ্ঞদেরও ফাঁক থাকে।'
    ref: unstated-assumptions
  - q: 'নিচের কোডের কোন সমস্যাগুলো ডিজাইন রিভিউতে ধরা উচিত?'
    lang: php
    code: |
      $this->http->request('POST', 'https://sms.example/send', [
          'json' => ['to' => $order->phone(), 'text' => 'অর্ডার নিশ্চিত'],
      ])->toArray();

      $order->markConfirmed();
      $this->em->flush();
    hint: 'SMS ধীর হলে, ফেল করলে, আর request আবার চললে কী হয়?'
    options:
      - text: 'timeout নেই; SMS সার্ভার ধীর হলে request আটকে থাকবে'
        correct: true
        why: 'অপেক্ষার সীমা না থাকলে নির্ভরশীল সিস্টেমের ধীরতা সরাসরি আমাদের ধীরতা হয়ে যায়।'
      - text: 'SMS ফেল করলে অর্ডার confirm-ই হবে না, অথচ SMS মূল কাজের শর্ত নয়'
        correct: true
        why: '`toArray()` ব্যতিক্রম ছুড়লে markConfirmed পর্যন্ত যাওয়াই হয় না। SMS-কে queue-তে নেওয়া ভালো।'
      - text: 'request আবার চললে ক্রেতা দুইবার SMS পাবে, কোনো key নেই'
        correct: true
        why: 'retry বা double click-এ একই SMS দুইবার যেতে পারে; idempotency-র ব্যবস্থা নেই।'
      - text: 'flush() শেষে ডাকা হয়েছে, আগে ডাকা উচিত ছিল'
        correct: false
        why: 'ক্রম নিয়ে প্রশ্ন ওঠে, তবে flush-এর অবস্থান এই কোডের প্রধান ফাঁক নয়।'
    ref: review-worked-example
  - q: 'দলের সবাই ডিজাইনটা পছন্দ করেছে, কেউ কোনো আপত্তি তুলছে না, কিন্তু প্রজেক্ট ঝুঁকিপূর্ণ মনে হচ্ছে। কী করা উচিত?'
    hint: 'আপত্তি না ওঠা মানে নিরাপদ নয়।'
    options:
      - text: 'Pre-mortem চালানো: ধরে নিয়ে প্রজেক্ট ব্যর্থ, প্রত্যেকে একা কারণ লিখবে'
        correct: true
        why: 'ব্যর্থতাকে ঘটে-যাওয়া ধরলে নীরব সদস্যরাও ঝুঁকির কথা লিখতে সাহস পায়।'
      - text: 'আরও বড় রিভিউ মিটিং ডেকে সবাইকে ডিজাইনটা আবার পড়ানো'
        correct: false
        why: 'একই সুখী-পথ আলোচনাই আবার হবে; ঝুঁকির কথা তোলার নিরাপদ পথ তাতে তৈরি হয় না।'
      - text: 'কোনো আপত্তি নেই মানে ঠিক আছে, এগিয়ে যাওয়া'
        correct: false
        why: 'আপত্তি না ওঠার কারণ অনেক সময় চাপ বা আশাবাদ, ডিজাইনের নিখুঁত হওয়া নয়।'
      - text: 'সবচেয়ে সিনিয়র ব্যক্তির মতামত চূড়ান্ত ধরা'
        correct: false
        why: 'এটা সমস্যা পাল্টে ফেলে: ঝুঁকির তালিকা ছাড়া শুধু একজনের মত চূড়ান্ত হলো।'
    ref: pre-mortem
  - q: 'নিচের কোনগুলো ভালো ডিজাইন review মন্তব্য?'
    hint: 'প্রশ্ন, ঝুঁকি, প্রস্তাব — আর ব্যক্তি নয়।'
    options:
      - text: '"Payment timeout হলে টাকা কেটেছে কি না জানব কীভাবে? status check বা webhook যোগ করা যায়।"'
        correct: true
        why: 'নির্দিষ্ট প্রশ্ন, ঝুঁকি আর প্রস্তাব — তিনটাই আছে।'
      - text: '"এই ডিজাইন বাজে, নতুন করে লেখো।"'
        correct: false
        why: 'কোনো কারণ বা পথ নেই; লেখক আত্মরক্ষায় নামবে, শিখবে না।'
      - text: '"ইমেইল পাঠানো ফেল করলে অর্ডারও ফেল করে। এটা queue-তে নিলে কেমন হয়?"'
        correct: true
        why: 'ঝুঁকিটা পরিষ্কার, আর সমাধান প্রশ্নের আকারে প্রস্তাব করা হয়েছে।'
      - text: '"তোমার তো অভিজ্ঞতা কম, এসব ভাবোনি কেন?"'
        correct: false
        why: 'ডিজাইন নয়, মানুষকে আক্রমণ করা হয়েছে। এতে আলোচনা বন্ধ হয়।'
    ref: review-worked-example
  - q: 'একটা ডিজাইনে ধাপ: "অর্ডার save → ইনভেন্টরি সার্ভিসকে জানাও"। ইনভেন্টরি সার্ভিস ১০ সেকেন্ড ধীর হলে সবচেয়ে বড় ঝুঁকি কী?'
    hint: 'অপেক্ষার সীমা না থাকলে অপেক্ষারত thread কোথায় গিয়ে জমে?'
    options:
      - text: 'অপেক্ষারত request জমে গিয়ে আমাদের নিজের সার্ভারও ধীর বা অচল হয়ে যাবে'
        correct: true
