slides:
  - slug: perfect-but-late
    title: 'নিখুঁত অ্যাপ, ঈদ পেরিয়ে গেল'
    kind: story
    tldr: 'ব্যবসার লক্ষ্য না বুঝে ডিজাইন করলে সেরা কোডও ভুল সমস্যা সমাধান করে। ইঞ্জিনিয়ারের কাজ লক্ষ্যকে শর্তে বদলানো।'
    keywords: ['business domain', 'time to market', 'business goals', 'ব্যবসা বোঝা', 'ডোমেইন']
    blocks:
      - type: text
        body: |
          মার্কেটিং চেয়েছিল ঈদের দুই সপ্তাহ আগে "ঈদ অফার" চালু করতে। রাকিবের টিম বলল দুই মাস লাগবে, কারণ তারা সব কিছু "ঠিকঠাক" বানাতে চায়। অফার চালু হলো ঈদের এক সপ্তাহ পরে। কোড নিখুঁত ছিল, কিন্তু বিক্রির মৌসুম চলে গেছে।
      - type: metaphor
        icon: shop
        title: 'ঈদের আগে দর্জির দোকান'
        body: |
          ঈদের আগে দর্জি জানে, ডিজাইন যতই সুন্দর হোক, চাঁদ রাতের আগে জামা না পৌঁছালে ক্রেতার কাছে সেটা অর্থহীন। তাই সে আগে বুঝে নেয় কোনটা কাল পর্যন্ত লাগবে, কোনটায় দুই দিন সময় নেওয়া যায়।
      - type: visual
        kind: compare
        caption: 'একই দুই মাস, দুই রকম দৃষ্টিভঙ্গি'
        columns:
          - title: 'শুধু প্রযুক্তি দেখলে'
            tone: bad
            icon: cross
            tip: 'ইঞ্জিনিয়ারের ভালো কোডের আগ্রহ ঠিক, কিন্তু ব্যবসার সময়সীমা বাদ গেছে।'
            items:
              - '"সব ঠিকঠাক করে তবে ছাড়ব"'
              - 'সময়সীমা ব্যবসার, মনে নেই'
              - 'মৌসুম শেষ, ক্রেতা অন্য দোকানে'
          - title: 'ব্যবসার লক্ষ্য বুঝলে'
            tone: good
            icon: check
            tip: 'আগে বুঝেছে কোনটা না হলে অফারই অর্থহীন, বাকিটা পরে হবে।'
            items:
              - '"ঈদের আগে কোনটা অবশ্যই চাই?"'
              - 'মূল অংশ ২ সপ্তাহে, বাকি পরে'
              - 'মৌসুমে বিক্রি, পরে ঠিক করা'
      - type: quote
        body: 'ব্যবসার লক্ষ্য না জানলে সবচেয়ে ভালো কোডও ভুল সমস্যার সমাধান।'
    aside:
      - type: problem
        body: 'এই segment শেখায় ব্যবসার লক্ষ্যকে ডিজাইনের শর্তে বদলানো, ROI হিসাব, সময় বনাম মানের ভারসাম্য, আর আইনি নিয়মকে ডিজাইনের ইনপুট হিসেবে ধরা।'
      - type: remember
        body: 'প্রশ্ন করুন: "ব্যবসা কী চায়, আর না পেলে কী হারাবে?"'
    check:
      q: 'রাকিবের টিমের নিখুঁত অ্যাপ কেন ব্যবসার কাজে এল না?'
      a: 'ঈদের মৌসুমই ছিল অফারের আসল মূল্য। সময়সীমা ব্যবসার শর্ত, সেটা না বুঝে মান নিয়ে বসে থাকায় সুযোগ হাতছাড়া হলো।'

  - slug: goals-to-constraints
    title: 'ব্যবসার লক্ষ্য থেকে ডিজাইনের শর্ত'
    kind: concept
    tldr: 'প্রতিটা ব্যবসায়িক লক্ষ্যকে একটা মাপা যায় এমন গুণে (quality attribute) বদলান, তারপর ডিজাইন বাছুন।'
    keywords: ['quality attributes', 'constraints', 'business goals', 'requirements', 'শর্ত', 'লক্ষ্য']
    blocks:
      - type: text
        body: |
          "ক্রেতার টাকা কখনো হারাবে না" ব্যবসার কথা। ইঞ্জিনিয়ারের ভাষায় এটা correctness আর audit, অর্থাৎ পরে যাচাই করা যায় এমন হিসাবের খাতা। "ঈদে অনেক ক্রেতা" মানে scalability, একসাথে অনেকে এলেও সামলে নেওয়া। এই অনুবাদটাই আর্কিটেক্টের কাজ। অনুবাদ ছাড়া ডিজাইন আন্দাজের ওপর দাঁড়ায়।
      - type: visual
        kind: table
        caption: 'ব্যবসায়িক লক্ষ্য থেকে ডিজাইনের সিদ্ধান্ত'
        headers: ['ব্যবসার কথা', 'কারিগরি শর্ত', 'ডিজাইনে কী বদলায়']
        rows:
          - cells: ['ঈদে বিক্রি ১০ গুণ', 'peak লোড সামলানো', 'cache, queue, horizontal scaling']
            tip: 'কত গুণ, কত সময় ধরে, তা সংখ্যায় জেনে নিন। "অনেক" দিয়ে ডিজাইন হয় না।'
          - cells: ['ক্রেতার টাকা হারাবে না', 'নির্ভুলতা ও অডিট', 'transaction, ledger, idempotency']
            tip: 'টাকার বেলায় গতির চেয়ে নির্ভুলতা বড়। এখানে ছাড় দেওয়া যায় না।'
          - cells: ['৩ মাসে বাজারে', 'দ্রুত ডেলিভারি', 'সহজ monolith, বাইরের সেবা কেনা']
            tip: 'সময়সীমা ডিজাইনের সবচেয়ে শক্ত শর্ত; জটিল স্থাপত্য এখানে বোঝা।'
          - cells: ['নিয়ন্ত্রকের নিয়ম মানতে হবে', 'ডেটা ও অডিট নিয়ম', 'ডেটার অবস্থান, log, রক্ষণ-মেয়াদ']
            tip: 'আইন বদলানো যায় না। এটা ডিজাইনের আগে থেকে ধরে নেওয়া শর্ত।'
      - type: code
        lang: text
        file: 'goals-to-constraints.txt'
        variant: good
        code: |
          লক্ষ্য:      ঈদের সপ্তাহে ১০ গুণ অর্ডার সামলানো, কোনো অর্ডার না হারিয়ে
          মাপ:        peak ৫০০ অর্ডার/মিনিট; p95 চেকআউট < ১ সেকেন্ড; হারানো অর্ডার = ০
          অনুমান:     গত বছর peak ৫০ অর্ডার/মিনিট (বিশ্লেষণ থেকে); ৩ মাসে টিম বাড়বে না
          শর্ত:       ছোট টিম → নতুন সার্ভিস নয়, বর্তমান monolith-এ queue যোগ
          যা ছাড়ব:    অ্যাডমিনের রিপোর্ট ধীর থাকবে
          যা ছাড়ব না: টাকা ও অর্ডারের নির্ভুলতা
        marks:
          - {line: 2, tip: 'সংখ্যা দিলে "অনেক" মাপা যায়: মিনিটে ৫০০ অর্ডার মানে সেকেন্ডে প্রায় ৮টা, চায়ের দোকানের কাউন্টারে প্রতি সেকেন্ডে ৮ জন। p95 মানে ১০০ জনের ৯৫ জনের চেকআউট ১ সেকেন্ডের নিচে।'}
          - {line: 3, tip: 'অনুমান লিখে রাখুন, ভুল হলে ডিজাইন বদলাতে হবে এটা সবাই জানবে।'}
          - {line: 5, tip: 'যা ছাড়ব তা আগেই বলা; পরে কেউ অবাক হয় না।'}
      - type: quote
        body: 'ব্যবসার লক্ষ্যকে সংখ্যায় না বদলালে ডিজাইনের কোনো মাপকাঠি থাকে না।'
    aside:
      - type: tips
        items:
          - 'প্রোডাক্ট বা ব্যবসার মানুষকে জিজ্ঞেস করুন: "না হলে কী ক্ষতি হবে?" এই উত্তর থেকে গুরুত্ব বোঝা যায়।'
          - '"ঠিকঠাক" বা "দ্রুত" শুনলে সংখ্যা চান: কত সেকেন্ড, কত জন, কত টাকা।'
      - type: refs
        items:
          - {to: 'thinking/quality-attributes', label: 'Quality attributes ও trade-off'}
    check:
      q: '"ঈদে অনেক ক্রেতা আসবে" শুনে ডিজাইনের আগে কোন প্রশ্নটা করবেন?'
      a: 'কত? মিনিটে কত অর্ডার, কত সময় ধরে, গত বছরের সংখ্যা কত। সংখ্যা ছাড়া কোন ডিজাইন যথেষ্ট তা বলা যায় না।'

  - slug: roi-thinking
    title: 'ROI: কোন কাজ আগে?'
    kind: howto
    tldr: 'প্রতিটা কাজের খরচ আর বছরের লাভ মেপে payback কতদিনে তা দেখুন। যেটা কম সময়ে খরচ তুলে আনে, সেটা আগে।'
    keywords: ['ROI', 'payback', 'cost benefit', 'prioritization', 'খরচ লাভ', 'অগ্রাধিকার']
    blocks:
      - type: text
        body: |
          ব্যবসার কাছে প্রতিটা প্রকল্প একটা বিনিয়োগ। দোকানদার বিনিয়োগ করার আগে ভাবে, "এই ফ্রিজ কিনলে কত দিনে টাকা উঠবে?" ইঞ্জিনিয়ারও তাই ভাবতে পারে। ROI (Return on Investment) = (বছরের লাভ − খরচ) ÷ খরচ। payback = খরচ ÷ মাসিক লাভ। সংখ্যাগুলো এখানে উদাহরণ।
      - type: code
        lang: text
        file: 'roi-comparison.txt'
        variant: good
        code: |
          প্রকল্প                     খরচ      বছরের লাভ         ROI     payback
          A. checkout-এ cache যোগ     ৩ লাখ    ৬ লাখ             +১০০%   ৬ মাস
             (সার্ভার খরচ ২ লাখ + হারানো অর্ডার ৪ লাখ)
          B. নতুন অ্যাডমিন dashboard  ৫ লাখ    ২ লাখ             -৬০%    ৩০ মাস
             (সাপোর্টের ঘণ্টা বাঁচে)
          C. সার্ভিস ভাগ করা          ১২ লাখ   ৯ লাখ             -২৫%    ১৬ মাস
             (ভবিষ্যতে দল বড় হলে সুবিধা)

          হিসাব: A = (৬−৩)÷৩ = ১.০ → ১০০%; payback = ৩÷(৬÷১২) = ৬ মাস
          সতর্কতা: লাভের সংখ্যা অনুমান; ঝুঁকি কমানোর মতো লাভ এতে নেই।
        marks:
          - {line: 3, tip: 'লাভের উৎস লিখে রাখুন। কীভাবে ৬ লাখ এল, তা না বললে কেউ বিশ্বাস করবে না।'}
          - {line: 9, tip: 'ROI সূত্র হাতে-কলমে। যে-কেউ নিজে যাচাই করতে পারে।'}
          - {line: 10, tip: 'সব মূল্য টাকায় ধরা যায় না, যেমন নিরাপত্তার ঝুঁকি কমানো। ROI শুধু একটা চোখ।'}
      - type: visual
        kind: bars
        caption: 'খরচ উঠতে কত মাস লাগে (কম ভালো)'
        items:
          - {label: 'A. cache', value: 6, display: '৬ মাস', tone: good, tip: 'সবচেয়ে দ্রুত খরচ ওঠে, তাই এটা আগে।'}
          - {label: 'C. সার্ভিস ভাগ', value: 16, display: '১৬ মাস', tone: warn, tip: 'ভবিষ্যৎ-নির্ভর লাভ, তাই অনিশ্চিত।'}
          - {label: 'B. dashboard', value: 30, display: '৩০ মাস', tone: bad, tip: 'এক বছরেও খরচ ওঠে না; এটা পিছিয়ে দেওয়া যায়।'}
      - type: quote
        body: 'ROI সিদ্ধান্ত নেয় না, শুধু দেখায় কোন কাজ কত দ্রুত নিজের খরচ তোলে।'
    aside:
      - type: pitfalls
        items:
          - 'ROI-র সংখ্যা সত্য ধরে নেওয়া; এগুলো অনুমান, পরিসর হিসেবে বলুন।'
          - 'নিরাপত্তা, compliance আর ঝুঁকি কমানোর কাজ ROI-তে ছোট দেখায়, কিন্তু না করলে বড় ক্ষতি। আলাদা ধরে নিন।'
      - type: refs
        items:
          - {to: 'infra/finops', label: 'ক্লাউড খরচের হিসাব'}
    check:
      q: 'কোন প্রকল্প আগে করবেন: ৬ মাসে খরচ-ওঠা A, না ৩০ মাসের B?'
      a: 'A। এটা দ্রুত নিজের খরচ তোলে। B-র লাভ কম হলেও যদি ঝুঁকি বা আইনের দিক থাকে, সেটা আলাদা বিবেচনা।'

  - slug: time-vs-quality
    title: 'দ্রুত নাকি ভালো: কোথায় ছাড়, কোথায় নয়'
    kind: compare
    tldr: 'সব জায়গায় সমান মান লাগে না। যেখানে ভুলের দাম কম সেখানে ছাড় দিন; টাকা, নিরাপত্তা আর ডেটায় নয়।'
    keywords: ['time to market', 'quality', 'speed vs quality', 'tech debt', 'দ্রুত', 'মান']
    blocks:
      - type: text
        body: |
          দর্জি ঈদের আগের রাতে জামার ভেতরের সেলাই একটু মোটা করে, কিন্তু কাপড়ের মাপ কখনো ভুল করে না। ছাড় সেখানে, যেখানে ক্রেতা টের পায় না বা ঠিক করা সহজ। সফটওয়্যারেও একই: সময় কম থাকলে কোথায় ছাড় দেওয়া যায়, আগে ঠিক করুন।
      - type: visual
        kind: compare
        caption: 'ছাড় দেওয়ার জায়গা বনাম ছাড় নয়'
        columns:
          - title: 'সময় কম হলে ছাড় দেওয়া যায়'
            tone: good
            icon: check
            tip: 'এখানে ভুল হলে ক্ষতি ছোট, আর পরে ঠিক করাও সহজ।'
            items:
              - 'অ্যাডমিন পাতার সাজসজ্জা'
              - 'কম ব্যবহৃত রিপোর্টের গতি'
              - 'ভেতরের কোডের সৌন্দর্য (ঋণ লিখে রাখুন)'
              - 'দুর্লভ edge case-এ সুন্দর বার্তা'
          - title: 'ছাড় দেওয়া যায় না'
            tone: bad
            icon: shield
            tip: 'এখানে ভুল মানে টাকা বা বিশ্বাস হারানো, আর পরে ঠিক করা কঠিন।'
            items:
              - 'টাকা ও অর্ডারের নির্ভুলতা'
              - 'অনুমতি যাচাই ও নিরাপত্তা'
              - 'ডেটা হারানো বা backup'
              - 'ব্যবহারকারীর ব্যক্তিগত তথ্য'
      - type: points
        title: 'ছাড় দিলে যা করতেই হবে'
        style: check
        items:
          - 'কী ছাড় দিলে, ঋণ হিসেবে লিখে রাখুন।'
          - 'কবে শোধ করবেন, তারিখ বা sprint ঠিক করুন।'
          - 'ব্যবসাকে জানান, কী ঝুঁকি নিচ্ছেন।'
      - type: quote
        body: 'গতির জন্য ছাড় দেওয়া চলে, কিন্তু ঋণ লুকালে সুদ বাড়ে।'
    aside:
      - type: story
        title: 'সেলাইয়ের ছাড়'
        body: |
          এক স্টার্টআপ লঞ্চের তাড়ায় অ্যাডমিন পাতা অসম্পূর্ণ রাখল, কিন্তু পেমেন্টের টেস্ট পুরোপুরি লিখল। দুই মাস পর অ্যাডমিন পাতা ঠিক হলো; পেমেন্টে কোনো ঘটনা ঘটেনি। ছাড়টা ঠিক জায়গায় ছিল।
      - type: pitfalls
        items:
          - 'ধরুন, এক সপ্তাহ আগে লঞ্চ করতে দুবার-কাটা ঠেকানোর টেস্ট বাদ গেল। ৩০০ গ্রাহকের টাকা দুবার কাটল; রিফান্ড আর হারানো বিশ্বাসের খরচ ওই সপ্তাহের চেয়ে বেশি।'
          - 'সবকিছুকে "ছাঁটা যায়" ভাবা। অ্যাডমিন পাতায় রিফান্ডের বোতাম থাকলে সেটা সাজসজ্জা নয়; ছাঁটার আগে দেখুন পাতাটা কী করতে পারে।'
      - type: refs
        items:
          - {to: 'thinking/tech-debt', label: 'tech debt: ধার নেওয়া ও শোধ'}
    check:
      q: 'সময় কম, তাই কোন কাজটায় ছাড় দেবেন: অ্যাডমিন পাতার সাজ, না পেমেন্টের টেস্ট?'
      a: 'অ্যাডমিন পাতার সাজ। পেমেন্টের ভুলে টাকা ও বিশ্বাস দুটোই যায়, আর পরে ঠিক করা কঠিন।'

  - slug: regulation-as-input
    title: 'আইনি নিয়ম: ডিজাইনের শুরুর ইনপুট'
    kind: concept
    tldr: 'ডেটা কোথায় থাকবে, কতদিন, কে দেখবে — আইনি নিয়ম এগুলো ঠিক করে দেয়। ডিজাইনের শেষে নয়, শুরুতেই জেনে নিন।'
    keywords: ['regulation', 'compliance', 'data residency', 'audit', 'retention', 'আইন', 'নিয়ন্ত্রক']
    blocks:
      - type: text
        body: |
          ফার্মেসি খুলতে ঔষধ প্রশাসনের লাইসেন্স লাগে, আর ওষুধ কোথায় রাখা যাবে তারও নিয়ম আছে। দোকানের নকশা আগে আঁকলে পরে ভেঙে নতুন করে বানাতে হয়। সফটওয়্যারেও তা-ই। ধরুন, একটা ছোট লোন-অ্যাপ গ্রাহকের তথ্য রেখেছে বিদেশের ক্লাউড অঞ্চলে। এক বছর পর নিয়ন্ত্রক বললেন, আর্থিক তথ্য দেশের ভেতরে থাকতে হবে। এখন ডেটাবেস, backup আর log সব সরাতে হবে, অথচ চালু গ্রাহকেরা টাকা দিয়েই যাচ্ছেন; এতে মাস লেগে যেতে পারে। প্রথম সপ্তাহে একটা প্রশ্ন করলে খরচ হতো একটা বিকেল।
      - type: visual
        kind: steps
        caption: 'আইনি নিয়ম থেকে ডিজাইনের সিদ্ধান্ত: পাঁচ প্রশ্ন'
        steps:
          - {title: '১. কী ডেটা?', body: 'ব্যক্তিগত তথ্য, আর্থিক তথ্য, স্বাস্থ্য তথ্য আছে কি?', tip: 'ডেটার ধরন ঠিক করে কোন নিয়ম খাটবে। আগে ডেটার তালিকা বানান।'}
          - {title: '২. কোথায় থাকবে?', body: 'দেশের ভেতরে রাখতে হবে কি না, কোন ক্লাউড অঞ্চল চলে?', tip: 'কিছু নিয়ম ডেটা দেশের ভেতরে রাখতে বলে। ক্লাউড অঞ্চল বাছাই এতে প্রভাবিত হয়।'}
          - {title: '৩. কতদিন রাখব?', body: 'কতদিন রাখতে হবে, আর কখন মুছতে হবে?', tip: 'রাখার ন্যূনতম মেয়াদ আছে, আবার ব্যক্তিগত তথ্য অকারণে বেশিদিন রাখা যায় না।'}
          - {title: '৪. কে দেখতে পারে?', body: 'কার কোন ডেটায় অ্যাক্সেস, আর তার রেকর্ড কোথায়?', tip: 'অ্যাক্সেস সীমিত রাখা আর audit log রাখা প্রায় সব নিয়মের সাধারণ দাবি।'}
          - {title: '৫. প্রমাণ কী?', body: 'অডিটর এলে কী দেখাবে?', tip: 'নিয়ম মানা শুধু করলেই হয় না, দেখাতেও হয়। প্রমাণ ডিজাইনের অংশ।'}
      - type: quote
        body: 'আইনি নিয়ম বদলানো যায় না। তাই এটা ডিজাইনের শুরুর শর্ত, শেষের ঝামেলা নয়।'
    aside:
      - type: pitfalls
        items:
          - 'আইনি দিক "পরে দেখব" বলে ফেলে রাখা; পরে ডেটার অবস্থান বদলানো খুব ব্যয়বহুল।'
          - 'নিজে আইন ব্যাখ্যা করা। নির্দিষ্ট নিয়ম জানতে compliance বা আইন-বিশেষজ্ঞের সাথে কথা বলুন।'
      - type: refs
        items:
          - {to: 'security/data-protection', label: 'ডেটা সুরক্ষা'}
          - {to: 'security/supply-chain-compliance', label: 'compliance ও supply chain'}
    check:
      q: 'আইনি নিয়ম কেন ডিজাইনের শুরুতে জানা দরকার?'
      a: 'কারণ ডেটার অবস্থান, মেয়াদ আর অ্যাক্সেস আগে ঠিক না হলে পরে বদলাতে মাস লাগে। নিয়ম আগে থেকে ধরে নিলে ডিজাইন একবারেই ঠিক হয়।'

  - slug: regulation-worked-example
    title: 'হাতে-কলমে: ছোট লোন-অ্যাপের পাঁচ প্রশ্ন'
    kind: howto
    tldr: 'ডিজাইনের আগে পাঁচ প্রশ্নের উত্তর লিখে ফেলুন। প্রতিটা উত্তর বানানো বা যাচাই করা যায় এমন কিছু হয়: অঞ্চল, মোছার job, অ্যাক্সেস নিয়ম, audit টেবিল।'
    keywords: ['compliance', 'retention', 'audit log', 'data residency', 'আইনি নিয়ম', 'মেয়াদ']
    blocks:
      - type: text
        body: |
          আবার সেই লোন-অ্যাপে ফিরি। ডিজাইনের আগে এক পাতা ভরুন। নিচের সংখ্যা আর নিয়মগুলো উদাহরণ; আসল নিয়ম বলবেন compliance বা আইনের মানুষ। লক্ষ্য করুন, প্রতিটা উত্তর শেষ হয় এমন কিছুতে, যা বানানো বা যাচাই করা যায়।
      - type: code
        lang: text
        file: 'docs/compliance/loan-app.txt'
        variant: good
        code: |
          অ্যাপ: ছোট লোন-অ্যাপ (নাম, ফোন, জাতীয় পরিচয়পত্রের ছবি, লোনের ইতিহাস)

          ১. কী ডেটা?     ব্যক্তিগত (নাম, ফোন, ছবি) আর আর্থিক (লোনের ইতিহাস)।
          ২. কোথায়?      ডেটাবেস, backup, log: বাংলাদেশের ভেতরের ডেটা সেন্টারে।
                          (ধরে নেওয়া নিয়ম: আর্থিক তথ্য দেশের ভেতরে থাকবে)
          ৩. কতদিন?      লোনের রেকর্ড: লোন শেষের পর ৭ বছর (ধরে নেওয়া)।
                          প্রত্যাখ্যাত আবেদনকারীর পরিচয়ের ছবি: ৯০ দিন পর মুছে ফেলা।
          ৪. কে দেখবে?    সাপোর্ট: শুধু নাম ও ফোন। আদায় দল: লোনের ইতিহাস।
                          ছবি: নাম ধরে ঠিক করা ২ জন অ্যাডমিন। প্রতিটা দেখা log হয়।
          ৫. প্রমাণ?      audit_log টেবিল (শুধু যোগ করা যায়) + অডিটরের জন্য মাসিক export।

          এই পাতা না থাকলে: অঞ্চল বাছা হয় অভ্যাসে, ছবি জমে থাকে চিরকাল,
          আর অডিটর শোনেন "আমাদের ধারণা, হ্যাঁ।"
        marks:
          - {line: 4, tip: 'অঞ্চল এখন ডিজাইনের ইনপুট, প্রথম দিনেই ঠিক। backup আর log-ও ধরতে হবে: বিদেশে একটা কপি থাকলে ডেটাবেসের মতোই নিয়ম ভাঙে।'}
          - {line: 7, tip: 'সংখ্যাসহ নিয়ম একটা job হয়ে যেতে পারে। পরের ব্লকে এই লাইনটাই বানানো হয়েছে।'}
          - {line: 9, tip: 'অ্যাক্সেস ভূমিকা ধরে, ডিফল্টে সবার নয়। প্রতিটা দেখা log হলে তবেই ৫ নম্বর প্রশ্নের উত্তর দেওয়া যায়।'}
      - type: code
        lang: sql
        file: 'jobs/purge-rejected-id-photos.sql'
        variant: good
        code: |
          -- রাতের job (PostgreSQL), Symfony Scheduler চালায়। ৩ নম্বর প্রশ্নের নিয়ম।
          WITH purged AS (
            DELETE FROM id_documents d
            USING applications a
            WHERE d.application_id = a.id
              AND a.status = 'rejected'
              AND a.decided_at < now() - interval '90 days'
            RETURNING d.id
          )
          INSERT INTO audit_log (action, subject_id, at)
          SELECT 'id_document_purged', id, now() FROM purged;
        marks:
          - {line: 7, tip: '৩ নম্বর প্রশ্নের ৯০ দিন এক জায়গায় লেখা, যেখানে নিয়মটা কার্যকর হয়।'}
          - {line: 10, tip: 'মোছা আর log একই statement-এ, তাই রেকর্ড ছাড়া ছবি মোছা হয় না। এই সারিই ৫ নম্বর প্রশ্নের প্রমাণ।'}
    aside:
      - type: pitfalls
        items:
          - 'উদাহরণের সংখ্যা হুবহু নকল করা। ৭ বছর আর ৯০ দিন এখানে বানানো; আপনারটা compliance দেবে।'
          - 'চালু টেবিল থেকে মুছে backup, log আর export ভুলে যাওয়া। নিয়ম সব কপির ওপর খাটে।'
      - type: when
        use:
          - 'অ্যাপে ব্যক্তিগত, আর্থিক বা স্বাস্থ্য তথ্য থাকলে'
          - 'ক্লাউড অঞ্চল বা ডেটাবেস বাছার আগে'
        avoid:
          - 'নকল ডেটার ফেলে-দেওয়া প্রোটোটাইপে (আসল ডেটা আসার আগে পাতাটা আবার ভরুন)'
          - 'আইনে ঠিক কী লেখা আছে তা নিজে ঠিক করতে; সেটা compliance বা আইনজীবীর কাজ'
    check:
      q: 'লোন-অ্যাপে কোন উত্তর রাতের মোছার job বানাতে বলে, আর job-কে আর কী লিখতে হয়?'
      a: '৩ নম্বর: প্রত্যাখ্যাত আবেদনের ছবি ৯০ দিন পর মুছতে হবে। প্রতিটা মোছার জন্য job audit_log-এ একটা সারিও লেখে; সেটাই অডিটরের প্রমাণ।'

flashcards:
  - q: 'ব্যবসার লক্ষ্যকে ডিজাইনের শর্তে বদলানো মানে কী?'
    a: 'ব্যবসার কথা ("ঈদে অনেক ক্রেতা") সংখ্যাসহ মাপা যায় এমন গুণে ("৫০০ অর্ডার/মিনিট") রূপান্তর করা।'
    more: |
      "দ্রুত", "নিরাপদ", "অনেক" এসব শব্দ দিয়ে ডিজাইন করা যায় না। সংখ্যা চাইলে বোঝা যায় কতটা দরকার, আর কতটা বাড়তি। এই অনুবাদই আর্কিটেক্টের গুরুত্বপূর্ণ কাজ।
    ref: goals-to-constraints
  - q: '"ক্রেতার টাকা কখনো হারাবে না" থেকে কোন ডিজাইন সিদ্ধান্ত আসে?'
    a: 'নির্ভুলতা ও audit: transaction, ledger, idempotency। এখানে গতির চেয়ে নির্ভুলতা বড়।'
    more: |
      টাকার বেলায় ছাড় নেই। দুইবার কাটা বা হারিয়ে যাওয়া লেনদেনের ক্ষতি বিশ্বাসের ক্ষতি। তাই আগেই ঠিক করা হয় যে এই অংশে সবচেয়ে কঠোর নিয়ম চলবে। বিস্তারিত: [[ledgers/modeling-money|টাকার মডেল]]।
    ref: goals-to-constraints
  - q: 'ROI কীভাবে হিসাব হয়?'
    a: 'ROI = (বছরের লাভ − খরচ) ÷ খরচ। ৩ লাখ খরচে ৬ লাখ লাভ মানে ১০০%।'
    more: |
      ROI কত শতাংশ ফেরত আসছে তা দেখায়। এর সাথে payback দেখুন: খরচ উঠতে কত মাস লাগে। ৩ লাখ খরচ, বছরে ৬ লাখ লাভ হলে মাসে ৫০ হাজার, তাই payback ৬ মাস।
    ref: roi-thinking
  - q: 'ROI-র সীমাবদ্ধতা কী?'
    a: 'লাভের সংখ্যা অনুমান, আর নিরাপত্তা বা ঝুঁকি কমানোর মতো লাভ টাকায় মাপা কঠিন।'
    more: |
      compliance বা backup-এর কাজ ROI-তে ছোট দেখায়, কিন্তু না করলে ক্ষতি বিশাল। তাই ROI আর ঝুঁকির তালিকা দুটোই একসাথে দেখুন। সংখ্যা বলার সময় পরিসর দিন, যেমন "৪ থেকে ৬ লাখ"।
    ref: roi-thinking
  - q: 'সময় কম থাকলে কোথায় ছাড় দেওয়া যায়?'
    a: 'যেখানে ভুলের দাম কম আর পরে ঠিক করা সহজ: অ্যাডমিন পাতা, কম ব্যবহৃত রিপোর্ট। টাকা, নিরাপত্তা ও ডেটায় নয়।'
    more: |
      সব ছাড় সমান নয়। ক্রেতা যা সরাসরি টের পায় না আর ঠিক করা সহজ, সেখানে ছাড় দেওয়া চলে। ছাড় দিলে ঋণ হিসেবে লিখে রাখুন, শোধের তারিখ ঠিক করুন, আর ব্যবসাকে ঝুঁকির কথা জানান।
    ref: time-vs-quality
  - q: 'ছাড় দিয়ে ঋণ জমালে কী কী করা উচিত?'
    a: 'লিখে রাখা, শোধের তারিখ ঠিক করা, আর ব্যবসাকে জানানো।'
    more: |
      লুকানো ঋণের সুদ বাড়ে: কেউ জানে না বলে কেউ শোধ করে না, আর একদিন হঠাৎ বড় সমস্যা হয়ে সামনে আসে। লেখা ঋণ একটা বেছে নেওয়া সিদ্ধান্ত, অনুশোচনার বিষয় নয়। বিস্তারিত: [[thinking/tech-debt|tech debt]]।
    ref: time-vs-quality
  - q: 'আইনি নিয়ম কেন ডিজাইনের শুরুতে জানা দরকার?'
    a: 'ডেটার অবস্থান, মেয়াদ ও অ্যাক্সেস পরে বদলানো ব্যয়বহুল। নিয়ম আগে ধরলে ডিজাইন একবারেই ঠিক হয়।'
    more: |
      ক্লাউড অঞ্চল, ডেটাবেস, log-এর গঠন — এসব প্রথম দিকেই ঠিক হয়। পরে নিয়ম অনুযায়ী বদলাতে মাসের পর মাস লাগে। নির্দিষ্ট আইন নিজে ব্যাখ্যা না করে compliance বা আইনের বিশেষজ্ঞের সাথে কথা বলুন।
    ref: regulation-as-input
  - q: 'আইনি নিয়ম থেকে ডিজাইনে কোন পাঁচ প্রশ্ন আসে?'
    a: 'কী ডেটা? কোথায় থাকবে? কতদিন? কে দেখতে পারে? অডিটরকে প্রমাণ কী দেখাবে?'
    more: |
      এই পাঁচ প্রশ্ন ডেটার তালিকা থেকে শুরু। উত্তর থেকে ঠিক হয় ডেটাবেসের অবস্থান, মুছে ফেলার ব্যবস্থা, অ্যাক্সেস নিয়ন্ত্রণ আর audit log। প্রতিটা প্রশ্নের উত্তর লিখে রাখুন।
    ref: regulation-as-input
  - q: 'আইনি নিয়ম লঞ্চের পরে জানলে কী ক্ষতি হয়?'
    a: 'চালু গ্রাহক থাকা অবস্থাতেই ডেটা, backup আর log সরাতে হয়; এতে মাস লেগে যেতে পারে।'
    more: |
      ধরুন, লোন-অ্যাপের ডেটা বিদেশের ক্লাউড অঞ্চলে, আর পরে নিয়ম এল যে আর্থিক তথ্য দেশের ভেতরে থাকতে হবে। তখন ডেটাবেস, backup, log আর analytics export সবই সরাতে হয়। প্রথম সপ্তাহের একটা প্রশ্নে এই খরচ বাঁচত।
    ref: regulation-as-input
  - q: '"প্রত্যাখ্যাত আবেদনের ছবি ৯০ দিন পর মুছতে হবে" নিয়মটা সিস্টেমে কীভাবে আসে?'
    a: 'একটা নির্ধারিত job হিসেবে: সে ছবি মোছে আর প্রতিটা মোছার জন্য audit_log-এ একটা সারি লেখে, যাতে প্রমাণ থাকে।'
    more: |
      ৯০ দিনের সংখ্যাটা job-এর query-তে এক জায়গায় লেখা থাকে। মোছা আর log লেখা একই statement-এ হয়, তাই রেকর্ড ছাড়া ছবি মুছে যায় না। এই উদাহরণের ৯০ দিন আর ৭ বছর বানানো; আসল সংখ্যা compliance দেবে।
    ref: regulation-worked-example

quiz:
  - q: 'মার্কেটিং বলল "ঈদের দুই সপ্তাহ আগে অফার চাই।" রাকিবের টিম পুরো সিস্টেম নিখুঁত করতে দুই মাস চায়। সবচেয়ে ভালো প্রথম পদক্ষেপ?'
    hint: 'ব্যবসার কাছে অফারের আসল মূল্য কী?'
    options:
      - text: 'দুই মাসই লাগবে বলে জানিয়ে দেওয়া'
        correct: false
        why: 'ব্যবসার সময়সীমা উপেক্ষা করা হলো; মৌসুম হারালে অফারেরই মূল্য থাকে না।'
      - text: 'মার্কেটিংকে জিজ্ঞেস করা কোন অংশ ঈদের আগে অবশ্যই লাগবে, তারপর মূল অংশ দুই সপ্তাহে দেওয়া'
        correct: true
        why: 'লক্ষ্য বুঝে ন্যূনতম কার্যকর অংশ আগে ছাড়া হয়, বাকি পরে নিখুঁত করা যায়।'
      - text: 'বিনা প্রশ্নে সব কিছু দুই সপ্তাহে করার চেষ্টা'
        correct: false
        why: 'টাকা বা নিরাপত্তার মতো জায়গায়ও ছাড় দিলে ক্ষতি বড় হয়।'
      - text: 'অফারটাই বাতিল করতে বলা'
        correct: false
        why: 'ব্যবসার সুযোগ নষ্ট; বিকল্প খোঁজা ইঞ্জিনিয়ারের দায়িত্ব।'
    ref: perfect-but-late
  - q: 'ব্যবসা বলল, "সাইট দ্রুত হতে হবে।" ডিজাইনের আগে কী করবেন?'
    hint: '"দ্রুত" কতটা?'
    options:
      - text: 'সব query-তে index দিয়ে দেওয়া'
        correct: false
        why: 'কোনটা ধীর, কত ধীর, জানা ছাড়া index দিলে অনর্থক কাজ আর লেখার গতি কমে।'
      - text: 'সংখ্যা চাওয়া: কোন পাতা, কত সেকেন্ডের নিচে, কত ব্যবহারকারীর জন্য'
        correct: true
        why: 'সংখ্যা ছাড়া "দ্রুত" মাপা যায় না; লক্ষ্য ঠিক হলে ঠিক করা যায় কোন ডিজাইন যথেষ্ট।'
      - text: 'পুরো অ্যাপ নতুন framework-এ নেওয়া'
        correct: false
        why: 'সমস্যা না জেনে বিশাল সিদ্ধান্ত, ঝুঁকি আর খরচ বেশি।'
      - text: 'আরও শক্তিশালী সার্ভার কিনে ফেলা'
        correct: false
        why: 'কারণ জানা ছাড়া খরচ বাড়ানো; সমস্যা কোড বা query-তে হলে সার্ভারে সমাধান হয় না।'
    ref: goals-to-constraints
  - q: 'দুটো প্রকল্প: X খরচ ৪ লাখ, বছরে লাভ ৮ লাখ; Y খরচ ৬ লাখ, বছরে লাভ ৩ লাখ। X-এর payback কত?'
    hint: 'মাসিক লাভ = ৮ লাখ ÷ ১২।'
    options:
      - text: '৬ মাস'
        correct: true
        why: 'মাসিক লাভ প্রায় ৬৭ হাজার; ৪ লাখ ÷ ৬৭ হাজার ≈ ৬ মাস। (X বছরে লাভ ৮ লাখ, খরচের দ্বিগুণ।)'
      - text: '১২ মাস'
        correct: false
        why: 'এক বছরে লাভ খরচের দ্বিগুণ হলে খরচ অর্ধেক বছরেই ওঠে।'
      - text: '২৪ মাস'
        correct: false
        why: 'এটা Y-র কাছাকাছি; X-এর লাভ অনেক বেশি।'
      - text: 'বলা যায় না'
        correct: false
        why: 'খরচ ও মাসিক লাভ জানা থাকলে payback সহজেই হিসাব করা যায়।'
    ref: roi-thinking
  - q: 'নিচের কোনগুলো সময় কম থাকলে ছাড় দেওয়ার যোগ্য?'
    hint: 'ভুলের দাম কম, ঠিক করা সহজ।'
    options:
      - text: 'অ্যাডমিন পাতার সাজসজ্জা'
        correct: true
        why: 'ক্রেতা দেখে না, পরে ঠিক করা সহজ।'
      - text: 'কম ব্যবহৃত রিপোর্টের গতি'
        correct: true
        why: 'কয়েকজনের কাজে ধীর, ক্ষতি ছোট; পরে ঠিক করা যায়।'
      - text: 'পেমেন্টের টেস্ট'
        correct: false
        why: 'টাকার ভুল ঠিক করা কঠিন, আর বিশ্বাসও যায়।'
      - text: 'ব্যবহারকারীর পাসওয়ার্ড সংরক্ষণের নিয়ম'
        correct: false
        why: 'নিরাপত্তায় ছাড় নেই; একবার ফাঁস হলে ফেরানো যায় না।'
    ref: time-vs-quality
  - q: 'নতুন প্রকল্পে ব্যবহারকারীর ব্যক্তিগত তথ্য রাখা হবে। কখন আইনি নিয়ম দেখা উচিত?'
    hint: 'ডেটার অবস্থান বদলানো কতটা কঠিন?'
    options:
      - text: 'লঞ্চের আগের সপ্তাহে'
        correct: false
        why: 'ততক্ষণে ডেটাবেস ও অঞ্চল ঠিক হয়ে গেছে; বদলাতে মাস লাগবে।'
      - text: 'ডিজাইনের শুরুতে, ডেটার তালিকা ও পাঁচ প্রশ্ন দিয়ে'
        correct: true
        why: 'অবস্থান, মেয়াদ, অ্যাক্সেস শুরুতেই ঠিক হলে ডিজাইন একবারেই হয়।'
      - text: 'অডিটর এলে তখন'
        correct: false
        why: 'ততদিনে সমস্যা গভীর; প্রমাণ বানানো কঠিন।'
      - text: 'আইনের কথা ইঞ্জিনিয়ারের নয়, কখনোই না'
        correct: false
        why: 'ইঞ্জিনিয়ার ডিজাইনের মালিক; আইনি বিশেষজ্ঞের সাথে মিলে শর্ত ধরতে হয়।'
    ref: regulation-as-input
  - q: 'নিয়ম: প্রত্যাখ্যাত আবেদনকারীর পরিচয়ের ছবি ৯০ দিন পর মুছতে হবে। কী বানাবেন?'
    hint: 'যে নিয়ম মানার প্রমাণ দেখানো যায় না, তা অর্ধেক মানা।'
    options:
      - text: 'টিমের wiki-তে লিখে রাখা, অ্যাডমিনরা মনে পড়লে পুরনো ছবি মুছবে'
        correct: false
        why: 'হাতের কাজ ভুলে যাওয়া হয়, আর মোছা হয়েছে তার কোনো প্রমাণও থাকে না।'
      - text: 'অ্যাডমিন স্ক্রিনে ছবি লুকিয়ে ডেটাবেসে রেখে দেওয়া'
        correct: false
        why: 'লুকানো মানে মোছা নয়। ডেটা রয়েই গেছে, তাই নিয়ম ভাঙা হলো, আর ফাঁস হলে ছবিও ফাঁস হবে।'
      - text: 'রাতের একটা job, যে ছবি মোছে আর প্রতিটার জন্য audit_log-এ সারি লেখে'
        correct: true
        why: 'নিয়ম নিজে থেকে কার্যকর হয়, আর audit সারিগুলোই অডিটরের জন্য প্রমাণ।'
      - text: 'এখন কিছু নয়; অডিটর চাইলে তখন দেখা যাবে'
        correct: false
        why: 'ততদিনে ৯০ দিনের পুরনো ছবি জমে গেছে, আর নিয়ম মানার কোনো ইতিহাস দেখানো যাবে না।'
    ref: regulation-worked-example
