slides:
  - slug: right-but-ignored
    title: 'ডিজাইন ঠিক, কিন্তু কেউ শুনছে না'
    kind: story
    tldr: 'পদ না থাকলেও প্রভাব তৈরি করা যায়। সঠিক হওয়া যথেষ্ট নয়; মানুষ যাকে বিশ্বাস করে, তার কথাই শোনে।'
    keywords: ['influence', 'leadership', 'without authority', 'প্রভাব', 'নেতৃত্ব']
    blocks:
      - type: text
        body: |
          সুমি বুঝতে পেরেছে, অর্ডার সার্ভিসের সরাসরি ডেটাবেস কোয়েরি সব জায়গায় ছড়িয়ে আছে, শিগগির ভাঙবে। সে Slack-এ লিখল "এটা ঠিক করা দরকার।" কেউ উত্তর দিল না। ছয় মাস পরে ঠিক সেটাই ভাঙল, আর সবাই বলল, "আগে বললে হতো!" সে বলেছিল, কিন্তু কাউকে সাথে নেয়নি।
      - type: metaphor
        icon: users
        title: 'পাড়ার ক্রিকেট দলের ক্যাপ্টেন'
        body: |
          পাড়ার দলে ক্যাপ্টেনকে কেউ নিয়োগ দেয়নি। তবু সবাই তার কথা শোনে, কারণ সে সবার সাথে খেলে, নিজে আগে ঝুঁকি নেয়, আর মাঠে কী করতে হবে তা বোঝায়। প্রভাব পদ থেকে আসে না, আসে বিশ্বাস থেকে।
      - type: visual
        kind: compare
        caption: 'পদের জোর বনাম প্রভাবের জোর'
        columns:
          - title: 'পদের জোর'
            tone: muted
            icon: lock
            tip: 'আদেশ দেওয়া যায়, কিন্তু মানুষ কাজটা মন থেকে করে না।'
            items:
              - '"ম্যানেজার বলেছেন, করো"'
              - 'পদ বদলালে জোরও যায়'
              - 'ভেতরের সম্মতি আসে না'
          - title: 'প্রভাবের জোর'
            tone: good
            icon: heart
            tip: 'বিশ্বাসের ওপর দাঁড়ানো প্রভাব পদ না থাকলেও কাজ করে।'
            items:
              - '"তার কথা সাধারণত ঠিক হয়"'
              - 'সবাই নিজের সিদ্ধান্ত মনে করে'
              - 'সম্মতি ভেতর থেকে আসে'
      - type: quote
        body: 'সঠিক হওয়া একটা কাজ। মানুষকে সাথে নেওয়া আরেকটা কাজ।'
    aside:
      - type: problem
        body: 'এই segment শেখায় পদ ছাড়া কীভাবে সবাইকে সাথে নেওয়া যায়, নতুনদের কীভাবে তৈরি করা যায়, আর কখন তর্ক থামিয়ে সিদ্ধান্ত নিতে হয়।'
      - type: remember
        body: 'বিশ্বাস আগে, যুক্তি পরে। যাকে বিশ্বাস করি, তার যুক্তি মন দিয়ে শুনি।'
    check:
      q: 'সুমির সতর্কবার্তা কাজে লাগল না কেন, যদিও সে সঠিক ছিল?'
      a: 'সে শুধু বলেছিল, কাউকে সাথে নেয়নি। প্রভাব তৈরি হয় বিশ্বাস, সংখ্যা আর ছোট প্রমাণ দিয়ে, শুধু ঠিক কথা বলে নয়।'

  - slug: persuading-without-authority
    title: 'পদ ছাড়া প্রভাব: চার ধাপ'
    kind: howto
    tldr: 'আগে শোনো, তারপর প্রমাণ দেখাও, ছোট পরীক্ষা চালাও আর একজন মিত্র জোগাড় করো। জোর করে নয়, প্রমাণ দিয়ে।'
    keywords: ['persuasion', 'pilot', 'allies', 'প্রভাব', 'proof of concept', 'convince']
    blocks:
      - type: text
        body: |
          সুমি এবার অন্যভাবে এগোল। সে প্রথমে টিমের মানুষদের কাছে গিয়ে জানল তাদের কী সমস্যা। তারপর সে একটা বাস্তব প্রমাণ নিয়ে এল। এই চার ধাপ পদ ছাড়াই একটা ধারণাকে টিমের সিদ্ধান্তে পরিণত করে।
      - type: visual
        kind: steps
        caption: 'ধারণাকে টিমের সিদ্ধান্ত করার চার ধাপ'
        steps:
          - {title: '১. আগে শোনো', body: 'প্রত্যেকের সমস্যা জিজ্ঞেস করো; তাদের ভাষায় সমস্যা ঠিক করো।', tip: 'নিজের সমাধান শোনানোর আগে তাদের সমস্যা বোঝো। লোকে নিজের সমস্যার সমাধান শুনতে চায়।'}
          - {title: '২. সংখ্যা দেখাও', body: 'কত বার ভেঙেছে, কত ঘণ্টা গেছে, পরের মাসে কী হতে পারে।', tip: '"ঠিক করা দরকার" মতামত। "গত তিন মাসে ১৪ ঘণ্টা গেছে" তথ্য।'}
          - {title: '৩. ছোট পরীক্ষা', body: 'একটা মডিউলে নতুন পদ্ধতি চালিয়ে ফল দেখাও।', tip: 'বড় বদলের অনুমতি চাওয়ার চেয়ে ছোট পরীক্ষার অনুমতি পাওয়া সহজ, আর প্রমাণ পাওয়া যায়।'}
          - {title: '৪. মিত্র খোঁজো', body: 'একজন সম্মানিত সহকর্মীকে আগে রাজি করাও।', tip: 'মিটিংয়ে একা না বলে আরেকজন একই কথা বললে বিশ্বাস দ্বিগুণ হয়।'}
      - type: code
        lang: text
        file: 'এক পাতার প্রস্তাব'
        variant: good
        code: |
          সমস্যা:  অর্ডারের কোয়েরি ১২টা জায়গায় ছড়ানো; schema বদলালে সব ভাঙে।
          প্রমাণ:  গত ৩ মাসে ৩ বার এ কারণে hotfix, মোট ১৪ ঘণ্টা।
          প্রস্তাব: একটা OrderRepository-তে সব কোয়েরি আনা, শুরু করব রিপোর্ট মডিউলে।
          খরচ:    ২ দিন, আমি করব; অন্য কারো কাজ আটকাবে না।
          ফেরা:    ভালো না লাগলে এক PR revert করলেই পুরনো অবস্থা।
          চাই:    এক সপ্তাহ পরে ফল দেখে সবাই মিলে সিদ্ধান্ত।
        marks:
          - {line: 2, tip: 'প্রমাণ সংখ্যায়। মতামত নয়, ঘটনা।'}
          - {line: 4, tip: 'খরচ ছোট ও নিজের হাতে, তাই "না" বলার কারণ কম।'}
          - {line: 5, tip: 'ফেরার পথ দেখালে ঝুঁকি কমে, রাজি হওয়া সহজ।'}
      - type: quote
        body: 'বড় বদলের অনুমতি নয়, ছোট পরীক্ষার প্রমাণ চাও।'
    aside:
      - type: pitfalls
        items:
          - 'মিটিংয়ে প্রথমবার ধারণা বলা। আগে এক-এক করে কথা বলে মত জেনে নাও।'
          - 'কাউকে "ভুল" প্রমাণ করে জেতা। সে মেনে নেবে, কিন্তু সহযোগিতা করবে না।'
      - type: refs
        items:
          - {to: 'thinking/tech-debt', label: 'tech debt-এর খরচ বোঝানো'}
    check:
      q: 'বড় রিফ্যাক্টরের অনুমতি না চেয়ে ছোট পরীক্ষা চালানো কেন বুদ্ধিমানের কাজ?'
      a: 'ছোট পরীক্ষায় ঝুঁকি কম, তাই অনুমতি মেলে সহজে। আর ফল হাতে থাকলে বড় সিদ্ধান্তের জন্য প্রমাণ পাওয়া যায়।'

  - slug: mentoring
    title: 'Mentoring: উত্তর নয়, প্রশ্ন'
    kind: compare
    tldr: 'ভালো মেন্টর উত্তর ঢেলে দেয় না। সে প্রশ্ন করে ভাবতে শেখায়, নিয়মিত দেখা করে আর নিজের ভুলের গল্প বলে।'
    keywords: ['mentoring', 'coaching', '1:1', 'মেন্টরিং', 'junior', 'growth']
    blocks:
      - type: text
        body: |
          জুনিয়র রাকিব এসে বলল, "ভাই, এই query ধীর, কী করব?" সিনিয়র ধরে বলে দিলে সে আজ ঠিক করে ফেলবে, কিন্তু পরের বার আবার আসবে। প্রশ্ন করলে সে ভাববে, নিজে খুঁজবে, আর পরেরবার একা পারবে।
      - type: visual
        kind: compare
        caption: 'উত্তর দেওয়া বনাম প্রশ্ন করা'
        columns:
          - title: 'সরাসরি উত্তর'
            tone: warn
            icon: send
            tip: 'আজকের সমস্যা মেটে, কিন্তু শেখা হয় না। মেন্টর বাধা হয়ে দাঁড়ায়।'
            items:
              - '"index দাও।"'
              - 'সমস্যা আজই মেটে'
              - 'পরের বার আবার প্রশ্ন'
          - title: 'প্রশ্ন করা'
            tone: good
            icon: lightbulb
            tip: 'ধীর, কিন্তু রাকিব নিজে ভাবে। এই অভ্যাস তার সারা জীবনের সম্পদ।'
            items:
              - '"EXPLAIN-এ কী দেখছ?"'
              - 'নিজেই কারণ খুঁজে পায়'
              - 'পরের বার একা সমাধান করে'
      - type: code
        lang: text
        file: 'এক ঘণ্টার 1:1-এর ছক (সাপ্তাহিক ৩০ মিনিট)'
        variant: good
        code: |
          ১. ভালো কী গেল এই সপ্তাহে?           (৫ মিনিট, মনোবল)
          ২. কোথায় আটকে আছ?                  (১০ মিনিট; সমাধান নয়, প্রশ্ন)
          ৩. একটা দক্ষতা, যা এ মাসে বাড়াবে     (৫ মিনিট; নির্দিষ্ট লক্ষ্য)
          ৪. আমার কাছ থেকে কী লাগবে?           (৫ মিনিট)
          ৫. আমার একটা ভুল বা শেখা গল্প         (৫ মিনিট; মন খুলে দেয়)
        marks:
          - {line: 2, tip: 'সমাধান না বলে প্রশ্ন: "তুমি কী চেষ্টা করেছ? কী মনে হয় কারণ?"'}
          - {line: 3, tip: 'মেন্টরিং ছোট ছোট লক্ষ্যে চলে: এ মাসে একটা EXPLAIN পড়তে শেখা।'}
          - {line: 5, tip: 'নিজের ভুলের গল্প জুনিয়রকে বুঝিয়ে দেয় ভুল স্বাভাবিক, লজ্জার নয়।'}
      - type: quote
        body: 'একজন জুনিয়রকে মাছ নয়, ধরার জাল দাও।'
    aside:
      - type: tips
        items:
          - 'code review-কে শেখার সুযোগ করো: "কেন" ব্যাখ্যা করে comment লেখো।'
          - 'কিছু ক্ষেত্রে সরাসরি উত্তর ঠিক: প্রোডাকশন ভাঙলে আগে ঠিক করো, তারপর শেখাও।'
      - type: when
        use:
          - 'জুনিয়র যখন সমস্যার কাছে নতুন নয়, চেষ্টা করেছে'
          - 'সময় আছে, সমস্যা জরুরি নয়'
        avoid:
          - 'প্রোডাকশন চলছে না, তাড়া আছে'
          - 'সে একদম নতুন, প্রশ্নের ভিত্তিই নেই'
    check:
      q: 'কখন সরাসরি উত্তর দেওয়া ঠিক, আর কখন প্রশ্ন করা?'
      a: 'জরুরি অবস্থায় বা একদম নতুন বিষয়ে সরাসরি বলো। সময় থাকলে আর জুনিয়র চেষ্টা করেছে, তখন প্রশ্ন করে ভাবাও।'

  - slug: consensus-building
    title: 'Consensus মানে সবাই একমত নয়'
    kind: concept
    tldr: 'Consensus হলো "আমি পুরো রাজি না হলেও এটা মেনে নিতে পারি।" আপত্তি না থাকাই যথেষ্ট; পুরো একমত হওয়া জরুরি নয়।'
    keywords: ['consensus', 'consent', 'buy-in', 'সমঝোতা', 'agreement', 'pre-wire']
    blocks:
      - type: text
        body: |
          পাড়ার সালিশে সবাই একই ভাব নিয়ে রাজি হয় না। সালিশদার জানতে চান, "কারো কি এমন আপত্তি আছে, যা মেনে নেওয়া যায় না?" নেই বললে রায় হয়। টিমের সিদ্ধান্তেও তাই: ১০০% সমর্থন নয়, গুরুতর আপত্তি নেই, সেটাই লক্ষ্য।
      - type: visual
        kind: table
        caption: 'সম্মতির তিন স্তর, প্রতিজনের কাছে'
        headers: ['স্তর', 'মানে', 'কী করা হয়']
        rows:
          - cells: ['সমর্থন', 'আমি এটা চাই', 'কাজে এগোও']
            tip: 'পুরো রাজি। এঁরা কাজ এগিয়ে নেওয়ার শক্তি।'
          - cells: ['মেনে নিচ্ছি', 'আমি হলে অন্যভাবে করতাম, তবে বাধা দেব না', 'আপত্তি লিখে রাখো, এগোও']
            tip: 'সাধারণ ও স্বাস্থ্যকর অবস্থা। সবাই প্রথম পছন্দ পায় না।'
          - cells: ['আপত্তি', 'এটা হলে আমার কাছে গুরুতর সমস্যা', 'আগে সমাধান, তারপর এগোনো']
            tip: 'এই স্তরের আপত্তিটাই আসল; ঝুঁকি বা তথ্য হতে পারে যা বাকিরা জানে না।'
      - type: points
        title: 'সমঝোতার পথ'
        style: number
        items:
          - 'প্রস্তাব মিটিংয়ের আগে এক-এক করে প্রধান আপত্তিকারীর সাথে আলোচনা করো (pre-wire)।'
          - 'মিটিংয়ে জিজ্ঞেস করো: "কারো কি গুরুতর আপত্তি আছে?" সংখ্যা নয়, আপত্তি খোঁজো।'
          - 'আপত্তি থাকলে তার কারণ লিখে সমাধান বা বিকল্প খোঁজো।'
      - type: quote
        body: 'সবাই একমত হওয়ার অপেক্ষা নয়; গুরুতর আপত্তি আছে কি না, সেটাই প্রশ্ন।'
    aside:
      - type: story
        title: 'নিরব সম্মতি'
        body: |
          এক মিটিংয়ে সবাই চুপ ছিল, সভাপতি ধরে নিলেন সবাই রাজি। পরে জানা গেল দুজন গুরুতর আপত্তি জানত কিন্তু সিনিয়রদের সামনে বলেনি। সবার আগে প্রত্যেকের মত আলাদা করে নেওয়া উচিত ছিল।
      - type: pitfalls
        items:
          - 'নীরবতাকে সম্মতি ধরে নেওয়া। প্রত্যেককে নাম ধরে জিজ্ঞেস করো।'
          - 'প্রথমে সিনিয়র মত দিলে বাকিরা তার পিছু নেয়। জুনিয়রদের আগে বলতে দাও।'
    check:
      q: 'সুমি "মেনে নিচ্ছি" বলল, তার মানে কী, আর টিম কী করবে?'
      a: 'সে নিজে অন্যভাবে করত, তবে বাধা দেবে না। টিম তার আপত্তি লিখে রেখে এগিয়ে যেতে পারে।'

  - slug: disagree-and-commit
    title: 'তর্ক কখন থামাবে: disagree and commit'
    kind: howto
    tldr: 'সময় বেঁধে আলোচনা করো, তারপর একজন সিদ্ধান্ত দেয়। সবাই সিদ্ধান্তটাকে নিজের মনে করে পুরো মন দিয়ে এগোয়।'
    keywords: ['disagree and commit', 'timebox', 'decision log', 'তর্ক থামানো', 'decider']
    blocks:
      - type: text
        body: |
          তর্ক আজীবন চলতে পারে। ভালো দল জানে কখন তর্ক শেষ করতে হয়। নিয়মটা: একজন সিদ্ধান্তদাতা আছে, আলোচনার সময় সীমিত, শেষে সিদ্ধান্ত হয়। যে একমত নয় সে মত লিখে রাখে, তারপর মন দিয়ে সিদ্ধান্তের পক্ষে কাজ করে।
      - type: visual
        kind: steps
        caption: 'তর্ক থেকে সিদ্ধান্তে পৌঁছানোর চার ধাপ'
        steps:
          - {title: '১. সময় বাঁধো', body: 'আলোচনার শেষ তারিখ ঠিক করো (যেমন বৃহস্পতিবার)।', tip: 'সময়সীমা না থাকলে তর্ক ফুরায় না। সিদ্ধান্তের দামের তুলনায় বাড়তি তর্কের খরচ বেশি।'}
          - {title: '২. একজন সিদ্ধান্তদাতা', body: 'নাম আগেই ঠিক: যার দায় সবচেয়ে বেশি।', tip: 'দায় যার, সিদ্ধান্ত তার। কমিটি নয়।'}
          - {title: '৩. মত লিখে রাখো', body: 'ভিন্নমত আর তার কারণ লিখে রাখো।', tip: 'যে ভিন্নমত পোষণ করে, তার মত লেখা থাকলে সে অনুভব করে শোনা হয়েছে।'}
          - {title: '৪. পুরো মন দিয়ে এগোও', body: 'সিদ্ধান্তের বিরুদ্ধে ঘুরপথে কাজ নয়।', tone: accent, tip: 'commit মানে অনিচ্ছায় মানা নয়, সিদ্ধান্ত সফল করতে চেষ্টা করা।'}
      - type: code
        lang: text
        file: 'docs/decisions/log.txt'
        variant: good
        code: |
          তারিখ: ১৪ ডিসেম্বর    সিদ্ধান্তদাতা: রহিম
          প্রশ্ন: নোটিফিকেশন কি আলাদা সার্ভিস হবে?
          সিদ্ধান্ত: না, আপাতত মূল অ্যাপের ভেতরে একটা module।
          কারণ: দলে ৪ জন; আলাদা সার্ভিসের অপারেশন-খরচ এখনই সামলানো কঠিন।
          ভিন্নমত: সুমি — ভবিষ্যতে scale করতে আলাদা সার্ভিস সহজ হতো।
          পুনর্বিবেচনা: দল ৮ জন হলে বা notification দিনে ১০ লাখ ছাড়ালে।
        marks:
          - {line: 1, tip: 'সিদ্ধান্তদাতার নাম ও তারিখ: কে, কবে।'}
          - {line: 5, tip: 'ভিন্নমত লেখা থাকলে সুমি শোনা হয়েছে অনুভব করে, আর পরে সে ঠিক হলে সবাই জানবে।'}
          - {line: 6, tip: 'কখন আবার ভাববে তা লেখা, যাতে সিদ্ধান্ত চিরকালের মনে না হয়।'}
      - type: quote
        body: 'একমত না হলেও সিদ্ধান্ত মানা যায়; কিন্তু সিদ্ধান্ত ছাড়া তর্কে দল ডুবে যায়।'
    aside:
      - type: when
        use:
          - 'ফেরা যায় এমন সিদ্ধান্ত, যেখানে তর্কের খরচ বেশি'
          - 'দুই বিকল্পই মোটামুটি সমান ভালো'
        avoid:
          - 'নিরাপত্তা বা আইনের গুরুতর ঝুঁকি আছে, চুপ থাকা যাবে না'
          - 'সিদ্ধান্তের পর নতুন তথ্য এসেছে; আবার ভাবো'
      - type: remember
        body: 'আলোচনায় খোলাখুলি, সিদ্ধান্তে একজন, কাজে সবাই একসাথে।'
    check:
      q: 'সিদ্ধান্ত হয়ে যাওয়ার পর সুমির ভিন্নমত থাকলে তার করণীয় কী?'
      a: 'ভিন্নমত লিখে রাখা আছে, তাই সে পুরো মন দিয়ে সিদ্ধান্তের পক্ষে কাজ করবে। নতুন তথ্য এলে আবার প্রশ্ন তুলতে পারবে।'

flashcards:
  - q: 'পদ ছাড়া প্রভাব কীসের ওপর দাঁড়ায়?'
    a: 'বিশ্বাস: নিয়মিত সঠিক কথা, সংখ্যা ও প্রমাণ, আর অন্যের সমস্যা বোঝা।'
    more: |
      পদের জোরে আদেশ মানানো যায়, কিন্তু মন থেকে সম্মতি পাওয়া যায় না। বিশ্বাস গড়ে ওঠে ছোট ছোট প্রতিশ্রুতি রাখলে, অন্যকে আগে শুনলে আর নিজের ভুল স্বীকার করলে। সেই বিশ্বাস পদ বদলালেও থেকে যায়।
    ref: right-but-ignored
  - q: 'কোনো প্রস্তাব টিমকে মানাতে প্রথমে কী করবে?'
    a: 'আগে শোনো: সবার সমস্যা বুঝে নিজের প্রস্তাবকে তাদের সমস্যার সমাধান হিসেবে দেখাও।'
    more: |
      নিজের ধারণা বলার আগে অন্যের সমস্যা জানলে প্রস্তাবটা তাদের নিজেদের কাজ সহজ করার উপায় হয়ে ওঠে। তখন "তোমার ধারণা" থেকে "আমাদের সমাধান" হয়ে যায়। এটা সবচেয়ে সস্তা আর কার্যকর পথ।
    ref: persuading-without-authority
  - q: 'বড় বদলের জন্য ছোট পরীক্ষা (pilot) কেন ভালো?'
    a: 'ঝুঁকি কম হওয়ায় অনুমতি সহজে মেলে, আর প্রমাণ হাতে থাকলে বড় সিদ্ধান্তে যুক্তি শক্ত হয়।'
    more: |
      পুরো সিস্টেমের রিফ্যাক্টরের অনুমতি চাইলে "না" আসে। একটা মডিউলে দুই দিনের পরীক্ষার অনুমতি চাইলে "হ্যাঁ" আসে। এক সপ্তাহ পরে সংখ্যাসহ ফল দেখালে পরের ধাপের জন্য আলাদা করে মানাতে হয় না।
    ref: persuading-without-authority
  - q: 'Mentoring-এ উত্তরের বদলে প্রশ্ন করা কেন ভালো?'
    a: 'জুনিয়র নিজে ভেবে খুঁজে পায়, তাই পরের বার একা সমাধান করতে পারে। সরাসরি উত্তরে শুধু আজকের সমস্যা মেটে।'
    more: |
      প্রশ্ন যেমন: "তুমি কী চেষ্টা করেছ?", "EXPLAIN-এ কী দেখছ?" এতে সে চিন্তার পথ শেখে। তবে প্রোডাকশন ভেঙে গেলে বা একদম নতুন বিষয়ে আগে সরাসরি সাহায্য করে পরে শেখানো ভালো।
    ref: mentoring
  - q: 'Consensus মানে কি সবাই একমত হওয়া?'
    a: 'না। মানে গুরুতর আপত্তি নেই এবং সবাই সিদ্ধান্ত মেনে এগোতে প্রস্তুত।'
    more: |
      সবাই সম্পূর্ণ একমত হওয়ার অপেক্ষা করলে কোনো সিদ্ধান্ত হয় না। বরং প্রশ্ন: "কারো কি গুরুতর আপত্তি আছে?" আপত্তি না থাকলে কেউ পুরো রাজি না হলেও এগোনো যায়, আর ভিন্নমত লিখে রাখা হয়।
    ref: consensus-building
  - q: 'Pre-wire কী?'
    a: 'মিটিংয়ের আগে প্রধান আপত্তিকারী বা সিদ্ধান্তের প্রভাবিত ব্যক্তিদের সাথে এক-এক করে কথা বলে নেওয়া।'
    more: |
      মিটিংয়ে প্রথমবার ধারণা শুনলে মানুষ আত্মরক্ষায় "না" বলে। আগে একান্তে আলোচনা করলে তারা ভাবার সময় পায়, আপত্তি জানায়, আর মিটিংয়ে বিস্ময় থাকে না।
    ref: consensus-building
  - q: '"Disagree and commit" কী?'
    a: 'সিদ্ধান্তের সাথে একমত না হলেও তা পুরো মন দিয়ে সফল করতে কাজ করা। ভিন্নমত আগে লিখে রাখা হয়।'
    more: |
      আলোচনায় ভিন্নমত খোলাখুলি বলা যায়, কিন্তু সিদ্ধান্ত হয়ে গেলে তার বিরুদ্ধে ঘুরপথে কাজ করা যায় না। নতুন তথ্য এলে আবার প্রশ্ন তোলা যায়। এভাবে দল তর্কে আটকে থাকে না।
    ref: disagree-and-commit
  - q: 'তর্ক থামিয়ে সিদ্ধান্ত নিতে কী কী লাগে?'
    a: 'আলোচনার শেষ তারিখ, একজন সিদ্ধান্তদাতা, ভিন্নমতের রেকর্ড, আর পুনর্বিবেচনার শর্ত।'
    more: |
      এই চারটা থাকলে তর্ক সীমিত থাকে, দায়িত্ব স্পষ্ট থাকে, ভিন্নমত শোনা হয় এবং সিদ্ধান্ত চিরকালের মতো আটকে যায় না। একটা decision log-এ এগুলো লিখে রাখলে ছয় মাস পরেও কারণ খুঁজে পাওয়া যায়।
    ref: disagree-and-commit

quiz:
  - q: 'সুমি টিমের পুরো query layer বদলাতে চায়, কিন্তু তার কোনো ম্যানেজার-পদ নেই। কোন পথ সবচেয়ে কার্যকর?'
    hint: 'বড় অনুমতি, না ছোট প্রমাণ?'
    options:
      - text: 'Slack-এ বড় করে লিখে সবাইকে জানানো যে এটা জরুরি'
        correct: false
        why: 'মতামত লেখা সহজ, উপেক্ষা করাও সহজ। প্রমাণ বা মিত্র নেই।'
      - text: 'সংখ্যা দিয়ে সমস্যা দেখানো, একটা ছোট মডিউলে পরীক্ষা চালানো, একজন সম্মানিত সহকর্মীকে আগে সাথে নেওয়া'
        correct: true
        why: 'প্রমাণ, কম ঝুঁকি আর মিত্র — তিনটাই পদ ছাড়া প্রভাবের কার্যকর উপাদান।'
      - text: 'নিজে একা পুরো সিস্টেম বদলে PR দেওয়া'
        correct: false
        why: 'কেউ সাথে নেই বলে PR বড় ও ঝুঁকিপূর্ণ; রিভিউ ও সমর্থন মিলবে না।'
      - text: 'ম্যানেজারকে দিয়ে আদেশ দেওয়ানো'
        correct: false
        why: 'আদেশে কাজ হয়, কিন্তু মন থেকে সম্মতি আসে না; ভবিষ্যতে সহযোগিতা কমে।'
    ref: persuading-without-authority
  - q: 'জুনিয়র রাকিব বলল, "আমার query ধীর।" সময় আছে, জরুরি নয়। সিনিয়র কী করবে?'
    hint: 'তাকে কী শেখাতে চাও?'
    options:
      - text: 'সরাসরি বলে দেবে কোন index দিতে হবে'
        correct: false
        why: 'আজকের সমস্যা মিটবে, কিন্তু রাকিব ভাবতে শিখবে না।'
      - text: 'নিজেই কোড ঠিক করে দেবে'
        correct: false
