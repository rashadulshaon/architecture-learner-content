      - text: '"এটা তোমার কাজ, নিজে বোঝো।"'
        correct: false
        why: 'সাহায্য ছাড়া ছেড়ে দেওয়া মেন্টরিং নয়; সে আটকে থাকবে।'
    ref: mentoring
  - q: 'নিচের কোনগুলো ভালো মেন্টরিংয়ের লক্ষণ?'
    hint: 'লক্ষ্য কি জুনিয়রের স্বাধীনভাবে ভাবার সামর্থ্য?'
    options:
      - text: 'নিয়মিত 1:1, যেখানে জুনিয়র নিজের আটকে থাকার জায়গা বলে'
        correct: true
        why: 'নিয়মিততা বিশ্বাস গড়ে, আর খোলা আলোচনা সমস্যা তাড়াতাড়ি ধরে।'
      - text: 'নিজের ভুলের গল্প বলা'
        correct: true
        why: 'এতে জুনিয়র বোঝে ভুল স্বাভাবিক, ফলে সে নিজের ভুল লুকোয় না।'
      - text: 'সব প্রশ্নের সাথে সাথে সম্পূর্ণ উত্তর দেওয়া'
        correct: false
        why: 'এতে নির্ভরতা বাড়ে, শেখা কমে। জরুরি অবস্থা ছাড়া প্রশ্নই ভালো।'
      - text: 'জুনিয়রের প্রতিটা PR নিজে ঠিক করে দেওয়া'
        correct: false
