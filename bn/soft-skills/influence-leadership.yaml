        why: 'নতুন তথ্য এলে ফেরা যায়; চুপ থাকলে ভুলটা বড় হবে।'
      - text: 'নতুন তথ্য নিয়ে সিদ্ধান্তদাতার কাছে গিয়ে পুনর্বিবেচনা চাওয়া'
        correct: true
        why: 'commit মানে অন্ধ মানা নয়। ভিত্তি বদলালে সিদ্ধান্তও পুনর্বিবেচনার যোগ্য।'
      - text: 'নিজের মতো ঘুরপথে অন্যভাবে কাজ করা'
        correct: false
        why: 'গোপনে সিদ্ধান্ত অমান্য করলে দলের বিশ্বাস নষ্ট হয়।'
      - text: 'টিমের সবাইকে নিজের পক্ষে টেনে বিদ্রোহ করা'
        correct: false
        why: 'এটা আলোচনা নয়, দলাদলি। সঠিক পথ হলো সিদ্ধান্তদাতার কাছে নতুন তথ্য আনা।'
    ref: disagree-and-commit
