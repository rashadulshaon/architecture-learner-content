      - text: 'সময়সীমা ঠিক করে সিদ্ধান্তদাতা নির্ধারণ, শেষে ভিন্নমত লিখে সিদ্ধান্ত নেওয়া'
        correct: true
        why: 'ফেরা যায় এমন, প্রায় সমান বিকল্পে দ্রুত সিদ্ধান্ত নেওয়াই দামি।'
      - text: 'ভোট নিয়ে সংখ্যাগরিষ্ঠের কথা মেনে নেওয়া'
        correct: false
        why: 'ভোট জেতাকে বড় করে, কারণ নয়; দায়ও কারো থাকে না।'
      - text: 'বিষয়টা বাদ দেওয়া'
        correct: false
        why: 'সিদ্ধান্ত না নেওয়াও একটা সিদ্ধান্ত, আর সেটার দামও আছে।'
    ref: disagree-and-commit
  - q: 'সিদ্ধান্ত হয়ে যাওয়ার পর সুমি লক্ষ্য করল, নতুন তথ্য অনুযায়ী সিদ্ধান্তের ভিত্তিই ভুল ছিল। করণীয় কী?'
    hint: 'disagree and commit কি নতুন তথ্যের ক্ষেত্রেও প্রযোজ্য?'
    options:
      - text: 'চুপ থাকা, কারণ সিদ্ধান্ত হয়ে গেছে'
