    ref: mentoring
  - q: 'মিটিংয়ে সবাই চুপ, সভাপতি বললেন, "তাহলে সবাই রাজি।" পরে দুজন গুরুতর আপত্তি জানাল। কী ভুল ছিল?'
    hint: 'নীরবতার মানে কী?'
    options:
      - text: 'নীরবতাকে সম্মতি ধরা হয়েছিল; প্রত্যেকের কাছ থেকে নাম ধরে মত নেওয়া উচিত ছিল'
        correct: true
        why: 'অনেকে সিনিয়রদের সামনে আপত্তি বলে না। আলাদা করে জিজ্ঞেস করলে তা বের হয়।'
      - text: 'মিটিং খুব ছোট ছিল'
        correct: false
        why: 'সময় বাড়ালেও চুপ থাকা মানুষ কথা বলত না; প্রক্রিয়ার ফাঁক অন্য জায়গায়।'
      - text: 'প্রস্তাবটা ভুল ছিল'
        correct: false
        why: 'প্রস্তাব ঠিক হতেও পারে; সমস্যা হলো আপত্তি জানার পথ ছিল না।'
      - text: 'আরও বেশি মানুষকে ডাকা দরকার ছিল'
        correct: false
        why: 'বেশি মানুষ থাকলে চুপ থাকার সম্ভাবনাই বাড়ে।'
    ref: consensus-building
  - q: 'দুই সপ্তাহ ধরে দলে তর্ক চলছে, দুই বিকল্পই প্রায় সমান ভালো। রহিম কী করবে?'
    hint: 'তর্কের খরচ বিকল্পের পার্থক্যের চেয়ে বেশি কি না।'
    options:
      - text: 'আরও এক সপ্তাহ তর্ক চলতে দেওয়া'
