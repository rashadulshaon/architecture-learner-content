        why: 'পদের জোরে সিদ্ধান্ত হলে কারণ হারিয়ে যায়, আর বাকিরা পরে সেটা মানতে চায় না।'
      - text: 'মাপকাঠি ও ওজন ঠিক করে এক পাতায় decision matrix বানানো, তারপর একজনকে সিদ্ধান্তদাতা করা'
        correct: true
        why: 'তর্ক পছন্দ থেকে মাপকাঠিতে সরে যায়, আর তারিখসহ একজন দায়িত্ব নেয়।'
      - text: 'আরও এক সপ্তাহ সময় দিয়ে সবাইকে গবেষণা করতে বলা'
        correct: false
        why: 'মাপকাঠি না থাকলে বাড়তি গবেষণাও তর্কের নতুন যুক্তি হয়ে দাঁড়ায়, সিদ্ধান্তে পৌঁছায় না।'
      - text: 'দুটোই চালু করে পরে দেখা'
        correct: false
        why: 'দুটো সিস্টেম চালানো খরচ ও জটিলতা বাড়ায়; সিদ্ধান্ত পিছিয়ে দেওয়া হলো মাত্র।'
    ref: three-week-debate
  - q: 'Matrix-এ Doctrine ৩৮, Redis ৩৭। এই ফল নিয়ে সবচেয়ে বুদ্ধিমানের পদক্ষেপ কোনটা?'
    hint: 'ব্যবধান মাত্র ১ নম্বর।'
    options:
      - text: 'Doctrine জিতেছে, আর কথা নেই'
        correct: false
        why: '১ নম্বরের ব্যবধান অনুমানের ভুলের মধ্যেই পড়ে; এতে আত্মবিশ্বাসী হওয়া ঠিক নয়।'
      - text: 'নম্বর আবার দিয়ে Redis জেতানো'
        correct: false
        why: 'ফল নিজের পছন্দ অনুযায়ী বদলানোই matrix-এর উদ্দেশ্য নষ্ট করে।'
      - text: 'ওজন বদলে sensitivity দেখা, আর কোন অনুমানের ওপর ফল ঝুলছে তা আলোচনা করা'
        correct: true
        why: 'ফল কাছাকাছি হলে আসল তর্ক ওজন বা অনুমান নিয়ে, বিকল্প নিয়ে নয়।'
      - text: 'matrix ফেলে দিয়ে ভোট নেওয়া'
        correct: false
        why: 'ভোটে আবার পছন্দ ফিরে আসে; মাপকাঠির স্বচ্ছতা হারায়।'
    ref: decision-matrix
  - q: 'নিচের কোন সিদ্ধান্তগুলোতে বেশি সময় দিয়ে ভাবা উচিত?'
    hint: 'ছয় মাস পরে ফেরানো কতটা কঠিন হবে?'
    options:
      - text: 'পাবলিক API-র response-এর গঠন বদলানো'
        correct: true
        why: 'মোবাইল অ্যাপ আর পার্টনার এর ওপর নির্ভর করে; বদলালে তাদের ভাঙে, ফেরা কঠিন।'
      - text: 'প্রধান ডেটাবেস ইঞ্জিন বদলানো'
        correct: true
        why: 'ডেটাভর্তি সিস্টেমে এটা মাসের কাজ আর ঝুঁকিও বড়।'
      - text: 'feature flag-এ একটা নতুন button চালু করা'
        correct: false
        why: 'flag বন্ধ করলেই আগের অবস্থা; ফেরা এক মিনিটের ব্যাপার, তাই দ্রুত নেওয়া চলে।'
      - text: 'একটা helper method-এর নাম বদলানো'
        correct: false
        why: 'আজকের একটা commit-এই ফেরানো যায়, দামি নয়।'
    ref: decide-under-uncertainty
  - q: 'সুমি ৬০% তথ্য নিয়ে একটা feature flag-ভিত্তিক পরীক্ষা চালু করতে চায়, রাকিব বলছে "১০০% নিশ্চিত না হয়ে নয়"। কে ঠিক?'
    hint: 'ফেরার দরজা খোলা কি না?'
    options:
      - text: 'রাকিব, কারণ ভুল হলে দায় আসবে'
