slides:
  - slug: three-week-debate
    title: 'তিন সপ্তাহের তর্ক, সিদ্ধান্ত শূন্য'
    kind: story
    tldr: 'সিদ্ধান্ত না নেওয়ারও দাম আছে: ফিচার আটকে থাকে, তর্ক জেতে জোর গলার, আর যুক্তি হারিয়ে যায়।'
    keywords: ['decision making', 'analysis paralysis', 'সিদ্ধান্ত', 'তর্ক', 'trade-off']
    blocks:
      - type: text
        body: |
          সোমবারের স্ট্যান্ড-আপ। সুমি বলল, "queue-র জন্য RabbitMQ নিই।" রাকিব বলল, "Redis তো আছেই, নতুন কিছু কেন?" তিন সপ্তাহ পরে দেখা গেল কেউ ভুল বলেনি, কিন্তু কেউ সিদ্ধান্তও নেয়নি। ফিচার ততদিনে আটকে আছে।
      - type: points
        title: 'সিদ্ধান্ত না নেওয়ার দাম'
        style: cross
        items:
          - 'ফিচার আটকে থাকে, ব্যবসার আয় পিছিয়ে যায়।'
          - 'যুক্তি নয়, যে জোরে বলে তার কথাই জেতে।'
          - 'প্রত্যেকে নিজের পছন্দ আঁকড়ে ধরে, "কেন" প্রশ্নটা আর কেউ করে না।'
      - type: visual
        kind: compare
        caption: 'তর্কের মিটিং বনাম সিদ্ধান্তের মিটিং'
        columns:
          - title: 'তর্কের মিটিং'
            tone: bad
            icon: cross
            tip: 'এখানে সবাই নিজের পছন্দ নিয়ে লড়ে; কোন মাপকাঠিতে বিচার হবে, তা কেউ ঠিক করেনি।'
            items:
              - '"আমার মনে হয়" দিয়ে শুরু'
              - 'মাপকাঠি ঠিক নেই'
              - 'শেষে "পরে দেখা যাবে"'
          - title: 'সিদ্ধান্তের মিটিং'
            tone: good
            icon: check
            tip: 'আগে মাপকাঠি ঠিক হয়, তারপর বিকল্প মাপা হয়; তাই সবাই একই পাল্লায় দেখে।'
            items:
              - 'আগে মাপকাঠি ও তার ওজন ঠিক'
              - 'বিকল্পগুলো এক পাতায় পাশাপাশি'
              - 'একজন সিদ্ধান্তদাতা, তারিখসহ'
      - type: quote
        body: 'সিদ্ধান্ত না নেওয়াও একটা সিদ্ধান্ত — শুধু সেটা কেউ ভেবে নেয় না।'
    aside:
      - type: story
        title: 'নোটিফিকেশনের queue'
        body: |
          এক স্টার্টআপে queue বাছাই নিয়ে তর্ক চলল এক মাস। শেষে CTO একটা পাতায় চারটা মাপকাঠি লিখে এক ঘণ্টায় সিদ্ধান্ত দিলেন। পরের তিন মাসে সেই সিদ্ধান্ত নিয়ে আর কেউ প্রশ্ন তোলেনি।
      - type: problem
        body: 'এই segment দেখায় কীভাবে তর্ককে মাপকাঠিতে বদলে সিদ্ধান্তে পৌঁছানো যায়, আর ভুল হলে কীভাবে দ্রুত ফেরা যায়।'
    check:
      q: 'কেউ ভুল বলছে না, তবু তিন সপ্তাহ সিদ্ধান্ত হলো না — মূল ঘাটতি কোথায়?'
      a: 'আগে থেকে মাপকাঠি ঠিক করা হয়নি, আর সিদ্ধান্ত নেওয়ার দায়িত্বও কারো ছিল না। তাই তর্ক শুধু পছন্দের লড়াই হয়ে গেছে।'

  - slug: trade-off-everywhere
    title: 'সব ভালো দিক একসাথে মেলে না'
    kind: concept
    tldr: 'প্রতিটা বিকল্পে কিছু পাও, কিছু ছাড়ো। "সেরা কোনটা?" নয়, প্রশ্ন হলো "আমাদের কোন গুণটা সবচেয়ে বেশি দরকার?"'
    keywords: ['trade-off', 'ট্রেড-অফ', 'criteria', 'মাপকাঠি', 'কোন বিকল্প ভালো']
    blocks:
      - type: metaphor
        icon: truck
        title: 'ঈদে বাড়ি ফেরার পথ'
        body: |
          ঈদের আগে বাড়ি ফিরতে বাস, ট্রেন, লঞ্চ — তিনটাই আছে। বাসে টিকিট সহজ, কিন্তু জ্যামে আটকাতে পারো। ট্রেন সময়ে পৌঁছায়, কিন্তু টিকিট পাওয়া কঠিন। কোনটা "সেরা", তা নির্ভর করে তোমার কাছে সময়, খরচ নাকি আরাম বেশি জরুরি।
      - type: visual
        kind: table
        caption: 'ঈদের যাত্রা: তিন বিকল্প, চার মাপকাঠি'
        headers: ['', 'বাস', 'ট্রেন', 'লঞ্চ']
        rows:
          - cells: ['টিকিট পাওয়া', 'সহজ', 'কঠিন', 'মাঝারি']
            tip: 'এই মাপকাঠিতে বাস জেতে। কিন্তু সহজ টিকিট মানেই ভালো যাত্রা নয়।'
          - cells: ['সময়ের নিশ্চয়তা', 'কম (জ্যাম)', 'বেশি', 'মাঝারি']
            tip: 'বাড়ি পৌঁছানোর সময় যার কাছে জরুরি, তার কাছে ট্রেনের এই সুবিধা সবচেয়ে বড়।'
          - cells: ['খরচ', 'বেশি (ঈদে ভাড়া চড়া)', 'কম', 'মাঝারি']
            tip: 'খরচ কম রাখাই লক্ষ্য হলে ট্রেন এগিয়ে।'
          - cells: ['আরাম', 'মাঝারি', 'মাঝারি', 'বেশি (কেবিন)']
            tip: 'কেউ কোনো মাপকাঠিতে সবার সেরা নয়; সেটাই trade-off।'
      - type: quote
        body: 'সেরা বিকল্প বলে কিছু নেই। আছে তোমার মাপকাঠিতে সবচেয়ে মানানসই বিকল্প।'
    aside:
      - type: tips
        items:
          - 'বিকল্প বাছার আগে মাপকাঠি লেখো, তারপর বিকল্প দেখো। উল্টোটা করলে নিজের পছন্দের পক্ষে মাপকাঠি বানাতে ইচ্ছে করবে।'
          - 'অন্তত দুটো বিকল্প রাখো, "কিছু না করা"-ও একটা বিকল্প।'
      - type: refs
        items:
          - {to: 'thinking/what-is-architectural', label: 'কোন সিদ্ধান্তে বেশি সময় দেবে'}
    check:
      q: 'বাস, ট্রেন, লঞ্চ — কোনটা সেরা, এ প্রশ্নের উত্তর কেন হয় না?'
      a: 'কারণ কোনোটাই সব মাপকাঠিতে এগিয়ে নয়। উত্তর নির্ভর করে তোমার কাছে সময়, খরচ নাকি আরাম বেশি জরুরি, তার ওপর।'

  - slug: decision-matrix
    title: 'Decision matrix: এক পাতায় বিকল্প মাপা'
    kind: howto
    tldr: 'মাপকাঠি লেখো, প্রতিটায় ওজন দাও, বিকল্পে নম্বর দাও, গুণ করে যোগ করো — তারপর ওজন বদলে দেখো ফল টেকে কি না।'
    keywords: ['decision matrix', 'weighted scoring', 'ডিসিশন ম্যাট্রিক্স', 'sensitivity', 'Messenger transport']
    blocks:
      - type: text
        body: |
          সুমি আর রাকিবের তর্কটা এখন এক পাতায় তোলা যাক। Symfony Messenger-এর transport হিসেবে তিনটা বিকল্প। ওজন ১ থেকে ৫, নম্বরও ১ থেকে ৫। নিচের ফল নম্বর আর ওজনের গুণফল যোগ করে এসেছে।
      - type: code
        lang: text
        file: 'docs/decisions/queue-transport.txt'
        variant: good
        code: |
          প্রশ্ন: Messenger-এর transport কোনটা?   সিদ্ধান্তদাতা: সুমি   তারিখ: ১২ ডিসেম্বর

          মাপকাঠি (ওজন)        Doctrine   Redis   RabbitMQ
          ----------------------------------------------
          অপারেশন সহজ  (৩)         5        4        2
          বার্তা হারায় না (৩)      3        3        5
          টিমের অভিজ্ঞতা (২)       5        4        2
          ভবিষ্যৎ throughput (২)    2        4        5
          ----------------------------------------------
          মোট                      38       37       35

          sensitivity: "বার্তা হারায় না"-র ওজন ৩ থেকে ৫ করলে
          Doctrine 44, Redis 43, RabbitMQ 45 — বিজয়ী বদলে যায়।

          সিদ্ধান্ত: Doctrine transport। কারণ আমাদের দিনে ২ হাজারের কম বার্তা।
          পুনর্বিবেচনা: বার্তা দিনে ১ লাখ ছাড়ালে অথবা হারানো বার্তা ঘটলে।
        marks:
          - {line: 3, tip: 'ওজন আগে ঠিক হয়, নম্বর দেওয়ার আগে। নইলে পছন্দের বিকল্প জেতাতে ওজন বদলাতে ইচ্ছে করবে।'}
          - {line: 10, tip: 'যেমন Doctrine: ৩×৫ + ৩×৩ + ২×৫ + ২×২ = ১৫ + ৯ + ১০ + ৪ = ৩৮।'}
          - {line: 12, tip: 'মোট নম্বর কাছাকাছি হলে সিদ্ধান্তটা ওজনের ওপর ঝুলে থাকে। ওজন বদলে দেখো ফল টেকে কি না।'}
          - {line: 13, tip: 'বিজয়ী বদলে গেল, অর্থাৎ আসল আলোচনা ওজন নিয়ে: আমাদের কাছে বার্তা না হারানো কতটা জরুরি?'}
          - {line: 16, tip: 'সিদ্ধান্তের কারণ আর কখন আবার ভাবতে হবে — দুটোই লেখা, যাতে ছয় মাস পরে কেউ জিজ্ঞেস করলে উত্তর থাকে।'}
      - type: visual
        kind: bars
        caption: 'একই বিকল্প, ওজন বদলালে বিজয়ী বদলায় (সর্বোচ্চ নম্বর ৫০)'
        items:
          - {label: 'Doctrine (মূল)', value: 38, display: '38', tone: accent, tip: 'প্রথম ওজনে জেতে: সহজ অপারেশন আর টিমের অভিজ্ঞতা এখানে বড় ভূমিকা রাখে।'}
          - {label: 'Redis (মূল)', value: 37, display: '37', tone: muted, tip: 'মাত্র ১ নম্বরের ব্যবধান, অর্থাৎ প্রায় সমান।'}
          - {label: 'RabbitMQ (মূল)', value: 35, display: '35', tone: muted, tip: 'অপারেশন ও অভিজ্ঞতায় পিছিয়ে, তাই তৃতীয়।'}
          - {label: 'RabbitMQ (ওজন ৫)', value: 45, display: '45', tone: good, tip: 'বার্তা না হারানোকে বেশি গুরুত্ব দিলে সে-ই জেতে।'}
      - type: quote
        body: 'Matrix সত্য বের করে না। সে শুধু দেখায় কার কোন ধারণার ওপর সিদ্ধান্ত দাঁড়িয়ে আছে।'
    aside:
      - type: pitfalls
        items:
          - 'নম্বর দেওয়া মানে বিজ্ঞান নয়; নম্বরগুলো বিচারবুদ্ধির অনুমান। তাই যুক্তিও পাশে লেখো।'
          - '১০টার বেশি মাপকাঠি দিলে আসল গুরুত্বপূর্ণ দুই-তিনটা হারিয়ে যায়।'
      - type: remember
        body: 'আগে মাপকাঠি, তারপর ওজন, তারপর নম্বর। শেষে ওজন বদলে দেখো ফল টেকে কি না।'
      - type: refs
        items:
          - {to: 'thinking/design-review', label: 'সিদ্ধান্ত রিভিউয়ে আনা'}
    check:
      q: 'Matrix-এ দুই বিকল্পের মোট নম্বর প্রায় সমান হলে পরের পদক্ষেপ কী?'
      a: 'ওজন বদলে দেখো বিজয়ী বদলায় কি না। বদলালে ওজন নিয়ে আলোচনা করো, কারণ আসল মতভেদ সেখানেই।'

  - slug: decide-under-uncertainty
    title: 'সব তথ্য ছাড়া সিদ্ধান্ত: দরজা কোন দিকে?'
    kind: compare
    tldr: 'ফেরা যায় এমন সিদ্ধান্ত দ্রুত নাও, ফেরা যায় না এমনটা ধীরে। সব তথ্যের জন্য অপেক্ষা করলে সুযোগ চলে যায়।'
    keywords: ['uncertainty', 'two-way door', 'reversible', 'অনিশ্চয়তা', 'assumption']
    blocks:
      - type: text
        body: |
          ঈদের টিকিট ছাড়ে সকাল ৮টায়। কাউন্টারে কত ভিড় হবে, তা আগে জানার উপায় নেই। অপেক্ষা করলে টিকিট শেষ, তাই আন্দাজে কিনতে হয়। সফটওয়্যারেও ১০০% তথ্য কখনো আসে না; প্রশ্ন হলো ভুল হলে ফেরা যায় কি না।
      - type: visual
        kind: compare
        caption: 'দুই ধরনের দরজা, দুই ধরনের গতি'
        columns:
          - title: 'ফেরা যায় (দ্রুত নাও)'
            tone: good
            icon: check
            tip: 'এখানে ভুল হলে ক্ষতি ছোট। দ্রুত নিয়ে শিখে নেওয়াই ভালো।'
            items:
              - 'feature flag-এ নতুন আচরণ'
              - 'একটা library বদলানো'
              - 'এক সপ্তাহের পরীক্ষা (spike)'
          - title: 'ফেরা যায় না (ধীরে নাও)'
            tone: bad
            icon: warning
            tip: 'এখানে ভুল হলে মাস লাগে ঠিক করতে। তাই সময় দিয়ে ভাবো, অন্যকে জিজ্ঞেস করো।'
            items:
              - 'পাবলিক API-র response'
              - 'ডেটা মডেল, ID-র ধরন'
              - 'ডেটাবেস বা cloud-এ আটকে যাওয়া'
      - type: points
        title: 'অনিশ্চয়তায় সিদ্ধান্তের চার নিয়ম'
        style: number
        items:
          - 'দরজা কোন দিকে, আগে ঠিক করো।'
          - 'প্রায় ৭০% তথ্য হলেই ফেরা-যায়-এমন সিদ্ধান্ত নাও।'
          - 'যা ধরে নিলে, সেই assumption লিখে রাখো।'
          - 'কোন লক্ষণ দেখলে আবার ভাববে, তা আগেই ঠিক করো।'
    aside:
      - type: story
        title: 'ID-র ধরন'
        body: |
          একটা টিম অর্ডারের ID সংখ্যা হিসেবে রাখল, কারণ "এখনই কাজ চলুক"। দুই বছর পরে সেই ID পার্টনারদের সিস্টেমে ছড়িয়ে গেছে। বদলাতে লাগল ছয় মাস। যে দরজা ফেরা যায় না, সেটা তাড়াহুড়োয় পার হওয়াই ভুল ছিল।
      - type: refs
        items:
          - {to: 'thinking/reversible-decisions', label: 'ফেরার দরজা আছে, না নেই?'}
    check:
      q: 'কোন সিদ্ধান্তে বেশি সময় দেবে: feature flag-এ নতুন button নাকি পাবলিক API-র response বদল?'
      a: 'পাবলিক API-র response। ওটা বদলালে মোবাইল অ্যাপ আর পার্টনার ভাঙে, ফেরা যায় না। button flag দিয়ে এক মিনিটে বন্ধ করা যায়।'

  - slug: risk-prioritization
    title: 'ঝুঁকির তালিকা: impact × likelihood'
    kind: howto
    tldr: 'সব ঝুঁকি সামলানো যায় না। প্রতিটার সম্ভাবনা ও ক্ষতি ১–৫ নম্বরে মেপে গুণ করো, সবচেয়ে বড়গুলোয় আগে হাত দাও।'
    keywords: ['risk register', 'impact likelihood', 'ঝুঁকি', 'risk matrix', 'mitigation']
    blocks:
      - type: text
        body: |
          ফার্মেসির মালিক সব ওষুধ সমান স্টকে রাখে না। যেটা কম লাগে কিন্তু না থাকলে রোগীর প্রাণ যায়, সেটা সবার আগে। ঝুঁকিও তেমন: সম্ভাবনা আর ক্ষতি দুটো মিলিয়ে বড়গুলো বাছো। ঝুঁকিগুলো একটা risk register-এ লিখে রাখো।
      - type: code
        lang: text
        file: 'docs/risk-register.txt'
        variant: good
        code: |
          # ঝুঁকি                       সম্ভাবনা  ক্ষতি  স্কোর  পদক্ষেপ              মালিক
          R1 পেমেন্ট gateway ২ ঘণ্টা বন্ধ      3      5     15  circuit breaker +    রাকিব
                                                              "পরে চেষ্টা" বার্তা
          R2 migration টেবিল lock করে          3      4     12  কম ট্রাফিকের রাতে,   সুমি
                                                              staging-এ আগে চালানো
          R3 একমাত্র বিশেষজ্ঞ ছুটিতে          4      2      8  runbook লেখা         রহিম
          R4 লগইন পাতার রং নিয়ে অভিযোগ        5      1      5  কিছু করব না          —

          স্কোর = সম্ভাবনা × ক্ষতি (১–৫ × ১–৫)
          নিয়ম: ১২ বা তার বেশি → এই sprint-এ কাজ। ৬–১১ → backlog-এ তারিখসহ।
                 ৫ বা কম → জেনে-শুনে মেনে নেওয়া (accept)।
        marks:
          - {line: 2, tip: 'সবচেয়ে বেশি স্কোর, তাই আগে। সম্ভাবনা মাঝারি হলেও ক্ষতি বিশাল।'}
          - {line: 6, tip: 'সম্ভাবনা বেশি হলেও ক্ষতি ছোট, তাই স্কোর কম। runbook এখানে সস্তা সমাধান।'}
          - {line: 7, tip: '"কিছু করব না" লেখাও একটা সিদ্ধান্ত। লিখে রাখলে পরে কেউ প্রশ্ন করলে উত্তর থাকে।'}
          - {line: 11, tip: 'আগে থেকে নিয়ম ঠিক থাকলে স্কোর ধরে কাজ বাছাই নিয়ে তর্ক কমে।'}
      - type: visual
        kind: bars
        caption: 'ঝুঁকির স্কোর (সম্ভাবনা × ক্ষতি), সর্বোচ্চ ২৫'
        items:
          - {label: 'R1 gateway বন্ধ', value: 15, display: '15', tone: bad, tip: 'সবচেয়ে বড় ঝুঁকি: পেমেন্ট না হলে আয় বন্ধ।'}
          - {label: 'R2 migration lock', value: 12, display: '12', tone: warn, tip: 'নিয়ম অনুযায়ী এটাও এই sprint-এর কাজ।'}
          - {label: 'R3 বিশেষজ্ঞ ছুটিতে', value: 8, display: '8', tone: warn, tip: 'গুরুত্বপূর্ণ, তবে সস্তা সমাধান আছে: runbook।'}
          - {label: 'R4 পাতার রং', value: 5, display: '5', tone: muted, tip: 'ছোট ঝুঁকি, মেনে নেওয়াই যুক্তিসংগত।'}
    aside:
      - type: pitfalls
        items:
          - 'শুধু যা ভয় লাগে তা তালিকায় তোলা; যা অস্বস্তিকর কিন্তু বাস্তব, তা বাদ পড়ে।'
          - 'একবার লিখে ভুলে যাওয়া। প্রতি মাসে register আবার দেখো।'
      - type: remember
        body: 'সম্ভাবনা × ক্ষতি = অগ্রাধিকার। প্রতিটা ঝুঁকির একজন মালিক, একটা পদক্ষেপ।'
    check:
      q: 'R3-এর সম্ভাবনা ৪ হলেও তার স্কোর কম কেন, আর তাতে কী করা হয়েছে?'
      a: 'ক্ষতি মাত্র ২, তাই ৪×২ = ৮। বেশি খরচ না করে সস্তা পদক্ষেপ নেওয়া হয়েছে: runbook লেখা।'

  - slug: admit-error-fast
    title: 'ভুল ধরা পড়লে: যত তাড়াতাড়ি স্বীকার, তত সস্তা'
    kind: pitfall
    tldr: 'অনেক খরচ করে ফেলেছি বলে ভুল পথে চলতে থাকা sunk cost ফাঁদ। ভুল দ্রুত বলো, ফেরাও, শিখে লিখে রাখো।'
    keywords: ['sunk cost', 'blameless', 'admit mistake', 'ভুল স্বীকার', 'postmortem']
    blocks:
      - type: text
        body: |
          রাকিব তিন মাস ধরে নিজের লেখা search module বানাচ্ছে। এখন দেখা গেল Symfony-র একটা standard উপায় এর অর্ধেক কাজ করে দিত। সে ভাবল, "এত খেটেছি, ফেলে দেব কীভাবে?" এই চিন্তাকে বলে sunk cost fallacy: যা খরচ হয়ে গেছে তা ফেরত আসবে না, তাই ভবিষ্যতের হিসাবে ধরার জিনিস নয়।
      - type: visual
        kind: steps
        caption: 'ভুল ধরা পড়ার পর চার ধাপ'
        steps:
          - {title: '১. সরাসরি বলো', body: 'টিমকে জানাও: "আমি ভুল ধরেছি, এটা আমার সিদ্ধান্ত ছিল।"', tip: 'আগে নিজে বললে বিশ্বাস বাড়ে। অন্যে ধরলে মনে হয় লুকোনো হচ্ছিল।'}
          - {title: '২. ক্ষতি থামাও', body: 'নতুন করে আর খরচ না করে আগে ফেরার পথ বের করো।', tip: 'মেরামতের আগে রক্তক্ষরণ বন্ধ: feature flag বন্ধ, rollback বা কাজ থামানো।'}
          - {title: '৩. বাকি দাম মাপো', body: 'এখন থেকে শেষ করতে কত লাগবে, বদলে কত লাগবে — শুধু সেটাই তুলনা করো।', tip: 'খরচ হয়ে যাওয়া তিন মাস দু-দিকেই সমান, তাই হিসাবের বাইরে রাখো।'}
          - {title: '৪. শিক্ষা লিখো', body: 'blameless postmortem: কী ঘটল, কেন, পরে কী বদলাবে।', tip: 'মানুষকে দোষ না দিয়ে প্রক্রিয়ার ফাঁক খোঁজো, নইলে পরের বার সবাই ভুল লুকোবে।'}
      - type: quote
        body: 'ভুল স্বীকারের দাম আজ সবচেয়ে কম। প্রতিদিন তা বাড়ে।'
    aside:
      - type: story
        title: 'কে আগে বলল'
        body: |
          এক টিমে migration ভুল হওয়ায় অর্ডারের কিছু তথ্য মুছে গেল। জুনিয়র নিজেই দশ মিনিটে জানাল। কয়েক ঘণ্টায় backup থেকে সব ফেরানো হলো। জানাজানি হয়েছিল পরের দিন; লুকোলে ক্ষতি সপ্তাহ পর্যন্ত গড়াত।
      - type: tips
        items:
          - 'ভুল স্বীকার করা জুনিয়রকে ধন্যবাদ দাও, শাস্তি নয়; নইলে পরের ভুল কেউ বলবে না।'
          - '"আমি ভুল বুঝেছিলাম, এখন এটা জানি" বলা শিখলে নেতৃত্বে তোমার বিশ্বাসযোগ্যতা বাড়ে।'
      - type: refs
        items:
          - {to: 'observability/incident-response', label: 'incident-এর পরে postmortem'}
    check:
      q: '"তিন মাস খেটেছি, তাই চালিয়েই যাই" — এই যুক্তিতে ভুলটা কী?'
      a: 'খরচ হয়ে যাওয়া সময় ফেরত আসবে না, দুই পথেই সমান। সিদ্ধান্তের ভিত্তি হবে এখন থেকে বাকি খরচ আর ভবিষ্যৎ লাভ।'

flashcards:
  - q: 'Decision matrix কী?'
    a: 'বিকল্পগুলোকে মাপকাঠি ধরে ওজনসহ নম্বর দিয়ে এক পাতায় তুলনা করার ছক।'
    more: |
      প্রথমে মাপকাঠি ঠিক হয় (যেমন খরচ, নিরাপত্তা, সময়), প্রতিটায় ওজন দেওয়া হয়, তারপর প্রতিটা বিকল্পে নম্বর বসে। নম্বর × ওজন যোগ করে মোট আসে। এতে তর্ক "আমার পছন্দ" থেকে "কোন মাপকাঠি বেশি জরুরি" প্রশ্নে সরে যায়।
    ref: decision-matrix
  - q: 'Matrix-এ মাপকাঠির ওজন নম্বর দেওয়ার আগে কেন ঠিক করতে হয়?'
    a: 'নইলে পছন্দের বিকল্প জেতাতে ওজন বদলানোর লোভ হয় — ফল আগে থেকেই ঠিক হয়ে যায়।'
    more: |
      যে বিকল্প তোমার প্রিয়, সেটার পক্ষে মাপকাঠি সাজানো অবচেতনে ঘটে। আগে ওজন লিখে দলের সম্মতি নিলে সেই পক্ষপাত আটকায়। ওজন নিয়ে মতভেদ থাকলে তখনই সেটা আলোচনায় তোলা ভালো।
    ref: decision-matrix
  - q: 'Sensitivity check কী, আর কেন করা হয়?'
    a: 'ওজন বদলে দেখা বিজয়ী বদলায় কি না। বদলালে সিদ্ধান্তটা ওজনের অনুমানের ওপর ঝুলে আছে।'
    more: |
      মোট নম্বর কাছাকাছি হলে ছোট ওজন বদলেই ফল পাল্টে যায়। এতে বোঝা যায় আসল মতভেদ বিকল্প নিয়ে নয়, কোন মাপকাঠি বেশি জরুরি তা নিয়ে। সেটা নিয়ে আলোচনা করলে সিদ্ধান্ত শক্ত হয়।
    ref: decision-matrix
  - q: 'কোন সিদ্ধান্ত দ্রুত নেওয়া যায়, কোনটা ধীরে?'
    a: 'ফেরা যায় এমন (flag, library) দ্রুত। ফেরা যায় না এমন (পাবলিক API, ডেটা মডেল) ধীরে ও আলোচনা করে।'
    more: |
      ফেরার খরচ কম হলে ভুল করেও শেখা যায়, তাই দেরি করা মানে শুধু সুযোগ হারানো। ফেরার খরচ মাসের হিসাবে হলে আগে ভাবার সময় দাও, অন্যদের জিজ্ঞেস করো। বিস্তারিত: [[thinking/reversible-decisions|reversible decisions]]।
    ref: decide-under-uncertainty
  - q: 'অনিশ্চয়তায় সিদ্ধান্ত নেওয়ার সময় assumption লিখে রাখা কেন জরুরি?'
    a: 'পরে বাস্তব তথ্য এলে ধারণার সাথে মিলিয়ে দেখা যায় কোনটা ভুল ছিল, আর কখন সিদ্ধান্ত পুনর্বিবেচনা করতে হবে।'
    more: |
      সিদ্ধান্তের সাথে "আমরা ধরে নিয়েছি দিনে ২ হাজার বার্তা" লিখে রাখলে সংখ্যা ছাড়ালেই সবাই বুঝবে ভাবার সময় এসেছে। লেখা না থাকলে ধারণাটা কারো মাথায় থাকে, আর সে চলে গেলে কারণটাও হারায়।
    ref: decide-under-uncertainty
  - q: 'ঝুঁকির স্কোর কীভাবে বের হয়?'
    a: 'সম্ভাবনা × ক্ষতি, দুটোই ১–৫ নম্বরে। বড় স্কোর আগে সামলাও।'
    more: |
      সম্ভাবনা বেশি কিন্তু ক্ষতি ছোট হলে (যেমন বিশেষজ্ঞ ছুটিতে) সস্তা পদক্ষেপ যথেষ্ট। সম্ভাবনা কম কিন্তু ক্ষতি বিশাল হলে (পেমেন্ট বন্ধ) গুরুত্ব দিতে হয়। দুটো একসাথে ধরলে অগ্রাধিকার স্পষ্ট হয়।
    ref: risk-prioritization
  - q: 'কোনো ঝুঁকি "accept" করা মানে কী?'
    a: 'জেনে-শুনে সিদ্ধান্ত নেওয়া যে এটা নিয়ে কিছু করব না, আর সেটা লিখে রাখা।'
    more: |
      সব ঝুঁকি দূর করা যায় না, করার দরকারও নেই। কিন্তু চুপচাপ উপেক্ষা আর লিখে মেনে নেওয়া এক জিনিস নয়। লিখে রাখলে বোঝা যায় কেউ ভেবে-চিন্তে ছেড়েছে, আর পরিস্থিতি বদলালে আবার দেখা যায়।
    ref: risk-prioritization
  - q: 'Sunk cost fallacy কী?'
    a: 'ইতিমধ্যে খরচ হয়ে গেছে বলে ভুল পথে চলতে থাকা। সিদ্ধান্ত হওয়া উচিত শুধু ভবিষ্যৎ খরচ ও লাভ দেখে।'
    more: |
      তিন মাসের পরিশ্রম ফেরত আসবে না, চালালেও না, ফেলে দিলেও না। তাই নতুন প্রশ্ন হলো: এখান থেকে শেষ করতে কত লাগবে, আর বিকল্পে কত? যে কম, সেটা বাছো। কঠিন লাগে, কারণ এতে নিজের আগের সিদ্ধান্ত ভুল বলে মানতে হয়।
    ref: admit-error-fast

quiz:
  - q: 'টিমে ৩ সপ্তাহ ধরে Redis বনাম RabbitMQ তর্ক চলছে, কেউ সিদ্ধান্ত নিচ্ছে না। টিম লিড হিসেবে প্রথমে কী করবে?'
    hint: 'তর্কটা বিকল্প নিয়ে, নাকি বিচারের মাপকাঠি নিয়ে?'
    options:
      - text: 'সবচেয়ে সিনিয়রের পছন্দ মেনে নিতে বলা'
