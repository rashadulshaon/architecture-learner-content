        why: 'ফেরা যায় এমন সিদ্ধান্তে ১০০% নিশ্চিতির অপেক্ষা সুযোগ হারায়; ভুলের দামও ছোট।'
      - text: 'সুমি, কারণ flag বন্ধ করে ফেরা যায়; আর কোন লক্ষণ দেখলে ফিরবে, সেটা আগেই লিখে রাখা উচিত'
        correct: true
        why: 'ছোট, ফেরানো যায় এমন পরীক্ষায় শেখাই দাম; assumption ও ট্রিগার লেখা থাকলে ঝুঁকি আরও কমে।'
      - text: 'কেউ না — আরও তথ্য আসা পর্যন্ত থামা উচিত'
        correct: false
        why: 'সব তথ্য কখনো আসে না; অপেক্ষাও একটা সিদ্ধান্ত, আর তার দাম আছে।'
