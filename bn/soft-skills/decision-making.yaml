    ref: risk-prioritization
  - q: 'দুই মাস পরে রাকিব বুঝল তার বেছে নেওয়া library টিমের কাজে মানাচ্ছে না, যদিও সে অনেক কোড লিখে ফেলেছে। সবচেয়ে ভালো পদক্ষেপ?'
