  - q: 'তিনটা কাজের (best, likely, worst) যথাক্রমে ২, ৪, ১০। প্রত্যাশিত সময় কত?'
    hint: '(best + 4 × likely + worst) ÷ 6।'
    options:
      - text: '৪.৭ দিন'
        correct: true
        why: '(২ + ১৬ + ১০) ÷ ৬ = ২৮ ÷ ৬ ≈ ৪.৭ দিন।'
      - text: '৫.৩ দিন'
        correct: false
        why: 'এটা তিন সংখ্যার সরল গড় (১৬ ÷ ৩); PERT সম্ভাব্য মানকে বেশি গুরুত্ব দেয়।'
      - text: '১০ দিন'
        correct: false
        why: 'এটা শুধু worst; সব সময় খারাপটাই ঘটে না।'
      - text: '২ দিন'
        correct: false
        why: 'এটা শুধু best; আশাবাদী আন্দাজ।'
    ref: estimation-ranges
  - q: 'দুটো কাজের ছড়ান ৩ দিন আর ৪ দিন। দুটো মিলিয়ে ছড়ান কত?'
    hint: 'ছড়ান বর্গ করে যোগ, তারপর বর্গমূল।'
    options:
      - text: '৭ দিন'
        correct: false
        why: 'ছড়ান শুধু যোগ করলে ধরে নেওয়া হয় দুটোই একসাথে খারাপ হবে। সাধারণত তা হয় না, তাই বর্গ করে যোগ করে বর্গমূল নিতে হয়।'
      - text: '৫ দিন'
        correct: true
        why: '√(৩² + ৪²) = √(৯ + ১৬) = √২৫ = ৫ দিন।'
      - text: '৩.৫ দিন'
        correct: false
        why: 'এটা গড়। দুটো কাজ মিলিয়ে অনিশ্চয়তা গড়ের সমান নয়, তার চেয়ে বেশি।'
      - text: '১২ দিন'
        correct: false
        why: 'গুণ করার এখানে কোনো মানে নেই; ছড়ান বর্গের মাধ্যমে মেলে।'
