slides:
  - slug: marriage-hall-chaos
    title: 'বিয়েবাড়ির আয়োজন যখন এলোমেলো'
    kind: story
    tldr: 'প্রযুক্তি ঠিক থাকলেও টিম, পরিকল্পনা, সময়ের হিসাব, ভেন্ডর আর নিয়োগ ঠিক না থাকলে প্রকল্প দেরি হয়।'
    keywords: ['organizational', 'team', 'roadmap', 'estimation', 'vendor', 'hiring', 'সংগঠন']
    blocks:
      - type: text
        body: |
          সেপ্টেম্বরে রহিম বলেছিল, "অ্যাপ নভেম্বরে চালু।" নভেম্বরে দেখা গেল: পেমেন্ট টিমের API তৈরি হয়নি, SMS ভেন্ডর চুক্তির শর্ত নিয়ে আটকে, নতুন একজন লোকও আসেনি, আর আন্দাজটাই ছিল একটা সংখ্যা: "৬ সপ্তাহ।" কোডে কোনো সমস্যা ছিল না।
      - type: metaphor
        icon: building
        title: 'বিয়েবাড়ির আয়োজন'
        body: |
          বিয়েবাড়িতে রান্না, সাজসজ্জা আর অতিথি আপ্যায়নের আলাদা আলাদা দল থাকে। ক্যাটারার না এলে সব আটকে যায়, তাই আগে থেকে তার সাথে কথা হয়। কে কখন কী পৌঁছে দেবে, লেখা থাকে। সফটওয়্যার প্রকল্পও একটা আয়োজন।
      - type: visual
        kind: table
        caption: 'কোথায় প্রকল্প ভাঙে, আর এই segment-এর কোন slide-এ সমাধান'
        headers: ['কী ভাঙল', 'বিয়েবাড়ির উদাহরণ', 'কোন বিষয়']
        rows:
          - cells: ['কে কী করবে অস্পষ্ট', 'রান্নার দল সাজসজ্জাও করছে', 'টিমের গঠন']
            tip: 'দায়িত্ব ও সীমানা অস্পষ্ট হলে কেউ কাজ শেষ করে না, আর সবাই সবার কাজে হাত দেয়।'
          - cells: ['অন্য টিমের জন্য অপেক্ষা', 'ক্যাটারার না এলে খাওয়া নেই', 'roadmap ও dependency']
            tip: 'অন্য টিম বা বাইরের কেউ সময়মতো না দিলে আপনার কাজও আটকায়।'
          - cells: ['আন্দাজ ভুল', '"পনেরো মিনিটে রান্না শেষ"', 'estimation']
            tip: 'একক সংখ্যা মানে ভুল প্রতিশ্রুতি; পরিসর ও অনুমান বললে বিশ্বাস থাকে।'
          - cells: ['বাইরের সরবরাহকারী', 'ক্যাটারারের শর্ত না পড়া', 'vendor ও চুক্তি']
            tip: 'চুক্তির ছোট শর্ত পরে বড় ক্ষতি করে।'
          - cells: ['ভুল লোক বা লোকের অভাব', 'বাবুর্চি ছাড়া আয়োজন', 'hiring']
            tip: 'ভুল নিয়োগ ঠিক করা সবচেয়ে দামি।'
      - type: quote
        body: 'প্রকল্প ভাঙে প্রায়ই কোডের বাইরে: মানুষ, সময় আর চুক্তিতে।'
    aside:
      - type: problem
        body: 'প্রযুক্তিতে ভালো ইঞ্জিনিয়ারও সংগঠনের দুর্বলতায় ডুবতে পারে। এই segment সংগঠনের পাঁচটা মৌলিক কাজ শেখায়।'
      - type: refs
        items:
          - {to: 'thinking/conways-law', label: 'Conway''s Law: টিম ও ডিজাইনের সম্পর্ক'}
    check:
      q: 'কোডে সমস্যা না থাকলেও রহিমের প্রকল্প দেরি হলো কেন?'
      a: 'অন্য টিমের API, ভেন্ডরের চুক্তি আর নিয়োগের দেরি আগে থেকে ধরা হয়নি; আর আন্দাজ ছিল একক সংখ্যা, পরিসর নয়।'

  - slug: team-topology
    title: 'টিমের চার ধরন'
    kind: concept
    tldr: 'প্রতিটা টিমের একটাই স্পষ্ট কাজ থাকলে বোঝা আর হাত-বদল কমে। চার ধরন: stream-aligned, platform, enabling, complicated-subsystem। ১০ জনের কম হলে এক টিমই যথেষ্ট।'
    keywords: ['team topologies', 'stream-aligned', 'platform team', 'Conway', 'cognitive load', 'টিম গঠন']
    blocks:
      - type: text
        body: |
          রহিমের কোম্পানিতে ১৬ জন ইঞ্জিনিয়ার এক টিমে ছিল, আর সেই টিমের হাতে চেকআউট, মূল্য নির্ধারণের মডেল এবং deploy pipeline (কোড পরীক্ষা করে চালু করার যন্ত্রব্যবস্থা)। মডেলের একটা bug তিন সপ্তাহ পড়ে রইল, কারণ একমাত্র বিশেষজ্ঞ তখন pipeline সারাতে ব্যস্ত; সে না থাকলে চেকআউটের release-ও আটকে যেত।
      - type: visual
        kind: compare
        caption: 'এক টিমের হাতে সব বনাম প্রতি টিমের একটা কাজ'
        columns:
          - title: 'এক টিমের হাতে সব'
            tone: bad
            icon: cross
            tip: 'একজনের মাথায় এত ধরে না। সব কাজ একই কয়েকজন বিশেষজ্ঞের পেছনে লাইনে দাঁড়ায়।'
            items:
              - 'চেকআউট, মডেল আর pipeline এক টিমে'
              - 'bug-এর জন্য একমাত্র বিশেষজ্ঞের অপেক্ষায় তিন সপ্তাহ'
              - 'pipeline-এর লোক না থাকলে release বন্ধ'
          - title: 'প্রতি টিমের একটা কাজ'
            tone: good
            icon: check
            tip: 'প্রতিটা টিম নিজের এলাকা পুরোটা মাথায় রাখতে পারে, তাই কাজ আর একজনের পেছনে আটকে থাকে না।'
            items:
              - 'চেকআউট টিম শুধু কেনার ধারা সামলায়'
              - 'মূল্যের বিশেষজ্ঞরা মডেলের মালিক; চেকআউট শুধু ডাকে'
              - 'platform টিম সবার জন্য pipeline ঠিক রাখে'
      - type: text
        body: |
          বিয়েবাড়ি এটা এড়ায়: একজন অতিথি সামলায়, একজন রান্নাঘরের সরঞ্জাম জোগায়, একজন নতুনদের শেখায়, আর একজন বিশেষ পদ (যেমন কাচ্চি) একাই রাঁধে। Team Topologies বইয়ে টিমের জন্য ঠিক এই চার ভূমিকার নাম দেওয়া আছে।
      - type: visual
        kind: table
        caption: 'চার ধরনের টিম (Team Topologies)'
        headers: ['ধরন', 'কাজ', 'উদাহরণ']
        rows:
          - cells: ['Stream-aligned', 'ব্যবসার একটা ধারা শুরু থেকে শেষ', 'চেকআউট টিম']
            tip: 'বেশিরভাগ টিম এই ধরনের। তারা সরাসরি ব্যবহারকারীর জন্য মূল্য তৈরি করে।'
          - cells: ['Platform', 'অন্যদের কাজ সহজ করার সরঞ্জাম', 'CI/CD, ডেটাবেস প্ল্যাটফর্ম']
            tip: 'স্ট্রিম টিমের বোঝা কমায়। প্ল্যাটফর্মকে পণ্যের মতো করে চালাতে হয়, বাধ্যতামূলক নিয়ম হিসেবে নয়।'
          - cells: ['Enabling', 'অন্য টিমকে নতুন দক্ষতা শেখায়', 'নিরাপত্তা বা test কোচ']
            tip: 'সাময়িকভাবে সাহায্য করে, তারপর সরে যায়। স্থায়ী নির্ভরতা তৈরি করে না।'
          - cells: ['Complicated-subsystem', 'কঠিন বিশেষজ্ঞ কাজ', 'মূল্য নির্ধারণ, ML মডেল']
            tip: 'এমন অংশ যা বুঝতে গভীর বিশেষজ্ঞতা লাগে, তাই আলাদা টিমে রাখা হয়।'
      - type: points
        title: 'টিম ভাগের নিয়ম, আর কখন ভাগ নয়'
        style: dot
        items:
          - 'টিমের আকার ছোট রাখুন (প্রায় ৫–৯ জন), যাতে সবাই সবার সাথে কথা বলতে পারে।'
          - 'Cognitive load মানে একটা টিমকে একসাথে যতটা মাথায় রাখতে হয়। বেশি হলে টিম ভাগ করুন।'
          - 'টিমের গঠন সিস্টেমের গঠন ঠিক করে, তাই আগে ঠিক করুন কী ভাগ করতে চান।'
          - '১০ জনের কম ইঞ্জিনিয়ার? এক টিমই রাখুন; চার ধরন কাগুজে ঝামেলা। কাজ একজনের পেছনে আটকালে বা পুরোটা কেউ না বুঝলে ভাগ করুন।'
    aside:
      - type: pitfalls
        items:
          - 'প্ল্যাটফর্ম টিম নিয়ম চাপিয়ে দেয়, অথচ ব্যবহারকারী টিমের চাহিদা শোনে না।'
          - 'প্রতিটা সার্ভিসের জন্য একটা টিম বানানো, ফলে কেউ পুরো ছবি দেখে না।'
      - type: refs
        items:
          - {to: 'thinking/conways-law', label: 'Conway''s Law'}
    check:
      q: 'একটা টিম একসাথে চেকআউট, পেমেন্টের জটিল নিয়ম আর CI/CD সামলাচ্ছে। কী সমস্যা হবে, আর কী করবেন?'
      a: 'বোঝা (cognitive load) বেশি হবে। কঠিন অংশ complicated-subsystem আর CI/CD-কে platform টিমে ভাগ করে চেকআউট টিম নিজের ধারায় মন দেবে।'

  - slug: roadmap-dependencies
    title: 'Roadmap ও dependency'
    kind: howto
    tldr: 'Roadmap-এ ফিচার নয়, ফলাফল লিখুন (Now / Next / Later)। প্রতিটা dependency-র মালিক ও তারিখ লিখুন, নইলে দেরিটা শেষে ধরা পড়ে।'
    keywords: ['roadmap', 'dependency', 'Now Next Later', 'planning', 'রোডম্যাপ', 'নির্ভরতা']
    blocks:
      - type: text
        body: |
          বিয়েবাড়ির আয়োজকের কাছে একটা তালিকা থাকে: কে কখন কী পৌঁছে দেবে। প্রকল্পের roadmap আর dependency তালিকাও তেমন। ফিচারের তারিখ দিলে ভুল প্রতিশ্রুতি হয়; ফলাফল আর সময়ের ধাপ দিলে নমনীয়তা থাকে।
      - type: code
        lang: text
        file: 'roadmap-and-dependencies.txt'
        variant: good
        code: |
          BEFORE: "রিফান্ড ফিচার, ১৫ নভেম্বর"   <- পেমেন্ট API পিছোলেই এই তারিখ ভাঙে

          ROADMAP (Now / Next / Later)
          Now   (এই কোয়ার্টার, নিশ্চিত): চেকআউটে ১ সেকেন্ডের নিচে p95
          Next  (পরের কোয়ার্টার, সম্ভাব্য): কুপন ও অফার চালু
          Later (পরে, অনিশ্চিত):           বিদেশি মুদ্রায় পেমেন্ট

          DEPENDENCY REGISTER
          # নির্ভরতা              মালিক          আমাদের দরকার   অবস্থা    ঝুঁকি
          1 পেমেন্ট টিমের refund API  পেমেন্ট টিম    ১৫ নভেম্বর    ডিজাইনে   উচ্চ
          2 SMS ভেন্ডরের sandbox    ভেন্ডর/সুমি     ২০ নভেম্বর    চুক্তি বাকি  মাঝারি
          3 নিরাপত্তা রিভিউ         নিরাপত্তা টিম   ২৫ নভেম্বর    সময় নেওয়া  নিম্ন

          নিয়ম: যে dependency-র "দরকার তারিখ" ২ সপ্তাহের কম, অবস্থা "ডিজাইনে" বা তার পেছনে,
                 সেটা সাপ্তাহিক স্ট্যান্ড-আপে লাল দাগ।
        marks:
          - {line: 1, tip: 'তারিখসহ ফিচার মানে প্রতিশ্রুতি। ফিচার যার ওপর নির্ভর করে, সে পিছোলেই এটা ভাঙে।'}
          - {line: 4, tip: 'Now: নিশ্চিত। Next: সম্ভাব্য। Later: ইচ্ছা। p95 ১ সেকেন্ডের নিচে মানে ১০০টা চেকআউটের ৯৫টা এক সেকেন্ডের মধ্যে শেষ।'}
          - {line: 10, tip: 'প্রতিটা নির্ভরতার একজন মালিক ও আমাদের দরকারের তারিখ। মালিকহীন নির্ভরতা কেউ দেখে না।'}
          - {line: 14, tip: 'দরকারের তারিখ কাছে, কাজ পিছিয়ে। তাই আগে থেকে লাল দাগ। শেষ মুহূর্তে জানা সবচেয়ে ক্ষতিকর।'}
      - type: visual
        kind: flow
        caption: 'আমাদের ফিচার কীসের ওপর দাঁড়িয়ে আছে'
        nodes:
          - {id: ours, label: 'রিফান্ড ফিচার', sub: 'আমাদের টিম', icon: rocket, tone: accent, col: 0, row: 1, tip: 'আমরা যা সময়মতো পৌঁছে দিতে চাই।'}
          - {id: pay, label: 'পেমেন্ট টিম API', sub: '১৫ নভেম্বর দরকার', icon: api, tone: bad, col: 2, row: 0, tip: 'এখনো ডিজাইনে। সবচেয়ে বড় ঝুঁকি।'}
          - {id: sms, label: 'SMS ভেন্ডর', sub: '২০ নভেম্বর দরকার', icon: send, tone: warn, col: 2, row: 1, tip: 'চুক্তি বাকি, আর চুক্তি ছাড়া sandbox (ভেন্ডরের সেবার নিরাপদ পরীক্ষামূলক কপি) মিলবে না। সময় নেবে, তবে কাজ আটকাবে না আপাতত।'}
          - {id: sec, label: 'নিরাপত্তা রিভিউ', sub: '২৫ নভেম্বর দরকার', icon: shield, tone: good, col: 2, row: 2, tip: 'সময় নেওয়া আছে।'}
        edges:
          - {from: ours, to: pay, label: 'রিফান্ড API ছাড়া আমাদের কাজ শুরুই হবে না'}
          - {from: ours, to: sms, label: 'ক্রেতাকে SMS পাঠাতে ভেন্ডরের sandbox লাগবে'}
          - {from: ours, to: sec, label: 'চালুর আগে নিরাপত্তা রিভিউ পাস করতে হবে'}
      - type: quote
        body: 'যে নির্ভরতার মালিক নেই, তার দেরিই সবচেয়ে চমকপ্রদ হয়।'
    aside:
      - type: tips
        items:
          - 'ফিচার নয়, ফলাফল লিখুন: "ফিচার X" নয়, "চেকআউটে ড্রপ-অফ ২০% কমানো।"'
          - 'সপ্তাহে একবার dependency তালিকা ৫ মিনিটে দেখুন; লাল হলে মালিককে সরাসরি জিজ্ঞেস করুন।'
      - type: pitfalls
        items:
          - 'Roadmap-এ ফিচারের সঠিক তারিখ দিয়ে ফেলা; পরে প্রতিশ্রুতি ভাঙে।'
          - 'সত্যিই স্থির তারিখ লুকানো। আইন বা ঈদ তারিখ ঠিক করলে সেই তারিখ লিখুন; Now / Next / Later নমনীয় তারিখের কাজের জন্য।'
    check:
      q: 'Roadmap-এ কেন Now / Next / Later ব্যবহার করে সঠিক তারিখ এড়ানো ভালো?'
      a: 'দূরের তারিখে অনিশ্চয়তা বেশি। তিন স্তরে বললে নিশ্চিত, সম্ভাব্য আর অনিশ্চিত — আলাদা থাকে, আর ভুল প্রতিশ্রুতি এড়ানো যায়।'

  - slug: estimation-ranges
    title: 'Estimation: একক সংখ্যা নয়, পরিসর'
    kind: howto
    tldr: 'আন্দাজ একটা সংখ্যা নয়, একটা পরিসর আর তার অনুমান। প্রতি কাজে তিন বিন্দু (best, likely, worst) থেকে প্রত্যাশিত সময় আর পরিসর বের করুন।'
    keywords: ['estimation', 'three point', 'PERT', 'range', 'আন্দাজ', 'cone of uncertainty']
    blocks:
      - type: text
        body: |
          "এই কাজ কতদিনে হবে?" প্রশ্নের উত্তরে "৬ সপ্তাহ" বলা সহজ, আর ভুলও। কারণ একক সংখ্যা শোনালে মানুষ সেটাকে প্রতিশ্রুতি ধরে। পরিসর (যেমন ১৫ থেকে ২১ দিন) আর কোন কোন অনুমানে সেটা ঠিক, তা বললে অনিশ্চয়তা আগে থেকে দেখা যায়। পরিসরটা আন্দাজ নয়: প্রতিটা কাজের best আর worst কত দূরে, তা থেকেই সেটা আসে।
      - type: code
        lang: text
        file: 'estimate-with-ranges.txt'
        variant: good
        code: |
          কাজ                 best  likely  worst   প্রত্যাশিত = (best + 4×likely + worst) ÷ 6
          A. login-এ OTP         3      5     10    (3 + 20 + 10) ÷ 6 = 5.5 দিন
          B. কুপন model          2      3      6    (2 + 12 + 6) ÷ 6 = 3.3 দিন
          C. SMS ভেন্ডর যুক্ত    5      8     20    (5 + 32 + 20) ÷ 6 = 9.5 দিন
          ----------------------------------------------------------------
          মোট প্রত্যাশিত                                           ≈ 18 দিন

          একটা কাজের ছড়ান = (worst − best) ÷ 6:     A 1.2    B 0.7    C 2.5
          পুরোটার ছড়ান = √(1.2² + 0.7² + 2.5²) = √8.2 ≈ 2.9 দিন
          পরিসর = 18 ± 2.9  →  15 থেকে 21 দিন (মোটামুটি তিনবারে দুইবার)

          ঘোষণা: "প্রায় ১৮ দিন, সম্ভবত ১৫ থেকে ২১।"
          অনুমান: ভেন্ডরের sandbox ২০ তারিখের মধ্যে পাব; পরীক্ষার জন্য আলাদা একজন নেই।
          ঝুঁকি: ভেন্ডরের দেরি হলে C-এর worst ঘটবে: 5.5 + 3.3 + 20 ≈ 29 দিন।
        marks:
          - {line: 1, tip: 'তিন বিন্দু: সবচেয়ে ভালো, সবচেয়ে সম্ভাব্য, সবচেয়ে খারাপ। এটাকে PERT সূত্র বলা হয়।'}
          - {line: 8, tip: 'ছড়ান মানে কম-বেশির হিসাব। কাজের worst যত বেশি best-এর ওপরে, ছড়ান তত বেশি। √-এর নিচের ৮.২-র ৬.২৫ই C-র।'}
          - {line: 9, tip: 'ছড়ান শুধু যোগ হয় না: বর্গ করে যোগ, তারপর বর্গমূল, কারণ সব কাজ একসাথে খারাপ হয় না। শর্ত: কাজগুলো স্বাধীনভাবে ভুল হয়।'}
          - {line: 12, tip: 'পরিসরসহ ঘোষণা; একক সংখ্যা বলা এড়ান।'}
          - {line: 13, tip: 'অনুমান লিখে রাখলে ভুল হলে কারণ আলোচনা সহজ হয়।'}
      - type: visual
        kind: bars
        caption: 'কাজ প্রতি প্রত্যাশিত দিন (বন্ধনীতে best–worst)'
        items:
          - {label: 'A. login OTP', value: 5.5, display: '৫.৫ (৩–১০)', tone: default, tip: 'মাঝারি অনিশ্চয়তা।'}
          - {label: 'B. কুপন model', value: 3.3, display: '৩.৩ (২–৬)', tone: good, tip: 'ছোট ও নিশ্চিত কাজ।'}
          - {label: 'C. SMS ভেন্ডর', value: 9.5, display: '৯.৫ (৫–২০)', tone: bad, tip: 'সবচেয়ে বড় পরিসর; বাইরের নির্ভরতার কারণে।'}
      - type: quote
        body: 'একক সংখ্যা প্রতিশ্রুতি হয়ে যায়; পরিসর আর অনুমান বললে সততা থাকে।'
    aside:
      - type: pitfalls
        items:
          - 'আন্দাজকে মেয়াদ ধরে নেওয়া। আন্দাজ হলো ধারণা, মেয়াদ হলো প্রতিশ্রুতি।'
          - 'চাপের মুখে সংখ্যা কমিয়ে বলা। কাজ কমবে না, শুধু পরে দেরি ধরা পড়বে।'
          - 'পরিসরকে নিশ্চয়তা ধরা। এটা ধরে নেয় কাজগুলো স্বাধীনভাবে ভুল হয়; ভেন্ডরের দেরির মতো এক কারণ কয়েকটাকে একসাথে ধাক্কা দেয়, তাই সেটা অনুমান হিসেবে লিখুন।'
      - type: refs
        items:
          - {to: 'thinking/estimation', label: 'Architecture-এ estimation'}
    check:
      q: 'C কাজটার আন্দাজ ৫–২০ দিন কেন এত বড় পরিসর, আর কী করবেন?'
      a: 'ভেন্ডরের ওপর নির্ভরতার অনিশ্চয়তা বেশি। আগে ভেন্ডরের sandbox পাওয়া নিশ্চিত করুন বা ছোট spike চালান, যাতে পরিসর ছোট হয়।'

  - slug: vendor-contract
    title: 'Vendor ও চুক্তি: সই করার আগে কী দেখবেন'
    kind: howto
    tldr: 'চুক্তির শর্ত না পড়লে পরে বেরোনোর পথ থাকে না। SLA, ডেটা ফেরত, দাম বাড়ানো, দায়বদ্ধতা আর বের হওয়ার শর্ত আগে দেখুন।'
    keywords: ['vendor', 'contract', 'SLA', 'exit clause', 'lock-in', 'negotiation', 'ভেন্ডর', 'চুক্তি']
    blocks:
      - type: text
        body: |
          ক্যাটারারের সাথে চুক্তিতে লেখা থাকে: কত জনের খাবার, দেরি হলে কী, খাবার খারাপ হলে কী ক্ষতিপূরণ। সফটওয়্যার ভেন্ডরের বেলায়ও তা-ই। ধরুন, সুমির টিম প্রথম বছরের কম দামে এক SMS গেটওয়ের সাথে চুক্তি করল। দ্বিতীয় বছরে ৩০ দিনের নোটিশে দাম দ্বিগুণ হলো, আর ছাড়তে চাইলে নিজেদের ডেটা পেতে ৯০ দিন অপেক্ষা। বিক্রয়ের লোক ভালো কথা বলেছিল, কিন্তু আসল কথা চুক্তিতে। নিচের তালিকা সই করার আগে মিলিয়ে নিন।
      - type: code
        lang: text
        file: 'vendor-checklist.txt'
        variant: good
        code: |
          ভেন্ডর: SMS গেটওয়ে X    মূল্যায়নকারী: সুমি    সিদ্ধান্ত তারিখ: ৩০ নভেম্বর

          [ ] SLA: আপটাইম কত? (যেমন ৯৯.৯%) ব্যর্থ হলে কী ক্ষতিপূরণ?
          [ ] ডেটা ফেরত: ছাড়লে আমাদের ডেটা কী ফরম্যাটে, কতদিনে ফেরত পাব?
          [ ] দাম: কত দিন স্থির? দাম বাড়াতে কত আগে জানাবে?
          [ ] বের হওয়া: নোটিশ কত দিনের? ন্যূনতম মেয়াদ বা জরিমানা আছে?
          [ ] নিরাপত্তা: তারা ডেটা কোথায় রাখে? কোন সার্টিফিকেশন?
          [ ] দায়বদ্ধতা: তাদের দোষে ক্ষতি হলে সর্বোচ্চ কত দায়?
          [ ] বিকল্প: দ্বিতীয় ভেন্ডর চিহ্নিত? আমরা কত দিনে বদলাতে পারব?

          আমাদের পক্ষে সবচেয়ে গুরুত্বপূর্ণ: ডেটা ফেরত + বের হওয়া (lock-in এড়াতে)
        marks:
          - {line: 3, tip: 'SLA মানে প্রতিশ্রুত আপটাইম। ৯৯.৯% মানেও মাসে প্রায় ৪৩ মিনিট বন্ধ থাকা চলে (৯৯% হলে ৭ ঘণ্টার বেশি)। ক্ষতিপূরণ ছাড়া সংখ্যা মূল্যহীন।'}
          - {line: 4, tip: 'ডেটা ফেরত পাওয়া ছাড়া ভেন্ডর বদলানো যায় না। এটা lock-in-এর মূল ফাঁদ।'}
          - {line: 8, tip: 'দায়বদ্ধতার সীমা প্রায়ই সামান্য, যেমন এক মাসের ফি। জেনে নিন।'}
          - {line: 9, tip: 'বিকল্প না থাকলে দরকষাকষির শক্তি থাকে না।'}
      - type: visual
        kind: steps
        caption: 'ভেন্ডর বাছাইয়ের পাঁচ ধাপ'
        steps:
          - {title: '১. চাহিদা লিখুন', body: 'কী সমস্যা সমাধান চাই, কোন সংখ্যা দরকার?', tip: 'চাহিদা না লিখলে বিক্রয়ের লোক ঠিক করে দেয় আপনি কী চান।'}
          - {title: '২. দুই-তিনজন তুলনা', body: 'matrix বানিয়ে বিকল্প মাপুন।', tip: 'একজনের সাথে কথা বললে দরকষাকষির জায়গা থাকে না।'}
          - {title: '৩. প্রমাণ চান', body: 'sandbox, রেফারেন্স গ্রাহক, uptime রেকর্ড।', tip: 'মুখের কথা নয়, নিজে পরীক্ষা করে দেখুন।'}
          - {title: '৪. চুক্তি পড়ুন', body: 'আইন বিভাগের সাথে ঝুঁকির শর্ত মিলিয়ে নিন।', tip: 'ছোট হরফের শর্তই দায়িত্ব ভাগ করে। আইনি পরামর্শ নিন।'}
          - {title: '৫. বের হওয়ার পরিকল্পনা', body: 'বদলাতে কত সময় লাগবে, আগেই লিখে রাখুন।', tip: 'সই করার আগেই জানুন কীভাবে ছাড়বেন।'}
    aside:
      - type: pitfalls
        items:
          - 'বিক্রয়ের লোকের প্রতিশ্রুতিকে চুক্তি ধরা। চুক্তিতে না থাকলে সেটা কিছু নয়।'
          - 'প্রথম বছরের কম দাম দেখে সই করা; দাম বাড়ার শর্ত না পড়ে।'
      - type: when
        use:
          - 'ভেন্ডরের হাতে ডেটা থাকলে বা সে গুরুত্বপূর্ণ পথে থাকলে, যেমন পেমেন্ট বা SMS লগইন কোড'
          - 'চুক্তিতে ন্যূনতম মেয়াদ বা লম্বা নোটিশ থাকলে'
        avoid:
          - 'মাসিক বিলের কম খরচের টুল, যা এক দিনে বদলানো যায়: শুধু দাম আর বের হওয়ার শর্ত দেখুন'
      - type: refs
        items:
          - {to: 'thinking/build-vs-buy', label: 'Build বনাম buy'}
    check:
      q: 'ভেন্ডর বদলানোর পথ রাখতে সই করার আগে কোন দুটো শর্ত সবচেয়ে বেশি দেখবেন?'
      a: 'ডেটা ফেরত (কী ফরম্যাটে, কতদিনে) আর বের হওয়ার শর্ত (নোটিশ, জরিমানা)। এ দুটো না থাকলে ভেন্ডরের জালে আটকে যাবেন।'

  - slug: hiring-scorecard
    title: 'Hiring: ভাইভা নয়, scorecard'
    kind: howto
    tldr: 'প্রতিটা প্রার্থীকে একই প্রশ্ন, একই মাপকাঠিতে নম্বর দিন, প্রমাণসহ। নইলে "ভালো লাগল" সিদ্ধান্ত হয়ে যায়।'
    keywords: ['hiring', 'interview', 'scorecard', 'structured interview', 'নিয়োগ', 'ইন্টারভিউ']
    blocks:
      - type: text
        body: |
          ইন্টারভিউয়ে দু'জন প্রার্থী। একজন আমাদের মতো কথা বলে, তাকে ভালো লাগল। অন্যজনের উত্তর কম মসৃণ, কিন্তু কোডে বেশি দক্ষ। "ভালো লাগা" দিয়ে বাছলে প্রথমজন জেতে। scorecard থাকলে আগে ঠিক করা মাপকাঠিতে নম্বর দিয়ে তুলনা হয়।
      - type: code
        lang: text
        file: 'interview-scorecard.txt'
        variant: good
        code: |
          পদ: Backend Engineer    প্রার্থী: ক    ইন্টারভিউয়ার: সুমি    তারিখ: ১০ ডিসেম্বর

          দক্ষতা                          ওজন   নম্বর(১-৪)  প্রমাণ (কী বলল/করল)
          ডিজাইন করা (trade-off বোঝা)       ৩      3        "queue আর cache-এর খরচ আলাদা করল"
          কোড ও debugging                   ৩      4        "N+1 নিজে ধরল, ঠিকও করল"
          যোগাযোগ                           2      2        "প্রশ্ন না করে ধরে নিয়ে শুরু করল"
          শেখার আগ্রহ                        2      3        "ভুল মানল, পড়ে এসেছে"

          মোট: 3×3 + 3×4 + 2×2 + 2×3 = 9 + 12 + 4 + 6 = 31 / 40
          সুপারিশ: Hire / No hire / আরেক রাউন্ড    কারণ: ........
          নিয়ম: প্রতিজন নিজের স্কোর আগে লিখবে, তারপর আলোচনা।
        marks:
          - {line: 3, tip: 'মাপকাঠি ও ওজন ইন্টারভিউয়ের আগে ঠিক করা; প্রার্থী দেখে বদলানো নয়।'}
          - {line: 4, tip: 'প্রমাণ কলাম ছাড়া নম্বর মতামত মাত্র। প্রার্থী কী বলল বা করল, তা লিখুন।'}
          - {line: 9, tip: 'অঙ্ক: ৯ + ১২ + ৪ + ৬ = ৩১, সর্বোচ্চ ৪০।'}
          - {line: 11, tip: 'আলোচনার আগে নিজের স্কোর লিখলে একজনের মতের প্রভাবে বাকিরা বদলায় না।'}
      - type: visual
        kind: compare
        caption: 'গল্পের ইন্টারভিউ বনাম structured ইন্টারভিউ'
        columns:
          - title: 'আলাপচারিতা'
            tone: bad
            icon: cross
            tip: 'প্রতি প্রার্থীর অভিজ্ঞতা আলাদা, তুলনা কঠিন; পক্ষপাত ঢোকে।'
            items:
              - 'ভিন্ন ভিন্ন প্রশ্ন'
              - '"ভালো লাগল" দিয়ে সিদ্ধান্ত'
              - 'যে আমার মতো, তাকে বেশি নম্বর'
          - title: 'Structured'
            tone: good
            icon: check
            tip: 'একই প্রশ্ন, একই মাপ। পক্ষপাত কমে, তুলনা ন্যায্য হয়।'
            items:
              - 'সবাইকে একই প্রশ্ন'
              - 'আগে ঠিক করা মাপকাঠি ও ওজন'
              - 'প্রমাণসহ নম্বর, আলাদাভাবে'
      - type: quote
        body: 'নিয়োগ সবচেয়ে দামি সিদ্ধান্তের একটা: মাপকাঠি আগে, ভালো লাগা পরে।'
    aside:
      - type: pitfalls
        items:
          - 'নিজের মতো মানুষ বাছা (culture fit-এর নামে); দক্ষতার বৈচিত্র্যও দলের শক্তি।'
          - 'শুধু trivia বা algorithm ধাঁধা জিজ্ঞেস করা, কাজের আসল পরিস্থিতি ছাড়া।'
          - 'মোট নম্বরকেই রায় ধরা। ওজনসহ যোগফলে একটা বড় ফাঁক ঢাকা পড়তে পারে; যোগ করার আগে জরুরি দক্ষতার ন্যূনতম নম্বর ঠিক করুন।'
      - type: tips
        items:
          - 'বাস্তব কাজের প্রশ্ন দিন: "এই ধীর query ঠিক করুন" বা "এই design-এ ঝুঁকি কী?"'
          - 'ইন্টারভিউয়ের পর যত দ্রুত সম্ভব নম্বর লিখুন, স্মৃতি মুছে যাওয়ার আগে।'
    check:
      q: 'Scorecard-এ "প্রমাণ" কলাম কেন রাখা হয়?'
      a: 'প্রমাণ ছাড়া নম্বর শুধু মত। প্রার্থী কী বলল বা করল তা লিখলে তুলনা ন্যায্য হয় আর পক্ষপাত ধরা পড়ে।'

flashcards:
  - q: 'Team Topologies-এ চার ধরনের টিম কী কী?'
    a: 'Stream-aligned, Platform, Enabling আর Complicated-subsystem।'
    more: |
      Stream-aligned টিম ব্যবসার একটা ধারা সামলায়। Platform টিম অন্যদের সরঞ্জাম দেয়। Enabling টিম নতুন দক্ষতা শেখায়। Complicated-subsystem টিম কঠিন বিশেষজ্ঞ অংশ দেখে। বিস্তারিত: [[thinking/conways-law|Conway's Law]]।
    ref: team-topology
  - q: 'Cognitive load কেন টিম ভাগে গুরুত্বপূর্ণ?'
    a: 'একটা টিম যতটা ধারণ করতে পারে তার সীমা আছে। বেশি দায়িত্ব দিলে মান ও গতি দুটোই পড়ে।'
    more: |
      টিমকে এমনভাবে ভাগ করুন যাতে সে নিজের এলাকা পুরোপুরি বোঝে। কঠিন বিশেষজ্ঞ অংশ বা সরঞ্জাম আলাদা টিমে দিলে স্ট্রিম টিম ব্যবসার কাজে মন দিতে পারে।
    ref: team-topology
  - q: 'কখন ইঞ্জিনিয়ারদের চার ধরনের টিমে ভাগ করবেন না?'
    a: 'প্রায় ১০ জনের কম হলে। এক টিমই সব সামলাতে পারে; চার টিম শুধু হাত-বদল বাড়ায়, সাহায্য করে না।'
    more: |
      ভাগ করুন যখন ব্যথাটা চোখে পড়ে: release একজনের পেছনে আটকায়, bug তার একমাত্র বিশেষজ্ঞের অপেক্ষায় পড়ে থাকে, বা পুরো সিস্টেম কেউ বোঝে না। তার আগে ছোট একটা টিম চারটার চেয়ে দ্রুত কথা বলে।
    ref: team-topology
  - q: 'Roadmap-এর "Now / Next / Later" কী?'
    a: 'তিন স্তর: Now নিশ্চিত, Next সম্ভাব্য, Later অনিশ্চিত — সঠিক তারিখের বদলে।'
    more: |
      দূরের তারিখে অনিশ্চয়তা বেশি। ফিচারের সঠিক তারিখ দিলে ভুল প্রতিশ্রুতি হয়। তিন স্তরে বললে ব্যবসা জানে কোনটা ভরসা করার মতো, আর কোনটা বদলাতে পারে। ফিচার নয়, ফলাফল লেখাও ভালো অভ্যাস। আইন বা উৎসব তারিখ ঠিক করে দিলে সেই তারিখ লিখে রাখুন; তিন স্তর নমনীয় তারিখের কাজের জন্য।
    ref: roadmap-dependencies
  - q: 'Dependency register-এ প্রতিটা নির্ভরতার কী কী লিখবেন?'
    a: 'মালিক, আমাদের দরকারের তারিখ, বর্তমান অবস্থা আর ঝুঁকি।'
    more: |
      মালিকহীন নির্ভরতা কেউ দেখে না। দরকারের তারিখ কাছে আর অবস্থা পিছিয়ে থাকলে সেটা সাপ্তাহিকভাবে লাল দাগ দিন, যাতে দেরিটা শেষ মুহূর্তে না, আগে ধরা পড়ে।
    ref: roadmap-dependencies
  - q: 'Three-point estimate-এর সূত্র কী?'
    a: 'প্রত্যাশিত = (best + 4 × likely + worst) ÷ 6। এটাকে PERT বলা হয়।'
    more: |
      যেমন best 3, likely 5, worst 10 হলে (3 + 20 + 10) ÷ 6 = 5.5 দিন। সবচেয়ে সম্ভাব্য মানকে চারগুণ গুরুত্ব দেওয়া হয়। সূত্র অনুমানের ভুল দূর করে না, তবে খারাপ পরিস্থিতিকেও হিসাবে আনে।
    ref: estimation-ranges
  - q: 'আন্দাজ জানাতে একক সংখ্যা না বলে কী বলবেন?'
    a: 'পরিসর ও অনুমান: "প্রায় ১৮ দিন, সম্ভবত ১৫ থেকে ২১, যদি ভেন্ডরের sandbox সময়মতো আসে।"'
    more: |
      একক সংখ্যা শুনলে মানুষ সেটাকে প্রতিশ্রুতি ধরে। পরিসর অনিশ্চয়তা দেখায়, আর অনুমান লিখে রাখলে ভুল হলে কারণ আলোচনা সহজ হয়। অনিশ্চয়তার বড় উৎস আগে ছোট করুন।
    ref: estimation-ranges
  - q: 'তিন-বিন্দুর আন্দাজ থেকে পুরো কাজের পরিসর কীভাবে বের করবেন?'
    a: 'একটা কাজের ছড়ান = (worst − best) ÷ 6। মোট ছড়ান = বর্গের যোগফলের বর্গমূল। পরিসর = প্রত্যাশিত মোট ± সেই ছড়ান।'
    more: |
      ধরুন তিন কাজের ছড়ান ১.২, ০.৭ আর ২.৫: বর্গের যোগ প্রায় ৮.২, বর্গমূল ২.৯। প্রত্যাশিত মোট ১৮ হলে পরিসর ১৫ থেকে ২১ দিন, মোটামুটি তিনবারে দুইবার। ভেন্ডরের দেরির মতো সবার ওপর পড়া ঝুঁকি এই হিসাবের বাইরে; সেটা অনুমান হিসেবে লিখুন।
    ref: estimation-ranges
  - q: 'Vendor চুক্তিতে lock-in এড়াতে কোন দুটো শর্ত দেখবেন?'
    a: 'ডেটা ফেরত পাওয়ার ফরম্যাট ও সময়, আর বের হওয়ার শর্ত (নোটিশ ও জরিমানা)।'
    more: |
      ডেটা ফেরত না পেলে বা বের হওয়া ব্যয়বহুল হলে ভেন্ডর বদলানো যায় না, ফলে দরকষাকষির শক্তি যায়। এ ছাড়াও SLA ও ক্ষতিপূরণ, দাম বাড়ানোর শর্ত আর দায়বদ্ধতার সীমা দেখুন। বিস্তারিত: [[thinking/build-vs-buy|build vs buy]]।
    ref: vendor-contract
  - q: '৯৯.৯% আপটাইমের প্রতিশ্রুতিতেও (SLA) কতটা বন্ধ থাকা চলে?'
    a: 'মাসে প্রায় ৪৩ মিনিট। ৯৯% হলে ৭ ঘণ্টার বেশি। ক্ষতিপূরণ না থাকলে প্রতিশ্রুতির দাম কম।'
    more: |
      এক মাসে প্রায় ৪৩,২০০ মিনিট; তার ০.১% প্রায় ৪৩। জিজ্ঞেস করুন, ভেন্ডর সংখ্যা ছুঁতে না পারলে কী দেবে, আর বন্ধ থাকার সময় কীভাবে মাপা হয়।
    ref: vendor-contract
  - q: 'Hiring scorecard কেন ব্যবহার করা হয়?'
    a: 'সব প্রার্থীকে একই মাপকাঠিতে প্রমাণসহ নম্বর দিতে, যাতে "ভালো লাগা" নয়, দক্ষতা দিয়ে সিদ্ধান্ত হয়।'
    more: |
      মাপকাঠি ও ওজন আগে ঠিক হয়। প্রতিজন ইন্টারভিউয়ার নিজের নম্বর আর প্রমাণ আলাদাভাবে লেখে, তারপর আলোচনা হয়। এতে একজনের মতের প্রভাব কমে আর পক্ষপাত ধরা পড়ে।
    ref: hiring-scorecard

quiz:
  - q: 'আমাদের ফিচার পেমেন্ট টিমের API-র ওপর নির্ভর করে, কিন্তু সেটা এখনো ডিজাইনে। দরকারের তারিখ ২ সপ্তাহ পরে। কী করবেন?'
    hint: 'দেরিটা শেষ মুহূর্তে ধরা পড়লে কী হয়?'
    options:
      - text: 'অপেক্ষা করা; ওরা নিশ্চয়ই সময়মতো দেবে'
        correct: false
        why: 'আশা করা পরিকল্পনা নয়। দেরি ধরা পড়বে যখন কিছু করার সময় থাকবে না।'
      - text: 'dependency register-এ লাল দাগ দিয়ে মালিকের সাথে সরাসরি কথা বলা, প্রয়োজনে বিকল্প বা stub ঠিক করা'
        correct: true
        why: 'আগে থেকে ঝুঁকি জানলে সমাধানের সময় থাকে; মালিকের সাথে সরাসরি কথা সবচেয়ে কার্যকর।'
      - text: 'নিজে পেমেন্ট টিমের কোড লিখে ফেলা'
        correct: false
        why: 'অন্য টিমের সীমানায় ঢোকা দ্বন্দ্ব ও ভুল বাড়ায়।'
      - text: 'রোডম্যাপ থেকে ফিচারটাই বাদ দেওয়া'
        correct: false
        why: 'ব্যবসার ক্ষতি; আগে সমাধান খুঁজতে হবে।'
    ref: roadmap-dependencies
  - q: 'একটা টিম একসাথে চেকআউট, জটিল মূল্য নির্ধারণের ML মডেল আর CI/CD সামলায়, ফলে সব ধীর। কী করবেন?'
