slides:
  - slug: cashier-does-everything
    title: 'এক বাটনে সাড়ে ছয় সেকেন্ডের অপেক্ষা'
    kind: story
    tldr: 'অর্ডার save-এর সাথে ইমেইল, SMS, PDF আর কুরিয়ার API একই request-এ করলে ক্রেতা বসে থাকে, আর একটা ভাঙলে সবটাই ভাঙে।'
    keywords: ['async', 'synchronous', 'slow request', 'background work', 'ধীর request', 'ব্যাকগ্রাউন্ড কাজ']
    blocks:
      - type: metaphor
        icon: shop
        title: 'বিরিয়ানির হোটেলের ক্যাশিয়ার'
        body: |
          এক হোটেলের ক্যাশিয়ার অর্ডার নিয়ে নিজেই রান্নাঘরে গিয়ে বিরিয়ানি বাড়েন, প্যাকেট করেন, ডেলিভারি বয়কে খুঁজে আনেন — তারপর পরের খদ্দেরকে ডাকেন। লাইন রাস্তায় গিয়ে ঠেকে, আর ডেলিভারি বয় না থাকলে পুরো অর্ডারই বাতিল। বুদ্ধিমান ক্যাশিয়ার শুধু টাকা নেন, একটা স্লিপ লিখে রান্নাঘরে পাঠান, আর পরের জনকে ডাকেন। নিচের controller হলো প্রথম ক্যাশিয়ার।
      - type: code
        lang: php
        file: 'src/Controller/OrderController.php'
        variant: bad
        code: |
          #[Route('/orders', methods: ['POST'])]
          public function create(#[MapRequestPayload] CreateOrder $dto): JsonResponse
          {
              $order = $this->orders->place($dto, $this->getUser());    // 40ms

              $this->mailer->send($this->emails->orderPlaced($order));  // 1.8s
              $this->texter->send(new SmsMessage($order->getPhone(), 'অর্ডার পেয়েছি')); // 1.2s
              $this->invoices->generatePdf($order);                      // 0.9s
              $this->courier->book($order);                              // 2.5s — বাইরের API

              return $this->json(['id' => $order->getId()], 201);
          }
        marks:
          - {line: 4, tip: 'ক্রেতার যা দরকার তা এই এক লাইনেই শেষ: অর্ডারটা ডেটাবেসে বসে গেছে।'}
          - {line: 6, tip: 'ইমেইল সার্ভার ধীর হলে পুরো request ধীর — অথচ ইমেইলটা দশ সেকেন্ড পরে গেলেও কারো ক্ষতি নেই।'}
          - {line: 9, tip: 'কুরিয়ারের API বন্ধ থাকলে এখানে exception ওঠে; ক্রেতা দেখে "অর্ডার ব্যর্থ", যদিও অর্ডার ডেটাবেসে আছে।'}
      - type: visual
        kind: bars
        caption: 'এক request-এর ৬.৪ সেকেন্ড কোথায় গেল'
        items:
          - {label: 'অর্ডার save', value: 40, display: '40ms', tone: good, tip: 'একমাত্র কাজ, যেটা না হলে ক্রেতাকে অর্ডার নম্বর দেওয়াই যায় না।'}
          - {label: 'ইমেইল', value: 1800, display: '1.8s', tip: 'বাইরের ইমেইল সার্ভারের উত্তরের অপেক্ষা। পরে পাঠালেও চলে।'}
          - {label: 'SMS', value: 1200, display: '1.2s', tip: 'SMS gateway-র অপেক্ষা। gateway ধীর হলে এই সময় ৩০ সেকেন্ডও হতে পারে।'}
          - {label: 'ইনভয়েস PDF', value: 900, display: '0.9s', tip: 'CPU-র ভারী কাজ; ক্রেতা PDF-টা এই মুহূর্তে খুলছেও না।'}
          - {label: 'কুরিয়ার API', value: 2500, display: '2.5s', tone: bad, tip: 'সবচেয়ে ধীর এবং সবচেয়ে ভঙ্গুর ধাপ — অন্য কোম্পানির সার্ভার, যার ওপর তোমার কোনো হাত নেই।'}
      - type: quote
        body: 'ব্যবহারকারীকে শুধু সেটুকুর জন্য অপেক্ষা করাও, যেটুকু ছাড়া উত্তর দেওয়াই যায় না।'
    aside:
      - type: story
        title: 'সেলের রাতে তিনগুণ অর্ডার'
        body: |
          একটা অনলাইন শপে সেলের রাতে SMS gateway ধীর হয়ে গেল। SMS পাঠানো ছিল অর্ডারের request-এর ভেতরে, তাই প্রতিটা অর্ডারে আধা মিনিট লাগছিল। অধৈর্য ক্রেতারা বারবার "অর্ডার করুন" চাপল, আর একই অর্ডার তিনবার করে পড়ল। সমস্যা ছিল SMS-এ, ভাঙল অর্ডার।
      - type: terms
        items:
          - {term: 'Synchronous (sync)', meaning: 'কাজ শেষ না হওয়া পর্যন্ত দাঁড়িয়ে অপেক্ষা করা।'}
          - {term: 'Asynchronous (async)', meaning: 'কাজটা "পরে হবে" বলে লিখে রেখে নিজের কাজে ফিরে যাওয়া।'}
      - type: refs
        items:
          - {to: 'resilience/containing-failure', label: 'একটার ভাঙন অন্যটায় ছড়াতে না দেওয়া'}
    check:
      q: 'controller-এর পাঁচটা কাজের কোনটা request-এর ভেতরে থাকতেই হবে, আর কেন?'
      a: 'শুধু অর্ডার save — ওটা ছাড়া ক্রেতাকে অর্ডার নম্বরই দেওয়া যায় না। ইমেইল, SMS, PDF আর কুরিয়ার বুকিং কয়েক সেকেন্ড পরে হলেও কারো ক্ষতি নেই।'

  - slug: command-vs-event
    title: 'Command বলে "এটা করো", event বলে "এটা ঘটেছে"'
    kind: concept
    tldr: 'Command একজন নির্দিষ্ট handler-কে কাজের আদেশ দেয়; event শুধু জানায় কী ঘটেছে, আর শূন্য থেকে অনেক listener নিজের মতো সাড়া দেয়।'
    keywords: ['command', 'event', 'message', 'pub/sub', 'decoupling', 'ইভেন্ট', 'কমান্ড']
    blocks:
      - type: metaphor
        icon: bell
        title: 'রান্নাঘরের স্লিপ আর কাউন্টারের ঘণ্টা'
        body: |
          ক্যাশিয়ার রান্নাঘরে স্লিপ পাঠান: "টেবিল ৫-এ দুই প্লেট কাচ্চি দাও"। এটা **command** — একজন নির্দিষ্ট লোকের জন্য আদেশ, আর কাজটা হওয়া চাই। আবার তিনি ঘণ্টা বাজিয়ে ঘোষণাও করতে পারেন: "অর্ডার ৪২ নেওয়া হয়েছে"। এটা **event** — রাঁধুনি, হিসাবরক্ষক, ডেলিভারি বয়, যার দরকার সে শুনে নিজের কাজ ধরে; ক্যাশিয়ার জানেনও না কে কে শুনছে।
      - type: visual
        kind: compare
        caption: 'একই অর্ডার, দুই রকম বার্তা'
        columns:
          - title: 'Command'
            icon: send
            tip: 'একটা কাজের আদেশ। প্রেরক জানে কাকে বলছে, আর আশা করে কাজটা হবে।'
            items:
              - 'নাম আদেশের সুরে: SendInvoiceEmail'
              - 'handler ঠিক একটা'
              - 'প্রেরক জানে কাজটা কে করবে'
              - 'নতুন কাজ যোগ করতে প্রেরকের কোড বদলাতে হয়'
          - title: 'Event'
            icon: megaphone
            tone: accent
            tip: 'ঘটে যাওয়া একটা ঘটনার ঘোষণা। কে শুনবে, তা প্রেরকের জানার দরকারই নেই।'
            items:
              - 'নাম অতীত কালে: OrderPlaced'
              - 'handler শূন্য, এক বা অনেক'
              - 'প্রেরক জানে না কে শুনছে'
              - 'নতুন কাজ মানে শুধু নতুন একটা handler'
      - type: text
        body: |
          আসল পার্থক্য নামে নয়, **কে কাকে চেনে** তাতে। Command পাঠালে অর্ডারের কোড ইমেইল, কুরিয়ার, ইনভয়েস — সবার কথা জানে। Event ছড়ালে অর্ডারের কোড কাউকেই চেনে না; কাল "লয়্যালটি পয়েন্ট" যোগ করতে হলে অর্ডারের কোডে হাতই দিতে হয় না।
      - type: quote
        body: 'Command বলে "এটা করো"। Event বলে "এটা ঘটেছে"।'
    aside:
      - type: tips
        items:
          - 'Command-এর নাম ক্রিয়াপদ দিয়ে শুরু করো: `GenerateInvoicePdf`, `BookCourier`।'
          - 'Event-এর নাম অতীত কালে রাখো: `OrderPlaced`, `PaymentFailed`।'
          - 'Event-এ রাখো কী ঘটেছে আর তার id — কে কী করবে সেই নির্দেশ নয়।'
      - type: pitfalls
        items:
          - '`OrderPlacedSendEmail` নামের event আসলে ছদ্মবেশী command — প্রেরক আবার listener-এর কাজ ঠিক করে দিচ্ছে।'
          - 'প্রেরক যদি কোনো listener-এর ফলের অপেক্ষায় থাকে, সেটা আর event নয়; সরাসরি method call বা command ব্যবহার করো।'
      - type: refs
        items:
          - {to: 'thinking/event-driven-cqrs', label: 'Event-driven আর্কিটেকচার এক নজরে'}
    check:
      q: 'অর্ডারের পর ইমেইল, কুরিয়ার বুকিং আর লয়্যালটি পয়েন্ট — তিনটাই দরকার। কোনটা দিয়ে শুরু করলে পরে অর্ডারের কোড কম বদলাবে, কেন?'
      a: 'Event (`OrderPlaced`) দিয়ে। অর্ডারের কোড শুধু ঘটনাটা ঘোষণা করে, তিনটা আলাদা handler সেটা শোনে। চতুর্থ কাজ এলে নতুন handler যোগ হয়; অর্ডারের কোড ছুঁতে হয় না।'

  - slug: messenger-basics
    title: 'Symfony Messenger: message, handler, transport, worker'
    kind: howto
    tldr: 'Message একটা ছোট DTO, handler কাজটা করে, transport বার্তা জমা রাখে, আর worker আলাদা process-এ সেটা তুলে handler চালায়।'
    keywords: ['Symfony Messenger', 'message bus', 'handler', 'transport', 'worker', 'messenger:consume', 'routing', 'মেসেঞ্জার']
    blocks:
      - type: text
        body: |
          Messenger-এ চারটা অংশ। Controller শুধু `$bus->dispatch(new OrderPlaced($order->getId()))` ডাকে আর সাথে সাথে ফিরে আসে। বার্তাটা **transport**-এ (queue) জমা হয়; আলাদা একটা process, **worker**, সেটা তুলে **handler** চালায়। মনে রেখো: `routing` না লিখলে handler-টা request-এর ভেতরেই চলে — কিছুই async হয় না।
      - type: visual
        kind: flow
        caption: 'একটা OrderPlaced বার্তার যাত্রা'
        nodes:
          - {id: ctrl, label: 'Controller', sub: 'dispatch() ডাকে', icon: api, col: 0, row: 0, tip: 'অর্ডার save করার পর শুধু বার্তাটা bus-এ দেয়; ইমেইল পাঠানোর কোড এখানে নেই।'}
          - {id: bus, label: 'Message bus', sub: 'routing দেখে', icon: shuffle, col: 1.5, row: 0, tip: 'বার্তার class দেখে ঠিক করে: এখনই handler চালাবে, নাকি কোনো transport-এ পাঠাবে।'}
          - {id: transport, label: 'Transport: async', sub: 'queue-তে জমা', icon: queue, tone: accent, col: 3, row: 0, tip: 'বার্তা জমা রাখার জায়গা — Doctrine টেবিল, RabbitMQ, SQS বা Redis। worker না তোলা পর্যন্ত বার্তা এখানেই নিরাপদে থাকে।'}
          - {id: worker, label: 'Worker', sub: 'messenger:consume', icon: worker, col: 3, row: 1.5, tip: 'আলাদা, লম্বা সময় চলা PHP process। web request-এর সাথে এর কোনো সম্পর্ক নেই।'}
          - {id: handler, label: 'Handler', sub: 'ইমেইল পাঠায়', icon: mail, col: 1.5, row: 1.5, tip: 'আসল কাজের কোড। এখানে ধীর হলে বা ব্যর্থ হলে ক্রেতা টেরও পায় না।'}
          - {id: user, label: 'ক্রেতা', sub: '201 পেয়ে গেছে', icon: user, col: 0, row: 1.5, tip: 'অর্ডার নম্বর হাতে পেয়ে গেছে ৪০ মিলিসেকেন্ডে; ইমেইল আসবে কয়েক সেকেন্ড পরে।'}
        edges:
          - {from: ctrl, to: bus, label: 'Controller বার্তাটা bus-এ দেয়'}
          - {from: bus, to: transport, label: 'routing বলে: এই বার্তা async transport-এ যাবে'}
          - {from: ctrl, to: user, label: 'ক্রেতা সাথে সাথে উত্তর পায় — কাজ তখনো বাকি', tone: good}
          - {from: transport, to: worker, label: 'worker queue থেকে বার্তাটা তোলে', dashed: true}
          - {from: worker, to: handler, label: 'বার্তার class মিলিয়ে ঠিক handler-টা চালায়'}
      - type: code
        lang: php
        file: 'src/MessageHandler/SendOrderEmailHandler.php'
        variant: good
        code: |
          // src/Message/OrderPlaced.php
          final readonly class OrderPlaced
          {
              public function __construct(public int $orderId) {}
          }

          #[AsMessageHandler]
          final readonly class SendOrderEmailHandler
          {
              public function __construct(
                  private OrderRepository $orders,
                  private MailerInterface $mailer,
              ) {}

              public function __invoke(OrderPlaced $event): void
              {
                  $order = $this->orders->find($event->orderId);
                  if (null === $order) {
                      return; // অর্ডারটা আর নেই — করার কিছু নেই
                  }

                  $this->mailer->send((new TemplatedEmail())
                      ->to($order->getCustomerEmail())
                      ->subject('অর্ডার #'.$order->getId().' পেয়েছি')
                      ->htmlTemplate('email/order_placed.html.twig')
                      ->context(['order' => $order]));
              }
          }
        marks:
          - {line: 4, tip: 'বার্তায় শুধু id। পুরো entity রাখলে worker পায় পুরনো কপি — queue-তে বসে থাকার সময় অর্ডারটা বদলে যেতে পারে।'}
          - {line: 7, tip: 'এই attribute দেখে Messenger বোঝে: `__invoke()`-এর type-hint যে class-এর, এটা সেই বার্তার handler।'}
          - {line: 17, tip: 'handler প্রতিবার ডেটাবেস থেকে টাটকা অর্ডার পড়ে নেয়।'}
      - type: code
        lang: yaml
        file: 'config/packages/messenger.yaml'
        code: |
          framework:
              messenger:
                  transports:
                      # doctrine://default, amqp://… বা sqs://… — কোড বদলায় না
                      async: '%env(MESSENGER_TRANSPORT_DSN)%'

                  routing:
                      # এই লাইন না থাকলে handler request-এর ভেতরেই চলবে
                      'App\Message\OrderPlaced': async
        marks:
          - {line: 5, tip: 'transport বদলাতে শুধু `.env`-এর DSN বদলাও। ছোট অ্যাপে Doctrine transport দিয়ে শুরু করাই যথেষ্ট — আলাদা সার্ভার লাগে না।'}
          - {line: 9, tip: 'বার্তার class → transport। এখানে নাম না থাকলে Messenger বার্তাটা কোথাও পাঠায় না, সাথে সাথে handler চালিয়ে দেয়।'}
    aside:
      - type: commands
        title: 'Messenger কমান্ড'
        items:
          - {cmd: 'php bin/console messenger:consume async -vv', desc: 'worker চালু করো; -vv দিলে প্রতিটা বার্তা পর্দায় দেখায়'}
          - {cmd: 'php bin/console debug:messenger', desc: 'কোন বার্তার কোন handler, তার তালিকা'}
          - {cmd: 'php bin/console messenger:stats', desc: 'কোন transport-এ কয়টা বার্তা জমে আছে'}
          - {cmd: 'php bin/console messenger:stop-workers', desc: 'deploy-এর পর worker-দের থামাও, যাতে নতুন কোড নিয়ে আবার ওঠে'}
      - type: pitfalls
        items:
          - 'Worker লম্বা সময় চলে, তাই deploy করলেও পুরনো কোড মেমোরিতে থেকে যায়। প্রতি deploy-এ `messenger:stop-workers` চালাও।'
          - 'প্রোডাকশনে worker চালাও Supervisor বা systemd দিয়ে, যাতে বন্ধ হলে নিজে থেকে আবার ওঠে।'
          - '`--time-limit=3600` বা `--memory-limit=128M` দিয়ে worker-কে নিয়মিত নতুন করে চালু হতে দাও।'
      - type: refs
        items:
          - {to: 'messaging/dlq-retries', label: 'handler ব্যর্থ হলে কী হয়: retry ও DLQ'}
    check:
      q: 'messenger.yaml-এর routing-এ বার্তার নাম লিখতে ভুলে গেলে ঠিক কী ঘটবে?'
      a: 'Messenger বার্তাটা কোনো transport-এ পাঠাবে না; handler-টা `dispatch()`-এর ভেতরেই, অর্থাৎ request-এর মধ্যেই চলবে। কোড কাজ করবে, কিন্তু কিছুই async হবে না।'

  - slug: queue-vs-stream
    title: 'Queue বনাম stream: স্লিপের কাঁটা আর হিসাবের খাতা'
    kind: compare
    tldr: 'Queue একটা বার্তা একজন worker-কে দেয় আর কাজ শেষে মুছে ফেলে; stream সব বার্তা ক্রমে জমিয়ে রাখে, প্রত্যেক পাঠক নিজের জায়গা থেকে পড়ে।'
    keywords: ['queue', 'stream', 'log', 'RabbitMQ', 'SQS', 'Kafka', 'offset', 'consumer group', 'কিউ']
    blocks:
      - type: metaphor
        icon: receipt
        title: 'স্লিপের কাঁটা আর হিসাবের খাতা'
        body: |
          রান্নাঘরের কাঁটায় গাঁথা স্লিপ হলো **queue**: একজন রাঁধুনি একটা স্লিপ নেন, রান্না শেষে ছিঁড়ে ফেলেন — স্লিপটা আর কেউ পায় না। হোটেলের হিসাবের খাতা হলো **stream**: প্রতিটা অর্ডার পরপর লেখা থাকে, কেউ মোছে না। মালিক, হিসাবরক্ষক আর ভ্যাট অফিসার — তিনজনই পুরো খাতা পড়েন, যে যার বুকমার্ক থেকে; চাইলে প্রথম পাতা থেকে আবারও।
      - type: visual
        kind: table
        caption: 'Queue আর stream — কে কী করে'
        headers: ['', 'Queue', 'Stream / log']
        rows:
          - cells: ['উদাহরণ', 'RabbitMQ, Amazon SQS', 'Kafka, Redpanda, Kinesis']
            tip: 'Symfony Messenger-এর Doctrine, AMQP, SQS ও Redis transport — সবগুলোই queue-র মতো আচরণ করে।'
          - cells: ['কাজ শেষ হলে', 'বার্তা মুছে যায়', 'বার্তা থেকে যায়']
            tip: 'Queue-তে ack মানেই বার্তার শেষ। Stream-এ বার্তা মোছে শুধু retention-এর মেয়াদ (যেমন ৭ দিন) পেরোলে।'
          - cells: ['একটা বার্তা কে পায়', 'worker-দের যেকোনো একজন', 'প্রতিটা consumer group']
            tip: 'Queue-তে worker-রা একই কাজের ভাগীদার। Stream-এ প্রতিটা দল (consumer group) আলাদাভাবে পুরো খাতাটাই পড়ে।'
          - cells: ['কোথায় আছি কে মনে রাখে', 'broker', 'পাঠক নিজে (offset)']
            tip: 'Offset হলো খাতার কোন লাইন পর্যন্ত পড়া হয়েছে তার বুকমার্ক। প্রতিটা consumer group-এর নিজের offset থাকে।'
          - cells: ['পুরনো বার্তা আবার পড়া', 'যায় না', 'offset পিছিয়ে replay']
            tip: 'নতুন একটা সার্ভিস যোগ হলে stream-এ সে প্রথম থেকে সব ইতিহাস পড়ে নিতে পারে; queue-তে পুরনো বার্তা আর নেই।'
          - cells: ['সবচেয়ে মানানসই', 'ব্যাকগ্রাউন্ড কাজ বিলি', 'অনেক সার্ভিসে ঘটনার ইতিহাস']
            tip: 'Queue কাজ ভাগ করে দেয়, প্রতিটা বার্তায় আলাদা retry চলে। Stream ঘটনার ধারাবাহিক ইতিহাস রাখে — analytics, CDC, event sourcing-এ লাগে।'
      - type: points
        title: 'কোনটা নেবে'
        style: check
        items:
          - 'ইমেইল, PDF, API call-এর মতো "একবার করে ফেলো" কাজ → queue। বেশিরভাগ অ্যাপের জন্য এটুকুই যথেষ্ট।'
          - 'একই ঘটনা অনেক সার্ভিস আলাদাভাবে পড়বে, বা পুরনো ঘটনা replay করতে হবে → stream।'
          - 'Kafka চালানো আলাদা একটা দক্ষতা। দরকার প্রমাণ না হওয়া পর্যন্ত queue দিয়েই চালাও।'
    aside:
      - type: terms
        items:
          - {term: 'Broker', meaning: 'বার্তা জমা রাখা ও বিলি করার সার্ভার — RabbitMQ, Kafka ইত্যাদি।'}
          - {term: 'Consumer group', meaning: 'একই কাজ ভাগ করে নেওয়া পাঠকদের দল; পুরো দল মিলে প্রতিটা বার্তা একবার পায়।'}
          - {term: 'Offset', meaning: 'stream-এ কোন পর্যন্ত পড়া হয়েছে তার ক্রমিক নম্বর।'}
          - {term: 'Retention', meaning: 'stream-এ বার্তা কত দিন জমা থাকবে তার মেয়াদ।'}
      - type: pitfalls
        items:
          - 'শুধু ইমেইল পাঠানোর জন্য Kafka বসানো — কামান দিয়ে মশা মারা।'
          - 'Queue-কে ঘটনার স্থায়ী ইতিহাস ভাবা। কাজ শেষ হলেই বার্তা নেই; ইতিহাস লাগলে ডেটাবেসে বা stream-এ রাখো।'
      - type: refs
        items:
          - {to: 'messaging/delivery-guarantees', label: 'Ordering ও partition'}
          - {to: 'api/api-styles', label: 'REST, GraphQL, gRPC নাকি message?'}
    check:
      q: 'নতুন একটা analytics সার্ভিস গত ৭ দিনের সব অর্ডার-ঘটনা পড়তে চায়। Queue-তে এটা কেন সম্ভব নয়, stream-এ কেন সম্ভব?'
      a: 'Queue-তে worker কাজ শেষ করলেই বার্তা মুছে যায়। Stream-এ বার্তা retention পর্যন্ত থেকে যায়, তাই নতুন consumer group একদম শুরুর offset থেকে পড়া ধরতে পারে।'

  - slug: async-is-not-done
    title: 'ফাঁদ: queue-তে দেওয়া মানেই "হয়ে গেছে" নয়'
    kind: pitfall
    tldr: 'dispatch() মানে কাজটা লেখা হলো, করা হয়নি। যে উত্তর ব্যবহারকারীর এখনই দরকার, সেটা async করলে তাকে মিথ্যা বলতে হয়।'
    keywords: ['202 Accepted', 'pending', 'eventual consistency', 'when to go async', 'কখন async', 'status']
    blocks:
      - type: text
        body: |
          async-এর দাম আছে: কাজটা **কখন** শেষ হবে তুমি জানো না, ব্যর্থ হলে ব্যবহারকারী আর পাতায় নেই, আর একই বার্তা দুইবারও আসতে পারে। তাই যে ফল ব্যবহারকারীর এই মুহূর্তেই জানা দরকার, সেটা queue-তে ফেলে "হয়ে গেছে" বলা যায় না। নিচের প্রথম কোড টাকা কাটার আগেই বলে দিচ্ছে "paid"।
      - type: code
        lang: php
        file: 'src/Controller/PaymentController.php'
        variant: bad
        code: |
          #[Route('/orders/{id}/pay', methods: ['POST'])]
          #[IsGranted('PAY', subject: 'order')]
          public function pay(Order $order, MessageBusInterface $bus): JsonResponse
          {
              $bus->dispatch(new ChargeOrder($order->getId()));   // শুধু queue-তে লেখা হলো

              return $this->json(['status' => 'paid']);           // মিথ্যা: টাকা এখনো কাটেনি
          }
        marks:
          - {line: 7, tip: 'worker হয়তো ৩ সেকেন্ড পরে চলবে, হয়তো ব্যর্থ হবে। ততক্ষণে ক্রেতা "পেমেন্ট সফল" দেখে পাতা বন্ধ করে দিয়েছে।'}
      - type: code
        lang: php
        file: 'src/Controller/PaymentController.php'
        variant: good
        code: |
          #[Route('/orders/{id}/pay', methods: ['POST'])]
          #[IsGranted('PAY', subject: 'order')]
          public function pay(
              Order $order,
              OrderService $orders,
              MessageBusInterface $bus,
          ): JsonResponse {
              $orders->markPaymentPending($order);                // অবস্থা pending, flush সহ
              $bus->dispatch(new ChargeOrder($order->getId()));

              return $this->json(
                  ['status' => 'pending', 'statusUrl' => '/orders/'.$order->getId()],
                  Response::HTTP_ACCEPTED,                        // 202: পেয়েছি, কাজ চলছে
              );
          }
        marks:
          - {line: 8, tip: 'আগে ডেটাবেসে সত্যি অবস্থাটা লেখো আর commit করো, তারপর dispatch। উল্টো করলে worker এমন অর্ডার খুঁজবে যা এখনো save-ই হয়নি।'}
          - {line: 13, tip: '`202 Accepted` মানে "অনুরোধ পেয়েছি, এখনো শেষ হয়নি"। client `statusUrl` দেখে বা live আপডেট পেয়ে চূড়ান্ত ফল জানবে।'}
      - type: visual
        kind: compare
        caption: 'কোন কাজ queue-তে যাবে, কোনটা request-এ থাকবে'
        columns:
          - title: 'Async-এ পাঠাও'
            tone: good
            icon: queue
            tip: 'এই কাজগুলো একটু পরে হলে ব্যবহারকারীর ক্ষতি নেই, আর আলাদা করলে একটার ভাঙন অর্ডারকে ছোঁয় না।'
            items:
              - 'ধীর কাজ: ইমেইল, SMS, PDF, রিপোর্ট'
              - 'বাইরের API, যা যখন-তখন বন্ধ থাকতে পারে'
              - 'যার ফল কয়েক সেকেন্ড পরে জানলেও চলে'
              - 'ব্যর্থ হলে যা নিজে থেকে আবার চেষ্টা করা যায়'
          - title: 'Request-এই রাখো'
            tone: warn
            icon: stopwatch
            tip: 'এগুলোর উত্তর ছাড়া ব্যবহারকারীকে সত্যি কথা বলা যায় না — তাই একটু অপেক্ষা করানোই ঠিক।'
            items:
              - 'ইনপুট validation'
              - 'স্টক বা সিট আছে কি না দেখা ও ধরে রাখা'
              - 'যে ফল দেখে ব্যবহারকারী পরের সিদ্ধান্ত নেবে'
              - 'দ্রুত কাজ, যা একই transaction-এ থাকা চাই'
      - type: quote
        body: 'dispatch() মানে কাজটা লেখা হয়েছে, করা হয়নি।'
    aside:
      - type: remember
        body: 'এখনই জানা দরকার? তাহলে sync। পরে জানলেও চলে? তাহলে async — আর উত্তরে সত্যি অবস্থা: "pending"।'
      - type: pitfalls
        items:
          - 'transaction commit হওয়ার আগে dispatch করলে worker এমন সারি খুঁজতে পারে, যা তার চোখে এখনো নেই। আগে commit, পরে dispatch।'
          - 'async করলেই handler-কে দুইবার চলার জন্য তৈরি থাকতে হয় — একই বার্তা আবার আসতে পারে।'
      - type: refs
        items:
          - {to: 'workflows/outbox-inbox', label: 'commit আর dispatch একসাথে নিশ্চিত করা: outbox'}
          - {to: 'interaction/realtime-delivery', label: 'কাজ শেষ হলে ব্যবহারকারীকে জানানো'}
    check:
      q: 'কাজ queue-তে পাঠানোর পর API-র কোন status code আর কোন অবস্থা ফেরত দেওয়া সৎ উত্তর, কেন?'
      a: '`202 Accepted` আর `pending` অবস্থা, সাথে অবস্থা জানার URL। `200`/`paid` বললে সেটা মিথ্যা — কাজটা তখনো হয়নি, ব্যর্থও হতে পারে।'

flashcards:
  - q: 'Command আর event-এর মূল পার্থক্য কী?'
    a: 'Command একটা কাজের আদেশ ("এটা করো"), handler ঠিক একটা। Event ঘটে যাওয়া ঘটনার ঘোষণা ("এটা ঘটেছে"), handler শূন্য থেকে অনেক।'
    more: |
      Command-এ প্রেরক জানে কে কাজটা করবে এবং আশা করে সেটা হবে। Event-এ প্রেরক শুধু ঘটনাটা জানায়; কে শুনছে তা তার জানার দরকার নেই। তাই event দিয়ে নতুন কাজ যোগ করা যায় প্রেরকের কোড না বদলে — শুধু নতুন একটা handler লিখে।
    ref: command-vs-event
  - q: 'Command আর event-এর নাম কীভাবে রাখা হয়?'
    a: 'Command আদেশের সুরে: `SendInvoiceEmail`, `BookCourier`। Event অতীত কালে: `OrderPlaced`, `PaymentFailed`।'
    more: |
      নাম দেখেই বোঝা উচিত বার্তাটা আদেশ নাকি খবর। `OrderPlacedSendEmail`-এর মতো নাম বিপদের সংকেত: এটা event-এর ছদ্মবেশে command, যেখানে প্রেরক আবার listener-এর কাজ ঠিক করে দিচ্ছে। তখন event-এর আসল সুবিধা — প্রেরক কাউকে চেনে না — হারিয়ে যায়।
    ref: command-vs-event
  - q: 'Symfony Messenger-এর চারটা অংশ কী কী?'
    a: 'Message (ছোট DTO), handler (কাজটা করে), transport (বার্তা জমা রাখে) আর worker (transport থেকে বার্তা তুলে handler চালায়)।'
    more: |
      Controller `$bus->dispatch()` ডেকে সাথে সাথে ফিরে আসে। বার্তাটা transport-এ, যেমন Doctrine টেবিল বা RabbitMQ-তে, জমা থাকে। আলাদা process হিসেবে চলা worker (`messenger:consume async`) বার্তা তুলে `#[AsMessageHandler]` দেওয়া class-টা চালায়।
    ref: messenger-basics
  - q: 'Messenger-এর message-এ পুরো entity না রেখে শুধু id রাখা হয় কেন?'
    a: 'বার্তা serialize হয়ে queue-তে বসে থাকে; ততক্ষণে entity বদলে যেতে পারে। handler id দিয়ে ডেটাবেস থেকে টাটকা ডেটা পড়ে নেয়।'
    more: |
      Entity serialize করলে worker পায় পুরনো একটা কপি, যার সাথে Doctrine-এর কোনো সংযোগ নেই। বার্তা বড়ও হয়, আর entity-র গঠন বদলালে queue-তে জমে থাকা পুরনো বার্তা ভেঙে যায়। তাই বার্তায় থাকে শুধু id আর দু-একটা ছোট মান।
    ref: messenger-basics
  - q: 'Messenger-এ routing-এ বার্তার নাম না থাকলে কী হয়?'
    a: 'বার্তা কোনো transport-এ যায় না; handler `dispatch()`-এর ভেতরেই, অর্থাৎ request-এর মধ্যেই চলে।'
    more: |
      এটা নতুনদের সবচেয়ে পরিচিত ভুল: handler লেখা হলো, worker-ও চলছে, কিন্তু request আগের মতোই ধীর। কারণ `messenger.yaml`-এর `routing`-এ `'App\Message\OrderPlaced': async` লাইনটা নেই। `debug:messenger` আর `messenger:stats` দিয়ে যাচাই করো বার্তা সত্যিই queue-তে যাচ্ছে কি না।
    ref: messenger-basics
  - q: 'Queue আর stream-এর মূল পার্থক্য কী?'
    a: 'Queue-তে একটা বার্তা একজন worker পায়, কাজ শেষে মুছে যায়। Stream-এ বার্তা ক্রমে জমা থাকে, অনেক পাঠক আলাদাভাবে পড়ে, আবারও পড়া যায়।'
    more: |
      Queue (RabbitMQ, SQS) হলো কাজ বিলির লাইন — রান্নাঘরের স্লিপের কাঁটা। Stream বা log (Kafka) হলো হিসাবের খাতা — লেখা থেকে যায়, প্রতিটা পাঠক-দল নিজের বুকমার্ক থেকে পড়ে। ব্যাকগ্রাউন্ড কাজের জন্য queue, অনেক সার্ভিসে ঘটনার ইতিহাস ছড়াতে stream।
    ref: queue-vs-stream
  - q: 'Stream-এ offset কী?'
    a: 'একটা consumer group কোন পর্যন্ত পড়েছে তার ক্রমিক নম্বর — খাতার বুকমার্ক। offset পিছিয়ে দিলে পুরনো বার্তা আবার পড়া যায়।'
    more: |
      Queue-তে broker মনে রাখে কোন বার্তা কাকে দেওয়া হয়েছে। Stream-এ বার্তাগুলো শুধু ক্রমে জমা থাকে, আর প্রতিটা consumer group নিজের offset নিজে এগিয়ে নেয়। এজন্য একই stream থেকে দশটা আলাদা দল নিজের গতিতে পড়তে পারে, কেউ কারো পথ আটকায় না।
    ref: queue-vs-stream
  - q: 'কোন ধরনের কাজ async করা উচিত?'
    a: 'যে কাজ ধীর বা বাইরের সার্ভিসের ওপর নির্ভরশীল, ব্যর্থ হলে আবার চেষ্টা করা যায়, আর যার ফল ব্যবহারকারীর এখনই জানা দরকার নেই।'
    more: |
      ইমেইল, SMS, PDF, রিপোর্ট, কুরিয়ার বুকিং — এগুলো আদর্শ উদাহরণ। উল্টো দিকে validation, স্টক ধরে রাখা বা এমন ফল যা দেখে ব্যবহারকারী পরের সিদ্ধান্ত নেবে — এগুলো request-এর ভেতরেই থাকে। পরীক্ষার প্রশ্ন একটাই: "উত্তরটা কি এখনই দরকার?"
    ref: async-is-not-done
  - q: 'কাজ queue-তে পাঠানোর পর API-র সৎ উত্তর কী?'
    a: '`202 Accepted`, অবস্থা `pending`, আর অবস্থা জানার একটা URL — কারণ কাজটা তখনো হয়নি।'
    more: |
      `dispatch()` শুধু বার্তাটা queue-তে লেখে। worker কয়েক সেকেন্ড পরে চলতে পারে, ব্যর্থও হতে পারে। তাই "সফল" বলা মিথ্যা। আগে ডেটাবেসে `pending` অবস্থা লেখো, তারপর dispatch করো; client পরে status URL বা live আপডেট থেকে চূড়ান্ত ফল জানে।
    ref: async-is-not-done

quiz:
  - q: 'একটা অর্ডার controller একই request-এ নিচের কাজগুলো করে। কোনগুলো queue-তে সরানো নিরাপদ?'
    hint: 'প্রতিটার জন্য ভাবো: এটা দশ সেকেন্ড পরে হলে ক্রেতার কি কোনো ক্ষতি হবে?'
    options:
      - text: 'অর্ডার কনফার্মেশন ইমেইল পাঠানো'
        correct: true
        why: 'ইমেইল কয়েক সেকেন্ড পরে পৌঁছালেও ক্ষতি নেই, আর ব্যর্থ হলে আবার চেষ্টা করা যায়।'
      - text: 'অর্ডারের সারি ডেটাবেসে save করা'
        correct: false
        why: 'এটা না হলে ক্রেতাকে অর্ডার নম্বরই দেওয়া যায় না — উত্তরের জন্য এটা লাগবেই।'
      - text: 'ইনভয়েস PDF বানানো'
        correct: true
        why: 'ভারী কাজ, অথচ ক্রেতা PDF-টা এই মুহূর্তে চাইছে না। worker পেছনে বানিয়ে রাখতে পারে।'
      - text: 'স্টক আছে কি না দেখে ধরে রাখা'
        correct: false
        why: '"স্টক নেই" উত্তরটা ক্রেতার এখনই দরকার। পরে জানালে তাকে আগে মিথ্যা "অর্ডার সফল" বলতে হয়।'
      - text: 'কুরিয়ারের API-তে বুকিং দেওয়া'
        correct: true
        why: 'বাইরের API ধীর ও ভঙ্গুর; queue-তে থাকলে সেটা বন্ধ থাকলেও অর্ডার নেওয়া চলে, পরে retry হয়।'
    ref: cashier-does-everything
  - q: 'নিচের কোন নামটা event, command নয়?'
    hint: 'কোন নামটা এমন কিছু বলছে যা ইতিমধ্যে ঘটে গেছে?'
    options:
      - text: 'SendInvoiceEmail'
        correct: false
        why: 'এটা একটা আদেশ: "ইমেইল পাঠাও"। কাজটা এখনো হয়নি — তাই command।'
      - text: 'PaymentFailed'
        correct: true
        why: 'অতীত কালে বলা একটা ঘটনা। কে শুনে কী করবে — ক্রেতাকে জানাবে, নাকি অর্ডার বাতিল করবে — তা প্রেরক ঠিক করে না।'
      - text: 'GenerateSalesReport'
        correct: false
        why: 'ক্রিয়াপদ দিয়ে শুরু হওয়া আদেশ; ঠিক একটা handler এটা করবে — command।'
      - text: 'BookCourier'
        correct: false
        why: '"কুরিয়ার বুক করো" — নির্দিষ্ট একটা কাজের আদেশ, অর্থাৎ command।'
    ref: command-vs-event
  - q: 'ChargeOrder বার্তাটা async transport-এ route করা আছে। এই controller-এ ভুলটা কী?'
    lang: php
    code: |
      #[Route('/orders/{id}/pay', methods: ['POST'])]
      public function pay(Order $order, MessageBusInterface $bus): JsonResponse
      {
          $bus->dispatch(new ChargeOrder($order->getId()));

          return $this->json(['status' => 'paid']);
      }
    hint: 'response যখন ফেরত যাচ্ছে, worker তখন কাজটা শুরু করেছে কি?'
    options:
      - text: 'টাকা কাটার আগেই "paid" বলা হচ্ছে; বলা উচিত 202 আর "pending"'
        correct: true
        why: 'dispatch() শুধু বার্তাটা queue-তে লেখে। কাজ পরে হবে, ব্যর্থও হতে পারে — তাই সৎ উত্তর হলো pending।'
      - text: 'dispatch()-এর পরে flush() ডাকা হয়নি, তাই বার্তা যাবে না'
        correct: false
        why: 'dispatch() নিজেই বার্তাটা transport-এ লিখে দেয়; এর জন্য EntityManager-এর flush() লাগে না।'
      - text: 'বার্তায় id-র বদলে পুরো $order entity দেওয়া উচিত ছিল'
        correct: false
        why: 'উল্টো — id দেওয়াই সঠিক। entity দিলে worker পুরনো কপি নিয়ে কাজ করত।'
      - text: 'পেমেন্টের কাজ কখনো queue দিয়ে করা যায় না'
        correct: false
        why: 'করা যায়, অনেক সিস্টেম করেও। শর্ত একটাই: ব্যবহারকারীকে সত্যি অবস্থা (pending) বলতে হবে।'
    ref: async-is-not-done
  - q: 'একটা মার্কেটপ্লেসে প্রতিটা অর্ডার-ঘটনা analytics, fraud আর search — তিন টিম নিজের গতিতে পড়বে। নতুন টিম এলে গত ৭ দিনের ঘটনা প্রথম থেকে পড়তে চাইবে। কোনটা মানানসই?'
    hint: 'কোন ব্যবস্থায় বার্তা পড়ার পরেও থেকে যায়, আর প্রত্যেক পাঠকের নিজের বুকমার্ক থাকে?'
    options:
      - text: 'একটা RabbitMQ queue, যেখানে তিন টিমের worker একসাথে consume করবে'
        correct: false
        why: 'এক queue-তে একটা বার্তা worker-দের যেকোনো একজন পায়। এক টিম পেলে বাকি দুই টিম সেটা আর দেখবে না।'
      - text: 'Kafka-র মতো stream, যেখানে প্রতিটা টিম আলাদা consumer group'
        correct: true
        why: 'Stream-এ বার্তা retention পর্যন্ত জমা থাকে; প্রতিটা group নিজের offset থেকে পড়ে, আর নতুন group শুরু থেকে replay করতে পারে।'
      - text: 'controller থেকে তিন টিমের সার্ভিসে সরাসরি HTTP call'
        correct: false
        why: 'তখন অর্ডারের request তিনটা সার্ভিসের গতি আর সুস্থতার ওপর নির্ভর করবে; পুরনো ঘটনা replay-ও সম্ভব নয়।'
      - text: 'প্রতি মিনিটে একটা cron, যা orders টেবিল স্ক্যান করে সবাইকে জানায়'
        correct: false
        why: 'স্ক্যান ধীর, ঘটনা বাদ পড়ে বা দুইবার যায়, আর "কোন টিম কোন পর্যন্ত পড়েছে" তা নিজে হাতে সামলাতে হয় — যা stream এমনিতেই দেয়।'
    ref: queue-vs-stream
  - q: 'রিমা handler লিখেছে, worker-ও চালু। তবু request আগের মতোই ধীর, আর messenger:stats-এ queue সবসময় খালি। সবচেয়ে সম্ভাব্য কারণ কী?'
    hint: 'বার্তাটা আদৌ transport পর্যন্ত পৌঁছাচ্ছে কি?'
    options:
      - text: 'worker যথেষ্ট দ্রুত নয়'
        correct: false
        why: 'worker ধীর হলে queue-তে বার্তা জমত। queue খালি মানে বার্তা সেখানে যাচ্ছেই না।'
      - text: 'routing-এ বার্তার class লেখা নেই, তাই handler request-এর ভেতরেই চলছে'
        correct: true
        why: 'routing না থাকলে Messenger বার্তাটা কোনো transport-এ পাঠায় না; dispatch()-এর ভেতরেই handler চালিয়ে দেয়।'
      - text: 'handler-এ #[AsMessageHandler] নেই'
        correct: false
        why: 'সেক্ষেত্রে handler খুঁজে না পেয়ে Messenger exception ছুড়ত; কাজটা নীরবে request-এর ভেতরে হতো না।'
      - text: 'Doctrine transport async কাজ সমর্থন করে না'
        correct: false
        why: 'করে। Doctrine transport ডেটাবেসের একটা টেবিলকেই queue হিসেবে ব্যবহার করে, আর ছোট অ্যাপের জন্য যথেষ্ট।'
    ref: messenger-basics
  - q: 'কাজ async করার দাম হিসেবে নিচের কোনগুলো সত্যি?'
    hint: 'queue-তে দেওয়ার পর কাজটার ওপর তোমার নিয়ন্ত্রণ কতটা থাকে, ভাবো।'
    options:
      - text: 'কাজটা ঠিক কখন শেষ হবে তা আগে থেকে বলা যায় না'
        correct: true
        why: 'queue-তে জট থাকলে বা worker ব্যস্ত থাকলে দেরি বাড়ে; ব্যবহারকারী কিছুক্ষণ পুরনো অবস্থা দেখে।'
      - text: 'একই বার্তা দুইবার আসতে পারে, handler-কে তার জন্য তৈরি থাকতে হয়'
        correct: true
        why: 'worker মাঝপথে থেমে গেলে queue বার্তাটা আবার দেয়। তাই handler-কে দুইবার চললেও ক্ষতি না হয় এমন হতে হবে।'
      - text: 'async করলে ডেটাবেসের transaction আর দরকার হয় না'
        correct: false
        why: 'handler-এর ভেতরের লেখাগুলো এখনো একসাথে সফল বা ব্যর্থ হওয়া চাই; async তার বিকল্প নয়।'
      - text: 'ব্যর্থ হলে ব্যবহারকারী আর পাতায় নেই, তাই জানানোর আলাদা ব্যবস্থা লাগে'
        correct: true
        why: 'request-এ ভুল হলে পর্দায় error দেখানো যায়। async-এ কাজ ব্যর্থ হয় পরে — তখন নোটিফিকেশন, status পাতা বা retry লাগে।'
    ref: async-is-not-done
  - q: 'নতুন কোড deploy হয়েছে, কিন্তু ব্যাকগ্রাউন্ড কাজগুলো এখনো পুরনো আচরণ করছে। সবচেয়ে সম্ভাব্য কারণ কী?'
    hint: 'web request প্রতিবার নতুন করে কোড পড়ে। worker কি তা করে?'
    options:
      - text: 'queue-তে জমে থাকা বার্তাগুলো পুরনো কোড সাথে করে এনেছে'
        correct: false
        why: 'বার্তায় শুধু ডেটা থাকে, কোড নয়। কোন কোড চলবে তা ঠিক করে worker process।'
      - text: 'worker লম্বা সময় চলা process; restart না করলে পুরনো কোড মেমোরিতে থেকে যায়'
        correct: true
        why: 'worker একবার কোড পড়ে ঘণ্টার পর ঘণ্টা চলে। deploy-এর পর messenger:stop-workers চালালে সে থেমে নতুন কোড নিয়ে ওঠে।'
      - text: 'transport-এর DSN বদলাতে হবে'
        correct: false
        why: 'DSN ঠিক করে বার্তা কোথায় জমা হবে; কোন সংস্করণের কোড চলবে তার সাথে এর সম্পর্ক নেই।'
    ref: messenger-basics
