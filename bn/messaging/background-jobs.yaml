    check:
      q: 'Queue-তে জমা বার্তা মাত্র ১০টা, তবুও অ্যাপে সমস্যা। কোন মাপটা বলে দেবে কেন?'
      a: 'সবচেয়ে পুরনো বার্তার বয়স। ১০টা বার্তার একটাও আধঘণ্টা ধরে পড়ে থাকলে worker আটকে আছে, যদিও depth দেখে সবই ঠিক মনে হয়।'

flashcards:
  - q: 'কেন বড় কাজ এক টানে না করে টুকরোয় ভাঙা হয়?'
    a: 'মাঝপথে ভাঙলে শুধু চলতি টুকরো আবার চলে, পুরোটা নয়। আর ছোট টুকরোয় মেমরি আর timeout সীমার ভেতরে থাকে।'
    more: |
      প্রতিটা টুকরো আলাদা বার্তা, তাই আলাদা retry পায়। টুকরোর শেষে checkpoint লিখে রাখলে কাজ কতদূর হয়েছে দেখাও যায়।
    ref: chunks-and-checkpoints
  - q: 'Checkpoint কী, আর কীভাবে রাখা হয়?'
    a: 'কাজ কতদূর হয়েছে তার চিহ্ন, যেমন শেষ প্রসেস হওয়া id। পরের টুকরোর বার্তায় বা job টেবিলে সেটা রাখা হয়।'
    more: |
      Checkpoint থাকলে জব ভাঙার পরে শেষ জায়গা থেকে চলে। পাশাপাশি `LIMIT/OFFSET`-এর বদলে `WHERE id > ?`-র মতো cursor ব্যবহার করলে বড় ডেটায়ও query ধীর হয় না।
    ref: chunks-and-checkpoints
  - q: 'Visibility timeout কী?'
    a: 'Worker বার্তা তুললে বার্তাটা নির্দিষ্ট সময় অন্যদের কাছে লুকানো থাকে। ওই সময়ে ack না এলে সেটা আবার দৃশ্যমান হয়ে অন্য worker পায়।'
    more: |
      এটা worker মরে গেলে বার্তা হারানো ঠেকায়। কিন্তু timeout কাজের সর্বোচ্চ সময়ের চেয়ে ছোট হলে কাজ চলতে চলতেই বার্তা অন্যজন নিয়ে নেয়, আর কাজ দুইবার চলে।
    ref: visibility-and-priority
  - q: 'Visibility timeout কত রাখা উচিত?'
    a: 'কাজের সর্বোচ্চ সম্ভাব্য সময়ের চেয়ে বড়। আর কাজ লম্বা হলে কাজকে টুকরো করো, timeout বাড়াতে বাড়াতে না।'
    more: |
      খুব বড় timeout রাখলে worker মরার পরে বার্তা ফেরত আসতে অনেকক্ষণ লাগে। তাই ছোট টুকরো আর মাঝারি timeout ভালো ভারসাম্য।
    ref: visibility-and-priority
  - q: 'জরুরি আর ধীর কাজ কীভাবে আলাদা রাখা যায়?'
    a: 'আলাদা queue বা transport বানিয়ে, যেমন high আর low। Worker `messenger:consume high low` চালালে আগে high খালি হয়।'
    more: |
      একই queue-তে ধীর কাজ থাকলে OTP-র মতো জরুরি বার্তা তাদের পেছনে আটকে যায়। আলাদা transport-এ বার্তার class অনুযায়ী routing দিলে এটা এড়ানো যায়।
    ref: scheduler-and-lanes
  - q: 'Cron-এর তুলনায় Symfony Scheduler-এর সুবিধা কী?'
    a: 'সময়সূচি কোডেই থাকে, version control-এ যায়, Messenger-এর retry পায়, আর lock দিয়ে একাধিক সার্ভারে একবারই চলে।'
    more: |
      `RecurringMessage::cron()` বা `every()` দিয়ে সময়সূচি লেখা হয়। `stateful()` দিলে worker বন্ধ থাকার সময়ে মিস হওয়া রান ফিরে আসে, আর `lock()` দিলে একই সময়ের রান ডুপ্লিকেট হয় না।
    ref: scheduler-and-lanes
  - q: 'ব্যাকগ্রাউন্ড জবের কোন মাপটা ব্যবহারকারীর টের পাওয়া দেরির সবচেয়ে কাছের?'
    a: 'Queue-র সবচেয়ে পুরনো বার্তার বয়স। শুধু depth দেখলে ছোট queue-তেও আটকে থাকা একটা বার্তা ধরা পড়ে না।'
    more: |
      সাথে ব্যর্থতার হার, কাজের সময় আর DLQ-র আকার মাপো। DLQ-তে একটা বার্তাও মানে একটা কাজ হারিয়েছে, তাই সেটা আলাদা alert-এর যোগ্য।
    ref: job-observability

quiz:
  - q: 'অ্যাপ দুটো সার্ভারে চলে, দুটোতেই Scheduler worker চালু। প্রতি রাত ২টার রিপোর্ট দুইবার বের হচ্ছে। সমাধান কী?'
    hint: 'দুই worker একই সময়ে বার্তা বের করতে চাইলে কে জিতবে?'
    options:
      - text: 'Schedule-এ lock যোগ করা, যাতে এক সময়ে একজন বার্তা বের করে'
        correct: true
        why: 'Scheduler-এর `lock()` ঠিক এই কাজের জন্য।'
      - text: 'একটা সার্ভারের worker বন্ধ করে রাখা, কখনো চালু না করা'
        correct: false
        why: 'সেটা সার্ভার নষ্ট হলে সব কাজ বন্ধ করে দেয়, কোনো সমাধান নয়।'
      - text: 'সময় ২টার বদলে ২টা ১ মিনিট করা'
        correct: false
        why: 'সময় বদলালেও দুই সার্ভারই একই নতুন সময়ে একসাথে বার্তা বের করবে।'
    ref: scheduler-and-lanes
  - q: 'কাজ সর্বোচ্চ ৫ মিনিট চলে। SQS-এ visibility timeout ৩০ সেকেন্ড। কী ঘটবে?'
    hint: '৩০ সেকেন্ড পরে বার্তার অবস্থা কী?'
    options:
      - text: 'কাজ ৩০ সেকেন্ডে আপনা-আপনি থেমে যাবে'
        correct: false
        why: 'Timeout worker-কে থামায় না; এটা শুধু বার্তাকে আবার দৃশ্যমান করে।'
      - text: 'প্রথম worker কাজ করতে থাকবে আর বার্তা অন্য worker-ও তুলে একই কাজ শুরু করবে'
        correct: true
        why: '৩০ সেকেন্ড পরে বার্তা আবার দৃশ্যমান হয়, আর দ্বিতীয় worker একই কাজ ধরে ফেলে।'
      - text: 'বার্তাটা চিরতরে হারিয়ে যাবে'
        correct: false
        why: 'হারায় না, বরং আবার দৃশ্যমান হয়, আর তাতেই ডুপ্লিকেট হয়।'
    ref: visibility-and-priority
  - q: 'এই handler-এ কী কী সমস্যা?'
    lang: php
    code: |
      public function __invoke(ExportUsers $m): void
      {
          foreach ($this->users->findAll() as $user) {
              $this->csv->write($user);
          }
          $this->jobs->markDone($m->jobId);
      }
    hint: 'মেমরি, সময় আর ভাঙলে কী হবে ভাবো।'
    options:
      - text: 'সব entity মেমরিতে লোড হয়, লাখ লাখ হলে মেমরি ফুরোবে'
        correct: true
        why: '`findAll()` সব সারি একবারে আনে।'
      - text: 'মাঝপথে ভাঙলে কোনো checkpoint নেই, তাই সব শুরু থেকে হবে'
        correct: true
        why: 'অগ্রগতি কোথাও লেখা হয় না, তাই retry প্রতিবার প্রথম সারি থেকে।'
      - text: '`markDone` শেষে ডাকা ভুল, শুরুতে ডাকতে হবে'
        correct: false
        why: 'কাজ শেষ হলেই done বলা ঠিক। শুরুতে বললে মিথ্যা অবস্থা দেখাবে।'
      - text: 'Handler-এ `$m->jobId` ব্যবহার করা যায় না'
        correct: false
        why: 'বার্তার সাধারণ ফিল্ড handler-এ ব্যবহার করা যায়।'
    ref: chunks-and-checkpoints
  - q: 'OTP আর মাসিক রিপোর্ট একই queue-তে। রিপোর্ট চললে OTP আসতে দেরি হয়। সবচেয়ে ভালো সমাধান কোনটা?'
    hint: 'কোন কাজ দেরিতে ক্ষতি করে, কোনটা করে না?'
    options:
      - text: 'OTP-র জন্য আলাদা high transport, রিপোর্ট low-তে; worker আগে high পড়বে'
        correct: true
        why: 'জরুরি বার্তা ধীর কাজের পেছনে আটকায় না।'
      - text: 'রিপোর্ট বন্ধ করে দেব'
        correct: false
        why: 'কাজটা দরকারি, শুধু আলাদা লেনে সরালেই হয়।'
      - text: 'worker-এর সংখ্যা ১০ গুণ বাড়াব, আলাদা queue ছাড়াই'
        correct: false
        why: 'ব্যয় বাড়ে, আর রিপোর্ট বাড়লে আবার একই সমস্যা। আলাদা লেন মূল সমাধান।'
    ref: scheduler-and-lanes
  - q: 'কোন মাপ দেখে তুমি বুঝবে worker আটকে আছে, অথচ queue-তে মাত্র ৫টা বার্তা?'
    hint: 'সংখ্যা ছোট হলেও কিছু একটা অনেকদিন ধরে বসে থাকতে পারে।'
    options:
      - text: 'Queue depth, মানে বার্তার সংখ্যা'
        correct: false
        why: 'ছোট সংখ্যা সব ঠিকঠাক ভাবাতে পারে, অথচ একটা বার্তা ঘণ্টা ধরে আটকে থাকতে পারে।'
      - text: 'সবচেয়ে পুরনো বার্তার বয়স'
        correct: true
        why: 'আটকে থাকা বার্তা বয়স বাড়ায়। সংখ্যা কম হলেও এটা দেরি ধরিয়ে দেয়।'
      - text: 'শুধু worker-এর CPU ব্যবহার'
        correct: false
        why: 'আটকে থাকা worker হয়তো I/O-র অপেক্ষায় বসে, CPU কম হতে পারে, এতে কিছুই বোঝা যায় না।'
    ref: job-observability
