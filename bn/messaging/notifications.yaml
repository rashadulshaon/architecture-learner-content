          - {id: sms1, label: 'SMS provider A', sub: 'প্রধান', icon: phone, col: 3, row: 1.5, tip: 'প্রথম পছন্দের provider।'}
          - {id: sms2, label: 'SMS provider B', sub: 'বিকল্প', icon: phone, tone: warn, col: 1.5, row: 1.5, tip: 'A ব্যর্থ হলে এখানে যায়, যাতে জরুরি বার্তা না হারায়।'}
          - {id: user, label: 'ব্যবহারকারী', sub: 'বার্তা পেল', icon: user, tone: good, col: 0, row: 1.5, tip: 'সব ধাপ পেরিয়ে বার্তা যার কাছে যাওয়ার কথা, সে।'}
        edges:
          - {from: ev, to: pref, label: 'ঘটনা এলে আগে ব্যবহারকারীর পছন্দ দেখা হয়'}
          - {from: pref, to: guard, label: 'SMS চালু আছে, তাই বার্তাটা dedup আর throttle পেরোয়'}
          - {from: guard, to: sms1, label: 'নতুন আর সীমার মধ্যে, তাই provider A-তে যায়'}
          - {from: sms1, to: sms2, label: 'A ব্যর্থ হলে একই বার্তা B-তে যায়', tone: warn, dashed: true}
          - {from: sms2, to: user, label: 'বার্তা ব্যবহারকারীর কাছে পৌঁছায়', tone: good}
      - type: quote
        body: 'পছন্দ আগে, প্রতিটা বার্তা একবার, আর এক provider ভাঙলে আরেকটা।'
    aside:
      - type: terms
        items:
          - {term: 'Preference', meaning: 'ব্যবহারকারী কোন ধরনের বার্তা কোন মাধ্যমে চায়।'}
          - {term: 'Throttling', meaning: 'নির্দিষ্ট সময়ে একজনকে সর্বোচ্চ কয়টা বার্তা, তার সীমা।'}
          - {term: 'Digest', meaning: 'অনেক ছোট খবর জমিয়ে একটা সারসংক্ষেপে পাঠানো।'}
          - {term: 'Failover', meaning: 'প্রধান provider ব্যর্থ হলে বিকল্প provider-এ যাওয়া।'}
          - {term: 'Transactional বার্তা', meaning: 'যে বার্তা ছাড়া ব্যবহারকারী তার কাজ শেষ করতে পারে না, যেমন OTP। মার্কেটিং এর উল্টো।'}
      - type: pitfalls
        items:
          - 'OTP আর সিকিউরিটি বার্তা opt-out-এর বাইরে রাখা হয়। কিন্তু মার্কেটিং কখনোই তা নয়।'
    check:
      q: 'ব্যবহারকারী SMS বন্ধ রেখেছে কিন্তু পাসওয়ার্ড রিসেট OTP দরকার। কীভাবে সামলাবেন?'
      a: 'ঘটনার ধরন অনুযায়ী নিয়ম: OTP আর সিকিউরিটি transactional, তাই পছন্দের বাইরে জরুরি মাধ্যমে যায়। মার্কেটিং বা সাধারণ আপডেট পছন্দ মানে।'

  - slug: symfony-notifier
    title: 'Symfony Notifier: channel, পছন্দ আর failover'
    kind: howto
    tldr: 'Notifier-এ একটা Notification বানান, ব্যবহারকারীর পছন্দ থেকে channel নিন, আর transport-এর DSN-এ failover(...) দিয়ে বিকল্প provider বসান।'
    keywords: ['Symfony Notifier', 'Notification', 'texter_transports', 'failover', 'Recipient', 'channel policy', 'নোটিফায়ার']
    blocks:
      - type: code
        lang: php
        file: 'src/Notification/OrderNotifier.php'
        variant: good
        code: |
          final readonly class OrderNotifier
          {
              public function __construct(
                  private NotifierInterface $notifier,
                  private PreferenceRepository $prefs,
              ) {}

              public function shipped(Order $order): void
              {
                  $user = $order->getUser();
                  $channels = $this->prefs->enabledChannels($user, 'order_shipped'); // ['email','sms']
                  if ([] === $channels) {
                      return;                       // ব্যবহারকারী চায় না
                  }

                  $subject = 'অর্ডার #'.$order->getId().' পাঠানো হয়েছে';
                  $notification = (new Notification($subject, $channels))
                      ->content('কুরিয়ার কাল পৌঁছাবে।')
                      ->importance(Notification::IMPORTANCE_HIGH);

                  $recipient = new Recipient($user->getEmail(), $user->getPhone());
                  $this->notifier->send($notification, $recipient);
              }
          }
        marks:
          - {line: 11, tip: 'পছন্দ আসে আমাদের নিজের টেবিল থেকে। Notifier শুধু পাঠায়, সিদ্ধান্ত নেয় না।'}
          - {line: 17, tip: 'দ্বিতীয় আর্গুমেন্ট channel-এর তালিকা, মানে কোন কোন মাধ্যমে যাবে।'}
          - {line: 21, tip: '`Recipient`-এ ইমেইল আর ফোন দুটোই থাকে; channel যেটা লাগে সেটা ব্যবহার করে।'}
      - type: code
        lang: yaml
        file: 'config/packages/notifier.yaml'
        variant: good
        code: |
          framework:
              notifier:
                  texter_transports:
                      # প্রথমটা ব্যর্থ হলে দ্বিতীয়টা, দুটোই ব্যর্থ হলে exception
                      sms: 'failover(%env(SMS_PROVIDER_A_DSN)% %env(SMS_PROVIDER_B_DSN)%)'
                  channel_policy:
                      urgent: ['sms', 'email']
                      high: ['email']
                      low: ['email']
        marks:
          - {line: 5, tip: '`failover(...)` ধারাবাহিকভাবে চেষ্টা করে। কোড বদলাতে হয় না, শুধু DSN।'}
          - {line: 7, tip: 'channel না দিলে Notification-এর importance দেখে এই policy অনুযায়ী মাধ্যম বাছা হয়।'}
    aside:
      - type: terms
        items:
          - {term: 'DSN', meaning: 'এক লাইনের ঠিকানা, যা বলে কোন provider আর কীভাবে তাতে ঢুকতে হয়, অনেকটা connection string-এর মতো।'}
      - type: tips
        items:
          - 'বাংলাদেশে SMS provider-এর DSN আলাদা আলাদা। Notifier-এর bridge না থাকলে নিজে ছোট একটা transport লিখে নেওয়া যায়।'
          - 'ইমেইলের জন্য Mailer-এও `failover(...)` DSN আছে, একই ধারণা।'
          - 'Notifier কাজটা sync-ই করে। Messenger-এ route করলে request ধীর হয় না।'
          - 'provider A পৌঁছে দিয়েও দেরিতে সাড়া দিলে failover-এ দুইবার যেতে পারে। OTP-তে ক্ষতি নেই; বাকিগুলোতে মাথায় রাখুন।'
      - type: refs
        items:
          - {to: 'messaging/dlq-retries', label: 'পাঠাতে ব্যর্থ হলে retry ও DLQ'}
    check:
      q: 'Notifier-এ দ্বিতীয় SMS provider যোগ করতে কোড বদলাতে হয় কি?'
      a: 'না। `texter_transports`-এর DSN-কে `failover(A B)` করলেই হয়। প্রথম provider ব্যর্থ হলে Notifier স্বয়ংক্রিয়ভাবে দ্বিতীয়টা চেষ্টা করে।'

  - slug: otp-bypass
    title: 'OTP যেতেই হবে: transactional বনাম মার্কেটিং'
    kind: pitfall
    tldr: 'প্রতিটা বার্তা পছন্দ মানলে সব নোটিফিকেশন বন্ধ রাখা ব্যবহারকারী লগইন কোডই পায় না। বার্তাকে transactional বা নয় চিহ্নিত করুন, আর শুধু transactional-গুলো পছন্দ এড়াবে।'
    keywords: ['OTP', 'transactional message', 'opt-out', 'notification kind', 'security alert', 'ওটিপি']
    blocks:
      - type: text
        body: |
          অফারের বার্তায় বিরক্ত হয়ে রিনা সব নোটিফিকেশন বন্ধ করে রেখেছে। এখন সে পাসওয়ার্ড রিসেটের কোড চাইল, আর পছন্দ মেনে চলা pipeline চুপচাপ কিছুই পাঠাল না। সে আটকে গেল, অথচ কোথাও কোনো error নেই। সমাধান হলো বার্তার **ধরন** দেখে ঠিক করা: transactional বার্তা (যা ছাড়া ব্যবহারকারী তার কাজ শেষ করতে পারে না) পছন্দ এড়ায়, বাকি সব পছন্দ মানে।
      - type: code
        lang: php
        file: 'OrderNotifier.php (OTP-র জন্য ভুল)'
        variant: bad
        code: |
          $channels = $this->prefs->enabledChannels($user, 'otp');   // []: সব বন্ধ
          if ([] === $channels) {
              return;                    // কোড যায়নি, ব্যবহারকারী আটকে গেল
          }
        marks:
          - {line: 3, tip: 'প্রচারের বার্তায় ঠিক, OTP-তে ভুল: ব্যবহারকারী এইমাত্র এই কোডটাই চেয়েছে।'}
      - type: code
        lang: php
        file: 'src/Notification/NotificationKind.php'
        variant: good
        code: |
          enum NotificationKind: string
          {
              case Otp = 'otp';
              case SecurityAlert = 'security_alert';
              case OrderShipped = 'order_shipped';
              case Promotion = 'promotion';

              public function isTransactional(): bool
              {
                  return self::Otp === $this || self::SecurityAlert === $this;
              }
          }

          // ChannelPicker-এ
          public function channelsFor(User $user, NotificationKind $kind): array
          {
              if ($kind->isTransactional()) {
                  return ['sms', 'email'];      // সবসময়: কোড না পেলে লগইন নেই
              }

              return $this->prefs->enabledChannels($user, $kind->value);
          }
        marks:
          - {line: 10, tip: 'তালিকা ইচ্ছা করেই স্পষ্ট আর ছোট। এখানে নতুন ধরন যোগ করা মানে এমন সিদ্ধান্ত, যা কারো দেখে নেওয়া উচিত।'}
          - {line: 18, tip: 'Transactional ধরন পছন্দ এড়ায়। বাকি সবকিছু এখনো ব্যবহারকারীকে জিজ্ঞেস করে।'}
      - type: points
        title: 'এর দাম'
        style: cross
        items:
          - 'Transactional তালিকা ছোট রাখুন। একবার প্রচার ঢুকলে opt-out অমান্য হয়, আর সেটা আইনে বাধতে পারে।'
          - 'OTP-র আলাদা সীমা দিন (যেমন নম্বরপ্রতি ঘণ্টায় ৫টা), নইলে আক্রমণকারী হাজার হাজার SMS-এর খরচ আপনার ঘাড়ে চাপাতে পারে।'
          - 'Digest-ও এড়াতে হয়: ঘণ্টাভিত্তিক সারসংক্ষেপের ভেতরের কোড কোনো কাজের নয়।'
    aside:
      - type: remember
        body: 'মার্কেটিং অনুমতি চায়। OTP অনুরোধের উত্তর।'
    check:
      q: 'পাসওয়ার্ড রিসেটের OTP কেন opt-out এড়াতে পারে, অথচ প্রচারের বার্তা পারে না?'
      a: 'ব্যবহারকারী এইমাত্র OTP চেয়েছে, আর তা ছাড়া এগোতে পারে না। প্রচার আমরা নিজে বলতে চাই, তাই শুনবে কি না সেটা ব্যবহারকারীই ঠিক করে।'

  - slug: dedup-throttle-digest
    title: 'একই বার্তা একবার, আর বেশি হলে digest'
    kind: pitfall
    tldr: 'Retry আর redelivery-তে বার্তা দুইবার যায়; dedup key দিয়ে ঠেকান। সীমার বেশি হলে সাধারণ বার্তা rate limiter-এ থামিয়ে digest-এ জমে।'
    keywords: ['dedup key', 'RateLimiter', 'digest', 'throttle', 'idempotent notification', 'ডুপ্লিকেট নোটিফিকেশন']
    blocks:
      - type: text
        body: |
          Notification পাঠানোও একটা বার্তা-প্রক্রিয়াকরণ, তাই retry-তে একই SMS দুইবার যেতে পারে। সমাধান একটা **dedup key** (যেমন `order_shipped:501:user7`), যেটা একটা UNIQUE টেবিলে একবারই ঢোকে। আর ব্যবহারকারীর ঘণ্টায় তিনটার বেশি এলে বাকি সাধারণ বার্তা সাথে সাথে না পাঠিয়ে digest-এ জমানো হয়। জরুরি বার্তা এই সীমা এড়ায়।
      - type: code
        lang: php
        file: 'src/Notification/SafeSender.php'
        variant: good
        code: |
          public function send(User $user, string $dedupKey, Notification $n, bool $urgent = false): void
          {
              $claimed = $this->db->executeStatement(
                  'INSERT INTO notification_log (dedup_key) VALUES (?) ON CONFLICT DO NOTHING',
                  [$dedupKey],
              );
              if (0 === $claimed) {
                  return;                                    // আগেই গেছে
              }

              $limit = $this->perUserLimiter->create((string) $user->getId());
              if (!$urgent && !$limit->consume()->isAccepted()) {
                  $this->digest->add($user, $n);             // পরে একসাথে যাবে
                  return;
              }

              try {
                  $this->notifier->send($n, new Recipient($user->getEmail(), $user->getPhone()));
              } catch (\Throwable $e) {
                  $this->db->delete('notification_log', ['dedup_key' => $dedupKey]);
                  throw $e;                                  // retry-তে আবার চেষ্টা হবে
              }
          }
        marks:
          - {line: 4, tip: 'dedup_key-তে UNIQUE থাকলে দ্বিতীয় বার্তা ঢুকবেই না।'}
          - {line: 12, tip: 'সীমা পেরোলে সাধারণ বার্তা digest-এ যায়; জরুরি বার্তা (OTP) সীমা এড়ায়। কিছু হারায় না, শুধু দেরিতে যায়।'}
          - {line: 20, tip: 'পাঠানো ব্যর্থ হলে দাগ মুছে দিই, নইলে retry বাদ পড়ে আর বার্তা কখনোই যায় না।'}
      - type: code
        lang: yaml
        file: 'config/packages/rate_limiter.yaml'
        code: |
          framework:
              rate_limiter:
                  per_user:
                      policy: 'sliding_window'
                      limit: 3
                      interval: '1 hour'
        marks:
          - {line: 5, tip: 'একজনকে ঘণ্টায় সর্বোচ্চ ৩টা নোটিফিকেশন। autowire নাম `$perUserLimiter`।'}
    aside:
      - type: pitfalls
        items:
          - 'Dedup-এর দাগ পাঠানোর আগে বসালে আর পাঠানো ব্যর্থ হলে দাগ না মুছলে বার্তা চিরতরে হারায়।'
          - 'Digest-এ জমানো বার্তা সময়মতো পাঠাতে হয়: পরের slide-এ সেটা খালি করা scheduled job দেখানো আছে।'
      - type: terms
        items:
          - {term: 'Rate limiter', meaning: 'সময়ের একটা জানালায় কতবার কিছু ঘটল তা গোনে, আর সীমা পেরোলে না বলে।'}
      - type: refs
        items:
          - {to: 'api/rate-limiting', label: 'Rate limiting'}
    check:
      q: 'Dedup key কী দিয়ে বানালে ঠিক হয়: random UUID নাকি ঘটনার পরিচয়?'
      a: 'ঘটনার পরিচয় দিয়ে, যেমন `order_shipped:501:user7`। Retry-তে একই key পাওয়া যায় বলেই ডুপ্লিকেট ধরা পড়ে; random UUID প্রতিবার নতুন হয়ে চেকটাই বেকার করে।'

  - slug: digest-job
    title: 'Digest খালি করা: scheduled job'
    kind: howto
    tldr: 'Digest তখনই কাজের, যখন কেউ সেটা পাঠায়। Scheduler task প্রতি ঘণ্টায় প্রত্যেকের জমা খবর জড়ো করে একটা বার্তা পাঠায়, আর পাঠানো সফল হলে তবেই মোছে।'
    keywords: ['digest', 'Scheduler', 'AsPeriodicTask', 'summary email', 'scheduled job', 'ডাইজেস্ট']
    blocks:
      - type: text
        body: |
          সীমার কারণে আটকে রাখা বার্তা digest টেবিলে জমে থাকে। একা ফেলে রাখলে সেগুলো কারো কাছে পৌঁছায় না, যা বাদ দেওয়ারই সমান। একটা scheduled task প্রতি ঘণ্টায় চলে, প্রত্যেক ব্যবহারকারীকে একটা সারসংক্ষেপ পাঠায়। পাঠানো সফল হলে তবেই সে লাইনগুলো মোছে, তাই ব্যর্থ হলে digest শুধু পরের রানে যায়।
      - type: code
        lang: php
        file: 'src/Notification/SendDigests.php'
        variant: good
        code: |
          #[AsPeriodicTask(frequency: '1 hour', schedule: 'default')]
          final readonly class SendDigests
          {
              public function __construct(
                  private DigestRepository $digests,
                  private NotifierInterface $notifier,
              ) {}

              public function __invoke(): void
              {
                  foreach ($this->digests->usersWithPending() as $user) {
                      $items = $this->digests->pendingFor($user);

                      $n = (new Notification(count($items).'টা আপডেট', ['email']))
                          ->content(implode("\n", array_map(fn ($i) => $i->line(), $items)));

                      $this->notifier->send($n, new Recipient($user->getEmail()));
                      $this->digests->clear($user, $items);   // পাঠানো সফল হলে তবেই
                  }
              }
          }
        marks:
          - {line: 1, tip: 'Symfony Scheduler এই class প্রতি ঘণ্টায় চালায়। একটা চালু worker লাগে, নইলে কিছুই চলে না।'}
          - {line: 18, tip: 'send exception ছুঁড়লে এই লাইন চলে না, লাইনগুলো পরের ঘণ্টার জন্য থাকে। আগে মুছলে সেগুলো হারাত।'}
      - type: points
        title: 'এর দাম'
        style: cross
        items:
          - 'Digest ঘণ্টাখানেক দেরিতে পৌঁছায়। আপডেটে চলে, জরুরি কিছুতে নয়।'
          - 'পাঠানো আর মোছার মাঝখানে crash হলে একই digest দুইবার যায়। সারসংক্ষেপ ইমেইলে সেটা মেনে নেওয়া যায়।'
          - 'Scheduler worker চালু না থাকলে digest নিঃশব্দে কখনোই যায় না।'
    aside:
      - type: commands
        items:
          - {cmd: 'php bin/console messenger:consume scheduler_default', desc: 'schedule করা task চালানোর worker চালু করুন'}
    check:
      q: 'Job কেন পাঠানো সফল হওয়ার পরেই digest-এর লাইন মোছে?'
      a: 'আগে মুছে পরে পাঠানো ব্যর্থ হলে লাইনগুলো হারিয়ে যেত, ব্যবহারকারী কিছুই জানত না। শেষে মুছলে ব্যর্থতার মানে শুধু পরের ঘণ্টায় আবার চেষ্টা।'

flashcards:
  - q: 'নোটিফিকেশন সিস্টেমের মূল কাজ কী?'
    a: 'ঠিক জনকে, তার পছন্দের মাধ্যমে, ঠিক একবার জানানো, আর provider ভাঙলেও জরুরি বার্তা যেন হারিয়ে না যায়।'
    more: |
      ঘটনা ঘটা আর ব্যবহারকারীকে জানানো দুটো আলাদা সিদ্ধান্ত। দ্বিতীয়টায় পছন্দ, পুনরাবৃত্তি, চাপ আর provider-এর ব্যর্থতা বিবেচনা করতে হয়, তাই এর জন্য আলাদা একটা pipeline লাগে।
    ref: notification-pipeline
  - q: 'User preference কেন notification pipeline-এর প্রথম ধাপ?'
    a: 'ব্যবহারকারী যে মাধ্যম বন্ধ করেছে সেখানে পাঠানো বিরক্তিকর, আর মার্কেটিংয়ের ক্ষেত্রে আইনত সমস্যাও। বন্ধ থাকলে এখানেই থামুন।'
    more: |
      পছন্দ থাকে বার্তার ধরন আর মাধ্যমের জোড়ায়, যেমন ("order_shipped", "sms")। OTP আর সিকিউরিটি বার্তা transactional, তাই সেগুলো opt-out-এর বাইরে আলাদা নিয়মে চলে।
    ref: notification-pipeline
  - q: 'Notification dedup key কেমন হওয়া উচিত?'
    a: 'ঘটনার পরিচয়ভিত্তিক, যেমন `order_shipped:501:user7`। Random id না, কারণ retry-তে একই key না পেলে ডুপ্লিকেট ধরা যায় না।'
    more: |
      Key একটা UNIQUE টেবিলে ঢোকানো হয়। insert সফল হলে বার্তা নতুন, conflict হলে আগেই গেছে। পাঠানো ব্যর্থ হলে দাগ মুছে দিতে হয়, নইলে retry চিরতরে বাদ পড়ে।
    ref: dedup-throttle-digest
  - q: 'Throttling আর digest কীভাবে একসাথে কাজ করে?'
    a: 'Rate limiter একজনের জন্য সীমা ঠিক করে। সীমা পেরোলে বার্তা বাদ না দিয়ে digest-এ জমানো হয়, পরে একটা সারসংক্ষেপে যায়।'
    more: |
      যেমন ঘণ্টায় তিনটার পর আসা ছোট খবরগুলো একসাথে একটা ইমেইলে। এতে ব্যবহারকারী বিরক্ত হয় না, আর কিছু হারায়ও না। জরুরি বার্তা এই সীমার বাইরে থাকে।
    ref: dedup-throttle-digest
  - q: 'Provider failover কী, আর Symfony Notifier-এ কীভাবে করা যায়?'
    a: 'প্রধান provider ব্যর্থ হলে বিকল্পে পাঠানো। Notifier-এ DSN-এ `failover(A B)` লিখলেই হয়।'
    more: |
      কোড বদলাতে হয় না, শুধু `texter_transports`-এর DSN। প্রথমটা exception ছুড়লে দ্বিতীয়টা চেষ্টা হয়। দুটোই ব্যর্থ হলে exception ওঠে, আর তখন Messenger-এর retry কাজে আসে।
    ref: symfony-notifier
  - q: 'Notifier-এ কোন মাধ্যমে যাবে কীভাবে ঠিক হয়?'
    a: 'Notification-এ channel-এর তালিকা দিয়ে, নয়তো importance অনুযায়ী `channel_policy` থেকে। ব্যবহারকারীর পছন্দ থেকে তালিকা বানানোই ভালো।'
    more: |
      Notifier শুধু পাঠায়; কোন ব্যবহারকারী কোন মাধ্যম চায় সেটা আমাদের নিজের টেবিল থেকে আনতে হয়। তাই একটা ছোট service পছন্দ পড়ে channel-এর তালিকা বানিয়ে Notification-এ দেয়।
    ref: symfony-notifier
  - q: 'OTP আর মার্কেটিং বার্তার ব্যবহারকারীর পছন্দের ব্যাপারে নিয়ম কী?'
    a: 'OTP ও সিকিউরিটি বার্তা transactional, জরুরি মাধ্যমে যায়। মার্কেটিং সবসময় ব্যবহারকারীর opt-in আর opt-out মানে।'
    more: |
      ব্যবহারকারী সব SMS বন্ধ রাখলেও পাসওয়ার্ড রিসেটের কোড তার দরকার। তাই বার্তার ধরন অনুযায়ী আলাদা নিয়ম রাখা হয়, আর এই নিয়ম কোডে স্পষ্ট লেখা থাকে।
    ref: notification-pipeline

  - q: 'OTP কেন ব্যবহারকারীর notification পছন্দ এড়াতে পারে?'
    a: 'ব্যবহারকারী এইমাত্র সেটা চেয়েছে, আর তা ছাড়া এগোতে পারে না। মার্কেটিং আমরা নিজে বলতে চাই, তাই ব্যবহারকারী ঠিক করে; OTP একটা অনুরোধের উত্তর।'
    more: |
      সব বন্ধ রাখা ব্যবহারকারীরও পাসওয়ার্ড রিসেটের কোড লাগে। প্রতিটা বার্তার ধরনকে transactional বা নয় চিহ্নিত করুন, transactional তালিকা ছোট রাখুন, আর OTP-র আলাদা rate limit দিন, যাতে আক্রমণকারী আপনার SMS বিল ফুলিয়ে তুলতে না পারে।
    ref: otp-bypass
  - q: 'Notification digest-এর জন্য scheduled job কেন লাগে?'
    a: 'আটকে রাখা বার্তা তখনই ব্যবহারকারীর কাছে পৌঁছায়, যখন কেউ সেটা পাঠায়। scheduled task প্রত্যেকের একটা সারসংক্ষেপ পাঠায়, আর পাঠানো সফল হলে তবেই লাইন মোছে।'
    more: |
      job না থাকলে digest টেবিল শুধু ভরে ওঠে, আর বার্তাগুলো কার্যত বাদ পড়ে। পাঠানোর পরে মোছায় ব্যর্থ রান পরের বার আবার চেষ্টা করে; দাম হলো মাঝে মাঝে একটা বাড়তি সারসংক্ষেপ।
    ref: digest-job

quiz:
  - q: 'এক অর্ডারে পাঁচটা SMS যাচ্ছে, ব্যবহারকারী বিরক্ত। কোন সমাধানগুলো ঠিক?'
    hint: 'সব ঘটনা কি সাথে সাথে আলাদা বার্তা হওয়া দরকার?'
    options:
      - text: 'ছোট ঘটনাগুলো digest-এ জমিয়ে একটা সারসংক্ষেপে পাঠানো'
        correct: true
        why: 'একাধিক ছোট খবর এক বার্তায় গেলে সংখ্যা কমে, তথ্য হারায় না।'
      - text: 'ব্যবহারকারীর পছন্দ দেখে শুধু যে মাধ্যম সে চায় সেখানে পাঠানো'
        correct: true
        why: 'পছন্দ মানলে অপ্রয়োজনীয় মাধ্যমের বার্তাই বাদ পড়ে।'
      - text: 'SMS বন্ধ করে শুধু ইমেইল চালু রাখা, সবার জন্য'
