        why: 'এতে জরুরি বার্তা আর SMS-প্রিয় ব্যবহারকারী উভয়ই ক্ষতিগ্রস্ত হয়।'
      - text: 'প্রতিটা ঘটনার আগে ৫ সেকেন্ড অপেক্ষা করা'
