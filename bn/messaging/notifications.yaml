slides:
  - slug: five-sms-for-one-order
    title: 'একটা অর্ডারে পাঁচটা SMS, আর যেটা দরকার সেটা গেল না'
    kind: story
    tldr: 'প্রতিটা ঘটনায় সব মাধ্যমে বার্তা ছাড়লে ব্যবহারকারী বিরক্ত হয়ে opt-out করে, আর provider ভাঙলে জরুরি বার্তাই হারায়।'
    keywords: ['notification', 'spam', 'opt-out', 'multi-channel', 'নোটিফিকেশন', 'বিরক্তি']
    blocks:
      - type: metaphor
        icon: shop
        title: 'পাড়ার ফার্মেসির খবর'
        body: |
          ফার্মেসির ছেলে "ওষুধ এসেছে" জানাতে একই গ্রাহককে ফোন, SMS আর বাড়ি গিয়ে সবভাবে জানায়, দিনে পাঁচবার। গ্রাহক শেষে নম্বর ব্লক করে দেন। আবার যেদিন সত্যিই জরুরি ইনসুলিন এল, ফোন লাগেনি আর কেউ বিকল্প পথে জানায়ওনি। নোটিফিকেশন সিস্টেমের কাজ হলো ঠিক জনকে, ঠিক মাধ্যমে, একবার জানানো।
      - type: visual
        kind: compare
        caption: 'একই অর্ডারের খবর: সবাইকে সব মাধ্যমে বনাম গুছিয়ে'
        columns:
          - title: 'যা অনেকেই করে'
            tone: bad
            icon: cross
            tip: 'ঘটনা ঘটলেই সব মাধ্যমে ছেড়ে দেওয়া। সহজ, কিন্তু ব্যবহারকারীর কাছে ক্লান্তিকর।'
            items:
              - 'অর্ডার, পেমেন্ট, প্যাকিং, শিপ, ডেলিভারি: ৫টা SMS আর ৫টা ইমেইল'
              - 'ব্যবহারকারী SMS বন্ধ করেছিল, তবুও যায়'
              - 'retry-তে একই বার্তা দুইবার যায়'
              - 'SMS provider ডাউন হলে OTP-ই যায় না'
          - title: 'যা হওয়া উচিত'
            tone: good
            icon: check
            tip: 'প্রতিটা বার্তা ব্যবহারকারীর পছন্দ মেনে, একবার, আর ভাঙলে বিকল্প পথে।'
            items:
              - 'জরুরি ঘটনা আলাদা, বাকিগুলো একটা digest-এ'
              - 'ব্যবহারকারীর বেছে নেওয়া মাধ্যমেই যায়'
              - 'dedup key দিয়ে একই বার্তা একবারই'
              - 'provider ভাঙলে ফেলে দেওয়া হয় না, বিকল্পে যায়'
      - type: quote
        body: 'নোটিফিকেশনের কাজ বার্তা ছাড়া নয়, ঠিক জনকে ঠিক মাধ্যমে ঠিক একবার জানানো।'
    aside:
      - type: terms
        items:
          - {term: 'OTP', meaning: 'একবার ব্যবহারের কোড, সাধারণত SMS-এ আসে, যা প্রমাণ করে আপনিই আপনি, যেমন লগইন বা পাসওয়ার্ড রিসেটের কোড।'}
          - {term: 'Opt-out', meaning: 'কোনো ধরনের বার্তা আর না পাওয়ার ব্যবহারকারীর সিদ্ধান্ত।'}
      - type: story
        title: 'ডিজিটাল ওয়ালেটের বিরক্তি'
        body: |
          এক ওয়ালেট অ্যাপে প্রতিটা ছোট লেনদেনে push, SMS আর ইমেইল তিনটাই যেত। কয়েক মাসে অনেক ব্যবহারকারী সব বার্তা বন্ধ করল, আর জরুরি সিকিউরিটি অ্যালার্টও আর কেউ পেল না।
      - type: problem
        body: 'ঘটনা ঘটা আর ব্যবহারকারীকে জানানো দুটো আলাদা সিদ্ধান্ত। দ্বিতীয়টায় পছন্দ, পুনরাবৃত্তি, চাপ আর provider ব্যর্থতা সবই বিবেচ্য।'
    check:
      q: 'অতিরিক্ত নোটিফিকেশনে ব্যবহারকারী বিরক্ত হলে সবচেয়ে বড় ক্ষতিটা কী?'
      a: 'সে সব বার্তা বন্ধ করে দেয়, ফলে পরে জরুরি বার্তাও (OTP, সিকিউরিটি) আর তার কাছে পৌঁছায় না।'

  - slug: notification-pipeline
    title: 'Notification pipeline: পছন্দ, dedup, provider'
    kind: concept
    tldr: 'ঘটনা সরাসরি SMS-এ যায় না। আগে ব্যবহারকারীর পছন্দ, তারপর dedup আর throttle, শেষে provider; একটা ভাঙলে failover।'
    keywords: ['notification pipeline', 'preferences', 'deduplication', 'provider failover', 'digest', 'throttling', 'পছন্দ']
    blocks:
      - type: metaphor
        icon: shop
        title: 'ফার্মেসির খাতা'
        body: |
          ফার্মেসির খাতায় লেখা আছে: রহিম ভাই শুধু ফোনে জানতে চান, রাত ৯টার পরে নয়। ছেলেটা কাউকে জানানোর আগে খাতা দেখে, গতকাল একই খবর দেওয়া হয়েছে কি না দেখে, তারপর ফোন করে। ফোন না লাগলে ছোট ভাইয়ের নম্বরে চেষ্টা করে। প্রতিটা ধাপ একটা আলাদা সিদ্ধান্ত।
      - type: visual
        kind: flow
        caption: 'একটা ঘটনা থেকে ব্যবহারকারীর কাছে: প্রতি ধাপে একটা সিদ্ধান্ত'
        nodes:
          - {id: ev, label: 'OrderShipped', sub: 'ঘটনা', icon: bell, col: 0, row: 0, tip: 'ডোমেইন event। এখানে কোনো মাধ্যম বা provider-এর নাম নেই।'}
          - {id: pref, label: 'পছন্দ দেখা', sub: 'কোন মাধ্যম চালু', icon: list, col: 1.5, row: 0, tip: 'ব্যবহারকারীর নির্বাচন: কোন ধরনের বার্তা, কোন মাধ্যমে। বন্ধ থাকলে এখানেই শেষ।'}
