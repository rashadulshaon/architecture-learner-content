  - q: 'নিচের কোডে সমস্যা কী?'
    lang: php
    code: |
      $start = microtime(true);
      $this->importer->run();
      $took = microtime(true) - $start;
      if ($took > 30) { $this->alert('ধীর'); }
    hint: 'microtime() কোন ঘড়ি দেখে, আর মাঝখানে NTP ঘড়ি বদলালে?'
    options:
      - text: 'wall clock; NTP ঘড়ি বদলালে duration ভুল আসতে পারে, hrtime(true) নিরাপদ'
        correct: true
        why: 'duration মাপতে monotonic clock লাগে। ঘড়ি পিছোলে ঋণাত্মক বা লাফানো সময়ও আসে।'
      - text: 'if শর্ত উল্টো'
        correct: false
        why: 'শর্ত ঠিক আছে, সমস্যা মাপার ঘড়িতে।'
      - text: 'microtime() সেকেন্ডের সঠিকতা দেয় না'
        correct: false
        why: 'সঠিকতা যথেষ্ট; সমস্যা ঘড়ির লাফে।'
    ref: deadline-vs-duration
  - q: 'অর্ডার request-এ ক্লায়েন্ট ৩ সেকেন্ড অপেক্ষা করে। ভেতরে গেটওয়ে কলে `max_duration` ১ সেকেন্ড, retry ২ বার, delay ০.২ + ০.৪ সেকেন্ড। সবচেয়ে খারাপ মোট কত, আর ঠিক আছে?'
    hint: '৩ চেষ্টা + delay।'
    options:
      - text: '৩ সেকেন্ড, ঠিক আছে'
        correct: false
        why: 'delay বাদ পড়েছে।'
      - text: '৩.৬ সেকেন্ড, সীমা ছাড়ায়; চেষ্টার সীমা কমাতে হবে'
        correct: true
        why: '৩ × ১ + ০.২ + ০.৪ = ৩.৬ > ৩। ক্লায়েন্ট আগেই হাল ছাড়ে।'
      - text: '১ সেকেন্ড, কারণ retry একসাথে চলে'
        correct: false
        why: 'retry পরপর চলে, একসাথে নয়।'
      - text: 'অসীম, কারণ retry আছে'
        correct: false
        why: 'max_retries সীমিত, তাই মোট সীমাবদ্ধ।'
    ref: timeout-traps
  - q: '`max_duration` নিয়ে কোনগুলো সত্যি?'
    hint: 'HttpClient-এর মোট সীমা আর ০-র অর্থ।'
    options:
      - text: 'পুরো request + response-এর মোট সর্বোচ্চ সময়'
        correct: true
        why: 'ধীরে-ধীরে ডেটা দেওয়া সার্ভারও এতে আটকায়।'
      - text: '০ দিলে সঙ্গে সঙ্গে timeout হয়'
        correct: false
