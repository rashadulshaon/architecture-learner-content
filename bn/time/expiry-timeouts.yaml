        why: 'প্রতিটা চেষ্টা নিজের সীমা পায়, তাই retry-র মোট সময় আলাদা হিসাব করতে হয়।'
    ref: timeout-budget
  - q: 'গেটওয়ে-কলে timeout হলো। সঠিক ধারণা কোনটা?'
