  - slug: deadline-vs-duration
    title: 'Deadline আর duration: কোনটা জমা রাখবেন, কোনটা গুনবেন'
    kind: concept
    tldr: 'মেয়াদ জমা রাখুন একটা নির্দিষ্ট মুহূর্ত (deadline, expires_at) হিসেবে; সময় গুনতে বা অপেক্ষা মাপতে ব্যবহার করুন duration আর monotonic timer।'
    keywords: ['deadline', 'duration', 'TTL', 'expires_at', 'monotonic', 'countdown']
    blocks:
      - type: text
        body: |
          মেয়াদ বোঝাতে দুটো আলাদা জিনিস আছে। **Deadline** হলো একটা নির্দিষ্ট মুহূর্ত: “১০:০৫:০০ UTC-র পর অবৈধ”। **Duration** হলো সময়ের দৈর্ঘ্য: “৩০০ সেকেন্ড”। মেয়াদ জমা রাখতে deadline ভালো, কারণ সবাই একই মুহূর্ত দেখে। দৈর্ঘ্য জমা রাখলে “শুরু কখন” আলাদা করে মনে রাখতে হয়। উল্টো দিকে কাউন্টডাউন বা timeout মাপতে duration ও monotonic timer সঠিক।
      - type: visual
        kind: table
        caption: 'Deadline বনাম duration: কোথায় কোনটা'
        headers: ['', 'Deadline (মুহূর্ত)', 'Duration (দৈর্ঘ্য)']
        rows:
          - cells: ['উদাহরণ', 'expires_at = 10:05:00Z', 'ttl = 300 সেকেন্ড']
            tip: 'দুটো একই তথ্য, দুই চেহারায়। ইস্যু করার সময় ttl থেকে deadline বানিয়ে জমা রাখুন।'
          - cells: ['কোথায় জমা', 'ডেটাবেসে, token-এ', 'cache TTL, বাকি সময় দেখাতে']
            tip: 'ডেটাবেসে deadline রাখলে পরে “এখন বৈধ কি না” সহজ query। cache নিজে দৈর্ঘ্য মেনে মুছে ফেলে।'
          - cells: ['কার ঘড়ি লাগে', 'সার্ভারের wall clock', 'monotonic clock (hrtime, performance.now)']
            tip: 'duration মাপতে মাঝখানে ঘড়ি লাফালে ক্ষতি নেই। monotonic clock কখনো পিছোয় না।'
          - cells: ['ক্লায়েন্টকে দেখানো', 'বাকি সেকেন্ড পাঠান, নিজে হিসাব করতে দেবেন না', 'কাউন্টডাউন locally চালান']
            tip: 'সার্ভার “আর ২৯৭ সেকেন্ড” বলে; ক্লায়েন্ট নিজের স্টপওয়াচে নামে। ফোনের তারিখ লাগে না।'
      - type: quote
        body: 'মেয়াদ জমা রাখুন deadline হিসেবে; সময় মাপুন duration আর monotonic timer-এ।'
    aside:
      - type: terms
        items:
          - {term: 'TTL', meaning: 'Time to live: জিনিসটা কতক্ষণ বেঁচে থাকবে, সেই দৈর্ঘ্য।'}
          - {term: 'Monotonic clock', meaning: 'যে ঘড়ি শুধু এগোয়, কখনো পিছোয় না। সময় মাপার জন্য, তারিখ জানার জন্য নয়।'}
      - type: refs
        items:
          - {to: 'time/clocks-lie', label: 'Wall clock বনাম monotonic clock'}
    check:
      q: 'কাউন্টডাউন দেখাতে কোনটা পাঠাবেন: expires_at না বাকি সেকেন্ড, আর ক্লায়েন্টে কীভাবে গুনবেন?'
      a: 'সার্ভার বাকি সেকেন্ড পাঠায়। ক্লায়েন্ট `performance.now()` (monotonic) দিয়ে সেটা কমিয়ে দেখায়, যাতে ফোনের তারিখ ভুল হলেও কাউন্টডাউন ঠিক থাকে।'

  - slug: server-authority-grace
    title: 'সার্ভারই বিচারক, সাথে ছোট grace'
    kind: howto
    tldr: 'সার্ভারের Clock দিয়ে expires_at-এর সাথে এখনকার সময় মেলান; ইস্যু আর যাচাইয়ের মাঝে নেটওয়ার্ক ও ঘড়ির সামান্য ফারাকের জন্য ছোট grace দিন।'
    keywords: ['OTP verification', 'ClockInterface', 'grace period', 'leeway', 'countdown', 'Vue']
    blocks:
      - type: text
        body: |
          grace কেন লাগে? কোড ১০:০৫:০০ পর্যন্ত বৈধ। রিনা ১০:০৪:৫৯.৮-এ Send চাপল, কিন্তু দুর্বল মোবাইল নেটওয়ার্কে request হামাগুড়ি দিয়ে সার্ভারে পৌঁছাল ১০:০৫:০০.৪-এ। grace না থাকলে সময়মতো পাঠানো মানুষকেও “মেয়াদ শেষ” শুনতে হয়। কয়েক সেকেন্ডের grace এই দেরি মাফ করে। দাম: চুরি যাওয়া কোড ততক্ষণ বেশি বাঁচে, তাই নিরাপত্তার কোডে একদম ছোট রাখুন।
      - type: code
        lang: php
        file: 'src/Service/OtpVerifier.php'
        code: |
          final readonly class OtpVerifier
          {
              private const GRACE_SECONDS = 5;   // নেটওয়ার্ক দেরি + সামান্য ঘড়ি-ফারাক

              public function __construct(
                  private ClockInterface $clock,
                  private OtpRepository $otps,
              ) {
              }

              public function verify(int $userId, string $code): bool
              {
                  $otp = $this->otps->findLatestFor($userId);

                  if ($otp === null || !hash_equals($otp->getCode(), $code)) {
                      return false;
                  }

                  $lastValid = $otp->getExpiresAt()->modify('+'.self::GRACE_SECONDS.' seconds');

                  return $this->clock->now() <= $lastValid;   // সার্ভারের ঘড়িই বিচারক
              }
          }
        marks:
          - {line: 3, tip: 'grace শুধু প্রযুক্তিগত ফাঁক ঢাকে: কয়েক সেকেন্ড। মেয়াদ বাড়ানোর কৌশল নয়।'}
          - {line: 15, tip: 'hash_equals timing-attack এড়ায়। আর কোড মেলে না বলে এখানেই থামুন।'}
          - {line: 21, tip: 'ClockInterface থেকে সময়, তাই টেস্টে MockClock দিয়ে মেয়াদ পার করা যায়। ক্লায়েন্টের ঘড়ি এখানে আসেই না।'}
      - type: code
        lang: vue
        file: 'src/components/OtpCountdown.vue'
        code: |
          <script setup lang="ts">
          import { onUnmounted, ref } from 'vue'

          // সার্ভার বলেছে: "আর ৩০০ সেকেন্ড"
          const props = defineProps<{ expiresInSeconds: number }>()

          const startedAt = performance.now()           // monotonic
          const left = ref(props.expiresInSeconds)

          const timer = setInterval(() => {
            const gone = Math.floor((performance.now() - startedAt) / 1000)
            left.value = Math.max(0, props.expiresInSeconds - gone)
            if (left.value === 0) clearInterval(timer)
          }, 1000)
          onUnmounted(() => clearInterval(timer))
          </script>

          <template>
            <p v-if="left > 0">{{ left }} সেকেন্ড বাকি</p>
            <p v-else>কোডের মেয়াদ শেষ, নতুন কোড নিন।</p>
          </template>
        marks:
          - {line: 7, tip: 'performance.now() monotonic; ফোনের তারিখ বদলালেও এটা এগোয় একই গতিতে।'}
          - {line: 11, tip: 'ফোনের Date নয়, কেটে-যাওয়া সময় দিয়ে বাকি সেকেন্ড হিসাব। শুধু দেখানোর জন্য, সিদ্ধান্ত সার্ভারের।'}
    aside:
      - type: tips
        items:
          - 'JWT যাচাইয়ে লাইব্রেরির `leeway` বা clock skew সেটিং একই ধারণা। সাধারণত ৫-৩০ সেকেন্ড।'
          - 'ব্যবসায়িক grace আলাদা: সাবস্ক্রিপশন শেষের পরে ৩ দিন সেবা চালু রাখা। এটা নীতি, কোডে স্পষ্ট নাম দিন (graceUntil)।'
      - type: pitfalls
        items:
          - 'grace অনেক বড় করলে মেয়াদের অর্থই থাকে না। নিরাপত্তা-সংক্রান্ত কোডে ছোটই রাখুন।'
    check:
      q: 'ইস্যুর ৫ মিনিট ১ সেকেন্ডে এল একটা OTP, grace ৫ সেকেন্ড। কেন গ্রহণ করা হবে, আর grace ৫ মিনিট কেন ভুল?'
      a: 'প্রযুক্তিগত দেরি ও ঘড়ির সামান্য ফারাক ঢাকতে ৫ সেকেন্ড যথেষ্ট, তাই গ্রহণ। grace ৫ মিনিট হলে মেয়াদ দ্বিগুণ হয়ে যায়, নিরাপত্তা দুর্বল।'

  - slug: timeout-budget
    title: 'Timeout budget: পুরো request-এর সময় ভাগ করে খরচ'
    kind: howto
    tldr: 'প্রতি কলে আলাদা timeout না দিয়ে পুরো request-এর একটা মোট deadline ধরুন। সেটা hrtime দিয়ে গুনুন আর প্রতিটা ধাপকে শুধু বাকিটুকু দিন।'
    keywords: ['timeout budget', 'deadline propagation', 'HttpClient', 'max_duration', 'hrtime', 'timeout']
    blocks:
      - type: text
        body: |
          একটা অর্ডার request-এ ক্লায়েন্ট ৩ সেকেন্ডের বেশি অপেক্ষা করবে না। ভেতরে ডেটাবেস, পেমেন্ট গেটওয়ে, ইমেইল queue জড়িত। প্রতিটার আলাদা “১০ সেকেন্ড” timeout দিলে মোট হিসাব বেরিয়ে যায়। এজন্য মোট ৩ সেকেন্ডকে বাজেট ধরুন, প্রতিটা ধাপ থেকে খরচ বাদ দিন, আর বাজেট শেষ হলে আর কাজ শুরু করবেন না।
      - type: visual
        kind: bars
        caption: '৩০০০ms বাজেট, ধাপ ধরে ভাগ'
        items:
          - {label: 'মোট বাজেট', value: 3000, display: '3000ms', tone: accent, tip: 'ক্লায়েন্টের সর্বোচ্চ অপেক্ষা। এর চেয়ে বেশি লাগলে ক্লায়েন্ট আগেই হাল ছাড়বে।'}
          - {label: 'ডেটাবেস', value: 300, display: '300ms', tone: good, tip: 'সাধারণ query; বাজেটের সামান্য অংশ।'}
          - {label: 'পেমেন্ট গেটওয়ে', value: 1500, display: '1500ms', tone: warn, tip: 'সবচেয়ে ধীর ধাপ, তাই সবচেয়ে বড় অংশ। এর timeout এর চেয়ে বেশি দেওয়া যাবে না।'}
          - {label: 'queue-তে ইমেইল', value: 100, display: '100ms', tone: good, tip: 'শুধু message পাঠানো, ইমেইল নয়। দ্রুত।'}
          - {label: 'বাকি (নিরাপত্তা)', value: 1100, display: '1100ms', tone: muted, tip: 'নেটওয়ার্ক, serialization আর অপ্রত্যাশিত ধীরতার জন্য রাখা।'}
      - type: code
        lang: php
        file: 'src/Support/Deadline.php'
        code: |
          final class Deadline
          {
              private readonly int $endNs;

              public function __construct(int $budgetMs)
              {
                  $this->endNs = hrtime(true) + $budgetMs * 1_000_000;   // monotonic
              }

              public function remainingSeconds(): float
              {
                  return max(0.0, ($this->endNs - hrtime(true)) / 1_000_000_000);
              }
          }

          // ব্যবহার
          $deadline = new Deadline(3000);
          if ($deadline->remainingSeconds() <= 0.0) {
              throw new DeadlineExceeded();      // max_duration: 0 মানে সীমাহীন!
          }
          $response = $this->http->request('POST', $url, [
              'max_duration' => min(1.5, $deadline->remainingSeconds()),
          ]);
        marks:
          - {line: 7, tip: 'hrtime(true) monotonic, ঘড়ি লাফালেও বাজেট ঠিক গোনা হয়।'}
          - {line: 18, tip: 'HttpClient-এ max_duration ০ বা কম মানে সীমাহীন। তাই আগে শেষ কি না যাচাই।'}
          - {line: 22, tip: 'প্রতিটা কলে নিজের সীমা (১.৫s), আবার বাকি বাজেটের চেয়ে বেশি নয়। ছোটটাই কার্যকর।'}
    aside:
      - type: terms
        items:
          - {term: 'timeout (HttpClient)', meaning: 'idle timeout: ডেটা না এলে কতক্ষণ অপেক্ষা। মোট সময় নয়।'}
          - {term: 'max_duration', meaning: 'পুরো request + response-এর মোট সর্বোচ্চ সময়, সেকেন্ডে।'}
      - type: tips
        items:
          - 'ভেতরের সার্ভিসকে বাকি বাজেট হেডারে জানান (যেমন `X-Deadline-Ms`) যাতে তারাও হিসাব রাখে।'
    check:
      q: 'HttpClient-এ `timeout` আর `max_duration`-এর পার্থক্য কী, আর বাজেট ধরে রাখতে কোনটা লাগে?'
      a: '`timeout` হলো ডেটা না আসার idle সময়, `max_duration` পুরো request-এর মোট সীমা। মোট বাজেট ধরে রাখতে `max_duration` লাগে।'

  - slug: timeout-traps
    title: 'Timeout-এর তিন ফাঁদ: ভেতরে বড়, retry-তে গুণ, সীমাহীন'
    kind: pitfall
    tldr: 'ভেতরের timeout বাইরেরটার চেয়ে বড় হলে বাইরে হাল ছেড়ে দিলেও ভেতরে কাজ চলে। retry timeout-কে গুণ করে। timeout না দিলে একটা ঝুলে থাকা কল সব আটকায়।'
    keywords: ['timeout', 'retry', 'nested timeout', 'retry_failed', 'unbounded wait', 'HttpClient']
    blocks:
      - type: text
        body: |
          ক্লায়েন্ট ৩ সেকেন্ড পরে হাল ছেড়ে দেয়। কিন্তু সার্ভারের ভেতরে গেটওয়ে-কলের timeout ১০ সেকেন্ড আর তার ওপর ৩ বার retry: সবচেয়ে খারাপ ৪০ সেকেন্ড। ক্লায়েন্ট চলে গেছে, তবু সার্ভার কাজ করে চলেছে, আর কাজটা শেষে হয়তো সফলও হয়। ব্যবহারকারী জানে না কী হলো। তৃতীয় ফাঁদ হলো কোনো যুক্তিসংগত timeout-ই না থাকা: গেটওয়ে ঝুলে গেলে যে PHP worker ওই কল করে, সে শুধু অপেক্ষা করতেই থাকে। ২০টা worker থাকলে ২০টা আটকে-যাওয়া request-ই পুরো সাইট থামিয়ে দিতে যথেষ্ট।
      - type: code
        lang: yaml
        file: 'config/packages/framework.yaml'
        variant: bad
        code: |
          framework:
              http_client:
                  scoped_clients:
                      gateway.client:
                          base_uri: '%env(GATEWAY_URL)%'
                          timeout: 10         # শুধু idle; মোট সীমা নেই
                          retry_failed:
                              max_retries: 3  # ৪ বার × ১০ সেকেন্ড = ৪০ সেকেন্ড
        marks:
          - {line: 6, tip: '১০ সেকেন্ড ক্লায়েন্টের ৩ সেকেন্ডের চেয়ে বড়। বাইরে হাল ছাড়ার পরেও ভেতরে কাজ চলবে।'}
          - {line: 8, tip: 'প্রতিটা retry-তে আবার পুরো timeout। সবচেয়ে খারাপ সময় গুণ হয়ে যায়।'}
      - type: code
        lang: yaml
        file: 'config/packages/framework.yaml'
        variant: good
        code: |
          framework:
              http_client:
                  scoped_clients:
                      gateway.client:
                          base_uri: '%env(GATEWAY_URL)%'
                          timeout: 0.5
                          max_duration: 0.8   # প্রতি চেষ্টার মোট সীমা
                          retry_failed:
                              max_retries: 2
                              delay: 100
                              multiplier: 2   # ৩ × ০.৮ + ০.৩ = ২.৭ সেকেন্ড < ৩
        marks:
          - {line: 7, tip: 'সীমা আছে, আর মোট সবচেয়ে খারাপ ২.৭ সেকেন্ড, ক্লায়েন্টের ৩ সেকেন্ডের ভেতরে।'}
          - {line: 9, tip: 'retry কম আর সীমিত। শুধু idempotent কলে retry করা নিরাপদ, টাকা কাটার কলে idempotency key ছাড়া নয়।'}
      - type: points
        title: 'তিনটা নিয়ম'
        style: check
        items:
          - 'ভেতরের সব timeout মিলিয়ে বাইরের timeout-এর চেয়ে ছোট।'
          - 'retry-র সবচেয়ে খারাপ মোট সময় আগে হিসাব করুন।'
          - 'প্রতিটা বাইরের কলে স্পষ্ট timeout; ডিফল্টের ভরসা নয়।'
    aside:
      - type: pitfalls
        items:
          - 'timeout হওয়া মানে কাজ না হওয়া নয়। গেটওয়েতে টাকা কাটা হয়ে গেছে, শুধু উত্তর আসেনি। ফল “অজানা”, ব্যর্থ নয়।'
      - type: refs
        items:
          - {to: 'payments/unknown-outcomes', label: 'Timeout-এর পরে “হলো কি না জানি না”'}
          - {to: 'messaging/dlq-retries', label: 'Retry আর backoff'}
    check:
      q: 'ক্লায়েন্ট ৩ সেকেন্ড অপেক্ষা করে। ভেতরের কলের একেকটা চেষ্টা সর্বোচ্চ ১ সেকেন্ড, retry ২ বার। এটা কি নিরাপদ?'
      a: 'প্রায়: ৩ চেষ্টা × ১ সেকেন্ড = ৩ সেকেন্ড, তার ওপর retry-র delay যুক্ত হয়ে সীমা ছাড়ায়। চেষ্টার সময় কমিয়ে (যেমন ০.৮) মোট ৩ সেকেন্ডের ভেতরে রাখুন।'

flashcards:
  - q: 'মেয়াদ কার ঘড়িতে ঠিক হওয়া উচিত?'
    a: 'সার্ভারের ঘড়িতে। ক্লায়েন্টের ঘড়ি ভুল বা ইচ্ছাকৃতভাবে বদলানো হতে পারে, তাই নিরাপত্তার সিদ্ধান্তে নেওয়া যায় না।'
    more: |
      ক্লায়েন্ট শুধু সার্ভারের দেওয়া বাকি সময় দেখায়। সার্ভার প্রতিটা request-এ নিজের Clock দিয়ে মেয়াদ যাচাই করে। এতে ফোনের তারিখ বদলে ট্রায়াল বা OTP-র মেয়াদ বাড়ানো যায় না।
    ref: phone-clock-otp
  - q: 'Deadline আর duration-এর পার্থক্য কী?'
    a: 'Deadline একটা নির্দিষ্ট মুহূর্ত (১০:০৫ UTC-র পর অবৈধ)। Duration সময়ের দৈর্ঘ্য (৩০০ সেকেন্ড)।'
    more: |
      মেয়াদ জমা রাখতে deadline ভালো, কারণ সবাই একই মুহূর্ত দেখে। কাউন্টডাউন বা অপেক্ষা মাপতে duration ও monotonic timer ঠিক। ইস্যুর সময় ttl থেকে expires_at বানিয়ে জমা রাখা সাধারণ নিয়ম।
    ref: deadline-vs-duration
  - q: 'Monotonic clock কী, আর কেন timeout মাপতে এটা ভালো?'
    a: 'যে ঘড়ি কখনো পিছোয় না। NTP বা হাতে সময় বদলালেও লাফায় না, তাই কত সময় কেটেছে মাপতে নিরাপদ।'
    more: |
      PHP-তে `hrtime(true)`, ব্রাউজারে `performance.now()`। এগুলো তারিখ জানায় না, শুধু কতটা এগোল তা বলে। wall clock (`time()`, `Date.now()`) তারিখ জানতে ভালো, দৈর্ঘ্য মাপতে নয়।
    ref: deadline-vs-duration
  - q: 'ক্লায়েন্টকে কাউন্টডাউন দেখাতে সার্ভার কী পাঠাবে?'
    a: 'বাকি সেকেন্ড (যেমন ২৯৭)। ক্লায়েন্ট monotonic timer দিয়ে সেটা কমায়। ফোনের তারিখ লাগে না।'
    more: |
      expires_at পাঠালে ক্লায়েন্ট নিজের ঘড়ির সাথে তুলনা করবে, আর ঘড়ি ভুল হলে ভুল কাউন্টডাউন। বাকি সময় পাঠালে ক্লায়েন্টের ঘড়ি বাদ পড়ে। তবে চূড়ান্ত সিদ্ধান্ত সবসময় সার্ভারের।
    ref: server-authority-grace
  - q: 'Grace period কী, আর কত বড় রাখা উচিত?'
    a: 'মেয়াদের পরে অল্প বাড়তি সময়, নেটওয়ার্ক দেরি ও ঘড়ির সামান্য ফারাক ঢাকতে। নিরাপত্তায় কয়েক সেকেন্ড, বেশি নয়।'
    more: |
      JWT-তে একে leeway বলে (সাধারণত ৫-৩০ সেকেন্ড)। ব্যবসায়িক grace আলাদা: সাবস্ক্রিপশন শেষের পরে ৩ দিন সেবা চালু রাখা। দুটোর নাম ও কোড আলাদা রাখুন, নইলে গুলিয়ে যায়।
    ref: server-authority-grace
  - q: 'Timeout budget কী?'
    a: 'পুরো request-এর জন্য একটা মোট সময়সীমা, যা ধাপে ধাপে ভাগ হয়। প্রতিটা ধাপ শুধু বাকিটুকু পায়।'
    more: |
      ক্লায়েন্ট ৩ সেকেন্ড অপেক্ষা করলে ভেতরের সব কল মিলিয়ে ৩ সেকেন্ডের কম হতে হবে। `Deadline` বস্তু hrtime দিয়ে গোনে আর বাজেট শেষ হলে নতুন কাজ শুরু না করে error দেয়।
    ref: timeout-budget
  - q: 'Symfony HttpClient-এ `timeout` আর `max_duration` কী?'
    a: '`timeout` হলো idle timeout (ডেটা না এলে অপেক্ষা)। `max_duration` পুরো request-এর মোট সীমা সেকেন্ডে; ০ বা কম মানে সীমাহীন।'
    more: |
      একটা ধীরে-ধীরে ডেটা-দেওয়া সার্ভার idle timeout ঠেকায় না, কিন্তু max_duration ঠেকায়। বাজেট রাখতে max_duration লাগে। আর বাজেট শেষ হলে ০ পাঠাবেন না, কারণ ০ মানে সীমাহীন।
    ref: timeout-budget
  - q: 'ভেতরের timeout বাইরের timeout-এর চেয়ে বড় হলে কী ঘটে?'
    a: 'বাইরের ক্লায়েন্ট হাল ছেড়ে দেয়, কিন্তু ভেতরে কাজ চলতেই থাকে। কাজটা শেষে সফল হলে ব্যবহারকারী জানে না।'
    more: |
      নিয়ম: ভেতরের সব timeout (retry-সহ) মিলিয়ে বাইরের timeout-এর কম। নইলে সার্ভার অকারণে সম্পদ খরচ করে, আর ফল “অজানা” হয়ে ঘুরে বেড়ায়।
    ref: timeout-traps
  - q: 'Retry timeout-এ কী প্রভাব ফেলে?'
    a: 'সবচেয়ে খারাপ মোট সময় গুণ হয়: (retry + ১) × প্রতি চেষ্টার timeout + delay। আগে হিসাব করে বাজেটের ভেতরে রাখুন।'
    more: |
      ৩ বার retry মানে ৪ চেষ্টা × ১০ সেকেন্ড = ৪০ সেকেন্ড, অথচ ক্লায়েন্ট ৩ সেকেন্ডের। চেষ্টা কমান, প্রতি চেষ্টার সীমা ছোট করুন। আর টাকা কাটার মতো কলে retry করতে হলে idempotency key লাগে।
    ref: timeout-traps
  - q: 'বাইরে-যাওয়া কলে timeout না থাকলে আপনার PHP worker-গুলোর কী হয়?'
    a: 'ঝুলে-থাকা সার্ভিসকে যে worker ডাকে, সে অপেক্ষাতেই আটকে থাকে। সব worker আটকালে সাইট সাড়া দেয় না। প্রতিটা কলে `timeout` আর `max_duration` দিন।'
    more: |
      PHP-FPM-এ worker-এর সংখ্যা ঠিক করা, ধরা যাক ২০। গেটওয়ে ঝুলে গেলে সেটা ছুঁয়ে যাওয়া ২০টা request-ই সবগুলো worker দখল করতে যথেষ্ট, তখন গেটওয়ে না ডাকা পাতাও আর খোলে না। বাজেট-মাপের max_duration থাকলে “ঝুলে থাকা” দ্রুত error হয়ে যায়।
    ref: timeout-traps

quiz:
  - q: 'ট্রায়াল ৩০ দিনের। নিচের কোন নকশাটা সবচেয়ে নিরাপদ?'
