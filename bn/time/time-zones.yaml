slides:
  - slug: meeting-moved
    title: 'মিটিং হঠাৎ এক ঘণ্টা সরে গেল'
    kind: story
    tldr: 'লন্ডনের ব্যবহারকারীর “প্রতি সোমবার সকাল ১০টা” মিটিং UTC-তে জমা রাখলে DST বদলের পরে সেটা ১১টায় সরে যায়; কোডের কোনো ভুল ছাড়াই।'
    keywords: ['DST', 'daylight saving', 'UTC', 'recurring meeting', 'time zone', 'ডিএসটি']
    blocks:
      - type: text
        body: |
          লন্ডনের সুমি ফেব্রুয়ারিতে একটা সাপ্তাহিক মিটিং বানাল: “প্রতি সোমবার সকাল ১০টা”। অ্যাপ প্রথম তারিখটা UTC-তে জমা রাখল, আর এরপরের প্রতিটা সোমবার ঠিক ৭ দিন (১৬৮ ঘণ্টা) যোগ করে বানাল। ২৯ মার্চ লন্ডনে ঘড়ি এক ঘণ্টা এগোল (DST শুরু), আর মিটিং সুমির ক্যালেন্ডারে হঠাৎ ১১টায় দেখাল। UTC-র সময় ঠিকই আছে, কিন্তু সুমি যা চেয়েছিল, সেটা নয়।
      - type: visual
        kind: table
        caption: 'একই UTC সময়, লন্ডনের ঘড়িতে ফেব্রুয়ারি ও এপ্রিলে আলাদা'
        headers: ['তারিখ', 'জমা রাখা UTC', 'লন্ডনে দেখায়', 'সুমি চেয়েছিল']
        rows:
          - cells: ['২ ফেব্রুয়ারি', '১০:০০ UTC', '১০:০০ (GMT)', '১০:০০']
            tip: 'শীতকালে লন্ডনের সময় UTC-র সমান (GMT), তাই এখানে সব ঠিক দেখায়।'
          - cells: ['২৩ মার্চ', '১০:০০ UTC', '১০:০০ (GMT)', '১০:০০']
            tip: 'DST শুরুর আগের শেষ সোমবার। এখনো গোলমাল নেই।'
          - cells: ['৬ এপ্রিল', '১০:০০ UTC', '১১:০০ (BST)', '১০:০০']
            tip: 'এখন লন্ডন UTC+১ ঘণ্টা (BST)। একই UTC-র ঘড়িতে মিটিং ১১টা দেখায়, সুমির অনুমতি ছাড়াই এক ঘণ্টা সরে গেছে।'
      - type: quote
        body: 'ভবিষ্যতের স্থানীয় ঘটনার সময় “আমি সকাল ১০টায় চাই”, UTC নয়।'
    aside:
      - type: story
        title: 'ওষুধ খাওয়ার রিমাইন্ডার'
        body: |
          এক হেলথ অ্যাপে “রোজ রাত ৯টায় ওষুধ” রিমাইন্ডার UTC-তে জমা ছিল। দেশে DST বদলের দিন রিমাইন্ডার রাত ১০টায় চলে গেল, আর ব্যবহারকারীরা ওষুধের সময় নিয়ে অভিযোগ করল।
      - type: tips
        items:
          - 'বাংলাদেশে এখন DST নেই (UTC+৬ স্থির), তাই এখানে বসে এই সমস্যা চোখে পড়ে না। যে ব্যবহারকারী ইউরোপ বা আমেরিকায় আছে, তার পড়ে।'
    check:
      q: 'রিমাইন্ডার “রোজ রাত ৯টা” UTC-তে জমা রেখে প্রতিদিন ২৪ ঘণ্টা যোগ করলে DST বদলের পরে কী ঘটে, আর কেন?'
      a: 'ব্যবহারকারীর ঘড়িতে সময় এক ঘণ্টা সরে যায়। কারণ UTC-তে DST নেই, কিন্তু ব্যবহারকারীর স্থানীয় ঘড়ি এক ঘণ্টা এগোয় বা পিছোয়।'

  - slug: instant-vs-wall
    title: 'দুই রকম সময়: মুহূর্ত আর দেয়ালঘড়ি'
    kind: concept
    tldr: 'ঘটে-যাওয়া মুহূর্ত UTC-তে জমা রাখুন; ভবিষ্যতের স্থানীয় ঘটনা জমা রাখুন স্থানীয় সময় আর zone-এর নাম (Europe/London) দিয়ে, offset দিয়ে নয়।'
    keywords: ['instant', 'wall time', 'timestamptz', 'IANA time zone', 'UTC', 'offset']
    blocks:
      - type: metaphor
        icon: globe
        title: 'প্রবাসী ভাইয়ের সাথে ভিডিও কল'
        body: |
          ঢাকার ভাই আর লন্ডনের ভাই কথা বলেছিলেন গতকাল ঠিক ঐ মুহূর্তে। মুহূর্তটা এক, দুজনের ঘড়ি আলাদা সময় দেখায়। এটাই “অতীতের মুহূর্ত” এবং এটা UTC-তে জমা থাকে। কিন্তু “আগামী মাসে প্রতি সোমবার লন্ডনের সকাল ১০টায় কল” হলো দেয়ালঘড়ির সময় আর জায়গার নিয়ম। এটা জমা থাকবে ঠিক তেমনই।
      - type: visual
        kind: compare
        caption: 'কোন সময় কীভাবে জমা রাখবেন'
        columns:
          - title: 'ঘটে-যাওয়া মুহূর্ত'
            tone: good
            icon: history
            tip: 'অর্ডার তৈরি, পেমেন্ট, লগইন, লগ। একবারই ঘটেছে, তাই একটা নির্দিষ্ট মুহূর্ত।'
            items:
              - 'UTC-তে জমা: timestamptz'
              - 'দেখানোর সময় ব্যবহারকারীর zone-এ বদলান'
              - 'উদাহরণ: paid_at, created_at'
          - title: 'ভবিষ্যতের স্থানীয় ঘটনা'
            tone: accent
            icon: calendar
            tip: 'মিটিং, রিমাইন্ডার, দোকান খোলার সময়। মানুষের ঘড়ি মেনে চলে, আর নিয়ম পরে বদলাতে পারে।'
            items:
              - 'স্থানীয় সময় (zone ছাড়া) + zone-এর নাম'
              - 'প্রতিবার তখনকার নিয়মে UTC হিসাব করুন'
              - 'উদাহরণ: ১০:০০ + Europe/London'
      - type: quote
        body: 'অতীত: UTC। ভবিষ্যতের স্থানীয় ঘটনা: স্থানীয় সময় + zone-এর নাম।'
    aside:
      - type: terms
        items:
          - {term: 'Offset', meaning: 'UTC থেকে ঘণ্টার ফারাক, যেমন +01:00। শুধু একটা মুহূর্তের জন্য সত্যি।'}
          - {term: 'IANA zone', meaning: 'জায়গার নামে নিয়মের পূর্ণ তালিকা, যেমন Europe/London বা Asia/Dhaka। DST-র ইতিহাস ও ভবিষ্যৎ নিয়ম এতে থাকে।'}
      - type: pitfalls
        items:
          - '“+01:00” জমা রাখা zone নয়; DST শেষ হলে লন্ডনের offset বদলায়, কিন্তু জমানো “+01:00” থেকে যায়।'
          - 'সরকার কখনো কখনো DST-র নিয়ম বদলায়। zone-এর নাম রাখলে tzdata হালনাগাদে ভবিষ্যৎ ঘটনাও ঠিক হয়।'
    check:
      q: 'কোনটা UTC-তে জমা রাখবেন আর কোনটা “স্থানীয় সময় + zone” দিয়ে: (ক) পেমেন্ট হয়েছে (খ) প্রতি সোমবার সকাল ১০টা লন্ডনে মিটিং?'
      a: '(ক) UTC-তে, কারণ ঘটে-যাওয়া মুহূর্ত। (খ) স্থানীয় ১০:০০ আর Europe/London নাম দিয়ে, কারণ ভবিষ্যতের স্থানীয় ঘটনা DST-র নিয়ম মেনে চলে।'

  - slug: dst-gap-overlap
    title: 'DST-র ফাঁক আর দ্বিগুণ ঘণ্টা'
    kind: pitfall
    tldr: 'বসন্তে এক ঘণ্টার স্থানীয় সময় নেই (gap); শরতে এক ঘণ্টা দুইবার আসে (overlap)। সেই সময়ে ঘটনা বসালে কোড চুপচাপ আন্দাজ করে; দুই ক্ষেত্রই ধরে ইচ্ছা করে সিদ্ধান্ত নিন।'
    keywords: ['DST gap', 'DST overlap', 'ambiguous time', 'nonexistent time', 'Europe/London', 'PHP DateTime']
    blocks:
      - type: text
        body: |
          লন্ডনে ২৯ মার্চ ২০২৬ রাত ১টায় ঘড়ি সোজা ২টায় লাফ দেয়। তাই **০১:৩০ বলে কিছু নেই**। ২৫ অক্টোবর ঘড়ি ২টা থেকে ১টায় ফেরে, তাই **০১:৩০ দুইবার আসে**। আপনি যদি এই সময়ে কিছু ঘটাতে বলুন, কোড হয় আন্দাজে সরিয়ে দেয়, নয়তো আগেরটা বা পরেরটা বেছে নেয়, আর আপনাকে জানায় না। সমাধান: স্থানীয় সময়ের সাথে মেলে এমন সব আসল মুহূর্তের তালিকা বের করুন, তারপর বেছে নিন।
      - type: visual
        kind: table
        caption: 'লন্ডনে ২০২৬ সালের দুই DST সীমানা'
        headers: ['তারিখ', 'ঘড়িতে কী ঘটে', 'স্থানীয় ০১:৩০-এর অবস্থা']
        rows:
          - cells: ['২৯ মার্চ', '০১:০০ → ০২:০০ লাফ', 'নেই (gap)']
            tip: 'বসন্তে ঘড়ি এগোয়। ০১:০০ থেকে ০২:০০-র মাঝের সব স্থানীয় সময় অস্তিত্বহীন।'
          - cells: ['২৫ অক্টোবর', '০২:০০ → ০১:০০ ফেরা', 'দুইবার (overlap)']
            tip: 'শরতে ঘড়ি পিছোয়। ০১:০০-০২:০০ একবার BST-তে, আবার GMT-তে ঘটে, একই সংখ্যা দুই আলাদা মুহূর্ত।'
      - type: code
        lang: php
        file: 'DST সীমানার আচরণ'
        variant: bad
        code: |
          $london = new DateTimeZone('Europe/London');

          // gap: ০১:৩০ নেই, PHP চুপচাপ ০২:৩০ BST বানায়
          $a = new DateTimeImmutable('2026-03-29 01:30', $london);
          echo $a->format('H:i T');       // 02:30 BST

          // overlap: ০১:৩০ দুইটা, PHP চুপচাপ একটা বেছে নেয় (কোনটা, তা PHP-র সংস্করণে বদলায়)
          $b = new DateTimeImmutable('2026-10-25 01:30', $london);
          echo $b->format('H:i T P');     // 01:30 BST +01:00 অথবা 01:30 GMT +00:00
        marks:
          - {line: 4, tip: 'ভুল ইনপুটে error নেই; সময় এক ঘণ্টা সরে যায়। ব্যবহারকারী জানে না।'}
          - {line: 8, tip: 'দুই সম্ভাব্য মুহূর্তের মধ্যে একটা, নীরবে; PHP-র সংস্করণ বদলালে বাছাইও বদলাতে পারে। অন্যটা কখনো আসতেই পারে না।'}
      - type: code
        lang: php
        file: 'src/Time/LocalTimeResolver.php'
        variant: good
        code: |
          /** @return list<DateTimeImmutable> 0 = gap, 1 = normal, 2 = overlap (earlier first) */
          function instantsFor(string $wall, DateTimeZone $zone): array
          {
              $naive = new DateTimeImmutable($wall, new DateTimeZone('UTC'));
              $found = [];
              foreach ([-86400, 86400] as $shift) {   // আগের দিন আর পরের দিনের offset
                  $probe = $naive->setTimestamp($naive->getTimestamp() + $shift);
                  $utc = $naive->setTimestamp($naive->getTimestamp() - $zone->getOffset($probe));
                  $local = $utc->setTimezone($zone);
                  // যে প্রার্থী ফিরে একই স্থানীয় সময় দেখায়, শুধু সেটা রাখি
                  if ($local->format('Y-m-d H:i') === $naive->format('Y-m-d H:i')) {
                      $found[$utc->getTimestamp()] = $local;
                  }
              }
              ksort($found);
              return array_values($found);
          }

          function resolve(string $wall, DateTimeZone $zone, bool $earlier = true): DateTimeImmutable
          {
              $all = instantsFor($wall, $zone);
              return match (count($all)) {
                  0 => throw new DomainException("$wall does not exist in {$zone->getName()}"),
                  1 => $all[0],
                  default => $earlier ? $all[0] : $all[1],
              };
          }
        marks:
          - {line: 6, tip: 'DST বদলের আশেপাশে zone-এর দুটো offset থাকে (+00:00 আর +01:00)। দুটোই চেষ্টা করে দেখা হয় কোন কোন UTC মুহূর্ত থেকে দেওয়া স্থানীয় সময়টা পাওয়া যায়।'}
          - {line: 16, tip: 'প্রার্থী শূন্য হলে সময়টা gap-এ পড়েছে; দুটো হলে overlap-এ; একটা হলে সাধারণ সময়।'}
          - {line: 23, tip: 'নিয়মটা আপনি ইচ্ছা করে বেছে নেন। gap-এর সময় নাকচ হয়, ব্যবহারকারী অন্য সময় দিতে পারেন; overlap-এ আগেরটা না পরেরটা, সেই flag লাগে।'}
      - type: points
        title: 'ঠিক করা সংস্করণ কী করে'
        style: check
        items:
          - 'gap-এ প্রার্থী শূন্য: নাকচ করে ব্যবহারকারীর কাছ থেকে অন্য সময় নিন (বা নিয়ম ঠিক করুন, যেমন পরের বৈধ সময়)।'
          - 'overlap-এ প্রার্থী দুটো: আগেরটা না পরেরটা আপনি বেছে নেন, তারপর UTC-তে জমা রাখেন।'
          - 'রোজকার কাজের জন্য “+২৪ ঘণ্টা” নয়, স্থানীয় zone-এ `modify(''+1 day'')`।'
    aside:
      - type: remember
        body: 'স্থানীয় সময়ে ঘণ্টা যোগ করা এক জিনিস, দিন যোগ করা আরেক জিনিস। দিনের হিসাব স্থানীয় zone-এ করুন।'
      - type: tips
        items:
          - 'টেস্টে ২৯ মার্চ আর ২৫ অক্টোবরের ০১:৩০ নিয়ে অন্তত দুটো কেস রাখুন।'
    check:
      q: 'লন্ডনে ২৫ অক্টোবর ২০২৬-এর “০১:৩০” কেন অস্পষ্ট, আর UTC-তে জমা রাখলে সেটা কীভাবে মেটে?'
      a: 'ঐ দিন ০১:০০-০২:০০ দুইবার ঘটে (BST ও GMT)। UTC-তে জমা রাখলে দুটো আলাদা মুহূর্ত (০০:৩০ বা ০১:৩০ UTC) হয়ে যায়, তাই কোনটা তা স্পষ্ট থাকে।'

  - slug: store-and-compute
    title: 'জমা রাখা আর হিসাব করা: SQL ও PHP'
    kind: howto
    tldr: 'অতীতের মুহূর্ত timestamptz-এ। ভবিষ্যতের ঘটনায় স্থানীয় সময় + zone-এর নাম, আর scheduler-এর জন্য আলাদা হিসাব-করা next_run_at (UTC)।'
    keywords: ['timestamptz', 'DateTimeImmutable', 'DateTimeZone', 'next_run_at', 'recurring', 'Doctrine']
    blocks:
      - type: code
        lang: sql
        file: 'migration (PostgreSQL)'
        code: |
          -- অতীতের মুহূর্ত: timestamptz, ভেতরে UTC
          CREATE TABLE payment (
              id       BIGSERIAL PRIMARY KEY,
              paid_at  TIMESTAMPTZ NOT NULL DEFAULT now()
          );

          -- ভবিষ্যতের স্থানীয় ঘটনা: দেয়ালঘড়ি + zone-এর নাম
          CREATE TABLE meeting (
              id           BIGSERIAL PRIMARY KEY,
              local_start  TIMESTAMP NOT NULL,       -- zone ছাড়া, যেমন ১০:০০
              timezone     VARCHAR(40) NOT NULL,     -- 'Europe/London'
              next_run_at  TIMESTAMPTZ NOT NULL      -- হিসাব-করা UTC
          );
        marks:
          - {line: 4, tip: 'timestamptz ভেতরে UTC রাখে এবং সেশনের zone-এ দেখায়। নামটা বিভ্রান্তিকর, আসলে এতে zone জমা থাকে না।'}
          - {line: 11, tip: 'এই কলামে কখনো +01:00 নয়, জায়গার নাম রাখুন। নাম থেকেই যেকোনো তারিখের সঠিক offset মেলে।'}
          - {line: 12, tip: 'scheduler-এর কাজে লাগে। এটা সবসময় local_start আর timezone থেকে হিসাব করা মান।'}
      - type: code
        lang: php
        file: 'src/Entity/Meeting.php'
        code: |
          public function occurrenceUtc(int $weeksAhead): DateTimeImmutable
          {
              // জমানো দেয়ালঘড়ির সময়টাকে নির্দিষ্ট zone-এর সময় বানান
              $local = new DateTimeImmutable(
                  $this->localStart->format('Y-m-d H:i:s'),
                  new DateTimeZone($this->timezone),
              );

              // স্থানীয় zone-এ +N সপ্তাহ: দেয়ালঘড়ি অক্ষুণ্ণ, DST-তেও ১০:০০
              return $local->modify("+{$weeksAhead} weeks")
                  ->setTimezone(new DateTimeZone('UTC'));
          }
        marks:
          - {line: 4, tip: 'সময়ের সাথে zone-এর নাম জুড়ে দেওয়ায় তারিখ ধরে সঠিক offset (GMT বা BST) নেওয়া হয়।'}
          - {line: 10, tip: 'modify() স্থানীয় zone-এ কাজ করে, তাই দেয়ালঘড়ি বদলায় না। UTC-তে ১৬৮ ঘণ্টা যোগ করলে DST-তে সরে যেত।'}
          - {line: 11, tip: 'শেষে UTC-তে রূপান্তর, সেটাই next_run_at-এ লিখুন। scheduler শুধু UTC-র সাথে তুলনা করে।'}
    aside:
      - type: tips
        items:
          - 'PHP-র default timezone UTC রাখুন (`date.timezone = UTC`) আর যেখানে zone দরকার সেখানে স্পষ্ট DateTimeZone দিন।'
          - 'প্রতিবার ঘটনা চলার পরে সেই মুহূর্ত থেকে পরেরটা হিসাব করে next_run_at নতুন করে লিখুন।'
          - 'zone-এর নাম validate করুন: `in_array($z, DateTimeZone::listIdentifiers(), true)`।'
      - type: refs
        items:
          - {to: 'time/clocks-lie', label: 'Symfony Clock আর testable সময়'}
          - {to: 'data/temporal-data', label: 'সময় নিয়ে ডেটা মডেল'}
    check:
      q: 'সাপ্তাহিক স্থানীয় মিটিংয়ের পরের তারিখ হিসাবের জন্য কেন UTC-তে ১৬৮ ঘণ্টা না যোগ করে স্থানীয় zone-এ `+1 week` করবেন?'
      a: 'স্থানীয় zone-এ যোগ করলে দেয়ালঘড়ি (১০:০০) অক্ষুণ্ণ থাকে, DST বদলালেও। UTC-তে ঘণ্টা যোগ করলে DST-র পরে স্থানীয় সময় এক ঘণ্টা সরে যায়।'

  - slug: show-in-vue
    title: 'দেখানো: ব্যবহারকারীর zone-এ Vue-তে'
    kind: howto
    tldr: 'API UTC (ISO 8601, শেষে Z) পাঠায়; Vue-তে Intl.DateTimeFormat ব্যবহারকারীর নিজের zone-এ সাজায়। আলাদা ক্ষেত্রে ঘটনার নিজস্ব zone-ও দেখান।'
    keywords: ['Intl.DateTimeFormat', 'Vue', 'ISO 8601', 'user timezone', 'Symfony Serializer', 'দেখানো']
    blocks:
      - type: text
        body: |
          সার্ভার সবসময় একটাই ফরম্যাটে সময় পাঠাক: UTC-তে ISO 8601, শেষে `Z`। ব্রাউজার জানে ব্যবহারকারী কোথায়, তাই দেখানোর কাজটা ক্লায়েন্টে। `Intl.DateTimeFormat` DST-র নিয়ম নিজে মানে। যে ঘটনা অন্য শহরের (যেমন লন্ডনের মিটিং), সেটা দুই zone-এ পাশাপাশি দেখান, যাতে বিভ্রান্তি না হয়।
      - type: code
        lang: vue
        file: 'src/components/EventTime.vue'
        code: |
          <script setup lang="ts">
          import { computed } from 'vue'

          // startsAtUtc: '2026-04-06T09:00:00Z' — সার্ভার থেকে আসা UTC
          const props = defineProps<{ startsAtUtc: string; eventZone: string }>()

          const fmt = (timeZone: string) =>
            new Intl.DateTimeFormat('bn-BD', {
              dateStyle: 'medium', timeStyle: 'short', timeZone,
            }).format(new Date(props.startsAtUtc))

          const myZone = Intl.DateTimeFormat().resolvedOptions().timeZone
          const mine = computed(() => fmt(myZone))
          const theirs = computed(() => fmt(props.eventZone))
          </script>

          <template>
            <p>আপনার সময়: {{ mine }} ({{ myZone }})</p>
            <p>ঘটনার জায়গায়: {{ theirs }} ({{ eventZone }})</p>
          </template>
        marks:
          - {line: 5, tip: 'API থেকে আসা UTC স্ট্রিং। শেষে Z না থাকলে ব্রাউজার একে স্থানীয় সময় ধরে ভুল করবে।'}
          - {line: 9, tip: 'timeZone বসালেই Intl সেই zone-এর DST নিয়ম মেনে সঠিক স্থানীয় সময় বানায়। হাতে ঘণ্টা যোগ-বিয়োগ নয়।'}
          - {line: 12, tip: 'ব্যবহারকারীর ব্রাউজারের zone, যেমন Asia/Dhaka। সার্ভারে এটা আলাদা সেটিং হিসেবেও জমা রাখা যায়।'}
      - type: points
        title: 'Symfony থেকে পাঠানোর নিয়ম'
        style: check
        items:
          - 'Entity-র সময় DateTimeImmutable; রপ্তানির আগে `setTimezone(new DateTimeZone(''UTC''))`।'
          - 'JSON-এ RFC 3339 / ISO 8601 (Serializer-এর ডিফল্ট), তারিখের স্ট্রিং নিজে বানাবেন না।'
          - 'ইমেইল বা SMS-এর সময় ব্যবহারকারীর zone-এ ফরম্যাট করে লিখুন, সাথে zone-এর নাম দিন।'
    aside:
      - type: pitfalls
        items:
          - '`new Date(''2026-04-06 09:00'')` zone ছাড়া স্ট্রিং ব্রাউজারের স্থানীয় zone ধরে নেয়। সবসময় `Z` বা offset-সহ স্ট্রিং পাঠান।'
          - 'সার্ভারের টাইমজোনে ইমেইলের সময় লিখলে ভিন্ন দেশের ব্যবহারকারী ভুল সময় পায়।'
      - type: tips
        items:
          - 'Cron-এর মতো শিডিউলে সার্ভারের zone (সাধারণত UTC) আলাদা বিষয়: ব্যবহারকারীর স্থানীয় ঘটনার জন্য next_run_at UTC থেকে চালান।'
    check:
      q: 'API-র সময় `2026-04-06 09:00` (শেষে Z ছাড়া) পাঠালে Vue-তে কী গোলমাল হতে পারে?'
      a: 'ব্রাউজার একে ব্যবহারকারীর নিজের স্থানীয় সময় ধরবে, UTC নয়। ফলে দেখানো সময় ভুল হবে। UTC বোঝাতে শেষে `Z` বা offset দিতেই হবে।'

flashcards:
  - q: 'অতীতের ঘটনার সময় কোথায় জমা রাখবেন?'
    a: 'UTC-তে, মানে PostgreSQL-এর timestamptz-এ। দেখানোর সময় ব্যবহারকারীর zone-এ বদলান।'
    more: |
      অতীতের ঘটনা (পেমেন্ট, লগইন, অর্ডার) একটা নির্দিষ্ট মুহূর্ত। UTC-তে রাখলে সার্ভার বা ব্যবহারকারী যেখানেই থাকুক, মুহূর্তটা এক থাকে এবং DST-তে বদলায় না।
    ref: instant-vs-wall
  - q: 'ভবিষ্যতের স্থানীয় ঘটনা (যেমন প্রতি সোমবার সকাল ১০টা মিটিং) কীভাবে জমা রাখবেন?'
    a: 'স্থানীয় সময় (zone ছাড়া) আর zone-এর নাম (Europe/London), প্রতিবার সেই তারিখের নিয়মে UTC হিসাব করুন।'
    more: |
      শুধু UTC রাখলে DST বদলে মিটিং এক ঘণ্টা সরে যায়। শুধু “+01:00” রাখলেও লাভ নেই, কারণ offset পরের মৌসুমে বদলায়। নাম থেকে প্রতিটা তারিখের সঠিক offset মেলে।
    ref: instant-vs-wall
  - q: 'Offset আর IANA time zone-এ পার্থক্য কী?'
    a: 'Offset (+01:00) একটা মুহূর্তের UTC-ফারাক। IANA zone (Europe/London) হলো ওই জায়গার সব নিয়ম, DST-সহ।'
    more: |
      লন্ডন শীতে +00:00, গ্রীষ্মে +01:00। “+01:00” জমা রাখলে শীতের মিটিং ভুল হবে। zone-এর নাম রাখলে tzdata ঠিক offset বের করে, সরকার নিয়ম বদলালে হালনাগাদে ঠিক হয়।
    ref: instant-vs-wall
  - q: 'DST gap কী?'
    a: 'বসন্তে ঘড়ি এগোলে এক ঘণ্টার স্থানীয় সময় থাকে না। যেমন লন্ডনে ২৯ মার্চ ২০২৬-এ ০১:০০-০২:০০ অস্তিত্বহীন।'
    more: |
      এই সময়ে ঘটনা বসাতে চাইলে কোড চুপচাপ সরিয়ে দেয়, PHP-র ক্ষেত্রে ০২:৩০-এ। কী করা হবে নিয়ম ঠিক করুন: পরের বৈধ সময়ে সরানো, নয়তো ব্যবহারকারীকে জানানো।
    ref: dst-gap-overlap
  - q: 'DST overlap কী?'
    a: 'শরতে ঘড়ি পিছোলে এক ঘণ্টার স্থানীয় সময় দুইবার আসে। লন্ডনে ২৫ অক্টোবর ২০২৬-এ ০১:৩০ দুই আলাদা মুহূর্ত।'
    more: |
      স্থানীয় সময় অস্পষ্ট হয়ে যায়। PHP একটা বেছে নেয়, ব্যবহারকারী জানে না কোনটা। UTC-তে জমা রাখলে আর অস্পষ্টতা থাকে না, কারণ দুটো মুহূর্তের UTC আলাদা।
    ref: dst-gap-overlap
  - q: 'কোনো স্থানীয় সময় DST gap না overlap-এ পড়েছে, PHP কোডে কীভাবে বোঝা যায়?'
    a: 'আগের আর পরের দিনের offset দুটোই চেষ্টা করুন; যে UTC মুহূর্ত ফিরে একই স্থানীয় সময় দেখায় সেগুলো রাখুন। শূন্য হলে gap, দুটো হলে overlap।'
    more: |
      PHP নিজে কিছু জানায় না, শুধু সরিয়ে দেয় বা একটা বেছে নেয়। তাই আসল প্রার্থীগুলোর তালিকা নিজেকে বানাতে হয়। একটাও না থাকলে ব্যবহারকারীর কাছ থেকে অন্য সময় নিন। দুটো থাকলে আগেরটা না পরেরটা, ইচ্ছা করে বেছে সেই UTC মুহূর্ত জমা রাখুন।
    ref: dst-gap-overlap
  - q: 'সাপ্তাহিক স্থানীয় ঘটনায় “পরের সপ্তাহ” হিসাব করার সঠিক উপায় কী?'
    a: 'স্থানীয় zone-এ `+1 week` যোগ করে তারপর UTC-তে রূপান্তর। UTC-তে ১৬৮ ঘণ্টা যোগ করলে DST-তে এক ঘণ্টা সরে যায়।'
    more: |
      PHP-র `DateTimeImmutable::modify('+1 week')` ঐ বস্তুর zone-এ কাজ করে, তাই দেয়ালঘড়ি ঠিক থাকে। হিসাব শেষে `setTimezone(UTC)` দিয়ে next_run_at-এ লিখুন।
    ref: store-and-compute
  - q: 'Scheduler-এর জন্য ভবিষ্যতের স্থানীয় ঘটনায় next_run_at কেন রাখবেন?'
    a: 'scheduler শুধু UTC-র সাথে তুলনা করে। স্থানীয় সময় আর zone থেকে হিসাব করা UTC আলাদা কলামে রাখলে query সহজ ও দ্রুত।'
    more: |
      `WHERE next_run_at <= now()` সরাসরি index দিয়ে চলে। ঘটনা চলার পর পরের তারিখ আবার স্থানীয় নিয়মে হিসাব করে next_run_at নতুন করে লেখা হয়।
    ref: store-and-compute
  - q: 'API থেকে সময় পাঠানোর সঠিক ফরম্যাট কী?'
    a: 'UTC-তে ISO 8601, শেষে Z (যেমন 2026-04-06T09:00:00Z)। Z বা offset ছাড়া স্ট্রিং ব্রাউজার স্থানীয় ধরে নেয়।'
    more: |
      Symfony Serializer DateTimeImmutable ডিফল্টে RFC 3339 দেয়। রপ্তানির আগে UTC-তে বদলে নিন। Vue-তে `Intl.DateTimeFormat` দিয়ে `timeZone` বসিয়ে ব্যবহারকারীর zone-এ দেখান।
    ref: show-in-vue
  - q: 'ব্যবহারকারীর ব্রাউজারের zone Vue-তে কীভাবে পাবেন?'
    a: '`Intl.DateTimeFormat().resolvedOptions().timeZone` (যেমন Asia/Dhaka)। এটা `Intl.DateTimeFormat`-এর `timeZone` অপশনে দিয়ে সময় সাজান।'
    more: |
      Intl DST-র নিয়ম নিজে মানে, তাই হাতে ঘণ্টা যোগ-বিয়োগ করা লাগে না। অন্য শহরের ঘটনার ক্ষেত্রে ঘটনার zone-এও আলাদা করে সময় দেখান, যাতে বিভ্রান্তি না হয়।
    ref: show-in-vue

quiz:
  - q: 'একটা অ্যাপ “প্রতি রবিবার রাত ৯টায় রিপোর্ট” ঢাকা থেকে ব্যবহারকারীকে পাঠায়। ব্যবহারকারী লন্ডনে চলে গেল এবং zone বদলাল। সঠিক নকশা কোনটা?'
    hint: 'ব্যবহারকারী কী চায়: একটা UTC মুহূর্ত, না নিজের ঘড়ির ৯টা?'
    options:
      - text: 'ব্যবহারকারীর স্থানীয় ৯টা আর তার zone-এর নাম জমা রাখা; প্রতিবার UTC হিসাব করা'
        correct: true
        why: 'ব্যবহারকারী নিজের ঘড়ি অনুযায়ী ৯টা চায়। zone বদলালে শুধু নামটা বদলান, হিসাব নিজে ঠিক হয়।'
      - text: 'একবার হিসাব করা UTC ঘণ্টা (যেমন ১৫:০০ UTC) সবসময়ের জন্য রাখা'
        correct: false
        why: 'DST বদলালে বা zone বদলালে ব্যবহারকারীর ঘড়িতে সেই সময় সরে যায়।'
      - text: 'সার্ভারের zone-এর ৯টা'
        correct: false
        why: 'সার্ভার কোথায় আছে ব্যবহারকারীর কাছে অর্থহীন।'
      - text: 'offset “+06:00” জমা রাখা'
        correct: false
        why: 'offset ব্যবহারকারী লন্ডনে গেলে বা DST-তে ভুল।'
    ref: instant-vs-wall
  - q: 'কোনগুলো UTC-তে (timestamptz) জমা রাখা উচিত?'
    hint: 'কোনগুলো একবার ঘটে-যাওয়া মুহূর্ত?'
    options:
      - text: 'পেমেন্ট সফল হওয়ার সময়'
        correct: true
        why: 'একটা নির্দিষ্ট মুহূর্ত; UTC-তে অবিকৃত থাকে।'
      - text: 'ব্যবহারকারীর লগইনের সময়'
        correct: true
        why: 'অতীতের ঘটনা; দেখানোর সময় zone বদলানো হয়।'
      - text: 'আগামী সোমবার লন্ডনে সকাল ১০টার মিটিংয়ের মূল সময়'
        correct: false
        why: 'এটা ভবিষ্যতের স্থানীয় ঘটনা; স্থানীয় সময় + zone-এর নাম মূল তথ্য হওয়া উচিত।'
      - text: 'প্রতিদিন সকাল ৮টায় দোকান খোলে, এমন সময়সূচি'
        correct: false
        why: 'এটা দেয়ালঘড়ির নিয়ম, নির্দিষ্ট মুহূর্ত নয়।'
    ref: instant-vs-wall
  - q: 'নিচের কোডে `$next`-এ কী থাকবে?'
    lang: php
    code: |
      $london = new DateTimeZone('Europe/London');
      $mon = new DateTimeImmutable('2026-03-23 10:00', $london);
      $next = $mon->modify('+2 weeks');
    hint: '২৯ মার্চ ২০২৬ লন্ডনে DST শুরু। modify কোন zone-এ চলে?'
    options:
      - text: '২০২৬-০৪-০৬ ১০:০০ BST, দেয়ালঘড়ি একই, UTC ০৯:০০'
        correct: true
        why: 'modify() ঐ বস্তুর zone-এ চলে, তাই স্থানীয় সময় ১০:০০ অক্ষুণ্ণ আর UTC এক ঘণ্টা সরে।'
      - text: '২০২৬-০৪-০৬ ১১:০০ BST'
        correct: false
        why: '১৬৮×২ ঘণ্টা যোগ করলে এমন হতো, কিন্তু modify(''+2 weeks'') দিন গোনে।'
      - text: 'একটা exception'
        correct: false
        why: 'DST পেরিয়ে যাওয়াতে কোনো exception নেই।'
    ref: store-and-compute
  - q: 'লন্ডনে ২৯ মার্চ ২০২৬-এ ০১:৩০ স্থানীয় সময়ে একটা কাজ বসানো হলো। কী ঘটবে?'
    hint: 'ঐ দিন ঘড়ি ০১:০০ থেকে কোথায় লাফ দেয়?'
    options:
      - text: 'সময়টা বিদ্যমান নেই (gap); PHP চুপচাপ ০২:৩০ BST-তে সরিয়ে দেবে'
        correct: true
        why: 'বসন্তের DST gap-এ থাকা স্থানীয় সময় বৈধ নয়। নীরবে সরানো বিপজ্জনক, তাই নিজের নিয়ম বেঁধে দিন।'
      - text: 'কাজটা ঠিক ০১:৩০-এ চলবে'
        correct: false
        why: 'ঐ স্থানীয় সময় ঘড়িতে আসেই না।'
      - text: 'কাজটা দুইবার চলবে'
        correct: false
        why: 'দুইবার আসা হলো শরতের overlap-এ, বসন্তে নয়।'
      - text: 'PHP exception ছুড়বে'
        correct: false
        why: 'PHP-র DateTimeImmutable এই ক্ষেত্রে error দেয় না, শুধু সরিয়ে দেয়।'
    ref: dst-gap-overlap
  - q: 'একজন ব্যবহারকারী Europe/London-এ ২৫ অক্টোবর ২০২৬-এর ০১:৩০ বুক করলেন। কোড কী করবে?'
    hint: 'ওই ঘড়িতে ০১:৩০ বাজে এমন আসল মুহূর্ত কয়টা?'
    options:
      - text: 'দুটো মুহূর্তই (০০:৩০Z আর ০১:৩০Z) তালিকা করবে, আগেরটা না পরেরটা ইচ্ছা করে বেছে UTC জমা রাখবে'
        correct: true
        why: 'স্থানীয় সময়টা দুটো মুহূর্তের সাথে মেলে। ইচ্ছা করে একটা বেছে UTC-তে জমা রাখলে আন্দাজ থাকে না।'
      - text: 'DateTimeImmutable-এ দিয়ে যা ফেরত আসে তা-ই জমা রাখবে'
        correct: false
        why: 'PHP চুপচাপ দুটোর একটা বেছে নেয়, আর বাছাই PHP-র সংস্করণ ভেদে আলাদা হতে পারে।'
      - text: 'নাকচ করবে, কারণ সময়টা নেই'
        correct: false
        why: 'সেটা বসন্তের gap। শরতে সময়টা দুইবার আছে।'
    ref: dst-gap-overlap
  - q: 'কোনগুলো সঠিক অভ্যাস?'
    hint: 'অস্পষ্টতা কমানোর উপায় ভাবুন।'
