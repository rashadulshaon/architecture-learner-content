        correct: false
        why: 'ব্যবহারকারী হাজারো zone-এ; সার্ভার সাধারণত UTC রাখে।'
      - text: 'সময় স্ট্রিং “2026-04-06 09:00” zone ছাড়া পাঠানো'
        correct: false
