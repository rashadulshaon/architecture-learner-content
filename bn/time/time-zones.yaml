  - q: 'Vue-তে `new Date(''2026-04-06T09:00:00Z'')` ব্যবহারকারীর ব্রাউজারে (Asia/Dhaka) কী দেখাবে সঠিক সময়ের হিসাবে?'
    hint: 'Dhaka UTC+৬।'
    options:
      - text: 'ঢাকায় দুপুর ১৫:০০'
