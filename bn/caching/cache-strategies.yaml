flashcards:
  - q: 'Cache hit আর cache miss কী?'
    a: 'Hit: উত্তর cache-এ পাওয়া গেল। Miss: cache-এ নেই, তাই আসল উৎস (ডেটাবেস) থেকে আনতে হলো।'
    more: |
      হিটের হার যত বেশি, cache তত কাজের। প্রথমবার চাইলে সবসময় miss হয়; সেই miss-এর পরে উত্তর cache-এ বসে, আর পরের request-গুলো hit পায়।
    ref: same-answer-again
  - q: 'Cache-aside কৌশল কীভাবে কাজ করে?'
    a: 'অ্যাপ আগে cache-এ খোঁজে; না পেলে নিজে ডেটাবেস থেকে এনে cache-এ রেখে দেয়।'
    more: |
      cache নিজে কিছু আনে না; খোঁজা, আনা আর ভরা তিনটাই অ্যাপের কোডে। তাই cache বন্ধ থাকলেও অ্যাপ চলে, শুধু ধীর হয়। একে lazy loading-ও বলে, কারণ cache ভরে শুধু চাওয়া হলে।
    ref: cache-aside
  - q: 'Symfony-র CacheInterface::get($key, $callback) কী করে?'
    a: 'চাবি থাকলে জমা মান ফেরায়; না থাকলে callback চালিয়ে ফল জমা করে আর ফেরায়।'
    more: |
      callback-এর ভেতরে `$item->expiresAfter(600)` দিয়ে মেয়াদ বলা হয়। এটা cache-aside-এর Symfony রূপ। এতে "খোঁজো, না পেলে বানাও, রাখো" তিন ধাপ এক কলেই হয়ে যায়, হাতে আলাদা if লিখতে হয় না।
    ref: symfony-cache-get
  - q: 'Write-through কৌশলে লেখা কীভাবে যায়?'
    a: 'একসাথে cache আর ডেটাবেস দুই জায়গাতেই; দুটো শেষ হলে তবে সফল ধরা হয়।'
    more: |
      ফলে cache প্রায় কখনো বাসি হয় না। দাম: প্রতিটা লেখা ধীর, কারণ দুই জায়গার জন্য অপেক্ষা করতে হয়। যে ডেটা কেউ পরে পড়বে না, তার জন্যও cache ভরে অকারণে জায়গা নষ্ট হয়।
    ref: write-strategies
  - q: 'Write-behind কৌশলের সবচেয়ে বড় ঝুঁকি কী?'
    a: 'লেখা আগে cache-এ যায়, ডেটাবেসে পরে। ডেটাবেসে পৌঁছানোর আগে cache মরলে সেই লেখা হারায়।'
    more: |
      গতি পাওয়া যায় কারণ ব্যবহারকারীকে ডেটাবেসের জন্য থামতে হয় না। কিন্তু টাকা, অর্ডার বা অনুমতির ডেটায় হারানোর সুযোগ রাখা যায় না। তাই এটা ব্যবহার হয় কেবল এমন চাপ-সামলানো লেখায়, যেখানে কিছু হারালেও চলে।
    ref: write-strategies
  - q: 'ব্যবহারকারীভেদে আলাদা উত্তর cache করলে চাবিতে কী থাকতে হবে?'
    a: 'ব্যবহারকারীর আইডি বা পরিচয়। নইলে একজনের তথ্য আরেকজন দেখে ফেলে।'
    more: |
      যেমন `cart` নয়, `cart.user.42`। এটা শুধু cache-এর ভুল নয়, নিরাপত্তার ভুল: ব্যক্তিগত তথ্য ফাঁস হয়। সন্দেহ থাকলে ব্যক্তিগত ডেটা cache না করে ছোট মেয়াদ দাও।
    ref: what-not-to-cache
  - q: 'কোন ধরনের ডেটা cache না করাই ভালো?'
    a: 'টাকার ব্যালেন্স, checkout-এর স্টক, আর যা বানাতে সস্তা বা কেউ দ্বিতীয়বার চায় না।'
    more: |
      cache মানে বাসি হওয়ার ঝুঁকি কিনে গতি নেওয়া। ভুল দেখালে সরাসরি ক্ষতি, এমন ডেটায় এই বদল লাভজনক নয়। আর বানাতে সস্তা ডেটায় cache-এর জটিলতাই বেশি।
    ref: what-not-to-cache

quiz:
  - q: 'নিচের কোডের সমস্যা কী?'
    lang: php
    code: |
      return $this->cache->get('profile', function (ItemInterface $item) use ($user) {
          $item->expiresAfter(600);

          return $this->profiles->forUser($user);
      });
    hint: 'চাবিটা কয়জন ব্যবহারকারী ভাগ করে নিচ্ছে?'
    options:
      - text: 'চাবি সবার জন্য এক, তাই একজনের প্রোফাইল ১০ মিনিট সবাই দেখবে'
        correct: true
        why: 'ব্যবহারকারীভেদে আলাদা উত্তরের চাবিতে পরিচয় থাকতে হয়, যেমন profile.user.42।'
      - text: 'expiresAfter(600) খুব বড়, ৬০ হলেই সব ঠিক হয়ে যেত'
        correct: false
        why: 'মেয়াদ কমালে ফাঁস ছোট সময়ের হয় মাত্র, বন্ধ হয় না। আসল ভুল চাবিতে।'
      - text: 'callback-এর ভেতরে ডেটাবেস query চালানো যায় না'
        correct: false
        why: 'যায়। miss হলে আসল উৎস থেকে আনার জন্যই callback।'
      - text: 'Redis ছাড়া এই কোড কাজ করবে না'
        correct: false
        why: 'CacheInterface যেকোনো adapter-এই চলে; সমস্যা backend-এ নয়।'
    ref: what-not-to-cache
  - q: 'Cache-aside কৌশলে miss হলে ঠিক কোন ক্রমে কী ঘটে?'
    hint: 'ওয়েটার আগে কোথায় দেখে, তারপর কোথায় যায়?'
    options:
      - text: 'cache-এ খোঁজা, ডেটাবেস থেকে আনা, cache-এ রেখে দেওয়া, উত্তর দেওয়া'
        correct: true
        why: 'এই ক্রমেই পরের request cache থেকে উত্তর পায়।'
      - text: 'ডেটাবেসে লেখা, তারপর cache-এ খোঁজা'
        correct: false
        why: 'এটা পড়ার ক্রম নয়; আর cache-এ আগে না দেখলে cache-এর কোনো লাভ থাকে না।'
      - text: 'cache নিজেই ডেটাবেস থেকে এনে অ্যাপকে দেয়'
        correct: false
        why: 'সেটা read-through। cache-aside-এ আনার কাজ অ্যাপের।'
      - text: 'ডেটাবেস আর cache একসাথে খোঁজা, যেটা আগে পায়'
        correct: false
        why: 'এতে ডেটাবেসের চাপ কমে না, cache-এর উদ্দেশ্যই নষ্ট।'
    ref: cache-aside
  - q: 'কোন কোন ডেটা cache-এর ভালো প্রার্থী?'
    hint: 'বারবার চাওয়া হয়, বানাতে ভারী, আর অল্পক্ষণ বাসি হলে ক্ষতি নেই।'
    options:
      - text: 'হোমপেজের সেরা ১০ পণ্যের তালিকা'
        correct: true
        why: 'অনেকে চায়, হিসাব ভারী, ১০ মিনিট পুরনো হলেও ক্ষতি নেই।'
      - text: 'বিভাগের তালিকা, যা দিনে একবারও বদলায় না'
        correct: true
        why: 'প্রায় অপরিবর্তনীয় আর বারবার পড়া হয় — আদর্শ প্রার্থী।'
      - text: 'checkout-এর সময় কোনো পণ্যের সঠিক স্টক'
        correct: false
        why: 'বাসি স্টক দেখালে বেশি বিক্রি হয়ে যায়; এখানে সঠিকতা গতির চেয়ে জরুরি।'
      - text: 'ব্যবহারকারীর ব্যালেন্স, সবার জন্য এক চাবিতে'
        correct: false
        why: 'টাকার ডেটা বাসি হলে ক্ষতি, আর এক চাবিতে রাখলে একজনেরটা সবাই দেখে।'
    ref: what-not-to-cache
  - q: 'একটা গেমের অ্যাপে "লাইক" সংখ্যা প্রতি সেকেন্ডে হাজারবার বাড়ে। কিছু লাইক হারালেও ক্ষতি নেই, তবে লেখা খুব দ্রুত হতে হবে। কোন কৌশল সবচেয়ে মানায়?'
    hint: 'হারানো চলে, কিন্তু ডেটাবেসকে প্রতিটা লেখার চাপ থেকে বাঁচাতে হবে।'
    options:
      - text: 'Write-behind: cache-এ গুনে রেখে ডেটাবেসে ব্যাচে তোলা'
        correct: true
        why: 'গতি আর কম ডেটাবেস-চাপ মেলে; কিছু লাইক হারানো এখানে গ্রহণযোগ্য।'
      - text: 'Write-through: প্রতিটা লাইক cache আর ডেটাবেস দুটোতেই'
        correct: false
        why: 'প্রতিটা লেখাই ডেটাবেসে যায়, ফলে চাপ কমে না।'
      - text: 'Cache-aside, প্রতি লাইকে cache মুছে ফেলা'
        correct: false
        why: 'প্রতি সেকেন্ডে হাজারবার মুছলে hit-ই হবে না।'
      - text: 'কোনো cache নয়, প্রতিটা লাইক সরাসরি ডেটাবেসে'
        correct: false
        why: 'চাপ সামলানোর প্রয়োজনটাই অমীমাংসিত থাকে।'
    ref: write-strategies
