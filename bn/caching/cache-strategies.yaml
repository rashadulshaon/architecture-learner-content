slides:
  - slug: same-answer-again
    title: 'একই হিসাব দিনে ৫০ হাজার বার'
    kind: story
    tldr: 'যে উত্তর প্রায় বদলায় না, সেটা প্রতি request-এ ডেটাবেস থেকে হিসাব করে আনলে সময় আর সার্ভার দুটোই নষ্ট; cache সেই উত্তর জমিয়ে রাখে।'
    keywords: ['cache', 'cache hit', 'cache miss', 'ক্যাশ', 'দ্রুত উত্তর', 'latency']
    blocks:
      - type: metaphor
        icon: shop
        title: 'বিরিয়ানির হোটেলের কাউন্টার'
        body: |
          হোটেলে প্রতিটা অর্ডারে নতুন করে বিরিয়ানি রান্না হলে খদ্দের ঘণ্টাখানেক বসে থাকবে। তাই দুপুরের আগেই বড় ডেকচিতে রান্না হয়, আর কাউন্টারে প্যাকেট করা বিরিয়ানি সাজানো থাকে। খদ্দের আসে, প্যাকেট নেয়, চলে যায়। রান্নাঘর হলো ডেটাবেস, কাউন্টারের প্যাকেট হলো **cache**।
      - type: text
        body: |
          রহিমের হোমপেজে "সবচেয়ে বেশি বিক্রি হওয়া ১০ পণ্য" দেখানো হয়। হিসাবটা চালাতে ডেটাবেসের ৮০০ms লাগে, আর পেজ খোলে দিনে ৫০ হাজার বার। উত্তরটা প্রতি ১০ মিনিটেও প্রায় বদলায় না, তবু প্রতিবার নতুন করে রান্না হচ্ছে।
      - type: visual
        kind: bars
        caption: 'একই উত্তর: ডেটাবেস থেকে হিসাব বনাম cache থেকে তোলা'
        items:
          - {label: 'ডেটাবেস query', value: 800, display: '800ms', tone: bad, tip: 'ভারী join আর group by চালিয়ে প্রতিবার আবার হিসাব করা হচ্ছে।'}
          - {label: 'Cache hit', value: 3, display: '3ms', tone: good, tip: 'আগে থেকে রাখা উত্তর মেমোরি থেকে সোজা তুলে দেওয়া — কোনো হিসাব নেই।'}
      - type: quote
        body: 'যে উত্তর বারবার লাগে অথচ কম বদলায়, সেটাই cache-এর প্রার্থী।'
    aside:
      - type: terms
        items:
          - {term: 'Cache hit', meaning: 'চাওয়া উত্তর cache-এ পাওয়া গেল, ডেটাবেসে যেতে হলো না।'}
          - {term: 'Cache miss', meaning: 'cache-এ উত্তর নেই, তাই আসল উৎস থেকে আনতে হলো।'}
      - type: problem
        body: 'ভারী কাজের ফল বারবার বানানো বন্ধ করা — যাতে ডেটাবেসের ওপর চাপ কমে আর ব্যবহারকারী দ্রুত উত্তর পায়।'
    check:
      q: 'কোন ধরনের উত্তর cache করলে সবচেয়ে বেশি লাভ?'
      a: 'যে উত্তর অনেকবার চাওয়া হয়, বানাতে ভারী, আর অল্প সময়ে প্রায় বদলায় না — যেমন সেরা ১০ পণ্যের তালিকা।'

  - slug: cache-aside
    title: 'Cache-aside: অ্যাপই খোঁজে, অ্যাপই ভরে'
    kind: concept
    tldr: 'Cache-aside-এ অ্যাপ আগে cache দেখে; না পেলে ডেটাবেস থেকে এনে নিজেই cache-এ রেখে দেয়। এটাই সবচেয়ে প্রচলিত কৌশল।'
    keywords: ['cache-aside', 'lazy loading', 'cache miss', 'look-aside', 'ক্যাশ অ্যাসাইড']
    blocks:
      - type: metaphor
        icon: shop
        title: 'ওয়েটার নিজে কাউন্টার দেখে'
        body: |
          ওয়েটার আগে কাউন্টারে খোঁজে প্যাকেট আছে কি না। থাকলে সাথে সাথে খদ্দেরকে দেয়। না থাকলে রান্নাঘর থেকে এনে খদ্দেরকে দেয়, আর একটা প্যাকেট কাউন্টারেও রেখে যায় — যাতে পরের খদ্দের পায়। কাউন্টার নিজে কিছু আনে না; সব কাজ ওয়েটারের, মানে অ্যাপের।
      - type: visual
        kind: flow
        caption: 'Cache-aside: miss হলে অ্যাপ ডেটাবেস থেকে এনে cache ভরে'
        nodes:
          - {id: app, label: 'অ্যাপ', sub: 'Symfony service', icon: api, tone: accent, col: 0, row: 1, tip: 'ওয়েটার। cache দেখা, ডেটাবেসে যাওয়া আর cache ভরা — তিনটা কাজই এই কোডের।'}
          - {id: cache, label: 'Cache', sub: 'Redis', icon: cache, col: 2.5, row: 0, tip: 'কাউন্টার। শুধু জমা রাখে আর চাইলে দেয়; নিজে কিছু আনতে জানে না।'}
          - {id: db, label: 'ডেটাবেস', sub: 'আসল সত্য', icon: db, col: 2.5, row: 2, tip: 'রান্নাঘর। ধীর, কিন্তু সবসময় সঠিক উত্তর এখানে।'}
        edges:
          - {from: app, to: cache, label: 'অ্যাপ আগে cache-এ চাবি দিয়ে খোঁজে'}
          - {from: cache, to: app, label: 'miss: cache বলে, এটা আমার কাছে নেই', dashed: true, tone: warn}
          - {from: app, to: db, label: 'অ্যাপ নিজেই ডেটাবেস থেকে উত্তরটা আনে'}
          - {from: db, to: app, label: 'ডেটাবেস উত্তর ফেরত দেয়', dashed: true}
          - {from: app, to: cache, label: 'অ্যাপ উত্তরটা মেয়াদ দিয়ে cache-এ রেখে যায়', tone: good}
      - type: quote
        body: 'Cache-aside: আগে cache, না পেলে ডেটাবেস, তারপর cache ভরো।'
    aside:
      - type: when
        use:
          - 'পড়া অনেক বেশি, লেখা কম — পণ্যের পাতা, তালিকা, সেটিংস।'
          - 'cache বন্ধ থাকলেও অ্যাপ ডেটাবেস দিয়ে চলতে পারা দরকার।'
        avoid:
          - 'প্রতি সেকেন্ডে বদলায় এমন ডেটা, যা ভুল দেখানো চলে না।'
      - type: remember
        body: 'প্রথম request ধীর (miss), পরের সবগুলো দ্রুত (hit)।'
    check:
      q: 'Cache বন্ধ হয়ে গেলে cache-aside অ্যাপ কী করে?'
      a: 'প্রতিবার miss ধরে ডেটাবেস থেকে উত্তর আনে। অ্যাপ ধীর হয়, কিন্তু চালু থাকে — কারণ সত্য ডেটাবেসেই আছে।'

  - slug: symfony-cache-get
    title: 'Symfony-তে cache-aside: একটা get() কল'
    kind: howto
    tldr: 'Symfony Cache contracts-এর get(key, callback) একসাথে খোঁজা, miss-এ callback চালানো আর ফল রাখা করে; backend হিসেবে Redis বসাও।'
    keywords: ['CacheInterface', 'Symfony Cache', 'Redis', 'expiresAfter', 'ItemInterface', 'cache.adapter.redis']
    blocks:
      - type: text
        body: |
          Symfony-তে `CacheInterface`-এর `get()` মেথডে তুমি চাবি আর একটা callback দাও। চাবি পেলে সাথে সাথে মান ফেরত আসে। না পেলে callback চলে, তার ফল জমা হয় আর ফেরত আসে। মেয়াদ `$item->expiresAfter()` দিয়ে বলতে হয়।
      - type: code
        lang: php
        file: 'src/Catalog/TopProducts.php'
        variant: good
        code: |
          final readonly class TopProducts
          {
              public function __construct(
                  private CacheInterface $cache,
                  private ProductRepository $products,
              ) {
              }

              /** @return list<array{id: int, name: string, sold: int}> */
              public function forHomepage(): array
              {
                  return $this->cache->get('top_products.v1', function (ItemInterface $item): array {
                      $item->expiresAfter(600);      // ১০ মিনিট পরে বাসি

                      return $this->products->findTopSelling(10);   // ধীর query, শুধু miss-এ
                  });
              }
          }
        marks:
          - {line: 12, tip: 'চাবি এমন হবে যা দেখেই বোঝা যায় ভেতরে কী আছে। নামের শেষে v1 পরে কাজে লাগবে।'}
          - {line: 13, tip: 'callback শুধু miss হলে চলে। hit হলে এই কোড ছোঁয়াই হয় না।'}
          - {line: 15, tip: 'ফেরত মান ছোট আর serialize করার মতো রাখো: array বা DTO। Doctrine entity নয়।'}
      - type: code
        lang: yaml
        file: 'config/packages/cache.yaml'
        code: |
          framework:
              cache:
                  prefix_seed: 'shop_prod'
                  app: cache.adapter.redis
                  default_redis_provider: '%env(REDIS_URL)%'
        marks:
          - {line: 3, tip: 'একই Redis একাধিক অ্যাপ বা environment ব্যবহার করলে চাবি এক হয়ে যেতে পারে; prefix সেটা আটকায়।'}
          - {line: 4, tip: 'cache.app এখন Redis-এ লেখে। CacheInterface autowire করলেই এটা আসে।'}
    aside:
      - type: tips
        items:
          - 'Redis-এ maxmemory আর eviction policy (যেমন allkeys-lru) ঠিক করো, নইলে মেমোরি ভরে গেলে লেখা ব্যর্থ হয়।'
          - 'Entity নয়, ছোট DTO বা array cache করো — entity serialize করলে বাসি রিলেশন আর বিপুল আকার ঢোকে।'
      - type: commands
        title: 'Cache কমান্ড'
        items:
          - {cmd: 'php bin/console cache:pool:clear cache.app', desc: 'অ্যাপের cache পুরো খালি করো'}
          - {cmd: 'php bin/console cache:pool:delete cache.app top_products.v1', desc: 'একটা চাবি মুছো'}
      - type: refs
        items:
          - {to: 'caching/cache-invalidation', label: 'TTL আর invalidation'}
    check:
      q: 'get() কলের callback কখন চলে, আর কখন চলে না?'
      a: 'শুধু miss হলে চলে — চাবি না থাকলে বা মেয়াদ ফুরালে। hit হলে সরাসরি জমা মান ফেরত আসে।'

  - slug: write-strategies
    title: 'পড়া আর লেখার আরও তিন কৌশল'
    kind: concept
    tldr: 'Read-through, write-through আর write-behind-এ cache-ই ডেটাবেসের সাথে কথা বলে; তফাত হলো লেখা কখন ডেটাবেসে পৌঁছায় আর ঝুঁকি কোথায়।'
    keywords: ['read-through', 'write-through', 'write-behind', 'write-back', 'cache strategy']
    blocks:
      - type: text
        body: |
          Cache-aside-এ ওয়েটার সব করে। বাকি তিন কৌশলে কাউন্টারের লোক নিজেই রান্নাঘরের সাথে কথা বলে। **Read-through**: কাউন্টার নিজেই রান্নাঘর থেকে এনে দেয়। **Write-through**: অর্ডার খাতা আর কাউন্টার একসাথে লেখা হয়। **Write-behind**: আগে কাউন্টারে লিখে রাখে, রান্নাঘরের খাতায় পরে তোলে।
      - type: visual
        kind: compare
        caption: 'তিন কৌশলে কে ডেটাবেসের সাথে কথা বলে'
        columns:
          - title: 'Read-through'
            tone: default
            icon: search
            tip: 'পড়ার দিকের কৌশল। অ্যাপ শুধু cache-কে চায়, miss-এ cache নিজেই উৎস থেকে আনে।'
            items:
              - 'miss হলে cache নিজেই ডেটাবেসে যায়'
              - 'অ্যাপের কোড ছোট থাকে'
              - 'cache-এর ভেতরে loader বসাতে হয়'
          - title: 'Write-through'
            tone: good
            icon: check
            tip: 'লেখা একসাথে দুই জায়গায় যায় আর দুটো শেষ হলে তবেই সফল ধরা হয়। cache সবসময় তাজা থাকে।'
            items:
              - 'লেখা cache আর ডেটাবেস দুটোতেই যায়'
              - 'cache কখনো বাসি হয় না'
              - 'প্রতিটা লেখা ধীর হয়'
          - title: 'Write-behind'
            tone: warn
            icon: warning
            tip: 'লেখা আগে cache-এ, ডেটাবেসে পরে ব্যাচে। দ্রুত, কিন্তু cache মরলে না-লেখা ডেটা হারায়।'
            items:
              - 'cache-এ লিখেই সাথে সাথে উত্তর'
              - 'ডেটাবেসে ব্যাচে, পরে'
              - 'cache মরলে লেখা হারায়'
      - type: quote
        body: 'Write-behind-এ ডেটাবেসে না পৌঁছানো লেখা শুধু cache-এ বসে আছে — cache মরলে সেটা চিরতরে গেল।'
    aside:
      - type: tips
        items:
          - 'Symfony-র get(key, callback) দেখতে read-through-এর মতো, কিন্তু আসলে cache-aside: callback তোমার অ্যাপের কোড, cache-এর নয়।'
          - 'PHP অ্যাপে write-behind প্রায় কেউ হাতে বানায় না। টাকা বা অর্ডারের মতো ডেটায় তো নয়ই।'
      - type: terms
        items:
          - {term: 'Loader', meaning: 'miss হলে উৎস থেকে মান আনার কোড; read-through-এ এটা cache-এর ভেতরে থাকে।'}
    check:
      q: 'কোন কৌশলে cache মরে গেলে সবচেয়ে বেশি ডেটা হারানোর ভয়, কেন?'
      a: 'Write-behind। লেখা আগে cache-এ যায় আর ডেটাবেসে পরে; ডেটাবেসে পৌঁছানোর আগে cache মরলে সেই লেখা হারিয়ে যায়।'

  - slug: what-not-to-cache
    title: 'কী cache করবে না, আর একটা ভয়ংকর ভুল'
    kind: pitfall
    tldr: 'ব্যবহারকারীভেদে আলাদা ডেটা একই চাবিতে cache করলে একজনের তথ্য আরেকজন দেখে ফেলে; টাকা-স্টকের মতো সঠিকতা-নির্ভর ডেটা cache করাও ঝুঁকির।'
    keywords: ['cache key', 'data leak', 'per-user cache', 'what to cache', 'কী cache করবে না']
    blocks:
      - type: text
        body: |
          সবচেয়ে ভয়ংকর ভুল: একজনের পাতা সবার চাবিতে রেখে দেওয়া। কাউন্টারে "রহিমের অর্ডার" লেখা প্যাকেট সাজিয়ে রাখলে পরের খদ্দের সেটা নিয়ে যাবে। নিচের কোডে চাবিতে ব্যবহারকারী নেই, তাই প্রথম যে ঢুকবে তার কার্টই সবাই দেখবে।
      - type: code
        lang: php
        file: 'src/Cart/CartView.php'
        variant: bad
        code: |
          public function mine(User $user): array
          {
              return $this->cache->get('cart', function (ItemInterface $item) use ($user): array {
                  $item->expiresAfter(300);

                  return $this->carts->summaryFor($user);
              });
          }
        marks:
          - {line: 3, tip: 'চাবি শুধু cart। প্রথম ব্যবহারকারীর কার্ট ৫ মিনিট সবাইকে দেখানো হবে।'}
      - type: code
