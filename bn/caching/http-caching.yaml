  - q: 'রহিম নতুন deploy করার পর বলছে, "কিছু ব্যবহারকারী এখনো পুরনো JS দেখছে।" app.js-এ max-age ১ বছর, নামে hash নেই। সবচেয়ে ভালো সমাধান কী?'
    hint: 'ব্রাউজার কীভাবে বুঝবে ফাইল বদলেছে?'
