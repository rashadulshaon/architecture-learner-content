          - {from: user, to: cdn, label: 'পরের জন একই ফাইল চাইলে CDN সরাসরি দেয় (hit)', tone: good}
      - type: text
        body: |
          CDN-এর cache key সাধারণত URL। `/app.js?v=1` আর `/app.js?v=2` আলাদা key। আর `Vary: Accept-Language` দিলে ভাষা অনুযায়ী আলাদা কপি রাখে। cache busting মানে ফাইলের নামে তার বিষয়বস্তুর hash রাখা (`app-3f9a1c.js`)। বিষয়বস্তু বদলালে নাম বদলায়, তাই পুরনো cache আপনাআপনি বাদ।
      - type: code
        lang: nginx
        file: 'nginx.conf'
        code: |
          # hash-সহ ফাইল: নাম বদলালে নতুন URL, তাই এক বছর রাখা নিরাপদ
          location /assets/ {
              add_header Cache-Control "public, max-age=31536000, immutable";
          }

          # HTML পাতা: সবসময় জিজ্ঞেস করে নাও, কারণ ভেতরে নতুন hash-এর লিংক থাকে
          location / {
              add_header Cache-Control "no-cache";
          }
        marks:
          - {line: 3, tip: 'immutable বলে দেয়, এই ফাইল কখনো বদলাবে না, তাই reload করলেও জিজ্ঞেস কোরো না।'}
          - {line: 8, tip: 'HTML যদি লম্বা রাখো, নতুন deploy-এর পরেও ব্যবহারকারী পুরনো ফাইলের লিংক দেখবে।'}
      - type: quote
        body: 'ফাইলের নামে hash রাখো, মেয়াদ এক বছর দাও। HTML-কে সবসময় ছোট মেয়াদে রাখো।'
    aside:
      - type: tips
        items:
          - 'Symfony AssetMapper, Webpack Encore আর Vite — সবাই প্রোডাকশনে ফাইলের নামে hash বসায়। নিজে বসাতে হয় না।'
          - 'CDN-এ ভুলে আটকে যাওয়া ফাইল জরুরি হলে CDN-এর purge/invalidate সুবিধা দিয়ে মোছো।'
      - type: pitfalls
        items:
          - '`Vary: Cookie` বা প্রতিটা request-এ আলাদা query string দিলে প্রতিটা request আলাদা key পায়, hit প্রায় শূন্য হয়ে যায়।'
    check:
      q: 'এক বছরের মেয়াদ দেওয়া app.js-এ নতুন কোড deploy করলে ব্যবহারকারী কীভাবে নতুন ফাইল পাবে?'
      a: 'নতুন ফাইলের নাম নতুন hash পায় (app-9b2e7d.js), HTML সেই নতুন নামের লিংক দেয়। নতুন URL মানে নতুন cache key, তাই পুরনো কপির প্রশ্নই ওঠে না।'

  - slug: public-cache-leak
    title: 'ভুল public: একজনের পাতা সবাইকে'
    kind: pitfall
    tldr: 'ব্যক্তিগত বা cookie-নির্ভর উত্তরে public বা s-maxage দিলে CDN এক ব্যবহারকারীর পাতা অন্যদের পরিবেশন করে ফেলে; এটা সরাসরি তথ্য ফাঁস।'
    keywords: ['cache leak', 'private data', 'public cache', 'Vary Cookie', 'CDN leak', 'তথ্য ফাঁস']
    blocks:
      - type: text
        body: |
          পাড়ার স্টলে যদি রহিমের নাম লেখা, তার নিজের জন্য আনা পত্রিকা "সবার জন্য" বলে রাখা হয়, করিম সেটা নিয়ে যাবে। নিচের কোডে dashboard-এ `public` আর `smaxage` দেওয়া হয়েছে। CDN প্রথম ব্যবহারকারীর dashboard ১০ মিনিট সবাইকে দেখাবে।
      - type: code
        lang: php
        file: 'src/Controller/DashboardController.php'
        variant: bad
        code: |
          #[Route('/api/dashboard')]
          #[Cache(public: true, smaxage: 600)]     // বিপদ: CDN সবাইকে একই উত্তর দেবে
          public function dashboard(): JsonResponse
          {
              return $this->json($this->dashboards->forUser($this->getUser()));
          }
        marks:
          - {line: 2, tip: 'public + smaxage = CDN ১০ মিনিট কপি রাখবে, URL একই হলে যে-ই চাক।'}
          - {line: 5, tip: 'উত্তরটা getUser()-এর ওপর নির্ভর করে, অথচ cache key-তে ব্যবহারকারী নেই।'}
      - type: code
        lang: php
        file: 'src/Controller/DashboardController.php'
        variant: good
        code: |
          #[Route('/api/dashboard')]
          #[Cache(maxage: 0, private: true, mustRevalidate: true)]
          public function dashboard(): JsonResponse
          {
              return $this->json($this->dashboards->forUser($this->getUser()));
          }
        marks:
          - {line: 2, tip: 'private: শুধু ব্যবহারকারীর নিজের ব্রাউজার রাখতে পারে। CDN রাখবে না।'}
      - type: points
        title: 'public করার আগে তিন প্রশ্ন'
        style: check
        items:
          - 'উত্তরটা কি সব ব্যবহারকারীর জন্য একদম এক?'
          - 'Request-এ cookie বা Authorization header আছে কি, যা উত্তর বদলায়?'
          - 'ভাষা বা দেশের মতো কিছু উত্তর বদলালে Vary header আছে কি?'
    aside:
      - type: pitfalls
        items:
          - 'সবকিছু public করে CDN-এর hit বাড়ানোর লোভ সামলাও; একটা ভুল public header একটা তথ্য ফাঁসের ঘটনা।'
          - 'শুধু অ্যাপে test করলে এই ভুল ধরা পড়ে না; CDN-এর সামনে থেকে header আর উত্তর যাচাই করো।'
      - type: remember
        body: 'ব্যক্তিগত উত্তর = private (বা no-store)। public মানে "সবাই একই জিনিস পাবে"।'
    check:
      q: 'Authorization header-ওয়ালা API উত্তরে Cache-Control: public, s-maxage=600 দিলে কী ঝুঁকি?'
      a: 'CDN উত্তরটা URL ধরে জমায় আর অন্য ব্যবহারকারীকে সেটাই দিতে পারে; ফলে একজনের ব্যক্তিগত তথ্য আরেকজন দেখে ফেলে।'

flashcards:
  - q: 'HTTP caching কেন দরকার?'
    a: 'একই ফাইল বা উত্তর বারবার সার্ভার থেকে না এনে ব্রাউজার বা CDN-এর কপি ব্যবহার করতে, যাতে পেজ দ্রুত খোলে আর সার্ভারের খরচ কমে।'
    more: |
      যে request সার্ভারে পৌঁছায়ই না, সেটা সবচেয়ে দ্রুত। সার্ভার তখন শুধু সেটাই বানায় যা সত্যিই বদলেছে। এতে bandwidth-ও কমে, যা CDN বা ক্লাউডের বিলে সরাসরি পড়ে।
    ref: same-file-again
  - q: 'Cache-Control: no-cache আর no-store-এর তফাত কী?'
    a: 'no-cache: কপি রাখা যাবে, কিন্তু ব্যবহারের আগে সার্ভারকে জিজ্ঞেস করতে হবে। no-store: কোথাও কপি রাখা যাবে না।'
    more: |
      নামের কারণে no-cache প্রায়ই ভুল বোঝা হয়। সংবেদনশীল উত্তরে (টোকেন, ব্যাংকের তথ্য) no-store ব্যবহার করো। HTML পাতায় সাধারণত no-cache চলে: ব্রাউজার ETag দিয়ে যাচাই করে, বদলায়নি হলে ৩০৪।
    ref: cache-control-headers
  - q: 'public আর private cache-এর তফাত কী?'
    a: 'private: শুধু ব্যবহারকারীর নিজের ব্রাউজার রাখতে পারে। public: CDN বা proxy-ও রাখতে পারে।'
    more: |
      ব্যক্তিগত উত্তর, যেমন dashboard বা প্রোফাইল, private হতে হবে। public cache সবাইকে একই কপি দেয়, তাই সেটা শুধু সবার জন্য এক এমন উত্তরে নিরাপদ। `s-maxage` শুধু shared cache-এ প্রযোজ্য।
    ref: cache-control-headers
  - q: 'ETag আর If-None-Match কীভাবে কাজ করে?'
    a: 'সার্ভার উত্তরের সাথে ETag দেয়। ব্রাউজার পরে If-None-Match-এ সেটা পাঠায়; মিললে সার্ভার বডি ছাড়া ৩০৪ দেয়।'
    more: |
      ৩০৪ Not Modified মানে "তোমার কপিই ঠিক, নতুন কিছু নেই"। বডি নামে না, তাই ডাউনলোড বাঁচে। request তবুও সার্ভারে যায়, তাই সেই খরচটা বাঁচাতে চাইলে max-age দিতে হয়।
    ref: etag-304
  - q: 'stale-while-revalidate=60 কী করে?'
    a: 'মেয়াদ ফুরানোর পর ৬০ সেকেন্ড পুরনো কপি দেখানো চলে, আর পেছনে cache নতুন কপি এনে নেয়।'
    more: |
      ব্যবহারকারী অপেক্ষা করে না, কারণ সে সাথে সাথে পুরনো কপি পায়। পরের request নতুন কপি পায়। সার্ভারের ভেতরের cache-এও একই ধারণা কাজ করে; দাম হলো সামান্য সময় পুরনো তথ্য।
    ref: cache-control-headers
  - q: 'Cache busting কী?'
    a: 'ফাইলের নামে তার বিষয়বস্তুর hash রাখা (app-3f9a1c.js), যাতে বদলালে নাম বদলায় আর পুরনো cache এড়ানো যায়।'
    more: |
      hash-সহ ফাইলের নাম নতুন হলে সেটা নতুন URL, মানে নতুন cache key। তাই ওই ফাইলে এক বছরের `immutable` মেয়াদ দেওয়া নিরাপদ। HTML পাতা ছোট মেয়াদে রাখতে হয়, কারণ নতুন নামের লিংক HTML-এই থাকে।
    ref: cdn-keys-busting
  - q: 'CDN-এ cache key কী দিয়ে ঠিক হয়?'
    a: 'সাধারণত URL (query string সহ), আর Vary header-এ বলা request header (যেমন Accept-Language)।'
    more: |
      একই URL-এর ভিন্ন উত্তর (ভাষা, ডিভাইস) থাকলে Vary দিতে হয়, নইলে ভুল কপি যায়। আবার `Vary: Cookie` দিলে প্রতিটা ব্যবহারকারী আলাদা key পায়, hit শূন্য হয়ে যায়। তাই Vary অল্পই দাও।
    ref: cdn-keys-busting
  - q: 'কোন উত্তরে Cache-Control: public দেওয়া বিপজ্জনক?'
    a: 'যে উত্তর ব্যবহারকারী বা cookie অনুযায়ী আলাদা হয়, যেমন dashboard, প্রোফাইল, কার্ট।'
    more: |
      CDN URL ধরে কপি রাখে। উত্তরটা ব্যবহারকারীর ওপর নির্ভর করলে প্রথম জনের কপি অন্যরা পেয়ে যায়, আর এটা তথ্য ফাঁস। এসব উত্তরে private বা no-store দাও।
    ref: public-cache-leak

quiz:
  - q: 'নিচের header-এর অর্থ কী?'
    lang: http
    code: |
      Cache-Control: public, max-age=60, s-maxage=600, stale-while-revalidate=120
    hint: 'ব্রাউজার আর CDN-এর মেয়াদ আলাদা।'
    options:
      - text: 'ব্রাউজার ৬০ সেকেন্ড, CDN ৬০০ সেকেন্ড রাখতে পারবে; মেয়াদের পর ১২০ সেকেন্ড পুরনো কপি চলবে'
        correct: true
        why: 's-maxage শুধু shared cache-এর জন্য, max-age ব্রাউজারের জন্য; SWR পুরনো কপির অনুমতি।'
      - text: 'কোনো cache কিছু রাখবে না'
        correct: false
        why: 'সেটা no-store-এর অর্থ।'
      - text: 'শুধু ব্যবহারকারীর ব্রাউজার ৬০০ সেকেন্ড রাখবে'
        correct: false
        why: 'public বলছে CDN-ও রাখতে পারবে, আর ৬০০ s-maxage, যা CDN-এর।'
      - text: 'প্রতিবার সার্ভারকে জিজ্ঞেস করতে হবে'
        correct: false
        why: 'সেটা no-cache; এখানে মেয়াদের ভেতরে জিজ্ঞেস করার দরকারই নেই।'
    ref: cache-control-headers
  - q: 'ক্লায়েন্টের কাছে ETag "v7a1" আছে। সার্ভারে পণ্য বদলায়নি। ক্লায়েন্ট If-None-Match দিয়ে request পাঠালে কী ঘটে?'
    hint: 'বদলায়নি — তাহলে বডি পাঠানোর দরকার আছে?'
    options:
      - text: 'সার্ভার বডি ছাড়া ৩০৪ Not Modified দেয়; ক্লায়েন্ট নিজের কপি ব্যবহার করে'
        correct: true
        why: 'ছাপ মিলেছে, তাই ডাউনলোড বাঁচে।'
