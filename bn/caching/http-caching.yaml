          - {id: cdn, label: 'CDN', sub: 'কাছের edge', icon: cdn, tone: accent, col: 1.5, row: 1, tip: 'URL আর Vary-র header মিলিয়ে cache key বানায়, তারপর সেই key দিয়ে কপি খোঁজে।'}
