slides:
  - slug: same-file-again
    title: 'একই ফাইল প্রতিবার ডাউনলোড'
    kind: story
    tldr: 'Cache-Control না দিলে ব্রাউজার আর CDN জানে না কী রাখবে; ফলে একই JS, ছবি আর API উত্তর প্রতি ভিজিটে মূল সার্ভার থেকে আসে। HTTP caching এই অপচয় থামায়।'
    keywords: ['HTTP caching', 'Cache-Control', 'browser cache', 'CDN', 'ক্যাশ হেডার', 'bandwidth']
    blocks:
      - type: metaphor
        icon: book
        title: 'পত্রিকার হকার আর পাড়ার স্টল'
        body: |
          প্রেস থেকে পত্রিকা ছাপা হয়। প্রতিদিন প্রতিটা পাঠকের জন্য প্রেসে যেতে হলে কেউ পত্রিকা পেত না। তাই পাড়ার স্টল একসাথে অনেক কপি এনে রাখে, আর পাঠক বাসায় নিয়ে টেবিলে রাখে। প্রেস হলো তোমার সার্ভার, স্টল হলো **CDN**, টেবিলের কপি হলো ব্রাউজারের cache।
      - type: text
        body: |
          রহিমের সাইটে `app.js` ২.৪MB, আর সেটা বদলায় সপ্তাহে একবার। কিন্তু প্রতিটা পেজ খোলায় ব্রাউজার ফাইলটা আবার নামায়। দিনে ৫০ হাজার ভিজিটে এটা ১২০GB bandwidth। সার্ভার একই ফাইল বারবার দিচ্ছে আর ব্যবহারকারী বারবার অপেক্ষা করছে।
      - type: visual
        kind: bars
        caption: 'একই app.js, তিন রকম অবস্থায় প্রতি ভিজিটে কত ডাউনলোড (KB)'
        items:
          - {label: 'কোনো নিয়ম নেই', value: 2400, display: '২৪০০KB', tone: bad, tip: 'ব্রাউজার জানে না কী করবে, তাই প্রতিবার পুরোটা নামায়।'}
          - {label: 'ETag + ৩০৪', value: 3, display: 'প্রায় ১KB', tone: warn, tip: 'ব্রাউজার জিজ্ঞেস করে "বদলেছে?"; সার্ভার শুধু header দিয়ে "না" বলে। বডি নামে না।'}
          - {label: 'max-age-র ভেতরে', value: 1, display: '০KB', tone: good, tip: 'ব্রাউজার সার্ভারকে কিছুই জিজ্ঞেস করে না, নিজের কপি সোজা ব্যবহার করে।'}
      - type: quote
        body: 'যে request সার্ভারে পৌঁছায়ই না, সেটাই সবচেয়ে দ্রুত আর সবচেয়ে সস্তা request।'
    aside:
      - type: terms
        items:
          - {term: 'CDN', meaning: 'পৃথিবীর নানা জায়গায় রাখা সার্ভারের জাল, যারা তোমার ফাইলের কপি ব্যবহারকারীর কাছাকাছি থেকে দেয়।'}
          - {term: 'Origin', meaning: 'আসল সার্ভার, যেখান থেকে CDN প্রথমবার ফাইল আনে।'}
      - type: problem
        body: 'একই কপি বারবার সার্ভার থেকে না আনা — যাতে পেজ দ্রুত খোলে আর সার্ভারের খরচ কমে।'
    check:
      q: 'ব্রাউজার max-age-র মধ্যে থাকা ফাইল আর ETag দিয়ে যাচাই করা ফাইল — কোনটা সার্ভারে request-ই পাঠায় না?'
      a: 'max-age-র মধ্যে থাকা ফাইল। ব্রাউজার নিজের কপিই সরাসরি ব্যবহার করে। ETag-এ সে অন্তত একটা ছোট request পাঠিয়ে জিজ্ঞেস করে।'

  - slug: cache-control-headers
    title: 'Cache-Control: কে কতক্ষণ রাখবে'
    kind: concept
    tldr: 'Cache-Control header বলে দেয় কে (ব্রাউজার না CDN) উত্তরটা রাখতে পারবে আর কতক্ষণ: max-age, s-maxage, public, private, no-cache, no-store, stale-while-revalidate।'
    keywords: ['Cache-Control', 'max-age', 's-maxage', 'private', 'public', 'no-store', 'no-cache', 'stale-while-revalidate']
    blocks:
      - type: text
        body: |
          উত্তরের সাথে সার্ভার একটা নির্দেশনা পাঠায়: Cache-Control। স্টলের ভাষায়: "এই পত্রিকা ঘরে রাখো, ১ দিন", "এটা স্টলে রেখো না, শুধু পাঠকের", "এটা কোথাও রেখো না"। সবচেয়ে বেশি ভুল হয় `no-cache` আর `no-store` গুলিয়ে ফেলায়।
      - type: visual
        kind: table
        caption: 'সবচেয়ে দরকারি Cache-Control directive'
        headers: ['Directive', 'মানে']
        rows:
          - cells: ['max-age=600', 'ব্রাউজার ৬০০ সেকেন্ড সার্ভারকে না জিজ্ঞেসই ব্যবহার করবে']
            tip: 'মেয়াদ থাকতে request সার্ভারে যায়ই না।'
          - cells: ['s-maxage=3600', 'শুধু shared cache (CDN)-এর জন্য আলাদা মেয়াদ']
            tip: 'ব্রাউজারের জন্য ছোট, CDN-এর জন্য লম্বা মেয়াদ দিতে চাইলে এটা।'
          - cells: ['public / private', 'public: CDN-ও রাখতে পারবে। private: শুধু ব্যবহারকারীর ব্রাউজার']
            tip: 'ব্যক্তিগত উত্তরে সবসময় private (বা no-store)।'
          - cells: ['no-cache', 'রাখতে পারো, কিন্তু প্রতিবার সার্ভারকে জিজ্ঞেস করে নাও']
            tip: 'নাম বিভ্রান্তিকর: এটা "রেখো না" নয়, "না জিজ্ঞেস করে ব্যবহার কোরো না"।'
          - cells: ['no-store', 'কোথাও কপি রেখো না']
            tip: 'ব্যাংকের তথ্য বা টোকেনের মতো সংবেদনশীল উত্তরে।'
          - cells: ['stale-while-revalidate=60', 'মেয়াদের পর ৬০ সেকেন্ড পুরনো কপি দেখাও, পেছনে নতুনটা এনে নাও']
            tip: 'ব্যবহারকারী অপেক্ষা করে না; cache পেছনে নিজেই হালনাগাদ হয়।'
      - type: quote
        body: 'no-cache মানে "না জিজ্ঞেস করে ব্যবহার কোরো না"। কিছু না রাখতে চাইলে no-store।'
    aside:
      - type: remember
        body: 'private = শুধু তোমার টেবিল, public = স্টলও রাখতে পারবে।'
      - type: tips
        items:
          - 'লগইন করা ব্যবহারকারীর কোনো উত্তরে ভুলেও public দিয়ো না।'
          - 'stale-while-revalidate শুধু HTTP-র নয়, সার্ভারের ভেতরের cache-এও একই ধারণা।'
      - type: refs
        items:
          - {to: 'caching/cache-stampede', label: 'Stale-while-revalidate সার্ভারের ভেতরে'}
    check:
      q: 'ব্যবহারকারীর নিজের প্রোফাইলের JSON উত্তরে কোন Cache-Control রাখবে, public নাকি private?'
      a: 'private (সংবেদনশীল হলে no-store)। public দিলে CDN এক ব্যবহারকারীর প্রোফাইল অন্যদের দেখিয়ে দিতে পারে।'

  - slug: etag-304
    title: 'ETag: বদলেছে? না — তাহলে ডাউনলোড নয়'
    kind: concept
    tldr: 'ETag হলো উত্তরের আঙুলের ছাপ। ব্রাউজার If-None-Match-এ সেটা ফেরত পাঠায়; ছাপ মিললে সার্ভার বডি ছাড়া ৩০৪ দেয়, ব্রাউজার নিজের কপি ব্যবহার করে।'
    keywords: ['ETag', 'If-None-Match', '304 Not Modified', 'conditional request', 'revalidation', 'Last-Modified']
    blocks:
      - type: metaphor
        icon: id
        title: 'পত্রিকার সংখ্যা নম্বর'
        body: |
          পাঠক স্টলে গিয়ে বলে, "আমার কাছে ৭৪১ নম্বর সংখ্যা আছে, এটাই কি সর্বশেষ?" স্টলওয়ালা মিলিয়ে বলে, "হ্যাঁ, রাখো।" পাঠককে নতুন পত্রিকা নিতে হয় না। সংখ্যা নম্বর হলো ETag, আর "হ্যাঁ, রাখো" হলো ৩০৪।
      - type: visual
        kind: sequence
        caption: 'ETag দিয়ে conditional request'
        actors:
          - {id: browser, label: 'ব্রাউজার', icon: browser, tip: 'আগের উত্তর আর তার ETag নিজের কাছে রেখে দিয়েছে।'}
          - {id: server, label: 'সার্ভার', icon: server, tip: 'ছাপ মিলিয়ে দেখে, দরকার হলে তবেই বডি পাঠায়।'}
        messages:
          - {from: browser, to: server, label: 'GET /api/products/42'}
          - {from: server, to: browser, label: '200 + ETag: "v7a1" + বডি', dashed: true, tip: 'প্রথমবার পুরো উত্তর যায় আর সাথে ছাপও।'}
          - {at: browser, note: 'উত্তর আর ETag জমা রাখল'}
          - {from: browser, to: server, label: 'GET + If-None-Match: "v7a1"', tip: 'ব্রাউজার বলছে "আমার কাছে v7a1 আছে, বদলেছে?"।'}
          - {from: server, to: browser, label: '304 Not Modified (বডি নেই)', dashed: true, tone: good, tip: 'ছাপ মিলেছে। সার্ভার শুধু header পাঠাল, কয়েকশো বাইট।'}
          - {at: browser, note: 'নিজের কপিই ব্যবহার করল', tone: good}
          - {from: browser, to: server, label: 'পণ্য বদলের পরে আবার If-None-Match'}
          - {from: server, to: browser, label: '200 + নতুন ETag: "v7b2" + বডি', dashed: true, tip: 'ছাপ মেলেনি, তাই নতুন উত্তর পুরোটা যায়।'}
      - type: quote
        body: 'ETag দিয়ে বডির খরচ বাঁচে, request-এর খরচ নয়। request-ই বাঁচাতে চাইলে max-age।'
    aside:
      - type: terms
        items:
          - {term: 'Conditional request', meaning: 'শর্ত-সহ request: "বদলে থাকলে তবেই পাঠাও" (If-None-Match বা If-Modified-Since)।'}
          - {term: 'Weak ETag', meaning: 'W/"..." দিয়ে শুরু; অর্থ একই থাকলেই চলে, বাইট-বাই-বাইট না মিললেও।'}
      - type: tips
        items:
          - 'Last-Modified আর If-Modified-Since একই কাজ করে তারিখ দিয়ে। ETag বেশি নির্ভরযোগ্য, কারণ সেকেন্ডের নিচে বদলও ধরে।'
    check:
      q: 'ETag মিললে সার্ভার কী পাঠায়, আর তাতে কী বাঁচে?'
      a: '৩০৪ Not Modified, বডি ছাড়া। উত্তরের বডি ডাউনলোড বাঁচে, আর ETag সস্তায় মেলানো গেলে বডি বানানোর কাজও বাঁচে।'

  - slug: symfony-http-cache
    title: 'Symfony-তে header আর ৩০৪'
    kind: howto
    tldr: '#[Cache] attribute দিয়ে max-age, public, stale-while-revalidate বসাও; ETag ধরে response->isNotModified() দিয়ে ভারী কাজের আগেই ৩০৪ ফেরত দাও।'
    keywords: ['#[Cache]', 'isNotModified', 'setEtag', 'Symfony Response', 'smaxage', 'HttpKernel']
    blocks:
      - type: text
        body: |
          Symfony-তে `Response` অবজেক্টই cache header বানায়। সাধারণ মেয়াদ বসানোর জন্য `#[Cache]` attribute যথেষ্ট। ETag-এর বেলায় কৌশল হলো: ETag এমন কিছু থেকে বানাও যা সস্তায় পাওয়া যায়, যেমন `updatedAt`। তাহলে ভারী JSON বানানোর আগেই মিলিয়ে ৩০৪ ফেরত দেওয়া যায়।
      - type: code
        lang: php
        file: 'src/Controller/ProductController.php'
        variant: good
        code: |
          #[Route('/api/products/{id}', methods: ['GET'])]
          #[Cache(maxage: 60, smaxage: 600, public: true, staleWhileRevalidate: 120)]
          public function show(Product $product, Request $request): JsonResponse
          {
              $response = new JsonResponse();
              $response->setEtag(md5($product->getId().'|'.$product->getUpdatedAt()->format('U.u')));

              if ($response->isNotModified($request)) {
                  return $response;            // ৩০৪: ভারী কাজ না করেই ফেরত
              }

              return $response->setData(ProductView::from($product)->toArray());
          }
        marks:
          - {line: 2, tip: 'ব্রাউজার ১ মিনিট, CDN ১০ মিনিট রাখবে। মেয়াদের পরে ২ মিনিট পুরনো কপিও চলবে।'}
          - {line: 6, tip: 'ETag বানানো হয় আইডি আর শেষ বদলের সময় থেকে। বডি বানানোর দরকার হয় না।'}
          - {line: 8, tip: 'isNotModified() request-এর If-None-Match মিলিয়ে দেখে, আর মিললে নিজেই ৩০৪ বসিয়ে দেয়।'}
      - type: code
        lang: php
        file: 'src/Controller/ProfileController.php'
        variant: good
        code: |
          #[Route('/api/me', methods: ['GET'])]
          public function me(): JsonResponse
          {
              $response = $this->json(ProfileView::from($this->getUser()));
              $response->setPrivate();                                   // CDN রাখবে না
              $response->headers->addCacheControlDirective('no-store');  // কোথাওই না

              return $response;
          }
        marks:
          - {line: 5, tip: 'ব্যক্তিগত উত্তর: private বলে দেওয়া সবচেয়ে সংক্ষিপ্ত সুরক্ষা।'}
          - {line: 6, tip: 'ব্রাউজারেও জমা রাখতে না চাইলে no-store।'}
    aside:
      - type: tips
        items:
          - 'Symfony-তে session ব্যবহার হলে উত্তর নিজে থেকেই private হয়ে যায়; তবু ব্যক্তিগত API-তে নিজে স্পষ্ট করে লেখো।'
          - 'কোনো উত্তর অনেক জায়গায় বদলাতে পারে? ETag-এ তার সব উপাদান (আইডি, updatedAt, ভাষা) ঢোকাও।'
      - type: commands
        title: 'দেখে নাও'
        items:
          - {cmd: 'curl -I https://shop.test/api/products/42', desc: 'response header দেখো'}
          - {cmd: 'curl -I -H ''If-None-Match: "<etag>"'' https://shop.test/api/products/42', desc: '৩০৪ পাওয়া যায় কি না পরীক্ষা'}
    check:
      q: 'ETag-এ কেন আইডি আর updatedAt ব্যবহার করা হলো, পুরো JSON-এর hash নয়?'
      a: 'JSON-এর hash বের করতে আগে পুরো JSON বানাতে হয়, তাতে ৩০৪-এর লাভ থাকে না। updatedAt সস্তায় পাওয়া যায়, তাই ভারী কাজের আগেই মিলিয়ে ফেরত দেওয়া যায়।'

  - slug: cdn-keys-busting
    title: 'CDN, cache key আর cache busting'
    kind: concept
