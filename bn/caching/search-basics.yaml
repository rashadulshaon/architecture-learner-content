      - text: 'brand-এর শর্ত মূল query-তে, তাই গোনা শুধু Samsung পণ্যের ওপর হয়েছে'
        correct: true
        why: 'Aggregation গোনে query যা মিলিয়েছে তা-ই। post_filter-এ গোনা আগে চলে, hit ছাঁটা পরে।'
