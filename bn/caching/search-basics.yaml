    ref: search-with-facets
  - q: 'BM25 অনুযায়ী কোন কোন ক্ষেত্রে একটা document-এর score বাড়ে?'
    hint: 'বিরল, বারবার, ছোট — এই তিন শব্দ মনে করুন।'
    options:
      - text: 'মিলে যাওয়া শব্দটা পুরো index-এ খুব কম document-এ আছে'
        correct: true
        why: 'বিরল শব্দ বেশি তথ্য দেয়, তাই তার ওজন বেশি (IDF)।'
      - text: 'শব্দটা document-এর ভেতরে কয়েকবার আছে'
        correct: true
        why: 'বারবার থাকলে নম্বর বাড়ে (TF), যদিও একটা সীমার পরে আর বাড়ে না।'
      - text: 'document-টা সবচেয়ে নতুন'
        correct: false
        why: 'BM25 তারিখ দেখে না। নতুনকে আগে আনতে চাইলে আলাদা করে sort বা boost দিতে হয়।'
      - text: 'মিলটা পাওয়া গেছে খুব ছোট একটা field-এ'
        correct: true
        why: 'ছোট লেখায় মিল পাওয়া মানে লেখাটা মূলত ওই বিষয়েই — তাই নম্বর বেশি।'
    ref: relevance-scoring
  - q: 'কোন কোন পরিস্থিতিতে Elasticsearch বা OpenSearch আনা যুক্তিসঙ্গত?'
    hint: 'সমস্যাটা সত্যিই আছে কি না, আর চালানোর খরচ বইতে পারবে কি না — দুটোই ভাবুন।'
    options:
      - text: '৩০ লাখ পণ্যের ক্যাটালগ; খদ্দের বানান ভুল করে আর brand-দাম ধরে facet চায়'
        correct: true
        why: 'ডেটা বড়, আর বানান ভুল ও facet — দুটোই ডেটাবেসের full-text-এর দুর্বল জায়গা।'
      - text: 'অ্যাডমিন প্যানেলে ২০০ জন কর্মীর নাম দিয়ে খোঁজা'
        correct: false
        why: '২০০ সারিতে LIKE-ও চোখের পলকে চলে। এখানে নতুন cluster শুধুই বাড়তি বোঝা।'
      - text: 'বাংলা ও ইংরেজি মেশানো লাখো বিজ্ঞাপনে মানানসই ফলাফল আগে দেখানো দরকার'
        correct: true
        why: 'ভাষাভিত্তিক analyzer আর relevance scoring — এ কাজের জন্যই search engine।'
      - text: 'checkout-এর সময় পণ্যের স্টক আছে কি না তা যাচাই করা'
        correct: false
        why: 'স্টকের সিদ্ধান্ত নিতে হয় ডেটাবেস দেখে; search index পিছিয়ে থাকতে পারে।'
    ref: search-engine-tradeoffs
  - q: 'রহিম ৫ লাখ পণ্যের টেবিলে `search_vector` নামে tsvector কলাম বসিয়েছে, তবু search ধীর, আর EXPLAIN দেখাচ্ছে sequential scan। কী বাদ পড়েছে?'
    hint: 'কলামে term জমা আছে। সেটাকে "শব্দ থেকে সারি" খোঁজায় বদলায় কী?'
    options:
      - text: 'search_vector-এর ওপর একটা GIN index'
        correct: true
        why: 'GIN-ই inverted index। না থাকলে PostgreSQL প্রতিটা সারির tsvector-এর সাথে খোঁজ মেলায়।'
      - text: 'name-এর ওপর একটা B-tree index'
        correct: false
        why: 'B-tree লেখার শুরু ধরে সাজানো; "কোন সারিতে এই শব্দ আছে" তার উত্তর দিতে পারে না।'
      - text: 'query-কে LIKE ''%শব্দ%'' বানিয়ে ফেলা'
        correct: false
        why: 'LIKE-ই সেই ধীর full table scan, যেটা বদলাতে tsvector কলাম।'
      - text: 'এখনই Elasticsearch-এ চলে যাওয়া'
        correct: false
        why: 'এই মাপের জন্যই ডেটাবেসের পথ। একটা index না থাকলে নতুন cluster চালানোর কারণ হয় না।'
    ref: search-engine-tradeoffs
  - q: 'খদ্দের "samsang" লিখে খুঁজল, কিছুই এল না। সবচেয়ে সঠিক সমাধান কোনটা?'
    hint: 'এক-দুই অক্ষরের ভুল মেনে নেওয়ার ব্যবস্থা search engine-এ আগে থেকেই আছে।'
