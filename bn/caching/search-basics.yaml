      - text: 'প্রতিটা সম্ভাব্য ভুল বানান পণ্যের নামে যোগ করে রাখা'
        correct: false
        why: 'ভুল বানানের শেষ নেই; ডেটা নোংরা হবে, তবু সব ভুল ধরা পড়বে না।'
      - text: 'খদ্দেরকে error দেখিয়ে সঠিক বানান লিখতে বলা'
        correct: false
        why: 'খদ্দের সঠিক বানান জানলে তো ভুল লিখত না। সে খালি পাতা দেখে অন্য দোকানে চলে যাবে।'
      - text: 'stemmer filter যোগ করা'
        correct: false
        why: 'stemmer শব্দের রূপ এক করে (phones → phone); বানান ভুল শোধরায় না।'
    ref: relevance-scoring
