            tone: bad
            icon: cross
            tip: 'এই নিয়ম আগে থেকে টিম আর ম্যানেজারের সম্মতিতে লেখা থাকে, যাতে সংকটের সময় তর্ক না হয়।'
            items:
              - 'নতুন ফিচার বন্ধ, শুধু স্থিতিশীলতার কাজ'
