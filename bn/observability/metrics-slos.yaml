slides:
  - slug: average-lies
    title: 'গড় বলছে সব ঠিক, ক্রেতারা বলছে সাইট ধীর'
    kind: story
    tldr: 'গড় response time ধীর কয়েকজনকে লুকিয়ে ফেলে; তাই আসল অভিজ্ঞতা মাপতে percentile (p90, p99) আর ক্রমাগত জমা হওয়া metric দেখতে হয়।'
    keywords: ['metrics', 'average vs percentile', 'p99', 'latency', 'monitoring', 'মেট্রিক', 'গড়']
    blocks:
      - type: metaphor
        icon: heart
        title: 'ডাক্তারের ভাইটাল সাইন'
        body: |
          রোগীর জ্বর, নাড়ির গতি আর রক্তচাপ নার্স নিয়ম করে মেপে চার্টে লেখেন। রোগী ভালো আছে কি না, তা মুখ দেখে নয়, সংখ্যার ধারা দেখে বোঝা যায়। Metric হলো অ্যাপের সেই চার্ট: প্রতি মিনিটে মাপা সংখ্যা, যা সময়ের সাথে জমতে থাকে।
      - type: visual
        kind: bars
        caption: 'একই ১০০ জন ক্রেতার response time: গড় আর percentile'
        items:
          - {label: 'গড় (average)', value: 120, display: '120ms', tone: good, tip: 'সব সময় যোগ করে ভাগ। কয়েকটা খুব ধীর request গড়ে ডুবে যায়, তাই গড় সুন্দর দেখায়।'}
          - {label: 'p50', value: 80, display: '80ms', tone: good, tip: 'মাঝের ক্রেতা: অর্ধেক ক্রেতা এর চেয়ে দ্রুত উত্তর পেয়েছে।'}
          - {label: 'p90', value: 150, display: '150ms', tone: default, tip: '১০০ জনের ৯০ জন এর মধ্যে উত্তর পেয়েছে। বাকি ১০ জন এর চেয়ে বেশি অপেক্ষা করেছে।'}
          - {label: 'p99', value: 2400, display: '2400ms', tone: bad, tip: '১০০ জনের একজন ২.৪ সেকেন্ড বসে ছিল। সে-ই হয়তো আপনার সবচেয়ে বেশি কেনাকাটা করা ক্রেতা, কারণ বড় cart-এর পাতা সবচেয়ে ভারী।'}
      - type: quote
        body: 'গড় দিয়ে অভিজ্ঞতা মাপা যায় না; দেখুন p90 আর p99 — ধীরতম ক্রেতারা।'
    aside:
      - type: story
        title: 'সোমবারের অভিযোগ'
        body: 'ইমনের ড্যাশবোর্ডে গড় ১২০ms, সবুজ। তবু সাপোর্টে প্রতিদিন "চেকআউট আটকে যায়" অভিযোগ আসত। p99 দেখার পর বোঝা গেল, বড় cart-এর ক্রেতারা ২–৩ সেকেন্ড বসে থাকছে আর অনেকে ছেড়ে চলে যাচ্ছে। গড় তাদের কথা বলেনি।'
      - type: terms
        items:
          - {term: 'Percentile (p99)', meaning: 'p99 = ১০০ জনের ৯৯ জন যার মধ্যে উত্তর পেয়েছে সেই সময়; অর্থাৎ ধীরতম ১% বাদে সবাই।'}
          - {term: 'Metric', meaning: 'সময়ের সাথে নিয়ম করে মাপা একটা সংখ্যা: request-সংখ্যা, error, response time।'}
    check:
      q: 'গড় response time ১২০ms, তবু p99 ২.৪ সেকেন্ড। এর মানে কী?'
      a: 'বেশিরভাগ ক্রেতা দ্রুত উত্তর পাচ্ছে, কিন্তু প্রতি ১০০ জনে একজন অনেক ধীর অভিজ্ঞতা পাচ্ছে। গড় সেটা লুকিয়ে ফেলেছে।'

  - slug: three-metric-types
    title: 'তিন ধরনের metric: counter, gauge, histogram'
    kind: concept
    tldr: 'Counter শুধু বাড়ে (কতবার), gauge ওঠানামা করে (এখন কত), histogram মান বালতিতে ফেলে (কত সময়ে কয়টা) — percentile আসে histogram থেকে।'
    keywords: ['counter', 'gauge', 'histogram', 'Prometheus', 'label cardinality', 'বালতি', 'metric type']
    blocks:
      - type: metaphor
        icon: ticket
        title: 'বাসের কন্ডাক্টরের তিন হিসাব'
        body: |
          কন্ডাক্টরের টিকিটের কাউন্টার শুধু বাড়ে: আজ কত টিকিট বিক্রি হলো (counter)। বাসে এই মুহূর্তে কতজন যাত্রী আছে, সেটা ওঠানামা করে (gauge)। আর কে কত মিনিটে স্টপেজে পৌঁছাল, তা সে "১০ মিনিটের মধ্যে, ২০ মিনিটের মধ্যে" এমন খোপে ফেলে গোনে (histogram)।
      - type: visual
        kind: table
        caption: 'তিন metric: কখন কোনটা'
        headers: ['ধরন', 'আচরণ', 'উদাহরণ']
        rows:
          - cells: ['Counter', 'শুধু বাড়ে, রিসেটে শূন্য', 'http_requests_total, orders_failed_total']
            tip: 'মোট সংখ্যার জন্য। আসল কাজের হিসাব (প্রতি সেকেন্ডে কত) আসে rate() দিয়ে, সংখ্যাটা নিজে দেখে নয়।'
          - cells: ['Gauge', 'ওঠে-নামে', 'queue_depth, active_connections']
            tip: 'এই মুহূর্তের অবস্থা: queue-তে কত message জমা, কয়টা connection খোলা।'
          - cells: ['Histogram', 'মান বালতিতে (bucket) গোনে', 'http_request_duration_seconds']
            tip: 'প্রতিটা মান কোন খোপে পড়ল তা গোনে। এ থেকে p50, p90, p99 বের হয়, আর একাধিক সার্ভারের মান জোড়াও যায়।'
      - type: points
        title: 'Label-এর নিয়ম'
        style: cross
        items:
          - 'user_id, order_id বা পুরো URL (/orders/5512) label করবেন না: প্রতিটা আলাদা মান নতুন time series (গ্রাফের নিজস্ব একটা রেখা) শুরু করে। ১ লাখ ইউজার × ২০ route = ২০ লাখ রেখা।'
          - 'label হবে সীমিত তালিকার: method, route নাম, status।'
          - 'ব্যক্তির তথ্য বা token label-এ নয়।'
      - type: quote
        body: 'Label-এর মান সীমিত রাখুন; ID-কে label বানালে metric সিস্টেম নিজেই ভেঙে পড়ে।'
    aside:
      - type: remember
        body: 'Counter: কতবার। Gauge: এখন কত। Histogram: কত দ্রুত।'
      - type: pitfalls
        items:
          - 'Counter-এর কাঁচা মান দেখা: সার্ভার restart হলে শূন্য থেকে শুরু; সবসময় rate() ব্যবহার করুন।'
          - 'Histogram-এর bucket ভুল ধরনের হলে percentile ভুল: আপনার SLO-র সীমার (যেমন ০.৫ সেকেন্ড) আশেপাশে bucket রাখুন।'
      - type: terms
        items:
          - {term: 'Cardinality', meaning: 'একটা metric-এর label মিলিয়ে কতগুলো আলাদা time series হয়; যত বেশি, তত দামি।'}
    check:
      q: 'Metric-এ route নাম label রাখা ঠিক, কিন্তু user_id label রাখা ভুল কেন?'
      a: 'route অল্প কয়েকটা, কিন্তু user_id লাখ লাখ। প্রতিটা আলাদা মান আলাদা time series, তাই user_id দিলে metric সিস্টেমের মেমোরি আর খরচ ফেটে যায়।'

  - slug: red-and-use
    title: 'কী মাপবেন: RED আর USE'
    kind: concept
    tldr: 'সেবার জন্য RED (Rate, Errors, Duration), যন্ত্রের জন্য USE (Utilization, Saturation, Errors) — এই ছয়টা মাপলেই বেশিরভাগ সমস্যা ধরা পড়ে।'
    keywords: ['RED method', 'USE method', 'golden signals', 'saturation', 'utilization', 'monitoring']
    blocks:
      - type: metaphor
        icon: building
        title: 'রেস্তোরাঁর ক্রেতা আর রান্নাঘর'
        body: |
          রেস্তোরাঁ ভালো চলছে কি না দুই দিক থেকে দেখা যায়। ক্রেতার দিক: প্রতি ঘণ্টায় কত অর্ডার এল, কত অর্ডার ভুল হলো, কত মিনিটে খাবার এল (RED)। রান্নাঘরের দিক: চুলা কত ভাগ সময় চালু, অর্ডারের লাইন কত লম্বা, কোন যন্ত্র নষ্ট (USE)।
      - type: visual
        kind: compare
        caption: 'RED সেবার চোখে, USE যন্ত্রের চোখে'
        columns:
          - title: 'RED: সেবার (API) জন্য'
            tone: accent
            icon: chart
            tip: 'ব্যবহারকারী যা অনুভব করে, তার মাপ। কী ভাঙছে তা বলে।'
            items:
              - 'Rate: প্রতি সেকেন্ডে কত request'
              - 'Errors: কত অংশ ব্যর্থ (৫xx)'
              - 'Duration: কত সময় লাগছে (p50, p99)'
          - title: 'USE: যন্ত্রের (CPU, DB, queue)'
            tone: warn
            icon: cpu
            tip: 'যন্ত্রের স্বাস্থ্যের মাপ। কেন ভাঙছে তা বলে।'
            items:
              - 'Utilization: কত ভাগ সময় ব্যস্ত'
              - 'Saturation: কতটা কাজ লাইনে অপেক্ষা করছে'
              - 'Errors: যন্ত্র কতবার ব্যর্থ হলো'
      - type: code
        lang: text
        file: 'PromQL: RED-এর তিন query'
        variant: good
        code: |
          # Rate: প্রতি সেকেন্ডে request
          sum(rate(shop_http_requests_total[5m]))

          # Errors: ৫xx-এর অনুপাত
          sum(rate(shop_http_requests_total{status=~"5.."}[5m]))
            / sum(rate(shop_http_requests_total[5m]))

          # Duration: p99
          histogram_quantile(0.99,
            sum by (le) (rate(shop_http_request_duration_seconds_bucket[5m])))

          # Saturation (USE): async queue-তে এই মুহূর্তে কতগুলো message অপেক্ষায়
          max(shop_queue_depth{queue="async"})
        marks:
          - {line: 2, tip: 'rate() counter-কে "প্রতি সেকেন্ডে কত" এ বদলায়; [5m] মানে গত ৫ মিনিটের ধারা।'}
          - {line: 5, tip: 'অনুপাত, সংখ্যা নয়: ১০টা ব্যর্থতা ১০০ request-এ বিপজ্জনক, ১০ লাখে নয়।'}
          - {line: 9, tip: 'bucket-এর গোনা থেকে একটা p99 সংখ্যা বানায়। le মানে "less than or equal": প্রতিটা bucket-এর ওপরের সীমা।'}
          - {line: 13, tip: 'একটা gauge, Messenger-এর queue থেকে বসানো (পরের স্লাইডে কীভাবে)। সংখ্যা বাড়তেই থাকলে কাজ আসছে সামলানোর চেয়ে দ্রুত।'}
      - type: quote
        body: 'সেবায় RED দেখুন, যন্ত্রে USE; সবচেয়ে আগে ধরা পড়ে saturation।'
    aside:
      - type: tips
        items:
          - 'RED-এর ড্যাশবোর্ড প্রতিটা সেবা আর গুরুত্বপূর্ণ endpoint (checkout, login)-এর জন্য এক ধাঁচে বানান।'
          - 'Queue-র গভীরতা (saturation) প্রায়ই সমস্যার প্রথম ইঙ্গিত: CPU শান্ত, কিন্তু কাজ জমছে।'
      - type: terms
        items:
          - {term: 'PromQL', meaning: 'Prometheus-এর query ভাষা। Prometheus হলো যে ডেটাবেসে metric জমা থাকে। প্রতিটা query একটা সংখ্যা বা গ্রাফ চায়।'}
          - {term: 'Saturation', meaning: 'যন্ত্র যতটা পারে তার চেয়ে বেশি কাজ এসে লাইনে জমছে কি না; জমা মানে দেরি আসন্ন।'}
      - type: refs
        items:
          - {to: 'scaling/load-latency', label: 'Load আর latency'}
    check:
      q: 'API-র error হার ঠিক আছে, কিন্তু queue-তে ১০ হাজার message জমে আছে। কোন মাপ এটা ধরত?'
      a: 'USE-এর saturation, অর্থাৎ queue-র গভীরতা। RED-এর মাপ ভালো দেখাচ্ছে কারণ API উত্তর দিচ্ছে; জমা কাজ পেছনে আটকে আছে।'

  - slug: instrument-symfony
    title: 'Symfony-তে metric বসানো'
    kind: howto
    tldr: 'একটা listener প্রতিটা request-এ counter আর histogram বাড়ায়, আর /metrics endpoint সেগুলো Prometheus-কে দেখায় — route নাম label, URL নয়।'
    keywords: ['promphp', 'Prometheus', 'CollectorRegistry', 'metrics endpoint', 'event listener', 'Symfony metrics']
    blocks:
      - type: text
        body: |
          `promphp/prometheus_client_php` প্যাকেজ counter আর histogram বানায়। Prometheus (metric জমানোর ডেটাবেস) প্রতি ১৫ সেকেন্ডে আপনার `/metrics` পাতায় এসে সংখ্যাগুলো জমা রাখে। PHP-FPM-এর request ক্ষণস্থায়ী process, তাই সংখ্যা তার বাইরে রাখতে হয়। `config/services.yaml`-এ registry-কে Redis-এ বসান: `Prometheus\Storage\Redis: {arguments: [{host: '%env(REDIS_HOST)%'}]}` আর `Prometheus\CollectorRegistry: {arguments: ['@Prometheus\Storage\Redis']}`।
      - type: code
        lang: php
        file: 'src/Metrics/RequestMetricsListener.php'
        variant: good
        code: |
          final class RequestMetricsListener
          {
              public function __construct(private readonly CollectorRegistry $registry)
              {
              }

              #[AsEventListener(priority: 1024)]
              public function onRequest(RequestEvent $event): void
              {
                  $event->getRequest()->attributes->set('_started', microtime(true));
              }

              #[AsEventListener]
              public function onTerminate(TerminateEvent $event): void
              {
                  $request = $event->getRequest();
                  $route = (string) $request->attributes->get('_route', 'unknown');
                  $status = (string) $event->getResponse()->getStatusCode();
                  $seconds = microtime(true) - (float) $request->attributes->get('_started');

                  $this->registry
                      ->getOrRegisterCounter('shop', 'http_requests_total', 'Requests',
                          ['method', 'route', 'status'])
                      ->inc([$request->getMethod(), $route, $status]);

                  $this->registry
                      ->getOrRegisterHistogram('shop', 'http_request_duration_seconds', 'Latency',
                          ['route'], [0.05, 0.1, 0.25, 0.5, 1, 2.5])
                      ->observe($seconds, [$route]);
              }
          }
        marks:
          - {line: 17, tip: '_route হলো route-এর নাম (order_show), URL নয়। নাম সীমিত, URL অসীম; এটাই cardinality বাঁচায়।'}
          - {line: 23, tip: 'status-ও label: ৫xx-এর অনুপাত বের করা যায়।'}
          - {line: 28, tip: 'Bucket-এর সীমা (০.৫ সেকেন্ড) আপনার SLO-র কাছাকাছি রাখুন। তাহলে "০.৫ সেকেন্ডের মধ্যে কত %" সরাসরি পাওয়া যায়।'}
      - type: code
        lang: php
        file: 'src/Controller/MetricsController.php'
        variant: good
        code: |
          #[Route('/metrics', methods: ['GET'])]
          public function metrics(
              CollectorRegistry $registry,
              #[Autowire(service: 'messenger.transport.async')] MessageCountAwareInterface $async,
          ): Response {
              // gauge: এখন কতগুলো কাজ অপেক্ষায়, প্রতিটা scrape-এ পড়া
              $registry
                  ->getOrRegisterGauge('shop', 'queue_depth', 'Messages waiting', ['queue'])
                  ->set($async->getMessageCount(), ['async']);

              $text = (new RenderTextFormat())->render($registry->getMetricFamilySamples());

              return new Response($text, 200, ['Content-Type' => RenderTextFormat::MIME_TYPE]);
          }
        marks:
          - {line: 1, tip: 'এই পাতা শুধু ভেতরের নেটওয়ার্কে খোলা রাখুন (firewall বা nginx allow), ইন্টারনেটে নয়।'}
          - {line: 7, tip: 'Gauge বাড়ানো হয় না, সেট করা হয়। প্রতিটা scrape-এ (প্রতি ১৫ সেকেন্ডে) queue পড়লে আলাদা কোনো job ছাড়াই সংখ্যা তাজা থাকে।'}
    aside:
      - type: tips
        items:
          - 'Business metric-ও মাপুন: orders_placed_total, payments_failed_total (অর্ডার handler-এ একটা inc())। প্রযুক্তিগত metric ঠিক আছে কিন্তু অর্ডার শূন্য, এমনও হয়।'
          - 'Redis storage-এ সব সার্ভারের একটাই সংখ্যা মেলে, কিন্তু প্রতি write-এ একটা network call। APCu দ্রুত, কিন্তু প্রতি সার্ভার নিজের সংখ্যা রাখে (আর আলাদাভাবে scrape হয়)।'
          - 'ভাগাভাগি করা storage ছাড়া প্রতিটা ক্ষণস্থায়ী request শূন্য থেকে শুরু করে, আর প্রতিটা scrape-এ প্রায় কিছুই দেখা যায় না।'
      - type: refs
        items:
          - {to: 'observability/logging-tracing', label: 'Log আর trace'}
    check:
      q: 'Route-এর নামের বদলে পুরো URL label করলে কী ঘটবে?'
      a: '/orders/1, /orders/2, ... প্রতিটা আলাদা time series হবে। সংখ্যা ফেটে metric সিস্টেমের মেমোরি আর খরচ বেড়ে যাবে, আর ড্যাশবোর্ড পড়া অসম্ভব হবে।'

  - slug: sli-slo
    title: 'SLI আর SLO: "ভালো" মানে ঠিক কতটুকু?'
    kind: concept
    tldr: 'SLI একটা মাপা অনুপাত (ভালো request ÷ মোট request); SLO তার লক্ষ্য (যেমন ৩০ দিনে ৯৯.৯%); আর ১০০% কখনো লক্ষ্য হয় না।'
    keywords: ['SLI', 'SLO', 'SLA', 'availability', 'nines', 'service level objective', 'লক্ষ্যমাত্রা']
    blocks:
      - type: metaphor
        icon: school
        title: 'স্কুলের হাজিরার নিয়ম'
        body: |
          স্কুলে নিয়ম: অন্তত ৭৫% ক্লাসে উপস্থিত থাকলে পরীক্ষায় বসা যাবে। উপস্থিত ক্লাস ÷ মোট ক্লাস একটা অনুপাত, এটা SLI। ৭৫% হলো লক্ষ্য, এটা SLO। আর বাকি ২৫% অনুপস্থিতির সুযোগ আছে, সেটাই error budget।
      - type: points
        title: 'তিনটা শব্দ'
        style: number
        items:
          - 'SLI: ভালো ঘটনা ÷ মোট ঘটনা। যেমন: ৫০০ms-এর মধ্যে ৫xx ছাড়া উত্তর পাওয়া checkout request ÷ মোট checkout request।'
          - 'SLO: ওই অনুপাতের লক্ষ্য একটা সময়সীমায়। যেমন: ৩০ দিনে ৯৯.৯%।'
          - 'SLA: ক্রেতার সাথে চুক্তি, ভাঙলে জরিমানা। SLO-র চেয়ে আলগা রাখা হয়, যাতে ভাঙার আগেই সতর্ক হওয়া যায়।'
      - type: visual
        kind: table
        caption: '৩০ দিনে কতটা ব্যর্থতা SLO-র মধ্যে'
        headers: ['SLO', 'অনুমোদিত ব্যর্থতা', '১০ লাখ request-এ']
        rows:
          - cells: ['৯৯%', 'মোট সময়ের ১%, প্রায় ৭.২ ঘণ্টা', '১০,০০০ ব্যর্থ']
            tip: 'অভ্যন্তরীণ টুল বা কম গুরুত্বের সেবার জন্য যথেষ্ট হতে পারে।'
          - cells: ['৯৯.৫%', 'প্রায় ৩.৬ ঘণ্টা', '৫,০০০ ব্যর্থ']
            tip: 'সাধারণ ওয়েব অ্যাপের জন্য সাধারণ লক্ষ্য।'
          - cells: ['৯৯.৯%', 'প্রায় ৪৩ মিনিট', '১,০০০ ব্যর্থ']
            tip: 'checkout বা payment-এর মতো গুরুত্বপূর্ণ পথে। প্রতিটা ৯ বাড়ালে খরচ বহুগুণ বাড়ে।'
          - cells: ['৯৯.৯৯%', 'প্রায় ৪ মিনিট ২০ সেকেন্ড', '১০০ ব্যর্থ']
            tip: 'মানুষ দিয়ে সমস্যা সামলানোর সময়ই থাকে না; সবকিছু স্বয়ংক্রিয় হতে হবে, তাই খুব দামি।'
      - type: quote
        body: 'SLO ১০০% হয় না; ক্রেতা যতটুকু অনুভব করে আর যতটুকু খরচ করা যায়, তার মাঝামাঝি।'
    aside:
      - type: tips
        items:
          - 'SLI বাছুন ক্রেতার চোখে: "server up" নয়, "checkout সফল আর ৫০০ms-এর মধ্যে"। CPU কতটা তা SLI নয়।'
          - 'গুরুত্বপূর্ণ পথ (login, checkout) আর কম গুরুত্বের পথ (রিপোর্ট)-এর আলাদা SLO রাখুন।'
      - type: terms
        items:
          - {term: 'Rolling window', meaning: 'সবসময় "গত ৩০ দিন" ধরে মাপা, ক্যালেন্ডার মাস ধরে নয়।'}
      - type: remember
        body: 'SLI = মাপা। SLO = লক্ষ্য। SLA = চুক্তি।'
    check:
      q: 'টিম বলল "আমাদের লক্ষ্য ১০০% uptime"। কেন এটা ভালো SLO নয়?'
      a: '১০০% অসম্ভব, আর তার কাছাকাছি যেতে খরচ ফেটে যায়। তাছাড়া কোনো বদল বা deploy-এর জায়গাই থাকে না, কারণ প্রতিটা বদলেই ঝুঁকি আছে।'

  - slug: error-budget
    title: 'Error budget: ঝুঁকি কতটুকু নেওয়া যায়'
    kind: howto
    tldr: 'SLO যতটুকু ব্যর্থতা মেনে নেয়, সেটাই budget; budget থাকলে দ্রুত feature, ফুরিয়ে এলে স্থিতিশীলতা — তর্ক নয়, সংখ্যাই সিদ্ধান্ত নেয়।'
