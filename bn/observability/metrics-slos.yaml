      - type: code
        lang: text
        file: 'PromQL: burn rate alert (৩০ দিনের ৯৯.৯% SLO)'
        variant: good
        code: |
          # SLI: যে checkout request ৫xx-এ ব্যর্থ হয়নি
          # গত ১ ঘণ্টায় ব্যর্থতার হার budget-এর চেয়ে ১৪.৪ গুণ দ্রুত খরচ হচ্ছে?
          (
            sum(rate(shop_http_requests_total{route="checkout",status=~"5.."}[1h]))
            / sum(rate(shop_http_requests_total{route="checkout"}[1h]))
          ) > (14.4 * 0.001)
        marks:
