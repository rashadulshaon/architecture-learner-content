      - type: quote
        body: 'Budget থাকলে ঝুঁকি নিন, ফুরোলে স্থিতি; সিদ্ধান্ত নেয় সংখ্যা, মেজাজ নয়।'
    aside:
      - type: problem
        body: 'ডেভেলপাররা বলে "আরও ফিচার চাই", অপারেশন বলে "আরও স্থিতি চাই", আর তর্ক মতামতের লড়াই হয়ে যায়। Error budget দুই পক্ষের একটা সাধারণ সংখ্যা দেয়।'
      - type: tips
        items:
          - 'Budget কে খেল, তা দেখুন: একটা বড় outage, নাকি প্রতিদিনের ছোট ব্যর্থতা? ওষুধ আলাদা।'
          - 'Burn-rate alert দুই স্তরে: দ্রুত ক্ষয়ে (১৪.৪×, ১ ঘণ্টা) page, ধীরে ক্ষয়ে (৬×, ৬ ঘণ্টা) ticket।'
          - 'যথেষ্ট traffic লাগে: দিনে ১০০ request হলে একটা ব্যর্থতাই ১%, অনুপাত লাফালাফি করে আর SLO-র মানে থাকে না।'
      - type: refs
        items:
          - {to: 'observability/health-alerts', label: 'Alert কীভাবে সাজাবেন'}
    check:
      q: 'এই মাসের error budget ফুরিয়ে গেছে, কিন্তু ম্যানেজার একটা বড় ফিচার পাঠাতে চান। কী করা উচিত?'
      a: 'আগে থেকে লেখা নিয়ম মানা: নতুন ফিচার থামিয়ে স্থিতিশীলতার কাজ। ব্যতিক্রম করতে হলে সচেতনভাবে, সম্মতি নিয়ে, ঝুঁকি জেনে।'

flashcards:
  - q: 'গড় response time কেন যথেষ্ট নয়?'
    a: 'গড় কয়েকটা খুব ধীর request লুকিয়ে ফেলে। p90 আর p99 দেখলে ধীরতম ক্রেতাদের অভিজ্ঞতা বোঝা যায়।'
    more: |
      ১০০ জনের ৯৯ জন ১০০ms, একজন ৩ সেকেন্ড পেলে গড় প্রায় ১৩০ms: সুন্দর দেখায়। অথচ ওই একজন হয়তো সবচেয়ে বড় cart-এর ক্রেতা। তাই latency সবসময় percentile দিয়ে মাপুন।
    ref: average-lies
  - q: 'p99 latency মানে কী?'
    a: 'প্রতি ১০০ জনের ৯৯ জন যে সময়ের মধ্যে উত্তর পেয়েছে। বাকি ১ জন এর চেয়ে বেশি অপেক্ষা করেছে।'
    more: |
      p50 হলো মাঝের ক্রেতার অভিজ্ঞতা, p99 হলো প্রায় ধীরতম ক্রেতার। বড় সিস্টেমে একজন ব্যবহারকারীর একটা পাতায় অনেক request থাকে, তাই p99 সেই ব্যবহারকারীর কাছে প্রায়ই স্বাভাবিক অভিজ্ঞতা।
    ref: average-lies
  - q: 'Counter, gauge আর histogram-এর পার্থক্য কী?'
    a: 'Counter শুধু বাড়ে, gauge ওঠানামা করে, আর histogram মান বালতিতে (bucket) গুনে percentile বের করতে দেয়।'
    more: |
      Counter: মোট request। Gauge: এখন queue-তে কত message। Histogram: request কত সময়ে শেষ হলো, বালতিতে ভাগ করে। Counter-এর মান সরাসরি না দেখে `rate()` দিয়ে "প্রতি সেকেন্ডে কত" দেখা হয়।
    ref: three-metric-types
  - q: 'Metric label-এ user_id দিলে কী সমস্যা?'
    a: 'Cardinality বিস্ফোরণ: প্রতিটা ইউজার আলাদা time series, তাই মেমোরি ও খরচ ফেটে যায়।'
    more: |
      Label-এর প্রতিটা আলাদা মান-সমাবেশ একটা আলাদা time series। route (কয়েক ডজন) চলে, user_id (লাখ লাখ) চলে না। আলাদা ব্যবহারকারীর খোঁজ log বা trace-এর কাজ, metric-এর নয়।
    ref: three-metric-types
  - q: 'PHP-FPM অ্যাপ Prometheus metric কেন সাধারণ memory-তে রাখতে পারে না?'
    a: 'প্রতিটা request ক্ষণস্থায়ী process, তাই memory-র counter প্রতিবার শূন্য থেকে শুরু হয়। Redis বা APCu-তে রাখতে হয়।'
    more: |
      Redis-এ সব সার্ভারের একটাই সংখ্যা মেলে, দাম হলো প্রতি write-এ একটা network call। APCu দ্রুত, কিন্তু প্রতি সার্ভার শুধু নিজের সংখ্যা রাখে। দুই ক্ষেত্রেই Prometheus প্রতিটা সার্ভার scrape করে।
    ref: instrument-symfony
  - q: 'RED আর USE কী?'
    a: 'RED সেবার জন্য: Rate, Errors, Duration। USE যন্ত্রের জন্য: Utilization, Saturation, Errors।'
    more: |
      RED ব্যবহারকারীর অভিজ্ঞতা মাপে: কত request, কতটা ব্যর্থ, কত ধীর। USE সম্পদের স্বাস্থ্য মাপে: CPU কত ব্যস্ত, queue কত লম্বা, কতবার ব্যর্থ। RED বলে কী ভাঙছে, USE বলে কেন।
    ref: red-and-use
  - q: 'Saturation মানে কী, আর কেন গুরুত্বপূর্ণ?'
    a: 'যন্ত্রের সামর্থ্যের বেশি কাজ লাইনে জমা। এটা দেরির আগাম ইঙ্গিত দেয়।'
    more: |
      CPU ৪০% ব্যস্ত দেখালেও queue-তে ১০ হাজার message জমে থাকতে পারে, কারণ worker কম। জমা কাজই (saturation) পরে ব্যবহারকারীর দেরি হয়ে ফেরে। তাই queue-র গভীরতা আর connection pool-এর অপেক্ষা সবসময় মাপুন।
    ref: red-and-use
  - q: 'SLI, SLO আর SLA-র পার্থক্য কী?'
    a: 'SLI: মাপা অনুপাত। SLO: তার লক্ষ্য। SLA: ক্রেতার সাথে চুক্তি, ভাঙলে জরিমানা।'
    more: |
      SLI যেমন "৫০০ms-এর মধ্যে সফল checkout ÷ মোট checkout"। SLO যেমন "৩০ দিনে ৯৯.৯%"। SLA সাধারণত SLO-র চেয়ে আলগা, যাতে নিজেদের লক্ষ্য ভাঙার আগেই সতর্ক হওয়া যায়।
    ref: sli-slo
  - q: '৩০ দিনে ৯৯.৯% SLO-তে error budget কত?'
    a: 'প্রায় ৪৩ মিনিটের ব্যর্থতা, বা প্রতি ১০ লাখ request-এ ১,০০০টা ব্যর্থ request।'
    more: |
      হিসাব: ৩০ দিন = ৪৩,২০০ মিনিট। ০.১% = ৪৩.২ মিনিট। ৯৯.৯৯% হলে মাত্র ৪ মিনিটের মতো। প্রতিটা ৯ বাড়ানোর খরচ বহুগুণ, তাই সব সেবায় একই উঁচু SLO দেওয়া অপচয়।
    ref: sli-slo
  - q: '৯৯.৯% SLO-তে burn rate ১৪.৪ মানে কী?'
    a: 'ব্যর্থতা SLO-র অনুমতির চেয়ে ১৪.৪ গুণ দ্রুত আসছে। এই গতিতে ৩০ দিনের budget প্রায় ২ দিনে শেষ।'
    more: |
      ১৪.৪× হারে ১ ঘণ্টায় ৩০ দিনের budget-এর ২% যায় (১৪.৪ ÷ ৭২০ ঘণ্টা)। কাউকে page করার মতো দ্রুত। ধীর ক্ষয়, যেমন ৬ ঘণ্টায় ৬×, শুধু ticket চায়। দুই স্তর থাকলে page শুধু আসল জরুরি অবস্থার জন্য থাকে।
    ref: error-budget
  - q: 'Error budget কীভাবে সিদ্ধান্ত নিতে সাহায্য করে?'
    a: 'Budget বাকি থাকলে দ্রুত ফিচার; ফুরিয়ে এলে ফিচার থামিয়ে স্থিতিশীলতার কাজ। নিয়ম আগে থেকে লেখা থাকে।'
    more: |
      ফিচার বনাম স্থিতি তর্ক মতের লড়াই হয়ে যায়। Budget দুই পক্ষকে একটা সাধারণ সংখ্যা দেয়। আগে থেকে সম্মতিতে লেখা নিয়ম থাকলে সংকটের সময় তর্ক ছাড়াই সিদ্ধান্ত হয়।
    ref: error-budget

quiz:
  - q: 'মিরাজের ড্যাশবোর্ডে গড় latency ১০০ms, সবুজ। তবু কিছু ক্রেতা বলছে checkout "আটকে যায়"। কোন মাপটা প্রথম দেখবেন?'
