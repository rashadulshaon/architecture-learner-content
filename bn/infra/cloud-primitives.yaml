slides:
  - slug: open-door-database
    title: 'ডেটাবেসের দরজা সারা দুনিয়ার জন্য খোলা'
    kind: story
    tldr: 'ক্লাউডে এক ক্লিকে সার্ভার মেলে — আর এক লাইনের ভুলে ডেটাবেস ইন্টারনেটের সামনে খোলা পড়ে থাকে।'
    keywords: ['cloud', 'security group', 'public database', 'ক্লাউড', 'খোলা পোর্ট', '0.0.0.0/0']
    blocks:
      - type: text
        body: |
          রাকিব তাড়াহুড়োয় ক্লাউডে ডেটাবেস বানাল। কানেক্ট হচ্ছিল না, তাই সে নিয়ম দিল "সবার জন্য খোলা" — আর কাজ চলল, রাকিব ঘুমাতে গেল। দুই দিন পরে দেখা গেল, অচেনা কেউ টেবিল মুছে ৫ লাখ টাকার ransom চাইছে।
      - type: code
        lang: text
        file: 'network.tf (HCL)'
        variant: bad
        code: |
          resource "aws_security_group_rule" "db_open" {
            type              = "ingress"
            from_port         = 3306
            to_port           = 3306
            protocol          = "tcp"
            cidr_blocks       = ["0.0.0.0/0"]
            security_group_id = aws_security_group.db.id
          }
        marks:
          - {line: 3, tip: '3306 হলো MySQL-এর দরজা। এই দরজা দিয়ে ঢোকার কথা শুধু অ্যাপ সার্ভারের।'}
          - {line: 6, tip: '0.0.0.0/0 মানে পুরো ইন্টারনেটের যে কোনো ঠিকানা। দুনিয়ার সবাই এখানে কড়া নাড়তে পারে।'}
      - type: quote
        body: 'ডেটাবেস কখনো ইন্টারনেট থেকে সরাসরি ধরা যাবে না।'
    aside:
      - type: problem
        body: 'ক্লাউড তোমাকে হার্ডওয়্যার কেনার ঝামেলা থেকে বাঁচায়, কিন্তু কে কোথায় ঢুকতে পারবে — সেই নিয়ম বানানোর দায় তোমারই। এই segment সেই নিয়মগুলোর মূল ইটগুলো চেনায়।'
      - type: story
        title: 'খোলা ডেটাবেসের পরিণতি'
        body: |
          সারা দুনিয়ায় স্ক্যানার বট প্রতি মিনিটে ইন্টারনেটের সব ঠিকানায় খোলা পোর্ট খুঁজে বেড়ায়। নতুন বানানো খোলা ডেটাবেস সাধারণত কয়েক ঘণ্টার মধ্যেই বটের চোখে পড়ে।
    check:
      q: 'কানেক্ট হচ্ছিল না বলে 0.0.0.0/0 দিয়ে দেওয়া কেন বিপজ্জনক?'
      a: 'কারণ ওটা পুরো ইন্টারনেটের জন্য দরজা খুলে দেয়। সঠিক নিয়ম হলো শুধু অ্যাপ সার্ভারের security group-কে ওই পোর্টে ঢুকতে দেওয়া।'

  - slug: vpc-subnets-sg
    title: 'VPC, subnet আর security group'
    kind: concept
    tldr: 'VPC তোমার নিজস্ব বন্ধ নেটওয়ার্ক; public subnet-এ থাকে শুধু দরজা (load balancer), private subnet-এ অ্যাপ আর ডেটাবেস।'
    keywords: ['VPC', 'subnet', 'security group', 'private subnet', 'networking', 'নেটওয়ার্ক']
    blocks:
      - type: metaphor
        icon: building
        title: 'ভাড়া নেওয়া ফ্লোরের ঘরগুলো'
        body: |
          ক্লাউড একটা বিশাল ভবন; তুমি তার একটা ফ্লোর ভাড়া নিয়েছ — সেটাই **VPC** (Virtual Private Cloud, তোমার নিজের বন্ধ নেটওয়ার্ক)। ফ্লোরের সামনের বৈঠকখানা **public subnet**, ভেতরের সিন্দুক-ঘর **private subnet**। প্রতিটা ঘরের দরজায় দারোয়ান বসে — সেই **security group**, যার খাতায় লেখা কাকে ঢুকতে দেবে।
      - type: visual
        kind: flow
        caption: 'ইন্টারনেটের ঢোকার একটাই পথ — load balancer; তার পরে ধাপে ধাপে ভেতরে'
        nodes:
          - {id: user, label: 'ব্যবহারকারী', sub: 'ইন্টারনেট', icon: user, col: 0, row: 1, tip: 'বাইরের জগৎ। সে শুধু public subnet-এর দরজা পর্যন্ত পৌঁছাতে পারে।'}
          - {id: lb, label: 'Load balancer', sub: 'public subnet', icon: lb, tone: accent, col: 1.5, row: 1, tip: 'একমাত্র বৈঠকখানা। 443 পোর্টে সবার জন্য খোলা — আর কিছুই বাইরে থেকে দেখা যায় না।'}
          - {id: app, label: 'Symfony অ্যাপ', sub: 'private subnet', icon: server, col: 3, row: 1, tip: 'অ্যাপ সার্ভারের নিজস্ব public IP নেই। তার security group শুধু load balancer-এর কাছ থেকে request নেয়।'}
          - {id: db, label: 'ডেটাবেস', sub: 'private subnet', icon: db, col: 4, row: 2.5, tip: 'সিন্দুক-ঘর। তার দারোয়ানের খাতায় শুধু অ্যাপের security group-এর নাম লেখা।'}
        edges:
          - {from: user, to: lb, label: 'ব্যবহারকারী HTTPS-এ 443 পোর্টে load balancer-কে ডাকে'}
          - {from: lb, to: app, label: 'Load balancer request-টা private অ্যাপ সার্ভারে পাঠায়'}
          - {from: app, to: db, label: 'অ্যাপ 3306 পোর্টে ডেটাবেসে query করে', tone: good}
      - type: points
        title: 'দারোয়ানের খাতা (security group)'
        style: check
        items:
          - 'Load balancer: 443 সবার জন্য, আর কিছু নয়'
          - 'অ্যাপ: শুধু load balancer-এর group থেকে 8080'
          - 'ডেটাবেস: শুধু অ্যাপের group থেকে 3306'
      - type: quote
        body: 'IP নয়, group-এর নাম দিয়ে নিয়ম লেখো — অ্যাপ বাড়লেও নিয়ম বদলাতে হয় না।'
    aside:
      - type: terms
        items:
          - {term: 'Subnet', meaning: 'VPC-র ভেতরের একটা ছোট ঠিকানা-পরিসর, যা একটা availability zone-এ থাকে।'}
          - {term: 'NAT gateway', meaning: 'private subnet-এর সার্ভারকে বাইরে যেতে দেয় (যেমন update নামানো), কিন্তু বাইরের কাউকে ঢুকতে দেয় না।'}
          - {term: 'Availability zone', meaning: 'একই শহরের আলাদা ভবন, যার বিদ্যুৎ আলাদা। দুই zone-এ সার্ভার রাখলে এক ভবন গেলেও সাইট চলে।'}
      - type: tips
        items:
          - 'Subnet প্রতিটা availability zone-এ বানাও, যাতে এক zone গেলেও আরেকটা চলে।'
          - 'Security group "stateful": ঢোকা request-এর জবাব নিজে থেকেই বেরোতে পারে, আলাদা নিয়ম লাগে না।'
    check:
      q: 'ডেটাবেসের security group-এ কোন source লিখলে সবচেয়ে নিরাপদ, আর কেন?'
      a: 'অ্যাপের security group-এর নাম। তাহলে শুধু ওই group-এর সার্ভার ঢুকতে পারে, আর নতুন অ্যাপ সার্ভার যোগ হলেও নিয়ম নিজে থেকে খাটে।'

  - slug: iam-least-privilege
    title: 'IAM: কার হাতে কোন চাবি'
    kind: howto
    tldr: 'IAM বলে কে কোন resource-এ কোন কাজ করতে পারবে; অ্যাপকে role দাও, শুধু দরকারি action আর resource-এর অনুমতি দিয়ে।'
    keywords: ['IAM', 'role', 'policy', 'least privilege', 'access key', 'অনুমতি']
    blocks:
      - type: metaphor
        icon: key
        title: 'কার্ড-চাবি, মাস্টার-চাবি নয়'
        body: |
          ভবনের দারোয়ান প্রত্যেককে আলাদা কার্ড দেয়: পিয়ন শুধু অফিস-ঘর খুলতে পারে, হিসাবরক্ষক পারে হিসাবের আলমারি। **IAM** (Identity and Access Management) সেই কার্ড-ব্যবস্থা। মাস্টার-চাবি হারালে পুরো ফ্লোর যায়, তাই সেটা কাউকে দেওয়া হয় না।
      - type: code
        lang: json
        file: 'policy-bad.json'
        variant: bad
        code: |
          {
            "Effect": "Allow",
            "Action": "*",
            "Resource": "*"
          }
        marks:
          - {line: 3, tip: 'সব ধরনের কাজ: মুছা, নতুন সার্ভার বানানো, অন্যের অনুমতি বদলানো — সবই।'}
          - {line: 4, tip: 'সব resource-এ। একটা bug বা ফাঁস হওয়া key-তে পুরো অ্যাকাউন্ট হাতছাড়া।'}
      - type: code
        lang: json
        file: 'policy-good.json'
        variant: good
        code: |
          {
            "Effect": "Allow",
            "Action": ["s3:GetObject", "s3:PutObject"],
            "Resource": "arn:aws:s3:::shop-invoices-prod/invoices/*"
          }
        marks:
          - {line: 3, tip: 'শুধু পড়া আর লেখা। মুছার অনুমতি নেই — অ্যাপ ভুল করলেও invoice হারাবে না।'}
          - {line: 4, tip: 'একটা bucket-এর একটা ফোল্ডার। অন্য কোনো ডেটায় এই অ্যাপের হাত পৌঁছায় না।'}
      - type: quote
        body: 'যার যতটুকু দরকার, তাকে ততটুকুই অনুমতি দাও — এক ইঞ্চিও বেশি নয়।'
        by: 'Least privilege'
    aside:
      - type: pitfalls
        items:
          - 'Access key কোডে বা .env ফাইলে git-এ তুলো না — অ্যাপ সার্ভারে role জুড়ে দাও, key লাগবেই না।'
          - 'মানুষের জন্য আলাদা user, অ্যাপের জন্য role — দুটো এক করো না।'
          - 'Root অ্যাকাউন্টে MFA দাও, আর দৈনন্দিন কাজে root ব্যবহার করো না।'
      - type: terms
        items:
          - {term: 'Role', meaning: 'এমন পরিচয়, যা কোনো মানুষের নয় — অ্যাপ বা সার্ভিস সাময়িকভাবে নিজের গায়ে পরে নেয়।'}
          - {term: 'Policy', meaning: 'অনুমতির তালিকা: কোন action, কোন resource-এ, অনুমতি নাকি নিষেধ।'}
      - type: refs
        items:
          - {to: 'security/secrets-management', label: 'Secret রাখার সঠিক জায়গা'}
    check:
      q: 'অ্যাপের জন্য access key বানিয়ে .env-এ রাখার চেয়ে role দেওয়া ভালো কেন?'
      a: 'Role-এর অস্থায়ী চাবি নিজে থেকে বদলায় আর কোথাও লিখে রাখতে হয় না, তাই ফাঁস হওয়ার মতো কিছুই থাকে না। .env-এর key স্থায়ী, চুরি গেলে বিপদ থেকেই যায়।'

  - slug: compute-and-managed
    title: 'Compute-এর তিন রকম আর managed service'
    kind: compare
    tldr: 'VM, container আর serverless-এ তোমার দায় ধাপে ধাপে কমে; managed service (RDS, S3, SQS) আরও বেশি কাজ ক্লাউডকে দেয়।'
    keywords: ['compute', 'VM', 'EC2', 'serverless', 'managed service', 'RDS', 'ম্যানেজড সার্ভিস']
    blocks:
      - type: metaphor
        icon: home
        title: 'বাসা, হোটেলের রুম আর খাবারের ডেলিভারি'
        body: |
          নিজের বাসায় রান্না করলে চুলা, গ্যাস আর বাজার সবই তোমার (VM)। হোটেলের রুমে ঘর ও বিছানা তৈরি, তুমি শুধু নিজের জিনিস নিয়ে ঢোকো (container)। আর ডেলিভারি অর্ডার করলে শুধু যা খেলে তার দাম দাও (serverless)। **Managed service** হলো রান্না-করা খাবার — ডেটাবেস, queue, ফাইল রাখার কাজ ক্লাউডই চালায়।
      - type: visual
        kind: table
        caption: 'তিন রকম compute: কে কী সামলায়'
        headers: ['', 'VM (EC2)', 'Container', 'Serverless']
        rows:
          - cells: ['তুমি সামলাও', 'OS, runtime, কোড', 'শুধু image আর কোড', 'শুধু function-এর কোড']
            tip: 'ডানে গেলে তোমার দায় কমে, কিন্তু নিয়ন্ত্রণও কমে।'
          - cells: ['শুরু হতে সময়', 'মিনিট', 'সেকেন্ড', 'মিলিসেকেন্ড (cold start বাদে)']
            tip: 'Serverless-এ অনেকক্ষণ অলস থাকলে প্রথম call ধীর হয়, একে cold start বলে।'
          - cells: ['বিল ধরা হয়', 'চালু থাকার ঘণ্টায়', 'চালু থাকা node-এর ঘণ্টায়', 'কতবার চলল তার হিসাবে']
            tip: 'কম ব্যবহারে serverless সস্তা; সারাদিন একটানা চললে VM বা container সস্তা।'
          - cells: ['কখন ভালো', 'পুরনো অ্যাপ, বিশেষ দরকার', 'সাধারণ Symfony API', 'হঠাৎ-আসা ছোট কাজ']
            tip: 'বেশিরভাগ নতুন Symfony অ্যাপের জন্য container-ই ডিফল্ট বাছাই।'
      - type: points
        title: 'Managed service কখন নেবে'
        style: check
        items:
          - 'ডেটাবেস, cache, queue, ফাইল — এগুলো নিজে চালিয়ে লাভ নেই'
          - 'Backup, patch, failover তারা করে — তুমি শুধু চালু ও পরীক্ষা করো'
          - 'দাম একটু বেশি, কিন্তু রাত ৩টায় তোমাকে জাগতে হয় না'
    aside:
      - type: when
        use: ['যেটা তোমার ব্যবসার বিশেষত্ব নয়, সেটা managed নাও', 'ছোট টিমে অপারেশনের লোক কম থাকলে']
        avoid: ['খুব বিশেষ কনফিগারেশন লাগলে, যা managed service দেয় না']
      - type: terms
        items:
          - {term: 'RDS', meaning: 'AWS-এর managed রিলেশনাল ডেটাবেস। Backup আর failover তারাই চালায়।'}
          - {term: 'S3', meaning: 'ফাইল রাখার managed ঘর (object storage), প্রায় অসীম জায়গা।'}
          - {term: 'SQS', meaning: 'managed queue; message জমা রাখে, তুমি worker চালাও।'}
    check:
      q: 'রাতে খুব কম ব্যবহার হয়, কিন্তু মাঝে মাঝে হঠাৎ ছবি resize করতে হয়। কোন compute মানানসই?'
      a: 'Serverless। অলস সময়ে বিল শূন্য, আর কাজ এলে চলে — সারাদিন VM চালু রেখে ঘণ্টা-বিল দেওয়ার দরকার নেই।'

  - slug: shared-responsibility
    title: 'Shared responsibility: কোন দায় কার?'
    kind: pitfall
    tldr: 'ক্লাউড ভবন আর যন্ত্র সামলায়; তোমার ডেটা, অ্যাক্সেস আর কনফিগারেশনের দায় সবসময় তোমার — managed হলেও।'
    keywords: ['shared responsibility', 'cloud security', 'দায়িত্ব', 'backup', 'ক্লাউড নিরাপত্তা']
    blocks:
      - type: text
        body: |
          ফ্লোর ভাড়া নিলেও ভবন মালিক তোমার ঘরের দরজায় তালা লাগাবে না — সেটা তোমার কাজ। ক্লাউডও তাই: **ক্লাউডের দায় "of the cloud"** (ভবন, বিদ্যুৎ, হার্ডওয়্যার), আর **তোমার দায় "in the cloud"** (ডেটা, অ্যাক্সেস, কনফিগারেশন)। সার্ভিস যত managed, দায়ের ভাগ তত ক্লাউডের দিকে সরে — কিন্তু শূন্য হয় না।
      - type: visual
        kind: table
        caption: 'কোন কাজ কার — তিন রকম সেটআপে'
        headers: ['', 'VM-এ নিজের DB', 'Managed DB', 'Serverless']
        rows:
          - cells: ['ভবন, বিদ্যুৎ, হার্ডওয়্যার', 'ক্লাউড', 'ক্লাউড', 'ক্লাউড']
            tip: 'এই স্তর কোনো ক্ষেত্রেই তোমার নয়।'
          - cells: ['OS ও DB-র patch', 'তুমি', 'ক্লাউড', 'ক্লাউড']
            tip: 'VM-এ patch ভুলে যাওয়াই পুরনো সার্ভার হ্যাক হওয়ার বড় কারণ।'
          - cells: ['Backup চালু ও restore পরীক্ষা', 'তুমি', 'তুমি', 'তুমি']
            tip: 'Managed হলেও retention ঠিক করা আর restore চালিয়ে দেখা তোমার কাজ।'
          - cells: ['Network নিয়ম, IAM', 'তুমি', 'তুমি', 'তুমি']
            tip: 'খোলা security group বা বেশি অনুমতির দোষ ক্লাউডকে দেওয়া যায় না।'
          - cells: ['ডেটা ও কোডের নিরাপত্তা', 'তুমি', 'তুমি', 'তুমি']
            tip: 'SQL injection বা ফাঁস হওয়া password তোমার কোডের দোষ।'
      - type: quote
        body: 'Managed মানে "আমার দায় নেই" নয়; মানে "কম দায়"।'
    aside:
      - type: story
        title: 'Managed DB, তবু ডেটা গেল'
        body: |
          এক টিম managed ডেটাবেস নিয়ে নিশ্চিন্ত ছিল, backup retention রেখেছিল মাত্র ১ দিন। ভুল migration চালানোর তিন দিন পরে সেটা ধরা পড়ল — তখন পুরনো কোনো backup আর নেই।
      - type: pitfalls
        items:
          - '"ক্লাউড নিজেই backup রাখে" ভেবে restore কখনো পরীক্ষা না করা।'
          - 'Managed সার্ভিসে default পাসওয়ার্ড বা public access চালু রেখে দেওয়া।'
      - type: refs
        items:
          - {to: 'recovery/backups-restore', label: 'Backup আর restore পরীক্ষা'}
    check:
      q: 'Managed ডেটাবেসে কোন দুটো কাজ তবুও তোমারই থাকে?'
      a: 'Backup retention ঠিক করে restore পরীক্ষা করা, আর network ও IAM নিয়ম ঠিক রাখা। Patch আর failover ক্লাউড সামলায়।'

flashcards:
  - q: 'ক্লাউডে VPC বলতে কী বোঝায়?'
    a: 'ক্লাউডে তোমার নিজস্ব বন্ধ, বিচ্ছিন্ন নেটওয়ার্ক। এর ভেতরে তুমি subnet আর নিয়ম বানাও।'
    more: |
      ভবনের একটা ফ্লোর ভাড়া নেওয়ার মতো: ফ্লোরটা তোমার, অন্য ভাড়াটেরা ঢুকতে পারে না। VPC-র ভেতরেই সার্ভার, ডেটাবেস আর load balancer বসে।
    ref: vpc-subnets-sg
  - q: 'Public আর private subnet-এর পার্থক্য কী?'
    a: 'Public subnet-এর সার্ভার ইন্টারনেট থেকে সরাসরি পৌঁছানো যায়। Private subnet-এ বাইরে থেকে সরাসরি পথ নেই।'
    more: |
      সাধারণ নিয়ম: load balancer থাকে public subnet-এ, অ্যাপ আর ডেটাবেস private subnet-এ। Private সার্ভারকে বাইরে যেতে হলে NAT gateway লাগে।
    ref: vpc-subnets-sg
  - q: 'Security group কী কাজ করে?'
    a: 'এটা সার্ভারের দরজার দারোয়ান: কোন source কোন পোর্টে ঢুকতে পারবে, তার তালিকা রাখে।'
    more: |
      Security group stateful — ঢোকা request-এর জবাব নিজে থেকেই বেরোতে পারে। নিয়মে IP-র বদলে অন্য security group-এর নাম দেওয়া যায়, যা নিরাপদ আর সহজ।
    ref: vpc-subnets-sg
  - q: 'ডেটাবেসের security group-এ 0.0.0.0/0 দিলে কী হয়?'
    a: 'পুরো ইন্টারনেট ডেটাবেসের পোর্টে কড়া নাড়তে পারে। বট কয়েক ঘণ্টায় খুঁজে পায় আর পাসওয়ার্ড আন্দাজ শুরু করে।'
    more: |
      সঠিক উপায়: ডেটাবেসকে private subnet-এ রাখা আর security group-এ শুধু অ্যাপের group-কে অনুমতি দেওয়া। নিজে কানেক্ট করতে হলে VPN বা bastion host ব্যবহার করো।
    ref: open-door-database
  - q: 'Least privilege নীতি কী?'
    a: 'প্রতিটা ব্যবহারকারী বা অ্যাপকে শুধু ততটুকু অনুমতি দাও, যতটুকু তার কাজের জন্য সত্যিই দরকার।'
    more: |
      Action আর resource দুটোই সীমিত করো: "s3:*" আর "*" না লিখে নির্দিষ্ট action আর নির্দিষ্ট bucket-পথ লেখো। তাতে একটা key ফাঁস হলে বা bug থাকলেও ক্ষতি ছোট থাকে।
    ref: iam-least-privilege
  - q: 'অ্যাপের জন্য IAM role, না access key — কোনটা ভালো?'
    a: 'Role। এর অস্থায়ী চাবি নিজে থেকে বদলায় আর কোডে বা ফাইলে রাখতে হয় না।'
    more: |
      Access key স্থায়ী secret; git-এ বা log-এ গেলেই বিপদ। অ্যাপ সার্ভার বা container-এ role জুড়ে দিলে SDK নিজেই অস্থায়ী credential তুলে নেয়।
    ref: iam-least-privilege
  - q: 'VM, container আর serverless-এর মূল পার্থক্য কী?'
    a: 'ক্রমে তোমার দায় কমে: VM-এ OS পর্যন্ত, container-এ শুধু image আর কোড, serverless-এ শুধু function-এর কোড।'
    more: |
      দায় কমলে নিয়ন্ত্রণও কমে। বিলও আলাদা: VM চালু থাকার ঘণ্টায়, serverless শুধু চলার হিসাবে। বেশিরভাগ Symfony API-র জন্য container ভালো মাঝামাঝি।
    ref: compute-and-managed
  - q: 'Shared responsibility model-এ কোন দায় ক্লাউডের, কোনটা তোমার?'
    a: 'ক্লাউডের: ভবন, হার্ডওয়্যার, হাইপারভাইজার। তোমার: ডেটা, IAM, network নিয়ম আর backup পরীক্ষা।'
    more: |
      সার্ভিস যত managed, ক্লাউড তত বেশি স্তর সামলায় (OS patch, DB patch)। কিন্তু ডেটা আর অ্যাক্সেসের দায় কোনো অবস্থাতেই ক্লাউডের হয় না।
    ref: shared-responsibility

quiz:
  - q: 'নতুন প্রজেক্টে তিনটা সার্ভার: load balancer, Symfony অ্যাপ, ডেটাবেস। কোনটা public subnet-এ রাখা উচিত?'
    hint: 'ইন্টারনেট থেকে কার সরাসরি পৌঁছানো দরকার, আর কার নয়?'
    options:
      - text: 'তিনটাই, যাতে কানেক্ট করা সহজ হয়'
        correct: false
        why: 'ডেটাবেস আর অ্যাপ public হলে আক্রমণের পথ বেড়ে যায়; সুবিধার জন্য নিরাপত্তা ছাড়া যায় না।'
      - text: 'শুধু load balancer; অ্যাপ আর ডেটাবেস private-এ'
        correct: true
        why: 'ইন্টারনেটের সামনে শুধু দরজাটাই থাকে, ভেতরের সব কিছু লুকানো — এটাই স্বীকৃত নকশা।'
      - text: 'load balancer আর অ্যাপ; ডেটাবেস private-এ'
        correct: false
        why: 'অ্যাপকে সরাসরি public করার দরকার নেই; load balancer-ই request পৌঁছে দিতে পারে।'
    ref: vpc-subnets-sg
  - q: 'রাকিবের ডেটাবেসে অ্যাপ কানেক্ট হচ্ছে না। সবচেয়ে নিরাপদ সমাধান কোনটা?'
    hint: 'দরজা সবার জন্য না খুলে কার জন্য খুলবে?'
    options:
      - text: 'security group-এ 3306-র source 0.0.0.0/0 করে দেওয়া'
        correct: false
        why: 'কানেক্ট হবে ঠিকই, কিন্তু পুরো ইন্টারনেটের জন্য। এটাই ransom-এর পথ।'
      - text: 'ডেটাবেস security group-এ source হিসেবে অ্যাপের security group দেওয়া'
        correct: true
        why: 'শুধু ওই group-এর সার্ভার ঢুকতে পারে, আর অ্যাপ সার্ভার বাড়লেও নিয়ম বদলাতে হয় না।'
      - text: 'সব নিরাপত্তা নিয়ম মুছে ফেলা'
        correct: false
        why: 'ডিফল্ট-ডিনাই ছাড়া কোনো সুরক্ষাই থাকে না। নিয়ম কমানো নয়, সঠিক করাই কাজ।'
    ref: open-door-database
  - q: 'নিচের policy নিয়ে কোন কথাগুলো ঠিক?'
    lang: json
    code: |
      {
        "Effect": "Allow",
        "Action": "s3:*",
        "Resource": "*"
      }
    hint: 'অ্যাপের কাজ শুধু invoice ফোল্ডারে PDF লেখা।'
    options:
      - text: 'অ্যাপ যে কোনো bucket-এর ফাইল মুছতে পারবে'
        correct: true
        why: 'Resource "*" আর Action "s3:*" মানে সব bucket-এ সব কাজ, delete-সহ।'
      - text: 'এটা least privilege মেনে লেখা'
        correct: false
        why: 'উল্টো। দরকার শুধু একটা bucket-পথে PutObject; এতটা অনুমতি অপ্রয়োজনীয়।'
      - text: 'Resource-এ নির্দিষ্ট bucket-পথ আর Action-এ শুধু দরকারি দুই-একটা লিখে ঠিক করা উচিত'
        correct: true
        why: 'এভাবে bug বা key ফাঁস হলেও ক্ষতি ওই এক ফোল্ডারে আটকে থাকে।'
    ref: iam-least-privilege
  - q: 'সুমি অ্যাপ সার্ভারে S3 ব্যবহারের জন্য একটা IAM user-এর access key .env-এ বসিয়েছে। কোনটা ভালো বিকল্প?'
    hint: 'যে চাবি কোথাও লিখে রাখতেই হয় না, সেটা কেউ চুরিও করতে পারে না।'
    options:
      - text: 'key-টা কোডে hard-code করা, যাতে .env লাগে না'
        correct: false
        why: 'আরও খারাপ: git history-তে চিরকাল থেকে যাবে।'
      - text: 'সার্ভারে IAM role জুড়ে দেওয়া; SDK নিজে অস্থায়ী credential নেবে'
        correct: true
        why: 'কোথাও secret লেখা নেই, আর চাবি নিজে থেকে বদলায়। চুরির সুযোগ প্রায় নেই।'
      - text: 'Key-র নাম বদলে রাখা'
        correct: false
        why: 'নাম বদলালে key-র ক্ষমতা বদলায় না; চুরি গেলে একই বিপদ।'
    ref: iam-least-privilege
  - q: 'দিনে একবার, ১০ মিনিটের একটা রিপোর্ট বানাতে হবে। বাকি সময় কিছু চলে না। কোন compute-এ খরচ সবচেয়ে কম হতে পারে?'
    hint: 'বিল কীসের ভিত্তিতে হয় — চালু থাকা, না চলা?'
    options:
      - text: 'সারাদিন চালু একটা বড় VM'
        correct: false
        why: '২৩ ঘণ্টা ৫০ মিনিট বসে থাকা সার্ভারের বিলও দিতে হবে।'
      - text: 'Serverless function বা scheduled container job'
        correct: true
        why: 'যতক্ষণ কাজ চলে, ততক্ষণেরই বিল — অলস সময়ে খরচ প্রায় শূন্য।'
      - text: 'তিনটা সবসময়-চালু container'
        correct: false
        why: 'কাজ নেই, তবু বিল চলতে থাকবে।'
    ref: compute-and-managed
  - q: 'Managed ডেটাবেস নিলে নিচের কোন কাজগুলো তখনও তোমার দায়?'
    hint: 'ডেটা আর অ্যাক্সেস — এ দুটোর মালিক কে?'
    options:
      - text: 'Restore পরীক্ষা করা আর backup retention ঠিক করা'
        correct: true
        why: 'Backup নেওয়া ক্লাউড করে, কিন্তু সেটা কাজ করে কি না আর কত দিন থাকবে — সেটা তোমার সিদ্ধান্ত ও দায়।'
