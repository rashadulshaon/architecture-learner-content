  - q: 'একটা managed ডেটাবেসে ১ দিনের backup রাখা ছিল, আর ভুল migration ধরা পড়ল তিন দিন পরে। কী ঠিক করা থাকা উচিত ছিল?'
    hint: 'ভুল ধরতে আপনার কত সময় লাগতে পারে?'
