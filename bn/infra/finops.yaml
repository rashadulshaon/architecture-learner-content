    ref: save-without-risk
  - q: 'Private অ্যাপ সার্ভার মাসে ১৫ TB S3-র ডেটা পড়ে NAT gateway দিয়ে, প্রতি GB-তে প্রায় ৫ সেন্ট। সবচেয়ে সস্তা সমাধান কোনটা?'
