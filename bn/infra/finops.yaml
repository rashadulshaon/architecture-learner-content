slides:
  - slug: surprise-bill
    title: 'মাস শেষে ২,১৪০ ডলারের বিল'
    kind: story
    tldr: 'ক্লাউডে খরচ অদৃশ্যভাবে জমে; হিসাব না রাখলে মাস শেষে বিলই প্রথম জানায় কিছু ভুল হয়েছে।'
    keywords: ['FinOps', 'cloud bill', 'cost', 'বিল', 'খরচ', 'NAT gateway']
    blocks:
      - type: text
        body: |
          প্রতি মাসে বিল আসে প্রায় ৮২০ ডলার। এই মাসে এল ২,১৪০ ডলার। কেউ নতুন কিছু বানায়নি, তবু বিল আড়াই গুণেরও বেশি। কারণ খুঁজতে দুই দিন গেল: একটা সার্ভিস ছবি আনছিল NAT gateway দিয়ে, আর এক ডেভেলপার debug level-এর log চালু রেখে গিয়েছিল।
      - type: visual
        kind: bars
        caption: 'এই মাসের ২,১৪০ ডলারের বিল — কোথায় কত গেল'
        items:
          - {label: 'Network (NAT)', value: 900, display: '$900', tone: bad, tip: 'স্বাভাবিক ছিল $120। একটা সার্ভিস S3 থেকে ছবি টানছিল NAT gateway দিয়ে, প্রতি GB-র বাড়তি দামে।'}
          - {label: 'Logs', value: 650, display: '$650', tone: bad, tip: 'স্বাভাবিক ছিল $110। debug log চালু থাকায় প্রতিদিন কয়েকগুণ বেশি লাইন জমা হয়েছে।'}
          - {label: 'ডেটাবেস', value: 260, display: '$260', tip: 'স্বাভাবিক। multi-AZ ডেটাবেসের নির্ধারিত মাসিক দাম।'}
          - {label: 'Compute', value: 210, display: '$210', tip: 'স্বাভাবিক। তিনটা অ্যাপ node।'}
          - {label: 'বাকি সব', value: 120, display: '$120', tip: 'Cache, load balancer আর storage মিলিয়ে।'}
      - type: quote
        body: 'যে খরচের মালিক নেই, তা প্রতিদিন চুপচাপ বাড়ে।'
    aside:
      - type: problem
        body: 'ক্লাউডে "যত ব্যবহার, তত বিল"। তাই কোডের একটা ভুল সিদ্ধান্ত — বাড়তি call, বাড়তি log — সরাসরি টাকার অঙ্ক বদলে দেয়। FinOps হলো খরচকে ইঞ্জিনিয়ারিংয়ের আলোচনার অংশ বানানো।'
      - type: terms
        items:
          - {term: 'FinOps', meaning: 'Financial Operations: ইঞ্জিনিয়ার, ফাইন্যান্স আর ব্যবসা মিলে ক্লাউড খরচ বোঝা ও নিয়ন্ত্রণ করার চর্চা।'}
          - {term: 'NAT gateway', meaning: 'এমন দরজা, যা দিয়ে private সার্ভার ইন্টারনেটে যেতে পারে। ঘণ্টা-হারে বিল হয়, আর এর ভেতর দিয়ে যাওয়া প্রতি GB-র জন্য আলাদা বিল।'}
    check:
      q: 'কোডে কোনো নতুন feature না এলেও ক্লাউডের বিল বাড়তে পারে কেন?'
      a: 'কারণ ক্লাউডে খরচ ব্যবহারের সাথে বাড়ে — বাড়তি data transfer, debug log বা ভুলে চালু রাখা resource-ও টাকা খরচ করে, কেউ কিছু বানায়নি তবুও।'

  - slug: cost-model
    title: 'খরচের মডেল: বিয়েবাড়ির বাজেট-ফর্দ'
    kind: concept
    tldr: 'মাসের খরচকে উপাদান ধরে ভাগ করুন, fixed আর variable আলাদা করুন — তাহলে বিল আসার আগেই অঙ্কটা অনুমান করা যায়।'
    keywords: ['cost model', 'fixed cost', 'variable cost', 'forecast', 'খরচের মডেল', 'বাজেট']
    blocks:
      - type: metaphor
        icon: receipt
        title: 'বিয়েবাড়ির বাজেট-ফর্দ'
        body: |
          বিয়ের আগে ফর্দ হয়: হল ভাড়া (অতিথি যত-ই হোক, একই) আর খাবার (মাথাপিছু)। অতিথি দ্বিগুণ হলে হল ভাড়া একই, খাবারের টাকা দ্বিগুণ। ক্লাউডেও তাই: কিছু খরচ **fixed**, কিছু **variable** — ব্যবহারের সাথে বাড়ে।
      - type: visual
        kind: table
        caption: 'Shop API-র মাসিক খরচ-মডেল (৩ লাখ অর্ডার, উদাহরণ সংখ্যা)'
        headers: ['উপাদান', 'ধরন', 'মাসে']
        rows:
          - cells: ['Compute (৩ node × $70)', 'fixed', '$210']
            tip: 'নোড চালু থাকলেই বিল — অর্ডার কম হলেও।'
          - cells: ['ডেটাবেস (multi-AZ)', 'fixed', '$260']
            tip: 'সবচেয়ে বড় একক খরচ। Instance-এর আকার বদলালে দামও বদলায়।'
          - cells: ['Cache + load balancer', 'fixed', '$75']
            tip: 'Redis $50 আর load balancer $25 — দুটোই ঘণ্টা-হিসাবে।'
          - cells: ['Storage (S3, backup)', 'variable', '$45']
            tip: 'ডেটা জমলে বাড়ে। পুরনো ফাইল সস্তা স্তরে সরালে কমে।'
          - cells: ['Network (NAT, transfer)', 'variable', '$120']
            tip: 'প্রতি GB-তে বিল। ট্রাফিকের সাথে সরাসরি বাড়ে।'
          - cells: ['Logs ও monitoring', 'variable', '$110']
            tip: 'কত GB log জমা হলো তার হিসাবে — লাইন বাড়লেই খরচ বাড়ে।'
          - cells: ['মোট', 'fixed $545 + variable $275', '$820']
            tip: '210 + 260 + 75 + 45 + 120 + 110 = 820।'
      - type: text
        body: |
          এই মডেল দিয়ে ভবিষ্যৎ অনুমান করা যায়: অর্ডার দ্বিগুণ হলে variable অংশ প্রায় দ্বিগুণ (২৭৫ থেকে প্রায় ৫৫০), fixed আপাতত একই — যতক্ষণ না একটা সীমা পেরিয়ে আরেকটা node বা বড় ডেটাবেস লাগে। মডেলটা সাধারণ স্প্রেডশিটেই বানানো যায়; জরুরি হলো সংখ্যার পেছনের কারণ জানা।
    aside:
      - type: tips
        items:
          - 'প্রতিটা সংখ্যার পাশে ধারণা লিখুন — "ডেটাবেস $260 কারণ মাঝারি multi-AZ।" তাহলে বদল হলে কেন হলো বোঝা যায়।'
          - 'প্রতি মাসে প্রকৃত বিলের সাথে মডেল মেলান; ফারাক পেলেই কিছু অজানা খরচ ধরা পড়ল।'
      - type: remember
        body: 'Fixed খরচ ব্যবহার ছাড়াই আসে; variable ব্যবহারের পিছু পিছু।'
    check:
      q: 'অর্ডার দ্বিগুণ হলে উপরের মডেলে কোন অংশ প্রায় দ্বিগুণ হবে, আর কোনটা আপাতত একই থাকবে?'
      a: 'Variable অংশ (storage, network, logs — প্রায় ২৭৫ থেকে ৫৫০) প্রায় দ্বিগুণ হবে। Fixed অংশ (compute, ডেটাবেস, cache) আপাতত একই থাকবে, যতক্ষণ না সীমা পেরোয়।'

  - slug: unit-economics
    title: 'Unit economics: অর্ডার-প্রতি খরচ'
    kind: concept
    tldr: 'মোট বিল নয়, প্রতি ১,০০০ অর্ডারে কত খরচ — এটাই বলে ব্যবসা সুস্থ বাড়ছে, নাকি শুধু খরচ বাড়ছে।'
    keywords: ['unit economics', 'cost per order', 'cost per user', 'ইউনিট খরচ', 'FinOps metric']
    blocks:
      - type: metaphor
        icon: users
        title: 'মাথাপিছু খরচ'
        body: |
          ক্যাটারিং-ম্যানেজার জানে মোট বিল কত, কিন্তু আসল প্রশ্ন "মাথাপিছু কত?"। ১০০ জনে ২০,০০০ টাকা আর ৫০০ জনে ৫০,০০০ টাকা — মোট বেড়েছে, কিন্তু মাথাপিছু কমেছে, তাই ব্যবসা ভালো। Cloud-এ মাথা হলো অর্ডার, ব্যবহারকারী বা request।
      - type: visual
        kind: bars
        caption: 'প্রতি ১,০০০ অর্ডারে ক্লাউড খরচ: মোট বিল বাড়লেও unit খরচ কমছে (এপ্রিলে ছাড়া)'
        items:
          - {label: 'জানু: ১ লাখ অর্ডার, $600', value: 6.0, display: '$6.00', tone: warn, tip: '600 ÷ 100 = $6.00 প্রতি ১,০০০ অর্ডারে। ছোট অবস্থায় fixed খরচ কম মানুষের ওপর ভাগ হয়, তাই বেশি।'}
          - {label: 'ফেব্রু: ২ লাখ, $700', value: 3.5, display: '$3.50', tone: good, tip: '700 ÷ 200 = $3.50। অর্ডার দ্বিগুণ, বিল মাত্র কিছুটা বেশি — স্বাস্থ্যকর বাড়।'}
          - {label: 'মার্চ: ৩ লাখ, $820', value: 2.73, display: '$2.73', tone: good, tip: '820 ÷ 300 ≈ $2.73। Fixed খরচ বেশি অর্ডারে ভাগ হচ্ছে।'}
          - {label: 'এপ্রিল: ৩.২ লাখ, $1,400', value: 4.38, display: '$4.38', tone: bad, tip: '1,400 ÷ 320 ≈ $4.38। অর্ডার সামান্য বেড়েছে, বিল লাফিয়েছে — কোথাও অপচয় ঢুকেছে।'}
      - type: code
        lang: sql
        file: 'reports/unit_cost.sql'
        code: |
          SELECT c.day,
                 SUM(c.cost_usd)                              AS cloud_cost,
                 o.orders,
                 ROUND(SUM(c.cost_usd) / o.orders * 1000, 2)  AS cost_per_1000_orders
          FROM cloud_cost_daily c
          JOIN orders_daily o ON o.day = c.day
          WHERE c.tag_service = 'shop-api'
          GROUP BY c.day, o.orders
          ORDER BY c.day;
        marks:
          - {line: 6, tip: 'বিলিং এক্সপোর্টের ডেটা (cloud_cost_daily) আর ব্যবসার ডেটা (orders_daily) একসাথে জুড়লেই unit খরচ মেলে।'}
          - {line: 7, tip: 'Tag দিয়ে filter — তাই সব resource-এ ঠিকঠাক tag থাকা জরুরি।'}
      - type: quote
        body: 'মোট বিল নয়, অর্ডার-প্রতি খরচ দেখুন।'
    aside:
      - type: tips
        items:
          - 'ব্যবসার সাথে মানানসই "unit" বেছে নিন: অর্ডার, সক্রিয় ব্যবহারকারী, GB প্রক্রিয়া, কিংবা পাঠানো ইমেইল।'
          - 'Unit খরচকে প্রতি অর্ডারের আয়ের সাথে তুলনা করুন — তাহলে ক্লাউড খরচ ব্যবসার কত অংশ খেয়ে নিচ্ছে বোঝা যায়।'
      - type: when
        use: ['ব্যবসা দ্রুত বাড়ার সময়, যখন মোট বিল ভয় দেখায়', 'নতুন feature-এর খরচ মাপতে']
        avoid: ['unit খরচ কমাতে গিয়ে নির্ভরযোগ্যতা বা নিরাপত্তায় কাটছাঁট করতে']
    check:
      q: 'মোট বিল ৭০০ থেকে ৮২০ হলো, অর্ডার ২ লাখ থেকে ৩ লাখ। বিল বাড়ার খবর কি খারাপ?'
      a: 'না। প্রতি ১,০০০ অর্ডারের খরচ $3.50 থেকে $2.73-এ নেমেছে — মোট খরচ বাড়লেও প্রতি অর্ডারে খরচ কমেছে, অর্থাৎ ব্যবসা সুস্থভাবে বাড়ছে।'

  - slug: tagging-budgets
    title: 'Tag আর budget: কার খরচ, কত সীমা'
    kind: howto
    tldr: 'প্রতিটা resource-এ team, service ও env tag বসান; Terraform-এ budget আর alert দিন, যাতে বিল ফাটার আগেই জানা যায়।'
    keywords: ['tagging', 'budget', 'cost allocation', 'Terraform', 'alert', 'ট্যাগ']
    blocks:
      - type: metaphor
        icon: tag
        title: 'প্রতিটা বাজারের থলেতে নাম'
        body: |
          বিয়েবাড়ির বাজারে প্রতিটা থলেতে লেখা থাকে: "রান্নাঘর", "সাজসজ্জা", "মিষ্টি"। শেষে বিল এলে বোঝা যায় কোন খাতে কত। **Tag** সেই নাম-লেখা, আর **budget** হলো আগে থেকে ঠিক করা সীমা — ছাড়ালে ঘণ্টা বাজে।
      - type: code
        lang: text
        file: 'infra/cost.tf (HCL)'
        variant: good
        code: |
          provider "aws" {
            region = "ap-southeast-1"
            default_tags {
              tags = {
                team    = "checkout"
                service = "shop-api"
                env     = "prod"
              }
            }
          }

          resource "aws_budgets_budget" "shop_prod" {
            name         = "shop-prod-monthly"
            budget_type  = "COST"
            limit_amount = "900"
            limit_unit   = "USD"
            time_unit    = "MONTHLY"

            cost_filter {
              name   = "TagKeyValue"
              values = ["user:service$shop-api"]
            }

            notification {
              comparison_operator        = "GREATER_THAN"
              threshold                  = 80
              threshold_type             = "PERCENTAGE"
              notification_type          = "FORECASTED"
              subscriber_email_addresses = ["checkout-team@example.com"]
            }
          }
        marks:
          - {line: 3, tip: 'default_tags: এই provider দিয়ে বানানো প্রতিটা resource নিজে থেকে এই tag পায়। কাউকে মনে রাখতে হয় না।'}
          - {line: 15, tip: 'মাসিক সীমা $900 — স্বাভাবিক বিল $820-এর একটু ওপরে, যাতে বাড়তি এলে ধরা পড়ে। নিচের tag-filter একে শুধু shop-api-তে সীমাবদ্ধ করে।'}
          - {line: 28, tip: 'FORECASTED: মাসের মাঝামাঝি পূর্বাভাস $720 ছাড়ালেই সতর্কতা; মাস শেষের অপেক্ষা নেই।'}
      - type: visual
        kind: steps
        caption: 'Tag থেকে সতর্কতা: খরচের নজরদারির ধারা'
        steps:
          - {title: '১. Tag বসান', body: 'team, service, env — IaC থেকে', tip: 'হাতে নয়; Terraform-এ বসালে কেউ ভোলে না।'}
          - {title: '২. Activate করুন', body: 'বিলিং কনসোলে cost allocation tag', tip: 'Tag বসানো থাকলেও বিলিং রিপোর্টে আসার জন্য এটা আলাদা করে চালু করতে হয়।'}
          - {title: '৩. Budget দিন', body: 'প্রতি সার্ভিস/টিমের মাসিক সীমা', tip: 'টিম-ভিত্তিক budget হলে বিল বাড়লে মালিক কে, তা স্পষ্ট।'}
          - {title: '৪. সপ্তাহে একবার দেখুন', body: 'unit খরচ আর শীর্ষ ৫ খাত', tip: 'মাস শেষে নয়; সপ্তাহে দেখলে অপচয় সপ্তাহেই ধরা পড়ে।'}
    aside:
      - type: pitfalls
        items:
          - 'Tag ছাড়া resource-এর "কার খরচ" প্রশ্নের উত্তর নেই — অমালিকানা খরচই সবচেয়ে বেশি বাড়ে।'
          - 'Alert শুধু ইমেইলে গেলে কেউ দেখে না; টিমের চ্যাট চ্যানেলে পাঠান।'
      - type: terms
        items:
          - {term: 'Cost allocation tag', meaning: 'যে tag দিয়ে বিলের টাকা টিম বা সার্ভিসে ভাগ করা যায়।'}
          - {term: 'Forecasted alert', meaning: 'এখনকার গতিতে চললে মাস শেষে কত হবে, তার ভিত্তিতে সতর্কতা।'}
    check:
      q: 'Budget alert "ACTUAL"-এর বদলে "FORECASTED" রাখলে কী সুবিধা?'
      a: 'মাসের মাঝেই জানা যায় এই গতিতে গেলে সীমা ছাড়াবে। ACTUAL সীমা ছোঁয়ার পরে জানায় — তখন টাকা খরচ হয়েই গেছে।'

  - slug: save-without-risk
    title: 'নির্ভরযোগ্যতা না কমিয়ে খরচ কমানো'
    kind: compare
    tldr: 'অপচয় কাটুন (অলস resource, বড় instance, বেশি log, বাড়তি NAT ট্রাফিক), কিন্তু নিরাপত্তা-জাল নয় (backup, multi-AZ, monitoring)।'
    keywords: ['cost optimization', 'right-sizing', 'autoscaling', 'savings plan', 'spot', 'খরচ কমানো', 'VPC endpoint', 'NAT gateway খরচ', 'log level']
    blocks:
      - type: text
        body: |
          খরচ কমানোর দুটো ধরন আছে: **অপচয় কাটা** আর **সুরক্ষা কাটা**। অপচয় হলো যা কেউ ব্যবহার করছে না। সুরক্ষা হলো যা আজ ব্যবহার হচ্ছে না, কিন্তু বিপদে প্রাণ বাঁচাবে — backup, দ্বিতীয় availability zone, monitoring। প্রথমটা সব সময় ভালো, দ্বিতীয়টা কখনোই সস্তা নয়। ২,১৪০ ডলারের বিলের দুটো লাফই ছিল অপচয়, আর নিচের দুই কোড তার দুটোরই সমাধান।
      - type: visual
        kind: table
        caption: 'কোন পদক্ষেপে কী বাঁচে, আর ঝুঁকি কতটা'
        headers: ['পদক্ষেপ', 'কীভাবে বাঁচে', 'ঝুঁকি']
        rows:
          - cells: ['Right-sizing', 'ব্যবহার কম হলে ছোট instance', 'কম — মেপে করলে']
            tip: 'CPU আর memory-র গড় ব্যবহার ২০%-এর নিচে থাকলে ছোট instance ভাবা যায়।'
          - cells: ['Autoscaling', 'রাতে কম Pod, ভিড়ে বেশি', 'কম']
            tip: 'ন্যূনতম সংখ্যা ২-এর নিচে নামাবেন না, নইলে availability যায়।'
          - cells: ['Savings Plan / Reserved', 'নিয়মিত ব্যবহারে ১-৩ বছরের প্রতিশ্রুতি', 'মাঝারি — প্রতিশ্রুতির ঝুঁকি']
            tip: 'শুধু যে ব্যবহার সবসময় থাকবে, সেটুকুর ওপর নিন।'
          - cells: ['Spot instance', 'সস্তা কিন্তু যেকোনো সময় কেড়ে নেয়', 'শুধু worker/batch-এ']
            tip: 'ডেটাবেস বা ওয়েব Pod-এ নয়। Retry করা যায় এমন কাজে।'
          - cells: ['Storage lifecycle', 'পুরনো ফাইল সস্তা স্তরে বা মুছে', 'কম']
            tip: 'আইনি রাখার সময় আছে কি না আগে জেনে নিন।'
          - cells: ['Log retention', 'debug log ৭ দিন, audit log দীর্ঘ', 'কম']
            tip: 'সব log সমান নয় — audit আর পেমেন্টের log বেশি দিন রাখতে হয়।'
          - cells: ['অলস resource মোছা', 'অব্যবহৃত disk, IP, পুরনো snapshot', 'কম']
            tip: 'মালিক tag দেখে জিজ্ঞেস করুন, তারপর মুছুন।'
      - type: code
        lang: text
        file: 'infra/network.tf (HCL)'
        variant: good
        code: |
          # Private subnet থেকে S3-র ট্রাফিক এখন NAT gateway এড়িয়ে যায়
          resource "aws_vpc_endpoint" "s3" {
            vpc_id            = aws_vpc.main.id
            service_name      = "com.amazonaws.ap-southeast-1.s3"
            vpc_endpoint_type = "Gateway"
            route_table_ids   = [aws_route_table.private.id]
          }

          # Debug log ৭ দিন থাকে, চিরকাল নয়
          resource "aws_cloudwatch_log_group" "app" {
            name              = "/shop/app"
            retention_in_days = 7
          }
        marks:
          - {line: 2, tip: 'NAT-এর লাইনে বাড়তি $780 মানে প্রতি GB-তে মোটামুটি ৫ সেন্ট ধরে প্রায় ১৫ TB। S3-র gateway endpoint বিনা পয়সার, আর ওই ট্রাফিককে NAT এড়িয়ে পাঠায়। এটা শুধু একই region-এর S3 আর DynamoDB-র জন্য।'}
          - {line: 12, tip: 'পুরনো log-লাইন নিজে থেকে মুছে যায়, তাই logs-এর বিল আর বাড়ে না। Audit log-এর জন্য আলাদা group-এ দীর্ঘ সময় রাখুন।'}
      - type: code
        lang: yaml
        file: 'config/packages/monolog.yaml'
        variant: good
        code: |
          when@prod:
              monolog:
                  handlers:
                      main:
                          type: stream
                          path: php://stderr
                          level: info   # এক ডেভেলপার এটা debug রেখে গিয়েছিল
                          formatter: monolog.formatter.json
        marks:
          - {line: 7, tip: 'info-তে দরকারি লাইনগুলো থাকে, বন্যাটা বাদ যায়। দাম: debug-এর খুঁটিনাটি পাবেন না। একটা ঘটনা তদন্তের সময় সাময়িক debug করুন, তারপর ফিরিয়ে দিন।'}
      - type: quote
        body: 'অপচয় কাটুন; সুরক্ষা-জাল নয়।'
    aside:
      - type: when
        use: ['আগে মাপুন, তারপর কাটুন — প্রমাণ নিয়ে', 'একবারে একটা বদল, ফল দেখে পরেরটা']
        avoid: ['প্রোডাকশন ডেটাবেসে spot বা single-AZ']
      - type: remember
        body: 'যা ব্যবহার হচ্ছে না তা অপচয়; যা বিপদে লাগবে তা বিমা।'
      - type: terms
        items:
          - {term: 'Pod', meaning: 'Kubernetes-এ আপনার অ্যাপের একটা চালু কপি। Autoscaling Pod বাড়ায় আর কমায়।'}
          - {term: 'Savings Plan', meaning: '১-৩ বছর নির্দিষ্ট পরিমাণ ব্যবহারের প্রতিশ্রুতি, বিনিময়ে কম দাম। কম ব্যবহার করলেও টাকা দিতে হয়।'}
      - type: refs
        items:
          - {to: 'scaling/horizontal-vertical', label: 'Autoscaling-এর ভিত্তি'}
    check:
      q: 'ছোট একটা টিম খরচ বাঁচাতে multi-AZ বন্ধ করতে চায়। কেন এটা "অপচয় কাটা" নয়?'
      a: 'Multi-AZ কেবল এক zone গেলে কাজে লাগে — অর্থাৎ এটা বিমা। এটা বন্ধ করলে বছরে কিছু টাকা বাঁচে, কিন্তু একটা ভবনের বিদ্যুৎ গেলেই সাইট বসে যায়।'

  - slug: bad-savings
    title: 'ভুল সাশ্রয়: যা কেটে বিপদ ডেকে আনা যায়'
    kind: pitfall
    tldr: 'Backup মুছে, replica কমিয়ে বা না মেপে optimise করলে বিল কমে, কিন্তু একটা ঘটনাতেই সব সঞ্চয় উড়ে যায়।'
    keywords: ['false saving', 'cost cutting', 'reliability', 'premature optimization', 'ভুল সাশ্রয়']
    blocks:
      - type: visual
        kind: compare
        caption: 'দুই টিমের দুই পথ'
        columns:
          - title: 'ভুল সাশ্রয়'
            tone: bad
            icon: cross
            tip: 'বিল কমল ঠিকই, কিন্তু বিপদ সামলানোর ক্ষমতা কমে গেল।'
            items:
              - 'ডেটাবেস single-AZ, backup ১ দিন'
              - 'Monitoring বন্ধ, alert নেই'
