      provider "aws" {
        default_tags {
          tags = {
            team    = "checkout"
            service = "shop-api"
            env     = "prod"
          }
        }
      }
    hint: 'কেউ ভুলে গেলে কী হয়?'
    options:
      - text: 'এই provider-এর প্রতিটা resource নিজে থেকে tag পায়; কাউকে মনে রাখতে হয় না'
        correct: true
        why: 'IaC-এ কেন্দ্রীয়ভাবে বসালে tag-হীন resource প্রায় থাকে না, তাই বিল ভাগ করা যায়।'
      - text: 'Resource দ্রুত চলে'
        correct: false
        why: 'Tag-এর সাথে কর্মদক্ষতার সম্পর্ক নেই।'
      - text: 'Tag থাকলে বিল নিজে থেকে কমে'
        correct: false
        why: 'Tag খরচ কমায় না; কার খরচ তা দেখায়। কমানো সিদ্ধান্তের কাজ।'
    ref: tagging-budgets
  - q: 'শাহিনের টিম বিল কমাতে চায়। নিচের কোন পদক্ষেপগুলো নির্ভরযোগ্যতা না কমিয়ে করা যায়?'
    hint: 'অপচয় বনাম বিমা।'
    options:
      - text: 'দুই মাস ধরে অব্যবহৃত disk আর পুরনো snapshot মুছে ফেলা (মালিক নিশ্চিত করে)'
        correct: true
