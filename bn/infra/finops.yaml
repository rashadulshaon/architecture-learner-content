      - text: 'অ্যাপ সার্ভারকে public subnet-এ সরানো'
        correct: false
        why: 'NAT-এর খরচ যায় ঠিকই, কিন্তু সার্ভার ইন্টারনেটের সামনে খোলা পড়ে। টাকা বাঁচাতে নিরাপত্তা দেওয়া হলো।'
    ref: save-without-risk
  - q: 'এক ডেভেলপার debug log চালু রেখে যাওয়ায় logs-এর বিল $110 থেকে $650 হয়েছে। নিরাপত্তা না হারিয়ে কোন বদলগুলো এটা ঠিক করে?'
    hint: 'লাইনের সংখ্যা কমান, আর পুরনো লাইন ঝরে যেতে দিন।'
    options:
      - text: 'Production-এ Monolog handler-এর level info করা'
        correct: true
        why: 'অনেক কম লাইন লেখা হয়, আর দরকারিগুলো থাকে।'
      - text: 'Log retention ৭ দিন করা (audit log আলাদা জায়গায় দীর্ঘ সময়)'
        correct: true
        why: 'পুরনো লাইন নিজে থেকে ঝরে যায়, তাই জমা GB আর বাড়ে না।'
      - text: 'Monitoring বন্ধ করে দেওয়া'
        correct: false
        why: 'Monitoring সুরক্ষা, অপচয় নয়। বন্ধ করলে পরের সমস্যা চোখে পড়বে না।'
    ref: save-without-risk
