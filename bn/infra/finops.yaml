flashcards:
  - q: 'FinOps বলতে কী বোঝায়?'
    a: 'ইঞ্জিনিয়ার, ফাইন্যান্স আর ব্যবসা মিলে ক্লাউড খরচ বোঝা, ভাগ করা আর নিয়ন্ত্রণ করার চর্চা।'
    more: |
      মূল ধারণা: খরচ শুধু ফাইন্যান্স বিভাগের চিন্তা নয়। যে ইঞ্জিনিয়ার resource বানায়, সে-ই খরচের সিদ্ধান্ত নেয়, তাই তার কাছেও খরচ দৃশ্যমান থাকা চাই।
    ref: surprise-bill
  - q: 'Fixed আর variable cloud খরচের পার্থক্য কী?'
    a: 'Fixed চালু থাকলেই আসে (node, ডেটাবেস)। Variable ব্যবহারের সাথে বাড়ে (data transfer, log, storage)।'
    more: |
      অর্ডার দ্বিগুণ হলে variable প্রায় দ্বিগুণ হয়, fixed আপাতত একই থাকে। কিন্তু সীমা পেরোলে আরেকটা node বা বড় ডেটাবেস লাগে, তখন fixed খরচ ধাপে ধাপে বাড়ে।
    ref: cost-model
  - q: 'Cost model কীভাবে বানাতে হয়?'
    a: 'খরচ উপাদানে ভাগ করুন (compute, ডেটাবেস, network...), প্রতিটার হিসাবের ভিত্তি লিখুন, fixed ও variable আলাদা করুন।'
    more: |
      প্রতি মাসে প্রকৃত বিলের সাথে মডেল মেলান। ফারাক মানে অজানা খরচ আছে। মডেল দিয়ে "অর্ডার দ্বিগুণ হলে কত?" ধরনের প্রশ্নের উত্তর বিল আসার আগেই দেওয়া যায়।
    ref: cost-model
  - q: 'Unit economics কী, আর cloud-এ কীভাবে মাপা হয়?'
    a: 'ব্যবসার একক-প্রতি খরচ, যেমন প্রতি ১,০০০ অর্ডারে ক্লাউড খরচ = মাসের মোট খরচ ÷ অর্ডার × ১,০০০।'
    more: |
      মোট বিল বাড়লেও unit খরচ কমলে ব্যবসা সুস্থ। উল্টো, অর্ডার সামান্য বাড়ল কিন্তু unit খরচ লাফাল — তাহলে কোথাও অপচয় ঢুকেছে, তদন্ত দরকার।
    ref: unit-economics
  - q: 'Cloud resource-এ tag কেন লাগে?'
    a: 'বিলের টাকা টিম, সার্ভিস আর environment-এ ভাগ করতে। Tag ছাড়া "এই খরচ কার?" প্রশ্নের উত্তর মেলে না।'
    more: |
      Terraform-এর default_tags দিয়ে প্রতিটা resource-এ team, service, env বসানো যায়। বিলিংয়ে tag-টা cost allocation tag হিসেবে চালু করতে হয়, নইলে রিপোর্টে আসে না।
    ref: tagging-budgets
  - q: 'Budget-এর FORECASTED alert কেন ACTUAL-এর চেয়ে ভালো?'
    a: 'FORECASTED বলে এই গতিতে চললে মাস শেষে সীমা ছাড়াবে — আগেই। ACTUAL সীমা ছোঁয়ার পরে জানায়, তখন টাকা চলে গেছে।'
    more: |
      সাধারণত দুটোই রাখা হয়: ৮০% forecast আর ১০০% actual। অ্যালার্ট টিমের চ্যাট চ্যানেলে পাঠানো ভালো, যাতে কেউ না কেউ দেখে।
    ref: tagging-budgets
  - q: 'কোন কোন কাজে spot instance চালানো নিরাপদ?'
    a: 'Retry করা যায় এমন কাজে: queue worker, batch job, ছবি প্রসেসিং। ডেটাবেস বা ওয়েব Pod-এ নয়।'
    more: |
      Spot সস্তা কিন্তু cloud যেকোনো সময় ফেরত নিতে পারে। Worker-এর কাজ যদি idempotent হয় আর queue-তে থাকে, মরলেও অন্য worker আবার তুলে নেয়।
    ref: save-without-risk
  - q: 'খরচ কমাতে গিয়ে কোন জিনিস কাটা উচিত নয়?'
    a: 'Backup, multi-AZ, monitoring আর alert — এগুলো অপচয় নয়, বিমা।'
    more: |
      অপচয় হলো যা কেউ ব্যবহার করছে না (অলস disk, বড় instance, বেশি log)। সুরক্ষা হলো যা বিপদে বাঁচায়। একটা ঘটনার দাম সারা বছরের সাশ্রয়ের চেয়ে বেশি হতে পারে।
    ref: bad-savings
  - q: 'Private অ্যাপ S3 থেকে অনেক GB টানছে, NAT gateway-এর লাইন ফুলে উঠেছে। সস্তা সমাধান কী?'
    a: 'S3-র gateway VPC endpoint বসান। তখন S3-র ট্রাফিক NAT gateway এড়িয়ে যায়, আর তার প্রতি-GB বিল মিলিয়ে যায়।'
    more: |
      S3-র gateway endpoint বিনা পয়সার। এটা শুধু একই region-এর S3 আর DynamoDB-র জন্য, তাই ইন্টারনেটের বাকি ট্রাফিক তখনও NAT দিয়ে যায়। গল্পে বাড়তি $780 ছিল প্রতি GB-তে মোটামুটি ৫ সেন্ট ধরে প্রায় ১৫ TB।
    ref: save-without-risk
  - q: 'Symfony অ্যাপে debug log যাতে বিল ফুলিয়ে না তোলে, তার উপায় কী?'
    a: 'Production-এ Monolog handler-এর level info রাখুন, আর log group-এ ৭ দিনের মতো ছোট retention দিন।'
    more: |
      দাম হলো debug-এর খুঁটিনাটি হারানো, তাই debug চালান শুধু একটা ঘটনা তদন্তের সময়। Audit আর পেমেন্টের log আলাদা group-এ দীর্ঘ retention-এ রাখুন।
    ref: save-without-risk

quiz:
  - q: 'গত মাসের বিল ৮২০ ডলার, এই মাসে ২,১৪০। কোড বদলায়নি। প্রথম কী করবেন?'
