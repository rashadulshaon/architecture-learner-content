        why: 'কোন খাতে (network, logs ইত্যাদি) বেড়েছে জানলে কারণ সংকীর্ণ হয়।'
      - text: 'পরের মাস অপেক্ষা করে দেখা বিল আবার কমে কি না'
        correct: false
        why: 'অপচয় নিজে থেকে থামে না; প্রতিদিন টাকা যাচ্ছে।'
    ref: surprise-bill
  - q: 'নিচের সংখ্যাগুলো থেকে মার্চ মাসে প্রতি ১,০০০ অর্ডারে খরচ কত? মোট ক্লাউড বিল $820, অর্ডার ৩,০০,০০০।'
    hint: 'বিল ÷ অর্ডার × ১,০০০।'
    options:
      - text: 'প্রায় $0.27'
        correct: false
        why: 'এটা প্রতি অর্ডারের খরচ (প্রায় ০.২৭ সেন্ট), ডলার নয়; ১,০০০ দিয়ে গুণ করতে ভুলে গেছেন।'
      - text: 'প্রায় $2.73'
        correct: true
        why: '820 ÷ 300,000 × 1,000 ≈ 2.73।'
      - text: 'প্রায় $27.3'
        correct: false
        why: 'এটা দশ গুণ বেশি; ১,০০০ দিয়ে ভাগ-গুণ ঠিক করে দেখুন।'
    ref: unit-economics
  - q: 'এপ্রিলে অর্ডার ৩ লাখ থেকে ৩.২ লাখ, কিন্তু বিল ৮২০ থেকে ১,৪০০। কোন ব্যাখ্যাগুলো সংগত?'
    hint: 'অর্ডার সামান্য বেড়েছে; বিল প্রায় দ্বিগুণ।'
    options:
      - text: 'ব্যবসা খুব ভালো চলছে, বিল বাড়াই স্বাভাবিক'
        correct: false
        why: 'অর্ডার ৭% বেড়েছে, বিল ৭০%। এই অসমতা স্বাভাবিক বাড় নয়।'
      - text: 'কোনো সার্ভিসে অপচয় ঢুকেছে — যেমন বাড়তি log বা ট্রাফিক'
        correct: true
        why: 'Unit খরচ $2.73 থেকে $4.38 হয়েছে; তদন্ত দরকার।'
      - text: 'নতুন চালু হওয়া, ভুলে থাকা resource (যেমন বড় instance) থাকতে পারে'
        correct: true
        why: 'অলস বা ভুলে থাকা resource-ও একই লক্ষণ দেখায়; tag দেখে মালিক খুঁজে বের করতে হবে।'
      - text: 'ক্লাউড প্রতি মাসে দাম বাড়ায়, তাই কিছু করার নেই'
        correct: false
        why: 'এত বড় লাফ দাম বাড়ার কারণে হয় না; এটা ব্যবহারের পরিবর্তন।'
    ref: unit-economics
  - q: 'নিচের Terraform অংশে tag দেওয়ার সবচেয়ে বড় সুবিধা কোনটা?'
