              - 'কিছু না মেপে সব সার্ভার ছোট'
          - title: 'বুদ্ধিমান সাশ্রয়'
            tone: good
            icon: check
            tip: 'অপচয় গেছে, কিন্তু সুরক্ষা অটুট।'
            items:
              - 'ব্যবহার মেপে instance ঠিক আকারে'
              - 'রাতে autoscaling, ন্যূনতম ২ Pod'
              - 'শুধু worker-এ spot'
              - 'পুরনো snapshot ও disk মোছা'
      - type: text
        body: |
          একটা ছোট অ্যাপ বছরে ৭০০ ডলার বাঁচিয়েছিল backup retention কমিয়ে। ছয় মাস পরে এক ভুল migration ডেটা মুছে দিল, আর পরিষ্কার করার মতো কোনো backup ছিল না। সাশ্রয় গেল, সাথে গ্রাহকের আস্থাও।
      - type: quote
        body: 'একটা ঘটনার দাম সারা বছরের সাশ্রয়ের চেয়ে বেশি হতে পারে।'
    aside:
      - type: pitfalls
        items:
          - 'Reserved/Savings Plan বেশি কিনে ফেলা — পরে ব্যবহার কমলে প্রতিশ্রুতির টাকা আটকে থাকে।'
          - 'না মেপে optimise করা — যেখানে বড় খরচ নেই, সেখানে সময় নষ্ট; আগে শীর্ষ ৩ খরচ দেখুন।'
