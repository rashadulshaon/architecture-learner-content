      - text: 'প্রোডাকশন ডেটাবেস single-AZ করে দেওয়া'
        correct: false
        why: 'এক zone গেলে সাইট বন্ধ। এটা বিমা কেটে ফেলা।'
      - text: 'Backup retention ১ দিনে নামানো'
        correct: false
        why: 'ভুল migration বা ডেটা নষ্ট ২-৩ দিন পরে ধরা পড়লে ফেরার পথ থাকে না।'
    ref: save-without-risk
  - q: 'কোন কাজটা spot instance-এ চালানো সবচেয়ে নিরাপদ?'
    hint: 'যে কাজ হঠাৎ থামলেও আবার চালানো যায়।'
    options:
      - text: 'প্রোডাকশন ডেটাবেস'
        correct: false
        why: 'হঠাৎ কেড়ে নিলে ডেটা ও সংযোগ হারানোর ঝুঁকি।'
      - text: 'Idempotent queue worker যে ছবি resize করে'
        correct: true
        why: 'Worker মরলে message queue-তে ফিরে যায়, অন্য worker আবার তোলে। এটাই spot-এর আদর্শ কাজ।'
      - text: 'ক্রেতার request নেওয়া একমাত্র ওয়েব Pod'
        correct: false
