slides:
  - slug: works-on-my-machine
    title: '"আমার মেশিনে তো চলছিল!"'
    kind: story
    tldr: 'সার্ভারে হাতে সেটআপ করলে লোকাল আর প্রোডাকশন আলাদা হয়ে যায়; container কোড আর তার পরিবেশ একসাথে প্যাক করে।'
    keywords: ['container', 'Docker', 'works on my machine', 'image', 'কনটেইনার', 'পরিবেশ']
    blocks:
      - type: text
        body: |
          শুক্রবার রাতে deploy হলো, আর অ্যাপ সাথে সাথে crash করল। কারণ: লোকালে PHP ৮.৩ আর `intl` extension আছে, প্রোডাকশন সার্ভারে PHP ৮.১ আর `intl` নেই। কেউ কোনো ভুল করেনি — দুই মেশিন শুধু আলাদা ছিল।
      - type: metaphor
        icon: box
        title: 'বিয়েবাড়ির ক্যাটারিং'
        body: |
          ক্যাটারিং-বাবুর্চি প্রতিটা বিয়েবাড়িতে গিয়ে নতুন করে আন্দাজে রান্না করে না — একই রেসিপিতে রান্না করে বড় ডেকে প্যাক করে পাঠায়। **Dockerfile** সেই রেসিপি, **image** রান্না করে প্যাক করা ডেক, আর **container** হলো টেবিলে বসানো, চালু ডেক। যে হলেই বসান, খাবার একই।
      - type: visual
        kind: compare
        caption: 'সার্ভারে হাতে সেটআপ বনাম container image'
        columns:
          - title: 'হাতে সেটআপ'
            tone: bad
            icon: cross
            tip: 'প্রতিটা সার্ভার একটু একটু করে আলাদা হয়ে যায়, আর কেউ জানে না কোথায় কী আছে।'
            items:
              - 'PHP আর extension সার্ভারে হাতে বসানো'
              - 'প্রতিটা সার্ভার একটু আলাদা'
              - 'নতুন সার্ভার বানাতে আধা দিন'
              - 'কোন version চলছে, কেউ নিশ্চিত নয়'
          - title: 'Container image'
            tone: good
            icon: check
            tip: 'পরিবেশটা image-এর ভেতরেই বন্দি, তাই যেখানে চালান একই আচরণ।'
            items:
              - 'PHP, extension, কোড — সব image-এ'
              - 'লোকাল, test, prod: একই image'
              - 'নতুন instance চালু হয় কয়েক সেকেন্ডে'
              - 'image-এর tag দেখলেই version জানা'
      - type: quote
        body: 'যা test করেছেন, ঠিক সেই image-ই প্রোডাকশনে চালান।'
    aside:
      - type: terms
        items:
          - {term: 'Image', meaning: 'কোড, runtime আর library দিয়ে তৈরি, বদলানো যায় না এমন প্যাকেজ।'}
          - {term: 'Container', meaning: 'একটা image-কে আলাদা করে চালানো প্রক্রিয়া।'}
          - {term: 'Registry', meaning: 'image জমা রাখার গুদাম, যেমন ECR বা Docker Hub।'}
      - type: remember
        body: 'Image একবার বানান, যেখানে খুশি চালান।'
    check:
      q: 'Image আর container-এর পার্থক্য কী, ক্যাটারিংয়ের উপমায়?'
      a: 'Image হলো রান্না করে প্যাক করা ডেক — স্থির, বদলায় না। Container হলো সেই ডেক খুলে টেবিলে বসানো, চালু অবস্থা।'

  - slug: symfony-dockerfile
    title: 'Symfony-র production Dockerfile'
    kind: howto
    tldr: 'Multi-stage build, composer --no-dev, non-root user আর স্থির tag — ছোট, নিরাপদ আর পুনরায় বানানো যায় এমন image।'
    keywords: ['Dockerfile', 'multi-stage', 'FrankenPHP', 'composer', 'non-root', 'ডকারফাইল']
    blocks:
      - type: text
        body: |
          প্রোডাকশন image-এ Composer, dev library বা git থাকা উচিত নয় — সেগুলো শুধু আকার আর আক্রমণের পথ বাড়ায়। তাই **multi-stage build**: প্রথম stage-এ vendor বানান, দ্বিতীয় stage-এ শুধু ফলাফলটা নিন। শেষে `www-data` user-এ চালান, root-এ নয়।
      - type: code
        lang: dockerfile
        file: 'Dockerfile'
        variant: good
        code: |
          # stage ১: শুধু dependency বানানো
          FROM composer:2 AS vendor
          WORKDIR /app
          COPY composer.json composer.lock symfony.lock ./
          RUN composer install --no-dev --no-scripts --no-autoloader --prefer-dist
          COPY . .
          RUN composer dump-autoload --classmap-authoritative --no-dev

          # stage ২: যা চালাবে, শুধু সেটুকু
          FROM dunglas/frankenphp:1-php8.3-alpine AS app
          ENV SERVER_NAME=:8080 APP_ENV=prod APP_DEBUG=0
          RUN install-php-extensions pdo_mysql intl opcache
          WORKDIR /app
          COPY --from=vendor /app /app
          RUN mkdir -p var \
           && chown -R www-data:www-data var /data/caddy /config/caddy
          USER www-data
          EXPOSE 8080
        marks:
          - {line: 4, tip: 'আগে শুধু composer ফাইল কপি — কোড বদলালে এই layer cache থেকে আসে, build দ্রুত হয়।'}
          - {line: 5, tip: '--no-dev: PHPUnit, Profiler ইত্যাদি প্রোডাকশন image-এ ঢোকেই না।'}
          - {line: 10, tip: 'ছোট, নির্দিষ্ট base image। "latest" নয় — নইলে আজকের আর কালকের build আলাদা হতে পারে।'}
          - {line: 11, tip: 'ডিবাগ বন্ধ, prod mode। Secret এখানে নয় — সেগুলো চালানোর সময় আসে।'}
          - {line: 17, tip: 'root ছেড়ে সাধারণ user — অ্যাপ হ্যাক হলেও পুরো সিস্টেমে হাত পৌঁছায় কম।'}
      - type: code
        lang: text
        file: '.dockerignore'
        code: |
          .git
          .env.local
          var/
          vendor/
          node_modules/
          tests/
        marks:
          - {line: 2, tip: 'লোকাল secret ফাইল image-এ ঢুকলে registry-তে যে কেউ পেয়ে যেতে পারে।'}
      - type: quote
        body: 'Secret image-এর ভেতরে নয়; চালানোর সময় বাইরে থেকে দিন।'
    aside:
      - type: commands
        title: 'Docker কমান্ড'
        items:
          - {cmd: 'docker build -t shop-api:1.4.2 .', desc: 'image বানান, version tag সহ'}
          - {cmd: 'docker run --rm -p 8080:8080 --env-file .env.local shop-api:1.4.2', desc: 'লোকালে চালিয়ে দেখুন'}
          - {cmd: 'docker image ls shop-api', desc: 'আকার দেখুন'}
      - type: tips
        items:
          - 'Image-এর tag-এ git commit বা version দিন; "latest" দিয়ে কখনো deploy করবেন না।'
          - 'Log stdout/stderr-এ লিখুন, ফাইলে নয় — container মরলে ফাইল হারায়।'
    check:
      q: 'Multi-stage build-এ Composer শেষ image-এ থাকে না কেন, আর তাতে লাভ কী?'
      a: 'Composer শুধু প্রথম stage-এ চলে, দ্বিতীয় stage-এ কেবল তৈরি vendor কপি হয়। ফলে image ছোট হয় আর আক্রমণের সুযোগ কমে।'

  - slug: kubernetes-objects
    title: 'Kubernetes-এর মূল চার জিনিস'
    kind: concept
    tldr: 'Pod চালায়, Deployment সংখ্যা ঠিক রাখে, Service স্থির ঠিকানা দেয়, Ingress বাইরের দরজা খোলে — আর config আলাদা রাখে ConfigMap/Secret।'
    keywords: ['Kubernetes', 'Pod', 'Deployment', 'Service', 'Ingress', 'ConfigMap', 'k8s']
    blocks:
      - type: metaphor
        icon: users
        title: 'ক্যাটারিংয়ের ম্যানেজার'
        body: |
          ম্যানেজারকে বলা আছে: "সবসময় ৩ জন বাবুর্চি থাকবে।" একজন অসুস্থ হলে সে নতুন একজন ডেকে আনে। এখানে বাবুর্চি **Pod**, ম্যানেজারের নির্দেশ **Deployment**। অতিথিরা বাবুর্চির নাম জানে না, কাউন্টারে অর্ডার দেয় — সেই কাউন্টার **Service**, আর হলের মূল গেট **Ingress**।
      - type: visual
        kind: flow
        caption: 'বাইরের request কীভাবে Pod-এ পৌঁছায়, আর Deployment কী করে (তৃতীয় Pod ছবিতে বাদ)'
        nodes:
          - {id: ing, label: 'Ingress', sub: 'api.shop.example.com', icon: gateway, col: 0, row: 1, tip: 'বাইরের জগতের গেট। hostname আর path দেখে ঠিক Service-এ পাঠায়।'}
          - {id: svc, label: 'Service', sub: 'shop-api', icon: lb, tone: accent, col: 1.5, row: 1, tip: 'স্থির ঠিকানা। Pod মরে নতুন হলেও এই ঠিকানা বদলায় না।'}
          - {id: pod1, label: 'Pod A', sub: 'shop-api:1.4.2', icon: box, col: 3, row: 0, tip: 'একটা চালু container। ক্ষণস্থায়ী — যেকোনো সময় মরে নতুন আসতে পারে।'}
          - {id: pod2, label: 'Pod B', sub: 'shop-api:1.4.2', icon: box, col: 3, row: 2, tip: 'একই image-এর আরেকটা কপি। দুটো থাকায় একটা মরলেও সাইট চলে।'}
          - {id: dep, label: 'Deployment', sub: 'replicas: 3', icon: gear, col: 4, row: 1, tip: 'ম্যানেজার। চাওয়া অবস্থা (৩টা Pod) আর আসল অবস্থা মেলাতে থাকে।'}
        edges:
          - {from: ing, to: svc, label: 'Ingress hostname দেখে request-টা Service-কে দেয়'}
          - {from: svc, to: pod1, label: 'Service একটা সুস্থ Pod বেছে request পাঠায়'}
          - {from: svc, to: pod2, label: 'পরের request যায় অন্য Pod-এ — load ভাগ হয়'}
          - {from: dep, to: pod1, label: 'Deployment চোখ রাখে: ৩টা Pod জীবিত আছে কি না', dashed: true, tone: good}
      - type: points
        title: 'Config আলাদা রাখুন'
        style: dot
        items:
          - 'ConfigMap: সাধারণ সেটিং (APP_ENV, ফিচার নাম)'
          - 'Secret: পাসওয়ার্ড, token — image-এ নয়'
          - 'Probe: Kubernetes নিজে জিজ্ঞেস করে "আপনি সুস্থ?"'
    aside:
      - type: terms
        items:
          - {term: 'Node', meaning: 'যে সার্ভারে Pod গুলো চলে।'}
          - {term: 'Readiness probe', meaning: 'Pod তৈরি হয়ে request নেওয়ার মতো হয়েছে কি না, তার পরীক্ষা।'}
          - {term: 'Liveness probe', meaning: 'Pod আটকে গেছে কি না — আটকালে restart হয়।'}
      - type: problem
        body: 'একটা সার্ভারে docker run করলে সার্ভার মরলেই অ্যাপ শেষ। Kubernetes অনেক সার্ভারে container ছড়ায়, মরলে নতুন বসায়, আর নতুন version ধীরে ধীরে চালু করে।'
      - type: when
        use: ['অনেক সার্ভারে কয়েকটা সার্ভিস, যেখানে নিজে-সেরে-ওঠা আর ধাপে ধাপে rollout দরকার']
        avoid: ['একটা সার্ভারে একটা ছোট অ্যাপ: Docker Compose বা managed container সার্ভিস সহজ। Kubernetes শেখা আর চালানোয় আসল সময় লাগে']
    check:
      q: 'Pod-এর IP বদলায়, তবু অন্য অ্যাপ তাকে পায় কীভাবে?'
      a: 'Service-এর মাধ্যমে। Service-এর নাম আর ঠিকানা স্থির; সে ভেতরে সুস্থ Pod-গুলো বেছে request পাঠায়।'

  - slug: k8s-manifests
    title: 'Deployment আর Service-এর YAML'
    kind: howto
    tldr: 'Replica, rolling update, resource limit আর probe — একটা Symfony API-র জন্য ন্যূনতম নিরাপদ Deployment ও তার Service/Ingress।'
    keywords: ['Deployment YAML', 'readinessProbe', 'rolling update', 'Ingress', 'resources', 'manifest']
    blocks:
      - type: code
        lang: yaml
        file: 'k8s/deployment.yaml'
        variant: good
        code: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: shop-api
          spec:
            replicas: 3
            selector:
              matchLabels: {app: shop-api}
            strategy:
              rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
            template:
              metadata:
                labels: {app: shop-api}
              spec:
                containers:
                  - name: api
                    image: registry.example.com/shop-api:1.4.2
                    ports: [{containerPort: 8080}]
                    envFrom:
                      - secretRef: {name: shop-api-secrets}
                    resources:
                      requests: {cpu: 250m, memory: 256Mi}
                      limits: {memory: 512Mi}
                    readinessProbe:
                      httpGet: {path: /health/ready, port: 8080}
                    livenessProbe:
                      httpGet: {path: /health/live, port: 8080}
                      initialDelaySeconds: 10
        marks:
          - {line: 6, tip: 'অন্তত ২টা, ভালো ৩টা — একটা Pod মরলে বা node গেলে বাকিরা সামলায়।'}
          - {line: 10, tip: 'maxUnavailable: 0 — নতুন Pod তৈরি না হওয়া পর্যন্ত পুরনোটা বন্ধ হয় না। Deploy-এ downtime নেই।'}
          - {line: 17, tip: 'স্থির version tag। "latest" হলে কোন কোড চলছে বোঝাই যায় না, rollback-ও অসম্ভব।'}
          - {line: 20, tip: 'Secret আলাদা object থেকে আসে; image-এ বা YAML-এ পাসওয়ার্ড লেখা নেই।'}
          - {line: 24, tip: 'Readiness না মেলা পর্যন্ত Service এই Pod-এ request পাঠায় না — আধা-চালু অ্যাপে ট্রাফিক যায় না।'}
      - type: code
        lang: yaml
        file: 'k8s/service-ingress.yaml'
        variant: good
        code: |
          apiVersion: v1
          kind: Service
          metadata:
            name: shop-api
          spec:
            selector: {app: shop-api}
            ports:
              - port: 80
                targetPort: 8080
          ---
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: shop-api
          spec:
            rules:
              - host: api.shop.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service: {name: shop-api, port: {number: 80}}
        marks:
          - {line: 6, tip: 'selector-এর label মিললেই Pod-টা এই Service-এর সদস্য। label ভুল হলে request কোথাও যায় না।'}
          - {line: 9, tip: 'বাইরে 80, ভেতরে container-এর 8080 পোর্ট — এই অনুবাদ Service করে।'}
      - type: quote
        body: 'Readiness probe ছাড়া rolling update আসলে আধা-চালু অ্যাপে ট্রাফিক পাঠানো।'
    aside:
      - type: commands
        title: 'kubectl'
        items:
          - {cmd: 'kubectl apply -f k8s/', desc: 'YAML অনুযায়ী অবস্থা মেলান'}
          - {cmd: 'kubectl rollout status deploy/shop-api', desc: 'নতুন version চালু হচ্ছে কি না দেখুন'}
          - {cmd: 'kubectl rollout undo deploy/shop-api', desc: 'আগের version-এ ফিরুন'}
          - {cmd: 'kubectl logs deploy/shop-api', desc: 'log দেখুন'}
      - type: terms
        items:
          - {term: 'Requests আর limits', meaning: 'Request হলো Pod-এর জন্য আগে থেকে রাখা অংশ (250m মানে CPU core-এর সিকি ভাগ)। Limit হলো সীমা: memory limit পেরোলে Pod মরে।'}
          - {term: 'Rolling update', meaning: 'কয়েকটা করে Pod বদলানো, যাতে নতুনগুলো ওঠার সময়ও পুরনোরা সেবা দেয়। maxSurge: 1 মানে এ সময় একটা বাড়তি Pod চলতে পারে।'}
      - type: pitfalls
        items:
          - 'Memory limit না দিলে একটা Pod পুরো node-এর memory খেয়ে অন্যদের মারতে পারে।'
          - 'Liveness probe-এ ডেটাবেস ডাকবেন না — ডেটাবেস ধীর হলে সব Pod একসাথে restart হয়ে যাবে।'
      - type: refs
        items:
          - {to: 'observability/health-alerts', label: 'Health check ও alert'}
          - {to: 'resilience/zero-downtime-deploys', label: 'Zero-downtime deploy'}
    check:
      q: 'Readiness probe fail করলে Kubernetes Pod-টাকে কী করে?'
      a: 'Pod মরে না, কিন্তু Service তাকে request পাঠানো বন্ধ রাখে। সুস্থ হলে আবার ট্রাফিক পায়। আটকে গেলে restart করে liveness probe।'

  - slug: click-ops-trap
    title: 'কনসোলে ক্লিক করে বানানোর ফাঁদ'
    kind: pitfall
    tldr: 'হাতে ক্লিক করে বানানো infrastructure কেউ মনে রাখে না, পুনরায় বানানো যায় না, আর staging-prod আলাদা হয়ে যায়।'
    keywords: ['click-ops', 'infrastructure as code', 'drift', 'ক্লিক অপস', 'IaC']
    blocks:
      - type: text
        body: |
          ফাহিম ক্লাউড কনসোলে ক্লিক করে staging বানাল। ছয় মাস পরে prod বানাতে গিয়ে সে ভুলে গেল কোন কোন সেটিং দিয়েছিল। একজন সহকর্মী কনসোলে security group বদলাল, কেউ জানল না। একে বলে **drift** — কাগজে এক, আসলে আরেক।
      - type: visual
        kind: compare
        caption: 'Click-ops বনাম code দিয়ে infrastructure'
        columns:
          - title: 'Click-ops'
            tone: bad
            icon: cross
            tip: 'প্রতিটা সেটিং মানুষের স্মৃতিতে — আর স্মৃতি ভুল করে।'
            items:
              - 'কে কখন কী বদলাল, জানা যায় না'
              - 'staging আর prod ধীরে ধীরে আলাদা হয়'
              - 'সব নষ্ট হলে আবার বানানো প্রায় অসম্ভব'
              - 'Review করার কোনো উপায় নেই'
          - title: 'Infrastructure as Code'
            tone: good
            icon: check
            tip: 'কোড মানেই git, review, history আর বারবার চালানোর ক্ষমতা।'
            items:
              - 'প্রতিটা বদলের git history থাকে'
              - 'একই কোড দিয়ে staging ও prod'
              - 'আগুন লাগলে এক কমান্ডে আবার তৈরি'
              - 'Pull request-এ review হয়'
      - type: quote
        body: 'যা কোডে লেখা নেই, তা হারালে ফেরানো যায় না।'
    aside:
      - type: story
        title: 'এক ভুল ক্লিক'
        body: |
          এক টিমের কেউ কনসোলে "পরীক্ষা করি" বলে একটা ডেটাবেস instance-এর size কমিয়ে দিল। তিন দিন পরে সাইট ধীর হলে কেউ কারণ খুঁজে পায়নি — কারণ কোথাও লেখা ছিল না কেউ কিছু বদলেছে।
      - type: pitfalls
        items:
          - 'IaC চালু করেও জরুরি অবস্থায় কনসোলে বদলে ফেলা — পরে কোডে না তুললে drift ফিরে আসে।'
    check:
      q: '"Drift" কী, আর click-ops-এ কেন বেশি হয়?'
      a: 'কোডে বা নথিতে যা লেখা আর আসলে যা চলছে, তার অমিল। হাতে ক্লিক করলে বদল কোথাও লেখা হয় না, তাই অমিল জমতে থাকে।'

  - slug: terraform-basics
    title: 'Terraform: infrastructure-কে কোড বানানো'
    kind: howto
    tldr: 'Terraform-এ চাওয়া অবস্থা লিখে plan দিয়ে বদল দেখুন, review করুন, তারপর apply — state ফাইল remote-এ রাখুন।'
    keywords: ['Terraform', 'IaC', 'plan', 'apply', 'state', 'HCL', 'টেরাফর্ম']
    blocks:
      - type: metaphor
        icon: map
        title: 'হলের নকশা আর ফর্দ'
        body: |
          ক্যাটারিংয়ের আগে ম্যানেজার লিখিত ফর্দ বানায়: কয়টা টেবিল, কয়টা চেয়ার, বিদ্যুতের লাইন কোথায়। ফর্দ বদলালে সে শুধু পার্থক্যটুকু ঠিক করে। **Terraform** সেই ফর্দ: আপনি চাওয়া অবস্থা লেখেন, সে বর্তমান অবস্থার সাথে মিলিয়ে শুধু বদলটুকু করে।
      - type: code
        lang: text
        file: 'infra/database.tf (HCL)'
        variant: good
        code: |
          terraform {
            backend "s3" {
              bucket = "shop-tfstate"
              key    = "prod/database.tfstate"
              region = "ap-southeast-1"
            }
          }

          resource "aws_db_instance" "main" {
            identifier                  = "shop-prod"
            engine                      = "mysql"
            instance_class              = "db.t4g.medium"
            allocated_storage           = 50
            multi_az                    = true
            storage_encrypted           = true
            manage_master_user_password = true
            vpc_security_group_ids      = [aws_security_group.db.id]
            backup_retention_period     = 14
            deletion_protection         = true
          }
        marks:
          - {line: 2, tip: 'State ফাইল remote bucket-এ — টিমের সবাই একই state দেখে, আর এক জনের লেপটপে আটকে থাকে না।'}
          - {line: 16, tip: 'পাসওয়ার্ড কোডে নেই; AWS নিজে Secrets Manager-এ বানিয়ে রাখে।'}
          - {line: 18, tip: '১৪ দিনের backup — managed হলেও এই সংখ্যা আপনার সিদ্ধান্ত।'}
          - {line: 19, tip: 'ভুল করে terraform destroy চালালেও ডেটাবেস মুছবে না — আগে এই flag হাতে বন্ধ করতে হবে।'}
      - type: code
        lang: text
        file: 'terminal: terraform plan (সংক্ষিপ্ত)'
        code: |
          $ terraform plan
          aws_security_group.db: Refreshing state...

            # aws_security_group.db will be updated in-place
            ~ resource "aws_security_group" "db" {
                ~ ingress = [
                    - {
                        - cidr_blocks = ["0.0.0.0/0"]
                        - from_port   = 3306
                        - to_port     = 3306
                        # (4 unchanged attributes hidden)
                      },
                  ]
              }

          Plan: 0 to add, 1 to change, 0 to destroy.
        marks:
          - {line: 8, tip: 'কেউ কনসোলে ডেটাবেসের পোর্ট পুরো দুনিয়ার জন্য খুলেছে। Terraform আসল অবস্থা কোডের সাথে মিলিয়ে ওই বাড়তি নিয়মটাকে মোছার তালিকায় দেখায়। এভাবেই drift ধরা পড়ে।'}
          - {line: 16, tip: 'এই plan apply করলে পোর্টটা আবার বন্ধ হবে। দাম: কনসোলের বদলটা সত্যিকারের জরুরি মেরামত হলে আগে কোডে তুলুন, নইলে apply সেটা মুছে দেবে।'}
      - type: visual
        kind: steps
        caption: 'Terraform-এর নিরাপদ কাজের ধারা'
        steps:
          - {title: '১. init', body: 'provider আর backend তৈরি করুন', tip: 'এক বার চালালেই চলে। remote state-এর সাথে যোগাযোগ বসায়।'}
          - {title: '২. plan', body: 'কী কী বদলাবে, তার তালিকা দেখুন', tip: 'কিছু বদলায় না। কেবল দেখায়: কী যুক্ত হবে, কী মুছবে।'}
          - {title: '৩. review', body: 'plan-টা pull request-এ সহকর্মী দেখুক', tip: 'destroy বা replace লেখা থাকলে থামুন আর ভাবুন।'}
          - {title: '৪. apply', body: 'অনুমোদিত plan-ই চালান', tip: 'CI pipeline থেকে চালানোই ভালো, লেপটপ থেকে নয়।'}
    aside:
      - type: commands
        title: 'Terraform'
        items:
          - {cmd: 'terraform init', desc: 'প্রথমবার প্রস্তুতি'}
          - {cmd: 'terraform plan -out=tfplan', desc: 'বদলের তালিকা বানান'}
          - {cmd: 'terraform apply tfplan', desc: 'ঠিক সেই plan চালান'}
      - type: when
        use: ['একাধিক environment বা একাধিক মানুষ থাকলে', 'যা স্মৃতি থেকে আবার বানানো সম্ভব নয়, তার জন্য']
        avoid: ['এক ঘণ্টার মধ্যে মুছে ফেলা পরীক্ষামূলক জিনিসে', 'যে resource অন্য টুল আগে থেকেই চালায়: দুই টুল তা নিয়ে লড়বে']
      - type: pitfalls
        items:
          - 'State ফাইলে secret থাকতে পারে — সেটা git-এ তুলবেন না, encrypted remote backend-এ রাখুন।'
          - 'Plan না দেখে apply: নাম বদলালে Terraform পুরনোটা মুছে নতুন বানাতে পারে — ডেটাবেসের ক্ষেত্রে ভয়ংকর।'
      - type: refs
        items:
          - {to: 'infra/ci-cd', label: 'Pipeline-এ plan ও apply'}
    check:
      q: '`terraform plan` আর `apply`-কে আলাদা ধাপ রাখা হয় কেন?'
      a: 'Plan কিছু বদলায় না, শুধু দেখায় কী হবে। মানুষ সেটা review করে নিশ্চিত হয়ে তারপর apply করে — ভুল মোছা বা replace আগেই ধরা পড়ে।'

flashcards:
  - q: 'Docker image আর container-এর পার্থক্য কী?'
    a: 'Image স্থির প্যাকেজ (কোড + runtime), বদলায় না। Container সেই image চালু অবস্থায়।'
    more: |
      একটা image থেকে অনেক container চালানো যায়, ঠিক একটা রেসিপি থেকে অনেক ডেক রান্নার মতো। Container মরলে ভেতরের ফাইল হারায়, image অক্ষত থাকে।
    ref: works-on-my-machine
  - q: 'Multi-stage build কী, আর কেন করা হয়?'
    a: 'এক Dockerfile-এ কয়েকটা stage; আগের stage-এ বানানো জিনিস শুধু দরকারটুকু শেষ image-এ নেওয়া হয়। এতে image ছোট ও নিরাপদ হয়।'
    more: |
      Symfony-র ক্ষেত্রে প্রথম stage-এ Composer দিয়ে vendor বানানো হয়, শেষ stage-এ শুধু PHP runtime আর সেই vendor থাকে। Composer, git বা dev dependency প্রোডাকশনে যায় না।
    ref: symfony-dockerfile
  - q: 'Docker image-এ "latest" tag দিয়ে deploy করা কেন খারাপ?'
    a: 'কারণ "latest" বদলে যায়। কোন কোড চলছে বোঝা যায় না, আর আগের version-এ ফেরান যায় না।'
    more: |
      প্রতিটা build-কে version বা git commit-এর tag দিন (shop-api:1.4.2)। তাহলে প্রোডাকশনে ঠিক কোন image চলছে তা জানা যায় আর rollback মানে আগের tag-এ ফেরা।
    ref: symfony-dockerfile
  - q: 'Container-এ non-root user ব্যবহার করা হয় কেন?'
    a: 'অ্যাপ হ্যাক হলেও আক্রমণকারী root ক্ষমতা পায় না, তাই ক্ষতির পরিধি ছোট থাকে।'
    more: |
      Dockerfile-এ USER www-data লিখলে প্রক্রিয়াটা সীমিত অধিকারে চলে। যেসব ফোল্ডারে লিখতে হবে (যেমন var/), শুধু সেগুলোর মালিকানা ওই user-কে দিন।
    ref: symfony-dockerfile
  - q: 'Kubernetes-এ Pod, Deployment আর Service-এর কাজ কী?'
    a: 'Pod container চালায়। Deployment নির্দিষ্ট সংখ্যক Pod জীবিত রাখে ও নতুন version তোলে। Service Pod-দের জন্য স্থির ঠিকানা দেয়।'
    more: |
      Pod ক্ষণস্থায়ী — মরে গেলে নতুন Pod নতুন IP পায়। তাই কেউ সরাসরি Pod-কে ডাকে না; সবাই Service-কে ডাকে, যে label মিলিয়ে সুস্থ Pod-এ পাঠায়।
    ref: kubernetes-objects
  - q: 'Readiness আর liveness probe-এর পার্থক্য কী?'
    a: 'Readiness: Pod ট্রাফিক নেওয়ার জন্য তৈরি কি না। Liveness: Pod আটকে গেছে কি না — গেলে restart।'
    more: |
      Readiness ব্যর্থ হলে Pod শুধু Service-এর তালিকা থেকে সাময়িক বাদ পড়ে। Liveness ব্যর্থ হলে Pod মেরে নতুন বানানো হয়। Liveness-এ বাইরের ডেটাবেস ডাকা ঠিক নয়।
    ref: k8s-manifests
  - q: '"Click-ops" কী, আর সমস্যা কোথায়?'
    a: 'ক্লাউড কনসোলে হাতে ক্লিক করে infrastructure বানানো। বদল লেখা থাকে না, পুনরায় বানানো যায় না, আর environment আলাদা হয়ে যায় (drift)।'
    more: |
      সমাধান Infrastructure as Code: infrastructure-এর চাওয়া অবস্থা কোডে লেখা, git-এ রাখা, review হওয়া। তখন কে কী বদলাল তার ইতিহাস থাকে, আর আগুন লাগলে এক কমান্ডে সব ফিরে আসে।
    ref: click-ops-trap
  - q: 'Terraform-এ plan আর apply আলাদা কেন?'
    a: 'Plan শুধু দেখায় কী বদলাবে; apply আসলে বদলায়। আগে plan review করলে ভুল মোছা বা replace ধরা পড়ে।'
    more: |
      সবচেয়ে নিরাপদ নিয়ম: pull request-এ plan-এর ফল দেখা, অনুমোদনের পর CI সেই plan-ই apply করে। State ফাইল রাখুন encrypted remote backend-এ, যাতে টিমের সবাই একই অবস্থা দেখে।
    ref: terraform-basics
  - q: 'কনসোলে হাতে infrastructure বদলালে Terraform কীভাবে তা ধরিয়ে দেয়?'
    a: 'terraform plan আসল infrastructure-কে কোডের সাথে মিলিয়ে প্রতিটা অমিল দেখায়, তাই হাতে-করা বদল ফিরিয়ে দেওয়ার মতো বদল হিসেবে ওঠে।'
    more: |
      এভাবেই drift ধরা পড়ে। দাম: কনসোলে করা জরুরি মেরামত কোডে তুলতে হবে, নইলে পরের apply সেটা চুপচাপ মুছে দেবে।
    ref: terraform-basics
  - q: 'কখন Kubernetes দরকারের চেয়ে বেশি হয়ে যায়?'
    a: 'একটা সার্ভারে একটা ছোট অ্যাপের জন্য। Docker Compose বা managed container সার্ভিস সহজ, কারণ Kubernetes শেখা আর চালানোয় আসল সময় লাগে।'
    more: |
      অনেক সার্ভিস, অনেক সার্ভার, নিজে-সেরে-ওঠা আর ধাপে ধাপে rollout লাগলে Kubernetes লাভজনক। এর নিচে তার বাড়তি অংশগুলো শুধু খরচ, লাভ নেই।
    ref: kubernetes-objects

quiz:
  - q: 'নিচের Dockerfile-এ প্রোডাকশনের জন্য কী কী সমস্যা আছে?'
    lang: dockerfile
    code: |
      FROM php:latest
      COPY . /app
      RUN composer install
      ENV DB_PASSWORD=s3cr3t
      CMD ["php", "-S", "0.0.0.0:80", "-t", "/app/public"]
    hint: 'tag, dev dependency, secret আর server-এর ধরন — চারটা জিনিস দেখুন।'
    options:
      - text: '"latest" tag — আজ আর কাল আলাদা PHP আসতে পারে'
        correct: true
        why: 'পুনরায় build করলে ভিন্ন image পাওয়ার ঝুঁকি; নির্দিষ্ট version দিতে হয়।'
      - text: 'পাসওয়ার্ড ENV দিয়ে image-এ লেখা'
        correct: true
        why: 'image যেই পাবে, সেই পাসওয়ার্ড পাবে। Secret চালানোর সময় বাইরে থেকে আসবে।'
      - text: '--no-dev ছাড়া composer install — dev package প্রোডাকশনে'
        correct: true
        why: 'অপ্রয়োজনীয় আর আক্রমণের সুযোগ বাড়ানো কোড image-এ ঢুকছে।'
      - text: 'php -S হলো development server, প্রোডাকশনের জন্য নয়'
        correct: true
        why: 'ডিফল্টে এটা একবারে একটা request সামলায়, আর প্রোডাকশনের সুরক্ষা নেই। FrankenPHP, বা Nginx-সহ PHP-FPM ব্যবহার করুন।'
      - text: 'শুধু ENV-এর নামটা বড় হাতের নয়, বাকি সব ঠিক'
        correct: false
        why: 'ENV-এর নামে কোনো সমস্যা নেই; সমস্যা তার মানে ও বাকি লাইনগুলোতে।'
    ref: symfony-dockerfile
  - q: 'Deployment-এ maxUnavailable: 0 আর readiness probe থাকলে নতুন version deploy করার সময় কী ঘটে?'
    hint: 'পুরনো Pod কখন বন্ধ হয়?'
    options:
      - text: 'সব পুরনো Pod একসাথে বন্ধ হয়, তারপর নতুনগুলো ওঠে'
        correct: false
        why: 'এটা Recreate strategy-র আচরণ। এতে downtime হয়।'
      - text: 'নতুন Pod ready হলে তবেই একটা পুরনো Pod বন্ধ হয়; সাইট চালু থাকে'
        correct: true
        why: 'maxUnavailable: 0 পুরনোকে ধরে রাখে, readiness probe নিশ্চিত করে নতুনটা সত্যিই তৈরি।'
      - text: 'নতুন Pod-এ আগেই সব ট্রাফিক চলে যায়, probe-এর অপেক্ষা ছাড়াই'
        correct: false
        why: 'Readiness না মিললে Service ট্রাফিক পাঠায় না।'
    ref: k8s-manifests
  - q: 'শাহীনের Service আছে, Pod চালু আছে, কিন্তু request কোথাও পৌঁছাচ্ছে না। প্রথমে কী দেখবেন?'
    hint: 'Service Pod-কে চেনে কীভাবে?'
    options:
      - text: 'Service-এর selector আর Pod-এর label মিলছে কি না'
        correct: true
        why: 'Label না মিললে Service-এর কোনো Pod-ই থাকে না, তাই request যাওয়ার জায়গা নেই।'
      - text: 'Pod-এর replicas বাড়ানো'
        correct: false
        why: 'সংখ্যা বাড়ালেও label ভুল থাকলে Service তাদের দেখতেই পাবে না।'
      - text: 'Docker image-এর আকার কমানো'
        correct: false
        why: 'image-এর আকারের সাথে request পৌঁছানোর সম্পর্ক নেই।'
    ref: kubernetes-objects
  - q: 'Liveness probe-এ ডেটাবেসে query করা হয়েছে। ডেটাবেস কয়েক মিনিট ধীর হলে কী হতে পারে?'
    hint: 'Liveness ব্যর্থ হলে Kubernetes কী করে?'
    options:
      - text: 'কিছুই না; Pod নিজে ঠিক হয়ে যায়'
        correct: false
        why: 'ঠিক উল্টো — liveness বারবার ব্যর্থ হলে Kubernetes Pod মেরে ফেলে।'
      - text: 'সব Pod একসাথে restart হয়ে সাইট পুরো বসে যেতে পারে'
        correct: true
        why: 'সমস্যা ডেটাবেসের, কিন্তু শাস্তি পায় অ্যাপ। Restart-এ সমস্যাও মেটে না, বরং বাড়ে।'
      - text: 'শুধু ডেটাবেসটা restart হয়'
        correct: false
        why: 'Kubernetes শুধু probe-দেওয়া Pod-কেই restart করে, ডেটাবেস নয়।'
    ref: k8s-manifests
  - q: 'কনসোলে ক্লিক করে বানানো staging আর prod ছয় মাস পরে আলাদা আচরণ করছে। এর মূল কারণ কী?'
    hint: 'বদলগুলো কোথাও লেখা আছে কি?'
    options:
      - text: 'ক্লাউড কখনো একই সেটিং দুইবার দেয় না'
        correct: false
        why: 'একই সেটিং দিলে ক্লাউড একই ফল দেয়; সমস্যা মানুষের হাতে অসঙ্গতি।'
      - text: 'বদলগুলো হাতে হয়েছে, কোডে লেখা নেই — drift জমেছে'
        correct: true
        why: 'কেউ এক জায়গায় বদলে অন্য জায়গায় ভুলে গেছে। IaC-তে একই কোড দুই environment-এ চলে।'
      - text: 'staging ছোট বলে স্বভাবতই আলাদা হয়'
        correct: false
        why: 'আকার আলাদা হতে পারে, কিন্তু কাঠামো আর নিয়ম একই থাকা উচিত।'
    ref: click-ops-trap
  - q: 'Terraform plan-এ দেখা গেল aws_db_instance "must be replaced"। সবচেয়ে ভালো পদক্ষেপ কী?'
    hint: 'Replace মানে পুরনোটা মুছে নতুন বানানো।'
    options:
      - text: 'দ্রুত apply করে দেওয়া, Terraform নিশ্চয়ই জানে কী করছে'
        correct: false
        why: 'Replace মানে ডেটাবেসের ডেটা যেতে পারে। যন্ত্র জানে কী করবে, কিন্তু ডেটা হারানো ঠিক কি না, তা জানে না।'
      - text: 'থামুন; কারণ খুঁজে বের করুন, backup নিশ্চিত করুন, দরকারে লেখার ধরন বদলান'
        correct: true
        why: 'ডেটাবেসের ক্ষেত্রে replace প্রায় সবসময় বিপদ। অনেক সময় একটা নাম বা attribute বদলানো এড়ালেই চলে।'
      - text: 'State ফাইল মুছে আবার শুরু করা'
        correct: false
        why: 'State মুছলে Terraform তার তৈরি resource চিনবে না, অবস্থা আরও খারাপ হবে।'
      - text: 'deletion_protection বন্ধ করে দিয়ে চালানো'
        correct: false
        why: 'এই flag ঠিক এই দুর্ঘটনা ঠেকানোর জন্যই; বন্ধ করা মানে সুরক্ষা সরিয়ে বিপদ ডাকা।'
    ref: terraform-basics
  - q: 'এক সহকর্মী কিছু পরীক্ষা করতে কনসোলে 3306 পোর্ট 0.0.0.0/0-তে খুলে দিয়েছে। Terraform ব্যবহার করা টিম তা জানবে কীভাবে?'
    hint: 'plan কী কীসের সাথে মেলায়?'
    options:
      - text: 'terraform plan বাড়তি নিয়মটাকে সরানোর মতো বদল হিসেবে দেখায়'
        correct: true
        why: 'Plan আসল infrastructure-কে কোডের সাথে মেলায়, তাই হাতে-যোগ করা জিনিস অমিল হিসেবে ওঠে।'
      - text: 'কিছু ভাঙার আগে জানার উপায় নেই'
        correct: false
        why: 'ওটা click-ops। Terraform-এ কিছু ভাঙার আগেই plan অমিলটা দেখায়।'
      - text: 'Terraform কনসোলের বদল আটকে দেয়'
        correct: false
        why: 'কনসোলের বদল Terraform আটকাতে পারে না। পরের বার plan চালালে শুধু সেটা ধরা পড়ে।'
    ref: terraform-basics
