  - q: 'নতুন release-এ migration একটা কলাম মুছে ফেলল। Deploy-এর পর bug ধরা পড়ল। এখন কোড rollback করলে কী হবে?'
    hint: 'আগের কোড কলামটা খুঁজবে না?'
    options:
