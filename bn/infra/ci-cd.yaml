      - text: 'আগের কোড ও ডেটাবেসের গঠন মিলবে না, তাই ভাঙতে পারে — migration আগে শুধু যোগ করে পরে সরানো উচিত ছিল'
        correct: true
        why: 'Expand-contract পদ্ধতিতে দুই version-ই চলার জায়গা থাকে, তাই rollback নিরাপদ।'
      - text: 'ডেটাবেস নিজে থেকেই আগের অবস্থায় ফিরে যাবে'
        correct: false
        why: 'Migration নিজে নিজে উল্টায় না; কলামের ডেটা চলে গেলে backup ছাড়া ফেরে না।'
    ref: safe-deploy-rollback
  - q: 'Staging আর production-এ কোন কোনটা আলাদা হওয়া ঠিক?'
