slides:
  - slug: friday-hand-deploy
    title: 'শুক্রবার রাতের হাতে-করা deploy'
    kind: story
    tldr: 'হাতে deploy করলে ধাপ ভুলে যায়, প্রোডাকশনে আলাদা কোড ওঠে, আর ভুল হলে ফেরার পথ থাকে না।'
    keywords: ['deploy', 'manual deploy', 'CI/CD', 'ডিপ্লয়', 'release', 'rollback']
    blocks:
      - type: text
        body: |
          রাত ১০টায় রাফি সার্ভারে ঢুকে deploy শুরু করল: `git pull`, `composer install`, `migrate`। মাঝপথে ইন্টারনেট গেল, `migrate` অর্ধেক চলে থেমে গেল। সার্ভারে নতুন কোড, ডেটাবেসে অর্ধেক পুরনো — সাইট বন্ধ, আর আগের অবস্থায় ফেরার কোনো উপায় নেই।
      - type: code
        lang: bash
        file: 'deploy.sh (হাতে চালানো)'
        variant: bad
        code: |
          ssh prod-1
          cd /var/www/shop
          git pull origin main
          composer install
          php bin/console doctrine:migrations:migrate
          php bin/console cache:clear
          sudo systemctl restart php8.3-fpm
        marks:
          - {line: 3, tip: 'সার্ভারেই কোড নামছে: এই মুহূর্তে main-এ যা আছে তা-ই চলবে, test হয়েছে কি না কেউ দেখেনি।'}
          - {line: 4, tip: 'সার্ভারেই build। dev library ও ঢুকতে পারে, আর দুই সার্ভারে দুই রকম ফল হতে পারে।'}
          - {line: 5, tip: 'মাঝপথে থামলে ডেটাবেস অর্ধেক বদলানো। কোনো সুরক্ষা জাল নেই।'}
      - type: quote
        body: 'যে কাজ মানুষ হাতে করে, সেখানে ভুল হবেই — তাই deploy হতে হবে যন্ত্রের কাজ।'
    aside:
      - type: problem
        body: 'হাতের deploy ধীর, ভয়ের, আর প্রতিবার আলাদা। CI/CD সেটাকে একটা বোরিং, বারবার চলা, পরীক্ষিত পাইপলাইনে বদলে দেয়: স্থির একটা যন্ত্র একই ধাপ চালায়, প্রথম ব্যর্থতাতেই থামে, আর আগের image রেখে দেয় বলে ফেরার পথ থাকে।'
      - type: terms
        items:
          - {term: 'CI', meaning: 'Continuous Integration: প্রতি push-এ নিজে থেকে build আর test চালানো।'}
          - {term: 'CD', meaning: 'Continuous Delivery/Deployment: পাস হওয়া কোড নিজে থেকে (বা এক ক্লিকে) সার্ভারে পৌঁছে দেওয়া।'}
    check:
      q: 'সার্ভারে গিয়ে `git pull` চালিয়ে deploy করার তিনটা বিপদ বলুন।'
      a: 'Test না হওয়া কোড উঠতে পারে, সার্ভারে সার্ভারে ফল আলাদা হতে পারে, আর মাঝপথে ব্যর্থ হলে আগের অবস্থায় ফেরার পথ থাকে না।'

  - slug: pipeline-stages
    title: 'Pipeline: কারখানার কনভেয়ার বেল্ট'
    kind: concept
    tldr: 'প্রতিটা push একই ধাপ পেরোয় — lint, test, build, scan, staging, তারপর অনুমোদন নিয়ে production। কোনো ধাপ ফেল করলে সেখানেই থামে।'
    keywords: ['pipeline', 'CI', 'stages', 'quality gate', 'পাইপলাইন', 'automated checks']
    blocks:
      - type: metaphor
        icon: gear
        title: 'বিস্কুট কারখানার লাইন'
        body: |
          কারখানায় বিস্কুট কনভেয়ারে চলে: ওজন-চেক, ভাঙা-চেক, প্যাকেট সিল। যে কোনো চেকে ফেল করলে বিস্কুট বাজারে যায় না, বেল্ট সেখানেই থামে। Pipeline হলো কোডের কনভেয়ার, আর প্রতিটা চেক এক-একটা **quality gate**।
      - type: visual
        kind: steps
        caption: 'এক push-এর যাত্রা: প্রতিটা ধাপ ফেল করলে সেখানেই থামে'
        steps:
          - {title: '১. Lint ও static analysis', body: 'PHPStan, code style, composer audit', tip: 'কয়েক সেকেন্ডে ধরা পড়া ভুল। সবচেয়ে সস্তা চেক, তাই সবার আগে।'}
          - {title: '২. Test', body: 'PHPUnit — unit আর DB সহ integration', tip: 'আসল MySQL দিয়ে চালান, নইলে SQL-এর ভুল প্রোডাকশনে গিয়ে ধরা পড়ে।'}
          - {title: '৩. Build image', body: 'একবারই; tag = git commit hash', tip: 'এই image-টাই পরে সব environment-এ যাবে, আর কোনোদিন আবার build হবে না।'}
          - {title: '৪. Scan', body: 'image-এ জানা দুর্বলতা আছে কি?', tip: 'Trivy-র মতো টুল image-এর library মিলিয়ে দেখে। গুরুতর দুর্বলতায় pipeline থামে।'}
          - {title: '৫. Staging-এ deploy', body: 'smoke test আর health check', tip: 'প্রোডাকশনের মতো পরিবেশে একই image চালিয়ে দেখুন সত্যিই ওঠে কি না।'}
          - {title: '৬. Production', body: 'অনুমোদনের পর, ধাপে ধাপে', tip: 'মানুষের এক ক্লিকের অনুমোদন থাকতে পারে, কিন্তু কাজটা যন্ত্রের।'}
      - type: quote
        body: 'Main branch সবসময় deploy করার মতো অবস্থায় থাকবে।'
    aside:
      - type: tips
        items:
          - 'Pipeline দশ মিনিটের বেশি হলে মানুষ এড়িয়ে চলে; ধীর test আলাদা করুন আর cache ব্যবহার করুন।'
          - 'Flaky (কখনো পাস, কখনো ফেল) test সারান বা বাদ দিন — নইলে কেউ ফেলকে আর বিশ্বাস করে না।'
      - type: remember
        body: 'সস্তা চেক আগে, দামি চেক পরে।'
      - type: terms
        items:
          - {term: 'Static analysis', meaning: 'কোড না চালিয়েই একটা টুল পড়ে দেখে সম্ভাব্য bug বলে দেয়, যেমন ভুল type বা না-থাকা method। PHP-তে এটা PHPStan করে।'}
          - {term: 'Staging', meaning: 'প্রোডাকশনের রিহার্সাল-কপি, যেখানে আসল ব্যবহারকারী দেখার আগেই নতুন version চালিয়ে দেখা হয়।'}
          - {term: 'Smoke test', meaning: 'deploy-এর পর সবচেয়ে জরুরি কয়েকটা পাতা তাড়াতাড়ি ঝালিয়ে দেখা। এগুলো ফেল করলে থামুন।'}
      - type: refs
        items:
          - {to: 'testing/what-to-test', label: 'কোন test কী ধরে'}
    check:
      q: 'Lint আর static analysis কেন test-এর আগে চালানো হয়?'
      a: 'কারণ এগুলো কয়েক সেকেন্ডে চলে। সস্তা চেকে ভুল ধরা পড়লে ধীর test আর build-এর সময় বাঁচে।'

  - slug: github-actions-ci
    title: 'GitHub Actions-এ CI আর image build'
    kind: howto
    tldr: 'আসল MySQL সার্ভিস সহ test চালান, পাস হলে image বানিয়ে git commit hash-এ tag দিয়ে registry-তে তুলুন।'
    keywords: ['GitHub Actions', 'CI pipeline', 'phpunit', 'docker build', 'workflow', 'ওয়ার্কফ্লো']
    blocks:
      - type: code
        lang: yaml
        file: '.github/workflows/ci.yaml (১ম অংশ)'
        variant: good
        code: |
          name: ci
          on:
            push:
              branches: [main]
            pull_request:
          jobs:
            test:
              runs-on: ubuntu-latest
              env:
                APP_ENV: test
                DATABASE_URL: mysql://root:root@127.0.0.1:3306/shop_test?serverVersion=8.0
              services:
                mysql:
                  image: mysql:8.0
                  env:
                    MYSQL_ROOT_PASSWORD: root
                    MYSQL_DATABASE: shop_test
                  ports: ['3306:3306']
                  options: --health-cmd="mysqladmin ping" --health-retries=10
              steps:
                - uses: actions/checkout@v4
                - uses: shivammathur/setup-php@v2
                  with:
                    php-version: '8.3'
                    extensions: intl, pdo_mysql
                - run: composer install --no-interaction --prefer-dist
                - run: vendor/bin/phpstan analyse
                - run: php bin/console doctrine:migrations:migrate --no-interaction
                - run: vendor/bin/phpunit
        marks:
          - {line: 5, tip: 'Pull request-এও চলে — merge-এর আগেই জানা যায় ভাঙছে কি না।'}
          - {line: 14, tip: 'প্রোডাকশনে MySQL চললে test-ও MySQL-এ। SQLite দিয়ে test করলে আচরণ আলাদা হয়ে যায়।'}
          - {line: 27, tip: 'ধাপের কমান্ড non-zero দিলেই job ফেল — pipeline এখানে থামে।'}
          - {line: 28, tip: 'ফাঁকা test ডেটাবেস প্রোডাকশনের একই migration দিয়ে বানানো হয়, তাই প্রতিটা push-এ migration-ও test হয়।'}
      - type: code
        lang: yaml
        file: '.github/workflows/ci.yaml (২য় অংশ)'
        variant: good
        code: |
            build:
              needs: test
              if: github.ref == 'refs/heads/main'
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: docker/login-action@v3
                  with:
                    registry: registry.example.com
                    username: ${{ secrets.REG_USER }}
                    password: ${{ secrets.REG_TOKEN }}
                - uses: docker/build-push-action@v6
                  with:
                    push: true
                    tags: registry.example.com/shop-api:${{ github.sha }}
        marks:
          - {line: 2, tip: 'test পাস না করলে build শুরুই হয় না।'}
          - {line: 3, tip: 'শুধু main থেকে image বানান — pull request-এর কাঁচা কোড registry-তে নয়।'}
          - {line: 11, tip: 'Registry-র পাসওয়ার্ড কোডে নয়, GitHub-এর secret store থেকে আসে।'}
          - {line: 15, tip: 'Tag হলো commit hash — এই image ঠিক কোন কোড থেকে এসেছে, তা সবসময় জানা।'}
      - type: quote
        body: 'Image-এর tag হবে git commit hash — "latest" নয়।'
    aside:
      - type: tips
        items:
          - 'Composer cache আর Docker layer cache চালু করুন — pipeline অর্ধেক সময়ে শেষ হয়।'
          - 'Secret শুধু যে job-এ দরকার সেখানেই দিন; pull request-এর fork থেকে secret পাওয়া যায় না।'
      - type: refs
        items:
          - {to: 'infra/containers-k8s', label: 'Image আর Dockerfile'}
          - {to: 'security/supply-chain-compliance', label: 'Dependency ও image নিরাপত্তা'}
    check:
      q: 'Image-এর tag হিসেবে commit hash দিলে কী সুবিধা?'
      a: 'প্রতিটা image-কে নির্দিষ্ট কোডের সাথে জোড়া যায়, আর প্রোডাকশনে কোনটা চলছে এক নজরে বোঝা যায়। Rollback মানে আগের hash-এ ফেরা।'

  - slug: build-once-promote
    title: 'একবার build, একই artifact promote'
    kind: compare
    tldr: 'Staging আর production-এ আলাদা করে build করবেন না — একই image এগিয়ে দিন, শুধু config বদলান। তাহলেই test করা জিনিসটাই প্রোডাকশনে যায়।'
    keywords: ['build once', 'promote', 'artifact', 'environment parity', 'staging', 'config']
    blocks:
      - type: metaphor
        icon: archive
        title: 'সিল করা কার্টন'
        body: |
          কারখানা বিস্কুটের কার্টন একবার সিল করে ব্যাচ নম্বর দেয়। সেই কার্টনই আগে শোরুমে যায়, পাস হলে দোকানে — কেউ খুলে আবার প্যাক করে না। প্রতিবার নতুন প্যাক করলে, যেটা পরীক্ষা হয়েছে আর যেটা বিক্রি হচ্ছে, তারা আলাদা জিনিস।
      - type: visual
        kind: flow
        caption: 'এক image, তিন জায়গা — hash 3f9a2c1 সব জায়গায় একই'
        nodes:
          - {id: ci, label: 'CI', sub: 'একবারই build', icon: gear, col: 0, row: 1, tip: 'Image এখানে শুধু একবার তৈরি হয়। পরে কেউ এটা আবার build করে না।'}
          - {id: reg, label: 'Registry', sub: 'shop-api:3f9a2c1', icon: archive, tone: accent, col: 1.5, row: 1, tip: 'Image-এর গুদাম। এই tag-এর image বদলায় না — তার ভেতরের কোড চিরস্থির।'}
          - {id: stg, label: 'Staging', sub: 'config: staging', icon: server, col: 3, row: 0, tip: 'প্রোডাকশনের প্রায় যমজ। আলাদা ডেটাবেস, আলাদা secret — কিন্তু একই image।'}
          - {id: prod, label: 'Production', sub: 'config: prod', icon: cloud, col: 3, row: 2, tip: 'আসল ব্যবহারকারীর পরিবেশ। staging-এ পাস হওয়া ঠিক সেই image-ই এখানে আসে।'}
        edges:
          - {from: ci, to: reg, label: 'CI image বানিয়ে commit hash 3f9a2c1 tag-এ তোলে'}
          - {from: reg, to: stg, label: 'Staging একই image নামিয়ে নিজের config দিয়ে চালায়'}
          - {from: stg, to: prod, label: 'Staging-এ পাস করলে একই hash production-এ পদোন্নতি পায়', tone: good, dashed: true}
      - type: visual
        kind: table
        caption: 'Environment parity: কী এক থাকবে, কী আলাদা'
        headers: ['', 'Staging', 'Production']
        rows:
          - cells: ['Image', 'shop-api:3f9a2c1', 'shop-api:3f9a2c1']
            tip: 'এক, কোনো ব্যতিক্রম নেই।'
          - cells: ['PHP ও MySQL version', '8.3 / 8.0', '8.3 / 8.0']
            tip: 'Version আলাদা হলে staging-এর পাস অর্থহীন।'
          - cells: ['Config ও secret', 'staging-এর নিজের', 'production-এর নিজের']
            tip: 'আলাদা হওয়া উচিত — ENV দিয়ে দেওয়া হয়, image-এ নয়।'
          - cells: ['ডেটা', 'নকল বা মুখোশ-পরানো', 'আসল']
            tip: 'আসল ডেটা staging-এ কপি করতে হলে ব্যক্তিগত তথ্য মুছে বা বদলে নিন।'
    aside:
      - type: problem
        body: 'Environment-এ আলাদা build করলে "staging-এ চলল, prod-এ চলল না" ঘটতে পারে। কারণ দুই build-এ library-র নতুন version আসতে পারে।'
      - type: terms
        items:
          - {term: 'Artifact', meaning: 'pipeline-এর তৈরি, বদলানো যায় না এমন ফলাফল — এখানে Docker image।'}
          - {term: 'Promote', meaning: 'পরীক্ষিত artifact-টাই পরের environment-এ পাঠানো, নতুন করে build না করে।'}
    check:
      q: 'Production-এর জন্য আবার build করলে আসল ঝুঁকিটা কী?'
      a: 'যে image staging-এ test হয়েছে, আর যেটা production-এ চলছে, তারা আলাদা জিনিস হয়ে যেতে পারে — dependency-র নতুন version বা build-পরিবেশের ফারাকে।'

  - slug: safe-deploy-rollback
    title: 'নিরাপদ deploy আর দ্রুত rollback'
    kind: howto
    tldr: 'Staging-এ smoke test, production-এ অনুমোদন, rollout status দেখা — আর ব্যর্থ হলে নিজে থেকে আগের version-এ ফেরা।'
    keywords: ['rollback', 'deploy safety', 'smoke test', 'kubectl rollout', 'approval', 'রোলব্যাক']
    blocks:
      - type: text
        body: |
          নিরাপদ deploy মানে ভুল হবে না, তা নয় — ভুল হলে মিনিটে ফিরে আসা। তাই প্রতিটা ধাপের পরে একটা পরীক্ষা, আর ব্যর্থ হলে আগের image-এ ফেরার কমান্ড তৈরি। Rollback সবচেয়ে সহজ যখন আগের image registry-তে অক্ষত আছে।
      - type: code
        lang: yaml
        file: '.github/workflows/deploy.yaml'
        variant: good
        code: |
          deploy-staging:
            environment: staging
            steps:
              - run: |
                  kubectl set image deploy/shop-api \
                    api=registry.example.com/shop-api:${{ github.sha }}
                  kubectl rollout status deploy/shop-api --timeout=120s
              - run: curl --fail --retry 5 https://staging.shop.example.com/health/ready

          deploy-prod:
            needs: deploy-staging
            environment: production # এখানে মানুষের অনুমোদন লাগে
            steps:
              - run: |
                  kubectl set image deploy/shop-api \
                    api=registry.example.com/shop-api:${{ github.sha }}
                  kubectl rollout status deploy/shop-api --timeout=180s \
                    || { kubectl rollout undo deploy/shop-api; exit 1; }
        marks:
          - {line: 7, tip: 'Rollout শেষ না হওয়া পর্যন্ত অপেক্ষা: নতুন Pod ready না হলে এই ধাপ ফেল করে।'}
          - {line: 8, tip: 'Smoke test: কয়েকটা সবচেয়ে জরুরি URL ডেকে দেখা সত্যিই সাড়া দেয় কি না।'}
          - {line: 12, tip: 'GitHub environment-এ "required reviewers" দিলে production-এ যাওয়ার আগে একজনের অনুমোদন লাগে।'}
          - {line: 18, tip: 'Rollout ব্যর্থ হলে নিজে থেকে আগের version-এ ফেরা; মানুষ ঘুম থেকে ওঠার আগেই সাইট ঠিক।'}
      - type: code
        lang: sql
        file: 'migration: customer.phone-এর নাম বদল'
        code: |
          -- BAD, এক release-এ: নতুন কোড চায় phone_e164, পুরনো কোড চায় phone।
          ALTER TABLE customer RENAME COLUMN phone TO phone_e164;
          -- কোড rollback করলে পুরনো কোড এমন কলাম খুঁজবে যা আর নেই।

          -- GOOD, release 1 (expand): নতুন কলাম যোগ, পুরনোটা থাকুক, দুটোতেই লেখা।
          ALTER TABLE customer ADD phone_e164 VARCHAR(20) NULL;
          -- আগের কোডে ফেরা নিরাপদ: সে নতুন কলাম দেখেই না।

          -- GOOD, release 2: পুরনো row ছোট ছোট batch-এ কপি করুন, আর শুধু phone_e164 পড়ুন।

          -- GOOD, release 3 (contract): আর কোনো চালু কোড phone ব্যবহার করে না, এবার মুছুন।
          ALTER TABLE customer DROP COLUMN phone;
        marks:
          - {line: 2, tip: 'এক ধাপের rename ফেরার পথই ভাঙে। এটা চলার পর শুধু নতুন কোডই চলে, তাই rollback মানে এক বিপদ ছেড়ে আরেক বিপদে যাওয়া।'}
          - {line: 6, tip: 'Nullable কলাম যোগ করলে পুরনো কোডের কিছুই বদলায় না, তাই প্রতিটা release rollback-নিরাপদ। দাম: এক release-এর জায়গায় তিনটা।'}
          - {line: 12, tip: 'ধ্বংসাত্মক ধাপটা শেষে, যখন কলামটা আর কারও লাগে না। একবার মুছলে ডেটা ফেরাতে শুধু backup-ই ভরসা।'}
      - type: quote
        body: 'Rollback-এর পথ deploy-এর আগেই ঠিক করে রাখুন।'
    aside:
      - type: pitfalls
        items:
          - 'Migration-এ কলাম মুছে ফেললে কোড rollback করেও আর লাভ নেই — আগের কোড কলামটা খুঁজবে। Migration হবে backward-compatible (expand, তারপর contract)।'
          - 'Rollback কখনো পরীক্ষা না করা। মাঝে মাঝে staging-এ ইচ্ছে করে চালিয়ে দেখুন।'
      - type: refs
        items:
          - {to: 'data/zero-downtime-migrations', label: 'Backward-compatible migration'}
          - {to: 'resilience/zero-downtime-deploys', label: 'Canary আর blue-green'}
      - type: commands
        title: 'Rollback'
        items:
          - {cmd: 'kubectl rollout history deploy/shop-api', desc: 'আগের revision-গুলো দেখুন'}
          - {cmd: 'kubectl rollout undo deploy/shop-api', desc: 'আগের version-এ ফিরুন'}
    check:
      q: 'কোড rollback করলেও ডেটাবেস migration-এর কারণে কাজ না করতে পারে — কখন?'
      a: 'যখন migration আগের কোডের দরকারি কলাম বা টেবিল মুছে ফেলেছে। তাই migration আগে শুধু যোগ করবেন (expand), পুরনোটা পরে সরাবেন।'

  - slug: pipeline-pitfalls
    title: 'Pipeline-এর তিনটা ক্লাসিক ফাঁদ'
    kind: pitfall
    tldr: 'প্রোডাকশনে আবার build, সার্ভারে secret রেখে দেওয়া, আর ফেল-করা test এড়িয়ে যাওয়া — তিনটাই pipeline-এর উদ্দেশ্য নষ্ট করে।'
    keywords: ['pipeline pitfalls', 'secret', 'rebuild', 'flaky tests', 'CI mistakes']
    blocks:
      - type: code
        lang: yaml
        file: '.github/workflows/bad.yaml'
        variant: bad
        code: |
          deploy-prod:
            steps:
              - uses: actions/checkout@v4
              - run: composer install
              - run: docker build -t shop-api:latest .
              - run: docker push shop-api:latest
              - run: kubectl rollout restart deploy/shop-api
                continue-on-error: true
        marks:
          - {line: 5, tip: 'প্রোডাকশনের জন্য আবার build — staging-এ test হওয়া image-এর সাথে এটার কোনো গ্যারান্টি-সম্পর্ক নেই।'}
          - {line: 6, tip: '"latest" ঢেলে দেওয়া মানে আগের version হারিয়ে ফেলা; rollback করার কিছু থাকে না।'}
          - {line: 8, tip: 'ব্যর্থ হলেও pipeline সবুজ — কেউ জানে না deploy আসলে হয়নি।'}
      - type: code
        lang: yaml
        file: '.github/workflows/deploy.yaml'
        variant: good
        code: |
          deploy-prod:
            needs: deploy-staging
            environment: production
            steps:
              - run: |
                  kubectl set image deploy/shop-api \
                    api=registry.example.com/shop-api:${{ github.sha }}
                  kubectl rollout status deploy/shop-api --timeout=180s
        marks:
          - {line: 2, tip: 'Staging পাস করলেই চলে, আর কিছু build করে না: staging যে image প্রমাণ করেছে সেটাই নেয়।'}
          - {line: 6, tip: 'Tag হলো commit hash, "latest" নয়। আগের hash registry-তে আছে, তাই ফেরার মতো কিছু থাকে।'}
          - {line: 8, tip: 'continue-on-error নেই। Rollout ব্যর্থ হলে এই ধাপ ফেল করে, pipeline লাল হয়।'}
      - type: points
        title: 'ঠিক উপায়'
        style: check
        items:
          - 'Build একবারই; deploy ধাপে শুধু tag বদলান'
          - 'প্রতিটা ধাপ ব্যর্থ হলে pipeline থামুক, ঢাকবে না'
          - 'Secret থাকবে CI-এর secret store-এ, কোড বা image-এ নয়'
          - 'Flaky test ঠিক করুন, "আবার চালান" অভ্যাস নয়'
      - type: quote
        body: 'সবুজ pipeline তখনই মূল্যবান, যখন লাল হলে সবাই থামে।'
    aside:
      - type: story
        title: 'সবসময় সবুজ'
        body: |
          এক টিমের pipeline সবসময় সবুজ ছিল — কারণ test ধাপে `|| true` বসানো ছিল। একদিন একটা মারাত্মক bug প্রোডাকশনে গেল, অথচ test আগের দুই সপ্তাহ ধরেই ফেল করছিল।
      - type: when
        use: ['প্রতিটা ধাপের ফেল মানে pipeline থামা', 'আগের version-এর image সবসময় registry-তে রাখা']
        avoid: ['continue-on-error বা || true দিয়ে ফেল লুকানো']
    check:
      q: 'Deploy ধাপে `continue-on-error: true` দেওয়া কেন বিপজ্জনক?'
      a: 'Deploy ব্যর্থ হলেও pipeline সবুজ দেখায়, তাই কেউ জানতেই পারে না যে নতুন version ওঠেনি — বা অর্ধেক উঠেছে।'

flashcards:
  - q: 'CI আর CD-এর পার্থক্য কী?'
    a: 'CI: প্রতিটা push-এ নিজে থেকে build ও test। CD: পাস হওয়া কোড নিজে থেকে (বা এক ক্লিকে) সার্ভারে পৌঁছে দেওয়া।'
    more: |
      CI-এর মূল প্রশ্ন "কোডটা কি ভাঙেনি?"। CD-র মূল প্রশ্ন "কোডটা নিরাপদে ব্যবহারকারীর কাছে পৌঁছাল কি?"। Continuous delivery-তে শেষ ধাপে মানুষের অনুমোদন থাকে; continuous deployment-এ তা-ও থাকে না।
    ref: friday-hand-deploy
  - q: 'কেন সার্ভারে গিয়ে হাতে git pull করে deploy করা উচিত নয়?'
    a: 'ধাপ ভুলে যেতে পারে, test না হওয়া কোড উঠতে পারে, সার্ভারে সার্ভারে ফল আলাদা হয়, আর ফেরার পথ থাকে না।'
    more: |
      Pipeline প্রতিবার একই ধাপ একই ক্রমে চালায় এবং কে কী deploy করল তার রেকর্ড রাখে। হাতের deploy-এ এই দুটোই নেই।
    ref: friday-hand-deploy
  - q: 'Pipeline-এ সস্তা চেক আগে কেন চালানো হয়?'
    a: 'Lint বা static analysis কয়েক সেকেন্ডে চলে। সেখানে ভুল ধরা পড়লে ধীর test আর build-এর সময় বাঁচে।'
    more: |
      সাধারণ ক্রম: lint → static analysis → unit test → integration test → build → scan → deploy। যত ডানে যান, চেক তত ধীর আর দামি।
    ref: pipeline-stages
  - q: 'Quality gate কী?'
    a: 'Pipeline-এর এমন ধাপ, যেটা ফেল করলে কোড পরের ধাপে যেতে পারে না।'
    more: |
      যেমন test পাস না করলে build হবে না, scan-এ গুরুতর দুর্বলতা মিললে deploy হবে না। Gate কাজ করে তখনই, যখন ফেল সত্যিই pipeline থামায়।
    ref: pipeline-stages
  - q: 'CI-তে test কেন আসল MySQL দিয়ে চালানো উচিত?'
    a: 'প্রোডাকশনের মতো ডেটাবেসে চালালে SQL, ইনডেক্স আর migration-এর আসল আচরণ ধরা পড়ে। SQLite-এ এগুলো আলাদা।'
    more: |
      GitHub Actions-এ services দিয়ে MySQL container চালানো যায়। Version-ও প্রোডাকশনের সাথে মেলান (MySQL 8.0 হলে 8.0)।
    ref: github-actions-ci
  - q: 'Build once, promote the same artifact — মানে কী?'
    a: 'Image একবারই build হয়; সেই একই image staging থেকে production-এ যায়। শুধু config বদলায়, কোড নয়।'
    more: |
      এতে test করা জিনিস আর চালানো জিনিস সবসময় এক। প্রতি environment-এর জন্য আবার build করলে dependency-র নতুন version ঢুকে ফল আলাদা হতে পারে।
    ref: build-once-promote
  - q: 'Environment parity বলতে কী বোঝায়?'
    a: 'Staging আর production যতটা সম্ভব এক রাখা: একই image, একই PHP ও ডেটাবেস version। আলাদা শুধু config, secret আর ডেটা।'
    more: |
      Version আলাদা হলে staging-এ পাস করা মানে প্রোডাকশনে পাস করা নয়। Config আলাদা হয় ENV variable দিয়ে, image-এর ভেতরে লেখা থাকে না।
    ref: build-once-promote
  - q: 'দ্রুত rollback সম্ভব রাখতে কী কী লাগে?'
    a: 'আগের image registry-তে অক্ষত থাকা, commit-hash tag, আর backward-compatible migration।'
    more: |
      Kubernetes-এ `kubectl rollout undo` এক কমান্ডে আগের Deployment-এ ফেরে। কিন্তু migration যদি পুরনো কলাম মুছে ফেলে, কোড ফিরলেও অ্যাপ চলে না — তাই migration আগে যোগ করে, পরে মুছে।
    ref: safe-deploy-rollback
  - q: 'Rollback না ভেঙে ডেটাবেসের কলামের নাম বদলাবেন কীভাবে?'
    a: 'Expand, তারপর contract: নতুন কলাম যোগ করে দুটোতেই লিখুন, পড়া নতুনটায় সরান, আর পুরনোটা পরের release-এ মুছুন।'
    more: |
      এক ধাপের rename-এ পুরনো কোড এমন কলাম খোঁজে যা আর নেই, তাই rollback মানে এক বিপদ ছেড়ে আরেক বিপদ। দাম: এক release-এর জায়গায় তিনটা। তাই শুধু সেই বদলে এটা করুন, যেটা rollback-নিরাপদ রাখা দরকার।
    ref: safe-deploy-rollback

quiz:
  - q: 'নিচের pipeline-এ কোন সমস্যাগুলো আছে?'
    lang: yaml
    code: |
      deploy-prod:
        steps:
          - run: docker build -t shop-api:latest .
          - run: docker push shop-api:latest
          - run: kubectl rollout restart deploy/shop-api
            continue-on-error: true
    hint: 'কোন image deploy হচ্ছে, আর ব্যর্থ হলে কী ঘটে?'
    options:
      - text: 'Production-এর জন্য আবার build — staging-এ test হওয়া image নয়'
        correct: true
        why: 'ফলে test করা আর চালানো জিনিস আলাদা হতে পারে।'
      - text: '"latest" tag — কোন কোড চলছে জানা যায় না, rollback-ও কঠিন'
        correct: true
        why: 'প্রতিবার একই tag ওভাররাইট হয়, আগের version হারিয়ে যায়।'
      - text: 'continue-on-error: ব্যর্থ deploy-ও সবুজ দেখায়'
        correct: true
        why: 'কেউ জানেই না যে নতুন version ওঠেনি।'
      - text: 'YAML-এ কমান্ড লেখা ভুল, শুধু shell script ব্যবহার করা উচিত'
        correct: false
        why: 'Pipeline-এ কমান্ড লেখা স্বাভাবিক; সমস্যা কমান্ডের উদ্দেশ্য ও ক্রমে।'
    ref: pipeline-pitfalls
  - q: 'তানভীরের টিমে প্রতিটা PR-এ pipeline ৪০ মিনিট নেয়, তাই সবাই merge-এর পরে test দেখে। সবচেয়ে ভালো প্রথম পদক্ষেপ কী?'
