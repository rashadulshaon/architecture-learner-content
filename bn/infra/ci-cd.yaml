      - text: 'Cache চালু করা, পরস্পর-নির্ভর নয় এমন ধাপ সমান্তরালে চালানো, ধীর test আলাদা করা'
        correct: true
        why: 'নিরাপত্তা না কমিয়ে সময় কমানোর স্বীকৃত পথ। দ্রুত ফিডব্যাক মানুষকে pipeline-এ ভরসা রাখতে দেয়।'
      - text: 'শুধু release-এর আগে pipeline চালানো'
        correct: false
