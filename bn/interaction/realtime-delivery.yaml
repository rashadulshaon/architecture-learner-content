flashcards:
  - q: 'Polling কেন বড় পরিসরে ব্যয়বহুল?'
    a: 'প্রতিটা ব্যবহারকারী নির্দিষ্ট ব্যবধানে request পাঠায়, আর বেশিরভাগই "কিছু বদলায়নি" উত্তর। বদল না থাকলেও সার্ভারের পুরো খরচ হয়।'
    more: |
      ১০ হাজার ব্যবহারকারী ২ সেকেন্ড পরপর poll করলে সেকেন্ডে ৫০০০ request হয়। বদল ঘটে ঘণ্টায় হয়তো তিনবার, তাই push-এ সেকেন্ডে মাত্র কয়েকটা বার্তা লাগে।
    ref: are-we-there-yet
  - q: 'SSE (Server-Sent Events) কী?'
    a: 'একটাই খোলা HTTP সংযোগে সার্ভার থেকে ব্রাউজারে একমুখী বার্তা। ব্রাউজারে `EventSource` দিয়ে শোনা হয়।'
    more: |
      সাধারণ HTTP বলে proxy, auth আর load balancer-এর সাথে ঝামেলা কম। সংযোগ কাটলে ব্রাউজার নিজেই আবার জোড়ে। তবে ব্রাউজার থেকে সার্ভারে পাঠাতে আলাদা POST লাগে।
    ref: four-ways
  - q: 'SSE আর WebSocket-এর মধ্যে কীভাবে বাছবে?'
    a: 'শুধু সার্ভার থেকে খবর দিলে SSE। চ্যাট, গেম বা সহযোগী এডিটরের মতো দুই দিকে ঘন কথা চললে WebSocket।'
    more: |
      WebSocket আলাদা protocol, তাই reconnect, auth আর scaling নিজে সামলাতে হয়। বেশিরভাগ বিজনেস অ্যাপের প্রয়োজন "অবস্থা বদলালে জানাও", যেটা SSE-তে সহজে হয়।
    ref: four-ways
  - q: 'Long-polling কী?'
    a: 'ক্লায়েন্ট request পাঠায়, সার্ভার নতুন কিছু না আসা পর্যন্ত উত্তর ধরে রাখে। উত্তর পেয়ে ক্লায়েন্ট আবার request পাঠায়।'
    more: |
      সাধারণ polling-এর চেয়ে কম খালি request যায়। তবে প্রতি বদলের পরে নতুন সংযোগ লাগে আর reconnect-এর কোড নিজে লিখতে হয়। SSE আসার আগে এটা সাধারণ পথ ছিল।
    ref: four-ways
  - q: 'Mercure কী, আর Symfony-র ভূমিকা কী?'
    a: 'Mercure একটা hub যা SSE সংযোগ ধরে রাখে। Symfony শুধু `HubInterface::publish(new Update(...))` ডেকে বার্তা দেয়।'
    more: |
      সংযোগ ধরে রাখার ভার hub-এর, তাই PHP-FPM-কে অনেক খোলা সংযোগ সামলাতে হয় না। ব্যক্তিগত ডেটার জন্য `private: true` দিয়ে subscriber-এর JWT-তে topic-এর অনুমতি দেখা হয়।
    ref: mercure-publish
  - q: 'Vue-তে EventSource ব্যবহারের তিনটা সতর্কতা কী?'
    a: 'প্রথমে বর্তমান অবস্থা আনো, private topic-এ `withCredentials: true` দাও, আর unmount-এ `close()` ডাকো।'
    more: |
      লাইভ সংযোগের আগে বা মাঝে বার্তা হারাতে পারে, তাই আগে সাধারণ GET-এ সত্যি অবস্থাটা আনা জরুরি। `close()` না করলে প্রতিবার পাতায় ঢুকলে একটা করে সংযোগ জমে।
    ref: vue-eventsource
  - q: 'Presence (কে online) কীভাবে ঠিকঠাক মাপা হয়?'
    a: 'ক্লায়েন্ট নিয়মিত heartbeat পাঠায়, সার্ভার Redis-এ key রাখে TTL সহ। TTL পেরোলে key মুছে যায়, তখন ব্যবহারকারী offline।'
    more: |
      শুধু "সংযোগ খোলা কি না" দেখলে ভুল হয়, কারণ মোবাইল সংযোগ চুপচাপ মরে যায় আর সার্ভার টের পায় না। Heartbeat-এর ব্যবধান TTL-এর অর্ধেকের মতো রাখো, যাতে একটা হারালেও চলে।
    ref: scale-presence-push
  - q: 'ব্যবহারকারী অ্যাপ বন্ধ রাখলে কীভাবে জানাবে?'
    a: 'Push notification (FCM বা Web Push) দিয়ে। এতে কোনো খোলা সংযোগ লাগে না, বার্তা ফোনের OS-এর মাধ্যমে যায়।'
    more: |
      Push বার্তা ছোট রাখো আর ব্যবহারকারী অ্যাপ খুললে সার্ভার থেকে বর্তমান অবস্থা আনো। বার্তাটা শুধু ডাক দেয়, তথ্যের উৎস নয়।
    ref: scale-presence-push

quiz:
  - q: 'অর্ডার-ট্র্যাকিং পাতায় অবস্থা বদলালে ব্যবহারকারীকে সাথে সাথে জানাতে চাও। কোনটা সবচেয়ে উপযুক্ত?'
    hint: 'বার্তা কোন দিকে যাচ্ছে?'
    options:
      - text: 'প্রতি সেকেন্ডে poll করা'
        correct: false
        why: 'হাজার ব্যবহারকারীতে বিশাল অপচয়, আর তবুও এক সেকেন্ড পর্যন্ত দেরি।'
      - text: 'SSE, Symfony Mercure দিয়ে'
        correct: true
        why: 'একমুখী খবর, সাধারণ HTTP, ব্রাউজার নিজেই reconnect করে।'
      - text: 'WebSocket, কারণ সেটাই সবচেয়ে আধুনিক'
        correct: false
        why: 'এখানে ব্রাউজার থেকে ঘন বার্তা যাচ্ছে না, তাই WebSocket-এর বাড়তি জটিলতা অকারণ।'
    ref: four-ways
  - q: 'কোন বাক্যগুলো সঠিক?'
    hint: 'প্রতিটা প্রযুক্তি কী কাজে জন্মেছে ভাবো।'
    options:
      - text: 'SSE শুধু সার্ভার থেকে ক্লায়েন্টে'
        correct: true
        why: 'ব্রাউজার থেকে সার্ভারে পাঠাতে সাধারণ POST ব্যবহার করতে হয়।'
      - text: 'WebSocket-এ দুই দিকেই বার্তা যায়'
        correct: true
        why: 'একই সংযোগে ক্লায়েন্ট ও সার্ভার দুজনেই যখন-তখন পাঠাতে পারে।'
      - text: 'EventSource সংযোগ কাটলে আর কখনো জোড়ে না'
        correct: false
        why: 'ব্রাউজার নিজেই আবার জোড়ে আর Last-Event-ID পাঠায়।'
      - text: 'Long-polling-এ সার্ভার কখনো উত্তর ধরে রাখে না'
        correct: false
        why: 'ধরে রাখাই এর মূল কৌশল: নতুন কিছু না আসা পর্যন্ত উত্তর আটকে থাকে।'
    ref: four-ways
  - q: 'এই Vue কোডে কী কী ভুল আছে?'
    lang: ts
    code: |
      onMounted(() => {
        const source = new EventSource('/hub?topic=orders/' + props.orderId)
        source.onmessage = (e) => {
          status.value = JSON.parse(e.data).status
        }
      })
    hint: 'পাতা ছাড়ার পরে সংযোগটার কী হবে? আর topic ব্যক্তিগত হলে?'
    options:
      - text: 'unmount-এ source.close() নেই, সংযোগ জমতে থাকবে'
        correct: true
        why: '`source` ভেরিয়েবলও onMounted-এর ভেতরে, তাই বাইরে থেকে বন্ধ করার উপায়ই নেই।'
      - text: 'private topic হলে `withCredentials: true` নেই, ব্রাউজার cookie পাঠাবে না'
        correct: true
        why: 'ভিন্ন origin-এর hub-এ cookie যেতে `withCredentials` লাগে, নইলে অনুমতি মেলে না।'
      - text: 'বর্তমান অবস্থা আগে না আনায় সংযোগের আগের বদল ব্যবহারকারী দেখে না'
        correct: true
        why: 'লাইভ আপডেট শুধু নতুন বদল আনে। প্রথমে সাধারণ GET-এ সত্যি অবস্থা আনতে হয়।'
      - text: '`JSON.parse` ব্যবহার করা যায় না'
        correct: false
        why: 'e.data একটা string, তাই JSON.parse-ই সঠিক।'
    ref: vue-eventsource
  - q: 'ব্যবহারকারী ফোনের অ্যাপ বন্ধ রেখেছে। অর্ডার পৌঁছাল, কীভাবে জানাবে?'
    hint: 'কোনো খোলা সংযোগ আছে কি?'
    options:
      - text: 'SSE সংযোগে পাঠাব'
        correct: false
        why: 'অ্যাপ বন্ধ, তাই কোনো খোলা সংযোগই নেই।'
      - text: 'Push notification (FCM/Web Push) পাঠাব, আর অ্যাপ খুললে সার্ভার থেকে অবস্থা আনব'
        correct: true
        why: 'OS-এর push পথে সংযোগ ছাড়াই পৌঁছায়, আর বর্তমান অবস্থা সার্ভার থেকেই নেওয়া উচিত।'
      - text: 'প্রতি সেকেন্ডে poll চালাব'
        correct: false
        why: 'অ্যাপ বন্ধ থাকলে poll করার কেউ নেই।'
    ref: scale-presence-push
  - q: 'PHP-FPM-এ SSE সংযোগ ধরে রাখলে কী সমস্যা, আর সমাধান কী?'
    hint: 'প্রতিটা খোলা সংযোগ কী ধরে রাখে?'
    options:
      - text: 'প্রতিটা সংযোগ একটা FPM worker আটকে রাখে; আলাদা hub (Mercure) রাখে সংযোগ'
        correct: true
        why: 'worker সংখ্যা সীমিত, তাই হাজার সংযোগে সাধারণ অনুরোধও আটকে যায়।'
      - text: 'কোনো সমস্যা নেই, PHP-FPM হাজার সংযোগ সহজেই ধরে'
        correct: false
        why: 'FPM-এ প্রতি request একটা worker নেয়, তাই খোলা সংযোগ দ্রুত worker ফুরিয়ে দেয়।'
      - text: 'শুধু আরও RAM বাড়ালেই সমস্যা মেটে'
        correct: false
        why: 'সীমা worker সংখ্যায়; RAM বাড়ালে খরচ বাড়ে, গঠনগত সমস্যা থেকেই যায়।'
    ref: mercure-publish
