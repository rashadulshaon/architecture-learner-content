slides:
  - slug: are-we-there-yet
    title: '"হয়েছে?" "হয়নি।" প্রতি দুই সেকেন্ডে'
    kind: story
    tldr: 'অর্ডারের অবস্থা দেখতে প্রতি ২ সেকেন্ডে সার্ভারকে জিজ্ঞাসা করলে প্রায় সব request খালি ফেরে, তবু সার্ভারের পুরো খরচ হয়।'
    keywords: ['polling', 'real-time', 'push', 'server load', 'পোলিং', 'রিয়েল টাইম', 'লাইভ আপডেট']
    blocks:
      - type: metaphor
        icon: shop
        title: 'চায়ের দোকানে বারবার জিজ্ঞাসা'
        body: |
          পনেরো জন খদ্দের কাউন্টারে এসে প্রতি মিনিটে জিজ্ঞাসা করছে "আমার চা হয়েছে?"। কাউন্টারের লোক জবাব দিতে দিতেই ক্লান্ত, আসল কাজ আটকে যায়। দোকান যদি টোকেন নম্বর ডেকে বা ঘণ্টা বাজিয়ে জানিয়ে দিত, তাহলে কেউ জিজ্ঞাসাই করত না। Polling হলো প্রথমটা, **push** হলো দ্বিতীয়টা।
      - type: visual
        kind: bars
        caption: '১০ হাজার ব্যবহারকারী, প্রতিজনের অর্ডারে ঘণ্টায় ৩টা পরিবর্তন'
        items:
          - {label: 'Polling (২s)', value: 5000, display: '৫০০০/সেকেন্ড', tone: bad, tip: '১০ হাজার জন ÷ ২ সেকেন্ড। এর প্রায় সবই "কিছু বদলায়নি" উত্তর।'}
          - {label: 'Push', value: 8, display: '~৮/সেকেন্ড', tone: good, tip: '১০ হাজার × ৩ পরিবর্তন ÷ ৩৬০০ সেকেন্ড। শুধু সত্যিকারের পরিবর্তনেই বার্তা যায়।'}
      - type: quote
        body: 'বারবার জিজ্ঞাসা করার বদলে, বদল হলে সার্ভার নিজে জানাবে।'
    aside:
      - type: story
        title: 'ম্যাচের রাতে লাইভ স্কোর'
        body: |
          এক স্পোর্টস সাইট লাইভ স্কোরের জন্য প্রতি সেকেন্ডে poll করত। ফাইনাল ম্যাচে ট্রাফিক ২০ গুণ হলো, ডেটাবেস নুয়ে পড়ল, আর যে মুহূর্তে স্কোর বদলাল সেই মুহূর্তেই সাইট বন্ধ।
      - type: terms
        items:
          - {term: 'Polling', meaning: 'ক্লায়েন্ট নির্দিষ্ট ব্যবধানে সার্ভারকে জিজ্ঞাসা করে।'}
          - {term: 'Push', meaning: 'সার্ভার বদল হলেই ক্লায়েন্টকে নিজে থেকে জানায়।'}
    check:
      q: 'সার্ভার ১০ হাজার ব্যবহারকারীকে ২ সেকেন্ড পরপর poll করতে দিলে সেকেন্ডে কত request আসে, আর কেন সেটা অপচয়?'
      a: 'সেকেন্ডে ৫০০০টা। প্রায় সবই "কিছু বদলায়নি" উত্তর, তবুও প্রতিটার জন্য সার্ভার পুরো request চালায়।'

  - slug: four-ways
    title: 'Polling, long-polling, SSE, WebSocket'
    kind: compare
    tldr: 'সার্ভার থেকে ব্রাউজারে একমুখী খবর হলে SSE সহজ ও যথেষ্ট; দুই দিকে ঘন কথা চললে তবেই WebSocket।'
    keywords: ['SSE', 'WebSocket', 'long polling', 'Server-Sent Events', 'push notification', 'রিয়েল টাইম', 'ওয়েবসকেট']
    blocks:
      - type: metaphor
        icon: phone
        title: 'চা দোকানের চার রকম খবর'
        body: |
          **Polling**: খদ্দের বারবার জিজ্ঞাসা করে। **Long-polling**: "চা হলে ডেকো" বলে খদ্দের দাঁড়িয়ে থাকে, ডাক পেলে আবার দাঁড়ায়। **SSE**: দোকানের রেডিও, সার্ভার একতরফা খবর বাজায়। **WebSocket**: ফোন কল, দুই পক্ষই যখন-তখন কথা বলে।
      - type: visual
        kind: table
        caption: 'চার ধরনের কানেকশন পাশাপাশি'
        headers: ['', 'Polling', 'Long-polling', 'SSE', 'WebSocket']
        rows:
          - cells: ['দিক', 'ক্লায়েন্ট জিজ্ঞাসা করে', 'সার্ভার উত্তর ধরে রাখে', 'সার্ভার থেকে ক্লায়েন্টে', 'দুই দিকেই']
            tip: 'SSE শুধু এক দিকে: সার্ভার থেকে ব্রাউজারে। ব্রাউজার থেকে সার্ভারে পাঠাতে সাধারণ POST-ই চলে।'
          - cells: ['সংযোগ', 'প্রতিবার নতুন', 'প্রতি উত্তরের পর নতুন', 'একটাই খোলা HTTP', 'একটাই, HTTP থেকে upgrade']
            tip: 'SSE সাধারণ HTTP, তাই proxy, auth, load balancer আগের মতোই কাজ করে। WebSocket-এ আলাদা protocol আসে।'
          - cells: ['Reconnect', 'নিজেই (পরের poll)', 'কোডে লিখতে হয়', 'ব্রাউজার নিজেই, Last-Event-ID সহ', 'কোডে লিখতে হয়']
            tip: 'SSE-তে সংযোগ কাটলে ব্রাউজার নিজে আবার জোড়ে আর শেষ event id পাঠায়, তাই হারানো বার্তা ফেরত আসে।'
          - cells: ['কোথায় মানায়', 'কম আপডেট, কম চাপ', 'পুরনো পরিবেশ, fallback', 'স্ট্যাটাস, ফিড, নোটিফিকেশন', 'চ্যাট, গেম, সহযোগী এডিটর']
            tip: 'বেশিরভাগ বিজনেস অ্যাপের প্রয়োজন "সার্ভার জানাবে" ধরনের, যেখানে SSE যথেষ্ট।'
      - type: points
        title: 'কোনটা বাছবে'
        style: check
        items:
          - 'সার্ভার শুধু জানায় (অর্ডার স্ট্যাটাস, ফিড, নোটিফিকেশন): SSE।'
          - 'দুই দিকে ঘন ঘন বার্তা (চ্যাট, গেম, একসাথে এডিট): WebSocket।'
          - 'ব্যবহারকারী অ্যাপে নেই: push notification (FCM বা Web Push), কারণ তখন কোনো খোলা সংযোগ নেই।'
    aside:
      - type: when
        use: ['SSE: HTTP/2 বা HTTP/3-এ ডজন ডজন সংযোগ নিয়ে সমস্যা নেই']
        avoid: ['WebSocket: শুধু "অর্ডার তৈরি হয়েছে" জানাতে এটা ব্যবহার করা অতিরিক্ত']
      - type: pitfalls
        items:
          - 'HTTP/1.1-এ ব্রাউজার একই ডোমেনে মাত্র ৬টা সংযোগ দেয়; ৬টা SSE ট্যাব খুললে সব আটকে যায়। HTTP/2 এটা ঠিক করে।'
    check:
      q: 'অর্ডারের অবস্থা সার্ভার থেকে ব্রাউজারে জানাতে হবে। SSE নাকি WebSocket, কেন?'
      a: 'SSE। বার্তা এক দিকে (সার্ভার থেকে ব্রাউজার), সাধারণ HTTP-তেই চলে, reconnect আর Last-Event-ID ব্রাউজার নিজেই সামলায়। WebSocket-এর জটিলতা এখানে বাড়তি।'

  - slug: mercure-publish
    title: 'Symfony Mercure: সার্ভার থেকে publish'
    kind: howto
    tldr: 'Mercure hub SSE-র সংযোগ ধরে রাখে; Symfony শুধু HubInterface দিয়ে Update publish করে, আর private topic-এ cookie-তে অনুমতি দেয়।'
    keywords: ['Mercure', 'HubInterface', 'Update', 'private update', 'JWT', 'setCookie', 'মার্কিউর']
    blocks:
      - type: text
        body: |
          PHP-FPM অনেক সংযোগ খোলা রাখার জন্য তৈরি নয়। তাই সংযোগ রাখে আলাদা **Mercure hub** (Go-তে লেখা, FrankenPHP-তেও আছে)। Symfony শুধু hub-কে বলে "এই topic-এ এই ডেটা দাও", hub সেটা সব subscriber-কে পাঠায়। ব্যক্তিগত ডেটার জন্য update `private` রাখো আর ব্যবহারকারীকে শুধু তার নিজের topic-এ অনুমতি দাও।
      - type: code
        lang: php
        file: 'src/MessageHandler/PublishOrderStatusHandler.php'
        variant: good
        code: |
          #[AsMessageHandler]
          final readonly class PublishOrderStatusHandler
          {
              public function __construct(private HubInterface $hub) {}

              public function __invoke(OrderStatusChanged $e): void
              {
                  $this->hub->publish(new Update(
                      topics: 'https://shop.example/orders/'.$e->orderId,
                      data: json_encode(['status' => $e->status], JSON_THROW_ON_ERROR),
                      private: true,
                  ));
              }
          }
        marks:
          - {line: 9, tip: 'topic হলো একটা URL-ধরনের নাম। শুধু যারা এই নামে subscribe করেছে তারা পায়।'}
          - {line: 11, tip: '`private: true` মানে শুধু অনুমতিপ্রাপ্ত subscriber পাবে; JWT ছাড়া কেউ দেখতে পারবে না।'}
      - type: code
        lang: php
        file: 'src/Controller/OrderLiveController.php'
        variant: good
        code: |
          #[Route('/orders/{id}/live', methods: ['GET'])]
          #[IsGranted('VIEW', subject: 'order')]
          public function live(
              Order $order,
              Request $request,
              Authorization $authorization,
              HubInterface $hub,
          ): JsonResponse {
              $topic = 'https://shop.example/orders/'.$order->getId();
              $authorization->setCookie($request, [$topic]);   // শুধু এই topic শোনার অনুমতি

              return $this->json(['hub' => $hub->getPublicUrl(), 'topic' => $topic]);
          }
        marks:
          - {line: 2, tip: 'আগে Symfony-র নিজের voter দিয়ে যাচাই: অর্ডারটা কি এই ব্যবহারকারীর?'}
          - {line: 10, tip: 'subscriber JWT একটা cookie-তে বসে। এতে শুধু এই একটা topic-এর অনুমতি আছে।'}
    aside:
      - type: tips
        items:
          - 'Publish মূল transaction commit হওয়ার পরেই করো। এখানে Messenger handler-এ রাখাই সেজন্য।'
          - 'SPA আলাদা ডোমেনে চললে cookie-র domain আর `SameSite` ঠিক করো, নইলে hub cookie পাবে না।'
      - type: refs
        items:
          - {to: 'messaging/events-vs-commands', label: 'Messenger আর event'}
    check:
      q: 'Mercure-এ update `private: true` না দিলে কী হতে পারে?'
      a: 'topic-এর নাম জানা যে কেউ subscribe করে অন্যের অর্ডারের আপডেট দেখতে পারে। private দিলে hub subscriber-এর JWT-তে topic-এর অনুমতি আছে কি না দেখে।'

  - slug: vue-eventsource
    title: 'Vue-তে EventSource: শুনো, আর বন্ধ করতে ভুলো না'
    kind: howto
    tldr: 'আগে সাধারণ GET-এ বর্তমান অবস্থা আনো, তারপর EventSource-এ লাইভ বদল শোনো; unmount-এ close() করো যাতে সংযোগ জমে না থাকে।'
    keywords: ['EventSource', 'Vue 3', 'Last-Event-ID', 'onBeforeUnmount', 'withCredentials', 'script setup']
    blocks:
      - type: text
        body: |
          পাতা খুললে প্রথমে সাধারণ GET-এ অর্ডারের বর্তমান অবস্থা আসে, তারপর `EventSource` শুধু নতুন বদলগুলো শোনে। দুটো একসাথে লাগে, কারণ সংযোগ জোড়ার আগে ঘটা বদল লাইভ স্ট্রিমে আসে না। আর কম্পোনেন্ট সরে গেলে সংযোগ নিজে বন্ধ করতে হয়।
      - type: code
        lang: vue
        file: 'src/components/OrderLiveStatus.vue'
        variant: good
        code: |
          <script setup lang="ts">
          import { ref, onMounted, onBeforeUnmount } from 'vue'

          const props = defineProps<{ orderId: number; initialStatus: string }>()
          const status = ref(props.initialStatus)   // আগে সার্ভার থেকে পাওয়া বর্তমান অবস্থা
          const live = ref(false)
          let source: EventSource | null = null

          onMounted(async () => {
            const res = await fetch(`/orders/${props.orderId}/live`, { credentials: 'include' })
            const { hub, topic } = await res.json()

            const url = new URL(hub)
            url.searchParams.append('topic', topic)

            source = new EventSource(url, { withCredentials: true })
            source.onopen = () => (live.value = true)
            source.onerror = () => (live.value = false)   // ব্রাউজার নিজেই আবার জোড়ে
            source.onmessage = (e) => (status.value = JSON.parse(e.data).status)
          })

          onBeforeUnmount(() => source?.close())
          </script>

          <template>
            <p>অবস্থা: {{ status }} <small v-if="!live">(পুনঃসংযোগ চলছে…)</small></p>
          </template>
        marks:
          - {line: 5, tip: 'লাইভ সংযোগ আসার আগে বা মাঝে বার্তা হারালেও ব্যবহারকারী পুরনো নয়, বর্তমান অবস্থা দেখে।'}
          - {line: 16, tip: '`withCredentials` না দিলে ব্রাউজার cookie পাঠায় না, আর private topic-এ অনুমতি মেলে না।'}
          - {line: 18, tip: 'সংযোগ কাটলে ব্রাউজার নিজেই আবার জোড়ে আর Last-Event-ID পাঠায়, hub হারানো update ফেরত দেয়।'}
          - {line: 22, tip: 'close() না করলে পাতা বদলের পরেও সংযোগ খোলা থাকে আর জমতে থাকে।'}
    aside:
      - type: pitfalls
        items:
          - 'unmount-এ `close()` ভুলে গেলে প্রতিবার পাতায় ঢুকলে একটা করে সংযোগ জমে।'
          - 'শুধু EventSource-এর উপর ভরসা করো না; হারানো বার্তার জন্য প্রথমে বর্তমান অবস্থা আনা জরুরি।'
      - type: tips
        items:
          - 'বেশি topic শুনতে হলে `topic` পরামিতি একাধিকবার যোগ করো, সংযোগ লাগে একটাই।'
    check:
      q: 'কম্পোনেন্ট unmount হওয়ার সময় `source.close()` না ডাকলে কী ঘটে?'
      a: 'পাতা ছাড়ার পরেও সংযোগ খোলা থাকে, আর ব্যবহারকারী পাতায় ঢুকলেই একটা করে নতুন সংযোগ জমে। browser-এর সীমা আর সার্ভারের মেমরি দুটোই ক্ষয় হয়।'

  - slug: scale-presence-push
    title: 'সংযোগের দাম: scaling, presence আর push'
    kind: concept
    tldr: 'প্রতিটা খোলা সংযোগ সার্ভারের সম্পদ খায়; hub একবার পায়, অনেকজনকে পাঠায়। Presence হলো heartbeat আর TTL, আর অ্যাপে না থাকলে push notification।'
    keywords: ['connection scaling', 'presence', 'heartbeat', 'push notification', 'FCM', 'Web Push', 'online status', 'প্রেজেন্স']
