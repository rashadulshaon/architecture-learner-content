      - type: text
        body: |
          শুধু সময় দিয়ে বানানো cursor-এ একটা ফাঁক থাকে। ধরুন ৯, ৮ আর ৭ নম্বর পোস্ট একই মিলিসেকেন্ডে এসেছে, আর পাতায় ২টা ধরে। পাতা ১-এ ৯ আর ৮ আসে, cursor বলে "ওই মিলিসেকেন্ডের চেয়ে পুরনো", আর ৭ নম্বর পোস্ট কখনো দেখা যায় না। তাই cursor হবে (সময়, id) জোড়া: "পুরনো, অথবা একই সময়ে ছোট id"। এক পাতায় সমান সময় কম ঘটে, কিন্তু লাখ লাখ পাতা-বদলে রোজই ঘটে।
      - type: code
        lang: php
        file: 'src/Feed/FeedReader.php'
        variant: good
        code: |
          /** @param array{int, int}|null $cursor শেষ দেখানো পোস্টের [createdAtMs, postId] */
          public function page(int $userId, ?array $cursor, int $limit = 20): array
          {
              [$at, $id] = $cursor ?? [null, 0];
              $key = 'feed:'.$userId;
              $opt = ['withscores' => true];

              // ১) cursor-এর নিজের মিলিসেকেন্ডের সব পোস্ট আনুন, ছোট id-গুলো রাখুন
              $same = null === $at ? [] : $this->redis->zRangeByScore($key, $at, $at, $opt);
              $own = array_filter($same, fn ($score, $postId) => $postId < $id, ARRAY_FILTER_USE_BOTH);

              // ২) তার চেয়ে পুরনো মিলিসেকেন্ড, নতুন আগে
              $own += $this->redis->zRevRangeByScore(
                  $key, null === $at ? '+inf' : '('.$at, '-inf', $opt + ['limit' => [0, $limit]],
              );

              $items = [];
              foreach ($own as $postId => $score) {
                  $items[] = ['id' => (int) $postId, 'at' => (int) $score];
              }
              $stars = $this->follows->celebritiesFollowedBy($userId);
              foreach ($this->posts->latestBy($stars, $cursor, $limit) as $p) {
                  $items[] = ['id' => $p->getId(), 'at' => $p->getCreatedAtMs()];
              }

              usort($items, fn ($a, $b) => [$b['at'], $b['id']] <=> [$a['at'], $a['id']]);

              return array_slice($items, 0, $limit);       // শেষ আইটেমই পরের cursor
          }
        marks:
          - {line: 9, tip: 'Redis একই score-এর পোস্ট সংখ্যার ক্রমে নয়, লেখার ক্রমে দেয়। তাই cursor-এর মিলিসেকেন্ডের সবগুলো এনে PHP-তে id দিয়ে ছাঁকুন।'}
          - {line: 14, tip: '`(` মানে "এর চেয়ে ছোট" (exclusive): এখানে শুধু কঠোরভাবে পুরনো মিলিসেকেন্ড, কারণ সমানগুলো উপরে সামলানো হয়েছে।'}
          - {line: 26, tip: 'একই সময়ের পোস্ট id দিয়ে সাজানো, তাই প্রতিবার পাতা বদলালে ক্রম একই থাকে।'}
