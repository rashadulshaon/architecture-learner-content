      a: 'পোস্ট একই মিলিসেকেন্ডে আসতে পারে। শুধু সময় থাকলে যেগুলো পাতায় ধরেনি, সেগুলো পরের পাতায় বাদ পড়ে। কে কার পরে, তা id ঠিক করে।'

flashcards:
  - q: 'Fan-out কী?'
    a: 'একজনের তৈরি জিনিস (যেমন একটা পোস্ট) অনেকজনের কাছে ছড়িয়ে দেওয়া, যেমন সব ফলোয়ারের ফিডে।'
    more: |
      সমস্যাটা হলো ছড়ানোর কাজটা কখন করা হবে। পোস্টের সময় (write-time), নাকি ফিড খোলার সময় (read-time)। ফলোয়ার-সংখ্যা আর পড়া-লেখার অনুপাত দেখে ঠিক হয়।
    ref: push-vs-pull
  - q: 'Write-time fan-out কী, আর তার দাম কী?'
    a: 'পোস্ট লেখার সময় প্রতিটা ফলোয়ারের ফিডে বসানো। ফিড পড়া দ্রুত, কিন্তু লেখার কাজ ফলোয়ার-সংখ্যা গুণ।'
    more: |
      প্রতি ফলোয়ারের জন্য আলাদা কপি রাখতে জায়গাও বেশি লাগে। তবে ফিড পড়া হয় লেখার চেয়ে বহুগুণ বেশি, তাই সাধারণত এই পদ্ধতিই লাভজনক।
    ref: push-vs-pull
  - q: 'Read-time fan-out কখন ঠিক?'
    a: 'যখন পড়া কম আর লেখা বেশি, বা ফলোয়ার সংখ্যা বিশাল। পোস্ট একবারই লেখা হয়, পড়ার সময় ফলো করা সবার পোস্ট জুড়ে নেওয়া হয়।'
    more: |
      ফিড পড়া ধীর হয়, কারণ প্রতিবার জুড়তে আর সাজাতে হয়। যে বেশি জনকে ফলো করে তার ফিড সবচেয়ে ধীর। তাই সাধারণ ফিডে একা এটা কম ব্যবহার হয়।
    ref: push-vs-pull
  - q: 'Celebrity (hot key) সমস্যা কী?'
    a: 'বিশাল ফলোয়ারের একজনের একটা পোস্ট write-time-এ লাখ লাখ লেখা তৈরি করে, queue ভরে যায় আর অন্য সবার পোস্টও দেরিতে পৌঁছায়।'
    more: |
      এক ব্যবহারকারীর কারণে পুরো সিস্টেম আটকে যাওয়াই hot key। সমাধান hybrid: তারকাদের পোস্ট ছড়ানো হয় না, ফিড পড়ার সময় আলাদাভাবে এনে জোড়া হয়।
    ref: celebrity-problem
  - q: 'Hybrid fan-out কীভাবে কাজ করে?'
    a: 'সীমার কম ফলোয়ারের ব্যবহারকারীদের পোস্ট write-time-এ ছড়ায়। তারকাদের পোস্ট ফিড পড়ার সময় এনে নিজের ফিডের সাথে জোড়া হয়।'
    more: |
      সাধারণ ফলোয়িং-এর জন্য ফিড পড়া সস্তা থাকে, আর তারকার পোস্ট লাখ লাখ লেখা তৈরি করে না। ফিড খোলার সময় অল্প কয়েকজন তারকার পোস্ট আনা সস্তা কাজ।
    ref: celebrity-problem
  - q: 'ফিডের জন্য Redis sorted set কেন ভালো?'
    a: 'Score হিসেবে সময় রেখে নতুন-থেকে-পুরনো ক্রমে দ্রুত পড়া যায়, আর একই member আবার বসালে ডুপ্লিকেট হয় না।'
    more: |
      `ZADD` idempotent, তাই বার্তা redelivery হলেও ফিড ঠিক থাকে। `ZREMRANGEBYRANK` দিয়ে প্রতি ফিড ৮০০-র মতো ছোট রাখা হয়। সত্যিকারের ডেটা পোস্ট টেবিলে, Redis কেবল ক্যাশ।
    ref: write-fanout-code
  - q: 'ফিডে পাতা এগোতে offset না cursor, আর cursor-এ কী থাকে?'
    a: 'Cursor, কারণ নতুন পোস্ট এলেও এটা স্থির থাকে। এতে থাকে শেষ দেখানো পোস্টের (সময়, id): "পুরনো, অথবা একই সময়ে ছোট id"।'
    more: |
      পোস্ট একই মিলিসেকেন্ডে আসতে পারে। শুধু সময় দিয়ে সাজালে বা কাটলে সমান সময়ের দুটো পোস্টের ক্রম এলোমেলো হয়, আর পাতার সীমায় একটা বাদ বা দুইবার আসতে পারে। id যোগ করলে ক্রম পাকা হয়।
    ref: read-merge-ordering
  - q: 'ফিডের cursor শুধু সময়ের হলে পোস্ট বাদ পড়ে কেন?'
    a: 'শেষ পোস্টের একই মিলিসেকেন্ডের যেসব পোস্ট পাতায় ধরেনি, সেগুলো "পুরনো" নয়, তাই পরের পাতা সেগুলো চিরতরে বাদ দেয়।'
    more: |
      উদাহরণ: ৯, ৮, ৭ নম্বর পোস্ট একই মিলিসেকেন্ডে, পাতায় ২টা। পাতা ১-এ ৯ আর ৮; "ওই সময়ের চেয়ে পুরনো" ৭-কে চিরতরে বাদ দেয়। একই সময়ের ছোট id-র পোস্টও পড়লে ফাঁক বন্ধ হয়।
    ref: read-merge-ordering
  - q: 'এক বিশাল বার্তার বদলে ১০০০ ফলোয়ারের টুকরোয় fan-out কেন?'
    a: 'লম্বা কাজ মাঝপথে ক্র্যাশ করলে retry-তে সবটা আবার করতে হয়। checkpoint সহ টুকরোয় সর্বোচ্চ ১০০০-এর একটা টুকরো আবার হয়।'
    more: |
      প্রতিটা বার্তা শেষ পৌঁছানো ফলোয়ার id বয়ে নেয়, তাই পরের টুকরো সেখান থেকে শুরু হয়। ১০,০০০ ফলোয়ারে ৬,০০০-এ ক্র্যাশ করলে একটা বড় কাজে ১০,০০০ আবার, টুকরোয় সর্বোচ্চ ১০০০।
    ref: write-fanout-code

