slides:
  - slug: feed-join-slow
    title: 'ফিড খুললেই ১০০০ জনের পোস্ট জোড়া লাগে'
    kind: story
    tldr: 'ফিড দেখানোর সময় প্রতিবার "যাদের ফলো করি তাদের সব পোস্ট" খুঁজলে ব্যবহারকারী বাড়লে সেই query-ই সাইট আটকে দেয়।'
    keywords: ['feed', 'timeline', 'news feed', 'join', 'follow', 'ফিড', 'টাইমলাইন']
    blocks:
      - type: metaphor
        icon: book
        title: 'পত্রিকা স্টল বনাম হকার'
        body: |
          স্টল-ভিত্তিক পদ্ধতিতে পাঠক রোজ সকালে ১০০০টা পত্রিকার স্টল ঘুরে নিজের পছন্দের লেখা খুঁজে আনে। হকার-ভিত্তিক পদ্ধতিতে লেখা ছাপা হওয়ামাত্র হকার পাঠকের দরজায় ফেলে যায়। ফিড-ডিজাইন মানে এই দুটোর মধ্যে বাছা: কাজটা **পড়ার সময়** হবে, নাকি **লেখার সময়**।
      - type: code
        lang: sql
        file: 'feed.sql'
        variant: bad
        code: |
          -- প্রতিবার ফিড খুললে চলে
          SELECT p.*
          FROM posts p
          JOIN follows f ON f.followee_id = p.author_id
          WHERE f.follower_id = 7
          ORDER BY p.created_at DESC
          LIMIT 20;
        marks:
          - {line: 4, tip: 'ব্যবহারকারী ১০০০ জনকে ফলো করলে ১০০০ জনের সব পোস্ট ঘেঁটে তবে সবচেয়ে নতুন ২০টা বাছা হয়।'}
          - {line: 6, tip: 'সাজানোর জন্য সব মিলানো সারি আগে জমা করতে হয়। ডেটা বাড়লে এটাই ধীর হয়।'}
      - type: quote
        body: 'ফিড পড়া হয় লেখার চেয়ে বহুগুণ বেশি, তাই পড়ার পথ সস্তা করা চাই।'
    aside:
      - type: story
        title: 'বছরের শুরুর ধীর পাতা'
        body: |
          এক সোশ্যাল অ্যাপ প্রথম বছরে এই JOIN-এ দিব্যি চলত। ব্যবহারকারী ২০ লাখ ছাড়ালে ফিডের query ৩ সেকেন্ডে ঠেকল, আর ডেটাবেস CPU সারাক্ষণ ১০০%।
      - type: terms
        items:
          - {term: 'Feed', meaning: 'একজন ব্যবহারকারী যাদের ফলো করে তাদের পোস্টের সময়-সাজানো তালিকা।'}
          - {term: 'Fan-out', meaning: 'একজনের তৈরি জিনিস অনেকজনের কাছে ছড়িয়ে দেওয়া।'}
          - {term: 'JOIN', meaning: 'ডেটাবেসকে দুই টেবিলের সারি মিলিয়ে দিতে বলা, এখানে প্রতিটা ফলো আর যাকে ফলো করা তার পোস্ট।'}
    check:
      q: 'ফিডে প্রতি পাতা খোলায় JOIN চালানো কেন ক্ষতিকর, যদিও query সঠিক?'
      a: 'ফলো সংখ্যা আর পোস্ট দুটোই বাড়ে, আর ফিড খোলা সবচেয়ে ঘন ঘটে। প্রতিবারই বিশাল জোড়া-আর-সাজানোর কাজ হলে ডেটাবেস নুয়ে পড়ে।'

  - slug: push-vs-pull
    title: 'Write-time বনাম read-time fan-out'
    kind: concept
    tldr: 'Write-time-এ পোস্ট লেখার সময়ই প্রতিটা ফলোয়ারের ফিডে বসানো হয়, তাই পড়া সস্তা। Read-time-এ পড়ার সময় জোড়া লাগে, তাই লেখা সস্তা।'
    keywords: ['fan-out on write', 'fan-out on read', 'push model', 'pull model', 'precomputed feed', 'ফ্যান-আউট']
    blocks:
      - type: metaphor
        icon: truck
        title: 'হকার আর স্টল'
        body: |
          হকার-পদ্ধতিতে (**write-time**) নতুন সংখ্যা বেরোলে হকার ২০০ গ্রাহকের দরজায় ২০০টা কপি পৌঁছে দেয়, ছাপার সময় খাটুনি বেশি, কিন্তু গ্রাহক পড়তে বসলেই পত্রিকা তৈরি। স্টল-পদ্ধতিতে (**read-time**) ছাপার সময় কিছুই করতে হয় না, কিন্তু প্রতিবার পাঠককে ঘুরে ঘুরে জোগাড় করতে হয়।
      - type: visual
        kind: compare
        caption: 'দুই পদ্ধতির লেনদেন'
        columns:
          - title: 'Write-time (push)'
            tone: good
            icon: send
            tip: 'পোস্ট তৈরির সময় প্রতিটা ফলোয়ারের ফিডে বসানো হয়। ফিড খোলা হয় একটা সাজানো তালিকা পড়ে।'
            items:
              - 'ফিড পড়া খুব দ্রুত: একটা key থেকে তালিকা'
              - 'লেখার সময় ফলোয়ার-সংখ্যা গুণ কাজ'
              - 'বেশি জায়গা লাগে: প্রতিজনের আলাদা কপি'
              - 'ফলোয়ার বেশি হলে লেখাই বোঝা'
          - title: 'Read-time (pull)'
            tone: warn
            icon: search
            tip: 'পোস্ট শুধু একবার লেখা হয়। ফিড খোলার সময় ফলো করা সবার নতুন পোস্ট জুড়ে সাজানো হয়।'
            items:
              - 'লেখা সস্তা: পোস্ট শুধু একবার'
              - 'ফিড পড়া ধীর: প্রতিবার জুড়তে হয়'
              - 'বাড়তি জায়গা লাগে না'
              - 'যে বেশি জনকে ফলো করে তার ফিড সবচেয়ে ধীর'
      - type: points
        title: 'কীভাবে ভাববেন'
        style: dot
        items:
          - 'পড়া বেশি হলে (প্রায় সব সোশ্যাল ফিড) লেখার সময় বাড়তি কাজ করে পড়া সস্তা করুন।'
          - 'পড়া কম আর লেখা বেশি হলে (যেমন লগ, সাপ্তাহিক রিপোর্ট) read-time-ই ঠিক।'
          - 'উদাহরণ: দিনে ১ লাখ পোস্ট × ২০০ ফলোয়ার = ২ কোটি তালিকা-বসানো, সেকেন্ডে প্রায় ২৩০টা।'
          - 'বদলে ১০ লাখ ফিড-খোলার প্রতিটা একটা তৈরি তালিকা পড়ে, ২০০ জনের পোস্ট খুঁজে বেড়ায় না।'
    aside:
      - type: remember
        body: 'হকার = write-time: খাটুনি আগে, পড়া সহজ। স্টল = read-time: ছাপা সহজ, পড়া কঠিন।'
      - type: refs
        items:
          - {to: 'caching/cache-strategies', label: 'আগে থেকে হিসাব রাখা: caching'}
    check:
      q: 'বেশিরভাগ ব্যবহারকারী পোস্ট কম করে কিন্তু ফিড অনেকবার খোলে। কোন fan-out-এ সুবিধা?'
      a: 'Write-time। পড়ার সংখ্যা লেখার চেয়ে অনেক বেশি, তাই লেখার সময় একবার কাজ করে প্রতিটা পড়া সস্তা করা লাভজনক।'

  - slug: celebrity-problem
    title: 'তারকার সমস্যা: একটা পোস্ট, ৫০ লাখ লেখা'
    kind: pitfall
    tldr: 'Write-time fan-out-এ ৫০ লাখ ফলোয়ারের তারকার একটা পোস্ট ৫০ লাখ লেখা তৈরি করে। সমাধান hybrid: সাধারণ জনের পোস্ট push, তারকার পোস্ট ফিড পড়ার সময় pull।'
    keywords: ['celebrity problem', 'hot key', 'hybrid fan-out', 'write amplification', 'তারকা সমস্যা', 'হাইব্রিড']
    blocks:
      - type: visual
        kind: bars
        caption: 'Write-time-এ একটা পোস্টের লেখা, সেকেন্ডে ১০,০০০ লেখার হারে'
        items:
          - {label: 'সাধারণ', value: 200, display: '২০০ লেখা', tone: good, tip: '২০০ ফিডে লিখতে প্রায় ০.০২ সেকেন্ড লাগে। কেউ টেরই পায় না।'}
          - {label: 'জনপ্রিয়', value: 20000, display: '২০,০০০ লেখা', tone: warn, tip: '২০,০০০ লেখায় worker-দের প্রায় ২ সেকেন্ড লাগে। ভারী, কিন্তু চলে।'}
          - {label: 'তারকা', value: 5000000, display: '৫০,০০,০০০ লেখা', tone: bad, tip: '৫০ লাখ লেখায় লাগে ৫০০ সেকেন্ড, ৮ মিনিটের বেশি। অন্য সবার পোস্ট queue-তে এর পেছনে অপেক্ষা করে।'}
      - type: text
        body: |
          এটাই **hot key** সমস্যা: এক ব্যবহারকারীর কারণে পুরো সিস্টেম আটকায়। সমাধান **hybrid**: যাদের ফলোয়ার সীমার (ধরুন ১০ হাজার) কম, তাদের পোস্ট write-time-এ ফলোয়ারদের ফিডে বসান। তারকাদের পোস্ট কোথাও ছড়াবেন না। ফিড খোলার সময় ব্যবহারকারী যে তারকাদের ফলো করে, তাদের নতুন পোস্ট সরাসরি এনে নিজের ফিডের সাথে জুড়ে দিন।
      - type: quote
        body: 'সাধারণ জনের পোস্ট ছড়ান, তারকার পোস্ট পড়ার সময় এনে জুড়ুন।'
      - type: points
        title: 'Hybrid-এর দাম'
        items:
          - 'ফিড খুললে এখন ব্যবহারকারীর ফলো করা প্রতিটা তারকার জন্য পোস্ট টেবিলেও জিজ্ঞেস করতে হয়, আর একটা বাড়তি জোড়ার ধাপ চলে।'
          - 'এটা সস্তা রাখুন: প্রতি তারকার সাম্প্রতিক পোস্ট একবার ক্যাশে রাখুন, তাঁর সব ফলোয়ার ভাগ করে নেবে।'
          - 'কারো ফলোয়ার কয়েক হাজারের বেশি না হলে লাভ নেই: শুধু write-time-ই সরল।'
    aside:
      - type: when
        use: ['Hybrid: ফলোয়ার-সংখ্যায় বিশাল তফাত থাকলে (সোশ্যাল, নিউজ)']
        avoid: ['Hybrid: সবার ফলোয়ার কাছাকাছি হলে; তখন শুধু write-time-ই সরল ও যথেষ্ট']
      - type: pitfalls
        items:
          - 'সীমা (threshold) একবার ঠিক করে ভুলে গেলে ব্যবহারকারী সীমা পেরোনোর সময় ফিড ভাঙে; ফলোয়ার-সংখ্যা নিয়মিত দেখুন।'
      - type: refs
        items:
          - {to: 'data/sharding', label: 'Hot key আর shard-এর ভারসাম্য'}
    check:
      q: 'Hybrid-এ তারকার পোস্ট ফলোয়ারদের ফিডে লেখা হয় না কেন?'
      a: 'একটা পোস্টে ৫০ লাখ লেখা হতো, যা queue ভরে অন্য সবার পোস্টও আটকাত। তাই সেটা শুধু একবার রাখা হয়, আর ফিড পড়ার সময় জুড়ে নেওয়া হয়।'

  - slug: write-fanout-code
    title: 'Messenger দিয়ে টুকরো টুকরো fan-out'
    kind: howto
    tldr: 'Fan-out বিশাল কাজ, তাই টুকরোয় ভাঙুন: প্রতি বার্তা ১০০০ ফলোয়ার ধরে Redis-এ বসায়, তারপর পরের টুকরোর বার্তা দেয়। একই বার্তা দুইবার চললেও ফিড ঠিক থাকে।'
    keywords: ['Messenger', 'Redis sorted set', 'ZADD', 'chunked fan-out', 'idempotent', 'FanOutPost', 'ফিড লেখা']
    blocks:
      - type: text
        body: |
          পোস্ট save হলে একটা `FanOutPost` বার্তা যায়। Handler ১০০০ ফলোয়ার নেয়, প্রত্যেকের Redis **sorted set**-এ পোস্টের id বসায় (score দিয়ে সাজানো তালিকা, এখানে score হলো সময়), তারপর পরের ১০০০-এর বার্তা dispatch করে। টুকরো কেন: ১০,০০০ ফলোয়ারের একটা বার্তা ৬,০০০-এ ক্র্যাশ করলে পুরো ১০,০০০ আবার করতে হয়, টুকরোয় সর্বোচ্চ ১০০০। `ZADD` একই member আর একই score-এ আবার চললে কিছু বদলায় না, তাই redelivery হলেও ক্ষতি নেই।
      - type: code
        lang: php
        file: 'src/MessageHandler/FanOutPostHandler.php'
        variant: good
        code: |
          #[AsMessageHandler]
          final readonly class FanOutPostHandler
          {
              private const CHUNK = 1000;
              private const FEED_MAX = 800;

              public function __invoke(FanOutPost $m): void
              {
                  $ids = $this->follows->followerIdsAfter($m->authorId, $m->afterId, self::CHUNK);
                  if ([] === $ids) {
                      return;                                   // সবার কাছে পৌঁছেছে
                  }

                  $pipe = $this->redis->multi(\Redis::PIPELINE);
                  foreach ($ids as $uid) {
                      $pipe->zAdd('feed:'.$uid, $m->createdAtMs, (string) $m->postId);
                      $pipe->zRemRangeByRank('feed:'.$uid, 0, -(self::FEED_MAX + 1));
                  }
                  $pipe->exec();

                  $this->bus->dispatch(new FanOutPost(
                      $m->postId, $m->authorId, $m->createdAtMs, (int) end($ids),
                  ));
              }
          }
        marks:
          - {line: 9, tip: 'ফলোয়ারদের শেষ id-র পর থেকে ১০০০ জন। OFFSET নয়, তাই বড় তালিকাতেও দ্রুত।'}
          - {line: 16, tip: 'ZADD idempotent: একই (post, সময়) আবার বসালে ফিডে ডুপ্লিকেট হয় না।'}
          - {line: 17, tip: 'প্রতি ফিডে সর্বোচ্চ ৮০০টা রাখি। এর পুরনো অংশ দরকারে ডেটাবেস থেকে আসে।'}
          - {line: 21, tip: 'পরের টুকরোর বার্তায় checkpoint (শেষ follower id)। মাঝপথে ভাঙলে ওখান থেকেই চলে।'}
