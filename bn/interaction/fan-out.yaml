          - 'ফিড eventually consistent: পোস্টের কয়েক সেকেন্ড পরে ফলোয়ারের ফিডে আসে। এটা গ্রহণযোগ্য, কিন্তু নিজের পোস্ট নিজে সাথে সাথে দেখাও।'
