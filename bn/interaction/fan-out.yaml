      q: 'ফিডের পাতা এগোতে `OFFSET` ব্যবহার না করে cursor (শেষ পোস্টের সময়) কেন?'
      a: 'ফিডে নতুন পোস্ট আসতেই থাকে। OFFSET দিলে নতুন পোস্টের ধাক্কায় পরের পাতায় আগের পোস্টই আবার আসে। Cursor "এর আগের" বলে, তাই স্থির থাকে।'

flashcards:
  - q: 'Fan-out কী?'
    a: 'একজনের তৈরি জিনিস (যেমন একটা পোস্ট) অনেকজনের কাছে ছড়িয়ে দেওয়া, যেমন সব ফলোয়ারের ফিডে।'
    more: |
      সমস্যাটা হলো ছড়ানোর কাজটা কখন করা হবে। পোস্টের সময় (write-time), নাকি ফিড খোলার সময় (read-time)। ফলোয়ার-সংখ্যা আর পড়া-লেখার অনুপাত দেখে ঠিক হয়।
    ref: push-vs-pull
  - q: 'Write-time fan-out কী, আর তার দাম কী?'
    a: 'পোস্ট লেখার সময় প্রতিটা ফলোয়ারের ফিডে বসানো। ফিড পড়া দ্রুত, কিন্তু লেখার কাজ ফলোয়ার-সংখ্যা গুণ।'
    more: |
      প্রতি ফলোয়ারের জন্য আলাদা কপি রাখতে জায়গাও বেশি লাগে। তবে ফিড পড়া হয় লেখার চেয়ে বহুগুণ বেশি, তাই সাধারণত এই পদ্ধতিই লাভজনক।
    ref: push-vs-pull
  - q: 'Read-time fan-out কখন ঠিক?'
    a: 'যখন পড়া কম আর লেখা বেশি, বা ফলোয়ার সংখ্যা বিশাল। পোস্ট একবারই লেখা হয়, পড়ার সময় ফলো করা সবার পোস্ট জুড়ে নেওয়া হয়।'
    more: |
      ফিড পড়া ধীর হয়, কারণ প্রতিবার জুড়তে আর সাজাতে হয়। যে বেশি জনকে ফলো করে তার ফিড সবচেয়ে ধীর। তাই সাধারণ ফিডে একা এটা কম ব্যবহার হয়।
    ref: push-vs-pull
  - q: 'Celebrity (hot key) সমস্যা কী?'
    a: 'বিশাল ফলোয়ারের একজনের একটা পোস্ট write-time-এ লাখ লাখ লেখা তৈরি করে, queue ভরে যায় আর অন্য সবার পোস্টও দেরিতে পৌঁছায়।'
    more: |
      এক ব্যবহারকারীর কারণে পুরো সিস্টেম আটকে যাওয়াই hot key। সমাধান hybrid: তারকাদের পোস্ট ছড়ানো হয় না, ফিড পড়ার সময় আলাদাভাবে এনে জোড়া হয়।
    ref: celebrity-problem
  - q: 'Hybrid fan-out কীভাবে কাজ করে?'
    a: 'সীমার কম ফলোয়ারের ব্যবহারকারীদের পোস্ট write-time-এ ছড়ায়। তারকাদের পোস্ট ফিড পড়ার সময় এনে নিজের ফিডের সাথে জোড়া হয়।'
    more: |
      সাধারণ ফলোয়িং-এর জন্য ফিড পড়া সস্তা থাকে, আর তারকার পোস্ট লাখ লাখ লেখা তৈরি করে না। ফিড খোলার সময় অল্প কয়েকজন তারকার পোস্ট আনা সস্তা কাজ।
    ref: celebrity-problem
  - q: 'ফিডের জন্য Redis sorted set কেন ভালো?'
    a: 'Score হিসেবে সময় রেখে নতুন-থেকে-পুরনো ক্রমে দ্রুত পড়া যায়, আর একই member আবার বসালে ডুপ্লিকেট হয় না।'
    more: |
      `ZADD` idempotent, তাই বার্তা redelivery হলেও ফিড ঠিক থাকে। `ZREMRANGEBYRANK` দিয়ে প্রতি ফিড ৮০০-র মতো ছোট রাখা হয়। সত্যিকারের ডেটা পোস্ট টেবিলে, Redis কেবল ক্যাশ।
    ref: write-fanout-code
  - q: 'ফিডে পাতা এগোতে offset না cursor, এবং সমান সময়ের পোস্ট কীভাবে সামলাবে?'
    a: 'Cursor, কারণ নতুন পোস্ট এলেও এটা স্থির থাকে। ক্রম হবে (সময়, id) জোড়ায়, যাতে সমান সময়ের পোস্টও স্থির ক্রমে থাকে।'
    more: |
      শুধু সময় দিয়ে সাজালে সমান সময়ের দুটো পোস্টের ক্রম এলোমেলো হয়, আর পাতার সীমায় একটা বাদ বা দুইবার আসতে পারে। id দিয়ে ক্রম পাকা করলে cursor নির্ভরযোগ্য।
    ref: read-merge-ordering

quiz:
  - q: 'অ্যাপে ১০ লাখ ব্যবহারকারী, বেশিরভাগের ফলোয়ার ২০০-র নিচে, আর ফিড খোলা লেখার চেয়ে ১০০ গুণ বেশি। সবচেয়ে ভালো শুরুর পছন্দ কোনটা?'
    hint: 'পড়া আর লেখার অনুপাত দেখো।'
    options:
      - text: 'Write-time fan-out'
        correct: true
        why: 'ফলোয়ার কম আর পড়া অনেক বেশি, তাই লেখার সময় ২০০টা লেখা সস্তা, আর প্রতিটা ফিড-পড়া দ্রুত।'
      - text: 'Read-time fan-out, প্রতিবার JOIN করে'
        correct: false
        why: 'ঘন ঘন পড়া প্রতিবার ভারী JOIN চালালে ডেটাবেস নুয়ে পড়ে।'
      - text: 'ফিড ছাড়া শুধু সময় ধরে সব পোস্ট দেখানো'
        correct: false
        why: 'এতে ব্যবহারকারীর ফলো করা মানুষের পোস্ট আলাদা হয় না; ফিডই থাকে না।'
    ref: push-vs-pull
  - q: 'একজন তারকার ৫০ লাখ ফলোয়ার। তিনি পোস্ট করলে write-time fan-out-এ কী ঘটে?'
    hint: 'একটা পোস্ট কয়টা ফিডে লিখতে হবে?'
    options:
      - text: '৫০ লাখ লেখা তৈরি হয়, queue ভরে অন্যদের পোস্টও দেরিতে যায়'
        correct: true
        why: 'এটাই hot key সমস্যা, এক ব্যবহারকারীর কারণে পুরো সিস্টেম ধীর।'
      - text: 'কিছুই ঘটে না, Redis সবই সামলে নেয়'
        correct: false
        why: 'Redis দ্রুত, কিন্তু ৫০ লাখ লেখা আর worker ও queue-র চাপ তবুও থাকে।'
      - text: 'শুধু তারকার নিজের ফিড আপডেট হয়'
        correct: false
        why: 'ফলোয়ারদের ফিডেই পোস্ট বসানো হয়, তারকার নিজের ফিডে নয়।'
    ref: celebrity-problem
  - q: 'নিচের কোন বাক্যগুলো hybrid fan-out সম্পর্কে ঠিক?'
    hint: 'কোন পোস্ট কখন ছড়ানো হয়?'
    options:
      - text: 'সাধারণ ব্যবহারকারীর পোস্ট write-time-এ ফলোয়ারদের ফিডে বসে'
        correct: true
        why: 'ফলোয়ার কম, তাই ছড়ানো সস্তা, আর পড়া দ্রুত থাকে।'
      - text: 'তারকার পোস্ট ফিড পড়ার সময় এনে জোড়া হয়'
        correct: true
        why: 'লাখ লাখ লেখা এড়ানো যায়, আর অল্প কয়েকজন তারকার পোস্ট আনা সস্তা।'
      - text: 'সব পোস্ট প্রথমে read-time-এ চলে, পরে write-time-এ'
        correct: false
        why: 'এমন কোনো নিয়ম নেই; ভাগটা ব্যবহারকারীর ফলোয়ার-সংখ্যার উপর ভিত্তি করে।'
      - text: 'তারকার সব ফলোয়ারের ফিডে পোস্টের প্রতিলিপি জমা থাকে'
        correct: false
        why: 'ঠিক এটাই hybrid এড়ায়।'
    ref: celebrity-problem
  - q: 'এই handler redelivery-তে দুইবার চলল। ফিডে কী হবে?'
    lang: php
    code: |
      foreach ($ids as $uid) {
          $pipe->zAdd('feed:'.$uid, $m->createdAtMs, (string) $m->postId);
      }
      $pipe->exec();
    hint: 'sorted set-এ একই member আবার দিলে কী হয়?'
    options:
      - text: 'প্রতিটা ফিডে পোস্টটা দুইবার আসবে'
        correct: false
