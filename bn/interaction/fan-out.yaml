        why: 'ডেটাবেসকে OFFSET পর্যন্ত সব সারি পেরিয়ে যেতে হয়।'
      - text: 'কোনো সমস্যা নেই, ফিডে এটাই সেরা'
        correct: false
        why: 'ঘন ঘন নতুন ডেটা আসা ফিডে OFFSET বিশেষভাবে অনির্ভরযোগ্য।'
      - text: 'OFFSET ফিডে কাজই করে না'
        correct: false
        why: 'কাজ করে, কিন্তু উপরের সমস্যাগুলো থাকে।'
    ref: read-merge-ordering
