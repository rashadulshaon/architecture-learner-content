      - text: 'কিছুই বদলাবে না, কারণ একই member আর একই score'
        correct: true
        why: '`ZADD` idempotent। দ্বিতীয়বার চললেও ফল একই।'
      - text: 'দ্বিতীয়বার exception উঠবে'
        correct: false
        why: 'Redis ZADD exception ছোড়ে না; আগের member থাকলে শুধু score হালনাগাদ করে।'
    ref: write-fanout-code
  - q: 'ফিডে "পরের পাতা" দেখাতে `LIMIT 20 OFFSET 20` ব্যবহার করলে কী সমস্যা?'
    hint: 'পাতা খোলা থাকাকালীন নতুন পোস্ট এলে কী হয়?'
    options:
      - text: 'নতুন পোস্টের ধাক্কায় পরের পাতায় আগের পাতার পোস্টই আবার আসে'
        correct: true
        why: 'নতুন পোস্ট সামনে ঢুকলে সব সারি এক ধাপ পিছোয়, তাই আগের পাতার শেষ পোস্ট আবার আসে।'
      - text: 'বড় OFFSET-এ query ধীর হয়ে যায়'
