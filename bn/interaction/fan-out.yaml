      - type: code
        lang: php
        file: 'src/Feed/FeedReader.php'
        variant: good
        code: |
          public function page(int $userId, ?int $beforeMs, int $limit = 20): array
          {
              $max = null === $beforeMs ? '+inf' : '('.$beforeMs;       // cursor, offset নয়
              $own = $this->redis->zRevRangeByScore(
                  'feed:'.$userId, $max, '-inf', ['withscores' => true, 'limit' => [0, $limit]],
              );
              $items = [];
              foreach ($own as $postId => $score) {
                  $items[] = ['id' => (int) $postId, 'at' => (int) $score];
              }

              $stars = $this->follows->celebritiesFollowedBy($userId);
              foreach ($this->posts->latestBy($stars, $beforeMs, $limit) as $p) {
                  $items[] = ['id' => $p->getId(), 'at' => $p->getCreatedAtMs()];
              }

              usort($items, fn ($a, $b) => [$b['at'], $b['id']] <=> [$a['at'], $a['id']]);

              return array_slice($items, 0, $limit);                   // এর শেষ at-ই পরের cursor
          }
        marks:
          - {line: 3, tip: '`(` মানে "এর চেয়ে ছোট" (exclusive)। cursor-এর পোস্ট নিজে আবার আসে না।'}
          - {line: 17, tip: 'একই সময়ে দুটো পোস্ট থাকলে id দিয়ে ক্রম ঠিক, নইলে পাতা বদলের সময় পোস্ট বাদ বা ডুপ্লিকেট হয়।'}
