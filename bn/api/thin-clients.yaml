flashcards:
  - q: 'Thin client বলতে কী বোঝায়?'
    a: 'যে client নিজে ব্যবসার সিদ্ধান্ত নেয় না; শুধু সার্ভারের দেওয়া ফল দেখায় আর ব্যবহারকারীর ইনপুট পাঠায়।'
    more: |
      দাম, ছাড়, অনুমতি, স্টকের মতো নিয়ম সার্ভারে একবার লেখা হয়। ওয়েব, মোবাইল আর পার্টনার সবাই একই উত্তর পায়। client-এর কাজ দেখানো আর সুবিধা দেওয়া।
    ref: server-decides
  - q: 'ব্যবসার নিয়ম client-এ রাখলে কোন তিনটা সমস্যা?'
    a: 'প্রতি client-এ আলাদা (ভুল) নকল, নিয়ম বদলাতে সব জায়গায় রিলিজ, আর ব্যবহারকারী নিজের হাতে হিসাব বদলে পাঠাতে পারে।'
    more: |
      মোবাইল অ্যাপ স্টোর রিভিউয়ে আটকে থাকে, আর পুরনো সংস্করণ মাসের পর মাস চলে। পার্টনারের সাইটে তো তোমার নিয়ম নেই-ই। আর browser DevTools দিয়ে যেকোনো পাঠানো মান বদলানো যায়।
    ref: three-prices
  - q: 'কেন client-এর পাঠানো `total` বিশ্বাস করা যায় না?'
    a: 'ব্যবহারকারী DevTools বা সরাসরি API ডেকে যেকোনো মান বদলে পাঠাতে পারে। দাম আসতে হবে সার্ভারের হিসাব থেকে।'
    more: |
      সঠিক নকশা: client শুধু product id আর সংখ্যা পাঠায়। সার্ভার ডেটাবেস থেকে আসল দাম নিয়ে subtotal, discount আর total হিসাব করে ফেরত দেয়। client সেটা শুধু দেখায়।
    ref: server-computes-price
  - q: 'Client-এ কোন পরীক্ষা রাখা ঠিক, কোনটা নয়?'
    a: 'ঠিক: ব্যবহারকারীর সুবিধার আগাম পরীক্ষা (ইমেইলে @ আছে কি না)। ভুল: একমাত্র পরীক্ষা হিসেবে শুধু client-এ।'
    more: |
      client-এর পরীক্ষা দ্রুত ফিডব্যাক দেয়, কিন্তু যেকোনো সময় এড়ানো যায়। আসল validation আর নিয়ম সবসময় সার্ভারে। দুটো থাকলে ভালো, শুধু client-এ থাকলে বিপজ্জনক।
    ref: server-decides
  - q: 'client কীভাবে জানবে কোন বোতাম দেখাবে, যদি নিয়ম সার্ভারে থাকে?'
    a: 'response-এ `abilities` ধরনের flag আসে, যেমন `cancel: true`। client সেটা দেখে বোতাম দেখায় বা লুকায়।'
    more: |
      সার্ভার Voter চালিয়ে ফল বলে দেয়, client নিয়ম জানে না। তবু আসল কাজের endpoint-এ #[IsGranted] দিয়ে আবার যাচাই বাধ্যতামূলক, কারণ বোতাম লুকানো নিরাপত্তা নয়।
    ref: abilities-flag
  - q: 'BFF (Backend for Frontend) কী?'
    a: 'Backend for Frontend: প্রতি client-এর জন্য একটা পাতলা সার্ভার, যে পর্দার মতো করে মূল সার্ভিসের ডেটা জুড়ে ও ছেঁটে দেয়।'
    more: |
      মোবাইলের জন্য তিনটা API-র ডাক এক করে এক response বানানো এর কাজ। কিন্তু দাম বা অনুমতির নিয়ম এখানে নয়, মূল সার্ভিসে থাকে। নইলে BFF-গুলোতে নিয়ম নকল হয়ে যায়।
    ref: bff-briefly
  - q: 'BFF কখন দরকার নেই?'
    a: 'যখন একটাই client আছে, বা ওয়েব আর মোবাইলের দরকার প্রায় এক। তখন বাড়তি সার্ভার শুধু বোঝা।'
    more: |
      BFF একটা বাড়তি সার্ভিস চালানো ও deploy করার খরচ আনে। পর্দা সত্যিই আলাদা আর আলাদা টিম বানালেই এর সুবিধা পাওয়া যায়। GraphQL-ও কাছাকাছি সমস্যা মেটায়।
    ref: bff-briefly

quiz:
  - q: 'নিচের কোডে সবচেয়ে বড় সমস্যা কী?'
    lang: php
    code: |
      $data = $request->toArray();

      $order = new Order($this->getUser());
      $order->setTotal($data['total']);
      $order->setDiscount($data['discount']);
    hint: 'ব্রাউজারের DevTools খুলে কেউ `total` বদলালে কী হবে?'
    options:
      - text: 'client-এর পাঠানো মোট আর ছাড় সরাসরি বিশ্বাস করা হচ্ছে, তাই যে কেউ ইচ্ছেমতো দাম বসাতে পারবে'
        correct: true
        why: 'দাম আর ছাড় সার্ভারের হিসাব হওয়া উচিত। client শুধু product id আর সংখ্যা পাঠাবে।'
      - text: 'toArray() ধীর, json_decode() দ্রুত'
        correct: false
        why: 'গতির পার্থক্য নগণ্য। বড় সমস্যা নিরাপত্তা আর নিয়মের জায়গা।'
      - text: 'Order কনস্ট্রাক্টরে user পাঠানো ভুল'
        correct: false
        why: 'অর্ডারের মালিক সংযুক্ত করা সঠিক। সমস্যা total আর discount নিয়ে।'
      - text: 'setDiscount() আগে, setTotal() পরে ডাকা উচিত'
        correct: false
        why: 'ক্রম বদলে কিছু ঠিক হয় না, মূল সমস্যা উৎসের।'
    ref: server-computes-price
  - q: 'নিচের কোন কোন কাজ নিরাপদে client-এ থাকতে পারে?'
    hint: 'কোনটা শুধু দেখা ও সুবিধা, আর কোনটা ব্যবসার সিদ্ধান্ত?'
    options:
      - text: 'টাকা ও তারিখ বাংলায় ফরম্যাট করে দেখানো'
        correct: true
        why: 'এটা শুধু উপস্থাপনা। ফরম্যাট ভুল হলে দেখতে খারাপ, কিন্তু ব্যবসার ক্ষতি নেই।'
      - text: 'ইমেইল ঘরে আগাম পরীক্ষা, যেন ব্যবহারকারী দ্রুত ভুল ধরতে পারে'
        correct: true
        why: 'সুবিধার জন্য ঠিক, তবে সার্ভারে আসল validation থাকতেই হবে।'
      - text: 'কুপন কোডের ছাড় কত টাকা হবে তা গণনা'
        correct: false
        why: 'ছাড় ব্যবসার নিয়ম। client-এ থাকলে নকল হয় আর বদলে ফেলা যায়।'
      - text: 'ব্যবহারকারী অর্ডার বাতিল করতে পারবে কি না তা চূড়ান্ত সিদ্ধান্ত'
        correct: false
        why: 'অনুমতি সার্ভারের সিদ্ধান্ত। client শুধু সার্ভারের flag দেখে বোতাম দেখাবে।'
    ref: server-decides
  - q: 'Vue অ্যাপে `v-if="order.status === ''placed'' && order.ownerId === me.id"` লিখে বাতিল বোতাম দেখানো হয়েছে। রহিম বলছে "সার্ভারেও তো নিয়ম আছে, কোনো সমস্যা নেই।" সবচেয়ে ভালো উত্তর কোনটা?'
    hint: 'নিয়ম কয়টা জায়গায় লেখা হলো?'
    options:
      - text: 'ঠিক আছে, কারণ নিয়ম দুই জায়গায় মিললে বেশি নিরাপদ'
        correct: false
        why: 'নিয়ম বদলালে দুই জায়গা আলাদা হয়ে যাবে। নিরাপত্তা আসে সার্ভারের যাচাই থেকে, নকল নিয়ম থেকে নয়।'
      - text: 'নিয়মটা সার্ভারের Voter-এ রেখে response-এ `abilities.cancel` flag পাঠাও; Vue শুধু flag দেখুক'
        correct: true
        why: 'নিয়ম একবার লেখা থাকে, বদলালে client অপরিবর্তিত থাকে। সার্ভার আসল কাজেও Voter আবার চালায়।'
      - text: 'client-এর নিয়ম ঠিক আছে, সার্ভারের Voter ফেলে দাও'
        correct: false
        why: 'সার্ভারের যাচাই ছাড়া যে কেউ সরাসরি API ডেকে বাতিল করতে পারবে।'
      - text: 'বোতাম সবসময় দেখাও, ক্লিক করলে সার্ভার "না" বলবে'
        correct: false
        why: 'এটা নিরাপদ, কিন্তু ব্যবহারকারীকে অকারণ ব্যর্থতা দেখানো হয়। flag দিলে UX-ও ভালো থাকে।'
    ref: abilities-flag
