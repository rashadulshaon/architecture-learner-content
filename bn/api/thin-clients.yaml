slides:
  - slug: three-prices
    title: 'একই ফোন, তিন জায়গায় তিন দাম'
    kind: story
    tldr: 'ছাড় বা দামের হিসাব client-এর কোডে থাকলে প্রতিটা client আলাদা উত্তর দেয়, আর ব্যবহারকারী নিজের হাতে সেই হিসাব বদলে পাঠাতেও পারে।'
    keywords: ['business logic', 'thin client', 'duplicated logic', 'price calculation', 'client trust', 'ব্যবসার নিয়ম']
    blocks:
      - type: text
        body: |
          একটা ফোনের দাম ১০,০০০ টাকা, ১০% ছাড় চালু। রহিমের ওয়েবে ছাড়ের হিসাব JavaScript-এ, iOS অ্যাপে আলাদা কোডে (ভুল করে ১২%), আর পার্টনারের সাইটে সেই হিসাবই নেই। এক মাসে সাপোর্টে এল: "ওয়েবে ৯,০০০ দেখলাম, চেকআউটে ১০,০০০ কেন?" তার ওপর এক ক্রেতা DevTools খুলে `total` বদলে ১ টাকা বসিয়ে পাঠাল, আর সার্ভার সেটাই মেনে নিল।
      - type: visual
        kind: table
        caption: 'একই কার্টে চার client-এর দেখানো দাম'
        headers: ['client', 'দেখানো দাম', 'কারণ']
        rows:
          - cells: ['ওয়েব (Vue)', '৯,০০০ টাকা', 'JavaScript-এ ১০% ছাড়']
            tip: 'এই হিসাব ঠিক, কিন্তু এটা শুধু ওয়েবের কোডে আছে। অন্য কেউ এর খবর রাখে না।'
          - cells: ['iOS অ্যাপ', '৮,৮০০ টাকা', 'ভুল করে ১২% ছাড়']
            tip: 'আলাদা ডেভেলপার, আলাদা ভাষা, আলাদা ভুল। অ্যাপ স্টোরে ঠিক করা রিলিজ বের হতে দিন লাগে।'
          - cells: ['Android অ্যাপ', '৯,০০০ টাকা', 'আলাদা কোডে ১০%']
            tip: 'এবার মিলেছে, কিন্তু ছাড় ১২% হলে আবার তিন জায়গায় বদলাতে হবে, আর একটা ভুলবেই।'
          - cells: ['পার্টনারের সাইট', '১০,০০০ টাকা', 'ছাড়ের কোডই নেই']
            tip: 'বাইরের পার্টনারের কাছে তোমার নিয়ম কখনোই পৌঁছায় না। তারা শুধু সার্ভারের উত্তর দেখে।'
      - type: quote
        body: 'Client ব্যবহারকারীর হাতের কোড। তার কথা বিশ্বাস করো না, শুধু যা সার্ভার ঠিক করেছে সেটাই সত্য।'
    aside:
      - type: story
        title: 'এক টাকার ফোন'
        body: |
          একটা ছোট ই-কমার্সে checkout API client-এর পাঠানো `price` বিশ্বাস করত। কেউ দাম ১ টাকা বসিয়ে ডজন ডজন ফোন অর্ডার করে ফেলল। কোডে কোনো bug ছিল না, শুধু ভুল জায়গাকে বিশ্বাস করা হয়েছিল।
      - type: terms
        items:
          - {term: 'Business logic', meaning: 'ব্যবসার নিয়ম: দাম, ছাড়, কে কী করতে পারবে, কখন কী বাতিল হয়।'}
          - {term: 'Thin client', meaning: 'যে client নিজে সিদ্ধান্ত নেয় না, শুধু সার্ভারের সিদ্ধান্ত দেখায়।'}
    check:
      q: 'ছাড়ের হিসাব ওয়েব, iOS আর Android তিন জায়গায় আলাদা লিখলে কী কী সমস্যা হয়?'
      a: 'তিন জায়গায় তিন দাম দেখাতে পারে, নিয়ম বদলালে তিন জায়গাই আলাদা করে বদলাতে হয়, আর client-এর হিসাব ব্যবহারকারী বদলে পাঠাতে পারে।'

  - slug: server-decides
    title: 'Client দেখায়, সার্ভার ঠিক করে'
    kind: concept
    tldr: 'ব্যবসার সিদ্ধান্ত (দাম, অনুমতি, নিয়ম) একবার সার্ভারে লেখা হয়; client শুধু ফল দেখায় আর ব্যবহারকারীর সুবিধার জন্য ছোটখাটো আগাম পরীক্ষা করে।'
    keywords: ['thin client', 'server authority', 'client validation', 'single source of truth', 'কে সিদ্ধান্ত নেয়']
    blocks:
      - type: metaphor
        icon: shop
        title: 'এক দোকান, তিন কাউন্টার'
        body: |
          দোকানে তিনটা কাউন্টার, কিন্তু হিসাবের খাতা একটাই, মালিকের ঘরে। কাউন্টারের ছেলেরা খাতা থেকে দাম দেখে বলে, নিজের মাথায় বানায় না। কাউন্টার বাড়ালেও দাম মিলে থাকে, কারণ নিয়ম একটাই জায়গায়।
      - type: visual
        kind: compare
        caption: 'কোন কাজ কার'
        columns:
          - title: 'Client (Vue, মোবাইল)'
            tone: default
            icon: browser
            tip: 'ব্যবহারকারীর সামনের পর্দা। দ্রুত আর সুন্দর দেখানোই তার কাজ, সিদ্ধান্ত নেওয়া নয়।'
            items:
              - 'ফল সাজিয়ে দেখানো, ভাষা, তারিখ, টাকার ফরম্যাট'
              - 'আগাম সুবিধার পরীক্ষা: ইমেইলে @ আছে কি না'
              - 'সার্ভারের দেওয়া flag দেখে বোতাম দেখানো বা লুকানো'
          - title: 'সার্ভার (Symfony)'
            tone: accent
            icon: server
            tip: 'আসল সিদ্ধান্তের জায়গা। সবাই এখান থেকে একই উত্তর পায়।'
            items:
              - 'দাম, ছাড়, ট্যাক্স হিসাব'
              - 'কে কী করতে পারবে: অনুমতি'
              - 'আসল validation, স্টক আর সব ব্যবসার নিয়ম'
      - type: quote
        body: 'Client-এর পরীক্ষা সুবিধার জন্য, সার্ভারের পরীক্ষা নিরাপত্তার জন্য। সার্ভার ছাড়া কিছুই চূড়ান্ত নয়।'
    aside:
      - type: remember
        body: 'দেখানো client-এর, ঠিক করা সার্ভারের।'
      - type: when
        use:
          - 'client-এ থাকুক: লেআউট, অ্যানিমেশন, আগাম ফর্ম পরীক্ষা, ক্যাশ করা UI স্টেট'
        avoid:
          - 'client-এ রেখো না: দাম, ছাড়, অনুমতি, স্টক, পেমেন্টের নিয়ম'
      - type: refs
        items:
          - {to: 'security/input-validation', label: 'সার্ভারে validation কেন বাধ্যতামূলক'}
    check:
      q: 'ফর্মে ইমেইল ঘরে client-এ আগাম পরীক্ষা আছে। তাহলে সার্ভারে আবার validation কেন?'
      a: 'client-এর পরীক্ষা শুধু ব্যবহারকারীর সুবিধা। কেউ সরাসরি API ডাকলে বা কোড বদলালে তা এড়িয়ে যায়, তাই আসল পরীক্ষা সার্ভারেই।'

  - slug: server-computes-price
    title: 'দাম সার্ভার বানায়, client শুধু আইটেম পাঠায়'
    kind: howto
    tldr: 'client পাঠাবে শুধু product id আর সংখ্যা। দাম, ছাড় আর মোট সার্ভার নিজের ডেটাবেস থেকে হিসাব করে ফেরত দেয়।'
    keywords: ['price calculation', 'MapRequestPayload', 'trust client', 'total', 'discount', 'দাম হিসাব']
    blocks:
      - type: text
        body: |
          পুরনো কোডে client `total` আর `discount` পাঠাত আর সার্ভার সেটাই সরাসরি রাখত। উল্টে দাও: client শুধু বলে কী কিনতে চায়, সার্ভার ডেটাবেসের আসল দাম দিয়ে হিসাব করে। response-এ হিসাব ফেরত যায়, যাতে client শুধু দেখায়।
      - type: code
        lang: php
        file: 'src/Controller/OrderController.php'
        variant: bad
        code: |
          #[Route('/api/orders', methods: ['POST'])]
          public function create(Request $request, EntityManagerInterface $em): JsonResponse
          {
              $data = $request->toArray();

              $order = new Order($this->getUser());
              $order->setTotal($data['total']);        // client-এর হিসাব বিশ্বাস
              $order->setDiscount($data['discount']);  // ছাড়ও client-এর কথায়
              $em->persist($order);
              $em->flush();

              return $this->json(['id' => $order->getId()], 201);
          }
        marks:
          - {line: 7, tip: 'DevTools-এ total বদলালেই এখানে ১ টাকা ঢুকবে। সার্ভার কিছুই যাচাই করছে না।'}
          - {line: 8, tip: 'ছাড়ের পরিমাণও ব্যবহারকারী ঠিক করছে। যেকোনো ছাড় নিয়ে নেওয়া যায়।'}
      - type: code
        lang: php
        file: 'src/Service/PriceCalculator.php'
        variant: good
        code: |
          final readonly class PriceCalculator
          {
              public function __construct(
                  private ProductRepository $products,
                  private DiscountPolicy $discounts,
              ) {
              }

              /** @param list<CartItem> $items শুধু product id আর সংখ্যা */
              public function quote(array $items): Quote
              {
                  $subtotal = 0;
                  foreach ($items as $item) {
                      $product = $this->products->find($item->productId)
                          ?? throw new ProductNotFoundException($item->productId);

                      $subtotal += $product->getPricePaisa() * $item->quantity;
                  }

                  $discount = $this->discounts->forSubtotal($subtotal);

                  return new Quote($subtotal, $discount, $subtotal - $discount);
              }
          }
        marks:
          - {line: 14, tip: 'দাম আসছে ডেটাবেস থেকে, client-এর কথা থেকে নয়। অজানা product হলে exception।'}
          - {line: 17, tip: 'টাকা পয়সায় (পূর্ণসংখ্যা)। float-এ টাকা রাখলে ভগ্নাংশের ভুল জমে।'}
          - {line: 20, tip: 'ছাড়ের নিয়ম এক জায়গায়, DiscountPolicy-তে। ১০% থেকে ১২% করতে শুধু এখানে হাত দাও।'}
    aside:
      - type: tips
        items:
          - 'controller শুধু `#[MapRequestPayload] CreateOrderRequest` নিয়ে PriceCalculator ডাকবে। কোনো হিসাব controller-এ নয়।'
          - 'response-এ `subtotal`, `discount`, `total` ফেরত দাও, যাতে client হিসাব করতেই না যায়, শুধু দেখায়।'
          - 'টাকা সবসময় পূর্ণসংখ্যায় (পয়সা) রাখো, float নয়।'
      - type: refs
        items:
          - {to: 'ledgers/modeling-money', label: 'টাকা মডেল করা: কেন float নয়'}
    check:
      q: 'checkout API-তে client কোন তথ্য পাঠাবে আর কোনটা পাঠাবে না, আর দামটা কে হিসাব করবে?'
      a: 'client পাঠাবে product id আর সংখ্যা। total, discount পাঠাবে না। দাম সার্ভার ডেটাবেসের আসল দাম আর নিয়ম দিয়ে হিসাব করবে।'

  - slug: abilities-flag
    title: 'বোতাম দেখাবে কে ঠিক করে'
    kind: howto
    tldr: 'অনুমতির নিয়ম সার্ভারে (Voter) থাকে। response-এ `abilities` flag পাঠাও, client সেটা দেখে বোতাম দেখায় বা লুকায়; আসল কাজে সার্ভার আবার যাচাই করে।'
    keywords: ['Voter', 'IsGranted', 'abilities', 'permissions in UI', 'v-if', 'অনুমতি', 'বোতাম']
    blocks:
      - type: text
        body: |
          "অর্ডার বাতিল করো" বোতামটা কখন দেখাবে? যদি Vue-তে `if (order.status === 'placed' && order.owner === me)` লেখো, তাহলে নিয়মটা দ্বিতীয়বার লেখা হলো, আর এক জায়গায় বদলালে অন্যটা পুরনো থাকে। তার চেয়ে সার্ভার Voter দিয়ে সিদ্ধান্ত নিক, আর response-এ জানিয়ে দিক "এই ব্যবহারকারী এটা করতে পারে"।
      - type: code
        lang: php
        file: 'src/Controller/Api/V1/OrderController.php'
        variant: good
        code: |
          #[Route('/api/v1/orders/{id}', methods: ['GET'])]
          public function show(Order $order): JsonResponse
          {
              return $this->json([
                  'id' => $order->getId(),
                  'status' => $order->getStatus()->value,
                  'abilities' => [
                      'cancel' => $this->isGranted(OrderVoter::CANCEL, $order),
                  ],
              ]);
          }

          #[Route('/api/v1/orders/{id}/cancel', methods: ['POST'])]
          #[IsGranted(OrderVoter::CANCEL, subject: 'order')]
          public function cancel(Order $order, OrderCanceller $canceller): JsonResponse
          {
              $canceller->cancel($order);

              return $this->json(null, Response::HTTP_NO_CONTENT);
          }
        marks:
          - {line: 7, tip: 'একই Voter ডেকে সিদ্ধান্ত নেওয়া হচ্ছে। client সেটার ফলাফলটাই পায়, নিয়ম নয়।'}
          - {line: 13, tip: 'আসল cancel-এও একই Voter। client-এর flag যা-ই বলুক, সার্ভার আবার যাচাই করে।'}
      - type: code
        lang: vue
        file: 'src/components/CancelButton.vue'
        variant: good
        code: |
          <script setup lang="ts">
          defineProps<{ order: { id: number; abilities: { cancel: boolean } } }>()
          const emit = defineEmits<{ cancel: [id: number] }>()
          </script>

          <template>
            <button v-if="order.abilities.cancel" @click="emit('cancel', order.id)">
              অর্ডার বাতিল করো
            </button>
          </template>
        marks:
          - {line: 7, tip: 'v-if শুধু সার্ভারের flag দেখছে। নিয়ম বদলালে client-এর কোড বদলাতে হয় না।'}
    aside:
      - type: pitfalls
        items:
          - 'flag দিয়ে বোতাম লুকানো নিরাপত্তা নয়, শুধু ভালো UX। আসল কাজের endpoint-এ অনুমতি যাচাই না থাকলে যে কেউ সরাসরি API ডাকতে পারে।'
          - 'অনুমতির নিয়ম বদলালে, যেমন "শিপ হওয়ার পরও ১ ঘণ্টা বাতিল চলবে", সার্ভারের Voter বদলাও; client অপরিবর্তিত।'
      - type: refs
        items:
          - {to: 'security/authorization-models', label: 'Voter আর অনুমতির মডেল'}
    check:
      q: 'Vue-তে বোতাম লুকালেই কি অনুমতির কাজ শেষ? কেন, কেন নয়?'
      a: 'না। লুকানো শুধু UX। কেউ সরাসরি endpoint ডাকতে পারে, তাই সার্ভারে #[IsGranted] দিয়ে আবার যাচাই করতে হয়।'

