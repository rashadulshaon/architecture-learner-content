            tip: 'ক্যারিয়ার-NAT, অফিস বা স্কুলে অনেক মানুষ একই IP ব্যবহার করে, তাই সীমা ঢিলা রাখতে হয়।'
          - cells: ['User id', 'লগইন করা ব্যবহারকারী', 'লগইনের আগে কাজ করে না']
            tip: 'সবচেয়ে ন্যায্য, কারণ মানুষ ধরে গোনা হয়। কিন্তু login endpoint-এ তো এখনো কেউ লগইন নেই।'
          - cells: ['API key', 'পার্টনার, বাইরের client', 'key ফাঁস হলে অন্যে ব্যবহার করে']
            tip: 'প্রতিটা পার্টনারের আলাদা সীমা আর আলাদা quota দেওয়া যায়। ফাঁস হলে শুধু সেই key বাতিল করলেই হয়।'
          - cells: ['Endpoint', 'login, OTP, পাসওয়ার্ড রিসেট', 'শুধু এটাই করলে বাকিটা খোলা']
            tip: 'পাসওয়ার্ড অনুমান ঠেকাতে login-এ আলাদা কড়া সীমা: যেমন ১৫ মিনিটে ৫ বার।'
      - type: code
        lang: yaml
        file: 'config/packages/rate_limiter.yaml'
        variant: good
        code: |
          framework:
              rate_limiter:
                  api_free:
                      policy: 'token_bucket'
                      limit: 30
                      rate: { interval: '1 minute', amount: 30 }
                  api_partner:
                      policy: 'token_bucket'
                      limit: 600
                      rate: { interval: '1 minute', amount: 600 }
                  login:
                      policy: 'sliding_window'
                      limit: 5
                      interval: '15 minutes'
        marks:
          - {line: 3, tip: 'বিনা পয়সার ব্যবহারকারীর জন্য ছোট সীমা।'}
          - {line: 7, tip: 'পার্টনারের জন্য বড় সীমা, চুক্তি অনুযায়ী। প্রতিটা plan-এর আলাদা limiter।'}
          - {line: 11, tip: 'login-এ sliding window: ১৫ মিনিটের যেকোনো জানালায় ৫ বারের বেশি নয়। brute force ঠেকায়।'}
      - type: code
        lang: php
        file: 'src/EventListener/ApiRateLimitListener.php'
        variant: good
        code: |
          // লগইন থাকলে মানুষ গুনুন; না থাকলে IP গুনুন
          $key = $user !== null ? 'user-'.$user->getUserIdentifier() : 'ip-'.$request->getClientIp();
          $this->apiFreeLimiter->create($key)->consume()->ensureAccepted();

          // login: IP + email, যাতে আক্রমণকারী ভুক্তভোগীকে তার নিজের IP থেকে আটকাতে না পারে
          $loginKey = $request->getClientIp().'|'.mb_strtolower($email);
          $this->loginLimiter->create($loginKey)->consume()->ensureAccepted();
        marks:
          - {line: 2, tip: 'prefix থাকায় user আর IP-র হিসাব আলাদা থাকে। মোবাইল ডেটার একজন নিজের নামেই গোনা হয়, একই IP-র হাজার মানুষের একজন হিসেবে নয়।'}
          - {line: 6, tip: 'শুধু email ধরলে আক্রমণকারী ভুক্তভোগীর ৫টা সুযোগ শেষ করে দিতে পারত। key-তে IP থাকলে শুধু আক্রমণকারীর নিজের বাক্স ভরে।'}
      - type: quote
        body: 'Rate limit হলো প্রতি মিনিটের হার; quota হলো মাসের মোট বরাদ্দ। দুটোই লাগে, আর দুটো আলাদা।'
    aside:
      - type: pitfalls
        items:
          - 'quota আলাদা জিনিস: মাসে ১ লাখ request-এর বরাদ্দ সাধারণত ডেটাবেস বা Redis counter-এ রাখা হয়, rate limiter-এ নয়।'
          - 'নিরাপদ error বার্তা দিন: "অনেক বেশি চেষ্টা" ভালো, "এই ইমেইলের জন্য সীমা শেষ" নয়, কারণ তাতে ইমেইলটা আছে কি না জানা যায়।'
      - type: tips
        items:
          - 'login-এর জন্য Symfony Security-র `login_throttling` চালু করলে এই কাজ অনেকটা তৈরিই পাবে।'
          - 'কড়া login সীমার দাম: ৫ বার ভুল টাইপ করা আসল ব্যবহারকারী ১৫ মিনিট আটকে যান। পরিষ্কার বার্তা আর রিসেট লিংক দিন।'
      - type: refs
        items:
          - {to: 'security/authn-authz', label: 'login আর পাসওয়ার্ড অনুমান ঠেকানো'}
    check:
      q: 'শুধু IP ধরে সীমা দিলে মোবাইল ডেটার ব্যবহারকারীদের কেন সমস্যা হয়, আর login-এর সীমা আলাদা কেন?'
      a: 'এক ক্যারিয়ার-IP-তে হাজার মানুষ থাকে, তাই একজনের দোষে সবাই আটকায়। login-এ পাসওয়ার্ড অনুমান ঠেকাতে আলাদা কড়া সীমা লাগে।'

flashcards:
  - q: 'Rate limit আর quota-র পার্থক্য কী?'
    a: 'Rate limit: অল্প সময়ে (মিনিটে) কত request। Quota: দিন বা মাস ধরে মোট কতটা ব্যবহার।'
    more: |
      rate limit হঠাৎ ভিড় ও ভুল লুপ থামায়। quota ব্যবসার বরাদ্দ ঠিক করে, যেমন plan অনুযায়ী মাসে ১ লাখ request। দুটোরই 429 দেওয়া যায়, কিন্তু রাখা হয় আলাদা জায়গায়।
    ref: one-noisy-client
  - q: 'Rate limit কেন দরকার, যদি কেউ আক্রমণ না-ই করে?'
    a: 'ভুল লুপ বা bug-ও বিপুল request ছোড়ে। একজনের ভুল যেন সবার সেবা ধীর না করে।'
    more: |
      এটাকে noisy neighbour সমস্যা বলে: এক প্রতিবেশীর হট্টগোলে পুরো পাড়া অতিষ্ঠ। সীমা না থাকলে ডেটাবেসের সংযোগ ফুরায়, আর সাধারণ ব্যবহারকারীর পাতা খোলে না।
    ref: one-noisy-client
  - q: 'Token bucket কীভাবে কাজ করে?'
    a: 'বাক্সে সময়ের সাথে টোকেন জমে। প্রতি request একটা খরচ করে। বাক্স খালি হলে অপেক্ষা করতে হয়।'
    more: |
      দুটো সংখ্যা: বাক্সের আকার (burst কতটা) আর ভরার হার (গড়ে কত)। ছোট burst সহ্য হয়, কিন্তু দীর্ঘ চাপে গড় হারই নিয়ম। Symfony RateLimiter-এ `limit` হলো আকার, `rate` হলো হার।
    ref: bucket-and-windows
  - q: 'Fixed window-এর দুর্বলতা কী?'
    a: 'জানালার সীমানায় সীমার দ্বিগুণ request ঢুকতে পারে: এক মিনিটের শেষে ১০০, পরের শুরুতে ১০০।'
    more: |
      কারণ জানালা শেষ হলেই গোনা শূন্য হয়। sliding window যেকোনো ৬০ সেকেন্ডের চলমান জানালায় গোনে, তাই এই ফাঁক নেই। তবে তাতে বেশি মেমরি লাগে।
    ref: bucket-and-windows
  - q: 'সীমা পেরোলে API কোন status আর header দেয়?'
    a: '`429 Too Many Requests` আর `Retry-After` header, যাতে লেখা কত সেকেন্ড পরে আবার চেষ্টা করা যাবে।'
    more: |
      Symfony-তে `TooManyRequestsHttpException($retryAfterSeconds)` ছুঁড়লে এই দুটোই তৈরি হয়। client Retry-After দেখে সঠিক সময়ে ফেরে। না থাকলে নিজে backoff করে।
    ref: symfony-rate-limiter
  - q: 'Rate limit-এর key কেন এমন হতে হবে যা client বিনা খরচে বানাতে পারে না?'
    a: 'key যদি যাচাই-না-করা header হয়, client প্রতি request-এ নতুন এলোমেলো মান পাঠিয়ে প্রতিবার নতুন বাক্স পায়। যাচাই-করা key, user id বা IP ব্যবহার করুন।'
    more: |
      প্রতিটা আলাদা key-র নিজস্ব বাক্স থাকে, তাই client ইচ্ছেমতো key বানাতে পারলে সীমা টেকে না। API key আগে ডেটাবেসে খুঁজে দেখুন; চেনা না হলে IP ধরুন। client-এর হাতের যেকোনো মানের বেলায় একই কথা খাটে।
    ref: symfony-rate-limiter
  - q: 'Exponential backoff আর jitter কেন একসাথে?'
    a: 'Backoff প্রতিবার অপেক্ষা দ্বিগুণ করে। Jitter তাকে এলোমেলো করে, যাতে হাজার client একই মুহূর্তে ফিরে না আসে।'
    more: |
      jitter ছাড়া সব client একই তালে ১, ২, ৪ সেকেন্ড পরে ফেরে, আর সার্ভার আবার ধরাশায়ী হয়। এলোমেলো অপেক্ষা তাদের সময়ে ছড়িয়ে দেয়। retry শুধু idempotent request-এ করুন।
    ref: backoff-with-jitter
  - q: 'শুধু IP ধরে rate limit বসালে কী সমস্যা?'
    a: 'অনেক মানুষ একই IP ব্যবহার করে (মোবাইল ক্যারিয়ার, অফিস), একজনের দোষে সবাই আটকে যায়। load balancer-এর পেছনে সবার IP একই দেখাতেও পারে।'
    more: |
      লগইন-করা ব্যবহারকারীর জন্য user id, বাইরের client-এর জন্য API key ধরুন। IP শুধু লগইনের আগের অজানা ট্র্যাফিকে। load balancer থাকলে `trusted_proxies` ঠিক না করলে আসল IP-ই পাবে না।
    ref: choose-the-key

quiz:
  - q: 'একটা পার্টনারের script প্রতি সেকেন্ডে ৩০ বার API ডাকছে, আর বাকি সব ব্যবহারকারী ধীরে ভুগছে। সবচেয়ে সঠিক প্রতিকার কোনটা?'
    hint: 'সমস্যা একজনের ভার, বাকিদের নয়।'
    options:
      - text: 'প্রতিটা client-এর (API key-র) আলাদা rate limit বসানো, যাতে একজন বেশি করলে শুধু সে আটকায়'
        correct: true
        why: 'সীমা key ধরে হলে ক্ষতিটা সেই একজনের মধ্যেই আটকে থাকে, বাকিরা স্বাভাবিক থাকে।'
      - text: 'সার্ভার আরও বাড়ানো'
        correct: false
        why: 'লুপ আরও বেশি request ছুঁড়তে পারে। সীমা না থাকলে যত সার্ভারই দিন, একজনের ভুল সবই খেয়ে ফেলবে।'
      - text: 'পুরো API-তে সব ব্যবহারকারীর জন্য একটা সাধারণ সীমা: মোট মিনিটে ১০০০'
        correct: false
        why: 'এতে লুপই ১০০০ শেষ করে, আর সাধারণ ব্যবহারকারীরা ১০০০-এর অংশ পায় না। সীমা আলাদা key ধরে হতে হবে।'
      - text: 'পার্টনারকে ইমেইল করে বলা script ঠিক করতে, আর কিছু না করা'
        correct: false
        why: 'ইমেইল ভালো, কিন্তু নিজের সিস্টেম রক্ষা না করলে পরের বারও একই ঘটনা ঘটে।'
    ref: one-noisy-client
  - q: 'নিচের config-এ `limit` আর `rate` আলাদা করে কী নির্ধারণ করছে?'
    lang: yaml
    code: |
      api_per_client:
          policy: 'token_bucket'
          limit: 100
          rate: { interval: '1 minute', amount: 20 }
    hint: 'একটা বাক্সের আকার, আরেকটা ভরার গতি।'
    options:
      - text: 'বাক্সে সর্বোচ্চ ১০০ টোকেন জমে (burst), আর প্রতি মিনিটে ২০টা করে ভরে (গড় হার)'
        correct: true
        why: 'limit মানে burst-এর সীমা, rate মানে ভরার গতি। দুটো আলাদা সংখ্যা।'
      - text: 'মিনিটে ১০০ আর সেকেন্ডে ২০ request'
        correct: false
        why: 'rate-এর interval মিনিট, সেকেন্ড নয়। আর limit কোনো সময়ের কথা বলে না।'
      - text: 'দুটোই একই জিনিস, লেখার দুই উপায়'
        correct: false
        why: 'একটা আকার, আরেকটা গতি। আলাদা না হলে burst আর গড় আলাদা করে ঠিক করা যেত না।'
      - text: 'মোট দিনে ১০০ request, আর মিনিটে ২০'
        correct: false
        why: 'এখানে দিনের কোনো কথা নেই। দিন বা মাসের হিসাব quota, rate limiter-এ নয়।'
    ref: symfony-rate-limiter
  - q: 'নিচের listener rate limit-এর key হিসেবে কাঁচা X-Api-Key header ধরেছে। scripted client কীভাবে সীমা এড়াতে পারে?'
    lang: php
    code: |
      $key = $request->headers->get('X-Api-Key') ?? $request->getClientIp();
      $limit = $this->apiPerClientLimiter->create($key)->consume();
    hint: 'প্রতিটা নতুন key-মান কী পায়?'
    options:
      - text: 'প্রতি request-এ আলাদা বানানো X-Api-Key পাঠিয়ে, ফলে প্রতিটা নতুন, ভরা বাক্সে পড়ে'
        correct: true
        why: 'header কখনো যাচাই হয় না, আর প্রতিটা আলাদা key-র নিজস্ব বাক্স আছে। ব্যবহারের আগে key যাচাই করুন।'
      - text: 'refill-এর হারের চেয়ে ধীরে request পাঠিয়ে'
        correct: false
        why: 'এটা তো সীমা মেনে চলা, এড়ানো নয়।'
      - text: 'header-এর মান খুব লম্বা করে, যাতে limiter উপচে পড়ে'
        correct: false
        why: 'key-র দৈর্ঘ্যে বাক্স গোনার নিয়ম বদলায় না।'
      - text: 'পারে না, কারণ সীমা IP-র ওপরও খাটে'
        correct: false
        why: 'header না থাকলে তবেই IP নেওয়া হয়; যেকোনো header-মান পাঠালেই IP বাদ পড়ে।'
    ref: symfony-rate-limiter
  - q: 'client 429 পেয়ে `Retry-After: 3` দেখতে পেল। কী করা উচিত?'
    hint: 'সার্ভার নিজেই কিছু বলেছে কি?'
    options:
      - text: 'সাথে সাথে আবার পাঠানো, হয়তো এবার চলবে'
        correct: false
        why: 'সীমা এখনো পেরোনো, আবার পাঠালে আবার 429 আর সার্ভারে বাড়তি চাপ।'
      - text: 'প্রায় ৩ সেকেন্ড অপেক্ষা করে (সাথে একটু jitter দিয়ে) আবার পাঠানো'
        correct: true
        why: 'সার্ভার নিজেই সময় বলে দিয়েছে। jitter অনেক client একসাথে ফেরা এড়ায়।'
      - text: 'ব্যবহারকারীকে "ব্যর্থ" দেখিয়ে থামা, retry নয়'
        correct: false
        why: 'সীমা সাময়িক, কিছুক্ষণ পরে কাজ হবে। ব্যবহারকারীকে অকারণ ব্যর্থ দেখানো ঠিক নয় (idempotent কাজে)।'
      - text: 'নতুন API key বানিয়ে সীমা এড়ানো'
        correct: false
        why: 'এটা সীমা ফাঁকি দেওয়া, আর সার্ভিসের শর্ত ভাঙা।'
    ref: backoff-with-jitter
  - q: 'নিচের কোন কোন কারণে IP-ভিত্তিক rate limit এড়ানো ভালো, বা অন্য key-র সাথে মেলানো উচিত?'
    hint: 'একটা IP-র পেছনে কতজন থাকতে পারে?'
    options:
      - text: 'মোবাইল ক্যারিয়ার হাজার ব্যবহারকারীকে একই পাবলিক IP-তে পাঠায়'
        correct: true
        why: 'একজনের দোষে হাজার জনের request আটকে যায়।'
      - text: 'load balancer-এর পেছনে trusted_proxies ঠিক না থাকলে সবার IP একই দেখায়'
        correct: true
        why: 'getClientIp() load balancer-এর IP দেয়, তাই সবাই এক জন বলে গোনা হয়।'
      - text: 'IP-র দৈর্ঘ্য ছোট বলে'
        correct: false
        why: 'এর সাথে সীমা বসানোর কোনো সম্পর্ক নেই।'
      - text: 'লগইন-করা ব্যবহারকারীদের জন্য user id আরও ন্যায্য'
        correct: true
        why: 'মানুষ ধরে গোনা হলে একজনের আচরণ অন্যকে প্রভাবিত করে না।'
    ref: choose-the-key
  - q: 'পাসওয়ার্ড অনুমান ঠেকাতে `/login` endpoint-এর জন্য কোন ব্যবস্থা সবচেয়ে বেশি যুক্তিসংগত?'
    hint: 'সাধারণ API-র চেয়ে এখানে সীমা কেমন হওয়া উচিত?'
    options:
      - text: 'সাধারণ API-র একই সীমা (মিনিটে ১০০), কারণ সহজ রাখা ভালো'
        correct: false
        why: 'মিনিটে ১০০ বার পাসওয়ার্ড অনুমানের সুযোগ খুব বেশি। login-এ কড়া সীমা চাই।'
      - text: 'আলাদা কড়া limiter, যেমন ১৫ মিনিটে ৫ বার (sliding window), IP আর ইমেইল ধরে'
        correct: true
        why: 'brute force ধীর হয়, আর সাধারণ ব্যবহারকারীর স্বাভাবিক ভুল সহ্য হয়।'
      - text: 'কোনো সীমা নয়, শুধু সবল পাসওয়ার্ড দাবি করা'
        correct: false
        why: 'সবল পাসওয়ার্ড ভালো, কিন্তু সীমা ছাড়া আক্রমণকারী লাখো পাসওয়ার্ড ছুঁড়তে পারে।'
      - text: 'প্রতি request-এ ৫ সেকেন্ড ঘুমানো'
        correct: false
        why: 'সবার জন্যই ধীর হয়, আর আক্রমণকারী একসাথে অনেক request ছুঁড়ে ফাঁকি দিতে পারে।'
    ref: choose-the-key
