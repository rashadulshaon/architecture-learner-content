slides:
  - slug: one-noisy-client
    title: 'একজনের লুপে সবার সাইট ধীর'
    kind: story
    tldr: 'একটা client (ভুল লুপ, স্ক্র্যাপার, দুষ্টু বট) হাজার হাজার request ছুঁড়লে বাকি সবার উত্তর ধীর হয়। সীমা না থাকলে এক ভুলেই পুরো API নিচে নামে।'
    keywords: ['rate limit', 'noisy neighbor', 'abuse', 'DoS', 'request flood', 'রেট লিমিট']
    blocks:
      - type: text
        body: |
          রহিমের পার্টনার কোম্পানির একটা script-এ ভুলে `while(true)` লুপ ঢুকে গেল, আর সেটা প্রতি সেকেন্ডে ৩০ বার রহিমের API ডাকতে লাগল। প্রতিটা call প্রায় এক সেকেন্ড ডেটাবেসের একটা সংযোগ ধরে রাখত, আর pool-এ ছিল মাত্র কয়েক ডজন, তাই কয়েক মিনিটে সংযোগ ফুরিয়ে গেল, আর সাধারণ ব্যবহারকারীদের পাতা ৩০ সেকেন্ডেও খুলছে না। কেউ আক্রমণ করেনি, একজনের ভুলেই সবার ক্ষতি। সমাধান হলো প্রতি client-এর আলাদা সীমা, শেষ bar-এ দেখুন।
      - type: visual
        kind: bars
        caption: 'প্রতি মিনিটে client-ভিত্তিক request (উদাহরণ)'
        items:
          - {label: 'ব্যবহারকারী ক', value: 12, display: '12', tone: good, tip: 'সাধারণ ব্যবহারকারী, মিনিটে হাতে-গোনা request করে।'}
          - {label: 'ব্যবহারকারী খ', value: 15, display: '15', tone: good, tip: 'আরেকজন সাধারণ ব্যবহারকারী। দুজনেই সীমার অনেক নিচে।'}
          - {label: 'ব্যবহারকারী গ', value: 8, display: '8', tone: good, tip: 'আরও কম। এরা সবাই নিয়মিত কাজ করছে।'}
          - {label: 'পার্টনারের লুপ', value: 1800, display: '1800', tone: bad, tip: 'ভুল লুপের কারণে একাই তিনজন ব্যবহারকারীর মোট ভারের (মিনিটে ৩৫) প্রায় ৫০ গুণ।'}
          - {label: 'একই লুপ, ১০০/মিনিট সীমা', value: 100, display: '100', tone: good, tip: 'একই লুপ, কিন্তু client-প্রতি সীমা আছে: প্রতি মিনিটে ১০০টা request পার হয়, বাকিগুলো 429 পায়। উপরের তিনজন কিছুই টের পান না।'}
      - type: quote
        body: 'সীমা ছাড়া API মানে নিজের দরজা সবার জন্য খুলে রাখা, একজনের ভুল বা অসততাও সবাইকে ভোগায়।'
    aside:
      - type: problem
        body: 'একজন client যেন সার্ভারের সব ক্ষমতা একাই খেয়ে ফেলতে না পারে। সীমা দেওয়ার কাজ ওই একজনকে থামানো, যাতে বাকিরা ভালো থাকে।'
      - type: terms
        items:
          - {term: 'Rate limit', meaning: 'নির্দিষ্ট সময়ে একজন client কতগুলো request করতে পারবে, তার সীমা।'}
          - {term: 'Quota', meaning: 'দিন বা মাস ধরে মোট কতটা ব্যবহার করা যাবে, তার বরাদ্দ। যেমন মাসে ১ লাখ request।'}
    check:
      q: 'কেউ আক্রমণ না করলেও কেন rate limit লাগে?'
      a: 'ভুল লুপ বা bug-ও বিপুল request ছুড়তে পারে। একজনের ভুল যেন বাকি সবার সেবা ধীর না করে, সেজন্য সীমা দরকার।'

  - slug: bucket-and-windows
    title: 'ফুচকার কুপন: token bucket'
    kind: concept
    tldr: 'Token bucket: বাক্সে সময়ের সাথে টোকেন জমে, প্রতি request একটা খরচ করে, বাক্স খালি হলে অপেক্ষা। ছোট burst চলে, দীর্ঘ চাপ থামে।'
    keywords: ['token bucket', 'fixed window', 'sliding window', 'burst', 'leaky bucket', 'টোকেন বাকেট']
    blocks:
      - type: metaphor
        icon: ticket
        title: 'ফুচকার মামার কুপন'
        body: |
          মামা প্রতি মিনিটে ১০টা কুপন ছাপান, আর কাউন্টারের বাক্সে সর্বোচ্চ ২০টা জমে। কুপন দিলে এক প্লেট ফুচকা। হঠাৎ ভিড় এলে জমানো ২০টা কুপনে ২০ প্লেট একসাথে যায় (burst), কিন্তু তারপর শুধু মিনিটে ১০টা। বাক্স খালি থাকলে "একটু পরে আসুন"।
      - type: visual
        kind: table
        caption: 'তিনটা প্রচলিত পদ্ধতির তুলনা'
        headers: ['পদ্ধতি', 'কীভাবে কাজ করে', 'ভালো দিক', 'দুর্বলতা']
        rows:
          - cells: ['Fixed window', 'প্রতি মিনিটে সর্বোচ্চ ১০০, মিনিট শেষে শূন্য', 'সবচেয়ে সরল', 'মিনিটের সীমায় ২ গুণ ঢোকে']
            tip: 'কেউ ০:৫৯-এ ১০০টা আর ১:০০-তে ১০০টা পাঠালে ২ সেকেন্ডে ২০০ request ঢুকে যায়, অথচ নিয়ম ভাঙেনি।'
          - cells: ['Sliding window', 'যেকোনো ৬০ সেকেন্ডের জানালায় সর্বোচ্চ ১০০', 'সীমার সীমানায় ফাঁক নেই', 'বেশি মেমরি লাগে']
            tip: 'জানালা প্রতি মুহূর্তে সরে যায়, তাই fixed window-এর সীমানার ফাঁকটা থাকে না।'
          - cells: ['Token bucket', 'টোকেন জমে, request একটা খরচ করে', 'burst সামলায়, গড় হার নিয়ন্ত্রণে', 'দুটো সংখ্যা ঠিক করতে হয়']
            tip: 'bucket-এর আকার (burst কত) আর ভরার হার (গড়ে কত) দুটো আলাদা সংখ্যা, দুটোই ভাবতে হয়।'
      - type: quote
        body: 'গড় হার ঠিক করে ভরার গতি, burst ঠিক করে বাক্সের আকার। দুটো আলাদা সংখ্যা।'
    aside:
      - type: remember
        body: 'বাক্স ছোট হলে burst নেই, বাক্স বড় হলে আগে জমিয়ে একসাথে ঢালা যায়।'
      - type: tips
        items:
          - 'বেশিরভাগ public API-র জন্য token bucket ভালো ডিফল্ট: ব্যবহারকারীর স্বাভাবিক burst সহ্য হয়।'
          - 'Symfony RateLimiter fixed_window, sliding_window আর token_bucket তিনটাই দেয়।'
    check:
      q: 'Fixed window-এর সীমানায় কেন সীমার দ্বিগুণ request ঢুকে যেতে পারে?'
      a: 'কারণ মিনিট শেষ হলেই গোনা শূন্য হয়। এক মিনিটের শেষে ১০০ আর পরের মিনিটের শুরুতে ১০০, কয়েক সেকেন্ডে ২০০ চলে যায়।'

  - slug: symfony-rate-limiter
    title: 'Symfony RateLimiter দিয়ে সীমা বসান'
    kind: howto
    tldr: 'framework.rate_limiter-এ policy, limit আর rate দিন; listener-এ client-এর key ধরে consume() ডাকুন; সীমা পেরোলে TooManyRequestsHttpException।'
    keywords: ['RateLimiterFactory', 'rate_limiter', 'consume', 'TooManyRequestsHttpException', 'Retry-After', 'symfony/rate-limiter']
    blocks:
      - type: text
        body: |
          প্রথমে `composer require symfony/rate-limiter`। তারপর config-এ একটা নামকরা limiter ঘোষণা করুন। সেখানে `limit` হলো বাক্সের আকার, আর `rate` হলো কত সময়ে কয়টা টোকেন ভরবে। state এমন জায়গায় রাখুন যা সব অ্যাপ সার্ভার ভাগ করে, যেমন Redis, নইলে প্রতি সার্ভারের গোনা আলাদা হয়ে যায়।
      - type: code
        lang: yaml
        file: 'config/packages/rate_limiter.yaml'
        variant: good
        code: |
          framework:
              cache:
                  pools:
                      rate_limiter_pool:
                          adapter: cache.adapter.redis
              rate_limiter:
                  api_per_client:
                      policy: 'token_bucket'
                      limit: 100
                      rate: { interval: '1 minute', amount: 100 }
                      cache_pool: 'rate_limiter_pool'
        marks:
          - {line: 5, tip: 'সব অ্যাপ সার্ভার একই Redis-এ গোনে। ফাইল cache হলে প্রতিটা সার্ভারের নিজস্ব গোনা, আর সীমা কার্যত ৩ বা ৪ গুণ হয়ে যায়।'}
          - {line: 9, tip: 'limit: বাক্সের আকার, অর্থাৎ সর্বোচ্চ একসাথে ১০০ request।'}
          - {line: 10, tip: 'rate: প্রতি মিনিটে ১০০টা টোকেন ফিরে ভরে, অর্থাৎ গড়ে মিনিটে ১০০।'}
      - type: code
        lang: php
        file: 'src/EventListener/ApiRateLimitListener.php'
        variant: good
        code: |
          #[AsEventListener]
          final readonly class ApiRateLimitListener
          {
              public function __construct(private RateLimiterFactory $apiPerClientLimiter)
              {
              }

              public function __invoke(RequestEvent $event): void
              {
                  $request = $event->getRequest();
                  if (!$event->isMainRequest() || !str_starts_with($request->getPathInfo(), '/api/')) {
                      return;
                  }

                  $key = $request->headers->get('X-Api-Key') ?? $request->getClientIp() ?? 'anonymous';
                  $limit = $this->apiPerClientLimiter->create($key)->consume();

                  if (!$limit->isAccepted()) {
                      $wait = max(1, $limit->getRetryAfter()->getTimestamp() - time());

                      throw new TooManyRequestsHttpException($wait, 'অনেক বেশি request');
                  }
              }
          }
        marks:
          - {line: 4, tip: 'config-এ limiter-এর নাম api_per_client, তাই autowire-এর argument-এর নাম $apiPerClientLimiter।'}
          - {line: 15, tip: 'key ঠিক করে কার হিসাব আলাদা হবে। যাচাই-করা key (চেনা API key বা user id) নিন, না থাকলে IP। যাচাই-না-করা header প্রতি request-এ নতুন বানানো যায়।'}
          - {line: 16, tip: 'consume() একটা টোকেন নেওয়ার চেষ্টা করে। বাক্স খালি হলে isAccepted() false।'}
          - {line: 21, tip: 'এই exception-টা 429 আর Retry-After header-সহ response বানায়।'}
    aside:
      - type: commands
        items:
          - {cmd: 'composer require symfony/rate-limiter', desc: 'component ইনস্টল করুন'}
          - {cmd: 'php bin/console debug:container --env-vars', desc: 'Redis-এর env ঠিক আছে কি না দেখুন'}
      - type: pitfalls
        items:
          - 'header থেকে পড়া API key যাচাই না করলে সেটা নিরাপদ key নয়: client প্রতি request-এ নতুন একটা বানিয়ে প্রতিবার নতুন বাক্স পেয়ে যায়। আগে key ডেটাবেসে খুঁজে দেখুন, নইলে IP ধরুন।'
          - 'load balancer-এর পেছনে trusted_proxies না দিলে getClientIp() সবার জন্য একই IP দেয়, আর সীমা সবাইকে একসাথে আটকায়।'
      - type: refs
        items:
          - {to: 'api/request-path', label: 'trusted_proxies আর আসল client IP'}
    check:
      q: 'একাধিক অ্যাপ সার্ভার থাকলে RateLimiter-এর state কেন Redis-এর মতো ভাগ করা জায়গায় রাখা উচিত?'
      a: 'নইলে প্রতিটা সার্ভার নিজের মতো গোনে। তিনটা সার্ভারে সীমা কার্যত তিন গুণ হয়ে যায়, আর client সহজে সীমা ডিঙায়।'

  - slug: backoff-with-jitter
    title: '429 পেলে client কী করবে'
    kind: howto
    tldr: 'সার্ভার 429 আর Retry-After দেয়। client সেই সময় মানে, না থাকলে exponential backoff আর jitter (এলোমেলো দেরি) দিয়ে আবার চেষ্টা করে।'
    keywords: ['429', 'Retry-After', 'exponential backoff', 'jitter', 'thundering herd', 'retry']
    blocks:
      - type: text
        body: |
          429 পেয়ে client যদি সাথে সাথে আবার পাঠায়, সে সমস্যাটা আরও বাড়ায়। সঠিক আচরণ: সার্ভার `Retry-After` দিলে ততক্ষণ থামুন, না দিলে প্রতিবার অপেক্ষা দ্বিগুণ করুন। আর একসাথে হাজার client একই মুহূর্তে আবার চেষ্টা করলে আবার ভিড় হয়, তাই অপেক্ষাটা এলোমেলো রাখুন, একে **jitter** বলে।
      - type: visual
        kind: bars
        caption: 'প্রতি চেষ্টায় সর্বোচ্চ অপেক্ষা দ্বিগুণ (jitter-এ আসল অপেক্ষা ০ থেকে এর মধ্যে এলোমেলো)'
        items:
          - {label: 'চেষ্টা ১', value: 1, display: '১s', tone: good, tip: 'প্রথম ব্যর্থতায় ০ থেকে ১ সেকেন্ডের মধ্যে যেকোনো এলোমেলো দেরি।'}
          - {label: 'চেষ্টা ২', value: 2, display: '২s', tone: default, tip: 'দ্বিতীয়বার ০ থেকে ২ সেকেন্ডের মধ্যে।'}
          - {label: 'চেষ্টা ৩', value: 4, display: '৪s', tone: default, tip: 'প্রতিবার সীমা দ্বিগুণ, তাই সার্ভারের ওপর চাপ ধীরে ধীরে সরে যায়।'}
          - {label: 'চেষ্টা ৫', value: 16, display: '১৬s', tone: warn, tip: 'কিছু সীমা পর্যন্ত (যেমন ৩০ সেকেন্ড) বাড়ানো হয়; তারপর হাল ছেড়ে ব্যবহারকারীকে জানানো ভালো।'}
      - type: code
        lang: ts
        file: 'src/api/backoff.ts'
        variant: good
        code: |
          // শুধু idempotent request-এ ব্যবহার করুন (GET, PUT, DELETE)
          export async function fetchWithBackoff(
            url: string,
            init: RequestInit = {},
            maxRetries = 4,
          ): Promise<Response> {
            for (let attempt = 0; ; attempt++) {
              const res = await fetch(url, init)
              const retryable = res.status === 429 || res.status === 503
              if (!retryable || attempt >= maxRetries) return res

              const retryAfter = Number(res.headers.get('Retry-After'))
              const cap = Math.min(30_000, 2 ** attempt * 1000)
              const waitMs = retryAfter > 0 ? retryAfter * 1000 : Math.random() * cap

              await new Promise((resolve) => setTimeout(resolve, waitMs))
            }
          }
        marks:
          - {line: 12, tip: 'সার্ভার নিজেই বলে দিলে সেটাই মানা সবচেয়ে ভদ্র আর সঠিক। এটা সংখ্যায় সেকেন্ড হলে এভাবে পড়া যায়।'}
          - {line: 13, tip: 'অপেক্ষা ১, ২, ৪, ৮ সেকেন্ডে বাড়ে আর ৩০ সেকেন্ডে আটকায়: exponential backoff।'}
          - {line: 14, tip: 'Math.random() দিয়ে ০ থেকে cap-এর মধ্যে এলোমেলো অপেক্ষা: jitter। হাজার client তখন একই মুহূর্তে ফেরে না।'}
    aside:
      - type: story
        title: 'সবাই একসাথে ফিরে এল'
        body: |
          একটা সার্ভিস ১ মিনিটের জন্য নিচে নামল, আর হাজার হাজার client ঠিক ১ সেকেন্ড, ২ সেকেন্ড, ৪ সেকেন্ড পরে একসাথে ফিরে সার্ভিসকে বারবার ধরাশায়ী করল। jitter না থাকলে সবার ঘড়ি একই তালে চলে।
      - type: tips
        items:
          - 'Retry-After HTTP-তারিখও হতে পারে, শুধু সেকেন্ড নয়। production কোডে দুটোই সামলান।'
          - 'অপেক্ষার সময় ব্যবহারকারীকে জানান: "একটু পরে আবার চেষ্টা হচ্ছে"।'
      - type: refs
        items:
          - {to: 'api/error-design', label: 'কোন error retry করা যায়'}
    check:
      q: 'Backoff-এর সাথে jitter যোগ করা হয় কেন?'
      a: 'jitter ছাড়া সব client একই সময়ে ফিরে আবার ভিড় তৈরি করে। এলোমেলো দেরি তাদের ছড়িয়ে দেয়, ফলে সার্ভার সামলে ওঠে।'

  - slug: choose-the-key
    title: 'কার ওপর সীমা: IP, user নাকি key'
    kind: pitfall
    tldr: 'IP ধরে সীমা দিলে এক মোবাইল ক্যারিয়ারের হাজার ব্যবহারকারী একজন গোনা হয়। সম্ভব হলে user id বা API key ধরুন, আর login-এর মতো জায়গায় কড়া আলাদা সীমা।'
    keywords: ['rate limit key', 'per IP', 'per user', 'API key', 'login throttling', 'quota', 'CGNAT']
    blocks:
      - type: text
        body: |
          বাংলাদেশে মোবাইল ডেটায় হাজার হাজার ব্যবহারকারী প্রায়ই একই পাবলিক IP থেকে বেরোয়। শুধু IP ধরে সীমা বসালে একজনের দোষে তাদের সবার request আটকে যায়। উল্টো দিকে, শুধু user id ধরলে লগইন-না-করা আক্রমণকারীকে ধরা যায় না। তাই কাজ বুঝে key বাছুন।
      - type: visual
        kind: table
        caption: 'সীমার key বাছাই'
        headers: ['key', 'কখন ভালো', 'ঝুঁকি']
