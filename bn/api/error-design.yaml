slides:
  - slug: something-went-wrong
    title: '"কিছু একটা ভুল হয়েছে"'
    kind: story
    tldr: 'সব error যদি একই অর্থহীন বার্তা বা 200 OK-র ভেতরে লুকানো হয়, client কিছুই করতে পারে না: ঠিক করা, আবার চেষ্টা করা বা থামা কোনোটাই নয়।'
    keywords: ['error response', 'status code', '200 with error', 'error message', 'ভুল বার্তা', 'API error']
    blocks:
      - type: text
        body: |
          রহিমের API ভুল ইমেইল পেলে `200 OK` দিয়ে `{"success": false, "msg": "error"}` ফেরত দেয়, আর সার্ভার ভাঙলে `500` দিয়ে একটা লম্বা stack trace। Vue অ্যাপ সব ক্ষেত্রেই লিখে "কিছু একটা ভুল হয়েছে"। ব্যবহারকারী জানে না ইমেইল ঠিক করবে নাকি অপেক্ষা করবে। আরও খারাপ, অ্যাপ কখনো ভুল ইমেইলেই তিনবার আবার পাঠায়, যেন আবার পাঠালে ইমেইল ঠিক হয়ে যাবে।
      - type: visual
        kind: compare
        caption: 'একই ভুল ইমেইলে দুই রকম উত্তর'
        columns:
          - title: 'রহিমের আজেবাজে error'
            tone: bad
            icon: cross
            tip: 'machine বা মানুষ কেউই এই উত্তর থেকে কিছু করতে পারে না।'
            items:
              - 'status 200, অথচ কাজ হয়নি'
              - 'বার্তা: "error" (কী ভুল, কোন field?)'
              - 'সার্ভার ভাঙলে stack trace ফাঁস'
              - 'client জানে না আবার চেষ্টা করবে কি না'
          - title: 'কাজের error'
            tone: good
            icon: check
            tip: 'status, কারণ আর কোড মিলে client-কে বলে দেয় এরপর কী করতে হবে।'
            items:
              - 'status 422: ইনপুট ভুল'
              - 'কোন field, কেন: email_invalid'
              - 'সার্ভারের ভেতরের কথা বাইরে যায় না'
              - 'client জানে: আবার পাঠালে লাভ নেই'
      - type: quote
        body: 'Error হলো API-র ভাষায় ব্যবহারকারী আর client-কে বলা: কী ভুল, কার ভুল, এখন কী করবে।'
    aside:
      - type: story
        title: '200 OK-র ভেতরে ব্যর্থতা'
        body: |
          একটা ব্যাংকিং অ্যাপ ব্যর্থ লেনদেনেও 200 ফেরত দিত, ভেতরে লেখা থাকত "failed"। monitoring শুধু 5xx গুনত, তাই ড্যাশবোর্ড সবুজ আর ব্যবহারকারীর টাকা আটকে। status code মিথ্যা বললে প্রতিটা টুল (cache, monitoring, retry) ভুল পথে চলে।
      - type: terms
        items:
          - {term: 'Status code', meaning: 'response-এর তিন অঙ্কের সংখ্যা, যা বলে কাজ কেমন হলো: 2xx সফল, 4xx client-এর ভুল, 5xx সার্ভারের ভুল।'}
    check:
      q: 'ব্যর্থ কাজেও 200 OK দিয়ে body-তে success: false লিখলে কোন কোন টুল ভুল পথে যায়?'
      a: 'monitoring, cache আর retry-র নীতি, কারণ সবাই status code দেখেই চলে। 200 দেখে তারা ধরে নেয় সব ঠিক আছে।'

  - slug: status-families
    title: 'ফেরত-স্লিপের মতো status code'
    kind: concept
    tldr: '2xx সফল, 4xx তোমার (client-এর) ভুল, 5xx আমাদের (সার্ভারের) ভুল। প্রতিটা code বলে ভুলটা কার, আর আবার পাঠানো কাজে লাগবে কি না।'
    keywords: ['400', '401', '403', '404', '409', '422', '429', '500', 'status code family', 'স্ট্যাটাস কোড']
    blocks:
      - type: metaphor
        icon: truck
        title: 'কুরিয়ারের ফেরত-স্লিপ'
        body: |
          কুরিয়ার পার্সেল ফেরত দিলে স্লিপে কারণ লেখে। "ঠিকানা ভুল" মানে তুমি ঠিক না করলে আবার পাঠানো বৃথা। "বাড়িতে কেউ ছিল না" মানে আবার চেষ্টা করলে হতে পারে। "আমাদের গুদামে সমস্যা" মানে দোষ কুরিয়ারের, একটু পরে আবার।
      - type: visual
        kind: table
        caption: 'সবচেয়ে কাজের status code আর তাদের অর্থ'
        headers: ['code', 'অর্থ', 'ভুল কার']
        rows:
          - cells: ['400 / 422', 'ইনপুট ভুল বা অসম্পূর্ণ', 'client-এর']
            tip: '400: অনুরোধই বোঝা যায়নি (ভাঙা JSON)। 422: বোঝা গেছে, কিন্তু মান গ্রহণযোগ্য নয় (ভুল ইমেইল)। ঠিক না করে আবার পাঠানো বৃথা।'
          - cells: ['401', 'তুমি কে, জানি না (লগইন নেই)', 'client-এর']
            tip: 'token নেই বা মেয়াদ ফুরিয়েছে। token নবায়ন করে একবার চেষ্টা করা যায়।'
          - cells: ['403', 'জানি তুমি কে, কিন্তু অনুমতি নেই', 'client-এর']
            tip: 'লগইন আছে, কিন্তু এই কাজ তোমার জন্য নয়। আবার পাঠিয়ে কিছু বদলাবে না।'
          - cells: ['404', 'এমন কিছু নেই', 'client-এর']
            tip: 'ভুল URL অথবা মুছে যাওয়া জিনিস। সিকিউরিটির কারণে অনেক সময় 403-এর জায়গায়ও 404 দেওয়া হয়।'
          - cells: ['409', 'বর্তমান অবস্থার সাথে সংঘাত', 'পরিস্থিতির']
            tip: 'যেমন স্টক শেষ, বা অন্য কেউ আগেই বদলে দিয়েছে। নতুন অবস্থা দেখে client-কে সিদ্ধান্ত নিতে হয়।'
          - cells: ['429', 'অনেক বেশি request', 'client-এর']
            tip: 'rate limit ছাড়িয়েছে। Retry-After header দেখে একটু পরে আবার করা যায়।'
          - cells: ['500 / 502 / 503 / 504', 'সার্ভার বা তার সামনের যন্ত্রের সমস্যা', 'আমাদের']
            tip: 'client-এর করার কিছু নেই। 502/503/504 সাধারণত সাময়িক, আবার চেষ্টা করা যায়।'
      - type: quote
        body: 'সার্ভারের ভুল 5xx, client-এর ভুল 4xx। ভুল কার, status-ই সেটা বলে।'
    aside:
      - type: remember
        body: '4xx: "তুমি বদলাও", 5xx: "আমরা ঠিক করছি"।'
      - type: pitfalls
        items:
          - '404 আর 403 গুলিয়ে ফেলা: অন্যের অর্ডারে 404 দিলে অস্তিত্বই লুকানো থাকে, 403 দিলে ফাঁস হয় যে অর্ডারটা আছে।'
          - 'সব ভুলে 400, অথবা সব ভুলে 500: client তখন ভুলের ধরন চেনে না।'
      - type: refs
        items:
          - {to: 'api/request-path', label: '502, 503, 504 কোন ধাপ থেকে আসে'}
    check:
      q: 'ব্যবহারকারী লগইন করা আছে কিন্তু অন্যের অর্ডার খুলতে চাইছে। 401 নাকি 403, আর কেন?'
      a: '403। সার্ভার জানে সে কে (তাই 401 নয়), কিন্তু এই কাজের অনুমতি তার নেই। অনেকে অস্তিত্ব লুকাতে 404-ও দেয়।'

  - slug: problem-json
    title: 'একটা সবার-চেনা error আকার: problem+json'
    kind: howto
    tldr: 'RFC 9457-এর application/problem+json আকারে type, title, status, detail আর নিজের machine-readable code দিয়ে সব error এক ছাঁচে ফেরত দাও।'
    keywords: ['problem+json', 'RFC 9457', 'RFC 7807', 'exception listener', 'error code', 'machine-readable error']
    blocks:
      - type: text
        body: |
          রহিম এবার ঠিক করল, সব error একই ছাঁচে যাবে। এর জন্য একটা প্রমিত আকার আছে: **problem+json**। তাতে `status`, `title`, `detail`-এর সাথে একটা `code` থাকে, যেটা client-এর কোড পড়ে। মানুষ পড়ে `detail` (বার্তা বদলাতে পারে), কোড পড়ে `code` (কখনো বদলায় না)।
      - type: visual
        kind: flow
        caption: 'exception থেকে problem+json পর্যন্ত পথ'
        nodes:
          - {id: ctrl, label: 'Controller', sub: 'exception ছোড়ে', icon: code, col: 0, row: 1, tip: 'ব্যবসার নিয়ম ভাঙলে নিজের exception ছোড়ে, যেমন InsufficientStockException। HTTP-র কথা এখানে ভাবে না।'}
          - {id: listener, label: 'ExceptionListener', sub: 'এক জায়গায় map', icon: gear, tone: accent, col: 2, row: 1, tip: 'সব exception এক জায়গায় ধরে status আর code ঠিক করে। না হলে প্রতিটা controller নিজের মতো error বানায়।'}
          - {id: client, label: 'Vue অ্যাপ', sub: 'code পড়ে সিদ্ধান্ত নেয়', icon: browser, col: 4, row: 1, tip: 'বার্তা নয়, code দেখে সিদ্ধান্ত নেয় কোন পর্দা বা কোন সংশোধন দেখাবে।'}
        edges:
          - {from: ctrl, to: listener, label: 'exception listener-এ পৌঁছায়'}
          - {from: listener, to: client, label: '409 + application/problem+json', tone: good, tip: 'status বলে ধরন, body-র code বলে সুনির্দিষ্ট কারণ।'}
      - type: code
        lang: php
        file: 'src/EventListener/ApiProblemListener.php'
        variant: good
        code: |
          #[AsEventListener]
          final class ApiProblemListener
          {
              public function __invoke(ExceptionEvent $event): void
              {
                  if (!str_starts_with($event->getRequest()->getPathInfo(), '/api/')) {
                      return;
                  }
                  $e = $event->getThrowable();
                  $violations = $e->getPrevious() instanceof ValidationFailedException
                      ? $e->getPrevious()->getViolations() : null;

                  [$status, $code] = match (true) {
                      $e instanceof InsufficientStockException => [409, 'stock_insufficient'],
                      null !== $violations => [422, 'validation_failed'],
                      $e instanceof HttpExceptionInterface => [$e->getStatusCode(), 'http_error'],
                      default => [500, 'internal_error'],
                  };

                  $body = [
                      'type' => 'https://shop.example/problems/'.$code,
                      'title' => Response::$statusTexts[$status],
                      'status' => $status,
                      'code' => $code,
                      'detail' => $status < 500 ? $e->getMessage() : 'সার্ভারে সমস্যা হয়েছে',
                  ];
                  if (null !== $violations) {
                      $body['errors'] = $this->errors($violations);
                  }

                  $event->setResponse(new JsonResponse($body, $status, [
                      'Content-Type' => 'application/problem+json',
                  ]));
              }
          }
        marks:
          - {line: 10, tip: '#[MapRequestPayload]-এর validation ব্যর্থ হলে Symfony একটা HttpException ছোড়ে, যার previous হলো ValidationFailedException।'}
          - {line: 14, tip: 'আমাদের নিজের exception থেকে status আর স্থির code বেছে নেওয়া হচ্ছে। এটাই client-এর পড়ার জিনিস।'}
          - {line: 25, tip: '5xx-এ আসল message client-কে দেওয়া হয় না। stack trace বা SQL ফাঁস হলে আক্রমণকারীর কাজে লাগে।'}
      - type: code
        lang: json
        file: 'response: 409 Conflict'
        code: |
          {
            "type": "https://shop.example/problems/stock_insufficient",
            "title": "Conflict",
            "status": 409,
            "code": "stock_insufficient",
            "detail": "স্টকে আছে ২টা, চাওয়া হয়েছে ৫টা"
          }
        marks:
          - {line: 5, tip: 'client এই code দেখে সিদ্ধান্ত নেয়। detail-এর ভাষা বা বাক্য বদলালেও code একই থাকে।'}
    aside:
      - type: tips
        items:
          - 'error code ছোট, ইংরেজি, snake_case আর চিরস্থায়ী রাখো: stock_insufficient। এটা API contract-এর অংশ, একবার দিলে বদলানো যায় না।'
          - 'প্রতিটা error response-এ request id দাও, যাতে ব্যবহারকারীর অভিযোগ তোমার log-এর সাথে মেলানো যায়।'
      - type: refs
        items:
          - {to: 'api/contracts-versioning', label: 'error code-ও contract-এর অংশ'}
    check:
      q: 'client কোড কেন `detail` বার্তা নয়, `code` ফিল্ড দেখে সিদ্ধান্ত নেবে?'
      a: 'detail মানুষের জন্য, ভাষা বা বাক্য বদলাতে পারে। code স্থির ও চুক্তির অংশ, তাই client-এর কোড তার ওপর নির্ভর করতে পারে।'

  - slug: validation-errors
    title: 'Validation error: কোন field-এ কী ভুল'
    kind: howto
    tldr: 'একটা ফর্মে একসাথে সব ভুল দাও: প্রতিটার field, machine-readable code আর বার্তা সহ। তাহলে client প্রতিটা ঘরের পাশে ঠিক ভুলটা দেখাতে পারে।'
    keywords: ['validation error', '422', 'MapRequestPayload', 'Validator', 'violations', 'field error', 'ফর্ম ভুল']
    blocks:
      - type: text
        body: |
          রেজিস্ট্রেশন ফর্মে ইমেইলও ভুল, পাসওয়ার্ডও ছোট। প্রথম ভুলটাই ফেরত দিলে ব্যবহারকারী ঠিক করবে, আবার পাঠাবে, আর দ্বিতীয় ভুলে আটকাবে। তাই সব ভুল একসাথে `errors` তালিকায় দাও, প্রতিটার সাথে `field` আর স্থির `code`।
      - type: code
        lang: php
        file: 'src/Dto/RegisterRequest.php'
        variant: good
        code: |
          final readonly class RegisterRequest
          {
              public function __construct(
                  #[Assert\NotBlank(message: 'ইমেইল দিন', payload: ['code' => 'email_required'])]
                  #[Assert\Email(message: 'ইমেইলটা ঠিক নয়', payload: ['code' => 'email_invalid'])]
                  public string $email = '',

                  #[Assert\Length(
                      min: 8,
                      minMessage: 'কমপক্ষে ৮ অক্ষর দিন',
                      payload: ['code' => 'password_too_short'],
                  )]
                  public string $password = '',
              ) {
              }
          }
        marks:
          - {line: 4, tip: 'payload-এ স্থির code রাখা হয়। বার্তা (message) ভাষা বদলালে বদলাতে পারে, code না।'}
          - {line: 6, tip: 'default মান দেওয়া, তাই field একেবারে না এলেও PHP type-error নয়, validation-error হয়।'}
      - type: code
        lang: php
        file: 'src/EventListener/ApiProblemListener.php'
        variant: good
        code: |
          private function errors(ConstraintViolationListInterface $violations): array
          {
              $errors = [];
              foreach ($violations as $v) {
                  $constraint = $v instanceof ConstraintViolation ? $v->getConstraint() : null;

                  $errors[] = [
                      'field' => $v->getPropertyPath(),
                      'code' => $constraint?->payload['code'] ?? 'invalid',
                      'message' => (string) $v->getMessage(),
                  ];
              }

              return $errors;
          }
        marks:
          - {line: 8, tip: 'যে ঘরে ভুল, তার নাম। client এই নাম ধরে ঠিক ঘরের পাশে বার্তা বসায়।'}
          - {line: 9, tip: 'DTO-র payload থেকে স্থির code। না থাকলে সাধারণ invalid।'}
      - type: visual
        kind: table
