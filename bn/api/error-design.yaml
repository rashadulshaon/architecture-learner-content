        items:
          - 'ভুল পাসওয়ার্ড বা "ইমেইল নিবন্ধিত নেই" বার্তায় অতিরিক্ত তথ্য ফাঁস করো না: তাতে আক্রমণকারী কোন ইমেইল আছে বুঝে ফেলে।'
          - 'client-এ validation থাকলেও সার্ভারে validation বাধ্যতামূলক। client-এর validation শুধু ব্যবহারকারীর সুবিধার জন্য।'
      - type: refs
        items:
