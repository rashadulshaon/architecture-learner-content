      a: 'ব্যবহারকারী একবারেই সব ভুল দেখে ঠিক করতে পারে। নইলে প্রতিবার একটা করে ভুল ঠিক করে আবার পাঠাতে হয়, যা বিরক্তিকর।'

  - slug: blind-retry
    title: 'অন্ধ retry: টাকা দুইবার কাটা'
    kind: pitfall
    tldr: 'retry শুধু সেই ভুলে করো যা সাময়িক, আর সেই কাজে যা দুইবার হলে ক্ষতি নেই। GET, PUT, DELETE নিরাপদ; POST নয়, যদি না idempotency key থাকে।'
    keywords: ['retry', 'idempotent', 'idempotency key', 'retryable error', '503', 'POST retry', 'আবার চেষ্টা']
    blocks:
      - type: text
        body: |
          পেমেন্টের `POST /payments` কল করে timeout এল। অ্যাপ ভাবল "ব্যর্থ", আবার পাঠাল, আর ব্যবহারকারীর টাকা দুইবার কাটা গেল। কারণ timeout মানে কাজ হয়নি নয়, মানে উত্তর আসেনি। কাজ **idempotent** হলে (একই কাজ বারবার করলে ফল একই) আবার পাঠানো নিরাপদ, নইলে নয়।
      - type: visual
        kind: table
        caption: 'কোন ঘটনায় retry করবে'
        headers: ['ঘটনা', 'retry?', 'কারণ']
        rows:
          - cells: ['Network error বা timeout', 'শুধু idempotent হলে', 'কাজ হয়েছে কি না অজানা']
            tip: 'উত্তর আসেনি মানে কাজ হয়নি নয়। GET, PUT, DELETE-এ নিরাপদ। POST-এ idempotency key ছাড়া নয়।'
          - cells: ['429 Too Many Requests', 'হ্যাঁ, Retry-After মেনে', 'সাময়িক চাপ']
            tip: 'সার্ভার নিজেই বলে কতক্ষণ থামতে হবে। তার আগে আবার পাঠালে আরও দেরি হয়।'
          - cells: ['502 / 503 / 504', 'হ্যাঁ, backoff-সহ', 'সাময়িক সমস্যা']
            tip: '504-এ কাজ হয়ে গিয়ে থাকতে পারে, তাই এই retry-ও idempotent কাজেই নিরাপদ।'
          - cells: ['500', 'সাবধানে, খুব বেশি নয়', 'bug হলে একই ফল']
            tip: 'কোডে bug থাকলে একই request বারবার একই ভাবে ভাঙে। বড়জোর একবার চেষ্টা।'
          - cells: ['400 / 422', 'না', 'ইনপুট ভুল']
            tip: 'ইনপুট ঠিক না করে আবার পাঠালে একই উত্তর আসে। শুধু সার্ভারের চাপ বাড়ে।'
          - cells: ['401 / 403 / 404', 'না', 'অনুমতি বা অস্তিত্বের সমস্যা']
            tip: '401-এ token নবায়ন করে একবার চেষ্টা করা যায়, কিন্তু বাকিগুলো আবার পাঠিয়ে বদলায় না।'
      - type: code
        lang: ts
        file: 'src/api/retry.ts'
        variant: good
        code: |
          const IDEMPOTENT = ['GET', 'HEAD', 'PUT', 'DELETE', 'OPTIONS']
          const TRANSIENT = [408, 429, 502, 503, 504]

          export function canRetry(
            method: string,
            status: number | null, // null = কোনো response আসেনি
            hasIdempotencyKey: boolean,
          ): boolean {
            const safeToRepeat = IDEMPOTENT.includes(method) || hasIdempotencyKey
            if (!safeToRepeat) return false // POST: দুইবার হয়ে যেতে পারে

            if (status === null) return true
            return TRANSIENT.includes(status)
          }
        marks:
          - {line: 9, tip: 'আগে ঠিক করো কাজটা দুইবার হলে ক্ষতি আছে কি না। ক্ষতি থাকলে আর কিছু দেখারই দরকার নেই।'}
          - {line: 12, tip: 'response না আসা (network, timeout) বা সাময়িক status হলেই retry। 400 বা 422 নয়।'}
      - type: quote
        body: 'Retry করবে শুধু সাময়িক ভুলে, আর শুধু সেই কাজে যা দুইবার হলে ক্ষতি নেই।'
    aside:
      - type: terms
        items:
          - {term: 'Idempotent', meaning: 'একই request বারবার করলে ফল একবারের সমান। যেমন DELETE /orders/5।'}
          - {term: 'Idempotency key', meaning: 'client-এর বানানো অনন্য চিহ্ন, যা দেখে সার্ভার একই কাজ দুইবার করে না।'}
      - type: refs
        items:
          - {to: 'payments/idempotency-keys', label: 'Idempotency key দিয়ে POST নিরাপদ করা'}
          - {to: 'api/rate-limiting', label: 'Backoff আর jitter'}
    check:
      q: 'POST /payments-এ timeout এলে অ্যাপ সরাসরি আবার পাঠালে কী ঝুঁকি, আর কীভাবে নিরাপদ করা যায়?'
      a: 'timeout মানে কাজ হয়নি নয়, উত্তর আসেনি; ফলে টাকা দুইবার কাটতে পারে। idempotency key দিলে সার্ভার একই কাজ দ্বিতীয়বার করে না।'

flashcards:
  - q: 'ব্যর্থ কাজে 200 OK দিয়ে body-তে "success: false" দেওয়া ভুল কেন?'
    a: 'status code মিথ্যা বললে monitoring, cache আর retry-র টুলগুলো সবাই ভুল সিদ্ধান্ত নেয়।'
    more: |
      monitoring সাধারণত 5xx গোনে, তাই 200-এ লুকানো ব্যর্থতা ড্যাশবোর্ডে সবুজ দেখায়। cache 200 জমিয়ে রাখতে পারে, আর client-এর সাধারণ error-হ্যান্ডলিং চলেই না। ব্যর্থতার জন্য সত্যিকারের 4xx বা 5xx দাও।
    ref: something-went-wrong
  - q: '4xx আর 5xx-এর মূল পার্থক্য কী?'
    a: '4xx মানে client-এর ভুল (ঠিক করে পাঠাতে হবে)। 5xx মানে সার্ভারের ভুল (client-এর করার কিছু নেই)।'
    more: |
      কুরিয়ারের মতো: "ঠিকানা ভুল" হলে তুমি ঠিক না করলে লাভ নেই (4xx), "আমাদের গুদামে সমস্যা" হলে দোষ কুরিয়ারের (5xx)। এই ভাগ বলে retry কাজে লাগবে কি না। 4xx-এ সাধারণত আবার পাঠানো বৃথা।
    ref: status-families
  - q: '401 আর 403-এর পার্থক্য কী?'
    a: '401: তুমি কে, জানি না (লগইন নেই বা token ভুল)। 403: জানি তুমি কে, কিন্তু এই কাজের অনুমতি তোমার নেই।'
    more: |
      401-এ নতুন token বা লগইন করলে ঠিক হতে পারে। 403-এ আবার পাঠিয়ে কিছু বদলায় না, অনুমতি লাগবে। অন্যের ডেটা খুলতে চাইলে অনেকে অস্তিত্ব লুকাতে 404-ও দেয়।
    ref: status-families
  - q: '422 আর 409-এর পার্থক্য কী?'
    a: '422: পাঠানো ইনপুটই গ্রহণযোগ্য নয় (ভুল ইমেইল)। 409: ইনপুট ঠিক, কিন্তু বর্তমান অবস্থার সাথে সংঘাত (স্টক শেষ)।'
    more: |
      422 ঠিক করে আবার পাঠালে কাজ হয়। 409-এ নতুন অবস্থা দেখে client-কে সিদ্ধান্ত নিতে হয়: কম সংখ্যা চাইবে, নাকি অপেক্ষা করবে। দুটোতেই body-তে স্থির code দেওয়া উচিত।
    ref: status-families
  - q: 'problem+json কী?'
    a: 'error বর্ণনার প্রমিত JSON আকার (RFC 9457) যেখানে type, title, status, detail থাকে; সাথে নিজের code যোগ করা যায়।'
    more: |
      Content-Type হয় `application/problem+json`। সব error এক ছাঁচে গেলে client একই কোডে সব error সামলাতে পারে। নিজের স্থির `code` যোগ করলে client বার্তা না পড়ে code দেখে সিদ্ধান্ত নেয়।
    ref: problem-json
  - q: 'কোন error retry করা যায়?'
    a: 'সাময়িক ভুল: 429 (Retry-After মেনে), 502/503/504, network error ও timeout, আর তাও শুধু idempotent কাজে।'
    more: |
      400, 401, 403, 404, 422 ইনপুট বা অনুমতির ভুল, আবার পাঠালে একই উত্তর। 500-এ bug থাকলে বারবার একই ভাবে ভাঙে। retry-র আগে ভাবো: কাজটা দুইবার হলে ক্ষতি আছে কি না।
    ref: blind-retry
  - q: 'কোন HTTP method idempotent?'
    a: 'GET, HEAD, PUT, DELETE, OPTIONS। POST সাধারণত নয়, তাই তাতে idempotency key দিয়ে নিরাপদ করা হয়।'
    more: |
      idempotent মানে একই request বারবার করলে ফল একবারের সমান। DELETE /orders/5 দুইবার চালালে অর্ডার একবারই মোছে। কিন্তু POST /payments দুইবার চালালে দুইবার টাকা কাটতে পারে।
    ref: blind-retry

quiz:
  - q: 'নিচের কোডের response নিয়ে কী সমস্যা?'
    lang: php
    code: |
      if (!$user = $users->findByEmail($dto->email)) {
          return $this->json(['success' => false, 'msg' => 'error'], 200);
      }
    hint: 'monitoring, cache আর client কোডের চোখে এটা সফল না ব্যর্থ?'
    options:
      - text: 'ব্যর্থতার জন্য 200 দেওয়া হয়েছে, আর বার্তাও অর্থহীন'
        correct: true
        why: 'status মিথ্যা বললে সব টুল ভুল পথে যায়। উচিত ছিল সঠিক 4xx আর স্থির code-সহ কারণ দেওয়া।'
      - text: 'json() ব্যবহার করা ভুল, Response ব্যবহার করা উচিত'
        correct: false
        why: 'json() ঠিক আছে। সমস্যা হলো status আর বার্তার মান।'
      - text: 'findByEmail ধীর'
        correct: false
        why: 'গতি এখানে বিষয় নয়, error response-এর গঠন বিষয়।'
      - text: 'কোনো সমস্যা নেই, কারণ client body দেখেই বুঝবে'
        correct: false
        why: 'টুলগুলো body পড়ে না, status দেখে। আর "error" থেকে client-ও কিছু বোঝে না।'
    ref: something-went-wrong
  - q: 'ব্যবহারকারী লগইন আছে, কিন্তু অন্যের অর্ডার খুলতে চাইছে। সবচেয়ে সঠিক status কোনটা?'
    hint: 'সার্ভার কি জানে সে কে?'
    options:
      - text: '401 Unauthorized'
        correct: false
        why: '401 মানে পরিচয় অজানা। এখানে পরিচয় জানা, অনুমতি নেই।'
      - text: '403 Forbidden (অথবা অস্তিত্ব লুকাতে 404)'
        correct: true
        why: 'পরিচয় জানা, কিন্তু অনুমতি নেই, তাই 403। অর্ডারের অস্তিত্ব গোপন রাখতে চাইলে 404-ও গ্রহণযোগ্য।'
      - text: '500 Internal Server Error'
        correct: false
        why: 'এটা সার্ভারের ভুল নয়, client-এর অনুমতির ঘাটতি।'
      - text: '200 OK, body-তে "অনুমতি নেই"'
        correct: false
        why: 'ব্যর্থতায় 200 দিলে টুলগুলো সব ঠিক ধরে নেয়।'
    ref: status-families
  - q: 'নিচের কোন কোন ক্ষেত্রে client স্বয়ংক্রিয়ভাবে retry করতে পারে?'
    hint: 'আবার পাঠালে ফল বদলাতে পারে কি? আর দুইবার হলে ক্ষতি আছে কি?'
    options:
      - text: 'GET /products-এ 503 এসেছে'
        correct: true
        why: 'GET idempotent, আর 503 সাময়িক। backoff দিয়ে retry নিরাপদ।'
      - text: 'POST /register-এ 422 এসেছে'
        correct: false
        why: '422 মানে ইনপুট ভুল। ঠিক না করে আবার পাঠালে একই উত্তর আসবে।'
      - text: 'PUT /profile/7-এ timeout হয়েছে'
        correct: true
        why: 'PUT idempotent, দুইবার চললেও প্রোফাইল একই অবস্থায় থাকে।'
      - text: 'POST /payments-এ timeout হয়েছে, কোনো idempotency key নেই'
        correct: false
        why: 'কাজ হয়েছে কি না অজানা, আর দুইবার হলে দুইবার টাকা কাটে। key ছাড়া retry বিপজ্জনক।'
    ref: blind-retry
  - q: 'রহিমের Vue অ্যাপ validation error পেলে ইমেইল ঘরের পাশে ঠিক বার্তা দেখাতে চায়। response-এ কী থাকা সবচেয়ে কাজের?'
    hint: 'client কীভাবে জানবে কোন ঘরে কী ভুল?'
    options:
