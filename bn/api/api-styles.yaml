slides:
  - slug: too-much-too-little
    title: 'ফোনের এক পর্দা, পাঁচটা request'
    kind: story
    tldr: 'একটা API স্টাইল সব কাজে মানায় না: মোবাইলের ছোট পর্দায় কখনো দরকারের বেশি ডেটা আসে, কখনো এক পর্দার জন্য বারবার ডাকতে হয়।'
    keywords: ['over-fetching', 'under-fetching', 'round trip', 'API style', 'মোবাইল', 'বাড়তি ডেটা']
    blocks:
      - type: text
        body: |
          রহিমের মোবাইল অ্যাপের প্রোফাইল পর্দায় দরকার শুধু নাম, ছবি আর শেষ তিনটা অর্ডার। কিন্তু `GET /api/users/7` ৪০টা field ফেরত দেয়, যার বেশিরভাগ পর্দায় লাগেই না। আবার অর্ডারগুলো পেতে আরও আলাদা request করতে হয়। ঢাকার ধীর মোবাইল নেটওয়ার্কে প্রতিটা বাড়তি round trip মানে বাড়তি অপেক্ষা।
      - type: visual
        kind: sequence
        caption: 'একটা পর্দা সাজাতে মোবাইল অ্যাপ কয়বার ডাকছে'
        actors:
          - {id: app, label: 'মোবাইল অ্যাপ', icon: mobile, tip: 'প্রোফাইল পর্দা দেখাতে চাইছে: নাম, ছবি, শেষ তিন অর্ডার।'}
          - {id: api, label: 'REST API', icon: api, tip: 'প্রতিটা resource-এর জন্য আলাদা URL, আর প্রতিটা URL নিজের পুরো আকার ফেরত দেয়।'}
        messages:
          - {from: app, to: api, label: 'GET /users/7'}
          - {from: api, to: app, label: '৪০টা field, লাগে ২টা', dashed: true, tone: warn, tip: 'এটাকে over-fetching বলে: দরকারের চেয়ে বেশি ডেটা আসা, আর নেটওয়ার্কে সেই বাড়তি ভার বয়ে বেড়ানো।'}
          - {from: app, to: api, label: 'GET /users/7/orders'}
          - {from: api, to: app, label: 'সব অর্ডার, লাগে ৩টা', dashed: true, tone: warn}
          - {from: app, to: api, label: 'GET /orders/91/items ...'}
          - {at: app, note: 'পর্দা আঁকতে ৫ বার অপেক্ষা', tone: bad, tip: 'এটাকে under-fetching বলে: একটা ডাকে যথেষ্ট ডেটা আসে না, তাই আরেকটা, আরেকটা ডাকতে হয়।'}
      - type: quote
        body: 'কোনো API স্টাইলই সবার সেরা নয়। আগে জানুন আপনার ব্যথা কোথায়, তারপর স্টাইল বাছুন।'
    aside:
      - type: problem
        body: 'একই API ওয়েব, মোবাইল আর পার্টনার তিন জনের জন্য। তিনজনের দরকার তিন রকম, কিন্তু আকার একটাই।'
      - type: terms
        items:
          - {term: 'Round trip', meaning: 'client থেকে সার্ভারে request গিয়ে উত্তর ফিরে আসার একটা পুরো চক্কর।'}
          - {term: 'Over-fetching', meaning: 'দরকারের চেয়ে বেশি ডেটা পাওয়া।'}
          - {term: 'Under-fetching', meaning: 'একবারে যথেষ্ট ডেটা না পেয়ে বারবার ডাকতে হওয়া।'}
    check:
      q: 'মোবাইল পর্দায় প্রোফাইল দেখাতে ৫টা আলাদা request লাগলে সমস্যাটা কোন ধরনের, আর কেন তা খারাপ?'
      a: 'এটা under-fetching। প্রতিটা request-এ নেটওয়ার্কের একটা round trip লাগে, তাই ধীর নেটওয়ার্কে পর্দা আঁকতে অনেক দেরি হয়।'

  - slug: four-styles
    title: 'খাবার অর্ডারের চার উপায়'
    kind: concept
    tldr: 'REST নির্দিষ্ট মেনু, GraphQL নিজের থালা সাজানো, gRPC রান্নাঘরের ওয়াকিটকি আর message হলো চিরকুট রেখে যাওয়া: চার স্টাইলের চার রকম জোর।'
    keywords: ['REST', 'GraphQL', 'gRPC', 'async messaging', 'API স্টাইল', 'তুলনা']
    blocks:
      - type: metaphor
        icon: shop
        title: 'রেস্টুরেন্টে অর্ডার'
        body: |
          **REST** হলো ছাপানো মেনু: প্রতিটা আইটেমের একটা নাম আর দাম, যা আছে তাই পাবেন। **GraphQL** হলো নিজের থালা সাজানো: "ভাত একটু, মাছ দুই টুকরো, ডাল বাদ", এক অর্ডারেই। **gRPC** হলো ওয়েটার আর রান্নাঘরের মধ্যে কোডে-বাঁধা ওয়াকিটকি: দ্রুত, কিন্তু বাইরের খদ্দের ওই ভাষা বোঝে না। **Message** হলো চিরকুট রেখে যাওয়া: খদ্দের উত্তরের জন্য দাঁড়ায় না, রান্না হলে ডাকা হয়।
      - type: visual
        kind: table
        caption: 'চার স্টাইলের জোর আর দাম'
        headers: ['স্টাইল', 'কেমন কথা বলে', 'সেরা কাজ', 'দাম']
        rows:
          - cells: ['REST', 'HTTP + JSON, resource ধরে', 'public API, সাধারণ CRUD', 'বাড়তি বা কম ডেটা']
            tip: 'সবার চেনা, HTTP cache আর টুলিং সবচেয়ে পরিপক্ক। বেশিরভাগ API-র ডিফল্ট পছন্দ।'
          - cells: ['GraphQL', 'একটা endpoint, client query লেখে', 'নানা client, জটিল পর্দা', 'cache কঠিন, সার্ভারে জটিলতা']
            tip: 'client নিজে বলে কোন field চাই, তাই over-fetching আর বারবার ডাকা কমে। বিনিময়ে সার্ভার বেশি জটিল হয়।'
          - cells: ['gRPC', 'binary (Protobuf), HTTP/2', 'ভেতরের service-এর মধ্যে', 'ব্রাউজারে সরাসরি নয়']
            tip: 'দ্রুত আর সুনির্দিষ্ট type-সহ, কিন্তু ব্রাউজার সরাসরি gRPC বলতে পারে না; gRPC-Web বা মাঝে proxy লাগে।'
          - cells: ['Async message', 'queue বা broker-এ বার্তা', 'ধীর বা পরে করার কাজ', 'সাথে সাথে উত্তর নেই']
            tip: 'client অপেক্ষা না করে চলে যায়। ফল জানতে হলে পরে status দেখতে বা ঘটনার সংকেত শুনতে হয়।'
      - type: quote
        body: 'ডিফল্ট REST। বাকি তিনটা নির্দিষ্ট ব্যথার ওষুধ, প্রতিদিনের পথ্য নয়।'
    aside:
      - type: remember
        body: 'মেনু (REST), নিজের থালা (GraphQL), ওয়াকিটকি (gRPC), চিরকুট (message)।'
      - type: terms
        items:
          - {term: 'Protobuf', meaning: 'gRPC যে compact binary ফরম্যাটে ডেটা পাঠায়; .proto ফাইলে আকার লেখা থাকে।'}
          - {term: 'HTTP/2', meaning: 'HTTP-র নতুন সংস্করণ, যেখানে একটা সংযোগে অনেক request একসাথে চলে।'}
      - type: refs
        items:
          - {to: 'messaging/events-vs-commands', label: 'Message: event না command'}
    check:
      q: 'ব্রাউজারে চলা Vue অ্যাপ থেকে সরাসরি ডাকার জন্য চারটার মধ্যে কোনটা সবচেয়ে সহজ, আর কোনটা সরাসরি নয়?'
      a: 'REST (আর GraphQL) HTTP আর JSON-এ কাজ করে, তাই ব্রাউজার সরাসরি ডাকে। gRPC ব্রাউজার থেকে সরাসরি চলে না, তার জন্য gRPC-Web বা proxy লাগে।'

  - slug: graphql-grpc-shape
    title: 'GraphQL আর gRPC দেখতে কেমন'
    kind: howto
    tldr: 'GraphQL-এ client ঠিক যা চায় তাই লিখে একবারে আনে; gRPC-তে .proto ফাইলই contract, আর field-এর নম্বর কখনো বদলানো যায় না।'
    keywords: ['GraphQL query', 'protobuf', 'proto file', 'schema', 'কোয়েরি', 'field number']
    blocks:
      - type: text
        body: |
          প্রথম গল্পের সেই প্রোফাইল পর্দা GraphQL-এ একটাই request: client লিখে দেয় কোন field চাই। gRPC-তে আকার একটা `.proto` ফাইলে লেখা থাকে, আর দুই পক্ষ সেই ফাইল থেকে নিজ নিজ কোড বানিয়ে নেয়। দুটো কোড পাশাপাশি দেখুন।
      - type: code
        lang: graphql
        file: 'ProfileScreen.graphql'
        variant: good
        code: |
          query ProfileScreen($id: ID!) {
            user(id: $id) {
              name
              avatarUrl
              orders(first: 3) {
                id
                total
              }
            }
          }
        marks:
          - {line: 3, tip: 'শুধু এই দুইটা field আসবে। ৪০টা নয়: over-fetching শেষ।'}
          - {line: 5, tip: 'user আর তার শেষ ৩ অর্ডার একই request-এ। আলাদা round trip লাগছে না।'}
      - type: code
        lang: protobuf
        file: 'proto/order.proto'
        variant: good
        code: |
          syntax = "proto3";

          service OrderService {
            rpc GetOrder (GetOrderRequest) returns (Order);
          }

          message GetOrderRequest { string id = 1; }

          message Order {
            string id = 1;
            int64 total_paisa = 2;
          }
        marks:
          - {line: 4, tip: 'client আর সার্ভার দুই দিকেই এই service থেকে typed কোড বানানো হয়। ভুল type পাঠালে কম্পাইলেই ধরা পড়ে।'}
          - {line: 11, tip: '= 2 হলো field-এর নম্বর। wire-এ নাম নয়, এই নম্বরই যায়। তাই নম্বর বদলানো মানে breaking change।'}
      - type: visual
        kind: compare
        caption: 'একই পর্দা, REST বনাম GraphQL'
        columns:
          - title: 'REST'
            tone: warn
            icon: list
            tip: 'প্রতিটা resource-এর জন্য আলাদা URL। সবচেয়ে সরল, কিন্তু পর্দা জটিল হলে বারবার ডাকতে হয়।'
            items:
              - '৫টা আলাদা request'
              - 'প্রতিটায় resource-এর পুরো আকার'
              - 'URL-ভিত্তিক HTTP cache সহজ'
          - title: 'GraphQL'
            tone: good
            icon: filter
            tip: 'client নিজের দরকারের আকার লেখে। সার্ভার শুধু সেটুকু দেয়।'
            items:
              - '১টা request'
              - 'শুধু চাওয়া field'
              - 'সবই সাধারণত POST, তাই cache কঠিন'
    aside:
      - type: pitfalls
        items:
          - 'GraphQL-এ client যত খুশি গভীর বা ভারী query লিখতে পারে। depth আর cost-এর সীমা না দিলে একটা query-ই সার্ভার থামিয়ে দিতে পারে।'
          - 'প্রতিটা nested field আলাদা করে ডেটাবেসে গেলে N+1 হয়। batch করার কৌশল (DataLoader) আগে থেকে ভাবুন।'
      - type: refs
        items:
          - {to: 'data/n-plus-one', label: 'N+1 query সমস্যা'}
    check:
      q: 'protobuf-এ `int64 total_paisa = 2;` লাইনের `= 2` কেন বদলানো যায় না?'
      a: 'ওই নম্বরটাই wire-এ field চেনায়। নম্বর বদলালে পুরনো client অন্য field পড়ে ফেলবে, তাই এটা breaking change।'

  - slug: grpc-pain
    title: 'gRPC যে ব্যথা সারায়: নাম বদলে যাওয়া field'
    kind: pitfall
    tldr: 'ভেতরের দুই service হাতে-লেখা JSON-এ কথা বললে একপক্ষ field বদলালে টেরও পাওয়া যায় না; .proto থাকলে একই বদল deploy-এর আগেই ধরা পড়ে।'
    keywords: ['gRPC', 'ভেতরের service', 'contract drift', 'protobuf', 'generated client', 'নীরব ব্যর্থতা']
    blocks:
      - type: text
        body: |
          রহিমের অর্ডার service অন্য টিমের পেমেন্ট service-এর কাছে অর্ডারের মোট টাকা জানতে চায়। উত্তর হাতে-লেখা JSON। মঙ্গলবার পেমেন্ট টিম `total`-এর নাম বদলে `total_paisa` রাখল। কিছুই ক্র্যাশ করল না: অর্ডার service এমন একটা key পড়ছে যা আর নেই, কিছু পায় না, আর চুপচাপ প্রতিটা অর্ডারে ০ টাকা দেখায়, যতক্ষণ না কোনো খদ্দের অভিযোগ করে।
      - type: metaphor
        icon: shop
        title: 'রান্নাঘরের কোড-তালিকা'
        body: |
          ওয়েটার আর রান্নাঘর ওয়াকিটকিতে কোডে কথা বলে: "৭" মানে বিরিয়ানি। রান্নাঘর ৭-এর মানে বদলে কাউকে না জানালে ওয়েটার ৭ বলেই যায়, আর ভুল থালা আসতে থাকে। `.proto` হলো একটাই ছাপানো কোড-তালিকা, দুই পক্ষ যা থেকে নিজের কোড বানাতে বাধ্য, তাই কোড বদলালে প্রথম অর্ডারের আগেই ধরা পড়ে।
      - type: code
        lang: php
        file: 'src/Order/PaymentClient.php'
        variant: bad
        code: |
          $data = $this->http
              ->request('GET', 'http://payments.internal/orders/'.$id)
              ->toArray();

          $total = $data['total'] ?? 0;   // ওপারে নাম বদলেছে: এখন চুপচাপ ০
        marks:
          - {line: 5, tip: 'PHP-তে array-র key না থাকা কোনো ভুল নয়। ?? 0 সেটা আরও ঢেকে দেয়, আর ভুল সংখ্যা এগিয়ে যায়।'}
      - type: code
        lang: php
        file: 'src/Order/PaymentClient.php'
        variant: good
        code: |
          // GetOrderRequest আর Order বানানো হয় order.proto থেকে
          [$order, $status] = $this->client
              ->GetOrder(new GetOrderRequest(['id' => $id]))
              ->wait();

          if ($status->code !== \Grpc\STATUS_OK) {
              throw new \RuntimeException($status->details);
          }

          $total = $order->getTotalPaisa();   // নাম বদলালে এই getter আর থাকে না
        marks:
          - {line: 6, tip: 'কল ব্যর্থ হলে সেটা status হয়ে আসে, যা দেখতেই হয়। চুপচাপ ফাঁকা ফল আসে না।'}
          - {line: 10, tip: '.proto বদলে কোড নতুন করে বানালে এই method আর থাকে না। CI-এর static analysis ধরে ফেলে, আর Go বা Java-তে build-ই থামে।'}
      - type: visual
        kind: compare
        caption: 'ভেতরের service-এ gRPC কী মেটায়, আর কী দাম নেয়'
        columns:
          - title: 'কী মেটায়'
            tone: good
            icon: check
            tip: 'ব্যথা হলো দুই টিম না জেনে একই আকার বদলে ফেলা। বানানো contract বদলটা দুই পক্ষের চোখে আনে।'
            items:
              - 'একটা .proto ফাইলই contract; দুই পক্ষ তা থেকে কোড বানায়'
              - 'নাম বদলালে CI-তে ধরা পড়ে, production-এ নয়'
              - 'wire-এ ছোট: অর্ডারটা JSON-এ ৩৫ byte, Protobuf-এ প্রায় ১২'
          - title: 'কী দাম লাগে'
            tone: warn
            icon: warning
            tip: 'দাম দিতে হয় টুলিংয়ে, আর traffic চোখে দেখার কষ্টে। এক টিমের দুই service-এর কয়েকটা কলের জন্য এই দাম পোষায় না।'
            items:
              - 'প্রতিটা build-এ protoc আর gRPC PHP extension লাগে'
              - 'body binary: curl আর log-এ দেখা যায় শুধু অর্থহীন চিহ্ন'
              - 'ব্রাউজার বা বাইরের পার্টনারের জন্য নয়'
    aside:
      - type: when
        use:
          - 'নিজের service-এর মধ্যে প্রচুর কল, ভাষাও হয়তো একাধিক'
        avoid:
          - 'এক টিম, এক অ্যাপ, কয়েকটা কল: OpenAPI ফাইলসহ REST-ই যথেষ্ট'
          - 'যে client আপনার নিয়ন্ত্রণে নেই, যেমন ব্রাউজার ও পার্টনার'
      - type: terms
        items:
          - {term: 'protoc', meaning: '.proto ফাইল পড়ে আপনার ভাষার client ও সার্ভারের কোড লিখে দেয় যে টুল।'}
    check:
      q: 'পেমেন্ট JSON-এ `total`-এর নাম বদলাল। অর্ডার service চুপচাপ ভুল করে কেন, আর gRPC-তে আগে ধরা পড়ে কেন?'
      a: 'না-থাকা array key শুধু ফাঁকা দেয়, আর `?? 0` তা ঢেকে দেয়। gRPC-তে field একটা বানানো method, তাই কোড নতুন করে বানালে পুরনো নাম আর থাকে না, আর CI ধরে ফেলে।'

  - slug: async-202
    title: 'অপেক্ষা না করানোর স্টাইল: 202 Accepted'
    kind: howto
    tldr: 'ধীর কাজে request ঢুকিয়ে সাথে সাথে 202 আর status দেখার URL দিন; কাজটা Messenger worker পেছনে সারে, client পরে জিজ্ঞেস করে।'
    keywords: ['202 Accepted', 'Messenger', 'async', 'polling', 'Location header', 'পেছনের কাজ']
    blocks:
      - type: text
        body: |
          ধরুন মাসের রিপোর্ট বানাতে ২০ সেকেন্ড লাগে। ব্যবহারকারীকে ২০ সেকেন্ড বসিয়ে রাখা, তারপরও timeout-এর ঝুঁকি। এর বদলে চিরকুট স্টাইল: API কাজটা queue-তে রেখে সাথে সাথে `202 Accepted` দেয়, সাথে দেয় রিপোর্টের status দেখার URL। client সেই URL মাঝে মাঝে জিজ্ঞেস করে।
      - type: visual
        kind: sequence
        caption: 'রিপোর্ট বানানো: চিরকুট রেখে যাওয়া আর পরে খোঁজ নেওয়া'
        actors:
          - {id: client, label: 'Vue অ্যাপ', icon: browser, tip: 'রিপোর্ট চেয়েছে, কিন্তু আটকে বসে থাকে না।'}
          - {id: api, label: 'API', icon: api, tip: 'শুধু কাজটা queue-তে রাখে আর রসিদ দেয়। নিজে ভারী কাজ করে না।'}
          - {id: worker, label: 'Worker', icon: worker, tip: 'পেছনে বসে queue থেকে কাজ তুলে রিপোর্ট বানায়।'}
        messages:
          - {from: client, to: api, label: 'POST /api/v1/reports'}
          - {from: api, to: client, label: '202 Accepted, Location: /reports/9', dashed: true, tip: 'রসিদ: কাজ গ্রহণ করা হয়েছে, শেষ হয়নি। Location হলো সেই রসিদ দেখানোর ঠিকানা।'}
          - {at: worker, note: 'পেছনে রিপোর্ট বানাচ্ছে', tone: warn}
          - {from: client, to: api, label: 'GET /reports/9'}
          - {from: api, to: client, label: '200 {"status": "pending"}', dashed: true}
          - {from: client, to: api, label: 'GET /reports/9 (কিছুক্ষণ পর)'}
          - {from: api, to: client, label: '200 {"status": "done", "url": "..."}', dashed: true, tone: good}
      - type: code
        lang: php
        file: 'src/Controller/Api/V1/ReportController.php'
        variant: good
        code: |
          #[Route('/api/v1/reports', methods: ['POST'])]
          public function create(
              #[MapRequestPayload] CreateReportRequest $dto,
              EntityManagerInterface $em,
              MessageBusInterface $bus,
          ): JsonResponse {
              $report = new Report($dto->month);       // শুরুতে status = pending
              $em->persist($report);
              $em->flush();

              $bus->dispatch(new GenerateReport($report->getId()->toRfc4122()));

              return $this->json(['status' => 'pending'], Response::HTTP_ACCEPTED, [
                  'Location' => $this->generateUrl(
                      'api_report_show',
                      ['id' => $report->getId()->toRfc4122()],
                  ),
              ]);
          }
        marks:
          - {line: 8, tip: 'আগে ডেটাবেসে রিপোর্টের সারি, status pending। client-কে দেখানোর জন্য একটা আসল জিনিস লাগে।'}
          - {line: 11, tip: 'dispatch শুধু বার্তা queue-তে রাখে। ভারী কাজ চলে GenerateReport handler-এ, worker-এর ভেতরে।'}
          - {line: 13, tip: '202 মানে গ্রহণ করা হয়েছে, কাজ এখনো শেষ হয়নি। 200 বা 201 বললে client ভাববে রিপোর্ট তৈরি।'}
    aside:
      - type: commands
        items:
          - {cmd: 'php bin/console messenger:consume async -vv', desc: 'worker চালু করুন, সে queue থেকে কাজ তুলে নেবে'}
      - type: tips
        items:
          - 'status endpoint-এ done হলে ফলাফলের URL দিন, আর failed হলে কারণ। শুধু pending আর done রাখলে ব্যর্থ কাজ চিরকাল "pending" থাকে।'
          - 'polling-এ দুই-তিন সেকেন্ডের বিরতি দিন। প্রতি ১০০ms-এ ডাকলে নিজের API-তেই চাপ পড়ে।'
      - type: refs
        items:
          - {to: 'messaging/background-jobs', label: 'Background job ঠিকভাবে চালানো'}
    check:
      q: 'ধীর কাজের জন্য `200 OK`-র বদলে `202 Accepted` কেন দেওয়া হয়?'
      a: '200 বললে client ভাবে কাজ শেষ। 202 সৎভাবে বলে: কাজ নেওয়া হয়েছে কিন্তু শেষ হয়নি, ফল জানতে Location-এর URL দেখুন।'

