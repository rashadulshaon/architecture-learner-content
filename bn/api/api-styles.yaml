      a: 'ব্যথাটা কী, আর সেটা কি আছে? শুধু একটা client থাকলে over-fetching বা বারবার ডাকার সমস্যা প্রায় নেই, তাই সাধারণ REST-ই যথেষ্ট।'

flashcards:
  - q: 'Over-fetching আর under-fetching কী?'
    a: 'Over-fetching: দরকারের চেয়ে বেশি ডেটা আসা। Under-fetching: একবারে যথেষ্ট না আসায় বারবার ডাকতে হওয়া।'
    more: |
      দুটোই REST-এ নির্দিষ্ট আকারের resource থেকে আসে। ধীর মোবাইল নেটওয়ার্কে বাড়তি ডেটা আর বাড়তি round trip দুটোরই দাম বেশি। GraphQL এই দুই সমস্যার জন্য তৈরি।
    ref: too-much-too-little
  - q: 'কোন স্টাইল সাধারণ ডিফল্ট, আর কেন?'
    a: 'REST। সবাই চেনে, HTTP cache আর টুলিং পরিপক্ক, আর বাইরের পার্টনারের জন্য সবচেয়ে সহজ।'
    more: |
      অন্য স্টাইলগুলো নির্দিষ্ট ব্যথার ওষুধ। ব্যথা না থাকলে সেগুলো আনলে শুধু শেখার, চালানোর আর ডিবাগ করার খরচ বাড়ে। তাই আগে REST দিয়ে শুরু করে ব্যথা বুঝে সরো।
    ref: four-styles
  - q: 'GraphQL কোন সমস্যা মেটায়, আর কী দাম দেয়?'
    a: 'client যা চায় ঠিক তাই একবারে আনে। দাম: cache কঠিন, সার্ভার জটিল, আর ভারী query ঠেকাতে সীমা লাগে।'
    more: |
      সাধারণত একটা POST endpoint থাকে, তাই URL ধরে HTTP cache করা যায় না। প্রতিটা nested field-এর জন্য আলাদা ডেটাবেস কলে N+1 হতে পারে। depth ও cost limit না দিলে একটা query-ই সার্ভারে চাপ দিতে পারে।
    ref: graphql-grpc-shape
  - q: 'gRPC কোথায় সবচেয়ে ভালো, কোথায় নয়?'
    a: 'ভেতরের service-এর মধ্যে ভালো: দ্রুত, typed। ব্রাউজার বা বাইরের পার্টনারের জন্য ভালো নয়।'
    more: |
      gRPC Protobuf আর HTTP/2 ব্যবহার করে, তাই compact আর দ্রুত। কিন্তু ব্রাউজার সরাসরি gRPC বলতে পারে না, gRPC-Web বা proxy লাগে। বাইরের পার্টনারদের জন্য curl দিয়ে চেষ্টা করা যায় না বলেও অসুবিধা।
    ref: four-styles
  - q: 'Protobuf-এ field-এর নম্বর (= 2) কেন বদলানো যায় না?'
    a: 'wire-এ field চেনা যায় ওই নম্বর দিয়ে, নাম দিয়ে নয়। নম্বর বদলালে পুরনো client অন্য field পড়ে ফেলে।'
    more: |
      field নাম বদলানো তুলনামূলক নিরাপদ, কিন্তু নম্বর বদলানো বা পুনর্ব্যবহার breaking change। মোছা field-এর নম্বর `reserved` করে রাখা হয়, যাতে ভুল করে কেউ আবার সেটা ব্যবহার না করে।
    ref: graphql-grpc-shape
  - q: 'ধীর কাজের জন্য API কোন status দেয়, আর সাথে কী?'
    a: '`202 Accepted` আর `Location` header, যেখানে কাজের status দেখা যায়। কাজ চলে পেছনে queue-র worker-এ।'
    more: |
      202 সৎভাবে জানায় কাজ নেওয়া হয়েছে, শেষ হয়নি। client সেই Location-এ মাঝে মাঝে জিজ্ঞেস করে pending না done। ব্যর্থ হলে status-এ কারণসহ failed দেখানো জরুরি, নইলে কাজ চিরকাল pending থাকে।
    ref: async-202
  - q: 'স্টাইল বাছার সময় প্রথম প্রশ্ন কী হওয়া উচিত?'
    a: 'আমার ব্যথাটা কী, আর সেটা কি সত্যিই আছে? ব্যথা না থাকলে সরল REST-ই ঠিক।'
    more: |
      "কোনটা আধুনিক" নয়, "আমার কোন সমস্যা মেটাতে হবে"। client কারা, ব্যবহারকারীর উত্তর এখনই দরকার কি না, আর দল স্টাইলটা চালাতে পারবে কি না, সেগুলো দেখো। একই সিস্টেমে মিশিয়ে চলাও ঠিক: বাইরে REST, ভেতরে gRPC।
    ref: decision-guide

quiz:
  - q: 'রহিমের কোম্পানির ওয়েব, iOS, Android আর স্মার্ট TV অ্যাপ একই backend ব্যবহার করে। প্রতিটা পর্দার দরকার আলাদা, আর REST-এ প্রতিটার জন্য আলাদা endpoint বানাতে হচ্ছে। কোন স্টাইল এই ব্যথা মেটায়?'
    hint: 'কে ঠিক করবে কোন field আসবে: সার্ভার না client?'
    options:
      - text: 'gRPC, কারণ এটা সবচেয়ে দ্রুত'
        correct: false
        why: 'গতি এখানে ব্যথা নয়। আর TV বা ব্রাউজার client-এ সরাসরি gRPC আনাও কঠিন।'
      - text: 'GraphQL, যেখানে প্রতিটা client নিজের দরকারের field লিখে আনে'
        correct: true
        why: 'একটা সাধারণ endpoint থেকে প্রতিটা client নিজের আকার চেয়ে নেয়, তাই আলাদা endpoint বানাতে হয় না।'
      - text: 'Async message, কারণ এতে client অপেক্ষা করে না'
        correct: false
        why: 'পর্দা আঁকতে এখনই ডেটা দরকার। message-এ সাথে সাথে উত্তর পাওয়া যায় না।'
      - text: 'কোনো স্টাইল বদলের দরকার নেই, সব client একই response মেনে নিক'
        correct: false
        why: 'এতে over-fetching ও under-fetching চলতেই থাকে, আর ব্যথা বাড়তে থাকে।'
    ref: decision-guide
  - q: 'নিচের কোডে POST /reports-এর response নিয়ে কী সমস্যা?'
    lang: php
    code: |
      $report = new Report($dto->month);
      $em->persist($report);
      $em->flush();

      $bus->dispatch(new GenerateReport($report->getId()->toRfc4122()));

      return $this->json(['status' => 'done'], 200);
    hint: 'রিপোর্ট কি এই মুহূর্তে সত্যিই তৈরি হয়ে গেছে?'
    options:
      - text: 'কাজ তো পেছনে চলছে, অথচ response বলছে done আর 200। client ভুল ভাববে'
        correct: true
        why: 'শেষ না হওয়া কাজে 202 আর status pending বলা উচিত, সাথে Location header।'
      - text: 'dispatch ডাকলে flush আগে করা ভুল'
        correct: false
        why: 'বরং flush আগে করাই ঠিক। না হলে worker ডেটাবেসে রিপোর্টের সারিই খুঁজে পেত না।'
      - text: 'Messenger ব্যবহার না করে controller-এই রিপোর্ট বানানো উচিত'
        correct: false
        why: 'তাতে ব্যবহারকারীকে ২০ সেকেন্ড বসিয়ে রাখা হতো, আর timeout-ও হতে পারত।'
      - text: 'JSON-এর বদলে HTML দেওয়া উচিত'
        correct: false
        why: 'format এখানে সমস্যা নয়; সমস্যা হলো কাজের অবস্থা নিয়ে মিথ্যা বলা।'
    ref: async-202
  - q: 'নিচের কোন কোন ক্ষেত্রে gRPC ভালো পছন্দ?'
    hint: 'দুই পক্ষই কি তোমার নিয়ন্ত্রণে, আর কে ডাকছে?'
    options:
      - text: 'ভেতরের দুই Symfony service-এর মধ্যে প্রতি সেকেন্ডে হাজার হাজার কল'
        correct: true
        why: 'দুই পক্ষই তোমার, Protobuf compact আর HTTP/2 দ্রুত। typed কোডও ভুল কমায়।'
      - text: 'বাইরের ক্ষুদ্র পার্টনারকে curl দিয়ে চেষ্টা করার জন্য একটা সহজ API দেওয়া'
        correct: false
        why: 'binary ফরম্যাটে curl দিয়ে সহজে চেষ্টা করা যায় না। এখানে REST সোজা।'
      - text: 'দুই ভিন্ন ভাষার (PHP আর Go) service-এর মধ্যে .proto ফাইল ভাগ করে typed contract রাখা'
        correct: true
        why: '.proto থেকে প্রতিটা ভাষার কোড বানানো যায়, তাই contract এক জায়গায় থাকে।'
      - text: 'ব্রাউজারের Vue অ্যাপ থেকে সরাসরি, কোনো proxy ছাড়া'
        correct: false
        why: 'ব্রাউজার native gRPC বলতে পারে না। gRPC-Web বা মাঝে proxy লাগে।'
    ref: four-styles
  - q: 'ছোট একটা ব্লগ অ্যাপ: এক Vue frontend, এক Symfony API, তিনজনের দল। কেউ প্রস্তাব দিল GraphQL আনার, "কারণ সবাই এখন এটাই করে।" সবচেয়ে ভালো উত্তর কোনটা?'
    hint: 'ব্যথাটা কী ছিল?'
    options:
      - text: 'ভালো কথা, GraphQL সবসময় REST-এর চেয়ে উন্নত'
        correct: false
        why: 'উন্নত বা খারাপ নয়, ভিন্ন। ব্যথা না থাকলে বাড়তি জটিলতা শুধু খরচ।'
      - text: 'প্রথমে দেখি over-fetching বা বারবার ডাকার সমস্যা আসলে আছে কি না। না থাকলে REST-ই ঠিক'
        correct: true
        why: 'এক client আর ছোট দলে সাধারণত এই ব্যথা প্রায় থাকে না, আর GraphQL-এর cache ও নিরাপত্তার জটিলতা আসে।'
      - text: 'GraphQL আনলে gRPC-ও একসাথে আনা উচিত, যাতে সব স্টাইল থাকে'
        correct: false
        why: 'যত বেশি স্টাইল, তত বেশি চালানোর ও শেখার বোঝা।'
      - text: 'REST-ই ঠিক, কারণ GraphQL কখনোই production-এ চলে না'
        correct: false
        why: 'GraphQL অনেক বড় প্রতিষ্ঠানে চলে। প্রশ্ন হলো এই অ্যাপের জন্য দরকার কি না।'
    ref: decision-guide
  - q: 'GraphQL-এ cache করা REST-এর চেয়ে কঠিন কেন?'
    hint: 'HTTP cache কীসের ওপর ভিত্তি করে cache key বানায়?'
    options:
      - text: 'GraphQL সাধারণত একটাই URL-এ POST দিয়ে কথা বলে, তাই URL ধরে HTTP cache চলে না'
        correct: true
        why: 'REST-এ প্রতিটা resource-এর আলাদা URL আর GET থাকে, তাই ব্রাউজার ও CDN সহজে cache করে।'
      - text: 'GraphQL-এর response সবসময় এনক্রিপ্ট করা থাকে'
        correct: false
        why: 'এনক্রিপশন এর সাথে সম্পর্কহীন; কারণ হলো URL আর method।'
      - text: 'GraphQL-এ ডেটাবেস query ধীর হয়'
        correct: false
        why: 'ডেটাবেসের গতি স্টাইলের ওপর নির্ভর করে না। cache কঠিন হওয়ার কারণ request-এর গঠন।'
      - text: 'GraphQL cache করা নিষিদ্ধ'
        correct: false
        why: 'নিষিদ্ধ নয়, তবে সেটা সার্ভারে বা client library-তে আলাদা কৌশলে করতে হয়।'
    ref: graphql-grpc-shape
