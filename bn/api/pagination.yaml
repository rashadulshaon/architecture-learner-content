slides:
  - slug: page-five-thousand
    title: 'পেজ ৫০০০ খুলতে ৩ সেকেন্ড'
    kind: story
    tldr: 'OFFSET দিয়ে পাতা ভাগ করলে গভীর পাতা ক্রমশ ধীর হয়, আর নতুন ডেটা ঢুকলে পাতা সরে গিয়ে সারি হারায় বা দুইবার আসে।'
    keywords: ['pagination', 'offset', 'LIMIT OFFSET', 'deep page', 'পেজিনেশন', 'ধীর query']
    blocks:
      - type: text
        body: |
          রহিমের অ্যাডমিন প্যানেলে ১০ লাখ অর্ডার, প্রতি পাতায় ২০টা। সে লিখেছিল `LIMIT 20 OFFSET :page * 20`, প্রথম কয়েক পাতা ঝটপট। কিন্তু অডিটর যখন পেজ ৫০০০ খুলল, query-র সময় গেল প্রায় ৩ সেকেন্ড। কারণ OFFSET ১ লাখ (৫০০০ পাতা × ২০), তাই ডেটাবেস আগে ১ লাখ সারি গুনে ফেলে দেয়, তারপর ২০টা দেয়।
      - type: visual
        kind: bars
        caption: 'উদাহরণ: পাতার নম্বর বাড়লে OFFSET query-র সময় (১০ লাখ সারির টেবিলে)'
        items:
          - {label: 'পেজ ১', value: 4, display: '4ms', tone: good, tip: 'শুরুর পাতা, প্রায় কিছুই পেরোতে হয় না। তাই পরীক্ষায় সবকিছু দ্রুত মনে হয়।'}
          - {label: 'পেজ ১০০', value: 60, display: '60ms', tone: default, tip: 'প্রায় ২ হাজার সারি পেরিয়ে তারপর ২০টা নেওয়া।'}
          - {label: 'পেজ ১০০০', value: 600, display: '600ms', tone: warn, tip: 'প্রায় ২০ হাজার সারি পড়ে ফেলে দেওয়া। সময় সোজা পাতার নম্বরের সাথে বাড়ে।'}
          - {label: 'পেজ ৫০০০', value: 3000, display: '3000ms', tone: bad, tip: 'প্রায় ১ লাখ সারি পড়ে ফেলে দেওয়া, শুধু ২০টা রাখার জন্য।'}
      - type: quote
        body: 'OFFSET N মানে: ডেটাবেস N সারি পড়ে ফেলে দেয়, তারপর আপনাকে দেয়। পাতা যত গভীর, খরচ তত বেশি।'
    aside:
      - type: story
        title: 'দ্বিতীয় বিপদ: সরে যাওয়া পাতা'
        body: |
          করিম পেজ ১ দেখে পেজ ২ চাপল, এর মধ্যে নতুন ৫টা অর্ডার ঢুকে গেছে। এখন সব পুরনো সারি ৫ জায়গা সরে গেছে, তাই পেজ ১-এর শেষ ৫টা অর্ডার পেজ ২-এর শুরুতে আবার এল। উল্টোভাবে সারি মুছলে কিছু সারি একদম বাদ পড়ে।
      - type: terms
        items:
          - {term: 'Pagination', meaning: 'বড় তালিকা ছোট ছোট পাতায় ভাগ করে একটু একটু করে দেওয়া।'}
          - {term: 'Offset', meaning: 'শুরু থেকে কতগুলো সারি ছেড়ে দিয়ে শুরু করবে, সেই সংখ্যা।'}
    check:
      q: 'OFFSET 100000 দিয়ে পাতা আনলে ধীর হয় কেন, যখন ফেরত আসে মাত্র ২০টা সারি?'
      a: 'ডেটাবেসকে প্রথম ১ লাখ সারি পেরিয়ে পড়ে ফেলে দিতে হয়, তারপর ২০টা দিতে হয়। খরচ ফেরত-আসা সারির নয়, পেরোনো সারির সমান।'

  - slug: bookmark-idea
    title: 'বুকমার্ক: শেষ সারির পর থেকে শুরু'
    kind: concept
    tldr: 'Cursor (keyset) pagination শেষ দেখা সারির মান মনে রেখে "ওর পর থেকে ২০টা দিন" বলে। index সরাসরি সেই জায়গায় পৌঁছে যায়, তাই সব পাতা সমান দ্রুত।'
    keywords: ['cursor pagination', 'keyset pagination', 'seek method', 'bookmark', 'কার্সার', 'কীসেট']
    blocks:
      - type: metaphor
        icon: book
        title: 'লাইব্রেরির বই আর বুকমার্ক'
        body: |
          মোটা বইয়ে "৫০০ নম্বর পাতার পর থেকে পড়ুন" বললে আপনি প্রথম থেকে ৫০০ পাতা গুনতে যাবে না, বুকমার্ক থেকে সোজা খুলবে। Offset হলো পাতা গুনে যাওয়া, cursor হলো বুকমার্ক। শেষ সারিটাই বুকমার্ক: "এই সারির পরের ২০টা দিন"।
      - type: visual
