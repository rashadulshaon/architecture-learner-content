      q: 'Cursor pagination-এ পাতা নম্বর ১ হোক বা ৫০০০, query-র গতি সমান থাকে কেন?'
      a: 'কারণ ডেটাবেস কোনো সারি পেরোয় না। index থেকে শেষ দেখা সারির মান ধরে সোজা সেই জায়গায় গিয়ে ২০টা তোলে।'

  - slug: keyset-doctrine
    title: 'Doctrine-এ keyset query'
    kind: howto
    tldr: 'ORDER BY created_at DESC, id DESC, আর পরের পাতার শর্ত (created_at < :at) OR (created_at = :at AND id < :id)। একটা বেশি সারি এনে "আরও আছে কি না" জানুন।'
    keywords: ['Doctrine QueryBuilder', 'keyset', 'cursor', 'setMaxResults', 'order by id', 'ডক্ট্রিন']
    blocks:
      - type: text
        body: |
          cursor হিসেবে দুটো মান রাখি: `createdAt` আর `id`। client-কে এটা একটা অস্বচ্ছ string হিসেবে দিই, যাতে ভেতরের গঠন বদলালে client না ভাঙে। query-র একটা চালাকি: `limit + 1` সারি আনি; বাড়তি সারি এলেই বুঝি আরও পাতা আছে।
      - type: code
        lang: php
        file: 'src/Pagination/Cursor.php'
        variant: good
        code: |
          final readonly class Cursor
          {
              public function __construct(
                  public DateTimeImmutable $createdAt,
                  public int $id,
              ) {
              }

              public function encode(): string
              {
                  $raw = $this->createdAt->format(DATE_ATOM).'|'.$this->id;

                  return rtrim(strtr(base64_encode($raw), '+/', '-_'), '=');
              }

              public static function decode(string $token): self
              {
                  $raw = base64_decode(strtr($token, '-_', '+/'), true);
                  if (false === $raw || !str_contains($raw, '|')) {
                      throw new BadRequestHttpException('cursor ঠিক নেই');
                  }
                  [$at, $id] = explode('|', $raw, 2);

                  return new self(new DateTimeImmutable($at), (int) $id);
              }

              public static function fromOrder(Order $order): self
              {
                  return new self($order->getCreatedAt(), $order->getId());
              }
          }
        marks:
          - {line: 13, tip: 'URL-এ নিরাপদ base64 (+ আর / বদলে - আর _)। client এটাকে কেবল একটা অর্থহীন string হিসেবে ফেরত পাঠায়।'}
          - {line: 20, tip: 'ভাঙা বা বানানো cursor এলে 400 দিন; কখনো 500 নয়। এটা ব্যবহারকারীর ইনপুট।'}
      - type: code
        lang: php
        file: 'src/Repository/OrderRepository.php'
        variant: good
        code: |
          public function page(?Cursor $after, int $limit): array
          {
              $qb = $this->createQueryBuilder('o')
                  ->orderBy('o.createdAt', 'DESC')
                  ->addOrderBy('o.id', 'DESC')          // tie-breaker
                  ->setMaxResults($limit + 1);          // একটা বেশি: আরও আছে কি না

              if (null !== $after) {
                  $qb->andWhere('o.createdAt < :at OR (o.createdAt = :at AND o.id < :id)')
                      ->setParameter('at', $after->createdAt, Types::DATETIME_IMMUTABLE)
                      ->setParameter('id', $after->id);
              }

              return $qb->getQuery()->getResult();
          }
        marks:
          - {line: 5, tip: 'created_at একই হলে id দিয়ে ক্রম ঠিক হয়। এটা ছাড়া একই সময়ের সারি হারাতে পারে (শেষ স্লাইড দেখুন)।'}
          - {line: 6, tip: 'limit + 1: বাড়তি সারি এলে পরের পাতা আছে। সেটা আলাদা COUNT query-র চেয়ে অনেক সস্তা।'}
          - {line: 9, tip: 'DQL-এ tuple তুলনা চলে না, তাই শর্তটা OR দিয়ে খুলে লেখা। ফল একই।'}
    aside:
      - type: tips
        items:
          - 'অন্য কোনো ক্রমে (যেমন দাম) সাজালে cursor-এ সেই কলামও রাখুন, আর সেই কলাম আর id নিয়ে index বানান।'
          - '`limit`-এর ওপরের সীমা (যেমন ১০০) সবসময় সার্ভারে বসান। client ১০ লাখ চাইলেও দেবেন না।'
          - 'Doctrine-এর datetime কলামে পুরো সেকেন্ড থাকে, তাই DATE_ATOM যথেষ্ট। microsecond রাখলে সেটাও encode করুন (`Y-m-d\TH:i:s.uP`), নইলে সারি হারায়।'
      - type: refs
        items:
          - {to: 'data/indexing', label: 'Composite index: কলামের ক্রম'}
    check:
      q: 'কেন `limit` সারি না এনে `limit + 1` সারি আনা হয়?'
      a: 'বাড়তি একটা সারি এলে বোঝা যায় পরের পাতা আছে (সেটা ফেলে দিই)। এতে আলাদা ও ধীর COUNT query লাগে না।'

  - slug: controller-and-vue
    title: 'Controller থেকে Vue: cursor ঘুরিয়ে দেওয়া'
    kind: howto
    tldr: 'controller response-এ items আর nextCursor দেয়; Vue সেই nextCursor পরের request-এ after হিসেবে ফেরত পাঠায়, আর null এলে থামে।'
    keywords: ['MapQueryParameter', 'nextCursor', 'Vue', 'infinite scroll', 'load more', 'অসীম স্ক্রল']
    blocks:
      - type: text
        body: |
          response-এ দুটো জিনিস: পাতার `items`, আর `nextCursor`, যা শেষ পাতায় `null`। Vue অ্যাপ cursor-টা বুঝে খোলার চেষ্টা করে না, শুধু ঘুরিয়ে পাঠায়।
      - type: code
        lang: php
        file: 'src/Controller/Api/V1/OrderController.php'
        variant: good
        code: |
          #[Route('/api/v1/orders', methods: ['GET'])]
          public function list(
              OrderRepository $orders,
              #[MapQueryParameter] ?string $after = null,
              #[MapQueryParameter] int $limit = 20,
          ): JsonResponse {
              $limit = max(1, min($limit, 100));
              $rows = $orders->page($after ? Cursor::decode($after) : null, $limit);

              $hasMore = count($rows) > $limit;
              $rows = array_slice($rows, 0, $limit);

              return $this->json([
                  'items' => array_map(OrderDto::from(...), $rows),
                  'nextCursor' => $hasMore ? Cursor::fromOrder(end($rows))->encode() : null,
              ]);
          }
        marks:
          - {line: 7, tip: 'client যা-ই চাক, ১ থেকে ১০০-এর মধ্যে বেঁধে দেওয়া হলো।'}
          - {line: 10, tip: 'বাড়তি সারি এসেছে মানে পরের পাতা আছে। তারপর সেটা কেটে ফেলা হয়, client-এর কাছে যায় না।'}
          - {line: 15, tip: 'শেষ পাতায় nextCursor null। client এই null দেখেই "আর নেই" বোঝে।'}
      - type: code
        lang: vue
        file: 'src/components/OrderList.vue'
        variant: good
        code: |
          <script setup lang="ts">
          import { ref } from 'vue'

          type Order = { id: number; total: number }
          type Page = { items: Order[]; nextCursor: string | null }

          const orders = ref<Order[]>([])
          const nextCursor = ref<string | null>(null)
          const done = ref(false)
          const loading = ref(false)

          async function loadMore() {
            if (loading.value || done.value) return
            loading.value = true
            try {
              const qs = new URLSearchParams({ limit: '20' })
              if (nextCursor.value) qs.set('after', nextCursor.value)
              const res = await fetch(`/api/v1/orders?${qs}`)
              if (!res.ok) throw new Error(`HTTP ${res.status}`)
              const page: Page = await res.json()
              orders.value.push(...page.items)
              nextCursor.value = page.nextCursor
              done.value = page.nextCursor === null
            } finally {
              loading.value = false
            }
          }
          loadMore()
          </script>
        marks:
          - {line: 14, tip: 'দ্রুত দুইবার ক্লিকে একই পাতা দুইবার আনা ঠেকাতে loading flag।'}
          - {line: 17, tip: 'আগের পাতার nextCursor-ই এই request-এর after। client cursor খোলে না।'}
          - {line: 23, tip: 'null এলে done = true, আর কোনো request যাবে না।'}
    aside:
      - type: tips
        items:
          - 'Vue-তে infinite scroll বানালে IntersectionObserver দিয়ে তালিকার শেষে পৌঁছালে loadMore() ডাকুন।'
          - 'উত্তরে `Link` header বা `nextCursor` ক্ষেত্র, যেকোনো একটা রীতি ধরে একই রাখুন। একই API-তে দুই রকম মিশাবেন না।'
      - type: refs
        items:
          - {to: 'api/contracts-versioning', label: 'cursor-এর গঠন contract-এর অংশ নয় কেন'}
    check:
      q: 'Vue অ্যাপ cursor string-টা নিজে খুলে বুঝতে না চেয়ে শুধু ঘুরিয়ে পাঠায় কেন?'
      a: 'cursor-এর ভেতরের গঠন সার্ভারের ব্যাপার। client না খুললে সার্ভার পরে গঠন বদলালেও client ভাঙে না।'

  - slug: tie-breaker-trap
    title: 'একই সময়ের সারি যখন হারায়'
    kind: pitfall
    tldr: 'শুধু created_at ধরে cursor বানালে একই সেকেন্ডের সারিগুলো পাতার সীমায় হারিয়ে যায়। ক্রমে একটা অনন্য tie-breaker (id) জোড়ো।'
    keywords: ['tie-breaker', 'stable ordering', 'unique order', 'cursor bug', 'row value comparison', 'স্থির ক্রম']
    blocks:
      - type: text
        body: |
          ধরুন ১০:০০:০০ সেকেন্ডে একসাথে তিনটা অর্ডার ঢুকেছে। পাতার সীমা ঠিক এদের মাঝখানে পড়ল। তখন cursor বলছে `created_at < 10:00:00`, আর একই সময়ের বাকি দুটো অর্ডার এই শর্তে কখনো আসবেই না। সারি নীরবে হারিয়ে যায়, কোনো error ছাড়া।
      - type: visual
        kind: table
        caption: 'একই পাতার সীমা, tie-breaker id ছাড়া আর সহ'
        headers: ['id', 'created_at', 'শুধু created_at', '(created_at, id) জোড়ায়']
        rows:
          - cells: ['105', '10:00:00', 'পাতা ১-এর শেষ, cursor এখানে', 'পাতা ১-এর শেষ, cursor এখানে']
            tip: 'cursor-এ এই সারির created_at থাকে, আর সমাধানে id-ও: (10:00:00, 105)।'
          - cells: ['104', '10:00:00', 'হারিয়ে গেল', 'পাতা ২, প্রথম সারি']
            tip: 'created_at < 10:00:00 সমান সময়ে মিথ্যা, তাই বাদ। জোড়া ধরলে (10:00:00, 104) < (10:00:00, 105) সত্য।'
          - cells: ['103', '10:00:00', 'হারিয়ে গেল', 'পাতা ২, দ্বিতীয় সারি']
            tip: 'একই কারণে বাদ, আর কেউ টের পায় না কারণ error আসে না। জোড়া তুলনায় সারিটা থাকে।'
          - cells: ['102', '09:59:59', 'পাতা ২, প্রথম সারি', 'পাতা ২, তৃতীয় সারি']
            tip: 'শুধু created_at ধরলে পাতা ২ স্বাভাবিক দেখায়: শুধু দুটো সারি দেরিতে শুরু হয়।'
      - type: code
        lang: sql
        variant: bad
        code: |
          SELECT * FROM orders
          WHERE created_at < :last_created_at
          ORDER BY created_at DESC
          LIMIT 20;
        marks:
          - {line: 2, tip: 'সমান created_at-এর সারি বাদ পড়ে। আর ক্রমও অনন্য নয়, তাই দুই request-এ একই সারির অবস্থান বদলাতে পারে।'}
      - type: code
        lang: sql
        file: 'migrations / psql'
        variant: good
        code: |
          SELECT * FROM orders
          WHERE (created_at, id) < (:last_created_at, :last_id)
          ORDER BY created_at DESC, id DESC
          LIMIT 20;

          CREATE INDEX idx_orders_created_id ON orders (created_at, id);
        marks:
          - {line: 2, tip: 'row-value তুলনা: (created_at, id) জোড়া হিসেবে বড়-ছোট দেখে। PostgreSQL আর MySQL দুটোতেই চলে।'}
          - {line: 6, tip: 'ORDER BY-এর সাথে মেলানো index। এটা না থাকলে keyset-এর গতির সুবিধা চলে যায়।'}
    aside:
      - type: pitfalls
        items:
          - 'ক্রমের কলাম অনন্য না হলে (created_at একা, দাম একা), সেই ক্রমে cursor ভুল করবে। শেষে সবসময় id জুড়ে দিন।'
          - 'ASC আর DESC মিশিয়ে সাজালে row-value তুলনা ভুল দিকে যায়। সব কলামে একই দিক রাখুন।'
      - type: remember
        body: 'cursor-এর ক্রম অনন্য হতেই হবে: শেষে id।'
      - type: refs
        items:
          - {to: 'data/id-generation', label: 'ID বাছাইয়ের ফল (UUIDv7 ক্রম মেনে চলে)'}
    check:
      q: 'শুধু created_at দিয়ে cursor হলে কেন একই সেকেন্ডের কিছু সারি হারায়, আর সমাধান কী?'
      a: 'শর্ত `created_at < শেষ মান` সমান মানের সারি বাদ দেয়। ক্রমে অনন্য id জুড়ে (created_at, id) জোড়া ধরে তুললে কোনো সারি হারায় না।'

flashcards:
  - q: 'OFFSET পাতা ধীর হয় কেন?'
    a: 'ডেটাবেস OFFSET পর্যন্ত সব সারি পড়ে ফেলে দেয়, তারপর চাওয়া সারি দেয়। পাতা যত গভীর, খরচ তত বেশি।'
    more: |
      OFFSET 100000 LIMIT 20-এ ফেরত আসে ২০টা সারি, কিন্তু পড়তে হয় ১ লাখ ২০টা। তাই পেজ ১ দ্রুত আর পেজ ৫০০০ ধীর। index থাকলেও পেরোনো সারিগুলো গুনতে হয়।
    ref: page-five-thousand
  - q: 'Offset pagination-এ নতুন সারি ঢুকলে কী ভুল হয়?'
    a: 'সব সারি সরে যায়, ফলে এক সারি দুই পাতায় আসে অথবা কোনো সারি বাদ পড়ে।'
    more: |
      পেজ ১ দেখার পর নতুন ৫টা সারি ওপরে ঢুকলে পেজ ২-এ আগের ৫টা সারি আবার আসে। সারি মুছলে উল্টোটা: কিছু সারি কখনোই দেখা হয় না। cursor pagination শেষ দেখা সারি ধরে এগোয়, তাই এই সমস্যা হয় না।
    ref: page-five-thousand
  - q: 'Cursor (keyset) pagination এক লাইনে কী?'
    a: 'শেষ দেখা সারির মান ধরে "ওর পরের N সারি দিন" বলা, পাতার নম্বর ধরে নয়।'
    more: |
      query-তে `WHERE (created_at, id) < (শেষ মান)` শর্ত থাকে আর index সোজা সেই জায়গায় যায়। তাই সব পাতা সমান দ্রুত। বিনিময়ে "পেজ ৫০-এ যান" সহজে সম্ভব নয়।
    ref: bookmark-idea
  - q: 'Cursor pagination কখন বাছবেন, আর offset কখন চলে?'
    a: 'বড় বা ঘনঘন বদলানো তালিকায় (feed, লগ, অসীম scroll) cursor। ছোট স্থির টেবিলে, যেখানে পেজ নম্বরে লাফ লাগে, offset।'
    more: |
      অ্যাডমিন প্যানেলের ২০০ সারির তালিকায় offset-ই ঠিক আছে, সরলতার জন্য। কিন্তু লাখ লাখ সারির তালিকা বা public API-তে cursor বাছুন, কারণ গভীর পাতা আর সরে যাওয়া পাতা দুটোই সামলায়।
    ref: bookmark-idea
  - q: 'Keyset pagination-এ tie-breaker কেন লাগে?'
    a: 'সাজানোর কলামে একই মান থাকলে সারি হারায়। শেষে অনন্য id জুড়লে ক্রম পুরোপুরি নির্দিষ্ট হয়।'
    more: |
      `ORDER BY created_at DESC, id DESC` আর শর্ত `(created_at, id) < (:at, :id)`। শুধু created_at ধরলে একই সেকেন্ডের সারিগুলো পাতার সীমায় নীরবে বাদ পড়ে, কোনো error ছাড়াই।
    ref: tie-breaker-trap
  - q: 'কেন `limit + 1` সারি আনা হয়?'
    a: 'বাড়তি সারি এলে বোঝা যায় পরের পাতা আছে। সেটা ফেলে দিয়ে nextCursor বানানো হয়, আলাদা COUNT লাগে না।'
    more: |
      বড় টেবিলে COUNT(*) নিজেই ধীর। তাই cursor API সাধারণত শুধু জানায় "আরও আছে কি না": nextCursor থাকলে আছে, null হলে শেষ।
    ref: keyset-doctrine
  - q: 'client cursor-এর ভেতরটা খুলে কেন দেখে না?'
    a: 'cursor একটা অস্বচ্ছ string। ভেতরের গঠন সার্ভারের ব্যাপার, তাই সার্ভার গঠন বদলালে client ভাঙে না।'
    more: |
      cursor-এ created_at আর id থাকে, কিন্তু client শুধু প্রতিবার nextCursor আনে আর `after` হিসেবে ফেরত পাঠায়। ভাঙা cursor এলে সার্ভারের উচিত 400 দেওয়া। এছাড়া limit-এর ওপর সীমা (যেমন ১০০) সার্ভারেই বসাতে হয়।
    ref: controller-and-vue

quiz:
  - q: 'অ্যাডমিন প্যানেলে ২০ লাখ অর্ডারের তালিকা `OFFSET` দিয়ে পাতা করা। শেষের দিকের পাতা ৫ সেকেন্ড লাগে। সবচেয়ে সঠিক সমাধান কোনটা?'
    hint: 'ধীর হওয়ার আসল কারণ কী: পেরিয়ে যাওয়া সারি, নাকি ফেরত আসা সারি?'
    options:
      - text: 'সার্ভারে RAM বাড়ানো'
        correct: false
        why: 'RAM বাড়লে হয়তো একটু কমবে, কিন্তু প্রতিটা বাড়তি পাতায় বাড়তি সারি পেরোনোর খরচ থেকেই যায়।'
      - text: 'cursor (keyset) pagination-এ যাওয়া, যাতে index সোজা শেষ সারির পরে পৌঁছায়'
        correct: true
        why: 'কোনো সারি না পেরিয়ে সোজা জায়গায় গিয়ে ২০টা তোলে, তাই সব পাতা সমান দ্রুত।'
      - text: 'page size ২০ থেকে ১০ করা'
        correct: false
        why: 'পাতা ছোট হলে পাতার সংখ্যা বাড়ে, আর OFFSET-এর পেরোনো সারি বরং আরও গভীরে যায়।'
      - text: 'প্রতিবার COUNT(*) চালিয়ে শেষ পাতা বের করা'
        correct: false
        why: 'COUNT নিজেই বড় টেবিলে ধীর, আর OFFSET-এর সমস্যা মেটায় না।'
    ref: bookmark-idea
  - q: 'নিচের কোডে কী ভুল আছে?'
    lang: php
    code: |
      $qb = $this->createQueryBuilder('o')
          ->orderBy('o.createdAt', 'DESC')
          ->setMaxResults($limit + 1);

      if ($after) {
          $qb->andWhere('o.createdAt < :at')
              ->setParameter('at', $after->createdAt);
      }
    hint: 'একই সেকেন্ডে অনেক অর্ডার ঢুকলে কী হবে?'
    options:
      - text: 'setMaxResults-এ limit + 1 দেওয়া ভুল; শুধু limit দেওয়া উচিত'
        correct: false
        why: 'limit + 1 ঠিক, তাতে বোঝা যায় আরও পাতা আছে কি না।'
      - text: 'tie-breaker (id) নেই, তাই একই createdAt-এর সারি পাতার সীমায় হারিয়ে যাবে'
        correct: true
        why: 'শর্ত `< :at` সমান মানের সারি বাদ দেয়। ক্রমে আর শর্তে id জুড়তে হবে।'
      - text: 'DESC ক্রম cursor pagination-এ চলে না'
        correct: false
        why: 'DESC ঠিকই চলে, শুধু শর্তের দিক (<) ক্রমের সাথে মেলাতে হয়।'
      - text: 'QueryBuilder দিয়ে keyset করা যায় না, native SQL লাগবে'
        correct: false
        why: 'QueryBuilder দিয়ে OR দিয়ে খুলে লেখা শর্তে সহজেই করা যায়।'
    ref: tie-breaker-trap
  - q: 'নিচের কোন কোন ক্ষেত্রে offset pagination এখনো ঠিক পছন্দ?'
    hint: 'তালিকা কত বড়, আর ব্যবহারকারী কি পেজ নম্বরে সরাসরি লাফ দেয়?'
    options:
      - text: 'দেশের ৬৪টা জেলার স্থির তালিকা, ব্যবহারকারী "পেজ ৩"-এ যেতে চায়'
        correct: true
        why: 'ছোট, স্থির তালিকা: OFFSET-এর খরচ নগণ্য, আর পেজ নম্বরে লাফ সহজ।'
      - text: 'প্রতি সেকেন্ডে নতুন সারি ঢোকা ১০ কোটি সারির টাইমলাইন'
        correct: false
        why: 'এখানে অতি গভীর পাতা আর সরে যাওয়া সারি দুটোই সমস্যা। cursor লাগবে।'
      - text: 'শত শত সারির অ্যাডমিন রিপোর্ট, যেখানে "পেজ ৫-এ যান" দরকার'
        correct: true
        why: 'ছোট আকার, পেজ নম্বর দরকার। সরলতার জন্য offset ঠিক।'
      - text: 'মোবাইল অ্যাপের অসীম scroll feed'
        correct: false
        why: 'feed ঘনঘন বদলায়, আর "পরেরটা" ছাড়া কোনো লাফ লাগে না। cursor-ই স্বাভাবিক।'
    ref: bookmark-idea
  - q: 'Vue অ্যাপ প্রতিটা cursor খুলে তার ভেতরের created_at থেকে নিজের তালিকা সাজায়। এতে ভবিষ্যতে কী ঝুঁকি?'
    hint: 'cursor-এর গঠন কার ঠিক করার কথা?'
    options:
      - text: 'কোনো ঝুঁকি নেই, কারণ cursor-এর গঠন কখনোই বদলায় না'
        correct: false
        why: 'সার্ভার ক্রম বদলালে (যেমন id-এর সাথে নতুন কলাম) গঠন বদলাতে পারে।'
      - text: 'সার্ভার গঠন বদলালে client ভাঙবে; cursor অস্বচ্ছ রাখা উচিত'
        correct: true
        why: 'cursor একটা অস্বচ্ছ token হলে সার্ভার স্বাধীনভাবে ভেতরটা বদলাতে পারে।'
      - text: 'cursor বেশি লম্বা হয়ে URL ভেঙে যাবে'
        correct: false
        why: 'cursor ছোট, আর এটা ঝুঁকির মূল কারণও নয়।'
      - text: 'ব্রাউজার base64 পড়তে পারে না'
        correct: false
        why: 'ব্রাউজার পারে। সমস্যা প্রযুক্তিগত নয়, দায়িত্বের ভাগ নিয়ে।'
