            items:
              - 'সব পাতা সমান দ্রুত, index সোজা জায়গায় যায়'
              - 'নতুন সারি ঢুকলেও পাতা সরে না'
              - '"পরের" আর "আগের" সহজ, "পেজ ৫০-এ যান" সহজ নয়'
      - type: points
        title: 'Cursor-এর তিনটা অংশ'
        style: number
        items:
          - 'cursor হলো শেষ সারির সাজানোর মান, যেমন created_at আর id।'
          - 'query বলে: এই মানের "পরের" সারিগুলো দিন।'
          - 'response-এ আসে `nextCursor`; client সেটাই ফেরত পাঠিয়ে পরের পাতা নেয়।'
    aside:
      - type: when
