slides:
  - slug: shared-ledger-book
    title: 'এক খাতা সবার হাতে: শেয়ার করা ডেটাবেস'
    kind: story
    tldr: 'একাধিক অ্যাপ একই ডেটাবেসের টেবিলে সরাসরি লিখলে প্রতিটা কলাম গোপন API হয়ে যায়; একজন কলামের নাম বদলালে বাকিরা ভাঙে।'
    keywords: ['shared database', 'integration database', 'coupling', 'schema change', 'শেয়ার্ড ডেটাবেস']
    blocks:
      - type: text
        body: |
          মুদি দোকানের একটাই খাতা, আর দোকানি, ছেলে, হিসাবরক্ষক সবাই তাতে লেখে। একদিন ছেলে "দাম" কলামের নাম বদলে "দাম (পয়সায়)" করল। হিসাবরক্ষকের যোগ করার সূত্র ভেঙে গেল, কেউ আগে জানায়নি। অ্যাপেও একই ঘটে, যখন দুটো অ্যাপ একই `orders` টেবিলে সরাসরি হাত দেয়।
      - type: visual
        kind: flow
        caption: 'একই টেবিল তিন অ্যাপের হাতে: একজনের বদলে বাকিরা ভাঙে'
        nodes:
          - {id: checkout, label: 'Checkout', sub: 'টেবিলের মালিক', icon: cart, col: 0, row: 0, tip: 'orders টেবিলের আসল মালিক। টাকার কলাম float থেকে পয়সার integer করতে চায়।'}
          - {id: report, label: 'Reporting', sub: 'সরাসরি SQL', icon: chart, col: 0, row: 2, tip: 'নিজের SQL দিয়ে orders থেকে পড়ে। মালিকের জানা নেই কোন কলাম সে ব্যবহার করে।'}
          - {id: db, label: 'orders টেবিল', sub: 'সবার ভাগের', icon: db, tone: accent, col: 2, row: 1, tip: 'যেকোনো অ্যাপ এখানে পড়ে বা লেখে। কোনো মধ্যস্থতাকারী বা চুক্তি নেই।'}
          - {id: ware, label: 'Warehouse', sub: 'status সরাসরি লেখে', icon: box, col: 4, row: 1, tip: 'orders.status সরাসরি UPDATE করে, Checkout-এর কোনো নিয়ম না মেনে।'}
        edges:
          - {from: checkout, to: db, label: 'Checkout `total`-এর নাম বদলে `total_minor` করে', tone: warn}
          - {from: report, to: db, label: 'রাতের রিপোর্টের SQL `total` খুঁজে পায় না — ভেঙে যায়', tone: bad}
          - {from: ware, to: db, label: 'Warehouse `status = shipped` বসায়, পেমেন্ট না হলেও', tone: bad, tip: 'Checkout-এর নিয়ম ("পেমেন্টের আগে shipped নয়") ওয়্যারহাউস জানেই না।'}
      - type: quote
        body: 'শেয়ার করা টেবিলের প্রতিটা কলাম একটা গোপন API, যার কোনো চুক্তি কেউ জানে না।'
    aside:
      - type: problem
        body: 'অ্যাপগুলো যেন নিজেরা কোনো একটা উপায়ে কথা বলে। প্রশ্ন হলো কোন উপায়ে, আর সেটা আমাদের কতটা বাঁধে।'
      - type: terms
        items:
          - {term: 'Coupling', meaning: 'একটা অংশ বদলালে আরেকটা অংশ কতটা ভাঙে, তার মাপ।'}
    check:
      q: 'দুই অ্যাপ একই টেবিলে লিখলে Checkout-এর "পেমেন্টের আগে shipped নয়" নিয়ম ভাঙে কেন?'
      a: 'নিয়মটা Checkout-এর কোডে, টেবিলে নয়। Warehouse সরাসরি টেবিলে লিখে সেই কোডকে পাশ কাটিয়ে যায়।'

  - slug: four-styles
    title: 'যোগাযোগের চার পথ আর তাদের খরচ'
    kind: concept
    tldr: 'অ্যাপে অ্যাপে কথা বলার চার পথ: শেয়ার করা DB, RPC, messaging, ফাইল। যত বেশি সরাসরি, তত বেশি coupling।'
    keywords: ['integration styles', 'RPC', 'messaging', 'file transfer', 'shared database', 'coupling cost']
    blocks:
      - type: metaphor
        icon: mail
        title: 'দোকানে চার রকম যোগাযোগ'
        body: |
          এক খাতা সবার হাতে — সবচেয়ে কাছের, সবচেয়ে ঝুঁকির (shared DB)। সরাসরি ফোন — উত্তর তখনই পাও, কিন্তু অন্যপাশ ধরা থাকা চাই (RPC)। ডাকবাক্সে চিঠি — অন্যপাশ পরে পড়ে, কেউ আটকে থাকে না (messaging)। রোজকার কুরিয়ারের বড় বাক্স — একবারে অনেক, কিন্তু দেরিতে (file transfer)।
      - type: visual
        kind: table
        caption: 'চার স্টাইল, পাঁচ মাপকাঠি'
        headers: ['', 'Shared DB', 'RPC', 'Messaging', 'File']
        rows:
          - cells: ['কী ভাগ হয়', 'টেবিল-কলাম', 'API-র চুক্তি', 'message-এর আকার', 'ফাইলের ফরম্যাট']
            tip: 'এগুলোই সেই "চুক্তি"। যা ভাগ করা হয়, সেটা বদলানোই কঠিন।'
          - cells: ['সময়ের বাঁধন', 'তাৎক্ষণিক', 'দুই পক্ষ একসাথে চালু', 'আলাদা সময়ে চলে', 'ব্যাচে, দেরিতে']
            tip: 'যত তাড়াতাড়ি উত্তর লাগে, তত বেশি একসাথে চালু থাকা দরকার।'
          - cells: ['ওপাশ বন্ধ থাকলে', 'DB ধরলে দুজনই বন্ধ', 'আমার call ব্যর্থ', 'message জমে থাকে', 'ফাইল পড়ে থাকে']
            tip: 'RPC-তে অন্যের সমস্যা আমার সমস্যা হয়; messaging আর file-এ হয় না।'
          - cells: ['Coupling', 'সবচেয়ে কড়া', 'মাঝারি', 'ঢিলা', 'সবচেয়ে ঢিলা']
            tip: 'অন্যপাশ বদলালে আমি কতটা ভাঙি, তার মাপ।'
          - cells: ['বড় খরচ', 'schema বদলানো কঠিন', 'একের দেরি সবার দেরি', 'duplicate, ক্রম, debug', 'দেরি, ফরম্যাট ঝামেলা']
            tip: 'প্রতিটা স্টাইলের একটা লুকানো দাম আছে। সেটা জেনে বেছে নাও।'
      - type: quote
        body: 'যত কম জানলে চলে, তত ঢিলা বাঁধন। অন্যের টেবিল জানা সবচেয়ে কড়া বাঁধন।'
    aside:
      - type: terms
        items:
          - {term: 'RPC', meaning: 'অন্য অ্যাপের function সরাসরি ডাকা (সাধারণত HTTP-তে) আর উত্তরের অপেক্ষায় থাকা।'}
          - {term: 'Messaging', meaning: 'queue-তে message রেখে আসা; অন্যপাশ নিজের সময়ে নিয়ে কাজ করে।'}
      - type: remember
        body: 'যা ভাগ করো, তা-ই তোমার চুক্তি; চুক্তি যত ছোট, বাঁধন তত ঢিলা।'
    check:
      q: 'অন্য অ্যাপ বন্ধ থাকলে RPC আর messaging-এ ফল আলাদা কেন?'
      a: 'RPC-তে আমার call তখনই ব্যর্থ হয়, কারণ উত্তর লাগে। Messaging-এ message queue-তে জমে থাকে, অন্যপাশ চালু হলে পড়ে।'

  - slug: rpc-vs-message
    title: 'একই কাজ দুই ভাবে: RPC আর messaging'
    kind: howto
    tldr: 'RPC-তে এখনই উত্তর পাও কিন্তু অন্যপাশ চালু থাকা চাই; Messenger-এ message রেখে এগোও, আর অন্য সার্ভিস নিজের সময়ে সেটা সামলায়।'
    keywords: ['Symfony Messenger', 'HttpClient', 'AsMessageHandler', 'event', 'async', 'RPC call']
    blocks:
      - type: text
        body: |
          অর্ডার হলে গুদামে মাল আলাদা করতে হবে। **RPC**-তে আমরা গুদামকে সরাসরি ডাকি আর উত্তরের জন্য থামি। **Messaging**-এ আমরা শুধু "অর্ডার হয়েছে" খবরটা রেখে আসি, গুদাম পরে নেয়। দ্বিতীয় পথে গুদাম বন্ধ থাকলেও আমাদের অর্ডার আটকায় না।
      - type: code
        lang: php
        file: 'RPC: সরাসরি ডাকা'
        variant: neutral
        code: |
          // গুদামকে ডাকো, উত্তর না আসা পর্যন্ত থামো (timeout সহ)
          $res = $this->warehouseClient->request('POST', '/reservations', [
              'json' => ['orderId' => $order->id(), 'lines' => $lines],
              'timeout' => 3,
          ]);

          if (201 !== $res->getStatusCode()) {
              throw new StockUnavailable();      // গুদাম না বললে বা বন্ধ থাকলে অর্ডারও আটকায়
          }
        marks:
          - {line: 2, tip: 'এই লাইনে গুদাম চালু থাকা বাধ্যতামূলক। বন্ধ বা ধীর হলে আমাদের অর্ডারও আটকে যায়।'}
      - type: code
        lang: php
        file: 'Messaging: Symfony Messenger'
        variant: good
        code: |
          // ১. পাঠানোর পাশ (আমাদের সার্ভিস)
          final readonly class OrderPlaced
          {
              public function __construct(public string $orderId, public array $lines) {}
          }

          $this->bus->dispatch(new OrderPlaced($order->id(), $lines));   // রেখে এগিয়ে যাই

          // ২. নেওয়ার পাশ (গুদাম সার্ভিস, নিজের সময়ে)
          #[AsMessageHandler]
          final readonly class ReserveStock
          {
              public function __construct(private Warehouse $warehouse) {}

              public function __invoke(OrderPlaced $m): void
              {
                  $this->warehouse->reserve($m->orderId, $m->lines);
              }
          }
        marks:
          - {line: 7, tip: 'message queue-তে রেখেই ফিরে আসে। গুদাম বন্ধ থাকলেও অর্ডার সফল।'}
          - {line: 10, tip: 'handler আলাদা process বা সার্ভিসে চলতে পারে; কখনো একই message দুইবারও আসতে পারে, তাই এটাকেও idempotent রাখো।'}
    aside:
      - type: pitfalls
        items:
          - 'Messaging-এ message "দুইবার" আসতে পারে। handler-কে idempotent না বানালে ডবল কাজ হয়।'
          - 'RPC-র ভেতর RPC (A→B→C) বানালে একটার দেরিতে পুরো শৃঙ্খল আটকায়।'
      - type: refs
        items:
          - {to: 'messaging/delivery-guarantees', label: 'Message কয়বার আসে'}
          - {to: 'workflows/outbox-inbox', label: 'Outbox pattern'}
    check:
      q: 'গুদাম সার্ভিস ১০ মিনিট বন্ধ। RPC আর messaging-এ নতুন অর্ডারের কী হবে?'
      a: 'RPC-তে অর্ডার আটকে বা ব্যর্থ হয়। Messaging-এ অর্ডার সফল হয়, message জমে থাকে, আর গুদাম চালু হলে সামলে নেয়।'

  - slug: choosing-a-style
    title: 'কোনটা কখন: তিনটা প্রশ্ন'
    kind: compare
    tldr: 'এখনই উত্তর লাগে কি না, দুই পক্ষ একসাথে চালু থাকে কি না, আর ডেটা কত বড় — এই তিন প্রশ্নেই স্টাইল বাছা যায়।'
    keywords: ['choosing integration', 'decision', 'trade-off', 'synchronous vs asynchronous', 'কোনটা বাছব']
    blocks:
      - type: visual
        kind: steps
        caption: 'স্টাইল বাছার তিন প্রশ্ন'
        steps:
          - {title: '১. উত্তর এখনই লাগবে?', body: 'হ্যাঁ হলে RPC; না হলে messaging বা ফাইল', tip: 'ব্যবহারকারী স্ক্রিনে বসে উত্তরের অপেক্ষায় থাকলে RPC। নইলে পরে হলেও চলে।'}
          - {title: '২. ওপাশ সবসময় চালু?', body: 'না হলে messaging; RPC-র ওপর ভরসা কম', tip: 'অন্যপাশ বন্ধ বা ধীর হলে যেন আমাদের কাজ না থামে।'}
          - {title: '৩. ডেটা বড় আর নিয়মিত?', body: 'হ্যাঁ হলে ফাইল (batch), নইলে message', tip: 'রোজ লাখ সারি হলে ফাইল সস্তা; একটা একটা করে পাঠানো ব্যয়বহুল।'}
          - {title: '৪. অন্যের টেবিলে হাত?', body: 'কখনোই নয়; API বা event দিয়ে নাও', tip: 'শেয়ার করা DB কেবল পড়ার replica হিসেবে, লেখা নয়, আর তাও সীমিত পরিসরে।'}
      - type: visual
        kind: compare
        caption: 'কোথায় কোনটা মানায়'
        columns:
          - title: 'RPC / HTTP API'
            tone: default
            icon: api
            tip: 'এখনই উত্তর, ছোট অনুরোধ, সরাসরি ফল।'
            items:
              - 'ব্যালেন্স দেখা, কার্ড যাচাই'
              - 'ব্যবহারকারী উত্তরের অপেক্ষায়'
              - 'timeout আর retry লাগবেই'
          - title: 'Messaging'
            tone: good
            icon: queue
            tip: 'কাজ ছড়ানো, ঢিলা বাঁধন, দেরি চলবে।'
            items:
              - 'ইমেইল, stock হিসাব, রিপোর্ট'
              - 'একাধিক গ্রাহক একই খবর নেয়'
              - 'handler idempotent হতে হবে'
          - title: 'File transfer'
            tone: warn
            icon: file
            tip: 'বড় ব্যাচ, ঢিলা সময়সূচি, ব্যাংক বা সরকারি সিস্টেম।'
            items:
              - 'বেতন, স্টেটমেন্ট, রাতের ব্যাচ'
              - 'পুরনো সিস্টেমের সাথে একমাত্র পথ'
              - 'checksum আর control total লাগে'
      - type: quote
        body: 'অন্যের ডেটাবেসে লেখা নয়। API, message বা ফাইল — যেকোনো একটা চুক্তি বেছে নাও।'
    aside:
      - type: when
        use:
          - 'শেয়ার করা DB: একই দলের একই অ্যাপের ভেতরের অংশগুলোতে, আর সাময়িক migration-এ'
        avoid:
          - 'আলাদা দল বা আলাদা অ্যাপের মধ্যে, বিশেষ করে লেখার জন্য'
      - type: refs
        items:
          - {to: 'ledgers/batch-files', label: 'ফাইল ইন্টিগ্রেশন'}
          - {to: 'thinking/monolith-microservices', label: 'Monolith বনাম microservice'}
    check:
      q: 'রাতে ব্যাংকের লাখ সারির স্টেটমেন্ট আসে। RPC না ফাইল, আর কেন?'
      a: 'ফাইল। ডেটা বড়, নিয়মিত, আর এখনই উত্তর লাগে না। লাখ বার আলাদা call করা ধীর আর ব্যয়বহুল।'

flashcards:
  - q: 'ইন্টিগ্রেশনের চারটা প্রধান স্টাইল কী কী?'
    a: 'শেয়ার করা ডেটাবেস, RPC, messaging আর ফাইল transfer।'
    more: |
      চারটার মধ্যে পার্থক্য কতটা জানতে হয় আর কতটা একসাথে চালু থাকতে হয়। শেয়ার করা DB সবচেয়ে কাছের (সবচেয়ে কড়া বাঁধন), ফাইল সবচেয়ে দূরের (ঢিলা)।
    ref: four-styles
  - q: 'শেয়ার করা ডেটাবেস কেন বিপজ্জনক?'
    a: 'প্রতিটা কলাম একটা গোপন API হয়ে যায়: একজন বদলালে বাকিরা ভাঙে, আর একজন সরাসরি লিখলে অন্যের নিয়ম পাশ কাটানো যায়।'
    more: |
      টেবিল মালিকের ব্যবসার নিয়ম থাকে কোডে, টেবিলে নয়। অন্য অ্যাপ সরাসরি UPDATE করলে সেই নিয়ম এড়িয়ে যায়। schema বদলানোও কঠিন, কারণ কে কোন কলাম ব্যবহার করছে কেউ জানে না।
    ref: shared-ledger-book
  - q: 'RPC কী, আর তার সবচেয়ে বড় ঝুঁকি কী?'
    a: 'অন্য অ্যাপের function সরাসরি ডেকে উত্তরের অপেক্ষা। ঝুঁকি: অন্যপাশ বন্ধ বা ধীর হলে আমরাও আটকে যাই।'
    more: |
      তাই RPC-তে সবসময় timeout আর retry লাগে। A→B→C ধরনের শৃঙ্খলে একটার দেরি পুরোটাকে আটকে দেয়।
    ref: rpc-vs-message
  - q: 'Messaging-এ অন্যপাশ বন্ধ থাকলে কী হয়?'
    a: 'message queue-তে জমে থাকে। অন্যপাশ চালু হলে নেয়, আর আমাদের কাজ আটকায় না।'
    more: |
      দাম হলো: message একাধিকবার আসতে পারে, ক্রম বদলাতে পারে, আর debug কঠিন। তাই handler-কে idempotent রাখতে হয়।
    ref: rpc-vs-message
  - q: 'কখন ফাইল transfer বেছে নেওয়া উচিত?'
    a: 'ডেটা বড় ও নিয়মিত, এখনই উত্তর লাগে না, আর অন্যপাশ পুরনো বা বাইরের সিস্টেম (ব্যাংক, সরকারি)।'
    more: |
      ফাইল সবচেয়ে ঢিলা বাঁধন, কিন্তু দেরি আর ফরম্যাটের ঝামেলা আছে। checksum, control total আর quarantine ছাড়া নিরাপদ নয়।
    ref: choosing-a-style
  - q: 'স্টাইল বাছার তিন প্রশ্ন কী?'
    a: 'উত্তর এখনই লাগে কি না, অন্যপাশ সবসময় চালু কি না, আর ডেটা বড় ও নিয়মিত কি না।'
    more: |
      এখনই লাগলে RPC। অন্যপাশ অচল থাকতে পারলে messaging। বড় ও নিয়মিত হলে ফাইল। আর অন্যের টেবিলে লেখা কোনো উত্তরই নয়।
    ref: choosing-a-style
  - q: 'Coupling কম রাখার সহজ সূত্র কী?'
    a: 'যা ভাগ করো তা-ই তোমার চুক্তি। চুক্তি যত ছোট (একটা message বা API), বাঁধন তত ঢিলা।'
    more: |
      টেবিলের শতাধিক কলাম চুক্তি হলে বদল প্রায় অসম্ভব। একটা সুনির্দিষ্ট message বা API response চুক্তি হলে ভেতরে যা খুশি বদলানো যায়।
    ref: four-styles

quiz:
  - q: 'Reporting অ্যাপ সরাসরি Checkout-এর `orders` টেবিলে SQL চালায়। Checkout টিম `total` কলামের নাম বদলাল। কী ঘটবে?'
    hint: 'কেউ কি Reporting-কে জানিয়েছিল?'
    options:
      - text: 'Reporting-এর SQL রাতে ভেঙে যাবে, আর Checkout টিম আগে জানতই না যে সেটা ওই কলাম ব্যবহার করে'
        correct: true
        why: 'শেয়ার করা টেবিলে প্রতিটা কলাম গোপন API; চুক্তি অজানা বলে বদলের প্রভাবও অজানা।'
      - text: 'কিছুই ভাঙবে না, ডেটাবেস নিজেই নাম বদলের কথা সবাইকে জানায়'
        correct: false
        why: 'DB এমন কিছু জানায় না; query-র ভেতরের কলামের নাম শুধু রান করার সময় ভাঙে।'
      - text: 'শুধু Checkout ভাঙবে, Reporting নয়'
        correct: false
        why: 'উল্টো। কলামের নাম বদলালে যারা সেটা পড়ে, তারাই ভাঙে।'
      - text: 'ডেটাবেস পুরনো নামও কিছুদিন চালু রাখে'
        correct: false
        why: 'এমন কোনো সাধারণ ব্যবস্থা নেই; আলাদা করে view বা দুই কলাম রাখলেই তবে সম্ভব।'
    ref: shared-ledger-book
  - q: 'কোন পরিস্থিতিতে RPC উপযুক্ত?'
    hint: 'ব্যবহারকারী কি উত্তরের অপেক্ষায় স্ক্রিনে বসে আছে?'
    options:
      - text: 'checkout-এ কার্ড যাচাই করে এখনই ফল জানাতে হবে'
        correct: true
        why: 'ব্যবহারকারী অপেক্ষায়, আর উত্তর ছাড়া এগোনো যায় না। timeout আর retry সহ RPC মানানসই।'
      - text: 'অর্ডারের পর কনফার্মেশন ইমেইল পাঠানো'
        correct: false
        why: 'ইমেইল পরে গেলেও চলে; message queue-তে রাখাই ভালো।'
      - text: 'রাতে ১০ লাখ সারির স্টেটমেন্ট নেওয়া'
        correct: false
        why: 'ফাইল ট্রান্সফার এখানে সস্তা আর উপযুক্ত।'
      - text: 'অর্ডার হলে বিশ্লেষণ দলকে খবর দেওয়া, তাদের চালু থাকা নিশ্চিত নয়'
        correct: false
        why: 'ওপাশ বন্ধ থাকতে পারে; messaging-এ আমাদের কাজ আটকায় না।'
    ref: choosing-a-style
  - q: 'নিচের কোডের সবচেয়ে বড় ঝুঁকি কী?'
    lang: php
    code: |
      public function place(Order $order): void
      {
          $this->orders->save($order);
          $this->warehouseClient->request('POST', '/reservations', [
              'json' => ['orderId' => $order->id()],
          ])->getStatusCode();
      }
    hint: 'গুদাম ধীর বা বন্ধ হলে অর্ডার-সংরক্ষণের কী হবে?'
    options:
      - text: 'গুদামের উত্তরের অপেক্ষায় আমাদের request আটকাবে; timeout নেই, আর অর্ডার সংরক্ষিত কিন্তু রিজার্ভেশন হয়নি, এমন অবস্থা হতে পারে'
        correct: true
        why: 'RPC-র ভেতরে কাজ ভাগ হয়ে যায়: অর্ডার সংরক্ষিত, রিজার্ভেশন না। timeout নেই, তাই ধীর গুদামে worker আটকায়।'
      - text: '`save()` আগে ডাকা উচিত নয়'
        correct: false
        why: 'ক্রম বদলালেও দুই কাজ আলাদা, আর RPC-র ঝুঁকি থাকে।'
      - text: '`getStatusCode()` ব্যবহার করা যাবে না'
        correct: false
        why: 'এটা সুনির্দিষ্ট কোনো সমস্যা নয়।'
      - text: 'কোনো ঝুঁকি নেই; গুদাম সবসময় ভরসাযোগ্য'
        correct: false
        why: 'কোনো সার্ভিস সবসময় ভরসাযোগ্য নয়।'
    ref: rpc-vs-message
  - q: 'Messaging-এ নিচের কোন সতর্কতাগুলো দরকার?'
    hint: 'queue একই message কয়বার দিতে পারে?'
    options:
      - text: 'Handler-কে idempotent বানানো'
        correct: true
        why: 'message একাধিকবার আসতে পারে; দ্বিতীয়বারে কাজ ডবল হওয়া চলবে না।'
      - text: 'Message-এ শুধু দরকারি তথ্য রাখা (id, অঙ্ক), পুরো entity নয়'
        correct: true
        why: 'ছোট চুক্তি ঢিলা বাঁধন দেয়, আর entity বদলালেও message ভাঙে না।'
      - text: 'ব্যর্থ message-এর জন্য retry আর failure transport রাখা'
        correct: true
        why: 'কিছু message বারবার ব্যর্থ হয়; তারা হারালে কাজও হারায়।'
      - text: 'প্রতিটা message-এর উত্তরের জন্য producer-কে থামিয়ে রাখা'
        correct: false
        why: 'তাহলে এটা আর messaging থাকে না, RPC হয়ে যায়।'
    ref: rpc-vs-message
  - q: 'রাতে একটা পুরনো সরকারি সিস্টেম প্রতিদিন ৫ লাখ সারির তথ্য চায়, আর তাদের শুধু SFTP আছে। কোন স্টাইল?'
    hint: 'বাইরের সিস্টেম, বড় ডেটা, দেরি চলবে।'
    options:
      - text: 'ফাইল transfer, checksum আর control total-সহ'
        correct: true
        why: 'ডেটা বড়, নিয়মিত, অন্যপাশের একমাত্র পথ SFTP। যাচাইয়ের ফটক পার করে নিরাপদ হয়।'
      - text: 'প্রতিটা সারি আলাদা HTTP call করা'
        correct: false
        why: 'ওপাশ HTTP দেয় না; আর ৫ লাখ call ধীর ও ব্যয়বহুল।'
      - text: 'তাদের ডেটাবেসে সরাসরি লেখা'
        correct: false
        why: 'অন্যের ডেটাবেসে হাত নয়; আর তারা অনুমতিও দেবে না।'
      - text: 'প্রতিটা সারির জন্য একটা message পাঠানো'
        correct: false
        why: 'ওপাশে message broker নেই; আর ৫ লাখ message বাড়তি ঝামেলা।'
    ref: choosing-a-style
