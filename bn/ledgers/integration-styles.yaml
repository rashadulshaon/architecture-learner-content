          - {title: '২. ওপাশ সবসময় চালু?', body: 'না হলে messaging; RPC-র ওপর ভরসা কম', tip: 'অন্যপাশ বন্ধ বা ধীর হলে যেন আমাদের কাজ না থামে।'}
          - {title: '৩. ডেটা বড় আর নিয়মিত?', body: 'হ্যাঁ হলে ফাইল (batch), নইলে message', tip: 'একটা একটা করে ১ লাখ call, প্রতিটা ৫০ms হলে লাগে প্রায় ৮৩ মিনিট। একই সারির একটা ফাইল নেয় কয়েক সেকেন্ড।'}
          - {title: '৪. অন্যের টেবিলে হাত?', body: 'কখনোই নয়; API বা event দিয়ে নিন', tip: 'শেয়ার করা DB কেবল পড়ার replica হিসেবে, লেখা নয়, আর তাও সীমিত পরিসরে।'}
