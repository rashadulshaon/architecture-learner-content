      q: 'রাতে ব্যাংকের লাখ সারির স্টেটমেন্ট আসে। RPC না ফাইল, আর কেন?'
      a: 'ফাইল। ডেটা বড়, নিয়মিত, আর এখনই উত্তর লাগে না। লাখ বার আলাদা call করা ধীর আর ব্যয়বহুল।'

flashcards:
  - q: 'ইন্টিগ্রেশনের চারটা প্রধান স্টাইল কী কী?'
    a: 'শেয়ার করা ডেটাবেস, RPC, messaging আর ফাইল transfer।'
    more: |
      চারটার মধ্যে পার্থক্য কতটা জানতে হয় আর কতটা একসাথে চালু থাকতে হয়। শেয়ার করা DB সবচেয়ে কাছের (সবচেয়ে কড়া বাঁধন), ফাইল সবচেয়ে দূরের (ঢিলা)।
    ref: four-styles
  - q: 'শেয়ার করা ডেটাবেস কেন বিপজ্জনক?'
    a: 'প্রতিটা কলাম একটা গোপন API হয়ে যায়: একজন বদলালে বাকিরা ভাঙে, আর একজন সরাসরি লিখলে অন্যের নিয়ম পাশ কাটানো যায়।'
    more: |
      টেবিল মালিকের ব্যবসার নিয়ম থাকে কোডে, টেবিলে নয়। অন্য অ্যাপ সরাসরি UPDATE করলে সেই নিয়ম এড়িয়ে যায়। schema বদলানোও কঠিন, কারণ কে কোন কলাম ব্যবহার করছে কেউ জানে না।
    ref: shared-ledger-book
  - q: 'RPC কী, আর তার সবচেয়ে বড় ঝুঁকি কী?'
    a: 'অন্য অ্যাপের function সরাসরি ডেকে উত্তরের অপেক্ষা। ঝুঁকি: অন্যপাশ বন্ধ বা ধীর হলে আমরাও আটকে যাই।'
    more: |
      তাই RPC-তে সবসময় timeout আর retry লাগে। A→B→C ধরনের শৃঙ্খলে একটার দেরি পুরোটাকে আটকে দেয়।
    ref: rpc-vs-message
  - q: 'Messaging-এ অন্যপাশ বন্ধ থাকলে কী হয়?'
    a: 'message queue-তে জমে থাকে। অন্যপাশ চালু হলে নেয়, আর আমাদের কাজ আটকায় না।'
    more: |
      দাম হলো: message একাধিকবার আসতে পারে, ক্রম বদলাতে পারে, আর debug কঠিন। তাই handler-কে idempotent রাখতে হয়।
    ref: rpc-vs-message
  - q: 'কখন ফাইল transfer বেছে নেওয়া উচিত?'
    a: 'ডেটা বড় ও নিয়মিত, এখনই উত্তর লাগে না, আর অন্যপাশ পুরনো বা বাইরের সিস্টেম (ব্যাংক, সরকারি)।'
    more: |
      ফাইল সবচেয়ে ঢিলা বাঁধন, কিন্তু দেরি আর ফরম্যাটের ঝামেলা আছে। checksum, control total আর quarantine ছাড়া নিরাপদ নয়।
    ref: choosing-a-style
  - q: 'স্টাইল বাছার তিন প্রশ্ন কী?'
    a: 'উত্তর এখনই লাগে কি না, অন্যপাশ সবসময় চালু কি না, আর ডেটা বড় ও নিয়মিত কি না।'
    more: |
      এখনই লাগলে RPC। অন্যপাশ অচল থাকতে পারলে messaging। বড় ও নিয়মিত হলে ফাইল। আর অন্যের টেবিলে লেখা কোনো উত্তরই নয়।
    ref: choosing-a-style
  - q: 'Coupling কম রাখার সহজ সূত্র কী?'
    a: 'যা ভাগ করেন তা-ই আপনার চুক্তি। চুক্তি যত ছোট (একটা message বা API), বাঁধন তত ঢিলা।'
    more: |
      টেবিলের শতাধিক কলাম চুক্তি হলে বদল প্রায় অসম্ভব। একটা সুনির্দিষ্ট message বা API response চুক্তি হলে ভেতরে যা খুশি বদলানো যায়।
    ref: four-styles

  - q: 'শুধু `dispatch()` ডাকলেই Messenger async হয় না কেন?'
    a: 'message-class-এর routing নিয়ম না থাকলে Messenger handler-কে সঙ্গে সঙ্গে, একই request-এর ভেতরে চালায়। async transport-এ route দিলে সেটা queue-তে যায়।'
    more: |
      routing থাকে `messenger.yaml`-এর `routing:` অংশে। এরপর `messenger:consume` দিয়ে চালু করা worker message তুলে নেয়। তার আগে "async" কোড আসলে ছদ্মবেশী RPC: গুদামের বিভ্রাটে অর্ডারও ব্যর্থ হয়।
    ref: messenger-routing
  - q: 'অর্ডার সংরক্ষণ আর তার message dispatch-এর মাঝখানে কী ভুল হতে পারে?'
    a: 'মাঝখানে অ্যাপ ক্র্যাশ করতে পারে: অর্ডার সংরক্ষিত, কিন্তু message যায়নি, তাই গুদাম কিছু জানে না। outbox pattern এটা ঠেকায়।'
    more: |
      সংরক্ষণ আর পাঠানো দুটো আলাদা ধাপ, আর কোনোটাই অন্যটার সাথে একসাথে সফল বা ব্যর্থ হওয়ার নিশ্চয়তা দেয় না। outbox pattern message-কে অর্ডারের একই database transaction-এ লিখে রাখে, পাঠায় পরে।
    ref: messenger-routing

quiz:
  - q: 'Reporting অ্যাপ সরাসরি Checkout-এর `orders` টেবিলে SQL চালায়। Checkout টিম `total` কলামের নাম বদলাল। কী ঘটবে?'
    hint: 'কেউ কি Reporting-কে জানিয়েছিল?'
    options:
      - text: 'Reporting-এর SQL রাতে ভেঙে যাবে, আর Checkout টিম আগে জানতই না যে সেটা ওই কলাম ব্যবহার করে'
        correct: true
        why: 'শেয়ার করা টেবিলে প্রতিটা কলাম গোপন API; চুক্তি অজানা বলে বদলের প্রভাবও অজানা।'
      - text: 'কিছুই ভাঙবে না, ডেটাবেস নিজেই নাম বদলের কথা সবাইকে জানায়'
        correct: false
        why: 'DB এমন কিছু জানায় না; query-র ভেতরের কলামের নাম শুধু রান করার সময় ভাঙে।'
      - text: 'শুধু Checkout ভাঙবে, Reporting নয়'
        correct: false
        why: 'উল্টো। কলামের নাম বদলালে যারা সেটা পড়ে, তারাই ভাঙে।'
      - text: 'ডেটাবেস পুরনো নামও কিছুদিন চালু রাখে'
        correct: false
        why: 'এমন কোনো সাধারণ ব্যবস্থা নেই; আলাদা করে view বা দুই কলাম রাখলেই তবে সম্ভব।'
    ref: shared-ledger-book
  - q: 'কোন পরিস্থিতিতে RPC উপযুক্ত?'
    hint: 'ব্যবহারকারী কি উত্তরের অপেক্ষায় স্ক্রিনে বসে আছে?'
    options:
      - text: 'checkout-এ কার্ড যাচাই করে এখনই ফল জানাতে হবে'
        correct: true
        why: 'ব্যবহারকারী অপেক্ষায়, আর উত্তর ছাড়া এগোনো যায় না। timeout আর retry সহ RPC মানানসই।'
      - text: 'অর্ডারের পর কনফার্মেশন ইমেইল পাঠানো'
        correct: false
        why: 'ইমেইল পরে গেলেও চলে; message queue-তে রাখাই ভালো।'
      - text: 'রাতে ১০ লাখ সারির স্টেটমেন্ট নেওয়া'
        correct: false
        why: 'ফাইল ট্রান্সফার এখানে সস্তা আর উপযুক্ত।'
      - text: 'অর্ডার হলে বিশ্লেষণ দলকে খবর দেওয়া, তাদের চালু থাকা নিশ্চিত নয়'
        correct: false
        why: 'ওপাশ বন্ধ থাকতে পারে; messaging-এ আমাদের কাজ আটকায় না।'
    ref: choosing-a-style
  - q: 'নিচের কোডের সবচেয়ে বড় ঝুঁকি কী?'
    lang: php
    code: |
      public function place(Order $order): void
      {
          $this->orders->save($order);
          $this->warehouseClient->request('POST', '/reservations', [
              'json' => ['orderId' => $order->id()],
          ])->getStatusCode();
      }
    hint: 'গুদাম ধীর বা বন্ধ হলে অর্ডার-সংরক্ষণের কী হবে?'
    options:
      - text: 'গুদামের উত্তরের অপেক্ষায় আমাদের request আটকাবে; timeout নেই, আর অর্ডার সংরক্ষিত কিন্তু রিজার্ভেশন হয়নি, এমন অবস্থা হতে পারে'
        correct: true
        why: 'RPC-র ভেতরে কাজ ভাগ হয়ে যায়: অর্ডার সংরক্ষিত, রিজার্ভেশন না। timeout নেই, তাই ধীর গুদামে worker আটকায়।'
      - text: '`save()` আগে ডাকা উচিত নয়'
        correct: false
        why: 'ক্রম বদলালেও দুই কাজ আলাদা, আর RPC-র ঝুঁকি থাকে।'
      - text: '`getStatusCode()` ব্যবহার করা যাবে না'
        correct: false
        why: 'এটা সুনির্দিষ্ট কোনো সমস্যা নয়।'
      - text: 'কোনো ঝুঁকি নেই; গুদাম সবসময় ভরসাযোগ্য'
        correct: false
        why: 'কোনো সার্ভিস সবসময় ভরসাযোগ্য নয়।'
    ref: rpc-vs-message
  - q: 'Messaging-এ নিচের কোন সতর্কতাগুলো দরকার?'
    hint: 'queue একই message কয়বার দিতে পারে?'
    options:
      - text: 'Handler-কে idempotent বানানো'
        correct: true
        why: 'message একাধিকবার আসতে পারে; দ্বিতীয়বারে কাজ ডবল হওয়া চলবে না।'
      - text: 'Message-এ শুধু দরকারি তথ্য রাখা (id, অঙ্ক), পুরো entity নয়'
        correct: true
        why: 'ছোট চুক্তি ঢিলা বাঁধন দেয়, আর entity বদলালেও message ভাঙে না।'
      - text: 'ব্যর্থ message-এর জন্য retry আর failure transport রাখা'
        correct: true
        why: 'কিছু message বারবার ব্যর্থ হয়; তারা হারালে কাজও হারায়।'
      - text: 'প্রতিটা message-এর উত্তরের জন্য producer-কে থামিয়ে রাখা'
        correct: false
        why: 'তাহলে এটা আর messaging থাকে না, RPC হয়ে যায়।'
    ref: rpc-vs-message
  - q: 'রাতে একটা পুরনো সরকারি সিস্টেম প্রতিদিন ৫ লাখ সারির তথ্য চায়, আর তাদের শুধু SFTP আছে। কোন স্টাইল?'
    hint: 'বাইরের সিস্টেম, বড় ডেটা, দেরি চলবে।'
    options:
      - text: 'ফাইল transfer, checksum আর control total-সহ'
        correct: true
        why: 'ডেটা বড়, নিয়মিত, অন্যপাশের একমাত্র পথ SFTP। যাচাইয়ের ফটক পার করে নিরাপদ হয়।'
      - text: 'প্রতিটা সারি আলাদা HTTP call করা'
        correct: false
        why: 'ওপাশ HTTP দেয় না; আর ৫ লাখ call ধীর ও ব্যয়বহুল।'
      - text: 'তাদের ডেটাবেসে সরাসরি লেখা'
        correct: false
        why: 'অন্যের ডেটাবেসে হাত নয়; আর তারা অনুমতিও দেবে না।'
      - text: 'প্রতিটা সারির জন্য একটা message পাঠানো'
        correct: false
        why: 'ওপাশে message broker নেই; আর ৫ লাখ message বাড়তি ঝামেলা।'
    ref: choosing-a-style
  - q: 'রহিম Messenger দিয়ে `OrderPlaced` dispatch করল, কিন্তু `messenger.yaml`-এ এর জন্য routing নেই। গুদাম সার্ভিস বন্ধ। কী ঘটবে?'
    hint: 'route নেই এমন message কোথায় সামলানো হয়?'
    options:
      - text: 'message queue-তে জমে থাকবে আর অর্ডার সফল হবে'
        correct: false
        why: 'কোনো queue বাছা হয়নি। route কোনো async transport-এ না পাঠালে queue-ই থাকে না।'
      - text: 'Messenger নিজে পেছনে তিনবার retry করবে'
        correct: false
        why: 'retry transport-এর বিষয়। এখানে message কোনো transport-এ নেই, তাই retry-ও নেই।'
      - text: 'handler request-এর ভেতরেই চলবে, ব্যর্থ হবে, আর অর্ডারও ব্যর্থ হবে'
        correct: true
        why: 'route না থাকলে Messenger message-কে synchronously সামলায়। এটা ছদ্মবেশী RPC, গুদামের বিভ্রাট আমাদেরও হয়ে যায়।'
      - text: 'message চুপচাপ বাদ পড়বে আর অর্ডার সফল হবে'
        correct: false
        why: 'route না থাকলেও message বাদ পড়ে না। সেটা সঙ্গে সঙ্গে request-এর ভেতরে সামলানো হয়।'
    ref: messenger-routing
