          - 'ধাপে ধাপে round করবেন না; সব গুণ-ভাগ সেরে শেষে একবারই round করুন।'
          - 'এই `allocate` ঋণাত্মক অঙ্ক নেয় না। refund ভাগ করতে ধনাত্মক অঙ্কটা allocate করে প্রতিটা ভাগের চিহ্ন উল্টে দিন।'
