      q: '১০০ টাকা ৪ জনের মধ্যে ১:১:১:১ অনুপাতে ভাগ হলে allocate কী ফেরে?'
      a: 'প্রত্যেকে ২৫ টাকা (2500 পয়সা), ভাগশেষ ০। আর ১০০ টাকা ৩ জনে ভাগ হলে ভাগশেষ ১ পয়সা প্রথমজন পায়: 3334, 3333, 3333।'

flashcards:
  - q: 'কেন টাকা float-এ রাখা যায় না?'
    a: 'float দশমিক অঙ্ক binary-তে আনুমানিক রাখে। তাই ০.১ + ০.২ হুবহু ০.৩ হয় না, আর ছোট ভুল জমতে থাকে।'
    more: |
      ০.১ binary-তে অসীম ভগ্নাংশ, যেমন দশমিকে ১ ÷ ৩। কম্পিউটার কেটে রাখে বলে `0.1 + 0.2 == 0.3` false হয়। একটা ভুল ছোট, কিন্তু লাখো লেনদেনে জমে দিনশেষের হিসাব ভাঙে।
    ref: float-trap
  - q: 'Minor unit কী? টাকা আর ডলারের minor unit কী?'
    a: 'Currency-র ছোটতম একক। টাকার minor unit পয়সা, ডলারের cent।'
    more: |
      ১২৫০ টাকা ৫০ পয়সা রাখা হয় `125050` পয়সা হিসেবে। এভাবে সব যোগ-বিয়োগ পূর্ণসংখ্যার হিসাব, তাই কোনো আনুমানিক ভুল ঢোকে না।
    ref: poisa-and-currency
  - q: 'সব currency কি দুই দশমিক ঘরের?'
    a: 'না। JPY-র ০ ঘর, BDT ও USD-র ২ ঘর, KWD-র ৩ ঘর। ঘর সংখ্যা ISO 4217 থেকে আসে।'
    more: |
      "সবসময় ১০০ দিয়ে গুণ করুন" ধরনের কোড ইয়েনে ১০০ গুণ ভুল অঙ্ক বানায়। তাই ঘর সংখ্যা hardcode না করে `brick/money`-র মতো library-র currency তালিকা ব্যবহার করুন।
    ref: poisa-and-currency
  - q: 'টাকার অঙ্কের সাথে currency আলাদা না রাখলে কী ঝুঁকি?'
    a: 'অঙ্কটা অর্থহীন হয়ে যায়: `500` টাকা না ডলার, বোঝা যায় না। ভিন্ন currency ভুল করে যোগ হয়ে যেতে পারে।'
    more: |
      Money value object অঙ্ক আর currency একসাথে রাখে, আর যোগ-বিয়োগের আগে currency মেলায়। BDT + USD করতে গেলে exception আসে, চুপচাপ ভুল যোগফল তৈরি হয় না।
    ref: money-value-object
  - q: 'Money class-কে `readonly` বানানো হয় কেন?'
    a: 'বানানোর পর অঙ্ক বদলানো যায় না। যোগ-বিয়োগ নতুন Money ফেরায়, তাই কোথাও লুকিয়ে অঙ্ক বদলায় না।'
    more: |
      Mutable Money একটা জায়গায় বদলালে অন্য জায়গার একই object-ও বদলে যায়। Immutable value object এই ঝামেলা তৈরিই হতে দেয় না।
    ref: money-value-object
  - q: 'PHP-তে integer যোগ উপচে পড়লে কী হয়?'
    a: 'PHP নিঃশব্দে সেটাকে float বানিয়ে ফেলে। তাই `is_int($sum)` দিয়ে যাচাই করে exception দিতে হয়।'
    more: |
      `PHP_INT_MAX + 1` একটা float ফেরায়, কোনো error ছাড়াই। টাকার হিসাবে এই নীরব বদল সবচেয়ে বিপজ্জনক, তাই Money-র যোগ-বিয়োগে overflow check রাখা হয়।
    ref: money-value-object
  - q: '১০০ টাকা তিনজনে ভাগ করার সঠিক উপায় কী?'
    a: 'allocate: সবাইকে মেঝে অনুযায়ী ভাগ দিয়ে ভাগশেষ ১ পয়সা করে কারো ঘরে দিন। ফল 3334, 3333, 3333 পয়সা।'
    more: |
      সবাইকে round করা অঙ্ক দিলে যোগফল মূল অঙ্কের সাথে মেলে না। allocate-এর নিয়ম: ভাগের যোগফল সবসময় মূল অঙ্কের সমান।
    ref: remainder-never-lost
  - q: 'টাকার API-তে অঙ্ক JSON number (`12.5`) পাঠালে কী সমস্যা?'
    a: 'JavaScript সংখ্যাকে float করে ফেলে, আর ভুল ঢোকে। পাঠান integer minor unit আর currency আলাদা field-এ।'
    more: |
      যেমন `{"amount": 125050, "currency": "BDT"}`। Client এখানে শুধু integer দেখায়, আর দেখানোর সময় ভাগ করে ১২৫০.৫০ বানায়।
    ref: remainder-never-lost

  - q: 'কখন সাধারণ integer minor unit যথেষ্ট নয়?'
    a: 'দামে minor unit-এর ভগ্নাংশ থাকলে, যেমন SMS প্রতি ০.৪ পয়সা। আরও ছোট একক (টাকার দশ-লক্ষ ভাগ) বা decimal টাইপ রাখুন, আর শেষে একবার round করুন।'
    more: |
      একটা টেলিকম লাখো SMS-এর বিল করে ০.৪ পয়সা দরে। প্রতিটা SMS পূর্ণ পয়সায় round করলে মোট অঙ্ক বড় রকম ভুল হয়। তাই দর রাখা হয় ছোট এককে, আর শুধু চূড়ান্ত বিল পয়সায় round হয়।
    ref: poisa-and-currency

quiz:
  - q: 'নিচের কোডে কী সমস্যা?'
    lang: php
    code: |
      $price = 8.20;
      $qty = 3;
      $total = $price * $qty;
      if ($total == 24.60) {
          $order->markPaid();
      }
    hint: 'float গুণ করলে ঠিক ২৪.৬০ আসবে কি?'
    options:
      - text: 'float গুণফল ২৪.৬০-র সমান নাও হতে পারে, তাই `==` ভুলভাবে false দিতে পারে'
        correct: true
        why: 'আনুমানিক অঙ্ক হুবহু সমান হওয়ার গ্যারান্টি নেই। এখানে 8.20 × 3 আসলে 24.599999999999998। integer পয়সায় (820 × 3 = 2460) এই সমস্যা হয় না।'
      - text: '`$qty` int না হয়ে float হওয়া উচিত'
        correct: false
        why: 'উল্টো। integer ঠিক আছে; সমস্যা দামটা float হওয়ায়।'
      - text: '`markPaid()` transaction-এর বাইরে'
        correct: false
        why: 'transaction ভিন্ন প্রসঙ্গ; এই কোডের সমস্যা float-এর তুলনা।'
      - text: 'সমস্যা নেই, ২৪.৬০ ঠিকই মিলবে'
        correct: false
        why: 'এটা ভরসার যোগ্য নয়; এই ধরনের কোড কখনো কখনো ভাঙে, আর ভাঙলে কোনো error ছাড়াই।'
    ref: float-trap
  - q: '১২৫০ টাকা ৫০ পয়সা ডেটাবেসে কীভাবে রাখা উচিত?'
    hint: 'minor unit আর currency দুটোই লাগবে।'
    options:
      - text: '`1250.5` একটা DOUBLE কলামে'
        correct: false
        why: 'DOUBLE একটা float; আনুমানিক অঙ্ক ধরে।'
      - text: '`125050` পয়সা BIGINT কলামে, আর `BDT` আলাদা কলামে'
        correct: true
        why: 'integer minor unit হুবহু, আর currency সাথে থাকায় অঙ্কের মানে পরিষ্কার।'
      - text: '`"১২৫০.৫০"` VARCHAR কলামে'
        correct: false
        why: 'string-এ যোগ-বিয়োগ হয় না, আর ফরম্যাট ভাঙার ঝুঁকি থাকে।'
      - text: '`1250` টাকা আর `50` পয়সা আলাদা দুই কলামে'
        correct: false
        why: 'যোগ করার সময় পয়সা ১০০ ছাড়ালে ক্যারি নিজে সামলাতে হয়; এক integer অনেক সরল।'
    ref: poisa-and-currency
  - q: 'নিচের Money কোডে কোনটা সবচেয়ে বড় সমস্যা?'
    lang: php
    code: |
      public function add(Money $other): Money
      {
          return new Money($this->amount + $other->amount, $this->currency);
      }
    hint: 'BDT-র Money-তে USD-র Money যোগ করলে কী হবে?'
    options:
      - text: 'দুই Money-র currency না মিলিয়েই যোগ করা হচ্ছে'
        correct: true
        why: 'BDT ১০০ + USD ৫ চুপচাপ BDT ১০৫ হয়ে যাবে। যোগের আগে currency মিলিয়ে exception দিতে হয়।'
      - text: 'মেথডটা `public` হওয়া উচিত নয়'
        correct: false
        why: 'public যোগ ঠিক আছে; সমস্যা currency-র যাচাইয়ে।'
      - text: 'নতুন Money বানানো হচ্ছে, এটা ভুল'
        correct: false
        why: 'নতুন object ফেরানোই immutable value object-এর ঠিক নিয়ম।'
      - text: 'amount `int` না হয়ে `string` হওয়া উচিত'
        correct: false
        why: 'integer-ই সঠিক পছন্দ; string-এ যোগ করতে আবার কাস্ট লাগে।'
    ref: money-value-object
  - q: 'কোনগুলো Money-র সঠিক নকশার অংশ?'
    hint: 'অঙ্ক, currency আর overflow নিয়ে ভাবুন।'
    options:
      - text: 'অঙ্ক integer minor unit হিসেবে রাখা'
        correct: true
        why: 'পূর্ণসংখ্যার হিসাবে আনুমানিক ভুল নেই।'
      - text: 'অঙ্কের সাথে currency একই object-এ রাখা'
        correct: true
        why: 'দুটো আলাদা থাকলে ভুল জোড়া লেগে যেতে পারে; একসাথে থাকলে যোগের আগে মেলানো যায়।'
      - text: 'যোগের পর `is_int` দিয়ে overflow ধরা'
        correct: true
        why: 'PHP int উপচালে float বানায়; এই চেক নীরব ভুল আটকায়।'
      - text: 'সুবিধার জন্য `float $amount` রাখা'
        correct: false
        why: 'float-ই মূল সমস্যা; সুবিধা নেই, শুধু লুকানো ভুল আছে।'
    ref: money-value-object
  - q: '১০০ টাকা (10000 পয়সা) ৩ জনের মধ্যে ১:১:১ অনুপাতে allocate করা হলো। সঠিক ফল কোনটা?'
    hint: 'ফলের যোগফল ঠিক 10000 হতে হবে।'
    options:
      - text: '3333, 3333, 3333'
        correct: false
        why: 'যোগফল 9999; ১ পয়সা হারিয়েছে।'
      - text: '3334, 3334, 3334'
        correct: false
        why: 'যোগফল 10002; ২ পয়সা বাড়তি তৈরি হয়েছে।'
      - text: '3334, 3333, 3333'
        correct: true
        why: 'ভাগশেষ ১ পয়সা একজনের ঘরে গেছে, যোগফল ঠিক 10000।'
      - text: '3333, 3333, 3333 আর ১ পয়সা "অন্য খাতে" ফেলে রাখা'
        correct: false
        why: 'লেজারে এমন ঘর নেই; পরে হিসাব মিলবে না। ভাগশেষ কারো ঘরেই যেতে হয়।'
    ref: remainder-never-lost
