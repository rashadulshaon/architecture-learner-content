slides:
  - slug: float-trap
    title: 'দেখতে ঠিক, ভেতরে ভুল: float-এ টাকা'
    kind: story
    tldr: 'float দশমিক অঙ্ক হুবহু ধরে রাখতে পারে না; ছোট ভুল তুলনা উল্টে দেয় আর পয়সা কেটে নেয়, শেষে হিসাব মেলে না — তাই টাকা কখনো float-এ নয়।'
    keywords: ['float', 'floating point', 'precision', '0.1 + 0.2', 'টাকার হিসাব', 'ভুল যোগফল']
    blocks:
      - type: text
        body: |
          মুদি দোকানের ক্যালকুলেটরে ০.১ + ০.২ চাপলে ০.৩ দেখায়, কিন্তু আপনার PHP কোড ভেতরে ভেতরে একটু অন্য অঙ্ক রাখে। কম্পিউটার দশমিক সংখ্যা **binary**-তে রাখে, আর ০.১ binary-তে কখনো শেষ হয় না — যেমন ১ ÷ ৩ দশমিকে শেষ হয় না। তাই `float` সবসময় খুব কাছের একটা অঙ্ক রাখে, হুবহু অঙ্কটা নয়।
      - type: code
        lang: php
        file: 'float-এ যোগ (ভুল পথ)'
        variant: bad
        code: |
          $total = 0.10 + 0.20;           // ১০ পয়সা + ২০ পয়সা

          var_dump($total == 0.30);       // bool(false)
          echo $total;                    // 0.3 — দেখতে ঠিক
          printf('%.20f', $total);        // 0.30000000000000004441
        marks:
          - {line: 3, tip: 'যোগফল ০.৩০-র সমান নয়। `if ($paid == $due)` ধরনের তুলনা তাই কখনো কখনো ভুল সিদ্ধান্ত দেয়।'}
          - {line: 5, tip: 'আসল জমা অঙ্কটা এটা। echo ছোট করে দেখায় বলে ভুলটা চোখে পড়ে না।'}
      - type: code
        lang: php
        file: 'পূর্ণ পয়সায় যোগ (ঠিক পথ)'
        variant: good
        code: |
          $total = 10 + 20;               // ১০ পয়সা + ২০ পয়সা, পূর্ণসংখ্যা

          var_dump($total === 30);        // bool(true), প্রতিবার
        marks:
          - {line: 3, tip: 'পূর্ণসংখ্যা হুবহু যোগ হয়। কিছু round করতে হয় না, তাই গরমিলের জায়গাই নেই।'}
      - type: visual
        kind: steps
        caption: 'ছোট ভুল কীভাবে বড় অসংগতি হয়ে ওঠে'
        steps:
          - {title: '১. float-এ যোগ', body: '০.১০ + ০.২০ দেয় ০.30000000000000004', tip: 'binary-তে ০.১ আর ০.২ দুটোই আনুমানিক, তাই যোগফলও আনুমানিক।'}
          - {title: '২. তুলনা ভাঙে', body: '`==` দিয়ে ০.৩০-র সাথে মেলালে false আসে', tip: 'পাওনা আর পরিশোধ সমান কি না — এই প্রশ্নের উত্তরই ভুল আসতে পারে।'}
          - {title: '৩. পয়সা হারায়', body: 'ছোট ভুল পুরো পয়সা কাটে বা উল্টে দেয়', tip: 'এক-একটা ১০ পয়সা দশবার যোগ করলে ১ না হয়ে হয় 0.9999999999999999। আর `(int)(0.57 * 100)` দেয় 56, 57 নয়: এক পয়সা উধাও।'}
          - {title: '৪. হিসাব মেলে না', body: 'দিনশেষে ব্যাংক আর লেজারের অঙ্ক আলাদা', tip: 'কোনো exception নেই, কোনো log নেই — শুধু মেলে না। এই ভুল খুঁজে বের করা সবচেয়ে কঠিন।'}
      - type: quote
        body: 'টাকা কখনো float নয়। কখনো না।'
    aside:
      - type: story
        title: 'এক পয়সার খোঁজে তিন দিন'
        body: |
          এক ই-কমার্স কোম্পানির দিনশেষের রিপোর্টে ব্যাংকের অঙ্কের চেয়ে ৩ টাকা ১২ পয়সা কম আসছিল। তিন দিন খুঁজে বের হলো, ভ্যাট হিসাবের একটা float গুণ। কোথাও exception ছিল না।
      - type: terms
        items:
          - {term: 'float', meaning: 'binary-তে রাখা আনুমানিক দশমিক সংখ্যা; হুবহু টাকার অঙ্ক ধরে না।'}
    check:
      q: '০.১০ + ০.২০ প্রিন্ট করলে ০.৩ দেখায়, তবু একে ভরসা করা যায় না কেন?'
      a: 'প্রিন্ট ছোট করে দেখায়। আসলে জমা থাকে ০.30000000000000004..., তাই `==` তুলনা ভাঙে আর লাখো লেনদেনে ভুল জমে।'

  - slug: poisa-and-currency
    title: 'পয়সা গুনুন, আর currency সাথে লিখুন'
    kind: concept
    tldr: 'টাকা রাখুন ছোটতম এককে (minor unit) integer হিসেবে, আর currency কোড সবসময় অঙ্কের সাথে।'
    keywords: ['minor unit', 'integer', 'currency', 'ISO 4217', 'পয়সা', 'cents']
    blocks:
      - type: metaphor
        icon: wallet
        title: 'ক্যাশ কাউন্টারের গোনা'
        body: |
          ক্যাশিয়ার "আধা টাকা" গোনেন না; গোনেন ৫০টা এক-পয়সা, মানে পূর্ণসংখ্যা। আর টাকার ড্রয়ার আর ডলারের ড্রয়ার আলাদা — একটার নোট অন্যটায় ঢোকালে হিসাব গোলমাল হয়। **Minor unit** হলো সেই ছোটতম একক (পয়সা, cent), আর currency হলো ড্রয়ারের নাম।
      - type: visual
        kind: table
        caption: 'দেখানো অঙ্ক আর ডেটাবেসে জমা integer'
        headers: ['দেখানো অঙ্ক', 'Currency', 'জমা integer']
        rows:
          - cells: ['১২৫০.৫০ টাকা', 'BDT (২ ঘর)', '125050']
            tip: 'টাকার ১ পয়সা হলো minor unit। ১২৫০ টাকা ৫০ পয়সা মানে ১২৫০৫০ পয়সা।'
          - cells: ['৫.৯৯ ডলার', 'USD (২ ঘর)', '599']
            tip: 'ডলারের minor unit cent। ৫ ডলার ৯৯ cent মানে ৫৯৯ cent।'
          - cells: ['৫০০ ইয়েন', 'JPY (০ ঘর)', '500']
            tip: 'ইয়েনের কোনো ভগ্নাংশ নেই। তাই সব currency-তে "দুই ঘর" ধরে নেওয়া ভুল।'
          - cells: ['১.২৩৪ দিনার', 'KWD (৩ ঘর)', '1234']
            tip: 'কুয়েতি দিনার তিন দশমিকের। কত ঘর, তা ISO 4217 তালিকা বলে দেয়।'
      - type: quote
        body: 'অঙ্কটা integer minor unit, সাথে currency। এই দুইটা কখনো আলাদা হবে না।'
    aside:
      - type: problem
        body: 'float-এর ভুল আর "কোন currency?" প্রশ্ন — দুটোই এক বদলে মেটে: integer আর currency একসাথে একটা Money-তে।'
      - type: terms
        items:
          - {term: 'Minor unit', meaning: 'currency-র ছোটতম একক; টাকার পয়সা, ডলারের cent।'}
          - {term: 'ISO 4217', meaning: 'currency-র আন্তর্জাতিক তালিকা: BDT, USD, JPY ইত্যাদি, আর কত দশমিক ঘর।'}
      - type: tips
        items:
          - 'ঘর সংখ্যা নিজে হার্ডকোড করবেন না; তালিকাটা library থেকে নিন (যেমন `brick/money` বা `moneyphp/money`)।'
          - 'পূর্ণ minor unit-এ SMS প্রতি ০.৪ পয়সা ধরা যায় না। আরও ছোট একক রাখুন (যেমন টাকার দশ-লক্ষ ভাগ), আর চূড়ান্ত বিলে একবারই পয়সায় round করুন।'
    check:
      q: '৫০০ ইয়েন আর ৫০০ টাকা — দুটোকেই ডেটাবেসে `500` রাখলে কী হারায়?'
      a: 'Currency হারায়। `500` একা বলে না এটা ইয়েন না টাকা। আর টাকার ৫০০ আসলে ৫০০০০ পয়সা, তাই ঘর সংখ্যাও জানতে হবে।'

  - slug: money-value-object
    title: 'Money value object আর Doctrine'
    kind: howto
    tldr: 'একটা immutable Money class integer আর currency ধরে; যোগের আগে currency মেলায়, overflow ধরে; Doctrine-এ দুটো কলামে জমা হয়।'
    keywords: ['Money value object', 'readonly class', 'Doctrine', 'BIGINT', 'immutable', 'ভ্যালু অবজেক্ট']
    blocks:
      - type: text
        body: |
          অঙ্ক আর currency-কে একটা **value object**-এ বেঁধে ফেলুন: তৈরি হওয়ার পর বদলায় না (`readonly`), আর ভুল কাজ করতেই দেয় না। BDT আর USD যোগ করতে গেলে সে exception দেয়, চুপচাপ ভুল অঙ্ক বানায় না।
      - type: code
        lang: php
        file: 'src/Money/Money.php'
        variant: good
        code: |
          final readonly class Money
          {
              private function __construct(
                  public int $amount,        // minor unit: পয়সা
                  public string $currency,   // 'BDT'
              ) {}

              public static function of(int $minor, string $currency): self
              {
                  return new self($minor, strtoupper($currency));
              }

              public function add(self $other): self
              {
                  $this->assertSameCurrency($other);
                  $sum = $this->amount + $other->amount;
                  if (!is_int($sum)) {            // PHP overflow-এ float বানায়
                      throw new \OverflowException('Money overflow');
                  }

                  return new self($sum, $this->currency);
              }

              private function assertSameCurrency(self $other): void
              {
                  if ($this->currency !== $other->currency) {
                      throw new \DomainException("{$this->currency} আর {$other->currency} যোগ হয় না");
                  }
              }
          }
        marks:
          - {line: 1, tip: '`readonly` মানে একবার বানালে অঙ্ক আর বদলায় না। যোগ করলে নতুন Money ফেরে।'}
          - {line: 17, tip: 'PHP-তে int উপচে পড়লে নিঃশব্দে float হয়ে যায়। এই এক লাইন সেটা ধরে ফেলে।'}
          - {line: 26, tip: 'ড্রয়ার মেলানো: ভিন্ন currency যোগ করলে exception, নীরব ভুল নয়।'}
      - type: code
        lang: php
        file: 'src/Entity/Wallet.php'
        variant: good
        code: |
          #[ORM\Entity]
          class Wallet
          {
              #[ORM\Id, ORM\GeneratedValue, ORM\Column]
              private ?int $id = null;

              #[ORM\Column(type: Types::BIGINT)]
              private int $balanceMinor = 0;      // পয়সায়, কখনো float নয়

              #[ORM\Column(length: 3)]
              private string $currency = 'BDT';

              public function balance(): Money
              {
                  return Money::of($this->balanceMinor, $this->currency);
              }
          }
        marks:
          - {line: 7, tip: 'কলাম BIGINT, কারণ ৩২ বিটের INT ধরে সর্বোচ্চ প্রায় ২১৪ কোটি পয়সা, মানে মাত্র ২ কোটি ১৫ লক্ষ টাকা। বড় ওয়ালেট বা কোম্পানির খাতায় এটা পেরিয়ে যায়।'}
          - {line: 15, tip: 'বাইরে থেকে সবাই Money দেখে; দুটো কলামের কথা entity-র ভেতরেই থাকে।'}
    aside:
      - type: tips
        items:
          - 'DBAL 4-এ BIGINT কলাম `int` হয়ে ফেরে; পুরনো DBAL-এ string আসে, তখন `(int)` কাস্ট লাগে।'
          - 'DB-তে `DECIMAL`-ও চলে, কিন্তু PHP-তে সেটা string হয়ে আসে; integer minor unit সবচেয়ে সরল।'
      - type: remember
        body: 'Money immutable: যোগ-বিয়োগ নতুন Money ফেরায়।'
    check:
      q: 'Money-তে `$amount` আর `$currency` দুটো public property রেখেও class-টা নিরাপদ কেন?'
      a: 'class `readonly`, তাই বানানোর পর কেউ বদলাতে পারে না। আর যোগ-বিয়োগের পথ currency মেলায়, তাই ভুল অঙ্ক তৈরিই হয় না।'

  - slug: remainder-never-lost
    title: 'ভাগ করলে এক পয়সাও হারানো চলবে না'
    kind: pitfall
    tldr: 'টাকা ভাগ করলে ভাগশেষ থাকে; সবাইকে একই অঙ্ক round করে দিলে পয়সা হারায়। allocate করে ভাগশেষ কারো ঘরে ফেলতে হয়।'
    keywords: ['allocate', 'rounding', 'remainder', 'half-up', 'ভাগশেষ', 'টাকা ভাগ']
    blocks:
      - type: text
        body: |
          বিয়েবাড়ির ১০০ টাকা তিন ভাইয়ের মধ্যে ভাগ হবে। ১০০ ÷ ৩ = ৩৩.৩৩৩... — প্রত্যেককে ৩৩.৩৩ দিলে মোট হয় ৯৯.৯৯, ১ পয়সা কেউ পেল না। একে একে round করলে পয়সা হারায়, বা তৈরি হয়: ছয়জনে ভাগ করলে প্রত্যেকে ১৬৬৭ পয়সা, মোট ১০০০২। সমাধান: আগে সবাইকে মেঝে (floor) অনুযায়ী ভাগ দিন, তারপর **ভাগশেষ** এক এক পয়সা করে কারো ঘরে বিলিয়ে দিন।
      - type: code
        lang: php
        file: 'ভুল ভাগ'
        variant: bad
        code: |
          $share = (int) round(10000 / 3);          // 3333 পয়সা
          $parts = [$share, $share, $share];        // মোট 9999 — ১ পয়সা উধাও
        marks:
          - {line: 2, tip: '১০০ টাকা ভাগ করে আমরা ৯৯.৯৯ ফিরে পেলাম। লেজারে এই এক পয়সা কোথাও লেখা নেই।'}
      - type: code
        lang: php
        file: 'src/Money/Money.php'
        variant: good
        code: |
          /** @return list<self> */
          public function allocate(int ...$ratios): array
          {
              if ($this->amount < 0 || array_sum($ratios) <= 0) {
                  throw new \DomainException('allocate: ভুল অঙ্ক বা অনুপাত');
              }

              $total = array_sum($ratios);
              $shares = array_map(fn (int $r) => intdiv($this->amount * $r, $total), $ratios);
              $remainder = $this->amount - array_sum($shares);

              for ($i = 0; $remainder > 0; $i++, $remainder--) {
                  $shares[$i]++;                      // ভাগশেষ এক পয়সা করে
              }

              return array_map(fn (int $s) => new self($s, $this->currency), $shares);
          }
        marks:
          - {line: 9, tip: 'intdiv ছোট দিকে কাটে (মেঝে), তাই কেউ বেশি পায় না। কাটা অংশটাই ভাগশেষ।'}
          - {line: 12, tip: 'ভাগশেষ সবসময় অনুপাতের সংখ্যার চেয়ে কম, তাই এক পয়সা করে বিলালেই যথেষ্ট।'}
      - type: visual
        kind: bars
        caption: '১০০ টাকা (10000 পয়সা) তিন ভাগে allocate(1, 1, 1)'
        items:
