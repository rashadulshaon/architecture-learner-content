          - {label: 'ভাই ২', value: 3333, display: '3333 পয়সা', tone: good, tip: 'মেঝে অনুযায়ী ভাগ।'}
          - {label: 'ভাই ৩', value: 3333, display: '3333 পয়সা', tone: good, tip: 'মেঝে অনুযায়ী ভাগ। তিনজনের যোগফল ঠিক 10000।'}
      - type: quote
