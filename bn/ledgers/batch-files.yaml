flashcards:
  - q: 'Batch file ইন্টিগ্রেশনে ফাইল পড়ার আগে কোন চারটা ফটক পার করা উচিত?'
    a: 'পুরো এসেছে কি না, checksum মেলে কি না, control total মেলে কি না, আর এই ফাইল আগেই লোড হয়েছে কি না।'
    more: |
      চারটার একটাও ফাঁক থাকলে অর্ধেক লোড, নষ্ট ফাইল বা ডবল লোডের ঝুঁকি থাকে। তাই এগুলো ফাইলের একটা সারি ছোঁয়ার আগেই যাচাই হয়।
    ref: file-gates
  - q: 'Checksum কী কাজে লাগে?'
    a: 'ফাইল পথে বদলেছে বা নষ্ট হয়েছে কি না ধরতে: নিজের SHA-256 আর দাতার পাঠানোটা মেলাও।'
    more: |
      একটা বিটও বদলালে hash সম্পূর্ণ আলাদা হয়। PHP-তে `hash_file('sha256', $path)` আর `hash_equals` দিয়ে তুলনা করা হয়।
    ref: file-gates
  - q: 'Control total কী?'
    a: 'ফাইলের trailer-এ লেখা সারির সংখ্যা আর মোট অঙ্ক। আমরা নিজে গুনে-যোগ করে মেলাই।'
    more: |
      মিললে ধরা যায় ফাইল কাটা পড়েনি বা সারি হারায়নি। না মিললে আংশিক লোড নয়; পুরো ফাইল ফেরত দিয়ে নতুন ফাইল চাওয়া হয়।
    ref: file-gates
  - q: 'SFTP-তে অর্ধেক আপলোড হওয়া ফাইল পড়া ঠেকাতে কী করা হয়?'
    a: 'দাতা ফাইল `.tmp` নামে তুলে শেষে rename করে (বা `.done` মার্কার রাখে)। আমরা শুধু শেষ নামের ফাইল তুলি।'
    more: |
      Rename একটা মুহূর্তে হয়, তাই পুরো ফাইলই দেখা যায় অথবা কিছুই না। এই চুক্তি দাতার সাথে আগেই ঠিক করে নিতে হয়।
    ref: file-gates
  - q: 'একই ফাইল দুইবার এলে ডবল লোড কীভাবে ঠেকানো হয়?'
    a: '`(provider, sha256)`-এ UNIQUE রেখে ফাইল নিবন্ধন করা। দ্বিতীয়বার INSERT ব্যর্থ হয়, আর ফাইল বাদ যায়।'
    more: |
      সারি পর্যায়ে `(file_id, line_no)` অনন্য রাখলে ফাইল মাঝপথে ক্র্যাশ করে আবার চললেও কোনো সারি দুইবার লোড হয় না।
    ref: ingest-command
  - q: 'Fixed-width ফাইল আর CSV-র পার্থক্য কী?'
    a: 'CSV-তে field আলাদা করে একটা বিভাজক (`,` বা `|`)। Fixed-width-এ প্রতিটা field-এর অক্ষর-ঘর নির্দিষ্ট।'
    more: |
      Fixed-width-এ spec-এ লেখা শুরু আর দৈর্ঘ্য ধরে `substr` করা হয়। encoding আগে UTF-8 না করলে অক্ষর-ঘর গোলমাল হয়। অঙ্ক সবসময় integer minor unit-এ বদলে নাও।
    ref: ingest-command
  - q: 'ফাইলের একটা সারি খারাপ হলে কী করা উচিত?'
    a: 'চুপচাপ বাদ নয়। সারি, নম্বর আর কারণসহ quarantine টেবিলে রাখো; বাকি ফাইল চলুক; ঠিক হলে শুধু সেই সারি আবার চালাও।'
    more: |
      quarantine-এ কত সারি গেল গুনে alert দাও। হঠাৎ অনেক হলে বুঝতে হবে সমস্যা ফাইলে নয়, আমাদের parser-এ।
    ref: quarantine-bad-rows

quiz:
  - q: 'রাত ২টায় cron ফাইল পড়ল, কিন্তু ব্যাংক তখনও আপলোড করছিল। সবচেয়ে ভালো প্রতিরোধ কোনটা?'
    hint: 'ফাইল "সম্পূর্ণ" হওয়ার চিহ্ন কে তৈরি করবে?'
    options:
      - text: 'দাতা ফাইল `.tmp` নামে তুলে শেষে rename করবে; আমরা শুধু শেষ নামের ফাইল পড়ব'
        correct: true
        why: 'rename একটা মুহূর্তের কাজ; ফাইল পুরো দেখা যায় অথবা একদমই না।'
      - text: 'cron-কে আরও আগে (রাত ১টায়) চালানো'
        correct: false
        why: 'সময় বদলালে আপলোডের সাথে ঘটনাচক্রে মিলতেও পারে; নিশ্চয়তা আসে না।'
      - text: 'ফাইলের আকার দেখে যথেষ্ট বড় মনে হলে পড়া'
        correct: false
        why: 'আকার দিয়ে সম্পূর্ণতা বোঝা যায় না; অর্ধেক ফাইলও বড় হতে পারে।'
      - text: 'cron-এ `sleep(60)` দিয়ে অপেক্ষা'
        correct: false
        why: 'অনুমান; ধীর আপলোডে ৬০ সেকেন্ডও যথেষ্ট নাও হতে পারে।'
    ref: file-gates
  - q: 'Trailer বলছে ২টা সারি, মোট ১৭৫০৫০ পয়সা। আমাদের গোনা ২টা সারি, মোট ১৭৫১৫০। কী করা উচিত?'
    hint: 'কোনো একটা সংখ্যা মেলেনি।'
    options:
      - text: 'পুরো ফাইল ফেরত দিয়ে নতুন ফাইল চাওয়া'
        correct: true
        why: 'অঙ্ক মেলেনি; ফাইল বদলেছে বা নষ্ট হয়েছে সন্দেহ। কোন সারি ঠিক তা না জেনে লোড করা ঝুঁকির।'
      - text: 'trailer-এর সংখ্যা বদলে আমাদেরটা বসানো'
        correct: false
        why: 'এতে যাচাইয়ের উদ্দেশ্যই নষ্ট হয়; সমস্যা চাপা পড়ে।'
      - text: 'সারি দুটো লোড করে পরে দেখা'
        correct: false
        why: 'টাকা একবার জমা হয়ে গেলে ফেরানো কঠিন। আগে যাচাই।'
      - text: '১০০ পয়সার পার্থক্য ছোট, উপেক্ষা করা'
        correct: false
        why: 'ছোট পার্থক্যও ভুল সারির লক্ষণ; উপেক্ষা করলে হিসাব ক্রমশ আলাদা হয়।'
    ref: file-gates
  - q: 'নিচের কোডে কী সমস্যা?'
    lang: php
    code: |
      foreach ($file->rows as $row) {
          try {
              $this->wallet->credit($row->userId, $row->amountMinor);
          } catch (\Throwable) {
              continue;
          }
      }
    hint: 'বাদ পড়া সারির খোঁজ কে রাখে?'
    options:
      - text: 'ব্যর্থ সারি নিঃশব্দে হারিয়ে যায়, আর ক্র্যাশের পর আবার চালালে সফল সারিগুলো ডবল হয়'
        correct: true
        why: 'দুটো ঘাটতি: কোনো quarantine নেই, আর সারি পর্যায়ে অনন্যতা নেই।'
      - text: '`foreach`-এর বদলে `while` ব্যবহার করা উচিত'
        correct: false
        why: 'loop-এর ধরন এখানে সমস্যা নয়।'
      - text: '`$row->amountMinor` ঋণাত্মক হতে পারে না'
        correct: false
        why: 'কোডে এ নিয়ে কিছু বলা নেই; মূল সমস্যা error আর আবার-চালানো।'
      - text: '`\Throwable` ধরা যাবে না, শুধু `\Exception`'
        correct: false
        why: 'ধরার ধরন নয়, চুপচাপ বাদ দেওয়াটাই সমস্যা।'
    ref: quarantine-bad-rows
  - q: 'কোনগুলো ফাইল ইন্টিগ্রেশনে নিরাপদে আবার-চালানোর (idempotent) সাহায্য করে?'
    hint: 'ফাইল স্তর আর সারি স্তর দুটোই ভাবো।'
    options:
      - text: '`(provider, sha256)`-এ UNIQUE constraint'
        correct: true
        why: 'একই ফাইল দ্বিতীয়বার এলে নিবন্ধনই হয় না।'
      - text: 'ফলাফল টেবিলে `(file_id, line_no)` UNIQUE'
        correct: true
        why: 'ক্র্যাশের পর আবার চললে একই সারি দ্বিতীয়বার লোড হয় না।'
      - text: 'প্রতিটা সারি নিজের ছোট transaction-এ লোড করা'
        correct: true
        why: 'একটা সারি ব্যর্থ হলে বাকিদের লোড বাতিল হয় না; আর কোন সারি হয়েছে স্পষ্ট থাকে।'
      - text: 'ফাইলের নাম একই থাকলে ধরে নেওয়া একই ফাইল'
        correct: false
        why: 'নাম একই কিন্তু বিষয়বস্তু আলাদা হতে পারে। hash-ই নির্ভরযোগ্য।'
    ref: ingest-command
  - q: 'একটা ফাইলে ১০,০০০ সারির মধ্যে ১২টা সারির তারিখ ভুল format-এ। অন্য সারিগুলো স্বাধীন লেনদেন। সবচেয়ে ভালো আচরণ?'
    hint: 'সারিগুলো একে অপরের ওপর নির্ভর করে না।'
    options:
      - text: 'বাকি ৯,৯৮৮টা লোড করে ১২টা কারণসহ quarantine-এ রাখা এবং alert দেওয়া'
        correct: true
        why: 'স্বাধীন সারি হলে একটা পচা আমের জন্য ঝুড়ি ফেলা হয় না; আর ১২টার খোঁজ থাকে।'
      - text: 'পুরো ফাইল প্রত্যাখ্যান করে দাতাকে ফেরত দেওয়া'
        correct: false
        why: 'সারিগুলো স্বাধীন হলে এটা অতিরিক্ত কড়া; ৯,৯৮৮ জন অকারণে টাকা পাবে না।'
      - text: 'ভুল ১২টা চুপচাপ বাদ দেওয়া'
        correct: false
        why: 'কেউ কখনো জানবে না তাদের টাকা কোথায় গেল।'
      - text: 'তারিখ অনুমান করে ঠিক করে ১২টাও লোড করা'
        correct: false
        why: 'অনুমান করা ভুল তারিখে টাকার লেনদেন বসানো বিপজ্জনক।'
    ref: quarantine-bad-rows
