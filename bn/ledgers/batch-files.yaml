  - slug: file-gates
    title: 'প্যাকিং স্লিপ: checksum আর control total'
    kind: concept
    tldr: 'ফাইল পড়ার আগে চারটা ফটক: পুরো এসেছে কি না, checksum মেলে কি না, control total মেলে কি না, আগে এসেছে কি না।'
    keywords: ['checksum', 'control total', 'trailer', 'SHA-256', 'atomic arrival', 'প্যাকিং স্লিপ']
    blocks:
      - type: metaphor
        icon: box
        title: 'পার্সেলের প্যাকিং স্লিপ'
        body: |
          কুরিয়ারের বাক্সের গায়ে স্লিপ থাকে: "৩টা জিনিস, মোট দাম ১৭৫০ টাকা, সিল নম্বর ৪৫৭"। বাক্স খুলে গুনে-যোগ করে মেলানো হয়; না মিললে বাক্স ফেরত যায়। ফাইলের শেষে থাকা **trailer** লাইনই সেই স্লিপ: **control total** (সারির সংখ্যা আর মোট অঙ্ক), আর **checksum** হলো সিল — ফাইল পথে বদলেছে কি না তা ধরে।
      - type: code
        lang: text
        file: 'bank_payout_20261120.txt'
        variant: neutral
        code: |
          H|ACME|2026-11-20|v1
          D|0001|rahim|125050|BDT
          D|0002|karim|50000|BDT
          T|2|175050
        marks:
          - {line: 1, tip: 'header: কে পাঠাল, কোন তারিখ, কোন format-এর সংস্করণ।'}
          - {line: 4, tip: 'trailer: সারি ২টা, মোট ১৭৫০৫০ পয়সা। এই দুটো সংখ্যা আমরা নিজে গুনে মেলাব।'}
      - type: visual
        kind: steps
        caption: 'ফাইল লোডের আগে চার ফটক'
        steps:
          - {title: '১. পুরো এসেছে?', body: 'আপলোড শেষের চিহ্ন (rename বা .done) আছে কি', tip: 'দাতা ফাইল .tmp নামে তুলে শেষে নাম বদলায়। আমরা শুধু শেষ নামের ফাইল তুলি।'}
          - {title: '২. checksum মেলে?', body: 'নিজের SHA-256 আর পাঠানোটা এক কি না', tip: 'পথে একটা বিটও বদলালে hash আলাদা হয়, ফাইল নষ্ট ধরা পড়ে।'}
          - {title: '৩. control total মেলে?', body: 'নিজে গোনা সারি ও যোগফল = trailer-এর সংখ্যা', tip: 'ফাইল কাটা পড়েছে বা সারি হারিয়েছে কি না, এটাই বলে দেয়।'}
          - {title: '৪. আগে এসেছে?', body: 'এই hash আগে পুরো লোড হয়েছে কি না', tip: 'loaded চিহ্নিত ফাইল চুপচাপ বাদ। মাঝপথে থেমে থাকা ফাইল বাদ নয়, আবার চালিয়ে শেষ করা হয়।'}
      - type: quote
        body: 'ফাইল নিজের গোনা আর যোগফলে trailer-এর সাথে না মিললে পুরো ফাইল ফেরত।'
    aside:
      - type: terms
        items:
          - {term: 'Checksum', meaning: 'ফাইলের বিষয়বস্তু থেকে বানানো ছোট আঙুলের ছাপ (hash); একটা অক্ষর বদলালে ছাপ বদলে যায়।'}
          - {term: 'Control total', meaning: 'ফাইলে নিজেই লেখা সারির সংখ্যা ও যোগফল, যা আমরা আলাদা করে গুনে মিলিয়ে দেখি।'}
      - type: tips
        items:
          - 'SFTP-তে দাতাকে বলুন ফাইল `.tmp` নামে তুলে শেষে নাম বদলাতে। নইলে অর্ধেক ফাইল ধরে ফেলার ঝুঁকি থাকে।'
    check:
      q: 'Control total মিলল না, কিন্তু ৯৫% সারি ঠিক। আংশিক লোড করা যাবে কি?'
      a: 'না। মিলল না মানে ফাইল কাটা, বদলানো বা সারি হারানো সন্দেহ। কোনটা, আমরা জানি না, তাই পুরো ফাইল ফেরত দিয়ে দাতার কাছে নতুন ফাইল চাই।'

  - slug: ingest-command
    title: 'ফটক পেরিয়ে সারি সারি লোড: Symfony কোড'
    kind: howto
    tldr: 'Hash আর control total যাচাই, ফাইল claim করা, তারপর সারি ধরে লোড; খারাপ সারি quarantine-এ, আর CSV ও fixed-width দুটোই integer minor unit-এ পড়ুন।'
    keywords: ['fixed-width', 'CSV parse', 'hash_file', 'quarantine', 'SplFileObject', 'importer']
    blocks:
      - type: text
        body: |
          Importer পুরো ফাইল একবারে মেমরিতে না তুলে একটা একটা সারি পড়ে (generator বা `SplFileObject`)। প্রতিটা সারি নিজের ছোট transaction-এ লোড হয়, আর খারাপ সারি `InvalidRow` ছুঁড়ে quarantine-এ যায়, বাকিগুলো চলে। অন্য কোনো ক্র্যাশে রান থেমে যায়, কিন্তু ফাইল `loading` চিহ্নিত থাকে, তাই পরের রান সেটা তুলে নেয় (পরের স্লাইড)।
      - type: code
        lang: php
        file: 'src/Batch/PayoutImporter.php'
        variant: good
        code: |
          public function import(string $provider, string $path, string $expectedSha): void
          {
              $hash = hash_file('sha256', $path);
              if (!hash_equals($expectedSha, $hash)) {
                  throw new CorruptedFile($path);          // পথে নষ্ট হয়েছে
              }
              if (null === $fileId = $this->files->claim($provider, basename($path), $hash)) {
                  return;                                  // loaded বা rejected: বাদ
              }

              $file = $this->parser->parse($path);         // header, rows, trailer
              $sum = array_sum(array_map(fn (Row $r) => $r->amountMinor, $file->rows));
              if (count($file->rows) !== $file->count || $sum !== $file->totalMinor) {
                  $this->files->reject($fileId, 'control total মেলেনি');
                  return;                                  // একটা সারিও লোড হয়নি
              }

              foreach ($file->rows as $line => $row) {
                  try {
                      $this->loader->load($fileId, $line, $row);
                  } catch (InvalidRow $e) {
                      $this->files->quarantine($fileId, $line, $row->raw, $e->getMessage());
                  }
              }
              $this->files->markLoaded($fileId);
          }
        marks:
          - {line: 4, tip: 'দাতার পাঠানো SHA-256-এর সাথে নিজের হিসাব করা hash মেলে কি না। `hash_equals` timing-নিরাপদ তুলনা।'}
          - {line: 7, tip: 'নতুন ফাইল, বা ক্র্যাশের পরও `loading` থাকা ফাইলের জন্য `claim()` ফাইলের id ফেরায়। `loaded` বা `rejected` ফাইলে null ফেরে।'}
          - {line: 13, tip: '`$file->count` আর `totalMinor` trailer-এ লেখা সংখ্যা। নিজের গোনার সাথে না মিললে কিছুই লোড হয় না।'}
          - {line: 22, tip: 'খারাপ সারি থামায় না; কারণসহ আলাদা জায়গায় যায়, বাকি ফাইল চলতে থাকে।'}
      - type: code
        lang: php
        file: 'src/Batch/RowParser.php'
        variant: good
        code: |
          // CSV (পাইপ দিয়ে ভাগ)
          [$type, $no, $name, $amount, $cur] = str_getcsv($line, '|');

          // Fixed-width: ১-৪ নম্বর, ৫-২০ নাম, ২১-৩২ অঙ্ক (পয়সায়, শূন্য বসানো)
          $no     = substr($line, 0, 4);
          $name   = rtrim(substr($line, 4, 16));
          $amount = (int) ltrim(substr($line, 20, 12), '0');

          // দশমিক "1250.50" থেকে integer, float ছাড়া
          if (!preg_match('/^(\d+)(?:\.(\d{1,2}))?$/', $text, $m)) {
              throw new InvalidRow("অঙ্ক ভুল: $text");
          }
          $minor = (int) $m[1] * 100 + (int) str_pad($m[2] ?? '', 2, '0');
        marks:
          - {line: 4, tip: 'Fixed-width-এ প্রতিটা field-এর শুরু আর দৈর্ঘ্য দাতার spec-এ লেখা। আন্দাজ নয়, spec ধরে কাটুন।'}
          - {line: 10, tip: 'regex দিয়ে ছাঁচ যাচাই, ভুল হলে এই সারিই quarantine-এ যায়।'}
          - {line: 13, tip: 'শুধু integer গুণ-যোগ; কোথাও float নেই।'}
    aside:
      - type: tips
        items:
          - 'Fixed-width ফাইল পড়ার আগে encoding UTF-8 করে নিন (`mb_convert_encoding`); নইলে অক্ষর-ঘর গোলমাল হয়।'
          - 'SFTP থেকে ফাইল আনতে Flysystem-এর SFTP adapter ভালো; আনার পর নিজের ডিরেক্টরিতে নিয়ে তবেই পড়ুন।'
      - type: refs
        items:
          - {to: 'ledgers/modeling-money', label: 'Integer minor unit'}
          - {to: 'payments/idempotency-keys', label: 'দুইবার-নিরাপদ লেখা'}
    check:
      q: 'Importer পুরো ফাইল `file()` দিয়ে এক বারে পড়লে বড় ফাইলে কী ঝুঁকি, আর কী করা উচিত?'
      a: 'মেমরি শেষ হয়ে যেতে পারে। একটা একটা সারি পড়ুন (generator বা `SplFileObject`) আর প্রতিটা নিজের ছোট transaction-এ লোড করুন।'

  - slug: resume-after-crash
    title: '৪০০০ নম্বরে ক্র্যাশ? আবার চালালে ফাইল শেষ হয়'
    kind: howto
    tldr: 'ফাইলে status রাখুন (শেষ না হওয়া পর্যন্ত `loading`), আর প্রতিটা সারির জমার সাথেই একটা টিক লিখুন। আবার চালালে loaded ফাইল বাদ, অর্ধেক ফাইল চালু, টিক-দেওয়া সারি বাদ।'
    keywords: ['resume', 'idempotent import', 'row ledger', 'ON CONFLICT', 'crash recovery', 'আবার চালানো']
    blocks:
      - type: text
        body: |
          ৪০০০ নম্বর সারির ক্র্যাশে ফিরি। যে ফাইল একবার দেখা হয়েছে সেটাই বাদ দিলে অর্ধেক-লোড ফাইল চিরকাল অর্ধেকই থাকবে। তাই ফাইলের একটা status থাকে: শেষ সারি না হওয়া পর্যন্ত `loading`, তারপর `loaded`। আবার চালালে শুধু `loaded` ফাইল বাদ যায়। আর প্রতিটা সারির জমার সাথে একই transaction-এ `batch_row`-এ একটা টিক পড়ে, ঠিক দোকানদার যেমন বেতনের তালিকায় নামের পাশে টিক দেন: বিদ্যুৎ গেলেও টিক-দেওয়া নামে দ্বিতীয়বার টাকা যায় না।
      - type: code
        lang: sql
        file: 'migrations — resume support'
        variant: good
        code: |
          CREATE TABLE batch_row (
            file_id bigint NOT NULL REFERENCES batch_file (id),
            line_no int    NOT NULL,
            PRIMARY KEY (file_id, line_no)   -- যে সারিতে টাকা জমা হয়েছে, তার একটাই টিক
          );

          -- claim(): নতুন ফাইল হয় 'loading'; অসমাপ্ত ফাইল ফেরত আসে
          INSERT INTO batch_file (provider, name, sha256, status)
          VALUES (:p, :n, :h, 'loading')
          ON CONFLICT (provider, sha256) DO NOTHING;

          SELECT id FROM batch_file
           WHERE provider = :p AND sha256 = :h AND status = 'loading';
        marks:
          - {line: 4, tip: 'টিকের টেবিল। primary key থাকায় একই সারির দ্বিতীয় টিক পড়তেই পারে না।'}
          - {line: 12, tip: 'শুধু `loading` ফাইল ফেরে। `loaded` ও `rejected` ফাইলে কিছুই ফেরে না, তাই সেগুলো বাদ যায়।'}
      - type: code
        lang: php
        file: 'src/Batch/RowLoader.php'
        variant: good
        code: |
          public function load(int $fileId, int $line, Row $row): void
          {
              $this->em->wrapInTransaction(function () use ($fileId, $line, $row): void {
                  $ticked = $this->em->getConnection()->executeStatement(
                      'INSERT INTO batch_row (file_id, line_no) VALUES (?, ?)
                       ON CONFLICT DO NOTHING',
                      [$fileId, $line],
                  );
                  if (0 === $ticked) {
                      return;                         // ক্র্যাশের আগেই জমা হয়েছে: বাদ
                  }
                  $this->wallet->credit($row->userId, $row->amountMinor);   // একই transaction
              });
          }
        marks:
          - {line: 8, tip: 'টিক আগেই ছিল, মানে আগের রানেই এই সারিতে টাকা জমা হয়েছে। কিছু করার নেই।'}
          - {line: 11, tip: 'টিক আর জমা একসাথে commit হয়, নয়তো একসাথেই বাতিল। ক্র্যাশে একটা থাকবে আর অন্যটা থাকবে না, এমন হয় না।'}
      - type: visual
        kind: sequence
        caption: 'সকালের পুনরায় চালানো: একই ফাইল, একই ক্র্যাশ-বিন্দু'
        actors:
          - {id: cron, label: 'আমাদের cron', icon: clock, tip: 'একই ফাইলে importer আবার চালায়।'}
          - {id: files, label: 'batch_file', icon: archive, tip: 'প্রতিটা ফাইলের status মনে রাখে: loading, loaded বা rejected।'}
          - {id: wallet, label: 'ওয়ালেট', icon: wallet, tip: 'টাকা জমা দেয়। এখন প্রতি সারির টিক পাহারা দেয়।'}
        messages:
          - {from: cron, to: files, label: 'একই ফাইল আবার: claim'}
          - {from: files, to: cron, label: 'status loading: চালিয়ে যাওয়া হোক', dashed: true, tip: 'আগের কোড এখানেই ফিরে যেত, ফাইল অর্ধেক পড়ে থাকত।'}
          - {from: cron, to: wallet, label: '১-৩৯৯৯ সারি: টিক আছে, বাদ', tone: good}
          - {at: wallet, note: 'কেউ দুইবার টাকা পেল না', tone: good}
          - {from: cron, to: wallet, label: '৪০০০ থেকে: জমা ও টিক', tone: good}
          - {from: cron, to: files, label: 'শেষ সারি হলো: status loaded'}
    aside:
      - type: pitfalls
        items:
          - 'দাম: প্রতি সারিতে একটা বাড়তি INSERT, আর `batch_row` প্রতি ফাইলে বাড়ে। কয়েক মাস আগের loaded ফাইলের টিক মুছে দিন।'
          - 'দুটো cron রান একসাথে চলতে পারলে আগে ফাইলের hash-এ Symfony Lock নিন; নইলে দুটোই চলে, আর দ্বিতীয়টা প্রথমটার টিকের জন্য অপেক্ষা করে।'
          - 'জমা নিজেই idempotent হলে টিক লাগে না, যেমন `(file_id, line_no)` ধরে UPSERT।'
    check:
      q: 'Importer ১০,০০০ সারির ৪০০০ নম্বরে ক্র্যাশ করল। পরের রান ১-৩৯৯৯ সারি আর ৪০০০ নম্বর সারি নিয়ে কী করবে?'
      a: 'status এখনও `loading`, তাই ফাইলটা claim হয়। ১-৩৯৯৯ সারির টিক পেয়ে বাদ দেয়; ৪০০০ থেকে জমা আর টিক দেয়।'

  - slug: quarantine-bad-rows
    title: 'খারাপ সারি: চুপচাপ বাদ নয়, আলাদা ঝুড়িতে'
    kind: pitfall
    tldr: 'Catch করে `continue` দিলে খারাপ সারি হারিয়ে যায়; কারণসহ quarantine টেবিলে রাখুন, ঠিক করুন, তারপর শুধু সেই সারি আবার চালান।'
    keywords: ['quarantine', 'dead letter', 'reprocess', 'partial failure', 'unique constraint', 'খারাপ সারি']
    blocks:
      - type: text
        body: |
          পচা আমের ঝুড়িতে একটা পচা আম থাকলে পুরো ঝুড়ি ফেলে দেওয়া হয় না; আবার পচাটা চুপচাপ ঝুড়ি থেকে ফেলে দিলে কেউ জানে না কয়টা গেল। ঠিক পথ: পচাটা আলাদা ঝুড়িতে, গায়ে কারণ লিখে। পরে ঠিক করে আবার ভালো ঝুড়িতে।
      - type: code
        lang: php
        file: 'ভুল: চুপচাপ বাদ'
        variant: bad
        code: |
          foreach ($rows as $row) {
              try {
                  $this->loader->load($row);
              } catch (\Throwable) {
                  continue;                  // কেউ কখনো জানবে না
              }
          }
        marks:
          - {line: 5, tip: 'কত সারি, কোনগুলো আর কেন বাদ গেল — কিছুই লেখা থাকে না। কারো টাকা হারালে তদন্তের উপায় নেই।'}
      - type: code
        lang: sql
        file: 'migrations — batch tables'
        variant: good
        code: |
          CREATE TABLE batch_file (
            id       bigserial PRIMARY KEY,
            provider text     NOT NULL,
            name     text     NOT NULL,
            sha256   char(64) NOT NULL,
            status   text     NOT NULL DEFAULT 'received',
            UNIQUE (provider, sha256)
          );
          CREATE TABLE batch_row_error (
            file_id bigint NOT NULL REFERENCES batch_file (id),
            line_no int    NOT NULL,
            raw     text   NOT NULL,
            reason  text   NOT NULL,
            status  text   NOT NULL DEFAULT 'open',
            PRIMARY KEY (file_id, line_no)
          );

          -- ঠিক হওয়ার পর শুধু খোলা সারিগুলো আবার
          SELECT line_no, raw FROM batch_row_error
           WHERE file_id = :id AND status = 'open';
        marks:
          - {line: 7, tip: 'একই ফাইল দুইবার নেওয়া আটকায়। এই এক constraint-ই ফাইল স্তরে idempotency।'}
          - {line: 15, tip: '(ফাইল, সারি নম্বর) অনন্য। একই সারি আবার চালালে দ্বিতীয় error সারি তৈরি হয় না।'}
