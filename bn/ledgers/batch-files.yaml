flashcards:
  - q: 'Batch file ইন্টিগ্রেশনে ফাইল পড়ার আগে কোন চারটা ফটক পার করা উচিত?'
    a: 'পুরো এসেছে কি না, checksum মেলে কি না, control total মেলে কি না, আর এই ফাইল আগেই লোড হয়েছে কি না।'
    more: |
      চারটার একটাও ফাঁক থাকলে অর্ধেক লোড, নষ্ট ফাইল বা ডবল লোডের ঝুঁকি থাকে। তাই এগুলো ফাইলের একটা সারি ছোঁয়ার আগেই যাচাই হয়।
    ref: file-gates
  - q: 'Checksum কী কাজে লাগে?'
    a: 'ফাইল পথে বদলেছে বা নষ্ট হয়েছে কি না ধরতে: নিজের SHA-256 আর দাতার পাঠানোটা মেলান।'
    more: |
      একটা বিটও বদলালে hash সম্পূর্ণ আলাদা হয়। PHP-তে `hash_file('sha256', $path)` আর `hash_equals` দিয়ে তুলনা করা হয়।
    ref: file-gates
  - q: 'Control total কী?'
    a: 'ফাইলের trailer-এ লেখা সারির সংখ্যা আর মোট অঙ্ক। আমরা নিজে গুনে-যোগ করে মেলাই।'
    more: |
      মিললে ধরা যায় ফাইল কাটা পড়েনি বা সারি হারায়নি। না মিললে আংশিক লোড নয়; পুরো ফাইল ফেরত দিয়ে নতুন ফাইল চাওয়া হয়।
    ref: file-gates
  - q: 'SFTP-তে অর্ধেক আপলোড হওয়া ফাইল পড়া ঠেকাতে কী করা হয়?'
    a: 'দাতা ফাইল `.tmp` নামে তুলে শেষে rename করে (বা `.done` মার্কার রাখে)। আমরা শুধু শেষ নামের ফাইল তুলি।'
    more: |
      Rename একটা মুহূর্তে হয়, তাই পুরো ফাইলই দেখা যায় অথবা কিছুই না। এই চুক্তি দাতার সাথে আগেই ঠিক করে নিতে হয়।
    ref: file-gates
  - q: 'একই ফাইল দুইবার এলে ডবল লোড কীভাবে ঠেকানো হয়?'
    a: '`(provider, sha256)`-এ UNIQUE আর একটা status রেখে ফাইল নিবন্ধন করা। `loaded` ফাইল বাদ যায়; দ্বিতীয় INSERT কিছুই করে না।'
    more: |
      status-টাই আসল: শুধু `loaded` ফাইল বাদ যায়। ক্র্যাশের পর `loading` থাকা ফাইল বাদ দিলে চলবে না, চালিয়ে শেষ করতে হবে; নইলে সেটা অর্ধেকই থেকে যায়।
    ref: ingest-command
  - q: 'Importer ৪০০০ নম্বর সারিতে ক্র্যাশ করল। কাউকে দুইবার টাকা না দিয়ে আবার চালিয়ে ফাইল শেষ হয় কীভাবে?'
    a: 'ফাইল `loading` থাকে, তাই আবার চালালে চলে। প্রতি সারির টিক জমার সাথেই `batch_row`-এ লেখা, তাই টিক-দেওয়া সারি বাদ যায়।'
    more: |
      টিক (`(file_id, line_no)` primary key) আর জমা একই transaction-এ, তাই ক্র্যাশে দুটোই থাকে নয়তো কোনোটাই না। আবার চালালে শুধু `loaded` ফাইল বাদ যায়; অর্ধেক-লোড ফাইল কখনো বাদ যায় না।
    ref: resume-after-crash
  - q: 'Fixed-width ফাইল আর CSV-র পার্থক্য কী?'
    a: 'CSV-তে field আলাদা করে একটা বিভাজক (`,` বা `|`)। Fixed-width-এ প্রতিটা field-এর অক্ষর-ঘর নির্দিষ্ট।'
    more: |
      Fixed-width-এ spec-এ লেখা শুরু আর দৈর্ঘ্য ধরে `substr` করা হয়। encoding আগে UTF-8 না করলে অক্ষর-ঘর গোলমাল হয়। অঙ্ক সবসময় integer minor unit-এ বদলে নিন।
    ref: ingest-command
  - q: 'ফাইলের একটা সারি খারাপ হলে কী করা উচিত?'
    a: 'চুপচাপ বাদ নয়। সারি, নম্বর আর কারণসহ quarantine টেবিলে রাখুন; বাকি ফাইল চলুক; ঠিক হলে শুধু সেই সারি আবার চালান।'
    more: |
      quarantine-এ কত সারি গেল গুনে alert দিন। হঠাৎ অনেক হলে বুঝতে হবে সমস্যা ফাইলে নয়, আমাদের parser-এ।
    ref: quarantine-bad-rows

