  - slug: file-gates
    title: 'প্যাকিং স্লিপ: checksum আর control total'
    kind: concept
    tldr: 'ফাইল পড়ার আগে চারটা ফটক: পুরো এসেছে কি না, checksum মেলে কি না, control total মেলে কি না, আগে এসেছে কি না।'
    keywords: ['checksum', 'control total', 'trailer', 'SHA-256', 'atomic arrival', 'প্যাকিং স্লিপ']
    blocks:
      - type: metaphor
        icon: box
        title: 'পার্সেলের প্যাকিং স্লিপ'
        body: |
          কুরিয়ারের বাক্সের গায়ে স্লিপ থাকে: "৩টা জিনিস, মোট দাম ১৭৫০ টাকা, সিল নম্বর ৪৫৭"। বাক্স খুলে গুনে-যোগ করে মেলানো হয়; না মিললে বাক্স ফেরত যায়। ফাইলের শেষে থাকা **trailer** লাইনই সেই স্লিপ: **control total** (সারির সংখ্যা আর মোট অঙ্ক), আর **checksum** হলো সিল — ফাইল পথে বদলেছে কি না তা ধরে।
      - type: code
        lang: text
        file: 'bank_payout_20261120.txt'
        variant: neutral
        code: |
          H|ACME|2026-11-20|v1
          D|0001|rahim|125050|BDT
          D|0002|karim|50000|BDT
          T|2|175050
        marks:
          - {line: 1, tip: 'header: কে পাঠাল, কোন তারিখ, কোন format-এর সংস্করণ।'}
          - {line: 4, tip: 'trailer: সারি ২টা, মোট ১৭৫০৫০ পয়সা। এই দুটো সংখ্যা আমরা নিজে গুনে মেলাব।'}
      - type: visual
        kind: steps
        caption: 'ফাইল লোডের আগে চার ফটক'
        steps:
          - {title: '১. পুরো এসেছে?', body: 'আপলোড শেষের চিহ্ন (rename বা .done) আছে কি', tip: 'দাতা ফাইল .tmp নামে তুলে শেষে নাম বদলায়। আমরা শুধু শেষ নামের ফাইল তুলি।'}
          - {title: '২. checksum মেলে?', body: 'নিজের SHA-256 আর পাঠানোটা এক কি না', tip: 'পথে একটা বিটও বদলালে hash আলাদা হয়, ফাইল নষ্ট ধরা পড়ে।'}
          - {title: '৩. control total মেলে?', body: 'নিজে গোনা সারি ও যোগফল = trailer-এর সংখ্যা', tip: 'ফাইল কাটা পড়েছে বা সারি হারিয়েছে কি না, এটাই বলে দেয়।'}
          - {title: '৪. আগে এসেছে?', body: 'এই hash আগে লোড হয়েছে কি না', tip: 'একই ফাইল দুইবার এলে দ্বিতীয়বার চুপচাপ বাদ।'}
      - type: quote
        body: 'ফাইল নিজের গোনা আর যোগফলে trailer-এর সাথে না মিললে পুরো ফাইল ফেরত।'
    aside:
      - type: terms
        items:
          - {term: 'Checksum', meaning: 'ফাইলের বিষয়বস্তু থেকে বানানো ছোট আঙুলের ছাপ (hash); একটা অক্ষর বদলালে ছাপ বদলে যায়।'}
          - {term: 'Control total', meaning: 'ফাইলে নিজেই লেখা সারির সংখ্যা ও যোগফল, যা আমরা আলাদা করে গুনে মিলিয়ে দেখি।'}
      - type: tips
        items:
          - 'SFTP-তে দাতাকে বলো ফাইল `.tmp` নামে তুলে শেষে নাম বদলাতে। নইলে অর্ধেক ফাইল ধরে ফেলার ঝুঁকি থাকে।'
    check:
      q: 'Control total মিলল না, কিন্তু ৯৫% সারি ঠিক। আংশিক লোড করা যাবে কি?'
      a: 'না। মিলল না মানে ফাইল কাটা, বদলানো বা সারি হারানো সন্দেহ। কোনটা, আমরা জানি না, তাই পুরো ফাইল ফেরত দিয়ে দাতার কাছে নতুন ফাইল চাই।'

  - slug: ingest-command
    title: 'ফটক পেরিয়ে সারি সারি লোড: Symfony কোড'
    kind: howto
    tldr: 'Hash আর control total যাচাই, একবারই-গ্রহণ, তারপর সারি ধরে লোড; খারাপ সারি quarantine-এ, আর CSV ও fixed-width দুটোই integer minor unit-এ পড়ো।'
    keywords: ['fixed-width', 'CSV parse', 'hash_file', 'quarantine', 'SplFileObject', 'importer']
    blocks:
      - type: text
        body: |
          Importer পুরো ফাইল একবারে মেমরিতে না তুলে একটা একটা সারি পড়ে (generator বা `SplFileObject`)। প্রতিটা সারি নিজের ছোট transaction-এ লোড হয়, আর খারাপ সারি `InvalidRow` ছুঁড়ে quarantine-এ যায়, বাকিগুলো চলে।
      - type: code
        lang: php
        file: 'src/Batch/PayoutImporter.php'
        variant: good
        code: |
          public function import(string $provider, string $path, string $expectedSha): void
          {
              $hash = hash_file('sha256', $path);
              if (!hash_equals($expectedSha, $hash)) {
                  throw new CorruptedFile($path);          // পথে নষ্ট হয়েছে
              }
              if (null === $fileId = $this->files->registerOnce($provider, basename($path), $hash)) {
                  return;                                  // একই ফাইল আগেই এসেছে
              }

              $file = $this->parser->parse($path);         // header, rows, trailer
              $sum = array_sum(array_map(fn (Row $r) => $r->amountMinor, $file->rows));
              if (count($file->rows) !== $file->count || $sum !== $file->totalMinor) {
                  $this->files->reject($fileId, 'control total মেলেনি');
                  return;                                  // একটা সারিও লোড হয়নি
              }

              foreach ($file->rows as $line => $row) {
                  try {
                      $this->loader->load($fileId, $line, $row);
                  } catch (InvalidRow $e) {
                      $this->files->quarantine($fileId, $line, $row->raw, $e->getMessage());
                  }
              }
              $this->files->markLoaded($fileId);
          }
        marks:
          - {line: 4, tip: 'দাতার পাঠানো SHA-256-এর সাথে নিজের হিসাব করা hash মেলে কি না। `hash_equals` timing-নিরাপদ তুলনা।'}
          - {line: 7, tip: '`(provider, sha256)`-এ UNIQUE থাকলে INSERT একবারই সফল হয়; দ্বিতীয়বার null ফেরে।'}
          - {line: 13, tip: '`$file->count` আর `totalMinor` trailer-এ লেখা সংখ্যা। নিজের গোনার সাথে না মিললে কিছুই লোড হয় না।'}
          - {line: 22, tip: 'খারাপ সারি থামায় না; কারণসহ আলাদা জায়গায় যায়, বাকি ফাইল চলতে থাকে।'}
      - type: code
        lang: php
        file: 'src/Batch/RowParser.php'
        variant: good
        code: |
          // CSV (পাইপ দিয়ে ভাগ)
          [$type, $no, $name, $amount, $cur] = str_getcsv($line, '|');

          // Fixed-width: ১-৪ নম্বর, ৫-২০ নাম, ২১-৩২ অঙ্ক (পয়সায়, শূন্য বসানো)
          $no     = substr($line, 0, 4);
          $name   = rtrim(substr($line, 4, 16));
          $amount = (int) ltrim(substr($line, 20, 12), '0');

          // দশমিক "1250.50" থেকে integer, float ছাড়া
          if (!preg_match('/^(\d+)(?:\.(\d{1,2}))?$/', $text, $m)) {
              throw new InvalidRow("অঙ্ক ভুল: $text");
          }
          $minor = (int) $m[1] * 100 + (int) str_pad($m[2] ?? '', 2, '0');
        marks:
          - {line: 4, tip: 'Fixed-width-এ প্রতিটা field-এর শুরু আর দৈর্ঘ্য দাতার spec-এ লেখা। আন্দাজ নয়, spec ধরে কাটো।'}
          - {line: 10, tip: 'regex দিয়ে ছাঁচ যাচাই, ভুল হলে এই সারিই quarantine-এ যায়।'}
          - {line: 13, tip: 'শুধু integer গুণ-যোগ; কোথাও float নেই।'}
    aside:
      - type: tips
        items:
          - 'Fixed-width ফাইল পড়ার আগে encoding UTF-8 করে নাও (`mb_convert_encoding`); নইলে অক্ষর-ঘর গোলমাল হয়।'
          - 'SFTP থেকে ফাইল আনতে Flysystem-এর SFTP adapter ভালো; আনার পর নিজের ডিরেক্টরিতে নিয়ে তবেই পড়ো।'
      - type: refs
        items:
          - {to: 'ledgers/modeling-money', label: 'Integer minor unit'}
          - {to: 'payments/idempotency-keys', label: 'দুইবার-নিরাপদ লেখা'}
    check:
      q: 'Importer পুরো ফাইল `file()` দিয়ে এক বারে পড়লে বড় ফাইলে কী ঝুঁকি, আর কী করা উচিত?'
      a: 'মেমরি শেষ হয়ে যেতে পারে। একটা একটা সারি পড়ো (generator বা `SplFileObject`) আর প্রতিটা নিজের ছোট transaction-এ লোড করো।'

  - slug: quarantine-bad-rows
    title: 'খারাপ সারি: চুপচাপ বাদ নয়, আলাদা ঝুড়িতে'
    kind: pitfall
    tldr: 'Catch করে `continue` দিলে খারাপ সারি হারিয়ে যায়; কারণসহ quarantine টেবিলে রাখো, ঠিক করো, তারপর শুধু সেই সারি আবার চালাও।'
    keywords: ['quarantine', 'dead letter', 'reprocess', 'partial failure', 'unique constraint', 'খারাপ সারি']
    blocks:
      - type: text
        body: |
          পচা আমের ঝুড়িতে একটা পচা আম থাকলে পুরো ঝুড়ি ফেলে দেওয়া হয় না; আবার পচাটা চুপচাপ ঝুড়ি থেকে ফেলে দিলে কেউ জানে না কয়টা গেল। ঠিক পথ: পচাটা আলাদা ঝুড়িতে, গায়ে কারণ লিখে। পরে ঠিক করে আবার ভালো ঝুড়িতে।
      - type: code
        lang: php
        file: 'ভুল: চুপচাপ বাদ'
        variant: bad
        code: |
          foreach ($rows as $row) {
              try {
                  $this->loader->load($row);
              } catch (\Throwable) {
                  continue;                  // কেউ কখনো জানবে না
              }
          }
        marks:
          - {line: 5, tip: 'কত সারি, কোনগুলো আর কেন বাদ গেল — কিছুই লেখা থাকে না। কারো টাকা হারালে তদন্তের উপায় নেই।'}
      - type: code
        lang: sql
        file: 'migrations — batch tables'
        variant: good
        code: |
          CREATE TABLE batch_file (
            id       bigserial PRIMARY KEY,
            provider text     NOT NULL,
            name     text     NOT NULL,
            sha256   char(64) NOT NULL,
            status   text     NOT NULL DEFAULT 'received',
            UNIQUE (provider, sha256)
          );
          CREATE TABLE batch_row_error (
            file_id bigint NOT NULL REFERENCES batch_file (id),
            line_no int    NOT NULL,
            raw     text   NOT NULL,
            reason  text   NOT NULL,
            status  text   NOT NULL DEFAULT 'open',
            PRIMARY KEY (file_id, line_no)
          );

          -- ঠিক হওয়ার পর শুধু খোলা সারিগুলো আবার
          SELECT line_no, raw FROM batch_row_error
           WHERE file_id = :id AND status = 'open';
        marks:
