slides:
  - slug: half-loaded-file
    title: 'অর্ধেক ফাইল লোড, বাকিটা ক্র্যাশ'
    kind: story
    tldr: 'ফাইল সম্পূর্ণ এসেছে কি না না দেখেই পড়লে, বা একটা খারাপ সারিতে থামলে, অর্ধেক লোড হয় আর পুনরায় চালালে দুইবার হয়।'
    keywords: ['batch file', 'partial failure', 'CSV import', 'SFTP', 'অর্ধেক লোড', 'ফাইল ইম্পোর্ট']
    blocks:
      - type: text
        body: |
          প্রতি রাতে ব্যাংক SFTP-তে বেতনের CSV রাখে, আমাদের cron সেটা পড়ে ওয়ালেটে টাকা জমা করে। এক রাতে ফাইল তখনও আপলোড হচ্ছিল, cron অর্ধেক ফাইল পড়ে ফেলল। আরেক রাতে ৪০০০ নম্বর সারির নামে অদ্ভুত অক্ষর, loop সেখানেই ক্র্যাশ; ৩৯৯৯ জন টাকা পেল, বাকিরা পেল না। সকালে আবার চালানো হলে প্রথম ৩৯৯৯ জন দ্বিতীয়বার টাকা পেল।
      - type: visual
