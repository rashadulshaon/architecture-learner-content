slides:
  - slug: three-missing-payments
    title: 'গেটওয়ে বলে ১০০০টা, আমার খাতায় ৯৯৭টা'
    kind: story
    tldr: 'নিজের ledger আর বাইরের statement দুটো আলাদা সত্য; কেউ না মেলালে হারানো বা বাড়তি লেনদেন মাসের পর মাস লুকিয়ে থাকে।'
    keywords: ['reconciliation', 'statement', 'mismatch', 'gateway report', 'হিসাব মেলানো', 'অমিল']
    blocks:
      - type: text
        body: |
          মাস শেষে গেটওয়ের statement-এ ১০০০টা সফল পেমেন্ট, আমাদের ledger-এ ৯৯৭টা। কোনো error log নেই, কোনো গ্রাহকের অভিযোগও নেই — তিনজনের টাকা কাটা গেছে, অথচ অর্ডার "pending" রয়ে গেছে। কারণ: গেটওয়ে টাকা কেটে উত্তর পাঠিয়েছিল, আমাদের সার্ভার সেই মুহূর্তে timeout খেয়েছিল।
      - type: visual
        kind: sequence
        caption: 'টাকা কাটল, কিন্তু আমরা জানতেই পারলাম না'
        actors:
          - {id: app, label: 'আমাদের অ্যাপ', icon: server, tip: 'গ্রাহকের পেমেন্টের জন্য গেটওয়েকে ডাকে। নিজের ledger-এ "pending" লিখে রাখে।'}
          - {id: gw, label: 'গেটওয়ে', icon: card, tip: 'ব্যাংক থেকে টাকা কাটে। নিজের statement-এ লেনদেনটা "paid" লেখে।'}
        messages:
          - {from: app, to: gw, label: 'charge ৫০০ টাকা, ref: pay_881'}
          - {from: gw, to: app, label: 'সফল (কিন্তু পথে হারাল)', dashed: true, tone: bad, tip: 'timeout-এ আমাদের অ্যাপ উত্তরটা পায়নি।'}
          - {at: app, note: 'ledger-এ pay_881 এখনো pending', tone: warn}
          - {at: gw, note: 'statement-এ pay_881 paid, ৫০০ টাকা', tone: bad, tip: 'বাইরের সত্য আর আমাদের সত্য এখন আলাদা।'}
      - type: quote
        body: 'নিজের খাতা আর বাইরের খাতা দুটো আলাদা সত্য। নিয়মিত না মেলালে ভুল চুপচাপ জমে।'
    aside:
      - type: story
        title: 'ছয় মাস পরের সারপ্রাইজ'
        body: |
          এক কোম্পানি ছয় মাস পর বার্ষিক অডিটে জানল, গেটওয়ে তাদের কাছে ৪ লাখ টাকা বেশি দেখাচ্ছে। কোনো একটা retry bug-এ কিছু পেমেন্ট ledger-এ লেখাই হয়নি। রোজ মেলালে প্রথম দিনেই ধরা পড়ত।
      - type: problem
        body: 'বাইরের সিস্টেম (ব্যাংক, গেটওয়ে) নিজের মতো সত্য রাখে। আমাদের হিসাব তার সাথে মিলছে কি না, সেটা নিয়মিত যাচাই না করলে বুঝব না।'
    check:
      q: 'কোনো error log নেই, কেউ অভিযোগও করেনি — তবু ৩টা পেমেন্টের অমিল থাকা সম্ভব কেন?'
      a: 'গেটওয়ে টাকা কেটেছে, কিন্তু আমরা উত্তর পাইনি; তাই আমাদের ledger "pending" রয়ে গেছে। কোডে কোনো exception ওঠেনি, শুধু দুই খাতা আলাদা।'

  - slug: match-and-break
    title: 'মেলানোর চাবি আর অমিলের ছয় ধরন'
    kind: concept
    tldr: 'দুই খাতার প্রতিটা লাইন একটা অপরিবর্তনীয় reference দিয়ে জোড়া লাগান; যা জোড়া লাগে না বা অঙ্কে মেলে না, তা একটা break।'
    keywords: ['matching key', 'break', 'unmatched', 'reference id', 'cutoff', 'timing difference']
    blocks:
      - type: metaphor
        icon: wallet
        title: 'বিকাশ এজেন্টের দিনশেষ'
        body: |
          এজেন্ট রাতে নিজের খাতার প্রতিটা লাইন বিকাশের statement-এর লাইনের সাথে মেলান। মেলানোর চাবি লেনদেন আইডি (TrxID) — সময় বা অঙ্ক নয়, কারণ একই অঙ্কের লেনদেন অনেক। যা মিলে না, তা লাল কালিতে দাগ দেন। সেই দাগই **break**।
      - type: visual
        kind: table
        caption: 'অমিলের ধরন আর তার সম্ভাব্য কারণ'
        headers: ['Break-এর ধরন', 'মানে', 'সম্ভাব্য কারণ']
        rows:
          - cells: ['missing_in_ledger', 'বাইরে আছে, আমাদের নেই', 'timeout, webhook হারানো']
            tip: 'টাকা কেটে গেছে অথচ আমরা জানি না। সবচেয়ে বিপজ্জনক ধরন।'
          - cells: ['missing_at_provider', 'আমাদের আছে, বাইরে নেই', 'ফেল হওয়া পেমেন্ট "সফল" লেখা']
            tip: 'আমরা ধরে নিয়েছি পেমেন্ট হয়েছে, গেটওয়ে জানে না। পণ্য ছেড়ে দিলে ক্ষতি।'
          - cells: ['amount_mismatch', 'দুই পাশে অঙ্ক আলাদা', 'ফি কাটা, rounding, ভুল অঙ্ক']
            tip: 'reference মিলেছে কিন্তু অঙ্ক নয়। অনেক সময় ফি বা currency-র কারণে।'
          - cells: ['duplicate', 'একই reference দুইবার', 'retry, ডবল webhook']
            tip: 'একই লেনদেন দুইবার গোনা হয়েছে, সাধারণত idempotency ঠিক না থাকলে।'
          - cells: ['status_mismatch', 'অবস্থা আলাদা (paid/refunded)', 'refund বা chargeback আমরা জানিনি']
            tip: 'অঙ্ক মেলে, কিন্তু অবস্থা মেলে না — যেমন গেটওয়েতে refunded, আমাদের কাছে paid।'
          - cells: ['timing', 'আজ এখানে, কাল ওখানে', 'cutoff সময়, T+1 settlement']
            tip: 'আসল ভুল নয়, দিন ভাগের পার্থক্য। পরের দিনের statement-এ মিলে যায়।'
    aside:
      - type: terms
        items:
          - {term: 'Break', meaning: 'দুই খাতার যে লাইন মেলে না। একটা break মানে তদন্তের একটা কাজ।'}
          - {term: 'Matching key', meaning: 'দুই পাশের একই লেনদেন চেনার অপরিবর্তনীয় reference, যেমন gateway-র payment id।'}
      - type: tips
        items:
          - 'payment তৈরির সময়ই gateway reference নিজের টেবিলে রাখুন। পরে খুঁজে পাওয়া কঠিন।'
          - 'timing break আলাদা চিহ্নিত রাখুন, যাতে প্রতিদিন ভুল alarm না বাজে।'
    check:
      q: 'দুই খাতা মেলাতে "অঙ্ক আর সময় মিলিয়ে দেখুন" না বলে reference id বলা হয় কেন?'
      a: 'একই অঙ্কে একই সময়ে অনেক লেনদেন হতে পারে, তাই অঙ্ক-সময় দিয়ে ভুল জোড়া লাগে। reference id প্রতি লেনদেনে অনন্য।'

  - slug: daily-reconcile-job
    title: 'রোজের job: statement আনুন, মেলান, break লিখুন'
    kind: howto
    tldr: 'Statement একটা টেবিলে ঢোকান, একটা FULL OUTER JOIN-এ ছয় ধরনের break-ই বের করুন, আর Symfony Scheduler-এ রোজ ভোরে console command চালান।'
    keywords: ['FULL OUTER JOIN', 'recon_break', 'Symfony Scheduler', 'AsCronTask', 'console command', 'daily job']
    blocks:
      - type: text
        body: |
          পদ্ধতি তিন ধাপের। এক, provider-এর statement ফাইল/API থেকে `statement_line` টেবিলে তুলুন। দুই, `ledger_payment`-এর সাথে একটা `FULL OUTER JOIN` চালান, যেখানে প্রতিটা ref প্রতি পাশে গুনে অঙ্ক, status আর দিন মেলানো হয়। কোনো পাশে না থাকা, দুইবার গোনা বা আলাদা হওয়া সবই break, আর `CASE` বলে দেয় ছয় ধরনের কোনটা। reference মেলে কিন্তু দিন আলাদা হলে সেটা `timing` break। সত্যিকারের হারানো লাইন থেকে সেটা আলাদা করতে query এক দিন আগে-পরেও দেখে, তাই job চলে দুই দিন আগের তারিখের জন্য, যখন পাশের দিনের statement এসে গেছে। তিন, `(day, provider, ref)`-এ UNIQUE রেখে ফলাফল `recon_break`-এ লিখুন, যাতে job দুইবার চললেও একই break দুইবার না ঢোকে।
      - type: code
        lang: sql
        file: 'break বের করার query'
        variant: good
        code: |
          -- :from = :day - 1, :to = :day + 1 (timing ধরতে এক দিন আগে-পরে)
          WITH l AS (SELECT ref, MIN(day) day, COUNT(*) n, MAX(amount_minor) amt, MAX(status) st
                       FROM ledger_payment  WHERE day BETWEEN :from AND :to GROUP BY ref),
               s AS (SELECT ref, MIN(day) day, COUNT(*) n, MAX(amount_minor) amt, MAX(status) st
                       FROM statement_line WHERE day BETWEEN :from AND :to GROUP BY ref)
          INSERT INTO recon_break (day, provider, ref, category, our_minor, their_minor)
          SELECT :day, 'gw', COALESCE(l.ref, s.ref),
                 CASE WHEN l.n > 1 OR s.n > 1 THEN 'duplicate'
                      WHEN s.ref IS NULL      THEN 'missing_at_provider'
                      WHEN l.ref IS NULL      THEN 'missing_in_ledger'
                      WHEN l.amt <> s.amt     THEN 'amount_mismatch'
                      WHEN l.st  <> s.st      THEN 'status_mismatch'
                      ELSE 'timing' END,
                 l.amt, s.amt
            FROM l FULL OUTER JOIN s ON s.ref = l.ref
           WHERE COALESCE(l.day, s.day) = :day
             AND (l.n > 1 OR s.n > 1 OR l.ref IS NULL OR s.ref IS NULL
                  OR l.amt <> s.amt OR l.st <> s.st OR l.day <> s.day)
          ON CONFLICT (day, provider, ref) DO NOTHING;
        marks:
          - {line: 2, tip: 'প্রতি পাশে: এই ref কতগুলো লাইনে আছে (`n`), আর তার অঙ্ক, status ও দিন। `n` ১-এর বেশি মানে duplicate।'}
          - {line: 8, tip: 'CASE ওপর থেকে নিচে চলে। প্রথম যে শর্ত সত্য, সেটাই break-এর নাম। পাঁচটার কোনোটা না মিললে একই ref আলাদা দিনে: timing।'}
          - {line: 16, tip: 'শুধু এই দিনের break রাখে (ledger পাশের দিনই প্রাধান্য পায়), যাতে পরের দিনের run একই লাইন আবার না ধরে।'}
          - {line: 19, tip: 'দ্বিতীয়বার চালালে একই break আবার ঢোকে না। job নিরাপদে পুনরায় চালানো যায়।'}
      - type: code
        lang: php
        file: 'src/Command/ReconcileCommand.php'
        variant: good
        code: |
          #[AsCommand(name: 'app:reconcile', description: 'দিনশেষের হিসাব মেলায়')]
          #[AsCronTask('0 3 * * *')]
          final class ReconcileCommand extends Command
          {
              public function __construct(private readonly Reconciler $reconciler)
              {
                  parent::__construct();
              }

              protected function configure(): void
              {
                  $this->addArgument('date', InputArgument::OPTIONAL, 'কোন দিন', '2 days ago');
              }

              protected function execute(InputInterface $in, OutputInterface $out): int
              {
                  $day = new \DateTimeImmutable($in->getArgument('date'));
                  $breaks = $this->reconciler->run($day);   // statement আনে, query চালায়
                  $out->writeln(sprintf('%s: %d টা break', $day->format('Y-m-d'), $breaks));

                  return Command::SUCCESS;
              }
          }
        marks:
          - {line: 2, tip: 'Symfony Scheduler রোজ ভোর ৩টায় এই command চালায়। চালু রাখতে `messenger:consume scheduler_default` লাগে।'}
          - {line: 12, tip: 'argument ছাড়া "দুই দিন আগে", যখন পাশের দিনের statement এসে গেছে। দরকারে হাতে আগের কোনো দিনও আবার চালানো যায়।'}
    aside:
      - type: commands
        title: 'চালানোর কমান্ড'
        items:
          - {cmd: 'php bin/console app:reconcile 2026-11-20', desc: 'নির্দিষ্ট দিনের হিসাব আবার মেলান'}
          - {cmd: 'php bin/console messenger:consume scheduler_default', desc: 'Scheduler চালু রাখুন'}
      - type: tips
        items:
          - 'break সংখ্যা ০-র বেশি হলে alert পাঠান। চুপচাপ থাকলে কেউ দেখবে না।'
          - 'দুই টেবিলেই `(day, ref)`-এ index দিন, নইলে join সব স্ক্যান করে। দিনে কয়েক মিলিয়ন লাইন পর্যন্ত চলে; তার চেয়ে অনেক বেশি হলে day ধরে partition করুন।'
          - 'statement ফাইল আনার ধাপ নিয়ে দেখুন [[ledgers/batch-files|Batch ফাইল ইন্টিগ্রেশন]]।'
    check:
      q: '`recon_break`-এ `(day, provider, ref)` UNIQUE কেন, আর `ON CONFLICT DO NOTHING` কেন?'
      a: 'job দুইবার চললে (retry বা হাতে) একই break দুইবার ঢুকত। UNIQUE আর DO NOTHING মিলে job-কে নিরাপদে বারবার চালানোর উপযুক্ত করে।'

  - slug: dont-plug-the-gap
    title: 'অমিল ঢাকতে নিজের খাতা বদলাবেন না'
    kind: pitfall
    tldr: 'Break মিটাতে ledger-এ UPDATE করা ভুল; break খোলা রাখুন, কারণ খুঁজুন, তারপর সংশোধন entry লিখে বন্ধ করুন।'
    keywords: ['break resolution', 'plug figure', 'corrective entry', 'write-off', 'অমিল মেটানো', 'সংশোধন']
    blocks:
      - type: text
        body: |
          অমিল দেখে সহজ লোভ: "ব্যাংকের অঙ্কটাই ঠিক, ledger-এ বসিয়ে দিই।" এতে সংখ্যা মেলে, কিন্তু কেন ভুল হয়েছিল তা চিরকালের জন্য চাপা পড়ে। ঠিক পথ: break-টা খোলা অবস্থায় রাখুন, কারণ খুঁজে বের করুন, তারপর একটা নতুন সংশোধন entry লিখে break বন্ধ করুন।
      - type: code
        lang: php
        file: 'break মেটানো'
        variant: bad
        code: |
          // বাইরের অঙ্কের সাথে মিলিয়ে দিই
          $db->executeStatement(
              'UPDATE ledger_entry SET amount_minor = ? WHERE id = ?',
              [$break->theirMinor, $entryId],
          );
        marks:
          - {line: 2, tip: 'পুরনো অঙ্ক মুছে গেল। কেন ভুল ছিল, কে বদলাল, কিছুই আর জানা যাবে না।'}
      - type: code
        lang: php
        file: 'break মেটানো'
        variant: good
        code: |
          $break->investigate($user, 'gateway webhook হারিয়েছিল');

          $txId = $ledger->post(
              memo: "recon সংশোধন: {$break->ref}",
              postings: [   // pay_881: গেটওয়ের কাছে ৫০০ টাকা, যা আমরা লিখিনি
                  new Posting($gatewayClearing, Side::Debit,  new Money(50000, 'BDT')),
                  new Posting($sales,           Side::Credit, new Money(50000, 'BDT')),
              ],
          );

          $break->resolve($user, correctedBy: $txId);
        marks:
          - {line: 1, tip: 'কে, কখন, কী কারণ — সব break-এর গায়ে লেখা থাকে। এটাই তদন্তের প্রমাণ।'}
          - {line: 3, tip: 'ভুল ঠিক করা হয় নতুন লেনদেনে; আগের কোনো entry বদলায় না। দুই পাশ যথারীতি মেলে।'}
          - {line: 11, tip: 'break বন্ধ হলো কোন লেনদেন দিয়ে, তা জুড়ে রাখা হলো। পরে অডিটর সোজা সেখানে পৌঁছায়।'}
      - type: visual
        kind: steps
        caption: 'একটা break-এর জীবনচক্র'
        steps:
          - {title: '১. খোলা (open)', body: 'রাতের job break লেখে, কেউ এখনো দেখেনি', tip: 'এই অবস্থায় break গোনা হয়; পুরনো খোলা break-ই আসল ঝুঁকি।'}
          - {title: '২. তদন্ত (investigating)', body: 'একজন মালিক কারণ খোঁজে ও লিখে রাখে', tip: 'মালিক ছাড়া break কেউ দেখে না, তাই নাম বসানো বাধ্যতামূলক।'}
          - {title: '৩. সংশোধন (resolved)', body: 'নতুন entry লিখে break লেনদেনের সাথে জোড়া হয়', tip: 'ledger পরিবর্তিত হয় শুধু নতুন entry দিয়ে।'}
          - {title: '৪. অনুমোদিত ছাড় (written off)', body: 'ছোট অঙ্ক, দ্বিতীয় জনের অনুমোদনে বন্ধ', tip: 'ছোট অঙ্কের জন্য অনন্তকাল খোঁজা সম্ভব নয়। অঙ্কটা write-off অ্যাকাউন্টে সাধারণ entry হিসেবে বসে, আর সিদ্ধান্ত লিখে ও অনুমোদন নিয়ে হয়।'}
    aside:
      - type: pitfalls
        items:
          - 'খোলা break জমতে দিলে এক সময় কেউ আর দেখে না। বয়স ধরে alert দিন (যেমন ৩ দিনের পুরনো)।'
      - type: refs
        items:
          - {to: 'recovery/corrective-actions', label: 'সংশোধন entry আর data-fix'}
          - {to: 'payments/unknown-outcomes', label: '"জানি না" অবস্থা'}
    check:
      q: 'ledger-এর অঙ্ক statement-এর সাথে মেলাতে UPDATE চালালে ঠিক কোন জিনিসটা হারায়?'
      a: 'অমিলের কারণ আর ইতিহাস। সংখ্যা মেলে ঠিকই, কিন্তু একই bug আবার ঘটলে ধরার উপায় থাকে না।'

flashcards:
  - q: 'Reconciliation কী?'
    a: 'নিজের ledger-কে বাইরের সিস্টেমের (ব্যাংক, গেটওয়ে) statement-এর সাথে লাইন ধরে মেলানো, আর অমিল খুঁজে বের করা।'
    more: |
      দুই পাশই নিজের মতো সত্য রাখে। মেলানো ছাড়া হারানো webhook, ডবল retry বা ভুল অঙ্ক মাসের পর মাস চুপচাপ জমে থাকে। তাই এটা রোজকার নিয়মিত কাজ, বছরে একবারের নয়।
    ref: three-missing-payments
  - q: 'দুই খাতার লাইন মেলাতে কোন চাবি (matching key) ব্যবহার করা হয়?'
    a: 'অপরিবর্তনীয় reference id, যেমন gateway-র payment id। অঙ্ক বা সময় নয়।'
    more: |
      একই অঙ্ক একই সময়ে অনেকে পাঠাতে পারে, তাই অঙ্ক-সময় দিয়ে ভুল জোড়া লাগে। payment তৈরির সময়ই reference নিজের টেবিলে রাখলে পরে মেলানো সহজ।
    ref: match-and-break
  - q: 'Reconciliation-এ "break" কাকে বলে?'
    a: 'দুই খাতার যে লাইন মেলে না: এক পাশে নেই, অঙ্কে আলাদা, বা অবস্থায় আলাদা।'
    more: |
      প্রতিটা break-এর একটা category, একজন মালিক আর একটা অবস্থা (open, investigating, resolved) থাকে। এভাবে অমিল ঢাকা পড়ে না, তদন্তের কাজ হয়ে ওঠে।
    ref: match-and-break
  - q: '`missing_in_ledger` আর `missing_at_provider` break-এর মানে কী?'
    a: 'প্রথমটা: বাইরে আছে, আমাদের ledger-এ নেই (টাকা কেটেছে, আমরা জানি না)। দ্বিতীয়টা: আমাদের আছে, বাইরে নেই।'
    more: |
      প্রথমটা সাধারণত হারানো webhook বা timeout থেকে। দ্বিতীয়টা বিপজ্জনক: আমরা ধরে নিয়েছি পেমেন্ট হয়েছে, গেটওয়ে জানে না — পণ্য ছেড়ে দিলে ক্ষতি আমাদের।
    ref: match-and-break
  - q: 'Timing difference কী, আর কেন এটা আসল ভুল নয়?'
    a: 'একই reference দুই পাশেই আছে, কিন্তু আলাদা দিনে (cutoff বা T+1 settlement)। job এটাকে হারানো নয়, `timing` বলে।'
    more: |
      Query যে দিনটা দেখছে তার এক দিন আগে-পরেও খোঁজে, তাই শুধু পাশের দিনে পড়ে থাকা লাইনকে হারানো বলা হয় না। এগুলো আলাদা চিহ্নিত না করলে প্রতিদিন ভুল alarm বাজে, আর মানুষ alert উপেক্ষা করতে শেখে।
    ref: match-and-break
  - q: 'একটা query ছয় ধরনের break আলাদা করে কীভাবে?'
    a: 'প্রতি পাশে ref গুনে অঙ্ক, status আর দিন মেলায়। `CASE` প্রথম সত্য শর্তে নাম দেয়: duplicate, কোনো পাশে নেই, অঙ্ক, status, নইলে timing।'
    more: |
      একটা `FULL OUTER JOIN` শুধু একপাশে থাকা লাইন রাখে। `WHERE` আবার দুই পাশেই থাকা সেই লাইনও রাখে, যার সংখ্যা, অঙ্ক, status বা দিন আলাদা। ক্রম জরুরি: duplicate আগে নাম পায়, তাই সেটা অঙ্কের অমিল ভেবে ভুল হয় না।
    ref: daily-reconcile-job
  - q: 'Daily reconciliation job কেন idempotent হওয়া উচিত?'
    a: 'job বারবার চালানো যায় (retry বা হাতে)। UNIQUE (day, provider, ref) আর DO NOTHING থাকলে একই break দুইবার ঢোকে না।'
    more: |
      সার্ভার মাঝপথে বন্ধ হলে বা আগের দিন আবার মেলাতে চাইলে job পুনরায় চালানো যায়। এটা Symfony Scheduler-এর `#[AsCronTask]` আর console command-এর সাথে দারুণ মেলে।
    ref: daily-reconcile-job
  - q: 'Break মেটাতে ledger-এ UPDATE চালানো কেন ভুল?'
    a: 'ইতিহাস আর কারণ মুছে যায়। ঠিক পথ: break-এ কারণ লেখা, নতুন সংশোধন entry লেখা, তারপর break বন্ধ করা।'
    more: |
      সংখ্যা মেলানোই আসল লক্ষ্য নয়; লক্ষ্য জানা কেন অমিল হলো, যাতে আবার না হয়। UPDATE দিয়ে ঢাকলে একই bug আবার ঘটলেও কেউ ধরবে না।
    ref: dont-plug-the-gap

quiz:
  - q: 'গেটওয়ে statement-এ pay_881 (৫০০ টাকা, paid) আছে, কিন্তু আমাদের ledger-এ নেই। এটা কোন ধরনের break, আর প্রথম করণীয় কী?'
    hint: 'বাইরে আছে, আমাদের নেই।'
    options:
      - text: 'missing_in_ledger; কারণ খুঁজে সংশোধন entry লিখতে হবে'
        correct: true
        why: 'টাকা কেটেছে অথচ আমরা জানি না। কারণ (timeout, webhook হারানো) খুঁজে নতুন entry-তে ঠিক করতে হয়।'
      - text: 'missing_at_provider; গ্রাহককে refund করে দিতে হবে'
        correct: false
        why: 'এখানে গেটওয়ের কাছে লেনদেন আছে, তাই এটা missing_at_provider নয়।'
      - text: 'timing; কিছু না করে অপেক্ষা করলেই হবে'
        correct: false
        why: 'পরের দিনের statement-এও না মিললে সেটা আসল break। অপেক্ষার একটা সীমা রাখতে হয়।'
      - text: 'duplicate; একটা মুছে ফেলতে হবে'
        correct: false
        why: 'আমাদের ledger-এ লাইনই নেই, তাই duplicate হওয়ার প্রশ্ন নেই।'
    ref: match-and-break
  - q: 'কোনগুলো reconciliation-এর matching key হিসেবে ভালো পছন্দ?'
    hint: 'যা প্রতিটা লেনদেনে অনন্য, আর বদলায় না।'
    options:
      - text: 'Gateway-র দেওয়া payment id'
        correct: true
        why: 'প্রতিটা লেনদেনে অনন্য এবং দুই পাশেই থাকে।'
      - text: 'আমাদের পাঠানো idempotency key বা merchant reference'
        correct: true
        why: 'আমরা নিজে বানাই, গেটওয়েও statement-এ ফেরত দেয়; ফলে দুই পাশে মেলে।'
      - text: 'অঙ্ক আর মিনিট পর্যন্ত সময়'
        correct: false
        why: 'একই মিনিটে একই অঙ্কের অনেক লেনদেন হতে পারে।'
      - text: 'গ্রাহকের নাম আর অঙ্ক'
        correct: false
        why: 'একই গ্রাহক একই অঙ্ক দুইবার পাঠাতে পারে; ভুল জোড়া লাগবে।'
    ref: match-and-break
  - q: 'রাতের reconcile job সার্ভার crash-এ মাঝপথে থেমে গেল। সকালে আবার চালানো হলো। `recon_break`-এ কী হবে, যদি UNIQUE আর ON CONFLICT DO NOTHING থাকে?'
    hint: 'একই break আবার ঢুকতে চাইলে কী হয়?'
    options:
      - text: 'আগে ঢোকা break আবার ঢোকে না, নতুনগুলো ঢোকে'
        correct: true
        why: 'UNIQUE আর DO NOTHING মিলে job-কে নিরাপদে পুনরায় চালানোর উপযুক্ত করে।'
      - text: 'সব break দুইবার করে ঢোকে'
        correct: false
        why: 'UNIQUE constraint থাকায় ঢুকতেই পারে না।'
      - text: 'job error দিয়ে থামে, আর হাতে টেবিল পরিষ্কার করতে হয়'
        correct: false
        why: 'ON CONFLICT DO NOTHING থাকায় error ওঠে না।'
      - text: 'আগের break মুছে নতুন করে লেখা হয়'
        correct: false
        why: 'DO NOTHING মানে পুরনোকে ছোঁয়াই হয় না।'
    ref: daily-reconcile-job
  - q: 'statement বলছে pay_77 `refunded`, আমাদের ledger বলছে `paid`; দুই পাশেই একই দিনে ৫০০ টাকা। এটা কোন break?'
    hint: 'reference, অঙ্ক আর দিন তিনটাই মেলে।'
    options:
      - text: 'status_mismatch: একটা refund যা আমরা দেখিনি'
        correct: true
        why: 'অঙ্ক মেলে, status মেলে না। query অঙ্কের পর status মেলায়, তাই এটা এখানে পড়ে।'
      - text: 'amount_mismatch'
        correct: false
        why: 'দুই পাশেই ৫০০ টাকা, অঙ্ক মেলে।'
      - text: 'timing'
        correct: false
        why: 'দুটো লাইনই একই দিনে, দিনের পার্থক্য নেই।'
      - text: 'missing_in_ledger'
        correct: false
        why: 'আমাদের ledger-এ লাইনটা আছে; শুধু status আলাদা।'
    ref: daily-reconcile-job
  - q: 'নিচের কোডটা কেন সমস্যা?'
    lang: php
    code: |
      foreach ($breaks as $b) {
          $db->executeStatement(
              'UPDATE ledger_payment SET amount_minor = ? WHERE ref = ?',
              [$b->theirMinor, $b->ref],
          );
          $b->close();
      }
    hint: 'পুরনো অঙ্কটা কোথায় গেল?'
    options:
      - text: 'ledger-এর অঙ্ক নিঃশব্দে বদলে অমিলের কারণ ও ইতিহাস মুছে ফেলছে'
        correct: true
        why: 'ঠিক পথ: কারণ লিখে নতুন সংশোধন entry লেখা, তারপর break বন্ধ করা।'
      - text: 'foreach ধীর, batch update করা উচিত'
        correct: false
        why: 'গতি নয়; সমস্যা হলো ইতিহাস মুছে যাওয়া।'
      - text: '`close()` আগে ডাকা উচিত'
        correct: false
        why: 'ক্রম বদলালেও ledger-এ UPDATE-ই মূল সমস্যা।'
      - text: 'কোনো সমস্যা নেই, অঙ্ক তো এখন মিলছে'
        correct: false
        why: 'মিললেও ভুলের কারণ অজানা, একই bug আবার ঘটলে ধরা যাবে না।'
    ref: dont-plug-the-gap
  - q: 'গেটওয়ে statement-এ পেমেন্টটা ২১ নভেম্বর, আমাদের ledger-এ ২০ নভেম্বর রাত ১১:৫৯। ২০ তারিখের job এটাকে কী নামে চিহ্নিত করবে?'
    hint: 'একই reference দুই পাশেই আছে।'
    options:
      - text: 'timing break: reference মেলে, শুধু দিন আলাদা'
        correct: true
        why: 'query এক দিন আগে-পরে দেখে ২১ তারিখে ref-টা পায়, তাই missing না বলে timing বলে। cutoff-এর পার্থক্য আসল ভুল নয়।'
