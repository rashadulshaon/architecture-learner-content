    ref: adapter-price
  - q: 'Checkout কোড সরাসরি `AcmeClient` ব্যবহার করে, আর `$raw[''state''] === ''paid''` সব জায়গায় ছড়ানো। ছয় মাস পর vendor বদলাতে হবে। কী সমস্যা?'
    hint: 'বদলাতে কতগুলো ফাইল ছুঁতে হবে?'
