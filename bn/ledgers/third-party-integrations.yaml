        why: 'এতে আরও খারাপ হয়; timeout, retry কিছুই থাকে না।'
      - text: 'নতুন vendor-এর SDK-র ভেতরেই এসব নিজে বদলে যাবে'
        correct: false
        why: 'নতুন SDK-র নিজের ভাষা থাকে; পুরনো কোড আপনা-আপনি বদলায় না।'
