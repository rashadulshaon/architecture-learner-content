        correct: true
        why: 'adapter থাকলে অনুবাদ এক জায়গায় থাকত। না থাকলে vendor বদল মানে বড় refactor।'
      - text: 'কোনো সমস্যা নেই, কোড শুধু find-replace করলেই হয়'
