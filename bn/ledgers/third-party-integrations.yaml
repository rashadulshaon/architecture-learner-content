slides:
  - slug: slow-vendor-stops-us
    title: 'বাইরের সার্ভিস ধীর হলো, আমাদের সাইট থেমে গেল'
    kind: story
    tldr: 'Timeout ছাড়া বাইরের call-এ প্রতিটা worker আটকে যায়; vendor ধীর হলে ক-সেকেন্ডেই আমাদের পুরো সাইট অচল।'
    keywords: ['timeout', 'slow vendor', 'worker exhaustion', 'HttpClient', 'বাইরের API', 'আটকে যাওয়া']
    blocks:
      - type: text
        body: |
          ঈদের আগের রাতে পেমেন্ট গেটওয়ে হঠাৎ ধীর হয়ে গেল — প্রতি call-এ ৩০ সেকেন্ড। আমাদের ৫০টা PHP worker, সেকেন্ডে ১০টা checkout request। ৫ সেকেন্ডেই সব worker গেটওয়ের উত্তরের অপেক্ষায় আটকে গেল। তখন গেটওয়ের সাথে সম্পর্কহীন পাতা, যেমন হোম পেজ, ব্যবহারকারীর প্রোফাইল, সবই সাড়া দেয় না।
      - type: visual
        kind: flow
        caption: 'এক ধীর vendor, পুরো সাইটের worker আটকে'
        nodes:
          - {id: users, label: 'ব্যবহারকারী', sub: 'সেকেন্ডে ১০ request', icon: users, col: 0, row: 1, tip: 'ঈদের রাতে একই সময়ে অনেক ব্যবহারকারী checkout চাপছে।'}
          - {id: workers, label: 'PHP worker ৫০টা', sub: 'সবই ব্যস্ত', icon: server, tone: warn, col: 2, row: 1, tip: 'প্রতিটা worker একটা করে request ধরে রাখে। আটকে থাকলে নতুন কাউকে ধরতে পারে না।'}
          - {id: vendor, label: 'গেটওয়ে', sub: 'প্রতি call ৩০ সেকেন্ড', icon: cloud, tone: bad, col: 4, row: 1, tip: 'আমাদের নিয়ন্ত্রণের বাইরের সিস্টেম। সে ধীর হলে আমরা তাকে ঠিক করতে পারি না।'}
        edges:
          - {from: users, to: workers, label: 'প্রতি সেকেন্ডে ১০টা checkout request আসে'}
          - {from: workers, to: vendor, label: 'প্রতিটা worker গেটওয়েকে ডাকে আর উত্তরের অপেক্ষায় বসে থাকে'}
          - {from: vendor, to: workers, label: '৩০ সেকেন্ড পরে উত্তর আসে — ততক্ষণে ১০ × ৩০ request জমে গেছে', dashed: true, tone: bad}
          - {from: workers, to: users, label: '৫ সেকেন্ডেই ৫০ worker শেষ; সাইটের সব পাতায় error', dashed: true, tone: bad}
      - type: code
        lang: php
        file: 'timeout ছাড়া call (ভুল)'
        variant: bad
        code: |
          $client = HttpClient::create();      // timeout ঠিক করা নেই

          $response = $client->request('POST', 'https://api.acmepay.example/charges', [
              'json' => ['amount' => 50000, 'currency' => 'BDT'],
          ]);
          $data = $response->toArray();        // ধীর হলে এখানে আটকে থাকে
        marks:
          - {line: 1, tip: 'ডিফল্টে প্রায় ৬০ সেকেন্ড (`default_socket_timeout`) পর্যন্ত অপেক্ষা। ধীর vendor-এ সেটাই অনেক বেশি।'}
          - {line: 6, tip: 'উত্তর না আসা পর্যন্ত worker অন্য কাজ করতে পারে না। সব worker এখানে আটকালে সাইট অচল।'}
      - type: quote
        body: 'বাইরের সার্ভিস একদিন ধীর হবেই। timeout ছাড়া কোনো বাইরের call নয়।'
    aside:
      - type: problem
        body: 'আমরা vendor-কে দ্রুত করতে পারি না। যা পারি, তার ধীরতা যেন আমাদের worker-গুলো আটকে না ফেলে, তা নিশ্চিত করা।'
      - type: terms
        items:
          - {term: 'Timeout', meaning: 'অপেক্ষার সর্বোচ্চ সীমা; পেরোলে call বাতিল, error ধরে আমরা এগোই।'}
    check:
      q: 'গেটওয়ে ধীর হলে শুধু checkout না, হোম পেজও কেন অচল হয়?'
      a: 'ধীর call-গুলো সব worker আটকে রাখে। হোম পেজের request ধরার মতো কোনো খালি worker থাকে না।'

  - slug: httpclient-timeout-retry
    title: 'Symfony HttpClient: timeout আর retry ঠিকভাবে'
    kind: howto
    tldr: 'Web request-এ ছোট timeout আর retry নয়; queue worker-এ backoff-সহ retry। transport error আর 4xx আলাদা করে ধরুন; POST retry শুধু idempotency key-সহ।'
    keywords: ['HttpClient', 'scoped_clients', 'retry_failing', 'max_duration', 'exponential backoff', 'jitter']
    blocks:
      - type: text
        body: |
          Vendor-এর জন্য **scoped client** বানান: base URL, key, timeout আর retry এক জায়গায়। **timeout** মানে নীরব থাকার সর্বোচ্চ সময়, **max_duration** পুরো request-এর সীমা। retry-তে সাবধান। `max_duration: 3` আর সেকেন্ডে ১০ checkout হলে web request বড়জোর ১০ × ৩ = ৩০টা worker ধরে রাখে, ৫০-এর মধ্যে। কিন্তু ৩ বার retry যোগ করলে একটা request একটা worker-কে ১৫ সেকেন্ডের বেশি আটকে রাখতে পারে, আর সাইট আবার অচল। তাই web client কখনো retry করে না; queue-worker client করে, বাড়তে থাকা অপেক্ষায় (**exponential backoff**) আর একটু এলোমেলো করে (**jitter**), নইলে সবাই একসাথে আবার ধাক্কা দেয়।
      - type: code
        lang: yaml
        file: 'config/packages/framework.yaml'
        variant: good
        code: |
          framework:
            http_client:
              scoped_clients:
                gateway.client:               # web request: দ্রুত হার মানা, retry নয়
                  base_uri: '%env(GATEWAY_URL)%'
                  auth_bearer: '%env(GATEWAY_KEY)%'
                  timeout: 2          # চুপচাপ থাকার সর্বোচ্চ সময় (সেকেন্ড)
                  max_duration: 3     # পুরো request-এর সীমা
                gateway.worker_client:        # queue worker: ধৈর্যশীল, retry-সহ
                  base_uri: '%env(GATEWAY_URL)%'
                  auth_bearer: '%env(GATEWAY_KEY)%'
                  timeout: 3
                  max_duration: 10
                  retry_failing:
                    max_retries: 3
                    delay: 500        # প্রথম অপেক্ষা (ms)
                    multiplier: 2     # ৫০০, ১০০০, ২০০০
                    jitter: 0.3       # ±৩০% এলোমেলো
                    http_codes: [429, 502, 503, 504]
        marks:
          - {line: 7, tip: 'সার্ভার ২ সেকেন্ড কিছু না পাঠালে TransportException ওঠে। worker আর আটকে থাকে না।'}
          - {line: 8, tip: 'ধীরে ধীরে উত্তর ঝরাতে থাকলেও ৩ সেকেন্ডের বেশি অপেক্ষা নয়। সেকেন্ডে ১০ request বড়জোর ৩০টা worker ধরে, ২০টা খালি থাকে।'}
          - {line: 18, tip: 'এলোমেলো বিরতি না থাকলে হাজার client একই মুহূর্তে retry করে vendor-কে আবার ধসিয়ে দেয়।'}
      - type: code
        lang: php
        file: 'src/Payment/AcmeClient.php'
        variant: good
        code: |
          public function __construct(private HttpClientInterface $gatewayClient) {}

          public function charge(string $key, int $amountMinor): array
          {
              try {
                  return $this->gatewayClient->request('POST', '/charges', [
                      'headers' => ['Idempotency-Key' => $key],
                      'json' => ['amount' => $amountMinor, 'currency' => 'BDT'],
                  ])->toArray();
              } catch (TransportExceptionInterface|ServerExceptionInterface) {
                  throw new OutcomeUnknown();      // টাকা কেটেছে কি না জানি না
              } catch (ClientExceptionInterface $e) {
                  throw new ChargeRejected($e->getResponse()->getStatusCode());
              }
          }
        marks:
          - {line: 1, tip: '`gateway.client` scoped client-টা `$gatewayClient` নামের argument-এ নিজে থেকে inject হয়। worker-টা হবে `$gatewayWorkerClient`।'}
          - {line: 7, tip: 'POST কখনো retry হলে (worker client-এ, বা পরে আমরা করলে) টাকা দুইবার কাটতে পারে। তাই একই Idempotency-Key প্রতিবার যায়।'}
          - {line: 10, tip: 'timeout বা 5xx মানে "ব্যর্থ" নয়, মানে "জানি না"। এই অবস্থা আলাদা করে সামলাতে হয়।'}
          - {line: 12, tip: '4xx মানে আমাদের request-ই ভুল বা প্রত্যাখ্যাত। retry করে লাভ নেই।'}
    aside:
      - type: pitfalls
        items:
          - 'সব error-এ retry করবেন না। 4xx (ভুল request) retry করলে একই ভুল আবার হয়।'
          - 'Web request-এর ভেতরে retry করবেন না: ৩ সেকেন্ডের ৪টা চেষ্টা একটা worker-কে ১৫ সেকেন্ড বা বেশি আটকায়। retry করুন queue worker থেকে।'
      - type: refs
        items:
          - {to: 'payments/unknown-outcomes', label: 'Timeout-এর পর "জানি না" অবস্থা'}
          - {to: 'payments/idempotency-keys', label: 'Idempotency key'}
    check:
      q: 'Retry-তে `jitter` না দিলে কী সমস্যা, আর POST retry-তে কোন header জরুরি?'
      a: 'হাজার client একই মুহূর্তে retry করে vendor-কে আবার ধসিয়ে দেয়। POST-এ একই Idempotency-Key পাঠান, যাতে টাকা দুইবার না কাটে।'

  - slug: rate-limits-outgoing
    title: 'Rate limit: কুরিয়ারের ফোন লাইনের ভিড়'
    kind: howto
    tldr: 'Vendor প্রতি সেকেন্ডে সীমিত call নেয়; 429 এলে থামুন, আর নিজের দিক থেকেও Symfony RateLimiter দিয়ে call-এর গতি বেঁধে দিন।'
    keywords: ['rate limit', '429', 'RateLimiter', 'token bucket', 'throttle', 'ধীর করা']
    blocks:
      - type: metaphor
        icon: truck
        title: 'কুরিয়ার অফিসের ফোন লাইন'
        body: |
          কুরিয়ার অফিসে একসাথে সীমিত কল ধরা যায়। এক মিনিটে ১০০ বার ফোন করলে তারা আপনার নম্বরই আটকে দেয়। বুদ্ধিমান ক্লায়েন্ট তাই নিজেই ঠিক করে নেয় — মিনিটে সর্বোচ্চ ২০ বার ফোন, আর "ব্যস্ত" শুনলে খানিক অপেক্ষা। এই নিজের বেঁধে নেওয়া গতিই client-side rate limiter।
      - type: visual
        kind: flow
        caption: 'নিজের limiter আগে থামায়; তবু 429 এলে অপেক্ষা'
        nodes:
          - {id: app, label: 'আমাদের অ্যাপ', icon: server, col: 0, row: 1, tip: 'vendor-কে ডাকার আগে limiter-কে জিজ্ঞেস করে "এখন পাঠাতে পারি?"'}
          - {id: lim, label: 'RateLimiter', sub: 'সেকেন্ডে ৫০', icon: stopwatch, tone: accent, col: 2, row: 0, tip: 'token bucket: সেকেন্ডে ৫০টা টোকেন ভরে। টোকেন না থাকলে অপেক্ষা।'}
          - {id: vendor, label: 'গেটওয়ে', sub: 'সীমা ৬০/সেকেন্ড', icon: cloud, col: 4, row: 1, tip: 'vendor-এর নিজের সীমা। আমরা তার নিচে থাকতে চাই।'}
        edges:
          - {from: app, to: lim, label: 'call-এর আগে একটা token চায়'}
          - {from: lim, to: vendor, label: 'token পেলে call যায়'}
          - {from: vendor, to: app, label: 'তবু 429 এলে অ্যাপ retry-র আগে অপেক্ষা করে', dashed: true, tone: warn}
      - type: code
        lang: yaml
        file: 'config/packages/rate_limiter.yaml'
        variant: good
        code: |
          framework:
            rate_limiter:
              gateway_outgoing:
                policy: 'token_bucket'
                limit: 50
                rate: { interval: '1 second', amount: 50 }
        marks:
          - {line: 5, tip: 'bucket-এ সর্বোচ্চ ৫০ token জমে। হঠাৎ ভিড়ে এতগুলো একসাথে যেতে পারে।'}
          - {line: 6, tip: 'প্রতি সেকেন্ডে ৫০টা করে token আবার ভরে। এটাই দীর্ঘমেয়াদি গতি।'}
      - type: code
        lang: php
        file: 'src/Payment/AcmeClient.php'
        variant: good
        code: |
          public function __construct(
              private HttpClientInterface $gatewayClient,
              private RateLimiterFactory $gatewayOutgoingLimiter,
          ) {}

          private function throttle(): void
          {
              $this->gatewayOutgoingLimiter->create('acme')
                  ->reserve(1, maxTime: 2.0)    // সর্বোচ্চ ২ সেকেন্ড অপেক্ষা
                  ->wait();
          }
        marks:
          - {line: 3, tip: 'config-এর নাম `gateway_outgoing` থেকে `$gatewayOutgoingLimiter` নামে নিজে থেকে inject হয়।'}
          - {line: 9, tip: 'দুই সেকেন্ডের বেশি অপেক্ষা লাগলে exception ওঠে; worker অনির্দিষ্টকাল ঘুমিয়ে থাকে না।'}
    aside:
      - type: tips
        items:
          - 'web request-এ `wait()` না করে আগেই 503 দেওয়া ভালো; লম্বা অপেক্ষা queue-র worker-এ মানায়।'
          - 'limiter-এর অবস্থা cache-এ থাকে, তাই কয়েকটা server মিলে একই সীমা মানে।'
    check:
      q: 'Vendor-এর সীমা ৬০/সেকেন্ড হলে নিজের limiter ৫০ রাখা হলো কেন?'
      a: 'নিচে থাকলে 429 প্রায় আসেই না। সীমার ঠিক গায়ে চললে সামান্য ভিড়েই vendor আমাদের আটকে দেয়।'

  - slug: wrap-the-vendor
    title: 'Vendor-কে নিজের interface-এর পেছনে রাখুন'
    kind: concept
    tldr: 'Domain নিজের `PaymentGateway` interface চেনে; vendor-এর ভাষা শুধু একটা adapter-এ থাকে, তাই vendor বদলালে বাকি কোড ছোঁয়া লাগে না।'
    keywords: ['adapter', 'port', 'vendor lock-in', 'exit plan', 'interface', 'anti-corruption layer']
    blocks:
      - type: text
        body: |
          দেয়াল ছাড়া Acme-র `state` field আর error কোড ছড়িয়ে পড়ে checkout, refund আর রিপোর্টে। যেদিন Acme ফি দ্বিগুণ করে, সেদিন ওই প্রতিটা জায়গা খুঁজে বদলাতে হয়। একেই বলে **vendor lock-in**।
      - type: metaphor
        icon: plug
        title: 'দেয়ালের সকেট আর অ্যাডাপ্টার'
        body: |
          আপনার বাড়ির সব যন্ত্র একটা সাধারণ সকেটে লাগে। বিদেশি প্লাগ হলে মাঝখানে একটা অ্যাডাপ্টার লাগে, আর যন্ত্র নিজে বদলাতে হয় না। কোডে **interface** হলো সকেট, আর **adapter** সেই অ্যাডাপ্টার। vendor বদলালে শুধু অ্যাডাপ্টার বদলায়।
      - type: visual
        kind: flow
        caption: 'Domain শুধু interface চেনে, vendor-এর কথা জানে না'
        nodes:
          - {id: domain, label: 'Checkout', sub: 'আমাদের domain', icon: cart, col: 0, row: 1, tip: 'ব্যবসার নিয়ম এখানে। vendor-এর নাম, field বা error কোড এখানে ঢোকে না।'}
          - {id: port, label: 'PaymentGateway', sub: 'interface', icon: plug, tone: accent, col: 2, row: 1, tip: 'আমাদের নিজের সকেট: charge(ChargeRequest): ChargeResult। vendor যা-ই হোক, আকার একই।'}
          - {id: acme, label: 'AcmePayGateway', sub: 'adapter', icon: cloud, col: 4, row: 0, tip: 'Acme-র JSON, field, error কোড আমাদের ভাষায় অনুবাদ করে।'}
          - {id: other, label: 'OtherPayGateway', sub: 'ভবিষ্যতের adapter', icon: cloud, tone: muted, col: 4, row: 2, tip: 'vendor বদলালে শুধু এই নতুন adapter লিখতে হয়।'}
        edges:
          - {from: domain, to: port, label: 'Checkout শুধু interface-কে ডাকে'}
          - {from: port, to: acme, label: 'আজ interface-এর পেছনে Acme-র adapter'}
          - {from: port, to: other, label: 'কাল চাইলে এখানে অন্য vendor বসানো যায়', dashed: true, tone: muted}
      - type: code
        lang: php
        file: 'src/Payment/AcmePayGateway.php'
        variant: good
        code: |
          interface PaymentGateway
          {
              /** @throws GatewayUnavailable|GatewayDeclined */
              public function charge(ChargeRequest $request): ChargeResult;
          }

          final readonly class AcmePayGateway implements PaymentGateway
          {
              public function __construct(private AcmeClient $client) {}

              public function charge(ChargeRequest $r): ChargeResult
              {
                  $raw = $this->client->charge($r->key, $r->money->amount);

                  return new ChargeResult(
                      vendorRef: $raw['id'],
                      status: 'paid' === $raw['state'] ? ChargeStatus::Paid : ChargeStatus::Pending,
                  );
              }
          }
        marks:
          - {line: 4, tip: 'interface-এ শুধু আমাদের নিজের type: ChargeRequest, ChargeResult। Acme-র কিছু নেই।'}
          - {line: 17, tip: 'Acme-র "state" নামের field আর "paid" মান এই এক জায়গাতেই আমাদের enum-এ অনুবাদ হয়।'}
      - type: points
        title: 'Vendor-কে ছেড়ে যাওয়ার (exit) পরিকল্পনা'
        style: check
        items:
          - 'প্রতিটা লেনদেনে vendor-এর নাম আর vendor reference নিজের টেবিলে রাখুন।'
          - 'Vendor-এর ডেটা (গ্রাহক, টোকেন, ইতিহাস) বের করে আনার উপায় চুক্তিতে লিখিয়ে নিন।'
          - 'নতুন vendor-এর adapter লিখে কিছুদিন পাশাপাশি চালিয়ে দেখুন।'
    aside:
      - type: when
        use:
          - 'যে vendor বদলানো ব্যয়বহুল বা ঝুঁকিপূর্ণ (পেমেন্ট, SMS, ইমেইল)'
        avoid:
          - 'একবার-ব্যবহারের ছোট tool-এ পুরো adapter স্তর অকারণ বাড়তি কাজ'
      - type: refs
        items:
          - {to: 'thinking/build-vs-buy', label: 'Build বনাম buy'}
          - {to: 'thinking/hexagonal', label: 'Hexagonal architecture'}
    check:
      q: 'Vendor বদলালে কেন শুধু একটা class বদলায়?'
      a: 'vendor-এর field, error আর ভাষা শুধু adapter-এ আছে। বাকি কোড নিজের interface ও type চেনে, তাই ছোঁয়াই লাগে না।'

  - slug: adapter-price
    title: 'ফি বাড়ল: adapter কী দেয়, আর কী নেয়'
    kind: compare
    tldr: 'Adapter থাকলে vendor বদল মানে একটা নতুন class আর একটা alias বদল। দাম: বাড়তি কোড, আর interface-এ শুধু সব vendor-এর সাধারণ ফিচার। যেখানে ছাড়া কষ্টের, সেখানে ব্যবহার করুন।'
    keywords: ['vendor lock-in', 'adapter cost', 'leaky abstraction', 'switching cost', 'exit plan', 'ট্রেড-অফ']
    blocks:
      - type: text
        body: |
          Acme জানাল, আগামী মাস থেকে তাদের ফি ১.৫% থেকে ২.৫%। আপনি মাসে প্রায় ৩,০০,০০,০০০ টাকা তাদের দিয়ে পাঠান, তাই প্রতি মাসে ৩,০০,০০০ টাকা বেশি যাবে। এক প্রতিদ্বন্দ্বী ১.২% চায়, নতুন দামের তুলনায় যা মাসে ৩,৯০,০০০ টাকা বাঁচায়। Adapter না থাকলে `$raw['state']` আর Acme-র error কোড প্রায় ৪০টা ফাইলে ছড়ানো; বদলানো মানে কয়েক মাসের refactor, তাই আপনি বাড়তি ফি-ই দেন। Adapter থাকলে `OtherPayGateway` লিখুন, পুরনোটার পাশাপাশি চালিয়ে দেখুন, আর একটা লাইন বদলান।
      - type: code
        lang: yaml
        file: 'config/services.yaml'
        variant: good
        code: |
          services:
              App\Payment\PaymentGateway:
                  alias: App\Payment\OtherPayGateway   # আগে ছিল AcmePayGateway
        marks:
          - {line: 3, tip: 'শুধু এই লাইনটা বদলায়। `PaymentGateway` চায় এমন প্রতিটা class এখন নতুন adapter পায়।'}
      - type: visual
        kind: compare
        caption: 'Adapter: কী লাভ, কী দাম'
        columns:
          - title: 'কী দেয়'
            tone: good
            icon: check
            tip: 'লাভটা দেখা যায় যেদিন vendor ছাড়তে হয়।'
            items:
              - 'Vendor বদলালে ৪০টা ফাইল নয়, একটা class বদলায়'
              - 'ফি নিয়ে দর-কষাকষিতে সত্যিকারের বিকল্প থাকে'
              - 'Test-এ নেটওয়ার্ক ছাড়াই নকল gateway চলে'
          - title: 'কী নেয়'
            tone: warn
            icon: warning
            tip: 'প্রতিদিনের দাম, ভবিষ্যতে বদলান বা না বদলান।'
            items:
              - 'একটা interface, adapter আর test লিখে হালনাগাদ রাখতে হয়'
              - 'Interface-এ শুধু সব vendor-এর সাধারণ ফিচার ধরে'
              - 'এক vendor দেখে interface বানালে সেটা তারই ছায়া হয়, অন্যটার সাথে মেলে না'
      - type: quote
        body: 'যে vendor ছাড়া কষ্টের তাকে মুড়ে রাখুন। বাকিদের সরাসরি ডাকুন।'
    aside:
      - type: when
        use:
          - 'টাকা, SMS, ইমেইল বা পরিচয় যাচাই: ছাড়া ব্যয়বহুল, আর সত্যিকারের বিকল্প আছে'
        avoid:
          - 'একবারের tool, বা বিকল্পহীন vendor: adapter এমন কোড যা কখনো কাজে লাগে না'
      - type: tips
        items:
          - 'Interface বানান আপনার domain-এর দরকার ধরে (charge, refund, status), Acme-র API ধরে নয়।'
          - 'একটা contract test লিখুন যা প্রতিটা adapter-কে পাস করতে হয়। এতেই বোঝা যায় নতুন vendor সত্যিই একই আচরণ করে।'
    check:
      q: 'Adapter কী দেয় আর কী নেয়, একটা করে বলুন।'
      a: 'দেয়: vendor বদলালে একটা class বদলায়। নেয়: বাড়তি কোড আর test, আর interface-এ শুধু সব vendor-এর সাধারণ ফিচার ধরে।'

  - slug: sandbox-is-not-production
    title: 'Sandbox-এ সব ঠিক, production-এ কেন ভাঙে'
    kind: pitfall
    tldr: 'Sandbox দ্রুত, সবসময় সফল আর ভিড়হীন; production ধীর, ব্যর্থ ও সীমাবদ্ধ। শুধু sandbox-এ পরীক্ষা করা কোড production-এ অবাক করে।'
    keywords: ['sandbox', 'production', 'staging', 'test environment', 'secrets', 'সীমাবদ্ধতা']
    blocks:
      - type: text
        body: |
          Sandbox হলো vendor-এর খেলার মাঠ: নকল ডেটা, নকল টাকা, কখনো ভিড় নেই। এখানে পরীক্ষা পাস করা কোড সত্যিকারের গ্রাহকে প্রথম ধাক্কা খায়। সম্ভাব্য পার্থক্যগুলো আগে থেকে জেনে রাখলে production চালুর দিন কম অবাক হবে।
      - type: visual
        kind: table
        caption: 'Sandbox আর production-এর সাধারণ পার্থক্য'
        headers: ['দিক', 'Sandbox', 'Production']
        rows:
          - cells: ['গতি', 'সবসময় দ্রুত', 'ধীর হয়, ভিড়ে আরও']
            tip: 'sandbox-এ timeout কখনো ঘটে না, তাই timeout-এর কোড পরীক্ষাই হয় না।'
          - cells: ['ব্যর্থতা', 'প্রায় কখনো না', 'ব্যাংক-এর ব্যর্থতা, ওটিপি, limit']
            tip: 'আসল কার্ড ও ব্যাংক নানা কারণে ফেরত দেয়। failure path-ই production-এর বেশি কাজ।'
          - cells: ['Rate limit', 'ঢিলা বা নেই', 'কড়া, প্রতিটা key-র আলাদা']
            tip: 'সীমা production-এ কম-বেশি আলাদা হতে পারে; চুক্তি বা ড্যাশবোর্ডে দেখে নিন।'
          - cells: ['Webhook', 'তাৎক্ষণিক, সবসময় আসে', 'দেরিতে, দুইবার বা ক্রম ভেঙে']
            tip: 'সত্যিকারের webhook retry, duplicate আর দেরি করে আসে।'
          - cells: ['Key আর ডেটা', 'নকল key, নকল গ্রাহক', 'আসল key, আসল টাকা']
            tip: 'key আলাদা, তাই ভুল env-এ ভুল key বসানোর ঝুঁকি আছে।'
      - type: code
        lang: bash
        file: 'terminal'
        variant: good
        code: |
          # .env-তে শুধু sandbox ডিফল্ট (commit করা)
          GATEWAY_URL=https://sandbox.acmepay.example/v2

          # production key কখনো ফাইলে নয়, secrets vault-এ
          php bin/console secrets:set GATEWAY_KEY --env=prod
          php bin/console secrets:set GATEWAY_URL --env=prod
        marks:
          - {line: 2, tip: 'ডিফল্ট sandbox রাখলে ভুল করে কেউ লোকাল মেশিন থেকে আসল টাকা নাড়াতে পারে না।'}
          - {line: 5, tip: 'আসল key vault-এ থাকে; git-এ কখনো ওঠে না।'}
      - type: quote
        body: 'Sandbox শুধু কোডের জোড় পরীক্ষা করে। timeout, ব্যর্থতা আর duplicate নিজে বানিয়ে পরীক্ষা করুন।'
    aside:
      - type: tips
        items:
          - 'পরীক্ষায় নিজে ধীর বা ব্যর্থ vendor বানান: Symfony-র `MockHttpClient` দিয়ে timeout, 429, 503 নকল করা যায়।'
          - 'চালুর দিন প্রথম কয়েকটা আসল লেনদেন নিজে দেখুন, আর [[ledgers/reconciliation|হিসাব মেলানো]] job চালু রাখুন।'
    check:
      q: 'Sandbox-এ কেন timeout-এর কোড কখনো পরীক্ষা হয় না, আর কীভাবে পরীক্ষা করবেন?'
      a: 'Sandbox সবসময় দ্রুত সাড়া দেয়, তাই timeout ঘটেই না। `MockHttpClient`-এ ধীর বা ব্যর্থ উত্তর নকল করে পরীক্ষা করুন।'

flashcards:
  - q: 'কেন বাইরের API call-এ সবসময় timeout দিতে হয়?'
    a: 'নইলে vendor ধীর হলে আমাদের worker-গুলো উত্তরের অপেক্ষায় আটকে যায়, আর পুরো সাইট অচল হয়।'
    more: |
      PHP-র প্রতিটা worker একসাথে একটা request ধরে। ৫০ worker আর সেকেন্ডে ১০ ধীর call হলে ৫ সেকেন্ডেই সবাই আটকে যায়। তখন vendor-এর সাথে সম্পর্কহীন পাতাও সাড়া দেয় না।
    ref: slow-vendor-stops-us
  - q: 'Symfony HttpClient-এ `timeout` আর `max_duration`-এর পার্থক্য কী?'
    a: '`timeout` চুপচাপ থাকার সর্বোচ্চ সময়। `max_duration` পুরো request-এর মোট সময়ের সীমা।'
    more: |
      শুধু `timeout` থাকলে ধীরে ধীরে ঝরঝর করে উত্তর পাঠানো server আমাদের অনেকক্ষণ ধরে রাখতে পারে। `max_duration` সেই পথ বন্ধ করে।
    ref: httpclient-timeout-retry
  - q: 'Retry-তে exponential backoff আর jitter কী কাজে লাগে?'
    a: 'Backoff প্রতি চেষ্টায় অপেক্ষা বাড়ায় (৫০০, ১০০০, ২০০০ ms)। Jitter তাতে এলোমেলো ফাঁক যোগ করে, যাতে সবাই একসাথে না ধাক্কা দেয়।'
    more: |
      সবাই একই মুহূর্তে retry করলে ধসে পড়া vendor আবার ধসে। jitter থাকলে retry-গুলো সময়ের ওপর ছড়িয়ে যায়, আর vendor দম নিতে পারে।
    ref: httpclient-timeout-retry
  - q: 'কোন HTTP উত্তরে retry করা যায়, আর কোনটায় যায় না?'
    a: 'সাময়িক সমস্যায় (429, 502, 503, 504, timeout) করা যায়। 4xx ভুল request-এ নয়, কারণ ভুল আবার ঘটবে।'
    more: |
      POST retry-এর আগে নিশ্চিত হও যে Idempotency-Key যাচ্ছে। নইলে প্রথম call আসলে সফল হলে টাকা দুইবার কাটে।
    ref: httpclient-timeout-retry
  - q: 'Vendor 429 পাঠালে কী বোঝায়, আর ঠিক আচরণ কী?'
    a: 'বোঝায় আমরা তার সীমা ছাড়িয়েছি। থেমে, বাড়তে থাকা বিরতিতে আবার চেষ্টা করতে হয়, আর নিজের call-এর গতি কমাতে হয়।'
    more: |
      সীমার নিচে থাকতে Symfony RateLimiter (token bucket) দিয়ে নিজের outgoing call-ও বেঁধে দেওয়া যায়, যাতে 429 প্রায় আসেই না।
    ref: rate-limits-outgoing
  - q: 'Vendor-কে নিজের interface-এর পেছনে রাখার (adapter) লাভ কী?'
    a: 'vendor-এর field আর error শুধু একটা class-এ থাকে। vendor বদলালে শুধু নতুন adapter লিখতে হয়, বাকি কোড অক্ষত।'
    more: |
      interface-এ থাকে আমাদের নিজের type, যেমন `ChargeRequest`, `ChargeResult`। এতে vendor lock-in কমে, আর পরীক্ষায় নকল adapter বসানো সহজ হয়।
    ref: wrap-the-vendor
  - q: 'Web request কেন বাইরের call retry করবে না?'
    a: 'প্রতিটা চেষ্টা worker আটকায়। ৩ সেকেন্ডের ৪ চেষ্টা ১৫ সেকেন্ড বা বেশি ধরে, আর সেকেন্ডে ১০ request-এ ৫০টা worker-ই আটকে যায়।'
    more: |
      Web client দ্রুত হার মানে: ছোট timeout, retry নয়। backoff আর jitter-সহ retry থাকে queue worker-এ, যেখানে অপেক্ষা করলে পেজ দেখা কারো আটকায় না।
    ref: httpclient-timeout-retry
  - q: 'Vendor-কে adapter-এর পেছনে রাখার দাম কী?'
    a: 'বাড়তি কোড আর test সামলাতে হয়, আর interface-এ শুধু সব vendor-এর সাধারণ ফিচার ধরে। এক vendor-এর API দেখে বানালে অন্যটার সাথে মেলে না।'
    more: |
      দামটা দিন সেখানে, যেখানে ছাড়া কষ্টের: টাকা, SMS, ইমেইল, পরিচয় যাচাই। একবারের tool বা বিকল্পহীন vendor-এ সরাসরি client ডাকা সস্তা। Interface বানান নিজের domain ধরে, আর একটা contract test রাখুন যা প্রতিটা adapter-কে পাস করতে হয়।
    ref: adapter-price
  - q: 'Vendor lock-in থেকে বেরোনোর জন্য আগে থেকে কী রাখা উচিত?'
    a: 'প্রতিটা লেনদেনে vendor-এর নাম ও reference নিজের টেবিলে, ডেটা বের করার অধিকার চুক্তিতে, আর নতুন adapter পাশাপাশি চালানোর সুযোগ।'
    more: |
      Exit plan পরে বানাতে গেলে ডেটাই খুঁজে পাওয়া যায় না। শুরুতেই নিজের টেবিলে vendor reference রাখলে migration-এর হিসাব সহজ হয়।
    ref: wrap-the-vendor
  - q: 'Sandbox-এ সফল হলেও production-এ কেন ভাঙতে পারে?'
    a: 'Sandbox দ্রুত, প্রায় ব্যর্থতাহীন আর rate-limit-হীন। production-এ ধীরতা, ব্যর্থতা, duplicate webhook আর কড়া সীমা থাকে।'
    more: |
      তাই timeout, 429, ব্যর্থ কার্ড আর duplicate webhook নিজে নকল করে পরীক্ষা করতে হয়। Symfony-র `MockHttpClient` এ কাজে লাগে।
    ref: sandbox-is-not-production

quiz:
  - q: 'নিচের কনফিগে একটা গুরুতর ফাঁক আছে। কী সেটা?'
    lang: yaml
    code: |
      framework:
        http_client:
          scoped_clients:
            sms.client:
              base_uri: '%env(SMS_URL)%'
              auth_bearer: '%env(SMS_KEY)%'
    hint: 'vendor ধীর হলে কী হবে?'
    options:
      - text: 'কোনো timeout/max_duration নেই; vendor ধীর হলে worker আটকে যাবে'
        correct: true
        why: 'ডিফল্ট অপেক্ষা অনেক লম্বা। প্রতিটা vendor-এর জন্য timeout আর max_duration স্পষ্ট ঠিক করতে হয়।'
      - text: '`auth_bearer`-এ env ব্যবহার করা উচিত নয়'
        correct: false
        why: 'env দিয়ে key রাখাই ঠিক পদ্ধতি; সমস্যা এটা নয়।'
      - text: 'scoped client-এর নামে ডট থাকা ভুল'
        correct: false
        why: '`sms.client` পুরোপুরি বৈধ নাম; `$smsClient` নামে inject হয়।'
      - text: '`base_uri` থাকলে অন্য কিছু লাগে না'
        correct: false
        why: 'base_uri শুধু ঠিকানা ঠিক করে; সময়সীমা আলাদা করে লাগে।'
    ref: httpclient-timeout-retry
  - q: 'গেটওয়েতে POST /charges করার পর timeout হলো। অ্যাপ কী করা উচিত?'
    hint: 'টাকা কেটেছে কি না আমরা জানি কি?'
    options:
      - text: 'নতুন Idempotency-Key দিয়ে আবার চেষ্টা করা'
        correct: false
        why: 'প্রথম call সফল হয়ে থাকলে নতুন key-তে টাকা দুইবার কাটবে।'
      - text: 'সরাসরি "ব্যর্থ" দেখানো আর order বাতিল করা'
        correct: false
        why: 'timeout মানে "জানি না"। টাকা কেটে গিয়ে থাকলে গ্রাহক টাকা দিয়েও order পাবে না।'
      - text: 'অবস্থাটা "অজানা" চিহ্নিত রেখে একই key-তে আবার চেষ্টা বা status পরীক্ষা করা'
        correct: true
        why: 'একই key-তে আবার পাঠালে দ্বিতীয়বার টাকা কাটে না; অন্য উপায়ে status জেনেও নিশ্চিত হওয়া যায়।'
      - text: '"সফল" ধরে নিয়ে order নিশ্চিত করা'
        correct: false
        why: 'সফল হয়েছে কি না আমরা জানি না। না জেনে ধরে নেওয়াও ভুল।'
    ref: httpclient-timeout-retry
  - q: 'নিচের কোনগুলো Symfony HttpClient retry সাজানোর ভালো অভ্যাস?'
    hint: 'অপেক্ষা, ছড়ানো আর কোন error retry-যোগ্য — এই তিনটা ভাবুন।'
    options:
      - text: 'প্রতি চেষ্টায় অপেক্ষা বাড়ানো (multiplier)'
        correct: true
        why: 'vendor সেরে ওঠার সময় পায়।'
      - text: 'jitter দিয়ে retry-র সময় এলোমেলো করা'
        correct: true
        why: 'সব client একই মুহূর্তে ধাক্কা দেয় না।'
      - text: '429 আর 503-এ retry করা, 400-এ নয়'
        correct: true
        why: '429/503 সাময়িক সমস্যা; 400 মানে request ভুল, আবার পাঠালে একই ফল।'
      - text: 'সব error-এ বিরতি ছাড়াই যতবার সম্ভব retry করা'
        correct: false
        why: 'এতে vendor আরও চাপে পড়ে আর ভুল request অকারণ বারবার যায়।'
    ref: httpclient-timeout-retry
  - q: 'Vendor-এর সীমা ১০০ call/সেকেন্ড। একটা চাকরি হঠাৎ ৫০০ call পাঠাল আর অনেকগুলো 429 পেল। কোন সমাধানটা সবচেয়ে ভালো?'
    hint: 'সমস্যা শুরু হচ্ছে আমাদের দিকে।'
    options:
      - text: 'নিজের দিকে token bucket limiter বসিয়ে গতি ~৮০/সেকেন্ডে রাখা'
        correct: true
        why: 'সীমার নিচে থাকলে 429 প্রায় আসেই না; vendor আমাদের আটকাতেও পারে না।'
      - text: 'বিরতি ছাড়াই 429 পেলেই সাথে সাথে আবার পাঠানো'
        correct: false
        why: 'তাতে আরও 429 আসে আর ব্যবহারকারী আটকে যাওয়ার ঝুঁকি বাড়ে।'
      - text: 'দ্বিতীয় API key বানিয়ে সীমা ফাঁকি দেওয়া'
        correct: false
        why: 'চুক্তি ভাঙার ঝুঁকি; vendor অ্যাকাউন্ট আটকে দিতে পারে।'
      - text: 'timeout বাড়িয়ে ৬০ সেকেন্ড করা'
        correct: false
        why: 'সমস্যা গতির সীমা; অপেক্ষা বাড়ালে worker আরও আটকায়।'
    ref: rate-limits-outgoing
  - q: 'একটা web request `timeout: 3` আর `max_retries: 3` নিয়ে গেটওয়ে ডাকে। সেকেন্ডে ১০ request, ৫০ worker; গেটওয়ে মরে গেল। কী হবে?'
    hint: 'চারটা চেষ্টা আর মাঝের অপেক্ষা মিলিয়ে একটা request কতক্ষণ worker ধরে রাখে?'
    options:
      - text: 'প্রতিটা request ১৫ সেকেন্ড বা বেশি worker ধরে রাখে, তাই প্রায় ৫ সেকেন্ডেই ৫০টা worker আটকে যায়'
        correct: true
        why: '৪টা চেষ্টা × ৩ সেকেন্ড আর ৩.৫ সেকেন্ড অপেক্ষা মিলে প্রায় ১৫.৫ সেকেন্ড। সেকেন্ডে ১০ × ১৫ মানে ৫০টা worker-এর চেয়ে অনেক বেশি।'
      - text: 'কিছুই হবে না; ৩ সেকেন্ডের timeout সাইটকে বাঁচায়'
        correct: false
        why: 'timeout প্রতি চেষ্টায়। retry-গুলো worker ধরে রাখার সময় গুণ করে দেয়।'
      - text: 'retry কাজে লাগবে, কারণ গেটওয়ে ঠিক সময়ে সেরে উঠবে'
        correct: false
        why: 'সেরে উঠলেও অপেক্ষার সময় worker আটকে ছিল, আর সাইটের সব পেজ ভুগেছে।'
      - text: 'শুধু checkout অচল হবে; বাকি সাইট চলবে'
        correct: false
        why: 'worker সব পেজের সাথে ভাগ করা। সব আটকে গেলে হোম পেজের জন্য একটাও থাকে না।'
    ref: httpclient-timeout-retry
  - q: 'আপনি Acme দিয়ে মাসে ৩,০০,০০,০০০ টাকা পাঠান। তাদের ফি ১.৫% থেকে ২.৫% হলো; প্রতিদ্বন্দ্বী ১.২% চায়। বদলালে কত বাঁচে, আর কী সেটা সহজ করে?'
