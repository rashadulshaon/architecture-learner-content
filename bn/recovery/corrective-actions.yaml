slides:
  - slug: silent-update-in-prod
    title: 'Production-এ চুপচাপ UPDATE: ঠিক করতে গিয়ে আরও ভুল'
    kind: story
    tldr: 'খারাপ ডেটা দেখে console-এ তাড়াহুড়ো UPDATE চালালে কোনো প্রমাণ থাকে না, সঠিক সারিও বদলে যেতে পারে, আর পরে কেউ বুঝতে পারে না কী হয়েছিল।'
    keywords: ['data fix', 'silent edit', 'production console', 'audit', 'bad data', 'ডেটা শুধরানো']
    blocks:
      - type: text
        body: |
          একটা খারাপ deploy দুই ঘণ্টায় ২৩০০টা পেমেন্ট-হওয়া অর্ডার ভুল করে `cancelled` করে দিল। ইঞ্জিনিয়ার তাড়াহুড়োয় production console-এ চালাল `UPDATE orders SET status = 'paid' WHERE status = 'cancelled'`। ২৩০০টা ঠিক হলো, কিন্তু আরও ৮০০টা সত্যিকারের বাতিল অর্ডারও `paid` হয়ে গেল। কেউ লিখে রাখেনি কোন সারি বদলাল।
      - type: visual
        kind: sequence
        caption: 'এক লাইনের UPDATE, কোনো প্রমাণ নেই'
        actors:
          - {id: dep, label: 'খারাপ deploy', icon: rocket, tip: 'নতুন কোডে bug ছিল, যা ভুল করে paid অর্ডার cancelled করেছে।'}
          - {id: eng, label: 'ইঞ্জিনিয়ার', icon: terminal, tip: 'ভালো উদ্দেশ্যে তাড়াতাড়ি ঠিক করতে চায়। কিন্তু তাড়াহুড়োয় শর্ত বড় হয়ে গেছে।'}
          - {id: db, label: 'Production DB', icon: db, tip: 'যা বলা হয় করে। কোনটা ঠিক সারি, কোনটা ভুল, বোঝে না।'}
        messages:
          - {from: dep, to: db, label: '২৩০০ paid অর্ডার ভুল করে cancelled', tone: bad}
          - {from: eng, to: db, label: "UPDATE ... WHERE status = 'cancelled'", tone: warn, tip: 'শর্তে সময়ের সীমা বা paid payment-এর যাচাই নেই।'}
          - {at: db, note: '৩১০০ সারি বদলাল, ৮০০ ভুলভাবে', tone: bad, tip: 'যে ৮০০ অর্ডার সত্যিই বাতিল ছিল, সেগুলোও এখন paid। তাদের সরবরাহ শুরু হয়ে যেতে পারে।'}
          - {at: eng, note: 'আগের মান কোথাও লেখা নেই', tone: bad, tip: 'এখন আর বোঝার উপায় নেই কোন সারি আগে কী ছিল।'}
      - type: quote
        body: 'ঠিক করাটাও একটা লেনদেন। কে, কখন, কেন, আগে কী ছিল — সব লেখা থাকবে।'
    aside:
      - type: story
        title: 'দুই সপ্তাহ পর'
        body: |
          অ্যাকাউন্টস টিম দেখল পেমেন্ট আর অর্ডারের সংখ্যা মিলছে না। কে বদলাল, কেন, কেউ বলতে পারল না। console-এর কমান্ডের কোনো লগ ছিল না, আর বদলের আগের মানও নেই।
      - type: problem
        body: 'ভুল ডেটা শুধরানো অনিবার্য। সমস্যা হলো কীভাবে, যাতে সেই শুধরানোটাও পরে বোঝা যায় আর ফেরানো যায়।'
    check:
      q: 'ওই UPDATE-টা ৮০০ ভুল সারিও বদলাল কেন?'
      a: 'শর্তটা শুধু `status = cancelled` ছিল। ভুল deploy-এর সময়সীমা আর "paid payment আছে" যাচাই ছাড়া সত্যিকারের বাতিল অর্ডারও ধরা পড়ল।'

  - slug: correction-is-a-record
    title: 'লাল কালির সংশোধন: ঠিক করার চার পথ'
    kind: concept
    tldr: 'মুছে নয়, লিখে ঠিক করুন: ledger-এ reversing আর নতুন entry, অবস্থায় নিয়ম-মেনে transition, derived ডেটা নতুন করে হিসাব, বাকিটা audited script-এ।'
    keywords: ['corrective entry', 'compensating action', 'reversing entry', 'audit log', 'recompute', 'সংশোধন']
    blocks:
      - type: metaphor
        icon: book
        title: 'মুদির খাতার লাল কালি'
        body: |
          খাতায় ভুল অঙ্ক লেখা হলে ভালো দোকানি সেটা ঘষে মোছেন না। লাল কালিতে একটা লাইন লেখেন, "ভুল অঙ্ক বাতিল" আর নিচে সঠিক অঙ্কের নতুন লাইন, সাথে তারিখ ও নাম। মূল ভুলটাও দেখা যায়, সংশোধনও দেখা যায়। ডেটা শুধরানোর ঠিক এই পদ্ধতিই সফটওয়্যারে চলে।
      - type: visual
        kind: table
        caption: 'কোন ধরনের ডেটা কীভাবে শুধরাবেন'
        headers: ['ডেটার ধরন', 'ঠিক করার উপায়', 'কেন']
        rows:
          - cells: ['Ledger (টাকা)', 'reversing entry + নতুন সঠিক entry', 'ইতিহাস অটুট, debit = credit']
            tip: 'টাকার entry কখনো বদলায় না। উল্টো লেনদেন লিখে প্রভাব কেটে নতুন সঠিকটা বসানো হয়।'
          - cells: ['অবস্থা (status)', 'নিয়ম মেনে নতুন transition + history', 'কবে কেন বদলাল থাকে']
            tip: 'সরাসরি status বসানো নয়; নিয়ম-সম্মত পথে বদল করলে কারণসহ ইতিহাস জমে।'
          - cells: ['Derived (balance, cache)', 'উৎস থেকে নতুন করে হিসাব', 'উৎস ঠিক থাকলে ফল বানানো যায়']
            tip: 'derived মান হাতে বদলানো নয়; entry থেকে আবার হিসাব করুন।'
          - cells: ['বাকি ডেটা (ঠিকানা, প্রোফাইল)', 'audited script + data_fix_log', 'আগের মান ফেরত আনা যায়']
            tip: 'প্রতিটা সারির আগের ও পরের মান লগে থাকে, দরকার হলে পুরো ফিক্স উল্টানো যায়।'
      - type: visual
        kind: table
        caption: '৫০০-র জায়গায় ৫০০০ জমা পোস্ট, লাল কালিতে সংশোধন'
        headers: ['Entry', 'Debit', 'Credit', 'টীকা']
        rows:
          - cells: ['E-১ জমা (ভুল)', 'Cash ৫০০০', 'Wallet ৫০০০', 'ভুলটা থাকে']
            tip: 'আসল ভুল পোস্টিং। এটা কখনো বদলানো বা মোছা হয় না।'
          - cells: ['E-২ E-১-এর reversal', 'Wallet ৫০০০', 'Cash ৫০০০', 'E-১ কাটে']
            tip: 'একই দুই অ্যাকাউন্ট, উল্টো পাশে, তাই এর প্রভাব E-১-কে ঠিক কেটে দেয়।'
          - cells: ['E-৩ জমা (সঠিক)', 'Cash ৫০০', 'Wallet ৫০০', 'সঠিক অঙ্ক']
            tip: 'প্রথমবারেই যে জমাটা পোস্ট হওয়া উচিত ছিল।'
          - cells: ['মোট ফল', 'Cash ৫০০', 'Wallet ৫০০', 'Debit = credit']
            tip: 'তিনটা entry যোগ করুন: ৫০০ টাকা ঢুকেছে, দুই পাশ সমান, আর পুরো গল্প দেখা যাচ্ছে।'
      - type: quote
        body: 'মুছে নয়, লিখে ঠিক করুন: ভুলটাও থাকবে, সংশোধনও থাকবে।'
    aside:
      - type: terms
        items:
          - {term: 'Compensating action', meaning: 'আগের কাজের প্রভাব কেটে দেওয়ার উল্টো কাজ, মুছে ফেলা নয়।'}
          - {term: 'Data fix', meaning: 'production ডেটার ভুল ঠিক করার এককালীন, নথিবদ্ধ কাজ।'}
      - type: tips
        items:
          - 'দাম: একটা UPDATE-এর জায়গায় দুই-তিনটা সারি লাগে, আর query-তে reversal জোড়া ধরতে হয়। এই দামেই অডিটের ইতিহাস মেলে।'
          - 'Reversing entry টাকার জন্য। ঠিকানা বা প্রোফাইলের জন্য audited script-ই যথেষ্ট।'
      - type: refs
        items:
          - {to: 'ledgers/double-entry', label: 'Reversing entry'}
          - {to: 'workflows/refunds-reversals', label: 'Refund ও reversal'}
    check:
      q: 'ledger-এ ভুল অঙ্কের entry থাকলে ঠিক করার সঠিক উপায় কী, আর কেন?'
      a: 'উল্টো entry লিখে ভুলের প্রভাব কাটুন, তারপর সঠিক অঙ্কের নতুন entry লিখুন। এতে ইতিহাস অটুট থাকে আর debit = credit ভাঙে না।'

  - slug: audited-data-fix
    title: 'Audited data-fix script: গুনে, লিখে, তারপর বদলান'
    kind: howto
    tldr: 'সংকীর্ণ শর্ত, প্রত্যাশিত সংখ্যা মেলানো, এক transaction, প্রতিটা সারির আগের-পরের মান data_fix_log-এ — আর আবার চালালে কিছু না বদলানো।'
    keywords: ['data_fix_log', 'dry-run', 'expected count', 'CTE UPDATE RETURNING', 'idempotent fix', 'peer review']
    blocks:
      - type: text
        body: |
          Console-এ হাতে লেখা UPDATE-এর বদলে ছোট একটা script বানান, ticket নম্বর যার নাম। সে আগে গোনে কয়টা সারি বদলাবে। আপনার "প্রত্যাশিত সংখ্যা"-র সাথে না মিললে থামে। মিললে এক transaction-এ বদলায় আর প্রতিটা সারির আগের-পরের মান লগে লিখে রাখে। শর্তটাই যেন আবার চালালে ০ সারি পায়।
      - type: code
        lang: sql
        file: 'FIX-1042: ভুলে cancelled হওয়া paid অর্ডার'
        variant: good
        code: |
          WITH bad AS (
            SELECT o.id, o.status AS old_status
              FROM orders o
             WHERE o.updated_at >= '2026-11-20 13:00+06'
               AND o.updated_at <  '2026-11-20 15:05+06'    -- খারাপ deploy-এর সময়
               AND o.status = 'cancelled'
               AND EXISTS (SELECT 1 FROM payment p
                            WHERE p.order_id = o.id AND p.status = 'paid')
               FOR UPDATE OF o
          ), fixed AS (
            UPDATE orders o SET status = 'paid', updated_at = now()
              FROM bad WHERE o.id = bad.id
            RETURNING o.id, bad.old_status, o.status AS new_status
          )
          INSERT INTO data_fix_log (fix_id, row_id, old_value, new_value)
          SELECT 'FIX-1042', id, old_status, new_status FROM fixed;

          -- ফিক্স ভুল প্রমাণ হলে লগ থেকে FIX-1042 উল্টানো
          UPDATE orders o SET status = l.old_value
            FROM data_fix_log l
           WHERE l.fix_id = 'FIX-1042' AND l.row_id = o.id
             AND o.status = l.new_value;
        marks:
          - {line: 4, tip: 'শুধু খারাপ deploy-এর সময়সীমার সারি। আগের বা পরের সত্যিকারের বাতিল অর্ডার ছোঁয়া হয় না।'}
          - {line: 7, tip: 'প্রমাণ চাই: এই অর্ডারের paid payment আসলেই আছে। শর্ত যত সংকীর্ণ, ভুলের জায়গা তত কম।'}
          - {line: 11, tip: 'UPDATE আর লগ একই statement-এ। বদলও হয়েছে অথচ লগ হয়নি, এমন হওয়ার উপায় নেই।'}
          - {line: 15, tip: 'প্রতিটা সারির আগের আর পরের মান লেখা হয়। দরকার হলে এটা থেকেই ফিক্স উল্টানো যায়।'}
          - {line: 22, tip: 'ফিক্সের রেখে যাওয়া অবস্থায় এখনো আছে, শুধু সেই সারিগুলোই ফেরে। এরপর কেউ বদলালে সেই সারি ছোঁয়া হয় না।'}
      - type: code
        lang: php
        file: 'src/Command/Fix1042Command.php'
        variant: good
        code: |
          protected function execute(InputInterface $in, OutputInterface $out): int
          {
              $expect = (int) $in->getOption('expect');            // review-এ ঠিক করা সংখ্যা
              $count = (int) $this->db->fetchOne(self::COUNT_SQL);
              $out->writeln("প্রভাবিত: $count, প্রত্যাশিত: $expect");

              if ($count !== $expect) {
                  $out->writeln('<error>সংখ্যা মেলেনি, কিছু বদলানো হয়নি</error>');

                  return Command::FAILURE;
              }
              if ($in->getOption('dry-run')) {
                  return Command::SUCCESS;                          // শুধু গোনা
              }

              $fixed = $this->db->transactional(
                  fn () => $this->db->executeStatement(self::FIX_SQL),
              );
              $out->writeln("$fixed টা ঠিক হলো; data_fix_log-এ লেখা আছে");

              return Command::SUCCESS;
          }
        marks:
          - {line: 7, tip: 'গোনা সংখ্যা প্রত্যাশার সাথে না মিললে কিছুই বদলায় না। অন্যের ভুল শর্ত বা ভুল ডেটা এখানেই ধরা পড়ে।'}
          - {line: 12, tip: '`--dry-run` শুধু সংখ্যা দেখায়। দ্বিতীয় একজন এই আউটপুট দেখে অনুমোদন দেয়।'}
          - {line: 16, tip: 'ফলটা আবার চালালে ০ সারি। `status = cancelled` শর্ত আর মেলে না, তাই ডবল ফিক্স হয় না।'}
    aside:
      - type: tips
        items:
          - 'Script-টা কোড review-এ ফেলুন, dry-run আউটপুটসহ ticket-এ জুড়ে দিন। দ্বিতীয় একজন না দেখে production-এ নয়।'
          - 'চালানোর আগে প্রভাবিত সারিগুলোর একটা snapshot নিন; `data_fix_log` উল্টানোর পথ দেয়, backup শেষ ভরসা।'
          - 'দাম: review আর dry run-এ কিছু সময় যায়, প্রায়ই এক ঘণ্টার কম। দ্বিতীয় একটা ভুল ফিক্সের খরচ সেই ঘণ্টার চেয়ে অনেক বেশি।'
      - type: pitfalls
        items:
          - 'ডেটা শুধরানোর স্ক্রিপ্ট ledger-এর টাকার entry বদলাবে না। টাকার ভুল সবসময় reversing entry দিয়ে।'
      - type: refs
        items:
          - {to: 'recovery/bulk-reprocessing', label: 'Replay-এর নিরাপত্তা'}
    check:
      q: 'Script আবার চালালে কেন কিছু বদলায় না, আর এটা কেন ভালো?'
      a: 'শর্ত `status = cancelled` ফিক্সের পর আর মেলে না, তাই ০ সারি। দুইবার চালানোর ভুল বা ক্র্যাশের পর পুনরায় চালানোও নিরাপদ।'

  - slug: roll-back-or-forward
    title: 'কোড ফিরলেও ডেটা ফেরে না: roll back না roll forward'
    kind: compare
    tldr: 'Roll back কোড দ্রুত ফেরায় কিন্তু খারাপ কোডের লেখা ডেটা ফেরায় না; schema বা ডেটা বদলে গেলে roll forward আর data fix-ই পথ।'
    keywords: ['roll back', 'roll forward', 'bad deploy', 'hotfix', 'revert', 'migration']
    blocks:
      - type: text
        body: |
          রান্নায় লবণ বেশি হলে দুই পথ: পুরো ঝোল ফেলে নতুন করে রাঁধা (roll back), অথবা আলু-পানি ঢেলে সামলে নেওয়া (roll forward)। খারাপ deploy-এও তাই। কিন্তু একটা কথা সবসময় সত্য: কোড আগের সংস্করণে ফিরলেও খারাপ কোড আগেই যে ডেটা লিখে গেছে, সেটা নিজে ঠিক হয় না।
      - type: visual
        kind: compare
        caption: 'দুই পথ, আর কোনটা কখন'
        columns:
          - title: 'Roll back'
            tone: good
            icon: history
            tip: 'আগের সংস্করণে ফিরুন। দ্রুত, যখন ডেটা বা schema বদলায়নি।'
            items:
              - 'কোড বদলেছে, schema বা ডেটা নয়'
              - 'দ্রুত ও সহজ: আগের সংস্করণ বসান'
              - 'ঝুঁকি: ইতিমধ্যে লেখা খারাপ ডেটা থেকে যায়'
          - title: 'Roll forward'
            tone: accent
            icon: rocket
            tip: 'ছোট fix নতুন deploy করে এগিয়ে যান। যখন পিছনে ফেরা অসম্ভব বা ঝুঁকির।'
            items:
              - 'নতুন কলাম/ডেটা ইতিমধ্যে চালু আছে'
              - 'ফিক্স ছোট ও পরীক্ষিত, pipeline দ্রুত'
              - 'সাথে খারাপ ডেটার জন্য audited data fix'
              - 'ঝুঁকি: তাড়াহুড়োর ফিক্স দ্বিতীয় bug আনতে পারে'
      - type: code
        lang: bash
        file: 'দুই পথ'
        variant: neutral
        code: |
          # roll back: আগের সংস্করণে ফিরুন (schema পিছিয়ে যায় না!)
          kubectl rollout undo deployment/api

          # roll forward: খারাপ commit উল্টে নতুন deploy
          git revert --no-edit 4f2a9c1 && git push origin main

          # দুই পথেই তারপর: প্রভাবিত ডেটা খুঁজে audited fix
          php bin/console app:fix:1042 --dry-run --expect=2300
        marks:
          - {line: 2, tip: 'কোড ফেরে। কিন্তু migration যদি কলাম মুছে থাকে, পুরনো কোড সেটা ছাড়া চলবে না।'}
          - {line: 8, tip: 'পথ যা-ই হোক, খারাপ ডেটা এখনও ডেটাবেসে। সেটা আলাদা কাজ।'}
      - type: quote
        body: 'কোড ফিরলেও খারাপ কোডের লেখা ডেটা ফেরে না। সেটার জন্য আলাদা, নথিবদ্ধ ফিক্স লাগে।'
    aside:
      - type: when
        use:
          - 'Roll back: শুধু কোড বদলেছে, কোনো ডেটা-পরিবর্তন বা ধ্বংসাত্মক migration নেই'
          - 'Roll forward: ডেটা ইতিমধ্যে নতুন আকারে লেখা, বা ফিক্স ছোট আর নিরাপদ'
        avoid:
          - 'Migration-এ কলাম মুছে ফেলার পর কোড roll back করা'
      - type: refs
        items:
          - {to: 'data/zero-downtime-migrations', label: 'Zero-downtime migration'}
          - {to: 'resilience/zero-downtime-deploys', label: 'নিরাপদ deploy'}
    check:
      q: 'Roll back করার পরও ২৩০০ অর্ডার cancelled থেকে গেল। কেন, আর পরের ধাপ কী?'
      a: 'Roll back শুধু কোড ফেরায়; খারাপ কোড আগেই ডেটা বদলে গেছে। পরের ধাপ: সংকীর্ণ শর্তে audited data-fix script চালিয়ে সেই সারিগুলো ঠিক করা।'

flashcards:
  - q: 'Production-এ console থেকে সরাসরি UPDATE চালানো কেন ঝুঁকির?'
    a: 'কোনো প্রমাণ থাকে না, আগের মান হারায়, আর শর্ত বড় হলে সঠিক সারিও বদলে যায়।'
    more: |
      তাড়াহুড়োয় লেখা শর্ত প্রায়ই খুব বড় হয়। বদলের আগের-পরের মান লেখা না থাকায় ভুল ধরা, ফেরানো বা অডিটর-কে বোঝানো সবই কঠিন হয়ে যায়।
    ref: silent-update-in-prod
  - q: 'Corrective entry কী?'
    a: 'ভুল মুছে না ফেলে সংশোধনের একটা নতুন, নথিবদ্ধ লেখা; মূল ভুলটাও ইতিহাসে থাকে।'
    more: |
      Ledger-এ এটা reversing entry আর তারপর সঠিক অঙ্কের নতুন entry। এভাবে debit = credit ভাঙে না আর অডিটর পুরো গল্প দেখতে পায়।
    ref: correction-is-a-record
  - q: 'Ledger-এর টাকার ভুল ঠিক করতে কী করা হয়, কী করা হয় না?'
    a: 'করা হয়: reversing entry আর নতুন সঠিক entry। করা হয় না: পুরনো entry UPDATE বা DELETE।'
    more: |
      Data-fix script ledger-এর টাকার entry বদলায় না। টাকার প্রতিটা সংশোধন পোস্টিং service দিয়ে লেনদেন হিসেবে যায়। যেমন ৫০০-র জায়গায় ৫০০০ জমা পোস্ট হলে: ৫০০০ থাকে, ৫০০০-এর একটা reversal যোগ হয়, তারপর ৫০০-র সঠিক জমা। নিট ফল ৫০০, আর debit = credit বজায় থাকে।
    ref: correction-is-a-record
  - q: 'Audited data-fix script-এ "প্রত্যাশিত সংখ্যা" (expect) কেন থাকে?'
    a: 'গোনা সারি সংখ্যা প্রত্যাশার সাথে না মিললে script কিছু বদলায় না। ভুল শর্ত চালানোর আগেই ধরা পড়ে।'
    more: |
      Review-এর সময় সবাই একমত হয়: "২৩০০টা সারি বদলাবে।" চালানোর সময় ৩১০০ এলে বোঝা যায় শর্ত বড়, তাই থামে।
    ref: audited-data-fix
  - q: 'Data-fix script কেন একই statement-এ UPDATE আর লগ লেখে?'
    a: 'যাতে বদল হলে লগও হয়, আর লগ ছাড়া বদল হওয়ার সুযোগ না থাকে। আগের-পরের মান থেকে ফিক্স উল্টানোও যায়।'
    more: |
      PostgreSQL-এ `WITH fixed AS (UPDATE ... RETURNING ...) INSERT INTO data_fix_log SELECT ...` একটাই statement, তাই পুরোটা এক transaction-এ।
    ref: audited-data-fix
  - q: 'ভুল প্রমাণিত data-fix script কীভাবে উল্টানো যায়?'
    a: '`data_fix_log` থেকে সারিগুলো আগের মানে ফেরানো যায়, কিন্তু শুধু যেগুলো এখনো ফিক্সের রেখে যাওয়া অবস্থায় আছে (`status = new_value`)।'
    more: |
      লগে প্রতিটা সারির আগের ও পরের মান আছে। `new_value`-র শর্তের কারণে ফিক্সের পর যে সারি অন্য কেউ বদলেছে, তাতে পুরনো মান চাপিয়ে দেওয়া হয় না।
    ref: audited-data-fix
  - q: 'Data fix script আবার চালালে কী হওয়া উচিত?'
    a: 'কিছুই না। শর্ত ঠিক হওয়া সারিতে আর মেলে না, তাই ০ সারি বদলায়।'
    more: |
      এতে ক্র্যাশের পর বা ভুলে দুইবার চালালেও ডবল ফিক্স হয় না। এটাই idempotent ফিক্স, যা নিরাপদে আবার চালানো যায়।
    ref: audited-data-fix
  - q: 'Roll back আর roll forward-এর পার্থক্য কী?'
    a: 'Roll back আগের সংস্করণে ফেরে। Roll forward ছোট fix দিয়ে নতুন deploy করে এগিয়ে যায়।'
    more: |
      Roll back দ্রুত, যখন শুধু কোড বদলেছে। ডেটা বা schema বদলে গেলে (যেমন কলাম মুছেছে) পিছনে ফেরা বিপজ্জনক, তখন roll forward।
    ref: roll-back-or-forward
  - q: 'কোড roll back করলে খারাপ ডেটা কেন ঠিক হয় না?'
    a: 'Roll back শুধু কোড ফেরায়। খারাপ কোড ইতিমধ্যে যে ডেটা লিখেছে তা ডেটাবেসে থেকে যায়।'
    more: |
      তাই deploy ঠিক করা আর ডেটা শুধরানো দুটো আলাদা কাজ। দ্বিতীয়টা audited script আর corrective entry দিয়ে, যেন পরে বোঝা যায় কী হয়েছিল।
    ref: roll-back-or-forward

quiz:
  - q: 'খারাপ deploy ১২০০টা পেমেন্টের `fee_minor` ভুল লিখেছে। সবচেয়ে ভালো প্রথম পদক্ষেপ?'
    hint: 'ঠিক করার আগে কী গোনা ও লেখা দরকার?'
    options:
      - text: 'প্রভাবিত সারি সংকীর্ণ শর্তে খুঁজে dry-run করা, সংখ্যা review-এ মেলানো, তারপর audited script'
        correct: true
        why: 'গোনা, দেখানো, অনুমোদন, তারপর বদল। প্রতিটা ধাপে ভুল ধরা পড়ার সুযোগ।'
      - text: 'Console-এ `UPDATE payment SET fee_minor = 1000` চালিয়ে দেওয়া'
        correct: false
        why: 'শর্ত নেই, ফলে সব সারি বদলে যাবে; আর কোনো লগ থাকবে না।'
      - text: 'Backup থেকে পুরো DB ফিরিয়ে আনা'
        correct: false
        why: 'ভুলের পরের বৈধ লেনদেনগুলোও হারাবে। অত্যন্ত ভারী পথ।'
      - text: 'কিছু না করা, ভুলগুলো ছোট'
        correct: false
        why: 'ভুল ফি গ্রাহকের টাকায় প্রভাব ফেলে; আর হিসাব মিলবে না।'
    ref: audited-data-fix
  - q: 'Ledger-এ ভুল করে ৫০০ টাকার জায়গায় ৫০০০ টাকা জমা পোস্ট হয়েছে। কী করবেন?'
    hint: 'ledger-এর entry কখনো বদলায় না।'
    options:
      - text: 'ভুল লেনদেনের reversing entry লিখে ৫০০ টাকার নতুন সঠিক লেনদেন পোস্ট করা'
        correct: true
        why: 'ইতিহাস অটুট, debit = credit বজায় থাকে। অডিটর পুরো গল্প পায়।'
      - text: '`UPDATE ledger_entry SET amount_minor = 50000` (৫০০ টাকা)'
        correct: false
        why: 'ledger-এর entry বদলানো নিষিদ্ধ; আর এক পাশ বদলালে দুই পাশের যোগফল ভাঙে।'
      - text: 'ভুল entry মুছে নতুন entry বসানো'
        correct: false
        why: 'মোছা মানে ইতিহাস মোছা; অডিটে কিছুই প্রমাণ করা যাবে না।'
      - text: 'ওয়ালেটের balance কলামে ৪৫০০ টাকা কমিয়ে দেওয়া'
        correct: false
        why: 'balance entry-র ফল; সরাসরি বদলালে entry-র সাথে অমিল তৈরি হয়।'
    ref: correction-is-a-record
  - q: 'নিচের data-fix SQL-এ কী ঝুঁকি আছে?'
    lang: sql
    code: |
      UPDATE orders
         SET status = 'paid'
       WHERE status = 'cancelled';
    hint: 'শর্তে সময়, কারণ আর লগ কোথায়?'
    options:
      - text: 'সত্যিকারের বাতিল অর্ডারও বদলে যাবে, আর আগের মান কোথাও লেখা থাকবে না'
        correct: true
        why: 'শর্ত খুব বড় আর কোনো লগ বা সংখ্যা-যাচাই নেই।'
      - text: '`SET` আগে `WHERE` লেখা উচিত'
        correct: false
        why: 'SQL-এর গঠন এভাবেই; সমস্যা শর্তের বিস্তারে।'
      - text: '`UPDATE` কখনো production-এ চলে না'
        correct: false
        why: 'চলে, তবে নথিবদ্ধ ও সংকীর্ণ শর্তে।'
      - text: 'কোনো ঝুঁকি নেই'
        correct: false
        why: 'ঝুঁকি আছে; এই ধরনের এক লাইনই ঘটনাটার মূল কারণ ছিল।'
    ref: silent-update-in-prod
  - q: 'কোনগুলো ভালো data-fix script-এর বৈশিষ্ট্য?'
    hint: 'আগে, চালানোর সময় আর পরে — তিনটা সময়ের কথা ভাবুন।'
    options:
      - text: 'প্রত্যাশিত সংখ্যা না মিললে থেমে যায়'
        correct: true
        why: 'ভুল শর্ত চালানোর আগেই ধরা পড়ে।'
      - text: 'প্রতিটা সারির আগের ও পরের মান লগে লেখে'
        correct: true
        why: 'অডিট আর দরকারে ফেরানোর ভিত্তি।'
      - text: 'আবার চালালে ০ সারি বদলায়'
        correct: true
        why: 'ডবল ফিক্স হয় না; ক্র্যাশের পর পুনরায় চালানো নিরাপদ।'
      - text: 'একজনই লিখে, review ছাড়া সরাসরি production-এ চালায়'
        correct: false
