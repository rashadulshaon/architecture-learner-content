    aside:
      - type: pitfalls
        items:
          - 'Guard আসার আগের event-এর `processed_event` সারি নেই, তাই replay আবার টাকা জমা করবে। ledger-এ জমা আছে এমন event-এর সারি আগে backfill করুন, আর dry run-এ সংখ্যা মেলান।'
          - 'পুরনো event-এর payload-এর ওপর ভরসা করে বর্তমান অবস্থা উল্টে দেবেন না। বর্তমান অবস্থা দেখে সিদ্ধান্ত নিন।'
      - type: refs
        items:
          - {to: 'payments/idempotency-keys', label: 'Idempotency key'}
          - {to: 'messaging/dlq-retries', label: 'Idempotent consumer'}
    check:
      q: 'প্রথমবারেই টাকা জমা হয়ে গেছে। তবু replay রসিদের সারি ঢোকায় কেন?'
      a: 'প্রথমবার রসিদের আগেই ব্যর্থ হয়ে থাকতে পারে। সারির নিজের unique key সেটা একবারই সারিতে তোলে: পাঠানো হয়ে থাকলে ডবল নয়, না গিয়ে থাকলে রসিদ হারায় না।'

  - slug: receipt-sender
    title: 'প্রতিটা রসিদ একবারই পাঠানো, ছুটে যাওয়াগুলোও'
    kind: howto
    tldr: 'আলাদা একটা sender না-পাঠানো রসিদের সারি ছোট ছোট batch-এ ইমেইল করে আর প্রতিটাকে "পাঠানো" দাগ দেয়, ফলে প্রতিটা event-এ ঠিক একটা রসিদ যায়।'
    keywords: ['receipt outbox', 'sender job', 'missed email', 'backfill', 'at least once', 'ছুটে যাওয়া রসিদ']
