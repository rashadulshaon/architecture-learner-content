          Replay শুধু `receipt_outbox` টেবিল ভরে। ইমেইল পাঠায় ছোট একটা পর্যায়ক্রমিক job। তিন ধরনের event replay-এর সামনে পড়তে পারে, আর প্রতিটার শেষে ঠিক একটা রসিদ যায়।
      - type: visual
        kind: table
        caption: 'প্রতি ধরনের event-এর জন্য replay কী করে'
        headers: ['প্রথম চেষ্টায়', 'জমা', 'রসিদ-সারি', 'Replay-এর ফল']
