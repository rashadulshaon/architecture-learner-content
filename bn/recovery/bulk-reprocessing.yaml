            tip: 'দুই guard-ই বলে হয়ে গেছে, আর গ্রাহক রসিদ পেয়েই গেছেন।'
          - cells: ['জমা হয়েছে, রসিদের আগে ব্যর্থ', 'আছে', 'নেই', 'সারি ওঠে, তারপর যায়']
            tip: 'শুধু "replay-এ ইমেইল বন্ধ" সুইচ থাকলে এই ঘটনাটাই হারাত।'
          - cells: ['কখনো প্রসেস হয়নি', 'নেই', 'নেই', 'জমা হয়, রসিদ যায়']
