    keywords: ['runbook', 'incident', 'checklist', 'on-call', 'restore procedure', 'রানবুক']
    blocks:
      - type: text
        body: |
          রাত ৩টায় বিপদে মাথা কাজ করে না। তখন দরকার একটা কাগজ, যার প্রতিটা ধাপ এত সহজ যে আধা-ঘুমের মানুষও পারে। **Runbook** ঠিক তা-ই: কে ডাকবে, কোন কমান্ড, কী দেখলে বুঝবে ঠিক হয়েছে, কী দেখলে থামবে। বিপদে পরিকল্পনা বানানো নয়, লেখা পরিকল্পনা অনুসরণ করা।
      - type: code
        lang: text
        file: 'runbooks/restore-production-db.md'
        variant: good
        code: |
          RUNBOOK: Production DB restore (PITR)
          মালিক: ডেটা-টিম · শেষ drill: ২০২৬-১১-১৫ (৭০ মিনিট)

          কখন: ভুল DELETE/UPDATE, ডিস্ক নষ্ট, ransomware সন্দেহ

          ১. incident channel খোলো, incident commander ঠিক করো
          ২. লেখা বন্ধ: `php bin/console app:maintenance on`
          ৩. ভুলের সঠিক সময় লিখে রাখো (logs থেকে) → T
          ৪. নতুন সার্ভারে restore: T-র ১ মিনিট আগের target
             pgbackrest --stanza=main restore --type=time \
               --target='T' --target-action=promote
          ৫. যাচাই: `psql -c 'SELECT count(*), max(created_at) FROM orders'`
             প্রত্যাশা: অর্ডার সংখ্যা ≈ গতকালের, max(created_at) ≈ T
          ৬. মোছা ডেটা বের করে production-এ ফেরত নাও
             (পুরো DB বদলে দিও না; ভুলের পর বৈধ লেনদেন আছে)
          ৭. maintenance off, ১ ঘণ্টা নজর রাখো, post-mortem লেখো

          থামো যদি: restore ১২০ মিনিট পেরোয় → ডেটা-লিডকে ফোন
