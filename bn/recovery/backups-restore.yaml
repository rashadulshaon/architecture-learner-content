slides:
  - slug: backup-that-never-restored
    title: 'Backup ছিল, কিন্তু restore হলো না'
    kind: story
    tldr: 'Backup কাজ করছে ভাবাটা আর backup restore করে দেখা এক জিনিস নয়; না দেখা backup বিপদের দিনে প্রায়ই খালি বা নষ্ট বেরোয়।'
    keywords: ['backup', 'restore', 'tested backup', 'disaster', 'ব্যাকআপ', 'রিস্টোর']
    blocks:
      - type: text
        body: |
          শুক্রবার বিকেল ৩টা ২ মিনিটে এক ডেভেলপার production-এ ভুলে `DELETE FROM orders` চালাল, `WHERE` ছাড়া। দশ মিনিটে ধরা পড়ল। "ভয় নেই, রোজ রাতে backup হয়" — কিন্তু restore করতে গিয়ে দেখা গেল ৩ সপ্তাহ ধরে ডিস্ক ভরা থাকায় backup ফাইলগুলো ০ বাইট। কেউ কখনো ফাইলটা খুলে দেখেনি।
      - type: visual
        kind: sequence
        caption: 'রোজ রাতে backup হতো — তিন সপ্তাহ ধরে খালি'
        actors:
          - {id: dev, label: 'ডেভেলপার', icon: user, tip: 'ভুল করেছে, কিন্তু আসল দোষ ব্যবস্থার: production-এ এত সহজে ডেটা মোছা যায়।'}
          - {id: db, label: 'Production DB', icon: db, tip: 'যা বলা হয় তা-ই করে। ভুল আদেশও।'}
          - {id: bk, label: 'Backup সার্ভার', icon: archive, tip: 'রোজ রাতে ফাইল রাখে। কিন্তু ফাইল ঠিক আছে কি না কেউ দেখে না।'}
        messages:
          - {from: dev, to: db, label: '৩:০২ — DELETE FROM orders (WHERE নেই)'}
          - {at: db, note: '১২ লাখ অর্ডার উধাও', tone: bad}
          - {from: dev, to: bk, label: '৩:১২ — গতরাতের backup restore করো'}
          - {from: bk, to: dev, label: 'ফাইল ০ বাইট — ৩ সপ্তাহ ধরে খালি', dashed: true, tone: bad, tip: 'ডিস্ক ভরা ছিল, backup job চুপচাপ ব্যর্থ হয়েছিল। কেউ alert সাজায়নি।'}
          - {at: bk, note: 'কেউ কখনো restore করে দেখেনি', tone: warn}
      - type: quote
        body: 'যে backup restore করে দেখা হয়নি, সেটা backup নয়, আশা।'
    aside:
      - type: story
        title: 'আসল গল্প, বহুবার'
        body: |
          ছোট বড় বহু কোম্পানির ঘটনা এমন: backup job সবুজ দেখাচ্ছিল, কিন্তু ভুল ডিরেক্টরি, ভরা ডিস্ক বা হারানো পাসওয়ার্ডে ফাইল অকেজো। জানা গেছে সেই দিনই, যেদিন লাগে।
      - type: terms
        items:
          - {term: 'RPO', meaning: 'Recovery Point Objective: সর্বোচ্চ কতক্ষণের ডেটা হারানো সহ্য করা যায়।'}
          - {term: 'RTO', meaning: 'Recovery Time Objective: কত সময়ের মধ্যে আবার চালু হতে হবে।'}
    check:
      q: 'Backup job প্রতি রাতে "সফল" বার্তা দিলেও কেন নিশ্চিত হওয়া যায় না যে backup ঠিক আছে?'
      a: 'job-এর সফলতা মানে শুধু কমান্ড শেষ হয়েছে। ফাইল পূর্ণ, অক্ষত আর restore-যোগ্য কি না তা প্রমাণ হয় কেবল restore করে দেখলে।'

  - slug: three-two-one
    title: 'দলিলের ফটোকপি: ৩-২-১ নিয়ম'
    kind: concept
    tldr: 'ডেটার ৩টা কপি, ২ ধরনের জায়গায়, ১টা অন্য ঠিকানায়। আর replica backup নয়, কারণ ভুল DELETE তাতেও সাথে সাথে পৌঁছায়।'
    keywords: ['3-2-1 rule', 'offsite', 'immutable backup', 'replica vs backup', 'ransomware', 'ফটোকপি']
    blocks:
      - type: metaphor
        icon: building
        title: 'জমির দলিল'
        body: |
          দলিলের আসল কপি ঘরের সিন্দুকে। সেটা পুড়লে বা চুরি হলে? তাই ফটোকপি ব্যাংকের লকারে, আরেকটা গ্রামের বাড়িতে। ঘরে আগুন লাগলে লকারেরটা বাঁচে, শহরে বন্যা এলে গ্রামেরটা। সব কপি একই সিন্দুকে রাখলে সেটা একটাই কপি।
      - type: visual
        kind: flow
        caption: '৩-২-১: তিনটা কপি, দুই ধরনের জায়গা, একটা দূরে'
        nodes:
          - {id: prod, label: 'Production DB', sub: 'কপি ১ (আসল)', icon: db, tone: accent, col: 0, row: 1, tip: 'চালু ডেটাবেস। এটাও গোনা হয়, কিন্তু একা যথেষ্ট নয়।'}
          - {id: local, label: 'আলাদা ডিস্ক', sub: 'কপি ২ (একই অঞ্চল)', icon: archive, col: 2, row: 0, tip: 'আলাদা মেশিন বা ডিস্কে নিয়মিত backup আর WAL। দ্রুত restore-এর জন্য।'}
          - {id: remote, label: 'অন্য অঞ্চলের bucket', sub: 'কপি ৩ (offsite)', icon: cloud, tone: good, col: 4, row: 1, tip: 'অন্য শহর বা region-এ object storage। এখানে immutability (মোছা-নিষেধ) চালু রাখো।'}
        edges:
          - {from: prod, to: local, label: 'রোজ full-incremental backup আর WAL আলাদা ডিস্কে যায়'}
          - {from: local, to: remote, label: 'সেই কপি অন্য অঞ্চলের bucket-এ যায়, immutable করে'}
          - {from: prod, to: remote, label: 'WAL সরাসরিও যায়, যাতে সর্বশেষ মুহূর্ত পর্যন্ত ফেরা যায়', dashed: true}
      - type: quote
        body: 'Replica backup নয়। ভুল DELETE আর ransomware replica-তেও সাথে সাথে পৌঁছায়।'
    aside:
      - type: problem
        body: 'একটাই কপি থাকলে আগুন, ডিস্ক ক্ষয়, ভুল আদেশ বা হ্যাকার — যেকোনো একটাতেই সব শেষ।'
      - type: tips
        items:
          - 'Offsite bucket-এ object lock (immutability) চালু করো, যাতে হ্যাকার বা ভুলে মোছা না যায়।'
          - 'Backup-এর encryption key আলাদা জায়গায় রাখো, নইলে ফাইল থাকলেও খোলা যাবে না।'
    check:
      q: 'Primary-র একটা replica আছে। তাহলে আলাদা backup লাগে কেন?'
      a: 'Replica primary-র সব বদল সাথে সাথে নকল করে, ভুল DELETE-ও। Backup পুরনো একটা মুহূর্তে ফেরার সুযোগ দেয়, replica দেয় না।'

  - slug: point-in-time-recovery
    title: 'Point-in-time recovery: ভুলের এক মিনিট আগে ফেরা'
    kind: howto
    tldr: 'Base backup আর ক্রমাগত archive করা WAL মিলে যেকোনো মুহূর্তে ফেরা যায়; restore হয় নতুন সার্ভারে, চালু DB-র ওপর নয়।'
    keywords: ['PITR', 'WAL archive', 'pgBackRest', 'recovery target time', 'point in time recovery', 'base backup']
    blocks:
      - type: text
        body: |
          রাতের backup শুধু রাত ২টার ছবি; ৩টা ২ মিনিটের ভুলের জন্য ১ ঘণ্টার ডেটা হারায়। **PITR** এটা মেটায়: PostgreSQL প্রতিটা লেনদেনের লগ (**WAL**) আলাদা জায়গায় জমায়। Restore-এ আগে রাতের ছবি বসে, তারপর WAL চালিয়ে ঠিক ৩:০১-এ থামা হয়। MySQL-এ একই কাজ করে binary log।
      - type: code
        lang: ini
        file: 'postgresql.conf'
        variant: good
        code: |
          wal_level = replica
          archive_mode = on
          archive_command = 'pgbackrest --stanza=main archive-push %p'
          archive_timeout = 60        # অন্তত প্রতি ৬০ সেকেন্ডে WAL ফাইল পাঠাও
        marks:
          - {line: 3, tip: 'প্রতিটা সম্পূর্ণ WAL ফাইল backup repository-তে (আদর্শে offsite) চলে যায়। এটাই "মাঝের সব লেখা"-র সংরক্ষণ।'}
          - {line: 4, tip: 'WAL ফাইল পূর্ণ না হলেও জোর করে পাঠায়। RPO তাই প্রায় ১ মিনিট।'}
      - type: code
        lang: bash
        file: 'restore (নতুন সার্ভারে)'
        variant: good
        code: |
          # চালু DB-র ওপর কখনো নয়; নতুন বা scratch সার্ভারে
          sudo systemctl stop postgresql
          pgbackrest --stanza=main restore \
            --type=time --target='2026-11-20 15:01:00+06' \
            --target-action=promote
          sudo systemctl start postgresql

          psql -c 'SELECT count(*), max(created_at) FROM orders'   # ঠিক আছে কি দেখো
        marks:
          - {line: 4, tip: 'ভুলের ঠিক এক মিনিট আগের সময়। সময়ের সাথে timezone (+06) লিখতে ভুলো না।'}
          - {line: 5, tip: 'লক্ষ্যে পৌঁছে DB চালু (promote) হয়; নইলে read-only অপেক্ষায় থাকে।'}
          - {line: 8, tip: 'শেষে নিজে গুনে দেখো: অর্ডার ফিরেছে কি না, সর্বশেষ সময় ঠিক কি না। চালু করার আগে এই যাচাই।'}
    aside:
      - type: tips
        items:
          - 'আগে scratch সার্ভারে PITR করে যাচাই করো, তারপর ঠিক ডেটা production-এ ফেরত নাও। পুরো DB উল্টে দিলে ভুল মুহূর্তের পরের সব বৈধ লেনদেনও হারায়।'
          - 'pgBackRest ছাড়া নিজের হাতে করলে `restore_command`, `recovery_target_time` আর `recovery.signal` ফাইল লাগে।'
      - type: pitfalls
        items:
          - 'Backup সার্ভারের ঘড়ি আর DB সার্ভারের সময় না মিললে target time ভুল জায়গায় যায়।'
    check:
      q: 'রাত ২টার backup থাকতেও PITR লাগে কেন?'
      a: 'রাতের backup শুধু ২টার অবস্থা ফেরায়, ফলে ভুলের আগ পর্যন্ত ঘণ্টাখানেকের ডেটা হারায়। WAL চালিয়ে ঠিক ভুলের এক মিনিট আগে ফেরা যায়।'

  - slug: restore-drill
    title: 'Restore drill: নিজে ভেঙে দেখো'
    kind: howto
    tldr: 'সপ্তাহে একবার সর্বশেষ backup scratch DB-তে restore করে সময় মাপো আর ডেটা যাচাই করো; ব্যর্থ হলে সাথে সাথে alert।'
    keywords: ['restore drill', 'backup verification', 'scratch database', 'Symfony Scheduler', 'RTO', 'AsCronTask']
    blocks:
      - type: text
        body: |
          Backup তখনই বিশ্বাসযোগ্য, যখন সপ্তাহে একবার মেশিন নিজে সেটা restore করে দেখে। এই command সর্বশেষ backup scratch DB-তে ঢালে, কত সময় লাগল মাপে (এটাই আপনার আসল **RTO**), আর কয়েকটা সুস্থতা পরীক্ষা চালায়: অর্ডার সংখ্যা যথেষ্ট কি না, সর্বশেষ ডেটা নতুন কি না।
      - type: code
        lang: php
        file: 'src/Command/BackupVerifyCommand.php'
        variant: good
        code: |
          #[AsCommand(name: 'app:backup:verify', description: 'সর্বশেষ backup restore করে যাচাই')]
          #[AsCronTask('0 5 * * 0')]
          final class BackupVerifyCommand extends Command
          {
              protected function execute(InputInterface $in, OutputInterface $out): int
              {
                  $start = microtime(true);
                  (new Process(['pg_restore', '--clean', '--if-exists', '--no-owner',
                      '-d', $this->scratchDsn, $this->latestDump()]))->setTimeout(3600)->mustRun();
                  $secs = (int) (microtime(true) - $start);

                  $orders = (int) $this->scratch->fetchOne('SELECT count(*) FROM orders');
                  $raw = $this->scratch->fetchOne('SELECT max(created_at) FROM orders');
                  $latest = new \DateTimeImmutable($raw);
                  if ($orders < $this->minOrders || $latest < new \DateTimeImmutable('-26 hours')) {
                      $out->writeln('<error>restore হলো, কিন্তু ডেটা কম বা পুরনো</error>');

                      return Command::FAILURE;     // alert এখানে থেকেই যায়
                  }
                  $out->writeln("restore ঠিক, সময় {$secs}s");   // এটাই আসল RTO

                  return Command::SUCCESS;
              }
          }
        marks:
          - {line: 2, tip: 'সপ্তাহে একবার রবিবার ভোর ৫টায় নিজে চলে। কারো মনে রাখার দরকার নেই।'}
          - {line: 9, tip: '`mustRun()` ব্যর্থ হলে exception ওঠে; scheduler ব্যর্থতা লগ করে, তাই alert পাওয়া যায়।'}
          - {line: 15, tip: 'শুধু "restore হয়েছে" যথেষ্ট নয়। ডেটা পূর্ণ ও সাম্প্রতিক কি না, এই দুটো পরীক্ষা খালি backup ধরে ফেলে।'}
          - {line: 20, tip: 'মাপা সময়টা চার্টে রাখো। ডেটা বাড়লে restore ধীর হয়, আর RTO নীরবে বেড়ে যায়।'}
      - type: visual
        kind: bars
        caption: 'Restore সময় (মিনিট) ডেটা বাড়ার সাথে কীভাবে বাড়ে'
        items:
          - {label: 'গত বছর', value: 20, display: '২০ মিনিট', tone: good, tip: 'ছোট ডেটাবেসে restore দ্রুত ছিল, তাই RTO-র কোনো চিন্তা ছিল না।'}
          - {label: 'এখন', value: 70, display: '৭০ মিনিট', tone: warn, tip: 'ডেটা বেড়েছে, restore ধীর হয়েছে। কেউ খেয়াল করেনি।'}
          - {label: 'লক্ষ্য RTO', value: 60, display: '৬০ মিনিট', tone: bad, tip: 'ব্যবসা সর্বোচ্চ এক ঘণ্টা বন্ধ সইবে। এখনকার ৭০ মিনিট তা ছাড়িয়ে গেছে।'}
    aside:
      - type: tips
        items:
          - 'Drill চলার সময় যে মাপ বেরোয়, সেটাই runbook-এ "আনুমানিক সময়" হিসেবে লেখো।'
          - 'Scratch DB-তে ব্যক্তিগত ডেটা থাকে; সেটা production-এর মতোই সুরক্ষিত রাখো, কাজ শেষে মুছে দাও।'
      - type: refs
        items:
          - {to: 'resilience/disaster-recovery', label: 'Disaster recovery'}
    check:
      q: 'Restore drill-এ "ফাইল restore হয়েছে" ছাড়াও ডেটার কোন দুটো পরীক্ষা জরুরি, আর কেন?'
      a: 'অর্ডার সংখ্যা যথেষ্ট কি না আর সর্বশেষ ডেটা সাম্প্রতিক কি না। এই দুটোই ধরে খালি বা পুরনো backup, যা restore ঠিকই হয়।'

  - slug: runbook
    title: 'Runbook: ভয়ের মধ্যে পড়ার মতো কাগজ'
