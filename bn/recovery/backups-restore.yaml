          - {line: 12, tip: 'প্রতিটা ধাপের পাশে "কী দেখলে ঠিক" লেখা। ভুল পথে এগোনো ঠেকায়।'}
          - {line: 15, tip: 'পুরো DB উল্টে দেওয়া নয়; ভুলের পর আসা বৈধ লেনদেনও হারাবে।'}
