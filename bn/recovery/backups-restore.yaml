      a: 'অর্ডার সংখ্যা যথেষ্ট কি না আর সর্বশেষ ডেটা সাম্প্রতিক কি না। এই দুটোই ধরে খালি বা পুরনো backup, যা restore ঠিকই হয়।'

  - slug: runbook
    title: 'Runbook: ভয়ের মধ্যে পড়ার মতো কাগজ'
    kind: howto
    tldr: 'Runbook হলো ঘুম-চোখে পড়ার উপযোগী ধাপে ধাপে লেখা নির্দেশ: কে কী করবে, কোন কমান্ড, কীভাবে যাচাই। আর প্রতিটা drill-এ তা হালনাগাদ হয়।'
    keywords: ['runbook', 'incident', 'checklist', 'on-call', 'restore procedure', 'রানবুক']
    blocks:
      - type: text
        body: |
          রাত ৩টায় বিপদে মাথা কাজ করে না। তখন দরকার একটা কাগজ, যার প্রতিটা ধাপ এত সহজ যে আধা-ঘুমের মানুষও পারে। **Runbook** ঠিক তা-ই: কাকে ডাকবেন, কোন কমান্ড, কী দেখলে বুঝবেন ঠিক হয়েছে, কী দেখলে থামবেন। বিপদে পরিকল্পনা বানানো নয়, লেখা পরিকল্পনা অনুসরণ করা।
      - type: code
        lang: text
        file: 'runbooks/restore-production-db.md'
        variant: good
        code: |
          RUNBOOK: Production DB restore (PITR)
          মালিক: ডেটা-টিম · শেষ drill: ২০২৬-১১-১৫ (৭০ মিনিট)

          কখন: ভুল DELETE/UPDATE, ডিস্ক নষ্ট, ransomware সন্দেহ

          ১. incident channel খুলুন, incident commander ঠিক করুন
          ২. লেখা বন্ধ: `php bin/console app:maintenance on`
          ৩. ভুলের সঠিক সময় লিখে রাখুন (logs থেকে) → T
          ৪. নতুন সার্ভারে restore: T-র ১ মিনিট আগের target
             pgbackrest --stanza=main restore --type=time \
               --target='T' --target-action=promote
          ৫. যাচাই: `psql -c 'SELECT count(*), max(created_at) FROM orders'`
             প্রত্যাশা: অর্ডার সংখ্যা ≈ গতকালের, max(created_at) ≈ T
          ৬. মোছা সারি staging table দিয়ে ফেরত নিন (ON CONFLICT DO NOTHING)
             (পুরো DB বদলে দেবেন না; ভুলের পর বৈধ লেনদেন আছে)
          ৭. maintenance off, ১ ঘণ্টা নজর রাখুন, post-mortem লিখুন

          থামুন যদি: restore ১২০ মিনিট পেরোয় → ডেটা-লিডকে ফোন
        marks:
          - {line: 2, tip: 'শেষ drill-এর তারিখ আর সময় লেখা থাকলে বোঝা যায় কাগজ কত পুরনো আর কতক্ষণ লাগবে।'}
          - {line: 9, tip: 'কমান্ড হুবহু লেখা, কপি-পেস্ট করার মতো। বিপদে কেউ মনে করে টাইপ করে না।'}
          - {line: 12, tip: 'প্রতিটা ধাপের পাশে "কী দেখলে ঠিক" লেখা। ভুল পথে এগোনো ঠেকায়।'}
          - {line: 15, tip: 'পুরো DB উল্টে দেওয়া নয়; ভুলের পর আসা বৈধ লেনদেনও হারাবে।'}
      - type: points
        title: 'ভালো runbook-এর পাঁচ গুণ'
