flashcards:
  - q: 'Backup restore করে না দেখলে ঠিক কী ঝুঁকি?'
    a: 'বিপদের দিনে জানা যেতে পারে ফাইল খালি, নষ্ট বা key ছাড়া অকেজো। job "সফল" বললেও restore-যোগ্য কি না জানা যায় না।'
    more: |
      Job সফল মানে শুধু কমান্ড শেষ হয়েছে। ভরা ডিস্ক, ভুল ডিরেক্টরি বা হারানো key-তে ফাইল অকেজো হয়ে যায়। একমাত্র restore করে ডেটা যাচাই করলেই প্রমাণ মেলে।
    ref: backup-that-never-restored
  - q: 'RPO আর RTO কী?'
    a: 'RPO: সর্বোচ্চ কতক্ষণের ডেটা হারানো সহ্য। RTO: কত সময়ের মধ্যে আবার চালু হতে হবে।'
    more: |
      RPO ১ মিনিট মানে প্রায় সব ডেটা বাঁচাতে হবে (PITR লাগবে)। RTO ১ ঘণ্টা মানে restore ১ ঘণ্টার মধ্যে শেষ হতে হবে। এই দুই সংখ্যা ব্যবসা ঠিক করে, তারপর backup নকশা সেটা মেটায়।
    ref: backup-that-never-restored
  - q: 'Backup-এর ৩-২-১ নিয়ম কী?'
    a: 'ডেটার ৩টা কপি, ২ ধরনের জায়গায়, তার ১টা অন্য ঠিকানায় (offsite)।'
    more: |
      একই সিন্দুকের তিনটা কপি আসলে একটাই কপি। আগুন, বন্যা বা হ্যাকার সব একসাথে শেষ করে দেয়। আলাদা জায়গার সাথে immutability (মোছা-নিষেধ) যোগ করলে ransomware থেকেও বাঁচা যায়।
    ref: three-two-one
  - q: 'Replica কি backup-এর বিকল্প?'
    a: 'না। Replica সব বদল সাথে সাথে নকল করে, ভুল DELETE আর ransomware-ও।'
    more: |
      Replica চালু থাকার জন্য (availability), আগের মুহূর্তে ফেরার জন্য নয়। আগের মুহূর্তে ফিরতে লাগে backup আর WAL।
    ref: three-two-one
  - q: 'Point-in-time recovery (PITR) কীভাবে কাজ করে?'
    a: 'Base backup বসানো হয়, তারপর archive করা WAL লগ চালিয়ে নির্বাচিত মুহূর্তে (যেমন ভুলের ১ মিনিট আগে) থামা হয়।'
    more: |
      রাতের backup শুধু একটা ছবি; WAL মাঝের প্রতিটা লেনদেন জমা রাখে। দুটো মিলে যেকোনো মুহূর্তে ফেরা যায়। `archive_timeout` ছোট রাখলে RPO কয়েক সেকেন্ড-মিনিটে নামে।
    ref: point-in-time-recovery
  - q: 'PITR restore কেন নতুন বা scratch সার্ভারে করা হয়?'
    a: 'চালু DB-র ওপর restore করলে বর্তমান সব ডেটা মুছে যায়। আলাদা সার্ভারে করলে যাচাই করে শুধু দরকারি ডেটা ফেরত আনা যায়।'
    more: |
      ভুলের পরে আসা বৈধ লেনদেনও থাকে। পুরো DB উল্টে দিলে সেগুলো হারায়। তাই আগে আলাদা জায়গায় ফিরে, মোছা ডেটা বের করে production-এ বসানো নিরাপদ।
    ref: point-in-time-recovery
  - q: 'Restore drill কী, আর কতবার চালানো উচিত?'
    a: 'সর্বশেষ backup scratch DB-তে ঢেলে সময় মাপা আর ডেটা যাচাই করা। অন্তত সপ্তাহে একবার, স্বয়ংক্রিয়ভাবে।'
    more: |
      Drill-এ মাপা সময়টাই আপনার আসল RTO। ডেটা বাড়লে restore ধীর হয় আর RTO নীরবে বাড়ে। নিয়মিত মাপলে তা ধরা পড়ে।
    ref: restore-drill
  - q: 'Runbook কী, আর ভালো runbook-এর বৈশিষ্ট্য কী?'
    a: 'বিপদে অনুসরণের লেখা নির্দেশ: ছোট ক্রমিক ধাপ, কপি-পেস্ট কমান্ড, প্রত্যাশিত ফল, কখন থামবে, আর মালিক।'
    more: |
      রাত ৩টায় কেউ পরিকল্পনা বানাতে পারে না; অনুসরণ করতে পারে। প্রতিটা drill বা ঘটনার পর runbook হালনাগাদ না হলে কয়েক মাসে সেটা ভুল হয়ে যায়।
    ref: runbook

quiz:
  - q: 'রাত ২টার backup আছে, WAL archive নেই। ৩:০২-এ ভুল DELETE হলো। সর্বোচ্চ কী ফেরানো যাবে?'
    hint: 'ঐ ২টা থেকে ৩:০২ পর্যন্ত কোন লেনদেন কোথাও লেখা নেই।'
    options:
      - text: 'রাত ২টার অবস্থা; তারপরের প্রায় ১ ঘণ্টার ডেটা হারাবে'
        correct: true
        why: 'WAL ছাড়া শুধু backup-এর মুহূর্ত পর্যন্তই ফেরা যায়; মাঝের লেখাগুলো কোথাও জমা নেই।'
      - text: 'ঠিক ৩:০১-এর অবস্থা'
        correct: false
        why: 'এর জন্য WAL archive লাগে, যা এখানে নেই।'
      - text: 'কিছুই না, DELETE পূর্বাবস্থায় ফেরানো যায় না'
        correct: false
        why: 'রাত ২টার backup থেকে অন্তত সেই মুহূর্ত পর্যন্ত ফেরা যায়।'
      - text: 'Replica থেকে মোছা অর্ডার ফেরত আনা যাবে'
        correct: false
        why: 'Replica-তেও DELETE সাথে সাথে পৌঁছেছে।'
    ref: point-in-time-recovery
  - q: 'কোনগুলো ৩-২-১ নিয়মের অংশ?'
    hint: 'সংখ্যা তিনটার প্রতিটার মানে ভাবো।'
    options:
      - text: 'মোট তিনটা কপি (আসলসহ)'
        correct: true
        why: 'একটা আসল আর দুটো backup কপি, যাতে একটা হারালেও বাকি থাকে।'
      - text: 'দুই ধরনের মাধ্যম বা জায়গা (যেমন ডিস্ক ও object storage)'
        correct: true
        why: 'এক ধরনের ব্যর্থতায় সব কপি যেন একসাথে না যায়।'
      - text: 'একটা কপি অন্য ঠিকানায় বা অঞ্চলে'
        correct: true
        why: 'আগুন, বন্যা বা পুরো region নষ্ট হলে সেটা বাঁচে।'
      - text: 'তিনটা কপিই একই সার্ভারের তিন ডিরেক্টরিতে'
        correct: false
        why: 'সার্ভার নষ্ট হলে তিনটাই যায়, এটা আসলে একটা কপি।'
    ref: three-two-one
  - q: 'নিচের restore কমান্ডে কী ভুল?'
    lang: bash
    code: |
      # production সার্ভারে, DB চালু অবস্থায়
      pgbackrest --stanza=main restore \
        --type=time --target='2026-11-20 15:01:00' \
        --target-action=promote
    hint: 'কোন সার্ভারে, আর সময়ের সাথে কী লেখা হয়নি?'
    options:
      - text: 'চালু production DB-র ওপর restore, আর target time-এ timezone নেই'
        correct: true
        why: 'চালু DB-র ওপর restore বর্তমান সব ডেটা মুছে দেয়; আর timezone ছাড়া সময় ভুল মুহূর্তে যেতে পারে।'
      - text: '`--target-action=promote` ব্যবহার করা ভুল'
        correct: false
        why: 'promote ঠিক; লক্ষ্যে পৌঁছে DB চালু করে।'
      - text: 'pgBackRest PITR সমর্থন করে না'
        correct: false
        why: 'সমর্থন করে; `--type=time` ঠিক এই কাজেই।'
      - text: 'কোনো ভুল নেই'
        correct: false
        why: 'ভুল আছে: চালু DB আর timezone।'
    ref: point-in-time-recovery
  - q: 'Weekly restore drill সফল হলো, কিন্তু restore-এ ১১০ মিনিট লাগল। ব্যবসার RTO ৬০ মিনিট। কী করা উচিত?'
    hint: 'drill-এর আসল ফল কী?'
    options:
      - text: 'সময়ের ফাঁকটাকে সমস্যা ধরে restore দ্রুত করার উপায় খোঁজা (incremental backup, দ্রুত ডিস্ক, ছোট DB ভাগ)'
        correct: true
        why: 'drill-এর মূল্য এটাই: বিপদের আগে জানা যে লক্ষ্য মিলছে না।'
      - text: '"restore হয়েছে", তাই সব ঠিক'
        correct: false
        why: 'RTO লক্ষ্য মেলেনি। ঘটনার দিন ব্যবসা ১১০ মিনিট বন্ধ থাকবে।'
      - text: 'RTO-র সংখ্যাটা ১২০ মিনিট করে কাগজে বদলে দেওয়া'
        correct: false
        why: 'ব্যবসার প্রয়োজন কাগজে বদলায় না; ব্যবস্থাই বদলাতে হয়।'
      - text: 'drill বন্ধ করে দেওয়া, যাতে খারাপ সংখ্যা না আসে'
        correct: false
        why: 'সংখ্যা লুকালে বিপদের দিনই প্রথম জানা যায়।'
