          - 'প্রতিটা ধাপের পাশে "কী দেখলে ঠিক" লেখা।'
          - 'কে মালিক, শেষ কবে drill হয়েছে লেখা।'
          - 'কখন থামবেন আর কাকে ডাকবেন, তা স্পষ্ট।'
