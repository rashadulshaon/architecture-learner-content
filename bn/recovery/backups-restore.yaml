          - 'Scratch DB-তে ব্যক্তিগত ডেটা থাকে; সেটা production-এর মতোই সুরক্ষিত রাখুন, কাজ শেষে মুছে দিন।'
          - 'দাম: scratch সার্ভারে production-এর সমান ডিস্ক লাগে আর পুরো restore-এর সময় চালু থাকে। বিপদের দিনে জানার চেয়ে এটা অনেক সস্তা।'
