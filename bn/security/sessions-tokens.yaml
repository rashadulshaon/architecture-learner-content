slides:
  - slug: fired-but-still-in
    title: 'চাকরি গেছে, তবু token চলছে'
    kind: story
    tldr: 'স্বয়ংসম্পূর্ণ JWT একবার ছাড়লে মেয়াদ শেষ না হওয়া পর্যন্ত সার্ভার তাকে ফেরাতে পারে না — এটাই revocation সমস্যা।'
    keywords: ['JWT', 'revocation', 'logout', 'token expiry', 'টোকেন বাতিল', 'session']
    blocks:
      - type: text
        body: |
          রহিমের কোম্পানির অ্যাডমিন প্যানেলে লগইন করলে ৩০ দিনের একটা JWT পাওয়া যায়। কর্মী সুমির চাকরি আজ গেছে, অ্যাডমিন তার অ্যাকাউন্ট `disabled` করে দিল। কিন্তু সুমির ব্রাউজারে থাকা token-এ লেখা আছে "সুমি, ৩০ দিন বৈধ" — আর সার্ভার শুধু সইটা মিলিয়ে দেখে, ডেটাবেসে জিজ্ঞেস করে না। তাই সুমি আরও ২৯ দিন ঢুকতে পারল।
      - type: visual
        kind: sequence
        caption: 'অ্যাকাউন্ট বন্ধ হলো, তবু পুরনো token দিয়ে request পার হয়ে গেল'
        actors:
          - {id: sumi, label: 'সুমি', icon: user, tip: 'বরখাস্ত হওয়া কর্মী। তার ব্রাউজারে এখনও ৩০ দিনের JWT পড়ে আছে।'}
          - {id: api, label: 'API', icon: api, tip: 'শুধু JWT-এর signature আর exp তারিখ মিলিয়ে দেখে; ডেটাবেসে ব্যবহারকারীকে খোঁজে না।'}
          - {id: db, label: 'ডেটাবেস', icon: db, tip: 'এখানে সুমির অ্যাকাউন্ট disabled। কিন্তু API এই তথ্য আর জিজ্ঞেসই করছে না।'}
        messages:
          - {at: db, note: 'অ্যাডমিন সুমিকে disabled করল', tone: good, tip: 'সার্ভারের দিকে ব্যবস্থা নেওয়া হয়ে গেছে — কিন্তু token-এর কাছে খবরটা পৌঁছায়নি।'}
          - {from: sumi, to: api, label: 'GET /api/reports + পুরনো JWT', tip: 'token-এর মেয়াদ এখনও ২৯ দিন বাকি।'}
          - {at: api, note: 'signature ঠিক, মেয়াদ বাকি — পাস', tone: warn, tip: 'পুরো যাচাই শুধু গণিত: সই মেলে কি না। ডেটাবেস ছোঁয়াই হয়নি।'}
          - {from: api, to: sumi, label: '200 OK — কোম্পানির রিপোর্ট', dashed: true, tone: bad, tip: 'বরখাস্ত কর্মী এখনও গোপন রিপোর্ট পাচ্ছে।'}
    aside:
      - type: problem
        body: 'Token স্বয়ংসম্পূর্ণ হলে সার্ভারকে কিছু মনে রাখতে হয় না, তাই scale করা সহজ। কিন্তু মনে না রাখার দামটাই হলো: ফেরত নেওয়ার উপায় থাকে না।'
      - type: terms
        items:
          - {term: 'JWT', meaning: 'JSON Web Token — ব্যবহারকারীর তথ্য আর সই একসাথে ভরা একটা স্বয়ংসম্পূর্ণ token।'}
          - {term: 'Revocation', meaning: 'ছাড়া হয়ে যাওয়া token-কে মেয়াদের আগেই অচল করা।'}
    check:
      q: 'সুমির অ্যাকাউন্ট disabled করার পরও তার JWT কেন কাজ করল?'
      a: 'API শুধু signature আর মেয়াদ দেখেছে, ডেটাবেসে অ্যাকাউন্টের অবস্থা দেখেনি। token নিজেই নিজের প্রমাণ, তাই সার্ভার মেয়াদের আগে তাকে ফেরত নিতে পারে না।'

  - slug: session-vs-jwt
    title: 'খাতায় নাম লেখা, নাকি ছাপানো টিকিট?'
    kind: concept
    tldr: 'Session-এ অবস্থা থাকে সার্ভারে (সহজে বাতিল); JWT-তে থাকে token-এ (stateless, কিন্তু বাতিল কঠিন)।'
    keywords: ['session vs jwt', 'stateful', 'stateless', 'opaque token', 'সেশন', 'টোকেন']
    blocks:
      - type: metaphor
        icon: ticket
        title: 'বাসের টিকিট'
        body: |
          **Session** হলো কাউন্টারের খাতা: তুমি শুধু একটা নম্বর-লেখা চিরকুট (session id) রাখো, আসল তথ্য খাতায় থাকে। কর্তা খাতা থেকে নাম কেটে দিলেই চিরকুট অচল। **JWT** হলো ছাপানো টিকিট: তারিখ আর আসন তাতেই লেখা, কন্ডাক্টর শুধু সিল মিলিয়ে দেখে, খাতা খোলে না। তাই খাতা ছাড়াই চলে, কিন্তু একবার বিলি হওয়া টিকিট ফেরত আনা যায় না।
      - type: visual
        kind: compare
        caption: 'Session আর JWT — কী পাও, কীসের বদলে'
        columns:
          - title: 'Server-side session'
            tone: good
            icon: db
            tip: 'অবস্থা সার্ভারে (Redis বা ডেটাবেসে)। client-এর কাছে থাকে শুধু একটা এলোমেলো id।'
            items: ['logout বা ban করলে সাথে সাথে অচল', 'প্রতি request-এ store-এ একবার lookup', 'অনেক সার্ভারে লাগে shared store', 'ব্রাউজারের জন্য সবচেয়ে সহজ ও নিরাপদ']
          - title: 'JWT (self-contained)'
            tone: warn
            icon: key
            tip: 'ব্যবহারকারীর তথ্য আর সই token-এই থাকে। সার্ভার শুধু সই যাচাই করে, কিছু মনে রাখে না।'
            items: ['কোনো lookup ছাড়াই যাচাই', 'অনেক সার্ভার ও সার্ভিসে সহজে চলে', 'মেয়াদ শেষের আগে বাতিল করা কঠিন', 'payload encoded, encrypted নয় — সবাই পড়তে পারে']
      - type: quote
        body: 'JWT-র payload শুধু base64-encoded, গোপন নয়। সেখানে পাসওয়ার্ড বা গোপন তথ্য রেখো না।'
    aside:
      - type: when
        use: ['ব্রাউজার-ভিত্তিক নিজের অ্যাপ হলে session', 'একাধিক সার্ভিস বা মোবাইল API-তে ছোট মেয়াদের token']
        avoid: ['লম্বা মেয়াদের JWT, যা বাতিল করার উপায় নেই']
      - type: tips
        items:
          - 'Symfony-র ডিফল্ট firewall session চালায়: তুমি কিছু না করলেই cookie-ভিত্তিক session পাও।'
          - '"JWT আধুনিক, session পুরনো" — এটা ভুল ধারণা। দুটোই ঠিক জায়গায় ঠিক।'
    check:
      q: 'যে অ্যাপ শুধু একটা ব্রাউজার ফ্রন্টএন্ড চালায়, সেখানে session না JWT, আর কেন?'
      a: 'Session। সহজে বাতিল করা যায়, cookie ব্রাউজার নিজেই সামলায়, আর JWT-র stateless সুবিধা এখানে দরকারই নেই।'

  - slug: access-refresh
    title: 'ছোট মেয়াদের access token আর refresh token'
    kind: howto
    tldr: 'Access token ১৫ মিনিটের, refresh token লম্বা কিন্তু একবার-ব্যবহারযোগ্য ও ডেটাবেসে hash করা — তাহলে চুরির ক্ষতি সীমিত থাকে।'
    keywords: ['access token', 'refresh token', 'rotation', 'reuse detection', 'access_token handler', 'টোকেন নবায়ন']
    blocks:
      - type: text
        body: |
          সমাধান হলো দুই ধরনের token। **Access token** ১৫ মিনিটের — চুরি হলেও ক্ষতি সীমিত। **Refresh token** লম্বা মেয়াদের, শুধু নতুন access token আনার কাজে লাগে, আর ডেটাবেসে থাকে বলে বাতিল করা যায়। প্রতিবার refresh করলে পুরনোটা খরচ হয়ে নতুন একটা আসে (rotation)।
      - type: visual
        kind: flow
        caption: 'Access token পুরনো হলে refresh token দিয়ে নতুন জোড়া আসে'
        nodes:
          - {id: app, label: 'Vue অ্যাপ', sub: 'ব্রাউজার', icon: browser, col: 0, row: 0, tip: 'ব্যবহারকারীর ব্রাউজার। access token দিয়ে API ডাকে।'}
          - {id: api, label: 'API', sub: 'access_token firewall', icon: api, col: 2, row: 0, tip: 'প্রতি request-এ access token যাচাই করে।'}
          - {id: refresh, label: '/api/token/refresh', sub: 'rotation', icon: repeat, tone: accent, col: 2, row: 1.5, tip: 'পুরনো refresh token নিয়ে নতুন access আর refresh জোড়া দেয়।'}
          - {id: db, label: 'ডেটাবেস', sub: 'token-এর hash', icon: db, col: 4, row: 1.5, tip: 'refresh token-এর SHA-256 hash, মেয়াদ আর used অবস্থা থাকে। আসল token থাকে না।'}
        edges:
          - {from: app, to: api, label: 'মেয়াদ থাকা access token দিয়ে request যায়'}
          - {from: api, to: app, label: '১৫ মিনিট পর 401: access token অচল', dashed: true, tone: bad}
          - {from: app, to: refresh, label: 'refresh token পাঠায় (cookie-তে)'}
          - {from: refresh, to: db, label: 'hash মিলিয়ে দেখে: বৈধ ও এখনও অব্যবহৃত'}
          - {from: refresh, to: app, label: 'নতুন জোড়া দেয়, পুরনো refresh খরচ হলো', dashed: true, tone: good}
      - type: code
        lang: php
        file: 'src/Security/AccessTokenHandler.php'
        variant: good
        code: |
          final class AccessTokenHandler implements AccessTokenHandlerInterface
          {
              public function __construct(private AccessTokenRepository $tokens) {}

              public function getUserBadgeFrom(#[\SensitiveParameter] string $accessToken): UserBadge
              {
                  // ডেটাবেসে আসল token নয়, তার hash থাকে
                  $row = $this->tokens->findActiveByHash(hash('sha256', $accessToken));
                  if (null === $row) {
                      throw new BadCredentialsException('Invalid credentials.');
                  }

                  return new UserBadge($row->getUser()->getUserIdentifier());
              }
          }
        marks:
          - {line: 8, tip: 'ডেটাবেস চুরি হলেও hash থেকে আসল token বানানো যায় না।'}
          - {line: 9, tip: 'revoked বা মেয়াদ-পেরোনো token এখানেই বাদ। তাই ban করলে সাথে সাথে কাজ করে।'}
      - type: code
        lang: yaml
        file: 'config/packages/security.yaml'
        code: |
          security:
              firewalls:
                  api:
                      pattern: ^/api
                      stateless: true
                      access_token:
                          token_handler: App\Security\AccessTokenHandler
        marks:
          - {line: 5, tip: 'stateless: true মানে Symfony session বানাবে না; প্রতি request-এর token-ই পরিচয়।'}
    aside:
      - type: tips
        items:
          - 'Refresh token-এ reuse detection রাখো: একটা খরচ-হওয়া token আবার এলে সেই ব্যবহারকারীর সব token বাতিল করো, কারণ কেউ চুরি করেছে।'
          - 'Refresh token-এ random_bytes(32) দিয়ে বানানো opaque string ব্যবহার করো, তাতে কোনো তথ্য ভরো না।'
      - type: refs
        items:
          - {to: 'security/account-recovery', label: 'পাসওয়ার্ড বদলালে সব session বাতিল'}
    check:
      q: 'Refresh token ডেটাবেসে hash করে রাখা হয় কেন, আর rotation কী কাজে লাগে?'
      a: 'ডেটাবেস ফাঁস হলেও hash থেকে আসল token মেলে না। Rotation-এ প্রতিবার নতুন token আসে, তাই পুরনোটা আবার এলে চুরি ধরা পড়ে।'

  - slug: where-to-store
    title: 'Token রাখবে কোথায়: localStorage নয়'
    kind: pitfall
    tldr: 'localStorage-এর token যেকোনো XSS পড়তে পারে; HttpOnly + Secure + SameSite cookie-তে JavaScript হাতই দিতে পারে না।'
    keywords: ['localStorage', 'HttpOnly cookie', 'XSS', 'SameSite', 'CSRF', 'token storage', 'ব্রাউজারে token']
    blocks:
      - type: text
        body: |
          অনেকে আরাম করে token `localStorage`-এ রাখে। সমস্যা হলো, পাতায় একটা XSS ফাঁক থাকলেই আক্রমণকারীর script সেই token পড়ে নিজের সার্ভারে পাঠাতে পারে। `HttpOnly` cookie JavaScript পড়তে পারে না, ব্রাউজার শুধু নিজে request-এর সাথে পাঠায়।
      - type: code
        lang: ts
        file: 'src/auth/login.ts'
        variant: bad
        code: |
          const { accessToken } = await api.post('/api/login', creds)
          // যেকোনো XSS script এটা পড়ে নিতে পারে
          localStorage.setItem('token', accessToken)
        marks:
          - {line: 3, tip: 'localStorage-এর সব মান পাতার যেকোনো JavaScript পড়তে পারে, তৃতীয়-পক্ষের script-ও।'}
      - type: code
        lang: php
        file: 'src/Controller/AuthController.php'
        variant: good
        code: |
          $response = new JsonResponse(['expiresIn' => 900]);
          $response->headers->setCookie(
              Cookie::create('refresh_token')
                  ->withValue($refreshToken)
                  ->withHttpOnly(true)            // JS পড়তে পারে না
                  ->withSecure(true)              // শুধু HTTPS-এ
                  ->withSameSite(Cookie::SAMESITE_STRICT)
                  ->withPath('/api/token')        // শুধু refresh route-এ যায়
                  ->withExpiresAt(new \DateTimeImmutable('+30 days')),
          );
        marks:
          - {line: 5, tip: 'HttpOnly: XSS হলেও script এই cookie-র মান দেখতে পারে না।'}
          - {line: 7, tip: 'SameSite=Strict অন্য সাইট থেকে আসা request-এ cookie যেতে দেয় না — CSRF-এর বিরুদ্ধে ঢাল।'}
          - {line: 8, tip: 'path সীমিত করলে cookie কেবল refresh route-এ যায়, বাকি request-এ নয়।'}
      - type: quote
        body: 'Token কখনো localStorage-এ নয়। Refresh token থাকবে HttpOnly, Secure, SameSite cookie-তে।'
    aside:
      - type: pitfalls
        items:
          - 'Cookie-তে access token রাখলে CSRF ঝুঁকি আসে; তাই SameSite রাখো আর বদলানোর request-এ CSRF token ভাবো।'
          - 'Access token Vue-র memory-তে (Pinia state) রাখা যায়: পাতা reload হলে refresh cookie দিয়ে আবার আনো।'
      - type: refs
        items:
          - {to: 'security/input-validation', label: 'XSS কীভাবে ঠেকায়'}
    check:
      q: 'HttpOnly cookie থাকলেও XSS পুরোপুরি নিরীহ হয় না। তবু refresh token সেখানে রাখা ভালো কেন?'
      a: 'Script তখনও request পাঠাতে পারে, কিন্তু token নিজের সার্ভারে চুরি করে নিয়ে অন্য জায়গা থেকে অনির্দিষ্টকাল ব্যবহার করতে পারে না। ক্ষতি ঐ পাতার সময়টুকুতে সীমিত থাকে।'

flashcards:
  - q: 'Session আর JWT-র মূল পার্থক্য কী?'
    a: 'Session-এ অবস্থা থাকে সার্ভারে, client-এর কাছে থাকে শুধু id। JWT-তে তথ্য আর সই token-এই থাকে, সার্ভার কিছু মনে রাখে না।'
    more: |
      বাসের কাউন্টারের খাতার সাথে ছাপানো টিকিটের তুলনা ভাবো। খাতা থেকে নাম কাটলেই চিরকুট অচল (session)। ছাপানো টিকিট বিলি হয়ে গেলে ফেরানো যায় না (JWT)।
    ref: session-vs-jwt
  - q: 'JWT-র সবচেয়ে বড় সমস্যা কী?'
    a: 'মেয়াদ শেষের আগে বাতিল (revoke) করা কঠিন, কারণ সার্ভার শুধু সই দেখে, কিছু মনে রাখে না।'
    more: |
      ব্যবহারকারী ban বা logout হলেও পুরনো JWT মেয়াদ পর্যন্ত কাজ করে। তাই JWT-র মেয়াদ ছোট রাখা হয়, আর বাতিলের দরকার থাকলে denylist বা ডেটাবেসে-মেলানো token ব্যবহার হয়।
    ref: fired-but-still-in
  - q: 'JWT-র payload কি গোপন থাকে?'
    a: 'না। Payload শুধু base64-encoded, encrypted নয়; যে কেউ পড়তে পারে। তাই সেখানে গোপন তথ্য রাখা চলবে না।'
    more: |
      সই শুধু প্রমাণ করে তথ্য বদলানো হয়নি, গোপন রাখে না। jwt.io-তে যেকোনো JWT পেস্ট করলেই payload পড়া যায়। user id আর মেয়াদের মতো নিরীহ তথ্যই রাখো।
    ref: session-vs-jwt
  - q: 'Access আর refresh token-এর মেয়াদ সাধারণত কত রাখা হয়?'
    a: 'Access token ৫–১৫ মিনিট। Refresh token কয়েক দিন থেকে ৩০ দিন, ডেটাবেসে হ্যাশ করা, বাতিলযোগ্য।'
    more: |
      ছোট access token চুরি গেলে ক্ষতির জানালা ছোট থাকে। লম্বা মেয়াদের refresh token ডেটাবেসে থাকে বলে logout বা ban-এ সরাসরি মুছে ফেলা যায়।
    ref: access-refresh
  - q: 'Refresh token rotation কী?'
    a: 'প্রতিবার refresh-এ পুরনো token খরচ করে নতুন জোড়া দেওয়া হয়। খরচ-হওয়া token আবার এলে বোঝা যায় সেটা চুরি।'
    more: |
      Reuse ধরা পড়লে ঐ ব্যবহারকারীর সব token বাতিল করা হয়, ফলে চোর আর আসল ব্যবহারকারী দুজনেই বের হয়ে যায় এবং আসল জন আবার লগইন করে। এটাই refresh token চুরি ধরার সবচেয়ে প্রচলিত উপায়।
    ref: access-refresh
  - q: 'Refresh token ডেটাবেসে hash করে রাখা হয় কেন?'
    a: 'ডেটাবেস ফাঁস হলেও hash থেকে আসল token বের করা যায় না, ঠিক পাসওয়ার্ডের মতো।'
    more: |
      Token যথেষ্ট লম্বা ও random হলে (`random_bytes(32)`) দ্রুত SHA-256 যথেষ্ট, bcrypt লাগে না। পাসওয়ার্ড কম entropy-র বলেই ধীর hash লাগে।
    ref: access-refresh
  - q: 'Token ব্রাউজারে কোথায় রাখা উচিত?'
    a: 'Refresh token থাকবে HttpOnly, Secure, SameSite cookie-তে। localStorage-এ নয়, কারণ XSS script সেটা পড়তে পারে।'
    more: |
      Access token চাইলে JavaScript-এর memory-তে (Pinia state) রাখো; পাতা reload হলে cookie-র refresh token দিয়ে নতুন আনো। এতে disk-এ পড়ার মতো কিছুই থাকে না।
    ref: where-to-store
  - q: 'Cookie-র SameSite=Strict কী ঠেকায়?'
    a: 'অন্য সাইট থেকে শুরু হওয়া request-এ cookie যায় না, তাই CSRF আক্রমণ কঠিন হয়।'
    more: |
      Strict-এ বাইরের লিংক থেকে এলে প্রথম request-এও cookie যায় না; Lax-এ নিরাপদ GET navigation-এ যায়। বদলানোর request-এ অন্তত Lax রাখো।
    ref: where-to-store

quiz:
  - q: 'কোম্পানি ব্যবহারকারীকে ban করলেই সাথে সাথে তার অ্যাক্সেস বন্ধ করতে চায়। কোন নকশাটা এটা সবচেয়ে সহজে দেয়?'
    hint: 'সার্ভার কি প্রতি request-এ কিছু মিলিয়ে দেখে?'
    options:
      - text: '৩০ দিনের self-contained JWT'
        correct: false
        why: 'সার্ভার শুধু সই আর মেয়াদ দেখে, তাই ban হলেও token ৩০ দিন চলবে।'
      - text: 'Server-side session বা ডেটাবেসে-মেলানো opaque token'
        correct: true
        why: 'প্রতি request-এ store দেখা হয়; সারি মুছলেই token অচল।'
      - text: 'JWT-র payload-এ `banned: false` লিখে রাখা'
        correct: false
        why: 'ছাড়া হয়ে গেছে এমন token-এর payload আর বদলানো যায় না।'
      - text: 'ব্যবহারকারীকে বলা যেন নিজে logout করে'
        correct: false
        why: 'ban মানে সার্ভারের সিদ্ধান্ত; ব্যবহারকারীর সহযোগিতার ওপর নির্ভর করা চলে না।'
    ref: fired-but-still-in
  - q: 'এই JWT-র payload-টা `{"sub":"42","email":"a@x.com","password":"1234","exp":1893456000}`। সমস্যা কী?'
    hint: 'JWT-র payload কে পড়তে পারে?'
    options:
      - text: 'কোনো সমস্যা নেই, JWT তো সই করা'
        correct: false
        why: 'সই বদল ঠেকায়, গোপনীয়তা দেয় না।'
      - text: 'Payload শুধু base64-encoded, তাই password সবাই পড়তে পারবে'
        correct: true
        why: 'token যার হাতে পড়বে, সে-ই payload decode করে পাসওয়ার্ড দেখবে। গোপন কিছু payload-এ রাখা চলে না।'
      - text: 'শুধু `exp` ফিল্ড থাকা উচিত, আর কিছু নয়'
        correct: false
        why: 'sub, exp-এর মতো নিরীহ ফিল্ড রাখা ঠিক; সমস্যা শুধু গোপন তথ্যে।'
    ref: session-vs-jwt
  - q: 'নিচের কোনগুলো access + refresh token নকশার সুবিধা?'
    hint: 'কোনগুলো ক্ষতির সময়সীমা ছোট করে আর বাতিল করা সম্ভব করে?'
    options:
      - text: 'Access token চুরি গেলে ক্ষতির জানালা ১৫ মিনিটে সীমিত'
        correct: true
        why: 'মেয়াদ ছোট বলে চোরের হাতে token দীর্ঘ সময় থাকে না।'
      - text: 'Refresh token ডেটাবেসে থাকে, তাই logout বা ban-এ বাতিল করা যায়'
        correct: true
        why: 'সারিটা মুছলেই আর নতুন access token পাওয়া যায় না।'
      - text: 'সার্ভারকে আর কখনো কোনো অবস্থা মনে রাখতে হয় না'
        correct: false
        why: 'Refresh token মনে রাখতে হয় বলেই বাতিল সম্ভব; পুরোপুরি stateless নয়।'
      - text: 'Token চুরি হওয়া অসম্ভব হয়ে যায়'
        correct: false
        why: 'চুরি ঠেকে না; শুধু ক্ষতি সীমিত হয়।'
    ref: access-refresh
  - q: 'কোন কোড কর্মীর ব্রাউজারে সবচেয়ে বেশি ঝুঁকি তৈরি করে?'
    lang: ts
    code: |
      const res = await api.post('/api/login', creds)
      localStorage.setItem('refreshToken', res.refreshToken)
    hint: 'পাতায় একটা XSS ফাঁক থাকলে কে এটা পড়তে পারবে?'
    options:
      - text: 'Refresh token localStorage-এ — XSS script পড়ে নিজের সার্ভারে পাঠাতে পারে'
        correct: true
        why: 'localStorage-এর সবকিছু পাতার যেকোনো script পড়তে পারে, তাই লম্বা মেয়াদের token চুরি হতে পারে।'
      - text: 'POST না করে GET করা উচিত'
        correct: false
        why: 'লগইনে GET ব্যবহার করলে পাসওয়ার্ড URL-এ ও log-এ চলে যেত; আরও খারাপ।'
      - text: 'async/await ব্যবহার করাই সমস্যা'
        correct: false
        why: 'এর সাথে নিরাপত্তার কোনো সম্পর্ক নেই।'
    ref: where-to-store
  - q: 'কেউ একটা আগেই-খরচ-হওয়া refresh token দিয়ে আবার `/api/token/refresh` ডাকল। সার্ভারের কী করা উচিত?'
    hint: 'একটা token দুইবার আসার মানে কী হতে পারে?'
    options:
      - text: 'চুপচাপ নতুন token দিয়ে দেওয়া'
        correct: false
        why: 'এতে চোরও অনির্দিষ্টকাল refresh করে যেতে পারত।'
      - text: 'শুধু ঐ একটা request 401 দিয়ে ফেরানো, আর কিছু নয়'
        correct: false
        why: 'আসল ব্যবহারকারী আর চোরের কে ঠিক বোঝা যায় না; পুরো token-পরিবার না কাটলে চোর অন্য শাখায় চলতে পারে।'
      - text: 'ঐ ব্যবহারকারীর সব refresh token বাতিল করে নতুন লগইন চাওয়া'
        correct: true
        why: 'Reuse মানে token-পরিবার ফাঁস হয়েছে; সব বাতিল করলে চোর বের হয়, আসল ব্যবহারকারী আবার লগইন করে।'
    ref: access-refresh
  - q: 'নিচের কোন কাজগুলো token-চুরির ক্ষতি কমায়?'
    hint: 'কোনগুলো JavaScript-কে token থেকে দূরে রাখে বা জানালা ছোট করে?'
    options:
      - text: 'Refresh token HttpOnly cookie-তে রাখা'
        correct: true
        why: 'XSS script সেটা পড়তে পারে না।'
      - text: 'Access token-এর মেয়াদ ১৫ মিনিট রাখা'
        correct: true
        why: 'চুরি গেলেও খুব অল্প সময় কাজ করে।'
      - text: 'Token localStorage-এ রাখা, কারণ সেটা cookie-র চেয়ে সহজ'
        correct: false
        why: 'সহজ, কিন্তু যেকোনো XSS পড়তে পারে।'
      - text: 'Token-এর মেয়াদ ১ বছর করা, যাতে ব্যবহারকারী বিরক্ত না হয়'
        correct: false
        why: 'লম্বা মেয়াদ ক্ষতির জানালা বিশাল করে।'
    ref: where-to-store
