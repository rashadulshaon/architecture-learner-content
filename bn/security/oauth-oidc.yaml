slides:
  - slug: give-password-to-app
    title: 'নতুন অ্যাপ চাইল আপনার Gmail-এর পাসওয়ার্ড'
    kind: story
    tldr: 'অন্য অ্যাপকে নিজের পাসওয়ার্ড দেওয়া মানে সব ক্ষমতা দেওয়া; OAuth2 দেয় সীমিত, মেয়াদি, বাতিলযোগ্য অনুমতি।'
    keywords: ['OAuth2', 'delegated access', 'password anti-pattern', 'scope', 'Google দিয়ে লগইন', 'অনুমতি']
    blocks:
      - type: text
        body: |
          একটা ছবি-প্রিন্টের অ্যাপ বলল, "আপনার Google Photos থেকে ছবি আনতে Gmail-এর ইমেইল আর পাসওয়ার্ড দিন।" দিলে অ্যাপ শুধু ছবি নয়, ইমেইল, Drive, সবই পড়তে পারে — আর আপনি পাসওয়ার্ড না বদলালে সেটা সে চিরকাল রাখতে পারে। কোনো একদিন অ্যাপের ডেটাবেস ফাঁস হলে আপনার Google অ্যাকাউন্টও গেল। আমরা চাই "শুধু ছবি, শুধু আজকের জন্য, আমি যেকোনো সময় বন্ধ করতে পারব।"
      - type: visual
        kind: compare
        caption: 'পাসওয়ার্ড দেওয়া বনাম OAuth2 অনুমতি'
        columns:
          - title: 'অ্যাপকে পাসওয়ার্ড দেওয়া'
            tone: bad
            icon: cross
            tip: 'অ্যাপ তখন আপনার হয়ে সব করতে পারে। আলাদা করে কিছু আটকানোর উপায় নেই।'
            items: ['সব ক্ষমতা, সীমা নেই', 'মেয়াদ নেই — চিরকাল', 'বন্ধ করতে পাসওয়ার্ডই বদলাতে হয়', 'অ্যাপ ফাঁস হলে Google অ্যাকাউন্টও ফাঁস']
          - title: 'OAuth2 অনুমতি'
            tone: good
            icon: check
            tip: 'পাসওয়ার্ড অ্যাপ কখনো দেখে না। সে পায় একটা সীমিত, মেয়াদি token।'
            items: ['শুধু scope-এ লেখা কাজ (যেমন ছবি পড়া)', 'access token-এর ছোট মেয়াদ', 'Google-এর সেটিংস থেকে এক ক্লিকে বাতিল', 'অ্যাপ ফাঁস হলে শুধু ঐ scope-টুকু ঝুঁকিতে']
    aside:
      - type: story
        title: 'Facebook যুগের শিক্ষা'
        body: |
          আগের দিনে অনেক সাইট "বন্ধুদের খুঁজতে ইমেইলের পাসওয়ার্ড দিন" বলত। OAuth এসেছে ঠিক সেই অভ্যাস বন্ধ করতে: পাসওয়ার্ড থাকে শুধু যার সে-ই চেনে, আর অন্যরা পায় আলাদা চাবি।
    check:
      q: 'অ্যাপকে পাসওয়ার্ড না দিয়ে OAuth2 token দিলে কী কী সুবিধা পান?'
      a: 'অ্যাপ শুধু scope-এ লেখা কাজই করতে পারে, token-এর মেয়াদ থাকে, আর Google থেকে যেকোনো সময় বাতিল করা যায়। পাসওয়ার্ড কখনো অ্যাপের কাছে যায় না।'

  - slug: actors-and-protocols
    title: 'কে কে আছে, আর OAuth2, OIDC, SAML কে কীসের জন্য'
    kind: concept
    tldr: 'OAuth2 অনুমতি দেয় (authorization); OIDC তার ওপর "ইনি কে" যোগ করে; SAML একই কাজ পুরনো XML ধাঁচে, কর্পোরেট SSO-তে।'
    keywords: ['OAuth2', 'OIDC', 'SAML', 'id_token', 'access token', 'SSO', 'identity provider', 'resource owner', 'scope']
    blocks:
      - type: metaphor
        icon: building
        title: 'বাসার দারোয়ান ও অতিথি-স্লিপ'
        body: |
          রহিম (**resource owner**) দারোয়ানকে (**authorization server**) বলল, "এই কুরিয়ারওয়ালা (**client**) আমার শুধু ডাকবাক্সটা খুলতে পারবে।" দারোয়ান একটা স্লিপ দিল (**access token**) যাতে লেখা আছে ডাকবাক্স শুধু (**scope**) আর আজ বিকাল ৫টা পর্যন্ত। ডাকবাক্স (**resource server**) স্লিপ দেখেই খোলে। এর সাথে দারোয়ান যদি একটা পরিচয়পত্রও দেয় যে "ইনি ৩০২ নম্বরের রহিম", সেটাই **OIDC-র id_token**।
      - type: visual
        kind: table
        caption: 'তিনটা প্রোটোকল এক নজরে'
        headers: ['', 'OAuth2', 'OIDC', 'SAML']
        rows:
          - cells: ['কী দেয়', 'access token', 'id_token + access token', 'XML assertion']
            tip: 'OAuth2 শুধু "এটা করতে দেওয়া হয়েছে" বলে। OIDC যোগ করে "ইনি অমুক"। SAML একই কথা XML-এ বলে।'
          - cells: ['উত্তর দেয়', 'কী করতে পারেন?', 'আপনি কে? (লগইন)', 'আপনি কে? (কর্পোরেট SSO)']
            tip: 'শুধু OAuth2-কে লগইনের প্রমাণ ধরা ভুল: access token কার জন্য, তা সে বলে না।'
          - cells: ['তথ্যের ধরন', 'JSON / opaque token', 'JWT', 'XML, সই-করা']
            tip: 'OIDC-র id_token সবসময় JWT। SAML-এর assertion অনেক বড় XML।'
          - cells: ['কোথায় চলে', 'API-র অনুমতি', 'Google/GitHub দিয়ে লগইন', 'অফিসের Okta, AD FS']
            tip: 'বড় কোম্পানির পুরনো enterprise সফটওয়্যার এখনও SAML চায়। নতুন প্রজেক্টে সাধারণত OIDC।'
      - type: quote
        body: 'OAuth2 হলো অনুমতির জন্য, লগইনের জন্য নয়। "ইনি কে" জানতে লাগে OIDC-র id_token।'
    aside:
      - type: terms
        items:
          - {term: 'Scope', meaning: 'token কোন কোন কাজ করতে পারবে তার তালিকা, যেমন photos.read।'}
          - {term: 'IdP', meaning: 'Identity Provider — যে পরিচয় যাচাই করে (Google, Okta)।'}
          - {term: 'SSO', meaning: 'একবার লগইন করে অনেক অ্যাপে ঢোকা।'}
      - type: remember
        body: 'OAuth2 = কী করতে পারেন। OIDC = আপনি কে। SAML = OIDC-র পুরনো, XML চাচাতো ভাই।'
    check:
      q: 'শুধু OAuth2 access token পেয়েই কি বলা যায় লোকটা কে, আর না হলে কী দরকার?'
      a: 'না। access token শুধু অনুমতি বোঝায়, পরিচয় নয়। পরিচয় জানতে OIDC-র id_token নিতে হয় এবং তার iss, aud, exp, nonce যাচাই করতে হয়।'

  - slug: code-flow-pkce
    title: 'Authorization code + PKCE: ধাপে ধাপে'
    kind: howto
    tldr: 'ব্রাউজারে শুধু একবার-ব্যবহারযোগ্য code যায়; code বদলে token আনে সার্ভার, সাথে PKCE-র code_verifier দিয়ে প্রমাণ দেয় সে-ই শুরু করেছিল।'
    keywords: ['authorization code', 'PKCE', 'code_verifier', 'code_challenge', 'state', 'nonce', 'redirect_uri', 'login with google']
    blocks:
      - type: text
        body: |
          আজকের একমাত্র বৈধ উপায় হলো **authorization code flow**। ব্রাউজার ঘুরে আসে শুধু একটা ছোট code নিয়ে, আসল token আসে সার্ভারের সাথে সার্ভারের সরাসরি যোগাযোগে। **PKCE** একটা বাড়তি তালা: শুরুতে অ্যাপ একটা গোপন `code_verifier` বানিয়ে তার hash (`code_challenge`) পাঠায়, শেষে মূল verifier দেখিয়ে প্রমাণ করে code-টা চুরি করা কারও হাতে নয়।
      - type: visual
        kind: sequence
        caption: 'Code flow-এর ধাপগুলো, state আর PKCE সহ'
        actors:
          - {id: user, label: 'ব্রাউজার', icon: browser, tip: 'রহিমের ব্রাউজার। শুধু redirect বয়ে বেড়ায়; আসল token কখনো এর হাতে আসে না।'}
          - {id: app, label: 'আমাদের অ্যাপ', icon: server, tip: 'Symfony ব্যাকএন্ড, OAuth client। state, nonce আর verifier session-এ রাখে।'}
          - {id: idp, label: 'Google', icon: shield, tip: 'Authorization server। রহিমকে লগইন করায়, অনুমতি চায়, code ও token দেয়।'}
        messages:
          - {from: user, to: app, label: '"Google দিয়ে লগইন" চাপল', tip: 'অ্যাপ এখানে state, nonce আর code_verifier বানিয়ে session-এ রাখে।'}
          - {from: app, to: idp, label: 'redirect: client_id, state, code_challenge', tip: 'ব্রাউজারকে Google-এর authorize URL-এ পাঠানো হয়। challenge হলো verifier-এর SHA-256 hash।'}
          - {at: idp, note: 'রহিম লগইন করে অনুমতি দেয়', tone: good, tip: 'পাসওয়ার্ড শুধু Google দেখে, আমাদের অ্যাপ নয়।'}
          - {from: idp, to: app, label: 'redirect_uri-তে ফেরত: code + state', tip: 'code একবার-ব্যবহারযোগ্য, ছোট মেয়াদের। অ্যাপ প্রথমে state মেলায়।'}
          - {from: app, to: idp, label: 'code + code_verifier + client_secret', tip: 'সার্ভার থেকে সার্ভারে। Google verifier-এর hash মিলিয়ে দেখে।'}
          - {from: idp, to: app, label: 'id_token + access_token', dashed: true, tone: good, tip: 'এবার অ্যাপ id_token-এর claim যাচাই করে রহিমকে চিনে লগইন করায়।'}
      - type: code
        lang: php
        file: 'src/Controller/OidcController.php'
        variant: good
        code: |
          #[Route('/auth/start', name: 'oidc_start')]
          public function start(Request $request): RedirectResponse
          {
              $verifier = rtrim(strtr(base64_encode(random_bytes(32)), '+/', '-_'), '=');
              $challenge = rtrim(strtr(base64_encode(hash('sha256', $verifier, true)), '+/', '-_'), '=');
              $session = $request->getSession();
              $session->set('pkce_verifier', $verifier);
              $session->set('oidc_state', $state = bin2hex(random_bytes(16)));
              $session->set('oidc_nonce', $nonce = bin2hex(random_bytes(16)));

              return new RedirectResponse('https://accounts.google.com/o/oauth2/v2/auth?'
                  .http_build_query([
                      'response_type' => 'code',
                      'client_id' => $this->clientId,
                      'redirect_uri' => $this->urls->generate('oidc_callback', [],
                          UrlGeneratorInterface::ABSOLUTE_URL),
                      'scope' => 'openid email profile',
                      'state' => $state, 'nonce' => $nonce,
                      'code_challenge' => $challenge, 'code_challenge_method' => 'S256',
                  ]));
          }
        marks:
          - {line: 4, tip: 'verifier হলো ৩২ বাইটের random গোপন; challenge শুধু তার hash, তাই চুরি হলেও verifier বেরোয় না।'}
          - {line: 8, tip: 'state CSRF ঠেকায়: ফেরত আসা state যদি session-এর সাথে না মেলে, request-টা আমরা শুরুই করিনি।'}
          - {line: 9, tip: 'nonce id_token-কে এই নির্দিষ্ট লগইন চেষ্টার সাথে বেঁধে দেয়, যাতে পুরনো token আবার চালানো না যায়।'}
          - {line: 17, tip: 'scope-এ openid থাকলেই এটা OIDC লগইন, শুধু OAuth2 নয়।'}
    aside:
      - type: tips
        items:
          - 'Client secret রাখতে পারে না এমন client (Vue SPA, মোবাইল অ্যাপ) — public client — তাদের জন্য PKCE বাধ্যতামূলক। এখন confidential client-এও PKCE রাখাই নিয়ম।'
          - 'Authorize URL হাতে না বানিয়ে `league/oauth2-client` বা `knpuniversity/oauth2-client-bundle`-এর মতো মানসম্পন্ন লাইব্রেরি ব্যবহার করুন।'
      - type: refs
        items:
          - {to: 'security/secrets-management', label: 'client_secret রাখার নিয়ম'}
    check:
      q: 'আক্রমণকারী redirect থেকে code চুরি করলেও PKCE থাকলে সেটা দিয়ে token পায় না কেন?'
      a: 'Token চাইতে মূল `code_verifier` লাগে, যেটা শুধু শুরু করা অ্যাপের session-এ আছে। চোর শুধু code আর hash (challenge) জানে; hash থেকে verifier বের করা যায় না।'

  - slug: validate-callback
    title: 'ফেরত এল: যাচাই না করে বিশ্বাস নয়'
    kind: howto
    tldr: 'Callback-এ state মেলান, code বদলান, তারপর id_token-এর iss, aud, exp, nonce দেখুন; API-তে access token যাচাই করে Symfony-র oidc handler।'
    keywords: ['id_token validation', 'iss', 'aud', 'nonce', 'oidc token handler', 'JWKS', 'callback', 'resource server']
    blocks:
      - type: text
        body: |
          দারোয়ানের পরিচয়পত্রও না দেখে মানা যায় না: কে দিয়েছে (`iss`), কার জন্য (`aud` = আমাদের client_id), মেয়াদ (`exp`), আর এই লগইনের জন্যই কি না (`nonce`)। নিচের কোডে id_token সরাসরি Google-এর token endpoint থেকে TLS-এ এসেছে, তাই OIDC spec অনুযায়ী signature-এর বদলে এই claim-গুলো যাচাই যথেষ্ট। ব্রাউজারের মধ্য দিয়ে এলে signature-ও যাচাই করতে হতো।
      - type: code
        lang: php
        file: 'src/Controller/OidcController.php'
        variant: good
        code: |
          #[Route('/auth/callback', name: 'oidc_callback')]
          public function callback(Request $request, HttpClientInterface $http): Response
          {
              $s = $request->getSession();
              if (!hash_equals((string) $s->remove('oidc_state'), $request->query->getString('state'))) {
                  throw new AccessDeniedHttpException('state mismatch');
              }
              $tokens = $http->request('POST', 'https://oauth2.googleapis.com/token', ['body' => [
                  'grant_type' => 'authorization_code',
                  'code' => $request->query->getString('code'),
                  'redirect_uri' => $this->urls->generate('oidc_callback', [], 0),
                  'client_id' => $this->clientId, 'client_secret' => $this->clientSecret,
                  'code_verifier' => $s->remove('pkce_verifier'),
              ]])->toArray();

              [, $payload] = explode('.', $tokens['id_token']);
              $c = json_decode(base64_decode(strtr($payload, '-_', '+/')), true, 8, JSON_THROW_ON_ERROR);
              $nonce = (string) $s->remove('oidc_nonce');
              if ($c['iss'] !== 'https://accounts.google.com' || $c['aud'] !== $this->clientId
                  || $c['exp'] < time() || !hash_equals($nonce, $c['nonce'] ?? '')) {
                  throw new AccessDeniedHttpException('invalid id_token');
              }

              return $this->loginOrRegister($c['sub'], $c['email']);   // sub হলো স্থায়ী পরিচয়
          }
        marks:
          - {line: 5, tip: 'state না মিললে এখানেই থামো। remove() মানে একবার ব্যবহারের পর session থেকে মুছে যায়।'}
          - {line: 16, tip: 'দ্বিতীয় অংশ (payload) base64url-encoded JSON। এখানে signature যাচাই বাদ, কারণ token এসেছে সরাসরি Google থেকে HTTPS-এ।'}
          - {line: 19, tip: 'চারটা যাচাই: কে দিল, কার জন্য, মেয়াদ আছে কি না, আর এই লগইনেরই nonce কি না।'}
          - {line: 24, tip: 'ইমেইল বদলাতে পারে; ব্যবহারকারী চেনার স্থায়ী চাবি হলো sub claim।'}
      - type: code
        lang: yaml
        file: 'config/packages/security.yaml'
        code: |
          security:
              firewalls:
                  api:
                      pattern: ^/api
                      stateless: true
                      access_token:
                          token_handler:
                              oidc:
                                  algorithms: ['ES256']
                                  issuers: ['https://accounts.example.com']
                                  audience: 'orders-api'
                                  keyset: '%env(OIDC_JWKS)%'
        marks:
          - {line: 9, tip: 'আমাদের নিজের API যদি অন্য IdP-র JWT access token নেয়, Symfony-র বিল্ট-ইন oidc handler signature যাচাই করে।'}
          - {line: 11, tip: 'audience মিলিয়ে দেখলে অন্য API-র জন্য ছাড়া token এখানে চলে না।'}
    aside:
      - type: commands
        title: 'কনফিগ দেখে নিন'
        items:
          - {cmd: 'php bin/console debug:config security firewalls.api', desc: 'api firewall-এ access_token handler কেমন'}
          - {cmd: 'php bin/console config:dump-reference security', desc: 'oidc handler-এর সব অপশন'}
    check:
      q: 'id_token-এ `aud` যাচাই না করলে কী ঝুঁকি?'
      a: 'অন্য কোনো অ্যাপের জন্য ছাড়া একই IdP-র বৈধ token কেউ আমাদের অ্যাপে এনে লগইন করতে পারবে, কারণ সই আসল হলেও token আমাদের জন্য ছিল না।'

