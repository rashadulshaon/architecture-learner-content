flashcards:
  - q: 'OAuth2 কীসের জন্য, আর কীসের জন্য নয়?'
    a: 'OAuth2 অনুমতি (authorization) দেওয়ার জন্য — অ্যাপ কী করতে পারবে। ব্যবহারকারী কে, সেটা জানানো এর কাজ নয়।'
    more: |
      OAuth2 access token দেয়, যা API-কে বলে "এই অনুরোধ অমুক scope-এ বৈধ"। লগইনের প্রমাণ হিসেবে শুধু তাকে ব্যবহার করলে ভুল হয়, কারণ সে কার জন্য ছাড়া তা অ্যাপ জানে না। পরিচয়ের জন্য OIDC।
    ref: actors-and-protocols
  - q: 'OIDC OAuth2-এর ওপর কী যোগ করে?'
    a: 'একটা id_token (JWT) যাতে ব্যবহারকারী কে তা লেখা আছে (sub, email), সাথে scope `openid` আর একটা প্রমাণিত লগইনের নিয়ম।'
    more: |
      OIDC = OAuth2 + পরিচয়। আলাদা প্রোটোকল নয়, একই flow-তে scope-এ `openid` দিলে id_token-ও আসে। Google, Microsoft, Okta সবাই এটা সমর্থন করে।
    ref: actors-and-protocols
  - q: 'OAuth2-এর চারটা ভূমিকা কী কী?'
    a: 'Resource owner (ব্যবহারকারী), client (অ্যাপ), authorization server (token দেয়), resource server (API, যেখানে token চলে)।'
    more: |
      দারোয়ানের মেটাফরে: রহিম মালিক, কুরিয়ারওয়ালা client, দারোয়ান authorization server, ডাকবাক্স resource server। ছোট সিস্টেমে authorization আর resource server একই কোম্পানির হতে পারে, তবু ভূমিকা আলাদা।
    ref: actors-and-protocols
  - q: 'SAML কী, আর কখন লাগে?'
    a: 'SAML একটা পুরনো XML-ভিত্তিক SSO প্রোটোকল। বড় কোম্পানির enterprise ক্রেতা চাইলে তাদের IdP (Okta, AD FS) দিয়ে লগইনে লাগে।'
    more: |
      OIDC আর SAML একই সমস্যার সমাধান: কেন্দ্রীয় IdP পরিচয় যাচাই করে অ্যাপকে জানায়। SAML সই-করা XML assertion পাঠায়, OIDC JWT। নতুন প্রজেক্টে OIDC সহজ; কিন্তু B2B সফটওয়্যার বেচলে SAML সমর্থন প্রায় নিশ্চিতভাবেই চাইবে।
    ref: actors-and-protocols
  - q: 'PKCE কী ঠেকায়?'
    a: 'চুরি-যাওয়া authorization code দিয়ে token আনা। শুধু যে অ্যাপ শুরু করেছিল, তার কাছেই মূল code_verifier আছে।'
    more: |
      অ্যাপ শুরুতে random `code_verifier` বানায় আর তার SHA-256 hash (`code_challenge`) পাঠায়। শেষে verifier দেখালে server hash মিলিয়ে দেখে। public client-এর জন্য বাধ্যতামূলক, এখন সব client-এই সুপারিশ।
    ref: code-flow-pkce
  - q: 'OAuth-এ state parameter কেন লাগে?'
    a: 'CSRF ঠেকাতে। ফেরত আসা state session-এ রাখা state-এর সাথে না মিললে request-টা আমরা শুরুই করিনি।'
    more: |
      state ছাড়া আক্রমণকারী নিজের অ্যাকাউন্টের code ভুক্তভোগীর ব্রাউজারে ঢুকিয়ে দিতে পারে। state প্রতিবার random, session-এ বাঁধা, আর একবার ব্যবহারের পর মুছে ফেলা হয়।
    ref: code-flow-pkce
  - q: 'id_token-এ কোন চারটা claim অবশ্যই যাচাই করতে হয়?'
    a: '`iss` (কে দিল), `aud` (আমাদের client_id কি না), `exp` (মেয়াদ), `nonce` (এই লগইন চেষ্টার কি না)।'
    more: |
      কোনো একটা বাদ দিলে অন্য অ্যাপের বা পুরনো token দিয়ে লগইন সম্ভব। token ব্রাউজারের মধ্য দিয়ে এলে signature-ও JWKS দিয়ে যাচাই করতে হয়। ব্যবহারকারীর স্থায়ী চাবি হিসেবে `sub` নিন, ইমেইল নয়।
    ref: validate-callback
  - q: 'redirect_uri কেন হুবহু নিবন্ধন করতে হয়?'
    a: 'Wildcard থাকলে open redirect দিয়ে code বা token আক্রমণকারীর URL-এ পাঠানো যায়।'
    more: |
      IdP শুধু আগে নিবন্ধিত URL-এই code পাঠায়। `https://app.com/*` নিবন্ধন করলে অ্যাপের কোনো একটা redirect-ফাঁক ধরেই আক্রমণকারী code নিজের কাছে আনতে পারে। প্রতিটা পরিবেশের জন্য আলাদা, পুরো URL।
    ref: oauth-mistakes

quiz:
  - q: 'একটা SPA-র ডেভেলপার Google লগইন যোগ করছে। কোনটা সঠিক পদ্ধতি?'
    hint: 'SPA-তে কি secret লুকানো যায়?'
    options:
      - text: 'Implicit flow: token সরাসরি URL fragment-এ নেওয়া'
        correct: false
        why: 'token ব্রাউজারের history, log আর referrer-এ ফাঁস হয়; এই flow এখন পরিত্যক্ত।'
      - text: 'Code flow + PKCE, client secret ছাড়া'
        correct: true
        why: 'SPA public client, তার গোপন কিছু রাখার জায়গা নেই। PKCE সেই ঘাটতি পূরণ করে।'
      - text: 'client_secret JavaScript-এ রেখে code flow'
        correct: false
        why: 'ব্রাউজারে যা আছে তা DevTools-এ সবাই দেখে; secret আর গোপন থাকে না।'
      - text: 'ব্যবহারকারীর Google পাসওয়ার্ড নিয়ে সার্ভার থেকে লগইন'
        correct: false
        why: 'ঠিক যে অভ্যাস OAuth বন্ধ করতে এসেছে — অ্যাপকে পাসওয়ার্ড দেওয়া।'
    ref: code-flow-pkce
  - q: 'একজন OAuth2 access token পাঠিয়ে আপনার অ্যাপে লগইন করতে চাইছে। আপনি কী করবেন?'
    hint: 'access token কার জন্য, সেটা সে কি বলে?'
    options:
      - text: 'সই ঠিক থাকলে লগইন দিয়ে দেবে'
        correct: false
        why: 'সে token অন্য অ্যাপের জন্যও হতে পারে; token দিয়ে "কে" প্রমাণ হয় না।'
      - text: 'শুধু ইমেইল চেয়ে নেবে'
        correct: false
        why: 'ক্লায়েন্টের পাঠানো ইমেইল প্রমাণ নয়, আক্রমণকারী যেকোনো ইমেইল পাঠাতে পারে।'
      - text: 'OIDC id_token চাইবে এবং iss, aud, exp, nonce যাচাই করবে'
        correct: true
        why: 'id_token-ই বলে ব্যবহারকারী কে এবং token-টা আমাদের এই লগইনের জন্যই কি না।'
    ref: actors-and-protocols
  - q: 'নিচের কোড কোন ভুল করছে?'
    lang: php
    code: |
      #[Route('/auth/callback')]
      public function callback(Request $request): Response
      {
          $tokens = $this->exchange($request->query->getString('code'));
          return $this->loginAs($tokens['email']);
      }
    hint: 'ফেরত আসা request-টা যে আমাদেরই শুরু করা, তার প্রমাণ কোথায়?'
    options:
      - text: 'state যাচাই নেই, id_token-এর claim যাচাই নেই, আর ইমেইলকে চাবি ধরা হয়েছে'
        correct: true
        why: 'state ছাড়া CSRF, claim যাচাই ছাড়া ভুয়া token, আর ইমেইলের বদলে স্থায়ী `sub` ব্যবহার করা উচিত।'
      - text: 'Route-এ method দেওয়া নেই'
        correct: false
        why: 'এটা ছোট ব্যাপার; আসল ফাঁক যাচাইয়ের অভাব।'
      - text: 'কোনো ভুল নেই, code তো একবারই ব্যবহার হয়'
        correct: false
        why: 'code একবার-ব্যবহারযোগ্য হলেও CSRF-এ আক্রমণকারীর code-ই ঢুকে যেতে পারে।'
    ref: validate-callback
  - q: 'নিচের কোনগুলো OAuth2/OIDC প্রয়োগের ঠিক নিয়ম?'
    hint: 'কোনগুলো "যাচাই না করে ধরে নেওয়া" এড়ায়?'
    options:
      - text: 'প্রতিবার random state আর nonce বানিয়ে session-এ রাখা'
        correct: true
        why: 'ফেরত এলে মিলিয়ে CSRF আর token-replay ঠেকানো যায়।'
      - text: 'IdP-তে redirect_uri পুরো URL হুবহু নিবন্ধন করা'
        correct: true
        why: 'code বা token আক্রমণকারীর URL-এ যাওয়ার পথ বন্ধ হয়।'
      - text: 'ব্যবহারকারীকে ইমেইল দিয়ে চেনা, `sub` নয়'
        correct: false
        why: 'ইমেইল বদলাতে পারে বা পুনর্ব্যবহৃত হতে পারে; স্থায়ী চাবি হলো `sub`।'
      - text: 'স্ক্রিপ্টে client_secret রেখে ব্রাউজার থেকেই token আনা'
        correct: false
        why: 'ব্রাউজারে secret গোপন থাকে না।'
    ref: oauth-mistakes
  - q: 'একটা বড় ক্রেতা বলল, "আমাদের Okta দিয়ে লগইন চাই, আমরা SAML ব্যবহার করি।" কথাটা কী বোঝায়?'
    hint: 'SAML-এর কাজ আর OIDC-র কাজ কি আলাদা সমস্যা?'
    options:
      - text: 'তারা অ্যাপকে তাদের ফাইল পড়ার অনুমতি দিতে চায়'
        correct: false
        why: 'ফাইল-অনুমতি OAuth2-র কাজ; এখানে চাওয়া হচ্ছে কর্পোরেট লগইন (SSO)।'
      - text: 'তাদের কর্মীরা কোম্পানির IdP-তে লগইন করবে, আর IdP সই-করা XML assertion পাঠিয়ে আমাদের অ্যাপকে জানাবে তারা কে'
        correct: true
        why: 'SAML হলো কর্পোরেট SSO-র XML-ভিত্তিক সংস্করণ, OIDC-র সমান কাজের পুরনো রূপ।'
      - text: 'তাদের password আমাদের ডেটাবেসে রাখতে হবে'
        correct: false
        why: 'SSO-র মূল সুবিধা হলো পাসওয়ার্ড IdP-তেই থাকে, আমাদের কাছে আসে না।'
    ref: actors-and-protocols
  - q: 'PKCE সম্পর্কে কোন কথাগুলো ঠিক?'
    hint: 'verifier আর challenge-এর সম্পর্ক ভাবুন।'
    options:
      - text: 'code_challenge হলো code_verifier-এর SHA-256 hash'
        correct: true
        why: 'S256 পদ্ধতিতে challenge = BASE64URL(SHA256(verifier)), একমুখী।'
      - text: 'Token চাওয়ার সময় মূল code_verifier পাঠাতে হয়'
        correct: true
        why: 'সার্ভার hash করে শুরুর challenge-এর সাথে মেলায়।'
      - text: 'শুধু মোবাইল অ্যাপের জন্য, ওয়েবে লাগে না'
        correct: false
        why: 'public client-এ বাধ্যতামূলক, আর সার্ভারসাইড অ্যাপেও এখন সুপারিশ।'
      - text: 'PKCE থাকলে state আর লাগে না'
        correct: false
        why: 'state CSRF ঠেকায়, PKCE code-চুরি ঠেকায়; দুটো আলাদা কাজ।'
    ref: code-flow-pkce
