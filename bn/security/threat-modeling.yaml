slides:
  - slug: nobody-asked-what-if
    title: 'ফিচার চালু হলো, কেউ ভাবেনি "যদি কেউ উল্টো করে?"'
    kind: story
    tldr: 'বেশিরভাগ security ফুটো কোডের ভুলে নয়, নকশার সময় "শত্রু কী করতে পারে" না ভাবার ফল — threat modeling সেই ভাবনা আগে করায়।'
    keywords: ['threat modeling', 'security design', 'attacker mindset', 'ঝুঁকি বিশ্লেষণ', 'নিরাপত্তা নকশা']
    blocks:
      - type: metaphor
        icon: home
        title: 'বাড়ি বানানোর আগে চোরের পথ ভাবা'
        body: |
          নকশা আঁকার সময়ই ভাবতে হয়: জানালায় গ্রিল লাগবে কি না, পেছনের দরজায় তালা কী ধরনের হবে। বাড়ি তৈরি হওয়ার পর চোর ঢুকলে তখন দেয়াল ভাঙা কঠিন। Threat modeling হলো কোড লেখার আগে (বা আরও আগে ফিচারের নকশায়) এই "চোর কোন পথে ঢুকবে" ভাবনাটা।
      - type: visual
        kind: compare
        caption: 'একই ফিচার: ঘটনার পরে ঠিক করা বনাম আগে ভাবা'
        columns:
          - title: 'চালুর পরে ধরা পড়ল'
            tone: bad
            icon: bug
            tip: 'পরে ধরা পড়লে ডেটা, ক্রেতার বিশ্বাস আর টাকা ইতিমধ্যে গেছে।'
            items:
              - 'ক্রেতা URL-এ order id বদলে অন্যের অর্ডার দেখল'
              - 'ঠিক করতে জরুরি patch, রাতজাগা, ক্ষতিপূরণ'
              - 'কেন হলো কেউ জানে না, আরও আছে কি না কেউ জানে না'
          - title: 'নকশার সময়ই ভাবা হলো'
            tone: good
            icon: shield
            tip: 'আধ ঘণ্টার আলোচনা পরে হওয়া সপ্তাহখানেকের সংকটের চেয়ে অনেক সস্তা।'
            items:
              - '"অন্যের id দিলে কী হবে?" নকশার দিনেই উঠল'
              - 'object-level check ফিচারের অংশ হয়ে গেল'
              - 'সিদ্ধান্তগুলো নথিতে লেখা, নতুনরা পড়তে পারে'
      - type: quote
        body: 'শত্রু কী করতে পারে — এই প্রশ্নটা নকশার সময় করতে হয়, ঘটনার পরে নয়।'
    aside:
      - type: problem
        body: 'নিরাপত্তার ভুল সবচেয়ে বেশি লুকিয়ে থাকে এমন ফিচারে, যেটা "ঠিকঠাক কাজ করছে"। কারণ আমরা শুধু ভাবি ব্যবহারকারী কী করবে, আক্রমণকারী কী করবে সেটা ভাবি না।'
      - type: terms
        items:
          - {term: 'Threat', meaning: 'এমন ঘটনা, যা সিস্টেমের ক্ষতি করতে পারে (যেমন কেউ অন্যের অ্যাকাউন্ট দখল করল)।'}
          - {term: 'Threat model', meaning: 'কী বানাচ্ছ, কী ভুল হতে পারে আর তার জন্য কী করবে, তার সংক্ষিপ্ত লিখিত বিশ্লেষণ।'}
    check:
      q: 'Threat modeling কোডের পরে নয়, নকশার সময় করা হয় কেন?'
      a: 'কারণ নকশা বদলানো সবচেয়ে সস্তা তখনই। চালুর পরে পাওয়া ভুল শুধরাতে ডেটা-কাঠামো, API আর আচরণ বদলাতে হয়, যা অনেক দামি।'

  - slug: trust-boundary
    title: 'Trust boundary: যেখানে বিশ্বাসের মাত্রা বদলায়'
    kind: concept
    tldr: 'ডেটা যেখানে এমন এলাকা থেকে আরেকটায় যায়, যাদের বিশ্বাসযোগ্যতা আলাদা, সেই রেখাই trust boundary — আক্রমণের প্রায় সবটাই ওই রেখা ঘিরে।'
    keywords: ['trust boundary', 'data flow diagram', 'attack surface', 'বিশ্বাসের সীমানা', 'DFD']
    blocks:
      - type: metaphor
        icon: bank
        title: 'ব্যাংকের কাউন্টার'
        body: |
          ব্যাংকে গ্রাহক কাউন্টার পর্যন্ত যেতে পারে, ক্যাশিয়ার কাউন্টারের ভেতরে থাকে, আর ভল্টে ঢুকতে পারে শুধু অনুমতিপ্রাপ্ত ব্যক্তি। দুই এলাকার মাঝের প্রতিটা দরজাই পাহারার জায়গা। সফটওয়্যারে ওই দরজাগুলোই trust boundary, আর সেখানে প্রতিবার "তুমি কে, কী পাঠালে, করার অধিকার আছে কি" যাচাই করতে হয়।
      - type: visual
        kind: flow
        caption: 'রিফান্ড ফিচারের data flow: লাল ও হলুদ তীর সীমানা পেরোয়, সেখানেই যাচাই'
        nodes:
          - {id: user, label: 'ক্রেতা (ব্রাউজার)', sub: 'বিশ্বাস নেই', icon: user, tone: bad, col: 0, row: 1, tip: 'ক্রেতার ডিভাইস আমাদের নিয়ন্ত্রণে নয়। সে যা পাঠায়, তা বদলানো বা বানোয়াট হতে পারে।'}
          - {id: api, label: 'Symfony API', sub: 'আমাদের কোড', icon: api, tone: accent, col: 1.5, row: 1, tip: 'আমাদের কোডের এলাকা। বাইরে থেকে আসা সব কিছু এখানে ঢুকে যাচাই হয়।'}
          - {id: db, label: 'ডেটাবেস', sub: 'ভেতরের এলাকা', icon: db, tone: good, col: 3, row: 1, tip: 'সবচেয়ে ভেতরের এলাকা। এখানে শুধু যাচাই-করা কোড লিখতে পারে।'}
          - {id: pay, label: 'Payment gateway', sub: 'তৃতীয় পক্ষ', icon: card, tone: warn, col: 3, row: 0, tip: 'বাইরের কোম্পানি। তাদের পাঠানো webhook-ও যাচাই ছাড়া বিশ্বাস করা যায় না।'}
        edges:
          - {from: user, to: api, label: 'ক্রেতা রিফান্ডের অনুরোধ পাঠায় (প্রথম সীমানা)', tone: bad}
          - {from: api, to: db, label: 'যাচাইয়ের পর API অর্ডার আর রিফান্ড লেখে'}
          - {from: api, to: pay, label: 'API gateway-কে টাকা ফেরতের নির্দেশ দেয় (দ্বিতীয় সীমানা)', tone: warn}
          - {from: pay, to: api, label: 'Gateway webhook পাঠায়, যার সই যাচাই লাগে', dashed: true, tone: warn}
      - type: quote
        body: 'যেখানে বিশ্বাসের মাত্রা বদলায়, সেখানেই যাচাই বসাও।'
    aside:
      - type: tips
        items:
          - 'ছবি আঁকতে কাগজ-কলমই যথেষ্ট: বাক্স (কম্পোনেন্ট), তীর (ডেটা কোন দিকে যায়), আর একটা রেখা যেখানে বিশ্বাস বদলায়।'
          - 'ভেতরের সার্ভিসকেও সবসময় বিশ্বাস কোরো না; একটা সার্ভিস দখল হলে সেটা বাকিগুলোকে আক্রমণের পথ হয়।'
      - type: terms
        items:
          - {term: 'Attack surface', meaning: 'বাইরের কেউ যেসব দরজা দিয়ে সিস্টেমে ঢোকার চেষ্টা করতে পারে: endpoint, ফাইল আপলোড, webhook।'}
      - type: refs
        items:
          - {to: 'security/input-validation', label: 'সীমানায় ইনপুট যাচাই'}
    check:
      q: 'রিফান্ড ফিচারের ছবিতে কোন কোন তীর trust boundary পার হয়েছে?'
      a: 'ক্রেতা থেকে API, আর API থেকে payment gateway (এবং gateway-র webhook ফিরে আসা)। এই তিনটায় যাচাই লাগবে; API থেকে ডেটাবেস ভেতরের পথ।'

  - slug: stride-questions
    title: 'STRIDE: ছয়টা প্রশ্নের চেকলিস্ট'
    kind: concept
    tldr: 'STRIDE ছয় ধরনের হুমকির নাম: নকল পরিচয়, ডেটা বদল, অস্বীকার, তথ্য ফাঁস, সার্ভিস বন্ধ, অনধিকার ক্ষমতা। প্রতিটা তীরে ছয়টা প্রশ্ন করো।'
    keywords: ['STRIDE', 'spoofing', 'tampering', 'repudiation', 'information disclosure', 'DoS', 'elevation of privilege']
    blocks:
      - type: text
        body: |
          কী ভুল হতে পারে তা মনে রাখতে ছয় অক্ষরের একটা নাম আছে: **STRIDE**। প্রতিটা তীর বা বাক্সের সামনে দাঁড়িয়ে এই ছয়টা প্রশ্ন একে একে করলে বেশিরভাগ গুরুতর হুমকি ধরা পড়ে। নিচের ছকে প্রতিটা অক্ষরের মানে আর সাধারণ প্রতিষেধক দেওয়া আছে।
      - type: visual
        kind: table
        caption: 'STRIDE: ছয় প্রশ্ন, আর Symfony-তে সাধারণ উত্তর'
        headers: ['হুমকি', 'প্রশ্ন', 'প্রতিষেধক']
        rows:
          - cells: ['S — Spoofing', 'কেউ অন্য কেউ সেজে ঢুকছে?', 'ভালো login, MFA, webhook সই']
            tip: 'পরিচয় চুরি বা নকল। ক্রেতা সেজে ঢোকা, বা gateway সেজে webhook পাঠানো।'
          - cells: ['T — Tampering', 'ডেটা পথে বা জমা অবস্থায় বদলানো যায়?', 'সার্ভারে মান হিসাব, HMAC, HTTPS']
            tip: 'ডেটা বদলে দেওয়া। যেমন ক্রেতা request-এ price বা amount বদলে পাঠাল।'
          - cells: ['R — Repudiation', 'কেউ "আমি করিনি" বলতে পারবে?', 'audit log: কে, কখন, কী করল']
            tip: 'কাজ অস্বীকার করার সুযোগ। log না থাকলে প্রমাণ করা যায় না কে রিফান্ড দিয়েছে।'
          - cells: ['I — Info disclosure', 'যার দেখার কথা নয়, সে দেখছে?', 'object-level check, এনক্রিপশন, কম তথ্য']
            tip: 'তথ্য ফাঁস। অন্যের অর্ডার দেখা, error-এ stack trace বা secret চলে যাওয়া।'
          - cells: ['D — Denial of service', 'কেউ সার্ভিস অচল করে দিতে পারে?', 'rate limit, timeout, সাইজের সীমা']
            tip: 'সেবা বন্ধ করে দেওয়া। বিশাল ফাইল আপলোড বা সেকেন্ডে হাজার request।'
          - cells: ['E — Elevation', 'সাধারণ ইউজার admin-এর কাজ পারছে?', 'role/voter check, least privilege']
            tip: 'অনধিকার ক্ষমতা পাওয়া। সাধারণ ইউজার বা support agent সীমার বাইরের কাজ করে ফেলছে।'
    aside:
      - type: remember
        body: 'STRIDE: নকল, বদল, অস্বীকার, ফাঁস, বন্ধ, ক্ষমতা — ছয় প্রশ্ন, প্রতিটা তীরে।'
      - type: pitfalls
        items:
          - 'ছয়টা প্রশ্নের সবটা সব তীরে লাগবে না; কোনটা প্রযোজ্য নয় তা লিখে রাখলেও ভালো, যাতে পরে কেউ ভাবে "ভুলে গেছে"।'
          - 'শুধু যা মনে আসে তা লিখো না; চেকলিস্ট ধরে এগোলে অপ্রিয় হুমকিগুলোও চোখে পড়ে।'
      - type: refs
        items:
          - {to: 'security/authn-authz', label: 'Spoofing ও Elevation-এর প্রতিষেধক'}
    check:
      q: 'ক্রেতা request-এ amount বদলে পাঠাল, STRIDE-এর কোন অক্ষর, আর প্রতিষেধক কী?'
      a: 'T, Tampering। amount ক্লায়েন্টের কথায় নয়, সার্ভারে অর্ডার থেকে হিসাব করো; ক্লায়েন্ট শুধু কোন অর্ডার, তা বলবে।'

  - slug: threat-model-in-30-min
    title: '৩০ মিনিটে একটা ফিচারের threat model'
    kind: howto
    tldr: 'চার ধাপ: কী বানাচ্ছি আঁকো, কী ভুল হতে পারে STRIDE-এ খোঁজো, কী করব ঠিক করো, ঠিকঠাক হলো কি না যাচাই করো।'
    keywords: ['threat model workshop', 'mitigation', 'risk', 'refund endpoint', 'লাইটওয়েট threat model', 'voter']
    blocks:
      - type: visual
        kind: steps
        caption: 'চার ধাপ, আধা ঘণ্টা, হোয়াইটবোর্ড'
        steps:
          - {title: '১. আঁকো', body: 'বাক্স, তীর আর trust boundary', tip: 'আঁকার সময়ই অনেক অস্পষ্টতা ধরা পড়ে, যেমন "এই webhook কে পাঠায়?"।'}
          - {title: '২. খোঁজো', body: 'প্রতিটা তীরে STRIDE-র ছয় প্রশ্ন', tip: 'ফিচারের সবচেয়ে ঝুঁকিপূর্ণ তীর দিয়ে শুরু করো, যেমন টাকা বা ব্যক্তিগত তথ্য নড়ে যেখানে।'}
          - {title: '৩. ঠিক করো', body: 'প্রতিটা হুমকির জন্য প্রতিষেধক বা গ্রহণের সিদ্ধান্ত', tip: 'সব হুমকি ঠেকাতে হবে না। বাদ দিলে কারণসহ লিখে রাখো।'}
          - {title: '৪. যাচাই', body: 'প্রতিষেধকের জন্য test আর ticket', tip: 'যা test-এ নেই, তা থাকবে বলে ভরসা করা যায় না।'}
      - type: points
        title: 'রিফান্ড API-র worked example'
        style: number
        items:
          - 'S: চুরি হওয়া token দিয়ে রিফান্ড চাইলে? ঝুঁকিপূর্ণ কাজে আবার পাসওয়ার্ড বা OTP চাও।'
          - 'T/I: ক্রেতা কি amount বা অন্যের order id দিতে পারে? amount সার্ভারে হিসাব করো, order-এ মালিকানা দেখো।'
          - 'R/E: support agent কত পর্যন্ত রিফান্ড দিতে পারে, আর কে দিল তা কোথায় লেখা থাকে?'
          - 'D: বারবার রিফান্ড চেয়ে gateway বা ডেটাবেস ভরিয়ে ফেলা? rate limit আর idempotency key বসাও।'
      - type: code
        lang: php
        file: 'src/Controller/RefundController.php'
        variant: good
        code: |
          #[Route('/orders/{id}/refund', methods: ['POST'])]
          #[IsGranted('REFUND', subject: 'order')]   // E, I: voter object দেখে
          public function refund(
              Order $order,
              RefundService $refunds,
              #[CurrentUser] User $user,
          ): JsonResponse {
              // T: amount ক্লায়েন্টের কাছ থেকে নয়, অর্ডার থেকে
              $refund = $refunds->refundFully($order, requestedBy: $user);

              // R: কে, কখন, কত — audit log
              $this->auditLogger->info('refund.issued', [
                  'order_id' => $order->getId(),
                  'actor_id' => $user->getId(),
                  'amount_minor' => $refund->getAmountMinor(),
              ]);

              return $this->json(['refund_id' => $refund->getId()], 201);
          }
        marks:
          - {line: 2, tip: 'Voter অর্ডারটা দেখে ঠিক করে এই ইউজার এটার রিফান্ড দিতে পারে কি না। এক line-এ E আর I দুটোই ঠেকে।'}
          - {line: 8, tip: 'request body-তে amount আসেই না, তাই বদলানোর সুযোগও নেই।'}
          - {line: 11, tip: 'Audit log থাকলে "আমি করিনি" বলার সুযোগ থাকে না।'}
    aside:
      - type: pitfalls
        items:
          - 'Threat model একবার লিখে ড্রয়ারে রাখা; ফিচার বদলালে আবার দেখো।'
          - 'সব হুমকি সমান ধরা। ক্ষতির আকার আর সম্ভাবনা দেখে আগে বড়গুলো সামলাও।'
          - 'শুধু নিরাপত্তা-বিশেষজ্ঞ করছেন; ফিচারটা যিনি বানাচ্ছেন তাঁকে ঘরে রাখো, সে-ই ভেতরের কথা জানে।'
      - type: when
        use:
          - 'টাকা, ব্যক্তিগত তথ্য বা অনুমতির নতুন ফিচার, নতুন বাইরের integration।'
        avoid:
          - 'ছোট UI পরিবর্তনে পুরো workshop লাগে না; এক লাইনের প্রশ্ন "কী ভুল হতে পারে?" যথেষ্ট।'
      - type: refs
        items:
          - {to: 'security/authorization-models', label: 'Voter ও অনুমতির মডেল'}
          - {to: 'api/rate-limiting', label: 'Rate limiting'}
    check:
      q: 'Threat model-এর তৃতীয় ধাপে সব হুমকির প্রতিষেধক বানানো বাধ্যতামূলক কি?'
      a: 'না। প্রতিটা হুমকির জন্য সিদ্ধান্ত লাগে: ঠেকানো, কমানো, বা কারণসহ মেনে নেওয়া। যা মেনে নেওয়া হলো, তা লিখে রাখাই জরুরি।'

flashcards:
  - q: 'Threat modeling কী?'
    a: 'ফিচার বানানোর আগে ভেবে দেখা: কী ভুল হতে পারে, কে ক্ষতি করতে পারে, আর তার জন্য কী করব।'
    more: |
      এটা কোড-পরীক্ষা নয়, নকশার আলোচনা। কাগজে কয়েকটা বাক্স আর তীর এঁকে প্রশ্ন করা হয় "এখানে কেউ উল্টো করলে কী হবে?"। ফলে ফুটো চালুর আগেই ধরা পড়ে, যখন ঠিক করা সবচেয়ে সস্তা।
    ref: nobody-asked-what-if
  - q: 'Threat model সবচেয়ে ভালো কখন করতে হয়?'
    a: 'নকশার সময়, কোড লেখার আগে। চালুর পরে নকশা বদলানো অনেক দামি।'
    more: |
      ডেটা-কাঠামো, API আর বিশ্বাসের সীমানা নকশার দিনেই ঠিক হয়। পরে এগুলো বদলাতে গেলে বহু জায়গায় হাত পড়ে। তাই আধা ঘণ্টার আলোচনা নকশার সময় করা সবচেয়ে লাভের।
    ref: nobody-asked-what-if
  - q: 'Trust boundary কী?'
    a: 'দুই এলাকার মাঝের রেখা, যেখানে ডেটা এমন জায়গা থেকে আসে বা যায়, যার বিশ্বাসযোগ্যতা আলাদা।'
    more: |
      ব্রাউজার থেকে API, API থেকে বাইরের payment gateway, গেটওয়ে থেকে আমাদের webhook: এসব রেখা পেরোয়। ব্যাংকের কাউন্টারের মতো প্রতিটা দরজায় যাচাই বসাতে হয়। ভেতরের এলাকা থেকে এলেও সেটাকে অন্ধভাবে বিশ্বাস করা ঠিক নয়।
    ref: trust-boundary
  - q: 'STRIDE-এর ছয়টা অক্ষর কী কী?'
    a: 'Spoofing, Tampering, Repudiation, Information disclosure, Denial of service, Elevation of privilege।'
    more: |
      বাংলায়: পরিচয় নকল, ডেটা বদল, কাজ অস্বীকার, তথ্য ফাঁস, সেবা বন্ধ, অনধিকার ক্ষমতা। প্রতিটা তীরে ছয়টা প্রশ্ন করলে বেশিরভাগ গুরুতর হুমকি ধরা পড়ে।
    ref: stride-questions
  - q: 'Spoofing আর Elevation of privilege-এর পার্থক্য কী?'
    a: 'Spoofing হলো অন্য কেউ সেজে ঢোকা। Elevation হলো নিজের পরিচয়েই এমন ক্ষমতা পাওয়া, যা তার পাওয়ার কথা নয়।'
    more: |
      Spoofing ঠেকায় authentication (কে তুমি)। Elevation ঠেকায় authorization (তুমি কী করতে পারো)। চুরি হওয়া password দিয়ে ঢোকা spoofing। সাধারণ ইউজার URL বদলে admin পেজ দেখলে তা elevation।
    ref: stride-questions
  - q: 'Repudiation ঠেকাতে কী করতে হয়?'
    a: 'Audit log: কে, কখন, কোন জিনিসে, কী করল, তা বদলানো যায় না এমনভাবে লিখে রাখা।'
    more: |
      রিফান্ড বা সেটিং বদলের মতো গুরুত্বপূর্ণ কাজে actor id, সময় আর পুরনো-নতুন মান লিখে রাখো। log শুধু যোগ করা যায়, বদলানো বা মোছা যায় না এমন জায়গায় রাখলে ভালো। এতে "আমি করিনি" বলে এড়ানো যায় না।
    ref: stride-questions
  - q: 'Threat model-এর চার ধাপ কী?'
    a: 'আঁকো (বাক্স, তীর, সীমানা), খোঁজো (STRIDE), ঠিক করো (প্রতিষেধক বা গ্রহণ), যাচাই করো (test ও ticket)।'
    more: |
      পুরোটা আধা ঘণ্টায় হোয়াইটবোর্ডে হয়। শেষে আউটপুট থাকে হুমকির তালিকা আর প্রতিটার সিদ্ধান্ত। এটা নথিতে রেখে দিলে ফিচার বদলের সময় আবার কাজে লাগে।
    ref: threat-model-in-30-min
  - q: 'সব হুমকি কি ঠেকানো বাধ্যতামূলক?'
    a: 'না। প্রতিটার জন্য সিদ্ধান্ত লাগে: ঠেকাও, কমাও, বা কারণ লিখে মেনে নাও।'
    more: |
      ক্ষতি ছোট আর সম্ভাবনা কম হলে প্রতিষেধকের খরচ বেশি পড়তে পারে। তখন মেনে নেওয়া যায়, কিন্তু কেন মানা হলো তা লিখে রাখতে হয়। না লিখলে পরে কেউ ভাবে সেটা কেউ খেয়াল করেনি।
    ref: threat-model-in-30-min

quiz:
  - q: 'ইমন পণ্য কেনার API বানাচ্ছে। request-এ { "product_id": 5, "price": 100 } আসে আর সার্ভার সেই price-ই ধরে। STRIDE-এর কোন হুমকি?'
    hint: 'ক্রেতা price-টা ৫০ বা ১ করে পাঠালে কী হবে?'
    options:
      - text: 'Spoofing'
        correct: false
        why: 'কেউ অন্যের পরিচয়ে ঢোকেনি। সমস্যা হলো ক্লায়েন্টের পাঠানো ডেটার ওপর ভরসা।'
      - text: 'Tampering, সার্ভার price ডেটাবেস থেকে নেবে, ক্লায়েন্ট থেকে নয়'
        correct: true
        why: 'ক্লায়েন্টের পাঠানো মান বদলানো যায়। দামের মতো জিনিস সবসময় সার্ভারে হিসাব হয়।'
      - text: 'Repudiation'
        correct: false
        why: 'এটা কাজ অস্বীকার করার সমস্যা। এখানে সমস্যা হলো ডেটা বদলে ফেলা।'
      - text: 'Denial of service'
        correct: false
        why: 'সেবা বন্ধের কথা এখানে নেই; ক্ষতি হচ্ছে ভুল দামে বিক্রিতে।'
    ref: stride-questions
  - q: 'নিচের কোডে কোন STRIDE হুমকিটা সবচেয়ে স্পষ্ট?'
    lang: php
    code: |
      #[Route('/invoices/{id}', methods: ['GET'])]
      public function show(Invoice $invoice): JsonResponse
      {
          return $this->json($invoice);
      }
    hint: 'কোনো ইউজার কি অন্যের invoice id দিয়ে ডাকতে পারে?'
    options:
      - text: 'Information disclosure, মালিকানা যাচাই না থাকায় অন্যের invoice দেখা যায়'
        correct: true
        why: 'লগইন করা যেকোনো ইউজার id বদলে অন্যের invoice পড়তে পারে। object-level check (voter) লাগে।'
      - text: 'Repudiation'
        correct: false
        why: 'এটা পড়ার endpoint; কাজ অস্বীকারের প্রশ্ন এখানে প্রধান নয়।'
      - text: 'Spoofing, কারণ method GET'
        correct: false
        why: 'GET হওয়া spoofing-এর কারণ নয়। এখানে পরিচয় ঠিকই আছে, ক্ষমতা যাচাই হয়নি।'
    ref: stride-questions
  - q: 'Trust boundary পেরোয় এমন ডেটা প্রবাহ কোনগুলো?'
    hint: 'যেখানে বিশ্বাসের মাত্রা বদলায়, তা ভাবো।'
    options:
      - text: 'ব্রাউজার থেকে Symfony API-তে POST request'
        correct: true
        why: 'ব্রাউজার আমাদের নিয়ন্ত্রণে নেই, তাই এটা প্রথম সীমানা।'
      - text: 'Payment gateway-র পাঠানো webhook'
        correct: true
        why: 'বাইরের কোম্পানির পাঠানো ডেটা, তাই সই যাচাই না করলে নকল webhook ঢুকে যেতে পারে।'
      - text: 'একই controller-এর এক method থেকে আরেক method-এ call'
        correct: false
        why: 'একই কোডের ভেতরের call; বিশ্বাসের এলাকা বদলায়নি।'
      - text: 'যাচাই-পেরোনো API থেকে নিজের ডেটাবেসে লেখা'
        correct: false
        why: 'ভেতরের পথ। অবশ্য parameterised query লাগবে, কিন্তু এটা বিশ্বাসের সীমানা নয়।'
    ref: trust-boundary
  - q: 'সুমি রিফান্ড ফিচারের threat model করছে, আর সময় কম। কোন তীর দিয়ে শুরু করা উচিত?'
    hint: 'ক্ষতি সবচেয়ে বেশি কোথায়?'
    options:
      - text: 'যেখানে টাকা নড়ে: ক্রেতা থেকে রিফান্ড API, আর API থেকে gateway'
        correct: true
        why: 'টাকা আর ব্যক্তিগত তথ্যের পথে ঝুঁকির মাত্রা সবচেয়ে বেশি। সেখান থেকে শুরু করলে সময় কম পড়লেও বড় ফুটো ধরা পড়ে।'
      - text: 'যেটা আঁকতে সবচেয়ে সহজ'
        correct: false
        why: 'সহজ হলেই গুরুত্বপূর্ণ নয়। ঝুঁকির মাত্রা অনুযায়ী ক্রম ঠিক করতে হয়।'
      - text: 'যে তীরে কম লোক জানে'
        correct: false
        why: 'অজানা মানেই বিপজ্জনক নয়; ক্ষতির আকার আর সম্ভাবনাই মাপকাঠি।'
      - text: 'কোনো ক্রম নেই, সব একসাথে'
        correct: false
        why: 'আধা ঘণ্টায় সব হয় না; ক্রম না থাকলে বড় ঝুঁকিটাই বাদ পড়তে পারে।'
    ref: threat-model-in-30-min
  - q: 'Threat model করে দেখা গেল একটা হুমকি ঠেকাতে ৩ সপ্তাহ লাগবে, কিন্তু ক্ষতি সামান্য আর সম্ভাবনা কম। সবচেয়ে ভালো সিদ্ধান্ত কোনটা?'
    hint: 'প্রতিষেধকের খরচ আর ক্ষতির তুলনা করো।'
    options:
      - text: 'ঝুঁকিটা মেনে নিয়ে কারণসহ লিখে রাখা'
        correct: true
        why: 'খরচ ক্ষতির চেয়ে বেশি হলে মেনে নেওয়া যুক্তিসঙ্গত, তবে সিদ্ধান্ত আর কারণ লিখে রাখতে হবে।'
      - text: 'হুমকিটা তালিকা থেকে চুপচাপ মুছে দেওয়া'
        correct: false
        why: 'মুছে ফেললে পরে কেউ জানবে না যে এটা ভেবে দেখা হয়েছিল।'
