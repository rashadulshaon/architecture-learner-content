          - {id: sub, label: 'Folder', sub: 'Q3 রিপোর্ট', icon: archive, col: 1.5, row: 0, tip: 'ফাইলের সরাসরি parent। এখানে করিমের grant নেই।'}
          - {id: root, label: 'Folder', sub: 'অ্যাকাউন্টস', icon: archive, col: 3, row: 0, tip: 'ওপরের ফোল্ডার। এখানে করিমকে editor করা আছে।'}
