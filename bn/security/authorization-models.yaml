    tldr: 'ReBAC-তে voter জিনিস থেকে ওপরে উঠে (ফাইল → ফোল্ডার → প্রজেক্ট) ব্যবহারকারীর কোনো grant খোঁজে; পাওয়া relation-ই অনুমতি।'
    keywords: ['ReBAC', 'relationship', 'inheritance', 'folder permissions', 'grant', 'voter', 'sharing', 'সম্পর্ক ভিত্তিক']
