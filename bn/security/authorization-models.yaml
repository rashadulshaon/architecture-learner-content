          - {from: root, to: grant, label: 'অ্যাকাউন্টস ফোল্ডারে করিম editor — পেয়ে গেছি', tone: good}
      - type: code
        lang: php
        file: 'src/Security/Voter/DocumentVoter.php'
        variant: good
        code: |
          protected function voteOnAttribute(
              string $attribute, mixed $subject, TokenInterface $token, ?Vote $vote = null,
          ): bool {
              $user = $token->getUser();
              if (!$user instanceof User) {
                  return false;
              }

              $relation = $this->relationOf($user, $subject->getFolder());

              return match ($attribute) {
                  self::VIEW => null !== $relation,
                  self::EDIT => \in_array($relation, ['editor', 'owner'], true),
                  default => false,
              };
          }

          private function relationOf(User $user, ?Folder $folder): ?string
          {
              for ($node = $folder; null !== $node; $node = $node->getParent()) {
                  $grant = $this->grants->findOneBy(['folder' => $node, 'user' => $user]);
                  if (null !== $grant) {
                      return $grant->getRelation();   // 'viewer' | 'editor' | 'owner'
                  }
              }

              return null;
          }
        marks:
          - {line: 14, tip: 'default => false: চেনা নয় এমন কোনো attribute-এ "না"।'}
          - {line: 20, tip: 'ফোল্ডার ধরে ওপরে উঠে প্রথম grant-ই relation। পাওয়া না গেলে null, মানে সম্পর্ক নেই।'}
    aside:
      - type: pitfalls
        items:
          - 'এই লুপ প্রতি ধাপে একটা query চালায়। গভীর hierarchy বা তালিকায় N+1 হবে; materialized path বা কয়েকটা ancestor id-তে একবারে খোঁজো।'
