  - slug: voter-abac
    title: 'Role + শর্ত: ABAC voter লেখা'
    kind: howto
    tldr: 'Role hierarchy দিয়ে মোটা অনুমতি, voter-এ জিনিসের তথ্য (বিভাগ, অঙ্ক, মালিক) মিলিয়ে সূক্ষ্ম নিয়ম, আর action-এ #[IsGranted]।'
    keywords: ['voter', 'ABAC', 'IsGranted', 'role_hierarchy', 'separation of duties', 'attribute based', 'Symfony voter']
    blocks:
      - type: text
        body: |
          ৪০টা role-এর বদলে role থাকবে দুইটা, আর নিয়মগুলো যাবে একটা voter-এ। ম্যানেজারের ক্ষমতা কর্মীর ওপরে — `security.yaml`-এ `role_hierarchy: {ROLE_MANAGER: ROLE_EMPLOYEE}` লিখলেই হয়। বিভাগ, অঙ্ক আর "নিজের খরচ নয়" মিলিয়ে দেখে voter।
      - type: code
        lang: php
        file: 'src/Security/Voter/ExpenseVoter.php'
        variant: good
        code: |
          final class ExpenseVoter extends Voter
          {
              public const APPROVE = 'EXPENSE_APPROVE';

              public function __construct(private readonly Security $security) {}

              protected function supports(string $attribute, mixed $subject): bool
              {
                  return self::APPROVE === $attribute && $subject instanceof Expense;
              }

              protected function voteOnAttribute(
                  string $attribute, mixed $subject, TokenInterface $token, ?Vote $vote = null,
              ): bool {
                  $user = $token->getUser();
                  if (!$user instanceof User || !$this->security->isGranted('ROLE_MANAGER')) {
                      return false;
                  }

                  return $subject->getDepartment() === $user->getDepartment()  // নিজের বিভাগ
                      && $subject->getAmountTaka() <= 50_000                     // সীমার নিচে
                      && $subject->getRequester() !== $user                      // নিজের নয়
                      && $subject->isPending();
              }
          }
        marks:
          - {line: 16, tip: 'লগইন না থাকলে বা role না থাকলে এখানেই "না"। সন্দেহে সবসময় false।'}
          - {line: 20, tip: 'বিভাগটা role-এ নয়, জিনিসের (Expense) তথ্যে। নতুন বিভাগ এলে কোড বদলাতে হয় না।'}
          - {line: 22, tip: 'Separation of duties: যে চেয়েছে, সে নিজে অনুমোদন দিতে পারে না।'}
      - type: code
        lang: php
        file: 'src/Controller/ExpenseController.php'
        variant: good
        code: |
          #[Route('/api/expenses/{id}/approve', methods: ['POST'])]
          #[IsGranted(ExpenseVoter::APPROVE, subject: 'expense')]
          public function approve(Expense $expense, EntityManagerInterface $em): JsonResponse
          {
              $expense->approve();
              $em->flush();

              return $this->json(['status' => $expense->getStatus()]);
          }
        marks:
          - {line: 2, tip: 'নিয়ম এক জায়গায়। web, API, console — যেখান থেকেই approve হোক, একই voter চলে।'}
    aside:
      - type: commands
        items:
          - {cmd: 'php bin/console debug:container --tag=security.voter', desc: 'নিবন্ধিত সব voter'}
          - {cmd: 'php bin/console debug:config security role_hierarchy', desc: 'role hierarchy কেমন সাজানো'}
      - type: tips
        items:
          - 'Voter-এর unit test লেখো: ম্যানেজার ঠিক বিভাগ → হ্যাঁ; অন্য বিভাগ → না; নিজের খরচ → না; ৫০ হাজার ছাড়ালে → না।'
    check:
      q: 'ম্যানেজারের "নিজের বিভাগ" শর্তটা voter-এ কেন, role-এ কেন নয়?'
      a: 'বিভাগ ব্যবহারকারী আর জিনিসের তথ্য, পদবি নয়। voter-এ রাখলে নতুন বিভাগে কোডে হাত পড়ে না আর role-এর সংখ্যা বাড়ে না।'

  - slug: voter-rebac
