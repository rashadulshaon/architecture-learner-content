slides:
  - slug: role-explosion
    title: 'ROLE_MANAGER থেকে ৪০টা role'
    kind: story
    tldr: 'শুধু role দিয়ে শুরু করা সহজ; কিন্তু "নিজের বিভাগের, ৫০ হাজার টাকার নিচের খরচ" জাতীয় শর্ত আসতেই role-এর সংখ্যা ফেটে পড়ে।'
    keywords: ['role explosion', 'RBAC', 'ROLE_MANAGER', 'access control', 'authorization rules', 'role বিস্ফোরণ']
    blocks:
      - type: text
        body: |
          রহিমের খরচ-অনুমোদনের অ্যাপে শুরুতে দুইটা role: `ROLE_EMPLOYEE`, `ROLE_MANAGER`। তারপর নিয়ম এল: ম্যানেজার শুধু নিজের বিভাগের খরচ অনুমোদন করবে; ৫০ হাজার টাকার ওপরে লাগবে ডিরেক্টর; নিজের খরচ নিজে অনুমোদন করা যাবে না। প্রতিটা নতুন শর্তে রহিম একটা করে নতুন role বানাল। ছয় মাসে role দাঁড়াল ৪০টা, আর কেউ বলতে পারে না কোনটা কার জন্য।
      - type: visual
        kind: steps
        caption: 'প্রতিটা শর্ত আলাদা role হয়ে শেষ পর্যন্ত যা দাঁড়ায়'
        steps:
          - {title: '১. দুই role', body: 'ROLE_EMPLOYEE, ROLE_MANAGER', tip: 'শুরুটা সরল ও পরিষ্কার। ছোট অ্যাপে এটাই যথেষ্ট।'}
          - {title: '২. বিভাগ ধরে', body: 'ROLE_MANAGER_SALES, ROLE_MANAGER_HR…', tip: 'প্রতিটা বিভাগের জন্য আলাদা role। বিভাগ বাড়লে role-ও বাড়ে।'}
          - {title: '৩. সীমা ধরে', body: 'ROLE_MANAGER_SALES_UPTO_50K', tip: 'টাকার সীমাও role-এ ঢুকে গেল। এখন বিভাগ × সীমা, আর সংখ্যা গুণ হয়ে বাড়ছে।'}
          - {title: '৪. ৪০টা role', body: 'কেউ আর মনে রাখতে পারে না', tip: 'নতুন কর্মী এলে কোন কোন role দিতে হবে ঠিক করা একটা ছোটখাটো গবেষণা হয়ে দাঁড়ায়।'}
    aside:
      - type: problem
        body: 'Role জিজ্ঞেস করে "তুমি কে?"। কিন্তু অনুমতি আসলে নির্ভর করে "তুমি কোন জিনিসে, কী অবস্থায়, কত টাকার"-এর ওপর। এই তথ্য role-এ ঠাসলে বিস্ফোরণ ঘটে।'
      - type: terms
        items:
          - {term: 'Role explosion', meaning: 'শর্ত গুণ হয়ে বাড়ায় role-এর সংখ্যা ফেটে পড়া।'}
    check:
      q: 'ম্যানেজার কেবল নিজের বিভাগের খরচ অনুমোদন করবে — এটা প্রতিটা বিভাগের জন্য আলাদা role দিয়ে লেখা সমস্যা কেন?'
      a: 'বিভাগ আর সীমা মিলে role-এর সংখ্যা গুণ হয়ে বাড়ে, আর নতুন বিভাগ এলেই কোড ও ডেটা বদলাতে হয়। বিভাগটা role নয়, জিনিসের একটা তথ্য — সেটা মিলিয়ে দেখাই ঠিক।'

  - slug: rbac-abac-rebac
    title: 'পদবি, শর্ত আর সম্পর্ক: তিন রকম নিয়ম'
    kind: concept
    tldr: 'RBAC পদবি দেখে, ABAC ব্যবহারকারী-জিনিস-পরিবেশের তথ্য দেখে, ReBAC জিনিসের সাথে সম্পর্ক দেখে; নিয়ম বেশি জটিল হলে policy engine।'
    keywords: ['RBAC', 'ABAC', 'ReBAC', 'policy engine', 'OPA', 'OpenFGA', 'Zanzibar', 'Cedar']
    blocks:
      - type: metaphor
        icon: bank
        title: 'ব্যাংকের ভল্ট-ঘর'
        body: |
          ভল্টে ঢোকার তিনটা নিয়ম ভাবো। **RBAC**: "ম্যানেজারদের ঢোকা চলবে" — শুধু পদবি। **ABAC**: "ম্যানেজার, নিজের শাখার ভল্টে, অফিস সময়ে, ৫০ লাখের নিচের লেনদেনে" — পদবির সাথে শর্ত। **ReBAC**: "যে এই লকারের যৌথ মালিক, সে খুলতে পারবে" — লকারের সাথে সম্পর্কই অনুমতি। আর **policy engine** হলো সব নিয়ম এক নিয়মবইয়ে লিখে বাইরের একজন বিচারককে দিয়ে রায় নেওয়া।
      - type: visual
        kind: table
        caption: 'চার পদ্ধতি পাশাপাশি'
        headers: ['', 'RBAC', 'ABAC', 'ReBAC']
        rows:
