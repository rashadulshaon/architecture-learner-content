        items:
          - {to: 'data/n-plus-one', label: 'N+1 query কীভাবে ধরবে'}
    check:
      q: 'ফাইলের অনুমতির জন্য প্রতিটা ফাইলে আলাদা grant না রেখে ফোল্ডারের grant ব্যবহার করলে কী লাভ?'
      a: 'ফোল্ডারে একবার editor করলে ভেতরের সব ফাইলে (নতুনগুলোতেও) নিজে থেকেই খাটে। অনুমতি বদলাতে একটা সারি বদলালেই হয়।'

  - slug: authz-pitfalls
    title: 'Authorization-এর চারটা পিছলা জায়গা'
    kind: pitfall
    tldr: 'সব জায়গায় ছড়ানো if, ডিফল্টে "হ্যাঁ" দেওয়া, token-এ বসে-থাকা পুরনো role আর শুধু একবার যাচাই — চারটাই নিয়ম ভাঙে।'
    keywords: ['authorization mistakes', 'scattered checks', 'default deny', 'stale roles', 'voter strategy', 'audit']
    blocks:
      - type: code
        lang: php
        file: 'src/Controller/ExpenseController.php'
        variant: bad
        code: |
          public function approve(Expense $expense, #[CurrentUser] User $user): JsonResponse
          {
              // একই নিয়ম আলাদা আলাদা controller আর Twig-এ ছড়ানো
              if ($user->getRoles() === ['ROLE_MANAGER'] || $user->getEmail() === 'boss@co.bd') {
                  $expense->approve();
              }

              return $this->json([]);
          }
        marks:
          - {line: 4, tip: 'কঠোর array তুলনা, হার্ডকোড করা ইমেইল — দুটোই ভঙ্গুর। নতুন ম্যানেজার-ধরন এলেই নিয়ম ভাঙে।'}
          - {line: 5, tip: 'শর্ত মিললে approve, নইলে চুপচাপ ভুল JSON। অনুমতি না থাকলে 403 দেওয়া উচিত।'}
      - type: visual
        kind: table
        caption: 'চার পিছলা জায়গা আর ঠিক উপায়'
        headers: ['ভুল', 'ঠিক উপায়']
        rows:
          - cells: ['if আর role-নাম সব জায়গায় ছড়ানো', 'নিয়ম এক voter-এ, ডাকো #[IsGranted] দিয়ে']
            tip: 'নিয়ম বদলাতে চল্লিশ জায়গা খুঁজতে হয়, আর একটা ভুললেই ফাঁক। একটা voter হলে এক জায়গায় বদল।'
          - cells: ['সন্দেহে "হ্যাঁ" ফেরানো', 'ডিফল্ট সবসময় false (deny by default)']
            tip: 'চেনা নয় এমন attribute বা অজানা অবস্থায় voter `false` দেবে, আর সন্দেহ হলেও না।'
          - cells: ['role লগইনের সময় token-এ ভরে রাখা', 'প্রতি request-এ ডেটাবেস থেকে বর্তমান অনুমতি']
            tip: 'কর্মী পদোন্নতি বা বরখাস্ত হলে পুরনো token-এর role আর সত্য নয়। মেয়াদি token হলে ছোট মেয়াদ রাখো।'
          - cells: ['শুধু দেখার action-এ যাচাই', 'প্রতিটা method আর export/download-এও']
            tip: 'দেখার action-এ voter বসিয়ে মুছে ফেলার action ভুলে যাওয়া খুব পরিচিত ভুল।'
      - type: quote
        body: 'অনুমতির নিয়ম এক জায়গায় লেখো, ডিফল্ট রাখো "না", আর প্রতিটা action-এ ডাকো।'
    aside:
      - type: tips
        items:
          - 'Symfony-র `access_decision_manager` strategy-র ডিফল্ট `affirmative`: একটা voter হ্যাঁ বললেই পাস। অন্য voter বিরোধিতা করলে যেন আটকায়, চাইলে `unanimous` ব্যবহার করো।'
          - 'কে কখন কোন অনুমতি পেয়েছিল — audit log রাখো। অনুমতি বদলের ঘটনা পরে খুঁজে পেতে হবে।'
      - type: refs
        items:
          - {to: 'security/authn-authz', label: 'IDOR আর মালিকানা যাচাই'}
    check:
      q: 'কর্মী পদোন্নতি পেয়েছে, কিন্তু তার পুরনো access token-এ আগের role লেখা। কোন নকশায় সমস্যা এড়ানো যায়?'
      a: 'প্রতি request-এ ব্যবহারকারীর বর্তমান role ডেটাবেস থেকে আনা (যেমন opaque token), অথবা token-এর মেয়াদ খুব ছোট রাখা; তাহলে পুরনো role বেশিক্ষণ টেকে না।'

flashcards:
  - q: 'RBAC কী, আর তার সীমা কোথায়?'
    a: 'Role-based access control: ব্যবহারকারীর পদবি দেখে অনুমতি। সরল, কিন্তু বিভাগ, অঙ্ক বা মালিকানার শর্ত এলে role-এর সংখ্যা বিস্ফোরিত হয়।'
    more: |
      ছোট অ্যাপে `ROLE_USER`, `ROLE_ADMIN` যথেষ্ট। কিন্তু "নিজের বিভাগের" বা "৫০ হাজারের নিচের" জাতীয় শর্তে প্রতিটার জন্য আলাদা role বানালে সংখ্যা গুণ হয়ে বাড়ে। তখন ABAC-এ যাওয়ার সময়।
    ref: role-explosion
  - q: 'ABAC বলতে কী বোঝায়?'
    a: 'Attribute-based access control: ব্যবহারকারী, জিনিস আর পরিবেশের তথ্য (বিভাগ, টাকার অঙ্ক, সময়) মিলিয়ে সিদ্ধান্ত।'
    more: |
      Symfony-তে ABAC মানে voter, যেখানে `$subject->getDepartment() === $user->getDepartment()` ধরনের শর্ত লেখা। role শুধু মোটা দরজা, বাকি সূক্ষ্ম নিয়ম তথ্য থেকে আসে।
    ref: rbac-abac-rebac
  - q: 'ReBAC বলতে কী বোঝায়?'
    a: 'Relationship-based: ব্যবহারকারীর সাথে জিনিসের সম্পর্ক (editor, owner, member) থেকে অনুমতি, উত্তরাধিকারসহ।'
    more: |
      Google Drive-এ ফোল্ডারে editor হলে ভেতরের ফাইলেও editor। Google-এর Zanzibar এই ধারণার ওপর তৈরি; OpenFGA তার খোলা সংস্করণ। ছোট অ্যাপে এটা Symfony voter আর একটা grant টেবিল দিয়ে সহজেই করা যায়।
    ref: voter-rebac
  - q: 'Policy engine কী, আর কখন লাগে?'
    a: 'নিয়ম কোডের বাইরে আলাদা ভাষায় (Rego, Cedar) লিখে সিদ্ধান্ত নেওয়ার যন্ত্র। লাগে অনেক সার্ভিসে একই নিয়ম, বা deploy ছাড়া নিয়ম বদলাতে চাইলে।'
    more: |
      OPA, Cedar আর OpenFGA এর উদাহরণ। কিন্তু একটা Symfony monolith আর কয়েকটা নিয়মে voter-ই যথেষ্ট; বাড়তি সার্ভিস, বাড়তি ব্যর্থতার জায়গা। দরকারের আগে engine যোগ করো না।
    ref: rbac-abac-rebac
  - q: 'Symfony-তে role hierarchy কী করে?'
    a: 'এক role-কে আরেকটার ওপরে বসায়, যাতে ওপরের role নিচের সব অনুমতি পায়। `ROLE_MANAGER: ROLE_EMPLOYEE`।'
    more: |
      `security.yaml`-এর `role_hierarchy`-তে লেখা হয়। ফলে ম্যানেজারকে আলাদা করে employee role দিতে হয় না। কিন্তু role hierarchy শুধু মোটা অনুমতি; জিনিস ধরে সিদ্ধান্ত voter-এ।
    ref: voter-abac
  - q: 'Voter-এ `supports()` আর `voteOnAttribute()` কী করে?'
    a: '`supports()` ঠিক করে প্রশ্নটা এই voter-এর কি না। `voteOnAttribute()` আসল নিয়ম চালিয়ে true বা false দেয়।'
    more: |
      একটা অ্যাপে অনেক voter থাকে; Symfony প্রতিটাকে `supports()` জিজ্ঞেস করে, শুধু যারা "হ্যাঁ" বলে তাদের ভোট গোনে। `#[IsGranted('EXPENSE_APPROVE', subject: 'expense')]` সরাসরি এই ব্যবস্থাকে ডাকে।
    ref: voter-abac
  - q: 'Deny by default মানে voter-এ কী?'
    a: 'অচেনা attribute বা সন্দেহে voter সবসময় false দেবে; অনুমতি পেতে হলে নিয়ম জেনেশুনে মিলতে হবে।'
    more: |
      `match` বা `if` শেষে `default => false` রাখো। ডিফল্টে "হ্যাঁ" ফেরালে নতুন attribute যোগ হলেই ভুল করে সবাই অনুমতি পেয়ে যায়।
    ref: authz-pitfalls
  - q: 'Separation of duties কী?'
    a: 'যে কাজ চায়, সে নিজে সেটা অনুমোদন দিতে পারে না। যেমন কর্মী নিজের খরচ নিজে পাস করতে পারবে না।'
    more: |
      ভুল আর জালিয়াতি দুটোই কমায়। voter-এ `$subject->getRequester() !== $user` একটা সরল শর্ত। টাকা-সংক্রান্ত, অনুমোদন-সংক্রান্ত সব ধাপেই এই নিয়ম রাখা ভালো।
    ref: voter-abac

quiz:
  - q: 'নতুন বিভাগ খুললেই রহিমকে `ROLE_MANAGER_<বিভাগ>` নামে নতুন role বানাতে আর কোড বদলাতে হয়। কী ঠিক সমাধান?'
    hint: 'বিভাগ কি ব্যবহারকারীর পদবি, নাকি জিনিসের তথ্য?'
    options:
      - text: 'প্রতিটা বিভাগের জন্য আলাদা role চালিয়ে যাওয়া'
        correct: false
        why: 'role-এর সংখ্যা গুণ হয়ে বাড়ে এবং প্রতিটা নতুন বিভাগে deploy লাগে।'
      - text: 'একটাই `ROLE_MANAGER` রেখে voter-এ বিভাগ মিলিয়ে দেখা'
        correct: true
        why: 'বিভাগ হলো জিনিস আর ব্যবহারকারীর তথ্য। voter-এ মিলালে নতুন বিভাগে কোড বদলাতে হয় না।'
      - text: 'সব ম্যানেজারকে `ROLE_ADMIN` দেওয়া'
        correct: false
        why: 'সবাইকে সবকিছুর অনুমতি দেওয়া মানে নিয়মই তুলে দেওয়া।'
      - text: 'Vue-তে বিভাগ অনুযায়ী বাটন লুকানো'
        correct: false
        why: 'UI লুকালে API খোলা থাকে; সার্ভারে যাচাই দরকার।'
    ref: role-explosion
  - q: 'নিচের voter-এর সমস্যা কী?'
    lang: php
    code: |
      protected function voteOnAttribute(
          string $attribute, mixed $subject, TokenInterface $token,
      ): bool
      {
          $user = $token->getUser();
          if ($attribute === 'EXPENSE_APPROVE') {
              return $subject->getAmountTaka() <= 50_000;
          }

          return true;
      }
    hint: 'অচেনা attribute এলে কী ফেরত যায়? আর ব্যবহারকারী কে, দেখা হয়েছে?'
    options:
      - text: 'অচেনা attribute-এ true ফেরে, আর ব্যবহারকারী বা role একদম দেখা হয়নি'
        correct: true
        why: 'যে কেউ ৫০ হাজারের নিচের খরচ অনুমোদন করতে পারে, আর অন্য attribute-এ সবার অনুমতি। ডিফল্ট false হওয়া উচিত।'
      - text: 'শুধু `<=` চিহ্নটা ভুল, `<` হওয়া উচিত'
        correct: false
        why: 'সীমার সীমানা ব্যবসার সিদ্ধান্ত; আসল সমস্যা নিরাপত্তায়।'
      - text: 'সমস্যা নেই, controller তো `#[IsGranted]` ব্যবহার করে'
        correct: false
        why: '`#[IsGranted]` শুধু voter-কে ডাকে। voter যা বলবে, সেটাই সিদ্ধান্ত।'
    ref: authz-pitfalls
  - q: 'একটা প্রজেক্টে সদস্য (member) যেকোনো টাস্ক দেখতে পারে, আর শুধু lead টাস্ক মুছতে পারে। কোন মডেল সবচেয়ে সরল?'
    hint: 'অনুমতি আসছে কীসের সাথে সম্পর্ক থেকে?'
    options:
      - text: 'ABAC, টাকার অঙ্ক ধরে'
        correct: false
        why: 'এখানে অঙ্ক বা সময় নেই; অনুমতি আসছে প্রজেক্টের সাথে ব্যবহারকারীর সম্পর্ক থেকে।'
      - text: 'ReBAC: প্রজেক্টে ব্যবহারকারীর relation (member, lead) দেখা'
        correct: true
        why: 'সম্পর্ক আছে কি না আর কোন ধরনের, তা থেকেই অনুমতি; voter-এ একটা grant টেবিল খুঁজলেই হয়।'
      - text: 'প্রতিটা প্রজেক্টের জন্য আলাদা role'
        correct: false
        why: 'প্রজেক্ট বাড়লে role বাড়ে; সম্পর্কের তথ্য ডেটায় থাকাই ঠিক।'
    ref: rbac-abac-rebac
  - q: 'কোন কোন পরিস্থিতিতে আলাদা policy engine (OPA, Cedar, OpenFGA) যুক্তিযুক্ত?'
    hint: 'একটা মাত্র মনোলিথের কয়েকটা নিয়ম কি যথেষ্ট কারণ?'
    options:
      - text: 'অনেক সার্ভিসে একই নিয়ম একবারে বদলাতে চাই'
        correct: true
        why: 'নিয়ম এক জায়গায় থাকলে প্রতিটা সার্ভিসে কোড বদলাতে হয় না।'
      - text: 'নিয়ম deploy ছাড়া নিয়মিত বদলাতে হয়'
        correct: true
        why: 'কোডের বাইরের নিয়ম আলাদাভাবে বদলানো ও audit করা যায়।'
      - text: 'একটা Symfony অ্যাপে তিনটা নিয়ম আছে'
        correct: false
        why: 'এটা voter-এই চলে; বাড়তি সার্ভিস শুধু জটিলতা বাড়ায়।'
      - text: 'সার্ভারে `if` লিখতে ভালো লাগছে না'
        correct: false
        why: 'এটা কারণ নয়; voter-ই সেই `if`-গুলো গুছিয়ে রাখে।'
    ref: rbac-abac-rebac
