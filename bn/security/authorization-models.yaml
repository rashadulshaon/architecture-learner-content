            tip: 'RBAC সবচেয়ে সরল। ABAC-তে বিভাগ, টাকার অঙ্ক, সময় — যেকোনো তথ্য নিয়মে ঢোকে। ReBAC-তে নিয়ম গ্রাফের মতো: কে কার সাথে যুক্ত।'
          - cells: ['উদাহরণ', 'ROLE_MANAGER', 'নিজের বিভাগ ও ≤ ৫০ হাজার', 'ফোল্ডারের editor, তাই ফাইলও পারে']
