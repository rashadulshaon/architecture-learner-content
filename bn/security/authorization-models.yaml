          - cells: ['কখন যথেষ্ট', 'ছোট অ্যাপ, কয়েকটা পদবি', 'ব্যবসার শর্ত আছে', 'শেয়ারিং, টিম, hierarchy আছে']
            tip: 'বেশিরভাগ অ্যাপ RBAC দিয়ে শুরু করে ABAC-তে যায়। ReBAC লাগে শেয়ারিং-ভারী সিস্টেমে।'
          - cells: ['Symfony-তে', 'role + role_hierarchy', 'voter-এ শর্ত লেখা', 'voter-এ সম্পর্ক খোঁজা']
            tip: 'তিনটাই Symfony-র একই voter ব্যবস্থায় চলে। policy engine ছাড়াও এগুলো প্রয়োগ করা যায়।'
