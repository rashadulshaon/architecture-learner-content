          - {id: kms, label: 'KMS', sub: 'master key এখানে', icon: key, col: 1.5, row: 0, tip: 'AWS KMS, Google Cloud KMS বা Vault। master key এর ভেতরেই থাকে, কখনো বের হয় না।'}
