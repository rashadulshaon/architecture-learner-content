      a: 'এনক্রিপ্ট করলে আসল কার্ড আমাদের কাছে থাকে, আমাদের key-র ওপর ঝুঁকি। Tokenization-এ আসল কার্ড থাকে provider-এর কাছে, আমরা শুধু অর্থহীন token রাখি।'

flashcards:
  - q: 'ডেটাবেস চুরি গেলেও ক্ষতি সীমিত রাখার ধারণাটা কী?'
    a: 'Defence in depth: ডেটা নিজে সুরক্ষিত রাখা (hash, এনক্রিপশন, token), যাতে বাইরের দেয়াল ভাঙলেও চোর কিছু পড়তে না পারে।'
    more: |
      Firewall আর পাসওয়ার্ড শুধু ঢোকার পথ আটকায়। কিন্তু backup, SQL injection আর কর্মীর ভুলে ডেটা বাইরে যায়। তাই ডেটার নিজস্ব সুরক্ষা শেষ দেয়াল হিসেবে কাজ করে।
    ref: stolen-dump
  - q: 'পাসওয়ার্ডের জন্য hash আর এনক্রিপশনের মূল পার্থক্য কী?'
    a: 'এনক্রিপশন key দিয়ে ফেরানো যায়; hash ফেরানো যায় না। পাসওয়ার্ড শুধু মেলাতে হয়, ফেরত পড়তে হয় না।'
    more: |
      লগইনে ব্যবহারকারীর দেওয়া পাসওয়ার্ড আবার hash করে জমা hash-এর সাথে মেলানো হয়। তাই মূল পাসওয়ার্ড কোথাও রাখতে হয় না। এনক্রিপ্ট করলে key চুরির সাথে সব পাসওয়ার্ড একসাথে খুলে যায়।
    ref: password-hashing
  - q: 'পাসওয়ার্ডের জন্য MD5 বা SHA-256 কেন ভুল?'
    a: 'ওগুলো দ্রুত। আক্রমণকারী সেকেন্ডে কোটি কোটি আন্দাজ করে পাসওয়ার্ড ভেঙে ফেলে। পাসওয়ার্ডের hash ইচ্ছে করে ধীর হতে হয়।'
    more: |
      argon2id আর bcrypt ইচ্ছে করে সময় আর মেমোরি খরচ করায়, তাই প্রতিটা আন্দাজ ব্যয়বহুল। এদের মধ্যে salt-ও থাকে, তাই একই পাসওয়ার্ডের hash আলাদা আর আগে থেকে বানানো তালিকা (rainbow table) কাজ করে না।
    ref: password-hashing
  - q: 'Symfony-তে পাসওয়ার্ড hash করার সঠিক উপায় কী?'
    a: '`password_hashers`-এ `auto` ধরে `UserPasswordHasherInterface::hashPassword()` ব্যবহার করা।'
    more: |
      `auto` সার্ভারের সেরা অ্যালগরিদম বেছে নেয়। ভবিষ্যতে সেরা অ্যালগরিদম বদলালে লগইনের সময় পুরনো hash নিজে আপগ্রেড হয়। salt আলাদা জমা রাখতে হয় না, hash স্ট্রিংয়ের ভেতরেই থাকে।
    ref: password-hashing
  - q: 'TLS, disk encryption আর field encryption কে কী ঠেকায়?'
    a: 'TLS: পথে আড়ি পাতা। Disk: ডিস্ক বা backup চুরি। Field: ডেটাবেস ফাঁস ও SQL injection।'
    more: |
      প্রতিটা স্তর আলাদা বিপদের জন্য, একটা আরেকটার বদলি নয়। চলমান ডেটাবেস নিজে ডিস্ক খুলে পড়ে, তাই ডিস্ক এনক্রিপশন SQL injection-এ কিছুই করে না। সবচেয়ে সংবেদনশীল ক্ষেত্রে অ্যাপ-স্তরের এনক্রিপশন লাগে।
    ref: encrypt-fields
  - q: 'sodium secretbox-এ প্রতিবার নতুন nonce কেন লাগে?'
    a: 'একই key-তে একই nonce দুইবার ব্যবহার করলে এনক্রিপশনের নিরাপত্তা ভেঙে যায়। তাই প্রতিবার random nonce, যা cipher-এর সাথে জমা থাকে।'
    more: |
      nonce গোপন নয়, শুধু একবার ব্যবহারের জন্য। এটা cipher-এর সামনে জুড়ে রাখা হয় যাতে decrypt-এর সময় পাওয়া যায়। secretbox authenticated, তাই কেউ ডেটা বদলালে decrypt ব্যর্থ হয়।
    ref: encrypt-fields
  - q: 'Envelope encryption কী?'
    a: 'ডেটা এনক্রিপ্ট হয় data key দিয়ে, আর সেই data key তালাবন্ধ থাকে KMS-এর master key দিয়ে।'
    more: |
      Master key KMS-এর বাইরে যায় না। অ্যাপ KMS-কে data key বানাতে বা খুলতে বলে। master key বদলাতে হলে শুধু data key-গুলো নতুন করে তালা দিতে হয়; পুরো ডেটা আবার এনক্রিপ্ট নয়।
    ref: envelope-kms
  - q: 'Tokenization আর masking-এর পার্থক্য কী?'
    a: 'Tokenization-এ আসল মান provider-এর কাছে, আমরা token রাখি। Masking শুধু দেখানোর সময় মানের অংশ ঢেকে রাখা।'
    more: |
      Masking (০১৭****৮৯) প্রদর্শন বা log-এর জন্য, ডেটা সুরক্ষার জন্য নয়। Tokenization-এ আমাদের ডেটাবেসে কার্ডের আসল নম্বরই থাকে না, তাই ফাঁস হলেও কিছু যায় না আর PCI-এর ঝামেলা কমে।
    ref: pii-in-logs

