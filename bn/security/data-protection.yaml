          - {term: 'DEK / KEK', meaning: 'DEK ডেটা এনক্রিপ্ট করে; KEK (master key) DEK-কে তালা দেয়।'}
    check:
      q: 'Envelope encryption-এ master key বদলালে পুরো ডেটাবেস আবার এনক্রিপ্ট করতে হয় না কেন?'
      a: 'কারণ ডেটা এনক্রিপ্ট করা আছে data key দিয়ে। master key বদলালে শুধু ছোট data key-গুলো নতুন master key দিয়ে আবার তালা দিলেই চলে।'

  - slug: pii-in-logs
    title: 'ব্যক্তিগত তথ্য: কম রাখো, ঢেকে দেখাও, log-এ দিও না'
