          ব্যাংক লকারে মালপত্র রেখে তোমাকে শুধু একটা স্লিপ দেয়; স্লিপ হারালেও কেউ মাল পায় না। বিকাশ স্ক্রিনে নম্বর দেখায় 017****89: দেখেই চেনা যায়, কিন্তু আসল নম্বর বোঝা যায় না। প্রথমটা tokenization, দ্বিতীয়টা masking।
      - type: visual
