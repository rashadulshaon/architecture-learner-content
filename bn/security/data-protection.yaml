          - 'KMS কে প্রতিটা ডেটার জন্য ডাকতে হয় না; data key মেমোরিতে সীমিত সময় cache করা যায়।'
          - 'কে KMS দিয়ে decrypt করতে পারে তা access policy দিয়ে সীমিত রাখো, আর প্রতিটা decrypt-এর audit log থাকে।'
      - type: terms
        items:
