        edges:
          - {from: app, to: kms, label: 'অ্যাপ KMS-কে একটা নতুন data key চায়'}
          - {from: kms, to: app, label: 'KMS দুই রূপে data key দেয়: খোলা আর তালাবন্ধ', dashed: true}
          - {from: app, to: db, label: 'অ্যাপ এনক্রিপ্ট করা ডেটা আর তালাবন্ধ key জমা রাখে', tone: good}
      - type: code
        lang: php
        file: 'src/Security/EnvelopeEncryptor.php'
        variant: good
        code: |
          public function encrypt(string $plain): EncryptedBlob
          {
              $result = $this->kms->generateDataKey([
                  'KeyId' => $this->keyId,
                  'KeySpec' => 'AES_256',
              ]);
              $dek = $result['Plaintext'];

              $nonce = random_bytes(SODIUM_CRYPTO_SECRETBOX_NONCEBYTES);
              $cipher = $nonce.sodium_crypto_secretbox($plain, $nonce, $dek);
              sodium_memzero($dek);

              return new EncryptedBlob($cipher, $result['CiphertextBlob']);
          }
        marks:
          - {line: 3, tip: 'Aws\Kms\KmsClient-এর generateDataKey: একই key-র দুটো রূপ দেয়, Plaintext (এনক্রিপ্ট করতে) আর CiphertextBlob (জমা রাখতে)।'}
          - {line: 11, tip: 'ব্যবহার শেষে মেমোরি থেকে খোলা key মুছে ফেলো। জমা শুধু তালাবন্ধ রূপ।'}
      - type: quote
        body: 'Master key KMS-এর বাইরে আসে না; অ্যাপ শুধু তালাবন্ধ data key জমা রাখে।'
    aside:
      - type: problem
        body: 'একটাই key সব ডেটায় থাকলে সেটা চুরি গেলে সব শেষ, আর বদলাতে পুরো ডেটা আবার এনক্রিপ্ট করতে হয়। Envelope-এ master key বদলালে শুধু ছোট data key-গুলো নতুন করে তালা দিলেই হয়।'
      - type: tips
