slides:
  - slug: stolen-dump
    title: 'ডেটাবেস dump চুরি গেল — ভেতরে কী পাওয়া গেল?'
    kind: story
    tldr: 'ডেটাবেস কখনো না কখনো বাইরে যায় (backup, বাগ, চুরি); তাই ভেতরের ডেটা এমনভাবে রাখো, যাতে চুরি হলেও চোর কিছু পড়তে না পারে।'
    keywords: ['data breach', 'database dump', 'defence in depth', 'ডেটা ফাঁস', 'plain text password']
    blocks:
      - type: metaphor
        icon: book
        title: 'মুদি দোকানের বাকির খাতা'
        body: |
          মুদি দোকানির বাকির খাতায় সবার নাম, ঠিকানা আর বাকির অংক লেখা। খাতা চুরি গেলে চোর সবার খবর জেনে যায়। যদি আসল নাম লেখা থাকত শুধু দোকানির বোঝা সংকেতে, আর সংকেতের তালিকা থাকত আলাদা সিন্দুকে, তবে চোর খাতা পেয়েও কিছু বুঝত না। ডেটা সুরক্ষা ঠিক এই ভাবনাটা।
      - type: visual
        kind: compare
        caption: 'একই dump, দুই রকম ফল: চোর কী পেল'
        columns:
          - title: 'সুরক্ষাহীন dump'
            tone: bad
            icon: warning
            tip: 'চুরির পর প্রতিটা ক্ষতি সরাসরি: পাসওয়ার্ড দিয়ে অন্য সাইটেও ঢোকে, NID-তে পরিচয় চুরি হয়।'
            items:
              - 'পাসওয়ার্ড: 123456, rahim@2024 সরাসরি পড়া যায়'
              - 'NID নম্বর, ফোন নম্বর সবই খোলা লেখা'
              - 'কার্ড নম্বর তার CVV সহ জমা'
              - 'log-এ ইমেইল আর token ছড়ানো'
          - title: 'সুরক্ষিত dump'
            tone: good
            icon: shield
            tip: 'চোরের হাতে শুধু অর্থহীন বাইট। আসল মান পেতে তাকে আলাদা সিন্দুক (key) ভাঙতে হবে।'
            items:
              - 'পাসওয়ার্ড: argon2id hash, ফেরানো যায় না'
              - 'NID, ফোন: এনক্রিপ্ট করা, key আলাদা জায়গায়'
              - 'কার্ড: শুধু payment provider-এর token'
              - 'log-এ ব্যক্তিগত তথ্য নেই'
      - type: quote
        body: 'ধরে নাও ডেটাবেস একদিন চুরি যাবে; ডেটা এমনভাবে রাখো যেন চোর কিছু না পায়।'
    aside:
      - type: problem
        body: 'শুধু প্রবেশপথ পাহারা (firewall, পাসওয়ার্ড) যথেষ্ট নয়। backup, ভুল permission, SQL injection বা এক কর্মীর ভুলে ডেটা বাইরে যেতে পারে। ডেটার নিজের সুরক্ষা হলো শেষ দেয়াল।'
      - type: terms
        items:
          - {term: 'PII', meaning: 'Personally Identifiable Information: নাম, ফোন, NID, ইমেইল, ঠিকানা — যা দিয়ে একজন মানুষকে চেনা যায়।'}
          - {term: 'Defence in depth', meaning: 'একটা নয়, একাধিক স্তরের সুরক্ষা, যাতে একটা ভাঙলে বাকিগুলো আটকায়।'}
    check:
      q: 'ডেটাবেসের ভেতরেই আবার সুরক্ষা লাগে কেন, যখন সার্ভারে firewall আছে?'
      a: 'কারণ ডেটা firewall এড়িয়েও বাইরে যায়: backup, SQL injection, কর্মীর ভুল। ডেটা নিজে সুরক্ষিত থাকলে চুরির পরও ক্ষতি সীমিত থাকে।'

  - slug: password-hashing
    title: 'পাসওয়ার্ড: ভেজে রাখো, তুলে রেখো না'
    kind: concept
    tldr: 'পাসওয়ার্ড এনক্রিপ্ট নয়, hash করো — ধীর, salt-যুক্ত অ্যালগরিদমে (argon2id/bcrypt), যা থেকে মূল পাসওয়ার্ড ফেরানো যায় না।'
    keywords: ['password hashing', 'argon2id', 'bcrypt', 'salt', 'PasswordHasher', 'পাসওয়ার্ড hash']
    blocks:
      - type: metaphor
        icon: fire
        title: 'ডিম ভাজা'
        body: |
          কাঁচা ডিম ভেজে ফেললে আর কাঁচা ডিম ফেরানো যায় না, এটাই hash। ভাজার পর বলা যায় "এই ভাজা ওই ডিমেরই কি না", যদি একই নিয়মে আবার ভাজি। Salt হলো প্রতিটা ডিমে আলাদা মশলা: একই পাসওয়ার্ডেও চেহারা আলাদা, তাই এক ছকে সব মিলিয়ে ফেলা যায় না। আর ধীরে ভাজা (slow hash) মানে চোরের প্রতিটা আন্দাজে অনেক সময়।
      - type: visual
        kind: table
        caption: 'পাসওয়ার্ড রাখার কোন উপায়, কেন সঠিক বা ভুল'
        headers: ['উপায়', 'ফেরানো যায়?', 'রায়']
        rows:
          - cells: ['সাধারণ লেখা', 'হ্যাঁ, সরাসরি', 'কখনো নয়']
            tip: 'ডেটাবেস ফাঁসের সাথে সাথে সব পাসওয়ার্ড খোলা।'
          - cells: ['এনক্রিপশন (reversible)', 'হ্যাঁ, key থাকলে', 'ভুল']
            tip: 'key চুরি গেলে সব পাসওয়ার্ড একসাথে ফেরে। পাসওয়ার্ড ফেরত পাওয়ার দরকারই নেই।'
          - cells: ['MD5, SHA-256 (দ্রুত hash)', 'না, কিন্তু আন্দাজ খুব দ্রুত', 'ভুল']
            tip: 'এগুলো ফাইল চেকের জন্য তৈরি, দ্রুত। আক্রমণকারী সেকেন্ডে কোটি কোটি আন্দাজ করতে পারে।'
          - cells: ['argon2id, bcrypt (ধীর + salt)', 'না', 'সঠিক']
            tip: 'ইচ্ছে করে ধীর আর প্রতিটা hash-এ আলাদা salt। প্রতিটা আন্দাজ ব্যয়বহুল।'
      - type: code
        lang: yaml
        file: 'config/packages/security.yaml'
        variant: good
        code: |
          security:
              password_hashers:
                  Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
        marks:
          - {line: 3, tip: '"auto" মানে সার্ভারে যা সেরা (এখন সাধারণত argon2id বা bcrypt)। ভবিষ্যতে বদলালে পুরনো hash লগইনের সময় নিজে আপগ্রেড হয়।'}
      - type: code
        lang: php
        file: 'src/Service/Registration.php'
        variant: good
        code: |
          public function register(string $email, #[\SensitiveParameter] string $plain): User
          {
              $user = new User($email);
              $user->setPassword($this->hasher->hashPassword($user, $plain));

              $this->em->persist($user);
              $this->em->flush();

              return $user;
          }
        marks:
          - {line: 1, tip: '#[\SensitiveParameter] (PHP 8.2+) stack trace আর log-এ পাসওয়ার্ডের মান লুকিয়ে রাখে।'}
          - {line: 4, tip: 'UserPasswordHasherInterface নিজে salt বানায় আর পুরো স্ট্রিংয়ে salt সহ জমা রাখে; আলাদা কলাম লাগে না।'}
      - type: quote
        body: 'পাসওয়ার্ড কখনো সাধারণ লেখায় বা এনক্রিপ্ট করে নয়; ধীর salted hash।'
    aside:
      - type: tips
        items:
          - 'লগইন যাচাইয়ে Symfony authenticator নিজে isPasswordValid আর পুরনো hash-এর rehash দুটোই করে; নিজে compare কোরো না।'
          - 'পাসওয়ার্ড reset-এ "পুরনোটা পাঠাও" ফিচার থাকলে বুঝবে পাসওয়ার্ড ফেরানো যায়, অর্থাৎ ভুলভাবে রাখা। শুধু reset link দাও।'
      - type: remember
        body: 'পাসওয়ার্ড: hash, salt, ধীর। এনক্রিপ্ট নয়।'
      - type: refs
        items:
          - {to: 'security/account-recovery', label: 'Reset token কীভাবে রাখবে'}
    check:
      q: 'পাসওয়ার্ড AES দিয়ে এনক্রিপ্ট করে রাখলে কেন ভুল?'
      a: 'এনক্রিপশন key দিয়ে ফেরানো যায়। key বা সার্ভার চুরি গেলে সব পাসওয়ার্ড একসাথে খোলা। Hash ফেরানো যায় না, তাই মূল পাসওয়ার্ড কখনো পাওয়া যায় না।'

  - slug: encrypt-fields
    title: 'এনক্রিপশন: পথে, ডিস্কে, আর ক্ষেত্রে'
    kind: howto
    tldr: 'পথের জন্য TLS, ডিস্কের জন্য disk/DB encryption, আর সবচেয়ে সংবেদনশীল ক্ষেত্রের জন্য অ্যাপ-স্তরের sodium এনক্রিপশন; তিনটা তিন রকম বিপদ ঠেকায়।'
    keywords: ['encryption at rest', 'TLS', 'HTTPS', 'sodium_crypto_secretbox', 'field encryption', 'এনক্রিপশন']
    blocks:
      - type: metaphor
        icon: lock
        title: 'কুরিয়ার, গুদাম আর ব্যক্তিগত লকার'
        body: |
          পথে কুরিয়ারের বন্ধ খাম (TLS) রাস্তায় কেউ খুলে পড়তে পারে না। গুদামের তালা (disk encryption) চোর গুদাম ভেঙে মাল নিলে বাঁচায়, কিন্তু গুদামের লোক সবই খুলে দেখতে পারে। সবচেয়ে দামি জিনিস তাই আলাদা ব্যক্তিগত লকারে (field encryption), যার চাবি গুদামের লোকের কাছেও নেই।
      - type: visual
        kind: table
        caption: 'তিন স্তরের এনক্রিপশন: কী ঠেকায়, কী ঠেকায় না'
        headers: ['স্তর', 'ঠেকায়', 'ঠেকায় না']
        rows:
          - cells: ['পথে (TLS/HTTPS)', 'নেটওয়ার্কে আড়ি পাতা', 'সার্ভার বা DB চুরি']
            tip: 'ব্রাউজার থেকে সার্ভার আর সার্ভার থেকে DB পর্যন্ত সবখানে TLS লাগে, ভেতরের নেটওয়ার্কেও।'
          - cells: ['ডিস্কে (at rest)', 'ডিস্ক বা backup চুরি', 'SQL injection, অ্যাপ হ্যাক']
            tip: 'চলমান সার্ভার ডিস্ক নিজেই খুলে পড়ে। অ্যাপ হ্যাক হলে সবকিছু পরিষ্কার দেখা যায়।'
          - cells: ['ক্ষেত্রে (field-level)', 'ডেটাবেস ফাঁস, SQL injection', 'অ্যাপ নিজেই হ্যাক হলে']
            tip: 'শুধু সংবেদনশীল ক্ষেত্র (NID, কার্ড-সংলগ্ন তথ্য), কারণ খুঁজতে বা sort করতে অসুবিধা হয়।'
      - type: code
        lang: php
        file: 'src/Security/FieldEncryptor.php'
        variant: good
        code: |
          final class FieldEncryptor
          {
              public function __construct(
                  #[Autowire(env: 'base64:FIELD_ENCRYPTION_KEY')]
                  private readonly string $key, // ৩২ বাইটের key
              ) {
              }

              public function encrypt(string $plain): string
              {
                  $nonce = random_bytes(SODIUM_CRYPTO_SECRETBOX_NONCEBYTES);

                  return base64_encode($nonce.sodium_crypto_secretbox($plain, $nonce, $this->key));
              }

              public function decrypt(string $stored): string
              {
                  $raw = base64_decode($stored, true);
                  $n = SODIUM_CRYPTO_SECRETBOX_NONCEBYTES;
                  $plain = sodium_crypto_secretbox_open(
                      substr($raw, $n), substr($raw, 0, $n), $this->key
                  );

                  if (false === $plain) {
                      throw new \RuntimeException('Decrypt করা গেল না');
                  }

                  return $plain;
              }
          }
        marks:
          - {line: 4, tip: 'key কোডে নয়, environment বা vault থেকে। base64: processor binary key বানায়। দেখো secrets-management।'}
          - {line: 11, tip: 'প্রতিবার নতুন random nonce। একই key-তে nonce পুনর্ব্যবহার করলে এনক্রিপশন ভেঙে যায়।'}
          - {line: 20, tip: 'secretbox authenticated: কেউ ডেটা বদলালে open() false দেয়, তাই চুপচাপ ভুল মান পড়া হয় না।'}
      - type: quote
        body: 'নিজে অ্যালগরিদম বানিও না; sodium-এর মতো যাচাই-করা library ব্যবহার করো।'
    aside:
      - type: tips
        items:
          - 'HTTPS ছাড়া কোনো পাতা নয়: সার্ভারে HTTP থেকে HTTPS redirect আর HSTS header (Strict-Transport-Security) দাও। TLS 1.2 বা তার ওপরে।'
          - 'DB-তে সংযোগও TLS দিয়ে (managed DB-তে সাধারণত একটা সেটিং)। ভেতরের নেটওয়ার্ক মানেই নিরাপদ নয়।'
          - 'এনক্রিপ্ট করা কলামে সরাসরি WHERE চলে না। খুঁজতে হলে আলাদা hash (blind index) রাখতে হয়, যা একটা বাড়তি জটিলতা।'
      - type: refs
        items:
          - {to: 'security/secrets-management', label: 'এনক্রিপশন key কোথায় রাখবে'}
    check:
      q: 'ডিস্ক এনক্রিপশন চালু আছে, তবু SQL injection-এ NID ফাঁস হয় কেন?'
      a: 'চলমান ডেটাবেস ডিস্ক নিজেই খুলে পড়ে, তাই অ্যাপের মাধ্যমে আসা query সব মান পরিষ্কার দেখে। ক্ষেত্র-পর্যায়ের এনক্রিপশন অ্যাপের key ছাড়া খোলে না।'

  - slug: envelope-kms
    title: 'Envelope encryption: চাবির চাবি'
    kind: concept
    tldr: 'প্রতিটা ডেটার জন্য আলাদা data key, আর সেই key-গুলো তালা দেওয়া থাকে KMS-এর master key দিয়ে; master key কখনো KMS-এর বাইরে আসে না।'
    keywords: ['KMS', 'envelope encryption', 'data key', 'key rotation', 'key management', 'চাবির ব্যবস্থাপনা']
    blocks:
      - type: metaphor
        icon: bank
        title: 'ব্যাংকের লকার আর মাস্টার সিন্দুক'
        body: |
          ব্যাংকে প্রতিটা লকারের আলাদা ছোট চাবি আছে। সেই ছোট চাবিগুলো আবার ব্যাংকের মাস্টার সিন্দুকে তালাবন্ধ, যেটা ব্যাংকের বাইরে যায় না। লকার খুলতে ম্যানেজারকে বলতে হয়: সিন্দুক থেকে আমার চাবিটা খুলে দিন। KMS হলো সেই মাস্টার সিন্দুক, data key হলো প্রতিটা লকারের চাবি।
      - type: visual
        kind: flow
        caption: 'Envelope encryption: ডেটা এনক্রিপ্ট হয় data key দিয়ে, data key তালাবন্ধ KMS-এর key দিয়ে'
