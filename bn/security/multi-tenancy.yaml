slides:
  - slug: one-forgotten-where
    title: 'একটা ভুলে যাওয়া WHERE, আর সব কোম্পানির ডেটা এক জায়গায়'
    kind: story
    tldr: 'এক ডেটাবেসে অনেক ক্রেতা (tenant) থাকলে প্রতিটা query-তে tenant দিয়ে ছাঁকতে হয়; একটা query-তে ভুললেই এক ক্রেতা অন্যের ডেটা দেখে।'
    keywords: ['multi-tenancy', 'tenant isolation', 'SaaS', 'data leak', 'tenant_id', 'মাল্টি টেন্যান্সি']
    blocks:
      - type: text
        body: |
          রহিমের HR সফটওয়্যার (SaaS) একই ডেটাবেসে ৩০০টা কোম্পানির কর্মীর তথ্য রাখে। প্রতিটা query-তে `WHERE tenant_id = ?` লিখতে হয় — রহিমের দল এটা মেনে চলত। একদিন নতুন একজন ডেভেলপার এক্সপোর্ট রিপোর্টের query লিখল, সেখানে শর্তটা বাদ পড়ল। ফলে কোম্পানি ক-এর HR ম্যানেজার এক্সেল নামিয়ে দেখল তাতে ৩০০ কোম্পানির বেতনের তালিকা।
      - type: code
        lang: php
        file: 'src/Repository/EmployeeRepository.php'
        variant: bad
        code: |
          public function exportAll(): array
          {
              // tenant_id-র শর্ত ভুলে গেছে — সব কোম্পানির কর্মী ফেরত আসবে
              return $this->createQueryBuilder('e')
                  ->orderBy('e.name')
                  ->getQuery()
                  ->getResult();
          }
        marks:
          - {line: 3, tip: 'নতুন ডেভেলপার মনে রাখেনি। কোড রিভিউয়েও এই অনুপস্থিতি চোখে পড়া কঠিন, কারণ খারাপ কিছু লেখা নেই, শুধু কিছু বাদ গেছে।'}
      - type: visual
        kind: flow
        caption: 'শর্ত বাদ পড়লে সব tenant-এর row একসাথে ফেরত আসে'
        nodes:
          - {id: hr, label: 'কোম্পানি ক-এর HR', sub: 'tenant 7', icon: user, col: 0, row: 0, tip: 'লগইন করা ব্যবহারকারী, যে শুধু নিজের কোম্পানির কর্মীই দেখার কথা।'}
          - {id: api, label: 'API', sub: 'exportAll()', icon: api, tone: warn, col: 2, row: 0, tip: 'এই query-তে tenant দিয়ে ছাঁকা নেই।'}
          - {id: db, label: 'employee টেবিল', sub: '৩০০ tenant-এর row', icon: db, col: 3, row: 1.5, tip: 'সব ক্রেতার ডেটা এক টেবিলে, শুধু tenant_id কলাম দিয়ে আলাদা।'}
        edges:
          - {from: hr, to: api, label: 'এক্সপোর্ট চাইল'}
          - {from: api, to: db, label: 'tenant ছাড়াই সব কর্মী চাইল', tone: bad}
          - {from: db, to: hr, label: 'সব ৩০০ কোম্পানির তালিকা ফেরত', dashed: true, tone: bad}
    aside:
      - type: problem
        body: 'প্রতিটা query-তে হাতে শর্ত লেখার ওপর নির্ভর করলে একদিন কেউ না কেউ ভুলবে। নিরাপত্তা মানুষের স্মৃতির ওপর নির্ভর করতে পারে না।'
      - type: terms
        items:
          - {term: 'Tenant', meaning: 'সিস্টেমের একজন ক্রেতা (কোম্পানি), যার ডেটা অন্যদের থেকে আলাদা থাকতে হবে।'}
          - {term: 'SaaS', meaning: 'একই সফটওয়্যার অনেক ক্রেতাকে সেবা হিসেবে দেওয়া।'}
    check:
      q: 'প্রতিটা query-তে হাতে `tenant_id` শর্ত লেখার নিয়ম থাকলেও ডেটা ফাঁস হলো কেন?'
      a: 'একটা query-তে শর্তটা বাদ পড়েছিল। হাতে মনে রাখার ওপর নির্ভর করলে ভুল অবশ্যম্ভাবী; তাই ছাঁকাটা এমন জায়গায় বসাতে হয় যা প্রতিটা query-তে নিজে থেকেই লাগে।'

  - slug: three-isolation-levels
    title: 'এক ঘরে বিছানা, ফ্ল্যাট, নাকি আলাদা বাড়ি'
    kind: concept
    tldr: 'Tenant আলাদা করার তিন স্তর: একই টেবিলে tenant_id (row), আলাদা schema, আলাদা ডেটাবেস — যত আলাদা, তত নিরাপদ ও দামি।'
    keywords: ['row-level isolation', 'schema per tenant', 'database per tenant', 'shared schema', 'noisy neighbour', 'tenant isolation levels']
    blocks:
      - type: metaphor
        icon: building
        title: 'ঢাকার ভাড়াটে বাড়ি'
        body: |
          **Row-level**: এক ঘরে অনেক ভাড়াটে বিছানা পেতেছে (মেস)। সস্তা, কিন্তু একজনের জিনিস আরেকজনের হাতে যাওয়ার ভয় সবচেয়ে বেশি। **Schema-level**: এক বিল্ডিংয়ে আলাদা আলাদা ফ্ল্যাট, নিজস্ব দরজা। **Database-level**: প্রত্যেকের নিজস্ব বাড়ি। আর **noisy neighbour** হলো পাশের ফ্ল্যাটের যে সারারাত গান বাজায় বা সব পানি খরচ করে ফেলে।
      - type: visual
        kind: table
        caption: 'তিন স্তরের লাভ-ক্ষতি'
        headers: ['', 'Row-level', 'Schema', 'Database']
        rows:
          - cells: ['আলাদা কীভাবে', 'প্রতিটা row-তে tenant_id', 'tenant-প্রতি আলাদা schema', 'tenant-প্রতি আলাদা ডেটাবেস']
            tip: 'একই টেবিল, আলাদা টেবিলের সেট, আর আলাদা সার্ভার-সংযোগ — আলাদা করার তিনটা মাত্রা।'
          - cells: ['নিরাপত্তা', 'কম: একটা ভুল WHERE-এ ফাঁস', 'মাঝারি', 'সবচেয়ে বেশি']
            tip: 'আলাদা ডেটাবেসে ভুল query-তেও অন্যের ডেটা ছোঁয়াই যায় না। row-level-এ শুধু শর্ত ঠিক থাকাটাই বাঁধ।'
          - cells: ['খরচ ও রক্ষণাবেক্ষণ', 'সবচেয়ে সস্তা, migration একবার', 'মাঝারি, প্রতি schema-য় migration', 'সবচেয়ে দামি, হাজার ডেটাবেস সামলানো']
            tip: '৫০০০ tenant-এর জন্য ৫০০০ ডেটাবেস চালানো আর প্রতিটায় migration মানে বিরাট অপারেশনের বোঝা।'
          - cells: ['Noisy neighbour', 'সবচেয়ে ঝুঁকি, সব এক ডেটাবেসে', 'মাঝারি', 'সবচেয়ে কম']
            tip: 'এক tenant-এর ভারী query সবার ডেটাবেস ধীর করতে পারে। আলাদা ডেটাবেসে সেই প্রভাব আটকানো যায়।'
          - cells: ['কখন', 'অনেক ছোট tenant', 'নিয়ন্ত্রিত বড় ক্রেতা', 'বড় ক্রেতা, কঠোর compliance']
            tip: 'বেশিরভাগ SaaS row-level দিয়ে শুরু করে। বড় ক্রেতা বা আইনি শর্ত থাকলে তাদের জন্য আলাদা ডেটাবেস দেয়।'
      - type: quote
        body: 'ডেটা আলাদা করার ঝুঁকি যত বেশি, বিছানা থেকে বাড়ির দিকে তত সরো — খরচ বাড়বে, নিরাপত্তাও।'
    aside:
      - type: when
        use: ['Row-level: অনেক ছোট ক্রেতা, দ্রুত বাড়ছে এমন SaaS', 'Database per tenant: কয়েকজন বড় ক্রেতা, কঠোর isolation বা data residency']
        avoid: ['Database per tenant: হাজার হাজার ছোট tenant — অপারেশনাল বোঝা অসহ্য']
      - type: refs
        items:
          - {to: 'data/sharding', label: 'ডেটা ভাগ করার আরেক পদ্ধতি'}
    check:
      q: 'একজন বড় ব্যাংক-ক্রেতা বলল, তার ডেটা আলাদা ডেটাবেসে না থাকলে সে চুক্তি করবে না। বাকি ৫০০ ছোট ক্রেতার জন্য কী রাখবে?'
      a: 'ব্যাংকের জন্য আলাদা ডেটাবেস, আর ছোটদের জন্য row-level। ক্রেতার ঝুঁকি আর মূল্য অনুযায়ী স্তর মেশানো প্রচলিত নিয়ম।'

  - slug: doctrine-tenant-filter
    title: 'Doctrine filter: প্রতিটা query-তে নিজে থেকে tenant ছাঁকা'
    kind: howto
    tldr: 'SQLFilter প্রতিটা Doctrine query-তে নিজে থেকে `tenant_id = ?` জুড়ে দেয়; request-এর শুরুতে লগইন ব্যবহারকারীর tenant বসিয়ে তাকে চালু করো।'
    keywords: ['Doctrine SQLFilter', 'tenant scoping', 'addFilterConstraint', 'EventListener', 'prePersist', 'tenant_id', 'row-level tenancy']
    blocks:
      - type: text
        body: |
          ভাড়াটে বাড়ির দারোয়ানের মতো একজন থাকবে যে প্রতিটা ভেতরে ঢোকার আগে বলে "শুধু নিজের ফ্ল্যাট"। Doctrine-এ সেই দারোয়ান হলো **SQL filter**। সে প্রতিটা DQL query-র সাথে `AND tenant_id = ?` নিজে বসিয়ে দেয়, তাই ডেভেলপারকে মনে রাখতে হয় না। যেসব entity-র tenant আছে, তারা `TenantAware` interface নেয়।
      - type: code
        lang: php
        file: 'src/Doctrine/TenantFilter.php'
        variant: good
        code: |
          final class TenantFilter extends SQLFilter
          {
              public function addFilterConstraint(
                  ClassMetadata $targetEntity,
                  string $targetTableAlias,
              ): string {
                  // শুধু tenant-সচেতন entity-তে খাটে
                  if (!$targetEntity->getReflectionClass()->implementsInterface(TenantAware::class)) {
                      return '';
                  }

                  $tenant = $this->getParameter('tenant_id');   // নিজে quote করা

                  return sprintf('%s.tenant_id = %s', $targetTableAlias, $tenant);
              }
          }
        marks:
          - {line: 3, tip: 'প্রতিটা entity-র জন্য Doctrine এই method-কে ডাকে; যে শর্ত ফেরত দেয়, সেটা query-র WHERE-এ জুড়ে যায়।'}
          - {line: 12, tip: 'getParameter() মান নিজে quote করে দেয়, তাই SQL injection হয় না। কখনো ব্যবহারকারীর ইনপুট string-এ জুড়ো না।'}
      - type: code
        lang: php
        file: 'src/EventListener/TenantFilterListener.php'
        variant: good
        code: |
          #[AsEventListener(event: KernelEvents::REQUEST, priority: 4)]   // firewall-এর (৮) পরে
          final class TenantFilterListener
          {
              public function __construct(
                  private readonly Security $security,
                  private readonly EntityManagerInterface $em,
              ) {}

              public function __invoke(RequestEvent $event): void
              {
                  $user = $this->security->getUser();
                  if (!$event->isMainRequest() || !$user instanceof User) {
                      return;
                  }

                  $filter = $this->em->getFilters()->enable('tenant');
                  $filter->setParameter('tenant_id', (string) $user->getTenant()->getId());
              }
          }
        marks:
          - {line: 1, tip: 'firewall-এর listener-এর priority ৮; আমরা তার পরে (৪) চলি, যাতে ব্যবহারকারী ততক্ষণে চেনা হয়ে যায়।'}
          - {line: 17, tip: 'tenant আসে লগইন করা ব্যবহারকারী থেকে, কখনো request-এর query বা header থেকে নয়।'}
    aside:
      - type: commands
        title: 'কনফিগ'
        items:
          - {cmd: 'php bin/console debug:config doctrine orm filters', desc: 'filter নিবন্ধিত আছে কি না'}
      - type: pitfalls
        items:
          - 'filter শুধু ORM/DQL query-তে খাটে। raw DBAL SQL আর native query-তে নয়, সেগুলোতে হাতে শর্ত লাগে।'
          - 'প্রতিটা entity-র জন্য নতুন row লেখার সময় tenant বসাতে prePersist listener রাখো, নইলে tenant ছাড়া row ঢুকবে।'
          - 'অ্যাপের মূল কোডে এই filter বন্ধ কোরো না; কেবল admin/cross-tenant কাজে সচেতনভাবে বন্ধ করো।'
    check:
      q: 'tenant-এর আইডি request-এর `?tenant=7` প্যারামিটার থেকে না নিয়ে লগইন করা ব্যবহারকারী থেকে নেওয়া হয় কেন?'
      a: 'প্যারামিটার ক্লায়েন্টের হাতে; সে অন্যের tenant লিখে দিলেই তার ডেটা দেখত। লগইন করা ব্যবহারকারীর tenant সার্ভারের যাচাই-করা তথ্য।'

  - slug: noisy-neighbour
    title: 'এক tenant যেন সবার পানি শেষ না করে'
    kind: howto
    tldr: 'Tenant-প্রতি rate limit, আলাদা queue বা worker ভাগ আর ভারী কাজে সীমা দিলে এক ক্রেতার চাপ বাকিদের ধীর করতে পারে না।'
    keywords: ['noisy neighbour', 'per-tenant rate limit', 'fair usage', 'RateLimiter', 'tenant quota', 'resource isolation']
    blocks:
      - type: text
        body: |
          Row-level-এ সব tenant একই ডেটাবেস আর একই সার্ভারের ওপর। একজন ক্রেতা ঘণ্টায় ১০ লাখ request পাঠালে বাকি ২৯৯ জন ধীর হয়ে যায়। তাই প্রতিটা tenant-এর জন্য আলাদা পানির মিটার বসাতে হয়: **per-tenant rate limit**। Symfony RateLimiter-এ চাবি হিসেবে tenant-এর আইডি দিলেই প্রতি ক্রেতার আলাদা বালতি হয়।
      - type: code
        lang: yaml
        file: 'config/packages/rate_limiter.yaml'
        code: |
          framework:
              rate_limiter:
                  tenant_api:
                      policy: 'sliding_window'
                      limit: 600
                      interval: '1 minute'
        marks:
          - {line: 3, tip: 'নামটা `tenant_api`, তাই Symfony `RateLimiterFactory $tenantApiLimiter` autowire করে।'}
          - {line: 5, tip: 'প্রতি tenant প্রতি মিনিটে ৬০০ request। বড় plan-এর জন্য এই সীমা বাড়ানো যায়।'}
      - type: code
        lang: php
        file: 'src/EventListener/TenantRateLimitListener.php'
        variant: good
        code: |
          #[AsEventListener(event: KernelEvents::REQUEST, priority: 3)]
          final class TenantRateLimitListener
          {
              public function __construct(
                  private readonly Security $security,
                  private readonly RateLimiterFactory $tenantApiLimiter,
              ) {}

              public function __invoke(RequestEvent $event): void
              {
                  $user = $this->security->getUser();
                  if (!$event->isMainRequest() || !$user instanceof User) {
                      return;
                  }

                  // চাবি = tenant, তাই এক ক্রেতার ভিড় অন্যের বালতি খালি করে না
                  $key = (string) $user->getTenant()->getId();
                  $limit = $this->tenantApiLimiter->create($key)->consume();
                  if (!$limit->isAccepted()) {
                      $wait = $limit->getRetryAfter()->getTimestamp() - time();
                      throw new TooManyRequestsHttpException($wait);
                  }
              }
          }
        marks:
          - {line: 17, tip: 'চাবি tenant হলে প্রতি tenant-এর আলাদা গণনা। user বা IP দিলে বড় কোম্পানির সব কর্মী ভুলভাবে ভাগাভাগি করত।'}
          - {line: 21, tip: '429 Too Many Requests আর Retry-After সময় ফেরত যায়, যাতে client জানে কতক্ষণ পরে আবার চেষ্টা করবে।'}
    aside:
      - type: tips
        items:
          - 'ভারী background কাজও tenant ধরে সীমিত করো: আলাদা Messenger transport বা প্রতি tenant concurrency সীমা।'
          - 'ডেটাবেসে ভারী report-এ `statement_timeout` রাখো, যাতে এক tenant-এর query সবার জন্য ডেটাবেস আটকে না রাখে।'
      - type: refs
        items:
          - {to: 'api/rate-limiting', label: 'Rate limit-এর ধরন ও algorithm'}
    check:
      q: 'Rate limit-এর চাবি হিসেবে ব্যবহারকারীর আইডির বদলে tenant-এর আইডি দিলে কী বদলায়?'
      a: 'সীমাটা পুরো কোম্পানির জন্য এক বালতিতে গোনা হয়, তাই এক কোম্পানির সব কর্মী মিলে অন্য কোম্পানির ভাগ খেতে পারে না; কিন্তু সেই কোম্পানির ভেতরে ভাগাভাগি করতে হয়।'

  - slug: tenant-leak-paths
    title: 'ফিল্টার থাকলেও চুইয়ে পড়ার চার পথ'
    kind: pitfall
    tldr: 'Raw SQL, background worker, cache key আর unique index — এই চার জায়গায় Doctrine filter পৌঁছায় না; সেখানে tenant আলাদা করে সামলাতে হয়।'
    keywords: ['tenant leak', 'Messenger worker', 'cache key', 'unique index', 'raw SQL', 'cross-tenant', 'defense in depth']
    blocks:
      - type: text
        body: |
          Filter একটা ভালো বাঁধ, কিন্তু চারপাশে ফাঁক থাকে যেখানে Doctrine-এর দারোয়ান নেই। প্রতিটা ফাঁকের একই সমাধান: tenant-কে স্পষ্টভাবে সাথে বহন করো, আন্দাজে নয়।
      - type: visual
        kind: table
        caption: 'চার ফাঁক, কী ঘটে, ঠিক উপায়'
        headers: ['ফাঁক', 'কী ঘটে', 'ঠিক উপায়']
        rows:
          - cells: ['Raw SQL / DBAL', 'filter চলে না, সব tenant আসে', 'হাতে `tenant_id = :t` বা ORM ব্যবহার']
            tip: 'DQL ছাড়া সরাসরি SQL চালালে Doctrine filter জানেই না। রিপোর্টের জটিল query-তে এই ভুল সবচেয়ে বেশি।'
          - cells: ['Messenger worker, cron', 'request নেই, তাই filter বন্ধ', 'message-এ tenantId রাখো, handler-এ filter চালু']
            tip: 'background কাজে লগইন ব্যবহারকারী নেই; filter চালু না করলে tenant ছাড়াই সব row ছোঁয়।'
          - cells: ['Cache key', '`report:2024` সব tenant-এর এক', 'key-তে tenant: `t7:report:2024`']
            tip: 'cache-এ tenant ছাড়া key মানে কোম্পানি ক-এর রিপোর্ট কোম্পানি খ-কে দেখানো।'
          - cells: ['Unique index', 'email সব tenant-এর মধ্যে অনন্য', 'unique (tenant_id, email)']
            tip: 'দুই কোম্পানিতে একই ইমেইলের কর্মী থাকতেই পারে। tenant ছাড়া unique হলে একজন নিবন্ধনই করতে পারবে না।'
      - type: code
        lang: php
        file: 'src/MessageHandler/BuildReportHandler.php'
        variant: good
        code: |
          #[AsMessageHandler]
          final class BuildReportHandler
          {
              public function __construct(private readonly EntityManagerInterface $em) {}

              public function __invoke(BuildReport $message): void
              {
                  // request নেই, তাই tenant message থেকে নিয়ে filter চালু করি
                  $this->em->getFilters()->enable('tenant')
                      ->setParameter('tenant_id', $message->tenantId);

                  // এখন থেকে প্রতিটা query নিজে থেকে ছাঁকা
              }
          }
        marks:
          - {line: 8, tip: 'worker সারা দিন চলে এবং নানা tenant-এর message নেয়; প্রতিটা handler-এ নিজের tenant বসাও।'}
      - type: quote
        body: 'Filter বাঁধ, শেষ ভরসা নয়। Raw SQL, worker, cache আর unique index-এ tenant নিজে বহন করো।'
    aside:
      - type: tips
        items:
          - 'বাড়তি নিরাপত্তায় PostgreSQL row-level security (RLS) ব্যবহার করো: ডেটাবেস নিজেই অন্য tenant-এর row আটকায়, অ্যাপের ভুলেও।'
          - 'Cross-tenant ফাঁসের জন্য test লেখো: দুই tenant বানিয়ে একজনের token দিয়ে অন্যের ডেটা চাইলে 403/404 আসা চাই।'
    check:
      q: 'Messenger worker-এ Doctrine tenant filter নিজে থেকে কেন চালু থাকে না, আর কী করা উচিত?'
      a: 'Filter চালু হয় web request-এর লগইন ব্যবহারকারী থেকে; worker-এ request নেই। তাই message-এ tenantId রেখে handler-এ filter চালু করে সেই id বসাতে হয়।'

flashcards:
  - q: 'Multi-tenancy কী?'
    a: 'একটাই সফটওয়্যার অনেক ক্রেতাকে (tenant) সেবা দেয়, আর প্রতিটা ক্রেতার ডেটা অন্যদের থেকে আলাদা থাকে।'
    more: |
      SaaS-এর মূল নকশা। এক কোড, এক deploy, অনেক কোম্পানি। কঠিন দিক হলো সবার ডেটা আলাদা রাখা আর কেউ যেন অন্যের সম্পদ খেয়ে না ফেলে।
    ref: one-forgotten-where
  - q: 'Tenant isolation-এর তিন স্তর কী কী?'
    a: 'Row-level (একই টেবিলে tenant_id), schema-per-tenant, আর database-per-tenant। আলাদা যত বেশি, নিরাপত্তা ও খরচ তত বেশি।'
    more: |
      মেসে বিছানা, বিল্ডিংয়ে ফ্ল্যাট, আলাদা বাড়ি — এই তুলনা। বেশিরভাগ SaaS row-level দিয়ে শুরু করে আর বড় বা কঠোর নিয়মের ক্রেতাদের জন্য আলাদা ডেটাবেস দেয়।
    ref: three-isolation-levels
  - q: 'Row-level tenancy-র সবচেয়ে বড় ঝুঁকি কী?'
    a: 'একটা query-তে `tenant_id` শর্ত ভুলে গেলেই সব tenant-এর ডেটা ফাঁস। হাতে মনে রাখার ওপর নির্ভর করা যায় না।'
    more: |
      তাই শর্তটা Doctrine filter বা ডেটাবেসের row-level security দিয়ে স্বয়ংক্রিয় করা হয়। যেখানে একজন মানুষের স্মৃতির ওপর নিরাপত্তা দাঁড়ায়, সেখানে একদিন ফাঁক হবেই।
    ref: one-forgotten-where
  - q: 'Doctrine SQL filter কী করে?'
    a: 'প্রতিটা DQL query-তে নিজে থেকে একটা SQL শর্ত (যেমন `tenant_id = 7`) জুড়ে দেয়, ডেভেলপারকে লিখতে না হয়।'
    more: |
      `SQLFilter`-এর `addFilterConstraint()` প্রতিটা entity-র জন্য ডাকা হয় এবং একটা SQL টুকরো ফেরত দেয়। request-এর শুরুতে `$em->getFilters()->enable('tenant')` দিয়ে চালু করে `setParameter` দিয়ে tenant বসাতে হয়।
    ref: doctrine-tenant-filter
  - q: 'Tenant-এর আইডি কোথা থেকে নেওয়া উচিত?'
    a: 'লগইন করা ব্যবহারকারীর যাচাই-করা তথ্য থেকে। কখনো request-এর query, body বা header থেকে নয়।'
    more: |
      ক্লায়েন্ট যা পাঠায় তা দাবি, প্রমাণ নয়। `?tenant=7` বদলে `8` করলেই অন্যের ডেটা চলে আসত। সার্ভার নিজে জানে ব্যবহারকারী কোন tenant-এর।
    ref: doctrine-tenant-filter
  - q: 'Noisy neighbour কী?'
    a: 'এক tenant এত বেশি সম্পদ (CPU, ডেটাবেস, request) খরচ করে যে বাকি tenant-রা ধীর হয়ে যায়।'
    more: |
      Row-level-এ সবাই একই ডেটাবেসে, তাই এই ঝুঁকি সবচেয়ে বেশি। ঠেকাতে per-tenant rate limit, আলাদা queue বা worker ভাগ আর ভারী query-তে timeout রাখা হয়।
    ref: noisy-neighbour
  - q: 'Rate limit-এর চাবি tenant রাখলে কী সুবিধা?'
    a: 'প্রতি tenant-এর আলাদা গণনা, তাই এক ক্রেতার অতিরিক্ত request অন্য ক্রেতার ভাগ কমায় না।'
    more: |
      Symfony RateLimiter-এ `$factory->create($tenantId)` দিলেই প্রতি tenant-এর আলাদা বালতি। বড় plan-এর ক্রেতাকে উঁচু limit দেওয়াও এভাবে সম্ভব।
    ref: noisy-neighbour
  - q: 'Doctrine filter কোথায় কাজ করে না?'
    a: 'Raw DBAL SQL, native query আর অনেক ক্ষেত্রে background worker বা console command, যেখানে request নেই।'
    more: |
      সেসব জায়গায় tenant হাতে বহন করতে হয়: message-এ tenantId রাখো, handler-এ filter চালু করো, raw SQL-এ `tenant_id = :t` লেখো, আর cache key ও unique index-এও tenant রাখো।
    ref: tenant-leak-paths

quiz:
  - q: 'একজন নতুন ডেভেলপার `exportAll()` query-তে tenant শর্ত ভুলে গেল। কোন ব্যবস্থা এই ভুল প্রায় অসম্ভব করে?'
    hint: 'ভুল ঠেকাতে মানুষের স্মৃতি, নাকি স্বয়ংক্রিয় ব্যবস্থা?'
    options:
      - text: 'কোড রিভিউয়ে সবাই যেন মনোযোগ দেয় — এই নিয়ম লেখা'
        correct: false
        why: 'ভুল হলো কিছু বাদ পড়া; রিভিউয়ে সেটা ধরা কঠিন। মানুষের মনোযোগ নির্ভরযোগ্য বাঁধ নয়।'
      - text: 'Doctrine SQL filter, যা প্রতিটা DQL query-তে tenant শর্ত নিজে জোড়ে'
        correct: true
        why: 'ডেভেলপারকে শর্ত লিখতে হয় না, তাই ভুলে যাওয়ারও কিছু নেই।'
      - text: 'প্রতি tenant-এর জন্য আলাদা repository class'
        correct: false
        why: 'ভুল করার জায়গা কমে না; নতুন query-তে আবার শর্ত ভুলতে পারে।'
      - text: 'Vue-তে অন্য tenant-এর row লুকানো'
        correct: false
        why: 'ডেটা ততক্ষণে ব্রাউজারে পৌঁছে গেছে।'
    ref: one-forgotten-where
  - q: 'কোন স্তরে tenant-এর সাথে tenant আলাদা করা সবচেয়ে মজবুত, কিন্তু সবচেয়ে দামি?'
    hint: 'পাশের ফ্ল্যাট নয়, আলাদা বাড়ি।'
    options:
      - text: 'Row-level'
        correct: false
        why: 'সবচেয়ে সস্তা কিন্তু সবচেয়ে বেশি ঝুঁকিপূর্ণ।'
      - text: 'Schema-per-tenant'
        correct: false
        why: 'মাঝামাঝি: ফ্ল্যাটের মতো আলাদা, তবু এক বিল্ডিং (এক ডেটাবেস)।'
      - text: 'Database-per-tenant'
        correct: true
        why: 'ভুল query-তেও অন্যের ডেটা ছোঁয়া যায় না, কিন্তু হাজার ডেটাবেস সামলানো ব্যয়বহুল।'
    ref: three-isolation-levels
  - q: 'নিচের filter-এর সমস্যা কী?'
    lang: php
    code: |
      public function addFilterConstraint(ClassMetadata $meta, string $alias): string
      {
          $tenant = $_GET['tenant'];

          return sprintf("%s.tenant_id = '%s'", $alias, $tenant);
      }
    hint: 'tenant কোথা থেকে আসছে, আর SQL-এ কীভাবে ঢুকছে?'
    options:
      - text: 'tenant আসছে ক্লায়েন্টের হাত থেকে, আবার SQL-এ সরাসরি বসছে — ফাঁস আর SQL injection দুটোই'
        correct: true
        why: '`?tenant=` বদলালেই অন্যের ডেটা, আর কোট ভেঙে SQL injection। `$this->getParameter()` ও লগইন ব্যবহারকারীর tenant ব্যবহার করতে হয়।'
      - text: 'কোনো সমস্যা নেই, filter তো লেখা আছে'
        correct: false
        why: 'filter থাকলেও তার ভেতরের মান বিশ্বাসযোগ্য নয়।'
      - text: 'শুধু `sprintf` ধীর'
        correct: false
        why: 'গতি নয়, নিরাপত্তাই মূল সমস্যা।'
    ref: doctrine-tenant-filter
  - q: 'নিচের কোন জায়গাগুলোতে Doctrine tenant filter নিজে থেকে নিরাপত্তা দেয় না?'
    hint: 'যেখানে ORM/DQL বা request-কেন্দ্রিক লগইন নেই।'
    options:
      - text: 'Raw DBAL SQL দিয়ে লেখা রিপোর্ট query'
        correct: true
        why: 'filter শুধু ORM query-তে জোড়ে; raw SQL সে দেখেই না।'
      - text: 'Messenger worker-এ চলা handler'
        correct: true
        why: 'request নেই বলে filter চালু হয়নি, যদি না handler-এ চালু করা হয়।'
      - text: 'controller-এ `findBy([...])` দিয়ে করা সাধারণ ORM query'
        correct: false
        why: 'এটা ORM query, filter চালু থাকলে খাটে।'
      - text: 'controller-এ `createQueryBuilder` দিয়ে ORM query'
        correct: false
        why: 'এটা ORM/DQL query, তাই filter চালু থাকলে নিজে থেকেই শর্ত জোড়ে।'
    ref: tenant-leak-paths
  - q: 'দুটো কোম্পানিতে `a@x.com` ইমেইলের দুইজন কর্মী আছে। কিন্তু `user.email`-এ unique index থাকায় দ্বিতীয়জন নিবন্ধন করতে পারছে না। সমাধান কী?'
    hint: 'অনন্যতা কোন সীমার মধ্যে?'
    options:
      - text: 'unique index বাদ দেওয়া'
        correct: false
        why: 'একই tenant-এ ইমেইল অনন্য হওয়া দরকার; পুরো বাদ দিলে ডুপ্লিকেট অ্যাকাউন্ট হবে।'
      - text: 'composite unique index `(tenant_id, email)`'
