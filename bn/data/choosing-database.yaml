  - q: 'একটা দোকানে পণ্যের ধরনভেদে attribute আলাদা (ফোনের RAM, জামার সাইজ)। বাকি সব ডেটা — order, customer, payment — জড়ানো। সবচেয়ে ভালো নকশা কোনটা?'
