  - q: 'একটা chat অ্যাপে প্রতি সেকেন্ডে ২ লাখ message লেখা হয়। পড়া হয় শুধু এক ভাবে: "এই conversation-এর শেষ ৫০টা message"। এক সার্ভারের relational ডেটাবেস লেখার চাপ নিতে পারছে না। কোন পরিবার সবচেয়ে মানানসই?'
