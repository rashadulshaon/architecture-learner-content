slides:
  - slug: popular-is-not-right
    title: 'জনপ্রিয় ডেটাবেস, ভুল কাজ'
    kind: story
    tldr: 'ডেটাবেস বাছতে হয় ডেটা কীভাবে লেখা ও খোঁজা হবে তা দেখে — কোনটা এখন জনপ্রিয়, তা দেখে নয়।'
    keywords: ['database choice', 'access pattern', 'MongoDB vs SQL', 'ডেটাবেস বাছাই', 'কোন ডেটাবেস']
    blocks:
      - type: text
        body: |
          রহিম নতুন ই-কমার্স প্রজেক্টে একটা document ডেটাবেস নিল, কারণ ইউটিউবে সবাই বলছিল "এটাই আধুনিক, schema লাগে না"। প্রথম মাসে কাজ দ্রুত এগোল। ছয় মাস পরে হিসাব বিভাগ চাইল জেলাভিত্তিক বিক্রির রিপোর্ট, আর payment-এ দরকার পড়ল order, stock আর wallet একসাথে বদলানো। এই দুই কাজ relational ডেটাবেসে এক লাইনের ব্যাপার; রহিমকে সেগুলো নিজের কোডে হাতে বানাতে হলো।
      - type: visual
        kind: compare
        caption: 'একই সিদ্ধান্ত: প্রথম মাসে যা মনে হয়েছিল, ছয় মাস পরে যা দাঁড়াল'
        columns:
          - title: 'প্রথম মাসে'
            tone: good
            icon: rocket
            tip: 'শুরুতে ডেটা কম, প্রশ্নও সহজ — তাই যেকোনো ডেটাবেসই ভালো লাগে। ভুল বাছাই তখন ধরা পড়ে না।'
            items:
              - 'টেবিল বানাতে হয় না, যা খুশি save করা যায়'
              - 'একটা order = একটা JSON, পড়া সহজ'
              - 'migration লেখার ঝামেলা নেই'
          - title: 'ছয় মাস পরে'
            tone: bad
            icon: warning
            tip: 'ডেটা পরস্পর জড়ানো ছিল (order, product, customer), আর প্রশ্নগুলো ছিল join-নির্ভর। এই কাজের জন্য ভুল ধরনের খাতা বাছা হয়েছিল।'
            items:
              - 'রিপোর্টের জন্য পাঁচটা collection কোডে হাতে মেলাতে হয়'
              - 'একই customer-এর নাম তিন জায়গায় তিন রকম'
              - 'order হলো, stock কমল না — মাঝপথে ভেঙেছিল'
              - 'পুরনো document-এ field নেই, কোডভর্তি if'
      - type: quote
        body: 'ডেটাবেস বাছা হয় access pattern দেখে, জনপ্রিয়তা দেখে নয়।'
    aside:
      - type: terms
        items:
          - {term: 'Access pattern', meaning: 'অ্যাপ ডেটা কীভাবে লিখবে আর কীভাবে খুঁজবে — তার তালিকা।'}
          - {term: 'Schema', meaning: 'ডেটার বাঁধা গঠন: কোন টেবিলে কোন কলাম, কোনটা বাধ্যতামূলক।'}
          - {term: 'Join', meaning: 'দুই টেবিলের row একটা মিল থাকা কলাম ধরে জোড়া লাগানো।'}
      - type: refs
        items:
          - {to: 'thinking/what-is-architectural', label: 'ডেটাবেস বাছাই কেন পিলারের মতো সিদ্ধান্ত'}
    check:
      q: 'রহিমের ভুলটা ঠিক কোথায় — document ডেটাবেস কি খারাপ জিনিস?'
      a: 'না, খারাপ নয়। ভুল ছিল বাছাইয়ের পদ্ধতিতে: তার ডেটা পরস্পর জড়ানো আর প্রশ্নগুলো join ও transaction-নির্ভর — এটা relational-এর কাজ। সে কাজ না দেখে জনপ্রিয়তা দেখে বেছেছিল।'

  - slug: six-kinds-of-databases
    title: 'ছয় ধরনের ডেটাবেস, ছয় রকম খাতা'
    kind: concept
    tldr: 'Relational, document, key-value, wide-column, graph, time-series — প্রতিটা একেক ধরনের প্রশ্নের জন্য বানানো।'
    keywords: ['relational', 'document', 'key-value', 'wide-column', 'graph', 'time-series', 'ডেটাবেসের ধরন', 'NoSQL']
    blocks:
      - type: metaphor
        icon: building
        title: 'হাসপাতালের ছয় রকম খাতা'
        body: |
          হাসপাতালে সব তথ্য এক রকম খাতায় থাকে না। ভর্তি আর বিলের হিসাব থাকে ছক কাটা রেজিস্টারে, প্রতিটা রোগীর কাগজপত্র থাকে তার নিজের ফাইলে, আর বেডের পাশের চার্টে ঘণ্টায় ঘণ্টায় জ্বর লেখা হয়। খাতার ধরন ঠিক হয় একটাই প্রশ্নে: **তথ্যটা পরে কীভাবে খোঁজা হবে?** ডেটাবেসের ছয় পরিবারও ঠিক এভাবে ভাগ হয়েছে।
      - type: visual
        kind: table
        caption: 'ছয় পরিবার: ডেটা দেখতে কেমন, কোন কাজে সেরা, আর বিনিময়ে কী ছাড়তে হয়'
        headers: ['ধরন (হাসপাতালের খাতা)', 'ডেটা দেখতে', 'কোন কাজে সেরা', 'যা ছাড়তে হয়', 'উদাহরণ']
        rows:
          - cells: ['Relational (বিলের রেজিস্টার)', 'জোড়া টেবিলের row', 'join, transaction, নতুন যেকোনো প্রশ্ন', 'বহু সার্ভারে লেখা ভাগ করা কঠিন', 'PostgreSQL, MySQL']
            tip: 'টেবিল, row আর কলাম; টেবিলগুলো ID দিয়ে যুক্ত। আগে থেকে না-ভাবা প্রশ্নও SQL দিয়ে করা যায়, তাই এটাই সবচেয়ে বহুমুখী। দাম: সব লেখা এক মূল সার্ভারে যায়, তাই তার সীমা ছাড়াতে বাড়তি কাজ লাগে।'
          - cells: ['Document (রোগীর ফাইল)', 'একেক জিনিসের একটা JSON', 'যা একসাথে পড়া-লেখা হয়', 'document-এর join, কোডে বানাতে হয়', 'MongoDB, Firestore']
            tip: 'একটা JSON document-এ একটা জিনিসের সব তথ্য। একেক document-এর গঠন একেক রকম হতে পারে; তবে document-এর মাঝে join আর একাধিক document-এর transaction দুর্বল।'
          - cells: ['Key-value (টোকেন কাউন্টার)', 'একটা key, একটা value', 'key দিয়ে অতি দ্রুত পড়া-লেখা', 'ভেতরের তথ্য ধরে খোঁজা বা ছাঁকা', 'Redis, Memcached']
            tip: 'শুধু key জানলে value মেলে — "সব লাল রিপোর্ট দিন" বলা যায় না। cache, session আর counter-এর জন্য আদর্শ।'
          - cells: ['Wide-column (দেশজোড়া টিকার খাতা)', 'partition key ধরে সাজানো row', 'বিশাল লেখার চাপ, জানা query', 'join আর আগে না-ভাবা প্রশ্ন', 'Cassandra, ScyllaDB']
            tip: 'ডেটা partition key ধরে অনেক সার্ভারে ছড়ানো থাকে। লেখা খুব দ্রুত, কিন্তু query আগে ঠিক করে সে অনুযায়ী টেবিল বানাতে হয়; join নেই।'
          - cells: ['Graph (সংস্পর্শের জাল)', 'edge দিয়ে জোড়া node', 'বহু ধাপের সম্পর্ক ধরে হাঁটা', 'সবকিছুর সস্তা যোগফল বা রিপোর্ট', 'Neo4j']
            tip: 'node আর edge দিয়ে গড়া। "বন্ধুর বন্ধুর বন্ধু" ধরনের বহু ধাপের প্রশ্ন SQL-এ গভীর join হয়ে যায়; এখানে সেটাই স্বাভাবিক কাজ।'
          - cells: ['Time-series (জ্বরের চার্ট)', 'একটা সময় আর একটা মাপ', 'সময়ের জানালা ধরে প্রশ্ন', 'পুরনো row বদলানো; সাধারণ কাজ', 'TimescaleDB, InfluxDB']
            tip: 'প্রতিটা row-তে একটা সময় আর একটা মাপ। ডেটা শুধু যোগ হয়, পুরনোটা বদলায় না; প্রশ্ন হয় সময়ের জানালা ধরে — "গত ১ ঘণ্টার গড়"।'
    aside:
      - type: remember
        body: 'খাতার ধরন ঠিক করে প্রশ্নের ধরন। আগে প্রশ্নগুলো লিখুন, তারপর খাতা বাছুন।'
      - type: tips
        items:
          - 'পরিবারের সীমানা শক্ত নয়: PostgreSQL-এ JSON কলাম আছে, Redis-এ list আর sorted set আছে, DynamoDB key-value আর wide-column-এর মাঝামাঝি।'
          - 'Search engine (Elasticsearch) আরেকটা আলাদা পরিবার — সেটা আছে [[caching/search-basics|search-এর অংশে]]।'
    check:
      q: 'প্রতি সেকেন্ডে আসা সার্ভারের CPU-র মাপ, আর "কে কাকে follow করে" — কোনটা কোন পরিবারের কাজ?'
      a: 'CPU-র মাপ সময় ধরে আসে আর শুধু যোগ হয় — time-series। follow-এর জাল হলো সম্পর্ক ধরে হাঁটা — graph (ছোট আকারে relational-এই দিব্যি চলে)।'

  - slug: write-access-patterns-first
    title: 'আগে access pattern লিখুন'
    kind: howto
    tldr: 'এক পাতায় লিখুন অ্যাপ ডেটা নিয়ে কী কী করবে, কত ঘন ঘন, কী নিশ্চয়তাসহ — ডেটাবেসের নাম তারপর নিজেই বেরিয়ে আসে।'
    keywords: ['access pattern', 'workload', 'read heavy', 'write heavy', 'কাজের তালিকা', 'ডেটাবেস সিদ্ধান্ত']
    blocks:
      - type: text
        body: |
          ডেটাবেসের নাম ভাবার আগে এক পাতায় লিখুন, অ্যাপটা ডেটা নিয়ে আসলে কী কী করবে। প্রতিটা কাজের পাশে তিনটা তথ্য: কাজটা কী, কত ঘন ঘন হবে, আর ডেটাবেসের কাছে কী চাই। নিচে একটা ই-কমার্স অ্যাপের পাতা ভরা আছে — দেখুন, বেশিরভাগ লাইন একই দিকে ইশারা করছে।
      - type: code
        lang: text
        file: 'docs/access-patterns.md'
        code: |
          কাজ ১  অর্ডার তৈরি: order + stock + payment একসাথে বদলায়
                 50/সেকেন্ড    চাই: transaction, constraint
          কাজ ২  "আমার অর্ডার" তালিকা, নতুনটা আগে
                 300/সেকেন্ড   চাই: customer_id দিয়ে খোঁজা, সাজানো ফল
          কাজ ৩  জেলাভিত্তিক মাসিক বিক্রির রিপোর্ট
                 দিনে 20 বার   চাই: join + GROUP BY
          কাজ ৪  পণ্যের নাম দিয়ে খোঁজা
                 200/সেকেন্ড   চাই: full-text search
          কাজ ৫  লগইন session
                 1000/সেকেন্ড  চাই: key দিয়ে পড়া, মেয়াদ (TTL)

          সিদ্ধান্ত
          কাজ ১-৩  ->  PostgreSQL (মূল ডেটা, source of truth)
          কাজ ৪    ->  আপাতত PostgreSQL full-text; মেপে ধীর পেলে search engine
          কাজ ৫    ->  Redis (key-value)
        marks:
          - {line: 2, tip: 'একসাথে তিন জায়গা বদলানো আর নিয়ম মানানো — এই এক লাইনই বলে দেয় মূল ডেটাবেস relational হতে হবে।'}
          - {line: 6, tip: 'রিপোর্টের প্রশ্ন আগে থেকে জানা থাকে না, বদলাতেই থাকে। যেকোনো প্রশ্ন করার স্বাধীনতা দেয় SQL।'}
          - {line: 14, tip: 'নতুন ডেটাবেস আনার আগে বর্তমানটা দিয়ে চেষ্টা। ধীর হয়েছে — এটা মেপে দেখার পরেই পরের ধাপ।'}
      - type: visual
        kind: steps
        caption: 'পাতা থেকে সিদ্ধান্ত — চার ধাপ'
        steps:
          - {title: '১. কাজগুলো লিখুন', body: 'অ্যাপের প্রধান ৫ থেকে ১০টা পড়া ও লেখার কাজ, সাধারণ ভাষায়।', tip: 'সব কাজ নয় — যেগুলো সবচেয়ে ঘন ঘন হয় বা যেগুলো ভুল হলে সবচেয়ে ক্ষতি, শুধু সেগুলো।'}
          - {title: '২. চাহিদা লিখুন', body: 'প্রতিটার পাশে: কত ঘন ঘন, আর কী চাই — transaction, join, key দিয়ে পড়া, TTL।', tip: 'সঠিক সংখ্যা জানা না থাকলে আন্দাজ লিখুন; ১০ নাকি ১০ হাজার — এই মাত্রাটুকু জানাই যথেষ্ট।'}
          - {title: '৩. মূল ডেটাবেস ঠিক করুন', body: 'বেশিরভাগ কাজ যেদিকে ইশারা করে, সেটাই source of truth।', tone: accent, tip: 'প্রায় সব ব্যবসায়িক অ্যাপে এই ধাপের উত্তর relational — কারণ ডেটা জড়ানো আর টাকার হিসাবে transaction লাগে।'}
          - {title: '৪. বেমানানগুলো আলাদা করুন', body: 'যে কাজ মূল ডেটাবেসে মানায় না, শুধু সেটার জন্য দ্বিতীয় কিছু ভাবুন।', tip: 'session বা cache-এর মতো অস্থায়ী, key-নির্ভর কাজ সাধারণত প্রথম বেমানান কাজ — তাই Redis প্রায়ই দ্বিতীয় ডেটাবেস।'}
    aside:
      - type: tips
        items:
          - 'সংখ্যাগুলো কীভাবে আন্দাজ করবেন তা আছে [[thinking/estimation|খাতার পাতায় হিসাব]] অংশে।'
          - 'এই পাতাটাই পরে design doc-এ "কেন এই ডেটাবেস" প্রশ্নের প্রমাণ হয়ে থাকে।'
      - type: terms
        items:
          - {term: 'Source of truth', meaning: 'যে ডেটাবেসের ডেটাকে চূড়ান্ত সত্য ধরা হয়; বাকি সব জায়গার ডেটা তার কপি।'}
          - {term: 'TTL', meaning: 'Time to live — কতক্ষণ পরে ডেটাটা নিজে থেকেই মুছে যাবে।'}
    check:
      q: 'Access pattern-এর পাতায় প্রতিটা কাজের পাশে কোন তিনটা তথ্য লিখবেন?'
      a: 'কাজটা কী (কোন key বা শর্তে পড়া বা লেখা), কত ঘন ঘন হবে, আর ডেটাবেসের কাছে কী চাই — যেমন transaction, join, সাজানো ফল বা TTL।'

  - slug: relational-by-default
    title: 'সন্দেহ হলে relational'
    kind: howto
    tldr: 'বেশিরভাগ ব্যবসার ডেটা জড়ানো, তাই default হলো PostgreSQL বা MySQL; গঠন-ছাড়া অংশটুকু JSON কলামে রাখা যায়।'
    keywords: ['PostgreSQL', 'MySQL', 'JSONB', 'default database', 'JSON কলাম', 'relational ডেটাবেস']
    blocks:
      - type: text
        body: |
          বেশিরভাগ ব্যবসার ডেটা পরস্পর জড়ানো: customer-এর order, order-এর payment। Relational ডেটাবেস এই জড়ানো ডেটার জন্য তিনটা জিনিস তৈরি অবস্থায় দেয় — transaction, constraint আর যেকোনো প্রশ্নের জন্য SQL। আর "কিছু ডেটার গঠন ঠিক নেই" বলে আলাদা document ডেটাবেস লাগে না; PostgreSQL আর MySQL দুটোতেই JSON কলাম আছে।
      - type: code
        lang: php
        file: 'src/Entity/Product.php'
        variant: good
        code: |
          #[ORM\Entity]
          class Product
          {
              #[ORM\Id, ORM\GeneratedValue, ORM\Column]
              private ?int $id = null;

              #[ORM\Column(length: 180)]
              private string $name;

              #[ORM\Column]
              private int $priceInPoisha;      // সব পণ্যেরই থাকে: শক্ত কলাম

              /** @var array<string, scalar> ফোনের RAM, জামার সাইজ — পণ্যভেদে আলাদা */
              #[ORM\Column(type: Types::JSONB)]
              private array $attributes = [];
          }
        marks:
          - {line: 11, tip: 'যে তথ্য সব row-তে থাকে আর যার ওপর হিসাব বা নিয়ম চলে, সেটা সবসময় সাধারণ কলাম — NOT NULL আর সঠিক type সহ।'}
          - {line: 14, tip: 'PostgreSQL-এ এটা JSONB কলাম হয়; MySQL-এ নিজে থেকেই JSON। DBAL 4.3-এর আগে লিখতে হতো Types::JSON সাথে options: jsonb => true।'}
      - type: code
        lang: sql
        file: 'JSON-এর ভেতরে খোঁজা (PostgreSQL)'
        code: |
          -- JSON কলামেও index বসে
          CREATE INDEX idx_product_attributes ON product USING GIN (attributes);

          -- যেসব পণ্যের RAM 8GB
          SELECT id, name FROM product
          WHERE attributes @> '{"ram_gb": 8}';
        marks:
          - {line: 2, tip: 'GIN index JSON-এর ভেতরের key আর value ধরে খোঁজা দ্রুত করে — document ডেটাবেসের মূল সুবিধাটা এখানেই পাওয়া গেল।'}
      - type: quote
        body: 'সন্দেহ হলে relational দিয়ে শুরু করুন। অন্য ডেটাবেস আনুন তখনই, যখন মাপা যায় এমন কষ্ট দেখা দেয়।'
    aside:
      - type: when
        use:
          - 'ডেটা পরস্পর জড়ানো, আর ভবিষ্যতের প্রশ্নগুলো এখনো পুরো জানা নেই'
          - 'টাকা, stock, booking — যেখানে transaction আর constraint ছাড়া চলে না'
        avoid:
          - 'প্রতি সেকেন্ডে লাখ লাখ লেখা, যা এক সার্ভারে ধরে না'
          - 'শুধু key দিয়ে পড়া অস্থায়ী ডেটা — cache, session'
      - type: refs
        items:
          - {to: 'concurrency/acid', label: 'Transaction আসলে কী দেয়'}
          - {to: 'data/schema-design', label: 'টেবিল কীভাবে সাজাবেন'}
    check:
      q: 'পণ্যভেদে আলাদা attribute রাখতে হবে — শুধু এই কারণে কি document ডেটাবেস নিতে হবে?'
      a: 'না। relational ডেটাবেসেই একটা JSON কলামে সেগুলো রাখা যায়, index-ও বসে। নাম আর দামের মতো স্থির তথ্য থাকবে সাধারণ কলামে, constraint সহ।'

  - slug: second-database-cost
    title: 'দ্বিতীয় ডেটাবেস: কখন আনবেন, দাম কত'
    kind: pitfall
    tldr: 'প্রতিটা নতুন ডেটাবেস মানে নতুন backup, monitoring আর sync-এর দায়; মূল সত্য থাকবে এক জায়গায়, বাকিরা তার কপি।'
    keywords: ['polyglot persistence', 'source of truth', 'derived data', 'dual write', 'দ্বিতীয় ডেটাবেস', 'খরচ']
    blocks:
      - type: text
        body: |
          নতুন ডেটাবেস যোগ করা মানে শুধু একটা library বসানো নয়। তার আলাদা backup, monitoring, upgrade আর রাত তিনটার সমস্যা — সবই আপনার দলের ঘাড়ে পড়ে। সবচেয়ে কঠিন অংশ: একই তথ্য এখন দুই জায়গায়, আর দুটোকে মিলিয়ে রাখার দায় আপনার। তাই নিয়ম হলো — মূল সত্য থাকবে **এক** জায়গায়, বাকিরা তার কপি, যা মুছে আবার বানানো যায়।
      - type: visual
        kind: flow
        caption: 'এক source of truth, বাকিরা তার কপি'
        nodes:
          - {id: app, label: 'Symfony অ্যাপ', icon: api, col: 0, row: 1, tip: 'অ্যাপ সব স্থায়ী লেখা শুধু এক জায়গায় পাঠায় — কখনো দুই ডেটাবেসে পাশাপাশি "মূল" কপি লেখে না।'}
          - {id: pg, label: 'PostgreSQL', sub: 'source of truth', icon: db, tone: accent, col: 2, row: 1, tip: 'অর্ডার, টাকা, ব্যবহারকারী — চূড়ান্ত সত্য এখানে। অন্য কোথাও ভিন্ন কিছু দেখালে এটাকেই ঠিক ধরা হয়।'}
          - {id: redis, label: 'Redis', sub: 'cache ও session', icon: cache, col: 2, row: 0, tip: 'বারবার লাগে এমন উত্তর আর session, মেয়াদসহ। পুরোটা মুছে গেলেও কিছু হারায় না — শুধু কিছুক্ষণ ধীর লাগে।'}
          - {id: worker, label: 'Messenger worker', icon: worker, col: 3, row: 2, tip: 'মূল ডেটাবেসের বদলগুলো পেছনে বসে অন্য জায়গায় কপি করে; ব্যর্থ হলে আবার চেষ্টা করে।'}
          - {id: search, label: 'Search index', sub: 'খোঁজার কপি', icon: search, col: 4, row: 1, tip: 'পণ্যের নাম দিয়ে দ্রুত খোঁজার জন্য আলাদা করে সাজানো কপি। কয়েক সেকেন্ড পিছিয়ে থাকতে পারে।'}
        edges:
          - {from: app, to: pg, label: 'প্রতিটা লেখা আগে PostgreSQL-এ যায় — এটাই মূল সত্য'}
          - {from: app, to: redis, label: 'বারবার পড়া উত্তর আর session রাখে Redis-এ, মেয়াদসহ'}
          - {from: pg, to: worker, label: 'বদলের খবর message হয়ে worker-এর কাছে যায়', dashed: true}
          - {from: worker, to: search, label: 'worker সেই বদল search index-এ কপি করে'}
          - {from: pg, to: search, label: 'index হারালে PostgreSQL থেকে পুরোটা আবার বানানো যায়', tone: good}
      - type: points
        title: 'আনার আগে তিন প্রশ্ন'
        style: check
        items:
          - 'কষ্টটা কি মাপা হয়েছে — কোন query, কত ধীর, কত ঘন ঘন?'
          - 'বর্তমান ডেটাবেসেই index, cache বা extension দিয়ে কি মেটানো যায় না?'
          - 'নতুনটার ডেটা হারালে মূল ডেটাবেস থেকে আবার বানানো যাবে তো?'
    aside:
      - type: pitfalls
        items:
          - 'CV ভারী করতে ছোট অ্যাপে পাঁচটা ডেটাবেস: প্রতিটাই আরেকটা জায়গা, যেখানে সিস্টেম ভাঙতে পারে।'
          - 'দুই ডেটাবেসে পরপর আলাদা করে লেখা (dual write): একটা সফল আর অন্যটা ব্যর্থ হলে দুই জায়গায় দুই সত্য।'
      - type: refs
        items:
          - {to: 'workflows/outbox-inbox', label: 'দুই জায়গায় নিরাপদে লেখা: outbox'}
          - {to: 'thinking/build-vs-buy', label: 'প্রতিটা নতুন প্রযুক্তির দাম'}
    check:
      q: 'Search-এর জন্য আলাদা search engine যোগ করলে অর্ডারের মূল সত্য কোথায় থাকবে, আর search index-টা তখন কী?'
      a: 'মূল সত্য PostgreSQL-এই থাকবে। search index তার একটা কপি (derived data) — নষ্ট হলে মুছে মূল ডেটাবেস থেকে আবার বানানো যায়।'

  - slug: one-order-six-shapes
    title: 'একই অর্ডার, ছয় আকৃতিতে'
    kind: concept
    tldr: 'একটা অর্ডার প্রতিটা পরিবারে আলাদা আকৃতি পায়; আকৃতিই ঠিক করে কোন প্রশ্ন এক লাইনের আর কোনটা অসম্ভব।'
    keywords: ['data model', 'ডেটার আকৃতি', 'document vs relational', 'key-value', 'wide-column', 'graph', 'time-series']
    blocks:
      - type: text
        body: |
          ১০০১ নম্বর একটা অর্ডার ধরুন: নাদিয়া ১২৫০ টাকায় P55 পণ্যের ২টা কিনেছেন। প্রতিটা পরিবার এটা নিজের আকৃতিতে লেখে, আর সেই আকৃতিই ঠিক করে কোন প্রশ্ন সহজ আর কোনটা যন্ত্রণার। প্রতিটা আকৃতির নিচের "easy" আর "gives up" লাইন দুটো পড়ুন।
      - type: code
        lang: text
        file: 'প্রতিটা পরিবারে ১০০১ নম্বর অর্ডার'
        code: |
          RELATIONAL: জোড়া টেবিলের row
            orders       id=1001  customer_id=7  total=1250
            order_items  order_id=1001  product_id=55  qty=2
            easy: জেলাভিত্তিক বিক্রি (join + GROUP BY)
            gives up: বহু সার্ভারে লেখা সহজে ভাগ করা
          DOCUMENT: পুরো অর্ডার একটা JSON-এ
            orders/1001 = {"customer": "Nadia", "items": [{"sku": "P55", "qty": 2}], "total": 1250}
            easy: একবার পড়েই পুরো অর্ডার দেখানো
            gives up: আজকের পণ্যদামের সাথে join
          KEY-VALUE: একটা key, একটা অস্পষ্ট value
            order:1001 = <bytes>
            easy: GET order:1001
            gives up: "customer 7-এর সব অর্ডার"
          WIDE-COLUMN: partition key ধরে সাজানো row
            orders_by_customer  PARTITION KEY (customer_id)  SORTED BY created_at
              (7, 2025-01-05, 1001, 1250)
            easy: customer 7-এর সাম্প্রতিক অর্ডার
            gives up: "জেলা ধরে অর্ডার" (আরেকটা কপি-টেবিল লাগে)
          GRAPH: node আর edge
            (Nadia)-[:PLACED]->(Order 1001)-[:CONTAINS]->(Product P55)
            easy: "নাদিয়ার মতো লোকেরা আর কী কিনেছে"
            gives up: সব total-এর সস্তা যোগফল
          TIME-SERIES: একটা সময় আর একটা মাপ
            cpu_load  time=10:00:01  server=web1  value=0.42
            easy: web1-এর গত ১ ঘণ্টার গড়
            gives up: গত সপ্তাহের row বদলানো
        marks:
          - {line: 3, tip: 'customer আর item আলাদা টেবিলে থাকে; আপনি জিজ্ঞেস করলে ডেটাবেস সেগুলো join করে। এই join-ই পরে যেকোনো প্রশ্ন করা সম্ভব করে।'}
          - {line: 7, tip: 'অর্ডারের সবকিছু এক জায়গায়, তাই একবার পড়লেই সব আসে। কিন্তু "P55-এর আজকের দাম" থাকে অন্য জায়গায়; সেটা এনে কোডে জুড়তে হয়।'}
          - {line: 14, tip: 'ঢোকার একমাত্র পথ key। "customer 7-এর অর্ডার"-এর জন্য key আগে না বানানো থাকলে সবকিছু স্ক্যান করা ছাড়া উপায় নেই।'}
    aside:
      - type: remember
        body: 'আগে আকৃতি দেখুন: প্রতিটা পরিবার সেই প্রশ্নে সহজ, যার জন্য তার আকৃতি বানানো; বাকিগুলোতে কষ্ট।'
    check:
      q: 'আপনার অ্যাপকে উত্তর দিতে হবে "এই মাসে ঢাকায় দেওয়া সব অর্ডার"। উপরের ছয় আকৃতির কোনটায় এটা এক লাইনের প্রশ্ন?'
      a: 'Relational-এ: একটা join আর GROUP BY। Key-value value-র ভেতরে খুঁজতেই পারে না, আর wide-column-এ জেলা-ধরা key দিয়ে ডেটার দ্বিতীয় কপি রাখতে হয়।'


flashcards:
  - q: 'Access pattern কী?'
    a: 'অ্যাপ ডেটা কীভাবে লিখবে ও খুঁজবে তার তালিকা — কোন key বা শর্তে, কত ঘন ঘন, আর কী নিশ্চয়তাসহ।'
    more: |
      ডেটাবেস বাছার আসল মাপকাঠি এটাই। "অর্ডার তৈরি: তিন টেবিল একসাথে বদলায়, ৫০/সেকেন্ড" — এমন পাঁচ-দশটা লাইন লিখলেই বোঝা যায় কোন পরিবারের ডেটাবেস লাগবে। জনপ্রিয়তা বা বড় কোম্পানির পছন্দ এই প্রশ্নের উত্তর দেয় না।
    ref: write-access-patterns-first
  - q: 'নতুন প্রজেক্টে কোন ধরনের ডেটাবেস default হওয়া উচিত, আর কেন?'
    a: 'Relational (PostgreSQL বা MySQL)। জড়ানো ডেটার জন্য transaction, constraint আর যেকোনো প্রশ্নের SQL — সবই তৈরি পাওয়া যায়।'
    more: |
      ব্যবসার ডেটা প্রায় সবসময় পরস্পর জড়ানো, আর ভবিষ্যতে কোন প্রশ্ন আসবে তা শুরুতে জানা থাকে না। Relational ডেটাবেস এই অনিশ্চয়তায় সবচেয়ে কম ঝুঁকির পছন্দ। গঠন-ছাড়া ডেটার জন্যও আলাদা কিছু লাগে না — JSON কলাম আছে।
    ref: relational-by-default
  - q: 'Key-value ডেটাবেস কোন কাজে সেরা, আর কী পারে না?'
    a: 'key জানা থাকলে অতি দ্রুত পড়া-লেখা: cache, session, counter। value-র ভেতরের তথ্য দিয়ে খোঁজা বা join পারে না।'
    more: |
      হাসপাতালের টোকেন কাউন্টারের মতো: টোকেন নম্বর বললে সাথে সাথে রিপোর্ট দেয়, কিন্তু "সব ডায়াবেটিস রোগীর রিপোর্ট দিন" বললে পারে না। Redis আর Memcached এই পরিবারের। মূল ব্যবসায়িক ডেটা এখানে রাখা হয় না; রাখা হয় অস্থায়ী বা আবার বানানো যায় এমন ডেটা।
    ref: six-kinds-of-databases
  - q: 'Document ডেটাবেস কখন মানানসই?'
    a: 'যখন একটা জিনিসের সব তথ্য একসাথে পড়া-লেখা হয়, গঠন জিনিসভেদে আলাদা, আর document-এর মাঝে join প্রায় লাগে না।'
    more: |
      যেমন CMS-এর একটা পাতা বা একটা পণ্যের ক্যাটালগ এন্ট্রি — পুরোটা একবারে আসে, একবারে যায়। কিন্তু ডেটা যদি জড়ানো হয় (order, customer, payment) আর রিপোর্টে join লাগে, তখন document ডেটাবেসে সেই join নিজের কোডে বানাতে হয়।
    ref: six-kinds-of-databases
  - q: 'Wide-column ডেটাবেস (যেমন Cassandra) কী দেয়, আর বিনিময়ে কী নেয়?'
    a: 'দেয়: অনেক সার্ভারে ছড়ানো বিশাল লেখার ক্ষমতা। নেয়: join আর ইচ্ছামতো query — query আগে ঠিক করে সে অনুযায়ী টেবিল বানাতে হয়।'
    more: |
      ডেটা একটা partition key ধরে সার্ভারগুলোতে ভাগ হয়, তাই লেখা প্রায় সীমাহীনভাবে বাড়ানো যায়। কিন্তু খোঁজা যায় মূলত সেই key ধরেই। chat message, event log, sensor ডেটার মতো বিশাল ও জানা-query-র কাজে মানায়; সাধারণ ব্যবসায়িক অ্যাপে এটা বাড়তি বোঝা।
    ref: six-kinds-of-databases
  - q: 'Cassandra-য় customer_id ধরে অর্ডার রাখা হয়েছে। এক জেলার সব অর্ডার কি সরাসরি পাওয়া যায়?'
    a: 'সরাসরি না। টেবিল যে key-র জন্য বানানো, শুধু সেই key ধরেই খোঁজা যায়; তাই জেলা-ধরা আরেকটা টেবিল (কপি) রাখতে হয়।'
    more: |
      Wide-column-এর দাম এটাই: query আগে ঠিক হয়, প্রতিটার জন্য ডেটার আলাদা কপি থাকে, আর প্রতিটা লেখায় সব কপি হালনাগাদ করতে হয়। Relational-এ একই প্রশ্ন একটা join আর GROUP BY — প্রশ্ন যখন আগে জানা নেই, তখন সেটাই নিরাপদ default।
    ref: one-order-six-shapes
  - q: 'Time-series ডেটার তিনটা বৈশিষ্ট্য কী?'
    a: 'প্রতিটা row একটা সময় ও একটা মাপ; ডেটা শুধু যোগ হয়, পুরনোটা বদলায় না; প্রশ্ন হয় সময়ের জানালা ধরে।'
    more: |
      সার্ভারের CPU, sensor-এর তাপমাত্রা, শেয়ারের দাম — সবই এই ধরনের। Time-series ডেটাবেস এগুলো সময় অনুযায়ী ভাগ করে রাখে, পুরনো ডেটা সংকুচিত করে আর মেয়াদ শেষে মুছে ফেলে। TimescaleDB হলো PostgreSQL-এরই একটা extension, তাই আলাদা ডেটাবেস না এনেও শুরু করা যায়।
    ref: six-kinds-of-databases
  - q: 'Graph ডেটাবেস কখন দরকার পড়ে?'
    a: 'যখন মূল প্রশ্নগুলো বহু ধাপের সম্পর্ক নিয়ে — বন্ধুর বন্ধু, জালিয়াতির চক্র, সুপারিশ — আর SQL-এ তা গভীর join হয়ে যায়।'
    more: |
      Graph ডেটাবেস node আর edge সরাসরি জমা রাখে, তাই এক node থেকে পাশের node-এ যাওয়া সস্তা। এক-দুই ধাপের সম্পর্ক (customer-এর order) relational-এই ভালো চলে। সম্পর্কের গভীরতা যখন অজানা বা অনেক, তখনই graph-এর কথা ভাবুন।
    ref: six-kinds-of-databases
  - q: 'দ্বিতীয় একটা ডেটাবেস যোগ করার লুকানো খরচ কী?'
    a: 'আলাদা backup, monitoring, upgrade ও দক্ষতা — আর একই তথ্য দুই জায়গায় মিলিয়ে রাখার দায়।'
    more: |
      কেনার দাম শূন্য হলেও চালানোর দাম শূন্য নয়। প্রতিটা নতুন ডেটাবেস আরেকটা জায়গা, যেখানে সিস্টেম ভাঙতে পারে আর ডেটা অমিল হতে পারে। তাই আগে দেখুন বর্তমান ডেটাবেসে index, cache বা extension দিয়ে কাজটা হয় কি না।
    ref: second-database-cost
  - q: 'Source of truth আর derived data-র পার্থক্য কী?'
    a: 'Source of truth-এর ডেটাই চূড়ান্ত সত্য। Derived data (cache, search index) তার কপি — হারালে মূল থেকে আবার বানানো যায়।'
    more: |
      একই তথ্য একাধিক জায়গায় থাকলে ঠিক করে রাখতে হয় কোনটা আসল। লেখা সবসময় আগে আসলটায় যায়, কপিগুলো পরে হালনাগাদ হয়। দুই জায়গাকেই "আসল" ধরলে কোনো এক দিন দুটোতে দুই রকম তথ্য দেখা দেবে, আর কোনটা ঠিক তা কেউ বলতে পারবে না।
    ref: second-database-cost

quiz:
  - q: 'করিমের টিম একটা স্কুল ম্যানেজমেন্ট অ্যাপ বানাবে: ছাত্র, ক্লাস, ফি আর রেজাল্ট। কোন প্রশ্ন ভবিষ্যতে আসবে তা এখনো পরিষ্কার নয়। কোন ডেটাবেস দিয়ে শুরু করা উচিত?'
    hint: 'ছাত্র, ক্লাস আর ফি — এগুলো কি আলাদা আলাদা, নাকি একটা আরেকটার সাথে জড়ানো?'
    options:
      - text: 'Document ডেটাবেস — schema বারবার বদলাবে, তাই বাঁধা টেবিল ঝামেলা'
        correct: false
        why: 'schema বদল relational-এ migration দিয়ে সহজেই হয়। কিন্তু জড়ানো ডেটার join আর ফি-র transaction document ডেটাবেসে হাতে বানাতে হবে।'
      - text: 'Relational ডেটাবেস — ডেটা জড়ানো, আর প্রশ্ন আগে থেকে জানা নেই'
        correct: true
        why: 'জড়ানো ডেটা, টাকার হিসাব আর অজানা ভবিষ্যৎ প্রশ্ন — তিনটাই relational-এর শক্তির জায়গা।'
      - text: 'Wide-column ডেটাবেস — পরে ব্যবহারকারী বাড়লে scale করা সহজ হবে'
        correct: false
        why: 'একটা স্কুলের ডেটা এক সার্ভারেই বহু বছর ধরবে। না-আসা সমস্যার জন্য join আর ইচ্ছামতো query ছেড়ে দেওয়া খারাপ বিনিময়।'
      - text: 'Graph ডেটাবেস — ছাত্র আর ক্লাসের মাঝে তো সম্পর্ক আছে'
        correct: false
        why: 'এক-দুই ধাপের সম্পর্ক relational-এর foreign key দিয়েই হয়। graph লাগে বহু ধাপ গভীর সম্পর্কের প্রশ্নে।'
    ref: relational-by-default
  - q: 'নিচের কোন কাজগুলোর জন্য key-value store (যেমন Redis) মানানসই?'
    hint: 'কোন কাজগুলোতে key আগে থেকেই জানা, আর ডেটা হারালে আবার বানানো যায়?'
    options:
      - text: 'লগইন করা ব্যবহারকারীর session'
        correct: true
        why: 'session ID হলো key, পড়া-লেখা খুব ঘন ঘন, আর মেয়াদ (TTL) লাগে — key-value-র আদর্শ কাজ।'
      - text: 'প্রতি মিনিটে কে কতটা request করল তার counter'
        correct: true
        why: 'key ধরে দ্রুত বাড়ানো আর নিজে থেকে মেয়াদ শেষ হওয়া — rate limit counter-এর ঠিক এটাই দরকার।'
      - text: 'জেলাভিত্তিক মাসিক বিক্রির রিপোর্ট'
        correct: false
        why: 'এতে অনেক row ঘেঁটে join আর GROUP BY লাগে। key-value store value-র ভেতরে খুঁজতেই পারে না।'
      - text: 'হিসাব করে বানানো পণ্যের পাতার cache'
        correct: true
        why: 'পণ্যের ID দিয়ে পড়া হয়, আর হারালে মূল ডেটাবেস থেকে আবার বানানো যায়।'
      - text: 'অর্ডার আর payment-এর মূল রেকর্ড'
        correct: false
        why: 'এগুলো source of truth — transaction, constraint আর নানা রকম প্রশ্ন লাগে, যা key-value store দেয় না।'
    ref: six-kinds-of-databases
  - q: 'একটা কারখানায় ৫ হাজার sensor প্রতি ১০ সেকেন্ডে তাপমাত্রা পাঠায়। ড্যাশবোর্ডে দেখাতে হবে "গত ২৪ ঘণ্টায় প্রতি ঘণ্টার গড়"। এই ডেটার জন্য কোন পরিবার সবচেয়ে মানানসই?'
    hint: 'ডেটা কি বদলায়, নাকি শুধু যোগ হয়? আর প্রশ্নটা কীসের জানালা ধরে?'
    options:
      - text: 'Graph ডেটাবেস'
        correct: false
        why: 'এখানে সম্পর্ক ধরে হাঁটার কিছু নেই; আছে সময় ধরে আসা মাপ।'
      - text: 'Key-value store'
        correct: false
        why: 'শুধু key দিয়ে পড়া যায়; "গত ২৪ ঘণ্টার ঘণ্টাপ্রতি গড়"-এর মতো সময়ের জানালার হিসাব এর কাজ নয়।'
      - text: 'Time-series ডেটাবেস'
        correct: true
        why: 'সময় আর মাপ, শুধু যোগ হয়, প্রশ্ন সময়ের জানালা ধরে — time-series-এর সংজ্ঞাই এটা। TimescaleDB দিয়ে PostgreSQL-এর ভেতরেই শুরু করা যায়।'
      - text: 'Document ডেটাবেস'
        correct: false
        why: 'রাখা যাবে, কিন্তু সময় অনুযায়ী ভাগ, সংকোচন আর পুরনো ডেটা মোছার সুবিধা নিজে বানাতে হবে।'
    ref: six-kinds-of-databases
  - q: 'একটা টিম অর্ডারকে দুই ডেটাবেসেই "মূল" কপি হিসেবে রাখছে। এই কোডের সবচেয়ে বড় সমস্যা কী?'
    lang: php
    code: |
      $em->persist($order);
      $em->flush();                                   // PostgreSQL

      $this->mongo
          ->selectCollection('shop', 'orders')
          ->insertOne($order->toArray());             // MongoDB
    hint: 'প্রথম লেখাটা সফল হওয়ার পর দ্বিতীয়টার আগে সার্ভার বন্ধ হয়ে গেলে কী হবে?'
    options:
      - text: 'flush() ধীর, তাই MongoDB-তে আগে লেখা উচিত'
        correct: false
        why: 'ক্রম উল্টালেও একই বিপদ: একটা সফল আর অন্যটা ব্যর্থ হতে পারে। সমস্যা ক্রমে নয়, দুই জায়গায় আলাদা করে লেখায়।'
      - text: 'দ্বিতীয় লেখা ব্যর্থ হলে দুই ডেটাবেসে দুই রকম সত্য থাকবে, আর কোনটা ঠিক তা জানার উপায় নেই'
        correct: true
        why: 'এটা dual write। দুই লেখাকে এক transaction-এ বাঁধা যায় না, আর source of truth ঠিক করা নেই বলে অমিল হলে মীমাংসাও করা যায় না।'
      - text: 'কোনো সমস্যা নেই — দুই জায়গায় থাকলে ডেটা বেশি নিরাপদ'
        correct: false
        why: 'নিরাপত্তা আসে backup আর replication থেকে। দুই "মূল" কপি বরং অমিলের ঝুঁকি তৈরি করে।'
