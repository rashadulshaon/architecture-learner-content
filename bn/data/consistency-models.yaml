  - q: 'কোন কোন পরিস্থিতিতে causal ক্রম ভাঙার সম্ভাবনা বেশি, আর কীভাবে সামলাবে?'
    hint: 'যেখানে সম্পর্কিত ডেটা আলাদা পথে ছড়ায়।'
