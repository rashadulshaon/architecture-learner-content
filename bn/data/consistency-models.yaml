      - type: code
        lang: php
        file: 'src/Data/CausalReplies.php'
        variant: good
        code: |
          final readonly class CausalReplies
          {
              public function __construct(
                  private Connection $questionPrimary,
                  private Connection $questionReplica,
                  private Connection $answerDb,
              ) {}

              public function reply(int $questionId, string $text): void
              {
                  $this->answerDb->insert('reply', [
                      'question_id' => $questionId,
                      'text' => $text,
                      // যে অবস্থানের মধ্যে প্রশ্নটা আছে
                      'cause_lsn' => $this->questionPrimary->fetchOne('SELECT pg_current_wal_lsn()'),
                  ]);
              }

              public function questionFor(array $reply): array|false
              {
                  $caughtUp = $this->questionReplica->fetchOne(
                      'SELECT pg_last_wal_replay_lsn() >= CAST(? AS pg_lsn)', [$reply['cause_lsn']],
                  );
                  $db = $caughtUp ? $this->questionReplica : $this->questionPrimary;

                  return $db->fetchAssociative(
                      'SELECT * FROM question WHERE id = ?', [$reply['question_id']],
                  );
              }
          }
        marks:
          - {line: 15, tip: 'উত্তরের সঙ্গে প্রশ্নের shard-এর এমন একটা অবস্থান লেখা থাকে, যার মধ্যে প্রশ্নটা আছে: এটাই তার কারণের ঠিকানা।'}
          - {line: 24, tip: 'replica ওই অবস্থানে না পৌঁছালে প্রশ্নটা primary থেকে পড়া হয়। প্রশ্ন ছাড়া উত্তর কখনো দেখানো হয় না।'}
    aside:
      - type: pitfalls
        items:
          - 'যে উত্তরের প্রশ্ন আসেনি, ব্রাউজারে সেটা লুকালে শুধু উপসর্গ ঢাকা পড়ে। ইমেইল, API ক্লায়েন্ট বা search index তবু প্রশ্ন ছাড়া উত্তর পায়।'
      - type: tips
        items:
          - 'প্রতি উত্তরে নয়, পাতাপিছু একবার যাচাই করুন: পাতার সবচেয়ে বড় cause_lsn-টাই যথেষ্ট।'
          - 'কিছু ডেটাবেস causal ক্রম নিজেই দেয় (MongoDB-র causally consistent session)। আপনারটায় থাকলে সেটাই ব্যবহার করুন।'
      - type: refs
        items:
          - {to: 'time/ordering-events', label: 'ঘটনার ক্রম কীভাবে ঠিক হয়'}
    check:
      q: 'Causal consistency কোন ধরনের অর্থহীন দৃশ্য ঠেকায়, আর তার জন্য উত্তরে কী লেখা থাকে?'
      a: 'কারণ ছাড়া ফল দেখা, যেমন প্রশ্ন ছাড়া উত্তর। উত্তরে কারণের ঠিকানা (cause_lsn) থাকে, আর পড়া সেই কারণ দেখা না যাওয়া পর্যন্ত অপেক্ষা করে।'

