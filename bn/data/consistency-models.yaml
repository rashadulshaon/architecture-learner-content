  - q: 'নিচের কোডে সমস্যা কী, ধরুন replica থেকে পড়া হচ্ছে?'
    lang: php
    code: |
      $em->persist($address);
      $em->flush();

      return $this->redirectToRoute('profile');   // পরের request-এ replica থেকে ঠিকানা পড়ে
    hint: 'redirect-এর পরের request কোন সংযোগ নেবে?'
    options:
      - text: 'ব্যবহারকারী প্রোফাইলে গিয়ে পুরনো ঠিকানা দেখতে পারে, মনে হবে সংরক্ষণ হয়নি'
        correct: true
        why: 'নতুন request replica-তে গেলে এবং সেটা পিছিয়ে থাকলে read-your-writes ভাঙে। লেখার পর কিছুক্ষণ primary বা LSN যাচাই লাগবে।'
      - text: 'কিছু হবে না, কারণ flush() শেষ'
        correct: false
        why: 'flush() শুধু primary-তে লেখে; replica পরে পায়।'
      - text: 'redirect ব্যবহার করা ভুল'
        correct: false
        why: 'redirect ঠিক আছে; সমস্যা কোথা থেকে পরের পড়া হচ্ছে তাতে।'
      - text: 'persist() না করে merge() করতে হবে'
        correct: false
        why: 'এটা ORM-এর প্রশ্ন নয়, ডেটা কোন কপি থেকে পড়া হচ্ছে সেটার।'
    ref: session-guarantees
  - q: 'ব্যবহারকারীকে সবসময় একই replica-তে পাঠালে কোন নিশ্চয়তা সহজে পাওয়া যায়?'
    hint: 'একটা replica কখনো সময়ে পিছায় না, কিন্তু সে কতটা এগিয়েছে তা অনিশ্চিত।'
    options:
      - text: 'Monotonic reads'
        correct: true
        why: 'একই replica সময়ে শুধু এগোয়, তাই পুরনো ডেটায় ফেরা হয় না।'
      - text: 'Read-your-writes'
        correct: false
