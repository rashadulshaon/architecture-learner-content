flashcards:
  - q: 'Consistency model কী?'
    a: 'ডেটার একাধিক কপি থাকলে কে কখন কী দেখতে পাবে, তার নিয়ম বা নিশ্চয়তা।'
    more: |
      একটাই কপি থাকলে প্রশ্ন ওঠে না। replication, cache বা shard-এ কপি বাড়লে কপিগুলো সবসময় এক নয়। model ঠিক করে ঠিক কতটুকু অমিল সহ্য করা হবে।
    ref: time-travelling-page
  - q: 'Strong consistency কী দেয় আর কী দাম নেয়?'
    a: 'লেখা শেষ হওয়ার পর সবাই সর্বশেষ মান পায়, যেন কপি একটাই। বিনিময়ে দেরি আর ব্যর্থতার ঝুঁকি বাড়ে।'
    more: |
      সব কপির সম্মতির অপেক্ষা করতে হয়, তাই লেখা ধীর। কোনো কপি পৌঁছানো না গেলে লেখা বা পড়া আটকে যেতে পারে। তাই টাকা, stock-এর মতো জায়গায় শুধু।
    ref: consistency-ladder
  - q: 'Eventual consistency কী?'
    a: 'নতুন লেখা না এলে কিছুক্ষণ পরে সব কপি একই মানে পৌঁছায়। মাঝের সময়ে কপিগুলো ভিন্ন মান দেখাতে পারে।'
    more: |
      সবচেয়ে দ্রুত আর টেকসই নিয়ম, কারণ কাউকে অপেক্ষা করতে হয় না। লাইক, view count, ফিডে এটা বেশ চলে। টাকার হিসাবে চলে না।
    ref: consistency-ladder
  - q: 'Read-your-writes কী, কীভাবে দেওয়া যায়?'
    a: 'ব্যবহারকারী নিজের লেখা পরের পড়ায় দেখে। লেখার পর primary থেকে পড়া বা replica যথেষ্ট এগিয়েছে কি না যাচাই করে দেওয়া যায়।'
    more: |
      অন্যরা কিছু দেরিতে দেখলে ক্ষতি নেই, তাই এটা সস্তা নিয়ম। PostgreSQL-এ লেখার পরে pg_current_wal_lsn() টুকে রেখে replica-র pg_last_wal_replay_lsn() তার সমান বা বেশি কি না দেখা যায়।
    ref: session-guarantees
  - q: 'Monotonic reads কী?'
    a: 'একবার নতুন ডেটা দেখলে পরের পড়ায় আর পুরনো ডেটা দেখবে না: সময় পিছিয়ে যায় না।'
    more: |
      রিফ্রেশে লাইক বা মন্তব্য কমে গেলে এটা ভাঙে। সহজ সমাধান: ব্যবহারকারীকে সবসময় একই replica-তে পাঠানো, কারণ একটা replica কখনো পিছিয়ে যায় না।
    ref: session-guarantees
  - q: 'Causal consistency কী?'
    a: 'যে ঘটনা আরেকটার ওপর নির্ভর করে, তা পরের ঘটনার আগে দেখা যায়: প্রশ্ন আগে, উত্তর পরে।'
    more: |
      single-leader replica-তে লেখার ক্রম বজায় থাকে, কিন্তু আলাদা shard বা multi-leader-এ উত্তর আগে পৌঁছাতে পারে। সমাধান: উত্তরে কারণের ঠিকানা লিখে রাখা, আর সেই কারণ পড়ার মতো না হওয়া পর্যন্ত উত্তর না দেখানো।
    ref: causal-order
  - q: 'প্রশ্ন আর উত্তর আলাদা shard-এ থাকলে অ্যাপ কীভাবে causal ক্রম দেবে?'
    a: 'উত্তরে কারণের ঠিকানা (প্রশ্নের shard-এর log অবস্থান) রাখুন। উত্তর দেখানোর আগে দেখুন কারণটা পড়া যায় কি না; না গেলে primary থেকে পড়ুন।'
    more: |
      ব্রাউজারে এতিম উত্তর লুকানো যথেষ্ট নয়, কারণ ইমেইল বা API ক্লায়েন্ট তবু সেটা দেখে। দাম: একটা বাড়তি কলাম, প্রতিটা উত্তরে একটা সস্তা query, আর replica পিছিয়ে থাকলে কিছু পড়া primary-তে। single-leader টেবিলে ক্রম এমনিই থাকে, তাই এসব লাগে না।
    ref: causal-order
  - q: 'ব্যালেন্স আর লাইক গোনায় কোন কোন consistency নিয়ম মানায়?'
    a: 'ব্যালেন্স: strong (primary থেকে পড়া)। লাইক গুনতি: eventual যথেষ্ট।'
    more: |
      সিদ্ধান্তের প্রশ্ন: বাসি ডেটায় কি টাকা, stock বা নিরাপত্তায় ভুল সিদ্ধান্ত হবে? হলে strong। না হলে যতটা ঢিলা নিয়ম ব্যবহারকারীকে বিভ্রান্ত করে না, ততটা।
    ref: choose-per-feature

