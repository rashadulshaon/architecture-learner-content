    ref: batched-backfill
  - q: '৫ কোটি সারির `payments` টেবিলে কলাম `reference` এখন ভরা। এতে `NOT NULL` যোগ করতে সবচেয়ে নিরাপদ পথ?'
    hint: 'lock-এর সময় ছোট রাখুন, যাচাই আলাদা করুন।'
    options:
      - text: 'CHECK (reference IS NOT NULL) NOT VALID যোগ, তারপর VALIDATE, তারপর SET NOT NULL'
        correct: true
        why: 'ভারী যাচাই lock ছাড়াই চলে; শেষ ধাপে স্ক্যান লাগে না (PG 12+)।'
      - text: 'সরাসরি `ALTER COLUMN reference SET NOT NULL`'
        correct: false
        why: 'পুরো টেবিল স্ক্যানের সময় lock ধরে থাকে।'
      - text: 'টেবিল মুছে নতুন করে বানানো'
        correct: false
        why: 'এতে সব ডেটা হারিয়ে যায়।'
      - text: 'অ্যাপে validation যোগ করেই ক্ষান্ত'
        correct: false
        why: 'অ্যাপ বাইপাস করে ডেটাবেসে ফাঁকা ঢুকতে পারে; ডেটাবেস constraint-ই শেষ প্রহরী।'
    ref: dangerous-ddl
  - q: '৩ কোটি সারির `orders` টেবিলে নিচের কোন statement চলার পুরো সময় লেখা আটকে রাখবে?'
    hint: 'কোনটা lock ধরে পুরো স্ক্যান বা পুরো build করে?'
    options:
      - text: '`CREATE INDEX idx_orders_user ON orders (user_id)` (সাধারণ)'
        correct: true
        why: 'সাধারণ index build শেষ না হওয়া পর্যন্ত প্রতিটা INSERT, UPDATE, DELETE আটকে রাখে। `CONCURRENTLY` এটা এড়ায়।'
      - text: '`ALTER TABLE orders VALIDATE CONSTRAINT fk_orders_user`'
        correct: false
        why: 'VALIDATE দুর্বল lock নেয়, তাই পুরনো সারি যাচাইয়ের সময় পড়া-লেখা চলে।'
      - text: '`ALTER TABLE orders ADD CONSTRAINT fk_orders_user FOREIGN KEY (user_id) REFERENCES users (id)` (NOT VALID ছাড়া)'
        correct: true
        why: 'lock ধরে সব পুরনো সারি যাচাই করে। আগে `NOT VALID` দিয়ে যোগ করলে lock ছোট থাকে।'
      - text: '`CREATE INDEX CONCURRENTLY idx_orders_user ON orders (user_id)`'
        correct: false
        why: 'CONCURRENTLY লেখা না আটকে index বানায়, শুধু সময় বেশি নেয়।'
    ref: dangerous-ddl
  - q: 'দুপুরে একটা `ALTER TABLE` চালানোর পর ডেটাবেস CPU কম, তবু সাইট থমকে আছে। সবচেয়ে সম্ভাব্য কারণ?'
    hint: 'CPU কম মানে কাজ নয়, অপেক্ষা।'
    options:
      - text: 'ALTER একটা lock ধরে আছে বা lock-এর জন্য অপেক্ষা করছে, আর তার পেছনে সব query আটকে আছে'
        correct: true
        why: 'lock queue জমলে connection pool ভরে যায়, অথচ CPU কম থাকে।'
      - text: 'ডেটাবেসের disk ফুরিয়েছে'
        correct: false
        why: 'disk ভরলে write error আসে, আর অন্য লক্ষণ দেখা যেত।'
      - text: 'নতুন কোডে bug'
        correct: false
        why: 'সময় ও ঘটনার মিল ALTER-এর সাথে; ডেটাবেসের lock তালিকা আগে দেখুন।'
      - text: 'DNS সমস্যা'
        correct: false
        why: 'DNS সমস্যায় সংযোগই হতো না; এখানে সংযোগ আছে কিন্তু query আটকে।'
    ref: alter-table-freeze
