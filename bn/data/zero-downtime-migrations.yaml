  - q: 'এই migration কেন একটা সমস্যা তৈরি করবে?'
    lang: php
    code: |
      public function up(Schema $schema): void
      {
          $this->addSql('CREATE INDEX CONCURRENTLY idx_o ON orders (user_id)');
      }
      // isTransactional() override করা নেই
    hint: 'Doctrine Migration ডিফল্টে কীভাবে চলে?'
    options:
      - text: 'ডিফল্টে migration transaction-এ চলে, আর PostgreSQL `CONCURRENTLY` তাতে চালাতে দেয় না: error'
        correct: true
        why: '`isTransactional(): bool { return false; }` দিতে হয়।'
      - text: 'CONCURRENTLY টেবিল পুরো আটকে রাখবে'
        correct: false
        why: 'ঠিক উল্টো, `CONCURRENTLY` আটকায় না; কিন্তু transaction-এর ভেতরে চালানোই যায় না।'
      - text: 'index বানানো হবে কিন্তু কেউ ব্যবহার করবে না'
        correct: false
        why: 'command শুরুতেই ব্যর্থ হয়।'
      - text: 'কোনো সমস্যা নেই'
        correct: false
        why: 'transaction-এর ভেতরে `CREATE INDEX CONCURRENTLY` চললে PostgreSQL error দেয়।'
    ref: safe-doctrine-migrations
  - q: '২ কোটি সারির টেবিলে নতুন কলাম ভরার নিরাপদ ও সঠিক উপায় কোনগুলো?'
    hint: 'একসাথে, না ছোট ছোট ভাগে?'
