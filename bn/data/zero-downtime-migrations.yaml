      - text: '১০০০ সারির ব্যাচে, `id` ধরে এগিয়ে, মাঝে বিরতি দিয়ে'
        correct: true
        why: 'প্রতিটা lock ছোট থাকে, সাইট চলতে থাকে।'
      - text: 'কাজটা আবার চালানো যায় এমনভাবে লেখা (`IS NULL` শর্ত)'
        correct: true
        why: 'মাঝপথে থামলে বাকিটা থেকে চালু করা যায়।'
      - text: 'এক `UPDATE users SET mobile_number = phone` চালানো'
        correct: false
        why: 'দীর্ঘ lock, বিশাল log আর replica lag তৈরি করে।'
      - text: 'সব সারি PHP-র মেমোরিতে এনে এক এক করে সেভ করা'
