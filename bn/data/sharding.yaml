flashcards:
  - q: 'Partitioning আর sharding-এর পার্থক্য কী?'
    a: 'Partitioning টেবিলকে ছোট টুকরোয় ভাগ করে, সাধারণত এক সার্ভারে। Sharding টুকরোগুলো আলাদা সার্ভারে রাখে।'
    more: |
      Partition সহজ আর অ্যাপ প্রায় বদলাতে হয় না: পুরনো ডেটা সরানো ও query দ্রুত করে। Sharding লেখার ক্ষমতা সার্ভার জুড়ে বাড়ায়, কিন্তু অ্যাপকে জানতে হয় ডেটা কোথায়।
    ref: last-resort
  - q: 'Sharding-এর আগে কোন ধাপগুলো চেষ্টা করবে?'
    a: 'index ও query ঠিক করা, cache, বড় সার্ভার, read replica, partition ও archive।'
    more: |
      প্রতিটা ধাপ sharding-এর চেয়ে সস্তা আর কম ঝুঁকির। বেশিরভাগ অ্যাপ এই ধাপগুলোতেই বছরের পর বছর চলে। sharding করতে হয় শুধু যখন এক সার্ভারের লেখার সীমা সত্যিই পেরোয়।
    ref: last-resort
  - q: 'Shard key কী?'
    a: 'যে কলামের মান দেখে ঠিক হয় row কোন shard-এ যাবে, যেমন customer_id।'
    more: |
      router সেই মান থেকে হিসাব করে shard বের করে। একই key সবসময় একই shard-এ যায়। key সঠিক হলে বেশিরভাগ query এক shard-এই শেষ হয়।
    ref: how-shards-work
  - q: 'ভালো shard key-র শর্তগুলো কী?'
    a: 'অনেক আলাদা মান, চাপ সমান ছড়ায়, বেশিরভাগ query-তে থাকে, আর বদলায় না।'
    more: |
      customer_id প্রায়ই ভালো (অনেক মান, সমান ছড়ায়, query-তে থাকে)। দেশ বা status খারাপ: মান কম আর অসমান। তারিখও বিপজ্জনক: নতুন ডেটা সব এক shard-এ পড়ে।
    ref: choosing-shard-key
  - q: 'Hot shard কী, কেন হয়?'
    a: 'যে shard-এ অসমভাবে বেশি চাপ পড়ে। ভুল shard key (দেশ, তারিখ) বা একজন বিশাল ব্যবহারকারী থেকে হয়।'
    more: |
      একটা shard ধীর হলে যে query তাতে যায় সেগুলো ধীর, আর বাকি shard ফাঁকা পড়ে থাকে। তাই সার্ভার যোগ করেও লাভ হয় না। সমাধান: ভালো key, বড় tenant আলাদা shard-এ, বা key-তে hash।
    ref: choosing-shard-key
  - q: 'Scatter-gather কী, আর কেন ধীর?'
    a: 'shard key ছাড়া query সব shard-এ পাঠিয়ে ফল জোড়া লাগানো। সবচেয়ে ধীর shard-এর সময়েই পুরো query চলে।'
    more: |
      shard যত বাড়ে এই খরচ তত বাড়ে, আর একটা shard ধীর হলে সব ধীর। join আর unique constraint-ও shard জুড়ে কাজ করে না। তাই access pattern ভেবে ডেটা ভাগ করা জরুরি।
    ref: cross-shard-and-resharding
  - q: 'Virtual bucket কেন resharding সহজ করে?'
    a: 'key আগে ১০২৪টার মতো bucket-এ যায়, bucket পরে shard-এ। shard বাড়লে শুধু bucket->shard ম্যাপ বদলায়, hash নয়।'
    more: |
      সরাসরি hash % N রাখলে N বদলালে প্রায় সব ডেটা নড়ে। bucket থাকলে শুধু কিছু bucket নতুন shard-এ সরাও। এতে resharding ধাপে ধাপে করা যায়।
    ref: partition-and-router-code

quiz:
  - q: 'রহিমের অ্যাপের ডেটাবেসে পড়া ও লেখা দুটোই বেড়েছে। কোনটা আগে করা উচিত?'
    hint: 'সবচেয়ে সস্তা ধাপ কোনটা?'
    options:
      - text: 'সরাসরি ডেটা ৪ shard-এ ভাগ করা'
        correct: false
        why: 'এটা সবচেয়ে জটিল ও ঝুঁকিপূর্ণ ধাপ। সহজ উপায়ে সমাধান হলে এর দরকার পড়ে না।'
      - text: 'ধীর query মেপে index বসানো, cache আর read replica দেখা'
        correct: true
        why: 'এসব সস্তা ও নিরাপদ, আর বেশিরভাগ সমস্যা এখানেই মেটে। ঠিক না হলে তবেই পরের ধাপ।'
      - text: 'নতুন NoSQL ডেটাবেসে পুরো অ্যাপ সরানো'
        correct: false
        why: 'এতে migration আর নতুন ঝুঁকি আসে, অথচ সমস্যার মূল কারণ মাপাই হয়নি।'
      - text: 'কিছু না করে অপেক্ষা'
        correct: false
        why: 'সমস্যা নিজে মিটবে না; আগে মাপো ও সহজ ধাপগুলো চেষ্টা করো।'
    ref: last-resort
  - q: 'একটা অ্যাপে shard key = created_at (মাসের range)। কী ঘটবে?'
    hint: 'আজকের লেখা কোন shard-এ যায়?'
    options:
      - text: 'সব shard-এ সমান লেখা হবে'
        correct: false
        why: 'নতুন row-র তারিখ সবসময় আজকের, তাই সব এক shard-এ যায়।'
      - text: 'সর্বশেষ shard-এ সব লেখা পড়বে (hot shard), পুরনোগুলো প্রায় ফাঁকা'
        correct: true
        why: 'সময়ের সাথে লেখা সবসময় শেষ range-এ যায়। এটাই range key-তে তারিখের সাধারণ ফাঁদ।'
      - text: 'কোনো সমস্যা নেই, কারণ range query সহজ'
        correct: false
        why: 'range query সহজ হলেও লেখার চাপ এক shard-এ জমে, যা মূল সমস্যা।'
      - text: 'ডেটাবেস নিজে shard মিলিয়ে নেবে'
        correct: false
        why: 'চাপের ভারসাম্য ডেটাবেস নিজে করে না; key-র ধরনই সেটা ঠিক করে।'
    ref: choosing-shard-key
  - q: 'নিচের কোডে সমস্যা কী?'
    lang: php
    code: |
      $shard = $customerId % 4;           // সরাসরি shard
      $conn  = $registry->getConnection('shard_' . $shard);
      // ... কিছুদিন পরে shard ৪ থেকে ৮ করা হলো
    hint: '% 4 থেকে % 8 হলে একই customer_id কোন shard-এ যাবে?'
    options:
      - text: 'shard-সংখ্যা বদলালে বেশিরভাগ customer-এর shard বদলে যায়, তাই প্রায় সব ডেটা সরাতে হবে'
        correct: true
        why: 'সরাসরি % N-এ N বদলালে হিসাবই বদলায়। virtual bucket রাখলে কেবল কিছু bucket সরে।'
      - text: 'getConnection() এভাবে ডাকা যায় না'
        correct: false
        why: 'ManagerRegistry::getConnection(নাম) ঠিকভাবেই কাজ করে।'
      - text: 'customerId int না হয়ে string হওয়া উচিত'
        correct: false
        why: 'ধরন সমস্যা নয়; সমস্যা resharding-এর সময় হিসাব বদলে যাওয়া।'
      - text: 'কোনো সমস্যা নেই'
        correct: false
        why: 'সমস্যা আছে: N বদলানোর সময় সব ডেটা নড়ে।'
    ref: partition-and-router-code
  - q: 'Sharding করা অ্যাপে কোন কাজগুলো কঠিন হয়ে যায়?'
    hint: 'যেসব কাজ একাধিক shard-এর ডেটা একসাথে চায়।'
    options:
      - text: 'দুটো ভিন্ন shard-এর row নিয়ে join'
        correct: true
        why: 'ডেটাবেস আলাদা সার্ভারের টেবিল join করতে পারে না; অ্যাপে করতে হয়।'
      - text: 'একটা customer-এর সব অর্ডার পড়া (shard key = customer_id)'
        correct: false
        why: 'এটা ঠিক এক shard-এই থাকে, তাই সহজ।'
      - text: 'দুই shard জুড়ে এক transaction-এ ব্যালেন্স বদল'
        correct: true
        why: 'সাধারণ ACID transaction এক shard-এর বাইরে খাটে না; saga বা আলাদা উপায় লাগে।'
      - text: 'সারা সিস্টেমে ইমেইল unique রাখা'
        correct: true
        why: 'UNIQUE constraint এক shard-এর ভেতরেই কার্যকর; সারা সিস্টেমে আলাদা ব্যবস্থা লাগে।'
    ref: cross-shard-and-resharding
  - q: 'একটা SaaS অ্যাপে ১০ হাজার tenant, কিন্তু একটা tenant-এর ডেটা বাকি সবার মোট ডেটার সমান। tenant_id দিয়ে shard করা হলো। কী সমস্যা, আর সমাধান?'
    hint: 'একটা বিশাল tenant কোন shard-এ যাবে?'
    options:
      - text: 'সমস্যা নেই, hash সব সমান ভাগ করে'
        correct: false
        why: 'hash tenant-দের সমান ছড়ায়, কিন্তু একটা tenant-এর ডেটা এক shard-এই থাকে, তাই সেই shard ফুলে যাবে।'
      - text: 'বিশাল tenant-এর shard hot হবে; সেই tenant-কে আলাদা নিজস্ব shard-এ দিতে lookup টেবিল ব্যবহার করা যায়'
        correct: true
        why: 'lookup/directory কৌশলে ইচ্ছামতো tenant-কে ইচ্ছামতো shard-এ রাখা যায়। এটাই celebrity সমস্যার সমাধান।'
      - text: 'tenant_id বদলে created_at key করো'
        correct: false
        why: 'এতে নতুন লেখা সব এক shard-এ যায়, আর tenant-ভিত্তিক query সব shard-এ ঘোরে।'
      - text: 'সব tenant-এর ডেটা এক shard-এ ফিরিয়ে আনো'
        correct: false
        why: 'এতে sharding-এর পুরো উদ্দেশ্যই হারায়।'
    ref: choosing-shard-key
