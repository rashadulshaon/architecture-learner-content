slides:
  - slug: last-resort
    title: 'Sharding শেষ উপায়, প্রথম নয়'
    kind: story
    tldr: 'Sharding মানে ডেটা একাধিক সার্ভারে ভাগ করা; এতে জটিলতা বিশাল, তাই index, cache, বড় সার্ভার, replica আর partition শেষ করে তারপর।'
    keywords: ['sharding', 'partitioning', 'scale out', 'vertical scaling', 'when to shard', 'শার্ডিং']
    blocks:
      - type: metaphor
        icon: truck
        title: 'কুরিয়ারের জেলা-গুদাম'
        body: |
          একটা কুরিয়ার কোম্পানির সব পার্সেল ঢাকার এক গুদামে। গুদাম ভরে যাওয়ায় কেউ বলল "প্রতিটা জেলায় আলাদা গুদাম খুলি।" তাতে জায়গা মিলবে, কিন্তু এখন ঢাকা থেকে সিলেটের পার্সেল খুঁজতে ফোন করতে হবে, দুই জেলার মাল একসাথে হিসাব করা কঠিন, আর নতুন গুদাম খুললে মাল সরাতে হবে। আগে দেখা উচিত ছিল গুদাম আরও ভালোভাবে সাজানো যায় কি না।
      - type: visual
        kind: steps
        caption: 'Sharding-এর আগে সিঁড়ির ধাপগুলো'
        steps:
          - {title: '১. query ও index ঠিক করো', body: 'ধীর query মেপে index বসাও, N+1 সরাও।', tip: 'বেশিরভাগ "ডেটাবেস আর পারছে না" সমস্যা এখানেই শেষ হয়। সবচেয়ে সস্তা ধাপ।'}
          - {title: '২. cache দাও', body: 'বারবার পড়া উত্তর ডেটাবেসে পৌঁছানোর আগেই ফেরাও।', tip: 'পড়ার চাপের বড় অংশ cache-এ চলে যায়।'}
          - {title: '৩. সার্ভার বড় করো', body: 'আরও RAM, দ্রুত ডিস্ক (vertical scaling)।', tip: 'বড় সার্ভার আজকাল অনেক বড় ডেটা সামলায়। কোডে হাত না দিয়ে সময় কেনা যায়।'}
          - {title: '৪. read replica', body: 'পড়া follower-এ সরাও, leader শুধু লেখে।', tip: 'পড়ার চাপের জন্য। লেখার চাপ কমায় না।'}
          - {title: '৫. partition ও archive', body: 'বড় টেবিল এক সার্ভারেই ভাগ করো, পুরনো ডেটা সরাও।', tip: 'এক ডেটাবেসের ভেতরেই টেবিল ছোট টুকরোয় ভাগ। অ্যাপ বদলাতে হয় না।'}
          - {title: '৬. তারপর sharding', body: 'এক সার্ভারের লেখার সীমা সত্যিই পেরোলে।', tone: accent, tip: 'এখান থেকে অ্যাপ জানে ডেটা কোন সার্ভারে। জটিলতা অনেক বাড়ে।'}
      - type: quote
        body: 'Sharding শেষ উপায়। প্রতিটা সহজ ধাপ শেষ না করে sharding নয়।'
    aside:
      - type: terms
        items:
          - {term: 'Partitioning', meaning: 'এক টেবিলকে ছোট টুকরোয় ভাগ করা, সাধারণত একই ডেটাবেস সার্ভারে।'}
          - {term: 'Sharding', meaning: 'টুকরোগুলো আলাদা আলাদা সার্ভারে রাখা, যাতে প্রতিটা সার্ভার ডেটার একটা অংশ সামলায়।'}
      - type: refs
        items:
          - {to: 'scaling/horizontal-vertical', label: 'বড় সার্ভার বনাম বেশি সার্ভার'}
          - {to: 'data/replication', label: 'পড়ার চাপের জন্য replication'}
    check:
      q: 'ডেটাবেসের লেখার চাপ বাড়ছে। sharding-এর আগে কোন কোন ধাপ চেষ্টা করবে?'
      a: 'ধীর query আর index ঠিক করা, cache, বড় সার্ভার, ভারী লেখা কমানো ও পুরনো ডেটা archive বা partition করা। তারপরও না পারলে তবেই sharding।'

  - slug: how-shards-work
    title: 'Shard key আর router'
    kind: concept
    tldr: 'প্রতিটা row-এর একটা shard key থাকে; router সেটা থেকে হিসাব করে row কোন shard-এ যাবে, আর অ্যাপ সরাসরি সেই shard-এ কথা বলে।'
    keywords: ['shard key', 'router', 'hash sharding', 'range sharding', 'lookup', 'shard routing']
    blocks:
      - type: metaphor
        icon: truck
        title: 'জেলার কোড দেখে গুদাম'
        body: |
          প্রতিটা পার্সেলে জেলার কোড লেখা: ০১ ঢাকা, ০২ চট্টগ্রাম, ০৩ সিলেট। কোড দেখে ডেস্ক বলে দেয় পার্সেল কোন গুদামে যাবে, আর খুঁজতেও সেই গুদামেই যায়। এখানে কোডটা shard key, ডেস্কটা router, আর প্রতিটা গুদাম এক shard। কোড ঠিকমতো ঠিক না হলে এক গুদাম উপচে পড়ে।
      - type: visual
        kind: flow
        caption: 'customer_id দিয়ে ৩টা shard-এর একটা বাছা'
        nodes:
          - {id: app, label: 'Symfony অ্যাপ', icon: api, col: 0, row: 1, tip: 'অনুরোধে customer_id থাকে, সেটাই shard key।'}
          - {id: router, label: 'ShardRouter', sub: 'hash(key) % 3', icon: shuffle, tone: accent, col: 1.5, row: 1, tip: 'key থেকে হিসাব করে shard ঠিক করে। অ্যাপের ভেতরেই থাকতে পারে, বা আলাদা proxy।'}
          - {id: s0, label: 'shard ০', sub: 'customer ৭, ১৯...', icon: db, col: 3.5, row: 0, tip: 'ডেটার এক-তৃতীয়াংশ। নিজের আলাদা ডেটাবেস সার্ভার।'}
          - {id: s1, label: 'shard ১', sub: 'customer ১২, ৩৩...', icon: db, col: 3.5, row: 1, tip: 'আরেক-তৃতীয়াংশ।'}
          - {id: s2, label: 'shard ২', sub: 'customer ৪২, ৫৫...', icon: db, col: 3.5, row: 2, tip: 'বাকি অংশ। customer ৪২-এর সব অর্ডার এখানে।'}
        edges:
          - {from: app, to: router, label: 'অ্যাপ জানায়: customer ৪২-এর অর্ডার চাই'}
          - {from: router, to: s2, label: 'router হিসাব করে ৪২ যায় shard ২-এ'}
          - {from: s2, to: router, label: 'শুধু shard ২ উত্তর দেয়, বাকি দুটো ছোঁয়াই হয় না', dashed: true, tone: good}
      - type: points
        title: 'ভাগ করার তিন কৌশল'
        style: dot
        items:
          - 'Range: key-র সীমা ধরে (১ - ১০ লাখ শার্ড ০)।'
          - 'Hash: hash(key) % N, সমান ছড়ায়।'
          - 'Lookup: আলাদা একটা টেবিলে লেখা কোন key কোন shard-এ।'
    aside:
      - type: remember
        body: 'shard key = পার্সেলের জেলা-কোড। কোড ভুল হলে এক গুদামে সব, বাকিরা ফাঁকা।'
      - type: tips
        items:
          - 'যে query-তে shard key থাকে, সেটা এক shard-এ যায়। key না থাকলে সব shard-এ ঘুরতে হয়।'
    check:
      q: 'অ্যাপ কীভাবে জানে customer ৪২-এর অর্ডার কোন shard-এ আছে?'
      a: 'router shard key (customer_id) থেকে হিসাব করে, যেমন hash(key) % shard-সংখ্যা। একই key সবসময় একই shard-এ যায়, তাই খুঁজতেও সেখানেই যাওয়া হয়।'

  - slug: choosing-shard-key
    title: 'ভুল key: এক shard-এ সব চাপ'
    kind: pitfall
    tldr: 'ভালো shard key সমান ছড়ায়, বেশিরভাগ query-তে থাকে আর বদলায় না; ভুল key (দেশ, তারিখ) এক hot shard-এ সব চাপ ফেলে বাকিগুলো ফাঁকা রাখে।'
    keywords: ['shard key', 'hot shard', 'hot spot', 'cardinality', 'skew', 'celebrity problem']
    blocks:
      - type: text
        body: |
          একটা ই-কমার্স অ্যাপের ৪টা shard। দলটা shard key ধরল ক্রেতার দেশ। কিন্তু ৭২% ক্রেতা বাংলাদেশে, তাই একটা shard পুড়ছে আর তিনটা ঘুমাচ্ছে। চার সার্ভার কিনেও আসলে একটাই কাজ করছে।
      - type: visual
        kind: bars
        caption: 'shard key = দেশ: প্রতিটা shard-এ চাপের শতাংশ'
        items:
          - {label: 'shard ০ (BD)', value: 72, display: '72%', tone: bad, tip: 'hot shard: প্রায় সব লেখা-পড়া এখানে। এটা ধীর হলে সারা অ্যাপ ধীর।'}
          - {label: 'shard ১ (IN)', value: 15, display: '15%', tone: muted, tip: 'ভারতের ক্রেতারা। বেশিরভাগ সময় ফাঁকা।'}
          - {label: 'shard ২ (US)', value: 8, display: '8%', tone: muted, tip: 'প্রায় বসে আছে।'}
          - {label: 'shard ৩ (অন্যান্য)', value: 5, display: '5%', tone: muted, tip: 'প্রায় অব্যবহৃত।'}
      - type: points
        title: 'ভালো shard key-র চার শর্ত'
        style: check
        items:
          - 'অনেক আলাদা মান আছে (high cardinality): customer_id ভালো, country খারাপ।'
          - 'চাপ সমান ছড়ায়: কোনো একটা মান অতি জনপ্রিয় নয়।'
          - 'বেশিরভাগ query-তে থাকে, যাতে এক shard-এই কাজ শেষ হয়।'
          - 'একবার ঠিক হলে বদলায় না।'
      - type: visual
        kind: table
        caption: 'তিন কৌশলের ভালো আর ঝুঁকির দিক'
        headers: ['কৌশল', 'ভালো', 'ঝুঁকি']
        rows:
          - cells: ['Range (তারিখ বা ID-র সীমা)', 'range query সহজ', 'নতুন ডেটা সব সর্বশেষ shard-এ: hot shard']
            tip: 'তারিখ key হলে আজকের সব লেখা একটা shard-এ পড়ে, বাকি পুরনোগুলো শুধু পড়ার জন্য।'
          - cells: ['Hash (hash(key) % N)', 'সমানভাবে ছড়ায়', 'range query সব shard-এ; N বদলালে সব ডেটা নড়ে']
            tip: 'সবচেয়ে প্রচলিত। তবে N সরাসরি বদলানো ভয়ংকর, তাই virtual bucket লাগে।'
          - cells: ['Lookup টেবিল', 'যেকোনো key যেকোনো shard-এ সরানো যায়', 'lookup টেবিলই নতুন বাধা ও একক ব্যর্থতার জায়গা']
            tip: 'নমনীয়, কিন্তু প্রতিটা অনুরোধে আগে lookup হয়, তাই সেটা cache করা ও replicate করা লাগে।'
    aside:
      - type: pitfalls
        items:
          - 'Celebrity সমস্যা: customer_id ভালো key হলেও একজন বিশাল ক্রেতা (বা tenant) একাই এক shard ভরে দিতে পারে। বড় tenant আলাদা shard-এ দাও।'
          - 'Shard key পরে বদলাতে মানে সব ডেটা সরানো। শুরুতেই access pattern ভেবে ঠিক করো।'
      - type: refs
        items:
          - {to: 'security/multi-tenancy', label: 'tenant_id দিয়ে ভাগ করা'}
    check:
      q: 'একটা shard-এ ৭২% চাপ পড়ছে। shard key বদলে দেশের জায়গায় কী নেওয়া যায়?'
      a: 'customer_id-এর hash। অনেক আলাদা মান, তাই চাপ সমান ছড়ায়, আর বেশিরভাগ query-তে customer_id থাকায় এক shard-এই কাজ হয়ে যায়।'

  - slug: partition-and-router-code
    title: 'কোডে: partition আর shard router'
    kind: howto
    tldr: 'এক সার্ভারে PostgreSQL declarative partition দিয়ে শুরু করো; সত্যিকারের sharding-এ Doctrine-এ প্রতি shard-এর আলাদা connection আর virtual bucket-ভিত্তিক router বানাও।'
    keywords: ['PostgreSQL partition', 'declarative partitioning', 'ManagerRegistry', 'virtual bucket', 'shard router', 'Doctrine connections']
    blocks:
      - type: code
        lang: sql
        file: 'ধাপ ৫: এক সার্ভারে partition (PostgreSQL)'
        code: |
          CREATE TABLE click_event (
            id          bigint GENERATED ALWAYS AS IDENTITY,
            customer_id bigint      NOT NULL,
            created_at  timestamptz NOT NULL,
            PRIMARY KEY (id, created_at)
          ) PARTITION BY RANGE (created_at);

          CREATE TABLE click_event_2026_01 PARTITION OF click_event
            FOR VALUES FROM ('2026-01-01') TO ('2026-02-01');
        marks:
          - {line: 5, tip: 'partition key (created_at) অবশ্যই primary key-র অংশ হতে হয়।'}
          - {line: 6, tip: 'মাসভিত্তিক ভাগ: পুরনো মাস DETACH করে archive করা যায়, আর query শুধু দরকারি partition ছোঁয়।'}
      - type: code
        lang: php
        file: 'src/Sharding/ShardRouter.php'
        variant: good
        code: |
          final readonly class ShardRouter
          {
              private const BUCKETS = 1024;

              /** @param array<int, string> $bucketToShard bucket -> 'shard_0' */
              public function __construct(
                  private ManagerRegistry $registry,
                  private array $bucketToShard,
              ) {}

              public function connectionFor(int $customerId): Connection
              {
                  $bucket = crc32((string) $customerId) % self::BUCKETS;

                  return $this->registry->getConnection($this->bucketToShard[$bucket]);
              }
          }
        marks:
          - {line: 3, tip: 'কিছু ভুল না করতে ১০২৪টা ভার্চুয়াল bucket: key আগে bucket-এ, bucket পরে shard-এ যায়।'}
          - {line: 15, tip: 'bucket বদলে নয়, শুধু bucket->shard ম্যাপ বদলালেই কিছু ডেটা অন্য shard-এ সরানো যায়, হিসাব আর বদলাতে হয় না।'}
      - type: text
        body: |
          `config/packages/doctrine.yaml`-এ `doctrine.dbal.connections`-এর নিচে প্রতিটা shard-এর নাম দাও (`shard_0`, `shard_1`) আর প্রত্যেকের `url` আলাদা env থেকে নাও। তখন `$registry->getConnection('shard_0')` সেই shard-এর DBAL connection ফেরত দেয়।
    aside:
      - type: tips
        items:
          - 'ORM-এর EntityManager প্রতি shard-এর জন্য আলাদা লাগে; সহজ রাখতে shard-এ DBAL Connection ব্যবহার করো।'
          - 'Migration প্রতিটা shard-এ আলাদা চালাতে হবে। এটা অটোমেট না করলে shard-গুলো আলাদা schema-য় সরে যায়।'
      - type: refs
        items:
          - {to: 'scaling/consistent-hashing', label: 'N বদলালে কম ডেটা সরানোর কৌশল'}
    check:
      q: 'Hash % N-এর বদলে ১০২৪টা virtual bucket রাখলে কী সুবিধা হয়?'
      a: 'shard-সংখ্যা বদলালেও hash হিসাব বদলায় না। শুধু bucket থেকে shard-এর ম্যাপ বদলে কিছু bucket অন্য shard-এ সরানো যায়, সব ডেটা নড়ে না।'

