slides:
  - slug: report-kills-checkout
    title: 'মাসিক রিপোর্ট চলতেই চেকআউট আটকে গেল'
    kind: story
    tldr: 'একই ডেটাবেসে দ্রুত ছোট লেনদেন আর ভারী রিপোর্ট চালালে রিপোর্ট সব সম্পদ খেয়ে নেয়, আর গ্রাহকের অর্ডার ধীর হয়।'
    keywords: ['OLTP', 'OLAP', 'রিপোর্ট', 'reporting query', 'ধীর চেকআউট', 'analytics']
    blocks:
      - type: metaphor
        icon: shop
        title: 'ক্যাশ কাউন্টার আর মাসিক হিসাবের খাতা'
        body: |
          মুদি দোকানের ক্যাশ কাউন্টারে প্রতি মিনিটে বিশ জন লাইন দেয়; প্রত্যেকের কাজ দুই সেকেন্ডের। মালিক যদি ঠিক ওই কাউন্টারে বসেই মাসের সব বিলের খাতা ঘেঁটে যোগফল বের করতে শুরু করেন, লাইন থেমে যাবে। কাউন্টার আর হিসাবের টেবিল আলাদা না হলে দুটো কাজই ক্ষতিগ্রস্ত।
      - type: text
        body: |
          রহিমের ই-কমার্স অ্যাপে প্রতি রাতে বিক্রির রিপোর্ট চলে। একদিন ম্যানেজার দুপুরে একই রিপোর্ট চালালেন, আর ২০ মিনিট সব অর্ডার ৮ সেকেন্ডে নামল। দুটো query-র ধরনটা নিচে দেখুন।
      - type: code
        lang: sql
        file: 'দুই ধরনের কাজ, একই ডেটাবেস'
        variant: neutral
        code: |
          -- OLTP: ১টা সারি, index দিয়ে, ১ms
          UPDATE orders SET status = 'paid' WHERE id = 90412;

          -- OLAP: কয়েক কোটি সারি পড়ে, গোনে, গ্রুপ করে
          SELECT date_trunc('month', created_at) AS month,
                 category_id, SUM(total_amount) AS revenue
          FROM orders
          GROUP BY month, category_id;
        marks:
          - {line: 2, tip: 'একটাই সারি ছোঁয় আর কাজ শেষ। হাজারটা একসাথে চালালেও ডেটাবেস হাঁপায় না।'}
          - {line: 7, tip: 'পুরো টেবিল স্ক্যান করে। CPU, মেমোরি আর disk I/O অনেকক্ষণ দখল করে রাখে।'}
      - type: visual
        kind: bars
        caption: 'রিপোর্ট চালু থাকাকালে চেকআউটের সাড়া (একই সার্ভার)'
        items:
          - {label: 'রিপোর্ট বন্ধ', value: 120, display: '১২০ms', tone: good, tip: 'সাধারণ দিনে অর্ডার সেভ হতে এই সময় লাগে।'}
          - {label: 'রিপোর্ট চালু', value: 8000, display: '৮০০০ms', tone: bad, tip: 'ভারী query সব CPU আর disk দখল করায় ছোট query লাইনে অপেক্ষা করে।'}
    aside:
      - type: story
        title: 'ম্যানেজারের এক ক্লিক'
        body: |
          রিপোর্টের কোড কয়েক মাস ধরে রাতে নিরাপদে চলছিল। কেউ ভাবেনি ম্যানেজার দুপুরে সেটা চালাবেন। কোড বদলায়নি, বদলেছে চালানোর সময়।
      - type: terms
        items:
          - {term: 'OLTP', meaning: 'Online Transaction Processing: অর্ডার, পেমেন্ট, লগইনের মতো অসংখ্য ছোট লেনদেন।'}
          - {term: 'OLAP', meaning: 'Online Analytical Processing: অনেক ডেটা জুড়ে যোগ, গড়, প্রবণতার হিসাব।'}
    check:
      q: 'ম্যানেজারের রিপোর্ট চালানোয় কেন গ্রাহকের অর্ডার ধীর হলো, অথচ দুটো আলাদা টেবিলের কাজ নয়?'
      a: 'দুটোই একই ডেটাবেস সার্ভারের CPU, মেমোরি আর disk ভাগ করে। ভারী স্ক্যান সেগুলো দখল করায় ছোট query-কে অপেক্ষা করতে হয়।'

  - slug: oltp-vs-olap
    title: 'OLTP বনাম OLAP, আর derived data'
    kind: concept
    tldr: 'OLTP ছোট দ্রুত লেখা-পড়ার জন্য, OLAP বড় হিসাবের জন্য। আসল ডেটা (source of truth) থেকে বানানো আলাদা কপিই derived data।'
    keywords: ['OLTP vs OLAP', 'derived data', 'source of truth', 'column store', 'read replica', 'ডেরাইভড ডেটা']
    blocks:
      - type: text
        body: |
          ক্যাশ কাউন্টার হলো **OLTP**: অসংখ্য ছোট কাজ, প্রতিটা এক-দুটো সারি, উত্তর দ্রুত চাই। মালিকের হিসাবের টেবিল হলো **OLAP**: কম কাজ, কিন্তু প্রতিটা লাখ লাখ সারি ঘেঁটে যোগফল বের করে। আসল বিলের খাতা একটাই, তাকে বলে **source of truth**। আলাদা টেবিলে সেই খাতা থেকে তুলে বানানো সারাংশকে বলে **derived data**: হারিয়ে গেলে আসল থেকে আবার বানানো যায়।
      - type: visual
        kind: table
        caption: 'দুই ধরনের কাজের চেহারা'
        headers: ['', 'OLTP', 'OLAP']
        rows:
          - cells: ['কাজ', 'অর্ডার সেভ, লগইন', 'মাসের বিক্রির যোগফল']
            tip: 'অ্যাপের রোজকার কাজ OLTP; ব্যবসার সিদ্ধান্ত নেওয়ার প্রশ্ন OLAP।'
          - cells: ['প্রতি query-তে সারি', 'কয়েকটা', 'লাখ-কোটি']
            tip: 'OLAP সব সারি পড়ে, কিন্তু কয়েকটা কলামই লাগে।'
          - cells: ['কার জন্য', 'গ্রাহক, অ্যাপ', 'বিশ্লেষক, ম্যানেজার']
            tip: 'গ্রাহক সাথে সাথে উত্তর চায়; বিশ্লেষক কয়েক সেকেন্ড অপেক্ষা করতে পারে।'
          - cells: ['ডেটা কেমন', 'এখনকার অবস্থা', 'ইতিহাস, একত্রিত']
            tip: 'OLAP-এ গতকালের ডেটাও যথেষ্ট; আসল লক্ষ্য প্রবণতা দেখা।'
          - cells: ['সাজানো', 'সারি ধরে (row)', 'কলাম ধরে (column)']
            tip: 'কলাম ধরে সাজালে `SUM(total_amount)` শুধু ওই একটা কলামই পড়ে, তাই অনেক দ্রুত।'
      - type: visual
        kind: flow
        caption: 'আসল ডেটা একটাই; রিপোর্টের কপি আলাদা জায়গায়'
        nodes:
          - {id: app, label: 'Symfony অ্যাপ', icon: server, col: 0, row: 1, tip: 'গ্রাহকের সব লেনদেন এখানে ঢোকে।'}
          - {id: main, label: 'Primary DB', sub: 'OLTP, source of truth', icon: db, tone: accent, col: 1.5, row: 1, tip: 'আসল সত্য এখানে থাকে। এখানে ভারী রিপোর্ট চালানো মানা।'}
          - {id: derived, label: 'Reporting কপি', sub: 'derived data', icon: chart, col: 3, row: 1, tip: 'আসল ডেটা থেকে বানানো। হারালে আবার বানানো যায়।'}
          - {id: boss, label: 'ম্যানেজার', sub: 'ড্যাশবোর্ড', icon: user, col: 4, row: 1, tip: 'রিপোর্ট এই কপি থেকে পড়ে, আসল ডেটাবেসকে বিরক্ত করে না।'}
        edges:
          - {from: app, to: main, label: 'অর্ডার লেনদেন সরাসরি Primary DB-তে লেখা হয়'}
          - {from: main, to: derived, label: 'পরিবর্তন আলাদা reporting কপিতে গিয়ে পৌঁছায়', dashed: true}
          - {from: derived, to: boss, label: 'ম্যানেজার ভারী রিপোর্ট কপি থেকে দেখেন', tone: good}
      - type: quote
        body: 'রিপোর্ট কখনো transactional ডেটাবেসে নয়; আসলটা একটাই, বাকি সব derived।'
    aside:
      - type: tips
        items:
          - 'derived data সবসময় একটু পুরনো। রিপোর্টে "সর্বশেষ আপডেট: ১০ মিনিট আগে" লিখে দিন।'
          - 'সবচেয়ে সস্তা প্রথম ধাপ: read replica-তে রিপোর্ট চালানো। [[data/replication|replication]]-এ দেখুন।'
      - type: terms
        items:
          - {term: 'Source of truth', meaning: 'যে জায়গার ডেটা চূড়ান্ত সত্য; বাকি কপি এর থেকে বানানো।'}
          - {term: 'Derived data', meaning: 'আসল ডেটা থেকে বানানো কপি বা সারাংশ, যেমন cache, index, materialized view।'}
    check:
      q: 'derived data হারিয়ে গেলে ক্ষতি কম কেন, আর source of truth হারালে বেশি কেন?'
      a: 'derived data আসল থেকে আবার বানানো যায়। source of truth হারালে ফিরে পাওয়ার আর কোনো উৎস থাকে না।'

  - slug: materialized-views
    title: 'Materialized view দিয়ে সারাংশ আগে থেকে বানানো'
    kind: howto
    tldr: 'ভারী query-র ফল একবার হিসাব করে টেবিলের মতো রেখে দিন। রিপোর্ট সেই তৈরি ফল পড়ে; refresh হয় Scheduler দিয়ে। refresh নিজে তবু primary-তেই চলে।'
    keywords: ['materialized view', 'REFRESH CONCURRENTLY', 'Scheduler', 'summary table', 'মেটেরিয়ালাইজড ভিউ']
    blocks:
      - type: text
        body: |
          মালিক প্রতিবার সব বিল না ঘেঁটে রাতে একবার "মাস অনুযায়ী বিক্রি" নামে এক পাতার সারাংশ লিখে রাখেন। ডেটাবেসে এর নাম **materialized view**: query-র ফল সত্যিই ডিস্কে জমা থাকে। সাধারণ view শুধু একটা নাম, প্রতিবার ভেতরের query চলে। materialized view-এ index বসানো যায়, আর `REFRESH ... CONCURRENTLY` দিলে refresh-এর সময় পড়া বন্ধ হয় না। তবে ফাঁদ আছে: view থাকে primary ডেটাবেসের ভেতরেই, আর প্রতিটা refresh পুরো হিসাব সেখানেই নতুন করে করে। ভারী query মরেনি; প্রতি রিপোর্টের বদলে রাতে একবার চলে।
      - type: code
        lang: sql
        file: 'migrations/Version20260301_sales_summary.sql'
        variant: good
        code: |
          CREATE MATERIALIZED VIEW sales_by_month AS
          SELECT date_trunc('month', created_at) AS month,
                 category_id,
                 SUM(total_amount) AS revenue,
                 COUNT(*)          AS orders
          FROM orders
          WHERE status = 'paid'
          GROUP BY 1, 2;

          -- CONCURRENTLY-এর জন্য unique index বাধ্যতামূলক
          CREATE UNIQUE INDEX ux_sales_by_month
              ON sales_by_month (month, category_id);

          REFRESH MATERIALIZED VIEW CONCURRENTLY sales_by_month;
        marks:
          - {line: 1, tip: 'query-র ফল টেবিলের মতো জমা থাকে। পরে `SELECT` করলে হিসাব আর চলে না।'}
          - {line: 11, tip: 'এই unique index ছাড়া CONCURRENTLY refresh চলে না, আর সাধারণ refresh পড়াকে আটকে রাখে।'}
          - {line: 14, tip: 'ডেটা নতুন করে হিসাব করে বদলে দেয়; refresh-এর সময়ও পুরনো সারাংশ পড়া যায়।'}
      - type: code
        lang: php
        file: 'src/Schedule/ReportSchedule.php'
        variant: good
        code: |
          #[AsSchedule('reports')]
          final class ReportSchedule implements ScheduleProviderInterface
          {
              public function getSchedule(): Schedule
              {
                  return (new Schedule())->add(
                      // প্রতি রাত ২টায়, কম চাপের সময়
                      RecurringMessage::cron('0 2 * * *', new RefreshSalesSummary()),
                  );
              }
          }

          #[AsMessageHandler]
          final readonly class RefreshSalesSummaryHandler
          {
              public function __construct(private Connection $db) {}

              public function __invoke(RefreshSalesSummary $m): void
              {
                  $this->db->executeStatement(
                      'REFRESH MATERIALIZED VIEW CONCURRENTLY sales_by_month'
                  );
              }
          }
        marks:
          - {line: 8, tip: 'Symfony Scheduler cron-এর মতো কাজ করে; refresh-এর সময় নিজে ঠিক করুন।'}
          - {line: 21, tip: 'handler-এ শুধু refresh। রিপোর্টের query আলাদা, সেটা `sales_by_month` টেবিল পড়ে।'}
    aside:
      - type: when
        use:
          - 'রিপোর্টে "কয়েক মিনিট বা এক ঘণ্টা পুরনো" ডেটা চলে'
          - 'একই ভারী যোগফল বারবার লাগে'
        avoid:
          - 'গ্রাহককে এই মুহূর্তের সঠিক ব্যালেন্স দেখাতে হবে'
          - 'প্রশ্ন বদলাতেই থাকে: view শুধু যে প্রশ্নের জন্য বানানো তারই উত্তর দেয়'
      - type: pitfalls
        items:
          - 'refresh primary-তে ভারী query চালায় আর সবকিছু নতুন করে হিসাব করে, তাই ব্যস্ত সময়ে করবেন না। পরের স্লাইডে সস্তা উপায় আছে।'
          - 'MySQL-এ materialized view নেই; সেখানে summary টেবিল বানিয়ে নিজে আপডেট করতে হয়।'
    check:
      q: 'সাধারণ view আর materialized view-এর মূল পার্থক্য কী? কোনটা reporting-এ ডেটাবেসকে বাঁচায়?'
      a: 'সাধারণ view প্রতিবার query চালায়; materialized view ফল জমিয়ে রাখে। দ্বিতীয়টা ভারী হিসাব একবারে সারে, তাই বাঁচায়।'

  - slug: summary-table-limits
    title: 'View শুধু সেই প্রশ্নেরই উত্তর দেয় যার জন্য বানানো'
    kind: pitfall
    tldr: 'প্রতিটা refresh primary-তে সবকিছু নতুন করে হিসাব করে, আর view একটাই নির্দিষ্ট প্রশ্নের উত্তর দেয়। দৈনিক ছোট summary টেবিলে refresh সস্তা, যোগ করে মাস-বছর বানানো যায়; প্রশ্ন বদলাতে থাকলে warehouse লাগে।'
    keywords: ['summary table', 'incremental refresh', 'rollup', 'materialized view সীমা', 'upsert', 'ON CONFLICT', 'সারাংশ টেবিল']
    blocks:
      - type: text
        body: |
          রাত ২টার refresh প্রতিবার সব অর্ডার আবার ঘাঁটে। ৫ কোটি অর্ডারে সেটা primary-তে হয়তো ৫ মিনিটের ভারী কাজ; এক বছর পরে ১০ কোটিতে প্রায় ১০ মিনিট। তার ওপর view জানে শুধু "মাস আর ক্যাটাগরি"। ম্যানেজার যেই চাইলেন শহর ধরে, দিন ধরে বিক্রি, view কিছু বলতে পারে না। query তখন দুপুরে পুরো `orders` টেবিলে ফিরে যায়, আর চেকআউট আবার আটকে যায়।
      - type: visual
        kind: compare
        caption: 'রিপোর্ট চালানোর তিন উপায় আর প্রতিটার দাম'
        columns:
          - title: 'Materialized view'
            tone: warn
            tip: 'বানানো সবচেয়ে সোজা, কিন্তু প্রতি refresh-এ সব কাজ নতুন করে হয়, আর উত্তরের চেহারা একটাই।'
            items: ['প্রতি refresh-এ সব সারি নতুন করে হিসাব', 'চলে primary ডেটাবেসেই', 'শুধু একটা নির্দিষ্ট প্রশ্নের উত্তর']
          - title: 'দৈনিক summary টেবিল'
            tone: good
            tip: 'প্রতি রাতে শুধু গতকালের সংখ্যা যোগ হয়, তাই টেবিল বাড়লেও কাজ ছোট থাকে।'
            items: ['প্রতি রাতে শুধু গতকাল যোগ হয়', 'মাস মানে প্রায় ৩০ দিনের যোগফল', 'কলাম আগেই ঠিক করে রাখতে হয়']
          - title: 'Warehouse'
            tone: accent
            tip: 'আলাদা সিস্টেম, যেকোনো প্রশ্নের জন্য। দাম হলো এটা বানানো আর চালানোর খাটুনি।'
            items: ['যেকোনো ভাগ, যেকোনো প্রশ্ন', 'ভারী কাজ primary থেকে সরে যায়', 'বানানো, চালানো, মিলিয়ে রাখা বাড়তি কাজ']
      - type: code
        lang: sql
        file: 'sales_by_day.sql'
        variant: good
        code: |
          CREATE TABLE sales_by_day (
              day         date    NOT NULL,
              category_id int     NOT NULL,
              revenue     numeric NOT NULL,
              orders      int     NOT NULL,
              PRIMARY KEY (day, category_id)
          );

          -- প্রতি রাতে: শুধু গতকালের অর্ডার, created_at-এর index দিয়ে
          INSERT INTO sales_by_day
          SELECT created_at::date, category_id, SUM(total_amount), COUNT(*)
          FROM orders
          WHERE status = 'paid'
            AND created_at >= current_date - 1 AND created_at < current_date
          GROUP BY 1, 2
          ON CONFLICT (day, category_id)
          DO UPDATE SET revenue = EXCLUDED.revenue, orders = EXCLUDED.orders;

          -- মাসের রিপোর্ট প্রায় ৩০টা ছোট সারি যোগ করে, কোটি অর্ডার নয়
          SELECT date_trunc('month', day) AS month, category_id, SUM(revenue)
          FROM sales_by_day GROUP BY 1, 2;
        marks:
          - {line: 14, tip: 'শুধু গতকালের সারি পড়া হয়, তাই রাতের কাজ এক দিনের অর্ডারের সমান, পুরো টেবিলের নয়।'}
          - {line: 16, tip: 'একই দিনের জন্য দুবার চালালে সারিটা শুধু নতুন করে লেখা হয়, তাই retry নিরাপদ।'}
          - {line: 20, tip: 'রিপোর্ট ছোট সারি পড়ে। দিন যোগ করে মাস বা বছর হয়; শুধু-মাসের view ভেঙে আর দিন হয় না।'}
    aside:
      - type: when
        use:
          - 'Summary টেবিল: রোজ একই কয়েকটা রিপোর্ট, আর orders টেবিল বাড়তেই থাকে'
          - 'Warehouse: প্রশ্ন বদলায়, বা অনেক কলাম ধরে ভাগ করতে হয়'
        avoid:
          - 'শুধু materialized view, যখন primary-তে এক refresh-ই কয়েক মিনিট নেয়'
      - type: tips
        items:
          - '`orders(created_at)`-এ index দিন, নাহলে গতকালের query-ও পুরো টেবিল স্ক্যান করবে।'
      - type: refs
        items:
          - {to: 'data/data-platforms', label: 'Warehouse ও pipeline'}
    check:
      q: 'ম্যানেজার শহর ধরে, দিন ধরে বিক্রি চাইলেন, কিন্তু view মাস আর ক্যাটাগরি ধরে। কী হয়, আর বেরোনোর দুই পথ কী?'
      a: 'View উত্তর দিতে পারে না, তাই query আবার primary-তে পুরো orders টেবিলে যায়। শহরসহ আরও সূক্ষ্ম summary টেবিল বানান, অথবা প্রশ্নগুলো warehouse-এ সরান।'

  - slug: change-data-capture
    title: 'Change data capture: বদলগুলো নিজে নিজে পৌঁছাক'
    kind: pitfall
    tldr: 'অ্যাপ থেকে দুই জায়গায় হাতে লিখলে একটা ফসকে যায়। CDC ডেটাবেসের নিজের লগ থেকে বদল পড়ে পাঠায়, তবে দাম হলো বাড়তি যন্ত্রপাতি আর নজরে রাখার মতো একটা লগ।'
    keywords: ['CDC', 'change data capture', 'Debezium', 'WAL', 'dual write', 'outbox', 'replication slot']
    blocks:
      - type: text
        body: |
          অ্যাপ প্রতিটা অর্ডারে দুইবার লিখলে (এক বার Primary DB-তে, আরেকবার reporting কপিতে) একটা ব্যর্থ হলেই দুই জায়গার হিসাব আলাদা হয়ে যায়। একে বলে **dual write**। ঠিক উপায় **change data capture (CDC)**: ডেটাবেস নিজে প্রতিটা বদল একটা লগে লিখে রাখে (PostgreSQL-এর WAL)। একটা টুল (যেমন Debezium) সেই লগ পড়ে প্রতিটা বদল reporting-এর দিকে পাঠায়।
      - type: code
        lang: php
        file: 'src/Service/OrderService.php'
        variant: bad
        code: |
          public function pay(Order $order): void
          {
              $order->markPaid();
              $this->em->flush();                         // ১. মূল DB

              $this->reportingDb->insert('fact_orders', [ // ২. কপি
                  'order_id' => $order->getId(),
                  'amount'   => $order->getTotalAmount(),
              ]);
          }
        marks:
          - {line: 4, tip: 'এখানে সফল হলো।'}
          - {line: 6, tip: 'এখানে সার্ভার পড়ে গেলে বা network ফেল করলে অর্ডার আছে, কপিতে নেই। কেউ টেরই পায় না।'}
      - type: visual
        kind: flow
        caption: 'CDC: অ্যাপ শুধু মূল ডেটাবেসে লেখে, বাকিটা লগ থেকে আসে'
        nodes:
          - {id: app, label: 'Symfony অ্যাপ', icon: server, col: 0, row: 1, tip: 'শুধু একটা জায়গায় লেখে। reporting নিয়ে চিন্তা করে না।'}
          - {id: db, label: 'Primary DB', sub: 'WAL লগ', icon: db, col: 1.5, row: 1, tip: 'প্রতিটা সফল বদল আগে লগে লেখা হয়; তাই লগ কখনো ভুল বলে না।'}
          - {id: cdc, label: 'CDC টুল', sub: 'Debezium', icon: plug, tone: accent, col: 3, row: 1, tip: 'লগ পড়ে প্রতিটা INSERT/UPDATE/DELETE একটা event বানায়।'}
          - {id: wh, label: 'Reporting', sub: 'warehouse', icon: chart, col: 4, row: 1, tip: 'event-গুলো নিয়ে নিজের টেবিল আপডেট করে।'}
        edges:
          - {from: app, to: db, label: 'অ্যাপ অর্ডারটা শুধু মূল ডেটাবেসে লেখে'}
          - {from: db, to: cdc, label: 'CDC টুল লগ থেকে নতুন বদল পড়ে', dashed: true}
          - {from: cdc, to: wh, label: 'প্রতিটা বদল reporting-এ ক্রমানুসারে পৌঁছায়', tone: good}
      - type: code
        lang: json
        file: 'orders-cdc.json (Debezium connector)'
        variant: good
        code: |
          {
            "name": "orders-cdc",
            "config": {
              "connector.class": "io.debezium.connector.postgresql.PostgresConnector",
              "plugin.name": "pgoutput",
              "database.hostname": "primary-db",
              "database.dbname": "shop",
              "table.include.list": "public.orders",
              "slot.name": "orders_cdc",
              "snapshot.mode": "initial",
              "topic.prefix": "shop"
            }
          }
        marks:
          - {line: 9, tip: 'slot হলো লগের একটা বুকমার্ক। এই টুল না পড়া পর্যন্ত PostgreSQL তার পরের সব লগ ফাইল জমিয়ে রাখে।'}
          - {line: 10, tip: 'পুরনো সারি কখনো লগে ছিল না, তাই প্রথমবার পুরো টেবিল একবার কপি হয়: primary-তে একটা ভারী পড়া।'}
      - type: points
        title: 'CDC-র দাম'
        style: cross
        items:
          - 'বাড়তি যন্ত্রপাতি: Debezium আর Kafka-র মতো একটা broker চালাতে, নজরে রাখতে, upgrade করতে হয়।'
          - 'টুল থেমে গেলে লগ ফুলে ওঠে। slot না পড়া পর্যন্ত PostgreSQL WAL জমিয়ে রাখে, তাই এক ছুটির দিন টুল বন্ধ থাকলে primary-র ডিস্ক ভরে যেতে পারে। slot lag-এ alert রাখুন।'
          - 'প্রথম চালানোয় সব পুরনো সারির এককালীন snapshot হয়, তাই কম চাপের সময়ে চালান।'
          - 'PostgreSQL-এ `wal_level = logical` লাগে, আর schema বদলালে reporting দিকেও সেটা সামলাতে হয়।'
    aside:
      - type: remember
        body: 'একটা জায়গায় লিখুন; বাকি কপি লগ থেকে বানান।'
      - type: when
        use:
          - 'warehouse, search index বা cache মূল ডেটার সাথে মিলিয়ে রাখতে হবে'
        avoid:
          - 'ছোট অ্যাপ: রাতের summary-ই যথেষ্ট, CDC-র ঝামেলা বাড়তি'
          - 'লগ নজরে রাখার কেউ নেই: নজরহীন slot-এই ডিস্ক ভরে'
      - type: refs
        items:
          - {to: 'workflows/outbox-inbox', label: 'Outbox pattern'}
          - {to: 'data/data-platforms', label: 'Warehouse ও pipeline'}
    check:
      q: 'dual write-এ ফাঁকটা কোথায়, CDC সেটা কীভাবে এড়ায়, আর CDC-র দাম কী?'
      a: 'প্রথম লেখা সফল হয়ে দ্বিতীয়টা ব্যর্থ হলে মিল ভাঙে। CDC-তে অ্যাপ একবার লেখে, লগ কপিগুলো চালায়; কিন্তু বাড়তি টুল চালাতে হয় আর লগের বৃদ্ধি নজরে রাখতে হয়।'

flashcards:
  - q: 'OLTP কাকে বলে?'
    a: 'অসংখ্য ছোট দ্রুত লেনদেন (অর্ডার, পেমেন্ট, লগইন), যেখানে প্রতিটা query কয়েকটা সারি ছোঁয়।'
    more: |
      Online Transaction Processing হলো অ্যাপের রোজকার ডেটাবেস। এখানে সাড়া কয়েক মিলিসেকেন্ডে চাই। index দিয়ে সারি খুঁজে নেওয়া, ছোট লেখা, ছোট transaction এর মূল বৈশিষ্ট্য।
    ref: oltp-vs-olap
  - q: 'OLAP কাকে বলে?'
    a: 'কম কিন্তু ভারী query, যা লাখ-কোটি সারি জুড়ে যোগ, গড় বা প্রবণতার হিসাব করে।'
    more: |
      Online Analytical Processing মূলত ব্যবসায়িক প্রশ্নের জন্য: "গত বছর কোন ক্যাটাগরিতে কত বিক্রি?" এই ধরনের কাজ কয়েকটা কলাম পড়ে কিন্তু অনেক সারি থেকে। তাই কলাম ধরে সাজানো storage এতে বেশি দ্রুত।
    ref: oltp-vs-olap
  - q: 'রিপোর্ট কেন transactional ডেটাবেসে চালানো উচিত নয়?'
    a: 'ভারী স্ক্যান CPU, মেমোরি ও disk দখল করে গ্রাহকের ছোট query-কে ধীর করে দেয়।'
    more: |
      দুটো কাজ একই সার্ভারের সম্পদ ভাগ করে। রিপোর্ট কয়েক মিনিট চললে অর্ডার সেভ ধীর হয়, timeout হয়, গ্রাহক চলে যায়। তাই রিপোর্টের জন্য আলাদা কপি দরকার।
    ref: report-kills-checkout
  - q: 'Derived data কী?'
    a: 'আসল ডেটা (source of truth) থেকে বানানো কপি বা সারাংশ, যা হারালে আবার বানানো যায়।'
    more: |
      cache, search index, materialized view, warehouse টেবিল সবই derived data। এগুলো পড়ার জন্য ভালো, কিন্তু আসল সত্য নয়। কোনো গরমিল হলে source of truth-কেই বিশ্বাস করতে হয়।
    ref: oltp-vs-olap
  - q: 'Materialized view সাধারণ view থেকে কীভাবে আলাদা?'
    a: 'সাধারণ view প্রতিবার query চালায়; materialized view ফলটা ডিস্কে জমা রাখে এবং refresh করলে বদলায়।'
    more: |
      জমা থাকে বলে এতে index বসানো যায় আর পড়া খুব দ্রুত। বিনিময়ে ডেটা refresh-এর আগ পর্যন্ত পুরনো থাকে। PostgreSQL-এ `REFRESH MATERIALIZED VIEW CONCURRENTLY` পড়া না থামিয়ে হালনাগাদ করে, তবে unique index লাগে।
    ref: materialized-views
  - q: 'Change data capture (CDC) কী?'
    a: 'ডেটাবেসের লেনদেন লগ (যেমন WAL) পড়ে প্রতিটা INSERT, UPDATE, DELETE অন্য সিস্টেমে event হিসেবে পাঠানো।'
    more: |
      অ্যাপের কোড বদলাতে হয় না, কারণ বদলের সত্যিকারের তালিকা ডেটাবেসের লগেই আছে। Debezium এর জনপ্রিয় টুল। এতে dual write-এর ফাঁক এড়ানো যায় আর কপিগুলো ক্রমানুসারে বদল পায়। তবে বিনা খরচে নয়: দামের কার্ডটা দেখুন।
    ref: change-data-capture
  - q: 'Dual write কেন বিপজ্জনক?'
    a: 'একই অ্যাপ দুই জায়গায় লিখলে একটা সফল আর অন্যটা ব্যর্থ হতে পারে, তখন দুই জায়গার ডেটা চুপচাপ আলাদা হয়ে যায়।'
    more: |
      দুটো লেখা একই transaction-এ নেই, তাই একসাথে সফল বা ব্যর্থ হওয়ার নিশ্চয়তা নেই। সমাধান: একটা জায়গায় লিখুন, আর বাকি কপি CDC বা outbox দিয়ে বানান।
    ref: change-data-capture
  - q: 'Materialized view primary-র ওপর এখনো কী চাপ দেয়, আর কী পারে না?'
    a: 'প্রতিটা refresh primary-তে সবকিছু নতুন করে হিসাব করে, আর view শুধু যে একটা প্রশ্নের জন্য বানানো তারই উত্তর দেয়।'
    more: |
      ৫ কোটি অর্ডারে refresh মানে কয়েক মিনিটের ভারী কাজ, আর টেবিল বাড়লে তা-ও বাড়ে। নতুন প্রশ্ন, যেমন শহর ধরে দিনের বিক্রি, চাইলে নতুন view বা সূক্ষ্মতর summary টেবিল লাগে। প্রশ্ন বদলাতে থাকলে জায়গা warehouse-এ।
    ref: summary-table-limits
  - q: 'Materialized view-এর চেয়ে সস্তায় summary টেবিল কীভাবে হালনাগাদ হয়?'
    a: 'প্রতি রাতে upsert (`ON CONFLICT DO UPDATE`) দিয়ে শুধু গতকালের যোগফল যোগ করুন। মাস ও বছর হলো দৈনিক সারির যোগফল।'
    more: |
      রাতের query created_at-এর index দিয়ে এক দিনের অর্ডার পড়ে, তাই কাজ আর পুরো টেবিলের সঙ্গে বাড়ে না। একই দিনের জন্য দুবার চালালে সারিটা শুধু নতুন করে লেখা হয়, তাই retry নিরাপদ।
    ref: summary-table-limits
  - q: 'CDC-র খরচ আর ঝুঁকি কী কী?'
    a: 'বাড়তি যন্ত্রপাতি (Debezium ও broker), পুরনো সারির প্রথম snapshot, আর টুল পড়া বন্ধ করলে primary-তে জমতে থাকা WAL।'
    more: |
      replication slot না পড়া পর্যন্ত PostgreSQL WAL ফাইল জমিয়ে রাখে। CDC টুল এক ছুটির দিন বন্ধ থাকলে primary-র ডিস্ক ভরে যেতে পারে, তাই slot lag-এ alert রাখুন। `wal_level = logical` দিতে হয়, আর প্রথম snapshot কম চাপের সময়ে চালাতে হয়।
    ref: change-data-capture

quiz:
  - q: 'রাতের রিপোর্ট ডেটাবেসের CPU ১০০% করে ফেলে, আর সকালের অর্ডার আটকে যায়। সবচেয়ে সোজা প্রথম সমাধান কোনটা?'
    hint: 'রিপোর্ট আর অর্ডার একই সার্ভারে চলছে। দুটোকে আলাদা করা যায়?'
    options:
      - text: 'রিপোর্ট চালানো read replica বা আলাদা reporting কপি থেকে'
        correct: true
        why: 'ভারী query আলাদা সার্ভারে গেলে primary-র সম্পদ বাঁচে।'
      - text: 'primary সার্ভারের RAM দ্বিগুণ করা'
        correct: false
        why: 'সাময়িক উপশম, কিন্তু রিপোর্ট বাড়লে সমস্যা ফিরে আসে আর খরচ বাড়ে।'
      - text: 'রিপোর্টের query-তে `LIMIT 100` যোগ করা'
        correct: false
        why: 'GROUP BY-সহ query-তে LIMIT বসানোর আগেই পুরো স্ক্যান শেষ হয়।'
      - text: 'রিপোর্ট বন্ধ করে দেওয়া'
        correct: false
        why: 'ব্যবসার রিপোর্ট দরকার; কাজ বন্ধ নয়, আলাদা জায়গায় সরাতে হবে।'
    ref: report-kills-checkout
  - q: 'নিচের কোনগুলো OLAP কাজ?'
    hint: 'কোনগুলোতে অনেক সারি পড়ে একটা সারাংশ বানাতে হয়?'
    options:
      - text: 'গত ১২ মাসের ক্যাটাগরি অনুযায়ী বিক্রির যোগফল'
        correct: true
        why: 'লাখ লাখ সারি পড়ে একত্র করা হচ্ছে; এটাই বিশ্লেষণ।'
      - text: 'একটা অর্ডারের status বদলে `paid` করা'
        correct: false
        why: 'একটা সারির ছোট লেখা, এটা OLTP।'
      - text: 'ডেটা সায়েন্টিস্টের গত তিন বছরের গ্রাহক retention বিশ্লেষণ'
        correct: true
        why: 'বিপুল ঐতিহাসিক ডেটা জুড়ে প্রবণতা বের করা হচ্ছে।'
      - text: 'লগইনের সময় ইমেইল দিয়ে ব্যবহারকারী খোঁজা'
        correct: false
        why: 'index দিয়ে একটা সারি খোঁজা, এটা OLTP।'
    ref: oltp-vs-olap
  - q: 'এই view-এ refresh করলে কী হবে?'
    lang: sql
    code: |
      CREATE MATERIALIZED VIEW sales_by_month AS
      SELECT date_trunc('month', created_at) AS month,
             SUM(total_amount) AS revenue
      FROM orders GROUP BY 1;

      REFRESH MATERIALIZED VIEW CONCURRENTLY sales_by_month;
    hint: 'CONCURRENTLY-এর একটা শর্ত আছে, view-তে সেটা পূরণ হয়েছে?'
    options:
      - text: 'error: CONCURRENTLY-এর জন্য view-তে unique index লাগে, যা এখানে নেই'
        correct: true
        why: 'PostgreSQL পুরনো আর নতুন সারি মেলাতে unique index চায়; ছাড়া এই refresh চলে না।'
      - text: 'সফল হবে, কারণ GROUP BY থাকায় unique'
        correct: false
        why: 'unique হওয়া আর unique index থাকা এক নয়; index আলাদা করে বানাতে হয়।'
      - text: 'সব সারি মুছে view ফাঁকা হয়ে যাবে'
        correct: false
        why: 'ফাঁকা হয় না; command শুরুতেই error দিয়ে থামে।'
      - text: 'সফল হবে, কিন্তু orders টেবিল লক হয়ে যাবে'
        correct: false
        why: 'সমস্যা lock নিয়ে নয়; শর্ত না মানায় command শুরুই হয় না।'
    ref: materialized-views
  - q: 'প্রতিটা অর্ডার পেমেন্টের পর অ্যাপ নিজে warehouse-এও INSERT করে। কোন কারণে এটা ঝুঁকিপূর্ণ?'
    hint: 'দুটো লেখার মাঝে সার্ভার পড়ে গেলে কী থাকে?'
    options:
      - text: 'একটা লেখা সফল, অন্যটা ব্যর্থ হলে দুই জায়গার ডেটা আলাদা হয়ে যায়'
        correct: true
        why: 'দুটো লেখা একসাথে commit হওয়ার কোনো নিশ্চয়তা নেই (dual write)।'
      - text: 'warehouse-এ INSERT করা অনুমোদিত নয়'
        correct: false
        why: 'অনুমোদিত, সমস্যা হলো দুই লেখার মধ্যে সামঞ্জস্য।'
      - text: 'INSERT-এর গতি খুব ধীর'
        correct: false
        why: 'গতি এখানে মূল সমস্যা নয়; ভুল হিসাবই সমস্যা।'
      - text: 'warehouse কেবল CSV নেয়'
        correct: false
        why: 'এটা ভুল ধারণা; আধুনিক warehouse INSERT ও stream নেয়।'
    ref: change-data-capture
  - q: 'কোনগুলোতে CDC-র মতো ডেটাবেস-লগভিত্তিক পদ্ধতি ভালো কাজ করে?'
    hint: 'যেখানে একটা মূল ডেটাবেসের ডেটা অন্য জায়গায় মিলিয়ে রাখতে হয়।'
    options:
      - text: 'মূল ডেটাবেসের পরিবর্তন search index-এ সিঙ্ক রাখা'
        correct: true
        why: 'search index-ও derived data; লগ থেকে বদল পেলে সেটা মূলের সাথে মেলে।'
      - text: 'transactional ডেটাবেস থেকে warehouse-এ প্রায় রিয়েল-টাইমে ডেটা পাঠানো'
        correct: true
        why: 'রাতের পুরো dump-এর বদলে শুধু বদলগুলো পাঠানো যায়।'
      - text: 'গ্রাহকের কাছে এই মুহূর্তের ব্যালেন্স দেখানো'
        correct: false
        why: 'ব্যালেন্স সরাসরি source of truth থেকেই পড়তে হবে, derived কপি থেকে নয়।'
      - text: 'ডেটাবেসের কোনো ডেটা নষ্ট হলে সেটা ঠিক করা'
        correct: false
        why: 'CDC শুধু বদলের কপি পাঠায়, ডেটা মেরামত করে না।'
    ref: change-data-capture
  - q: 'ম্যানেজার এখন শহর ধরে, দিন ধরে বিক্রি চান। view মাস আর ক্যাটাগরি ধরে। সঠিক বোঝাপড়া কোনটা?'
    hint: 'view কোন প্রশ্নের জন্য বানানো হয়েছিল?'
    options:
      - text: 'view এর উত্তর দিতে পারে না; orders-এ query চালালে primary-তে আবার পুরো টেবিল স্ক্যান হবে'
        correct: true
        why: 'Materialized view একটা নির্দিষ্ট query-র উত্তর জমিয়ে রাখে। অন্য প্রশ্ন কাঁচা টেবিলেই যেতে হয়।'
      - text: 'REFRESH নিজে নিজে শহর আর দিন যোগ করে নেবে'
        correct: false
        why: 'refresh একই query নতুন করে চালায়; view-এর কলাম বা গ্রুপিং কখনো বদলায় না।'
      - text: 'সূক্ষ্মতর summary টেবিল, আর প্রশ্ন বদলাতে থাকলে warehouse-ই পথ'
        correct: true
        why: 'শহরসহ দৈনিক টেবিল এই প্রশ্ন সস্তায় মেটায়; warehouse যেকোনো প্রশ্ন মেটায়।'
      - text: 'view প্রতি মিনিটে refresh করলেই সবসময় তাজা থাকবে'
        correct: false
        why: 'প্রতি refresh primary-তে পুরো হিসাব নতুন করে করে, তাই মিনিটে মিনিটে refresh চেকআউটকে আরও বেশি ভোগায়।'
    ref: summary-table-limits
  - q: 'Debezium connector এক ছুটির দিন বন্ধ, কিন্তু তার replication slot রয়ে গেছে। ঝুঁকিটা কী?'
    hint: 'পুরনো লগ ফাইল কখন মুছবে, তা কে ঠিক করে?'
    options:
      - text: 'slot-এর শেষ অবস্থান থেকে সব WAL জমে থাকে, তাই primary-র ডিস্ক ভরে যেতে পারে'
        correct: true
        why: 'slot PostgreSQL-কে জানায় যে কেউ ওই লগ এখনো চায়। টুল না পড়া পর্যন্ত ফাইলগুলো থেকে যায়।'
      - text: 'কিছু না: কয়েক মিনিট পরে লগ এমনিই মুছে যায়'
        correct: false
        why: 'সাধারণত পুরনো WAL ঘুরিয়ে ব্যবহার হয়, কিন্তু slot পাঠক ধরে না ফেলা পর্যন্ত সেটা আটকে রাখে।'
      - text: 'reporting কপি মুছে যায়'
        correct: false
        why: 'reporting কপি শুধু পিছিয়ে পড়ে; সেখানে কিছু মোছে না।'
    ref: change-data-capture
