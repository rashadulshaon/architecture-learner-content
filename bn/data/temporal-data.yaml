slides:
  - slug: history-vanished
    title: 'দাম বদলাল, আর পুরনো ইনভয়েসও বদলে গেল'
    kind: story
    tldr: 'UPDATE পুরনো মান মুছে দেয়। তাই "আগে কত ছিল", "কে বদলাল" বা "তখন কোন দাম চলছিল" জানার উপায় থাকে না।'
    keywords: ['audit', 'history', 'temporal data', 'overwrite', 'ইতিহাস', 'কে বদলাল']
    blocks:
      - type: metaphor
        icon: book
        title: 'মুদি দোকানের বাকির খাতা'
        body: |
          বাকির খাতায় ভুল হলে বুদ্ধিমান দোকানদার কাটাকুটি করে না, নতুন লাইনে "সংশোধন: ৫০ টাকা কম, তারিখ, সই" লেখে। কাটাকুটি করা খাতায় কেউ জানে না আগে কত লেখা ছিল। UPDATE ঠিক সেই কাটাকুটি: পুরনো মান হারিয়ে যায়, কে বা কেন বদলাল তাও না।
      - type: text
        body: |
          রহিমের দোকানে চালের দাম ৮০ থেকে ৯০ টাকা হলো। কেউ `UPDATE products SET price = 90` চালাল। গত সপ্তাহের ইনভয়েস পাতায় এখন ৯০ টাকা দেখাচ্ছে, আর গ্রাহক বলছে "আমি তো ৮০-তে কিনেছিলাম।" কোনো প্রমাণ নেই।
      - type: visual
        kind: compare
        caption: 'একই ঘটনা: মুছে লেখা বনাম ইতিহাস রাখা'
        columns:
          - title: 'শুধু UPDATE'
            tone: bad
            icon: pencil
            tip: 'টেবিলে শুধু বর্তমান অবস্থা থাকে। অতীত সম্পর্কে ডেটাবেস কিছুই জানে না।'
            items:
              - 'ইনভয়েসে এখন ৯০ টাকা'
              - 'কে বদলাল, জানা নেই'
              - 'গত মাসের দাম কত ছিল? জানা নেই'
          - title: 'ইতিহাস রাখা'
            tone: good
            icon: history
            tip: 'বদলের প্রতিটা ধাপ আলাদা সারি হিসেবে জমা থাকে।'
            items:
              - 'ইনভয়েসে বিক্রির সময়ের ৮০ টাকা'
              - 'কে, কখন, কেন বদলাল, লেখা আছে'
              - 'যেকোনো তারিখের দাম জানা যায়'
      - type: quote
        body: 'যে মান কখনো প্রশ্নের মুখে পড়তে পারে, তা মুছে লিখো না; নতুন লাইন যোগ করো।'
    aside:
      - type: story
        title: 'বেতন কে বাড়াল?'
        body: |
          অডিটে ধরা পড়ল এক কর্মীর বেতন তিনবার বদলেছে, কিন্তু টেবিলে আছে শুধু শেষ সংখ্যাটা। কে, কবে, কার অনুমতিতে বদলাল, কোনো উত্তর নেই। অ্যাপে "সর্বশেষ আপডেট" কলাম থাকলেও আগের মান থাকে না।
      - type: terms
        items:
          - {term: 'Audit trail', meaning: 'কে, কখন, কী বদলাল তার অপরিবর্তনীয় তালিকা।'}
          - {term: 'Temporal data', meaning: 'সময়ের সাথে বদলানো ডেটা, যার অতীত অবস্থা জানাও দরকার।'}
    check:
      q: 'ইনভয়েসে পুরনো দাম ঠিক রাখতে দুটো ভিন্ন উপায় কী কী?'
      a: 'বিক্রির সময় দামটা `order_items`-এ কপি করে রাখা (snapshot), অথবা দামের ইতিহাস রেখে "ওই তারিখে কোন দাম চলছিল" দেখে নেওয়া।'

  - slug: audit-history
    title: 'Audit history: কে, কখন, কী বদলাল'
    kind: concept
    tldr: 'প্রতিটা গুরুত্বপূর্ণ বদলে audit টেবিলে একটা নতুন সারি যোগ হয়: কে, কখন, কোন record, আগের ও পরের মান। সারি কখনো বদলায় না বা মোছা হয় না।'
    keywords: ['audit log', 'append-only', 'audit table', 'Doctrine', 'before after', 'অডিট']
    blocks:
      - type: text
        body: |
          খাতার নিয়মেই audit টেবিল: শুধু নতুন লাইন যোগ হয়, পুরনো লাইনে কেউ হাত দেয় না। প্রতিটা সারিতে থাকে **কে** (actor), **কখন**, **কোন** record, কোন কাজ, আগের মান আর পরের মান। এটা মূল টেবিলের সাথে একই transaction-এ লিখতে হয়: মূল বদল সফল হলে audit সারিও থাকবে, ব্যর্থ হলে দুটোই যাবে।
      - type: code
        lang: sql
        file: 'migrations/audit_log.sql'
        variant: good
        code: |
          CREATE TABLE audit_log (
              id          BIGSERIAL PRIMARY KEY,
              occurred_at TIMESTAMPTZ NOT NULL DEFAULT now(),
              actor_id    BIGINT,              -- NULL = সিস্টেম/কনসোল কমান্ড
              entity_type VARCHAR(60) NOT NULL,
              entity_id   BIGINT NOT NULL,
              action      VARCHAR(20) NOT NULL, -- created | updated | deleted
              old_values  JSONB,
              new_values  JSONB
          );
          CREATE INDEX idx_audit_entity ON audit_log (entity_type, entity_id, occurred_at);
        marks:
          - {line: 4, tip: 'NULL মানে কোনো ব্যবহারকারী নয়, যেমন cron বা কনসোল কমান্ড। এটাও জানা দরকার।'}
          - {line: 11, tip: 'প্রায় সব প্রশ্ন "এই record-এর ইতিহাস দেখাও", তাই index এই ক্রমে।'}
      - type: code
        lang: php
        file: 'src/Service/PriceChanger.php'
        variant: good
        code: |
          public function change(Product $p, int $newPrice, User $by): void
          {
              $this->em->wrapInTransaction(function () use ($p, $newPrice, $by): void {
                  $old = $p->getPrice();
                  $p->setPrice($newPrice);

                  $this->db->insert('audit_log', [
                      'actor_id'    => $by->getId(),
                      'entity_type' => 'product',
                      'entity_id'   => $p->getId(),
                      'action'      => 'updated',
                      'old_values'  => json_encode(['price' => $old]),
                      'new_values'  => json_encode(['price' => $newPrice]),
                  ]);
              });
          }
        marks:
          - {line: 3, tip: '`wrapInTransaction` মূল বদল আর audit সারি একসাথে commit বা rollback করে।'}
          - {line: 12, tip: 'আগের আর পরের দুটো মান: "কী ছিল" না জানলে ইতিহাস অসম্পূর্ণ।'}
      - type: points
        title: 'audit টেবিলের নিয়ম'
        style: check
        items:
          - 'শুধু INSERT: অ্যাপের DB ব্যবহারকারীকে UPDATE/DELETE অনুমতি দিও না।'
          - 'actor-এর id থাকবে, শুধু নাম নয় (নাম বদলায়)।'
          - 'পাসওয়ার্ড বা কার্ডের মতো গোপন ডেটা old/new-তে রেখো না।'
    aside:
      - type: tips
        items:
          - 'সব বদল ধরতে চাইলে ডেটাবেসের trigger নিরাপদ, কারণ কনসোল থেকে হাতে চালানো SQL-ও ধরা পড়ে। অ্যাপ-স্তরে লিখলে অ্যাপের বাইরের লেখা ফসকাবে।'
      - type: pitfalls
        items:
          - 'audit লগ আর অ্যাপ-লগ এক নয়। অ্যাপ-লগ ঘুরে ফিরে মুছে যায়, audit ডেটা আইনি প্রমাণ।'
      - type: refs
        items:
          - {to: 'data/data-lifecycle', label: 'audit ডেটা কতদিন রাখবে'}
    check:
      q: 'audit সারি মূল বদলের সাথে একই transaction-এ লিখতে হয় কেন?'
      a: 'মূল বদল হয়ে audit না লেখা (বা উল্টো) হলে ইতিহাসে ফাঁক বা ভুল তথ্য থাকে। একই transaction-এ দুটো একসাথে সফল বা ব্যর্থ হয়।'

  - slug: effective-dating
    title: 'Effective dating: কোন তারিখে কোন দাম'
    kind: howto
    tldr: 'প্রতিটা দামের সারির `valid_from` ও `valid_to` থাকে। "১০ ফেব্রুয়ারি কোন দাম চলছিল" একটা query-তে বের হয়, আর exclusion constraint সময় ওভারল্যাপ ঠেকায়।'
    keywords: ['effective dating', 'valid_from', 'valid_to', 'temporal table', 'EXCLUDE USING gist', 'tstzrange', 'as-of query']
    blocks:
      - type: text
        body: |
          অডিট বলে কে কখন বদলাল; **effective dating** বলে কোন সময়ে কোন মান বৈধ ছিল। দামের টেবিলে সারি বদলানোর বদলে পুরনো সারির `valid_to` বন্ধ করে নতুন সারি যোগ করা হয়। `valid_to` ফাঁকা মানে এখনো চলছে। ভবিষ্যতের তারিখে দাম সেট করাও যায়, যেমন ঈদের অফার ১ তারিখ থেকে। একই পণ্যের দুটো সময় যেন গুলিয়ে না যায়, তাই PostgreSQL-এ exclusion constraint ব্যবহার করো।
      - type: code
        lang: sql
        file: 'migrations/product_prices.sql'
        variant: good
        code: |
          CREATE EXTENSION IF NOT EXISTS btree_gist;

          CREATE TABLE product_prices (
              id         BIGSERIAL PRIMARY KEY,
              product_id BIGINT NOT NULL REFERENCES products (id),
              amount     INT NOT NULL CHECK (amount >= 0),
              valid_from TIMESTAMPTZ NOT NULL,
              valid_to   TIMESTAMPTZ,            -- NULL = এখনো চলছে
              EXCLUDE USING gist (
                  product_id WITH =,
                  (tstzrange(valid_from, valid_to)) WITH &&
              )
          );

          -- ১০ ফেব্রুয়ারি দুপুরে কোন দাম চলছিল?
          SELECT amount FROM product_prices
          WHERE product_id = 7
            AND valid_from <= '2026-02-10 12:00+06'
            AND (valid_to IS NULL OR valid_to > '2026-02-10 12:00+06');
        marks:
          - {line: 9, tip: 'একই পণ্যের দুটো সারির সময়সীমা একে অপরকে ছুঁতে পারবে না। ডেটাবেসই ভুল ঠেকায়।'}
          - {line: 18, tip: 'শুরু থেকে `valid_from <= t`, আর শেষ হয়নি বা `t`-এর পরে শেষ: এই দুই শর্তে ঠিক একটা সারি আসে।'}
      - type: code
        lang: php
        file: 'src/Service/PriceScheduler.php'
        variant: good
        code: |
          public function setPrice(int $productId, int $amount, \DateTimeImmutable $from): void
          {
              $this->em->wrapInTransaction(function () use ($productId, $amount, $from): void {
                  // চলমান দামের মেয়াদ নতুনটার শুরুতে বন্ধ
                  $this->db->executeStatement(
                      'UPDATE product_prices SET valid_to = :from
                       WHERE product_id = :p AND valid_to IS NULL',
                      ['from' => $from, 'p' => $productId],
                      ['from' => Types::DATETIMETZ_IMMUTABLE],
                  );
                  $this->db->insert('product_prices', [
                      'product_id' => $productId, 'amount' => $amount,
                      'valid_from' => $from->format('c'),
                  ]);
              });
          }
        marks:
          - {line: 5, tip: 'পুরনো সারি মোছা হয় না, শুধু `valid_to` বসে। ইতিহাস অটুট থাকে।'}
      - type: visual
        kind: table
        caption: 'পণ্য ৭-এর দামের ইতিহাস'
        headers: ['দাম', 'valid_from', 'valid_to']
        rows:
          - cells: ['৮০ টাকা', '০১ জানু', '১৫ ফেব্রু']
            tip: 'এই সময়ের মধ্যে করা কেনাকাটা ৮০ টাকায়।'
          - cells: ['৯০ টাকা', '১৫ ফেব্রু', 'ফাঁকা (চলছে)']
            tip: '`valid_to` ফাঁকা মানে এটাই বর্তমান দাম।'
    aside:
      - type: remember
        body: 'সারি বদলাও না; পুরনোটা বন্ধ করো, নতুনটা খোলো।'
      - type: tips
        items:
          - 'ইনভয়েসের লাইনে দাম কপি রাখাই সবচেয়ে সোজা। effective dating তখন কাজে লাগে যখন "ওই তারিখে কত ছিল" নিয়মিত জানতে হয়।'
      - type: refs
        items:
          - {to: 'time/time-zones', label: 'Time zone ও সময়ের ভুল'}
    check:
      q: 'দামের টেবিলে একই পণ্যের দুটো সারির সময় ওভারল্যাপ হতে পারে। ডেটাবেসে এটা কীভাবে ঠেকাবে?'
      a: 'PostgreSQL-এ `EXCLUDE USING gist` constraint দিয়ে `product_id` সমান আর সময়সীমা ওভারল্যাপ করলে সারি ঢুকতে না দিয়ে।'

  - slug: soft-delete-traps
    title: 'Soft delete: সুবিধা আর ফাঁদ'
    kind: pitfall
    tldr: 'soft delete মানে `deleted_at` বসানো। কিন্তু unique constraint আটকে যায় আর কোনো query-তে filter ভুলে গেলে মুছা ডেটা দেখা যায়। সমাধান partial unique index আর Doctrine filter।'
    keywords: ['soft delete', 'hard delete', 'deleted_at', 'partial unique index', 'Doctrine SQLFilter', 'unique constraint']
    blocks:
      - type: text
        body: |
          **Soft delete** হলো সারি মুছে না ফেলে `deleted_at` বসিয়ে রাখা, যেন ভুল মোছা ফেরানো যায় আর ইতিহাস থাকে। **Hard delete** সত্যিই সারি মুছে ফেলে। soft delete-এর প্রথম ফাঁদ: `users.email` unique। রহিম অ্যাকাউন্ট মুছে একই ইমেইলে আবার সাইন আপ করতে চাইলে মুছা সারি সেই ইমেইল দখল করে রেখেছে, তাই unique error। দ্বিতীয় ফাঁদ: কোনো query-তে `deleted_at IS NULL` লিখতে ভুলে গেলে মুছা ব্যবহারকারী আবার দেখা দেয়।
      - type: code
        lang: sql
        file: 'migrations/users_email_unique.sql'
        variant: good
        code: |
          -- ভুল: মুছা সারিও ইমেইল দখল করে রাখে
          -- ALTER TABLE users ADD CONSTRAINT uq_users_email UNIQUE (email);

          -- ঠিক: শুধু জীবিত সারির জন্য unique
          CREATE UNIQUE INDEX uq_users_email_active
              ON users (lower(email))
              WHERE deleted_at IS NULL;
        marks:
          - {line: 5, tip: 'partial unique index: `WHERE` শর্তে যে সারিগুলো পড়ে, শুধু সেগুলোর মধ্যেই unique দরকার।'}
          - {line: 6, tip: '`lower(email)` দিয়ে বড়-ছোট হাতের অক্ষরের তফাত নেই।'}
      - type: code
        lang: php
        file: 'src/Doctrine/SoftDeleteFilter.php'
        variant: good
        code: |
          final class SoftDeleteFilter extends SQLFilter
          {
              public function addFilterConstraint(
                  ClassMetadata $targetEntity,
                  string $targetTableAlias,
              ): string {
                  if (!$targetEntity->hasField('deletedAt')) {
                      return '';
                  }

                  return sprintf('%s.deleted_at IS NULL', $targetTableAlias);
              }
          }

          // config/packages/doctrine.yaml
          //   orm: { filters: { soft_delete: { class: App\Doctrine\SoftDeleteFilter,
          //                                    enabled: true } } }
        marks:
          - {line: 11, tip: 'Doctrine প্রতিটা query-র WHERE-এ নিজে এই শর্ত বসায়। কেউ আর ভুলে যায় না।'}
          - {line: 7, tip: '`deletedAt` ফিল্ড নেই এমন entity-তে filter কিছুই যোগ করে না।'}
      - type: visual
        kind: compare
        caption: 'soft delete না hard delete'
        columns:
          - title: 'Soft delete'
            tone: warn
            icon: archive
            tip: 'মুছা ফেরানো আর ইতিহাস রাখা দরকার হলে। কিন্তু ব্যক্তিগত তথ্য থেকেই যায়।'
            items:
              - 'ভুল মোছা ফেরানো যায়'
              - 'ইতিহাস ও রেফারেন্স অটুট'
              - 'filter ও partial unique লাগে'
              - 'ব্যক্তিগত তথ্য সত্যিই মোছা হয় না'
          - title: 'Hard delete'
            tone: default
            icon: trash
            tip: 'সত্যিই সরাতে হলে, যেমন privacy-র অনুরোধ বা মেয়াদ-উত্তীর্ণ ডেটা।'
            items:
              - 'ডেটা সত্যিই চলে যায়'
              - 'foreign key-তে সমস্যা হতে পারে'
              - 'ফেরানো যায় না (backup ছাড়া)'
    aside:
      - type: pitfalls
        items:
          - 'native SQL আর রিপোর্টের query Doctrine filter পায় না। সেখানে হাতে `deleted_at IS NULL` লিখতে হয়।'
          - 'soft delete রাখলে ডেটাবেস ফুলে যায়; মুছার ৩০-৯০ দিন পর hard delete job চালাও।'
      - type: refs
        items:
          - {to: 'data/data-lifecycle', label: 'মুছা ডেটা কখন সত্যিই সরাবে'}
    check:
      q: 'soft delete করা ইমেইল দিয়ে আবার সাইন আপ করতে গেলে unique error আসে। কীভাবে ঠিক করবে?'
      a: 'পুরো কলামের unique constraint বাদ দিয়ে `WHERE deleted_at IS NULL` শর্তের partial unique index বানাও। তখন শুধু জীবিত সারিতে unique খাটে।'

flashcards:
  - q: 'Audit trail কাকে বলে?'
    a: 'কে, কখন, কী বদলাল (আগের ও পরের মানসহ) তার শুধু-যোগ-হয় এমন তালিকা।'
    more: |
      audit টেবিলে সারি শুধু যোগ হয়, কখনো বদলায় না বা মোছা হয় না। এটা দিয়ে বিতর্কে প্রমাণ দেওয়া, ভুল মেরামত করা আর আইনি দায় মেটানো যায়।
    ref: audit-history
  - q: 'audit লগ মূল বদলের সাথে একই transaction-এ লেখা হয় কেন?'
    a: 'যেন মূল বদল আর তার ইতিহাস একসাথে সফল বা ব্যর্থ হয়; একটা ফসকালে ইতিহাসে ফাঁক বা মিথ্যে তথ্য থাকে।'
    more: |
      Doctrine-এ `$em->wrapInTransaction()` ব্যবহার করো। আলাদা transaction-এ লিখলে মূল বদল সফল হয়ে audit ব্যর্থ হওয়ার ফাঁক থেকে যায়। অ্যাপের বাইরের লেখা ধরতে চাইলে ডেটাবেস trigger নিরাপদ।
    ref: audit-history
  - q: 'Effective dating কী?'
    a: 'প্রতিটা মানের সাথে `valid_from` ও `valid_to` রাখা, যেন যেকোনো তারিখে কোন মান বৈধ ছিল তা বলা যায়।'
    more: |
      সারি বদলানোর বদলে পুরনো সারির `valid_to` বন্ধ করে নতুন সারি খোলা হয়। `valid_to` ফাঁকা মানে এখনো চলছে। এতে অতীতের দাম, ভবিষ্যতের নির্ধারিত দাম, দুটোই জানা যায়।
    ref: effective-dating
  - q: 'PostgreSQL-এ সময়সীমার ওভারল্যাপ কীভাবে ঠেকাবে?'
    a: '`EXCLUDE USING gist (product_id WITH =, tstzrange(valid_from, valid_to) WITH &&)` constraint দিয়ে।'
    more: |
      এটা বলে: একই `product_id` আর ওভারল্যাপ করা সময়সীমা, এমন দুটো সারি থাকতে পারবে না। এর জন্য `btree_gist` extension লাগে। অ্যাপের কোডে ভুল থাকলেও ডেটাবেস ভুল ঢুকতে দেয় না।
    ref: effective-dating
  - q: 'Soft delete আর hard delete-এর তফাত কী?'
    a: 'soft delete সারি রেখে `deleted_at` বসায়; hard delete সারি সত্যিই মুছে ফেলে।'
    more: |
      soft delete-এ ভুল মোছা ফেরানো আর ইতিহাস রাখা যায়, কিন্তু ব্যক্তিগত তথ্য থেকে যায় আর filter ভুললে মুছা ডেটা দেখা যায়। privacy-র অনুরোধ বা মেয়াদোত্তীর্ণ ডেটার ক্ষেত্রে শেষমেশ hard delete লাগে।
    ref: soft-delete-traps
  - q: 'soft delete থাকলে email unique constraint কেন ভাঙে?'
    a: 'মুছা সারিও ইমেইলটা দখল করে রাখে, তাই একই ইমেইলে নতুন সারি ঢোকে না।'
    more: |
      সমাধান: সরাসরি `UNIQUE (email)`-এর বদলে partial unique index, `CREATE UNIQUE INDEX ... ON users (lower(email)) WHERE deleted_at IS NULL`। তখন শুধু জীবিত সারির মধ্যে unique খাটে।
    ref: soft-delete-traps
  - q: 'Doctrine-এ প্রতিটা query-তে `deleted_at IS NULL` কীভাবে বসাবে?'
    a: 'একটা `SQLFilter` বানিয়ে `doctrine.yaml`-এ enabled করো; Doctrine নিজে WHERE-এ শর্তটা যোগ করে।'
    more: |
      `addFilterConstraint()`-এ `%s.deleted_at IS NULL` ফেরত দাও। native SQL ও DBAL query-তে filter খাটে না, সেখানে হাতে লিখতে হয়। রিপোর্টের query-তে এটা ভোলা ভুলের বড় উৎস।
    ref: soft-delete-traps
quiz:
  - q: 'বিক্রির পরে পণ্যের দাম বদলালে পুরনো ইনভয়েস ঠিক রাখার সবচেয়ে সহজ উপায় কোনটা?'
    hint: 'ইনভয়েস কীসের উপর দাঁড়িয়ে?'
    options:
      - text: 'বিক্রির সময় `order_items`-এ ইউনিট দাম কপি করে রাখা'
        correct: true
        why: 'ইনভয়েস তখন পণ্যের বর্তমান দামের উপর নির্ভর করে না।'
      - text: 'ইনভয়েস দেখানোর সময় `products.price` পড়া'
        correct: false
        why: 'দাম বদলালে পুরনো ইনভয়েসও বদলে যায়।'
      - text: 'দাম বদলানো নিষিদ্ধ করা'
        correct: false
        why: 'ব্যবসা চলে না।'
      - text: 'প্রতিবার গ্রাহককে ইমেইল করা'
        correct: false
        why: 'ইমেইল রেকর্ড নয়, আর ডেটাবেসে প্রমাণ থাকে না।'
    ref: history-vanished
  - q: 'audit_log-এর জন্য নিচের কোন নিয়মগুলো ঠিক?'
    hint: 'খাতায় কাটাকুটি চলে না।'
    options:
      - text: 'অ্যাপের DB ব্যবহারকারীর শুধু INSERT অনুমতি থাকবে'
        correct: true
        why: 'কেউ ইতিহাস বদলাতে বা মুছতে পারবে না।'
      - text: 'actor-এর নামের বদলে id রাখা'
        correct: true
        why: 'নাম বদলায় বা পুনরাবৃত্ত হয়, id স্থির।'
      - text: 'পুরনো সারি পরিষ্কার রাখতে UPDATE করে সংশোধন করা'
        correct: false
        why: 'সংশোধন নতুন সারি হিসেবে আসা উচিত; পুরনো সারি বদলালে ইতিহাসের মানই নষ্ট।'
      - text: 'পাসওয়ার্ড বদলের হ্যাশও old_values-এ রাখা'
        correct: false
        why: 'গোপন ডেটা লগে ঢোকানো আরেক ঝুঁকি; শুধু "পাসওয়ার্ড বদলেছে" ঘটনা রাখো।'
    ref: audit-history
  - q: 'এই query কী ফেরত দেয় যদি পণ্য ৭-এর দাম ১৫ ফেব্রুয়ারি ৮০ থেকে ৯০ হয়ে থাকে?'
    lang: sql
    code: |
      SELECT amount FROM product_prices
      WHERE product_id = 7
        AND valid_from <= '2026-02-20 10:00+06'
        AND (valid_to IS NULL OR valid_to > '2026-02-20 10:00+06');
    hint: 'প্রশ্নের তারিখ কোন সারির সময়সীমায় পড়ে?'
    options:
      - text: '৯০, কারণ ২০ ফেব্রুয়ারি ১৫ ফেব্রুয়ারির পরে এবং দ্বিতীয় সারির `valid_to` ফাঁকা'
        correct: true
        why: 'প্রথম সারির `valid_to` ১৫ ফেব্রুয়ারি, যা ২০ তারিখের আগে। বাদ। দ্বিতীয়টা মেলে।'
      - text: '৮০'
        correct: false
        why: 'প্রথম সারির সময় ১৫ ফেব্রুয়ারিতে শেষ; ২০ তারিখ তার বাইরে।'
      - text: 'দুটো সারি'
        correct: false
        why: 'exclusion constraint থাকলে একই সময়ে একটা সারিই মেলে।'
      - text: 'কিছুই না'
        correct: false
        why: 'দ্বিতীয় সারি মেলে।'
    ref: effective-dating
  - q: 'soft delete ব্যবহারকারী টেবিলে ইমেইলে সাধারণ UNIQUE আছে। রহিম অ্যাকাউন্ট মুছে একই ইমেইলে আবার নিবন্ধন করতে পারছে না। কেন, আর সমাধান?'
    hint: 'মুছা সারি আসলে মুছেনি।'
    options:
      - text: 'মুছা সারিও ইমেইল ধরে রেখেছে; `WHERE deleted_at IS NULL` দিয়ে partial unique index বানাও'
        correct: true
        why: 'unique শুধু জীবিত সারির মধ্যে খাটবে, মুছা সারি আর বাধা নয়।'
      - text: 'সব সময় hard delete করো, soft delete ছেড়ে দাও'
        correct: false
        why: 'অনেক ক্ষেত্রে ইতিহাস দরকার; ফাঁদ জানলে soft delete সামলানো যায়।'
      - text: 'ইমেইলের শেষে random সংখ্যা জুড়ে দাও'
        correct: false
        why: 'ডেটা নোংরা হয় আর আসল ইমেইলের পরিচয় নষ্ট হয়।'
      - text: 'unique constraint সরিয়ে দাও'
        correct: false
        why: 'তখন দুজন জীবিত ব্যবহারকারী একই ইমেইল পেতে পারে।'
    ref: soft-delete-traps
  - q: 'অ্যাডমিনের রিপোর্ট পাতায় মুছে ফেলা ব্যবহারকারীদেরও দেখা যাচ্ছে, অথচ বাকি অ্যাপে দেখা যায় না। সম্ভাব্য কারণ?'
    hint: 'রিপোর্টের query কীভাবে লেখা?'
    options:
      - text: 'রিপোর্ট native SQL বা DBAL-এ লেখা, তাই Doctrine soft delete filter খাটেনি'
        correct: true
        why: 'filter শুধু ORM/DQL query-তে খাটে; native SQL-এ হাতে `deleted_at IS NULL` দিতে হয়।'
      - text: 'Doctrine ভুলভাবে মোছা ডেটা ফেরত আনে'
        correct: false
        why: 'filter ঠিকই চলে, কিন্তু সব query-তে নয়।'
      - text: 'ডেটাবেসে ডেটা মোছাই যায়নি'
        correct: false
        why: 'বাকি অ্যাপে তো দেখা যাচ্ছে না, তাই `deleted_at` ঠিকই বসেছে।'
      - text: 'রিপোর্ট cache-এ আছে'
        correct: false
        why: 'cache-এর কারণ হতে পারে, কিন্তু আগে native query-র filter পরীক্ষা করো।'
    ref: soft-delete-traps
