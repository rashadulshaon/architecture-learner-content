slides:
  - slug: same-sql-different-engine
    title: 'একই SQL, ভেতরে আলাদা ইঞ্জিন'
    kind: story
    tldr: 'ডেটাবেসের ভেতরের storage engine ঠিক করে কোন কাজ দ্রুত, কোনটা ধীর; লেখা-প্রধান আর পড়া-প্রধান কাজে তাই একই ইঞ্জিন সমান ভালো নয়।'
    keywords: ['storage engine', 'B-tree', 'LSM-tree', 'write heavy', 'read heavy', 'স্টোরেজ ইঞ্জিন']
    blocks:
      - type: metaphor
        icon: shop
        title: 'দুই রকম দোকানের খাতা'
        body: |
          একটা দোকানে প্রতিটা বিক্রি লেখা হয় বর্ণানুক্রমে সাজানো মূল খাতার ঠিক পাতায়। খুঁজতে সহজ, কিন্তু লেখার সময় পাতা খুলে জায়গা খুঁজতে হয়। আরেক দোকানে সব বিক্রি আগে কাউন্টারের প্যাডে পরপর লেখা হয়, সন্ধ্যায় সাজিয়ে মূল খাতায় তোলা হয়। এই দুই দোকানই দুই ধরনের ইঞ্জিনের ছবি।
      - type: visual
        kind: compare
        caption: 'কাজের ধরন বদলালে ইঞ্জিনের সুবিধাও বদলায়'
        columns:
          - title: 'পড়া-প্রধান অ্যাপ'
            tone: good
            icon: eye
            tip: 'ডেটা বেশি পড়া হয়, লেখা কম। এখানে সাজানো খাতা (B-tree) সবচেয়ে আরামদায়ক।'
            items:
              - 'ই-কমার্সের পণ্য, অর্ডার দেখা'
              - 'প্রতি লেখার বিপরীতে ১০০ বার পড়া'
              - 'যেকোনো row দ্রুত খুঁজে পাওয়া জরুরি'
          - title: 'লেখা-প্রধান অ্যাপ'
            tone: warn
            icon: send
            tip: 'প্রতি সেকেন্ডে হাজার হাজার নতুন row আসে, পড়া তুলনায় কম। এখানে জমিয়ে-লেখা ইঞ্জিন (LSM) ভালো মানায়।'
            items:
              - 'sensor, log, chat, event: ১,০০০ sensor প্রতি সেকেন্ডে মাপ পাঠালে সেকেন্ডে ১,০০০ লেখা'
              - 'নতুন ডেটা শুধু যোগ হয়'
              - 'লেখার গতিই আসল বাধা'
      - type: quote
        body: 'SQL একই, কিন্তু ভেতরের ইঞ্জিন ঠিক করে কোন কাজ সস্তা আর কোনটা দামি।'
    aside:
      - type: problem
        body: 'ডেটাবেস বাছার সময় শুধু "SQL আছে কি না" দেখলে হবে না। জানতে হবে ভেতরে ডেটা কীভাবে ডিস্কে বসে, কারণ তাতেই লেখা-পড়ার খরচ ঠিক হয়।'
      - type: refs
        items:
          - {to: 'data/choosing-database', label: 'কাজ দেখে ডেটাবেস বাছা'}
          - {to: 'data/indexing', label: 'B-tree index'}
    check:
      q: 'দুটো ডেটাবেস দুটোই SQL বোঝে, তবু একটা লেখায় দ্রুত আর অন্যটা পড়ায়। কেন?'
      a: 'কারণ তাদের ভেতরের storage engine আলাদা। একটা ডেটা ঠিক জায়গায় সাজিয়ে বসায় (পড়া দ্রুত), অন্যটা আগে জমায় আর পরে সাজায় (লেখা দ্রুত)।'

  - slug: btree-vs-lsm
    title: 'B-tree বনাম LSM-tree'
    kind: concept
    tldr: 'B-tree লেখার সময়েই ঠিক জায়গা খুঁজে বসায়, তাই পড়া ভালো; LSM-tree লেখা আগে জমায় আর পরে সাজায়, তাই লেখা ভালো।'
    keywords: ['B-tree', 'LSM-tree', 'write amplification', 'read amplification', 'trade-off', 'ইঞ্জিন তুলনা']
    blocks:
      - type: metaphor
        icon: book
        title: 'মূল খাতা বনাম কাউন্টারের প্যাড'
        body: |
          B-tree মানে সাজানো মূল খাতা: প্রতিটা নতুন লেখার জন্য পাতা খুঁজে সঠিক লাইনে বসাতে হয়, তাই লেখা তুলনায় ধীর; কিন্তু যেকোনো খদ্দেরের হিসাব এক পাতায় মেলে। LSM মানে কাউন্টারের প্যাড: যা আসে পরপর লিখে যান, দ্রুত। পরে সন্ধ্যায় সাজাতে হয়, আর কিছু খুঁজতে হলে প্যাড আর পুরনো পাতা দুটোই দেখতে হতে পারে।
      - type: visual
        kind: compare
        caption: 'একই কাজ, দুই ইঞ্জিনে'
        columns:
          - title: 'B-tree'
            tone: accent
            icon: layers
            tip: 'PostgreSQL, MySQL (InnoDB)-র ইঞ্জিন। ডেটা সাজানো পাতায় থাকে, লেখার সময় পাতা বদলানো হয়।'
            items:
              - 'লেখা: ঠিক পাতা খুঁজে সেখানে বসানো'
              - 'পড়া: গাছ বেয়ে নেমে সরাসরি পাওয়া'
              - 'ছড়ানো জায়গায় লেখা, তাই ডিস্কে random write'
              - 'পাতা ভরে গেলে ভেঙে দুই ভাগ, বাড়তি লেখা লাগে'
          - title: 'LSM-tree'
            tone: good
            icon: archive
            tip: 'Cassandra, RocksDB-র ইঞ্জিন। নতুন লেখা সবসময় শেষে যোগ হয়, তারপর ব্যাকগ্রাউন্ডে সাজানো হয়।'
            items:
              - 'লেখা: মেমোরিতে জমা, ডিস্কে শুধু শেষে যোগ'
              - 'পড়া: একাধিক ফাইল দেখতে হতে পারে'
              - 'ডিস্কে ক্রমিক (sequential) লেখা, যা দ্রুত'
              - 'ব্যাকগ্রাউন্ডে compaction চলে'
      - type: points
        title: 'এই বিনিময়ের তিন নাম'
        style: dot
        items:
          - 'Write amplification: একটা লেখার জন্য ডিস্কে আসলে কতবার লেখা হয়। ১০০ বাইট বদলাতে B-tree পুরো পাতা (৮-১৬ KB) লেখে; LSM প্রতি compaction-এ আবার।'
          - 'Read amplification: একটা মান পেতে কতগুলো জায়গা দেখতে হয়।'
          - 'Space amplification: সত্যিকারের ডেটার চেয়ে কতটা বেশি জায়গা লাগে।'
    aside:
      - type: remember
        body: 'B-tree পড়ার বন্ধু, LSM লেখার বন্ধু। কিন্তু দুটোরই কিছু না কিছু দাম আছে।'
      - type: tips
        items:
          - 'LSM-এও পড়া দ্রুত করা যায় (Bloom filter দিয়ে "এই ফাইলে নেই" আগেই জেনে), তবে B-tree-র মতো সরল নয়।'
          - 'সংখ্যা বড় কথা নয়, কাজের ধরনই বড়: নিজের access pattern দেখে বাছুন।'
    check:
      q: 'লেখা-প্রধান কাজে LSM-tree কেন সাধারণত দ্রুত লেখে?'
      a: 'কারণ নতুন লেখা মেমোরিতে জমে আর ডিস্কে শেষে যোগ হয়, ক্রমিক লেখা। B-tree-র মতো ছড়ানো পাতা খুঁজে বদলানোর দরকার হয় না।'

  - slug: wal-memtable-compaction
    title: 'WAL, memtable, SSTable আর compaction'
    kind: concept
    tldr: 'লেখা আগে WAL-এ (নিরাপত্তা), তারপর মেমোরিতে (গতি), ভরলে ডিস্কের ফাইলে নামে; পরে compaction ফাইল মিলিয়ে পুরনো আর ডুপ্লিকেট সাফ করে।'
    keywords: ['WAL', 'write ahead log', 'memtable', 'SSTable', 'compaction', 'durability', 'ক্র্যাশ রিকভারি']
    blocks:
      - type: metaphor
        icon: book
        title: 'রোজনামচা আর কাউন্টারের প্যাড'
        body: |
          দোকানি কিছু করার আগেই রোজনামচায় লিখে রাখেন "আজ এত বিক্রি"। বিদ্যুৎ গেলেও রোজনামচা দেখে সব ফিরিয়ে আনা যায়। এটাই WAL। প্যাড ভরে গেলে সেটা ফাইলে তুলে রাখা হয়, আর মাঝে মাঝে সব ফাইল মিলিয়ে নতুন সাজানো একটা বানানো হয়, যেখানে কাটা-পড়া আর পুরনো লাইন নেই। সেটাই compaction।
      - type: visual
        kind: flow
        caption: 'LSM-tree-তে একটা লেখা যে পথে যায়'
        nodes:
          - {id: app, label: 'অ্যাপ', sub: 'INSERT / PUT', icon: api, col: 0, row: 1, tip: 'নতুন একটা লেখা পাঠায়।'}
          - {id: wal, label: 'WAL', sub: 'ডিস্কে শেষে যোগ', icon: history, tone: accent, col: 1.5, row: 0, tip: 'Write-ahead log: আগে এখানে লেখা হয়। সার্ভার ক্র্যাশ করলে এটা পড়ে সব ফিরে আসে।'}
          - {id: mem, label: 'memtable', sub: 'মেমোরিতে সাজানো', icon: cache, col: 1.5, row: 2, tip: 'মেমোরিতে সাজানো তালিকা। পড়া আর লেখা দুটোই এখানে দ্রুত।'}
          - {id: sst, label: 'SSTable ফাইল', sub: 'ডিস্কে অপরিবর্তনীয়', icon: file, col: 3, row: 1, tip: 'memtable ভরলে সাজানো অবস্থায় ডিস্কে নামে। একবার লেখা হলে আর বদলায় না।'}
          - {id: comp, label: 'compaction', sub: 'ব্যাকগ্রাউন্ড', icon: gear, col: 4, row: 1, tip: 'অনেক ছোট ফাইল মিলিয়ে বড় সাজানো ফাইল বানায়, পুরনো মান আর মুছে ফেলা row সাফ করে।'}
        edges:
          - {from: app, to: wal, label: 'আগে WAL-এ লেখা হয়, যাতে ক্র্যাশেও কিছু না হারায়'}
          - {from: app, to: mem, label: 'একই লেখা মেমোরির memtable-এও বসে'}
          - {from: mem, to: sst, label: 'memtable ভরলে সাজানো অবস্থায় SSTable ফাইল হয়ে নামে'}
          - {from: sst, to: comp, label: 'পরে compaction অনেক ফাইল মিলিয়ে একটা পরিষ্কার ফাইল বানায়', tone: good}
      - type: text
        body: |
          ধরুন memtable-এ শেষ ১০,০০০ লেখা শুধু RAM-এ আছে, আর হঠাৎ বিদ্যুৎ গেল। WAL না থাকলে সব হারায়। WAL থাকলে সার্ভার চালু হয়ে লগ পড়ে ১০,০০০টাই ফিরিয়ে আনে।
      - type: quote
        body: 'আগে WAL-এ লিখুন, তারপর বাকি কাজ। ক্র্যাশের পরে WAL পড়েই ডেটাবেস ফিরে আসে।'
    aside:
      - type: terms
        items:
          - {term: 'WAL', meaning: 'যেকোনো বদল আসল জায়গায় বসানোর আগে একটা ক্রমিক লগে লিখে রাখা।'}
          - {term: 'SSTable', meaning: 'Sorted String Table: সাজানো, একবার লিখলে না-বদলানো ডিস্ক ফাইল।'}
          - {term: 'Compaction', meaning: 'অনেক ফাইল মিলিয়ে পুরনো ও মোছা ডেটা বাদ দিয়ে নতুন ফাইল বানানো।'}
      - type: story
        title: 'WAL B-tree-তেও আছে'
        body: 'WAL শুধু LSM-এর জিনিস নয়। PostgreSQL প্রতিটা বদল পাতার আগে WAL-এ লেখে, MySQL InnoDB একই কাজ করে redo log দিয়ে। PostgreSQL-এর replication এই WAL ধরে চলে; MySQL চলে আলাদা binary log ধরে।'
    check:
      q: 'LSM-tree-তে লেখা মেমোরিতে জমা হয়, তবু সার্ভার ক্র্যাশ করলে ডেটা হারায় না কেন?'
      a: 'কারণ প্রতিটা লেখা আগে ডিস্কের WAL-এ শেষে যোগ হয়। ক্র্যাশের পরে ডেটাবেস WAL পড়ে memtable-এর ডেটা আবার বানিয়ে নেয়।'

  - slug: which-database-which-engine
    title: 'কোন ডেটাবেস কোন ইঞ্জিন, কখন কোনটা'
    kind: compare
    tldr: 'PostgreSQL ও MySQL (InnoDB) B-tree-ভিত্তিক; Cassandra, ScyllaDB ও RocksDB LSM-ভিত্তিক। সাধারণ ব্যবসায়িক অ্যাপে B-tree-ই default।'
    keywords: ['PostgreSQL', 'InnoDB', 'Cassandra', 'RocksDB', 'LSM', 'database engines', 'কোন ডেটাবেস']
    blocks:
      - type: visual
        kind: table
        caption: 'দুই পরিবারের তুলনা'
        headers: ['', 'B-tree', 'LSM-tree']
        rows:
          - cells: ['লেখা', 'মাঝারি, ছড়ানো পাতায়', 'দ্রুত, শেষে যোগ']
            tip: 'LSM-এর লেখার ক্ষমতা বেশি, কারণ ডিস্কে ক্রমিক লেখা সস্তা।'
          - cells: ['পড়া', 'দ্রুত, অনুমানযোগ্য', 'ভালো, কিন্তু একাধিক ফাইল দেখতে পারে']
            tip: 'B-tree-তে একটা মান পেতে গাছ বেয়ে নামলেই হয়। LSM-এ memtable ও কয়েক স্তরের ফাইল দেখতে হতে পারে।'
          - cells: ['ব্যাকগ্রাউন্ড কাজ', 'কম (vacuum, checkpoint)', 'বেশি (compaction চলে)']
            tip: 'LSM-এ compaction ডিস্ক আর CPU খায়; চরম চাপে লেখার গতি হঠাৎ কমতে পারে।'
          - cells: ['ডিস্কের জায়গা', 'পাতায় ফাঁকা থাকে', 'পুরনো কপি জমে, compaction-এ সাফ']
            tip: 'দুটোতেই ডেটার চেয়ে বেশি জায়গা লাগে; কারণ আলাদা।'
          - cells: ['উদাহরণ', 'PostgreSQL, MySQL InnoDB, SQLite', 'Cassandra, ScyllaDB, RocksDB, HBase']
            tip: 'MongoDB-র WiredTiger default-এ B-tree, কিন্তু LSM বিকল্পও আছে। Redis মূলত মেমোরিতে থাকে, আলাদা ধরন।'
      - type: points
        title: 'সিদ্ধান্তের নিয়ম'
        style: check
        items:
          - 'সাধারণ ব্যবসায়িক অ্যাপ (অর্ডার, ব্যবহারকারী, payment; সেকেন্ডে কয়েক দশ থেকে কয়েকশো লেখা): B-tree, মানে PostgreSQL বা MySQL।'
          - 'বিশাল ক্রমাগত লেখা, query জানা (log, sensor, chat; সেকেন্ডে কয়েক হাজার থেকে বেশি): LSM-ভিত্তিক ডেটাবেস ভাবুন।'
          - 'অনিশ্চিত থাকলে B-tree। আগে মাপুন, তারপর বদলান।'
    aside:
      - type: when
        use:
          - 'LSM: লেখা পড়ার চেয়ে বহুগুণ বেশি, আর ডেটা মূলত যোগ হয়'
          - 'B-tree: জড়ানো ডেটা, join, transaction, যেকোনো প্রশ্ন'
        avoid:
          - 'শুধু "নতুন, দ্রুত" শুনে ছোট অ্যাপে LSM ডেটাবেস'
      - type: refs
        items:
          - {to: 'data/choosing-database', label: 'কাজ দেখে ডেটাবেস বাছা'}
          - {to: 'data/sharding', label: 'এক সার্ভারে না ধরলে sharding'}
    check:
      q: 'অর্ডার আর payment-এর মূল ডেটাবেস কোন ধরনের ইঞ্জিনে রাখাই সাধারণ পছন্দ?'
      a: 'B-tree-ভিত্তিক relational ডেটাবেস (PostgreSQL বা MySQL)। জড়ানো ডেটা, transaction আর যেকোনো query সেখানে সহজ; লেখার চাপ সাধারণত এক সার্ভারেই ধরে।'

  - slug: durability-switch-pitfall
    title: 'ধীর লাগছে বলে durability বন্ধ করা'
    kind: pitfall
    tldr: 'fsync বন্ধ করলে লেখা দ্রুত হয় কিন্তু ক্র্যাশে ডেটাবেসই নষ্ট হতে পারে; অপ্রয়োজনীয় ডেটার জন্য শুধু একটা transaction-এ synchronous_commit বন্ধ রাখাই নিরাপদ।'
    keywords: ['fsync', 'synchronous_commit', 'durability', 'WAL flush', 'PostgreSQL config', 'লেখা দ্রুত']
    blocks:
      - type: text
        body: |
          INSERT ধীর লাগলে অনেকে `fsync = off` লিখে ফেলে, কারণ ডিস্কে জোর করে লেখা বন্ধ হলে সংখ্যা দারুণ দেখায়। কিন্তু তখন বিদ্যুৎ গেলে ডেটাবেসের ফাইলই অসম্পূর্ণ লেখা নিয়ে নষ্ট হতে পারে। `synchronous_commit` আলাদা: এটা বন্ধ করলে শুধু শেষের এক সেকেন্ডেরও কম সময়ের commit হারাতে পারে (ডিফল্টে সর্বোচ্চ প্রায় ০.৬ সেকেন্ড), ফাইল নষ্ট হয় না।
      - type: code
        lang: ini
        file: 'postgresql.conf'
        variant: bad
        code: |
          fsync = off                # বিপজ্জনক: ক্র্যাশে ডেটাবেস নষ্ট হতে পারে
          full_page_writes = off     # বিপজ্জনক
        marks:
          - {line: 1, tip: 'ডিস্কে পৌঁছেছে কি না নিশ্চিত না করেই "হয়ে গেছে" বলে। প্রোডাকশনে কখনো নয়।'}
      - type: code
        lang: php
        file: 'src/Service/ClickLogger.php'
        variant: good
        code: |
          public function log(array $events): void
          {
              $this->connection->transactional(function (Connection $c) use ($events): void {
                  // শুধু এই transaction-এর জন্য; নিরাপদ নয় এমন ডেটার ক্ষেত্রে
                  $c->executeStatement('SET LOCAL synchronous_commit = off');

                  foreach ($events as $e) {
                      $c->insert('click_event', ['page' => $e['page'], 'at' => $e['at']]);
                  }
              });
          }
        marks:
          - {line: 5, tip: 'SET LOCAL শুধু বর্তমান transaction-এ খাটে। বাকি অ্যাপে আগের নিরাপদ নিয়মই থাকে। শুধু ক্লিক-লগের মতো হারালে ক্ষতি নেই এমন ডেটার জন্য।'}
          - {line: 7, tip: 'একটা transaction-এ অনেক row লেখা, প্রতি row-এর আলাদা commit-এর চেয়ে অনেক সস্তা।'}
      - type: quote
        body: 'টাকার ডেটায় durability বন্ধ করবেন না। লেখা ধীর হলে আগে batch করুন, তারপর ঠিক করুন।'
    aside:
      - type: pitfalls
        items:
          - 'payment, অর্ডার, ব্যালেন্সে synchronous_commit = off কখনো নয়: "সফল" বলার পরেও ডেটা হারাতে পারে।'
          - 'প্রতি row-এ আলাদা commit সবচেয়ে বড় কারণ। অনেক row এক transaction-এ লেখাই প্রথম ওষুধ।'
      - type: refs
        items:
          - {to: 'concurrency/acid', label: 'Durability ACID-এর D'}
    check:
      q: 'fsync = off আর synchronous_commit = off-এর মধ্যে বড় পার্থক্য কী?'
      a: 'fsync বন্ধ করলে ক্র্যাশে ডেটাবেসই নষ্ট হতে পারে। synchronous_commit বন্ধ করলে ফাইল ঠিক থাকে, শুধু শেষ এক সেকেন্ডেরও কম সময়ের commit হারাতে পারে।'

  - slug: batch-before-tuning
    title: 'ধীর INSERT: আগে batch, তারপর tuning'
    kind: pitfall
    tldr: 'প্রতিটা commit একবার ডিস্ক flush-এর জন্য অপেক্ষা করে। ১,০০০ আলাদা commit মানে ১,০০০ বার অপেক্ষা; ১,০০০ row-র এক transaction মানে একবার, আর কোনো ঝুঁকি নেই।'
    keywords: ['batch insert', 'transaction', 'commit', 'fsync cost', 'array_chunk', 'slow inserts', 'ধীর INSERT']
    blocks:
      - type: text
        body: |
          commit ততক্ষণ ফেরে না, যতক্ষণ তার WAL রেকর্ড ডিস্কে flush না হয়: দোকানি রোজনামচায় লাইন না লিখে যেমন রসিদ দেন না। সাধারণ ক্লাউড ডিস্কে একটা flush-এ কয়েক মিলিসেকেন্ড লাগে; ধরা যাক ৫ ms। ১,০০০টা ক্লিক row একটা একটা করে সেভ করলে ১,০০০ বার flush, প্রায় ৫ সেকেন্ড। এক transaction-এ সেভ করলে ১ বার flush, প্রায় ৫ ms, সঙ্গে insert-গুলোর নিজের সময়।
      - type: visual
        kind: bars
        caption: 'একটা flush ৫ ms হলে ১,০০০ row সেভ করতে কত সময় লাগে'
        items:
          - {label: '১,০০০ commit', value: 5000, display: 'প্রায় ৫ সেকেন্ড', tone: bad, tip: 'Autocommit: প্রতিটা INSERT নিজেই একটা transaction, তাই প্রতিটা নিজের flush-এর অপেক্ষায়। ১,০০০ x ৫ ms।'}
          - {label: '১ transaction', value: 60, display: 'প্রায় ০.০৬ সেকেন্ড', tone: good, tip: 'একবার flush (৫ ms) আর ১,০০০ insert-এর নিজের সময়। প্রায় ৮০ গুণ দ্রুত, আর durability ছাড়তে হয়নি।'}
      - type: code
        lang: php
        file: 'src/Service/ClickLogger.php'
        variant: bad
        code: |
          foreach ($events as $e) {
              // autocommit: প্রতিটা insert নিজেই একটা transaction, নিজেরই flush
              $this->connection->insert('click_event', ['page' => $e['page'], 'at' => $e['at']]);
          }
        marks:
          - {line: 2, tip: 'লুপটা কোনো transaction-এ মোড়া নেই, তাই PostgreSQL প্রতিটা row-র পরেই commit করে।'}
      - type: code
        lang: php
        file: 'src/Service/ClickLogger.php'
        variant: good
        code: |
          // প্রতি chunk-এ এক transaction: প্রতি ১,০০০ row-তে একবার flush
          foreach (array_chunk($events, 1000) as $chunk) {
              $this->connection->transactional(function (Connection $c) use ($chunk): void {
                  foreach ($chunk as $e) {
                      $c->insert('click_event', ['page' => $e['page'], 'at' => $e['at']]);
                  }
              });
          }
        marks:
          - {line: 2, tip: 'একটা বিশাল transaction নয়, chunk: বিশাল transaction অনেকক্ষণ lock ধরে রাখে, আর একটা খারাপ row সবকিছু rollback করে দেয়।'}
    aside:
      - type: tips
        items:
          - 'Doctrine-এর `$em->flush()` সব অপেক্ষমান বদল আগে থেকেই এক transaction-এ চালায়। batch-প্রতি একবার ডাকুন, entity-প্রতি নয়।'
      - type: when
        use:
          - 'অনেক row একসাথে আসে: import, event batch, queue consumer।'
        avoid:
          - 'আলাদা অনুরোধে একটা করে row এলে batch চলে না। আগে queue-তে জমান, বা হারানো-চলে এমন ডেটায় synchronous_commit = off।'
    check:
      q: '১,০০০ আলাদা commit কেন ১,০০০ row-র এক transaction-এর চেয়ে অনেক ধীর?'
      a: 'প্রতিটা commit নিজের ডিস্ক flush-এর অপেক্ষা করে। ১,০০০ commit মানে ১,০০০ বার অপেক্ষা (৫ ms করে প্রায় ৫ সেকেন্ড); এক transaction একবারই অপেক্ষা করে।'

flashcards:
  - q: 'Storage engine কী?'
    a: 'ডেটাবেসের যে অংশ ঠিক করে ডেটা ডিস্কে কীভাবে লেখা আর পড়া হবে।'
    more: |
      SQL একই থাকলেও ভেতরের ইঞ্জিন আলাদা হতে পারে। তা-ই ঠিক করে কোন কাজ দ্রুত আর কোনটা ধীর: লেখা, পড়া, range query বা বড় ডেটা। তাই ডেটাবেস বাছার সময় শুধু ফিচার নয়, ইঞ্জিনও দেখতে হয়।
    ref: same-sql-different-engine
  - q: 'B-tree ইঞ্জিন লেখার সময় কী করে, আর তার ফলে কী হয়?'
    a: 'ঠিক সাজানো পাতা খুঁজে সেখানে বসায়। পড়া দ্রুত হয়, কিন্তু ছড়ানো পাতায় লেখার জন্য random write লাগে।'
    more: |
      পাতা ভরে গেলে দুই ভাগে ভাঙে। এটা দ্রুত পড়ার দাম: ডেটা সবসময় সাজানো থাকে, তাই গাছ বেয়ে নেমে সরাসরি পাওয়া যায়। PostgreSQL, MySQL InnoDB আর SQLite-এর ইঞ্জিন।
    ref: btree-vs-lsm
  - q: 'LSM-tree কেন লেখায় দ্রুত?'
    a: 'লেখা মেমোরিতে জমে আর ডিস্কে শেষে যোগ হয়, ক্রমিক লেখা; ছড়ানো পাতা বদলাতে হয় না।'
    more: |
      Log-Structured Merge-tree-তে ডিস্কের ফাইল একবার লিখলে বদলায় না। পরে ব্যাকগ্রাউন্ডে compaction সেগুলো মিলিয়ে সাজায়। বিনিময়ে পড়ার সময় একাধিক ফাইল দেখতে হতে পারে।
    ref: btree-vs-lsm
  - q: 'WAL কী, আর কেন দরকার?'
    a: 'বদল আসল জায়গায় বসানোর আগে ক্রমিক লগে লিখে রাখা; ক্র্যাশের পরে এটা পড়ে ডেটা ফেরানো যায়।'
    more: |
      WAL-এ শেষে যোগ করা সস্তা, আবার ডিস্কে পৌঁছালে "হয়ে গেছে" বলাও নিরাপদ। সার্ভার ক্র্যাশ করলে মেমোরির ডেটা হারায়, কিন্তু WAL থেকে সেগুলো আবার বানানো হয়। PostgreSQL, MySQL, Cassandra সবাই WAL বা সমতুল্য লগ ব্যবহার করে।
    ref: wal-memtable-compaction
  - q: 'Compaction কী কাজ করে?'
    a: 'LSM-এর অনেক সাজানো ফাইল মিলিয়ে একটা নতুন ফাইল বানায়, পুরনো মান আর মোছা row বাদ দিয়ে।'
    more: |
      compaction ছাড়া ফাইল জমতেই থাকত, আর পড়ার সময় অনেক ফাইল দেখতে হতো। এটা ব্যাকগ্রাউন্ডে ডিস্ক আর CPU খায়, তাই চরম লেখার চাপে ডেটাবেস হঠাৎ ধীর হতে পারে। এটাই LSM-এর প্রধান দাম।
    ref: wal-memtable-compaction
  - q: 'Write amplification কী?'
    a: 'একটা লেখার জন্য ডিস্কে আসলে কতবার লেখা হয়, তার অনুপাত: WAL, ফাইল আর compaction মিলিয়ে।'
    more: |
      যত বেশি amplification, তত বেশি ডিস্ক ক্ষয় আর কম গতি। B-tree-তে ছোট একটা বদলেও পুরো পাতা আবার লিখতে হয়। LSM-এ একই ডেটা compaction-এ একাধিকবার নতুন ফাইলে লেখা হয়। দুই ইঞ্জিনেই আছে, ধরনটা আলাদা।
    ref: btree-vs-lsm
  - q: 'কোন কোন ডেটাবেস B-tree, আর কোনগুলো LSM?'
    a: 'B-tree: PostgreSQL, MySQL InnoDB, SQLite। LSM: Cassandra, ScyllaDB, RocksDB, HBase।'
    more: |
      সাধারণ ব্যবসায়িক অ্যাপে B-tree-ভিত্তিক relational ডেটাবেস default। বিশাল ক্রমাগত লেখা আর জানা query থাকলে (log, sensor, chat) LSM-ভিত্তিক ডেটাবেস ভাবা যায়।
    ref: which-database-which-engine
  - q: '১,০০০ row একটা একটা করে commit করা কেন ধীর, আর প্রথম সমাধান কী?'
    a: 'প্রতিটা commit নিজের ডিস্ক flush-এর অপেক্ষা করে (৫ ms করে মোট প্রায় ৫ সেকেন্ড)। row-গুলো প্রায় ১,০০০টার chunk করে এক transaction-এ লিখুন।'
    more: |
      batch করলে durability পুরোটাই থাকে: transaction commit হলে ডেটা নিরাপদে ডিস্কে। batch করার পরেও ধীর প্রমাণিত হলে তবেই synchronous_commit = off ভাবুন, আর শুধু হারালে ক্ষতি নেই এমন ডেটায়।
    ref: batch-before-tuning

quiz:
  - q: 'একটা IoT কোম্পানির ১০ লাখ sensor প্রতি সেকেন্ডে মাপ পাঠায়। পড়া হয় কম, শুধু সময়ের জানালা ধরে। কোন ইঞ্জিন-পরিবার সবচেয়ে ভালো মানায়?'
    hint: 'লেখার চাপ বিশাল, ডেটা শুধু যোগ হয়।'
    options:
      - text: 'LSM-ভিত্তিক, কারণ লেখা জমিয়ে শেষে যোগ হয়'
        correct: true
        why: 'ক্রমিক লেখা সস্তা, আর পড়ার ধরন আগে থেকে জানা। এটাই LSM-এর শক্তির জায়গা।'
      - text: 'B-tree-ভিত্তিক, কারণ B-tree সবসময় দ্রুত'
        correct: false
        why: 'বিশাল লেখার চাপে ছড়ানো পাতা বদলানো বোঝা হয়ে ওঠে। "সবসময় দ্রুত" বলে কিছু নেই।'
      - text: 'কোনো ইঞ্জিনই চলবে না'
        correct: false
        why: 'এ ধরনের কাজের জন্যই LSM-ভিত্তিক ও time-series ডেটাবেস বানানো হয়েছে।'
      - text: 'ইঞ্জিন দিয়ে কিছু আসে-যায় না, SQL একই'
        correct: false
        why: 'SQL একই হলেও লেখা-পড়ার খরচ ইঞ্জিনের ওপর নির্ভর করে।'
    ref: btree-vs-lsm
  - q: 'LSM-ভিত্তিক ডেটাবেসের লেখা কখনো কখনো হঠাৎ ধীর হয়ে যাচ্ছে, যদিও ট্রাফিক একই। সবচেয়ে সম্ভাব্য কারণ কী?'
    hint: 'ব্যাকগ্রাউন্ডে কোন কাজ ডিস্ক আর CPU খায়?'
    options:
      - text: 'WAL মুছে গেছে'
        correct: false
        why: 'WAL মুছে গেলে ক্র্যাশে ডেটা হারাত; লেখা ধীর হতো না।'
      - text: 'compaction চলছে, আর সে ডিস্কের বড় অংশ খাচ্ছে'
        correct: true
        why: 'অনেক ফাইল মেলানোর কাজ ডিস্ক ও CPU নেয়, তাই চরম চাপে লেখার গতি হঠাৎ কমতে পারে।'
      - text: 'B-tree-র পাতা ভেঙে যাচ্ছে'
        correct: false
        why: 'পাতা ভাঙা B-tree-র ব্যাপার, LSM-এ নয়।'
      - text: 'memtable কখনো ডিস্কে নামে না'
        correct: false
        why: 'ভরে গেলে memtable ঠিকই ডিস্কে নামে।'
    ref: wal-memtable-compaction
  - q: 'নিচের কোডে সমস্যা কী?'
    lang: php
    code: |
      $c->executeStatement('SET LOCAL synchronous_commit = off');
      $c->insert('payment', [
          'order_id' => $orderId,
          'amount'   => $amount,
      ]);
    hint: 'payment-এর "সফল" বার্তা দেওয়ার পরে সার্ভার বন্ধ হলে কী হবে?'
    options:
      - text: 'কোনো সমস্যা নেই, ফাইল তো নষ্ট হয় না'
        correct: false
        why: 'ফাইল নষ্ট না হলেও ব্যবহারকারীকে "সফল" বলার পরে payment-এর রেকর্ড হারাতে পারে।'
      - text: 'payment-এর মতো টাকার ডেটায় এটা বিপজ্জনক: শেষ commit হারিয়ে যেতে পারে'
        correct: true
        why: 'synchronous_commit বন্ধ থাকলে commit-এর পরেও WAL ডিস্কে পৌঁছাতে দেরি হতে পারে। টাকার ডেটায় এটা চলে না।'
      - text: 'SET LOCAL ভুল, SET লিখতে হবে'
        correct: false
        why: 'SET LOCAL শুধু একটা transaction-এ খাটে, সেটাই ভালো। সমস্যাটা অন্য জায়গায়।'
      - text: 'insert() ধীর, executeStatement() ব্যবহার করা উচিত'
        correct: false
        why: 'ধীর-দ্রুতের প্রশ্ন নয়; প্রশ্ন হলো ডেটা হারানোর ঝুঁকি।'
    ref: durability-switch-pitfall
  - q: 'একটা queue consumer ২০,০০০ audit row একটা একটা করে commit করে। flush ৫ ms হলে লাগে ১০০ সেকেন্ড। নাদিয়া আগে কী চেষ্টা করবেন?'
    hint: 'কোন সমাধানে ডেটার ঝুঁকি ছাড়াই দ্রুত হয়?'
    options:
      - text: 'postgresql.conf-এ fsync = off করা'
        correct: false
        why: 'দ্রুত হয়, কিন্তু বিদ্যুৎ গেলে পুরো ডেটাবেস নষ্ট হতে পারে। একটা insert লুপের জন্য দামটা অনেক বেশি।'
      - text: 'প্রায় ১,০০০টার chunk করে, প্রতি chunk-এ এক transaction-এ insert করা'
        correct: true
        why: '২০,০০০ flush হয়ে যায় ২০টা, মানে অপেক্ষা ১০০ সেকেন্ডের বদলে প্রায় ০.১ সেকেন্ড, আর commit হওয়া প্রতিটা row নিরাপদে ডিস্কে।'
      - text: 'পুরো সার্ভারে synchronous_commit = off করা'
        correct: false
        why: 'কাজ হয়, কিন্তু ওই সার্ভারের প্রতিটা payment-ও শেষ commit হারাতে পারে। আগে batch; আর এই সেটিং বড়জোর একটা transaction-এ।'
      - text: 'আরও RAM কেনা'
        correct: false
        why: 'অপেক্ষাটা প্রতি commit-এর ডিস্ক flush-এর জন্য, মেমোরির জন্য নয়।'
    ref: batch-before-tuning
  - q: 'WAL ও ইঞ্জিন নিয়ে নিচের কোন কথাগুলো সত্য?'
    hint: 'WAL কী আগে লেখে আর কেন?'
    options:
      - text: 'WAL-এ আগে লেখা হয়, তারপর আসল জায়গায়'
        correct: true
        why: 'এই ক্রমই ক্র্যাশের পরে ফিরে আসা সম্ভব করে।'
      - text: 'শুধু LSM ডেটাবেসে WAL থাকে'
        correct: false
        why: 'PostgreSQL আর MySQL-ও WAL (বা redo log) ব্যবহার করে।'
      - text: 'PostgreSQL আর MySQL InnoDB B-tree-ভিত্তিক'
        correct: true
        why: 'এগুলোর ডেটা ও index সাজানো B-tree পাতায় থাকে।'
      - text: 'compaction না করলেও LSM-এর পড়া একই গতিতে থাকে'
        correct: false
        why: 'compaction না হলে ফাইল জমে, আর পড়ার সময় অনেক ফাইল দেখতে হয়।'
    ref: wal-memtable-compaction
  - q: 'একটা ছোট ই-কমার্স স্টার্টআপ বলছে, "Cassandra লেখায় দ্রুত, তাই অর্ডার ডেটাবেস ওটাতেই করি।" কী বলবেন?'
    hint: 'অর্ডারে কী কী প্রশ্ন আর transaction লাগে?'
    options:
      - text: 'ঠিক, লেখা দ্রুত হলেই সব ঠিক'
        correct: false
        why: 'গতির জন্য join, transaction আর যেকোনো query ছেড়ে দেওয়া খারাপ বিনিময়।'
      - text: 'PostgreSQL দিয়ে শুরু করুন; ছোট অ্যাপের লেখার চাপ এক সার্ভারেই ধরবে, আর জড়ানো ডেটার জন্য B-tree সহজ'
        correct: true
        why: 'অর্ডারে join আর transaction লাগে। মাপা সমস্যা দেখা দিলে তখন বদলানো যাবে।'
      - text: 'MongoDB নিন, কারণ সেটা আরও জনপ্রিয়'
        correct: false
        why: 'জনপ্রিয়তা সিদ্ধান্তের মাপকাঠি নয়, আর সমস্যাটা জড়ানো ডেটার।'
      - text: 'SQLite নিন, কারণ ছোট অ্যাপ'
        correct: false
        why: 'SQLite এক ফাইলের ডেটাবেস, একাধিক সার্ভারের ওয়েব অ্যাপে মূল ডেটাবেস হিসেবে মানায় না।'
    ref: which-database-which-engine
