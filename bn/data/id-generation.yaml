slides:
  - slug: roll-number-problem
    title: 'রোল নম্বরের মতো ID: সহজ, কিন্তু সীমা আছে'
    kind: story
    tldr: 'Auto-increment ID সহজ আর ছোট, কিন্তু আন্দাজ করা যায়, ব্যবসার আকার ফাঁস করে, আর একাধিক ডেটাবেস বা সার্ভারে একসাথে বানাতে গেলে ধাক্কা খায়।'
    keywords: ['auto increment', 'sequence', 'ID generation', 'guessable ID', 'IDOR', 'ID বানানো']
    blocks:
      - type: metaphor
        icon: school
        title: 'স্কুলের রোল নম্বর'
        body: |
          ক্লাসে রোল নম্বর ১, ২, ৩ করে বসে: ছোট, সাজানো, একজনের পরে আরেকজন। কিন্তু ক্লাসটা যদি দুই শাখায় ভাগ হয়, দুই শাখাতেই "রোল ১" থাকবে, তখন আর শুধু রোল নম্বরে কাউকে চেনা যায় না। আর কেউ রোল ৪৩ দেখলেই বুঝে যায় ক্লাসে অন্তত ৪৩ জন, এবং ৪৪ নম্বরের খাতাও আন্দাজ করতে পারে। ডেটাবেসের auto-increment ID-তে ঠিক এই তিনটা সমস্যা।
      - type: visual
        kind: compare
        caption: 'Auto-increment-এর সুবিধা আর সীমা'
        columns:
          - title: 'যা ভালো'
            tone: good
            icon: check
            tip: 'এই কারণেই বেশিরভাগ অ্যাপে এটাই default, আর ঠিকভাবে ব্যবহার করলে ভালো পছন্দ।'
            items:
              - 'ছোট: bigint মাত্র ৮ বাইট'
              - 'index-এ সবসময় শেষে যোগ হয়, দ্রুত'
              - 'ডেটাবেস নিজেই বানায়, কোড লাগে না'
          - title: 'যা সমস্যা'
            tone: bad
            icon: warning
            tip: 'সমস্যাগুলো ছোট অ্যাপে চোখে পড়ে না, বড় হলে বা বাইরের মানুষ ID দেখলে সামনে আসে।'
            items:
              - 'আন্দাজ করা যায়: /invoices/1042 -> /invoices/1043'
              - 'ব্যবসার আকার ফাঁস: আজ ১০৪২, কাল ১১০০ মানে ৫৮টা অর্ডার'
              - 'দুই ডেটাবেসে ID মিলে যায়'
              - 'ID জানতে হলে আগে insert করতে হয়'
      - type: quote
        body: 'ID শুধু পরিচয়, গোপন নয়। ID আন্দাজ করা গেলে নিরাপত্তা অন্য জায়গায় রাখতে হবে।'
    aside:
      - type: story
        title: 'প্রতিযোগীর স্ক্র্যাপার'
        body: 'এক ই-কমার্সে অর্ডারের ID ছিল ক্রমিক সংখ্যা। প্রতিযোগী প্রতিদিন একই সময়ে অর্ডার করে ID দেখত, আর বিয়োগ করে জেনে যেত প্রতিদিন কত অর্ডার হয়।'
      - type: terms
        items:
          - {term: 'Sequence', meaning: 'ডেটাবেসের গোনা-যন্ত্র যে প্রতিবার পরের সংখ্যা দেয়: ১, ২, ৩...'}
          - {term: 'IDOR', meaning: 'ID বদলে অন্যের ডেটা দেখে ফেলা, যখন মালিকানা যাচাই হয় না।'}
    check:
      q: 'ক্রমিক ID থাকলে ব্যবসার তথ্য কীভাবে ফাঁস হয়?'
      a: 'দুই দিনের ID বিয়োগ করলে মাঝের সময়ে কতগুলো row তৈরি হয়েছে জানা যায়, যেমন কতগুলো অর্ডার বা ব্যবহারকারী।'

  - slug: id-options-table
    title: 'পাঁচ রকম ID পাশাপাশি'
    kind: concept
    tldr: 'Sequence, UUIDv4, UUIDv7, ULID আর Snowflake: আকার, সাজানো কি না, আন্দাজযোগ্যতা আর সমন্বয় লাগে কি না, এই চারটা প্রশ্নে আলাদা।'
    keywords: ['UUIDv4', 'UUIDv7', 'ULID', 'Snowflake', 'sequence', 'comparison', 'ID তুলনা']
    blocks:
      - type: metaphor
        icon: school
        title: 'রোল নম্বরের পাঁচ রকম নিয়ম'
        body: |
          ক্রমিক নম্বর হলো সরল রোল। UUIDv4 হলো লটারিতে তোলা এলোমেলো কার্ড নম্বর: কেউ আন্দাজ করতে পারে না, কিন্তু সাজানোও থাকে না। UUIDv7 আর ULID হলো তারিখসহ নম্বর, "২০২৬-০৫-১২-৭৩৪": তারিখ আগে বলে সাজানো, শেষে এলোমেলো অংশ বলে আন্দাজ কঠিন। Snowflake-এ তারিখের পরে থাকে কোন শাখা আর সেই শাখার কত নম্বর।
      - type: visual
        kind: table
        caption: 'পাঁচ ID এক নজরে'
        headers: ['', 'আকার', 'সময়ে সাজানো', 'আন্দাজ', 'সমন্বয়']
        rows:
          - cells: ['Sequence', '৮ বাইট', 'হ্যাঁ', 'সহজ', 'লাগে']
            tip: 'একটা ডেটাবেসই গোনে। একাধিক জায়গা থেকে বানাতে গেলে ID মিলে যায়।'
          - cells: ['UUIDv4', '১৬ বাইট', 'না', 'প্রায় অসম্ভব', 'লাগে না']
            tip: '১২২ বিট সম্পূর্ণ এলোমেলো। যেকোনো জায়গায় বানানো যায়, কিন্তু B-tree index-এ ছড়িয়ে পড়ে।'
          - cells: ['UUIDv7', '১৬ বাইট', 'হ্যাঁ (ms)', 'কঠিন', 'লাগে না']
            tip: 'শুরুতে ৪৮ বিট সময়, তারপর এলোমেলো। UUID-এর সব সুবিধা রেখে সময়ে সাজানো, তাই আজ নতুন প্রজেক্টের সেরা default।'
          - cells: ['ULID', '১৬ বাইট (২৬ অক্ষর)', 'হ্যাঁ (ms)', 'কঠিন', 'লাগে না']
            tip: 'UUIDv7-এর প্রায় সমান ধারণা, কিন্তু ছোট বর্ণসংখ্যার লেখা ও সাজানো। UUID-সমর্থিত টুলের ঝামেলা কম বলে v7 সাধারণত সহজ।'
          - cells: ['Snowflake', '৮ বাইট', 'হ্যাঁ (ms)', 'মাঝারি', 'machine id লাগে']
            tip: 'সময় + machine id + কাউন্টার, মোট ৬৪ বিট, bigint-এ ধরে। প্রতিটা সার্ভারকে আলাদা machine id দিতে হয়, সেটাই সমন্বয়।'
      - type: points
        title: 'কোনটা কখন'
        style: check
        items:
          - 'এক ডেটাবেস, বাইরে ID দেখান না: sequence-ই যথেষ্ট।'
          - 'বাইরে ID দেখান বা একাধিক জায়গায় বানান: UUIDv7।'
          - 'বিশাল scale, ছোট bigint ID লাগবে: Snowflake-জাতীয় (machine id সামলানোর সক্ষমতা থাকলে)।'
    aside:
      - type: remember
        body: 'নতুন প্রজেক্টে সন্দেহ হলে: ভেতরে sequence বা UUIDv7, বাইরে UUIDv7।'
      - type: tips
        items:
          - '১৬ বাইটের ID-র দাম: MySQL InnoDB-তে প্রতিটা secondary index-এ primary key-র একটা কপি থাকে। ১০ কোটি সারিতে বাড়তি ৮ বাইট মানে প্রতি index-এ প্রায় ০.৮ GB বেশি।'
      - type: refs
        items:
          - {to: 'scaling/consistent-hashing', label: 'machine id আর কোন সার্ভার কী সামলায়'}
    check:
      q: 'UUIDv4 আর UUIDv7-এর মূল পার্থক্য কী?'
      a: 'v4 পুরোটাই এলোমেলো, তাই সাজানো থাকে না। v7-এর শুরুতে সময় থাকে, তাই নতুন ID পুরনোর পরে আসে, আর শেষের এলোমেলো অংশ আন্দাজ কঠিন রাখে।'

  - slug: index-locality
    title: 'কেন এলোমেলো ID index-কে ক্লান্ত করে'
    kind: concept
    tldr: 'Primary key B-tree-তে বসে। এলোমেলো UUIDv4 প্রতিবার গাছের যেকোনো পাতায় লেখে (পাতা ভাঙে, cache মিস), আর সময়ে সাজানো ID শেষ পাতায় যোগ হয়।'
    keywords: ['index locality', 'page split', 'UUIDv4', 'UUIDv7', 'clustered index', 'primary key', 'B-tree']
    blocks:
      - type: metaphor
        icon: book
        title: 'বর্ণানুক্রমে সাজানো খাতা'
        body: |
          খাতায় রোল নম্বর ধরে সাজিয়ে নাম লেখা হয়। নতুন ছাত্রের রোল সবসময় আগেরটার চেয়ে বড় হলে শেষ পাতায় লিখলেই হয়, একটা পাতাই খোলা থাকে। কিন্তু রোল যদি এলোমেলো আসে, তাহলে প্রতিবার খাতার মাঝখানে কোথাও পাতা খুলে ঠাসাঠাসি করে জায়গা বের করতে হয়, কখনো পাতা ছিঁড়ে দুই ভাগ করতে হয়।
      - type: visual
        kind: compare
        caption: 'নতুন row primary key index-এ কোথায় বসে'
        columns:
          - title: 'UUIDv4 (এলোমেলো)'
            tone: bad
            icon: shuffle
            tip: 'প্রতিটা insert গাছের যেকোনো পাতায় পড়ে। সব পাতা মেমোরিতে না ধরলে ডিস্ক থেকে পড়তে হয়।'
            items:
              - 'insert ছড়িয়ে যায় সব পাতায়'
              - 'পাতা ভরলে ভেঙে দুই ভাগ (page split)'
              - 'cache-এ ঠিক পাতা না-ও থাকতে পারে'
              - 'index ফাঁপা ও বড় হয়'
          - title: 'UUIDv7 / sequence'
            tone: good
            icon: check
            tip: 'নতুন ID সবসময় আগেরগুলোর চেয়ে বড়, তাই index-এর ডান প্রান্তের একটা পাতায় যোগ হয়। সেই পাতা মেমোরিতেই থাকে।'
            items:
              - 'insert সবসময় শেষ পাতায়'
              - 'পাতা পূর্ণ ভরে, ভাঙে কম'
              - 'শেষের পাতা cache-এ গরম থাকে'
              - 'index ঘন ও ছোট'
      - type: visual
        kind: steps
        caption: 'Snowflake-এর ৬৪ বিট: তিন অংশ'
        steps:
          - {title: '১. সময় (৪১ বিট)', body: 'মিলিসেকেন্ডে, নির্দিষ্ট শুরুর তারিখ থেকে। প্রায় ৬৯ বছর চলে।', tip: 'সময় সবার আগে বলেই ID সময়ের ক্রমে সাজানো।'}
          - {title: '২. machine id (১০ বিট)', body: 'কোন সার্ভার বা worker বানিয়েছে। ১০২৪টা আলাদা।', tip: 'প্রতিটা চলমান সার্ভারের আলাদা id থাকা চাই। এই বরাদ্দই সমন্বয়ের কাজ।'}
          - {title: '৩. কাউন্টার (১২ বিট)', body: 'একই মিলিসেকেন্ডে একই machine-এ ৪০৯৬টা পর্যন্ত।', tip: 'একই ms-এ অনেক ID লাগলে কাউন্টার বাড়ে। ফুরালে পরের ms পর্যন্ত থামতে হয়।'}
      - type: quote
        body: 'Primary key-এর ক্রম index-এর স্বাস্থ্য ঠিক করে। বড় টেবিলে এলোমেলো ID নয়, সময়ে সাজানো ID বাছুন।'
    aside:
      - type: tips
        items:
          - 'MySQL InnoDB-তে primary key-ই clustered index, অর্থাৎ পুরো টেবিলের ডেটা সেই ক্রমে বসে। তাই সেখানে এলোমেলো PK-র ক্ষতি আরও বেশি।'
          - 'ছোট টেবিলে (কয়েক লাখ row, সব মেমোরিতে ধরে) পার্থক্য প্রায় টের পাওয়া যায় না। বড় টেবিলেই ক্ষতি।'
      - type: refs
        items:
          - {to: 'data/indexing', label: 'B-tree index কীভাবে কাজ করে'}
    check:
      q: 'টেবিল বড় হলে UUIDv4 primary key কেন insert ধীর করে, অথচ UUIDv7 করে না?'
      a: 'v4 এলোমেলো, তাই প্রতিটা insert গাছের যেকোনো পাতায় পড়ে আর পাতা ভাঙে। v7 সময়ে সাজানো, তাই সবসময় শেষ পাতায় যোগ হয়।'

  - slug: symfony-uid-howto
    title: 'Symfony Uid দিয়ে UUIDv7 বসানো'
    kind: howto
    tldr: 'Symfony Uid component দিয়ে constructor-এ `Uuid::v7()` বানান, Doctrine-এ `UuidType` দিন, আর route-এ `Requirement::UUID_V7` বসান; ID flush-এর আগেই জানা যায়।'
    keywords: ['Symfony Uid', 'Uuid::v7', 'UuidType', 'Doctrine UUID', 'Ulid', 'Requirement::UUID_V7']
    blocks:
      - type: text
        body: |
          `composer require symfony/uid` দিয়ে Uid component আসে। UUID constructor-এই বানালে ID ডেটাবেসে যাওয়ার আগেই জানা যায়, তাই অর্ডারের ID দিয়ে সাথে সাথে event বা ইমেইল সাজানো যায়। Doctrine-এ কলামের type হবে `UuidType::NAME`, যা PostgreSQL-এ native `uuid` আর MySQL-এ `BINARY(16)` হিসেবে রাখে, দুটোতেই ৩৬ অক্ষরের টেক্সটের চেয়ে ছোট।
      - type: code
        lang: php
        file: 'src/Entity/Order.php'
        variant: good
        code: |
          use Symfony\Bridge\Doctrine\Types\UuidType;
          use Symfony\Component\Uid\Uuid;

          #[ORM\Entity]
          #[ORM\Table(name: 'customer_order')]
          class Order
          {
              #[ORM\Id]
              #[ORM\Column(type: UuidType::NAME, unique: true)]
              private Uuid $id;

              public function __construct()
              {
                  $this->id = Uuid::v7();   // flush-এর আগেই ID জানা
              }

              public function getId(): Uuid
              {
                  return $this->id;
              }
          }
        marks:
          - {line: 9, tip: 'GeneratedValue নেই, কারণ ID আমরা নিজেরাই বানাই। Doctrine শুধু সেটা সংরক্ষণ করে।'}
          - {line: 14, tip: 'v7: সময়ে সাজানো। ডেটাবেসে insert করার আগেই ID থাকায় সংশ্লিষ্ট object-গুলোকে সাথে সাথে এই ID দেওয়া যায়।'}
      - type: code
        lang: php
        file: 'src/Controller/OrderController.php'
        code: |
          use Symfony\Component\Routing\Requirement\Requirement;

          #[Route('/orders/{id}', requirements: ['id' => Requirement::UUID_V7])]
          #[IsGranted('VIEW', subject: 'order')]
          public function show(
              #[MapEntity(id: 'id')] Order $order,
          ): JsonResponse {
              return $this->json(['id' => $order->getId()->toRfc4122()]);
          }
        marks:
          - {line: 3, tip: 'ভুল ধরনের id দিলে controller-এ পৌঁছানোর আগেই 404।'}
          - {line: 4, tip: 'ID অবোধ্য হলেও অধিকার যাচাই লাগবেই: voter দিয়ে মালিকানা দেখুন।'}
      - type: points
        title: 'কয়েকটা ছোট নিয়ম'
        style: dot
        items:
          - 'ULID চাইলে `Ulid` ক্লাস আর `UlidType::NAME` একই ভাবে ব্যবহার করুন।'
          - 'বাইরে `toRfc4122()` (৩৬ অক্ষর) দেখান; ডেটাবেসে native uuid বা binary রাখুন।'
          - 'ভেতরে bigint আর বাইরে UUID, এমন দ্বি-ID নকশাও চলে, তবে ID দুটো সামলানোর ঝামেলা বাড়ে।'
    aside:
      - type: commands
        title: 'Uid কমান্ড'
        items:
          - {cmd: 'composer require symfony/uid', desc: 'Uid component ও Doctrine type'}
          - {cmd: 'php bin/console uuid:generate --time-based=now', desc: 'পরীক্ষার জন্য একটা UUID বানান'}
      - type: tips
        items:
          - 'UUID টেক্সট কলামে (varchar(36)) রাখবেন না। দ্বিগুণের বেশি জায়গা, আর index বড়।'
    check:
      q: 'Entity-র constructor-এ Uuid::v7() বসানোর একটা সুবিধা কী?'
      a: 'ID ডেটাবেসে insert করার আগেই জানা যায়। তাই flush না করেই event, লগ বা অন্য object-এ সেই ID দেওয়া যায়।'

  - slug: ids-are-not-security
    title: 'অবোধ্য ID মানেই নিরাপদ নয়'
    kind: pitfall
    tldr: 'ID আন্দাজ করা কঠিন হলেও অধিকার যাচাই বাদ দেওয়া যায় না; আর UUIDv7-এ তৈরির সময় দেখা যায়, তাই সময় গোপন রাখতে হলে সেটাও ভাবুন।'
    keywords: ['IDOR', 'broken access control', 'voter', 'UUID security', 'authorization', 'অধিকার যাচাই']
    blocks:
      - type: text
        body: |
          অনেকে ভাবে "UUID দিলেই আর অন্যের ইনভয়েস দেখা যাবে না।" কিন্তু ID একবার লিঙ্ক, লগ বা ব্রাউজার history-তে ফাঁস হলে যে কেউ তা ব্যবহার করতে পারে। আসল সুরক্ষা হলো প্রতিটা অনুরোধে "এই ব্যবহারকারী কি এই রেকর্ডের মালিক?" যাচাই করা।
      - type: code
        lang: php
        file: 'src/Controller/InvoiceController.php'
        variant: bad
        code: |
          #[Route('/invoices/{id}')]
          public function show(Invoice $invoice): JsonResponse
          {
              // কে চাইছে তা কেউ দেখে না; শুধু ID জানলেই হলো
              return $this->json($invoice);
          }
        marks:
          - {line: 4, tip: 'কোনো মালিকানা যাচাই নেই। /invoices/1042 বদলে 1043 দিলেই অন্যের ইনভয়েস, IDOR।'}
      - type: code
        lang: php
        file: 'src/Controller/InvoiceController.php'
        variant: good
        code: |
          #[Route('/invoices/{id}', requirements: ['id' => Requirement::UUID_V7])]
          #[IsGranted('VIEW', subject: 'invoice')]
          public function show(Invoice $invoice): JsonResponse
          {
              return $this->json($invoice);
          }

          // src/Security/InvoiceVoter.php
          protected function voteOnAttribute(string $a, mixed $invoice, TokenInterface $t): bool
          {
              return $invoice->getCustomer() === $t->getUser();
          }
        marks:
          - {line: 2, tip: 'voter প্রতিটা অনুরোধে চলে। UUID নয়, এটাই মূল সুরক্ষা।'}
          - {line: 11, tip: 'ইনভয়েসের মালিক আর বর্তমান ব্যবহারকারী এক কি না, শুধু এটাই দেখা হয়।'}
      - type: quote
        body: 'ID লুকানো নিরাপত্তা নয়। প্রতিটা অনুরোধে মালিকানা যাচাই করুন; UUID তার বাড়তি স্তর মাত্র।'
    aside:
      - type: pitfalls
        items:
          - 'UUIDv7/ULID/Snowflake-এ ID থেকে তৈরির সময় পড়া যায়। এটা গোপন রাখা দরকার হলে (যেমন অ্যাকাউন্ট খোলার তারিখ) আলাদা random public token ব্যবহার করুন।'
          - 'Snowflake-এ দুটো সার্ভারকে একই machine id দিলে ID মিলে যায়, আর ঘড়ি পেছালে ID ভাঙতে পারে।'
      - type: refs
        items:
          - {to: 'security/authn-authz', label: 'অধিকার যাচাই (authorization)'}
          - {to: 'time/clocks-lie', label: 'ঘড়ি কেন ভরসাযোগ্য নয়'}
    check:
      q: 'UUID ব্যবহার করলেও কেন ইনভয়েস দেখার আগে মালিকানা যাচাই করতেই হবে?'
      a: 'কারণ UUID লিঙ্ক বা লগের মাধ্যমে ফাঁস হতে পারে। শুধু আন্দাজ কঠিন হওয়া নিরাপত্তা নয়, সুরক্ষা আসে প্রতিটা অনুরোধে অধিকার যাচাই থেকে।'

flashcards:
  - q: 'Auto-increment ID-র তিনটা প্রধান সীমা কী?'
    a: 'আন্দাজ করা যায়, ব্যবসার আকার ফাঁস করে, আর একাধিক ডেটাবেসে বানালে ID মিলে যায়।'
    more: |
      সুবিধাও আছে: ছোট (৮ বাইট), index-এর শেষে যোগ হয়, ডেটাবেস নিজেই বানায়। যে অ্যাপে ID বাইরে দেখানো হয় না আর একটাই ডেটাবেস, সেখানে এটাই সেরা সহজ পছন্দ।
    ref: roll-number-problem
  - q: 'UUIDv4 কী, আর এর প্রধান দুর্বলতা কী?'
    a: '১২২ বিট এলোমেলো ১৬ বাইটের ID। যেকোনো জায়গায় বানানো যায়, কিন্তু সাজানো নয় বলে B-tree index-এ ছড়িয়ে পড়ে।'
    more: |
      প্রতিটা নতুন row গাছের যেকোনো পাতায় পড়ে, তাই পাতা ভাঙে আর cache মিস বাড়ে। ছোট টেবিলে বোঝা যায় না, বড় টেবিলে insert ধীর হয়।
    ref: index-locality
  - q: 'UUIDv7 কী, আর v4-এর চেয়ে ভালো কেন?'
    a: 'শুরুতে ৪৮ বিট মিলিসেকেন্ডের সময়, বাকি এলোমেলো। সময়ে সাজানো, তাই index-এর শেষে যোগ হয়।'
    more: |
      UUID-এর সব সুবিধা (যেকোনো জায়গায় বানানো, আন্দাজ কঠিন) থাকে, আর B-tree-র জন্য মানানসই ক্রমও আসে। Symfony-তে Uuid::v7()। নতুন প্রজেক্টে UUID চাইলে এটাই default পছন্দ।
    ref: id-options-table
  - q: 'Snowflake ID-র তিন অংশ কী কী?'
    a: '৪১ বিট সময় (ms), ১০ বিট machine id, ১২ বিট কাউন্টার: মোট ৬৪ বিট, bigint-এ ধরে।'
    more: |
      প্রতি machine প্রতি মিলিসেকেন্ডে ৪০৯৬টা ID বানাতে পারে। সুবিধা: ছোট (৮ বাইট) আর সময়ে সাজানো। দাম: প্রতিটা সার্ভারকে আলাদা machine id দিতে হয়, আর ঘড়ি পিছিয়ে গেলে সতর্ক থাকতে হয়।
    ref: index-locality
  - q: 'ULID আর UUIDv7-এ মিল ও অমিল কী?'
    a: 'দুটোই ৪৮ বিট সময় + এলোমেলো অংশ। ULID ২৬ অক্ষরের base32 লেখা, UUIDv7 স্ট্যান্ডার্ড UUID ফরম্যাটে।'
    more: |
      UUIDv7 স্ট্যান্ডার্ড (RFC 9562), তাই ডেটাবেসের native uuid type-এ সরাসরি যায়। ULID-ও ১২৮ বিট, Symfony Uid-এ Ulid ও UlidType আছে। দুটোই ভালো; UUIDv7-এ টুল-সমর্থন বেশি।
    ref: id-options-table
  - q: 'Symfony-তে entity-র ID কীভাবে UUIDv7 করবেন?'
    a: 'ক্ষেত্রটা UuidType::NAME দিন, আর constructor-এ $this->id = Uuid::v7() বসান।'
    more: |
      ID নিজে বানালে GeneratedValue লাগে না, আর flush-এর আগেই ID জানা যায়। route-এ Requirement::UUID_V7 দিলে ভুল ফরম্যাটের ID controller-এ ঢোকার আগেই ৪০৪ হয়।
    ref: symfony-uid-howto
  - q: 'UUID ব্যবহার করলেই কি IDOR ঠেকে?'
    a: 'না। ID ফাঁস হতে পারে। প্রতিটা অনুরোধে মালিকানা যাচাই (voter) করাই আসল সুরক্ষা।'
    more: |
      IDOR মানে ID বদলে অন্যের ডেটা দেখে ফেলা। UUID আন্দাজ করা কঠিন করে, কিন্তু লিঙ্ক শেয়ার, লগ বা ব্রাউজার history দিয়ে ID বেরিয়ে যেতে পারে। অধিকার যাচাই না থাকলে তখন সবকিছু খোলা।
    ref: ids-are-not-security

quiz:
  - q: 'রহিমের টেবিলে ২০ কোটি row, primary key UUIDv4, insert ধীর হয়ে যাচ্ছে। সবচেয়ে সম্ভাব্য কারণ কী?'
    hint: 'প্রতিটা নতুন ID index-এর কোথায় বসে?'
    options:
      - text: 'UUID-এর ১৬ বাইট বেশি বড়, তাই এত ধীর'
        correct: false
        why: 'আকার একটু বাড়ায়, কিন্তু ধীর হওয়ার বড় কারণ নয়। বড় কারণ ক্রমের অভাব।'
      - text: 'এলোমেলো ID প্রতিবার index-এর যেকোনো পাতায় পড়ে, পাতা ভাঙে আর cache মিস বাড়ে'
        correct: true
        why: 'ক্রমহীনতাই খরচ। UUIDv7-এ বদলালে নতুন ID শেষ পাতায় যায়।'
      - text: 'ডেটাবেস UUID বোঝে না, টেক্সট ধরে'
        correct: false
        why: 'native uuid type থাকলে ডেটাবেস ঠিকই binary হিসেবে রাখে।'
      - text: 'Symfony Uid component ধীর'
        correct: false
        why: 'ID বানানো মাইক্রোসেকেন্ডের কাজ। ধীর হওয়ার কারণ ডেটাবেসের index-এ।'
    ref: index-locality
  - q: 'নিচের কোন ক্ষেত্রে sequence (auto-increment) যথেষ্ট ভালো পছন্দ?'
    hint: 'ID বাইরে দেখানো হয় কি না আর কয়টা ডেটাবেস, ভাবুন।'
    options:
      - text: 'একটা ডেটাবেস, ID শুধু ভেতরের কাজে, ব্যবহারকারী কখনো দেখে না'
        correct: true
        why: 'আন্দাজ করা বা সমন্বয়ের সমস্যা তখন নেই। ছোট আর দ্রুত।'
      - text: 'তিনটা আলাদা অঞ্চলের ডেটাবেস থেকে একই টেবিলে ডেটা জমা হচ্ছে'
        correct: false
        why: 'প্রতিটা ডেটাবেস নিজের মতো ১, ২, ৩ বানালে ID মিলে যাবে।'
      - text: 'পাবলিক URL-এ /orders/ID এবং মালিকানা যাচাই নেই'
        correct: false
        why: 'আন্দাজ করা সহজ হওয়ায় ঝুঁকি বেশি; আগে অধিকার যাচাই বসাতে হবে।'
      - text: 'মোবাইল অ্যাপ অফলাইনে ID বানিয়ে পরে সার্ভারে পাঠাবে'
        correct: false
        why: 'অফলাইনে সার্ভারের sequence পাওয়া যায় না; UUID বা ULID লাগবে।'
    ref: roll-number-problem
  - q: 'কোন বৈশিষ্ট্যগুলো UUIDv7-এর?'
    hint: 'v7 = সময় + এলোমেলো।'
    options:
      - text: 'শুরুতে ৪৮ বিট মিলিসেকেন্ডের সময় আছে'
        correct: true
        why: 'এই সময়ের কারণেই ID সময়ের ক্রমে সাজানো।'
      - text: 'বানাতে কোনো কেন্দ্রীয় সমন্বয় লাগে না'
        correct: true
        why: 'যেকোনো সার্ভার বা ক্লায়েন্ট নিজে বানাতে পারে; কোলিশন কার্যত অসম্ভব।'
      - text: 'দুটো ID থেকে তাদের তৈরির সময়ের পরিমাণ আন্দাজ করা অসম্ভব'
        correct: false
        why: 'উল্টো: সময় ID-তে খোলাই আছে, তাই পড়া যায়।'
      - text: 'bigint-এ ধরে, ৮ বাইটে'
        correct: false
        why: 'UUID-এর আকার ১৬ বাইট। ৮ বাইটের কথা Snowflake-এর।'
    ref: id-options-table
  - q: 'নিচের কোডে সবচেয়ে বড় ঝুঁকি কী?'
    lang: php
    code: |
      #[Route('/invoices/{id}', requirements: ['id' => Requirement::UUID_V7])]
      public function show(Invoice $invoice): JsonResponse
      {
          return $this->json($invoice);
      }
    hint: 'UUID ঠিক আছে, তবে কে চাইছে তা কে দেখছে?'
    options:
      - text: 'UUID খুব লম্বা, URL ভেঙে যাবে'
