slides:
  - slug: same-fact-three-places
    title: 'একই তথ্য তিন জায়গায়, তিন রকম'
    kind: story
    tldr: 'একই তথ্য একাধিক জায়গায় লিখলে একদিন সেগুলো আলাদা হয়ে যায়; তখন কোনটা ঠিক, কেউ বলতে পারে না।'
    keywords: ['duplication', 'data anomaly', 'update anomaly', 'ডুপ্লিকেট ডেটা', 'schema design']
    blocks:
      - type: metaphor
        icon: book
        title: 'মুদি দোকানের বাকির খাতা'
        body: |
          মুদি দোকানি প্রতিটা বাকির লাইনের পাশেই খদ্দেরের নাম আর ফোন নম্বর লিখে রাখেন। রহিম সাহেবের নম্বর বদলাল; দোকানি একটা লাইনে নতুন নম্বর লিখলেন, বাকি দুই লাইনে পুরনোটাই রইল। মাস শেষে ফোন করতে গিয়ে দোকানি বুঝতে পারেন না কোন নম্বরটা সত্যি। তোমার টেবিলেও একই তথ্য বারবার লিখলে ঠিক এটাই ঘটে।
      - type: visual
        kind: table
        caption: 'customer_order টেবিলে নাম আর ফোন প্রতিটা row-তে কপি করা'
        headers: ['order_id', 'customer_name', 'customer_phone']
        rows:
          - cells: ['101', 'রহিম উদ্দিন', '01711-000001']
            tip: 'প্রথম অর্ডারে রহিমের নাম আর পুরনো নম্বর লেখা — তখন সব ঠিকই ছিল।'
          - cells: ['102', 'রহিম উদ্দীন', '01711-000001']
            tip: 'বানান আলাদা: এই row-তে কেউ হাতে টাইপ করেছে। এখন একই মানুষ দুই নামে।'
          - cells: ['130', 'রহিম উদ্দিন', '01711-000002']
            tip: 'রহিম নম্বর বদলেছেন, কিন্তু শুধু নতুন অর্ডারে নতুন নম্বর পড়েছে। আগের দুই row পুরনো নম্বর ধরে বসে আছে।'
      - type: quote
        body: 'একই তথ্য যত জায়গায় লিখবে, তত জায়গায় তাকে বদলাতে হবে — আর একটা ভুলে গেলেই ডেটা মিথ্যা বলবে।'
    aside:
      - type: terms
        items:
          - {term: 'Schema', meaning: 'টেবিল, কলাম আর তাদের মধ্যে সম্পর্কের বাঁধা নকশা।'}
          - {term: 'Update anomaly', meaning: 'একটা তথ্য একাধিক row-তে থাকায় একটা বদলে অন্যগুলো পুরনো থেকে যাওয়া।'}
      - type: story
        title: 'কোন ফোনে ফোন করব?'
        body: 'একটা কুরিয়ার কোম্পানির অর্ডার টেবিলে প্রতিটা row-তে ক্রেতার ঠিকানা কপি করা ছিল। ক্রেতা ঠিকানা বদলে নতুন অর্ডার দিলেন; পুরনো অর্ডারের পার্সেল গেল পুরনো ঠিকানায়, কারণ ডেলিভারি অ্যাপ সেই row-ই পড়ছিল।'
    check:
      q: 'কাস্টমারের ফোন নম্বর প্রতিটা অর্ডারের row-তে কপি থাকলে নম্বর বদলানোর সময় কী ঝুঁকি?'
      a: 'কিছু row-তে নতুন আর কিছু row-তে পুরনো নম্বর থেকে যাবে। তখন একই মানুষের দুটো ভিন্ন সত্য তৈরি হবে, আর কোনটা ঠিক জানার উপায় থাকবে না।'

  - slug: normalization-one-home
    title: 'Normalization: প্রতিটা তথ্যের একটাই ঠিকানা'
    kind: concept
    tldr: 'Normalization মানে প্রতিটা তথ্য একবার, তার নিজের টেবিলে রাখা; অন্যরা শুধু তার ID ধরে রাখে (foreign key)।'
    keywords: ['normalization', 'foreign key', '3NF', 'normal form', 'নরমালাইজেশন', 'সম্পর্ক']
    blocks:
      - type: metaphor
        icon: book
        title: 'খদ্দেরের আলাদা পাতা'
        body: |
          দোকানি এবার প্রতি খদ্দেরের জন্য খাতায় একটা আলাদা পাতা খুললেন, যেখানে নাম-নম্বর একবারই লেখা। বাকির লাইনে শুধু লেখা থাকে "পাতা ১২"। নম্বর বদলাতে হলে একটা পাতাতেই বদলালেই সবাই নতুন নম্বর দেখে। পাতা হলো টেবিলের row, পাতার নম্বর হলো primary key, আর বাকির লাইনের "পাতা ১২" হলো foreign key।
      - type: visual
        kind: flow
        caption: 'ফোন নম্বর শুধু customer টেবিলে, বাকিরা ID ধরে'
        nodes:
          - {id: customer, label: 'customer', sub: 'id, name, phone', icon: user, tone: accent, col: 0, row: 1, tip: 'নাম আর ফোন নম্বর শুধু এখানে একবার থাকে। বদলাতে হলে একটা row-ই বদলাতে হয়।'}
          - {id: orders, label: 'customer_order', sub: 'id, customer_id', icon: receipt, col: 1.5, row: 1, tip: 'অর্ডারে নাম-ফোন নেই, শুধু customer_id। যে কাস্টমারের অর্ডার, তার পাতার নম্বর।'}
          - {id: item, label: 'order_item', sub: 'order_id, product_id', icon: list, col: 3, row: 1, tip: 'একটা অর্ডারে অনেক পণ্য থাকতে পারে, তাই প্রতিটা পণ্যের জন্য আলাদা row।'}
          - {id: product, label: 'product', sub: 'id, name, price', icon: box, col: 4, row: 1, tip: 'পণ্যের নাম আর দাম এখানে একবারই থাকে।'}
        edges:
          - {from: orders, to: customer, label: 'অর্ডার শুধু customer_id ধরে রাখে', tip: 'এই customer_id-ই foreign key। নাম-ফোনের দরকার হলে customer টেবিল থেকে পড়া হয়।'}
          - {from: item, to: orders, label: 'প্রতিটা item একটা অর্ডারের অংশ'}
          - {from: item, to: product, label: 'item শুধু product_id ধরে রাখে'}
          - {from: customer, to: orders, label: 'একজন customer-এর অনেক অর্ডার হতে পারে', dashed: true, tip: 'এটা এক থেকে অনেক (one-to-many) সম্পর্ক: এক customer, অনেক অর্ডার।'}
      - type: points
        title: 'তিন লাইনের নিয়ম'
        style: number
        items:
          - 'প্রতিটা ঘরে একটাই মান, কমা দিয়ে অনেকগুলো নয় (phone: ''017.., 018..'' চলবে না)।'
          - 'প্রতিটা তথ্য থাকবে তার নিজের মালিকের টেবিলে: নাম থাকবে customer-এ, order-এ নয়।'
          - 'একটা row-এর প্রতিটা কলাম বলবে ওই row-টা সম্পর্কেই, অন্য কিছু নিয়ে নয়।'
    aside:
      - type: remember
        body: 'নিয়ম: তথ্য একবার লেখো, ID দিয়ে বাকি সব জায়গা থেকে ধরো।'
      - type: terms
        items:
          - {term: 'Primary key', meaning: 'যে কলাম দিয়ে একটা row-কে একমাত্র পরিচয়ে চেনা যায়।'}
          - {term: 'Foreign key', meaning: 'অন্য টেবিলের primary key-এর মান ধরে রাখা কলাম।'}
          - {term: 'Normal form (1NF-3NF)', meaning: 'উপরের তিন লাইনের নিয়মেরই আনুষ্ঠানিক নাম।'}
    check:
      q: 'অর্ডারের row-তে customer_name না রেখে customer_id রাখলে কোন সুবিধা পাওয়া যায়?'
      a: 'নাম বা ফোন বদলাতে হলে শুধু customer টেবিলের একটা row বদলাতে হয়। সব অর্ডার সেই একটা সত্য থেকেই নাম পড়ে, তাই কোনো অমিল তৈরি হয় না।'

  - slug: constraints-as-guards
    title: 'Constraint: ডেটাবেসই পাহারাদার'
    kind: howto
    tldr: 'NOT NULL, UNIQUE, FOREIGN KEY আর CHECK ডেটাবেসের ভেতরেই ভুল ডেটা ঢোকা আটকায়; কোড ভুল করলেও।'
    keywords: ['NOT NULL', 'UNIQUE', 'foreign key', 'CHECK constraint', 'Doctrine', 'constraint', 'বাধা']
    blocks:
      - type: text
        body: |
          ফর্ম validation শুধু ব্রাউজার আর কন্ট্রোলারকে পাহারা দেয়। কিন্তু ডেটা ঢোকে import স্ক্রিপ্ট, কনসোল কমান্ড, পুরনো কোড আর কোনো দিন-ভুলে-যাওয়া endpoint দিয়েও। তাই শেষ পাহারাদার বসাও ডেটাবেসেই: constraint। একটা ভুল row কোনোভাবেই ঢুকতে পারবে না।
      - type: code
        lang: php
        file: 'src/Entity/OrderItem.php'
        variant: good
        code: |
          #[ORM\Entity]
          #[ORM\Table(name: 'order_item')]
          #[ORM\UniqueConstraint(name: 'uniq_order_product', columns: ['order_id', 'product_id'])]
          class OrderItem
          {
              #[ORM\Id, ORM\GeneratedValue, ORM\Column]
              private ?int $id = null;

              #[ORM\ManyToOne(targetEntity: Order::class)]
              #[ORM\JoinColumn(name: 'order_id', nullable: false, onDelete: 'CASCADE')]
              private Order $order;

              #[ORM\ManyToOne(targetEntity: Product::class)]
              #[ORM\JoinColumn(name: 'product_id', nullable: false, onDelete: 'RESTRICT')]
              private Product $product;

              #[ORM\Column]
              private int $quantity;
          }
        marks:
          - {line: 3, tip: 'UNIQUE: একই অর্ডারে একই পণ্য দুই row-তে ঢুকতে পারবে না; দ্বিতীয়বার চাইলে quantity বাড়াতে হবে।'}
          - {line: 10, tip: 'nullable: false মানে NOT NULL। FK থাকায় এই order_id-এর অর্ডার সত্যিই টেবিলে থাকতে হবে।'}
          - {line: 14, tip: 'RESTRICT: যে পণ্য কোনো অর্ডারে আছে, সেটা মুছতে দেবে না। অর্ডারের ইতিহাস অনাথ হয় না।'}
      - type: code
        lang: sql
        file: 'migrations/Version20260101000000.php (SQL)'
        code: |
          ALTER TABLE order_item
            ADD CONSTRAINT chk_order_item_quantity CHECK (quantity > 0);

          ALTER TABLE product
            ADD CONSTRAINT chk_product_price CHECK (price_in_poisha >= 0);
        marks:
          - {line: 2, tip: 'CHECK: শর্ত মিথ্যা হলে ডেটাবেস row-টাই ফিরিয়ে দেয়। Doctrine-এর attribute-এ CHECK নেই, তাই migration-এ addSql() দিয়ে বসাও।'}
      - type: visual
        kind: table
        caption: 'চার constraint: কোনটা কোন ভুল আটকায়'
        headers: ['Constraint', 'আটকায়', 'উদাহরণ']
        rows:
          - cells: ['NOT NULL', 'ফাঁকা মান', 'অর্ডারের customer_id নেই']
            tip: 'যে তথ্য ছাড়া row-টা অর্থহীন, তাকে NOT NULL করো।'
          - cells: ['UNIQUE', 'ডুপ্লিকেট', 'একই ইমেইলে দুই অ্যাকাউন্ট']
            tip: 'দুজন একসাথে সাইন-আপ করলেও দ্বিতীয়জন আটকে যায়। কোডের "আগে দেখি" এটা পারে না।'
          - cells: ['FOREIGN KEY', 'অনাথ row', 'ঘোষিত নেই এমন customer_id']
            tip: 'FK না থাকলে মুছে যাওয়া customer-এর অর্ডার ঝুলে থাকে।'
          - cells: ['CHECK', 'অসম্ভব মান', 'quantity = -3']
            tip: 'সহজ ব্যবসায়িক নিয়ম, যেমন দাম ঋণাত্মক হবে না।'
      - type: quote
        body: 'কোড বদলায়, কোডের সংখ্যা বাড়ে; ডেটা থেকে যায়। নিয়মের শেষ পাহারাদার ডেটাবেস।'
    aside:
      - type: tips
        items:
          - 'Validator-এ (Assert\NotBlank) ভালো মেসেজ দাও ব্যবহারকারীকে, আর constraint রাখো শেষ রক্ষা হিসেবে। দুটোই লাগে।'
          - 'বড় চলতি টেবিলে নতুন constraint বসাতে আগে ভুল row সাফ করতে হয়; সেটা আছে [[data/zero-downtime-migrations|ডাউনটাইম ছাড়া migration]] অংশে।'
      - type: refs
        items:
          - {to: 'concurrency/atomic-operations', label: 'UNIQUE দিয়ে race ঠেকানো'}
    check:
      q: 'ইমেইল unique কি শুধু Symfony validator-এ চেক করলেই চলে, না ডেটাবেসেও UNIQUE লাগবে?'
      a: 'ডেটাবেসেও লাগবে। validator "আগে দেখি, পরে লিখি" করে; দুই request একসাথে এলে দুটোই পাস করে ফেলে। শুধু UNIQUE constraint-ই দ্বিতীয়টাকে আটকায়।'

  - slug: when-to-duplicate
    title: 'কখন কপি করা ঠিক, কখন নয়'
    kind: pitfall
    tldr: 'যে তথ্য সময়ের সাথে বদলায় আর ইতিহাসে স্থির থাকা দরকার (দাম, ঠিকানা), তার snapshot কপি করা ঠিক; বাকিটা normalize।'
    keywords: ['denormalization', 'snapshot', 'price snapshot', 'invoice', 'denormalize', 'কপি করা']
    blocks:
      - type: text
        body: |
          উল্টো ভুলও আছে: সব কিছু normalize করে অর্ডারের দাম পণ্যের বর্তমান দাম থেকে পড়া। পণ্যের দাম ১০০ থেকে ১২০ হলে গত মাসের ইনভয়েসের অঙ্কও বদলে যায়। অর্ডারের মুহূর্তের দামটা তাই অর্ডারের নিজের row-তে কপি করে রাখতে হয়। এটাই বৈধ denormalization: ইচ্ছা করে, কারণ জেনে, কপি।
      - type: code
        lang: sql
        file: 'বিপজ্জনক: দাম join করে পড়া'
        variant: bad
        code: |
          SELECT SUM(p.price_in_poisha * oi.quantity) AS total
          FROM order_item oi
          JOIN product p ON p.id = oi.product_id
          WHERE oi.order_id = 130;
        marks:
          - {line: 1, tip: 'p.price_in_poisha হলো পণ্যের আজকের দাম। কাল দাম বদলালে পুরনো অর্ডারের মোটও বদলে যাবে।'}
      - type: code
        lang: sql
        file: 'নিরাপদ: অর্ডারের মুহূর্তের দাম নিজের row-তে'
        variant: good
        code: |
          ALTER TABLE order_item
            ADD COLUMN unit_price_in_poisha INT NOT NULL;

          SELECT SUM(unit_price_in_poisha * quantity) AS total
          FROM order_item
          WHERE order_id = 130;
        marks:
          - {line: 2, tip: 'অর্ডার তৈরির সময় product-এর দাম এই কলামে কপি হয়। পরে আর কখনো বদলায় না।'}
          - {line: 4, tip: 'join লাগে না, আর ফল সবসময় একই। এটা snapshot।'}
      - type: visual
        kind: compare
        caption: 'কোন কপি ঠিক আর কোনটা বিপদ'
        columns:
          - title: 'কপি করা ঠিক'
            tone: good
            icon: check
            tip: 'প্রতিটা কপির পেছনে একটা স্পষ্ট কারণ আছে: ইতিহাস স্থির রাখা বা মাপা-যাওয়া ধীর query সরানো।'
            items:
              - 'অর্ডারের মুহূর্তের দাম, ঠিকানা (snapshot)'
              - 'order-এ items_count: যা অর্ডারের সাথে একই transaction-এ বদলায়'
              - 'রিপোর্টের আলাদা সারাংশ টেবিল, মূল ডেটা থেকে বানানো'
          - title: 'কপি করা বিপদ'
            tone: bad
            icon: cross
            tip: 'যেখানে মূল তথ্য বদলালে কপিটারও বদলানো উচিত, অথচ কেউ বদলানোর ব্যবস্থা রাখেনি।'
            items:
              - 'প্রতি অর্ডারে customer_name, যা কাস্টমারের নামের সাথে মেলানোর কথা'
              - 'ভুল না জেনে "join ধীর হবে" ভেবে আগেই কপি'
              - 'কপি আছে কিন্তু কে হালনাগাদ করে, লেখা নেই'
    aside:
      - type: when
        use:
          - 'যে মান বদলালেও পুরনো রেকর্ডে আগের মানই থাকা উচিত (দাম, ঠিকানা, কর হার)'
          - 'মেপে দেখেছ join সত্যিই ধীর, আর কপি কে হালনাগাদ করবে তা ঠিক করা আছে'
        avoid:
          - 'শুধু "পরে join লাগবে না" ভেবে'
          - 'যে তথ্য সবসময় বর্তমান মানই দেখাবে (customer-এর বর্তমান নাম)'
      - type: refs
        items:
          - {to: 'data/indexing', label: 'join ধীর হলে আগে index দেখো'}
    check:
      q: 'ইনভয়েসে প্রতিটা পণ্যের দাম অর্ডারের row-তে কপি করা কি normalization-এর ভুল?'
      a: 'না, এটা ইচ্ছাকৃত snapshot। পণ্যের দাম বদলালেও পুরনো ইনভয়েসের অঙ্ক বদলানো চলবে না। তাই কপির এখানে স্পষ্ট কারণ আছে।'

flashcards:
  - q: 'Normalization কী, এক বাক্যে?'
    a: 'প্রতিটা তথ্য শুধু একবার, তার নিজের টেবিলে রাখা; বাকিরা তার ID (foreign key) ধরে রাখে।'
    more: |
      লক্ষ্য হলো একই তথ্য একাধিক জায়গায় না থাকা, যাতে এক জায়গায় বদলালেই সবাই নতুন মান দেখে। তাই নাম-ফোন থাকে customer টেবিলে, আর অর্ডারে থাকে শুধু customer_id।
    ref: normalization-one-home
  - q: 'Update anomaly কাকে বলে?'
    a: 'একই তথ্য একাধিক row-তে থাকায় একটা বদলালে বাকিগুলো পুরনো থেকে যাওয়া।'
    more: |
      যেমন ফোন নম্বর প্রতিটা অর্ডারে কপি থাকলে নম্বর বদলানোর সময় একটা row ভুলে গেলেই একই মানুষের দুটো নম্বর তৈরি হয়। কোনটা ঠিক, তা আর বলা যায় না।
    ref: same-fact-three-places
  - q: 'Foreign key কী কাজ করে?'
    a: 'অন্য টেবিলের row-এর সাথে সম্পর্ক ধরে রাখে, আর এমন ID ঢুকতে দেয় না যার row নেই।'
    more: |
      FK থাকলে customer_id = 999 দিয়ে অর্ডার বানানো যায় না যদি ৯৯৯ নম্বর customer না থাকে। মুছতে গেলেও ডেটাবেস নিয়ম মানায়: RESTRICT হলে মোছা আটকায়, CASCADE হলে সংশ্লিষ্ট row-ও মুছে যায়।
    ref: constraints-as-guards
  - q: 'UNIQUE constraint কেন শুধু validator-এর চেকের চেয়ে ভালো?'
    a: 'দুই request একসাথে এলেও ডেটাবেস দ্বিতীয়টাকে আটকায়; validator-এর "আগে দেখি" তা পারে না।'
    more: |
      validator আর সংরক্ষণের মাঝে একটা ফাঁক থাকে। সেই ফাঁকে অন্য request একই মান ঢুকিয়ে ফেলতে পারে। UNIQUE index ডেটাবেসের ভেতরেই এটা অবিভাজ্যভাবে পরীক্ষা করে।
    ref: constraints-as-guards
  - q: 'Doctrine-এ CHECK constraint কীভাবে বসাবে?'
    a: 'Migration-এ addSql(''ALTER TABLE ... ADD CONSTRAINT ... CHECK (...)'') লিখে; Doctrine attribute-এ CHECK নেই।'
    more: |
      NOT NULL, UNIQUE আর FK entity attribute থেকেই আসে। CHECK-এর মতো ব্যবসায়িক নিয়ম SQL-এ লিখে migration-এ রাখতে হয়। এতে নিয়মটা ডেটাবেসের ভেতরে থাকে, কোন কোড দিয়ে ঢুকছে সেটা নির্বিশেষে।
    ref: constraints-as-guards
  - q: 'Denormalization কখন ন্যায্য?'
    a: 'যখন কারণ স্পষ্ট: ইতিহাসে স্থির রাখা snapshot (অর্ডারের দাম), বা মেপে-পাওয়া ধীর query-র জন্য এমন কপি, যার হালনাগাদ-দায়িত্ব ঠিক করা আছে।'
    more: |
      "join ধীর হবে" শুধু ভেবে কপি করা ভুল। আগে মাপো, index দিয়ে দেখো। কপি করলে লিখে রাখো মূল তথ্য কোথায়, আর কপি কে কখন হালনাগাদ করে।
    ref: when-to-duplicate
  - q: 'অর্ডারের দাম কেন পণ্যের বর্তমান দাম থেকে join না করে row-তে কপি রাখা হয়?'
    a: 'যাতে পণ্যের দাম বদলালেও পুরনো ইনভয়েসের অঙ্ক একই থাকে।'
    more: |
      এটাকে বলে snapshot। অর্ডারের মুহূর্তের দাম, কর হার, ঠিকানা এরকম তথ্য ইতিহাসের অংশ। বর্তমান মান আর ইতিহাসের মান আলাদা তথ্য, তাই দুটোই আলাদা জায়গায় রাখা ঠিক।
    ref: when-to-duplicate

quiz:
  - q: 'একটা টেবিলে প্রতিটা অর্ডার row-তে customer_address কপি করা আছে। কাস্টমার ঠিকানা বদলালেন। কী সমস্যা হবে?'
    hint: 'ঠিকানা আর কোথায় কোথায় লেখা আছে?'
    options:
      - text: 'পুরনো অর্ডারগুলোর row-তে পুরনো ঠিকানা থেকে যাবে, নতুন অর্ডারে নতুন; মূল ঠিকানা কোনটা, বোঝা কঠিন হবে'
        correct: true
        why: 'একই তথ্য অনেক জায়গায় থাকলে একটা বদলে বাকিগুলো পুরনো থাকে। এটাই update anomaly।'
      - text: 'কিছুই হবে না, কারণ ডেটাবেস নিজে সব row আপডেট করে দেবে'
        correct: false
        why: 'ডেটাবেস জানে না কোন কলামগুলো একই তথ্যের কপি। আলাদা কলামকে সে আলাদা তথ্য ধরে।'
      - text: 'শুধু ডেটাবেসের আকার একটু বাড়বে, আর কোনো সমস্যা নেই'
        correct: false
        why: 'জায়গার খরচ আসল সমস্যা নয়; আসল সমস্যা ডেটার অমিল।'
      - text: 'টেবিল আর লেখা যাবে না'
        correct: false
        why: 'লেখা চলবে, কিন্তু ভুল বা পুরনো তথ্যসহ। সমস্যাটা নীরবে বাড়ে।'
    ref: same-fact-three-places
  - q: 'নিচের কোনগুলো normalized নকশার বৈশিষ্ট্য?'
    hint: 'প্রতিটা তথ্যের কয়টা ঠিকানা থাকা উচিত?'
    options:
      - text: 'অর্ডারে customer_id থাকে, নাম-ফোন থাকে customer টেবিলে'
        correct: true
        why: 'তথ্যটা তার মালিকের টেবিলে একবার, আর অর্ডার শুধু ID ধরে রাখে।'
      - text: 'একটা কলামে কমা দিয়ে অনেকগুলো ফোন নম্বর লেখা থাকে'
        correct: false
        why: 'একটা ঘরে একটাই মান থাকার নিয়ম ভাঙে; আলাদা phone টেবিল লাগবে।'
      - text: 'নাম বদলাতে হলে শুধু একটা row বদলাতে হয়'
        correct: true
        why: 'তথ্য একবার আছে বলেই একবার বদলালেই সব জায়গায় নতুন মান দেখা যায়।'
      - text: 'প্রতিটা অর্ডারে customer_name কপি করা, যাতে join না লাগে'
        correct: false
        why: 'এটা কপি করা নকশা (denormalized), যার সবচেয়ে বড় ঝুঁকি অমিল।'
    ref: normalization-one-home
  - q: 'দুজন ব্যবহারকারী একই মুহূর্তে একই ইমেইলে সাইন-আপ করল। নিচের কোডে কী হতে পারে?'
    lang: php
    code: |
      if ($users->findOneBy(['email' => $email])) {
          throw new EmailTaken();
      }

      $em->persist(new User($email));
      $em->flush();
    hint: 'দুই request-ই "দেখি" ধাপটা পার হলে কী হবে?'
    options:
      - text: 'দুজনেই পাস করে দুটো অ্যাকাউন্ট তৈরি হতে পারে, যদি ডেটাবেসে UNIQUE না থাকে'
        correct: true
        why: 'দুই request একই সময়ে "নেই" দেখে, তারপর দুটোই লেখে। UNIQUE constraint দ্বিতীয় লেখাটা আটকাত।'
      - text: 'কিছু হবে না, কারণ findOneBy() ডেটাবেসে lock বসায়'
        correct: false
        why: 'সাধারণ findOneBy() কোনো lock বসায় না; এটা শুধু পড়ে।'
      - text: 'flush() নিজেই ডুপ্লিকেট ধরে ফেলবে'
        correct: false
        why: 'flush() শুধু SQL পাঠায়। ডুপ্লিকেট ধরতে ডেটাবেসে UNIQUE index লাগে।'
      - text: 'সমস্যা হবে শুধু ইমেইলের বানানে বড়-ছোট হাতের অক্ষর আলাদা হলে'
        correct: false
        why: 'বানান নয়, দুই request-এর একসাথে আসাই মূল ঝুঁকি।'
    ref: constraints-as-guards
  - q: 'order_item টেবিলের product_id-এ foreign key আছে, onDelete: RESTRICT। কোনো অর্ডারে আছে এমন পণ্য মুছতে গেলে কী হবে?'
    hint: 'RESTRICT শব্দের অর্থ ভাবো।'
    options:
      - text: 'পণ্যের সাথে সংশ্লিষ্ট order_item-ও মুছে যাবে'
        correct: false
        why: 'এটা CASCADE-এর আচরণ। RESTRICT তার ঠিক উল্টো।'
      - text: 'order_item-এর product_id নিজে থেকে NULL হয়ে যাবে'
        correct: false
        why: 'সেটা SET NULL-এর আচরণ, আর NOT NULL কলামে চলতই না।'
      - text: 'ডেটাবেস মোছা আটকে দেবে, ত্রুটি দেখাবে'
        correct: true
        why: 'RESTRICT মানে যতক্ষণ অন্য row তাকে ধরে আছে, মোছা যাবে না। ইতিহাস অনাথ হয় না।'
      - text: 'মোছা হবে, আর order_item থেকে যাবে একটা অনাথ ID নিয়ে'
        correct: false
        why: 'FK ঠিক এই অনাথ row আটকানোর জন্যই আছে।'
    ref: constraints-as-guards
  - q: 'কোন ক্ষেত্রগুলোতে ডেটা কপি (denormalize) করা যুক্তিসঙ্গত?'
    hint: 'কোন মানটা বদলালেও পুরনো রেকর্ডে স্থির থাকা উচিত?'
    options:
      - text: 'ইনভয়েসের প্রতিটা পণ্যের অর্ডারের মুহূর্তের দাম'
        correct: true
        why: 'ইতিহাস স্থির রাখা দরকার। বর্তমান দাম join করলে পুরনো ইনভয়েসের অঙ্ক বদলে যেত।'
      - text: 'প্রতিটা অর্ডারে customer-এর বর্তমান নাম, যেন join লাগে না'
        correct: false
        why: 'এটা সবসময় বর্তমান নামই দেখানোর কথা; কপি পুরনো হয়ে অমিল তৈরি করবে।'
      - text: 'ডেলিভারি ঠিকানা, অর্ডার করার সময়ের অবস্থায়'
        correct: true
        why: 'ঠিকানা পরে বদলালেও পুরনো পার্সেল যে ঠিকানায় গিয়েছিল তা ইতিহাসের অংশ।'
      - text: 'যেকোনো কলাম, কারণ join সবসময় ধীর'
        correct: false
        why: 'join সাধারণত index থাকলে দ্রুত। না মেপে কপি করলে শুধু ঝুঁকি বাড়ে।'
    ref: when-to-duplicate
