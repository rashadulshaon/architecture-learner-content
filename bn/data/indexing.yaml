        why: 'বেশি index সাধারণত খোঁজা ধীর করে না; ধীর হয় লেখা।'
      - text: 'প্রতিটা INSERT-এ ৮টা index হালনাগাদ হবে, তাই লেখা ধীর আর ডিস্ক বেশি লাগবে'
        correct: true
        why: 'প্রতিটা index-এ নতুন এন্ট্রি সঠিক জায়গায় বসাতে হয়। ঘন ঘন লেখা টেবিলে এটা বড় বোঝা।'
      - text: 'কিছু হবে না, কারণ index আলাদা ফাইলে থাকে'
        correct: false
        why: 'আলাদা ফাইলে থাকলেও প্রতিটা লেখায় তাকে হালনাগাদ করতেই হয়।'
      - text: 'ডেটাবেস নিজে বাকি index মুছে দেবে'
        correct: false
        why: 'ডেটাবেস কখনো আপনার index নিজে মোছে না।'
    ref: write-cost-of-indexes
  - q: 'বছরে ৫ কোটি অর্ডার, বেশিরভাগই "delivered"; query চলে শুধু "pending" অর্ডার নিয়ে, ঘন ঘন। কোন index সবচেয়ে মানানসই?'
    hint: 'যে row-তে query কখনো যায় না, তাকে index-এ রাখার দরকার কী?'
    options:
      - text: 'status কলামে সাধারণ index'
        correct: false
        why: 'কোটি কোটি delivered row-ও index-এ ঢুকবে। বড় আর ধীর, অথচ query তাদের চায়ই না।'
      - text: 'শুধু (status = ''pending'') row-এর জন্য partial index'
        correct: true
        why: 'index ছোট থাকে, আর delivered হওয়া বেশিরভাগ লেখা এই index ছোঁয়ও না।'
      - text: 'প্রতিটা কলামে আলাদা index'
        correct: false
        why: 'লেখার খরচ বহুগুণ, অথচ কোনোটাই pending-এর জন্য বিশেষভাবে ছোট নয়।'
      - text: 'কোনো index নয়, সার্ভার বড় করা'
        correct: false
        why: 'সমস্যার মূল কারণ ভুল পড়ার পরিমাণ। বড় সার্ভারে সেটা শুধু চাপা পড়ে।'
    ref: write-cost-of-indexes
