slides:
  - slug: slow-without-index
    title: 'লাখ লাখ row, প্রতিবার সব পড়া'
    kind: story
    tldr: 'Index না থাকলে ডেটাবেস প্রতিটা query-তে টেবিলের সব row পড়ে; ১০ হাজার row-তে টের পাওয়া যায় না, ২০ লাখে ঠিকই যায়।'
    keywords: ['index', 'seq scan', 'full table scan', 'slow query', 'ইনডেক্স', 'ধীর query']
    blocks:
      - type: metaphor
        icon: book
        title: 'লাইব্রেরির ক্যাটালগ'
        body: |
          লাইব্রেরিতে ২০ লাখ বই। "রবীন্দ্রনাথের গীতবিতান" খুঁজতে আপনি তাকের প্রথম বই থেকে শেষ বই পর্যন্ত একটা একটা করে দেখছেন। ক্যাটালগ কার্ডের কাছে গেলে লেখকের নাম ধরে সাজানো কার্ডে সাথে সাথে পান "তাক ১৪, তৃতীয় সারি"। ডেটাবেসের index ঠিক এই ক্যাটালগ: সাজানো সূচি, যেখানে প্রতিটা এন্ট্রি বলে row কোথায় আছে।
      - type: text
        body: |
          রহিমের অ্যাপে `customer_order` টেবিলে ২০ লাখ row। "আমার অর্ডারগুলো" পাতা এক সপ্তাহ আগেও দ্রুত ছিল, এখন প্রতিবার প্রায় ০.৪ সেকেন্ড লাগে। আর কোড একটুও বদলায়নি; শুধু row বেড়েছে। সমাধান এক লাইনের, নিচে দেখানো আছে। এই segment-এর বাকিটা সেটা ঠিকভাবে করা আর তার দাম নিয়ে।
      - type: visual
        kind: bars
        caption: 'customer_id = 42 খুঁজতে ২০ লাখ row-এর টেবিলে সময়'
        items:
          - {label: 'index ছাড়া', value: 412, display: '412ms', tone: bad, tip: 'ডেটাবেস ২০ লাখ row-এর সবগুলো পড়ে দেখেছে, তারপর ২০টা বেছেছে। একে বলে sequential scan।'}
          - {label: 'index সহ', value: 1, display: '0.12ms', tone: good, tip: 'সাজানো সূচি ধরে সরাসরি কাস্টমার ৪২-এর row-গুলোতে গেছে, বাকি ১৯ লাখের বেশি row ছোঁয়নি।'}
      - type: code
        lang: sql
        file: 'এক লাইনের সমাধান'
        variant: good
        code: |
          CREATE INDEX idx_order_customer ON customer_order (customer_id);
          -- চালু PostgreSQL টেবিলে CONCURRENTLY যোগ করুন, যাতে লেখা আটকে না যায়
          -- দাম: এখন থেকে প্রতিটা নতুন row এই index-এও ঢুকবে (শেষ slide দেখুন)
      - type: quote
        body: 'Index ছাড়া প্রতিটা খোঁজা পুরো টেবিল পড়ে। row বাড়লে সময়ও সমান হারে বাড়ে।'
    aside:
      - type: story
        title: 'ঈদের আগের মাসে'
        body: 'এক ই-কমার্সের "আমার অর্ডার" পাতা বছরের শুরুতে ৫০ms-এ চলত। ঈদের মাসে অর্ডার বাড়ায় সেটা ৩ সেকেন্ডে পৌঁছাল। কারণ শুধু একটা index না থাকা।'
      - type: terms
        items:
          - {term: 'Sequential scan', meaning: 'টেবিলের প্রথম থেকে শেষ পর্যন্ত সব row পড়া।'}
          - {term: 'Index', meaning: 'কলামের মান ধরে সাজানো আলাদা সূচি, যা row-র অবস্থান বলে দেয়।'}
    check:
      q: 'একই query ১০ হাজার row-এ দ্রুত, ২০ লাখ row-এ ধীর কেন?'
      a: 'Index না থাকলে ডেটাবেস প্রতিবার সব row পড়ে। তাই row ২০০ গুণ বাড়লে পড়ার কাজও প্রায় ২০০ গুণ বাড়ে।'

  - slug: btree-how-it-works
    title: 'B-tree index আসলে কী'
    kind: concept
    tldr: 'B-tree হলো সাজানো গাছ: root থেকে নেমে মাত্র ৩-৪ ধাপে যেকোনো মান খুঁজে পাওয়া যায়, আর পাশাপাশি রাখা মানে range আর ORDER BY-ও সস্তা।'
    keywords: ['B-tree', 'index structure', 'range query', 'ORDER BY', 'বি-ট্রি', 'সাজানো']
    blocks:
      - type: metaphor
        icon: book
        title: 'ক্যাটালগের ড্রয়ার'
        body: |
          ক্যাটালগের বড় ড্রয়ারের গায়ে লেখা "অ থেকে ঘ"। সেখানে ঢুকে ছোট খোপে "ক থেকে কু", তারপর নির্দিষ্ট কার্ড। প্রতি ধাপে বাকি কার্ডের বেশিরভাগই বাদ পড়ে যায়। কার্ডগুলো পরপর সাজানো বলে "রবি থেকে রশিদ" একসাথে তুলে নেওয়াও সহজ।
      - type: visual
        kind: flow
        caption: 'B-tree-তে customer_id = 42 খোঁজার যাত্রা'
        nodes:
          - {id: q, label: 'query', sub: 'customer_id = 42', icon: search, col: 0, row: 1, tip: 'যে মানটা খোঁজা হচ্ছে।'}
          - {id: root, label: 'root page', sub: '১ - ২০ লাখ', icon: layers, col: 1, row: 1, tip: 'গাছের মাথা। এখানে লেখা থাকে কোন সীমার মান কোন শাখায় যাবে।'}
          - {id: branch, label: 'branch page', sub: '১ - ১০ হাজার', icon: layers, col: 2, row: 1, tip: 'মাঝের স্তর। সীমা আরও ছোট করে, আবার নিচের পথ দেখায়।'}
          - {id: leaf, label: 'leaf page', sub: '৪০ - ৪৫', icon: list, tone: accent, col: 3, row: 1, tip: 'সবচেয়ে নিচের স্তর। এখানে সাজানো মান আর প্রতিটার row-র অবস্থান থাকে। পাশের leaf-এর সাথে জোড়া, তাই range পড়া সহজ।'}
          - {id: table, label: 'টেবিলের row', sub: 'আসল ডেটা', icon: db, col: 4, row: 1, tip: 'leaf-এর অবস্থান ধরে আসল row পড়া হয়।'}
        edges:
          - {from: q, to: root, label: 'খোঁজা শুরু হয় root page থেকে'}
          - {from: root, to: branch, label: '৪২ আছে ১ - ১০ হাজারের শাখায়, তাই সেদিকে নামে'}
          - {from: branch, to: leaf, label: 'আরও ছোট সীমা: ৪০ - ৪৫ এর leaf-এ পৌঁছায়'}
          - {from: leaf, to: table, label: 'leaf-এর অবস্থান ধরে মাত্র ২০টা row তোলে', tone: good}
      - type: points
        title: 'সাজানো বলেই তিনটা কাজ সস্তা'
        style: check
        items:
          - 'মান ধরে খোঁজা: ২০ লাখ row-তেও গাছের উচ্চতা মাত্র ৩-৪।'
          - 'Range: created_at BETWEEN ... leaf-গুলো পাশাপাশি, তাই একটানা পড়া।'
          - 'ORDER BY: ইতিমধ্যে সাজানো, আলাদা sort লাগে না।'
    aside:
      - type: remember
        body: 'B-tree = সাজানো গাছ। খোঁজা, range আর ORDER BY, তিনটাই পায়।'
      - type: tips
        items:
          - 'PostgreSQL আর MySQL (InnoDB)-এর default index B-tree। আলাদা করে "B-tree" বলার দরকার পড়ে না।'
          - 'কলামের মান ঘুরিয়ে খোঁজা, যেমন LIKE ''%abc'', সাজানো গাছ কাজে লাগাতে পারে না।'
      - type: refs
        items:
          - {to: 'data/storage-engines', label: 'ভেতরে B-tree আর LSM-tree'}
    check:
      q: 'B-tree index কেন "সাজানো" বলে ORDER BY আর range query-তেও কাজে আসে?'
      a: 'কারণ leaf-এর মানগুলো পরপর সাজানো থাকে। তাই একটা সীমার মান একটানা পড়া যায়, আর ফল আগে থেকেই সাজানো পাওয়া যায়, আলাদা sort ছাড়া।'

  - slug: composite-index-order
    title: 'Composite index: কলামের ক্রম'
    kind: howto
    tldr: 'Composite index-এ কলামের ক্রম ঠিক করে কোন query কাজে লাগবে: সমতার শর্ত আগে, range বা sort পরে; আর বাঁ দিক থেকে না ধরলে index অচল।'
    keywords: ['composite index', 'leftmost prefix', 'column order', 'Doctrine Index', 'কম্পোজিট ইনডেক্স']
    blocks:
      - type: metaphor
        icon: book
        title: 'ফোনবুকের নিয়ম'
        body: |
          ফোনবুক সাজানো থাকে প্রথমে পদবি, তারপর নাম দিয়ে। "রহমান" খুঁজে তার ভেতরে "করিম" পাওয়া সহজ। কিন্তু শুধু "করিম" খুঁজতে চাইলে পুরো বই উল্টাতে হবে। এটাই leftmost prefix নিয়ম: index বাঁ দিকের কলাম থেকে শুরু হওয়া শর্তেই কাজ করে।
      - type: code
        lang: php
        file: 'src/Entity/CustomerOrder.php'
        variant: good
        code: |
          #[ORM\Entity]
          #[ORM\Table(name: 'customer_order')]
          #[ORM\Index(
              name: 'idx_order_customer_created',
              columns: ['customer_id', 'created_at'],
          )]
          class CustomerOrder
          {
              #[ORM\Column]
              private int $customerId;

              #[ORM\Column]
              private \DateTimeImmutable $createdAt;
          }
        marks:
          - {line: 4, tip: 'index-এর নাম নিজে দিন, যাতে EXPLAIN-এ বা migration-এ চেনা যায়।'}
          - {line: 5, tip: 'সমতার কলাম (customer_id) আগে, সাজানোর কলাম (created_at) পরে। এই ক্রমই "আমার অর্ডার, নতুন আগে" query-কে এক index-এই মেটায়।'}
      - type: visual
        kind: table
        caption: 'index (customer_id, created_at)-এ কোন query কাজে লাগে'
        headers: ['query-র শর্ত', 'index কাজে লাগে?']
        rows:
          - cells: ['customer_id = 42', 'হ্যাঁ, বাঁ দিকের কলাম']
            tip: 'প্রথম কলাম ধরেই খোঁজা, পুরো কাজে লাগে।'
          - cells: ['customer_id = 42 ORDER BY created_at DESC', 'হ্যাঁ, খোঁজা ও সাজানো দুটোই']
            tip: 'customer_id-র ভেতরে created_at সাজানো, তাই আলাদা sort লাগে না।'
          - cells: ['customer_id = 42 AND created_at > ''2026-01-01''', 'হ্যাঁ, পুরো index']
            tip: 'সমতা, তারপর range। দুই কলামই ব্যবহার হয়।'
          - cells: ['created_at > ''2026-01-01''', 'না, বাঁ কলাম বাদ']
            tip: 'প্রথম কলাম ছাড়া শুরুই করা যায় না। ফোনবুকে শুধু নাম দিয়ে খোঁজার মতো।'
          - cells: ['index (created_at, customer_id) হলে customer_id = 42', 'না: ভুল কলাম আগে']
            tip: 'একই দুই কলাম উল্টো ক্রমে বসালে অন্য ধরনের query-তে কাজ করে। ক্রম একটা সিদ্ধান্ত, খুঁটিনাটি নয়।'
      - type: quote
        body: 'কলামের ক্রম: সমতার শর্ত আগে, range বা ORDER BY-র কলাম পরে। আর বাঁ থেকে শুরু না হলে index অচল।'
    aside:
      - type: tips
        items:
          - 'আলাদা আলাদা দুটো single-column index সাধারণত একটা সঠিক composite index-এর সমান কাজ করে না।'
          - 'প্রথমে query লিখুন, তারপর index। "কলামটা তো কখনো খোঁজা হতে পারে" ভেবে বানাবেন না।'
      - type: refs
        items:
          - {to: 'api/pagination', label: 'cursor pagination-এ এই index-ই লাগে'}
    check:
      q: 'index (customer_id, created_at) আছে। শুধু WHERE created_at > ... query-তে এটা কাজে আসবে না কেন?'
      a: 'কারণ index প্রথমে customer_id দিয়ে সাজানো। created_at শুধু প্রতিটা customer_id-র ভেতরে সাজানো, তাই প্রথম কলাম ছাড়া সেখানে ঢোকার পথ নেই।'

  - slug: read-explain
    title: 'EXPLAIN দিয়ে query plan পড়া'
    kind: howto
    tldr: 'EXPLAIN (ANALYZE) বলে ডেটাবেস আসলে কীভাবে query চালাল; Seq Scan থেকে Index Scan হলে index কাজ করছে, আর covering index আসল row ছোঁয়া থেকেও বাঁচায়।'
    keywords: ['EXPLAIN', 'EXPLAIN ANALYZE', 'query plan', 'Index Only Scan', 'covering index', 'INCLUDE']
    blocks:
      - type: text
        body: |
          Index বানিয়েছেন বলেই ডেটাবেস সেটা ব্যবহার করছে, এমন নয়। নিশ্চিত হতে query-র আগে `EXPLAIN (ANALYZE, BUFFERS)` বসান। এটা query সত্যিই চালায়, আর প্ল্যান ও আসল সময় দেখায়। প্রথমে এক নজরে দেখুন কোন "Scan" শব্দ আছে।
      - type: code
        lang: text
        file: 'EXPLAIN ANALYZE (index নেই)'
        variant: bad
        code: |
          Limit  (actual time=410.8..412.5 rows=20 loops=1)
            ->  Sort  (actual time=410.8..410.9 rows=20 loops=1)
                  Sort Key: created_at DESC
                  ->  Seq Scan on customer_order
                        (actual time=0.02..408.9 rows=20 loops=1)
                        Filter: (customer_id = 42)
                        Rows Removed by Filter: 1999980
          Execution Time: 412.7 ms
        marks:
          - {line: 4, tip: 'Seq Scan: পুরো টেবিল পড়া। বড় টেবিলে এটাই লাল সংকেত।'}
          - {line: 7, tip: 'Rows Removed by Filter প্রায় ২০ লাখ: পড়ে ফেলে দেওয়া row। ২০টা পেতে ২০ লাখ ছুঁয়েছে।'}
      - type: code
        lang: sql
        file: 'index বসানোর পর, তারপর covering index'
        variant: good
        code: |
          CREATE INDEX idx_order_customer_created
            ON customer_order (customer_id, created_at);

          EXPLAIN (ANALYZE, BUFFERS)
          SELECT id, total_in_poisha FROM customer_order
          WHERE customer_id = 42 ORDER BY created_at DESC LIMIT 20;
          -- Index Scan Backward using idx_order_customer_created
          -- Execution Time: 0.12 ms

          -- Covering: query-র কলাম index-এই রাখা
          CREATE INDEX idx_order_customer_cov
            ON customer_order (customer_id, created_at)
            INCLUDE (total_in_poisha);
          -- এখন প্ল্যানে Index Only Scan: টেবিলের row ছুঁতে হয় না
        marks:
          - {line: 7, tip: 'Index Scan Backward: নতুন-আগে সাজানো index উল্টো দিক থেকে পড়ছে। আলাদা Sort ধাপ নেই।'}
          - {line: 8, tip: '412ms থেকে 0.12ms। এই সংখ্যাটাই আসল প্রমাণ।'}
          - {line: 13, tip: 'INCLUDE: এই কলাম leaf-এ কপি থাকে। query-র সব কলাম index-এই পেলে আসল টেবিলে যেতে হয় না।'}
    aside:
      - type: commands
        title: 'প্ল্যান দেখার উপায়'
        items:
          - {cmd: 'EXPLAIN SELECT ...', desc: 'শুধু প্ল্যান, query চালায় না'}
          - {cmd: 'EXPLAIN (ANALYZE, BUFFERS) SELECT ...', desc: 'সত্যিই চালিয়ে আসল সময় দেখায়'}
      - type: pitfalls
        items:
          - 'EXPLAIN ANALYZE সত্যিই query চালায়। INSERT/UPDATE হলে BEGIN ... ROLLBACK-এর ভেতরে চালান।'
          - 'ছোট টেবিলে ডেটাবেস ইচ্ছে করেই Seq Scan বাছে, কারণ সেটা সস্তা। প্রোডাকশনের মতো ডেটাতে পরীক্ষা করুন।'
          - 'Covering index (INCLUDE) index বড় করে আর প্রতিটা লেখা ভারী করে। এক-দুটো সবচেয়ে ঘন ঘন চলা query-র জন্যই রাখুন।'
    check:
      q: 'EXPLAIN-এর ফলে "Seq Scan" আর "Rows Removed by Filter: 1999980" দেখলে কী বুঝবেন?'
      a: 'ডেটাবেস পুরো টেবিল পড়ে প্রায় সব row ফেলে দিয়েছে। শর্তের কলামে ঠিক ক্রমের index নেই, বা ডেটাবেস সেটা ব্যবহার করছে না।'

  - slug: write-cost-of-indexes
    title: 'Index-এর দাম: লেখা ধীর হয়'
    kind: pitfall
    tldr: 'প্রতিটা index পড়া দ্রুত করে কিন্তু প্রতিটা INSERT/UPDATE/DELETE-এ নিজেকেও হালনাগাদ করাতে হয়; তাই শুধু যেটা কাজে লাগে সেটা রাখুন, আর partial index দিয়ে ছোট রাখুন।'
    keywords: ['write amplification', 'partial index', 'unused index', 'too many indexes', 'index cost', 'WHERE index']
    blocks:
      - type: metaphor
        icon: book
        title: 'নতুন বই এলে ক্যাটালগ'
        body: |
          লাইব্রেরিতে একটা নতুন বই এল। লেখক-ক্যাটালগে কার্ড বসাতে হয়, বিষয়-ক্যাটালগে বসাতে হয়, প্রকাশক-ক্যাটালগেও। ক্যাটালগ যত বেশি, বই তোলা তত ধীর। ডেটাবেসেও প্রতিটা নতুন row প্রতিটা index-এ সঠিক জায়গায় ঢোকাতে হয়।
      - type: visual
        kind: compare
        caption: 'এক টেবিলে ২টা index বনাম ১০টা index'
        columns:
          - title: '২টা কাজের index'
            tone: good
            icon: check
            tip: 'প্রতিটা index কোনো না কোনো গুরুত্বপূর্ণ query-র জন্য আছে, আর লেখার বাড়তি খরচ সামান্য।'
            items:
              - 'প্রতিটা INSERT: ১ টেবিল-লেখা + ২ index-লেখা = ৩টা লেখা'
              - 'ডিস্কে কম জায়গা'
              - 'প্রতিটা index একটা query-র কাজে আসে'
          - title: '১০টা "হয়তো লাগবে" index'
            tone: bad
            icon: warning
            tip: 'বেশিরভাগ index কেউ কখনো পড়ে না, অথচ প্রতিটা লেখায় সবাই হালনাগাদ হয়।'
            items:
              - 'প্রতিটা INSERT: ১ টেবিল-লেখা + ১০ index-লেখা = ১১টা লেখা'
              - 'টেবিলের চেয়ে index বড় হয়ে যেতে পারে'
              - 'অব্যবহৃত index শুধু বোঝা'
      - type: code
        lang: php
        file: 'src/Entity/CustomerOrder.php'
        variant: good
        code: |
          #[ORM\Index(
              name: 'idx_order_pending',
              columns: ['created_at'],
              options: ['where' => "(status = 'pending')"],
          )]
          class CustomerOrder
          {
              // ...
          }
        marks:
          - {line: 4, tip: 'Partial index: শুধু pending অর্ডারই index-এ ঢোকে। বাকি কোটি কোটি সম্পন্ন অর্ডার এই index-কে ভারী করে না। Doctrine-এ options দিয়ে where পাঠানো যায় (PostgreSQL)।'}
      - type: quote
        body: 'প্রতিটা index পড়া দ্রুত করে, কিন্তু প্রতিটা লেখা ধীর করে। শুধু সেই index রাখুন যা কোনো query-তে ব্যবহার হয়।'
    aside:
      - type: commands
        title: 'অব্যবহৃত index খোঁজা (PostgreSQL)'
        items:
          - {cmd: 'SELECT relname, indexrelname, idx_scan FROM pg_stat_user_indexes WHERE idx_scan = 0;', desc: 'যেসব index কখনো ব্যবহার হয়নি'}
      - type: tips
        items:
          - 'Partial index কাজে লাগে শুধু তখন, যখন query-ও একই শর্ত লেখে (WHERE status = ''pending'')। শর্তটা বাদ দিলে ডেটাবেস এটা ব্যবহার করতে পারে না।'
          - 'index ফেলার আগে ক্রমানুসারে দেখুন, কয়েক সপ্তাহের পুরো ট্রাফিকে (মাস-শেষের রিপোর্টসহ) idx_scan শূন্যই ছিল কি না।'
          - 'অনেক ঘন ঘন লেখা হয় এমন টেবিলে (log, event) index যতটা পারেন কম রাখুন।'
    check:
      q: 'বেশি index থাকলে লেখা ধীর হয় কেন, আর partial index কীভাবে সাহায্য করে?'
      a: 'প্রতিটা লেখায় প্রতিটা index-কেও হালনাগাদ করতে হয়। Partial index শুধু শর্তে মেলে এমন row রাখে, তাই ছোট থাকে আর সব লেখায় তাকে ছুঁতে হয় না।'

flashcards:
  - q: 'Index কী, আর সে কীভাবে query দ্রুত করে?'
    a: 'কলামের মান ধরে সাজানো আলাদা সূচি, যা row-র অবস্থান বলে দেয়, তাই পুরো টেবিল পড়তে হয় না।'
    more: |
      লাইব্রেরির ক্যাটালগের মতো: সাজানো কার্ড দেখে সরাসরি তাকে যাওয়া যায়। Index ছাড়া ডেটাবেস প্রতিটা row একটা একটা করে পড়ে (sequential scan)।
    ref: slow-without-index
  - q: 'B-tree index কোন কোন কাজে ভালো?'
    a: 'মান ধরে খোঁজা (=), range (BETWEEN, >, <) আর ORDER BY, কারণ মানগুলো সাজানো থাকে।'
    more: |
      গাছের উচ্চতা ২০ লাখ row-তেও মাত্র ৩-৪, তাই খোঁজা কয়েক ধাপেই শেষ। leaf-গুলো পাশাপাশি জোড়া, তাই range একটানা পড়া যায়। তবে LIKE '%abc' ধরনের মাঝখান থেকে খোঁজায় সাজানো গাছ কাজে আসে না।
    ref: btree-how-it-works
  - q: 'Leftmost prefix নিয়ম কী?'
    a: 'Composite index শুধু সেই query-তে কাজ করে যার শর্ত index-এর বাঁ দিকের কলাম থেকে শুরু হয়।'
    more: |
      index (a, b) থাকলে a দিয়ে, বা a ও b দুটো দিয়ে খোঁজা চলে। কিন্তু শুধু b দিয়ে খুঁজলে index কাজে আসে না। ফোনবুকে পদবি, তারপর নাম: শুধু নাম দিয়ে খোঁজা যায় না।
    ref: composite-index-order
  - q: 'Composite index-এ কলাম সাজাবে কোন ক্রমে?'
    a: 'সমতার (=) শর্তের কলাম আগে, তারপর range বা ORDER BY-র কলাম।'
    more: |
      WHERE customer_id = 42 ORDER BY created_at DESC-এর জন্য ঠিক index হলো (customer_id, created_at)। সমতার কলাম আগে থাকলে তার ভেতরে বাকি কলাম সাজানো থাকে, তাই আলাদা sort লাগে না।
    ref: composite-index-order
  - q: 'EXPLAIN-এ Seq Scan দেখলে কী বুঝবে?'
    a: 'ডেটাবেস পুরো টেবিল পড়েছে। বড় টেবিলে এটা সাধারণত index না থাকার বা ব্যবহার না হওয়ার লক্ষণ।'
    more: |
      Rows Removed by Filter-এ বড় সংখ্যা দেখলে বোঝা যায় কত row পড়ে ফেলে দেওয়া হয়েছে। ছোট টেবিলে Seq Scan ঠিক আছে, ওটা ডেটাবেসের ইচ্ছাকৃত সস্তা বাছাই। সবসময় প্রোডাকশনের মতো আকারের ডেটায় পরীক্ষা করুন।
    ref: read-explain
  - q: 'Covering index কী?'
    a: 'যে index-এ query-র দরকারি সব কলামই আছে, তাই আসল টেবিলের row ছুঁতেই হয় না (Index Only Scan)।'
    more: |
      PostgreSQL-এ INCLUDE (col) দিয়ে অতিরিক্ত কলাম leaf-এ রাখা যায়। এতে পড়া আরও দ্রুত হয়, কিন্তু index বড় হয়, আর লেখার খরচ বাড়ে। তাই শুধু খুব ঘন ঘন চলা query-র জন্য ব্যবহার করুন।
    ref: read-explain
  - q: 'Partial index কী, কখন কাজে লাগে?'
    a: 'WHERE শর্ত দিয়ে শুধু কিছু row-কে index করা (যেমন status = pending)। ছোট থাকে, আর বাকি row-র লেখা ধীর করে না।'
    more: |
      যে টেবিলে বেশিরভাগ row "শেষ হয়ে গেছে" আর query শুধু চলমান row নিয়ে, সেখানে পুরো টেবিলের index অপচয়। Doctrine-এ #[ORM\Index(options: ['where' => '...'])] দিয়ে PostgreSQL-এ partial index বসানো যায়। Query-কেও একই WHERE শর্ত লিখতে হয়, তবেই এটা কাজে লাগে।
    ref: write-cost-of-indexes
  - q: 'বেশি index থাকার দাম কী?'
    a: 'প্রতিটা INSERT, UPDATE ও DELETE-এ প্রতিটা index হালনাগাদ করতে হয়, তাই লেখা ধীর হয় আর ডিস্ক বাড়ে।'
    more: |
      নতুন বই এলে প্রতিটা ক্যাটালগে কার্ড বসানোর মতো। যে index কোনো query-তে ব্যবহার হয় না, সে শুধু লেখার খরচ বাড়ায়। PostgreSQL-এর pg_stat_user_indexes দেখে idx_scan = 0 index খুঁজে বাদ দিন।
    ref: write-cost-of-indexes

quiz:
  - q: 'রহিমের query: WHERE customer_id = 42 AND status = ''paid'' ORDER BY created_at DESC LIMIT 20। কোন composite index সবচেয়ে ভালো?'
    hint: 'সমতার কলাম আগে, সাজানোর কলাম শেষে।'
    options:
      - text: '(created_at, customer_id, status)'
        correct: false
        why: 'সাজানোর কলাম সামনে রাখলে customer_id দিয়ে সরাসরি খোঁজা যায় না। প্রতিটা row-ই দেখতে হয়।'
      - text: '(status, created_at)'
        correct: false
        why: 'customer_id বাদ পড়েছে। status-এর মান মাত্র কয়েকটা, তাই এটা প্রায় কিছুই ছাঁটে না।'
      - text: '(customer_id, status, created_at)'
        correct: true
        why: 'দুটো সমতার কলাম আগে, সাজানোর কলাম শেষে। customer_id আর status দিয়ে ছেঁটে created_at-এর সাজানো ক্রমে সরাসরি ২০টা তোলা যায়।'
      - text: 'প্রতিটা কলামের জন্য আলাদা আলাদা তিনটা index'
        correct: false
        why: 'ডেটাবেস সাধারণত একটাকে বেছে নেয়, বাকিগুলো সাজানো ক্রম দিতে পারে না। লেখার খরচ তিন গুণ।'
    ref: composite-index-order
  - q: 'index (customer_id, created_at) আছে। নিচের কোন query-গুলোতে এটা কাজে লাগবে?'
    hint: 'প্রথম কলাম শর্তে আছে কি না দেখুন।'
    options:
      - text: 'WHERE customer_id = 7'
        correct: true
        why: 'বাঁ দিকের প্রথম কলাম দিয়ে শুরু, সরাসরি কাজে লাগে।'
      - text: 'WHERE created_at > ''2026-01-01'''
        correct: false
        why: 'প্রথম কলাম ছাড়া index-এ ঢোকার পথ নেই। leftmost prefix নিয়ম ভাঙে।'
      - text: 'WHERE customer_id = 7 AND created_at > ''2026-01-01'''
        correct: true
        why: 'সমতা, তারপর range। দুটো কলামই index-এর ক্রমে।'
      - text: 'WHERE customer_id = 7 ORDER BY created_at DESC'
        correct: true
        why: 'customer_id-র ভেতরে created_at সাজানো, তাই আলাদা sort ছাড়াই ফল মেলে।'
    ref: composite-index-order
  - q: 'নিচের EXPLAIN-এর ফল দেখে কী করা উচিত?'
    lang: text
    code: |
      Seq Scan on customer_order
        (actual time=0.02..408.9 rows=20 loops=1)
        Filter: (customer_id = 42)
        Rows Removed by Filter: 1999980
      Execution Time: 412.7 ms
    hint: '২০টা row পেতে কতগুলো row ছোঁয়া হয়েছে?'
    options:
      - text: 'customer_id-তে index বানিয়ে আবার EXPLAIN চালিয়ে মিলিয়ে দেখা'
        correct: true
        why: '২০টার জন্য ২০ লাখ row পড়া হয়েছে। index বসালে প্ল্যান Index Scan হওয়ার কথা, আর সেটা EXPLAIN-এ যাচাই করতে হবে।'
      - text: 'ডেটাবেস সার্ভারে RAM বাড়ানো'
        correct: false
        why: 'RAM বাড়ালে সব row আরও দ্রুত পড়া যাবে, কিন্তু তবু ২০ লাখ row-ই পড়তে হবে। সমস্যা কাজের পরিমাণে।'
      - text: 'LIMIT-এর সংখ্যা ১০ করে দেওয়া'
        correct: false
        why: 'এখানে সমস্যা ফিল্টারে। LIMIT কমালে পড়ার কাজ প্রায় একই থাকে।'
      - text: 'কিছু না, ৪১২ms সবসময় ঠিক আছে'
        correct: false
        why: '২০টা row-এর জন্য ৪১২ms অনেক বেশি, আর row বাড়লে সেটা আরও বাড়বে।'
    ref: read-explain
  - q: 'একটা log টেবিলে প্রতি সেকেন্ডে হাজার হাজার INSERT হয়, আর টেবিলে ৮টা index। কী সমস্যা হবে?'
    hint: 'প্রতিটা INSERT কয়টা জায়গায় লেখে?'
    options:
      - text: 'SELECT ধীর হবে, কারণ index বেশি হলে খোঁজা ধীর'
