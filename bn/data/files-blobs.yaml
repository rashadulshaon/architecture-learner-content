slides:
  - slug: photos-in-the-wrong-place
    title: 'ছবি রাখলাম ডেটাবেসে আর সার্ভারের ডিস্কে'
    kind: story
    tldr: 'ছবি ডেটাবেসে রাখলে সেটা ফুলে যায়; সার্ভারের ডিস্কে রাখলে দ্বিতীয় সার্ভারে ছবি মেলে না আর deploy-এ হারায়।'
    keywords: ['blob', 'file upload', 'local disk', 'BLOB column', 'object storage', 'ফাইল আপলোড']
    blocks:
      - type: metaphor
        icon: box
        title: 'দোকানের পেছনের কোণে গুদাম'
        body: |
          মুদি দোকানদার প্রতিটা বস্তা খাতার পাতার ভেতরে গুঁজে রাখলে খাতা ফুলে ফেঁপে যায়। আবার সব বস্তা দোকানের এক কোণেই রাখলে নতুন শাখায় সেই মাল নেই, আর দোকান বদলালে মালও হারায়। দরকার আলাদা গুদাম; খাতায় লেখা থাকে শুধু "বস্তা নম্বর ১২, গুদামের তাক ৩"।
      - type: text
        body: |
          রহিমের অ্যাপে ব্যবহারকারীর প্রোফাইল ছবি দুইভাবে রাখা যেত, আর দুটোই পরে ভোগায়। নিচের কোড ছবিটা সার্ভারের `public/uploads` ফোল্ডারে রাখে।
      - type: code
        lang: php
        file: 'src/Controller/AvatarController.php'
        variant: bad
        code: |
          #[Route('/avatar', methods: ['POST'])]
          public function upload(Request $request): JsonResponse
          {
              $file = $request->files->get('avatar');
              $name = $file->getClientOriginalName();   // ব্যবহারকারীর দেওয়া নাম

              // এই সার্ভারের নিজের ডিস্কে
              $file->move($this->getParameter('kernel.project_dir').'/public/uploads', $name);

              return $this->json(['url' => '/uploads/'.$name]);
          }
        marks:
          - {line: 8, tip: 'দ্বিতীয় সার্ভার বা নতুন container এই ফাইল দেখতে পাবে না। deploy-এ ফোল্ডার মুছে গেলে ছবিও যায়।'}
          - {line: 5, tip: 'একই নামে দুজন আপলোড করলে একজনের ছবি আরেকজনের উপর লেখা হয়ে যায়।'}
      - type: visual
        kind: compare
        caption: 'ফাইল রাখার তিন জায়গা: দুইটা সমস্যার, একটা ঠিক'
        columns:
          - title: 'ডেটাবেসের BLOB'
            tone: bad
            icon: db
            tip: 'ডেটাবেস ছোট, দ্রুত, জটিল query-র জন্য; বড় বাইনারি রাখার জন্য নয়।'
            items:
              - 'ডেটাবেস ফুলে যায়, backup বিশাল'
              - 'প্রতিটা ছবি পড়া মানে ডেটাবেসের বাড়তি চাপ'
          - title: 'সার্ভারের লোকাল ডিস্ক'
            tone: bad
            icon: server
            tip: 'একটাই সার্ভার থাকলে চলে; সার্ভার বাড়লেই ভাঙে।'
            items:
              - 'অন্য সার্ভারে ফাইল নেই'
              - 'deploy বা container বদলালে হারায়'
          - title: 'Object storage'
            tone: good
            icon: storage
            tip: 'S3-এর মতো সেবা, ফাইল রাখার জন্যই বানানো; কত ফাইল রাখলে ক্ষতি নেই।'
            items:
              - 'সব সার্ভার একই জায়গা পায়'
              - 'অনেক সস্তা, টেকসই, ঠিকমতো backup'
    aside:
      - type: story
        title: 'দুই সার্ভারের ছবি-রহস্য'
        body: |
          অ্যাপে দ্বিতীয় সার্ভার যোগ হওয়ার পর কিছু ব্যবহারকারী বলল, ছবি কখনো আসে কখনো আসে না। load balancer অর্ধেক request পাঠাত সেই সার্ভারে, যেখানে ছবিটাই ছিল না।
      - type: terms
        items:
          - {term: 'BLOB', meaning: 'Binary Large Object: ছবি, PDF, ভিডিওর মতো বড় বাইনারি ডেটা।'}
          - {term: 'Object storage', meaning: 'key ধরে ফাইল রাখার সেবা (S3, Cloudflare R2, MinIO)।'}
    check:
      q: 'দুই সার্ভারে অ্যাপ চলছে। ছবি একটা সার্ভারের ডিস্কে রাখলে কী সমস্যা হবে?'
      a: 'অন্য সার্ভারে ফাইলটা নেই, তাই load balancer সেখানে request পাঠালে ছবি পাওয়া যাবে না। ফাইল এমন জায়গায় রাখতে হবে, যেটা সব সার্ভার দেখতে পায়।'

  - slug: object-storage-flysystem
    title: 'Object storage: ডেটাবেসে থাকবে শুধু key'
    kind: concept
    tldr: 'ফাইল যায় object storage-এ, ডেটাবেসে থাকে ফাইলের key আর metadata। Flysystem দিয়ে লিখলে storage বদলালেও কোড বদলায় না।'
    keywords: ['Flysystem', 'S3', 'storage key', 'metadata', 'filesystem abstraction', 'অবজেক্ট স্টোরেজ']
    blocks:
      - type: text
        body: |
          গুদামের বস্তার নম্বরটাই **key**, যেমন `avatars/0192.../original.jpg`। অ্যাপের ডেটাবেসে শুধু এই key, আকার, ধরন আর মালিকের id থাকে। ফাইলের নাম ব্যবহারকারী যা-ই দিক, key সার্ভার নিজে বানায় (UUID), যাতে কেউ কারো ফাইল ওভাররাইট না করে। Symfony-তে **Flysystem** দিয়ে লিখলে আজ লোকাল ফোল্ডার, কাল S3: শুধু config বদলায়।
      - type: code
        lang: yaml
        file: 'config/packages/flysystem.yaml'
        variant: good
        code: |
          flysystem:
              storages:
                  uploads.storage:
                      adapter: 'aws'
                      options:
                          client: 'aws_s3_client'   # services.yaml-এ বানানো Aws\S3\S3Client
                          bucket: '%env(S3_BUCKET)%'
                          prefix: 'uploads'
        marks:
          - {line: 3, tip: 'storage-এর নাম। এই নাম থেকেই autowiring-এর `$uploadsStorage` আসে।'}
          - {line: 4, tip: 'adapter বদলালেই (local, aws, gcs) বাকি কোড অপরিবর্তিত থাকে।'}
      - type: code
        lang: php
        file: 'src/Service/AvatarStorage.php'
        variant: good
        code: |
          final readonly class AvatarStorage
          {
              public function __construct(private FilesystemOperator $uploadsStorage) {}

              public function store(UploadedFile $file): string
              {
                  $key = sprintf('avatars/%s.%s', Uuid::v7(), $file->guessExtension());

                  $stream = fopen($file->getPathname(), 'rb');
                  $this->uploadsStorage->writeStream($key, $stream);   // stream, পুরো ফাইল RAM-এ নয়
                  is_resource($stream) && fclose($stream);

                  return $key;   // ডেটাবেসের কলামে এটাই যাবে
              }
          }
        marks:
          - {line: 7, tip: 'key সার্ভার বানায়, তাই ব্যবহারকারীর দেওয়া নাম নিয়ে কোনো বিপদ নেই।'}
          - {line: 10, tip: '`writeStream` ফাইল ধাপে ধাপে পাঠায়, তাই বড় ফাইলেও মেমোরি বেশি খরচ হয় না।'}
      - type: quote
        body: 'ডেটাবেসে রাখুন key; ফাইল রাখুন object storage-এ।'
    aside:
      - type: tips
        items:
          - 'bucket ডিফল্টে private রাখুন। ফাইল দেখাতে হলে signed URL বা CDN ব্যবহার করুন।'
          - 'কলামে `avatar_key VARCHAR(255)` রাখুন, পুরো URL নয়; পরে domain বদলালেও ডেটা ঠিক থাকে।'
      - type: commands
        title: 'প্যাকেজ'
        items:
          - {cmd: 'composer require league/flysystem-bundle', desc: 'Flysystem বান্ডেল'}
          - {cmd: 'composer require league/flysystem-aws-s3-v3', desc: 'S3 adapter'}
      - type: when
        use:
          - 'একাধিক সার্ভার, বা যে ফাইল deploy পার হয়েও থাকতে হবে'
          - 'ব্যবহারকারীর আপলোড করা যেকোনো ফাইল'
        avoid:
          - 'একটাই সার্ভার, অ্যাপের সঙ্গে আসা কয়েকটা ফাইল: সাধারণ ফোল্ডারই সোজা'
          - 'যা ডেটাবেস transaction-এর সঙ্গে rollback হতে হবে: ফাইল আর সারি দুটো আলাদা জায়গা, তাই pending অবস্থা রাখুন (আপলোডের স্লাইডগুলো দেখুন)'
    check:
      q: 'ডেটাবেসে ফাইলের পুরো URL না রেখে শুধু key রাখলে কী সুবিধা?'
      a: 'bucket, CDN বা domain বদলালেও ডেটাবেসের ডেটা বদলাতে হয় না। URL তখন key থেকে বানিয়ে নেওয়া যায়।'

  - slug: presigned-direct-upload
    title: 'Presigned URL: ফাইল যাক সরাসরি storage-এ'
    kind: howto
    tldr: 'সার্ভার সময়-সীমার একটা signed ফর্ম বানিয়ে দেয়; Vue অ্যাপ সেখানে সরাসরি ফাইল POST করে, আর আকারের সীমা storage নিজেই মানায়। ফাইল সার্ভারের ভেতর দিয়ে যায় না।'
    keywords: ['presigned URL', 'signed URL', 'direct upload', 'presigned POST', 'content-length-range', 'XMLHttpRequest progress']
    blocks:
      - type: text
        body: |
          গুদামের গেটে ঢুকতে সবাইকে ঠেকাতে হয়, আবার প্রত্যেক ট্রাক মালিকের অফিস হয়ে যেতে হলে সময় যায়। তাই মালিক ১০ মিনিটের একটা সই-করা চিরকুট (**presigned URL**) দেয়; ট্রাক সোজা গুদামে মাল নামায়। এতে আপনার PHP সার্ভার ফাইলের বোঝা বয় না। সার্ভার শুধু অনুমতি দেয়, আর পরে নিশ্চিত করে ফাইল সত্যিই এসেছে কি না। চিরকুটে "৫ MB-র বেশি ভারী বস্তা নয়" শর্তও লেখা যায়, তবে তার জন্য লাগে policy-সহ presigned **POST**: presigned PUT আকার আটকাতে পারে না।
      - type: visual
        kind: sequence
        caption: 'আপলোডের তিন ধাপ: অনুমতি, সরাসরি আপলোড, নিশ্চিতকরণ'
        actors:
          - {id: vue, label: 'Vue অ্যাপ', icon: browser, tip: 'ব্যবহারকারীর ব্রাউজারে ফাইল বাছাই হয়।'}
          - {id: api, label: 'Symfony API', icon: server, tip: 'অনুমতি দেয় আর শেষে যাচাই করে; ফাইল ধরে না।'}
          - {id: s3, label: 'Object storage', icon: storage, tip: 'ফাইল সরাসরি এখানে আসে।'}
        messages:
          - {from: vue, to: api, label: 'একটা avatar আপলোড করতে চাই'}
          - {from: api, to: vue, label: 'এই URL-এ POST করুন: ৫ MB, ১০ মিনিট', dashed: true, tip: 'সই-করা policy-তে key, ধরন, আকারের সীমা আর মেয়াদ বাঁধা; এর বাইরে গেলে storage ফিরিয়ে দেয়।'}
          - {from: vue, to: s3, label: 'POST ফাইল (সরাসরি)', tone: good, tip: 'আপনার সার্ভারের CPU, মেমোরি বা নেটওয়ার্ক এতে খরচ হয় না। ৫ MB-র বেশি ফাইল storage নিজেই ফেরায়।'}
          - {from: vue, to: api, label: 'আপলোড শেষ'}
          - {from: api, to: s3, label: 'ফাইল আছে? আকার কত?', tip: 'ক্লায়েন্টকে অন্ধভাবে বিশ্বাস না করে নিজে যাচাই।'}
          - {at: api, note: 'সব ঠিক: ডেটাবেসে key সেভ', tone: good}
      - type: code
        lang: php
        file: 'src/Controller/UploadController.php'
        variant: good
        code: |
          #[Route('/uploads/presign', methods: ['POST'])]
          #[IsGranted('ROLE_USER')]
          public function presign(S3Client $s3): JsonResponse
          {
              $key = sprintf('avatars/%s.jpg', Uuid::v7());
              $this->pending->add($key, new \DateTimeImmutable('+1 hour'));   // পরের স্লাইড

              $post = new PostObjectV4(
                  $s3,
                  $this->bucket,
                  ['key' => $key, 'Content-Type' => 'image/jpeg'],   // ফর্মকে যে field পাঠাতে হবে
                  [
                      ['bucket' => $this->bucket],
                      ['key' => $key],
                      ['eq', '$Content-Type', 'image/jpeg'],
                      ['content-length-range', 1, 5 * 1024 * 1024],   // ১ বাইট থেকে ৫ MB
                  ],
                  '+10 minutes',
              );

              return $this->json([
                  'key' => $key,
                  'url' => $post->getFormAttributes()['action'],
                  'fields' => $post->getFormInputs(),
              ]);
          }
        marks:
          - {line: 6, tip: 'URL বানানোর মুহূর্তেই key-টা "pending" হিসেবে টুকে রাখুন, যাতে confirm না হওয়া আপলোড পরে সাফ করা যায়।'}
          - {line: 16, tip: 'আকারের সীমা সই-করা policy-তেই আছে, তাই বড় ফাইল storage নিজেই ফেরায়। presigned PUT-এ এমন নিয়ম নেই।'}
      - type: code
        lang: vue
        file: 'src/components/AvatarUpload.vue'
        variant: good
        code: |
          <script setup lang="ts">
          import { ref } from 'vue'
          const progress = ref(0)

          async function upload(file: File) {
            const res = await fetch('/uploads/presign', { method: 'POST' })
            const { key, url, fields } = await res.json()

            const form = new FormData()
            for (const [name, value] of Object.entries(fields)) form.append(name, value as string)
            form.append('file', file)   // file field সবার শেষে থাকতে হবে

            await new Promise<void>((resolve, reject) => {
              const xhr = new XMLHttpRequest()
              xhr.open('POST', url)
              xhr.upload.onprogress = (e) => (progress.value = Math.round((e.loaded / e.total) * 100))
              xhr.onload = () => (xhr.status < 300 ? resolve() : reject(new Error('upload failed')))
              xhr.onerror = () => reject(new Error('network'))
              xhr.send(form)
            })
            await fetch('/uploads/confirm', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ key }),
            })
          }
          </script>
        marks:
          - {line: 11, tip: 'storage ফর্মটা ওপর থেকে নিচে পড়ে। সার্ভারের দেওয়া সব field আগে, ফাইল সবার শেষে।'}
          - {line: 16, tip: '`fetch` upload progress দেখায় না; `XMLHttpRequest` দেখায়, তাই এখানে সেটাই।'}
    aside:
      - type: pitfalls
        items:
          - 'bucket-এর CORS-এ আপনার domain আর `POST` মেথড অনুমতি না দিলে ব্রাউজার আপলোড আটকে দেয়।'
          - 'presigned PUT আকার আটকাতে পারে না। আপনার S3-সামঞ্জস্যপূর্ণ storage-এ POST policy না থাকলে confirm-এ আকার দেখুন, আর বেশি বড় হলে মুছে দিন।'
          - 'ক্লায়েন্টের "শেষ" কথার কোনো প্রমাণ নেই। সার্ভারকে তবু `headObject` দিয়ে আকার ও ধরন মিলিয়ে দেখতে হয়।'
      - type: refs
        items:
