    tldr: 'বড় ফাইল এক টানে পাঠালে নেট কেটে গেলে শুরু থেকে। multipart upload ফাইল ভেঙে টুকরোয় পাঠায়, ব্যর্থ টুকরোই শুধু আবার পাঠাতে হয়।'
