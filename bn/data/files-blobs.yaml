        lang: ts
        file: 'src/upload/resumable.ts'
        variant: good
        code: |
          const PART = 5 * 1024 * 1024   // প্রতি part ৫ MB
          const call = (url: string, init?: RequestInit) => fetch(url, init).then((r) => r.json())

          export async function upload(file: File) {
            const id = `upload:${file.name}:${file.size}:${file.lastModified}`
            let up = JSON.parse(localStorage.getItem(id) ?? 'null')
            if (!up) {
              up = await call('/uploads/multipart', { method: 'POST' })   // { key, uploadId }
              localStorage.setItem(id, JSON.stringify(up))
            }
            const base = `/uploads/multipart/${up.uploadId}`
            const have = new Set<number>(await call(`${base}/parts`))   // storage-এ থাকা part নম্বর
            const total = Math.ceil(file.size / PART)

            for (let n = 1; n <= total; n++) {
              if (have.has(n)) continue   // জমা আছে: বাদ
              const { url } = await call(`${base}/part-url/${n}`)
              const res = await fetch(url, { method: 'PUT', body: file.slice((n - 1) * PART, n * PART) })
              if (!res.ok) throw new Error(`part ${n} failed`)   // আবার upload() ডাকলেই resume
            }
            await call(`${base}/complete`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ total }),
            })
            localStorage.removeItem(id)
          }
        marks:
          - {line: 5, tip: 'নাম, আকার আর last-modified দিয়ে ফাইল চেনা যায়, তাই অন্য ফাইল সেভ করা আপলোডে মিশে যায় না।'}
          - {line: 16, tip: 'এই এক লাইনই resume-এর পুরো যুক্তি: storage-এ জমা part দ্বিতীয়বার পাঠানো হয় না।'}
    aside:
      - type: pitfalls
        items:
          - 'খোলা আপলোড complete বা abort না হওয়া পর্যন্ত storage-এর খরচ চালায়। ব্যবহারকারী বাতিল করলে `AbortMultipartUpload` ডাকুন, আর নিরাপত্তার জাল হিসেবে lifecycle rule রাখুন।'
      - type: tips
        items:
          - 'ছোট part-এ retry সস্তা, কিন্তু request বেশি লাগে; সাধারণত ৫ থেকে ১০০ MB।'
    check:
      q: '৪০০টার মধ্যে ২৫১ নম্বরে refresh হলো। শুরু থেকে না করে আপলোড কীভাবে এগোয়?'
      a: 'পাতা সেভ করা uploadId খুঁজে নেয়, সার্ভার storage-এর জমা part-এর তালিকা আনে, পাতা সেগুলো বাদ দিয়ে বাকি পাঠায়, আর সার্ভার storage-এর নিজের তালিকা থেকে complete করে।'

flashcards:
  - q: 'ছবি ডেটাবেসের BLOB কলামে রাখলে কী সমস্যা?'
    a: 'ডেটাবেস ফুলে যায়, backup বিশাল হয়, আর প্রতিটা ছবি পড়া ডেটাবেসের চাপ বাড়ায়।'
    more: |
      ডেটাবেস জটিল query আর ছোট সারির জন্য ভালো, বড় বাইনারির জন্য নয়। BLOB এর cache আর replication খরচ বাড়ায়। ছবি object storage-এ রেখে ডেটাবেসে শুধু key রাখুন।
    ref: photos-in-the-wrong-place
  - q: 'সার্ভারের লোকাল ডিস্কে আপলোড রাখা কখন ভাঙে?'
    a: 'একাধিক সার্ভার বা container থাকলে, আর deploy করলে ফাইল হারালে।'
    more: |
      প্রতিটা সার্ভারের ডিস্ক আলাদা। load balancer অন্য সার্ভারে request পাঠালে ফাইল মেলে না। container নতুন করে বানালে ডিস্কের ফাইলও চলে যায়। সার্ভারকে stateless রাখতে ফাইল বাইরে রাখুন।
    ref: photos-in-the-wrong-place
  - q: 'Object storage-এ "key" কী?'
    a: 'ফাইলের অনন্য পথ-নাম (যেমন `avatars/uuid.jpg`), যা দিয়ে storage থেকে ফাইলটা খুঁজে পাওয়া যায়।'
    more: |
      key সার্ভার নিজে বানায়, সাধারণত UUID দিয়ে, যাতে দুজনের ফাইল এক নামে ধাক্কা না খায়। ডেটাবেসে URL নয়, key রাখলে domain বা CDN বদলালেও ডেটা অপরিবর্তিত থাকে।
    ref: object-storage-flysystem
  - q: 'Symfony-তে Flysystem কী কাজে আসে?'
    a: 'লোকাল ডিস্ক, S3, GCS সবকিছুর জন্য একই API দেয়; storage বদলালে শুধু config বদলায়।'
    more: |
      `FilesystemOperator`-এর `write`, `writeStream`, `read`, `delete` কোডে একই থাকে। ডেভেলপমেন্টে local adapter, প্রোডাকশনে aws adapter, এটাই সাধারণ রীতি। বড় ফাইলে `writeStream` ব্যবহার করুন যেন RAM ফুরিয়ে না যায়।
    ref: object-storage-flysystem
  - q: 'Presigned URL কী?'
    a: 'সার্ভারের সই করা, সময়সীমাওয়ালা URL, যা দিয়ে ক্লায়েন্ট সরাসরি storage-এ ফাইল রাখতে বা পড়তে পারে।'
    more: |
      সইয়ের মধ্যে key, HTTP method আর মেয়াদ থাকে; এর কিছু বদলালে storage প্রত্যাখ্যান করে। মেয়াদ শেষ হলে URL আর কাজ করে না। তাই ক্লায়েন্টকে সরাসরি storage-এর পাসওয়ার্ড না দিয়েও অনুমতি দেওয়া যায়। এতে ফাইলের আকার আটকানো যায় না; তার জন্য presigned POST লাগে।
    ref: presigned-direct-upload
  - q: 'আপলোড শেষে সার্ভারকে confirm ডাকতে হয় কেন?'
    a: 'ক্লায়েন্টের কথা বিশ্বাস না করে সার্ভার নিজে ফাইলটা আছে কি, আকার-ধরন ঠিক কি যাচাই করে তবেই key সেভ করে।'
    more: |
      ক্লায়েন্ট আপলোড না করেও "শেষ" বলতে পারে, বা অন্য আকারের ফাইল রাখতে পারে। সার্ভার `headObject` দিয়ে আকার, content-type দেখে নেয়। ঠিক হলে ডেটাবেসের record-কে `pending` থেকে `uploaded` করে।
    ref: presigned-direct-upload
  - q: 'সরাসরি আপলোডে ফাইলের আকারের সীমা কীভাবে দেবেন?'
    a: 'presigned POST-এ `content-length-range` শর্ত দিন। তখন সেই সীমার বাইরের কিছু storage নিজেই ফিরিয়ে দেয়।'
    more: |
      presigned PUT আকার আটকাতে পারে না, কারণ content length তার সইয়ের অংশ নয়। PHP SDK-তে `PostObjectV4` সই-করা ফর্ম field বানায়; ব্রাউজার সেগুলো `FormData` হিসেবে পাঠায়, ফাইল থাকে সবার শেষ field। দ্বিতীয় প্রতিরক্ষা হিসেবে confirm-এও আকার দেখুন।
    ref: presigned-direct-upload
  - q: 'পরিত্যক্ত আপলোড bucket-এ জমে যাওয়া কীভাবে ঠেকাবেন?'
    a: 'URL বানানোর সময় `pending` সারি লিখুন, confirm-এ সেটা `uploaded` করুন, আর এক ঘণ্টা পরেও pending থাকা সারি তার object-সহ মুছুন।'
    more: |
      pending সারি না থাকলে এতিম object-এর কথা কেউ জানে না। Symfony Scheduler-এর একটা job ঘণ্টায় একবার চলে। পরিত্যক্ত multipart আপলোডের জন্য bucket-এ lifecycle rule দিন, যা প্রায় ৭ দিন পর সেগুলো বাতিল করে।
    ref: confirm-and-cleanup
  - q: 'Multipart upload কখন লাগে আর কীভাবে চলে?'
    a: 'বড় ফাইলে (১০০MB+); ফাইল টুকরো করে আলাদা URL-এ পাঠিয়ে শেষে সব টুকরো জুড়ে দেওয়া হয়।'
    more: |
      ধাপ: `CreateMultipartUpload` (uploadId), প্রতি part-এ presigned `UploadPart`, ETag জমা, শেষে `CompleteMultipartUpload`। একটা টুকরো ব্যর্থ হলে শুধু সেটা আবার পাঠাতে হয়। না জোড়া টুকরোর খরচ এড়াতে lifecycle rule দিন।
    ref: large-uploads-multipart
  - q: 'ক্র্যাশ বা refresh-এর পর multipart আপলোড কীভাবে আবার শুরু হয়?'
    a: 'uploadId রেখে দিন, `ListParts` দিয়ে storage-এর part-এর তালিকা আনুন, সেগুলো বাদ দিয়ে বাকি পাঠান, শেষে storage-এর তালিকা থেকে complete করুন।'
    more: |
      পাতা uploadId `localStorage`-এ সেভ করে, আর ব্যবহারকারী একই ফাইল আবার বাছেন। ব্রাউজারের জমানো ETag-এর তালিকা থেকে কখনো complete করবেন না: সার্ভার নিজে `ListParts` পড়ে আর part-এর সংখ্যা প্রত্যাশিত কি না মিলিয়ে দেখে।
    ref: resume-multipart
quiz:
  - q: 'অ্যাপে ২টা সার্ভার চলছে। ব্যবহারকারী ছবি দিয়েছে, কিন্তু কখনো ছবি দেখা যায়, কখনো 404। সম্ভাব্য কারণ?'
    hint: 'ছবিটা ঠিক কোথায় সেভ হয়েছিল?'
    options:
      - text: 'ছবি এক সার্ভারের লোকাল ডিস্কে আছে, অন্যটায় নেই'
        correct: true
        why: 'load balancer যেদিকে পাঠায় সেদিকে ফাইল না থাকলে 404 আসে।'
      - text: 'ছবির আকার বেশি বড়'
        correct: false
        why: 'আকার বড় হলে সবসময় সমস্যা হতো; এখানে সমস্যা মাঝে মাঝে।'
      - text: 'CDN ক্যাশে ভুল আছে'
        correct: false
        why: 'এখানে সমস্যা সার্ভার অনুযায়ী বদলাচ্ছে, যা ফাইলের জায়গা নির্দেশ করে।'
      - text: 'ডেটাবেস ধীর'
        correct: false
        why: 'ধীর হলে দেরি হতো; 404 মানে ফাইল পাওয়া যায়নি।'
    ref: photos-in-the-wrong-place
  - q: 'এই কোডে ঝুঁকি কোনগুলো?'
    lang: php
    code: |
      $name = $request->files->get('doc')->getClientOriginalName();
      $request->files->get('doc')->move($uploadDir, $name);
      $doc->setPath('/uploads/'.$name);
    hint: 'ব্যবহারকারীর দেওয়া নাম সরাসরি ব্যবহার হচ্ছে।'
    options:
      - text: 'একই নামে দুজন আপলোড করলে একজনের ফাইল আরেকজন ওভাররাইট করবে'
        correct: true
        why: 'ক্লায়েন্টের নাম অনন্য নয়। key সার্ভারের বানানো UUID হওয়া উচিত।'
      - text: 'ফাইল শুধু একটা সার্ভারের ডিস্কে থাকবে'
        correct: true
        why: 'অন্য সার্ভার বা নতুন deploy-এ ফাইলটা মিলবে না।'
      - text: '`move()` পুরনো PHP-র মেথড, চলবে না'
        correct: false
        why: '`move()` ঠিকই কাজ করে; সমস্যা ফাইল কোথায় ও কী নামে যাচ্ছে সেটা।'
      - text: 'নামে ../ থাকলে ফোল্ডারের বাইরে লেখা যেতে পারে'
        correct: true
        why: 'ক্লায়েন্টের পাঠানো নাম বিশ্বাস করা বিপজ্জনক; সার্ভারের নিজে বানানো key-ই নিরাপদ।'
    ref: object-storage-flysystem
  - q: 'presigned URL দিয়ে আপলোডের সুবিধা কী?'
    hint: 'ফাইলটা কোন পথে যাচ্ছে?'
    options:
      - text: 'ফাইল সরাসরি storage-এ যায়, আপনার সার্ভারের CPU, মেমোরি, নেটওয়ার্ক বাঁচে'
        correct: true
        why: 'সার্ভার শুধু অনুমতি দেয়; ভারী বহনের কাজ করে না।'
      - text: 'আপলোডে কোনো যাচাই দরকার হয় না'
        correct: false
        why: 'যাচাই লাগেই; confirm ধাপে সার্ভার আকার-ধরন মিলিয়ে দেখে।'
      - text: 'URL চিরকাল কাজ করে'
        correct: false
        why: 'URL-এর মেয়াদ থাকে, এটাই নিরাপত্তার অংশ।'
      - text: 'bucket সবার জন্য public করে রাখা যায়'
        correct: false
        why: 'public bucket বিপজ্জনক; presigned URL ঠিক সেই কারণেই ব্যবহার করা হয়।'
    ref: presigned-direct-upload
  - q: 'আপলোড শেষে ক্লায়েন্ট `/uploads/confirm` ডাকে। সার্ভারের সঠিক আচরণ কোনটা?'
    hint: 'ক্লায়েন্ট মিথ্যা বলতে পারে।'
    options:
      - text: 'storage-এ গিয়ে `headObject` দিয়ে ফাইলের অস্তিত্ব, আকার, ধরন যাচাই করে তারপর key সেভ করা'
        correct: true
        why: 'ক্লায়েন্ট না জেনে বা ইচ্ছে করে ভুল জানাতে পারে; নিজে মিলিয়ে নেওয়াই নিরাপদ।'
      - text: 'ক্লায়েন্ট যা বলেছে তা-ই ডেটাবেসে সেভ করা'
        correct: false
        why: 'ফাইল না থাকলেও ডেটাবেসে ভাঙা রেফারেন্স জমবে।'
      - text: 'প্রতিবার ফাইল ডাউনলোড করে সার্ভারে স্ক্যান করা'
        correct: false
        why: 'এতে presigned URL-এর সুবিধাই নষ্ট; আকার-ধরন যাচাইয়ে `headObject`ই যথেষ্ট।'
      - text: 'কিছুই করবে না, URL আছে বলে'
        correct: false
        why: 'URL-এর অস্তিত্ব ফাইল আপলোডের প্রমাণ নয়।'
    ref: presigned-direct-upload
  - q: '৫০০MB ভিডিও multipart-এ ৫০টা টুকরোয় যাচ্ছে। ২৩ নম্বর টুকরোটা নেট কেটে ব্যর্থ। সঠিক কাজ?'
    hint: 'বাকি টুকরোগুলোর কী হয়েছে?'
    options:
