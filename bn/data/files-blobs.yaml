            tip: 'শেষ না হওয়া multipart part-এর বিল আসে, অথচ ফাইলের তালিকায় দেখা যায় না।'
      - type: code
        lang: php
        file: 'src/Service/UploadLifecycle.php'
        variant: good
        code: |
          final readonly class UploadLifecycle
          {
              public function __construct(
                  private S3Client $s3,
                  private PendingUploadRepository $pending,
                  private string $bucket,
              ) {}

              public function confirm(PendingUpload $up): void
              {
                  $head = $this->s3->headObject(['Bucket' => $this->bucket, 'Key' => $up->key]);
                  $tooBig = $head['ContentLength'] > 5 * 1024 * 1024;
                  if ($tooBig || $head['ContentType'] !== 'image/jpeg') {
                      $this->discard($up);
                      throw new BadRequestHttpException('Upload rejected.');
                  }
                  $up->markUploaded();   // এখন থেকেই key প্রোফাইলে বসতে পারে
              }

              #[AsMessageHandler]
              public function cleanUp(CleanUpPendingUploads $m): void
              {
                  foreach ($this->pending->olderThan(new \DateTimeImmutable('-1 hour')) as $up) {
                      $this->discard($up);
                  }
              }

              private function discard(PendingUpload $up): void
              {
                  $this->s3->deleteObject(['Bucket' => $this->bucket, 'Key' => $up->key]);
                  $this->pending->remove($up);   // না-থাকা object মোছা কোনো error নয়
              }
          }
        marks:
          - {line: 11, tip: 'সার্ভার নিজে storage-কে object-এর কথা জিজ্ঞেস করে; ক্লায়েন্টের কোনো কথা বিশ্বাস করা হয় না।'}
          - {line: 17, tip: 'শুধু confirm হওয়া আপলোডই pending অবস্থা ছাড়ে।'}
          - {line: 20, tip: 'এটা Symfony Scheduler দিয়ে প্রতি ঘণ্টায় চালান: এক ঘণ্টা পরেও pending থাকলে আপলোডটা পরিত্যক্ত।'}
      - type: quote
        body: 'সার্ভার যাচাই না করা পর্যন্ত আপলোড pending; আর pending থেকে গেলে তার মেয়াদ ফুরায়।'
    aside:
      - type: commands
        title: 'ঘণ্টার schedule'
        items:
          - {cmd: 'RecurringMessage::every(''1 hour'', new CleanUpPendingUploads())', desc: 'আপনার Scheduler provider-এ যোগ করুন'}
      - type: when
        use:
          - 'যে অ্যাপে ক্লায়েন্ট সরাসরি storage-এ আপলোড করে, তার সবটায়'
        avoid:
          - 'কম আপলোডের ছোট অ্যাপ নতুন ফাইল `tmp/`-এ রেখে ওই prefix-এ এক দিনের lifecycle rule দিতে পারে'
    check:
      q: 'ব্যবহারকারী আপলোড URL নিল, ফাইল আপলোড করল, তারপর confirm-এর আগেই ট্যাব বন্ধ করল। ফাইলটা bucket-এ চিরকাল পড়ে থাকা কী ঠেকায়?'
      a: 'URL বানানোর সময় লেখা pending সারি। ঘণ্টার job সেটাকে এখনো pending দেখে সারি আর object দুটোই মুছে দেয়।'

  - slug: large-uploads-multipart
