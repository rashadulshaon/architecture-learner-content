    check:
      q: 'ব্যবহারকারী মুছতে বলার পর backup থেকে restore করলে তার তথ্য ফেরত আসে। কী আগে থেকে রাখলে ঠেকানো যায়?'
      a: 'মোছা ব্যবহারকারীদের একটা `erasure_log` রাখো। restore-এর পর তালিকা ধরে আবার অ্যানোনিমাইজ চালালে তথ্য ফিরে আসে না।'

flashcards:
  - q: 'Data lifecycle বলতে কী বোঝায়?'
    a: 'ডেটার পুরো যাত্রা: সংগ্রহ, ব্যবহার, সংরক্ষণ, archive আর শেষে মোছা।'
    more: |
      অনেকে ডেটা জমা করার কথাই ভাবে, মোছার কথা ভাবে না। ফলে ডেটা বছরের পর বছর অকারণে জমে থাকে। জমা করার দিনই ভাবো: কেন রাখছ, কতদিন, মেয়াদ শেষে কী ঘটবে।
    ref: delete-me-twelve-copies
  - q: 'একজন ব্যবহারকারীর ডেটা সাধারণত কোন কোন জায়গায় ছড়ানো থাকে?'
    a: 'মূল টেবিল ছাড়াও লগ, search index, analytics/warehouse, cache, backup আর তৃতীয় পক্ষের সেবায়।'
    more: |
      মূল টেবিল মুছলে এসব কপি নিজে মোছে না। তাই "মুছে দাও" অনুরোধে সব কপির তালিকা লাগে। আগেই একটা ডেটা-মানচিত্র বানিয়ে রাখলে মুছতে সুবিধা।
    ref: delete-me-twelve-copies
  - q: 'Retention policy কী?'
    a: 'প্রতিটা ডেটার ধরনের জন্য লেখা নিয়ম: কেন রাখছ, কতদিন রাখবে, আর মেয়াদ শেষে মুছবে না archive করবে।'
    more: |
      লগইন লগ ৯০ দিন, ইনভয়েস আইন অনুযায়ী ৭ বছর, ইত্যাদি। সংখ্যা আইন ও ব্যবসা ঠিক করে। policy শুধু কাগজে না রেখে config আর job দিয়ে মানাও।
    ref: retention-and-minimisation
  - q: 'Data minimisation নীতিটা কী?'
    a: 'সেবা দিতে যা সত্যিই লাগে শুধু সেটুকু তথ্য সংগ্রহ ও সংরক্ষণ করা।'
    more: |
      না নেওয়া তথ্য ফাঁস হয় না, মুছতেও হয় না। ফর্মে নতুন ঘর যোগ করার আগে ভাবো: এটা ছাড়া চলে? পুরো জন্মতারিখ না নিয়ে "১৮+ কি না" যাচাই করলেই কাজ হয়।
    ref: retention-and-minimisation
  - q: 'Purge job কীভাবে চালানো উচিত?'
    a: 'Scheduler দিয়ে নিয়মিত, ছোট ব্যাচে, মেয়াদ config-এ রেখে, কতগুলো মুছল তা লগ করে।'
    more: |
      প্রতি ব্যাচে ৫০০০-এর মতো সারি, তারপর আবার, যতক্ষণ পুরো ব্যাচ পূর্ণ হচ্ছে। বড় টেবিলে partition করে পুরনো partition ফেলে দেওয়া আরও দ্রুত। সংখ্যা মাপলে অস্বাভাবিক কিছু ধরা পড়ে।
    ref: purge-and-archive
  - q: 'Archive করে মোছার সঠিক ক্রম কী?'
    a: 'বাছাই, archive-এ লেখা, সারির সংখ্যা ও checksum যাচাই, তারপর মূল টেবিল থেকে মোছা।'
    more: |
      যাচাই বাদ দিলে archive-এর লেখা ব্যর্থ হলেও ডেটা মুছে যাবে, আর কিছুই থাকবে না। archive সস্তা object storage-এ রাখো, বছর-মাস ধরে ফোল্ডারে, যেন পরে খুঁজে পাওয়া যায়।
    ref: purge-and-archive
  - q: 'ব্যবহারকারী "আমার ডেটা মুছুন" বললে অর্ডারের সারি কী হবে?'
    a: 'সাধারণত সারি থাকবে, কিন্তু নাম, ইমেইল, ফোন, ঠিকানা অ্যানোনিমাইজ হবে।'
    more: |
      হিসাব আর কর আইনে অর্ডারের রেকর্ড কয়েক বছর রাখতে হয়। ব্যক্তিগত তথ্য সরালে আইনি রেকর্ড থাকে, কিন্তু মানুষটাকে চেনা যায় না। সম্পূর্ণ মুছতে হয় ছবি, ফাইল, marketing তালিকার মতো ডেটা।
    ref: erasure-and-copies
quiz:
  - q: 'ব্যবহারকারী অ্যাকাউন্ট মুছতে বলল। আইন অনুযায়ী তার অর্ডার ৭ বছর রাখতেই হবে। সবচেয়ে ভালো কাজ কোনটা?'
    hint: 'হিসাব আর মানুষ দুটো আলাদা।'
    options:
      - text: 'অর্ডারের সারি রেখে ব্যক্তিগত তথ্য অ্যানোনিমাইজ করা'
        correct: true
        why: 'আইনি রেকর্ড টিকে থাকে, কিন্তু ব্যক্তিকে আর চেনা যায় না।'
      - text: 'users আর orders দুটোই সম্পূর্ণ মুছে ফেলা'
        correct: false
        why: 'আইনে রাখতে বলা ডেটা মুছলে আইন ভাঙা হয়।'
      - text: 'অনুরোধ উপেক্ষা করা'
        correct: false
        why: 'ব্যক্তিগত তথ্য মোছার দাবি মানতেই হবে; যা আইনে রাখতে হয় শুধু সেটুকু বাদ।'
      - text: 'শুধু `deleted_at` বসানো'
        correct: false
        why: 'soft delete-এ ব্যক্তিগত তথ্য থেকেই যায়; তথ্য সরানো হয় না।'
    ref: erasure-and-copies
  - q: 'নিচের কোনগুলো ব্যবহারকারীর ডেটার কপি থাকার সম্ভাব্য জায়গা, যেগুলো `DELETE FROM users` ছুঁয়ে যায় না?'
    hint: 'কোন কোন সিস্টেম ডেটা কপি করে নেয়?'
    options:
      - text: 'Elasticsearch বা অন্য search index'
        correct: true
        why: 'আলাদা কপি, নিজে নিজে সিঙ্ক হয় না।'
      - text: 'রাতের backup'
        correct: true
        why: 'পুরনো ছবি; মেয়াদ ফুরানো পর্যন্ত ডেটা থাকে।'
      - text: 'অ্যাপ লগ, যদি ইমেইল লেখা হয়ে থাকে'
        correct: true
        why: 'লগ আলাদা ফাইল; ডেটাবেস মুছলে লগ বদলায় না।'
      - text: 'মুছে ফেলা `users` সারির `id` কলাম'
        correct: false
        why: 'সারিই তো মুছে গেছে।'
    ref: delete-me-twelve-copies
  - q: 'কোড দেখে বলো: এই purge job-এর সবচেয়ে বড় ঝুঁকি কী?'
    lang: php
    code: |
      $this->db->executeStatement(
          'DELETE FROM login_events WHERE created_at < :c',
          ['c' => $cutoff],
      );
    hint: 'টেবিলে ৫ কোটি সারি থাকলে?'
    options:
      - text: 'এক বিশাল DELETE: দীর্ঘ lock, বিশাল transaction log আর replica lag'
        correct: true
        why: 'ছোট ব্যাচে মুছলে প্রতিটা lock ক্ষণস্থায়ী হয়।'
      - text: 'কিছুই মুছবে না, কারণ `LIMIT` নেই'
        correct: false
        why: 'LIMIT ছাড়াও DELETE চলে; সমস্যা হলো এর আকার।'
      - text: 'এটা আইনবিরুদ্ধ'
        correct: false
        why: 'মেয়াদ পেরোনো লগ মোছা policy-র অংশ; প্রশ্ন শুধু পদ্ধতির।'
      - text: '`:c` parameter কাজ করবে না'
        correct: false
        why: 'parameter binding ঠিক আছে।'
    ref: purge-and-archive
  - q: 'নিচের কোনগুলো data minimisation মানা হচ্ছে?'
    hint: 'কম নাও, কম ঝুঁকি।'
    options:
      - text: 'বয়স ১৮+ কি না যাচাই করে পুরো জন্মতারিখ না রাখা'
        correct: true
        why: 'যাচাইয়ের জন্য যা দরকার শুধু সেটুকুই রাখা।'
      - text: 'নিউজলেটারের জন্য শুধু ইমেইল চাওয়া, ফোন নয়'
        correct: true
        why: 'ফোন লাগে না, তাই না নেওয়াই ভালো।'
      - text: '"ভবিষ্যতে কাজে লাগতে পারে" ভেবে সব ফর্মে জাতীয় পরিচয়পত্র চাওয়া'
        correct: false
        why: 'ভবিষ্যতের আন্দাজে তথ্য নেওয়া minimisation-এর উল্টো।'
      - text: 'সব ডেটা চিরকাল রাখা, যাতে পরে বিশ্লেষণ করা যায়'
        correct: false
        why: 'মেয়াদহীন সংরক্ষণ ঝুঁকি ও খরচ বাড়ায়।'
    ref: retention-and-minimisation
  - q: 'রহিমের টিম ব্যবহারকারীকে মুছেছিল। এক সপ্তাহ পর ডেটাবেস crash করল, গত রাতের backup থেকে restore হলো। কী হতে পারে, আর আগে কী রাখলে ঠেকাতো?'
    hint: 'backup মোছার আগের অবস্থার ছবি।'
    options:
      - text: 'মোছা ব্যবহারকারী ফিরে আসবে; `erasure_log` থাকলে restore-এর পর আবার অ্যানোনিমাইজ করা যায়'
        correct: true
        why: 'backup পুরনো ছবি, তাই মোছার তালিকা আলাদা রাখা নিয়ম।'
      - text: 'কিছু হবে না, backup নিজে মোছা ডেটা বাদ দেয়'
        correct: false
        why: 'backup ঘটনা মনে রাখে না; যা ছিল তা-ই ফেরত আসে।'
      - text: 'শুধু search index ফিরে আসবে'
        correct: false
        why: 'ডেটাবেসের সারিই ফেরত আসে।'
