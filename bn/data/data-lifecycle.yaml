slides:
  - slug: delete-me-twelve-copies
    title: '"আমার ডেটা মুছে দিন" আর বারোটা কপি'
    kind: story
    tldr: 'একজন ব্যবহারকারীর ডেটা শুধু users টেবিলে থাকে না: log, backup, search, analytics, cache-এও কপি আছে। জীবনচক্র আগে না ভাবলে মোছা অসম্ভব হয়ে ওঠে।'
    keywords: ['data lifecycle', 'right to be forgotten', 'erasure', 'data copies', 'GDPR', 'ডেটা মোছা']
    blocks:
      - type: metaphor
        icon: archive
        title: 'ঘরের পুরনো কাগজপত্র'
        body: |
          বাড়িতে বছরের পর বছর বিল, চিঠি আর দলিলের কাগজ জমে। জমির দলিল সারা জীবন রাখতে হয়, বিদ্যুৎ বিল কয়েক বছর, আর বাজারের ফর্দ ফেলে দিলেই হয়। কোনটা কতদিন রাখবে কেউ ঠিক না করলে সব কিছুই স্তূপে পড়ে থাকে, আর দরকারের দিন কিছুই পাওয়া যায় না।
      - type: text
        body: |
          পাঁচ বছর আগের এক ব্যবহারকারী লিখল, "আমার সব তথ্য মুছে দিন।" রহিম `DELETE FROM users` চালিয়ে ভাবল শেষ। অথচ তার ইমেইল-নম্বর আরও ডজনখানেক জায়গায় ছড়ানো।
      - type: visual
        kind: flow
        caption: 'একজন ব্যবহারকারীর ডেটা কতগুলো জায়গায় ছড়ায়'
        nodes:
          - {id: users, label: 'users টেবিল', sub: 'মূল ডেটা', icon: db, tone: accent, col: 0, row: 1.5, tip: 'যেখানে আমরা মুছতে ভাবি। আসলে এটা কপির একটা মাত্র।'}
          - {id: logs, label: 'অ্যাপ লগ', sub: 'ইমেইল সহ', icon: file, col: 1.5, row: 0, tip: 'ভুল করে লগে ইমেইল বা ফোন লেখা থাকে, যা বছর ধরে জমা।'}
          - {id: search, label: 'Search index', sub: 'নাম, ইমেইল', icon: search, col: 1.5, row: 1, tip: 'আলাদা কপি; users টেবিলের সাথে নিজে নিজে মোছে না।'}
          - {id: wh, label: 'Analytics', sub: 'warehouse', icon: chart, col: 1.5, row: 2, tip: 'রিপোর্টের জন্য কপি করা ডেটা; এখানেও নাম বা আইডি থাকতে পারে।'}
          - {id: bk, label: 'Backup', sub: '৩০-৯০ দিন', icon: archive, col: 1.5, row: 3, tip: 'ছবির মতো স্থির; পুরনো backup-এ এখনো ব্যবহারকারী আছে।'}
        edges:
          - {from: users, to: logs, label: 'অনুরোধ লগে ইমেইল লিখে রাখে', dashed: true}
          - {from: users, to: search, label: 'search index-এ নাম ও ইমেইল কপি হয়', dashed: true}
          - {from: users, to: wh, label: 'warehouse-এ ইতিহাসসহ কপি যায়', dashed: true}
          - {from: users, to: bk, label: 'প্রতি রাতে সব ডেটার backup নেওয়া হয়', dashed: true, tone: warn}
      - type: quote
        body: 'কতদিন রাখবে, কেন রাখবে আর কীভাবে মুছবে: ডেটা জমা করার দিনই ঠিক করো।'
    aside:
      - type: story
        title: 'ফাঁস হলো পুরনো ডেটা'
        body: |
          একটা ছোট সার্ভিসে ডেটা ফাঁস হলো। ফাঁস হওয়া ডেটার বেশিরভাগই ছিল চার বছর আগে বন্ধ হয়ে যাওয়া ব্যবহারকারীদের, যাদের তথ্য কারো কাজেই লাগছিল না। না রাখলে ক্ষতিও হতো না।
      - type: terms
        items:
          - {term: 'Data lifecycle', meaning: 'ডেটার জন্ম থেকে মৃত্যু: সংগ্রহ, ব্যবহার, সংরক্ষণ, archive, মোছা।'}
          - {term: 'Right to be forgotten', meaning: 'ব্যবহারকারীর নিজের ব্যক্তিগত তথ্য মুছে দেওয়ার দাবি (GDPR-এর erasure অধিকার)।'}
    check:
      q: '`DELETE FROM users` চালানোর পরও ব্যবহারকারীর তথ্য থেকে যায় কেন?'
      a: 'তার তথ্য লগ, search index, analytics, backup ও cache-এ আলাদা কপি হিসেবে থাকে। মূল টেবিল মুছলে কপিগুলো নিজে নিজে মোছে না।'

  - slug: retention-and-minimisation
    title: 'Retention policy আর data minimisation'
    kind: concept
    tldr: 'প্রতিটা ধরনের ডেটার জন্য আগে থেকে লিখে রাখো: কেন রাখবে, কতদিন রাখবে, তারপর কী হবে। আর শুরুতেই যা সত্যিই লাগে শুধু সেটুকু নাও।'
    keywords: ['retention policy', 'data minimisation', 'compliance', 'GDPR', 'personal data', 'PII']
    blocks:
      - type: text
        body: |
          পুরনো কাগজের মতোই প্রতিটা ডেটার ধরনে একটা নিয়ম লাগে: **retention policy**। সেখানে লেখা থাকে কেন রাখছ (উদ্দেশ্য), কতদিন, আর মেয়াদ শেষে কী ঘটবে (মোছা বা archive)। দ্বিতীয় নিয়ম **data minimisation**: যে তথ্য সত্যিই লাগে না তা প্রথমেই চেয়ো না। না নিলে ফাঁসেরও ভয় নেই, মুছারও ঝামেলা নেই। আর কিছু ডেটা আইনি কারণে রাখতেই হয়, যেমন পেমেন্টের হিসাব; এগুলো মোছা যায় না, কিন্তু ব্যক্তির পরিচয় আলাদা করা যায়।
      - type: visual
        kind: table
        caption: 'নমুনা retention policy (সংখ্যাগুলো উদাহরণ, তোমার আইন ও ব্যবসা অনুযায়ী ঠিক করো)'
        headers: ['ডেটা', 'কেন রাখি', 'কতদিন', 'মেয়াদের পর']
        rows:
          - cells: ['লগইন লগ', 'নিরাপত্তা তদন্ত', '৯০ দিন', 'মুছে ফেলা']
            tip: 'উদ্দেশ্য ছোট, তাই মেয়াদও ছোট। তদন্তের পর এই ডেটার আর কাজ নেই।'
          - cells: ['অর্ডার ও ইনভয়েস', 'হিসাব ও কর আইন', '৭ বছর', 'archive, তারপর মোছা']
            tip: 'এই মেয়াদ আইন ঠিক করে; এর আগে মুছলে আইন ভাঙা হয়।'
          - cells: ['ব্যবহারকারীর প্রোফাইল', 'সেবা দেওয়া', 'অ্যাকাউন্ট থাকা পর্যন্ত', 'বন্ধ হলে ৩০ দিনে অ্যানোনিমাইজ']
            tip: 'অ্যাকাউন্ট বন্ধের পরও কিছুদিন রাখলে ভুলে বন্ধ করা ফেরানো যায়।'
          - cells: ['marketing সম্মতি ও ইতিহাস', 'সম্মতির প্রমাণ', 'সম্মতি ফেরত না নেওয়া পর্যন্ত', 'মুছে ফেলা']
            tip: 'কখন সম্মতি দিয়েছিল, তার প্রমাণও ডেটা; মেয়াদ ফুরোলে তাও মোছো।'
      - type: points
        title: 'data minimisation: নেওয়ার আগে তিন প্রশ্ন'
        style: number
        items:
          - 'এই তথ্য ছাড়া কি সেবাটা দেওয়া যায়? যায় হলে নিও না।'
          - 'পুরো জন্মতারিখ লাগে, নাকি বয়স যাচাই যথেষ্ট?'
          - 'কতদিন পর এটা আর কাজে লাগবে না? সেই তারিখ এখনই লিখে রাখো।'
    aside:
      - type: tips
        items:
          - 'policy কোডে রাখো, কাগজে নয়: `config/retention.yaml`-এ দিন সংখ্যা, আর একটা job সেটা মেনে চলে।'
          - 'কোন কলামে ব্যক্তিগত তথ্য (PII) আছে তার তালিকা রাখো; নইলে মুছবে কী?'
      - type: pitfalls
        items:
          - 'আইন দেশ আর ডেটার ধরনে আলাদা। GDPR ও বাংলাদেশের প্রযোজ্য আইনের পাশাপাশি নিজের কোম্পানির আইনজীবীর পরামর্শ নাও; এখানকার সংখ্যাগুলো নমুনা মাত্র।'
      - type: refs
        items:
          - {to: 'security/data-protection', label: 'ডেটা সুরক্ষা'}
    check:
      q: 'অর্ডারের হিসাব আইন অনুযায়ী ৭ বছর রাখতে হয়, আবার ব্যবহারকারী তার ডেটা মুছতে বলল। কী করবে?'
      a: 'হিসাবের সারি রাখো কিন্তু ব্যক্তিগত তথ্য (নাম, ইমেইল, ঠিকানা) সরিয়ে অ্যানোনিমাইজ করো। আইনি রেকর্ড টিকে থাকে, ব্যক্তির পরিচয় থাকে না।'

  - slug: purge-and-archive
    title: 'Purge job আর archive: নিয়ম মেনে মোছা'
    kind: howto
    tldr: 'মেয়াদ-উত্তীর্ণ ডেটা প্রতি রাতে Scheduler দিয়ে ছোট ব্যাচে মোছো। যে ডেটা মাঝে মাঝে লাগে তা আগে সস্তা storage-এ archive করে যাচাই করো, তারপর মোছো।'
    keywords: ['purge job', 'archival', 'Symfony Scheduler', 'batch delete', 'cold storage', 'partition']
    blocks:
      - type: text
        body: |
          পুরনো কাগজ ফেলা হয় নিয়ম করে, বছরে একবার ঝাড়ু দিয়ে। ডেটাবেসেও একটা **purge job** রাত ৩টায় চলে আর policy-র মেয়াদ পেরোনো সারি সরায়। বড় টেবিলে একসাথে কোটি সারি মুছো না, কারণ তাতে lock আর replica lag। ছোট ব্যাচে মোছো, ঠিক [[data/zero-downtime-migrations|backfill]]-এর মতো। কিছু ডেটা কয়েক বছর পরেও লাগতে পারে, সেগুলো আগে archive করো।
      - type: code
        lang: php
        file: 'src/Retention/PurgeLoginEventsHandler.php'
        variant: good
        code: |
          #[AsSchedule('retention')]
          final class RetentionSchedule implements ScheduleProviderInterface
          {
              public function getSchedule(): Schedule
              {
                  return (new Schedule())->add(
                  RecurringMessage::cron('30 3 * * *', new PurgeLoginEvents()),
              );
              }
          }

          #[AsMessageHandler]
          final readonly class PurgeLoginEventsHandler
          {
              public function __construct(
                  private Connection $db,
                  private ClockInterface $clock,
                  #[Autowire('%app.retention.login_events_days%')] private int $days,
              ) {}

              public function __invoke(PurgeLoginEvents $m): void
              {
                  $cutoff = $this->clock->now()->modify("-{$this->days} days");
                  do {
                      $deleted = $this->db->executeStatement(
                          'DELETE FROM login_events WHERE id IN (
                               SELECT id FROM login_events WHERE created_at < :c LIMIT 5000)',
                          ['c' => $cutoff], ['c' => Types::DATETIMETZ_IMMUTABLE],
                      );
                  } while ($deleted === 5000);
              }
          }
        marks:
          - {line: 18, tip: 'মেয়াদ কোডে লেখা নয়, parameter থেকে আসে। policy বদলালে config বদলাও।'}
          - {line: 27, tip: 'PostgreSQL-এ `DELETE ... LIMIT` নেই, তাই subquery দিয়ে ৫০০০ id বাছা।'}
          - {line: 30, tip: 'যতক্ষণ পুরো ব্যাচ মুছছে, ততক্ষণ আবার। কম মুছলে বুঝবে আর কিছু বাকি নেই।'}
      - type: visual
        kind: steps
        caption: 'archive করে মোছার নিরাপদ ক্রম'
        steps:
          - {title: '১. Select', body: 'মেয়াদ পেরোনো সারি বাছো', tip: 'cutoff তারিখের আগের সারি, id ধরে ব্যাচে।'}
          - {title: '২. Archive', body: 'ফাইল হিসেবে সস্তা storage-এ', tip: 'Parquet বা CSV, object storage-এ, বছর-মাস ধরে ফোল্ডারে।'}
          - {title: '৩. Verify', body: 'সারির সংখ্যা ও checksum মেলাও', tip: 'archive-এ যা লেখা হলো তা যাচাই না করে মোছা বিপজ্জনক।'}
          - {title: '৪. Delete', body: 'মূল টেবিল থেকে সরাও', tip: 'যাচাই পাশ করার পরই; ছোট ব্যাচে।'}
    aside:
      - type: tips
        items:
          - 'টেবিল তারিখ ধরে partition করলে পুরনো partition `DROP`/`DETACH` করাই মোছা: মুহূর্তে হয়, কোনো ভারী DELETE ছাড়াই।'
          - 'purge job কতগুলো সারি মুছল তার সংখ্যা metric বা লগে রাখো; হঠাৎ শূন্য বা বিশাল সংখ্যা মানে সমস্যা।'
      - type: pitfalls
        items:
          - 'cutoff হিসাবে এখনকার সময় নয়, `ClockInterface` ব্যবহার করো; test-এ সময় বসিয়ে যাচাই করা যায়।'
      - type: refs
        items:
          - {to: 'config/configuration', label: 'Config ও parameter'}
    check:
      q: 'purge job-এ এক `DELETE` না চালিয়ে ৫০০০ সারির ব্যাচে মোছো কেন?'
      a: 'এক বিশাল DELETE দীর্ঘ lock ধরে, transaction log ফোলায় ও replica পিছিয়ে দেয়। ছোট ব্যাচে প্রতিটা lock ক্ষণস্থায়ী, সাইট চলতে থাকে।'

  - slug: erasure-and-copies
    title: 'Erasure: মুছো, অ্যানোনিমাইজ করো, কপিগুলোকে জানাও'
    kind: pitfall
    tldr: 'অ্যাকাউন্ট মুছার অনুরোধে আইনি রেকর্ড রেখে ব্যক্তিগত তথ্য অ্যানোনিমাইজ করো, event দিয়ে সব কপিকে জানাও, আর backup-এ মোছার তালিকা রাখো।'
    keywords: ['right to erasure', 'anonymize', 'GDPR', 'backup deletion', 'UserErased', 'crypto shredding']
    blocks:
      - type: text
        body: |
          সারি মুছলে ফরেন কি ভাঙে, আর অর্ডারের হিসাবও হারায়। তাই সাধারণত **অ্যানোনিমাইজ**: নাম, ইমেইল, ফোন বদলে নিরর্থক মান বসাও, কিন্তু অর্ডারের সারি ও টাকার অঙ্ক থাকুক। তারপর `UserErased` event ছাড়ো, যেন search, analytics আর cache নিজেদের কপি পরিষ্কার করে। বদলের তালিকা (কোন user মুছেছে) আলাদা রেখে দাও, কারণ backup থেকে restore করলে মোছা ব্যবহারকারী ফিরে আসবে।
      - type: code
        lang: php
        file: 'src/Privacy/ErasureService.php'
        variant: good
        code: |
          public function erase(User $user): void
          {
              $id = $user->getId();

              $this->em->wrapInTransaction(function () use ($user): void {
                  $user->anonymize();            // ব্যক্তিগত তথ্য বদলে নিরর্থক মান
                  $this->sessions->revokeAll($user);
                  $this->db->insert('erasure_log', [   // restore-এর পর আবার চালানোর তালিকা
                      'user_id' => $user->getId(),
                      'erased_at' => (new \DateTimeImmutable())->format('c'),
                  ]);
              });

              // commit-এর পর সবাইকে জানাও: search, analytics, cache
              $this->bus->dispatch(new UserErased($id));
          }

          // User::anonymize()
          //   $this->email = sprintf('erased-%d@invalid.example', $this->id);
          //   $this->name = 'মুছে ফেলা ব্যবহারকারী';  $this->phone = null;
          //   $this->passwordHash = '!';  $this->erasedAt = new \DateTimeImmutable();
        marks:
          - {line: 6, tip: 'সারি থাকে (ফরেন কি অক্ষত), কিন্তু কেউ আর এটাকে মানুষ হিসেবে চিনতে পারে না।'}
          - {line: 8, tip: '`erasure_log` থাকলে backup restore-এর পর আবার সবাইকে অ্যানোনিমাইজ করা যায়।'}
          - {line: 15, tip: 'transaction শেষ হওয়ার পর event, নইলে ব্যর্থ transaction-এর event চলে যেতে পারে।'}
      - type: visual
        kind: compare
        caption: 'নিজের তথ্য বনাম আইনি রেকর্ড'
        columns:
          - title: 'অ্যানোনিমাইজ করো'
            tone: good
            icon: shield
            tip: 'হিসাব বা পরিসংখ্যানে সারি লাগে কিন্তু মানুষটাকে চেনা লাগে না, এমন ডেটার জন্য।'
            items:
              - 'অর্ডার, ইনভয়েসের সারি'
              - 'নাম, ইমেইল, ফোন, ঠিকানা সরানো'
              - 'টাকার অঙ্ক ও তারিখ থাকে'
          - title: 'সম্পূর্ণ মোছো'
            tone: bad
            icon: trash
            tip: 'আইনি কারণে না রাখলেও চলে এমন ডেটা সম্পূর্ণ মুছে দাও।'
            items:
              - 'প্রোফাইল ছবি, ফাইল'
              - 'search index ও cache-এর কপি'
              - 'marketing তালিকা ও ডিভাইস টোকেন'
      - type: quote
        body: 'মুছতে হলে মূল টেবিল নয়, সব কপি। আর backup-এ মুছা ব্যবহারকারীর তালিকা রাখো।'
    aside:
      - type: pitfalls
        items:
          - 'অ্যাপ-লগে ইমেইল বা ফোন লিখো না। লগ মোছা প্রায় অসম্ভব, তাই শুরুতেই user id লেখো।'
          - '`UserErased` event হারালে কপি থেকে যায়; নিশ্চিত পৌঁছাতে outbox pattern দেখো।'
      - type: tips
        items:
          - 'backup-এর ভেতর থেকে সারি মোছা হয় না; backup নির্দিষ্ট মেয়াদে নিজে ফুরোয়। restore-এর পর `erasure_log` থেকে আবার অ্যানোনিমাইজ চালাও।'
      - type: refs
        items:
          - {to: 'workflows/outbox-inbox', label: 'event নিশ্চিত পাঠানো'}
