slides:
  - slug: three-revenue-numbers
    title: 'গত মাসের বিক্রি: তিন বিভাগ, তিন সংখ্যা'
    kind: story
    tldr: 'ডেটা যদি সবাই নিজের মতো কপি করে হিসাব করে, তাহলে একই প্রশ্নের তিন উত্তর আসে। প্ল্যাটফর্মের কাজ হলো এক জায়গা, এক সংজ্ঞা, এক নিয়ম।'
    keywords: ['data platform', 'single source', 'metric definition', 'data warehouse', 'ডেটা প্ল্যাটফর্ম']
    blocks:
      - type: metaphor
        icon: shop
        title: 'বাজারের ছড়ানো গুদাম'
        body: |
          একই পণ্যের তিনজন বিক্রেতা তিন দোকানে নিজের মতো স্টক গোনে, কেউ ফেরত বাদ দেয়, কেউ দেয় না। মালিক জিজ্ঞেস করলে তিন সংখ্যা। সমাধান হলো এক কেন্দ্রীয় গুদাম, সবার একই হিসাবের নিয়ম, আর প্রতিটা তাকে কে দেখে তার নাম লেখা।
      - type: text
        body: |
          রহিমের কোম্পানিতে গত মাসের বিক্রি জানতে চাইলে ফাইন্যান্স বলল ৪২ লাখ, মার্কেটিং ৪৫ লাখ, প্রোডাক্ট ডেটাবেস থেকে ৪০ লাখ। কেউ ভুল করেনি। প্রত্যেকে আলাদা সময়ে আলাদা কপি থেকে আলাদা সংজ্ঞায় গুনেছে।
      - type: visual
        kind: table
        caption: 'তিন সংখ্যার আসল কারণ'
        headers: ['বিভাগ', 'সংখ্যা', 'কী ধরেছে']
        rows:
          - cells: ['ফাইন্যান্স', '৪২ লাখ', 'ফেরত বাদ, paid অর্ডার']
            tip: 'ফেরত বাদ দিয়ে হাতে পাওয়া টাকা গুনেছে।'
          - cells: ['মার্কেটিং', '৪৫ লাখ', 'ফেরতসহ, অর্ডার করা মুহূর্ত']
            tip: 'ফেরত বাদ না দিয়ে অর্ডারের সময়ে গুনেছে, তাই বেশি।'
          - cells: ['প্রোডাক্ট ডেটাবেস', '৪০ লাখ', 'গত রাতের কপি, UTC মাস']
            tip: 'time zone আর কপির তারিখ আলাদা হওয়ায় মাসের সীমানা সরে গেছে।'
      - type: quote
        body: 'একটা মেট্রিকের একটাই সংজ্ঞা, একটাই মালিক, একটাই জায়গা।'
    aside:
      - type: story
        title: 'বোর্ড সভার সংখ্যা'
        body: |
          বোর্ড সভায় দুজন পরিচালক দুই রকম গ্রাহক সংখ্যা দেখালেন। সভার অর্ধেক সময় গেল সংখ্যা মেলাতে। কেউ সিদ্ধান্ত নিতে পারল না, কারণ কোন সংখ্যাটা বিশ্বাসযোগ্য তা কেউ জানত না।
      - type: terms
        items:
          - {term: 'Metric', meaning: 'ব্যবসার সংখ্যা, যেমন "মাসিক বিক্রি", যার একটা নির্দিষ্ট সংজ্ঞা থাকে।'}
          - {term: 'Pipeline', meaning: 'এক জায়গা থেকে ডেটা তুলে ধাপে ধাপে অন্য জায়গায় নেওয়ার স্বয়ংক্রিয় পথ।'}
    check:
      q: 'ফাইন্যান্স আর মার্কেটিং দুই সংখ্যা দিল, কেউ ভুল করেনি। তাহলে কেন মিলল না?'
      a: 'তারা আলাদা কপি থেকে আলাদা সংজ্ঞায় গুনেছে: ফেরত ধরা বা না ধরা, সময়ের সীমানা। এক সংজ্ঞা ও এক উৎস না থাকলে মেলে না।'

  - slug: warehouse-lake-lakehouse
    title: 'Warehouse, lake, lakehouse: তিন ধরনের গুদাম'
    kind: concept
    tldr: 'Warehouse সাজানো, পরিষ্কার ডেটার গুদাম; lake সব ধরনের কাঁচা ডেটার বিশাল ভাণ্ডার; lakehouse দুটোর গুণ এক জায়গায় আনার চেষ্টা।'
    keywords: ['data warehouse', 'data lake', 'lakehouse', 'Parquet', 'BigQuery', 'Snowflake', 'schema on read']
    blocks:
      - type: text
        body: |
          **Warehouse** লেবেল-আঁটা তাকওয়ালা গুদাম: ডেটা আগে পরিষ্কার করে নির্দিষ্ট টেবিলে সাজানো, তাই SQL-এ রিপোর্ট দ্রুত ও নির্ভরযোগ্য। **Lake** ধানের গোলার মতো: ছবি, লগ, JSON, CSV সবকিছু যেমন আছে তেমন সস্তা object storage-এ ফেলা, পরে দরকার মতো পড়া। দাম কম, কিন্তু গোছানো না থাকলে "ডেটা জলাভূমি" হয়। **Lakehouse** গোলার ডেটার উপর তাকের লেবেল (Parquet, Delta Lake, Iceberg ফরম্যাট) বসায়, যেন একই ফাইলে SQL চলে।
      - type: visual
        kind: table
        caption: 'তিন ধরনের তুলনা'
        headers: ['', 'Warehouse', 'Lake', 'Lakehouse']
        rows:
          - cells: ['ডেটা কেমন', 'পরিষ্কার, কাঠামোযুক্ত', 'কাঁচা, সব ধরনের', 'কাঁচা থেকে পরিষ্কার, স্তরে স্তরে']
            tip: 'lakehouse প্রায়ই raw, cleaned, curated নামে তিন স্তর রাখে।'
          - cells: ['কখন গঠন ঠিক', 'লেখার আগে (schema on write)', 'পড়ার সময় (schema on read)', 'ফরম্যাট জুড়ে schema থাকে']
            tip: 'schema on write ভুল আগেই ধরে; schema on read নমনীয় কিন্তু ভুল দেরিতে ধরা পড়ে।'
          - cells: ['খরচ', 'বেশি', 'কম', 'কম থেকে মাঝারি']
            tip: 'lake ও lakehouse object storage ব্যবহার করে, যা তুলনায় অনেক সস্তা।'
          - cells: ['ভালো কাজ', 'BI রিপোর্ট, ড্যাশবোর্ড', 'ML, কাঁচা লগ, ছবি', 'রিপোর্ট ও ML একসাথে']
            tip: 'ডেটা সায়েন্স কাঁচা ডেটা চায়, BI পরিষ্কার ডেটা; lakehouse দুই দলকেই এক জায়গা দেয়।'
          - cells: ['উদাহরণ', 'BigQuery, Snowflake, Redshift', 'S3 + Parquet ফাইল', 'Delta Lake, Iceberg']
            tip: 'ছোট দলে প্রায়ই একটা PostgreSQL replica বা managed warehouse-ই যথেষ্ট।'
      - type: points
        title: 'কোনটা কখন'
        style: dot
        items:
          - 'প্রথম ধাপ: ছোট অ্যাপে read replica বা আলাদা PostgreSQL যথেষ্ট; বিগ ডেটা সরঞ্জাম আগে থেকে ভাববেন না।'
          - 'রিপোর্ট ও ড্যাশবোর্ড বেড়ে গেলে managed warehouse।'
          - 'কাঁচা লগ, ছবি, ML-এর দরকার এলে lake বা lakehouse।'
    aside:
      - type: remember
        body: 'warehouse = সাজানো তাক, lake = গোলা, lakehouse = গোলার উপর তাকের লেবেল।'
      - type: refs
        items:
          - {to: 'data/oltp-olap', label: 'কেন রিপোর্ট আলাদা জায়গায়'}
          - {to: 'data/choosing-database', label: 'ডেটাবেস বাছাই'}
    check:
      q: 'ছবি, লগ আর JSON ফাইল সস্তায় একসাথে রাখতে চান, পরে দরকার মতো বিশ্লেষণ করবেন। কোনটা মানায়?'
      a: 'Data lake। object storage-এ সব কাঁচা ডেটা যেমন আছে রাখা যায়, schema ঠিক হয় পড়ার সময়। সাজানো SQL রিপোর্টের জন্য warehouse।'

  - slug: elt-pipeline
    title: 'ELT pipeline: আগে আনুন, গুদামে এসে রান্না'
    kind: howto
    tldr: 'ELT-তে কাঁচা ডেটা আগে গুদামে (Extract, Load), তারপর SQL দিয়ে সেখানেই পরিষ্কার ও সাজানো (Transform)। Symfony lake-এ ফাইল বানায়, আর warehouse সেই ফাইল raw স্তরে লোড করে নেয়।'
    keywords: ['ETL', 'ELT', 'watermark', 'incremental extract', 'LOAD DATA', 'COPY INTO', 'raw staging mart', 'idempotent']
    blocks:
      - type: text
        body: |
          পুরনো **ETL**-এ বাজার থেকে মাল এনে বাড়িতে রান্না করে তবে গুদামে রাখা হতো। আধুনিক **ELT**-তে কাঁচা মাল সোজা গুদামে, রান্না হয় গুদামের বড় চুলায় (warehouse-এর SQL)। সুবিধা: কাঁচা ডেটা অটুট থাকে, রান্নার নিয়ম বদলালে আবার রাঁধা যায়। Symfony প্রথম দুই ধাপের কাজ করে। বদলানো সারিগুলো **watermark** (শেষ কোথায় পৌঁছেছি) ধরে তুলে lake-এ ফাইল বানায়, তারপর warehouse-কে বলে ফাইলটা raw স্তরে লোড করতে। লোড সফল হওয়ার পরই watermark এগোয়, তাই ক্র্যাশে ডুপ্লিকেট হতে পারে, সারি হারায় না।
      - type: visual
        kind: layers
        caption: 'গুদামের তিন স্তর: কাঁচা থেকে ব্যবসার উপযোগী'
        layers:
          - {label: 'mart: mart_daily_sales', sub: 'ব্যবসার প্রশ্নের উত্তর, ড্যাশবোর্ড এখান থেকে', tone: good, tip: 'মালিকের জন্য সাজানো। সংজ্ঞা এখানে ঠিক করা, সবাই এই টেবিল পড়ে।'}
          - {label: 'staging: stg_orders', sub: 'ডুপ্লিকেট বাদ, নাম ও ধরন ঠিক', tip: 'কাঁচা ডেটা পরিষ্কার হয় এই স্তরে; সর্বশেষ সারি বেছে নেওয়া হয়।'}
          - {label: 'raw: raw_orders', sub: 'যেমন এসেছে তেমন, বদল ছাড়া', tone: muted, tip: 'কখনো বদলানো হয় না। লোড করা প্রতিটা ফাইল এখানে নামে, আর ভুল হলে এখান থেকে আবার বানানো যায়।'}
      - type: code
        lang: php
        file: 'src/Etl/ExtractOrdersCommand.php'
        variant: good
        code: |
          protected function execute(InputInterface $in, OutputInterface $out): int
          {
              $since = $this->db->fetchOne(
                  "SELECT value FROM etl_watermark WHERE name = 'orders'"
              );
              $rows = $this->replica->iterateAssociative(
                  'SELECT id, user_id, total_amount, status, created_at, updated_at FROM orders
                   WHERE updated_at >= :s ORDER BY updated_at',
                  ['s' => $since],
              );

              $stream = fopen('php://temp', 'w+b');
              foreach ($rows as $row) {
                  fwrite($stream, json_encode($row, JSON_THROW_ON_ERROR)."\n");
                  $max = $row['updated_at'];
              }
              rewind($stream);

              $key = sprintf('raw/orders/dt=%s/%s.jsonl', date('Y-m-d'), Uuid::v7());
              $this->lakeStorage->writeStream($key, $stream);   // E: ফাইল lake-এ নামে

              $uri = 'gs://shop-lake/'.$key;
              $this->warehouse->runQuery($this->warehouse->query(   // L: warehouse লোড করে
                  "LOAD DATA INTO raw.raw_orders FROM FILES (format = 'JSON', uris = ['$uri'])",
              ));
              $this->db->executeStatement(
                  "UPDATE etl_watermark SET value = :v WHERE name = 'orders'",
                  ['v' => $max ?? $since],
              );

              return Command::SUCCESS;
          }
        marks:
          - {line: 8, tip: '`>=` দিয়ে একই timestamp-এর সারিও আবার আসে। কিছু ডুপ্লিকেট আসবে, কিন্তু কোনো সারি হারাবে না (at-least-once)।'}
          - {line: 6, tip: 'transactional ডেটাবেস নয়, read replica থেকে পড়ে, যেন OLTP-র উপর চাপ না পড়ে।'}
          - {line: 23, tip: 'লোড করে warehouse নিজেই, ফাইলটা একসাথে কপি করে; PHP থেকে সারি ধরে ধরে INSERT নয়। এটা exception দিলে watermark নড়ে না।'}
          - {line: 26, tip: 'ফাইল লেখা ও লোড, দুটো সফল হওয়ার পরই watermark এগোয়। মাঝে ব্যর্থ হলে পরের বার আবার একই জায়গা থেকে।'}
      - type: code
        lang: sql
        file: 'warehouse/raw.sql (BigQuery syntax)'
        variant: good
        code: |
          -- একবার চালান: raw স্তর প্রতিটা সারি যেমন এসেছে তেমন রাখে
          CREATE TABLE IF NOT EXISTS raw.raw_orders (
            id           INT64,
            user_id      INT64,
            total_amount NUMERIC,
            status       STRING,
            created_at   TIMESTAMP,
            updated_at   TIMESTAMP
          );

          -- কমান্ড প্রতিটা ফাইলের জন্য এটাই চালায়; JSON key আর কলামের নাম এক
          LOAD DATA INTO raw.raw_orders
          FROM FILES (
            format = 'JSON',
            uris = ['gs://shop-lake/raw/orders/dt=2026-03-01/0192-example.jsonl']
          );
        marks:
          - {line: 7, tip: 'দুটো timestamp-ই রাখা হয়: `created_at` বলে বিক্রিটা কোন দিনের, `updated_at` দিয়ে সারির সবচেয়ে নতুন সংস্করণ বাছা হয়।'}
          - {line: 12, tip: 'এটা যোগ করে। একই ফাইল দুবার লোড করলে ডুপ্লিকেট সারি হয়, যা পরের স্লাইডে staging সরিয়ে দেয়।'}
    aside:
      - type: tips
        items:
          - 'প্রতিটা warehouse-এর নিজের bulk load আছে: BigQuery-তে `LOAD DATA`, Snowflake ও Redshift-এ `COPY`। সারি ধরে ধরে INSERT-এর বদলে সেটা ব্যবহার করুন।'
          - 'ELT ধাপগুলো ফলের দিক থেকে idempotent রাখুন: দুইবার চালালেও শেষ ফল এক। তাহলে ব্যর্থ হলে আবার চালানোই সমাধান।'
      - type: pitfalls
        items:
          - 'DELETE হওয়া সারি `updated_at` দিয়ে ধরা পড়ে না। soft delete রাখুন বা CDC ব্যবহার করুন।'
      - type: refs
        items:
          - {to: 'data/oltp-olap', label: 'CDC ও derived data'}
    check:
      q: 'ফাইল লেখার পর লোড ব্যর্থ হলো। কমান্ডটা আবার চালালে কেন নিরাপদ?'
      a: 'লোড সফল হওয়ার পরই watermark এগোয়, তাই আবার চালালে একই সারিগুলো আবার আসে। ক্র্যাশের আগে লোড সফল হয়ে থাকলে যে ডুপ্লিকেট হয়, staging তা সরিয়ে দেয়।'

  - slug: transform-in-warehouse
    title: 'Transform: গুদামের ভেতরেই পরিষ্কার ও সংজ্ঞা ঠিক'
    kind: howto
    tldr: 'Staging প্রতি id-র সবচেয়ে নতুন সারি রেখে ডুপ্লিকেট সরায়। Mart ব্যবসার সংজ্ঞা SQL-এ একবার ঠিক করে, তাই প্রতিটা ড্যাশবোর্ড একই সংখ্যা পড়ে।'
    keywords: ['staging', 'mart', 'dbt', 'transform', 'ROW_NUMBER', 'metric definition', 'Asia/Dhaka']
    blocks:
      - type: text
        body: |
          Raw-তে ডুপ্লিকেট থাকে, কারণ লোড যোগ করে আর extract কিছু সারি আবার আনতে পারে। **Staging** প্রতিটা অর্ডারের একটাই সারি রাখে: সবচেয়ে নতুনটা। তারপর **mart** ব্যবসার নিয়ম একবার লাগায়: শুধু paid অর্ডার গোনা হবে, আর দিন হবে ঢাকার সময়ে অর্ডারের দিন। প্রথম স্লাইডের তিন সংখ্যার ঘটনা এখানেই থামে, কারণ ফাইন্যান্স, মার্কেটিং আর প্রোডাক্ট দল সবাই এই একটা টেবিলই পড়ে।
      - type: code
        lang: sql
        file: 'warehouse/transform.sql (BigQuery syntax)'
        variant: good
        code: |
          -- staging: প্রতিটা অর্ডারের সবচেয়ে নতুন সংস্করণ (ডুপ্লিকেট বাদ)
          CREATE OR REPLACE VIEW staging.stg_orders AS
          SELECT * EXCEPT (rn) FROM (
            SELECT *, ROW_NUMBER() OVER (PARTITION BY id ORDER BY updated_at DESC) AS rn
            FROM raw.raw_orders
          )
          WHERE rn = 1;

          -- mart: ব্যবসার সংজ্ঞা এখানে একবার ঠিক করা
          CREATE OR REPLACE VIEW mart.mart_daily_sales AS
          SELECT DATE(created_at, 'Asia/Dhaka') AS day,
                 SUM(total_amount) AS revenue
          FROM staging.stg_orders
          WHERE status = 'paid'
          GROUP BY day;
        marks:
          - {line: 4, tip: 'প্রতিটা id-র সারিগুলো নতুন থেকে পুরনো ক্রমে নম্বর দিয়ে ১ নম্বরটা রাখা হয়। আবার লোড হওয়া ফাইল শুধু পুরনো কপি যোগ করে, যেগুলো বাদ পড়ে।'}
          - {line: 11, tip: 'দিন মানে অর্ডার তৈরির দিন, ঢাকার সময়ে; UTC নয়, শেষ আপডেটের দিনও নয়। এটাই "মাসের শেষ" নিয়ে বিতর্ক থামায়।'}
      - type: points
        title: 'এতে কী মেটে'
        style: check
        items:
          - 'একটা সংজ্ঞা: শুধু paid অর্ডার, ফেরত বাদ, দিন ঢাকার সময়ে।'
          - 'একটা জায়গা: প্রতিটা ড্যাশবোর্ড `mart_daily_sales` পড়ে, নিজের কপি নয়।'
          - 'আবার বানানো যায়: নিয়ম বদলে SQL আবার চালান, raw থেকে mart নতুন করে হিসাব হবে।'
    aside:
      - type: tips
        items:
          - 'transform-এর SQL git-এ রাখুন, dbt-র মতো টুল তা ক্রমে চালিয়ে test-ও করে।'
      - type: pitfalls
        items:
          - 'transform চলে warehouse-এর টাকার-হিসাবের compute-এ, আর view প্রতিবার পড়ায় আবার হিসাব করে। ভারী mart-কে নির্দিষ্ট সময় পরপর নতুন করে বানানো টেবিল করে রাখুন।'
      - type: refs
        items:
          - {to: 'data/oltp-olap', label: 'সারাংশ কেন derived data'}
    check:
      q: 'ELT-তে কাঁচা ডেটা অক্ষত রাখার সুবিধা কী?'
      a: 'রূপান্তরের নিয়মে ভুল ধরা পড়লে raw থেকে staging আর mart আবার বানানো যায়, মূল সিস্টেমে ফিরে যেতে হয় না।'

  - slug: batch-vs-streaming
    title: 'Batch না streaming: কত দ্রুত লাগবে?'
    kind: compare
    tldr: 'Batch নির্দিষ্ট সময়ে এক চাপে ডেটা সরায়, সহজ ও সস্তা; streaming প্রতিটা ঘটনা সাথে সাথে সরায়, দ্রুত কিন্তু জটিল। দেরি কতটা সহ্য হয়, সেটাই নির্ধারক।'
    keywords: ['batch', 'streaming', 'Kafka', 'latency', 'freshness', 'Messenger']
    blocks:
      - type: text
        body: |
          পাইকারি মাল রাতে একবার ট্রাকে আসা হলো **batch**: সহজ, সস্তা, কিন্তু সকালে আগের রাতের হিসাব। কনভেয়ার বেল্টে প্রতিটা প্যাকেট সাথে সাথে আসা হলো **streaming**: হালনাগাদ, কিন্তু যন্ত্র আর পাহারা চাই। বেশিরভাগ রিপোর্টে "গতকালের ডেটা" যথেষ্ট, তাই batch দিয়ে শুরু করুন। স্ট্রিম দরকার তখন, যখন ঘটনার মিনিট বা সেকেন্ডের মধ্যে প্রতিক্রিয়া লাগে, যেমন প্রতারণা শনাক্ত।
      - type: visual
        kind: compare
        caption: 'দুই ধরনের pipeline'
        columns:
          - title: 'Batch'
            tone: good
            icon: calendar
            tip: 'নির্দিষ্ট সময়ে এক চাপে ডেটা তুলে নেয়, যেমন প্রতি রাত বা প্রতি ঘণ্টা।'
            items:
              - 'ডেটা ঘণ্টা বা দিন পুরনো'
              - 'সহজ, সস্তা, আবার চালানো সহজ'
              - 'ব্যর্থ হলে পুরো ব্যাচ আবার'
              - 'ড্যাশবোর্ড, মাসিক রিপোর্ট'
          - title: 'Streaming'
            tone: accent
            icon: bolt
            tip: 'প্রতিটা ঘটনা ঘটার সাথে সাথে পাইপে ঢোকে, সেকেন্ডের মধ্যে অন্য দিকে পৌঁছায়।'
            items:
              - 'ডেটা সেকেন্ড-মিনিট পুরনো'
              - 'জটিল: ক্রম, দেরিতে আসা ঘটনা, ডুপ্লিকেট'
              - 'সবসময় চালু থাকে, পাহারা দরকার'
              - 'প্রতারণা শনাক্ত, লাইভ ট্র্যাকিং'
      - type: points
        title: 'সিদ্ধান্তের প্রশ্ন'
        style: number
        items:
          - 'ডেটা কতক্ষণ পুরনো হলে ক্ষতি নেই? ঘণ্টা বা দিন হলে batch।'
          - 'প্রতিটা ঘটনায় কি তাৎক্ষণিক কাজ করতে হবে (সতর্কবার্তা, ব্লক)? হলে streaming।'
          - 'দল কি রাত-বিরাতে pipeline সামলাতে পারবে? না হলে batch।'
      - type: quote
        body: 'আগে batch দিয়ে শুরু করুন। "এখনই লাগবে" প্রমাণ হলে তবেই streaming।'
    aside:
      - type: when
        use:
          - 'Batch: দৈনিক বিক্রির রিপোর্ট, মাসিক হিসাব, ML প্রশিক্ষণের ডেটা'
          - 'Streaming: প্রতারণা শনাক্ত, লাইভ ড্যাশবোর্ড, search index সিঙ্ক'
        avoid:
          - 'শুধু "আধুনিক" শোনায় বলে Kafka বসানো; মিনিটের পুরনো ডেটাও লাগে না এমন জায়গায়'
      - type: refs
        items:
          - {to: 'messaging/delivery-guarantees', label: 'বার্তা পৌঁছানোর গ্যারান্টি'}
    check:
      q: 'দৈনিক বিক্রির রিপোর্ট সকাল ৯টায় লাগে। batch না streaming, কেন?'
      a: 'Batch। ডেটা কয়েক ঘণ্টা পুরনো হলেও ক্ষতি নেই, আর batch সহজ, সস্তা ও ব্যর্থ হলে আবার চালানো যায়।'

  - slug: data-governance
    title: 'Governance: মালিক, মান আর ক্যাটালগ'
    kind: howto
    tldr: 'প্রতিটা dataset-এর একজন মালিক, লিখিত সংজ্ঞা ও মানের পরীক্ষা থাকে, আর সবার খোঁজার জন্য একটা ক্যাটালগ। এতে "কোন সংখ্যা বিশ্বাস করব" প্রশ্ন মেটে।'
    keywords: ['data governance', 'data catalog', 'data quality', 'data contract', 'ownership', 'freshness']
    blocks:
      - type: text
        body: |
          গুদামে মাল ঢুকলেই যথেষ্ট নয়, প্রতিটা তাকে লাগে তিনটা জিনিস। **মালিক**: কার দায়িত্ব, ভুল হলে কাকে ডাকবেন। **মান**: স্বয়ংক্রিয় পরীক্ষা, যেমন "revenue কখনো ঋণাত্মক নয়, ডেটা সকাল ৬টার মধ্যে এসেছে"। **ক্যাটালগ**: সব dataset-এর তালিকা, সংজ্ঞা সহ, যেন কেউ নিজে নিজে আরেকটা কপি বানিয়ে না বসে। এই তিনটাকেই বলে data governance।
      - type: code
        lang: yaml
        file: 'catalog/mart_daily_sales.yaml'
        variant: good
        code: |
          dataset: mart_daily_sales
          owner: team-finance-data          # ভুল হলে কাকে জানাবেন
          description: 'দৈনিক paid বিক্রি, BDT, ঢাকার সময় অনুযায়ী দিন। ফেরত বাদ।'
          freshness: 'প্রতিদিন সকাল ৬টার মধ্যে হালনাগাদ'
          pii: false                        # ব্যক্তিগত তথ্য নেই
          columns:
            day:     {type: date,   not_null: true, unique: true}
            revenue: {type: bigint, not_null: true, min: 0}
        marks:
          - {line: 2, tip: 'নাম নয়, টিমের নাম। ব্যক্তি বদলায়, টিম থাকে।'}
          - {line: 4, tip: 'প্রতিশ্রুতি লেখা আছে বলে ডেটা দেরি করলে সেটা সতর্কবার্তা, আন্দাজ নয়।'}
      - type: code
        lang: sql
        file: 'warehouse/checks/mart_daily_sales.sql'
        variant: good
        code: |
          -- প্রতিটা query শূন্য সারি ফেরালে পরীক্ষা পাশ; একটাও সারি এলে ফেল
          SELECT 'negative_revenue' AS failed_check, day
          FROM mart_daily_sales WHERE revenue < 0
          UNION ALL
          SELECT 'duplicate_day', day
          FROM mart_daily_sales GROUP BY day HAVING COUNT(*) > 1
          UNION ALL
          SELECT 'stale_data', max(day)
          FROM mart_daily_sales
          HAVING max(day) < DATE_SUB(CURRENT_DATE('Asia/Dhaka'), INTERVAL 1 DAY);
        marks:
          - {line: 1, tip: 'এই convention-এ পরীক্ষা মানে "খারাপ সারি খুঁজুন"; শূন্য সারি মানে সব ভালো।'}
          - {line: 10, tip: 'সতেজতার পরীক্ষা: সর্বশেষ দিন গতকালের আগের হলে pipeline নিশ্চয়ই আটকেছে।'}
      - type: points
        title: 'ছোট দলের governance শুরু'
        style: check
        items:
          - 'প্রতিটা dataset-এর জন্য একটা YAML/Markdown ফাইল git-এ: মালিক, সংজ্ঞা, সতেজতা।'
          - 'মান পরীক্ষা pipeline-এর শেষ ধাপে; ফেল হলে ড্যাশবোর্ডে সতর্কবার্তা।'
          - 'ব্যক্তিগত তথ্যের কলামে চিহ্ন দিন (`pii: true`) আর সীমিত অ্যাক্সেস।'
    aside:
      - type: tips
        items:
          - 'ক্যাটালগ প্রথমে একটা wiki পাতা হলেও চলে; টুল (DataHub, OpenMetadata) পরে।'
      - type: refs
        items:
          - {to: 'data/data-lifecycle', label: 'ডেটা কতদিন রাখবেন ও মুছবেন'}
          - {to: 'security/data-protection', label: 'ব্যক্তিগত ডেটা সুরক্ষা'}
    check:
      q: 'কোনো ড্যাশবোর্ডে হঠাৎ revenue ঋণাত্মক দেখা গেল। governance-এর কোন অংশ এটা আগেই ধরতে পারত?'
      a: 'মানের পরীক্ষা (`revenue < 0` দিয়ে ফেল করা পরীক্ষা), আর মালিক ঠিক করা থাকলে ফেল হওয়ার সাথে সাথে তাকে জানানো যেত।'

flashcards:
  - q: 'Data warehouse কী?'
    a: 'পরিষ্কার, কাঠামোযুক্ত ডেটা রাখার আলাদা ডেটাবেস, যা বিশ্লেষণ ও রিপোর্টের জন্য তৈরি।'
    more: |
      ডেটা আগে পরিষ্কার ও টেবিলে সাজিয়ে তারপর রাখা হয়, তাই SQL রিপোর্ট দ্রুত ও নির্ভরযোগ্য। উদাহরণ: BigQuery, Snowflake, Redshift। transactional ডেটাবেস থেকে ডেটা এনে এখানে রাখা হয়।
    ref: warehouse-lake-lakehouse
  - q: 'Data lake আর warehouse-এর মূল তফাত কী?'
    a: 'Lake-এ সব ধরনের কাঁচা ডেটা সস্তায় রাখা হয়, গঠন ঠিক হয় পড়ার সময়। Warehouse-এ আগে পরিষ্কার করে সাজিয়ে রাখা হয়।'
    more: |
      Lake সাধারণত object storage-এ Parquet, JSON, ছবি, লগ রাখে। নমনীয় ও সস্তা, কিন্তু গোছানো না থাকলে অগোছালো "ডেটা জলাভূমি" হয়। Warehouse বেশি দামি কিন্তু পরিষ্কার ও দ্রুত।
    ref: warehouse-lake-lakehouse
  - q: 'Lakehouse কী?'
    a: 'Lake-এর সস্তা ফাইলের উপর টেবিলের মতো গঠন, transaction ও SQL যোগ করে warehouse-এর সুবিধা দেওয়ার ধরন।'
    more: |
      Delta Lake, Apache Iceberg-এর মতো ফরম্যাট ফাইলগুলোর উপর metadata স্তর বসায়। ফলে একই ডেটায় BI রিপোর্ট আর ML দুটোই চলে, আলাদা কপি লাগে না।
    ref: warehouse-lake-lakehouse
  - q: 'ETL আর ELT-এর পার্থক্য কী?'
    a: 'ETL-এ আগে রূপান্তর, পরে লোড। ELT-এ আগে কাঁচা ডেটা লোড, রূপান্তর গুদামের ভেতরেই SQL-এ।'
    more: |
      ELT-এ কাঁচা ডেটা অটুট থাকে, তাই রূপান্তরের নিয়মে ভুল পেলে আবার বানানো যায়। আধুনিক cloud warehouse ELT-কে সস্তা ও দ্রুত করেছে। ডেটা সাধারণত raw, staging, mart তিন স্তরে সাজানো হয়।
    ref: elt-pipeline
  - q: 'Incremental extract-এ watermark কী কাজ করে?'
    a: 'শেষবার কোন পর্যন্ত ডেটা নেওয়া হয়েছে তার চিহ্ন (যেমন `updated_at`), যেন পরের বার শুধু নতুন সারি আসে।'
    more: |
      watermark ফাইল লেখা ও লোড, দুটো সফল হওয়ার পরই এগোয়। `>=` ব্যবহার করলে কিছু ডুপ্লিকেট আসে কিন্তু কোনো সারি হারায় না; staging স্তর প্রতি id-র সবচেয়ে নতুন সারি রাখে। DELETE ধরতে soft delete বা CDC লাগে।
    ref: elt-pipeline
  - q: 'ELT-তে extract করা ফাইল warehouse-এ কীভাবে ঢোকে?'
    a: 'extract ফাইলটা lake-এ লেখে, তারপর warehouse-এর নিজের bulk load (BigQuery `LOAD DATA`, Snowflake বা Redshift `COPY`) সেটা raw টেবিলে কপি করে।'
    more: |
      PHP থেকে সারি ধরে ধরে INSERT-এর চেয়ে bulk load অনেক সস্তা ও দ্রুত। এটা যোগ করে, তাই একই ফাইল দুবার লোড হলে সারি ডুপ্লিকেট হয়, যা staging সরিয়ে দেয়। watermark এগোনোর আগে লোড চালান, তাহলে ব্যর্থ লোড শুধু আবার চলে।
    ref: elt-pipeline
  - q: 'Staging আর mart স্তর আলাদাভাবে কী করে?'
    a: 'Staging ডুপ্লিকেট সরায় (প্রতি id-র নতুন সারি)। Mart ব্যবসার সংজ্ঞা একবার লাগায়, যেমন ঢাকার দিন ধরে paid অর্ডার।'
    more: |
      Raw কখনো বদলানো হয় না, তাই নিয়ম বদলালে তা থেকে staging আর mart আবার বানানো যায়। প্রতিটা ড্যাশবোর্ড mart পড়ে, এভাবেই একটা মেট্রিকের তিন সংখ্যা বন্ধ হয়।
    ref: transform-in-warehouse
  - q: 'কখন batch, কখন streaming?'
    a: 'ডেটা ঘণ্টা বা দিন পুরনো হলে চলে এমন হলে batch; ঘটনার সাথে সাথে কাজ লাগলে streaming।'
    more: |
      batch সহজ, সস্তা ও আবার চালানো যায়। streaming দ্রুত কিন্তু ক্রম, ডুপ্লিকেট আর দেরিতে আসা ঘটনা সামলাতে হয়। বেশিরভাগ রিপোর্টে batch-ই যথেষ্ট, তাই সেটা দিয়ে শুরু করুন।
    ref: batch-vs-streaming
  - q: 'Data governance-এর তিন মূল উপাদান কী?'
    a: 'মালিক (কার দায়িত্ব), মান (স্বয়ংক্রিয় পরীক্ষা) আর ক্যাটালগ (সংজ্ঞাসহ dataset-এর তালিকা)।'
    more: |
      মালিক না থাকলে ভুলের দায় কারো থাকে না। মানের পরীক্ষা ছাড়া খারাপ ডেটা নীরবে ড্যাশবোর্ডে যায়। ক্যাটালগ না থাকলে সবাই নিজের কপি বানায়, আর একই মেট্রিকের তিন সংখ্যা আসে।
    ref: data-governance
