slides:
  - slug: retry-storm-story
    title: 'সবাই মিলে আবার চেষ্টা করলে সার্ভিস আর ওঠে না'
    kind: story
    tldr: 'Partial failure-এ সবাই সাথে সাথে retry করলে ট্রাফিক বাড়ে, সুস্থ হতে যাওয়া সার্ভিস আবার পড়ে যায়। একে বলে retry storm।'
    keywords: ['retry storm', 'partial failure', 'thundering herd', 'retry', 'আংশিক ব্যর্থতা', 'পেমেন্ট gateway']
    blocks:
      - type: metaphor
        icon: phone
        title: 'ব্যস্ত হটলাইনে বারবার ডায়াল'
        body: |
          বিদ্যুৎ অফিসের হটলাইন ব্যস্ত। সবাই ভাবে, "একবার লাগেনি, আবার ডায়াল করি", আর প্রতি সেকেন্ডে চাপতে থাকে। ফলে লাইনে ভিড় আরও বাড়ে, যাদের সত্যিই জরুরি দরকার তারাও ঢুকতে পারে না। কোডে এই ডায়ালই হলো retry। আর সবাই মিলে একসাথে করলে সেটাই হয় **retry storm**।
      - type: text
        body: |
          সার্ভিস সবসময় পুরো বন্ধ হয় না। প্রায়ই সে **partial failure**-এ থাকে: ধরুন পেমেন্ট gateway-র প্রতি ১০০টার মধ্যে ৫০টা ব্যর্থ হচ্ছে। এখন আপনার প্রতিটা ব্যর্থ ডাক সাথে সাথে ৩ বার আবার চেষ্টা করে। ফল নিচের হিসাবে।
      - type: visual
        kind: bars
        caption: 'সেকেন্ডে ক্ষমতা ১৫০; retry না করলে ১০০, ৩ বার retry করলে প্রায় ১৯০'
        items:
          - {label: 'স্বাভাবিক ট্রাফিক', value: 100, display: '১০০/সেকেন্ড', tone: good, tip: 'প্রতি ডাকে একবারই চেষ্টা। gateway এটা সহজে সামলায়।'}
          - {label: 'gateway-র ক্ষমতা', value: 150, display: '১৫০/সেকেন্ড', tone: default, tip: 'এর বেশি এলে gateway আরও ব্যর্থ করে। এই সীমাটাই আসল।'}
          - {label: '৩ বার retry-সহ', value: 190, display: 'প্রায় ১৯০/সেকেন্ড', tone: bad, tip: '১০০ × (১ + ০.৫ + ০.২৫ + ০.১২৫) ≈ ১৯০। ৫০% ব্যর্থ ধরলে প্রতিটা ধাপে অর্ধেক আবার চেষ্টা করে।'}
      - type: quote
        body: 'ব্যর্থ সার্ভিসকে আরও বেশি request পাঠানো মানে তাকে আরও ডোবানো।'
    aside:
      - type: story
        title: 'যে সার্ভিস সেরে উঠতে পারল না'
        body: |
          একটা পেমেন্ট gateway কয়েক সেকেন্ডের জন্য ধীর হয়েছিল। সব অ্যাপ সাথে সাথে retry করায় ট্রাফিক তিনগুণ হলো। gateway সুস্থ হতে পারল না, ঘণ্টাখানেক ধরে ব্যর্থ থাকল। শুরুর সমস্যা মিনিটে মিটে যেত, retry-ই তাকে ঘণ্টার সমস্যা বানাল।
      - type: terms
        items:
          - {term: 'Partial failure', meaning: 'সার্ভিস পুরো বন্ধ নয়, কিছু request ব্যর্থ হচ্ছে বা ধীর। সবচেয়ে সামলানো কঠিন অবস্থা।'}
          - {term: 'Retry storm', meaning: 'অনেক client একসাথে ব্যর্থ ডাক বারবার পাঠিয়ে সার্ভিসের ওপর চাপ বহুগুণ করা।'}
    check:
      q: 'Gateway-র ৫০% ডাক ব্যর্থ হচ্ছে। আপনি ৩ বার করে immediate retry চালু করলে ট্রাফিক প্রায় কত গুণ হবে, আর তার ফল কী?'
      a: 'প্রায় ১.৯ গুণ। ক্ষমতার বেশি ট্রাফিক গেলে gateway আরও ব্যর্থ করে, আরও retry হয় — সেরে ওঠার সুযোগই পায় না।'

  - slug: circuit-breaker-states
    title: 'Circuit breaker: ফিউজ যেমন বাড়ি বাঁচায়'
    kind: concept
    tldr: 'Circuit breaker ব্যর্থ ডাক গুনে, সীমা ছুঁলে ডাকাই বন্ধ করে দেয় (open), কিছুক্ষণ পরে একটা পরীক্ষা (half-open) করে, সফল হলে আবার চালু (closed)।'
    keywords: ['circuit breaker', 'closed', 'open', 'half-open', 'fail fast', 'সার্কিট ব্রেকার']
    blocks:
      - type: metaphor
        icon: bolt
        title: 'বাড়ির MCB বা ফিউজ'
        body: |
          ওয়্যারিংয়ে শর্ট হলে MCB নিজে থেকে লাইন কেটে দেয়, যাতে আগুন না লাগে। কিছুক্ষণ পর আপনি সুইচ আস্তে তুলে দেখেন: ঠিক থাকলে চলতে থাকে, আবার শর্ট হলে সাথে সাথে পড়ে যায়। কোডে ঠিক এটাই circuit breaker: সুস্থ অবস্থা **closed**, কাটা অবস্থা **open**, পরীক্ষার অবস্থা **half-open**।
      - type: visual
        kind: flow
        animate: false
        caption: 'Circuit breaker-এর তিন অবস্থা ও চার পরিবর্তন'
        nodes:
          - {id: closed, label: 'CLOSED', sub: 'সব ডাক যায়', icon: check, tone: good, col: 0, row: 2, tip: 'স্বাভাবিক অবস্থা। প্রতিটা ডাক সার্ভিসে যায়, আর breaker চুপচাপ ব্যর্থতা গোনে।'}
          - {id: open, label: 'OPEN', sub: 'কোনো ডাকই যায় না', icon: cross, tone: bad, col: 4, row: 2, tip: 'ডাক সাথে সাথে ফিরে যায় (fail fast), বিকল্প উত্তর দেওয়া হয়। সার্ভিসের ওপর চাপ শূন্য।'}
          - {id: half, label: 'HALF-OPEN', sub: 'একটা পরীক্ষা ডাক', icon: switch, tone: warn, col: 2, row: 0, tip: 'সার্ভিস সেরেছে কি না দেখতে একটা (বা খুব অল্প) ডাক ছাড়া হয়। সব ডাক নয়, যাতে আবার ডোবানো না হয়।'}
        edges:
          - {from: closed, to: open, label: 'পরপর ৫টা ব্যর্থ', tone: bad, tip: 'সীমা ছুঁলে ফিউজ পড়ে। সীমাটা ব্যর্থতার সংখ্যা বা শতকরা হার দিয়ে ঠিক করা হয়।'}
          - {from: open, to: half, label: '৩০ সেকেন্ড পরে', tone: warn, tip: 'সার্ভিসকে সেরে ওঠার সময় দেওয়া হলো। এই সময় এক ডাকও যায় না।'}
          - {from: half, to: closed, label: 'পরীক্ষা সফল', tone: good, tip: 'ডাক ঠিকঠাক ফিরেছে, তাই ফিউজ আবার তোলা হলো।'}
          - {from: half, to: open, label: 'পরীক্ষা ব্যর্থ', tone: bad, dashed: true, tip: 'এখনো সারেনি। আবার ৩০ সেকেন্ডের জন্য কাটা, কিছু ঢোকে না।'}
      - type: text
        body: |
          Breaker-এর কাজ ব্যর্থতা ঠেকানো নয়, **ব্যর্থতার খরচ কমানো**: open থাকলে worker ২ সেকেন্ড timeout-এর জন্য বসে থাকে না, সাথে সাথে বিকল্প উত্তর দেয়। আর সার্ভিস বিশ্রাম পায়।
      - type: quote
        body: 'সার্ভিস অসুস্থ হলে তাকে ডাকা বন্ধ করুন, আর অল্প করে পরীক্ষা করে দেখুন কখন সারল।'
    aside:
      - type: terms
        items:
          - {term: 'Fail fast', meaning: 'ব্যর্থ হবেই জানলে অপেক্ষা না করে সাথে সাথে ব্যর্থ বলে দেওয়া।'}
          - {term: 'Threshold', meaning: 'কতটা ব্যর্থতার পর breaker কাটবে: যেমন পরপর ৫টা বা ৫০% হার।'}
      - type: remember
        body: 'CLOSED চলে, OPEN কাটা, HALF-OPEN পরীক্ষা: সফল হলে আবার চালু, নইলে আবার কাটা।'
      - type: when
        use: ['দূরের সার্ভিসের ডাকে, যা আটকে যেতে বা ব্যর্থ হতে পারে: payment gateway, কুরিয়ার, SMS']
        avoid: ['নিজের প্রসেসের ভেতরের ডাকে: বাঁচানোর কিছু নেই', 'খুব কম ট্রাফিকে ৫টা ব্যর্থতা জমতেই ঘণ্টা লাগে। দাম: open থাকলে ব্যবহারকারী fallback পায়']
      - type: refs
        items:
          - {to: 'resilience/graceful-degradation', label: 'OPEN থাকলে কী উত্তর দেবে'}
    check:
      q: 'Breaker OPEN অবস্থায় আছে। এক ব্যবহারকারী চেকআউট চাপল। তার request কী পায়, আর gateway কী পায়?'
      a: 'ব্যবহারকারী সাথে সাথে বিকল্প উত্তর পায়, কোনো timeout-এর অপেক্ষা ছাড়া। gateway কোনো ডাকই পায় না, তাই চাপমুক্ত হয়ে সেরে উঠতে পারে।'

  - slug: backoff-jitter-retry
    title: 'Retry যেভাবে করতে হয়: backoff আর jitter'
    kind: howto
    tldr: 'প্রতি retry-র আগে বেশি সময় অপেক্ষা (exponential backoff) আর সেই সময়ে একটু এলোমেলো ভাব (jitter)। Symfony RetryableHttpClient এটা config-এই দেয়।'
    keywords: ['exponential backoff', 'jitter', 'RetryableHttpClient', 'retry_failed', 'max_retries', 'idempotency key']
    blocks:
      - type: text
        body: |
          হটলাইনের ভুল ছিল সাথে সাথে বারবার ডায়াল। ঠিক নিয়ম: প্রথমবার একটু অপেক্ষা, তারপর দ্বিগুণ, তারপর আরও দ্বিগুণ — একে বলে **exponential backoff**। আর সবাই ঠিক একই মুহূর্তে ফিরলে আবার ভিড়, তাই প্রতিটা অপেক্ষায় একটু এলোমেলো ভাব যোগ করুন, যাকে বলে **jitter**।
      - type: code
        lang: yaml
        file: 'config/packages/framework.yaml'
        variant: good
        code: |
          framework:
              http_client:
                  scoped_clients:
                      payment.client:
                          base_uri: 'https://api.gateway.example'
                          timeout: 2
                          max_duration: 6
                          retry_failed:
                              max_retries: 3
                              delay: 500          # প্রথম retry-র আগে ৫০০ms
                              multiplier: 2       # প্রতিবার দ্বিগুণ: ৫০০, ১০০০, ২০০০
                              max_delay: 4000     # যত বড়ই হোক, ৪ সেকেন্ডের বেশি নয়
                              jitter: 0.3         # ±৩০% এলোমেলো
                              http_codes: [429, 502, 503, 504]
        marks:
          - {line: 9, tip: 'max_retries ৩ মানে মোট ৪ বার চেষ্টা: প্রথমটা ও ৩টা retry। ডাক যত পুনরাবৃত্ত, গেটওয়ের ওপর চাপ তত।'}
          - {line: 13, tip: 'jitter: 0.3 মানে প্রতিটা অপেক্ষা ৩০% ওপর-নিচ হয়, তাই সব client একই মুহূর্তে ফেরে না।'}
          - {line: 14, tip: 'শুধু অস্থায়ী ত্রুটি retry করুন। 400, 404, 422 মানে ডাকটাই ভুল, একশোবার পাঠালেও ঠিক হবে না।'}
      - type: code
        lang: php
        file: 'src/Payment/GatewayClient.php'
        variant: good
        code: |
          public function __construct(private readonly HttpClientInterface $paymentClient)
          {
          }

          public function status(string $paymentId): array
          {
              // GET নিরাপদ: যতবার retry হোক, ফল একই
              return $this->paymentClient->request('GET', "/v1/payments/$paymentId")->toArray();
          }

          public function charge(string $orderId, int $paisa): array
          {
              // POST: একই Idempotency-Key থাকলে retry-তে টাকা দুইবার কাটে না
              return $this->paymentClient->request('POST', '/v1/charges', [
                  'headers' => ['Idempotency-Key' => 'order-'.$orderId],
                  'json' => ['amount' => $paisa],
              ])->toArray();
          }
        marks:
          - {line: 1, tip: 'আর্গুমেন্টের নাম $paymentClient বলে Symfony payment.client নামের scoped client-ই বসায়, retry সহ।'}
          - {line: 14, tip: 'retry মানে একই ডাক একাধিকবার যেতে পারা। ঘাটতি হলো key ছাড়া POST: দুইবার চার্জ। key থাকলে gateway দ্বিতীয়টা চিনে নেয়।'}
      - type: visual
        kind: table
        caption: 'তিন retry-তে অপেক্ষার সময়: ৫০০ms, দ্বিগুণ, jitter ±৩০%'
        headers: ['কততম retry', 'গড় অপেক্ষা', 'jitter সহ আসল']
        rows:
          - cells: ['প্রথম', '৫০০ms', '৩৫০–৬৫০ms']
            tip: 'delay: 500 থেকে শুরু। ৩০% jitter-এ এই ঘরের মধ্যে যেকোনো মান পড়তে পারে।'
          - cells: ['দ্বিতীয়', '১,০০০ms', '৭০০–১,৩০০ms']
            tip: 'multiplier: 2 তাই আগেরটার দ্বিগুণ। প্রতিবার অপেক্ষা বাড়ে, সার্ভিস বেশি সময় পায়।'
          - cells: ['তৃতীয়', '২,০০০ms', '১,৪০০–২,৬০০ms']
            tip: 'max_delay ৪,০০০ বলে এখনো সীমার নিচে। বেশি retry থাকলে ৪ সেকেন্ডেই আটকাত।'
      - type: quote
        body: 'Retry হবে অপেক্ষা বাড়িয়ে (backoff), এলোমেলোভাবে (jitter), আর শুধু অস্থায়ী ত্রুটিতে।'
    aside:
      - type: tips
        items:
          - 'ব্যবহারকারী যেটার অপেক্ষায় বসে আছে, সেখানে মোট সময় = চেষ্টা × timeout + অপেক্ষা। এখানে ৪ × ২ + ৩.৫ = ১১.৫ সেকেন্ড, তাই কম retry দিন।'
          - 'Retry শুধু নিরাপদ বা idempotent ডাকে: GET, আর POST হলে Idempotency-Key সহ।'
      - type: pitfalls
        items:
          - 'jitter ছাড়া backoff-এ সব client একই সময়ে ফেরে, ভিড় ঢেউয়ের মতো বারবার আসে (thundering herd)।'
          - 'Retry timeout-এর বিকল্প নয়। প্রতিটা চেষ্টার নিজের timeout লাগবেই।'
      - type: refs
        items:
          - {to: 'payments/idempotency-keys', label: 'Idempotency key কীভাবে কাজ করে'}
          - {to: 'resilience/containing-failure', label: 'প্রতিটা ডাকে timeout'}
    check:
      q: 'Backoff আছে কিন্তু jitter নেই। ১,০০০ client একসাথে ব্যর্থ হলে কী ঘটে, আর jitter কী বদলায়?'
      a: 'সবাই ঠিক ৫০০ms, ১০০০ms পরে ফিরে ১,০০০টা ডাক একসাথে আনে — বারবার ঢেউ। jitter ওই ডাকগুলোকে সময়ের ওপর ছড়িয়ে দেয়, ঢেউ সমতল হয়।'

  - slug: simple-breaker-symfony
    title: 'Symfony Cache দিয়ে একটা ছোট circuit breaker'
    kind: howto
    tldr: 'ব্যর্থতার সংখ্যা আর "কাটা কতক্ষণ" Symfony Cache-এ রাখুন। কাটা থাকলে ডাক না করে সোজা fallback, নইলে ডাকুন — সফল হলে গণনা শূন্য।'
    keywords: ['circuit breaker', 'Symfony Cache', 'CacheItemPoolInterface', 'fallback', 'Redis', 'ছোট breaker']
    blocks:
      - type: text
        body: |
          পুরো লাইব্রেরি লাগবে না, ছোট একটা ক্লাসই যথেষ্ট। অবস্থা (ব্যর্থ কতবার, কখন পর্যন্ত কাটা) cache-এ রাখুন। cache যদি Redis হয়, সব সার্ভার একই অবস্থা দেখে, ফলে একটা সার্ভার সার্ভিসকে অসুস্থ বুঝলে সবাই জানে।
      - type: code
        lang: php
        file: 'src/Resilience/CircuitBreaker.php'
        variant: good
        code: |
          final class CircuitBreaker
          {
              public function __construct(
                  private readonly CacheItemPoolInterface $cache,
                  private readonly int $threshold = 5,
                  private readonly int $openSeconds = 30,
              ) {
              }

              public function call(string $name, callable $action, callable $fallback): mixed
              {
                  $item = $this->cache->getItem('breaker.'.$name);
                  ['fails' => $fails, 'until' => $until] = $item->get() ?? ['fails' => 0, 'until' => 0];

                  if ($until > time()) {
                      return $fallback();                  // OPEN: ডাকই যায় না
                  }

                  try {
                      $result = $action();                 // CLOSED, বা HALF-OPEN-এর পরীক্ষা
                      $item->set(['fails' => 0, 'until' => 0]);
                  } catch (TransportExceptionInterface|ServerExceptionInterface) { // নেটওয়ার্ক, 5xx
                      ++$fails;
                      $until = $fails >= $this->threshold ? time() + $this->openSeconds : 0;
                      $item->set(['fails' => $fails, 'until' => $until]);
                      $result = $fallback();
                  }

                  $this->cache->save($item->expiresAfter(300));

                  return $result;
              }
          }
        marks:
          - {line: 16, tip: 'until ভবিষ্যতে থাকলে breaker OPEN। fallback সাথে সাথে ফেরে, নেটওয়ার্কে যাওয়াই হয় না।'}
          - {line: 20, tip: 'until পেরিয়ে গেলে এই পথে ঢোকে: এটাই half-open। fails এখনো সীমায় আছে, তাই একবার ব্যর্থ হলেই আবার কাটা।'}
          - {line: 21, tip: 'একটা সফল ডাকে গণনা শূন্য: পরপর ব্যর্থতাই গোনা হচ্ছে, মোট নয়।'}
          - {line: 22, tip: 'শুধু নেটওয়ার্ক ব্যর্থতা আর 5xx গোনা হয়। 4xx (ClientException) মানে আমাদের ডাকই ভুল, আর TypeError-এর মতো নিজের কোডের বাগও গোনা হয় না।'}
      - type: code
        lang: php
        file: 'src/Shipping/ShippingCalculator.php'
        variant: good
        code: |
          public function chargeFor(string $district, int $weightGrams): int
          {
              return $this->breaker->call(
                  'courier',
                  fn () => $this->courier->chargeFor($district, $weightGrams),
                  fn () => self::DEFAULT_CHARGE_PAISA,   // বিকল্প: নির্দিষ্ট ডিফল্ট চার্জ
              );
          }
        marks:
          - {line: 4, tip: 'নাম দিয়ে আলাদা breaker: courier বন্ধ থাকলেও payment breaker নিজের মতো চলবে।'}
          - {line: 6, tip: 'fallback কী হবে তা ব্যবসার সিদ্ধান্ত। পরের slide-এর বিষয় graceful degradation।'}
    aside:
      - type: pitfalls
        items:
          - 'শুধু নেটওয়ার্ক বা 5xx ব্যর্থতা গুনুন। ব্যবহারকারীর ভুল ইনপুটে 4xx এলে breaker কাটলে সুস্থ সার্ভিস বন্ধ হয়ে যাবে।'
          - 'এই ছোট সংস্করণ half-open-এ একসাথে অনেক request পরীক্ষায় ছেড়ে দিতে পারে। বেশি ট্রাফিকে Symfony Lock বা আলাদা লাইব্রেরি নিন।'
      - type: tips
        items:
          - 'cache pool Redis-এ রাখুন, নইলে প্রতি সার্ভার নিজে আলাদা করে শেখে। `framework.cache.app` বা আলাদা pool দিতে পারেন।'
          - 'breaker কাটলে log ও metric পাঠান, কারণ এটাই সার্ভিস অসুস্থ হওয়ার সবচেয়ে ভালো সংকেত।'
      - type: refs
        items:
          - {to: 'resilience/graceful-degradation', label: 'ভালো fallback কী'}
    check:
      q: 'এই কোডে threshold ৫, openSeconds ৩০। ৬ষ্ঠ ডাক কখন সার্ভিসে যাবে আর কখন যাবে না?'
      a: '৫ম ব্যর্থতার পর ৩০ সেকেন্ড কোনো ডাক যাবে না (OPEN)। ৩০ সেকেন্ড পরের প্রথম ডাকটা পরীক্ষা: সফল হলে চালু, ব্যর্থ হলে আবার ৩০ সেকেন্ড বন্ধ।'

  - slug: retry-multiplication
    title: 'ফাঁদ: প্রতিটা স্তরে retry, আর retry-র কোনো বাজেট নেই'
    kind: pitfall
    tldr: 'প্রতি স্তরে ৩ retry মানে ৪×৪×৪ = ৬৪ ডাক। retry শুধু একটা স্তরে রাখুন, আর retry-র জন্য মোট ট্রাফিকের একটা ছোট বাজেট (retry budget) বেঁধে দিন।'
    keywords: ['retry budget', 'retry amplification', 'layered retries', 'RetryStrategyInterface', 'RateLimiter', 'বাজেট']
    blocks:
      - type: text
        body: |
          প্রতিটা স্তর নিজের ভালোর জন্য ভাবে "একটু retry দিই"। কিন্তু retry গুণ হয়, যোগ হয় না। Vue অ্যাপ ৩ বার, Symfony API ৩ বার, gateway client ৩ বার করলে একটা ক্লিকে সর্বোচ্চ ৪ × ৪ × ৪ = ৬৪টা ডাক। নিচের তিনটা স্তর দেখুন।
      - type: visual
        kind: layers
        caption: 'একটা ক্লিক, তিন স্তর, প্রতিটায় ৩ retry: gateway-তে সর্বোচ্চ ৬৪টা ডাক'
        layers:
          - {label: 'Vue অ্যাপ', sub: '৪ চেষ্টা', tone: warn, tip: 'ব্রাউজার ব্যর্থ হলে নিজেই আবার পাঠায়। প্রতিটা চেষ্টা API-তে নতুন request।'}
          - {label: 'Symfony API', sub: '৪ চেষ্টা প্রতিটার জন্য', tone: warn, tip: 'প্রতিটা request-এ API নিজেও gateway-কে ৪ বার ডাকতে পারে। এখানেই ৪ × ৪ = ১৬।'}
          - {label: 'Gateway client', sub: '৪ চেষ্টা প্রতিটার জন্য', tone: bad, tip: 'নিচের স্তরের সব retry মিলে ১৬ × ৪ = ৬৪। অসুস্থ gateway-র ওপর সবচেয়ে বেশি চাপ এখানে।'}
      - type: visual
        kind: compare
        caption: 'একই ক্লিক: প্রতি স্তরে retry, বনাম শুধু এক স্তরে'
        columns:
          - title: 'তিন স্তরেই retry'
            tone: bad
            icon: cross
            tip: 'প্রতিটা স্তর নিজে retry করে, তাই সংখ্যাগুলো গুণ হয়।'
            items: ['Vue ৪ × API ৪ × client ৪ চেষ্টা', 'অসুস্থ gateway-তে সর্বোচ্চ ৬৪টা ডাক']
          - title: 'retry শুধু এক স্তরে'
            tone: good
            icon: check
            tip: 'শুধু gateway-র কাছের স্তর retry করে। ওপরের স্তরগুলো একবারই চেষ্টা করে।'
            items: ['Vue ১ × API ১ × client ৪ চেষ্টা', 'gateway-তে সর্বোচ্চ ৪টা ডাক', 'দাম: ওপরের স্তর আগে ব্যর্থ হয়, তাই fallback লাগে']
      - type: code
        lang: php
        file: 'src/Resilience/BudgetedRetryStrategy.php'
        variant: good
        code: |
          final class BudgetedRetryStrategy implements RetryStrategyInterface
          {
              public function __construct(
                  private readonly RetryStrategyInterface $inner,
                  private readonly RateLimiterFactory $retryBudgetLimiter,
              ) {
              }

              public function shouldRetry(
                  AsyncContext $context,
                  ?string $responseContent,
                  ?TransportExceptionInterface $exception,
              ): ?bool {
                  $should = $this->inner->shouldRetry($context, $responseContent, $exception);
                  if (true !== $should) {
                      return $should;
                  }

                  // retry-র টোকেন আছে কি? না থাকলে এই ডাক এখানেই ব্যর্থ
                  return $this->retryBudgetLimiter->create('payment')->consume()->isAccepted();
              }

              public function getDelay(
                  AsyncContext $context,
                  ?string $responseContent,
                  ?TransportExceptionInterface $exception,
              ): int {
                  return $this->inner->getDelay($context, $responseContent, $exception);
              }
          }
        marks:
          - {line: 14, tip: 'আসল strategy (GenericRetryStrategy) আগে সিদ্ধান্ত নেয়: এই ত্রুটি retry-যোগ্য কি না।'}
          - {line: 20, tip: 'retry-যোগ্য হলে তবেই টোকেন নিন। token_bucket-এ ১০টা/সেকেন্ড দিলে ১০০ rps-এর মধ্যে retry ≈ ১০%।'}
      - type: quote
        body: 'Retry থাকবে একটা স্তরে, আর তার বাজেট থাকবে মোট ট্রাফিকের ১০% মতো।'
    aside:
      - type: tips
        items:
          - 'এই strategy `new RetryableHttpClient($inner, new BudgetedRetryStrategy(new GenericRetryStrategy(), $limiter), 3)` দিয়ে বসান।'
          - 'বাজেটের টোকেন শেষ হলে সাথে সাথে fallback দিন; breaker ও বাজেট একসাথে ভালো কাজ করে।'
      - type: pitfalls
        items:
          - 'limiter-এর storage শেয়ার্ড (Redis) রাখুন। নইলে প্রতি সার্ভার নিজের বাজেট পায়, আর সীমা সার্ভারের সংখ্যা দিয়ে গুণ হয়।'
          - 'বাজেট শুধু retry-র সীমা বাঁধে, gateway-কে সারায় না। টোকেন ফুরালে অস্থায়ী ত্রুটিতেও retry হয় না, তাই fallback তৈরি রাখুন।'
      - type: when
        use: ['retry হবে সবচেয়ে নিচের (gateway-র সবচেয়ে কাছের) স্তরে', 'ওপরের স্তরগুলো একবার চেষ্টা করে সোজা ব্যর্থ বা fallback দেবে']
        avoid: ['প্রতিটা স্তরে "নিজের নিরাপত্তার জন্য" retry', 'বাজেট ছাড়া retry']
      - type: refs
        items:
          - {to: 'messaging/dlq-retries', label: 'Queue-র retry ও dead letter'}
    check:
      q: 'Retry কোন একটা স্তরে রাখবেন, কেন? আর retry budget কী আটকায়?'
      a: 'সবচেয়ে নিচের স্তরে, কারণ সে-ই জানে ত্রুটিটা অস্থায়ী কি না, আর ওপরে রাখলে ডাক গুণ হয়। বাজেট ঠেকায় মোট ট্রাফিকের চেয়ে বেশি retry-কে।'

flashcards:
  - q: 'Retry storm কী?'
    a: 'অনেক client একসাথে ব্যর্থ ডাক বারবার পাঠিয়ে অসুস্থ সার্ভিসের ওপর চাপ বহুগুণ বাড়ানো, ফলে সে আর সেরে উঠতে পারে না।'
    more: |
      ৫০% ডাক ব্যর্থ হলে প্রতিটা ব্যর্থ ডাকে ৩ বার immediate retry করলে ট্রাফিক প্রায় ১.৯ গুণ হয়। সার্ভিসের ক্ষমতা ছাড়ালে আরও বেশি ব্যর্থ হয়, আরও retry হয়। সামান্য সমস্যা তখন ঘণ্টার বিপর্যয় হয়ে যায়।
    ref: retry-storm-story
  - q: 'Partial failure কী, কেন এটা পুরো বন্ধের চেয়ে কঠিন?'
    a: 'সার্ভিস পুরো বন্ধ নয়, কিছু ডাক ব্যর্থ বা ধীর। তাই ধরা কঠিন, আর retry করলে মাঝে মাঝে কাজও হয়, ফলে চাপ বাড়ে।'
    more: |
      পুরো বন্ধ সার্ভিস সাথে সাথে error দেয় এবং বোঝা সহজ। আংশিক ব্যর্থ সার্ভিস কখনো সাড়া দেয়, কখনো দেয় না। তাই কোড ভাবে "আরেকবার চেষ্টা করলেই হবে", আর সবাই মিলে সেটা করে।
    ref: retry-storm-story
  - q: 'Circuit breaker-এর তিন অবস্থা কী কী?'
    a: 'CLOSED: সব ডাক যায়। OPEN: কোনো ডাক যায় না, সাথে সাথে fallback। HALF-OPEN: পরীক্ষার জন্য অল্প ডাক ছাড়া হয়।'
    more: |
      closed থেকে open হয় পরপর কিছু ব্যর্থতার পর। কিছুক্ষণ (যেমন ৩০ সেকেন্ড) পরে half-open। পরীক্ষা সফল হলে closed, ব্যর্থ হলে আবার open। এটা ফিউজের মতোই: সুরক্ষা আগে, আর সেরেছে কি না দেখার সুযোগ পরে।
    ref: circuit-breaker-states
  - q: 'Breaker OPEN থাকলে ডাক কেন বন্ধ রাখা ভালো?'
    a: 'ব্যর্থ হবেই জেনে timeout-এর অপেক্ষায় worker আটকে না রেখে সাথে সাথে fallback দেওয়া যায়, আর অসুস্থ সার্ভিস সেরে ওঠার সময় পায়।'
    more: |
      দুটো লাভ একসাথে: আপনার worker মুক্ত থাকে (fail fast), আর অসুস্থ সার্ভিস চাপমুক্ত হয়। যে breaker ছাড়া প্রতিটা ডাক ২ সেকেন্ড timeout পর্যন্ত গড়ায়, সেখানে worker pool দ্রুত ফুরায়।
    ref: circuit-breaker-states
  - q: 'Exponential backoff আর jitter আলাদা আলাদা কী কাজ করে?'
    a: 'Backoff প্রতি retry-তে অপেক্ষা বাড়ায় (৫০০ms, ১০০০ms, ২০০০ms)। Jitter সেই অপেক্ষা এলোমেলো করে, যাতে সব client একসাথে না ফেরে।'
    more: |
      শুধু backoff হলে সব client একই মুহূর্তে ফেরে, ঢেউয়ের মতো বারবার আসে। jitter সেই ঢেউ সমতল করে। Symfony retry_failed-এ `multiplier` আর `jitter` দুটোই config-এ দেওয়া যায়।
    ref: backoff-jitter-retry
  - q: 'কোন ধরনের ত্রুটিতে retry করা উচিত, কোনটায় নয়?'
    a: 'অস্থায়ী ত্রুটিতে: timeout, 429, 502, 503, 504। 400, 404, 422 মানে ডাকই ভুল, retry করলে কখনো ঠিক হবে না।'
    more: |
      POST-এ retry করতে হলে Idempotency-Key দিন, নইলে একই কাজ দুইবার হতে পারে (যেমন দুইবার টাকা কাটা)। Symfony-তে `http_codes` দিয়ে কোড তালিকা বেঁধে দিন।
    ref: backoff-jitter-retry
  - q: 'Retry budget কী, আর কেন লাগে?'
    a: 'মোট ট্রাফিকের একটা ছোট অংশ (যেমন ১০%) যতটা retry হবে তার সীমা। এটা retry storm-এর পথ আটকায়।'
    more: |
      প্রতি স্তরে retry থাকলে ডাক গুণ হয়: ৪ × ৪ × ৪ = ৬৪। তাই retry থাকবে একটা স্তরে, আর বাজেটের টোকেন শেষ হলে retry বন্ধ। Symfony RateLimiter দিয়ে custom RetryStrategyInterface বানালেই বাজেট বসানো যায়।
    ref: retry-multiplication
  - q: 'Circuit breaker কোন ব্যর্থতা গুনবে?'
    a: 'নেটওয়ার্ক ত্রুটি আর 5xx: সার্ভিস অসুস্থ। 4xx নয়: ওটা মানে আমাদের ডাকই ভুল, গুনলে সুস্থ সার্ভিসও বন্ধ হয়ে যাবে।'
    more: |
      ধরুন ব্যবহারকারীরা বারবার জেলার নাম ভুল লিখছে আর কুরিয়ার প্রতিবার 404 দিচ্ছে। কুরিয়ার ঠিকই আছে, কিন্তু ওই 404 গুনলে পরপর ৫টা ভুলেই সবার জন্য সেটা বন্ধ। কোডে শুধু transport আর server exception ধরুন।
    ref: simple-breaker-symfony
  - q: 'Circuit breaker-এর দাম কী?'
    a: 'Open থাকলে সার্ভিস সেরে গেলেও ব্যবহারকারী fallback পায়। কম ট্রাফিকে threshold ছুঁতেই ঘণ্টা লেগে যেতে পারে।'
    more: |
      Breaker বিনা খরচের সুরক্ষা নয়। প্রতিটা open সময়ে আসল ব্যবহারকারী কম মানের উত্তর দেখে। তাই openSeconds ছোট রাখুন, আর breaker বসান শুধু সেসব ডাকে যা দূরের সার্ভিসে যায় এবং আটকাতে বা ব্যর্থ হতে পারে।
    ref: circuit-breaker-states

quiz:
  - q: 'রিনার অ্যাপ প্রতিটা ব্যর্থ gateway ডাক সাথে সাথে ৫ বার retry করে। আজ gateway-র ৬০% ডাক ব্যর্থ হচ্ছে, আর সেকেন্ডে ১২০টা ক্লিক আসছে। gateway-র ক্ষমতা ১৫০/সেকেন্ড। কী ঘটবে?'
    hint: 'প্রতিটা ব্যর্থতা আরেকটা ডাক বানায়। মোট ডাক কত দাঁড়ায়?'
    options:
      - text: 'মোট ডাক ক্ষমতা ছাড়িয়ে যাবে, gateway আরও বেশি ব্যর্থ করবে — retry storm'
        correct: true
        why: 'প্রতি ক্লিকে গড়ে ১ + ০.৬ + ০.৩৬ + ... ≈ ২.৪ ডাক, মোট প্রায় ২৮৫। এটা ক্ষমতার প্রায় দ্বিগুণ, তাই gateway আর সেরে উঠতে পারে না।'
      - text: 'retry থাকায় সব ক্লিক শেষে সফল হবে, কোনো সমস্যা নেই'
        correct: false
        why: 'retry কিছু ক্লিক বাঁচায়, কিন্তু বাড়তি ডাক gateway-কে আরও ডুবায়। তখন সফলতার হারই কমে যায়।'
      - text: 'শুধু ধীর হবে, কিন্তু ব্যর্থতা কমবে'
        correct: false
        why: 'ব্যর্থতার হার বরং বাড়ে, কারণ অতিরিক্ত চাপে gateway-র ব্যর্থতা বাড়ে।'
      - text: 'gateway-র ওপর কোনো প্রভাব নেই, কারণ retry শুধু অ্যাপের ব্যাপার'
        correct: false
        why: 'প্রতিটা retry gateway-তে আসল নতুন ডাক। প্রভাব সরাসরি gateway-র ওপরই পড়ে।'
    ref: retry-storm-story
  - q: 'Breaker-এর threshold ৫, openSeconds ৩০। কোন পরিস্থিতিতে ডাক সার্ভিসে পৌঁছাবে?'
    hint: 'যেসব অবস্থায় breaker কাটা নয় বা পরীক্ষার সময় এসেছে।'
    options:
      - text: 'পরপর ৩টা ব্যর্থতার পর (এখনো CLOSED)'
        correct: true
        why: 'threshold ৫, তাই ৩টা ব্যর্থতায় breaker কাটেনি। ডাক এখনো স্বাভাবিকভাবে যায়।'
      - text: '৫ম ব্যর্থতার ১০ সেকেন্ড পরে'
        correct: false
        why: 'এখন OPEN, ৩০ সেকেন্ড শেষ হয়নি। ডাক যায় না, সোজা fallback।'
      - text: '৫ম ব্যর্থতার ৩১ সেকেন্ড পরের প্রথম ডাক'
        correct: true
        why: 'এটা half-open পরীক্ষা। সফল হলে breaker closed, ব্যর্থ হলে আবার ৩০ সেকেন্ডের জন্য open।'
      - text: '৫ম ব্যর্থতার ঠিক পরেই, কারণ শেষ ডাকটাই মাপকাঠি'
        correct: false
        why: '৫ম ব্যর্থতাতেই breaker open হয়ে গেছে। এখন থেকে ৩০ সেকেন্ড কোনো ডাক যায় না।'
    ref: circuit-breaker-states
  - q: 'নিচের কোডে breaker-এ একটা সমস্যা আছে। কোনটা?'
    lang: php
    code: |
      try {
          $result = $action();
          $item->set(['fails' => 0, 'until' => 0]);
      } catch (\Throwable) {
          ++$fails;
          $item->set(['fails' => $fails, 'until' => time() + 30]);
          $result = $fallback();
      }
    hint: 'প্রতিটা ব্যর্থতায় কী বদলাচ্ছে? threshold কোথায়?'
    options:
      - text: 'প্রথম ব্যর্থতাতেই ৩০ সেকেন্ডের জন্য OPEN হয়ে যায়, threshold দেখা হচ্ছে না'
        correct: true
        why: 'until সবসময় time()+30 বসছে। একটা মাত্র ছোট ঝামেলাতেই সার্ভিস ৩০ সেকেন্ড বন্ধ — breaker অতিমাত্রায় স্পর্শকাতর।'
      - text: 'সফল হলে fails শূন্য করা ভুল'
        correct: false
        why: 'সফলতায় গণনা শূন্য করাই ঠিক, কারণ আমরা পরপর ব্যর্থতা গুনছি।'
      - text: 'fallback ব্যবহার করা ভুল, exception ছোড়া উচিত'
        correct: false
        why: 'ব্যর্থ হলে বিকল্প উত্তর দেওয়াই breaker-এর উদ্দেশ্যের অংশ।'
      - text: 'Cache-এ অবস্থা রাখা যায় না'
        correct: false
        why: 'cache-এ রাখাই সহজ ও কার্যকর উপায়, বিশেষ করে Redis হলে সব সার্ভার একই অবস্থা দেখে।'
    ref: simple-breaker-symfony
  - q: 'কোন কোন ক্ষেত্রে retry করা সংগত?'
    hint: 'যেখানে পরের চেষ্টায় ঠিক হওয়ার সম্ভাবনা আছে, আর পুনরাবৃত্তিতে ক্ষতি নেই।'
    options:
      - text: '503 পেলে GET /payments/{id} ডাক'
        correct: true
        why: '503 অস্থায়ী, আর GET নিরাপদ: যতবার পাঠান ফল একই।'
      - text: 'Idempotency-Key সহ POST /charges, timeout হলে'
        correct: true
        why: 'key থাকায় gateway দ্বিতীয় ডাক চিনে নেয়, টাকা একবারই কাটে।'
      - text: '422 Validation Error পেলে একই POST আবার পাঠানো'
        correct: false
        why: 'ইনপুটই ভুল, তাই একই ডাক সবসময় ব্যর্থ হবে। retry শুধু চাপ বাড়ায়।'
      - text: 'Key ছাড়া POST /charges, সংযোগ কেটে গেলে'
        correct: false
        why: 'ডাকটা gateway-তে পৌঁছে গিয়ে থাকলে দ্বিতীয় ডাকে টাকা দুইবার কাটতে পারে। key ছাড়া এটা বিপজ্জনক।'
    ref: backoff-jitter-retry
  - q: 'একটা ক্লিকে Vue ৪ বার, Symfony API ৪ বার, gateway client ৪ বার চেষ্টা করে (প্রতিটায় ৩ retry)। gateway-তে সর্বোচ্চ কয়টা ডাক যেতে পারে, আর সমাধান কী?'
    hint: 'স্তরগুলো যোগ হয় না, গুণ হয়।'
    options:
      - text: '৬৪টা; retry শুধু একটা স্তরে রাখুন এবং retry budget বসান'
        correct: true
        why: '৪ × ৪ × ৪ = ৬৪। সবচেয়ে নিচের স্তরে retry রেখে বাকিরা একবার চেষ্টা করলে ডাক ৪টায় নামে, বাজেট তাও সীমিত রাখে।'
      - text: '১২টা; সমাধান retry-র সংখ্যা বাড়ানো'
        correct: false
        why: 'স্তরগুলো গুণ হয়, যোগ নয়। আর retry বাড়ালে সমস্যাই বাড়ে।'
      - text: '৬৪টা; সমাধান প্রতিটা স্তরের retry দ্বিগুণ করা'
        correct: false
        why: 'সংখ্যা ঠিক, কিন্তু সমাধান উল্টো — retry বাড়ালে গুণফল আরও বিস্ফোরিত হয়।'
      - text: '৪টা; কোনো সমস্যা নেই'
        correct: false
        why: 'এটা শুধু এক স্তরের হিসাব। তিন স্তরে retry থাকলে গুণ হয়ে ৬৪ হয়।'
    ref: retry-multiplication
  - q: 'ব্যবহারকারীরা বারবার জেলার নাম ভুল লিখছে, তাই কুরিয়ার API বারবার 404 দিচ্ছে। এই 404 কি breaker-এর threshold-এ গোনা উচিত?'
    hint: 'কুরিয়ার কি অসুস্থ, নাকি আমাদের ডাকই ভুল ছিল?'
    options:
      - text: 'হ্যাঁ: 200 ছাড়া যেকোনো উত্তরই ব্যর্থতা'
