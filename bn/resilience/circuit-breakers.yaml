        why: 'এখানে 404 মানে কুরিয়ার ঠিকভাবেই একটা ভুল ডাক ফিরিয়ে দিচ্ছে। এটা গুনলে সুস্থ সার্ভিসেও breaker কেটে যাবে।'
      - text: 'না: শুধু নেটওয়ার্ক ত্রুটি আর 5xx দেখলে বোঝা যায় সার্ভিস অসুস্থ'
        correct: true
        why: '4xx মানে আমাদের ডাক ভুল। শুধু transport ত্রুটি আর 5xx গুনলে breaker সৎ থাকে।'
      - text: 'হ্যাঁ, তবে পরপর ৫টা হলে'
        correct: false
        why: 'ব্যস্ত দিনে পরপর ৫টা ভুল বানানও আসতে পারে। কুরিয়ারে কোনো দোষ না থাকলেও সবার জন্য সেটা বন্ধ হয়ে যাবে।'
      - text: 'না: কিছুই গোনা উচিত নয়, শুধু timeout-ই গুরুত্বপূর্ণ'
        correct: false
        why: 'সংযোগ ত্রুটি আর 5xx-ও অসুস্থ সার্ভিসের লক্ষণ। এগুলো উপেক্ষা করলে সার্ভিস ডাউন থাকলেও breaker closed থাকে।'
    ref: simple-breaker-symfony
