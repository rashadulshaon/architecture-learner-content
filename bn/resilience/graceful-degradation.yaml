        why: 'নইলে fallback কতক্ষণ ধরে চলছে কেউ জানবে না। alert সমস্যা মিনিটে ধরায়।'
      - text: 'চুপচাপ ০ ফেরত দেওয়া, যাতে অর্ডার আটকে না যায়'
        correct: false
        why: 'এতে প্রতিটা অর্ডারে বিনা ডেলিভারি চার্জ, আর কেউ টের পায় না। এটা চুপচাপ টাকা হারানো।'
      - text: 'যে ডেটাবেসে কুরিয়ারের হার রাখা, সেটাই fallback হিসেবে ডাকা, যা নিজেই এখন ধীর'
        correct: false
        why: 'ব্যর্থ নির্ভরতার ওপর দাঁড়ানো fallback ব্যর্থ হবে। fallback স্বাধীন হতে হবে।'
    ref: lying-fallback
