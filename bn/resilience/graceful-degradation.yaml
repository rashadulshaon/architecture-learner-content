slides:
  - slug: whole-page-dies
    title: 'সুপারিশ নষ্ট, তাই পুরো পণ্যের পেজ 500'
    kind: story
    tldr: 'একটা গৌণ অংশ ব্যর্থ হলে পুরো পেজ নষ্ট করা ভুল। মূল কাজ চালু রাখো, গৌণ অংশ বাদ দাও, ব্যবহারকারী প্রায় কিছুই টের পাবে না।'
    keywords: ['graceful degradation', 'fallback', 'core vs optional', 'recommendation', 'সুপারিশ', 'আংশিক সেবা']
    blocks:
      - type: metaphor
        icon: bolt
        title: 'লোডশেডিংয়ে বাসার IPS'
        body: |
          বিদ্যুৎ গেলে বাসার IPS পুরো বাড়ি চালায় না। সে আগে থেকে ঠিক করা জিনিসগুলো চালায়: কয়েকটা বাতি, ফ্যান, ফ্রিজ। এসি, ওয়াটার হিটার আর ওভেন বন্ধ থাকে। এভাবে খুঁড়িয়ে হলেও বাড়ি চলে। সফটওয়্যারে একে বলে **graceful degradation**: সব কিছু না পারলেও যা সবচেয়ে জরুরি, সেটা চালু রাখা।
      - type: visual
        kind: compare
        caption: 'সুপারিশ সার্ভিস নষ্ট: একই ভুল ঘটনা, দুই ধরনের উত্তর'
        columns:
          - title: 'আগে: সব বা কিছুই না'
            tone: bad
            icon: cross
            tip: 'কোড ধরে নেয় প্রতিটা অংশ সফল হবেই। একটা exception পুরো request-কে মেরে ফেলে।'
            items:
              - 'সুপারিশ সার্ভিস timeout করে'
              - 'exception controller পর্যন্ত যায়'
              - 'পুরো পেজ 500: দাম, ছবি, "কার্টে দিন" সব গায়েব'
              - 'বিক্রি বন্ধ, অথচ নষ্ট ছিল শুধু সাজসজ্জা'
          - title: 'পরে: মূল অংশ বেঁচে'
            tone: good
            icon: check
            tip: 'কোড জানে কোন অংশ জরুরি আর কোনটা নয়। গৌণ অংশ ব্যর্থ হলে সে চুপচাপ বাদ পড়ে।'
            items:
              - 'সুপারিশ সার্ভিস timeout করে'
              - 'কোড ধরে ফেলে, পুরোনো তালিকা বা ফাঁকা দেয়'
              - 'পেজ খোলে: দাম, ছবি, "কার্টে দিন" আছে'
              - 'ব্যবহারকারী কেনাকাটা চালিয়ে যায়'
      - type: quote
        body: 'গৌণ অংশ ব্যর্থ হলে শুধু সেই অংশ বাদ যাবে, পুরো পেজ নয়।'
    aside:
      - type: story
        title: 'যে সাইট শুধু "কার্টে দিন" চালু রেখেছিল'
        body: |
          একটা ই-কমার্স সাইটে রিভিউ ও সুপারিশের সার্ভিস ঘণ্টাখানেক বন্ধ ছিল। কোড আগেই এই অংশগুলো "ঐচ্ছিক" ধরে রেখেছিল, তাই পণ্যের পেজ রিভিউ ছাড়াই খুলত। ক্রেতারা কিনতে পারল। বিক্রির গ্রাফে সেদিন সামান্য কমই দেখা গেল।
      - type: terms
        items:
          - {term: 'Graceful degradation', meaning: 'কিছু অংশ ভাঙলেও সিস্টেম কম সুবিধা নিয়ে চালু থাকা, পুরো বসে যাওয়ার বদলে।'}
          - {term: 'Fallback', meaning: 'মূল উপায় ব্যর্থ হলে বিকল্প উত্তর: পুরোনো তথ্য, ডিফল্ট মান বা ফাঁকা।'}
    check:
      q: 'পণ্যের পেজের কোন অংশগুলো মূল (core), আর কোনগুলো গৌণ (optional) ধরবে? কেন?'
      a: 'মূল: দাম, ছবি, "কার্টে দিন" — এগুলো ছাড়া কেনা যায় না। গৌণ: সুপারিশ, রিভিউ, "কতজন দেখছে" — না থাকলেও কেনা যায়।'

  - slug: fallback-ladder
    title: 'বিকল্পের সিঁড়ি: একটা ব্যর্থ হলে পরেরটা'
    kind: concept
    tldr: 'প্রতিটা ডাকের জন্য আগে থেকে সিঁড়ি ঠিক করো: লাইভ ডেটা, না পেলে পুরোনো (stale) কপি, না পেলে ডিফল্ট, শেষে ফিচার বন্ধ। কিন্তু টাকা-সংক্রান্ত তথ্য বানিয়ে দিয়ো না।'
    keywords: ['fallback', 'stale data', 'cached data', 'default value', 'feature shut-off', 'kill switch']
    blocks:
      - type: text
        body: |
          IPS-এর মতো প্রতিটা নির্ভরতার জন্য আগে থেকে একটা সিঁড়ি ঠিক করো। প্রথম ধাপে লাইভ ডেটা। সেটা না পেলে **stale data**: শেষবার যে ভালো কপি পেয়েছিলে, সেটা। তাও না থাকলে নিরাপদ **ডিফল্ট**, যেমন ফাঁকা তালিকা। সবশেষে পুরো ফিচার বন্ধ করে ব্যবহারকারীকে জানানো। সিঁড়ি যত নিচে নামে, উত্তর তত কম নিখুঁত, কিন্তু সাইট তত ভেঙে পড়ে না।
      - type: visual
        kind: layers
        caption: 'বিকল্পের সিঁড়ি: ওপর থেকে নিচে নামো, সবচেয়ে ভালোটা আগে'
        layers:
          - {label: '১. লাইভ ডেটা', sub: 'নির্ভরতা সুস্থ', tone: good, tip: 'সবচেয়ে ভালো ও নতুন উত্তর। এখানে থাকাই লক্ষ্য।'}
          - {label: '২. Stale কপি', sub: 'শেষ ভালো উত্তর, কয়েক ঘণ্টার পুরোনো', tone: default, tip: 'cache-এ রাখা শেষ সফল উত্তর। সুপারিশ বা ক্যাটালগের জন্য এটা প্রায় ততটাই ভালো।'}
          - {label: '৩. ডিফল্ট মান', sub: 'ফাঁকা, জনপ্রিয় তালিকা, আগে থেকে ঠিক করা হার', tone: warn, tip: 'ব্যবসা আগে থেকে অনুমোদন করেছে এমন নিরাপদ উত্তর। যা-খুশি বানানো নয়।'}
          - {label: '৪. ফিচার বন্ধ', sub: 'অংশটা লুকাও বা "এখন নেই" লেখো', tone: bad, tip: 'kill switch। ফিচার যত বিপজ্জনক, এই ধাপ তত আগে আসে।'}
      - type: points
        title: 'কোথায় সিঁড়ি নামানো চলবে না'
        style: cross
        items:
          - 'ব্যালেন্স, স্টক বা দামের মতো টাকার তথ্য আন্দাজে বানানো'
          - 'পেমেন্ট সফল হয়েছে কি না না জেনে "সফল" বলা'
          - 'অনুমতি যাচাই ব্যর্থ হলে "ঠিক আছে, ঢোকো" বলা'
      - type: quote
        body: 'ব্যর্থতায় পুরোনো বা ফাঁকা উত্তর দেওয়া যায়, কিন্তু টাকা ও অনুমতির বেলায় ভুল উত্তর নয়।'
    aside:
      - type: remember
        body: 'লাইভ, stale, ডিফল্ট, বন্ধ — এই চার ধাপ প্রতিটা নির্ভরতার জন্য আগে থেকে লিখে রাখো।'
      - type: when
        use: ['সুপারিশ, রিভিউ, কাউন্টার, ছবির থাম্বনেইল', 'ক্যাটালগ বা কনফিগের মতো ধীরে বদলানো তথ্য']
        avoid: ['ব্যালেন্স, স্টক, দাম, পেমেন্টের অবস্থা', 'লগইন বা অনুমতি যাচাই']
      - type: refs
        items:
          - {to: 'config/feature-flags', label: 'Feature flag ও kill switch'}
          - {to: 'resilience/circuit-breakers', label: 'কখন সিঁড়ি নামবে তা breaker ঠিক করে'}
    check:
      q: 'ক্রেতার ব্যালেন্স দেখাতে ব্যালেন্স সার্ভিস ব্যর্থ। stale কপি দেখানো ঠিক হবে, নাকি ফিচার বন্ধ?'
      a: 'ফিচার বন্ধ বা স্পষ্ট "এখন দেখানো যাচ্ছে না"। টাকার তথ্য পুরোনো হলে ক্রেতা ভুল সিদ্ধান্ত নিতে পারে। stale কপি শুধু ধীরে বদলানো তথ্যের জন্য।'

  - slug: fallback-in-symfony
    title: 'Symfony-তে stale কপি ও kill switch'
    kind: howto
    tldr: 'সফল উত্তর cache-এ শেষ ভালো কপি হিসেবে রাখো। ব্যর্থ হলে সেটা দাও, নইলে ফাঁকা, আর উত্তরে degraded: true জানাও। মূল তথ্য ও গৌণ অংশ আলাদা রাখো।'
    keywords: ['stale-if-error', 'CacheItemPoolInterface', 'kill switch', 'degraded', 'Symfony Cache', 'fallback']
    blocks:
      - type: text
        body: |
          নিয়ম: যখনই সফল উত্তর আসে, তা এক দিনের জন্য cache-এ "শেষ ভালো কপি" হিসেবে রাখো। ব্যর্থ হলে সেই কপি দাও, না থাকলে ফাঁকা। আর উত্তরের সাথে `degraded` পতাকা পাঠাও, যাতে ফ্রন্টএন্ড জানে কী দেখাতে হবে।
      - type: code
        lang: php
        file: 'src/Recommendation/RecommendationProvider.php'
        variant: good
        code: |
          public function forProduct(int $id): array
          {
              $key = 'recs.last_good.'.$id;

              try {
                  $items = $this->api->recommend($id);   // নিজের timeout ও breaker সহ
                  $this->cache->save(
                      $this->cache->getItem($key)->set($items)->expiresAfter(86400),
                  );

                  return ['items' => $items, 'degraded' => false];
              } catch (ExceptionInterface $e) {
                  $this->logger->warning('Recommendations down', ['exception' => $e]);
                  $stale = $this->cache->getItem($key);

                  return [
                      'items' => $stale->isHit() ? $stale->get() : [],   // না থাকলে ফাঁকা
                      'degraded' => true,
                  ];
              }
          }
        marks:
          - {line: 5, tip: 'try-তে শুধু ভরসাহীন ডাকটা। সফল হলে কপি নতুন করে লেখা হয়।'}
          - {line: 8, tip: 'expiresAfter(86400): এক দিন। এর বেশি পুরোনো সুপারিশের কোনো মূল্য নেই, তাই cache নিজে মুছে ফেলবে।'}
          - {line: 13, tip: 'ব্যর্থতা log করা জরুরি: নইলে সুপারিশ মাসখানেক পুরোনো দেখাচ্ছে, কেউ জানবে না।'}
          - {line: 18, tip: 'degraded: true ব্যবহারকারীকে মিথ্যা বলে না। ফ্রন্টএন্ড ছোট একটা নোট দেখাতে পারে।'}
      - type: code
        lang: php
        file: 'src/Controller/ProductController.php'
        variant: good
        code: |
          #[Route('/api/products/{id}', methods: ['GET'])]
          public function show(Product $product, RecommendationProvider $recs): JsonResponse
          {
              // মূল অংশ: ব্যর্থ হলে পুরো request ব্যর্থ হবে, এটাই সঠিক
              $payload = ['product' => $this->normalizer->normalize($product)];

              // কিল সুইচ: অপারেশন টিম cache-এ এই key বসালে ফিচার সাথে সাথে বন্ধ
              $off = $this->cache->getItem('kill.recommendations')->isHit();

              $payload['recommendations'] = $off
                  ? ['items' => [], 'degraded' => true]
                  : $recs->forProduct($product->getId());

              return $this->json($payload);
          }
        marks:
          - {line: 4, tip: 'মূল তথ্য এখানে try/catch-এ নেই। দামই না পেলে 500 দেওয়াই ঠিক, ভুল দাম দেখানো নয়।'}
          - {line: 7, tip: 'kill switch এখানে একটা cache key। সার্ভিস ভয়ংকর ধীর হলে ডাকও না করে সাথে সাথে বন্ধ করা যায়। deploy লাগে না।'}
      - type: quote
        body: 'গৌণ অংশের ডাক সবসময় try/catch-এ, মূল অংশের ডাক নয়।'
    aside:
      - type: tips
        items:
          - 'kill switch বসাতে পারে এমন একটা command বা অ্যাডমিন বাটন রাখো, আগে থেকে। সংকটে নতুন কোড লেখার সময় থাকে না।'
          - 'stale কপির জন্য আলাদা cache key রাখো। যে key-তে TTL ছোট, সেটা মেয়াদ শেষে মুছে গেলে শেষ ভালো কপিও হারাবে।'
      - type: pitfalls
        items:
          - 'catch (\Throwable) দিয়ে সব ধরে ফেললে নিজের কোডের বাগও চুপচাপ চাপা পড়ে। নির্দিষ্ট ExceptionInterface ধরো।'
      - type: refs
        items:
          - {to: 'caching/cache-strategies', label: 'Cache strategy'}
    check:
      q: 'Controller-এ product-এর ডাক try/catch-এ নেই, কিন্তু recommendations-এর ডাক আছে। কেন এই অসমতা?'
      a: 'পণ্যের তথ্য মূল: না পেলে কেনা সম্ভব নয়, তাই স্পষ্ট ব্যর্থতাই সৎ। সুপারিশ গৌণ: না থাকলেও পেজ কাজ করে, তাই বাদ দেওয়া যায়।'

  - slug: degraded-ui-vue
    title: 'Vue-তে degraded UI: ব্যবহারকারীকে সৎভাবে জানাও'
    kind: howto
    tldr: 'মূল ও গৌণ ডাক আলাদা করে করো (Promise.allSettled)। গৌণটা ব্যর্থ হলে পেজ চলে, আর ছোট সৎ বার্তা বা বিকল্প লিংক দেখাও। মূলটা ব্যর্থ হলে retry বাটনসহ error।'
    keywords: ['Vue 3', 'Promise.allSettled', 'degraded UI', 'composable', 'error state', 'ফ্রন্টএন্ড']
    blocks:
      - type: text
        body: |
          ফ্রন্টএন্ডে সবচেয়ে সাধারণ ভুল হলো দুইটা ডাক `await Promise.all` দিয়ে একসাথে করা: একটা ব্যর্থ হলে দুইটাই ব্যর্থ। `Promise.allSettled` প্রতিটার ফল আলাদা জানায়, ফলে তুমি ঠিক করতে পারো কোনটা পেজ নষ্ট করবে আর কোনটা শুধু একটা অংশ।
      - type: code
        lang: ts
        file: 'src/composables/useProductPage.ts'
        variant: good
        code: |
          export function useProductPage(id: number) {
            const product = ref<Product | null>(null)
            const recs = ref<Recs>({ items: [], degraded: false })
            const failed = ref(false)

            async function load() {
              const [p, r] = await Promise.allSettled([
                api.product(id),
                api.recommendations(id),
              ])

              if (p.status === 'rejected') {
                failed.value = true          // মূল অংশ গেছে: সত্যিকারের error
                return
              }
              product.value = p.value
              recs.value = r.status === 'fulfilled' ? r.value : { items: [], degraded: true }
            }

            return { product, recs, failed, load }
          }
        marks:
          - {line: 7, tip: 'allSettled কখনো reject করে না। প্রতিটা ফল { status, value | reason } হিসেবে আসে।'}
          - {line: 13, tip: 'শুধু মূল ডাক ব্যর্থ হলে পুরো পেজ error। এটা আগে থেকে ঠিক করা সিদ্ধান্ত।'}
          - {line: 17, tip: 'সুপারিশ ব্যর্থ হলে ফাঁকা তালিকা আর degraded: true। পেজ চলতে থাকে।'}
