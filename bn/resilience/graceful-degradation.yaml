  - slug: lying-fallback
    title: 'ফাঁদ: যে fallback চুপচাপ মিথ্যা বলে'
    kind: pitfall
    tldr: 'টাকা-সংক্রান্ত ডাকে `catch → return 0` সবচেয়ে ভয়ংকর fallback। বিকল্প হবে আগে থেকে অনুমোদিত মান, লগসহ, আর নিজেই ব্যর্থ নির্ভরতার ওপর দাঁড়ানো নয়।'
    keywords: ['silent failure', 'swallow exception', 'fallback pitfall', 'shipping charge', 'catch Throwable', 'চুপচাপ ব্যর্থতা']
    blocks:
      - type: text
        body: |
          সব ব্যর্থতা ঢেকে ফেলাই degradation নয়। ডেলিভারি চার্জ আনতে কুরিয়ার ব্যর্থ হলে নিচের কোড চুপচাপ ০ ফেরত দেয়। পুরো দিন সব অর্ডার বিনা ডেলিভারি চার্জে হলো, আর কেউ টের পেল না। ঠিক fallback কেউ আগে থেকে ঠিক করে, লগ রাখে, এবং ব্যবহারকারীকে সৎ থাকে।
      - type: code
        lang: php
        file: 'src/Shipping/ShippingCalculator.php'
        variant: bad
        code: |
          public function chargeFor(Order $order): int
          {
              try {
                  return $this->courier->chargeFor($order->district(), $order->weight());
              } catch (\Throwable) {
                  return 0;   // চুপচাপ ফ্রি ডেলিভারি!
              }
          }
        marks:
          - {line: 5, tip: '\Throwable সব ধরে, নিজের কোডের বাগও। কিছু log হয় না, কোনো metric বাড়ে না।'}
          - {line: 6, tip: '০ এখানে "জানি না"-এর জায়গায় বসা মিথ্যা। টাকা সরাসরি কোম্পানির পকেট থেকে যাচ্ছে।'}
      - type: code
        lang: php
        file: 'src/Shipping/ShippingCalculator.php'
        variant: good
        code: |
          public function chargeFor(Order $order): int
          {
              try {
                  return $this->courier->chargeFor($order->district(), $order->weight());
              } catch (ExceptionInterface $e) {
                  $this->logger->warning('Courier down, using zone rate', [
                      'order' => $order->id(),
                      'exception' => $e,
                  ]);

                  // ব্যবসা আগে থেকে অনুমোদন করা, জেলাভিত্তিক সর্বোচ্চ হার
                  return $this->zoneRates->maxFor($order->district());
              }
          }
        marks:
          - {line: 5, tip: 'শুধু HttpClient-এর ত্রুটি ধরা হচ্ছে। TypeError জাতীয় বাগ আগের মতোই উপরে উঠে লগে আসবে।'}
          - {line: 6, tip: 'log থাকলে বলা যায় কতবার fallback চলল। একটা alert বসালে সমস্যা ঘণ্টায় নয়, মিনিটে ধরা পড়ে।'}
          - {line: 12, tip: 'আগে থেকে ঠিক করা সংখ্যা: কেউ ভেবে দেখেছে, অনুমোদন করেছে। ক্রেতাকে "আনুমানিক চার্জ" বলে দেখানো যায়।'}
      - type: points
        title: 'ভালো fallback-এর তিন শর্ত'
        style: check
        items:
          - 'আগে থেকে ঠিক করা: ব্যবসা জানে ও মেনেছে, কোড আন্দাজে বানায়নি'
          - 'দেখা যায়: log, metric ও alert আছে, চুপচাপ নয়'
          - 'স্বাধীন: যে নির্ভরতা ব্যর্থ হয়েছে, fallback তার ওপর দাঁড়ায় না'
    aside:
      - type: pitfalls
        items:
          - 'Fallback কখনো পরীক্ষা না করলে সংকটের দিনই প্রথম চলবে, আর তখন সে-ই ভাঙবে। নির্দিষ্ট ব্যবধানে ইচ্ছা করে নির্ভরতা বন্ধ করে দেখো।'
          - 'Fallback যদি একই ডেটাবেস বা একই cache-এ যায়, যা ব্যর্থ হয়েছে, সেটা fallback নয়, একই ফাঁদ।'
      - type: refs
        items:
          - {to: 'resilience/disaster-recovery', label: 'ব্যর্থতা ইচ্ছা করে পরীক্ষা (game day)'}
    check:
      q: 'কুরিয়ারের fallback হিসেবে `return 0`-এর বদলে জেলাভিত্তিক সর্বোচ্চ হার কেন ভালো?'
      a: 'এই হার ব্যবসা আগে থেকে অনুমোদন করেছে, তাই কোম্পানি ক্ষতিতে পড়ে না। ০ আসলে "জানি না"-কে "ফ্রি" বলে চালানো, যা চুপচাপ টাকা হারায়।'

flashcards:
  - q: 'Graceful degradation কী?'
    a: 'কোনো অংশ ভাঙলে পুরো সিস্টেম বন্ধ না করে কম সুবিধা নিয়ে চালু রাখা, যাতে সবচেয়ে জরুরি কাজটা চলতে থাকে।'
    more: |
      বাসার IPS যেমন বিদ্যুৎ গেলে ফ্যান ও বাতি চালায়, এসি বন্ধ রাখে, তেমনি। প্রথমে ঠিক করো কোন অংশ মূল (দাম, কার্ট, পেমেন্ট) আর কোনটা গৌণ (সুপারিশ, রিভিউ)। গৌণ অংশ ব্যর্থ হলে শুধু সেটাই বাদ যায়।
    ref: whole-page-dies
  - q: 'মূল (core) আর গৌণ (optional) অংশ আলাদা করার নিয়ম কী?'
    a: 'যার অভাবে কাজটাই সম্ভব নয় সে মূল (দাম, কার্টে দিন)। যার অভাবে কাজ চলে, সে গৌণ (সুপারিশ, রিভিউ)।'
    more: |
      গৌণ অংশের ডাক সবসময় try/catch-এ, আর মূল অংশের ডাক নয়: মূল অংশ না পেলে স্পষ্ট ব্যর্থতাই সৎ। এই ভাগ কোড লেখার সময় ঠিক করো, সংকটের মধ্যে নয়।
    ref: whole-page-dies
  - q: 'Fallback-এর সিঁড়ির চার ধাপ কী কী?'
    a: 'লাইভ ডেটা, stale কপি, ডিফল্ট মান, শেষে ফিচার বন্ধ (kill switch)। ওপরেরটা না পেলে নিচেরটা।'
    more: |
      stale কপি হলো শেষবার পাওয়া ভালো উত্তর, যা cache-এ রাখা আছে। ডিফল্ট মান ব্যবসা আগে থেকে অনুমোদন করা নিরাপদ উত্তর, যেমন ফাঁকা তালিকা। ফিচার বন্ধ করলে ব্যবহারকারীকে জানাতে হয় এবং সামনে যাওয়ার পথ দিতে হয়।
    ref: fallback-ladder
  - q: 'কোন ধরনের তথ্যে stale বা বানানো fallback দেওয়া চলে না?'
    a: 'ব্যালেন্স, স্টক, দাম, পেমেন্টের অবস্থা ও অনুমতি যাচাইয়ে। ভুল উত্তর এখানে টাকা বা নিরাপত্তার ক্ষতি করে।'
    more: |
      সুপারিশ, রিভিউ বা ক্যাটালগ পুরোনো হলে ক্ষতি নেই। কিন্তু পুরোনো ব্যালেন্স দেখে কেউ ভুল খরচ করতে পারে, আর "অনুমতি যাচাই ব্যর্থ, ঢোকো" বললে নিরাপত্তা ভাঙে। এসব ক্ষেত্রে স্পষ্ট "এখন সম্ভব নয়" বলাই ঠিক।
    ref: fallback-ladder
  - q: 'Symfony Cache দিয়ে "শেষ ভালো কপি" কীভাবে রাখো?'
    a: 'প্রতিটা সফল উত্তর আলাদা key-তে ২৪ ঘণ্টার TTL-এ save করো। ব্যর্থ হলে ওই key পড়ো, না থাকলে ফাঁকা দাও।'
    more: |
      ছোট TTL-এর fresh cache মুছে গেলেও যেন শেষ ভালো কপি না হারায়, তাই তার আলাদা key। উত্তরের সাথে `degraded: true` পাঠালে ফ্রন্টএন্ড জানে সৎ নোট দেখাতে হবে। ব্যর্থতা log করো, নইলে পুরোনো তথ্য মাসের পর মাস চলতে পারে।
    ref: fallback-in-symfony
  - q: 'Kill switch কী, আর কেন deploy ছাড়া বদলানো যায় এমন হওয়া উচিত?'
    a: 'চালু থাকা কোনো ফিচারকে সাথে সাথে বন্ধ করার সুইচ। সংকটে নতুন কোড লেখা বা deploy করার সময় থাকে না।'
    more: |
      সাধারণত এটা cache, ডেটাবেস বা feature flag সিস্টেমের একটা মান। সার্ভিস ভয়ংকর ধীর হলে ডাকই না করে ফিচার বন্ধ করা যায়। কে এটা বদলাতে পারবে এবং কীভাবে, তা আগে থেকে ঠিক রাখো।
    ref: fallback-in-symfony
  - q: 'Vue-তে Promise.all-এর বদলে Promise.allSettled কখন ব্যবহার করবে?'
    a: 'যখন কয়েকটা ডাক স্বাধীন, আর একটা ব্যর্থ হলে বাকিগুলোর ফল তবু দরকার। allSettled প্রতিটার ফল আলাদা দেয়।'
    more: |
      Promise.all প্রথম ব্যর্থতাতেই সব ফেলে দেয়। allSettled-এ তুমি দেখো কোনটা fulfilled, কোনটা rejected। শুধু মূল ডাক rejected হলে পুরো পেজ error দেখাও, গৌণটা rejected হলে ওই অংশ বাদ দাও এবং ছোট বার্তা দেখাও।
    ref: degraded-ui-vue

quiz:
  - q: 'নাহিদের সাইটে পণ্যের পেজ একসাথে দাম (ডেটাবেস) আর রিভিউ (বাইরের সার্ভিস) আনে। রিভিউ সার্ভিস ব্যর্থ। কোন আচরণটা সঠিক?'
    hint: 'কোনটা ছাড়া কেনা যায় না, আর কোনটা ছাড়া যায়?'
    options:
      - text: 'রিভিউ অংশ বাদ বা "এখন নেই" দেখিয়ে পেজ খোলা, দাম ঠিকঠাক'
        correct: true
        why: 'রিভিউ গৌণ, দাম মূল। গৌণ অংশ বাদ গেলে ক্রেতা তবু কিনতে পারে।'
      - text: 'পুরো পেজে 500 দেওয়া, কারণ ডেটা অসম্পূর্ণ'
        correct: false
        why: 'এতে বিক্রি বন্ধ হয়, অথচ সমস্যা ছিল শুধু একটা সাজসজ্জায়।'
      - text: 'রিভিউ আসা পর্যন্ত পেজ আটকে রাখা'
        correct: false
        why: 'অপেক্ষায় worker আটকে থাকে, আর timeout ছাড়া পুরো সাইট ধীর হতে পারে।'
      - text: 'দামও বাদ দেওয়া, সব ঠিক না হলে কিছুই না দেখানো'
        correct: false
        why: 'এটা degradation-এর উল্টো: মূল অংশও হারানো।'
    ref: whole-page-dies
  - q: 'নিচের কোন কোন ক্ষেত্রে stale বা ডিফল্ট fallback দেওয়া নিরাপদ?'
    hint: 'পুরোনো বা ফাঁকা উত্তরে কার ক্ষতি হয়?'
    options:
      - text: 'পণ্যের "আপনার জন্য সুপারিশ" তালিকা'
        correct: true
        why: 'কয়েক ঘণ্টার পুরোনো সুপারিশে কোনো ক্ষতি নেই, বরং পেজ সম্পূর্ণ দেখায়।'
      - text: 'ক্যাটালগের পণ্যের বিবরণ, যা মাসে একবার বদলায়'
        correct: true
        why: 'ধীরে বদলানো তথ্য, তাই cache-এর পুরোনো কপি প্রায় সবসময় ঠিক।'
      - text: 'ক্রেতার ওয়ালেট ব্যালেন্স'
        correct: false
        why: 'ভুল ব্যালেন্স দেখে ক্রেতা ভুল সিদ্ধান্ত নিতে পারে। এখানে "এখন দেখানো যাচ্ছে না" বলাই ঠিক।'
      - text: 'পেমেন্ট সফল হয়েছে কি না'
        correct: false
        why: 'অজানা অবস্থাকে "সফল" বা "ব্যর্থ" বললে টাকা হারানো বা দ্বিগুণ কাটা ঘটতে পারে।'
    ref: fallback-ladder
  - q: 'নিচের কোডটা সুপারিশের জন্য কী ভুল করছে?'
    lang: php
    code: |
      try {
          $items = $this->api->recommend($id);
      } catch (\Throwable) {
          $items = [];
      }
      return ['items' => $items];
    hint: 'ব্যর্থ হলে কে জানবে? আর কোন ধরনের ত্রুটি ধরা হচ্ছে?'
    options:
      - text: 'কিছু log হয় না, degraded জানানো হয় না, আর \Throwable নিজের বাগও চাপা দেয়'
        correct: true
        why: 'সুপারিশ মাসখানেক ফাঁকা থাকলেও কেউ জানবে না। log, degraded পতাকা আর নির্দিষ্ট ExceptionInterface ধরা দরকার।'
      - text: 'ফাঁকা তালিকা দেওয়া কখনোই ঠিক নয়'
        correct: false
        why: 'সুপারিশের মতো গৌণ অংশে ফাঁকা বা stale দেওয়া একদম ঠিক। সমস্যা নীরবতায়।'
      - text: 'ডাকটা try/catch-এ রাখা ভুল, exception উপরে যেতে দেওয়া উচিত'
        correct: false
        why: 'গৌণ অংশের ব্যর্থতায় পুরো পেজ নষ্ট করা ঠিক নয়।'
      - text: 'কিছুই ভুল নেই'
        correct: false
        why: 'দেখা না যাওয়াই সবচেয়ে বড় ঝুঁকি: ব্যর্থতা মাসের পর মাস অলক্ষ্যে চলতে পারে।'
    ref: fallback-in-symfony
  - q: 'Vue পেজ দুইটা API ডাকে: পণ্য (মূল) আর সুপারিশ (গৌণ)। এখন `await Promise.all([...])` ব্যবহার করা। সুপারিশ API ব্যর্থ হলে কী হয়, আর ঠিক করার উপায় কী?'
    hint: 'Promise.all প্রথম ব্যর্থতায় কী করে?'
    options:
      - text: 'পুরো promise reject করে, পণ্যের তথ্যও পাওয়া যায় না; allSettled দিয়ে আলাদা সামলাও'
        correct: true
        why: 'Promise.all যেকোনো একটা ব্যর্থ হলেই reject হয়। allSettled দুটোর ফল আলাদা দেয়, তাই শুধু মূলটা ব্যর্থ হলেই error।'
      - text: 'শুধু সুপারিশ ফাঁকা হয়, পণ্য ঠিক থাকে'
        correct: false
        why: 'Promise.all-এ তা হয় না: ব্যর্থতায় পুরো ফল বাতিল।'
      - text: 'পণ্য আর সুপারিশ দুটোই retry হয়'
        correct: false
        why: 'Promise.all নিজে retry করে না।'
      - text: 'কিছুই হয় না, ব্রাউজার নিজে সামলায়'
        correct: false
        why: 'ব্রাউজার জানে না কোনটা মূল আর কোনটা গৌণ। সে সিদ্ধান্ত তোমার কোডের।'
    ref: degraded-ui-vue
  - q: 'কুরিয়ার ব্যর্থ হলে ডেলিভারি চার্জ কী হবে? কোন কোন সিদ্ধান্ত ঠিক?'
    hint: 'ভুলের দাম কে দেয়, আর কে জানতে পারে?'
    options:
      - text: 'আগে থেকে অনুমোদিত জেলাভিত্তিক সর্বোচ্চ হার ব্যবহার করা'
        correct: true
        why: 'ব্যবসা জানে ও মেনেছে, তাই কোম্পানি ক্ষতিতে পড়ে না এবং ক্রেতাকে "আনুমানিক" বলা যায়।'
      - text: 'fallback চললে log ও alert রাখা'
