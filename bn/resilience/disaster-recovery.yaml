flashcards:
  - q: 'RPO (Recovery Point Objective) কী?'
    a: 'Recovery Point Objective: বিপর্যয়ে সর্বোচ্চ কত সময়ের ডেটা হারানো ব্যবসা মেনে নেবে।'
    more: |
      শেষ ব্যাকআপ বা replication-এর পর যে সময়ের ডেটা ছিল, বিপর্যয়ে সেটাই যায়। ব্যাকআপ রাতে একবার হলে RPO ২৪ ঘণ্টা। পেমেন্টের জন্য চাই প্রায় শূন্য, যার জন্য ধারাবাহিক replication লাগে।
    ref: rpo-rto
  - q: 'RTO (Recovery Time Objective) কী?'
    a: 'Recovery Time Objective: বিপর্যয়ের পর সিস্টেম আবার চালু হতে সর্বোচ্চ কত সময় ব্যবসা সহ্য করবে।'
    more: |
      সময় গোনা হয় বিপর্যয় থেকে ব্যবহারকারী আবার কাজ করতে পারা পর্যন্ত। restore, অ্যাপ চালু, DNS সরানো সবই এর অংশ। RTO ১৫ মিনিট চাইলে প্রস্তুত region ও স্বয়ংক্রিয় failover লাগে, যা খরচ বাড়ায়।
    ref: rpo-rto
  - q: 'RPO আর RTO কে ঠিক করে, আর কেন?'
    a: 'ব্যবসা ঠিক করে, কারণ কত ডেটা বা সময়ের মূল্য কত, সেটা ব্যবসার জানা। প্রকৌশলী শুধু খরচ জানায়।'
    more: |
      কম RPO ও RTO মানে বেশি খরচ: বাড়তি region, ধারাবাহিক replication, স্বয়ংক্রিয় failover। তাই সব কাজে এক মান না দিয়ে গুরুত্ব অনুযায়ী ভাগ করুন: পেমেন্ট কঠোর, রিপোর্ট ঢিলে।
    ref: rpo-rto
  - q: 'Active-passive আর active-active-এর পার্থক্য কী?'
    a: 'Active-passive: এক region কাজ করে, অন্যটা প্রস্তুত। Active-active: দুই region-ই কাজ করে, ফলে দুই জায়গায় লেখার conflict সামলাতে হয়।'
    more: |
      Active-passive সহজ ও সস্তা, কিন্তু failover-এ মিনিট বা ঘণ্টা লাগে। Active-active প্রায় শূন্য RTO দেয়, কিন্তু ডেটা conflict, জটিলতা ও খরচ অনেক বেশি। বেশিরভাগ ব্যবসার জন্য active-passive-ই যথেষ্ট।
    ref: multi-region-patterns
  - q: 'Pilot light DR উপায়টা কী?'
    a: 'দ্বিতীয় region-এ শুধু ডেটাবেস replica চলে, অ্যাপ বন্ধ থাকে। বিপর্যয়ে সেখানে অ্যাপ চালু করা হয়। Warm standby-র চেয়ে সস্তা, ফিরতে বেশি সময়।'
    more: |
      গ্যাস চুলার ছোট শিখার মতো: ডেটা সবসময় হালনাগাদ, বাকি সব দরকারে জ্বালানো হয়। RPO হলো replication lag, আর RTO হলো replica-কে primary করা ও অ্যাপ চালু করার সময়, প্রায়ই ৩০ মিনিট থেকে ২ ঘণ্টা। প্রতিটা release Region B-তেও deploy করুন, নইলে বন্ধ থাকা অংশটা পুরোনো হয়ে পচে।
    ref: cheaper-dr-options
  - q: 'DR-এর উপায় হিসেবে backup-and-restore কী, আর এর খুঁত কোথায়?'
    a: 'ডেটার কপি অন্য region-এ থাকে, বিপর্যয়ের পরে সব নতুন করে তৈরি হয়। সবচেয়ে সস্তা, কিন্তু RPO ও RTO কয়েক ঘণ্টা: বড় ডেটাবেস restore করতেই ঘণ্টা লাগে।'
    more: |
      ২০০ GB ডেটাবেস ঘণ্টায় ৫০ GB হারে restore হলে অ্যাপ চালু হওয়ার আগেই ৪ ঘণ্টা যায়। রিপোর্ট বা অভ্যন্তরীণ টুল, যা একদিন বন্ধ থাকলেও চলে, তার জন্য ঠিক আছে। এক-দুই ঘণ্টায় সাইট ফেরানো দরকার হলে ঠিক নয়।
    ref: cheaper-dr-options
  - q: 'Active-passive-এ আসল RPO কীভাবে মাপবেন?'
    a: 'Replication lag দিয়ে: replica প্রধান থেকে কত সময় পিছিয়ে আছে। বিপর্যয়ে ওইটুকু ডেটাই হারায়।'
    more: |
      PostgreSQL-এ `SELECT now() - pg_last_xact_replay_timestamp()` replica-তে চালিয়ে lag দেখা যায়। এটা নিয়মিত মাপুন ও alert বসান। lag RPO-র লক্ষ্যের বেশি হলে সেই মুহূর্তেই আপনি লক্ষ্যের বাইরে।
    ref: game-day-drill
  - q: 'Game day কী?'
    a: 'ঠিক করা দিনে সবাই জেনে ইচ্ছা করে ব্যর্থতা ঘটিয়ে recovery-র পুরো পথ চালিয়ে বাস্তব RPO ও RTO মাপা।'
    more: |
      প্রথমে staging-এ, পরে নিয়ন্ত্রিতভাবে production-এ। লক্ষ্য আগে লিখে রাখুন, runbook অনুসরণ করুন, সময় মাপুন, ঘাটতির তালিকা করুন এবং পরের মহড়ার আগে ঘাটতি সারান। প্রথম মহড়ায় কিছু না কিছু ভাঙবেই, এটাই লাভ।
    ref: game-day-drill
  - q: 'কাগজের DR plan প্রায়ই ব্যর্থ হয় কেন?'
    a: 'অনুমানগুলো যাচাই হয়নি: ব্যাকআপ একই জায়গায়, restore পরীক্ষা হয়নি, secret অন্য region-এ নেই, DNS TTL বিশাল, runbook পুরোনো।'
    more: |
      বিপর্যয়ের দিন এই ছোট ছোট ফাঁকই RTO কয়েক ঘণ্টা বাড়ায়। সবগুলোই game day-তে ধরা পড়ে। তাই ব্যাকআপ আলাদা region ও account-এ, secret দুই জায়গায়, TTL ছোট এবং runbook নিয়মিত হালনাগাদ রাখুন।
    ref: paper-dr-plan

quiz:
  - q: 'শিউলির অ্যাপের ব্যাকআপ রোজ রাত ২টায় হয়। সোমবার দুপুর ১টায় ডেটাবেস নষ্ট হলে আনুমানিক কতটা ডেটা হারাবে, আর এটা কোন সংখ্যা?'
    hint: 'শেষ ব্যাকআপ ও বিপর্যয়ের মাঝের সময় কত?'
    options:
      - text: 'প্রায় ১১ ঘণ্টার ডেটা: এটাই সেই বিপর্যয়ের প্রকৃত ডেটা হারানো, যা RPO-র সাথে তুলনা করতে হবে'
        correct: true
        why: 'রাত ২টা থেকে দুপুর ১টা ১১ ঘণ্টা। RPO-র লক্ষ্য যদি এর চেয়ে কম হয় তবে এই ব্যবস্থা অপর্যাপ্ত।'
      - text: 'কিছুই না, কারণ ব্যাকআপ আছে'
        correct: false
        why: 'ব্যাকআপ শুধু ওই মুহূর্তের অবস্থা ধরে রাখে। তার পরের সব লেখা হারায়।'
      - text: 'শুধু ১ মিনিটের, কারণ সবকিছু দ্রুত restore হয়'
        correct: false
        why: 'restore-এর গতি RTO-র ব্যাপার। হারানো ডেটা নির্ভর করে ব্যাকআপ কতটা পুরোনো তার ওপর।'
      - text: 'সারা দিনের পুরো ডেটাবেস'
        correct: false
        why: 'ব্যাকআপ রাত ২টা পর্যন্ত সব ধরে রেখেছে। শুধু তার পরের ১১ ঘণ্টা হারায়।'
    ref: rpo-rto
  - q: 'নিচের কোনগুলো RTO কমাতে সাহায্য করে?'
    hint: 'RTO মানে আবার চালু হতে কত সময়।'
    options:
      - text: 'অন্য region-এ আগে থেকে প্রস্তুত অ্যাপ ও replica রাখা'
        correct: true
        why: 'বিপর্যয়ের পর তখন শুধু ট্রাফিক সরাতে হয়, নতুন করে সবকিছু বানাতে হয় না।'
      - text: 'লিখিত ও পরীক্ষিত runbook'
        correct: true
        why: 'মানুষ আন্দাজ বা খোঁজাখুঁজি করে না, সময় বাঁচে।'
      - text: 'ব্যাকআপ আরও ঘন ঘন নেওয়া (প্রতি ঘণ্টায়)'
        correct: false
        why: 'এটা RPO কমায় (কম ডেটা হারায়)। উদ্ধারের গতি এতে বাড়ে না।'
      - text: 'DNS TTL ২৪ ঘণ্টা রাখা'
        correct: false
        why: 'বড় TTL মানে ট্রাফিক নতুন region-এ যেতে ২৪ ঘণ্টা পর্যন্ত লাগতে পারে, RTO বিশাল হয়।'
    ref: rpo-rto
  - q: 'একটা ছোট ই-কমার্স স্টার্টআপ, ব্যবহারকারী শুধু বাংলাদেশে, দলে ৫ জন। RTO ১ ঘণ্টা চলবে। কোন multi-region প্যাটার্ন বেছে নেবেন?'
    hint: 'খরচ, জটিলতা আর আসল প্রয়োজন মেলান।'
    options:
      - text: 'Active-passive: অন্য region-এ replica ও প্রস্তুত অ্যাপ'
        correct: true
        why: 'RTO ১ ঘণ্টা active-passive-এই মেটে। conflict নেই, জটিলতা ও খরচ কম।'
      - text: 'Active-active, কারণ এটাই সবচেয়ে নিরাপদ'
        correct: false
        why: 'সবচেয়ে জটিল ও দামি। ৫ জনের দলের জন্য conflict সামলানো অকারণ বোঝা।'
