  - q: 'নিচের runbook-এর ধাপে একটা সমস্যা আছে। কোনটা?'
    lang: bash
    code: |
      psql -h replica.region-b -c "SELECT pg_promote();"
      # replica এখন primary, অ্যাপকে নতুন host-এ পাঠান
      # পুরোনো primary-কে আবার চালু করে দিন, সে সুস্থ হলে ভালো
    hint: 'দুইটা primary একসাথে লিখতে পারলে কী হয়?'
    options:
      - text: 'পুরোনো primary ফিরে এলে দুই primary তৈরি হয় (split-brain), তাকে আগে বিচ্ছিন্ন করা উচিত'
        correct: true
        why: 'দুই জায়গায় আলাদা লেখা হলে ডেটা মেলানো যায় না। পুরোনো primary বন্ধ বা আলাদা রেখে পরে replica হিসেবে ফেরাতে হয়।'
      - text: 'pg_promote() কখনো ব্যবহার করা উচিত নয়'
        correct: false
        why: 'replica-কে primary করার সঠিক উপায় এটাই।'
