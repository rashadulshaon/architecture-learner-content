slides:
  - slug: whole-region-down
    title: 'পুরো region বন্ধ, আর ব্যাকআপও সেখানেই'
    kind: story
    tldr: 'অ্যাপ, ডেটাবেস আর ব্যাকআপ একই region-এ থাকলে একটা বিপর্যয়ে সবই যায়। বিপর্যয়ের পরিকল্পনা মানে অন্য জায়গায় ফেরার পথ আগে থেকে তৈরি রাখা।'
    keywords: ['disaster recovery', 'region outage', 'single region', 'backup location', 'বিপর্যয়', 'DR']
    blocks:
      - type: metaphor
        icon: shop
        title: 'মুদি দোকানের বাকির খাতা'
        body: |
          দোকানদার রোজ রাতে বাকির খাতাটা দোকানেরই ড্রয়ারে ফটোকপি করে রাখে। একদিন দোকানে আগুন লাগল। আসল খাতা পুড়ল, ফটোকপিও পুড়ল, কারণ দুটোই এক জায়গায়। আর দোকানদার জানেই না কাল কোথায় বসে ব্যবসা চালাবে। কোডে ডেটাবেস ও ব্যাকআপ এক region-এ থাকলে ঠিক এই হাল হয়।
      - type: visual
        kind: flow
        caption: 'একটা region-এ সবকিছু: বিপর্যয়ে ফেরার পথ নেই, যদি না অন্য জায়গায় কপি থাকে'
        nodes:
          - {id: users, label: 'ব্যবহারকারী', icon: users, col: 0, row: 1, tip: 'তারা শুধু জানে সাইট খুলছে না। কেন, তা জানার দরকার তাদের নেই।'}
          - {id: appa, label: 'Region A', sub: 'অ্যাপ + ডেটাবেস', icon: server, tone: bad, col: 2, row: 0, tip: 'ঢাকার ডেটা সেন্টার বা cloud-এর একটা region। সব কিছু এখানেই চলে।'}
          - {id: backup, label: 'ব্যাকআপ', sub: 'একই Region A-তে', icon: archive, tone: bad, col: 4, row: 0, tip: 'প্রতি রাতে নেওয়া হয়, কিন্তু ওই একই region-এর storage-এ। region গেলে এটাও গেল।'}
          - {id: regionb, label: 'Region B', sub: 'কিছুই নেই', icon: cloud, tone: muted, col: 2, row: 2, tip: 'অন্য জায়গা আছে, কিন্তু সেখানে না আছে কোড, না ডেটাবেস, না কোনো পরিকল্পনা।'}
        edges:
          - {from: users, to: appa, label: 'সব ট্রাফিক একটাই region-এ যায়'}
          - {from: appa, to: backup, label: 'প্রতি রাতে ব্যাকআপ যায় একই region-এর storage-এ', tone: warn}
          - {from: users, to: appa, label: 'Region A বন্ধ: অ্যাপ ও ব্যাকআপ দুটোই অগম্য, ৬ ঘণ্টা সাড়া নেই', tone: bad, dashed: true}
          - {from: users, to: regionb, label: 'ফেরার পথ নেই: Region B-তে কিছুই তৈরি নেই', tone: muted, dashed: true}
          - {from: backup, to: regionb, label: 'সমাধান: প্রতি রাতে ব্যাকআপের কপি Region B-তেও পাঠানো, যাতে ফেরার পথ থাকে', tone: good}
      - type: quote
        body: 'ব্যাকআপ যে জায়গার ওপর নির্ভর করে, সেই জায়গা গেলে ব্যাকআপও যায়। কপি রাখুন অন্য region ও অন্য account-এ।'
    aside:
      - type: story
        title: 'আগুন লাগল ডেটা সেন্টারে'
        body: |
          বিশ্বের এক বড় ক্লাউড সরবরাহকারীর একটা ডেটা সেন্টারে আগুন লেগে অনেক গ্রাহকের সার্ভার বন্ধ হয়ে গিয়েছিল। যাদের ব্যাকআপ অন্য ডেটা সেন্টারে বা অন্য region-এ ছিল, তারা দিনের মধ্যেই ফিরেছে। বাকিরা কেউ কেউ ডেটাই ফিরে পায়নি।
      - type: terms
        items:
          - {term: 'Region', meaning: 'ভৌগোলিকভাবে আলাদা এলাকার ডেটা সেন্টারের গুচ্ছ, যেমন সিঙ্গাপুর বা মুম্বাই। এক region গেলে অন্যটা সাধারণত বেঁচে থাকে।'}
          - {term: 'Disaster recovery (DR)', meaning: 'বড় বিপর্যয়ের পর (region বন্ধ, ডেটা মোছা) সিস্টেম আবার চালু করার পরিকল্পনা ও ব্যবস্থা।'}
    check:
      q: 'রাতের ব্যাকআপ প্রতিদিন নেওয়া হচ্ছে, তবু region-এর বিপর্যয়ে সেটা কাজে লাগেনি। সম্ভাব্য কারণ কী?'
      a: 'ব্যাকআপ একই region-এ রাখা ছিল, তাই region যাওয়ার সাথে সেটাও গেছে। ব্যাকআপ আলাদা region-এ রাখতে হয়।'

  - slug: rpo-rto
    title: 'RPO আর RTO: কতটা হারাব, কতক্ষণ বন্ধ থাকব'
    kind: concept
    tldr: 'RPO হলো সর্বোচ্চ কত সময়ের ডেটা হারানো সহ্য হবে, RTO হলো সর্বোচ্চ কত সময় বন্ধ থাকা সহ্য হবে। দুটোই ব্যবসা ঠিক করে, আর যত কম চান তত খরচ।'
    keywords: ['RPO', 'RTO', 'recovery point objective', 'recovery time objective', 'ডেটা হারানো', 'downtime']
    blocks:
      - type: text
        body: |
          দোকানের আগুনের হিসাব দিয়েই বোঝা যায়। ফটোকপির পর যতটুকু বাকি লেখা হয়েছিল, তা হারিয়ে গেল: এই সময়কে বলে **RPO** (Recovery Point Objective)। আর দোকান আবার চালু হতে যত সময় লাগল, সেটা **RTO** (Recovery Time Objective)। আগে থেকে ঠিক করা সীমা হলো objective, ঘটনার পরে পাওয়া সংখ্যা নয়।
      - type: visual
        kind: steps
        caption: 'একটা বিপর্যয়ের সময়রেখা: ৭ মিনিটের ডেটা গেল, ৮৩ মিনিট বন্ধ'
        steps:
          - {title: '১০:০০ শেষ ব্যাকআপ', body: 'এরপর থেকে নতুন যা লেখা হয়, তা শুধু প্রধান ডেটাবেসে।', tip: 'ব্যাকআপ বা replication যত ঘন, এই বিন্দু বিপর্যয়ের তত কাছে থাকে।'}
          - {title: '১০:০৭ বিপর্যয়', body: 'Region বন্ধ। ১০:০০ থেকে ১০:০৭ পর্যন্ত ৭ মিনিটের ডেটা হারায়।', tone: bad, tip: 'এই ৭ মিনিটই আসলে হারানো ডেটা। সীমা (RPO) এর চেয়ে বেশি হলে লক্ষ্য ব্যর্থ।'}
          - {title: '১০:০৭–১১:৩০', body: 'উদ্ধার কাজ: ব্যাকআপ restore, অ্যাপ চালু, ট্রাফিক সরানো।', tone: warn, tip: 'এই সময়ে ব্যবহারকারীরা কিছুই করতে পারে না।'}
          - {title: '১১:৩০ চালু', body: 'মোট ৮৩ মিনিট বন্ধ। এটাই এবারের প্রকৃত recovery time।', tone: good, tip: 'সীমা (RTO) ছিল ৬০ মিনিট হলে এবার লক্ষ্য ব্যর্থ, আর পরের মহড়ায় এই ঘাটতি ঠিক করতে হবে।'}
      - type: visual
        kind: table
        caption: 'কাজের গুরুত্ব অনুযায়ী ভিন্ন RPO ও RTO'
        headers: ['কাজ', 'RPO', 'RTO']
        rows:
          - cells: ['পেমেন্ট ও ব্যালেন্স', 'প্রায় ০ (সেকেন্ড)', '১৫ মিনিট']
            tip: 'টাকার ডেটা হারালে ক্ষতি সরাসরি। এখানে ধারাবাহিক replication ও দ্রুত failover দরকার, আর সেটাই সবচেয়ে দামি।'
          - cells: ['অর্ডার ও কার্ট', '৫ মিনিট', '১ ঘণ্টা']
            tip: 'কয়েক মিনিটের অর্ডার হারালে গ্রাহক আবার অর্ডার দিতে পারে। এটা সহনীয়।'
          - cells: ['রিপোর্ট ও অ্যানালিটিক্স', '২৪ ঘণ্টা', '১ দিন']
            tip: 'রাতের ব্যাকআপই যথেষ্ট। এগুলো পুনরায় তৈরি করা যায়।'
      - type: quote
        body: 'RPO আর RTO ব্যবসা ঠিক করে, প্রকৌশলী নয়। যত কম চান, খরচ তত বাড়ে।'
    aside:
      - type: remember
        body: 'RPO = কতটা ডেটা গেল (পেছনে তাকান)। RTO = কতক্ষণ বন্ধ (সামনে তাকান)।'
      - type: terms
        items:
          - {term: 'RPO', meaning: 'সর্বোচ্চ কত সময়ের ডেটা হারানো ব্যবসা মেনে নেবে।'}
          - {term: 'RTO', meaning: 'বিপর্যয় থেকে আবার চালু হতে সর্বোচ্চ কত সময় ব্যবসা সহ্য করবে।'}
          - {term: 'Replication', meaning: 'ডেটাবেসের দ্বিতীয় কপি, যা ক্রমাগত হালনাগাদ হয়, তাই মাত্র কয়েক সেকেন্ড পিছিয়ে থাকে।'}
          - {term: 'Failover', meaning: 'ভাঙা সিস্টেম থেকে ব্যবহারকারীদের অপেক্ষারত সিস্টেমে সরিয়ে দেওয়া।'}
      - type: refs
        items:
          - {to: 'recovery/backups-restore', label: 'ব্যাকআপ ও restore'}
    check:
      q: 'ব্যাকআপ প্রতি ২৪ ঘণ্টায় একবার নেওয়া হয়। তাহলে আপনার RPO সর্বোচ্চ কত হতে পারে, আর পেমেন্টের জন্য এটা কেন যথেষ্ট নয়?'
      a: 'সর্বোচ্চ ২৪ ঘণ্টা: বিপর্যয় ব্যাকআপের ঠিক আগে হলে পুরো দিনের ডেটা যায়। পেমেন্টে সেটা অগ্রহণযোগ্য, তাই ধারাবাহিক replication দরকার।'

  - slug: multi-region-patterns
    title: 'দুই শাখা: active-passive বনাম active-active'
    kind: compare
    tldr: 'Active-passive: দ্বিতীয় region প্রস্তুত থাকে, বিপর্যয়ে ট্রাফিক সেখানে যায়। Active-active: দুই region-ই ট্রাফিক সামলায়, কিন্তু দুই জায়গায় লেখা ডেটা মেলানোই আসল কঠিন কাজ। সস্তা উপায় পরের slide-এ।'
    keywords: ['active-passive', 'active-active', 'multi-region', 'replication lag', 'failover', 'conflict']
    blocks:
      - type: text
        body: |
          ধরুন মুদি দোকানের ঢাকা ও চট্টগ্রামে দুই শাখা। **Active-passive**: চট্টগ্রাম শাখা শুধু অপেক্ষা করে, ঢাকার খাতার কপি পায়, আর ঢাকা বন্ধ হলে বসে যায়। **Active-active**: দুই শাখাই ক্রেতা সামলায়। কিন্তু একই ক্রেতার বাকি যদি দুই শাখায় আলাদা লেখা হয়, তাহলে পরে মেলানো যায় না: এটাই conflict।
      - type: visual
        kind: compare
        caption: 'দুই প্যাটার্ন পাশাপাশি'
        columns:
          - title: 'Active-passive'
            tone: good
            icon: check
            tip: 'বেশিরভাগ সিস্টেমের জন্য সঠিক শুরু। সহজ, কারণ লেখা হয় শুধু এক জায়গায়।'
            items:
              - 'একটা region ট্রাফিক সামলায়, অন্যটা প্রস্তুত'
              - 'ডেটা প্রধান থেকে অন্যটায় replicate হয় (async)'
              - 'বিপর্যয়ে অন্যটাকে primary করা হয়, DNS সরানো হয়'
              - 'RTO: মিনিট থেকে ঘণ্টা, RPO: replication lag'
              - 'খরচ কম: অপেক্ষারত region ছোট হতে পারে'
          - title: 'Active-active'
            tone: warn
            icon: warning
            tip: 'দ্রুত failover ও কম latency দেয়, কিন্তু ডেটার conflict সামলানো প্রকৌশলের সবচেয়ে কঠিন সমস্যার একটা।'
            items:
              - 'দুই region-ই লেখা ও পড়া সামলায়'
              - 'ডেটা দুই দিকে replicate হয়, conflict মেলাতে হয়'
              - 'একটা গেলে অন্যটা ইতোমধ্যে চলছে, তাই RTO প্রায় শূন্য'
              - 'ব্যবহারকারীর কাছের region থেকে উত্তর: কম latency'
              - 'খরচ ও জটিলতা সবচেয়ে বেশি'
      - type: points
        title: 'Multi-region-এ যা ঠিক করতেই হবে'
        style: number
        items:
          - 'কে ট্রাফিক সরাবে: DNS বা global load balancer, আর DNS TTL ছোট রাখা'
          - 'replication lag কত: এটাই আসল RPO, মাপুন'
          - 'লেখা কোথায় যাবে: এক region না দুই region'
          - 'সেশন, cache, ফাইল স্টোরেজ ও secret অন্য region-এ আছে কি না'
      - type: quote
        body: 'Active-active বেছে নেওয়ার আগে নিজেকে জিজ্ঞেস করুন: সত্যিই কি দুই জায়গায় লেখা দরকার?'
    aside:
      - type: when
        use: ['Active-passive: বেশিরভাগ ব্যবসা, RTO কয়েক মিনিট থেকে কয়েক ঘণ্টা সহনীয়', 'Active-active: বৈশ্বিক ব্যবহারকারী, RTO প্রায় শূন্য চাইলে']
        avoid: ['Active-active: ছোট দল ও সীমিত বাজেটে, যখন active-passive-ই যথেষ্ট']
      - type: terms
        items:
          - {term: 'Replication lag', meaning: 'কপি প্রধান ডেটাবেস থেকে কতটা পিছিয়ে। প্রধানটা এখনই মরলে ততটুকু ডেটা যায়।'}
          - {term: 'DNS TTL', meaning: 'সাইটের ঠিকানা দুনিয়া কত সেকেন্ড মনে রাখতে পারে। TTL বড় হলে অন্য region-এ সরতে দেরি হয়।'}
          - {term: 'Conflict', meaning: 'একই জিনিসের জন্য দুই region দুটো আলাদা মান লিখেছে, একটাকে জিততে হবে।'}
      - type: refs
        items:
          - {to: 'data/replication', label: 'Replication ও lag'}
          - {to: 'scaling/cap-pacelc', label: 'Consistency ও availability-র ঠোকাঠুকি'}
    check:
      q: 'Active-active-এ একই ব্যবহারকারীর ঠিকানা দুই region-এ একসাথে দুইভাবে বদলালে কী হয়, আর active-passive-এ কেন এটা সমস্যা নয়?'
      a: 'দুই region দুটো ভিন্ন মান লিখে conflict তৈরি করে, যা মেলানোর নিয়ম লাগে। Active-passive-এ লেখা শুধু এক region-এ হয়, তাই conflict-ই হয় না।'

  - slug: cheaper-dr-options
    title: 'সস্তা ধাপ দুটো: backup-and-restore ও pilot light'
    kind: compare
    tldr: 'কিছু না থাকা আর standby region-এর মাঝে দুটো সস্তা উপায়: backup-and-restore আর pilot light। RPO ও RTO মেটে এমন সবচেয়ে সস্তা ধাপটা বাছুন।'
    keywords: ['backup and restore', 'pilot light', 'warm standby', 'DR strategies', 'খরচ', 'RTO']
    blocks:
      - type: text
        body: |
          আবার দোকানের গল্পে ফিরি। **Backup and restore**: খাতার ফটোকপি চট্টগ্রামের একটা লকারে পড়ে থাকে। আগুনের পরে নতুন দোকান ভাড়া করে খাতা কপি করে তাক সাজাতে লাগে একদিন। **Pilot light**: চট্টগ্রামে একটা ছোট ঘর, যেখানে একজন সহকারী সারাদিন ঢাকার খাতা টুকে রাখে। তাক খালি, আলো নেভানো, কিন্তু খাতা হালনাগাদ, তাই আবার খুলতে এক-দুই ঘণ্টা।
      - type: visual
        kind: table
        caption: 'চার উপায়, সবচেয়ে সস্তা থেকে সবচেয়ে দামি'
        headers: ['', 'Region B-তে যা চলে', 'RPO', 'RTO', 'খরচ']
        rows:
          - cells: ['Backup and restore', 'কিছুই না: শুধু কপি storage-এ', 'কয়েক ঘণ্টা (ব্যাকআপের বয়স)', 'কয়েক ঘণ্টা থেকে এক দিন', 'সবচেয়ে কম']
            tip: 'দাম শুধু storage আর region-এর মাঝে ডেটা পাঠানোর। বাকি সব বিপর্যয়ের পরে বানাতে হয়।'
          - cells: ['Pilot light', 'শুধু ডেটাবেস replica, অ্যাপ বন্ধ', 'সেকেন্ড থেকে মিনিট (lag)', '৩০ মিনিট থেকে ২ ঘণ্টা', 'কম']
            tip: 'ডেটা সবসময় হালনাগাদ। অপেক্ষাটা অ্যাপ সার্ভার চালু করার।'
          - cells: ['Warm standby', 'ছোট কিন্তু পূর্ণ কপি, চালু অবস্থায়', 'সেকেন্ড থেকে মিনিট (lag)', 'মিনিট', 'মাঝারি']
            tip: 'আগের slide-এর active-passive এটাই। অ্যাপ আগেই চালু, তাই ফেরা মানে ট্রাফিক সরানো আর আকার বাড়ানো।'
          - cells: ['Active-active', 'পুরো কপি, ব্যবহারকারীকে সেবা দিচ্ছে', 'প্রায় শূন্য', 'প্রায় শূন্য', 'সবচেয়ে বেশি']
            tip: 'দুই region-ই সবসময় ব্যবহারকারী সামলায়, আর conflict মেলাতে হয়।'
      - type: visual
        kind: bars
        caption: 'আনুমানিক বাড়তি মাসিক খরচ, Region A-র বিলের অংশ হিসেবে (উদাহরণ মাত্র; আপনার সংখ্যা আলাদা হবে)'
        items:
          - {label: 'Backup and restore', value: 2, display: '~২%', tone: good, tip: 'কপির storage, আর region-এর মাঝে ডেটা পাঠানো।'}
          - {label: 'Pilot light', value: 12, display: '~১০–১৫%', tone: good, tip: 'সারাক্ষণ চলা একটা ডেটাবেস replica, আর তার নেটওয়ার্ক খরচ।'}
          - {label: 'Warm standby', value: 40, display: '~৪০%', tone: warn, tip: 'সবকিছু চালু, তবে পুরো আকারের একটা ভগ্নাংশে।'}
          - {label: 'Active-active', value: 100, display: '~১০০% বা বেশি', tone: bad, tip: 'পুরো আকারের দ্বিতীয় কপি, সাথে conflict মেলানোর প্রকৌশল-খরচ।'}
      - type: code
        lang: bash
        file: 'runbooks/pilot-light-failover.sh'
        variant: good
        code: |
          # Pilot light: Region B-তে শুধু ডেটাবেস replica চলে। বাকিটা এখন চালু করুন।
          # ১. replica হয়ে যায় primary
          psql -h replica.region-b -c "SELECT pg_promote();"

          # ২. অ্যাপ ০ থেকে পুরো আকারে বাড়ান
          kubectl --context region-b scale deployment/app --replicas=6
          kubectl --context region-b scale deployment/worker --replicas=2

          # ৩. প্রস্তুত হওয়া পর্যন্ত অপেক্ষা (কয়েক মিনিট), তারপর ট্রাফিক সরান
          kubectl --context region-b rollout status deployment/app --timeout=600s
        marks:
          - {line: 6, tip: 'Pilot light RTO-তে এর দামটাই দেয়: সার্ভার চালু হতে মিনিট লাগে। Warm standby-তে এই ধাপ নেই, কারণ অ্যাপ আগেই চলছে।'}
      - type: quote
        body: 'ব্যবসার যতটুকু দ্রুত ফেরা দরকার ততটুকুই কিনুন: RPO ও RTO যে সবচেয়ে সস্তা ধাপে মেটে।'
    aside:
      - type: when
        use: ['Backup and restore: রিপোর্ট, অভ্যন্তরীণ টুল, যা একদিন বন্ধ থাকলেও চলে', 'Pilot light: অর্ডার ও কার্ট, যেখানে এক-দুই ঘণ্টা বন্ধ সহনীয়']
        avoid: ['বড় ডেটাবেসে backup and restore: ২০০ GB ঘণ্টায় ৫০ GB হারে মানে অ্যাপ চালুর আগেই ৪ ঘণ্টা', 'মিনিটে ফিরতে চাইলে pilot light নয়: সার্ভার চালু হতে সময় লাগে']
      - type: tips
        items:
          - 'বন্ধ থাকা অংশ পচে যায়। অ্যাপ ০ কপিতে থাকলেও প্রতিটা release Region B-তেও deploy করুন, আর game day-তে আকার বাড়ানোটা পরীক্ষা করুন।'
          - 'Region B-তে পাঠানো কপিও আলাদা account-এ রাখুন, নইলে এক ভুলে দুটোই মুছে যায়।'
      - type: terms
        items:
          - {term: 'Pilot light', meaning: 'গ্যাস চুলার ছোট শিখার মতো: শুধু জরুরি অংশ (ডেটা) জ্বলে থাকে, বাকিটা দরকারে জ্বালানো হয়।'}
          - {term: 'Warm standby', meaning: 'সিস্টেমের ছোট কিন্তু সম্পূর্ণ কপি, আগেই চালু, দরকারে বড় করার জন্য প্রস্তুত।'}
    check:
      q: '২০০ GB ডেটাবেস ঘণ্টায় ৫০ GB হারে ব্যাকআপ থেকে restore হয়। শুধু restore-এ কত সময় লাগে, আর ২ ঘণ্টার RTO-র জন্য backup-and-restore সম্পর্কে এটা কী বলে?'
      a: 'অ্যাপ চালুর আগেই ৪ ঘণ্টা। ২ ঘণ্টার RTO এতে মেটে না, তাই অন্য region-এ আগে থেকে চালু replica লাগে (pilot light বা আরও ওপরের ধাপ)।'

  - slug: game-day-drill
    title: 'Game day: ব্যর্থতা ইচ্ছা করে ঘটিয়ে পরীক্ষা'
    kind: howto
    tldr: 'DR পরিকল্পনা পরীক্ষা না করলে সেটা আশা মাত্র। ঠিক করা দিনে ইচ্ছা করে failover চালান, বাস্তব RPO ও RTO মাপুন, আর যা ভুল পান ঠিক করুন।'
    keywords: ['game day', 'failover drill', 'runbook', 'pg_promote', 'replication lag', 'পরীক্ষা']
    blocks:
      - type: text
        body: |
          ফায়ার ড্রিলের মতো: আগুন লাগার আগেই সবাই জানে বেরোনোর পথ কোনটা। **Game day**-তে টিম ঠিক করা দিনে, সবাই জেনে, ইচ্ছা করে একটা ব্যর্থতা ঘটিয়ে recovery-র পুরো পথ চালায়। লক্ষ্য দোষ খোঁজা নয়, ঘাটতি খোঁজা।
      - type: visual
        kind: steps
        caption: 'একটা game day-র ছয় ধাপ'
        steps:
          - {title: '১. লক্ষ্য ঠিক', body: 'RPO ১ মিনিট, RTO ৩০ মিনিট। এটাই পাশ-ফেলের মাপকাঠি।', tip: 'মহড়া শুরুর আগেই সীমা লিখে রাখুন, নইলে পরে "মোটামুটি হয়েছে" বলে চালানো যায়।'}
          - {title: '২. runbook লিখুন', body: 'ধাপে ধাপে কে কী করবে, কমান্ডসহ।', tip: 'ভালো runbook এমন যে ছুটিতে থাকা কারো বদলে নতুন কেউও ধাপগুলো মেনে চলতে পারে।'}
          - {title: '৩. ব্যর্থতা ঘটান', body: 'প্রথমে staging-এ। পরে নিয়ন্ত্রিতভাবে production-এ কম ট্রাফিকের সময়।', tone: warn, tip: 'staging-এ আস্থা জন্মালে তবেই production। production-এ করলে কাউকে পাহারায় রাখুন এবং থামানোর সুইচ হাতে রাখুন।'}
          - {title: '৪. recovery চালান', body: 'runbook দেখে, সময় মেপে।', tip: 'যে ধাপে কেউ আটকাবে বা অনুমান করবে, সেটাই runbook-এর ঘাটতি।'}
          - {title: '৫. মাপুন', body: 'আসল RPO ও RTO, লক্ষ্যের সাথে তুলনা।', tip: 'সবচেয়ে দরকারি সংখ্যা: এই মহড়ায় সত্যিই কতক্ষণ লাগল, কত ডেটা গেল।'}
          - {title: '৬. ঠিক করুন', body: 'ঘাটতির তালিকা, দায়িত্ব ও সময়সহ।', tone: good, tip: 'মহড়া কাজে আসে শুধু তখনই যখন তার ঘাটতিগুলো পরের মহড়ার আগে সারানো হয়।'}
      - type: code
        lang: bash
        file: 'runbooks/failover-db.sh'
        variant: good
        code: |
          # ১. replica কতটা পিছিয়ে? এটাই এখনকার প্রকৃত RPO
          psql -h replica.region-b -c \
            "SELECT now() - pg_last_xact_replay_timestamp() AS lag;"

          # ২. replica-কে নতুন primary বানান
          psql -h replica.region-b -c "SELECT pg_promote();"

          # ৩. নিশ্চিত হোন: false হলে সে আর replica নয়, লেখা নিতে পারে
          psql -h replica.region-b -c "SELECT pg_is_in_recovery();"

          # ৪. Region B-র অ্যাপ আগে থেকেই replica.region-b-র ঠিকানায় চলে, config বদলাতে হয় না।
          # তাকে restart করুন, যাতে নতুন connection খোলে আর worker পরিষ্কারভাবে ওঠে
          kubectl --context region-b rollout restart deployment/app deployment/worker
        marks:
          - {line: 2, tip: 'বাস্তবে primary মরে গেলে lag-টাই হারানো ডেটার সীমা। মহড়ার সময় আগে মাপুন, মিলিয়ে দেখুন RPO-র লক্ষ্যের মধ্যে কি না।'}
          - {line: 6, tip: 'pg_promote() PostgreSQL 12+ থেকে। replica লেখার জন্য খুলে যায়। পুরোনো primary কখনো আবার চালু করবেন না, নইলে split-brain।'}
          - {line: 13, tip: 'Region B-র অ্যাপ শুরু থেকেই replica-র ঠিকানায় বসানো, তাই বিপর্যয়ের মাঝে কোনো URL বদলাতে হয় না। এই ধাপ কত সময় নেয়, তা মহড়ায় মেপে runbook-এ লিখুন।'}
      - type: quote
        body: 'যে recovery কখনো চালিয়ে দেখা হয়নি, সেটা কাজ করবে ধরে নেওয়া ভুল।'
    aside:
      - type: tips
        items:
          - 'প্রথম game day-তে কিছু না কিছু ভাঙবেই: পাসওয়ার্ড অন্য region-এ নেই, DNS TTL ২৪ ঘণ্টা, runbook পুরোনো। এটাই লাভ।'
          - 'Chaos tooling (যেমন নেটওয়ার্ক কেটে দেওয়া) এর আগে হাতে-কলমে মহড়াই যথেষ্ট ভালো শুরু।'
      - type: pitfalls
        items:
          - 'পুরোনো primary হঠাৎ ফিরে এলে দুই primary হয়ে যায় (split-brain)। তাকে আগে বন্ধ বা বিচ্ছিন্ন করুন।'
      - type: refs
        items:
          - {to: 'resilience/graceful-degradation', label: 'বিপর্যয়ের সময় কী কম দেখানো যায়'}
          - {to: 'testing/test-types', label: 'Chaos ও failure-injection test'}
    check:
      q: 'Game day-তে ৮৩ মিনিট লাগল, RTO ছিল ৬০ মিনিট। এটাকে ব্যর্থতা না বলে কী বলা উচিত, আর এরপর কী?'
      a: 'এটা সফল মহড়া: ঘাটতি বাস্তব ঘটনার আগে ধরা পড়ল। এখন ঠিক করতে হবে কোন ধাপে সবচেয়ে বেশি সময় গেছে, তা সারিয়ে আবার মহড়া।'

  - slug: paper-dr-plan
    title: 'ফাঁদ: কাগজে আছে, বাস্তবে চলে না'
    kind: pitfall
