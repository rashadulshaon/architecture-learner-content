  - q: 'টিম একটা game day চালাল। লক্ষ্য RTO ৩০ মিনিট, কিন্তু লাগল ৯০ মিনিট; ৪০ মিনিট গেছে এক জায়গায় secret খুঁজতে। কোন কোন সিদ্ধান্ত ঠিক?'
