  - q: 'নাদিয়ার ইনভয়েস অ্যাপের ডেটাবেস ২০০ GB। ব্যবসা মোটামুটি ১৫ মিনিটের ডেটা হারানো আর প্রায় ৩ ঘণ্টা বন্ধ থাকা মেনে নেয়, বাজেট কম। কোন উপায় মানায়?'
    hint: '২০০ GB restore করতে কত সময় লাগে, আর RPO কী চায়?'
    options:
      - text: 'Pilot light: অন্য region-এ ডেটাবেস replica চলছে, বিপর্যয়ে অ্যাপ চালু করা হয়'
        correct: true
        why: 'Replication ডেটাকে মিনিটের পেছনে রাখে, আর অ্যাপ চালু করা ৩ ঘণ্টার মধ্যে হয়। খরচ standby region-এর ভগ্নাংশ।'
      - text: 'রাতের ব্যাকআপ নিয়ে backup and restore'
