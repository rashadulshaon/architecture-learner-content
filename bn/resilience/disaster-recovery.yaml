        correct: true
        why: 'ঘাটতি ধরা পড়েছে, এবার সারিয়ে আবার মাপতে হবে।'
      - text: 'মহড়াকে সফল ধরা: আসল বিপর্যয়ের আগেই সমস্যা পেয়েছি'
        correct: true
        why: 'game day-র কাজই এটা। ঘাটতি এখন ধরা পড়া বিপর্যয়ের দিনে ধরা পড়ার চেয়ে অনেক ভালো।'
      - text: 'RTO লক্ষ্য ৯০ মিনিট করে দেওয়া, যাতে মহড়া পাশ হয়'
        correct: false
        why: 'লক্ষ্য ব্যবসার প্রয়োজনে ঠিক হয়, মহড়ার ফলে নয়। সীমা বদলানো সমস্যা চাপা দেয়।'
      - text: 'যে secret খুঁজতে দেরি হলো তার দায়ী কর্মীকে শাস্তি দেওয়া'
        correct: false
        why: 'ঘাটতি সিস্টেমের, মানুষের নয়। শাস্তি দিলে পরের মহড়ায় লোকে সমস্যা লুকাবে।'
