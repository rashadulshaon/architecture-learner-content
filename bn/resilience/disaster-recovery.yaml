      - text: 'একই region-এ ব্যাকআপের দ্বিতীয় কপি'
        correct: false
        why: 'region বন্ধ হলে দুই কপিই যায়। আঞ্চলিক বিপর্যয় থেকে বাঁচায় শুধু আলাদা region।'
