slides:
  - slug: line-grows-forever
    title: 'সবাইকে ঢুকতে দিলে শেষে কেউই সেবা পায় না'
    kind: story
    tldr: 'ক্ষমতার চেয়ে বেশি request এলে সীমাহীন লাইন লম্বা হয়, উত্তর আসে দেরিতে — ব্যবহারকারী চলে যাওয়ার পরে। তখন সার্ভার পরিশ্রম করে, কাজ হয় না।'
    keywords: ['overload', 'unbounded queue', 'goodput', 'latency', 'ওভারলোড', 'লম্বা লাইন']
    blocks:
      - type: metaphor
        icon: ticket
        title: 'ঈদের আগে কমলাপুরের টিকিট কাউন্টার'
        body: |
          কাউন্টারে একজন কর্মী, সে একজনকে টিকিট দিতে সময় নেয় নির্দিষ্ট। লাইনে মানুষ আসে তার চেয়ে বেশি গতিতে, আর কেউ কাউকে ফেরায় না। লাইন বাড়তে বাড়তে এমন হয় যে যে লোক টিকিট পেল, ততক্ষণে তার ট্রেন ছেড়ে গেছে। কর্মী সারাদিন খেটেছে, কিন্তু কারো কাজে আসেনি। আপনার সার্ভারে কাউন্টার হলো worker, লাইন হলো queue, আর ট্রেন ছাড়ার সময় হলো ব্যবহারকারীর timeout।
      - type: visual
        kind: flow
        caption: 'সেকেন্ডে ৬০টা আসে, ৫০টা সামলানো যায় — লাইন কমে না, শুধু বাড়ে'
        nodes:
          - {id: users, label: 'ব্যবহারকারী', sub: 'সেকেন্ডে ৬০টা request', icon: users, col: 0, row: 2, tip: 'সেলের দিনে হঠাৎ ভিড়। ব্যবহারকারীরা ৩০ সেকেন্ডের বেশি অপেক্ষা করে না, তারপর রিফ্রেশ চাপে বা চলে যায়।'}
          - {id: queue, label: 'অপেক্ষার লাইন', sub: 'কোনো সীমা নেই', icon: queue, tone: warn, col: 2, row: 1, tip: 'nginx-এর backlog, PHP-FPM-এর লাইন বা Messenger queue — সবই লাইন। সীমা না দিলে এটা যত খুশি বাড়ে।'}
          - {id: app, label: 'অ্যাপ সার্ভার', sub: 'সেকেন্ডে ৫০টা সামলায়', icon: server, tone: accent, col: 4, row: 2, tip: 'ক্ষমতা স্থির। ভিড় বাড়লেও সার্ভার হঠাৎ দ্রুত হয়ে যায় না।'}
        edges:
          - {from: users, to: queue, label: 'সেকেন্ডে ৬০টা request লাইনে ঢোকে'}
          - {from: queue, to: app, label: 'সার্ভার সেকেন্ডে ৫০টা তুলে নেয়, লাইন প্রতি সেকেন্ডে ১০ বাড়ে', tone: warn}
          - {from: app, to: users, label: '১০ মিনিট পরে লাইনে ৬,০০০ জন: উত্তর আসে ১২০ সেকেন্ডে', tone: bad, dashed: true, tip: '৬,০০০ ÷ ৫০ = ১২০ সেকেন্ড। ব্যবহারকারী ৩০ সেকেন্ডেই চলে গেছে, তাই এই উত্তর কেউ দেখে না।'}
      - type: quote
        body: 'ক্ষমতার বেশি কাজ ঢুকতে দিলে সবাই ধীর হয় না — সবাই ব্যর্থ হয়।'
    aside:
      - type: story
        title: 'ব্যস্ত সার্ভার, শূন্য ফল'
        body: |
          একটা ই-কমার্স সাইটে ক্যাম্পেইনের দিন CPU ১০০% ছিল, সার্ভার প্রতি সেকেন্ডে পুরো ক্ষমতায় কাজ করছিল। তবু প্রায় কোনো অর্ডার হচ্ছিল না। কারণ উত্তর যেত এমন connection-এ, যেটা ক্লায়েন্ট আগেই বন্ধ করে দিয়েছে। সার্ভার ব্যস্ত ছিল, কিন্তু কাজ হচ্ছিল না।
      - type: terms
        items:
          - {term: 'Overload', meaning: 'যতটা সামলানো যায় তার চেয়ে বেশি কাজ একসাথে আসা।'}
          - {term: 'Goodput', meaning: 'যেসব উত্তর ব্যবহারকারী সময়মতো সত্যিই পেয়েছে, শুধু তাদের হার। ব্যস্ততা নয়, ফলটা গুনুন।'}
    check:
      q: 'সার্ভার ১০০% ব্যস্ত, অথচ ব্যবহারকারীরা বলছে সাইট কাজ করছে না। এটা কীভাবে সম্ভব?'
      a: 'লাইন এত লম্বা যে উত্তর আসছে ব্যবহারকারীর timeout-এর পরে। সার্ভার এমন request সামলাচ্ছে যার পাঠক আর নেই, তাই goodput প্রায় শূন্য।'

  - slug: reject-early
    title: 'লাইন ছোট রাখুন, বাকিদের সাথে সাথে ফিরিয়ে দিন'
    kind: concept
    tldr: 'Load shedding মানে সীমার বেশি request দরজাতেই ফিরিয়ে দেওয়া। বাকিরা পুরো গতিতে সেবা পায়, আর ফেরানো লোক জানে কখন আবার আসবে।'
    keywords: ['load shedding', 'back-pressure', 'bounded queue', '429', '503', 'Retry-After', 'fail fast']
    blocks:
      - type: metaphor
        icon: ticket
        title: 'গেটে "টিকিট শেষ" লেখা বোর্ড'
        body: |
          ভালো স্টেশন কর্মী গেটে এসে বলে: "আজকের ৫০টা টিকিট আছে, বাকিরা কাল আসুন।" যারা ঢুকল তারা ঠিক সময়ে টিকিট পেল, যারা ফিরল তারা সময় নষ্ট করল না। এটাই **load shedding**: ক্ষমতার বাইরের কাজ ইচ্ছা করে ফেরানো।
      - type: text
        body: |
          লাইনের একটা সর্বোচ্চ সীমা থাকলে তাকে বলে **bounded queue**। সীমা ছুঁলে নতুন request সাথে সাথে 503 পায়। এভাবে সামনের ধাপ পেছনের ধাপকে বলে "আমি ভরা, আস্তে পাঠান" — একে বলে **back-pressure**। প্রত্যাখ্যান করতে প্রায় কোনো খরচ হয় না, কিন্তু ভেতরে ঢুকিয়ে পরে timeout করানোর খরচ অনেক।
      - type: visual
        kind: flow
        caption: 'সীমা ৫০: প্রথম ৫০টা ঢোকে, বাকি ১০টা সাথে সাথে ফেরে'
        nodes:
          - {id: users, label: 'ব্যবহারকারী', sub: 'সেকেন্ডে ৬০টা request', icon: users, col: 0, row: 0, tip: 'ভিড় আগের মতোই। পার্থক্য হলো সার্ভার এবার সীমা জানে।'}
          - {id: gate, label: 'প্রবেশদ্বার', sub: 'একসাথে সর্বোচ্চ ৫০টা', icon: filter, tone: accent, col: 2, row: 1, tip: 'rate limiter বা bounded queue। গোনে কতজন ভেতরে আছে, সীমা ছুঁলে আর ঢোকায় না।'}
          - {id: app, label: 'অ্যাপ সার্ভার', sub: 'সেকেন্ডে ৫০টা', icon: server, tone: good, col: 4, row: 0, tip: 'এখন লাইন নেই, তাই প্রতিটা request সোজা কাজ পায়।'}
        edges:
          - {from: users, to: gate, label: 'সেকেন্ডে ৬০টা request গেটে পৌঁছায়'}
          - {from: gate, to: app, label: 'প্রথম ৫০টা ঢোকে এবং পুরো গতিতে সামলানো হয়', tone: good}
          - {from: gate, to: users, label: 'বাকি ১০টা সাথে সাথে 503 ও Retry-After: 2 পায়', tone: warn, dashed: true, tip: 'ফেরানো মানে ব্যর্থ করা নয়: client জানে ২ সেকেন্ড পরে আবার চেষ্টা করতে হবে।'}
          - {from: app, to: users, label: 'ঢোকা ৫০টা ২০০ms-এ উত্তর পায়', tone: good, dashed: true}
      - type: visual
        kind: table
        caption: 'ফেরানোর সময় কোন status code, আর কেন'
        headers: ['', '429 (Too Many)', '503 (Unavailable)']
        rows:
          - cells: ['কার দোষ', 'এই client বেশি চাইছে', 'সার্ভার নিজে ভরা']
            tip: '429 ব্যক্তিগত: একজন ব্যবহারকারী বা API key সীমা ছাড়িয়েছে। 503 সবার জন্য: পুরো সিস্টেম অতিব্যস্ত।'
          - cells: ['কখন দেবেন', 'per-user rate limit', 'overload ও shedding']
            tip: 'রাতে ঘুমিয়ে থাকা সার্ভারেও একজন বেশি চাইলে 429 পাবে। 503 শুধু সার্ভার সত্যিই কষ্টে থাকলে।'
          - cells: ['client কী করবে', 'নিজের গতি কমাবে', 'একটু পরে আবার আসবে']
            tip: 'দুই ক্ষেত্রেই Retry-After header পাঠান, নইলে client আন্দাজে চেষ্টা করবে আর ভিড় বাড়াবে।'
      - type: quote
        body: 'ঢোকার পরে timeout করানোর চেয়ে দরজাতেই "না" বলা সস্তা এবং ভদ্র।'
    aside:
      - type: terms
        items:
          - {term: 'Back-pressure', meaning: 'ভরা ধাপ সামনের ধাপকে "গতি কমান" জানানো, যাতে ভিড় পেছনে জমে না।'}
          - {term: 'Bounded queue', meaning: 'যার সর্বোচ্চ আকার ঠিক করা আছে। ভরে গেলে নতুন জিনিস ঢোকে না।'}
          - {term: 'Retry-After', meaning: 'HTTP header: কত সেকেন্ড পরে আবার চেষ্টা করলে কাজ হবে।'}
      - type: remember
        body: 'লাইনের সীমা না থাকলে সেটা লাইন নয়, গর্ত। সীমা ছুঁলে সাথে সাথে "না"।'
      - type: when
        use: ['ক্ষমতার বেশি চাহিদা এলে, যেমন সেলের ভিড় বা হঠাৎ ভাইরাল লিংক', 'যে কাজ client পরে নিরাপদে আবার পাঠাতে পারে']
        avoid: ['ছোট ঝাঁকুনি, যা ছোট bounded queue-ই সামলে নেয়', 'যে client আবার চেষ্টা করতে পারে না, যেমন retry-হীন এক-বারের webhook']
      - type: refs
        items:
          - {to: 'api/rate-limiting', label: 'Per-user rate limit ও 429'}
    check:
      q: 'Load shedding-এ কিছু ব্যবহারকারীকে ফিরিয়ে দিলে সাইট খারাপ দেখায় না? কেন এটা তবু ভালো?'
      a: 'না ফেরালে সবাই ১২০ সেকেন্ড অপেক্ষা করে ব্যর্থ হতো। ফেরালে ৫০ জন দ্রুত সেবা পায়, বাকিরা সাথে সাথে জানে কখন আবার আসবে।'

  - slug: shed-with-rate-limiter
    title: 'Symfony RateLimiter দিয়ে কম জরুরি কাজের সীমা বেঁধে দিন'
    kind: howto
    tldr: 'Token bucket কম জরুরি রুটের হার বেঁধে দেয়, সীমা ছুঁলে 503 ও Retry-After দেয়। এটা বরাদ্দ, এখনও shedding নয়: সার্ভার কতটা ব্যস্ত তা দেখে না।'
    keywords: ['RateLimiter', 'token bucket', 'priority', 'critical traffic', 'শেডিং', 'Retry-After']
    blocks:
      - type: text
        body: |
          সব request সমান জরুরি নয়। ভিড়ে প্রথমে সার্চ, সুপারিশ আর রিপোর্টের মতো কাজ ছাঁটুন, যাতে চেকআউট আর পেমেন্টের জন্য জায়গা বাঁচে। নিচে একটা token bucket (যে বালতিতে নির্দিষ্ট হারে টোকেন ভরে) বানানো হলো: সেকেন্ডে সর্বোচ্চ ৫০টা কম জরুরি request চলবে, key সবার জন্য এক (`global`)।

          একটা কথা পরিষ্কার: এটা সার্ভারের দিকে তাকায় না। সার্ভার পুরো খালি থাকলেও ৫১ নম্বরকে ফেরায়, তাই এটা এখনও বরাদ্দ, প্রকৃত load shedding নয়। পরের slide-এ একে সাড়া দেওয়ানো হবে।
      - type: code
        lang: yaml
        file: 'config/packages/rate_limiter.yaml'
        variant: good
        code: |
          framework:
              rate_limiter:
                  low_priority:
                      policy: 'token_bucket'
                      limit: 100            # বালতিতে সর্বোচ্চ ১০০ টোকেন (ছোট ঝাঁকুনি সয়)
                      rate: { interval: '1 second', amount: 50 }   # প্রতি সেকেন্ডে ৫০ টোকেন ভরে
        marks:
          - {line: 3, tip: 'নাম low_priority থেকে Symfony autowiring-এর নাম হয় $lowPriorityLimiter।'}
          - {line: 5, tip: 'limit হলো বালতির আকার: হঠাৎ ১০০টা একসাথে এলেও সয়, কিন্তু টেকসই গতি ৫০/সেকেন্ডের বেশি নয়।'}
      - type: code
        lang: php
        file: 'src/EventListener/LoadSheddingListener.php'
        variant: good
        code: |
          #[AsEventListener(event: KernelEvents::REQUEST, priority: 30)]
          final class LoadSheddingListener
          {
              private const SHEDDABLE = ['/api/search', '/api/recommendations', '/api/reports'];

              public function __construct(private readonly RateLimiterFactory $lowPriorityLimiter)
              {
              }

              public function __invoke(RequestEvent $event): void
              {
                  $path = $event->getRequest()->getPathInfo();
                  $sheddable = array_filter(self::SHEDDABLE, fn ($p) => str_starts_with($path, $p));
                  if (!$event->isMainRequest() || [] === $sheddable) {
                      return;   // চেকআউট, পেমেন্ট, লগইন: কখনো ছাঁটা হবে না
                  }

                  $limit = $this->lowPriorityLimiter->create('global')->consume();
                  if ($limit->isAccepted()) {
                      return;
                  }

                  $wait = max(1, $limit->getRetryAfter()->getTimestamp() - time());
                  $event->setResponse(new JsonResponse(
                      ['error' => 'busy', 'message' => 'একটু পরে আবার চেষ্টা করুন'],
                      Response::HTTP_SERVICE_UNAVAILABLE,
                      ['Retry-After' => (string) $wait],
                  ));
              }
          }
        marks:
          - {line: 1, tip: 'priority 30: firewall-এর আগে চলে, তাই ছাঁটা request-এর জন্য auth-এর খরচও হয় না।'}
          - {line: 4, tip: 'ছাঁটার তালিকা পরিষ্কার লেখা: কোন পথ ত্যাগ করা যায়, আগে থেকে ঠিক করা।'}
          - {line: 24, tip: 'ছাঁটা request এখানেই শেষ। controller, ডেটাবেস বা বাইরের API-তে এর কোনো খরচ পড়ে না।'}
      - type: points
        title: 'কোন কাজ আগে ছাঁটবেন'
        style: number
        items:
          - 'সবার আগে: রিপোর্ট, export, ব্যাকগ্রাউন্ডে পিছানো যায় এমন কাজ'
          - 'তারপর: সার্চ, সুপারিশ, লাইভ কাউন্টার — ছাড়া চলে'
          - 'সবশেষে: ব্রাউজিং। এটা ছাঁটলে ব্যবহারকারী সাইট ছাড়ে'
          - 'কখনো না: পেমেন্ট, চেকআউট, লগইন, health check'
    aside:
      - type: tips
        items:
          - 'সার্বিক সীমা মাপার আগে ছাঁটার তালিকা ছোট রাখুন: ৩–৪টা পথই যথেষ্ট, বেশি হলে ভুল পথ ছাঁটার ঝুঁকি বাড়ে।'
          - 'প্রথমে শুধু log করুন কতগুলো ছাঁটা হতো, তারপর চালু করুন। সীমা আন্দাজে বসালে ভুলে সুস্থ ট্রাফিক ছাঁটবে।'
          - 'সার্বিক সীমা একাধিক সার্ভারের মধ্যে ভাগাভাগি করতে limiter-এর cache pool হিসেবে Redis দিন, নইলে প্রতি সার্ভারের আলাদা হিসাব হয়।'
      - type: when
        use: ['ভিড় হঠাৎ বাড়লে কম জরুরি রুট বাঁচানোর জন্য', 'ক্যাম্পেইন বা সেলের আগে রক্ষাকবচ হিসেবে']
        avoid: ['সীমা না মেপে বসানো সংখ্যায়', 'পেমেন্ট বা auth রুটে', 'একমাত্র প্রতিরক্ষা হিসেবে: সার্ভার সত্যিই হাঁপাচ্ছে কি না, এটা দেখে না']
