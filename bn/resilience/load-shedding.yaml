slides:
  - slug: line-grows-forever
    title: 'সবাইকে ঢুকতে দিলে শেষে কেউই সেবা পায় না'
    kind: story
    tldr: 'ক্ষমতার চেয়ে বেশি request এলে সীমাহীন লাইন লম্বা হয়, উত্তর আসে দেরিতে — ব্যবহারকারী চলে যাওয়ার পরে। তখন সার্ভার পরিশ্রম করে, কাজ হয় না।'
    keywords: ['overload', 'unbounded queue', 'goodput', 'latency', 'ওভারলোড', 'লম্বা লাইন']
    blocks:
      - type: metaphor
        icon: ticket
        title: 'ঈদের আগে কমলাপুরের টিকিট কাউন্টার'
        body: |
          কাউন্টারে একজন কর্মী, সে একজনকে টিকিট দিতে সময় নেয় নির্দিষ্ট। লাইনে মানুষ আসে তার চেয়ে বেশি গতিতে, আর কেউ কাউকে ফেরায় না। লাইন বাড়তে বাড়তে এমন হয় যে যে লোক টিকিট পেল, ততক্ষণে তার ট্রেন ছেড়ে গেছে। কর্মী সারাদিন খেটেছে, কিন্তু কারো কাজে আসেনি। তোমার সার্ভারে কাউন্টার হলো worker, লাইন হলো queue, আর ট্রেন ছাড়ার সময় হলো ব্যবহারকারীর timeout।
      - type: visual
        kind: flow
        caption: 'সেকেন্ডে ৬০টা আসে, ৫০টা সামলানো যায় — লাইন কমে না, শুধু বাড়ে'
        nodes:
          - {id: users, label: 'ব্যবহারকারী', sub: 'সেকেন্ডে ৬০টা request', icon: users, col: 0, row: 2, tip: 'সেলের দিনে হঠাৎ ভিড়। ব্যবহারকারীরা ৩০ সেকেন্ডের বেশি অপেক্ষা করে না, তারপর রিফ্রেশ চাপে বা চলে যায়।'}
          - {id: queue, label: 'অপেক্ষার লাইন', sub: 'কোনো সীমা নেই', icon: queue, tone: warn, col: 2, row: 1, tip: 'nginx-এর backlog, PHP-FPM-এর লাইন বা Messenger queue — সবই লাইন। সীমা না দিলে এটা যত খুশি বাড়ে।'}
          - {id: app, label: 'অ্যাপ সার্ভার', sub: 'সেকেন্ডে ৫০টা সামলায়', icon: server, tone: accent, col: 4, row: 2, tip: 'ক্ষমতা স্থির। ভিড় বাড়লেও সার্ভার হঠাৎ দ্রুত হয়ে যায় না।'}
        edges:
          - {from: users, to: queue, label: 'সেকেন্ডে ৬০টা request লাইনে ঢোকে'}
          - {from: queue, to: app, label: 'সার্ভার সেকেন্ডে ৫০টা তুলে নেয়, লাইন প্রতি সেকেন্ডে ১০ বাড়ে', tone: warn}
          - {from: app, to: users, label: '১০ মিনিট পরে লাইনে ৬,০০০ জন: উত্তর আসে ১২০ সেকেন্ডে', tone: bad, dashed: true, tip: '৬,০০০ ÷ ৫০ = ১২০ সেকেন্ড। ব্যবহারকারী ৩০ সেকেন্ডেই চলে গেছে, তাই এই উত্তর কেউ দেখে না।'}
      - type: quote
        body: 'ক্ষমতার বেশি কাজ ঢুকতে দিলে সবাই ধীর হয় না — সবাই ব্যর্থ হয়।'
    aside:
      - type: story
        title: 'ব্যস্ত সার্ভার, শূন্য ফল'
        body: |
          একটা ই-কমার্স সাইটে ক্যাম্পেইনের দিন CPU ১০০% ছিল, সার্ভার প্রতি সেকেন্ডে পুরো ক্ষমতায় কাজ করছিল। তবু প্রায় কোনো অর্ডার হচ্ছিল না। কারণ উত্তর যেত এমন connection-এ, যেটা ক্লায়েন্ট আগেই বন্ধ করে দিয়েছে। সার্ভার ব্যস্ত ছিল, কিন্তু কাজ হচ্ছিল না।
      - type: terms
        items:
          - {term: 'Overload', meaning: 'যতটা সামলানো যায় তার চেয়ে বেশি কাজ একসাথে আসা।'}
          - {term: 'Goodput', meaning: 'যেসব উত্তর ব্যবহারকারী সময়মতো সত্যিই পেয়েছে, শুধু তাদের হার। ব্যস্ততা নয়, ফলটা গোনো।'}
    check:
      q: 'সার্ভার ১০০% ব্যস্ত, অথচ ব্যবহারকারীরা বলছে সাইট কাজ করছে না। এটা কীভাবে সম্ভব?'
      a: 'লাইন এত লম্বা যে উত্তর আসছে ব্যবহারকারীর timeout-এর পরে। সার্ভার এমন request সামলাচ্ছে যার পাঠক আর নেই, তাই goodput প্রায় শূন্য।'

  - slug: reject-early
    title: 'লাইন ছোট রাখো, বাকিদের সাথে সাথে ফিরিয়ে দাও'
    kind: concept
    tldr: 'Load shedding মানে সীমার বেশি request দরজাতেই ফিরিয়ে দেওয়া। বাকিরা পুরো গতিতে সেবা পায়, আর ফেরানো লোক জানে কখন আবার আসবে।'
    keywords: ['load shedding', 'back-pressure', 'bounded queue', '429', '503', 'Retry-After', 'fail fast']
    blocks:
      - type: metaphor
        icon: ticket
        title: 'গেটে "টিকিট শেষ" লেখা বোর্ড'
        body: |
          ভালো স্টেশন কর্মী গেটে এসে বলে: "আজকের ৫০টা টিকিট আছে, বাকিরা কাল আসুন।" যারা ঢুকল তারা ঠিক সময়ে টিকিট পেল, যারা ফিরল তারা সময় নষ্ট করল না। এটাই **load shedding**: ক্ষমতার বাইরের কাজ ইচ্ছা করে ফেরানো।
      - type: text
        body: |
          লাইনের একটা সর্বোচ্চ সীমা থাকলে তাকে বলে **bounded queue**। সীমা ছুঁলে নতুন request সাথে সাথে 503 পায়। এভাবে সামনের ধাপ পেছনের ধাপকে বলে "আমি ভরা, আস্তে পাঠাও" — একে বলে **back-pressure**। প্রত্যাখ্যান করতে প্রায় কোনো খরচ হয় না, কিন্তু ভেতরে ঢুকিয়ে পরে timeout করানোর খরচ অনেক।
      - type: visual
        kind: flow
        caption: 'সীমা ৫০: প্রথম ৫০টা ঢোকে, বাকি ১০টা সাথে সাথে ফেরে'
        nodes:
          - {id: users, label: 'ব্যবহারকারী', sub: 'সেকেন্ডে ৬০টা request', icon: users, col: 0, row: 0, tip: 'ভিড় আগের মতোই। পার্থক্য হলো সার্ভার এবার সীমা জানে।'}
          - {id: gate, label: 'প্রবেশদ্বার', sub: 'একসাথে সর্বোচ্চ ৫০টা', icon: filter, tone: accent, col: 2, row: 1, tip: 'rate limiter বা bounded queue। গোনে কতজন ভেতরে আছে, সীমা ছুঁলে আর ঢোকায় না।'}
          - {id: app, label: 'অ্যাপ সার্ভার', sub: 'সেকেন্ডে ৫০টা', icon: server, tone: good, col: 4, row: 0, tip: 'এখন লাইন নেই, তাই প্রতিটা request সোজা কাজ পায়।'}
        edges:
          - {from: users, to: gate, label: 'সেকেন্ডে ৬০টা request গেটে পৌঁছায়'}
          - {from: gate, to: app, label: 'প্রথম ৫০টা ঢোকে এবং পুরো গতিতে সামলানো হয়', tone: good}
          - {from: gate, to: users, label: 'বাকি ১০টা সাথে সাথে 503 ও Retry-After: 2 পায়', tone: warn, dashed: true, tip: 'ফেরানো মানে ব্যর্থ করা নয়: client জানে ২ সেকেন্ড পরে আবার চেষ্টা করতে হবে।'}
          - {from: app, to: users, label: 'ঢোকা ৫০টা ২০০ms-এ উত্তর পায়', tone: good, dashed: true}
      - type: visual
        kind: table
        caption: 'ফেরানোর সময় কোন status code, আর কেন'
        headers: ['', '429 (Too Many)', '503 (Unavailable)']
        rows:
          - cells: ['কার দোষ', 'এই client বেশি চাইছে', 'সার্ভার নিজে ভরা']
            tip: '429 ব্যক্তিগত: একজন ব্যবহারকারী বা API key সীমা ছাড়িয়েছে। 503 সবার জন্য: পুরো সিস্টেম অতিব্যস্ত।'
          - cells: ['কখন দাও', 'per-user rate limit', 'overload ও shedding']
            tip: 'রাতে ঘুমিয়ে থাকা সার্ভারেও একজন বেশি চাইলে 429 পাবে। 503 শুধু সার্ভার সত্যিই কষ্টে থাকলে।'
          - cells: ['client কী করবে', 'নিজের গতি কমাবে', 'একটু পরে আবার আসবে']
            tip: 'দুই ক্ষেত্রেই Retry-After header পাঠাও, নইলে client আন্দাজে চেষ্টা করবে আর ভিড় বাড়াবে।'
      - type: quote
        body: 'ঢোকার পরে timeout করানোর চেয়ে দরজাতেই "না" বলা সস্তা এবং ভদ্র।'
    aside:
      - type: terms
        items:
          - {term: 'Back-pressure', meaning: 'ভরা ধাপ সামনের ধাপকে "গতি কমাও" জানানো, যাতে ভিড় পেছনে জমে না।'}
          - {term: 'Bounded queue', meaning: 'যার সর্বোচ্চ আকার ঠিক করা আছে। ভরে গেলে নতুন জিনিস ঢোকে না।'}
          - {term: 'Retry-After', meaning: 'HTTP header: কত সেকেন্ড পরে আবার চেষ্টা করলে কাজ হবে।'}
      - type: remember
        body: 'লাইনের সীমা না থাকলে সেটা লাইন নয়, গর্ত। সীমা ছুঁলে সাথে সাথে "না"।'
      - type: refs
        items:
          - {to: 'api/rate-limiting', label: 'Per-user rate limit ও 429'}
    check:
      q: 'Load shedding-এ কিছু ব্যবহারকারীকে ফিরিয়ে দিলে সাইট খারাপ দেখায় না? কেন এটা তবু ভালো?'
      a: 'না ফেরালে সবাই ১২০ সেকেন্ড অপেক্ষা করে ব্যর্থ হতো। ফেরালে ৫০ জন দ্রুত সেবা পায়, বাকিরা সাথে সাথে জানে কখন আবার আসবে।'

  - slug: shed-with-rate-limiter
    title: 'Symfony RateLimiter দিয়ে কম জরুরি কাজ আগে ছাঁটো'
    kind: howto
    tldr: 'RateLimiter-এ কম জরুরি রুটের জন্য সার্বিক সীমা বসাও, সীমা ছুঁলে 503 ও Retry-After দাও। পেমেন্ট ও চেকআউট কখনো ছাঁটার তালিকায় রেখো না।'
    keywords: ['RateLimiter', 'token bucket', 'priority', 'critical traffic', 'শেডিং', 'Retry-After']
    blocks:
      - type: text
        body: |
          সব request সমান জরুরি নয়। ভিড়ে প্রথমে সার্চ, সুপারিশ আর রিপোর্টের মতো কাজ ছাঁটো, যাতে চেকআউট আর পেমেন্টের জন্য জায়গা বাঁচে। নিচে একটা token bucket বানানো হলো: সেকেন্ডে সর্বোচ্চ ৫০টা কম জরুরি request চলবে, key সবার জন্য এক (`global`)।
      - type: code
        lang: yaml
        file: 'config/packages/rate_limiter.yaml'
        variant: good
        code: |
          framework:
              rate_limiter:
                  low_priority:
                      policy: 'token_bucket'
                      limit: 100            # বালতিতে সর্বোচ্চ ১০০ টোকেন (ছোট ঝাঁকুনি সয়)
                      rate: { interval: '1 second', amount: 50 }   # প্রতি সেকেন্ডে ৫০ টোকেন ভরে
        marks:
          - {line: 3, tip: 'নাম low_priority থেকে Symfony autowiring-এর নাম হয় $lowPriorityLimiter।'}
          - {line: 5, tip: 'limit হলো বালতির আকার: হঠাৎ ১০০টা একসাথে এলেও সয়, কিন্তু টেকসই গতি ৫০/সেকেন্ডের বেশি নয়।'}
      - type: code
        lang: php
        file: 'src/EventListener/LoadSheddingListener.php'
        variant: good
        code: |
          #[AsEventListener(event: KernelEvents::REQUEST, priority: 30)]
          final class LoadSheddingListener
          {
              private const SHEDDABLE = ['/api/search', '/api/recommendations', '/api/reports'];

              public function __construct(private readonly RateLimiterFactory $lowPriorityLimiter)
              {
              }

              public function __invoke(RequestEvent $event): void
              {
                  $path = $event->getRequest()->getPathInfo();
                  $sheddable = array_filter(self::SHEDDABLE, fn ($p) => str_starts_with($path, $p));
                  if (!$event->isMainRequest() || [] === $sheddable) {
                      return;   // চেকআউট, পেমেন্ট, লগইন: কখনো ছাঁটা হবে না
                  }

                  $limit = $this->lowPriorityLimiter->create('global')->consume();
                  if ($limit->isAccepted()) {
                      return;
                  }

                  $wait = max(1, $limit->getRetryAfter()->getTimestamp() - time());
                  $event->setResponse(new JsonResponse(
                      ['error' => 'busy', 'message' => 'একটু পরে আবার চেষ্টা করুন'],
                      Response::HTTP_SERVICE_UNAVAILABLE,
                      ['Retry-After' => (string) $wait],
                  ));
              }
          }
        marks:
          - {line: 1, tip: 'priority 30: firewall-এর আগে চলে, তাই ছাঁটা request-এর জন্য auth-এর খরচও হয় না।'}
          - {line: 4, tip: 'ছাঁটার তালিকা পরিষ্কার লেখা: কোন পথ ত্যাগ করা যায়, আগে থেকে ঠিক করা।'}
          - {line: 24, tip: 'ছাঁটা request এখানেই শেষ। controller, ডেটাবেস বা বাইরের API-তে এর কোনো খরচ পড়ে না।'}
      - type: points
        title: 'কোন কাজ আগে ছাঁটবে'
        style: number
        items:
          - 'সবার আগে: রিপোর্ট, export, ব্যাকগ্রাউন্ডে পিছানো যায় এমন কাজ'
          - 'তারপর: সার্চ, সুপারিশ, লাইভ কাউন্টার — ছাড়া চলে'
          - 'সবশেষে: ব্রাউজিং। এটা ছাঁটলে ব্যবহারকারী সাইট ছাড়ে'
          - 'কখনো না: পেমেন্ট, চেকআউট, লগইন, health check'
    aside:
      - type: tips
        items:
          - 'সার্বিক সীমা মাপার আগে ছাঁটার তালিকা ছোট রাখো: ৩–৪টা পথই যথেষ্ট, বেশি হলে ভুল পথ ছাঁটার ঝুঁকি বাড়ে।'
          - 'প্রথমে শুধু log করো কতগুলো ছাঁটা হতো, তারপর চালু করো। সীমা আন্দাজে বসালে ভুলে সুস্থ ট্রাফিক ছাঁটবে।'
          - 'সার্বিক সীমা একাধিক সার্ভারের মধ্যে ভাগাভাগি করতে limiter-এর cache pool হিসেবে Redis দাও, নইলে প্রতি সার্ভারের আলাদা হিসাব হয়।'
      - type: when
        use: ['ভিড় হঠাৎ বাড়লে কম জরুরি রুট বাঁচানোর জন্য', 'ক্যাম্পেইন বা সেলের আগে রক্ষাকবচ হিসেবে']
        avoid: ['সীমা না মেপে বসানো সংখ্যায়', 'পেমেন্ট বা auth রুটে']
      - type: refs
        items:
          - {to: 'api/rate-limiting', label: 'Rate limit-এর বিভিন্ন policy'}
    check:
      q: 'ছাঁটার listener-কে controller-এর বদলে kernel.request-এ বসানো হলো কেন?'
      a: 'ছাঁটা request controller, ডেটাবেস ও বাইরের API পর্যন্ত যায় না। ফলে ছাঁটার খরচ প্রায় শূন্য, আর সেই বাঁচানো ক্ষমতা জরুরি কাজে লাগে।'

  - slug: unbounded-queue-trap
    title: 'ফাঁদ: "queue-তে ঢুকিয়ে দাও, পরে হবে"'
    kind: pitfall
    tldr: 'সীমাহীন queue ভিড়কে লুকায়, মেটায় না। লাইন ঘণ্টার পর ঘণ্টা বাড়ে, বাসি কাজ চলে। queue-র গভীরতা মেপে সীমা ছুঁলে 503 দাও।'
    keywords: ['Messenger', 'queue depth', 'MessageCountAwareInterface', 'stale job', 'bounded queue', '202 Accepted']
    blocks:
      - type: text
        body: |
          CRUD অ্যাপে ভারী কাজ queue-তে পাঠিয়ে `202 Accepted` দেওয়াই আমাদের অভ্যাস। কিন্তু worker-এর গতির চেয়ে বেশি message এলে queue প্রতি মিনিটে লম্বা হয়। ঘণ্টাখানেক পরে ব্যবহারকারী যে রিপোর্ট চেয়েছিল, সে আরও দশবার চেয়ে ফেলেছে। সবগুলোই queue-তে আছে, আর worker ওই বাসি কাজই বানিয়ে যাচ্ছে।
      - type: code
        lang: php
        file: 'src/Controller/ReportController.php'
        variant: bad
        code: |
          #[Route('/api/reports', methods: ['POST'])]
          public function create(MessageBusInterface $bus): JsonResponse
          {
              // queue-তে কয়টা জমে আছে, কেউ দেখে না
              $bus->dispatch(new BuildSalesReport($this->getUser()->getId()));

              return new JsonResponse(['status' => 'queued'], Response::HTTP_ACCEPTED);
          }
        marks:
          - {line: 5, tip: 'queue যত লম্বাই হোক, নতুন কাজ ঢোকে। অপেক্ষার সময় বাড়ে ঘণ্টা থেকে দিনে।'}
          - {line: 7, tip: '202 মানে "নিলাম", "করে দেব" নয়। কখন হবে সে প্রতিশ্রুতি এখানে নেই।'}
      - type: code
        lang: php
        file: 'src/Controller/ReportController.php'
        variant: good
        code: |
          public function __construct(
              #[Autowire(service: 'messenger.transport.reports')]
              private readonly MessageCountAwareInterface $reports,
          ) {
          }

          #[Route('/api/reports', methods: ['POST'])]
          public function create(MessageBusInterface $bus): JsonResponse
          {
              if ($this->reports->getMessageCount() >= 500) {   // queue-র সীমা
                  return new JsonResponse(
                      ['error' => 'busy'],
                      Response::HTTP_SERVICE_UNAVAILABLE,
                      ['Retry-After' => '60'],
                  );
              }

              $bus->dispatch(new BuildSalesReport($this->getUser()->getId()));

              return new JsonResponse(['status' => 'queued'], Response::HTTP_ACCEPTED);
          }
        marks:
          - {line: 2, tip: 'Doctrine, Redis ও AMQP transport MessageCountAwareInterface implement করে। in-memory বা sync transport-এ এটা নেই।'}
          - {line: 10, tip: 'getMessageCount() এখন অপেক্ষারত message গোনে। ৫০০ হলো এই queue-র সীমা: worker প্রতি মিনিটে ১০০টা করলে সর্বোচ্চ ৫ মিনিট অপেক্ষা।'}
      - type: quote
        body: 'প্রতিটা queue-র একটা সর্বোচ্চ গভীরতা থাকবে, আর সেটা ছুঁলে নতুন কাজ ফেরানো হবে।'
    aside:
      - type: pitfalls
        items:
          - 'সীমা ঠিক করো worker-এর গতি দিয়ে: সীমা ÷ প্রতি মিনিটে সামলানো = সর্বোচ্চ অপেক্ষা। সেই অপেক্ষা সহ্য করা যাবে কি না ভাবো।'
          - 'শুধু সীমাই যথেষ্ট নয়: কাজ বাসি হয়ে গেলে handler-এ সময় দেখে বাদ দাও, নইলে worker পুরোনো কাজ বানাবে।'
          - 'সার্ভার নিজেকে বাঁচাতে php-fpm-এ pm.max_children আর nginx-এ কাজের উপযোগী timeout বসাও, যাতে এক request অন্যের জায়গা না খায়।'
      - type: refs
        items:
          - {to: 'messaging/background-jobs', label: 'Messenger ও ব্যাকগ্রাউন্ড জব'}
          - {to: 'resilience/graceful-degradation', label: 'ফেরানোর বদলে কিছু একটা দেওয়া'}
    check:
      q: 'Queue-র সীমা ৫০০, worker প্রতি মিনিটে ১০০টা শেষ করে। সীমা ছুঁলে সবচেয়ে পরে ঢোকা message-এর অপেক্ষা সর্বোচ্চ কত?'
      a: '৫০০ ÷ ১০০ = ৫ মিনিট। এই হিসাব করেই সীমা ঠিক করা উচিত: অপেক্ষা ব্যবহারকারীর সহ্যের মধ্যে থাকবে, নইলে সীমা কমাও।'

flashcards:
  - q: 'Load shedding কী?'
    a: 'ক্ষমতার বেশি request এলে অতিরিক্তগুলো দরজাতেই সাথে সাথে ফিরিয়ে দেওয়া, যাতে বাকিরা ঠিকমতো সেবা পায়।'
    more: |
      সবাইকে ঢুকতে দিলে লাইন লম্বা হয়, উত্তর আসে timeout-এর পরে, আর কেউই সেবা পায় না। সীমার বেশিটা ফেরালে ঢোকা request-গুলো পুরো গতিতে চলে। ফেরানো request-কে জানিয়ে দাও কখন আবার আসতে হবে।
    ref: reject-early
  - q: 'Back-pressure কী?'
    a: 'ভরা ধাপ সামনের ধাপকে জানিয়ে দেয় "গতি কমাও", যাতে ভিড় অদৃশ্য লাইনে না জমে পেছনে চাপ ফেরে।'
    more: |
      উদাহরণ: queue ভরা থাকলে controller 503 ফেরায়, ফলে client বা সামনের সার্ভিস নিজেই কাজ পাঠানো কমায়। সমস্যাটা যেখানে তৈরি হচ্ছে, সেখানেই চাপ ফেরত যায়। উল্টো হলো সবকিছু চুপচাপ মেনে নিয়ে ভেতরে জমানো।
    ref: reject-early
  - q: 'Overload হলে goodput কেন কমে যায়?'
    a: 'লাইন এত লম্বা হয় যে উত্তর ব্যবহারকারীর timeout-এর পরে আসে। সার্ভার খাটে, কিন্তু কারো কাজে লাগে না।'
    more: |
      Goodput মানে ব্যবহারকারী সময়মতো যে উত্তর পেল। সার্ভার ব্যস্ত থাকা আর কাজ হওয়া এক জিনিস নয়। ক্ষমতার বেশি ঢুকতে দিলে ব্যস্ততা ১০০% থাকে, কিন্তু goodput প্রায় শূন্যে নামে।
    ref: line-grows-forever
  - q: 'Bounded queue বলতে কী বোঝায়, আর সীমাহীন queue কেন বিপজ্জনক?'
    a: 'Bounded queue-র সর্বোচ্চ আকার ঠিক করা, ভরলে নতুন কাজ ফেরানো হয়। সীমাহীনটা অপেক্ষা, মেমোরি ও বাসি কাজ অনির্দিষ্ট বাড়ায়।'
    more: |
      সীমাহীন queue সমস্যা লুকায়: request ঢোকে, তাই সব ঠিক মনে হয়। অথচ অপেক্ষা মিনিট থেকে ঘণ্টা হয়ে যায়। সীমা ঠিক করো এভাবে: সীমা ÷ worker-এর গতি = সর্বোচ্চ অপেক্ষা।
    ref: unbounded-queue-trap
  - q: '429 আর 503 কখন দেবে?'
    a: '429: একজন client নিজের সীমা ছাড়িয়েছে। 503: সার্ভার নিজে অতিব্যস্ত, কারো একার দোষ নয়।'
    more: |
      Rate limiting ব্যক্তিগত, shedding সার্বিক। দুই ক্ষেত্রেই Retry-After header দাও, নইলে client আন্দাজে তাড়াতাড়ি আবার চেষ্টা করবে এবং ভিড় আরও বাড়াবে।
    ref: reject-early
  - q: 'Retry-After header কেন দেবে?'
    a: 'এটা client-কে বলে কত সেকেন্ড পরে আবার চেষ্টা করলে কাজ হবে, ফলে সে আন্দাজে ঘন ঘন চেষ্টা করে না।'
    more: |
      Retry-After ছাড়া ফেরানো client সাথে সাথে আবার পাঠায়, এতে ভিড় দ্বিগুণ হয়। সেকেন্ডের সংখ্যা বা তারিখ দুটোই দেওয়া যায়। Symfony RateLimiter-এ `getRetryAfter()` থেকে এটা পাওয়া যায়।
    ref: shed-with-rate-limiter
  - q: 'ভিড়ে কোন ধরনের কাজ সবার আগে ছাঁটবে, আর কোনগুলো কখনো না?'
    a: 'আগে রিপোর্ট ও export, তারপর সার্চ ও সুপারিশ। পেমেন্ট, চেকআউট, লগইন ও health check কখনো ছাঁটা হয় না।'
    more: |
      সিদ্ধান্তটা ভিড় আসার আগে নেওয়া দরকার, তখন তাড়াহুড়োয় ভুল হবে। ছাঁটার তালিকা কোডে স্পষ্ট লেখো। ব্যবসার আয় যে কাজে আসে, সেটাকে সবচেয়ে বেশি রক্ষা করো।
    ref: shed-with-rate-limiter
  - q: 'ছাঁটার সিদ্ধান্ত kernel.request-এ নেওয়া হয় কেন, controller-এ নয়?'
    a: 'ছাঁটা request ডেটাবেস বা বাইরের API পর্যন্ত যায় না, তাই ছাঁটার খরচ প্রায় শূন্য এবং ক্ষমতা জরুরি কাজে বাঁচে।'
    more: |
      Controller-এ পৌঁছানোর আগেই auth, session, ORM-এর খরচ হয়ে যায়। শুরুতে priority বেশি দিয়ে listener বসালে এসব খরচ বাঁচে। প্রত্যাখ্যান যত দরজার কাছে হবে, ততো সস্তা।
    ref: shed-with-rate-limiter

quiz:
  - q: 'রহিমের API সেকেন্ডে ৫০টা request সামলায়, কিন্তু সেলের দিনে সেকেন্ডে ৬০টা আসছে। সে কোনো সীমা বসায়নি। ১০ মিনিট পরে কী দেখা যাবে?'
    hint: 'প্রতি সেকেন্ডে ১০টা করে বেশি আসছে। সেগুলো কোথায় যাচ্ছে?'
    options:
      - text: 'লাইনে প্রায় ৬,০০০ request, অপেক্ষা প্রায় ২ মিনিট, আর বেশিরভাগ উত্তর পৌঁছাচ্ছে ব্যবহারকারী চলে যাওয়ার পর'
        correct: true
        why: '১০ × ৬০০ = ৬,০০০ জমা। ÷ ৫০ = ১২০ সেকেন্ড। ততক্ষণে ক্লায়েন্ট timeout করে গেছে, তাই সার্ভারের পরিশ্রম নিষ্ফল।'
      - text: 'সার্ভার ধীরে ধীরে সামলে নেবে, কারণ ভিড় এক সময় কমবে'
        correct: false
        why: 'ভিড় কমার আগে লাইন বাড়তেই থাকে, আর লাইন শেষ হতে অনেক দেরি হয়। এর মধ্যে ব্যবহারকারীরা রিফ্রেশ করে আরও চাপ বাড়ায়।'
      - text: 'সব request ১ সেকেন্ডে সামান্য ধীর হবে, কিন্তু সফল হবে'
        correct: false
        why: 'দেরি ধীরে নয়, ক্রমাগত বাড়ে। লাইনের শেষের জনের অপেক্ষা প্রতি সেকেন্ডে লম্বা হয়।'
      - text: 'শুধু ১০টা বাড়তি request ব্যর্থ হবে, বাকি ৫০টা ঠিক থাকবে'
        correct: false
        why: 'সীমা না থাকলে "বাড়তি" কেউ আলাদা চিহ্নিত নয়। লাইন সবার সামনে ধীরে ধীরে দেরি বাড়ায়, আর শেষে সবাই ক্ষতিগ্রস্ত।'
    ref: line-grows-forever
  - q: 'কোন পরিস্থিতিতে 429, আর কোনটাতে 503 দেওয়া ঠিক?'
    hint: 'সমস্যা কার: একজন client-এর, না পুরো সার্ভারের?'
    options:
      - text: 'একজন API key মিনিটে ১০০-র বেশি চাইলে 429'
        correct: true
        why: '429 ওই client-এর নিজের সীমা ছাড়ানোর জন্য। সে গতি কমালে ঠিক হয়ে যায়।'
      - text: 'সেলের ভিড়ে সার্ভার ভরা হলে, যে কোনো কম জরুরি request-এ 503'
        correct: true
        why: '503 মানে সার্ভার এখন সামলাতে পারছে না, দোষ কোনো একজনের নয়। Retry-After সহ দিলে client জানে কখন ফিরবে।'
      - text: 'সার্ভার ভরা হলে সবাইকে 429 দেওয়া'
        correct: false
        why: '429 বললে client ভাববে সে-ই বেশি চেয়েছে, অথচ দোষ সার্বিক ভিড়ের। ভুল সংকেত ভুল আচরণ ডেকে আনে।'
      - text: 'ভরা হলে 200 দিয়ে খালি JSON পাঠানো'
        correct: false
        why: '200 মানে সফল। খালি উত্তর client-কে ভুল বোঝায় এবং retry-র সুযোগ কেড়ে নেয়।'
    ref: reject-early
  - q: 'নিচের listener-এ ছাঁটার সীমা পেরোলে কী ফেরানো হচ্ছে, আর একটা ভুল কোথায়?'
    lang: php
    code: |
      $limit = $this->lowPriorityLimiter->create('global')->consume();
      if (!$limit->isAccepted()) {
          $event->setResponse(new JsonResponse(['error' => 'busy'], 500));
      }
    hint: 'status code-টা ক্লায়েন্টকে কী বলছে? আর ক্লায়েন্ট কখন আবার আসবে, তা কোথায় বলা?'
    options:
      - text: '500 ভুল, উচিত 503; আর Retry-After header নেই'
        correct: true
        why: '500 মানে সার্ভারে বাগ। এখানে ইচ্ছাকৃত ফেরানো, তাই 503। Retry-After না থাকলে client আন্দাজে ঘন ঘন আসবে।'
      - text: 'কোনো ভুল নেই, 500 ঠিক আছে'
        correct: false
        why: '500 alert বাজাবে এবং বাগ মনে হবে। ইচ্ছাকৃত ছাঁটা আর বাগ আলাদা করে চেনা দরকার।'
      - text: 'consume() ব্যবহার করা ভুল, reserve() দিতে হবে'
        correct: false
        why: 'consume() টোকেন থাকলে সাথে সাথে নেয়, না থাকলে অপেক্ষা ছাড়া ব্যর্থ হয়। shedding-এ সেটাই চাই।'
      - text: '`create(''global'')` ভুল, প্রতি ব্যবহারকারীর key দিতে হবে'
        correct: false
        why: 'এখানে সার্বিক ক্ষমতা বাঁচানোই লক্ষ্য, তাই সবার জন্য এক key। প্রতি-ব্যবহারকারী key হলো আলাদা per-user rate limit।'
    ref: shed-with-rate-limiter
  - q: 'একটা সাইটে ভিড়ের সময় কোন request সবার শেষে ছাঁটা উচিত?'
    hint: 'ব্যবসার আয় আর ব্যবহারকারীর আস্থা কোনটাতে বেশি জড়িত?'
    options:
      - text: 'পেমেন্ট নিশ্চিত করার request'
        correct: true
        why: 'এখানে ব্যবহারকারী টাকা দিয়ে ফেলেছে বা দিতে যাচ্ছে। ছাঁটলে আয় যায়, আর অনিশ্চিত পেমেন্টের ঝামেলা বাড়ে।'
      - text: 'মাসিক বিক্রির রিপোর্ট export'
        correct: false
        why: 'এটা পরে করলেও কারো ক্ষতি নেই। এ কারণে এটাই সবার আগে ছাঁটার তালিকায়।'
      - text: 'সার্চের "আপনার জন্য সুপারিশ" অংশ'
        correct: false
        why: 'সুপারিশ ছাড়া সাইট চলে। ছাঁটার তালিকার দ্বিতীয় ধাপ।'
      - text: 'লাইভ "এখন কতজন দেখছে" কাউন্টার'
        correct: false
        why: 'কাউন্টার সাজসজ্জা, অপরিহার্য নয়। সবচেয়ে সহজে ছাঁটা যায়।'
    ref: shed-with-rate-limiter
  - q: 'Reports queue-তে ৫০০টা সীমা। worker প্রতি মিনিটে ১০০টা শেষ করে, আর কেউ ১০ মিনিটের বেশি অপেক্ষা সহ্য করবে না। কোনগুলো সঠিক সিদ্ধান্ত?'
    hint: 'সীমা ÷ গতি = অপেক্ষা। আর শুধু সীমাই কি বাসি কাজ ঠেকায়?'
    options:
      - text: 'সীমা ৫০০ থাকলে সর্বোচ্চ অপেক্ষা ৫ মিনিট, সহ্যের মধ্যে — সীমা রাখা যায়'
        correct: true
        why: '৫০০ ÷ ১০০ = ৫ মিনিট, ১০ মিনিটের নিচে। সীমা সহ্যের মধ্যে আছে।'
      - text: 'সীমা ছুঁলে নতুন request-এ 503 ও Retry-After দেওয়া'
        correct: true
        why: 'এভাবে queue বাড়ে না, ব্যবহারকারীও জানে আবার কখন আসবে। এটাই back-pressure।'
      - text: 'সীমা তুলে দিয়ে worker-এর সংখ্যা ১ রাখা, দিন শেষে সব শেষ হবে'
        correct: false
        why: 'সীমা না থাকলে অপেক্ষা ঘণ্টায় গিয়ে ঠেকে, আর বাসি request-ও চলে। ব্যবহারকারী তখন উত্তরই চায় না।'
      - text: 'queue ভরা থাকলে পুরোনো message মুছে নতুনগুলো ঢোকানো, কোনো জানানো ছাড়া'
        correct: false
        why: 'চুপচাপ কাজ ফেলে দেওয়া ডেটা হারানোর শামিল। আগে ফেরানোই ভদ্র ও নিরাপদ।'
    ref: unbounded-queue-trap
