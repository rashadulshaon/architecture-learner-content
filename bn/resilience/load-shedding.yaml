    check:
      q: 'ছাঁটার listener-কে controller-এর বদলে kernel.request-এ বসানো হলো কেন?'
      a: 'ছাঁটা request controller, ডেটাবেস ও বাইরের API পর্যন্ত যায় না। ফলে ছাঁটার খরচ প্রায় শূন্য, আর সেই বাঁচানো ক্ষমতা জরুরি কাজে লাগে।'

  - slug: shed-when-overloaded
    title: 'সার্ভার হাঁপালে তবেই ছাঁটুন'
    kind: howto
    tldr: 'নির্দিষ্ট সীমা সার্ভার খালি থাকলেও মানুষ ফেরায়। আগে overload-এর সংকেত দেখুন, সার্ভার সত্যিই হাঁপালে তবেই সীমা কার্যকর করুন।'
    keywords: ['overload signal', 'load average', 'adaptive shedding', 'sys_getloadavg', 'fixed cap', 'ওভারলোড সংকেত']
    blocks:
      - type: text
        body: |
          ভোর ৩টার কথা ভাবুন: সার্ভার ১০% ব্যস্ত, সেকেন্ডে ৮০টা সার্চ আসছে, আর সীমা ৫০। প্রতি সেকেন্ডে ৩০ জন বিনা কারণে ফিরে যাচ্ছে। যেন ড্রয়ারে অর্ধেক টিকিট পড়ে থাকতেও কর্মী চেঁচাচ্ছে "টিকিট শেষ"। সত্যিকারের shedding শুরু হয় যখন সার্ভার নিজে বলে "আমি হাঁপাচ্ছি"। তাই listener আগে একটা overload সংকেত দেখে, উত্তর "হ্যাঁ" হলেই সীমা খাটায়।
      - type: visual
        kind: compare
        caption: 'একই সীমা: সার্ভারের অবস্থা দেখে এবং না দেখে'
        columns:
          - title: 'শুধু নির্দিষ্ট সীমা'
            tone: bad
            icon: cross
            tip: 'সীমাটা কারও আন্দাজে বসানো একটা সংখ্যা। সার্ভার কেমন আছে, সে প্রশ্ন সে করে না।'
            items: ['ভোর ৩টা, সার্ভার ১০% ব্যস্ত, সেকেন্ডে ৮০টা সার্চ: ৩০টা বিনা কারণে ফেরত', 'সার্ভার ১০% হোক বা ১০০%, সীমা একই থাকে']
          - title: 'সীমা + overload সংকেত'
            tone: good
            icon: check
            tip: 'কখন ফেরানো হবে তা ঠিক করে সংকেত। সীমা শুধু ঠিক করে তখনও কতটা ঢুকবে।'
            items: ['ভোর ৩টা: সংকেত বলে সুস্থ, ৮০টা সার্চই সেবা পায়', 'সেলের দিনে: সংকেত বলে overload, ৫০-এর সীমা খাটে, বাকিরা 503 পায়', 'দুই অবস্থাতেই চেকআউট ও পেমেন্ট কখনো তালিকায় নেই']
          - title: 'এর দাম'
            tone: warn
            icon: warning
            tip: 'প্রতিটা সুপারিশের একটা দাম আছে। কোড কপি করার আগে সেটা জেনে নিন।'
            items: ['Load average এক মিনিটের গড়, তাই ছাঁটা শুরু ও শেষ দুটোই দেরিতে', 'প্রতিটা সার্ভার শুধু নিজেকে মাপে: একটা ছাঁটে, পাশেরটা খালি পড়ে থাকে', 'চাহিদা সবসময় ক্ষমতার অনেক নিচে থাকলে এটা লাগে না']
      - type: code
        lang: php
        file: 'src/Service/OverloadDetector.php'
        variant: good
        code: |
          final class OverloadDetector
          {
              public function __construct(
                  #[Autowire(env: 'int:CPU_CORES')]
                  private readonly int $cores,
              ) {
              }

              public function isOverloaded(): bool
              {
                  // গত মিনিটে গড়ে কয়টা কাজ CPU core-এর জন্য চলছিল বা অপেক্ষায় ছিল
                  return sys_getloadavg()[0] > 1.5 * $this->cores;
              }
          }
        marks:
          - {line: 12, tip: 'core-প্রতি প্রায় ১টা কাজ মানে CPU পুরো ব্যবহৃত। core-প্রতি ১.৫ মানে কাজ core-এর জন্য লাইনে দাঁড়াচ্ছে।'}
      - type: code
        lang: php
        file: 'src/EventListener/LoadSheddingListener.php'
        variant: good
        code: |
          #[AsEventListener(event: KernelEvents::REQUEST, priority: 30)]
          final class LoadSheddingListener
          {
              private const SHEDDABLE = ['/api/search', '/api/recommendations', '/api/reports'];

              public function __construct(
                  private readonly RateLimiterFactory $lowPriorityLimiter,
                  private readonly OverloadDetector $overload,
              ) {
              }

              public function __invoke(RequestEvent $event): void
              {
                  $path = $event->getRequest()->getPathInfo();
                  $sheddable = array_filter(self::SHEDDABLE, fn ($p) => str_starts_with($path, $p));
                  if (!$event->isMainRequest() || [] === $sheddable) {
                      return;   // চেকআউট, পেমেন্ট, লগইন: কখনো ছাঁটা হবে না
                  }
                  if (!$this->overload->isOverloaded()) {
                      return;   // সার্ভার সুস্থ: সীমা নেই, সবাইকে সেবা দিন
                  }
                  if (!$this->lowPriorityLimiter->create('global')->consume()->isAccepted()) {
                      $event->setResponse(new JsonResponse(
                          ['error' => 'busy'],
                          Response::HTTP_SERVICE_UNAVAILABLE,
                          ['Retry-After' => '2'],
                      ));
                  }
              }
          }
        marks:
          - {line: 19, tip: 'নতুন ফটক: সার্ভার সুস্থ থাকলে listener এখানেই ফিরে যায়, সীমা দেখাই হয় না।'}
          - {line: 22, tip: 'শুধু overload হলেই bucket পর্যন্ত পৌঁছায়। সেকেন্ডে ৫০-এর বরাদ্দের ভেতরে থাকলে request তবু ঢোকে, বাকিরা 503 পায়।'}
      - type: quote
        body: 'যে সীমা সার্ভারের দিকে তাকায় না, সেটা বরাদ্দ। সার্ভার হাঁপালে তবেই shedding শুরু।'
    aside:
      - type: tips
        items:
          - '১.৫ × core-এর রেখাটা শুরুর আন্দাজ। স্বাভাবিক ব্যস্ত ঘণ্টায় load average log করে দেখুন, রেখা তার ওপরে বসান।'
          - 'request যদি বেশি সময় ডেটাবেস বা API-র অপেক্ষায় থাকে, CPU শান্ত থাকে অথচ request জমে। তখন চলমান request-এর সংখ্যা বা queue-র গভীরতা গুনুন।'
          - 'detector আলাদা class-এ রাখুন, যাতে পরে load average বদলে queue-র গভীরতা বা ধীর উত্তর বসানো যায়।'
      - type: terms
        items:
          - {term: 'Load average', meaning: 'গত এক মিনিটে গড়ে কয়টা কাজ CPU core-এর জন্য চলছিল বা অপেক্ষায় ছিল। core-এর সংখ্যার সমান মানে পুরো ব্যস্ত।'}
          - {term: 'Overload সংকেত', meaning: 'সার্ভার হাঁপাচ্ছে কি না, তা এক নজরে জানার সংখ্যা: load average, ব্যস্ত worker, queue-র গভীরতা, ধীর উত্তর।'}
    check:
      q: 'ভোর ৩টায় সার্ভার খালি, তবু সেকেন্ডে ৮০টা সার্চ আসছে আর সীমা ৫০। নির্দিষ্ট সীমা কী করে, আর overload-এর পরীক্ষা কী বদলায়?'
      a: 'নির্দিষ্ট সীমা সেকেন্ডে ৩০টা বিনা কারণে ফেরায়। পরীক্ষা থাকলে সার্ভার সুস্থ থাকা পর্যন্ত কাউকে ফেরানো হয় না; overload জানালে তবেই সীমা খাটে।'

  - slug: unbounded-queue-trap
    title: 'ফাঁদ: "আপাতত queue-তে রাখি, পরে হবে"'
    kind: pitfall
    tldr: 'সীমাহীন queue ভিড়কে লুকায়, মেটায় না। লাইন ঘণ্টার পর ঘণ্টা বাড়ে, বাসি কাজ চলে। queue-র গভীরতা মেপে সীমা ছুঁলে 503 দিন।'
    keywords: ['Messenger', 'queue depth', 'MessageCountAwareInterface', 'stale job', 'bounded queue', '202 Accepted']
    blocks:
      - type: text
        body: |
          CRUD অ্যাপে ভারী কাজ queue-তে পাঠিয়ে `202 Accepted` দেওয়াই আমাদের অভ্যাস। কিন্তু worker-এর গতির চেয়ে বেশি message এলে queue প্রতি মিনিটে লম্বা হয়। ঘণ্টাখানেক পরে ব্যবহারকারী যে রিপোর্ট চেয়েছিল, সে আরও দশবার চেয়ে ফেলেছে। সবগুলোই queue-তে আছে, আর worker ওই বাসি কাজই বানিয়ে যাচ্ছে।
      - type: code
        lang: php
        file: 'src/Controller/ReportController.php'
        variant: bad
        code: |
          #[Route('/api/reports', methods: ['POST'])]
          public function create(MessageBusInterface $bus): JsonResponse
          {
              // queue-তে কয়টা জমে আছে, কেউ দেখে না
              $bus->dispatch(new BuildSalesReport($this->getUser()->getId()));

              return new JsonResponse(['status' => 'queued'], Response::HTTP_ACCEPTED);
          }
        marks:
          - {line: 5, tip: 'queue যত লম্বাই হোক, নতুন কাজ ঢোকে। অপেক্ষার সময় বাড়ে ঘণ্টা থেকে দিনে।'}
          - {line: 7, tip: '202 মানে "নিলাম", "করে দেব" নয়। কখন হবে সে প্রতিশ্রুতি এখানে নেই।'}
      - type: code
        lang: php
        file: 'src/Controller/ReportController.php'
        variant: good
        code: |
          public function __construct(
              #[Autowire(service: 'messenger.transport.reports')]
              private readonly MessageCountAwareInterface $reports,
          ) {
          }

          #[Route('/api/reports', methods: ['POST'])]
          public function create(MessageBusInterface $bus): JsonResponse
          {
              if ($this->reports->getMessageCount() >= 500) {   // queue-র সীমা
                  return new JsonResponse(
                      ['error' => 'busy'],
                      Response::HTTP_SERVICE_UNAVAILABLE,
                      ['Retry-After' => '60'],
                  );
              }

              $bus->dispatch(new BuildSalesReport($this->getUser()->getId()));

              return new JsonResponse(['status' => 'queued'], Response::HTTP_ACCEPTED);
          }
        marks:
          - {line: 2, tip: 'Doctrine, Redis ও AMQP transport MessageCountAwareInterface implement করে। in-memory বা sync transport-এ এটা নেই।'}
          - {line: 10, tip: 'getMessageCount() এখন অপেক্ষারত message গোনে। ৫০০ হলো এই queue-র সীমা: worker প্রতি মিনিটে ১০০টা করলে সর্বোচ্চ ৫ মিনিট অপেক্ষা।'}
      - type: quote
        body: 'প্রতিটা queue-র একটা সর্বোচ্চ গভীরতা থাকবে, আর সেটা ছুঁলে নতুন কাজ ফেরানো হবে।'
    aside:
      - type: pitfalls
        items:
          - 'সীমা ঠিক করুন worker-এর গতি দিয়ে: সীমা ÷ প্রতি মিনিটে সামলানো = সর্বোচ্চ অপেক্ষা। সেই অপেক্ষা সহ্য করা যাবে কি না ভাবুন।'
          - 'শুধু সীমাই যথেষ্ট নয়: কাজ বাসি হয়ে গেলে handler-এ সময় দেখে বাদ দিন, নইলে worker পুরোনো কাজ বানাবে।'
          - 'সার্ভার নিজেকে বাঁচাতে php-fpm-এ pm.max_children আর nginx-এ কাজের উপযোগী timeout বসান, যাতে এক request অন্যের জায়গা না খায়।'
      - type: refs
        items:
          - {to: 'messaging/background-jobs', label: 'Messenger ও ব্যাকগ্রাউন্ড জব'}
          - {to: 'resilience/graceful-degradation', label: 'ফেরানোর বদলে কিছু একটা দেওয়া'}
    check:
      q: 'Queue-র সীমা ৫০০, worker প্রতি মিনিটে ১০০টা শেষ করে। সীমা ছুঁলে সবচেয়ে পরে ঢোকা message-এর অপেক্ষা সর্বোচ্চ কত?'
      a: '৫০০ ÷ ১০০ = ৫ মিনিট। এই হিসাব করেই সীমা ঠিক করা উচিত: অপেক্ষা ব্যবহারকারীর সহ্যের মধ্যে থাকবে, নইলে সীমা কমান।'

flashcards:
  - q: 'Load shedding কী?'
    a: 'ক্ষমতার বেশি request এলে অতিরিক্তগুলো দরজাতেই সাথে সাথে ফিরিয়ে দেওয়া, যাতে বাকিরা ঠিকমতো সেবা পায়।'
    more: |
      সবাইকে ঢুকতে দিলে লাইন লম্বা হয়, উত্তর আসে timeout-এর পরে, আর কেউই সেবা পায় না। সীমার বেশিটা ফেরালে ঢোকা request-গুলো পুরো গতিতে চলে। ফেরানো request-কে জানিয়ে দিন কখন আবার আসতে হবে।
    ref: reject-early
  - q: 'Back-pressure কী?'
    a: 'ভরা ধাপ সামনের ধাপকে জানিয়ে দেয় "গতি কমান", যাতে ভিড় অদৃশ্য লাইনে না জমে পেছনে চাপ ফেরে।'
    more: |
      উদাহরণ: queue ভরা থাকলে controller 503 ফেরায়, ফলে client বা সামনের সার্ভিস নিজেই কাজ পাঠানো কমায়। সমস্যাটা যেখানে তৈরি হচ্ছে, সেখানেই চাপ ফেরত যায়। উল্টো হলো সবকিছু চুপচাপ মেনে নিয়ে ভেতরে জমানো।
    ref: reject-early
  - q: 'Overload হলে goodput কেন কমে যায়?'
    a: 'লাইন এত লম্বা হয় যে উত্তর ব্যবহারকারীর timeout-এর পরে আসে। সার্ভার খাটে, কিন্তু কারো কাজে লাগে না।'
    more: |
      Goodput মানে ব্যবহারকারী সময়মতো যে উত্তর পেল। সার্ভার ব্যস্ত থাকা আর কাজ হওয়া এক জিনিস নয়। ক্ষমতার বেশি ঢুকতে দিলে ব্যস্ততা ১০০% থাকে, কিন্তু goodput প্রায় শূন্যে নামে।
    ref: line-grows-forever
  - q: 'Bounded queue বলতে কী বোঝায়, আর সীমাহীন queue কেন বিপজ্জনক?'
    a: 'Bounded queue-র সর্বোচ্চ আকার ঠিক করা, ভরলে নতুন কাজ ফেরানো হয়। সীমাহীনটা অপেক্ষা, মেমোরি ও বাসি কাজ অনির্দিষ্ট বাড়ায়।'
    more: |
      সীমাহীন queue সমস্যা লুকায়: request ঢোকে, তাই সব ঠিক মনে হয়। অথচ অপেক্ষা মিনিট থেকে ঘণ্টা হয়ে যায়। সীমা ঠিক করুন এভাবে: সীমা ÷ worker-এর গতি = সর্বোচ্চ অপেক্ষা।
    ref: unbounded-queue-trap
  - q: '429 আর 503 কখন দেবেন?'
    a: '429: একজন client নিজের সীমা ছাড়িয়েছে। 503: সার্ভার নিজে অতিব্যস্ত, কারো একার দোষ নয়।'
    more: |
      Rate limiting ব্যক্তিগত, shedding সার্বিক। দুই ক্ষেত্রেই Retry-After header দিন, নইলে client আন্দাজে তাড়াতাড়ি আবার চেষ্টা করবে এবং ভিড় আরও বাড়াবে।
    ref: reject-early
  - q: 'Retry-After header কেন দেবেন?'
    a: 'এটা client-কে বলে কত সেকেন্ড পরে আবার চেষ্টা করলে কাজ হবে, ফলে সে আন্দাজে ঘন ঘন চেষ্টা করে না।'
    more: |
      Retry-After ছাড়া ফেরানো client সাথে সাথে আবার পাঠায়, এতে ভিড় দ্বিগুণ হয়। সেকেন্ডের সংখ্যা বা তারিখ দুটোই দেওয়া যায়। Symfony RateLimiter-এ `getRetryAfter()` থেকে এটা পাওয়া যায়।
    ref: shed-with-rate-limiter
  - q: 'ভিড়ে কোন ধরনের কাজ সবার আগে ছাঁটবেন, আর কোনগুলো কখনো না?'
    a: 'আগে রিপোর্ট ও export, তারপর সার্চ ও সুপারিশ। পেমেন্ট, চেকআউট, লগইন ও health check কখনো ছাঁটা হয় না।'
    more: |
      সিদ্ধান্তটা ভিড় আসার আগে নেওয়া দরকার, তখন তাড়াহুড়োয় ভুল হবে। ছাঁটার তালিকা কোডে স্পষ্ট লিখুন। ব্যবসার আয় যে কাজে আসে, সেটাকে সবচেয়ে বেশি রক্ষা করুন।
    ref: shed-with-rate-limiter
  - q: 'শুধু নির্দিষ্ট rate cap কি load shedding?'
    a: 'না। নির্দিষ্ট cap সার্ভারের দিকে তাকায় না, তাই সার্ভার খালি থাকলেও মানুষ ফেরায়। Shedding মানে সার্ভার overload হলে তবেই কাজ ফেরানো।'
    more: |
      Cap-এর আগে একটা overload সংকেত বসান: CPU core-প্রতি প্রায় ১.৫-এর বেশি load average, ব্যস্ত PHP-FPM worker, গভীর queue বা ধীর উত্তর। সংকেত সুস্থ বললে সবাইকে সেবা দিন, overload বললে cap খাটান। দাম: সংকেত পিছিয়ে থাকে, আর প্রতিটা সার্ভার শুধু নিজেকে মাপে।
    ref: shed-when-overloaded
  - q: 'ছাঁটার সিদ্ধান্ত kernel.request-এ নেওয়া হয় কেন, controller-এ নয়?'
    a: 'ছাঁটা request ডেটাবেস বা বাইরের API পর্যন্ত যায় না, তাই ছাঁটার খরচ প্রায় শূন্য এবং ক্ষমতা জরুরি কাজে বাঁচে।'
    more: |
      Controller-এ পৌঁছানোর আগেই auth, session, ORM-এর খরচ হয়ে যায়। শুরুতে priority বেশি দিয়ে listener বসালে এসব খরচ বাঁচে। প্রত্যাখ্যান যত দরজার কাছে হবে, ততো সস্তা।
    ref: shed-with-rate-limiter

quiz:
  - q: 'রহিমের API সেকেন্ডে ৫০টা request সামলায়, কিন্তু সেলের দিনে সেকেন্ডে ৬০টা আসছে। সে কোনো সীমা বসায়নি। ১০ মিনিট পরে কী দেখা যাবে?'
    hint: 'প্রতি সেকেন্ডে ১০টা করে বেশি আসছে। সেগুলো কোথায় যাচ্ছে?'
    options:
      - text: 'লাইনে প্রায় ৬,০০০ request, অপেক্ষা প্রায় ২ মিনিট, আর বেশিরভাগ উত্তর পৌঁছাচ্ছে ব্যবহারকারী চলে যাওয়ার পর'
        correct: true
        why: '১০ × ৬০০ = ৬,০০০ জমা। ÷ ৫০ = ১২০ সেকেন্ড। ততক্ষণে ক্লায়েন্ট timeout করে গেছে, তাই সার্ভারের পরিশ্রম নিষ্ফল।'
      - text: 'সার্ভার ধীরে ধীরে সামলে নেবে, কারণ ভিড় এক সময় কমবে'
        correct: false
        why: 'ভিড় কমার আগে লাইন বাড়তেই থাকে, আর লাইন শেষ হতে অনেক দেরি হয়। এর মধ্যে ব্যবহারকারীরা রিফ্রেশ করে আরও চাপ বাড়ায়।'
      - text: 'সব request ১ সেকেন্ডে সামান্য ধীর হবে, কিন্তু সফল হবে'
        correct: false
        why: 'দেরি ধীরে নয়, ক্রমাগত বাড়ে। লাইনের শেষের জনের অপেক্ষা প্রতি সেকেন্ডে লম্বা হয়।'
      - text: 'শুধু ১০টা বাড়তি request ব্যর্থ হবে, বাকি ৫০টা ঠিক থাকবে'
        correct: false
        why: 'সীমা না থাকলে "বাড়তি" কেউ আলাদা চিহ্নিত নয়। লাইন সবার সামনে ধীরে ধীরে দেরি বাড়ায়, আর শেষে সবাই ক্ষতিগ্রস্ত।'
    ref: line-grows-forever
  - q: 'কোন পরিস্থিতিতে 429, আর কোনটাতে 503 দেওয়া ঠিক?'
    hint: 'সমস্যা কার: একজন client-এর, না পুরো সার্ভারের?'
    options:
      - text: 'একজন API key মিনিটে ১০০-র বেশি চাইলে 429'
        correct: true
        why: '429 ওই client-এর নিজের সীমা ছাড়ানোর জন্য। সে গতি কমালে ঠিক হয়ে যায়।'
      - text: 'সেলের ভিড়ে সার্ভার ভরা হলে, যে কোনো কম জরুরি request-এ 503'
        correct: true
        why: '503 মানে সার্ভার এখন সামলাতে পারছে না, দোষ কোনো একজনের নয়। Retry-After সহ দিলে client জানে কখন ফিরবে।'
      - text: 'সার্ভার ভরা হলে সবাইকে 429 দেওয়া'
        correct: false
        why: '429 বললে client ভাববে সে-ই বেশি চেয়েছে, অথচ দোষ সার্বিক ভিড়ের। ভুল সংকেত ভুল আচরণ ডেকে আনে।'
      - text: 'ভরা হলে 200 দিয়ে খালি JSON পাঠানো'
        correct: false
        why: '200 মানে সফল। খালি উত্তর client-কে ভুল বোঝায় এবং retry-র সুযোগ কেড়ে নেয়।'
    ref: reject-early
  - q: 'নিচের listener-এ ছাঁটার সীমা পেরোলে কী ফেরানো হচ্ছে, আর একটা ভুল কোথায়?'
    lang: php
    code: |
      $limit = $this->lowPriorityLimiter->create('global')->consume();
      if (!$limit->isAccepted()) {
          $event->setResponse(new JsonResponse(['error' => 'busy'], 500));
      }
    hint: 'status code-টা ক্লায়েন্টকে কী বলছে? আর ক্লায়েন্ট কখন আবার আসবে, তা কোথায় বলা?'
    options:
      - text: '500 ভুল, উচিত 503; আর Retry-After header নেই'
        correct: true
        why: '500 মানে সার্ভারে বাগ। এখানে ইচ্ছাকৃত ফেরানো, তাই 503। Retry-After না থাকলে client আন্দাজে ঘন ঘন আসবে।'
      - text: 'কোনো ভুল নেই, 500 ঠিক আছে'
        correct: false
        why: '500 alert বাজাবে এবং বাগ মনে হবে। ইচ্ছাকৃত ছাঁটা আর বাগ আলাদা করে চেনা দরকার।'
      - text: 'consume() ব্যবহার করা ভুল, reserve() দিতে হবে'
        correct: false
        why: 'consume() টোকেন থাকলে সাথে সাথে নেয়, না থাকলে অপেক্ষা ছাড়া ব্যর্থ হয়। shedding-এ সেটাই চাই।'
      - text: '`create(''global'')` ভুল, প্রতি ব্যবহারকারীর key দিতে হবে'
        correct: false
        why: 'এখানে সার্বিক ক্ষমতা বাঁচানোই লক্ষ্য, তাই সবার জন্য এক key। প্রতি-ব্যবহারকারী key হলো আলাদা per-user rate limit।'
    ref: shed-with-rate-limiter
  - q: 'একটা সাইটে ভিড়ের সময় কোন request সবার শেষে ছাঁটা উচিত?'
    hint: 'ব্যবসার আয় আর ব্যবহারকারীর আস্থা কোনটাতে বেশি জড়িত?'
    options:
      - text: 'পেমেন্ট নিশ্চিত করার request'
        correct: true
        why: 'এখানে ব্যবহারকারী টাকা দিয়ে ফেলেছে বা দিতে যাচ্ছে। ছাঁটলে আয় যায়, আর অনিশ্চিত পেমেন্টের ঝামেলা বাড়ে।'
      - text: 'মাসিক বিক্রির রিপোর্ট export'
        correct: false
        why: 'এটা পরে করলেও কারো ক্ষতি নেই। এ কারণে এটাই সবার আগে ছাঁটার তালিকায়।'
      - text: 'সার্চের "আপনার জন্য সুপারিশ" অংশ'
        correct: false
        why: 'সুপারিশ ছাড়া সাইট চলে। ছাঁটার তালিকার দ্বিতীয় ধাপ।'
      - text: 'লাইভ "এখন কতজন দেখছে" কাউন্টার'
        correct: false
        why: 'কাউন্টার সাজসজ্জা, অপরিহার্য নয়। সবচেয়ে সহজে ছাঁটা যায়।'
    ref: shed-with-rate-limiter
  - q: 'Reports queue-তে ৫০০টা সীমা। worker প্রতি মিনিটে ১০০টা শেষ করে, আর কেউ ১০ মিনিটের বেশি অপেক্ষা সহ্য করবে না। কোনগুলো সঠিক সিদ্ধান্ত?'
    hint: 'সীমা ÷ গতি = অপেক্ষা। আর শুধু সীমাই কি বাসি কাজ ঠেকায়?'
    options:
      - text: 'সীমা ৫০০ থাকলে সর্বোচ্চ অপেক্ষা ৫ মিনিট, সহ্যের মধ্যে — সীমা রাখা যায়'
        correct: true
        why: '৫০০ ÷ ১০০ = ৫ মিনিট, ১০ মিনিটের নিচে। সীমা সহ্যের মধ্যে আছে।'
      - text: 'সীমা ছুঁলে নতুন request-এ 503 ও Retry-After দেওয়া'
        correct: true
        why: 'এভাবে queue বাড়ে না, ব্যবহারকারীও জানে আবার কখন আসবে। এটাই back-pressure।'
      - text: 'সীমা তুলে দিয়ে worker-এর সংখ্যা ১ রাখা, দিন শেষে সব শেষ হবে'
        correct: false
        why: 'সীমা না থাকলে অপেক্ষা ঘণ্টায় গিয়ে ঠেকে, আর বাসি request-ও চলে। ব্যবহারকারী তখন উত্তরই চায় না।'
