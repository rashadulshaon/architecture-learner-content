  - q: 'Expand-contract-এ phone কলামকে mobile করা হচ্ছে। কোন ক্রমটা ঠিক?'
    hint: 'পুরোনো কোড কখনই কোনো ভাঙা অবস্থা না দেখে।'
    options:
      - text: 'mobile যোগ, দুটোতেই লেখা ও backfill, mobile থেকে পড়া, পরের release-এ phone মোছা'
        correct: true
        why: 'প্রতিটা ধাপে পুরোনো ও নতুন কোড দুটোই কাজ করে। মোছা আসে সবশেষে, সবাই সরে যাওয়ার পর।'
      - text: 'phone-কে mobile নামে rename, তারপর কোড deploy'
        correct: false
        why: 'এতে পুরোনো সার্ভার ভাঙে, কারণ তারা এখনো phone খুঁজছে।'
      - text: 'phone মুছে mobile যোগ, একই release-এ'
        correct: false
        why: 'ডেটা হারায় এবং রোলব্যাকে পুরোনো কোড phone খুঁজে পাবে না।'
      - text: 'কোড deploy, তারপর mobile যোগ'
        correct: false
        why: 'নতুন কোড এমন কলামে লিখতে যাবে যা এখনো নেই, অর্থাৎ error।'
    ref: expand-contract
  - q: 'নিচের কোন কোন কাজ graceful shutdown-এর অংশ?'
    hint: 'চলমান কাজ আর নতুন কাজ আলাদা করে ভাবো।'
    options:
      - text: 'বন্ধের আগে readiness ব্যর্থ করে নতুন request পাঠানো থামানো'
        correct: true
        why: 'নতুন request আর না এলে বাকি চলমান কাজ শেষ করা সহজ।'
      - text: 'Messenger worker SIGTERM পেলে current message শেষ করে থামা'
        correct: true
        why: 'এভাবে message মাঝপথে কাটা পড়ে না। আর যদি পড়েও, সেটা queue-তে ফিরে আসে।'
      - text: 'সরাসরি SIGKILL পাঠানো, কারণ সেটা দ্রুত'
        correct: false
        why: 'SIGKILL চলমান কাজ মাঝপথে কেটে দেয়। এটা শেষ উপায়, প্রথম নয়।'
      - text: 'terminationGracePeriodSeconds কম রাখা, যাতে সার্ভার তাড়াতাড়ি যায়'
        correct: false
        why: 'সময় সবচেয়ে লম্বা request-এর চেয়ে কম হলে চলমান কাজ কাটা পড়ে।'
    ref: graceful-shutdown
  - q: 'একটা release-এ নতুন কোড ও "ALTER TABLE user DROP phone" একসাথে গেছে। ১০ মিনিট পরে error rate বেড়ে গেল। সবচেয়ে ভালো পদক্ষেপ কী হত, আর এখন কী?'
