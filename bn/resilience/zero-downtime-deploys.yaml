      a: 'কোড ফিরে গেলেও কলামটা আর নেই। পুরোনো কোড phone পড়তে গিয়ে error পাবে, আর down() শুধু কলাম ফেরায়, ভেতরের ডেটা নয়।'

flashcards:
  - q: 'Deploy চলার সময় কেন পুরোনো ও নতুন কোড একসাথে ডেটাবেস ব্যবহার করে?'
    a: 'Deploy এক মুহূর্তে হয় না। কয়েক মিনিট কিছু সার্ভার পুরোনো, কিছু নতুন ভার্সন চালায়, কিন্তু ডেটাবেস সবার একটাই।'
    more: |
      Rolling-এ সার্ভার এক এক করে বদলায়, blue/green-এ সুইচের পরেও পুরোনো পরিবেশ রোলব্যাকের জন্য প্রস্তুত থাকে। তাই প্রতিটা release পুরোনো কোডের সাথেও সামঞ্জস্যপূর্ণ (backward compatible) রাখতে হয়।
    ref: deploy-breaks-live-users
  - q: 'Rolling, blue/green আর canary deploy-এর পার্থক্য কী?'
    a: 'Rolling: এক এক সার্ভার বদলায়। Blue/green: দুই পরিবেশের মধ্যে সুইচ। Canary: আগে ছোট অংশে নতুন, ভালো হলে সবাইকে।'
    more: |
      Rolling সবচেয়ে সস্তা কিন্তু রোলব্যাক ধীর। Blue/green-এ রোলব্যাক শুধু সুইচ ফেরানো, তবে সাময়িক দ্বিগুণ সার্ভার লাগে। Canary-তে বাস্তব ট্রাফিকের ছোট অংশে ঝুঁকি যাচাই হয়, কিন্তু ভালো মনিটরিং দরকার।
    ref: rolling-bluegreen-canary
  - q: 'কোন deploy কৌশলে রোলব্যাক সবচেয়ে দ্রুত?'
    a: 'Blue/green: পুরোনো পরিবেশ প্রস্তুত থাকে, load balancer-এর সুইচ ঘুরিয়ে দিলেই ট্রাফিক ফিরে যায়।'
    more: |
      Rolling-এ রোলব্যাক মানে আবার rolling deploy, কয়েক মিনিট। Blue/green-এ সেকেন্ডে সুইচ ফেরে। তবে দুই পরিবেশ একই ডেটাবেস ব্যবহার করে, তাই schema সামঞ্জস্য ছাড়া এটাও কাজ করে না।
    ref: rolling-bluegreen-canary
  - q: 'Expand-contract pattern কী?'
    a: 'ডেটাবেস বদল কয়েক release-এ ভাগ করা: আগে নতুন কিছু যোগ (expand), সবাই সরে গেলে পুরোনোটা মোছা (contract)।'
    more: |
      কলামের নাম বদলাতে: নতুন কলাম যোগ, দুটোতেই লেখে এমন কোড release, পুরোনো সারি backfill, পড়া নতুনে সরানো, পরের এক release-এ পুরোনো কলাম মোছা। প্রতিটা ধাপে পুরোনো ও নতুন দুই কোডই চলে।
    ref: expand-contract
  - q: 'নতুন কলাম যোগের migration কেন nullable রাখা হয়?'
    a: 'পুরোনো কোড নতুন কলামের কথা জানে না। NOT NULL হলে পুরোনো কোডের INSERT ভেঙে যায়।'
    more: |
      PostgreSQL-এ nullable কলাম DEFAULT NULL দিয়ে যোগ করা তাৎক্ষণিক, টেবিল লক হয় না। backfill শেষ হওয়ার পর constraint বসানো যায়। বড় টেবিলে backfill ছোট batch-এ চালান।
    ref: expand-contract
  - q: 'Graceful shutdown-এর ধাপগুলো কী?'
    a: 'load balancer থেকে সরানো, ঠিক থামার সংকেত পাঠানো, চলমান কাজ শেষ, সময়সীমা, না হলে SIGKILL।'
    more: |
      Load balancer-কে সরাতে সময় দিতে preStop-এ সামান্য অপেক্ষা রাখা হয়। terminationGracePeriodSeconds হবে সবচেয়ে লম্বা কাজের চেয়ে বেশি। Messenger worker SIGTERM পেলে বর্তমান message শেষ করে থামে, আর মাঝপথে কাটা message আবার queue-তে ফেরে।
    ref: graceful-shutdown
  - q: 'php-fpm কোন সংকেতে ভদ্রভাবে থামে, আর SIGTERM পেলে কী করে?'
    a: 'SIGQUIT-এ php-fpm চলমান request শেষ করে তারপর বের হয়। SIGTERM-এ সে তখনই থেমে যায়, চলমান request কেটে।'
    more: |
      Dockerfile-এ STOPSIGNAL SIGQUIT বসান, যাতে Docker ও Kubernetes SIGTERM-এর বদলে এটা পাঠায়। official php-fpm image-এ এটা আগেই আছে। Messenger worker উল্টো: সে SIGTERM নিজেই সামলায় আর বর্তমান message শেষ করে।
    ref: graceful-shutdown
  - q: 'Expand-contract-এ backfill কেন write-to-both release পুরো চালু হওয়ার পরে চালাতে হয়?'
    a: 'তার আগে পুরোনো কোডের সার্ভার নতুন সারি শুধু phone-এ রাখে। আগের backfill সেগুলো ধরে না, পড়া সরালে ওই ব্যবহারকারীর নম্বর ফাঁকা দেখায়।'
    more: |
      ক্রম: কলাম যোগ, dual-write release, rollout শেষ হওয়ার অপেক্ষা, backfill, "mobile ফাঁকা আর phone ভরা" সারি নেই তা যাচাই, তারপর পড়া সরানো। backfill শুধু সেই সারি কপি করে যেখানে mobile ফাঁকা, তাই আবার চালালেও ক্ষতি নেই।
    ref: backfill-order
  - q: 'কোড রোলব্যাক সহজ, কিন্তু ডেটাবেস রোলব্যাক নয় কেন?'
    a: 'কোড ফেরানো মানে পুরোনো ফাইল চালানো। মোছা কলাম বা বদলানো ডেটা ফেরানো যায় না, down() শুধু কাঠামো ফেরায়, ডেটা নয়।'
    more: |
      তাই নিরাপদ নিয়ম: migration শুধু যোগ করে (expand), মোছা (contract) পরের release-এ। রোলব্যাক plan-এ আরও থাকে: আগের artifact প্রস্তুত, feature flag, ট্রিগারের সীমা আর মহড়া।
    ref: rollback-trap

quiz:
  - q: 'সাবিরের টিম একটা কলাম rename করে rolling deploy করল। ৫ মিনিট ধরে কিছু ব্যবহারকারী 500 পেল। সবচেয়ে সম্ভাব্য কারণ কী?'
    hint: 'Deploy চলাকালে কোন কোন ভার্সন একসাথে চলে?'
    options:
      - text: 'পুরোনো সার্ভারগুলো তখনো পুরোনো নামে কলাম খুঁজছিল, যা ডেটাবেসে আর নেই'
