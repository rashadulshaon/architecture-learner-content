slides:
  - slug: deploy-breaks-live-users
    title: 'Deploy চলাকালীন পুরোনো কোড আর নতুন ডেটাবেস'
    kind: story
    tldr: 'Deploy এক মুহূর্তে হয় না। কয়েক মিনিট পুরোনো ও নতুন কোড একসাথে একই ডেটাবেসে চলে, তাই একটা কলামের নাম বদলালেই ব্যবহারকারী 500 পায়।'
    keywords: ['zero downtime', 'deploy', 'rolling', 'schema change', 'column rename', 'ডাউনটাইম']
    blocks:
      - type: metaphor
        icon: shop
        title: 'চা দোকানে নতুন চুলা বসানো'
        body: |
          চা দোকানের মালিক পুরোনো চুলা ভেঙে সেখানে নতুন চুলা বসাতে চায়। দোকান বন্ধ রাখলে ক্রেতা অন্য দোকানে যায়। তাই বুদ্ধিমান মালিক আগে পাশে নতুন চুলা বসায়, চালিয়ে দেখে, তারপর ক্রেতাদের সরিয়ে দেয়, শেষে পুরোনোটা সরায়। ওই বদলের সময় দুটো চুলাই এক সাথে ক্রেতা সামলায়। কোডেও ঠিক তাই: **zero-downtime deploy**-এ নতুন ও পুরোনো ভার্সন কিছুক্ষণ একসাথে চলে।
      - type: visual
        kind: sequence
        caption: 'Rolling deploy: নতুন সার্ভার migration চালাল, পুরোনো সার্ভার তখনো ক্রেতা সামলাচ্ছে'
        actors:
          - {id: user, label: 'ব্যবহারকারী', icon: user, tip: 'সে জানেই না deploy চলছে। তার কাছে সাইট সবসময় খোলা থাকার কথা।'}
          - {id: v1, label: 'পুরোনো সার্ভার (v1)', icon: server, tip: 'এখনো পুরোনো কোড চালাচ্ছে। এটা `phone` কলাম পড়ে।'}
          - {id: v2, label: 'নতুন সার্ভার (v2)', icon: rocket, tip: 'নতুন কোড, যা `mobile` কলাম ব্যবহার করে। প্রথমে এটাই চালু হয়েছে।'}
          - {id: db, label: 'ডেটাবেস', icon: db, tip: 'একটাই ডেটাবেস, দুই ভার্সনই এটাকে ব্যবহার করে। সব সমস্যার শিকড় এখানে।'}
        messages:
          - {from: v2, to: db, label: 'migration: phone কলামের নাম হলো mobile', tip: 'RENAME COLUMN এক মুহূর্তে হয়ে যায়, কিন্তু পুরোনো কোড তখনো চলছে।'}
          - {at: db, note: 'এখন আর phone নামে কোনো কলাম নেই', tone: warn}
          - {from: user, to: v1, label: 'আমার প্রোফাইল দেখান'}
          - {from: v1, to: db, label: 'SELECT phone FROM user'}
          - {from: db, to: v1, label: 'ERROR: column phone নেই', dashed: true, tone: bad}
          - {from: v1, to: user, label: '500 Internal Server Error', dashed: true, tone: bad}
      - type: quote
        body: 'Deploy চলার সময় পুরোনো ও নতুন কোড একই ডেটাবেস ভাগ করে। তাই এক ধাপে rename নয়: আগে নতুনটা যোগ করুন, সবাই সরলে পুরোনোটা মুছুন।'
    aside:
      - type: story
        title: 'শুক্রবার সন্ধ্যার deploy'
        body: |
          একটা টিম শুক্রবার সন্ধ্যায় একটা কলামের নাম বদলে "২ মিনিটের deploy" করল। rolling deploy শেষ হতে লাগল ৮ মিনিট। এই ৮ মিনিট পুরোনো সার্ভারগুলো প্রতিটা প্রোফাইল request-এ 500 দিল। মিনিটে প্রায় ২০০ ব্যবহারকারী চেকআউট ছাড়ল।
      - type: terms
        items:
          - {term: 'Zero-downtime deploy', meaning: 'নতুন ভার্সন চালু করার সময় সাইট একটুও বন্ধ না থাকা।'}
          - {term: 'Backward compatible', meaning: 'নতুন পরিবর্তন পুরোনো কোডের সাথেও ঠিকঠাক চলে।'}
    check:
      q: 'Deploy মাত্র ২ মিনিটে শেষ হয়। তবু কলামের নাম বদলালে কেন সমস্যা হয়?'
      a: 'ওই দুই মিনিট (বা আরও বেশি) পুরোনো সার্ভার তখনো চলে। তারা পুরোনো নামে কলাম খোঁজে, ডেটাবেসে সেটা আর নেই, তাই error।'

  - slug: rolling-bluegreen-canary
    title: 'তিন উপায়: rolling, blue/green, canary'
    kind: compare
    tldr: 'Rolling এক এক করে সার্ভার বদলায়, blue/green পুরো নতুন পরিবেশে সুইচ করে, canary ছোট অংশে আগে পরীক্ষা করে। তিনটাতেই দুই ভার্সন কিছুক্ষণ একসাথে চলে।'
    keywords: ['rolling deploy', 'blue green', 'canary', 'deployment strategy', 'rollback', 'ট্রাফিক সুইচ']
    blocks:
      - type: text
        body: |
          চা দোকানের উদাহরণেই বলি। **Rolling**: একটা একটা করে চুলা বদলানো হয়। **Blue/green**: পাশে পুরো নতুন দোকান সাজিয়ে এক মুহূর্তে সব ক্রেতা সেদিকে পাঠানো হয়, পুরোনোটা প্রস্তুত থাকে। **Canary**: নতুন চায়ের এক কাপ শুধু কয়েকজনকে চেখে দেখতে দেওয়া হয়, ভালো হলে সবাইকে।
      - type: visual
        kind: flow
        caption: 'Blue/green: Green চালু ও পরীক্ষা শেষে সুইচ, Blue থাকে ফেরার পথ হিসেবে'
        nodes:
          - {id: lb, label: 'Load balancer', sub: 'ট্রাফিক বাছে', icon: lb, tone: accent, col: 0, row: 1, tip: 'সুইচটা এখানেই। সে ঠিক করে ট্রাফিক Blue-তে যাবে না Green-এ।'}
          - {id: blue, label: 'Blue (v1)', sub: 'বর্তমান', icon: server, col: 2, row: 0, tip: 'এখন যে ভার্সন লাইভ। সুইচের পরেও বন্ধ করা হয় না।'}
          - {id: green, label: 'Green (v2)', sub: 'নতুন', icon: rocket, tone: good, col: 2, row: 2, tip: 'নতুন ভার্সন, আলাদা সার্ভারে। ট্রাফিক পাওয়ার আগে পুরো পরীক্ষা হয়।'}
          - {id: db, label: 'ডেটাবেস', sub: 'একটাই', icon: db, col: 4, row: 1, tip: 'দুই পরিবেশ একই ডেটাবেস ব্যবহার করে, তাই schema দুই ভার্সনের সাথেই মানাতে হবে।'}
        edges:
          - {from: lb, to: blue, label: 'এখন সব ট্রাফিক Blue (v1)-এ যায়'}
          - {from: lb, to: green, label: 'Green (v2) চালু হয়, health check পাশ করে, কিন্তু ট্রাফিক নেই', dashed: true, tone: warn}
          - {from: green, to: db, label: 'Green smoke test চালায় একই ডেটাবেসে', dashed: true}
          - {from: lb, to: green, label: 'সুইচ: সব ট্রাফিক Green-এ চলে যায়', tone: good}
          - {from: lb, to: blue, label: 'সমস্যা হলে সুইচ আবার Blue-তে ফেরে', tone: warn, dashed: true, tip: 'এটাই blue/green-এর শক্তি: রোলব্যাক মানে শুধু সুইচ ঘোরানো, নতুন করে deploy নয়।'}
      - type: visual
        kind: table
        caption: 'তিন কৌশলের তুলনা'
        headers: ['', 'Rolling', 'Blue/green', 'Canary']
        rows:
          - cells: ['কীভাবে', 'এক এক সার্ভার বদলায়', 'দুই পরিবেশ, সুইচ', 'ছোট অংশে আগে নতুন']
            tip: 'তিনটাই শেষ পর্যন্ত নতুন ভার্সন সবার কাছে পৌঁছায়, শুধু ঝুঁকি ভাগ করার কায়দা আলাদা।'
          - cells: ['বাড়তি খরচ', 'প্রায় নেই', 'সাময়িক দ্বিগুণ সার্ভার', 'ছোট একটা অতিরিক্ত দল']
            tip: 'blue/green ভাড়ার সার্ভারে দামি, কিন্তু cloud-এ কয়েক মিনিটের জন্য ভাড়ায় সস্তা।'
          - cells: ['রোলব্যাক', 'ধীর: আবার rolling', 'সবচেয়ে দ্রুত: সুইচ ফেরানো', 'দ্রুত: ছোট অংশ ফেরানো']
            tip: 'রোলব্যাকের গতিই ঠিক করে ভুল হলে ক্ষতি কত বড় হবে।'
          - cells: ['মূল ঝুঁকি', 'v1 ও v2 একসাথে চলে', 'সুইচের মুহূর্তে সবাই নতুনে', 'ভালো মনিটরিং লাগে']
            tip: 'canary-র সাফল্য নির্ভর করে error rate আর latency ঠিকভাবে দেখতে পারার ওপর।'
          - cells: ['কখন', 'নিয়মিত ছোট release', 'বড় বা ঝুঁকির বদল', 'ঝুঁকিপূর্ণ ফিচার']
            tip: 'বেশিরভাগ টিম rolling দিয়ে শুরু করে, ঝুঁকির কাজে canary বা blue/green যোগ করে।'
      - type: quote
        body: 'যে কৌশলই হোক, deploy-র সময় পুরোনো ও নতুন কোড একসাথে চলবে: প্রতিটা release পেছনের দিকে সামঞ্জস্যপূর্ণ হতে হবে।'
    aside:
      - type: when
        use: ['Rolling: প্রতিদিনের ছোট বদল, কম খরচ চাইলে', 'Blue/green: বড় বদল, দ্রুত রোলব্যাক দরকার হলে', 'Canary: ঝুঁকিপূর্ণ ফিচার, বাস্তব ট্রাফিকে পরীক্ষা']
        avoid: ['Canary: যদি error rate মাপার ব্যবস্থাই না থাকে']
      - type: terms
        items:
          - {term: 'Smoke test', meaning: 'চালু হওয়ার পরেই কয়েকটা মূল কাজ (লগইন, কার্টে দেওয়া) সত্যিই চলছে কি না দেখার ছোট পরীক্ষা।'}
          - {term: 'Canary', meaning: 'কয়লাখনির পাখির মতো: নতুন ভার্সন প্রথমে ছোট অংশের ট্রাফিক পায়, সমস্যা হলে সেই অংশই আগে জানায়।'}
      - type: refs
        items:
          - {to: 'infra/ci-cd', label: 'CI/CD ও নিরাপদ deploy'}
    check:
      q: 'কোন কৌশলে রোলব্যাক সবচেয়ে দ্রুত, আর কেন?'
      a: 'Blue/green: পুরোনো পরিবেশ (Blue) তখনো চালু ও প্রস্তুত। শুধু load balancer-এর সুইচ ফিরিয়ে দিলেই হয়, নতুন করে কিছু deploy করতে হয় না।'

  - slug: expand-contract
    title: 'Expand-contract: কলাম বদলের নিরাপদ পথ'
    kind: howto
    tldr: 'একবারে নয়, কয়েক release-এ: নতুন কলাম যোগ (expand), দুইটাতেই লেখা, পুরোনো সারি backfill, পড়া নতুনে সরানো, সবশেষে পুরোনো মোছা (contract)। প্রতিটা ধাপে পুরোনো কোড বাঁচে।'
    keywords: ['expand contract', 'parallel change', 'Doctrine Migrations', 'dual write', 'backfill', 'rename column']
    blocks:
      - type: text
        body: |
          `phone` কলামকে `mobile` করতে হবে। একটা rename-এর বদলে নতুন চুলা পাশে বসানোর মতো করুন: আগে নতুন কলাম যোগ (**expand**), সবকিছু সরিয়ে নেওয়ার পর পুরোনোটা বাদ (**contract**)। প্রতিটা ধাপ আলাদা release, তাই প্রতিটা ধাপে পুরোনো ও নতুন কোড দুটোই চলে। ক্রমটা কেন এমন, তা পরের slide-এ দেখানো হয়েছে।
      - type: visual
        kind: steps
        caption: 'phone থেকে mobile: পাঁচ ধাপ, এই ক্রমে, প্রতিটা আলাদা release বা চালানো'
        steps:
          - {title: '১. Expand', body: 'nullable mobile কলাম যোগ করুন। কোড বদলায় না।', tip: 'কলাম যোগ করা সবসময় নিরাপদ: পুরোনো কোড নতুন কলামের কথা জানেই না।'}
          - {title: '২. দুইটাতেই লেখা', body: 'phone ও mobile দুটোতেই লেখে, এমন কোড release করুন।', tip: 'rollout শেষ হওয়া পর্যন্ত থামুন: পুরোনো কোডের সার্ভার শুধু phone-এ লেখে।'}
          - {title: '৩. Backfill', body: 'ধাপ ২ পুরো চালু হলে পুরোনো সারিতে phone কপি করুন, ছোট batch-এ।', tip: 'পরের slide-এ কমান্ড আছে, আর কেন এটা ধাপ ২-এর পরেই হতে হবে তাও।'}
          - {title: '৪. পড়া সরানো', body: 'mobile থেকে পড়ে এমন কোড release করুন। দুইটাতেই লেখা চলুক।', tip: 'phone-এ লেখা আপাতত চলুক: এই release ফেরাতে হলে পুরোনো কোড phone-এ টাটকা নম্বর পাবে।'}
          - {title: '৫. Contract', body: 'কোডে phone ব্যবহার বন্ধ করুন। কলাম মুছুন পরের release-এ।', tone: warn, tip: 'একমাত্র ফেরানো-যায়-না ধাপ। আগে কোড, মোছা পরে, আর মোছার আগে backup নিন।'}
      - type: code
        lang: php
        file: 'migrations/Version20261120100000.php'
        variant: good
        code: |
          final class Version20261120100000 extends AbstractMigration
          {
              public function getDescription(): string
              {
                  return 'expand: user.mobile কলাম যোগ';
              }

              public function up(Schema $schema): void
              {
                  // nullable, তাই পুরোনো কোড INSERT করলেও ভাঙে না
                  $this->addSql('ALTER TABLE "user" ADD mobile VARCHAR(20) DEFAULT NULL');
              }

              public function down(Schema $schema): void
              {
                  $this->addSql('ALTER TABLE "user" DROP mobile');
              }
          }
        marks:
          - {line: 11, tip: 'NOT NULL ছাড়া ও ডিফল্ট NULL: PostgreSQL-এ এটা তাৎক্ষণিক, টেবিল লক হয় না। পুরোনো INSERT-ও ঠিক থাকে।'}
      - type: code
        lang: php
        file: 'src/Entity/User.php'
        variant: good
        code: |
          #[ORM\Column(length: 20, nullable: true)]
          private ?string $phone = null;

          #[ORM\Column(length: 20, nullable: true)]
          private ?string $mobile = null;

          public function setMobile(string $number): void
          {
              $this->mobile = $number;
              $this->phone = $number;      // ধাপ ২: দুইটাতেই লিখুন
          }

          public function getMobile(): ?string
          {
              return $this->mobile ?? $this->phone;   // backfill শেষ না হওয়া পর্যন্ত নিরাপদ
          }
        marks:
          - {line: 10, tip: 'পুরোনো সার্ভার এখনো phone পড়ে। সেখানে যেন নতুন নম্বর পৌঁছায়, তাই phone-এও লেখা।'}
          - {line: 15, tip: 'নতুন কলাম ফাঁকা থাকলে পুরোনোটা দেখান। backfill শেষ হলে এই fallback লাগবে না।'}
      - type: quote
        body: 'কলাম বা টেবিল কখনো এক release-এ বদলাবেন না: আগে যোগ করুন, সবাই সরে গেলে তবে মুছুন।'
    aside:
      - type: pitfalls
        items:
          - 'NOT NULL কলাম ডিফল্ট ছাড়া যোগ করলে পুরোনো কোডের INSERT ভেঙে যায়। আগে nullable রাখুন, backfill শেষে constraint বসান।'
          - 'বড় টেবিলে একটা UPDATE সব সারিতে lock ধরে রাখে। backfill ১,০০০ সারি করে batch-এ চালান।'
          - 'দাম: একটা rename হয়ে যায় কয়েক দিনের পাঁচ ধাপ, আর দুটো কলাম পাশাপাশি থাকে।'
      - type: when
        use: ['যে কলাম বা টেবিল deploy-র সময় চালু ব্যবহারকারীরা পড়ে বা লেখে']
        avoid: ['ছোট অভ্যন্তরীণ টুল, যেখানে ১০ মিনিটের পূর্বঘোষিত বন্ধ চলে: পাঁচ ধাপের খরচ তার চেয়ে বেশি', 'যে rename বাদ দেওয়া যায়, পুরোনো নামটাই রেখে দিলে চলে']
      - type: refs
        items:
          - {to: 'data/zero-downtime-migrations', label: 'ডেটাবেস migration-এ lock-এর খুঁটিনাটি'}
    check:
      q: 'Rename না করে expand-contract-এ কেন পাঁচ ধাপ লাগে? কোন ধাপটা ফেরানো যায় না?'
      a: 'প্রতিটা ধাপে পুরোনো ও নতুন দুই ভার্সনই ঠিক চলে, তাই deploy-এর মাঝে ভাঙে না। শুধু শেষ ধাপে (contract) কলাম মোছা ফেরানো যায় না।'

  - slug: backfill-order
    title: 'Backfill সঠিক ক্রমে, ছোট batch-এ'
    kind: howto
    tldr: 'আগে dual-write চালু, সেই rollout শেষ হলে backfill, তারপর যাচাই যে ফাঁক নেই, তবেই পড়া সরানো। ছোট batch-এ কপি করুন; কমান্ড আবার চালালেও ক্ষতি নেই।'
    keywords: ['backfill', 'batch update', 'dual write order', 'Doctrine DBAL', 'console command', 'ডেটা migration']
    blocks:
      - type: text
        body: |
          ধরুন `user` টেবিলে ১০,০০০ সারি, আর নতুন কোড rollout হতে ২ মিনিট লাগে। ক্রমটা রুচির ব্যাপার নয়: প্রতিটা ধাপ পরেরটাকে নিরাপদ করে। backfill (পুরোনো মান নতুন কলামে কপি) খুব আগে চালালে নতুন sign-up-দের কী হয়, নিচে দেখুন।
      - type: visual
        kind: compare
        caption: 'একই দুটো ধাপ, ভুল ও ঠিক ক্রমে'
        columns:
          - title: 'আগে backfill'
            tone: bad
            icon: cross
            tip: 'কপির সময় পুরোনো কোড তখনো সবকিছু শুধু phone-এ রাখছে।'
            items: ['backfill ১০,০০০ বিদ্যমান ব্যবহারকারী কপি করে', 'write-to-both release না যাওয়া পর্যন্ত আরও ৩০০ জন sign up করে: শুধু phone-এ জমা', 'পড়া mobile-এ গেলে ওই ৩০০ জনের নম্বর ফাঁকা, আর কিছুই তা ঠিক করে না']
          - title: 'আগে write-to-both'
            tone: good
            icon: check
            tip: 'rollout শেষ হওয়ার পর থেকে প্রতিটা save দুই কলামই ভরে। backfill-কে শুধু অতীত সামলাতে হয়।'
            items: ['write-to-both release করুন। ২ মিনিটের rollout-এ পুরোনো সার্ভার প্রায় ৪০টা সারি শুধু phone-এ রাখে', 'rollout শেষ হলে backfill ওই ৪০ আর পুরোনো ১০,০০০ সারি কপি করে', 'বাকি সারির সংখ্যা শূন্য কি না যাচাই করে তারপর পড়া সরান']
      - type: code
        lang: php
        file: 'src/Command/BackfillMobileCommand.php'
        variant: good
        code: |
          #[AsCommand(name: 'app:backfill-mobile')]
          final class BackfillMobileCommand extends Command
          {
              public function __construct(private readonly Connection $connection)
              {
                  parent::__construct();
              }

              protected function execute(InputInterface $input, OutputInterface $output): int
              {
                  do {
                      $copied = $this->connection->executeStatement(<<<'SQL'
                          UPDATE "user" SET mobile = phone WHERE id IN (
                              SELECT id FROM "user"
                              WHERE mobile IS NULL AND phone IS NOT NULL
                              LIMIT 1000
                          )
                          SQL);
                      $output->writeln(sprintf('%d rows copied', $copied));
                      usleep(200_000);   // সামান্য বিরতি, যাতে ডেটাবেস ও replica তাল রাখতে পারে
                  } while ($copied > 0);

                  return Command::SUCCESS;
              }
          }
        marks:
          - {line: 15, tip: 'শুধু যেসব সারি এখনো কপি হয়নি সেগুলো বাছা হয়। তাই কমান্ড থামানো, আবার চালানো বা দুইবার চালানো নিরাপদ।'}
          - {line: 16, tip: 'প্রতিটা batch lock ধরে রাখে মিলিসেকেন্ড। লাখ লাখ সারিতে একটা UPDATE মিনিটের পর মিনিট lock ধরে sign-up আটকে দিত।'}
          - {line: 21, tip: 'যে রাউন্ডে কিছুই কপি হয় না, লুপ সেখানে শেষ: কপির মতো আর কোনো সারি নেই।'}
      - type: code
        lang: sql
        variant: good
        code: |
          -- পড়া mobile-এ সরানোর আগে এটা 0 দিতে হবে
          SELECT count(*) FROM "user" WHERE mobile IS NULL AND phone IS NOT NULL;
        marks:
          - {line: 2, tip: 'phone-এ নম্বর আছে কিন্তু mobile-এ নেই, এমন সারি গোনে। 0-র বেশি মানে ফাঁক, যা পরে ফাঁকা নম্বর হয়ে দেখা দেবে।'}
    aside:
      - type: commands
        items:
          - {cmd: 'php bin/console app:backfill-mobile', desc: 'phone থেকে mobile-এ ১,০০০ সারি করে কপি করে, বাকি না থাকা পর্যন্ত'}
      - type: pitfalls
        items:
          - 'write-to-both rollout চলার সময় backfill শুরু করবেন না: পুরোনো সার্ভার তখনো শুধু-phone সারি যোগ করছে।'
          - 'দাম: কাজ চলাকালে টেবিল বেশি ব্যস্ত থাকে, আর বিরতিটা ইচ্ছা করেই একে ধীর করে। ভিড়ের সময় এড়িয়ে চালান।'
          - 'যাচাই 0 না দেওয়া পর্যন্ত, আর শুধু-phone লেখা চলতে থাকলে, mobile-এ NOT NULL বসাবেন না।'
    check:
      q: 'নাদিয়া আগে backfill চালাল, আর এক ঘণ্টা পরে write-to-both release করল। কী ভুল হলো, আর কার জন্য?'
      a: 'ওই এক ঘণ্টায় যারা sign up করেছে, তাদের সারি শুধু phone-এ জমা, তাই পড়া mobile-এ গেলে তাদের নম্বর ফাঁকা দেখায়। আগে write-to-both, তারপর backfill করলে এই ফাঁক বন্ধ হয়।'

  - slug: graceful-shutdown
    title: 'পুরোনো সার্ভার বন্ধ হবে ভদ্রভাবে'
    kind: howto
    tldr: 'পুরোনো সার্ভারকে load balancer থেকে সরান, তারপর "শেষ করে বের হও" মানে এমন সংকেত দিন: php-fpm-এর জন্য SIGQUIT, Messenger worker-এর জন্য SIGTERM। SIGTERM পেলে php-fpm তখনই থেমে যায়।'
    keywords: ['graceful shutdown', 'SIGTERM', 'readiness probe', 'messenger worker', 'drain', 'connection draining']
    blocks:
      - type: text
        body: |
          চা দোকানে পুরোনো চুলা সরানোর আগে ঢালা কাপের চা শেষ করতে দিতে হয়, নইলে ক্রেতার কাপ ফেলে যাবে। সার্ভারেও একই: হঠাৎ বন্ধ করলে চলমান request মাঝপথে কাটা পড়ে। ফাঁদটা সংকেতে লুকানো: php-fpm SIGTERM-কে ধরে "এখনই থামা" বলে। কনটেইনার থামানোর সময় ৩০ সেকেন্ডের একটা রিপোর্ট চলতে থাকলে সেটা সাথে সাথে মারা যায়, আর ব্যবহারকারী পায় 502। শুধু SIGQUIT-এ php-fpm আগে কাজ শেষ করে।
      - type: visual
        kind: steps
        caption: 'সার্ভার বন্ধের ভদ্র ক্রম'
        steps:
          - {title: '১. লাইন থেকে সরান', body: 'load balancer এই সার্ভারে নতুন request পাঠানো থামায়।', tip: 'Kubernetes-এ পড "terminating" চিহ্নিত হতেই এটা শুরু হয়। সব load balancer-এ খবর পৌঁছাতে কয়েক সেকেন্ড লাগে, তাই নিচের কনফিগে সামান্য অপেক্ষা (preStop)।'}
          - {title: '২. ঠিক সংকেত পাঠান', body: 'php-fpm-এর জন্য SIGQUIT, Messenger worker-এর জন্য SIGTERM।', tip: 'php-fpm SIGTERM-কে "এখনই থামা" ধরে, চলমান request কেটে দেয়। SIGQUIT মানে "চলমান request শেষ করে বের হওয়া"। Messenger worker SIGTERM নিজেই সামলায়।'}
          - {title: '৩. চলমান কাজ শেষ', body: 'চলতি request ও message শেষ হয়, নতুন কিছু নেওয়া হয় না।', tip: 'Messenger worker বর্তমান message শেষ করে তবেই থামে (pcntl extension লাগে)। php-fpm-এর প্রতিটা worker নিজের চলতি request শেষ করে।'}
          - {title: '৪. নির্দিষ্ট সময়সীমা', body: 'ধরুন ৪৫ সেকেন্ড। এর মধ্যে বন্ধ না হলে...', tip: 'সময়সীমা কাজের সবচেয়ে লম্বা request বা message-এর চেয়ে বেশি হওয়া উচিত।'}
          - {title: '৫. SIGKILL', body: '...জোর করে মেরে ফেলা। এটা শেষ উপায়।', tone: bad, tip: 'SIGKILL ধরা যায় না। মাঝপথের কাজ হারায়, তাই এই পর্যন্ত যেন না গড়ায়।'}
      - type: code
        lang: yaml
        file: 'k8s/deployment.yaml'
        variant: good
        code: |
          spec:
            terminationGracePeriodSeconds: 45
            containers:
              - name: app
                readinessProbe:
                  httpGet: { path: /health/ready, port: 8080 }
                  periodSeconds: 5
                  failureThreshold: 2
                lifecycle:
                  preStop:
                    exec: { command: ['sleep', '10'] }
        marks:
          - {line: 2, tip: 'থামার সংকেতের পর এত সেকেন্ড সময়। এরপর SIGKILL। সবচেয়ে লম্বা request-এর চেয়ে বেশি রাখুন।'}
          - {line: 6, tip: 'এই URL ব্যর্থ হলে orchestrator ওই পডে নতুন request পাঠানো থামায়। শুধু সেটাই দেখুন যেটা ছাড়া অ্যাপ সত্যিই চলে না, যেমন ডেটাবেস: বাইরের কুরিয়ার API ধীর হলে সব সার্ভার লাইন থেকে বেরিয়ে যেত।'}
          - {line: 11, tip: 'থামার সংকেতের আগে ১০ সেকেন্ড অপেক্ষা: এর মধ্যে load balancer-গুলো সার্ভারটাকে তালিকা থেকে বাদ দিয়ে ফেলে।'}
      - type: code
        lang: dockerfile
        file: 'Dockerfile'
        variant: good
        code: |
          FROM php:8.3-fpm-alpine

          # php-fpm: SIGTERM = এখনই থামা, চলমান request কেটে যায়।
          # SIGQUIT = চলমান request শেষ করে তারপর বের হওয়া।
          STOPSIGNAL SIGQUIT
          # SIGQUIT-এর পরে worker-দের কাজ শেষের জন্য master কতক্ষণ অপেক্ষা করবে
          RUN printf '[global]\nprocess_control_timeout = 40s\n' \
              > /usr/local/etc/php-fpm.d/zz-shutdown.conf

          COPY . /var/www/html
        marks:
          - {line: 5, tip: 'মূল লাইন। container থামানোর সময় Docker ও Kubernetes SIGTERM-এর বদলে এই সংকেত পাঠায়। official php-fpm image-এ এটা আগেই বসানো; নিজের base image-এ না-ও থাকতে পারে।'}
          - {line: 7, tip: 'এটা না থাকলে SIGQUIT-এর পরে master প্রায় অপেক্ষাই করে না, লম্বা request তবুও কাটা পড়ে। মান রাখুন terminationGracePeriodSeconds (৪৫)-এর চেয়ে কম।'}
      - type: quote
        body: 'php-fpm: SIGTERM এখনই থামায়, SIGQUIT আগে কাজ শেষ করায়।'
    aside:
      - type: commands
        title: 'Worker ভদ্রভাবে চালানো'
        items:
          - {cmd: 'php bin/console messenger:consume async --time-limit=3600 --memory-limit=128M', desc: 'এক ঘণ্টা বা ১২৮MB পেরোলে নিজে ভদ্রভাবে থামে, supervisor আবার চালু করে'}
          - {cmd: 'php bin/console messenger:stop-workers', desc: 'deploy-র পর চলতি worker-দের শেষ message করে থামতে বলে, নতুন কোডে আবার ওঠে'}
      - type: tips
        items:
          - 'Deploy-র সময় worker-ও পুরোনো কোড চালাচ্ছে। messenger:stop-workers না চালালে তারা পুরোনো কোডেই থেকে যায়।'
          - 'মাঝপথে কাটা message আবার queue-তে ফেরে। তাই handler idempotent রাখুন, যাতে দ্বিতীয়বার চললেও ক্ষতি নেই।'
          - 'একবার পরীক্ষা করে দেখুন: ২০ সেকেন্ড ঘুমানো একটা request চালু করে container থামান, আর দেখুন request শেষ হচ্ছে কি না।'
      - type: refs
        items:
          - {to: 'messaging/delivery-guarantees', label: 'Message দুইবার এলে কী হয়'}
    check:
      q: 'Rolling deploy-এ পুরোনো সার্ভার আগে load balancer থেকে সরানো হয় কেন, আর php-fpm-এর জন্য SIGQUIT কেন?'
      a: 'না সরালে বন্ধ হওয়ার সময়ও নতুন request আসতে থাকে। SIGTERM-এ php-fpm চলমান request কেটে দেয়; শুধু SIGQUIT-এ সেগুলো শেষ হতে পারে।'

  - slug: rollback-trap
    title: 'ফাঁদ: কোড ফেরানো যায়, ডেটা যায় না'
    kind: pitfall
    tldr: 'Release-এ কলাম মুছে দিলে কোড রোলব্যাক করলেও পুরোনো কোড আর চলে না। রোলব্যাক নিরাপদ রাখতে migration ও কোডের release আলাদা রাখুন, আর plan আগে থেকে লিখুন।'
    keywords: ['rollback', 'destructive migration', 'down migration', 'rollback plan', 'feature flag', 'রোলব্যাক']
    blocks:
      - type: text
        body: |
          Deploy-এর পর error rate লাফিয়ে উঠলে আমরা প্রথমে ভাবি "আগের ভার্সনে ফিরি"। কিন্তু কোড ফেরানো সহজ, ডেটাবেস ফেরানো প্রায় অসম্ভব। যদি একই release-এ `phone` কলামটাই মুছে ফেলা হয়ে থাকে, তাহলে পুরোনো কোড ফিরলেও সে নতুন ডেটাবেসে ভেঙে পড়বে।
      - type: code
        lang: php
        file: 'migrations/Version20261120103000.php'
        variant: bad
        code: |
          public function up(Schema $schema): void
          {
              // কোড release-এর সাথে একই deploy-তে
              $this->addSql('ALTER TABLE "user" DROP phone');
          }

          public function down(Schema $schema): void
          {
              // ডেটা চিরতরে চলে গেছে, ফেরানো যায় না
              $this->addSql('ALTER TABLE "user" ADD phone VARCHAR(20) DEFAULT NULL');
          }
        marks:
