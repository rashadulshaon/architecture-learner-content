        correct: true
        why: 'পুরোনো পরিবেশ প্রস্তুত থাকে, সুইচ ঘোরালেই ফেরা যায়।'
      - text: 'সার্ভার ভাড়া খুবই সীমিত, বাড়তি সার্ভার রাখা যাবে না'
