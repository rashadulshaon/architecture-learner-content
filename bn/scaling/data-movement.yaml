slides:
  - slug: replica-lag-surprise
    title: 'অর্ডার দিলাম, অথচ "অর্ডার নেই"'
    kind: story
    tldr: 'Replica প্রাইমারির কপি পায় একটু দেরিতে। এই দেরিতে ব্যবহারকারী নিজের লেখা দেখতে পায় না, তথ্য পেছনে ফেরে, বা ঘটনার ক্রম উল্টে যায়।'
    keywords: ['replication lag', 'read replica', 'read your writes', 'stale read', 'eventual consistency', 'রেপ্লিকা']
    blocks:
      - type: metaphor
        icon: mail
        title: 'প্রধান ডাকঘর আর শাখা ডাকঘর'
        body: |
          রহিম প্রধান ডাকঘরে মানি-অর্ডার জমা দিল, খাতায় লেখা হলো। শাখা ডাকঘরের খাতায় সেই লাইন পৌঁছাতে ডাকপিয়নের কয়েক মিনিট লাগে। রহিম সোজা শাখায় গিয়ে জিজ্ঞেস করলে শুনবে, "এমন কোনো রেকর্ড নেই।" ডাকঘর ভুল করেনি, শুধু কপি এখনো আসেনি।
      - type: visual
        kind: sequence
        caption: 'লেখা primary-তে, পড়া replica-তে — মাঝের ২ সেকেন্ডে ভুল ফল'
