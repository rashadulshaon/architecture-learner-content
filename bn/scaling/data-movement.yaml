          - {from: primary, to: app, label: 'লেখা হয়েছে', dashed: true}
          - {from: app, to: user, label: 'অর্ডার পাতায় যান', dashed: true}
          - {from: user, to: app, label: 'অর্ডার #502 দেখান'}
          - {from: app, to: replica, label: 'অর্ডার #502 পড়ছি'}
          - {at: replica, note: 'কপি এখনো আসেনি (lag ২ সেকেন্ড)', tone: bad}
          - {from: replica, to: app, label: 'পাওয়া যায়নি', dashed: true, tone: bad}
          - {from: app, to: user, label: '404 — অর্ডার কই?', tone: bad, tip: 'ব্যবহারকারী ভাবে টাকা কেটে অর্ডারটা হারিয়ে গেছে। আসলে ডেটা ঠিকই আছে, শুধু ভুল জায়গা থেকে পড়া হয়েছে।'}
      - type: points
        title: 'Lag-এর তিন রকম উপদ্রব'
        style: cross
        items:
          - 'নিজের লেখা না দেখা: অর্ডার দিয়েই "অর্ডার নেই"।'
          - 'সময় পেছনে যাওয়া: একবার নতুন দেখা গেল, রিফ্রেশে আবার পুরনো (আরেক replica-তে)।'
          - 'ক্রম উল্টো: উত্তর দেখা গেল, কিন্তু যে প্রশ্নের উত্তর সেটা এখনো আসেনি।'
    aside:
      - type: problem
        body: 'Read replica দিয়ে পড়ার চাপ ভাগ হয়, কিন্তু বিনিময়ে "সবসময় সর্বশেষ" নিশ্চয়তা যায়। কোথায় সেটা মানা যায় আর কোথায় যায় না, তা ঠিক করাই এই ধাপের কাজ।'
      - type: refs
        items:
          - {to: 'data/replication', label: 'Replication কীভাবে কাজ করে'}
          - {to: 'data/consistency-models', label: 'Read-your-writes ও অন্য মডেল'}
    check:
      q: 'অর্ডার দিয়েই পাতা খুলতেই "অর্ডার নেই" দেখাল, কিছুক্ষণ পরে ঠিক। সবচেয়ে সম্ভাব্য কারণ কী?'
      a: 'Replication lag। অর্ডার primary-তে লেখা হয়েছে, কিন্তু পাতা দেখানোর পড়া গেছে এমন replica-তে, যেখানে লেখাটা তখনো পৌঁছায়নি।'

  - slug: read-your-writes
    title: 'ব্যবহারকারীকে তার নিজের লেখা দেখান'
    kind: howto
    tldr: 'লেখার পর কয়েক সেকেন্ড ওই ব্যবহারকারীর পড়া primary থেকে দিন। বাকি সবার পড়া replica থেকে। আর জরুরি পড়া (টাকা, স্টক) সবসময় primary থেকে।'
    keywords: ['read your writes', 'primary replica', 'DBAL connection', 'monotonic reads', 'LSN', 'sticky replica']
    blocks:
      - type: text
        body: |
          সহজ নিয়ম: যে ব্যবহারকারী এইমাত্র লিখেছে, তাকে কয়েক সেকেন্ড primary থেকে পড়ে দেখান। lag সাধারণত কয়েক সেকেন্ডের মধ্যে থাকে, তাই ৫ সেকেন্ড primary থেকে পড়লেই সে আর পুরনো ডেটা দেখে না। নিচে লেখার পর একটা ছোট cookie বসানো আর পড়ার সময় তা দেখে connection বাছা।
      - type: code
        lang: php
        file: 'src/Db/ReadConnectionPicker.php'
        variant: good
        code: |
          final class ReadConnectionPicker
          {
              private const STICKY_SECONDS = 5;

              public function __construct(
                  private readonly Connection $primary,               // default
                  private readonly Connection $replicaConnection,     // doctrine: replica
              ) {
              }

              #[AsEventListener(event: KernelEvents::RESPONSE)]
              public function markWrite(ResponseEvent $event): void
              {
                  if ($event->getRequest()->isMethodSafe()) {
                      return;                       // GET/HEAD-এ কিছু লেখা হয়নি
                  }
                  $event->getResponse()->headers->setCookie(
                      Cookie::create('last_write', (string) time())->withHttpOnly(true),
                  );
              }

              public function forRead(Request $request): Connection
              {
                  $lastWrite = (int) $request->cookies->get('last_write', '0');

                  return time() - $lastWrite < self::STICKY_SECONDS
                      ? $this->primary
                      : $this->replicaConnection;
              }
          }
        marks:
          - {line: 7, tip: 'DoctrineBundle "replica" নামের connection-কে `$replicaConnection` নামে autowire করে দেয়। default connection-টা শুধু type দিয়েই আসে।'}
          - {line: 18, tip: 'যেকোনো POST, PUT, DELETE-এর পর ব্যবহারকারীর ব্রাউজারে সময়সহ cookie বসে। সার্ভারে কোনো state জমে না।'}
          - {line: 26, tip: 'শেষ লেখার ৫ সেকেন্ডের মধ্যে হলে primary থেকে পড়ুন। lag এর চেয়ে বেশি হলে replica নিরাপদ।'}
      - type: points
        title: 'অন্য উপায়গুলো'
        style: dot
        items:
          - 'POST-এর response-এই নতুন অর্ডারটা ফেরত দিন, তাহলে পাতায় যাওয়ার পড়াই লাগে না।'
          - 'টাকা, স্টক বা permission-এর মতো জরুরি পড়া সবসময় primary থেকে।'
          - 'ব্যবহারকারী ধরে একই replica বাছুন (নিচের কোড), তাহলে সময় কখনো পেছনে যায় না।'
      - type: code
        lang: php
        file: 'src/Db/ReplicaPicker.php'
        variant: good
        code: |
          public function replicaFor(int $userId): Connection
          {
              // একই ব্যবহারকারী সবসময় একই replica-তে, তাই দ্বিতীয় রিফ্রেশে
              // প্রথমবারের চেয়ে পুরনো কপি দেখা যায় না
              return $this->replicas[$userId % count($this->replicas)];
          }
        marks:
          - {line: 5, tip: 'দাম: ওই replica মরলে তার ব্যবহারকারীরা অন্যটায় সরে যায়, একবার পুরনো কপি দেখতে পারে। replica-গুলোর মধ্যে চাপও অসম হতে পারে।'}
    aside:
      - type: tips
        items:
          - 'lag মাপুন: PostgreSQL replica-তে `SELECT now() - pg_last_xact_replay_timestamp();`। সবসময় alert রাখুন।'
          - 'sticky সময় lag-এর p99-এর চেয়ে বেশি রাখুন, নইলে ফাঁক থেকে যাবে।'
      - type: when
        use:
          - 'ব্যবহারকারীর নিজের লেখার ঠিক পরে: পোস্ট, এডিট, অর্ডার'
          - 'বাকি সব পড়া replica থেকে চলে: feed, count, কয়েক সেকেন্ডের পুরনো তালিকা'
        avoid:
          - 'টাকা, স্টক, permission: শুধু ৫ সেকেন্ড নয়, সবসময় primary থেকে পড়ুন'
          - 'lag প্রায়ই ৫ সেকেন্ড পেরোলে: আগে lag ঠিক করুন, এই জানালা তা ঢাকতে পারে না'
      - type: commands
        title: 'Lag দেখা (PostgreSQL)'
        items:
          - {cmd: 'SELECT now() - pg_last_xact_replay_timestamp();', desc: 'replica-তে চালান: কত পেছনে আছে'}
          - {cmd: 'SELECT client_addr, replay_lag FROM pg_stat_replication;', desc: 'primary-তে চালান: প্রতিটা replica-র lag'}
    check:
      q: 'ব্যবহারকারী পোস্ট করার ৩ সেকেন্ড পরে feed রিফ্রেশ করে। কেন primary থেকে পড়ানো হয়, আর কতক্ষণ?'
      a: 'replica-তে লেখাটা পৌঁছায়নি এমন হতে পারে। তাই শেষ লেখার পর lag-এর চেয়ে বেশি সময় (যেমন ৫ সেকেন্ড) পর্যন্ত সেই ব্যবহারকারীর পড়া primary থেকে দিতে হয়।'

  - slug: moving-in-steps
    title: 'চলন্ত দোকানের গুদাম বদল'
    kind: concept
    tldr: 'বড় ডেটা এক রাতে সরানো যায় না। নতুন জায়গা বানান, নতুন লেখা দুই জায়গায় দিন, পুরনো ডেটা কপি করুন, মিলিয়ে দেখুন, তারপর ধাপে ধাপে পড়া সরান।'
    keywords: ['data migration', 'rebalancing', 'dual write', 'cutover', 'shadow read', 'resharding', 'ডেটা মাইগ্রেশন']
    blocks:
      - type: metaphor
        icon: truck
        title: 'দোকান খোলা রেখে গুদাম বদল'
        body: |
          পুরনো গুদাম ছোট হয়ে গেছে, মাল যাবে নতুন গুদামে। কিন্তু দোকান এক দিনও বন্ধ রাখা যাবে না। তাই নতুন মাল দুই গুদামেই রাখা হয়, ট্রাকে করে পুরনো মাল একটু একটু করে সরানো হয়, তারপর হিসাব মিলিয়ে দেখা হয়। সব মিলে গেলে তবেই খদ্দেরকে নতুন গুদামে পাঠানো হয়।
      - type: visual
        kind: steps
        caption: 'বড় ডেটা সরানোর ছক — ডেটাবেস বদল, নতুন shard, নতুন টেবিল, সবকিছুতে একই'
        steps:
          - {title: '১. নতুন জায়গা বানান', body: 'খালি schema, index সহ প্রস্তুত', tip: 'নতুন টেবিল, shard বা ডেটাবেস আগে থেকে তৈরি। পুরনো ব্যবস্থায় তখনো কিছু বদলায়নি।'}
          - {title: '২. Dual write চালু', body: 'নতুন লেখা পুরনো আর নতুন, দুই জায়গায়', tip: 'এই ধাপ থেকে নতুন ডেটা আর পিছিয়ে পড়ে না। লিখুন upsert হিসেবে, যাতে backfill যে সারিতে এখনো পৌঁছায়নি তার বদলও ঢোকে।'}
          - {title: '৩. Backfill', body: 'পুরনো ডেটা ধীরে, ছোট ছোট batch-এ কপি', tip: 'ধীরে চলে যেন চালু সাইটের ওপর চাপ না পড়ে। পরের স্লাইডে কোড আছে।'}
          - {title: '৪. যাচাই', body: 'count আর checksum মেলান, shadow read', tip: 'shadow read মানে নতুন জায়গা থেকেও পড়ে ফল মেলানো, কিন্তু ব্যবহারকারীকে দেখায় পুরনোটাই।'}
          - {title: '৫. পড়া সরান', body: '১% → ১০% → ১০০% নতুন থেকে', tip: 'ধাপে ধাপে সরালে সমস্যা ধরা পড়লে অল্প ব্যবহারকারী ভোগে, আর এক ধাপ পিছিয়ে আসা যায়।', tone: accent}
          - {title: '৬. পুরনোটা বন্ধ', body: 'লেখা বন্ধ, কিছুদিন রেখে তারপর মুছুন', tip: 'সরাসরি মুছে দেবেন না। কিছুদিন পুরনোটা রেখে দিলে ভুল ধরা পড়লে ফেরার পথ থাকে।'}
      - type: quote
        body: 'বড় ডেটা এক ঝটকায় সরে না। ছোট ধাপে সরান, প্রতি ধাপে মেলান, ফেরার পথ খোলা রেখে।'
    aside:
      - type: when
        use:
          - 'ডেটাবেস বা storage engine বদল'
          - 'shard যোগ বা বাদ দিয়ে rebalance'
          - 'বড় টেবিলের গঠন বদল'
        avoid:
          - 'ছোট টেবিল, যা এক মিনিটে কপি হয়ে যায় — সরল পথই যথেষ্ট'
          - 'ছোট পরিকল্পিত downtime চললে: dual write লেখা দ্বিগুণ করে, আর পরে সরাতে হয় এমন কোডও বাড়ায়'
      - type: refs
        items:
          - {to: 'data/zero-downtime-migrations', label: 'Expand/contract migration'}
          - {to: 'scaling/consistent-hashing', label: 'Shard যোগ হলে কম ডেটা নড়ানো'}
    check:
      q: 'নতুন জায়গায় পড়া সরানোর আগে dual write আর backfill-এর কোনটা আগে চালু করতে হবে, কেন?'
      a: 'Dual write আগে। না হলে backfill চলার সময় আসা নতুন লেখা নতুন জায়গায় পৌঁছাবে না, আর সেই ফাঁক আর কখনো ভরবে না।'

  - slug: batched-backfill
    title: 'Backfill: ছোট batch, ধীর গতি, থেমে আবার শুরু'
    kind: howto
    tldr: 'Backfill চলবে id ধরে ছোট batch-এ (keyset), idempotent INSERT দিয়ে, আর replica lag বাড়লে থেমে। তাহলে চালু সাইটও ধীর হয় না, মাঝপথে থামলে আবার শুরুও করা যায়।'
    keywords: ['backfill', 'batch', 'throttle', 'keyset', 'idempotent', 'console command', 'ON CONFLICT']
    blocks:
      - type: code
        lang: sql
        file: 'যা করা উচিত নয়'
        variant: bad
        code: |
          INSERT INTO orders_v2 (id, status, total_cents)
          SELECT id, status, total_cents FROM orders;
        marks:
          - {line: 1, tip: 'কোটি সারি একটা transaction-এ: লম্বা লক, WAL-এর (প্রতিটা বদলের লগ, যা replica চালিয়ে নেয়) ঢেউ, replica-র lag মিনিটের পর মিনিট। মাঝপথে ব্যর্থ হলে সব rollback।'}
      - type: code
        lang: php
        file: 'src/Command/BackfillOrdersCommand.php'
        variant: good
        code: |
          protected function execute(InputInterface $in, OutputInterface $out): int
          {
              $last = (int) $in->getOption('from');      // থেমে গেলে এখান থেকে আবার

              while (null !== ($max = $this->db->fetchOne(
                  'SELECT max(id) FROM (
                       SELECT id FROM orders WHERE id > ? ORDER BY id LIMIT 1000
                   ) t',
                  [$last],
              ))) {
                  $this->db->executeStatement(
                      'INSERT INTO orders_v2 (id, status, total_cents)
                       SELECT id, status, total_cents FROM orders WHERE id > ? AND id <= ?
                       ON CONFLICT (id) DO NOTHING',
                      [$last, $max],
                  );
                  $last = (int) $max;
                  $out->writeln('done up to '.$last);

                  $lag = (float) $this->replicaConnection->fetchOne(
                      'SELECT extract(epoch FROM now() - pg_last_xact_replay_timestamp())'
                  );
                  usleep($lag > 5 ? 5_000_000 : 200_000);   // lag বাড়লে থামুন
              }

              return Command::SUCCESS;
          }
        marks:
          - {line: 7, tip: 'OFFSET নয়, id > ? দিয়ে keyset। ১ কোটিতম সারিতেও প্রতি batch একই দ্রুত।'}
          - {line: 14, tip: 'ON CONFLICT DO NOTHING মানে idempotent: আবার চালালে ক্ষতি নেই, আর dual write নতুন টেবিলে নতুন মানে যে সারি আগেই বসিয়েছে, এই পুরনো কপি তা মুছে দেয় না।'}
          - {line: 23, tip: 'replica-র lag ৫ সেকেন্ডের বেশি হলে ৫ সেকেন্ড বিরতি, নইলে ০.২ সেকেন্ড। এভাবে চালু সাইটের পড়াও ধীর হয় না।'}
    aside:
      - type: tips
        items:
          - 'প্রতি batch ছোট transaction হোক (১০০০ সারি মোটামুটি)। বড় হলে লক আর lag বাড়ে।'
          - 'ধীর হলেও চলে: ১০০০ সারির batch আর ০.২ সেকেন্ড বিরতিতে ১ কোটি সারি = ১০,০০০ batch, শুধু বিরতিতেই প্রায় ৩৩ মিনিট। এক রাতেই হয়।'
          - 'রাতের কম ভিড়ে চালান, আর batch-এর আকার ও বিরতি কমান্ডের option করে রাখুন যেন চলতি অবস্থায় বদলানো যায়।'
      - type: commands
        title: 'চালানো'
        items:
          - {cmd: 'php bin/console app:backfill:orders --from=0', desc: 'শুরু থেকে'}
          - {cmd: 'php bin/console app:backfill:orders --from=48210000', desc: 'থেমে গেলে শেষ id থেকে'}
    check:
      q: 'backfill কমান্ড মাঝরাতে ক্র্যাশ করল। আবার চালালে কেন ক্ষতি নেই, আর কোথা থেকে শুরু করবেন?'
      a: 'INSERT ... ON CONFLICT DO NOTHING idempotent, তাই আগে কপি হওয়া সারি দ্বিতীয়বার ঢোকে না। শেষ লগ করা id থেকে `--from` দিয়ে শুরু করবেন।'

  - slug: dual-write-verify
    title: 'Dual write ফসকালে: পুরনোটাই সত্য, মিলিয়ে নিন'
    kind: pitfall
    tldr: 'দুই জায়গায় লিখলে একটা ব্যর্থ হতে পারে। পুরনো ব্যবস্থাকে সত্যের উৎস ধরুন, নতুনে ব্যর্থ লেখা পরে মেরামত করুন, আর count ও checksum দিয়ে ধাপে ধাপে যাচাই করুন।'
    keywords: ['dual write', 'verification', 'checksum', 'source of truth', 'reconciliation', 'cutover', 'shadow read']
    blocks:
      - type: text
        body: |
          Dual write-এ দুটো লেখা আলাদা, তাই একটা সফল আর অন্যটা ব্যর্থ হতেই পারে। নতুন জায়গার ব্যর্থতায় ব্যবহারকারীর অর্ডার আটকানো চলবে না। তাই পুরনোটা সত্যের উৎস, নতুনে ব্যর্থ হলে লগ করে মেরামতের কাজ queue-তে পাঠান।
      - type: code
        lang: php
        file: 'src/Order/DualWriteOrderStore.php'
        variant: good
        code: |
          public function save(Order $order): void
          {
              $this->oldStore->save($order);            // সত্যের উৎস: পুরনোটাই

              try {
                  $this->newStore->save($order);       // upsert: সারি না থাকলে বানিয়ে নেয়
              } catch (\Throwable $e) {
                  // নতুনে ব্যর্থ হলে অর্ডার আটকাবো না — পরে ঠিক করব
                  $this->logger->error('dual_write_failed', ['order' => $order->id, 'e' => $e]);
                  $this->bus->dispatch(new RepairOrderCopy($order->id));
              }
          }
        marks:
          - {line: 3, tip: 'পড়া সরানোর আগে পর্যন্ত সত্য মানে পুরনোটা। এখানে ব্যর্থ হলে পুরো save ব্যর্থ — স্বাভাবিক আচরণ।'}
          - {line: 10, tip: 'RepairOrderCopy পুরনো থেকে সারিটা আবার পড়ে নতুনে বসায়। idempotent হতে হবে, কারণ একাধিকবার চলতে পারে।'}
      - type: code
        lang: sql
        file: 'দুই জায়গায় একই চেকসাম (id-র range ধরে)'
        code: |
          SELECT count(*) AS n,
                 sum(hashtextextended(concat_ws('|', id, status, total_cents), 0)) AS checksum
            FROM orders            -- নতুন জায়গায় চালান orders_v2-তে
           WHERE id BETWEEN 1 AND 100000;
        marks:
          - {line: 2, tip: 'শুধু count মিললেই হয় না। একই সারি-সংখ্যায় কিছু সারির মান আলাদা হতে পারে, checksum সেটা ধরে।'}
          - {line: 4, tip: 'পুরো টেবিল একবারে নয়, id-র টুকরো ধরে মেলান। অমিল পেলে ঠিক কোন টুকরোয় সমস্যা, তা সরাসরি জানা যায়।'}
      - type: quote
        body: 'যাচাই না করে পড়া সরাবেন না। count-এ মেলা যথেষ্ট নয়, মান মেলাতে হবে।'
    aside:
      - type: pitfalls
        items:
          - 'পুরনো ও নতুনে অসম ক্রমে লেখা হলে ("A তারপর B" বনাম "B তারপর A") শেষ মান আলাদা হতে পারে। একই সারির লেখা এক queue-তে ক্রমে রাখুন।'
          - 'চলমান ডেটার count কখনো হুবহু মেলে না। কম পরিবর্তনের রাত বা updated_at-এর একটা পুরনো কাটঅফ ব্যবহার করুন।'
          - 'দুই লেখার মাঝে প্রসেস মরলে মেরামতের কাজই তৈরি হয় না। সেই ফাঁক শুধু checksum যাচাইয়ে ধরা পড়ে।'
      - type: refs
        items:
          - {to: 'ledgers/reconciliation', label: 'Reconciliation: দুই হিসাব মেলানো'}
          - {to: 'workflows/outbox-inbox', label: 'Outbox দিয়ে নিরাপদ দ্বিতীয় লেখা'}
    check:
      q: 'দুই টেবিলের count ১ কোটি ২০ লাখ করে মিলেছে। তবু কেন cutover করা নিরাপদ নয়?'
      a: 'count শুধু সারির সংখ্যা মেলায়, মান নয়। কিছু সারির status বা টাকার অঙ্ক আলাদা থাকতে পারে। range ধরে checksum বা shadow read দিয়ে মান মেলাতে হবে।'

flashcards:
  - q: 'Replication lag কী?'
    a: 'Primary-তে লেখা হওয়া থেকে সেটা replica-তে পৌঁছানো পর্যন্ত সময়-ফারাক। এই সময়ে replica পুরনো ডেটা দেখায়।'
    more: |
      সাধারণত লাখ-লাখ পরিবর্তনের সময় বা replica ধীর হলে lag বাড়ে। পড়ার চাপ ভাগ করতে replica থেকে পড়লে এই পুরনো ডেটা দেখার ঝুঁকিও নিতে হয়। তাই lag সবসময় মাপা আর alert রাখা দরকার। বিস্তারিত: [[data/replication|replication]]।
    ref: replica-lag-surprise
  - q: 'Replication lag-এ ব্যবহারকারী কী কী উপদ্রব দেখে?'
    a: 'নিজের লেখা দেখে না, তথ্য পেছনে ফেরে (monotonic reads ভাঙে), আর ঘটনার ক্রম উল্টো দেখায়।'
    more: |
      অর্ডার দিয়েই "অর্ডার নেই" দেখা প্রথম ধরন। দ্বিতীয়টা হয় দুই replica-র lag আলাদা হলে: একটায় নতুন, আরেকটায় পুরনো। তৃতীয়টায় উত্তর আগে পৌঁছায়, প্রশ্ন পরে।
    ref: replica-lag-surprise
  - q: 'Read-your-writes কীভাবে নিশ্চিত করবেন?'
    a: 'ব্যবহারকারী লেখার পর কিছুক্ষণ তার পড়া primary থেকে দিন, বা POST-এর response-এই নতুন ডেটা ফেরত দিন।'
    more: |
      Symfony-তে লেখার response-এ একটা `last_write` cookie বসিয়ে, পড়ার সময় তা দেখে ৫ সেকেন্ড পর্যন্ত primary connection বাছা যায়। টাকা বা স্টকের মতো জরুরি পড়া সবসময় primary থেকে হওয়াই ভালো।
    ref: read-your-writes
  - q: 'Dual write ধাপে পুরনো আর নতুন, কোনটা সত্যের উৎস?'
    a: 'পড়া সরানোর আগে পর্যন্ত পুরনোটা। নতুনে লেখা ব্যর্থ হলে লগ করুন আর মেরামতের কাজ পাঠান; ব্যবহারকারীর কাজ আটকাবে না।'
    more: |
      দুই জায়গার লেখা আলাদা, তাই একসাথে সফল বা ব্যর্থ হওয়ার গ্যারান্টি নেই। যাচাই আর backfill সেই ফাঁক পরে ভরে। নতুন জায়গা সত্য হবে শুধু cutover-এর পর।
    ref: dual-write-verify
  - q: 'বড় ডেটা সরানোর সঠিক ক্রম কী?'
    a: 'নতুন জায়গা তৈরি, dual write, backfill, যাচাই, ধাপে পড়া সরানো, শেষে পুরনো বন্ধ।'
    more: |
      Dual write আগে না করলে backfill চলার সময়ের নতুন লেখা হারিয়ে যায়। পড়া সরানো হয় ১% থেকে শুরু করে ধাপে ধাপে, যাতে সমস্যা ধরা পড়লে অল্প ব্যবহারকারী ভোগে। পুরনো জায়গা কিছুদিন রেখে দিন ফেরার পথ হিসেবে।
    ref: moving-in-steps
  - q: 'Backfill কমান্ডের চারটা নিয়ম কী?'
    a: 'ছোট batch, keyset (id > last), idempotent INSERT (ON CONFLICT), আর replica lag বাড়লে ধীর করা।'
    more: |
      OFFSET গভীরে গিয়ে ধীর হয়, তাই keyset। ON CONFLICT DO NOTHING থাকায় কমান্ড থেমে আবার চালানো নিরাপদ। প্রতি batch-এর পর বিরতি দিয়ে চালু সাইটের ওপর চাপ নিয়ন্ত্রণে রাখা হয়।
    ref: batched-backfill
  - q: 'দুই টেবিলে count মিললেই কি কপি ঠিক আছে?'
    a: 'না। count শুধু সংখ্যা মেলায়। মান মেলাতে id-র range ধরে checksum বা shadow read করতে হয়।'
    more: |
      এক টেবিলে status 'paid' আর অন্যটায় 'pending' থাকলেও count সমান। range ধরে checksum মেলালে কোন টুকরোয় অমিল তা সরাসরি জানা যায়, ফলে শুধু সেই অংশ আবার কপি করলেই চলে।
    ref: dual-write-verify
  - q: 'এক ব্যবহারকারী replica-র মধ্যে সময় পেছনে যাওয়া কীভাবে ঠেকাবেন?'
    a: 'ব্যবহারকারী ধরে একটা replica বেঁধে দিন, যেমন user id-কে replica-সংখ্যা দিয়ে ভাগ করে ভাগশেষ। একটা replica শুধু সামনে এগোয়, তাই দেখা তথ্য আর পেছনে যায় না।'
    more: |
      বেঁধে না দিলে এক রিফ্রেশ যায় নতুন পোস্টওয়ালা replica-তে, পরের রিফ্রেশ যায় যেটায় পোস্ট আসেনি সেটায়। বেঁধে দিলে প্রতি ব্যবহারকারীর বাছাই স্থির থাকে। দাম: ওই replica মরলে তার ব্যবহারকারীরা অন্যটায় সরে যায় এবং একবার পুরনো কপি দেখতে পারে, আর চাপও অসম হতে পারে।
    ref: read-your-writes
  - q: 'Migration-এ dual write কেন upsert করে, আর backfill কেন DO NOTHING দেয়?'
    a: 'backfill কপি করার সময় সারিটা বদলাতে পারে। Upsert নতুন টেবিলে সবচেয়ে নতুন মান বসায়, আর DO NOTHING থাকায় backfill-এর পুরনো কপি তা মুছতে পারে না।'
    more: |
      ক্রমটা ভাবুন: backfill একটা সারি পড়ল, গ্রাহক সেটা বদলালেন, dual write নতুন মান বসাল, তারপর backfill তার পুরনো কপি ঢোকাতে গেল। DO NOTHING থাকলে সেই insert বাদ পড়ে, নতুন মান টিকে থাকে। dual write শুধু update করলে সারিটা তখনো না থাকায় বদলটাই হারাত।
    ref: batched-backfill

quiz:
  - q: 'একজন ব্যবহারকারী কমেন্ট করে পাতা রিফ্রেশ করলেই নিজের কমেন্ট দেখে না, ১০ সেকেন্ড পরে দেখে। কোন সমাধানগুলো ঠিক?'
    hint: 'কমেন্ট primary-তে আছে, কিন্তু পাতা কোথা থেকে পড়ছে?'
    options:
      - text: 'লেখার পর কিছু সেকেন্ড সেই ব্যবহারকারীর পড়া primary থেকে দেওয়া'
        correct: true
        why: 'এটাই read-your-writes। lag-এর সময়টুকু primary-র নতুন ডেটা দেখা যায়।'
      - text: 'POST-এর response-এ নতুন কমেন্টটা ফেরত দিয়ে সরাসরি পাতায় বসানো'
        correct: true
        why: 'ডেটাবেস থেকে পড়ারই দরকার পড়ে না, তাই lag-এর প্রশ্নই ওঠে না।'
      - text: 'আরও replica যোগ করা'
        correct: false
        why: 'আরও replica মানে আরও পিছিয়ে-থাকা কপি; lag-এর সমস্যা কমে না, বরং বাড়তে পারে।'
      - text: 'সব পড়া primary থেকে করে replica বন্ধ করে দেওয়া'
        correct: false
        why: 'সমস্যা মিটবে, কিন্তু replica-র মূল উদ্দেশ্য (পড়ার চাপ ভাগ) নষ্ট হবে। অল্প সময়ের জন্য বাছাই করাই যথেষ্ট।'
    ref: read-your-writes
  - q: 'একজন ব্যবহারকারী পাতা রিফ্রেশ করলে প্রথমবার নতুন পোস্ট দেখে, দ্বিতীয়বার সেটা উধাও, তৃতীয়বার আবার দেখে। কারণ ও প্রতিকার কী?'
    hint: 'প্রতিবার রিফ্রেশ কি একই replica-তে যাচ্ছে?'
    options:
      - text: 'দুই replica-র lag আলাদা; ব্যবহারকারী অনুযায়ী একই replica বেছে নিলে (user id hash) সময় পেছনে যায় না'
        correct: true
        why: 'প্রতিবার ভিন্ন replica থেকে পড়ায় এক পড়া নতুন, আরেকটা পুরনো। একজনকে সবসময় একই replica-তে পাঠালে অন্তত আগের চেয়ে পেছনে যাবে না।'
      - text: 'ব্রাউজারের cache-এর দোষ, Ctrl+F5 চাপতে হবে'
        correct: false
        why: 'ব্রাউজার cache একই উত্তর বারবার দেখায়, কখনো আসে কখনো যায় না এমন নয়।'
      - text: 'primary-তে লেখা হারিয়ে যাচ্ছে'
        correct: false
        why: 'লেখা হারালে কোনো replica-তেই পৌঁছাত না।'
      - text: 'ডেটাবেসের index নষ্ট'
        correct: false
        why: 'নষ্ট index-এ ফল সবসময় ভুল আসত, কখনো ঠিক কখনো ভুল নয়।'
    ref: replica-lag-surprise
  - q: 'নিচের কোডে সমস্যা কী?'
    lang: sql
    code: |
      -- ২০ কোটি সারির টেবিলে, প্রোডাকশনে
      INSERT INTO orders_v2 (id, status, total_cents)
      SELECT id, status, total_cents FROM orders;
    hint: 'এই একটা statement শেষ হতে কত সময় নেবে, আর সে সময় অন্যদের কী হবে?'
    options:
      - text: 'বিশাল একটা transaction: লক ও WAL-এর ঢেউ, replica-র lag বাড়ে, ব্যর্থ হলে সব rollback, আর থামিয়ে আবার শুরু করা যায় না'
        correct: true
        why: 'ছোট batch, id-ভিত্তিক keyset আর lag দেখে বিরতি দিয়ে চালানোই সঠিক।'
      - text: 'কোনো সমস্যা নেই, ডেটাবেস নিজে batch করে নেয়'
        correct: false
        why: 'একটা statement একটাই transaction। ডেটাবেস নিজে থেকে ভেঙে দেয় না।'
      - text: 'শুধু id কলামে index নেই বলে ধীর'
        correct: false
        why: 'id সম্ভবত primary key। সমস্যা index-এ নয়, অপারেশনের আকারে।'
      - text: 'INSERT-এর বদলে COPY ব্যবহার করলেই সব ঠিক'
        correct: false
        why: 'COPY দ্রুত হতে পারে, কিন্তু একই বিশাল transaction আর lag-এর সমস্যা থেকে যায়।'
    ref: batched-backfill
  - q: 'dual write চলাকালীন নতুন জায়গায় লেখা সাময়িকভাবে ব্যর্থ হলো। সবচেয়ে ভালো আচরণ কোনটা?'
    hint: 'ব্যবহারকারী অর্ডার দিয়েছে; কোন জায়গাটা এখনো সত্যের উৎস?'
    options:
      - text: 'পুরনো জায়গায় লেখা সফল থাকলে অর্ডার সফল ধরুন; নতুনের ব্যর্থতা লগ করে মেরামতের কাজ queue-তে পাঠান'
        correct: true
        why: 'সত্যের উৎস এখনো পুরনোটা। ব্যবহারকারীর অর্ডার আটকানো যাবে না, আর ফাঁক পরে ভরা যায়।'
      - text: 'দুটোই rollback করে ব্যবহারকারীকে error দেখান'
        correct: false
        why: 'নতুন ব্যবস্থার সমস্যায় ব্যবহারকারীর টাকার লেনদেন আটকে যায়; অকারণে সাইট খারাপ হয়।'
      - text: 'নতুনের ব্যর্থতা উপেক্ষা করুন'
        correct: false
        why: 'ফাঁকটা আর কখনো ভরবে না, cutover-এ ডেটা হারিয়ে যাবে।'
      - text: 'নতুনকে সত্যের উৎস করে পুরনোটা ফেলে দিন'
        correct: false
        why: 'যাচাই আর backfill শেষ হয়নি, এ অবস্থায় সত্যের উৎস বদলানো ডেটা হারানোর পথ।'
    ref: dual-write-verify
  - q: 'backfill অর্ডার #৯ পড়েছে "pending" অবস্থায়। এরপর গ্রাহক টাকা দিলেন, পুরনো টেবিলে এখন "paid"। কোন ব্যবস্থায় নতুন টেবিলে "paid" টিকে থাকে?'
    hint: 'শেষে কে লেখে, আর সারি থাকলে backfill-এর INSERT কী করে?'
    options:
      - text: 'dual write নতুন টেবিলে upsert করে, আর backfill ON CONFLICT DO NOTHING দিয়ে insert করে'
        correct: true
        why: 'upsert আগে হলে backfill-এর পুরনো কপি বাদ পড়ে। backfill আগে হলে upsert সেটা "paid" দিয়ে বদলে দেয়। দুই ক্রমেই "paid" জেতে।'
      - text: 'dual write শুধু UPDATE করে, আর backfill ON CONFLICT DO UPDATE ব্যবহার করে'
        correct: false
        why: 'backfill না পৌঁছালে UPDATE-এর জন্য সারিই থাকে না, আর পরে DO UPDATE "paid"-কে পুরনো "pending" দিয়ে মুছে দেয়।'
      - text: 'backfill চলার সময় সাইট বন্ধ রাখা'
        correct: false
        why: 'কাজ হবে, কিন্তু দোকান খোলা রেখে সরানোর উদ্দেশ্যই নষ্ট।'
      - text: 'backfill দুইবার চালিয়ে দ্বিতীয় ফল রাখা'
        correct: false
        why: 'দ্বিতীয়বারও কোনো এক মুহূর্তে পড়ে, তাই একই race থেকে যায়।'
    ref: batched-backfill
  - q: 'cutover-এর আগে দুই টেবিলে সারির সংখ্যা সমান (১,২০০,০০০)। কেন তবু চেকসাম মেলাতে হবে?'
    hint: 'দুই সারি একই id-তে থাকলেও কি তাদের মান এক হতেই হবে?'
    options:
      - text: 'সংখ্যা সমান থাকলেও কিছু সারির মান (status, টাকা) আলাদা হতে পারে; checksum সেটা ধরে'
        correct: true
        why: 'backfill-এর পর যেসব সারি বদলেছে, সেগুলো dual write-এর ফাঁকে ভুল থাকতে পারে। count এটা দেখে না।'
      - text: 'checksum দ্রুত, তাই count-এর বদলে সবসময় সেটাই'
        correct: false
        why: 'কারণ দ্রুত হওয়া নয়। count সস্তা প্রাথমিক পরীক্ষা, checksum মান মেলায়।'
      - text: 'count মিললে কখনো checksum মিলবে না'
        correct: false
        why: 'ঠিক ডেটা থাকলে দুটোই মেলে। count শুধু পর্যাপ্ত প্রমাণ নয়।'
      - text: 'checksum দরকার নেই, shadow read-ই যথেষ্ট; দুটো একই কথা'
        correct: false
        why: 'shadow read শুধু ব্যবহারকারীর চাওয়া সারিগুলো মেলায়; কম পড়া সারি checksum-এ ধরা পড়ে।'
    ref: dual-write-verify
