slides:
  - slug: bigger-or-more
    title: 'এক বড় সার্ভার, নাকি অনেক ছোট সার্ভার?'
    kind: story
    tldr: 'Vertical = একই সার্ভারকে শক্তিশালী করা, horizontal = সমান সার্ভারের সংখ্যা বাড়ানো। প্রথমটা সহজ কিন্তু ছাদ আছে, দ্বিতীয়টার ছাদ নেই কিন্তু অ্যাপকে তৈরি থাকতে হয়।'
    keywords: ['vertical scaling', 'horizontal scaling', 'scale up', 'scale out', 'সার্ভার বাড়ানো', 'স্কেলিং']
    blocks:
      - type: metaphor
        icon: shop
        title: 'বিরিয়ানির হোটেলের ভিড়'
        body: |
          ভিড় বাড়লে মালিকের সামনে দুই পথ। হয় আরও বড় ডেক আর জোরালো চুলা কেনা — দোকান একটাই থাকে। নয়তো পাশের গলিতে আরেকটা শাখা খোলা। বড় চুলার একটা সীমা আছে, আর সেটা সারানোর দিন পুরো দোকান বন্ধ। শাখা খুললে ভিড় ভাগ হয়, একটা বন্ধ হলেও অন্যটা চলে।
      - type: visual
        kind: compare
        caption: 'একই ভিড়ে দুই রকম উত্তর'
        columns:
          - title: 'Vertical (scale up)'
            tone: warn
            icon: server
            tip: 'একটাই মেশিন, শুধু CPU আর RAM বাড়ে। কোডে হাত দিতে হয় না, তাই প্রথম চেষ্টায় এটাই সবচেয়ে সস্তা।'
            items:
              - 'কোড বদলাতে হয় না'
              - 'বদলানোর সময় একটু downtime'
              - 'সবচেয়ে বড় মেশিনের পর আর পথ নেই'
              - 'মেশিন মরলে সবকিছু বন্ধ'
          - title: 'Horizontal (scale out)'
            tone: good
            icon: layers
            tip: 'একই অ্যাপের অনেকগুলো কপি পাশাপাশি চলে। ক্ষমতা প্রায় সীমাহীন, কিন্তু অ্যাপকে এর জন্য আগে থেকে তৈরি থাকতে হয়।'
            items:
              - 'ছোট সার্ভার যোগ করলেই ক্ষমতা বাড়ে'
              - 'একটা মরলে বাকিরা চলে'
              - 'ভিড় ভাগ করার জন্য load balancer লাগে'
              - 'অ্যাপকে stateless হতে হয়'
      - type: quote
        body: 'Vertical সহজ, কিন্তু ছাদ আছে। Horizontal-এর ছাদ নেই, কিন্তু অ্যাপকে তার জন্য তৈরি থাকতে হয়।'
    aside:
      - type: when
        use:
          - 'Vertical: এখনই দ্রুত আরাম দরকার আর সার্ভার ছোট'
          - 'Horizontal: সার্ভার মরলেও সাইট চালু রাখতে হবে'
        avoid:
          - 'Vertical: ডেটাবেস ইতিমধ্যে সবচেয়ে বড় মেশিনে'
          - 'Horizontal: অ্যাপ এখনো নিজের সার্ভারের ফাইলে কিছু জমায়'
      - type: terms
        items:
          - {term: 'Scale up', meaning: 'একই মেশিনে আরও CPU, RAM, ডিস্ক বসানো।'}
          - {term: 'Scale out', meaning: 'একই কাজের জন্য আরও মেশিন যোগ করা।'}
    check:
      q: 'সার্ভার মরে গেলেও সাইট চালু থাকবে — এই লক্ষ্যে vertical না horizontal, কেন?'
      a: 'Horizontal। অনেকগুলো সার্ভার থাকলে একটা মরলেও বাকিরা কাজ চালায়। একটা বড় সার্ভার মরলে পুরো সাইট বন্ধ।'

  - slug: stateless-app
    title: 'অনেক সার্ভারের শর্ত: কেউ কিছু মনে রাখবে না'
    kind: concept
    tldr: 'অনেক সার্ভারে অ্যাপ চালাতে হলে কোনো সার্ভার নিজের ভেতরে session, ফাইল বা cache জমাতে পারবে না। জমানোর জায়গা হবে Redis, ডেটাবেস আর object storage।'
    keywords: ['stateless', 'session', 'sticky', 'shared state', 'Redis', 'স্টেটলেস', 'শর্ত']
    blocks:
      - type: metaphor
        icon: book
        title: 'শাখা বদলালে বাকির খাতা কই?'
        body: |
          প্রতিটা শাখার নিজের বাকির খাতা থাকলে করিম ১ নম্বর শাখায় বাকি রেখে ২ নম্বরে গেলে কেউ তাকে চিনবে না। তাই সব শাখা একটাই কেন্দ্রীয় খাতা দেখে। সার্ভারও ঠিক তাই: ব্যবহারকারীর login, কার্ট, আপলোড করা ছবি — কিছুই কোনো একটা সার্ভারের নিজের ডিস্কে বা মেমরিতে থাকলে চলবে না।
      - type: visual
        kind: flow
        caption: 'একই ব্যবহারকারী, দুই সার্ভার, একটাই Redis'
        nodes:
          - {id: user, label: 'করিম', sub: 'ব্রাউজার', icon: user, col: 0, row: 1, tip: 'একই করিম দুইটা request পাঠায়। দুটো কোন সার্ভারে যাবে তা সে জানে না, জানার দরকারও নেই।'}
          - {id: lb, label: 'Load balancer', sub: 'ভিড় ভাগ করে', icon: lb, col: 1.5, row: 1, tip: 'প্রতিটা request আলাদা সার্ভারে পাঠায়। কোনটা কোথায় যাবে, তার ওপর অ্যাপের কিছু নির্ভর করবে না।'}
          - {id: app1, label: 'App সার্ভার ১', sub: 'কিছু জমায় না', icon: server, col: 3, row: 0, tip: 'অ্যাপের একটা কপি। মরে গেলে বা নতুন কপি যোগ হলে কিছু হারায় না।'}
          - {id: app2, label: 'App সার্ভার ২', sub: 'কিছু জমায় না', icon: server, col: 3, row: 2, tip: 'ঠিক একই কোড, একই আচরণ। প্রথম সার্ভারের সাথে কোনো কথা বলার দরকার নেই।'}
          - {id: redis, label: 'Redis', sub: 'session ও cache', icon: cache, tone: accent, col: 4, row: 1, tip: 'সবার কেন্দ্রীয় খাতা। দুই সার্ভারই এখান থেকে করিমের session পড়ে।'}
        edges:
          - {from: user, to: lb, label: 'করিমের প্রথম request আসে, সে login করে'}
          - {from: lb, to: app1, label: 'প্রথম request সার্ভার ১-এ যায়'}
          - {from: app1, to: redis, label: 'সার্ভার ১ করিমের session Redis-এ লেখে', tone: good}
          - {from: user, to: lb, label: 'দ্বিতীয় request আসে', dashed: true}
          - {from: lb, to: app2, label: 'এবার request সার্ভার ২-এ যায়'}
          - {from: app2, to: redis, label: 'সার্ভার ২ Redis থেকে session পায় — করিম login-ই থাকে', tone: good}
      - type: points
        title: 'কোনো সার্ভারের ভেতরে যা থাকবে না'
        style: cross
        items:
          - 'session (login-এর অবস্থা) — থাকবে Redis বা ডেটাবেসে'
          - 'আপলোড করা ফাইল — থাকবে object storage-এ (S3-compatible)'
          - 'নিজের মেমরির cache যা অন্যদের জানা দরকার — থাকবে Redis-এ'
          - 'cron বা scheduler যা প্রতি সার্ভারে দুইবার চলবে — চলবে একটা জায়গায়'
    aside:
      - type: problem
        body: 'সার্ভারের ভেতরে কিছু জমলে ওই সার্ভারটা "বিশেষ" হয়ে যায়। বিশেষ সার্ভার মুছে ফেলা বা নতুন কপি যোগ করা কঠিন, তাই horizontal scaling আটকে যায়।'
      - type: remember
        body: 'সার্ভার হবে গরুর পাল, পোষা কুকুর নয় — যেকোনোটা গেলে কেউ টের পায় না।'
      - type: refs
        items:
          - {to: 'thinking/serverless-stateless', label: 'Stateless design বিস্তারিত'}
    check:
      q: 'ব্যবহারকারী login করার পর পরের request আরেক সার্ভারে গেলে আবার login চায়। কারণটা কী?'
      a: 'session প্রথম সার্ভারের নিজের ফাইল বা মেমরিতে জমা ছিল। session-কে সবার জন্য এক জায়গায় (Redis বা ডেটাবেসে) সরাতে হবে।'

  - slug: sessions-in-redis
    title: 'Symfony-তে session আর ফাইল সরান'
    kind: howto
    tldr: 'session-এর handler Redis-এ বদলান, আর আপলোড লোকাল ডিস্কের বদলে object storage-এ লিখুন — দুই জায়গায় দুই লাইনের বদলই অ্যাপকে horizontal-ready করে।'
    keywords: ['Redis session', 'handler_id', 'Flysystem', 'object storage', 'upload', 'session ক্লাস্টার']
    blocks:
      - type: text
        body: |
          Symfony-র ডিফল্ট session সার্ভারের ডিস্কে ফাইল হিসেবে জমে, আর আপলোড সাধারণত `public/uploads`-এ যায়। দুটোই এক সার্ভারে দিব্যি চলে, দুই সার্ভারে ভাঙে। প্রথমে session: `handler_id`-তে Redis-এর DSN দিলেই Symfony নিজে RedisSessionHandler বসিয়ে নেয়।
      - type: code
        lang: yaml
        file: 'config/packages/framework.yaml'
        variant: good
        code: |
          framework:
              session:
                  # .env: REDIS_URL=redis://redis:6379/1
                  handler_id: '%env(REDIS_URL)%'
                  cookie_secure: auto
                  cookie_samesite: lax
                  gc_maxlifetime: 1800     # ৩০ মিনিট অলস থাকলে session শেষ
        marks:
          - {line: 4, tip: 'DSN দিলেই Symfony RedisSessionHandler ব্যবহার করে। এরপর সব app সার্ভার একই জায়গা থেকে session পড়ে।'}
          - {line: 7, tip: 'Redis-এ session-এর TTL এই মান থেকে আসে, ফলে পুরনো session নিজে নিজেই মুছে যায়।'}
      - type: text
        body: |
          এবার আপলোড। `config/packages/flysystem.yaml`-এ storage একবার ঘোষণা করুন (নাম `uploads.storage`, `aws` adapter আর আপনার bucket)। নিচের diff-এ লাল লাইন সার্ভারের ডিস্কে ফাইল রাখে — অন্য সার্ভার সেটা কখনো দেখবে না। সবুজ লাইন Flysystem দিয়ে object storage-এ লেখে, যেটা সব সার্ভারের কাছে একই।
      - type: code
        lang: diff
        file: 'src/Controller/AvatarController.php'
        code: |
          -    $file->move($this->getParameter('kernel.project_dir').'/public/uploads', $name);
          +    $stream = fopen($file->getPathname(), 'r');
          +    $this->uploadsStorage->writeStream('avatars/'.$name, $stream);
          +    fclose($stream);

               // constructor:
          +    private readonly FilesystemOperator $uploadsStorage,   // flysystem.yaml-এ uploads.storage
        marks:
          - {line: 1, tip: 'move() ফাইলটা এই সার্ভারের ডিস্কে রাখে। লোড ব্যালান্সার পরের request অন্য সার্ভারে পাঠালে ছবিটা ৪০৪ হয়ে যাবে।'}
          - {line: 3, tip: 'writeStream() ফাইলকে stream আকারে object storage-এ পাঠায়; বড় ফাইলও পুরোটা মেমরিতে তোলার দরকার হয় না।'}
    aside:
      - type: tips
        items:
          - 'object storage-এর ঠিকানা (URL) ডেটাবেসে রাখুন, সার্ভারের পাথ নয়।'
          - 'Redis-এর session হারালে ব্যবহারকারী শুধু আবার login করে — তাই session-এ জরুরি ডেটা রাখবেন না, জরুরি ডেটা ডেটাবেসে।'
          - 'দাম: প্রতি request-এ একটা Redis call, আর Redis বন্ধ থাকলে কেউ login করতে পারে না। তার একটা replica রাখুন বা failover-ওয়ালা managed Redis নিন।'
      - type: commands
        title: 'যাচাই করার কমান্ড'
        items:
          - {cmd: 'php bin/console debug:config framework session', desc: 'কোন session handler সক্রিয় দেখুন'}
          - {cmd: 'redis-cli -n 1 --scan --pattern ''sf*'' | head', desc: 'Redis-এ session key জমছে কি না'}
    check:
      q: 'অ্যাপ দুই সার্ভারে চালানোর আগে Symfony-তে অন্তত কোন দুইটা জায়গা বদলাতে হবে?'
      a: 'session handler (Redis বা ডেটাবেস) আর ফাইল আপলোড (object storage)। দুটোই এখন সার্ভারের ডিস্কে জমে, যা অন্য সার্ভার দেখতে পায় না।'

  - slug: autoscaling-lag
    title: 'Autoscaling দেরিতে জাগে'
    kind: concept
    tldr: 'Autoscaling load দেখে সার্ভার বাড়ায়, কিন্তু মাপা, সিদ্ধান্ত, চালু হওয়া আর health check মিলিয়ে কয়েক মিনিট লাগে। হঠাৎ ঢেউ ওই সময়টুকুতেই সার্ভার ভাঙে।'
    keywords: ['autoscaling', 'HPA', 'cold start', 'warm-up', 'scale out lag', 'অটোস্কেলিং', 'দেরি']
    blocks:
      - type: metaphor
        icon: building
        title: 'বিয়েবাড়ির বাড়তি বাবুর্চি'
        body: |
          অতিথি আশার চেয়ে বেশি এলে ম্যানেজার ফোন করে বাড়তি বাবুর্চি ডাকেন। তিনি পৌঁছে, হাত ধুয়ে, চুলা ধরাতে ধরাতে অনেকক্ষণ পার। ততক্ষণ অতিথিরা লাইনে। অটোস্কেলারও তাই — সে ভিড় দেখে ডাকে, কিন্তু নতুন সার্ভার কাজে লাগতে সময় নেয়।
      - type: visual
        kind: bars
        caption: 'ভিড় আসার পর নতুন সার্ভার কাজ ধরতে মোট ২৭০ সেকেন্ড'
        items:
          - {label: 'Metric জমা ও মাপা', value: 60, display: '60s', tip: 'CPU-র সংখ্যা সাধারণত ১ মিনিট পরপর জমে। ভিড় এসে গেলেও autoscaler প্রথম মিনিটে কিছু জানে না।'}
          - {label: 'বাড়ানোর সিদ্ধান্ত', value: 30, display: '30s', tip: 'autoscaler গড় দেখে, একবারের লাফে নড়ে না। ভুল এলার্মে যেন সার্ভার না বাড়ে, সেজন্য এই অপেক্ষা।'}
          - {label: 'সার্ভার চালু ও image আনা', value: 90, display: '90s', tone: warn, tip: 'নতুন মেশিন বা pod জোগাড়, container image নামানো, আর PHP চালু — সবচেয়ে ধীর ধাপ।'}
          - {label: 'App warm-up', value: 60, display: '60s', tip: 'নতুন অ্যাপ প্রথমে ঠান্ডা: Symfony cache গরম হয়নি, opcache ভরেনি। প্রথম কিছু request ধীর হয়।'}
          - {label: 'Health check পাস', value: 30, display: '30s', tone: good, tip: 'load balancer নিশ্চিত হয় সার্ভারটা ঠিক আছে, তারপর request পাঠানো শুরু করে।'}
      - type: code
        lang: yaml
        file: 'k8s/app-hpa.yaml'
        code: |
          apiVersion: autoscaling/v2
          kind: HorizontalPodAutoscaler
          metadata: {name: shop-app}
          spec:
            scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: shop-app}
            minReplicas: 6          # জানা ব্যস্ত সময়ের জন্য আগে থেকেই রাখা
            maxReplicas: 20
            metrics:
              - type: Resource
                resource:
                  name: cpu
                  target: {type: Utilization, averageUtilization: 60}
            behavior:
              scaleUp:   {stabilizationWindowSeconds: 0}
              scaleDown: {stabilizationWindowSeconds: 300}
        marks:
          - {line: 6, tip: 'সবচেয়ে কাজের লাইন। ভিড়ের আগেই ৬টা সার্ভার চালু রাখলে ২৭০ সেকেন্ডের অপেক্ষাটা এড়ানো যায়।'}
          - {line: 12, tip: 'CPU ৬০%-এর ওপরে গেলেই বাড়ানো শুরু। ৮০-৯০%-এর অপেক্ষা করলে নতুন সার্ভার আসার আগেই latency লাফিয়ে যাবে।'}
          - {line: 15, tip: 'নামার সময় ৫ মিনিট অপেক্ষা করে। না হলে ভিড় একটু কমলেই সার্ভার কেটে ফেলা হয়, আবার ঢেউ এলে ভুগতে হয়।'}
      - type: quote
        body: 'Autoscaling দেরিতে জাগে। জানা ভিড়ের (ঈদ, সেল) জন্য সার্ভার আগে থেকেই বাড়িয়ে রাখুন।'
    aside:
      - type: pitfalls
        items:
          - 'max না দিলে ভুল loop বা আক্রমণে সার্ভার আর বিল দুটোই অসীম বাড়ে।'
          - 'readiness check ছাড়া নতুন pod ঠান্ডা অবস্থাতেই request পেয়ে যায়।'
          - 'minReplicas দিনরাত খরচ টানে। এক রাতের সেলের জন্য এক ঘণ্টা আগে বাড়ান, পরে কমিয়ে দিন।'
      - type: terms
        items:
          - {term: 'Pod', meaning: 'Kubernetes-এ আপনার অ্যাপের একটা চলমান কপি। বেশি pod মানে একই কাজ করা বেশি সার্ভার।'}
          - {term: 'HPA', meaning: 'Kubernetes-এর autoscaler। CPU দেখে pod বাড়ায় বা কমায়।'}
      - type: remember
        body: 'Autoscaling ধীর ঢেউ সামলায়, ঠিক-ঝাঁপ নয়। ঝাঁপের জন্য আগে থেকে বাড়ানো সার্ভার আর সীমা (rate limit)।'
      - type: refs
        items:
          - {to: 'resilience/load-shedding', label: 'নতুন সার্ভার আসার আগে overload ঠেকানো'}
    check:
      q: 'রাত ৮টায় ফ্ল্যাশ সেল শুরু হবে, ঠিক সেই মুহূর্তে ভিড় ১০ গুণ। শুধু autoscaling ভরসা করলে কী হবে?'
      a: 'প্রায় ৪–৫ মিনিট পুরনো সার্ভারগুলো ভিড় সামলাবে, latency আর error বাড়বে। সেলের আগেই min সংখ্যা বাড়িয়ে রাখতে হবে।'

  - slug: database-last
    title: 'ডেটাবেস স্কেল করুন সবার শেষে'
    kind: pitfall
    tldr: 'অ্যাপ সার্ভার বাড়ানো সহজ, ডেটাবেস নয়। সার্ভার বাড়ালে ডেটাবেসের connection আর চাপ বাড়ে, তাই আগে query, cache আর replica, সবশেষে shard।'
    keywords: ['database scaling', 'connection pool', 'PgBouncer', 'read replica', 'sharding', 'ডেটাবেস স্কেল']
    blocks:
      - type: metaphor
        icon: bank
        title: 'শাখা বাড়ে, কিন্তু গুদাম একটাই'
        body: |
          হোটেলের শাখা ৪টা থেকে ২০টা হলো, কিন্তু সবাই চাল-ডাল আনে সেই একটা কেন্দ্রীয় গুদাম থেকে। গুদামের দরজায় এখন ২০ শাখার লোকের ধাক্কাধাক্কি। ঠিক এভাবে অ্যাপ সার্ভার বাড়ালে সবার চাপ গিয়ে পড়ে একটা ডেটাবেসে।
      - type: text
        body: |
          হিসাব করুন: ২০টা অ্যাপ সার্ভার, প্রতিটায় ২৫টা PHP-FPM worker, প্রত্যেকে একটা করে connection ধরলে ৫০০ connection। Postgres-এর `max_connections` ২০০ হলে নতুন সার্ভারগুলো ডেটাবেসেই ঢুকতে পারবে না। সমাধান একটা connection pooler, যেমন PgBouncer, যে আসল connection এক transaction করে ধার দেয়। তার সীমা আছে; পরের স্লাইডে দেখানো হয়েছে।
      - type: code
        lang: ini
        file: 'pgbouncer.ini'
        variant: good
        code: |
          [databases]
          shop = host=10.0.0.5 port=5432 dbname=shop

          [pgbouncer]
          pool_mode = transaction       ; transaction শেষ হলেই connection ফেরত
          max_client_conn = 1000        ; অ্যাপ থেকে আসা connection
          default_pool_size = 20        ; ডেটাবেসে আসল connection মাত্র ২০টা
        marks:
          - {line: 5, tip: 'প্রতিটা query-র জন্য connection ধরে রাখে না, transaction শেষ হলেই অন্যকে দেয়। তাই কম connection-এ অনেকের কাজ চলে।'}
          - {line: 7, tip: '১০০০ client কিন্তু ডেটাবেস দেখছে মাত্র ২০টা। প্রতিটা transaction connection ধরে মাত্র কয়েক মিলিসেকেন্ড, তাই ২০টা আসল connection ৫০০ worker-কে পালা করে সামলায় — ২০টা কাউন্টার যেমন লম্বা লাইন সামলায়।'}
      - type: visual
        kind: steps
        caption: 'ডেটাবেস ধীর হলে এই ক্রমে এগোন'
        steps:
          - {title: '১. Query ঠিক করুন', body: 'index যোগ করুন, N+1 সরান', tip: 'সবচেয়ে সস্তা আর সবচেয়ে বেশি কাজের ধাপ। অনেক অ্যাপ এখানেই ১০ গুণ দ্রুত হয়ে যায়।'}
          - {title: '২. Cache বসান', body: 'বারবার পড়া ডেটা Redis-এ', tip: 'ডেটাবেসে পৌঁছানো request-ই কমিয়ে দেয়, ফলে ডেটাবেস ফাঁকা পায়।'}
          - {title: '৩. Read replica', body: 'পড়া যাবে replica থেকে', tip: 'লেখা থাকে primary-তে, পড়ার চাপ ভাগ হয়। তবে replication lag মাথায় রাখতে হয়।'}
          - {title: '৪. বড় মেশিন (vertical)', body: 'ডেটাবেস সার্ভার আরও শক্তিশালী', tip: 'ডেটাবেসে vertical প্রায়ই সবচেয়ে সরল। সেই সীমা পর্যন্ত এটা ব্যবহার করা সম্পূর্ণ ঠিক।'}
          - {title: '৫. Shard করুন', body: 'ডেটা ভাগ করে অনেক ডেটাবেসে', tip: 'সবচেয়ে শক্তিশালী কিন্তু সবচেয়ে ব্যয়বহুল। cross-shard query আর transaction কঠিন হয়ে যায়।', tone: warn}
    aside:
      - type: terms
        items:
          - {term: 'PHP-FPM worker', meaning: 'একটা PHP process, যে একসময়ে একটা request সামলায়। ২৫ worker মানে একসাথে ২৫টা request।'}
          - {term: 'Connection pooler', meaning: 'মাঝের এমন একটা প্রক্রিয়া, যে অল্প কয়েকটা আসল ডেটাবেস connection ধরে রেখে অনেক client-কে ধার দেয়।'}
          - {term: 'N+1', meaning: 'একটা query-তে তালিকা আনা, তারপর তালিকার প্রতিটা সারির জন্য আরও একটা করে query চালানো।'}
      - type: refs
        items:
          - {to: 'data/replication', label: 'Read replica ও replication'}
          - {to: 'data/sharding', label: 'Sharding কখন ও কীভাবে'}
      - type: remember
        body: 'ডেটাবেসের চাপ বাড়ানোর আগে ডেটাবেসের কাজ কমান।'
    check:
      q: 'অ্যাপ সার্ভার ৪ থেকে ২০ করার পর ডেটাবেসে "too many connections" error আসছে। প্রথম সমাধান কী?'
      a: 'PgBouncer-এর মতো pooler বসানো, যাতে ডেটাবেসে আসল connection কম থাকে। শুধু max_connections বাড়ানো ডেটাবেসের RAM খেয়ে ফেলে।'

  - slug: pgbouncer-limits
    title: 'PgBouncer transaction mode: যা ভাঙে'
    kind: pitfall
    tldr: 'Transaction pooling connection ধার দেয় এক transaction-এর জন্য। তাই prepared statement, SET, advisory lock, LISTEN/NOTIFY ভাঙে। সমাধান: prepare emulate করুন, বাকিগুলো সরাসরি চালান।'
    keywords: ['PgBouncer', 'transaction pooling', 'prepared statements', 'EMULATE_PREPARES', 'advisory lock', 'LISTEN NOTIFY', 'pool_mode']
    blocks:
      - type: metaphor
        icon: wallet
        title: 'কুড়িটা কাউন্টার, পাঁচশো ক্রেতা'
        body: |
          এক ক্রেতা চিরকুট লিখে ৭ নম্বর কাউন্টারে রেখে গেলেন, ভাবলেন পরেরবারও সেখানেই পাবেন। কিন্তু দোকান প্রতিবার যে কাউন্টার ফাঁকা সেখানে পাঠায়, তাই চিরকুট ৭ নম্বরে, আর ক্রেতা দাঁড়িয়ে ১২ নম্বরে। Transaction pooling ঠিক এমন: "নিজের" connection-এ যা রেখে যান, পরের transaction-এ তা নেই।
      - type: text
        body: |
          PHP-র সবচেয়ে চেনা শিকার prepared statement। PDO এক connection-এ query prepare করে, চালায় আরেকটায়, আর Postgres বলে `SQLSTATE[26000]: prepared statement "pdo_stmt_00000001" does not exist`। PDO-কে বলুন সাধারণ query পাঠাতে; মানগুলো তখনও escape হয়।
      - type: code
        lang: yaml
        file: 'config/packages/doctrine.yaml'
        variant: good
        code: |
          doctrine:
              dbal:
                  # DATABASE_URL যায় PgBouncer-এ, port 6432
                  url: '%env(resolve:DATABASE_URL)%'
                  options:
                      !php/const PDO::ATTR_EMULATE_PREPARES: true   # server-side prepare নয়
        marks:
          - {line: 6, tip: 'PDO নিজেই SQL বানিয়ে একবারে পাঠায়, তাই এমন কিছু পড়ে থাকে না যা পরের transaction হারাবে। PgBouncer 1.21+ চাইলে max_prepared_statements দিয়ে prepare নিজেই সামলাতে পারে।'}
      - type: code
        lang: bash
        file: 'deploy.sh'
        variant: good
        code: |
          # migration (আর LISTEN/NOTIFY, advisory lock) যায় সরাসরি Postgres-এ, port 5432
          DATABASE_URL='postgresql://app:CHANGE_ME@10.0.0.5:5432/shop?serverVersion=16' \
              php bin/console doctrine:migrations:migrate --no-interaction
        marks:
          - {line: 2, tip: 'শুধু এই কমান্ড সরাসরি URL পায়। চলমান অ্যাপ PgBouncer-ই ব্যবহার করে।'}
      - type: points
        title: 'Transaction mode-এ আরও যা হারায়'
        style: cross
        items:
          - '`SET search_path` বা `SET timezone`: হারায়, নয়তো অন্য client-এ ফাঁস হয়। transaction-এর ভেতরে `SET LOCAL` ব্যবহার করুন।'
          - 'Session-level advisory lock, `LISTEN`/`NOTIFY`, temporary table: সরাসরি connection নিন।'
    aside:
      - type: when
        use:
          - 'অনেক অ্যাপ সার্ভার: মোট worker `max_connections`-এর চেয়ে অনেক বেশি'
        avoid:
          - 'অল্প সার্ভার, worker-গুলো `max_connections`-এর মধ্যেই ধরে: pooler লাগে না'
          - 'কোড session state-এর ওপর নির্ভর করলে: session mode বা সরাসরি connection'
      - type: pitfalls
        items:
          - 'PgBouncer ডেটাবেসের সামনে আরেকটা process। দুটো চালান, নইলে সেটাই পরের single point of failure।'
    check:
      q: 'PgBouncer-এর transaction mode চালুর পর কিছু query "prepared statement does not exist" দিয়ে ব্যর্থ। কেন, আর সমাধান কী?'
      a: 'PDO এক pooled connection-এ prepare করে আরেকটায় চালায়। PDO::ATTR_EMULATE_PREPARES চালু করুন (বা PgBouncer 1.21+ max_prepared_statements)।'

flashcards:
  - q: 'Vertical আর horizontal scaling-এর পার্থক্য কী?'
    a: 'Vertical = একই মেশিনে বেশি CPU/RAM। Horizontal = একই অ্যাপের আরও মেশিন যোগ করা।'
    more: |
      Vertical কোড বদলায় না, তাই সহজ, কিন্তু সবচেয়ে বড় মেশিনের পর আর পথ নেই আর মেশিন মরলে সব বন্ধ। Horizontal-এর ক্ষমতা প্রায় সীমাহীন আর একটা মরলে বাকিরা চলে, কিন্তু অ্যাপকে stateless হতে হয় আর load balancer লাগে।
    ref: bigger-or-more
  - q: 'Stateless অ্যাপ মানে কী?'
    a: 'যে অ্যাপের কোনো সার্ভার নিজের ভেতরে ব্যবহারকারীর অবস্থা (session, ফাইল) জমিয়ে রাখে না; যেকোনো request যেকোনো সার্ভারে যেতে পারে।'
    more: |
      অবস্থা জমা থাকে সবার ভাগ করা জায়গায় — session Redis-এ, ফাইল object storage-এ, ডেটা ডেটাবেসে। তখন সার্ভার যোগ বা বাদ দিলে কিছু হারায় না, আর এটাই horizontal scaling-এর মূল শর্ত। বিস্তারিত: [[thinking/serverless-stateless|stateless design]]।
    ref: stateless-app
  - q: 'দুই সার্ভারে অ্যাপ চালালে ব্যবহারকারী বারবার logout হচ্ছে। সম্ভাব্য কারণ?'
    a: 'session প্রতিটা সার্ভারের নিজের ডিস্কে জমা হচ্ছে। দ্বিতীয় সার্ভার প্রথমটার session চেনে না।'
    more: |
      সমাধান হলো session একটা ভাগ করা জায়গায় রাখা — Symfony-তে `handler_id: '%env(REDIS_URL)%'`। sticky session দিয়েও লক্ষণ চাপা পড়ে, কিন্তু সার্ভার মরলে session হারায়, তাই ভাগ করা store-ই সঠিক পথ।
    ref: sessions-in-redis
  - q: 'আপলোড করা ফাইল `public/uploads`-এ রাখলে horizontal scaling-এ কী সমস্যা?'
    a: 'ফাইল শুধু যে সার্ভারে আপলোড হয়েছে সেখানেই থাকে; অন্য সার্ভারে request গেলে ৪০৪ আসে।'
    more: |
      ফাইল রাখতে হবে object storage-এ (S3-compatible)। Symfony-তে Flysystem দিয়ে একই কোডে লোকাল ডিস্ক বা S3 বদলানো যায়। ডেটাবেসে রাখুন ফাইলের key বা URL, সার্ভারের পাথ নয়।
    ref: sessions-in-redis
  - q: 'Autoscaling কেন হঠাৎ ঢেউ সামলাতে পারে না?'
    a: 'ভিড় মাপা, সিদ্ধান্ত নেওয়া, নতুন সার্ভার চালু আর warm-up — সব মিলিয়ে কয়েক মিনিট লাগে। তার মধ্যেই পুরনো সার্ভার ভেঙে পড়তে পারে।'
    more: |
      ধীর বাড়া ভিড়ে autoscaling চমৎকার। কিন্তু ঈদের সেল বা টিভিতে বিজ্ঞাপনের মতো জানা ঝাঁপে আগে থেকে min সংখ্যা বাড়িয়ে রাখতে হয়। তার সাথে rate limit আর load shedding রাখলে ঢেউয়ের প্রথম কয়েক মিনিট বাঁচে।
    ref: autoscaling-lag
  - q: 'অ্যাপ সার্ভার বাড়ালে ডেটাবেসে "too many connections" আসে কেন?'
    a: 'প্রতিটা সার্ভারের প্রতিটা worker একটা করে connection নেয়। সার্ভার বাড়লে মোট connection ডেটাবেসের max_connections ছাড়িয়ে যায়।'
    more: |
      ২০ সার্ভার × ২৫ worker = ৫০০ connection, অথচ ডেটাবেস হয়তো ২০০-এ আটকে। সমাধান PgBouncer-এর মতো pooler, যা অনেক client connection থেকে মাত্র অল্প কয়েকটা আসল connection বানায়। তার সীমাগুলো পরের কার্ডে।
    ref: database-last
  - q: 'PgBouncer-এর transaction pooling mode-এ কী ভাঙে?'
    a: 'যা ধরে নেয় connection আপনারই থাকবে: server-side prepared statement, SET, session advisory lock, LISTEN/NOTIFY, temp table।'
    more: |
      Transaction mode connection ধার দেয় শুধু একটা transaction-এর জন্য, তারপর অন্যকে দিয়ে দেয়। এক connection-এ করা prepared statement পরের connection-এ থাকে না। transaction-এর ভেতরে `SET LOCAL` ব্যবহার করুন, আর migration ও LISTEN/NOTIFY সরাসরি Postgres-এ পাঠান।
    ref: pgbouncer-limits
  - q: 'PgBouncer-এর পেছনে Symfony-তে "prepared statement does not exist" এলে সমাধান কী?'
    a: 'Doctrine dbal options-এ PDO::ATTR_EMULATE_PREPARES true করুন, অথবা PgBouncer 1.21+ হলে max_prepared_statements দিন।'
    more: |
      Emulation চালু থাকলে PDO escape-করা মানসহ query বানিয়ে একবারে পাঠায়, তাই এমন কোনো statement পড়ে থাকে না যা পরের transaction পাবে না। দাম: Postgres আর parse-করা plan নতুন করে কাজে লাগাতে পারে না।
    ref: pgbouncer-limits
  - q: 'ডেটাবেস ধীর হলে স্কেলিংয়ের সঠিক ক্রম কোনটা?'
    a: 'query ঠিক করা, cache, read replica, বড় মেশিন, সবশেষে shard। সবচেয়ে সস্তা ধাপ আগে।'
    more: |
      Sharding-এ ডেটা ভাগ হয়ে যায়, তাই cross-shard query, transaction আর অপারেশনের জটিলতা বহুগুণ বাড়ে। বেশিরভাগ অ্যাপ প্রথম তিন ধাপেই অনেক দূর যায়। বিস্তারিত: [[data/sharding|sharding]]।
    ref: database-last

quiz:
  - q: 'রাতুলের সাইট এক সার্ভারে চলে, CPU ৯০%। কালকের মধ্যে কিছু একটা করতে হবে, কোডে হাত দেওয়ার সময় নেই। সবচেয়ে বাস্তব পদক্ষেপ কোনটা?'
    hint: 'কোড না বদলে দ্রুত আরাম কোনটায় আসে?'
    options:
      - text: 'সার্ভারটা আরও বড় (বেশি CPU/RAM) করে নেওয়া'
        correct: true
        why: 'Vertical scaling কোড বদলায় না। সীমা আছে ঠিকই, কিন্তু এই মুহূর্তে সবচেয়ে সহজ আর সস্তা পথ এটাই।'
      - text: 'সঙ্গে সঙ্গে দুই সার্ভারে চালানো শুরু করা'
        correct: false
        why: 'অ্যাপ এখনো stateless কি না জানা নেই। session বা আপলোড লোকাল থাকলে ব্যবহারকারী logout হবে, ছবি হারাবে।'
      - text: 'সার্ভার না বাড়িয়ে ডেটাবেস shard করা'
        correct: false
        why: 'bottleneck মাপা হয়নি; shard সবচেয়ে ব্যয়বহুল আর কঠিন ধাপ — কখনোই প্রথম পদক্ষেপ নয়।'
      - text: 'কিছুই না করে অপেক্ষা করা'
        correct: false
        why: 'CPU ৯০% মানেই latency লাফানোর এলাকা। অপেক্ষা করলে সাইট ধীর হবে।'
    ref: bigger-or-more
  - q: 'অ্যাপ ২টা সার্ভারে চালানোর পর কিছু ব্যবহারকারী বলছে, "ছবি আপলোড করলাম, কিন্তু পাতা রিফ্রেশ করলে কখনো দেখা যায়, কখনো যায় না।" কারণ কী?'
    hint: 'প্রতিটা request কোন সার্ভারে যাচ্ছে তা কি ব্যবহারকারী ঠিক করে?'
    options:
      - text: 'ছবিটা একটা সার্ভারের লোকাল ডিস্কে সেভ হয়েছে; অন্য সার্ভারে request গেলে ফাইল নেই'
        correct: true
        why: 'ফাইল শুধু আপলোড পাওয়া সার্ভারে আছে। load balancer পরের request অন্য সার্ভারে পাঠালে ৪০৪ আসে। ফাইল object storage-এ রাখতে হবে।'
      - text: 'ব্রাউজারের cache পুরনো'
        correct: false
        why: 'ব্রাউজার cache একই ব্যবহারকারীর সবসময় একই আচরণ দেয়; এখানে ফল কখনো আসে কখনো আসে না — সার্ভার বদলের লক্ষণ।'
      - text: 'ডেটাবেস ধীর'
        correct: false
        why: 'ধীর হলে দেরি হতো, কখনো ফাইলই না থাকা নয়।'
      - text: 'PHP-FPM worker কম'
        correct: false
        why: 'worker কম হলে request ধীর হয় বা ৫০২ আসে। ফাইল "নেই" হওয়া ভিন্ন সমস্যা।'
    ref: stateless-app
  - q: 'কোনগুলো অ্যাপকে horizontal scaling-এর জন্য অনুপযুক্ত করে?'
    hint: 'যেকোনো সার্ভার মুছে দিলে যা হারাবে, তা সার্ভারের ভেতরে জমা আছে।'
    options:
      - text: 'session ফাইল হিসেবে সার্ভারের /var/lib/php/sessions-এ জমা'
        correct: true
        why: 'অন্য সার্ভার এই session দেখে না, আর সার্ভার মুছলে সবার login যায়।'
      - text: 'আপলোড করা ছবি public/uploads-এ লেখা'
        correct: true
        why: 'ফাইল শুধু একটা সার্ভারে থাকে। সব সার্ভারের কাছে পৌঁছায়, এমন storage লাগবে।'
      - text: 'cache Redis-এ রাখা'
        correct: false
        why: 'Redis সবার ভাগ করা জায়গা — ঠিক যেটা horizontal scaling চায়।'
      - text: 'user-এর ডেটা PostgreSQL-এ রাখা'
        correct: false
        why: 'ডেটাবেসও ভাগ করা store; সব সার্ভার একই ডেটা দেখে, তাই সমস্যা নেই।'
    ref: sessions-in-redis
  - q: 'নিচের হিসাবে মূল সমস্যাটা কী?'
    lang: text
    code: |
      app সার্ভার      : ৪ থেকে autoscale হয়ে ২০
      PHP-FPM worker   : প্রতি সার্ভারে ২৫
      Postgres         : max_connections = 200
      ফল               : SQLSTATE[08006] too many connections
    hint: '২০ × ২৫ কত হয়?'
    options:
      - text: '২০ × ২৫ = ৫০০ connection ডেটাবেসের ২০০-এর সীমা ছাড়িয়েছে; connection pooler (PgBouncer) লাগবে'
        correct: true
        why: 'অ্যাপ সার্ভার বাড়লে connection-ও গুণ হয়ে বাড়ে। pooler অল্প আসল connection দিয়ে অনেক client চালায়।'
      - text: 'autoscaling বন্ধ করে দিতে হবে'
        correct: false
        why: 'autoscaling ঠিকই আছে; সমস্যা ডেটাবেসের connection সীমায়। বন্ধ করলে আবার অ্যাপ ধীর হবে।'
      - text: 'Postgres-এর max_connections ১০ হাজার করে দিলেই চলবে'
        correct: false
        why: 'প্রতিটা connection ডেটাবেসের RAM খরচ করে; হাজার হাজার connection ডেটাবেসকেই ধীর বানিয়ে দেয়।'
      - text: 'PHP-FPM-এর worker ০ করে দিতে হবে'
        correct: false
        why: 'worker না থাকলে অ্যাপই চলবে না।'
    ref: database-last
  - q: 'PgBouncer-এর (pool_mode = transaction) পেছনে একটা Symfony অ্যাপ মাঝে মাঝে "prepared statement does not exist" error দেয়। সবচেয়ে ভালো সমাধান কোনটা?'
    hint: 'statement এক connection-এ prepare হলো, চলল আরেকটায়। server-side prepare এড়াবেন কীভাবে?'
    options:
      - text: 'Doctrine dbal options-এ PDO::ATTR_EMULATE_PREPARES true করা'
        correct: true
        why: 'PDO তখন escape-করা মানসহ পুরো query একবারে পাঠায়, তাই এমন কিছু পড়ে থাকে না যা পরের transaction হারাতে পারে।'
      - text: 'default_pool_size বাড়ানো, যাতে একই connection বেশিবার মেলে'
        correct: false
        why: 'connection বাড়ালেও আবার একই connection পাওয়ার নিশ্চয়তা নেই। Transaction mode প্রতি transaction-এ connection ভাগ করে।'
      - text: 'অ্যাপকে আবার সরাসরি Postgres-এর সাথে জোড়া'
        correct: false
        why: 'কাজ করবে, কিন্তু pooler ফেলে দেওয়া হয়, আর "too many connections" সমস্যা ফিরে আসে।'
      - text: 'ব্যর্থ প্রতিটা query তিনবার retry করা'
        correct: false
        why: 'retry আরেকটা connection-এ গিয়ে আবার ব্যর্থ হতে পারে। কারণ থেকেই যায়, আর লেখা দুবার চলে যেতে পারে।'
    ref: pgbouncer-limits
  - q: 'ফ্ল্যাশ সেলের ভিড় ঠিক রাত ৮টায় ১০ গুণ হয়, আর অটোস্কেলিং চালু আছে। সবচেয়ে বুদ্ধিমান প্রস্তুতি কোনটা?'
    hint: 'ভিড় আসার পর সার্ভার কাজ ধরতে কত সময় লাগে?'
    options:
      - text: 'সেলের আগে min replicas বাড়িয়ে রাখা, সঙ্গে rate limit রাখা'
        correct: true
        why: 'ভিড়ের সময় আগে থেকে জানা। আগে থেকে সার্ভার চালু রাখলে মিনিট পাঁচেকের দেরি এড়ানো যায়।'
      - text: 'autoscaling-এর ওপর পুরোপুরি ভরসা করা'
        correct: false
        why: 'মাপা, সিদ্ধান্ত, চালু আর warm-up মিলিয়ে কয়েক মিনিট লাগে; ততক্ষণে পুরনো সার্ভার ভেঙে পড়বে।'
      - text: 'max replicas ১০০০ করে দেওয়া'
        correct: false
        why: 'max বাড়ালে ঝাঁপের দেরি কমে না; শুধু বিল আর ডেটাবেসে চাপ বাড়ে।'
      - text: 'CPU target ৯০%-এ তুলে দেওয়া'
        correct: false
        why: 'আরও দেরিতে বাড়বে, ততক্ষণে latency লাফিয়ে গেছে।'
    ref: autoscaling-lag
