      a: 'অফিস বা ক্যারিয়ারের NAT-এর পেছনের অনেক ব্যবহারকারী একই IP নিয়ে আসে, আর ip_hash সেই IP-কে সবসময় একই সার্ভারে পাঠায়।'

flashcards:
  - q: 'Single point of failure (SPOF) কী?'
    a: 'এমন একটা অংশ, যা মরলে পুরো সিস্টেম বন্ধ হয়ে যায় — কারণ তার কোনো বিকল্প কপি নেই।'
    more: |
      অনেক সময় app সার্ভার বাড়িয়ে ভাবা হয় সব নিরাপদ, কিন্তু একমাত্র load balancer, একমাত্র ডেটাবেস primary বা একটাই data center SPOF থেকে যায়। প্রতিটা অংশকে জিজ্ঞেস করো "তুমি মরলে কী হবে?" আর যার উত্তর "সব বন্ধ", তার দ্বিতীয় কপি বসাও।
    ref: single-point-of-failure
  - q: 'Load balancer নিজে SPOF হলে কীভাবে ঠেকাবে?'
    a: 'দুটো LB রাখো, একটা মরলে অন্যটা একই IP নেয় (keepalived/VRRP), অথবা cloud-এর managed load balancer ব্যবহার করো।'
    more: |
      Active-passive জোড়ায় একটা LB কাজ করে, অন্যটা পাহারা দেয়। প্রধানটা সাড়া না দিলে দ্বিতীয়টা floating IP টেনে নেয়। Cloud-এর managed LB ভেতরে একাধিক জায়গায় চলে, তাই সেটা সাধারণত সহজ পথ।
    ref: single-point-of-failure
  - q: 'Round robin, least connections ও weighted — কোনটা কখন?'
    a: 'Round robin পালা করে দেয়, তাই লম্বা request-এ জমে। Least connections অসম সময়ের request-এ ভালো, weighted অসমান সার্ভারে।'
    more: |
      সব request প্রায় সমান ছোট হলে round robin সবচেয়ে সরল আর যথেষ্ট ভালো। আপলোড বা report export-এর মতো কিছু request সেকেন্ডের পর সেকেন্ড চললে least connections ভালো। সার্ভার অসমান হলে (২ core বনাম ৮ core) `weight=3`-এর মতো ওজন বসাও; nginx-এ দুটো একসাথেও চলে।
    ref: balancing-algorithms
  - q: 'Passive আর active health check-এর পার্থক্য কী?'
    a: 'Passive: আসল request ব্যর্থ হলে সার্ভার বাদ। Active: LB নিজে নিয়মিত /healthz ডেকে সার্ভার পরীক্ষা করে, আসল request-এর অপেক্ষা না করেই।'
    more: |
      nginx-এর বিনামূল্যের সংস্করণে `max_fails` আর `fail_timeout` দিয়ে passive check হয়; active check HAProxy, nginx Plus বা cloud LB-তে পাবে। Active check-এ প্রথম ব্যবহারকারী আর ব্যর্থ request-এর শিকার হয় না।
    ref: nginx-upstream
  - q: 'Health check-এ ডেটাবেস ডাকলে কী বিপদ?'
    a: 'ডেটাবেসে ঝামেলা হলে সব সার্ভার একসাথে "অসুস্থ" দেখায়, LB সবাইকে বাদ দেয় — ছোট সমস্যা পুরো outage হয়ে যায়।'
    more: |
      LB-র health check ঠিক করবে "এই সার্ভার কি request নিতে পারবে?" — সাধারণত সেটা সস্তা আর শুধু সার্ভারের নিজের অবস্থা। ডেটাবেসের অবস্থা আলাদা metric আর alert-এ দেখাই ভালো। বিস্তারিত: [[observability/health-alerts|health check ও alert]]।
    ref: nginx-upstream
  - q: 'L4 আর L7 load balancer-এর মূল পার্থক্য কী?'
    a: 'L4 শুধু IP আর port দেখে TCP পাঠায়। L7 HTTP খুলে পড়ে, তাই path, header, cookie দেখে সিদ্ধান্ত নিতে পারে।'
    more: |
      L4 দ্রুত আর যেকোনো TCP protocol-এ চলে (ডেটাবেস, Redis)। L7 বেশি CPU খায়, কিন্তু TLS termination, path routing আর header যোগ করতে পারে। ওয়েব অ্যাপের সামনে সাধারণত L7 বসে।
    ref: l4-vs-l7
  - q: 'Sticky session কী, আর কেন এড়ানো ভালো?'
    a: 'একই ব্যবহারকারীকে সবসময় একই সার্ভারে পাঠানো। এতে ভিড় অসমান হয় আর সার্ভার মরলে session হারায়।'
    more: |
      Sticky session আসলে সার্ভারের ভেতরে জমানো state-এর লক্ষণ চাপা দেয়। session Redis-এ সরিয়ে দিলে stickiness লাগেই না, আর LB সত্যিকারের সমান ভাগ করতে পারে। ip_hash-এ NAT-এর পেছনের হাজার ব্যবহারকারী একই সার্ভারে পড়ার ঝুঁকিও আছে।
    ref: sticky-sessions-trap

quiz:
  - q: 'রাতুলের সিস্টেমে ২টা app সার্ভার, ১টা nginx LB, ১টা Postgres primary আর ১টা replica আছে। কোনগুলো SPOF?'
    hint: 'যেটা মরলে বাকিগুলো সুস্থ থেকেও সাইট বা লেখা আটকে যায়।'
    options:
      - text: 'একমাত্র nginx LB'
        correct: true
        why: 'সব request এর ভেতর দিয়ে যায়, আর বিকল্প কপি নেই। এটা মরলে app সার্ভার সুস্থ থাকলেও সাইট বন্ধ।'
      - text: 'Postgres primary (automatic failover ছাড়া)'
        correct: true
        why: 'replica থাকলেও failover না থাকলে primary মরামাত্র লেখা বন্ধ; কেউ হাতে replica-কে promote না করা পর্যন্ত।'
      - text: 'দুটো app সার্ভারের যেকোনো একটা'
        correct: false
        why: 'অন্যটা বাকি request চালায়। ধীর হবে, কিন্তু বন্ধ হবে না — ঠিক যে কারণে একাধিক কপি রাখা হয়।'
      - text: 'Postgres replica'
        correct: false
        why: 'replica মরলে পড়ার ক্ষমতা কমে, কিন্তু primary-তে লেখা আর পড়া চলতে থাকে।'
    ref: single-point-of-failure
  - q: 'একটা API-তে বেশিরভাগ request ১০ms-এর, কিন্তু কিছু "রিপোর্ট ডাউনলোড" request ৩০ সেকেন্ড চলে। round robin-এ কিছু সার্ভার প্রায়ই জমে যায়। কী করবে?'
    hint: 'পালা করে গুনলে ভারী আর হালকা কাজ কি আলাদা হয়?'
    options:
      - text: 'least_conn চালু করা'
        correct: true
        why: 'দীর্ঘ request যার হাতে বেশি, তার connection সংখ্যা বেশি দেখাবে। LB তখন অন্য সার্ভারে পাঠাবে।'
      - text: 'সার্ভার সংখ্যা দ্বিগুণ করা'
        correct: false
        why: 'সমস্যা সংখ্যায় নয়, ভাগ করার নিয়মে। round robin-এ বেশি সার্ভারেও দুর্ভাগা সার্ভারে ভারী request জমতে পারে।'
      - text: 'ip_hash চালু করা'
        correct: false
        why: 'এতে ভাগ আরও অসম হয় — IP অনুযায়ী ঠিক হয়, কার কাজ কেমন তা দেখে না।'
      - text: 'সব সার্ভারের weight=1 রাখা'
        correct: false
        why: 'সমান weight মানে সমান সংখ্যা; লম্বা কাজের ওজন তাতে ধরা পড়ে না।'
    ref: balancing-algorithms
  - q: 'ডেটাবেস রেপ্লিকাগুলোতে (PostgreSQL, port 5432) read ভাগ করতে চাও। কোন ধরনের load balancer লাগবে?'
    hint: 'ডেটাবেস কথা বলে HTTP-তে নাকি অন্য protocol-এ?'
    options:
      - text: 'L4 (TCP) — যেমন nginx stream বা HAProxy tcp mode'
        correct: true
        why: 'PostgreSQL HTTP নয়। L4 শুধু TCP connection ভাগ করে, protocol না বুঝেই।'
      - text: 'L7 (HTTP) — path দেখে ভাগ করা'
        correct: false
        why: 'PostgreSQL-এ কোনো URL path নেই; HTTP LB এটা বুঝতেই পারবে না।'
      - text: 'কোনোটাই না, ডেটাবেসে load balancing সম্ভব নয়'
        correct: false
        why: 'read replica-র মধ্যে read ভাগ করা খুব প্রচলিত।'
      - text: 'DNS round robin ছাড়া উপায় নেই'
        correct: false
        why: 'DNS cache-এর কারণে ভাগ অসম ও ধীর, আর সার্ভার মরলেও ঠিকানা থাকে; L4 LB অনেক ভালো।'
    ref: l4-vs-l7
  - q: 'টিম LB-র health check endpoint-এ বানাল "SELECT 1 চালিয়ে ডেটাবেস ঠিক আছে কি না দেখো"। এক রাতে ডেটাবেস ২০ সেকেন্ড ধীর হলো। কী ঘটতে পারে?'
    hint: 'সব app সার্ভার একই ডেটাবেস দেখছে — check ব্যর্থ হলে কয়টা সার্ভার বাদ পড়ে?'
    options:
      - text: 'সব app সার্ভারের check একসাথে ব্যর্থ, LB সবাইকে বাদ দেয় — ছোট ধীরতা পুরো সাইট বন্ধ'
        correct: true
        why: 'ডেটাবেস সবার ভাগ করা নির্ভরতা, তাই তার সমস্যায় সব সার্ভার একসাথে অসুস্থ দেখায়। LB সার্ভার সরালে ডেটাবেসের সমস্যা আরও বাড়ে না, কিন্তু সাইট একদম বন্ধ।'
