  - q: 'নিচের কোডে ঝুঁকিটা কোথায়?'
    lang: php
    code: |
      $lock = $factory->createLock('report-export', ttl: 5);
      if ($lock->acquire()) {
          $this->exportAllOrders();      // সাধারণত ১০ মিনিট লাগে
          $lock->release();
      }
    hint: 'কাজ ১০ মিনিটের, লকের মেয়াদ ৫ সেকেন্ডের।'
    options:
      - text: '৫ সেকেন্ড পরে লকের মেয়াদ শেষ হয়, অন্য সার্ভার একই export শুরু করে — refresh() ও try/finally দরকার'
        correct: true
        why: 'ttl কাজের সময়ের চেয়ে অনেক ছোট। refresh() না করলে লক নিজেই ছুটে যায়, আর exception হলে release()-ও হয় না।'
      - text: 'acquire() ব্যর্থ হলে exception ফেলা উচিত'
        correct: false
        why: 'ব্যর্থ হলে চুপচাপ ফিরে যাওয়াই সাধারণ আচরণ; অন্য কেউ কাজ করছে মানে সমস্যা নয়।'
      - text: 'ttl বড় করে ১ দিন করলেই সব ঠিক'
        correct: false
        why: 'সার্ভার মরলে লক এক দিন আটকে থাকবে। ছোট ttl আর refresh()-ই ঠিক পথ।'
      - text: 'ttl-এর কোনো ভূমিকা নেই, release() লক রক্ষা করে'
        correct: false
        why: 'release() শুধু স্বাভাবিক শেষে কাজ করে; প্রসেস মরে গেলে শুধু ttl-ই লক ছাড়ায়।'
    ref: distributed-lock
  - q: 'লক সার্ভিস A-কে token 33 দিল। A ৪০ সেকেন্ডের GC pause-এ গেল, লক ছুটল, B পেল token 34 আর লিখল। A জেগে token 33 দিয়ে লিখতে গেল। fenced ডেটাবেসে কী হয়?'
    hint: 'ডেটাবেস শেষ যে token দেখেছে, তার সাথে ৩৩ তুলনা করুন।'
    options:
      - text: 'ডেটাবেস 33 < 34 দেখে A-র লেখা ফিরিয়ে দেয়'
        correct: true
        why: 'WHERE last_token <= :token শর্তে 34 <= 33 মেলে না, তাই কিছু আপডেট হয় না। A বুঝতে পারে সে আর leader নয়।'
      - text: 'A-র লেখা B-র লেখার ওপর বসে যায়, কারণ A পরে এসেছে'
        correct: false
        why: 'fencing ছাড়া এটাই ঘটত। token যাচাই থাকায় আর ঘটে না।'
      - text: 'লক সার্ভিস A-র লেখা আটকে দেয়'
        correct: false
        why: 'লক সার্ভিস লেখার পথে নেই। আটকানোর কাজটা সংরক্ষণ ব্যবস্থার।'
      - text: 'দুজনের লেখাই মার্জ হয়'
        correct: false
        why: 'কিছুই মার্জ হয় না। পুরনো token-এর লেখা সম্পূর্ণ বাতিল।'
    ref: fencing-token
