slides:
  - slug: two-leaders
    title: 'দুইজন ভাবল, "আমিই নেতা"'
    kind: story
    tldr: 'অনেক সার্ভারের মধ্যে কোনো কাজ একজনকেই করতে হলে কাউকে নেতা বাছতে হয়। নেটওয়ার্ক আটকালে দুজনেই নিজেকে নেতা ভাবতে পারে, আর কাজ দুইবার হয়ে যায়।'
    keywords: ['leader election', 'split brain', 'double execution', 'cron', 'দুই নেতা', 'coordination']
    blocks:
      - type: metaphor
        icon: school
        title: 'স্কুলের দুই প্রধান শিক্ষক'
        body: |
          স্কুলে প্রধান শিক্ষক ছুটিতে গেলে সহকারী প্রধানের দায়িত্ব নেওয়ার কথা। কিন্তু ফোন বন্ধ থাকায় সহকারী জানলেন না যে প্রধান আসলে ফিরে এসেছেন। দুজনেই নোটিশ দিয়ে ছুটি ঘোষণা করলেন, আবার পরীক্ষার ফিও দুজনেই তুললেন।
      - type: visual
        kind: sequence
        caption: 'বেতন দেওয়ার cron দুই সার্ভারে — দুজনই নিজেকে leader ভাবল'
        actors:
          - {id: a, label: 'সার্ভার A', icon: server, tip: 'আগে leader ছিল। এখন নেটওয়ার্কে, বা GC pause-এ (প্রোগ্রাম মেমরি সাফ করতে কিছুক্ষণ থেমে যায়) আটকে।'}
          - {id: b, label: 'সার্ভার B', icon: server, tip: 'A-র সাড়া না পেয়ে ভেবেছে A মরে গেছে।'}
          - {id: db, label: 'বেতন টেবিল', icon: db, tip: 'যে-ই লিখুক ডেটাবেস নিজে থেকে আপত্তি করে না।'}
        messages:
          - {from: a, to: db, label: 'আমি leader — মে মাসের বেতন দিচ্ছি'}
          - {at: a, note: '২০ সেকেন্ড আটকে (heartbeat বন্ধ)', tone: warn}
          - {from: b, to: db, label: 'A সাড়া দেয় না — আমি leader, বেতন দিচ্ছি', tip: 'B-র তখন জানার উপায় নেই যে A মরেনি, শুধু আটকে।'}
          - {from: a, to: db, label: 'ফিরে এসে বাকি বেতনও দিচ্ছি', tone: bad}
          - {at: db, note: 'একই বেতন দুইবার কাটা', tone: bad, tip: 'দুজনের কাছেই নিজেকে নেতা ভাবার যুক্তি ছিল। ঠিক এটাই split brain।'}
      - type: quote
        body: 'অনেক সার্ভারে "একজনই করবে" মানে হলো কেউ না কেউ সংখ্যাগরিষ্ঠের সম্মতিতে নেতা হবে।'
    aside:
      - type: problem
        body: 'সার্ভার মরেছে নাকি শুধু ধীর, বাইরে থেকে বোঝার উপায় নেই। তাই "A মরেছে" বলে B-র একা সিদ্ধান্ত নেওয়া বিপজ্জনক। এই segment শেখায় কীভাবে একসাথে সিদ্ধান্ত নিতে হয়।'
      - type: terms
        items:
          - {term: 'Leader election', meaning: 'অনেক সার্ভারের মধ্যে একজনকে বাছার নিয়ম, নেতা মরলে নতুন নেতা বাছা।'}
          - {term: 'Split brain', meaning: 'নেটওয়ার্ক দুই ভাগ হলে দুই ভাগই নিজেকে নেতা ভাবা।'}
    check:
      q: 'B কেন নিশ্চিত হতে পারে না যে A মরে গেছে?'
      a: 'সার্ভার মরে যাওয়া আর শুধু ধীর বা নেটওয়ার্কে আটকে থাকা বাইরে থেকে দেখতে একই। সাড়া না পাওয়ার মানে "মরেছে" নয়।'

  - slug: quorum-majority
    title: 'Quorum: সিদ্ধান্ত পাস হয় সংখ্যাগরিষ্ঠে'
    kind: concept
    tldr: 'Quorum হলো সংখ্যাগরিষ্ঠ (N/2 + 1)। কোনো সিদ্ধান্ত পাস করতে এত জনের সম্মতি লাগে। নেটওয়ার্ক দুই ভাগ হলে দুই ভাগের একটাই সংখ্যাগরিষ্ঠ পায়।'
    keywords: ['quorum', 'majority', 'split brain', 'network partition', 'odd number', 'কোরাম']
    blocks:
      - type: metaphor
        icon: users
        title: 'পাঁচ সদস্যের সালিশ কমিটি'
        body: |
          গ্রামের সালিশ কমিটিতে ৫ জন, রায় দিতে লাগে অন্তত ৩ জনের সম্মতি। বৃষ্টিতে রাস্তা কেটে কমিটি ৩ আর ২ জনের দুই দলে ভাগ হলে কী হয়? ৩ জনের দল রায় দিতে পারে, ২ জনের দল পারে না। তাই দুই দল আলাদা আলাদা বিপরীত রায় দিতে পারে না।
      - type: visual
        kind: table
        caption: 'কত নোডে কয়টা মরলেও সিস্টেম চলে'
        headers: ['নোড (N)', 'Quorum', 'কয়টা মরলেও চলে']
        rows:
          - cells: ['১', '১', '০']
            tip: 'একটাই নোড হলে সে মরলেই সব বন্ধ। এটাই SPOF (single point of failure): একটা জায়গা ভাঙলেই সব থামে।'
          - cells: ['৩', '২', '১']
            tip: 'সবচেয়ে ছোট বাস্তব cluster। একটা মরলেও বাকি দুজন মিলে সংখ্যাগরিষ্ঠ।'
          - cells: ['৪', '৩', '১']
            tip: '৩ নোডের চেয়ে একটা বেশি, কিন্তু সহ্য করার ক্ষমতা একই (১)। অতিরিক্ত নোড শুধু খরচ বাড়ায়।'
          - cells: ['৫', '৩', '২']
            tip: 'প্রোডাকশনে খুব প্রচলিত। দুটো মরলেও বাকি তিনজন সিদ্ধান্ত নিতে পারে।'
          - cells: ['৭', '৪', '৩']
            tip: 'বেশি নোড মানে প্রতিটা সিদ্ধান্তে বেশি জনের সাথে কথা, তাই ধীর। তাই ৭-এর বেশি সচরাচর করা হয় না।'
      - type: quote
        body: 'Quorum = N/2 + 1। নোডের সংখ্যা বেজোড় রাখুন — জোড় সংখ্যা বাড়তি খরচ, বাড়তি সহ্যক্ষমতা নয়।'
    aside:
      - type: remember
        body: 'দুই ভাগ একসাথে সংখ্যাগরিষ্ঠ হতে পারে না — এই এক সত্যের ওপর সব consensus দাঁড়িয়ে।'
      - type: tips
        items:
          - 'নোডগুলো আলাদা rack বা availability zone-এ রাখুন, যাতে একটা ঘটনায় সংখ্যাগরিষ্ঠই না যায়।'
          - 'দাম: সংখ্যাগরিষ্ঠ হারালে cluster দুই নেতার ঝুঁকি না নিয়ে লেখা নেওয়া বন্ধ করে দেয়। সে চালু থাকার চেয়ে নিরাপত্তাকে আগে রাখে।'
    check:
      q: '৫ নোডের cluster নেটওয়ার্ক ভাগ হয়ে ৩ আর ২ হলো। কোন দিক লেখা চালাতে পারবে?'
      a: '৩ নোডের দিক, কারণ তাদের সংখ্যাগরিষ্ঠ (quorum = ৩) আছে। ২ নোডের দিক নতুন সিদ্ধান্ত নিতে পারবে না।'

  - slug: raft-election
    title: 'Raft: নেতা বাছা আর লগ মেলানো'
    kind: concept
    tldr: 'Raft-এ একজন leader সব লেখা নেয়, follower-দের কাছে পাঠায়, আর সংখ্যাগরিষ্ঠ ঠিকঠাক পেলে তবেই কাজ পাকা করে। leader চুপ থাকলে ভোটে নতুন leader হয়।'
    keywords: ['Raft', 'Paxos', 'consensus', 'etcd', 'ZooKeeper', 'term', 'heartbeat', 'log replication']
    blocks:
      - type: metaphor
        icon: building
        title: 'সালিশ কমিটির সভাপতি'
        body: |
          সভাপতি নিয়মিত সবাইকে জানান, "আমি আছি"। কিছুক্ষণ কোনো খবর না এলে যে সদস্য সবার আগে ধৈর্য হারান, তিনি বলেন, "নতুন সভাপতি নির্বাচন চাই, আমাকে ভোট দিন।" ৩ জনের ভোট পেলে তিনি সভাপতি। সভাপতি রায় লিখে সবাইকে পাঠান, ৩ জন মেনে নিলে রায় চূড়ান্ত।
      - type: visual
        kind: steps
        caption: 'Raft-এর মূল চক্র'
        steps:
          - {title: '১. সবাই follower', body: 'leader-এর heartbeat এলে চুপচাপ থাকে', tip: 'leader নিয়মিত অল্প অল্প বার্তা (heartbeat) পাঠিয়ে জানায় সে জীবিত।'}
          - {title: '২. Timeout, candidate', body: 'heartbeat না এলে term বাড়িয়ে ভোট চায়', tip: 'প্রত্যেকের timeout আলাদা (যেমন ১৫০–৩০০ms র‍্যান্ডম), যাতে সবাই একসাথে candidate না হয়।'}
          - {title: '৩. সংখ্যাগরিষ্ঠ ভোটে leader', body: 'কোরাম পেলে নতুন leader হয়', tip: 'প্রতি term-এ একজন সদস্য একটাই ভোট দেয়। তাই একই term-এ দুজন leader হতে পারে না।', tone: accent}
          - {title: '৪. লগ পাঠায়', body: 'leader প্রতিটা লেখা follower-দের পাঠায়', tip: 'সব লেখা একটা ক্রমিক লগে জমে। লগ মেলানোই consensus-এর আসল কাজ।'}
          - {title: '৫. সংখ্যাগরিষ্ঠ মানলে পাকা', body: 'কোরাম ack দিলে লেখা committed', tip: 'committed লেখা কখনো হারায় না, এমনকি leader মরলেও। নতুন leader কেবল সেই সদস্যদের মধ্য থেকে হতে পারে যারা এটা জানে।'}
      - type: points
        title: 'নিজে লিখবেন না, ব্যবহার করুন'
        style: check
        items:
          - 'etcd (Raft): Kubernetes-এর সব অবস্থা এখানে থাকে।'
          - 'ZooKeeper (Zab, Paxos-এর কাছাকাছি): Kafka-র পুরনো সংস্করণ, Hadoop। Consul-ও Raft।'
          - 'Paxos Raft-এর আগের, একই নিশ্চয়তা, কিন্তু বোঝা ও বানানো অনেক কঠিন।'
    aside:
      - type: terms
        items:
          - {term: 'Term', meaning: 'নির্বাচনের পালা-নম্বর; নতুন নির্বাচনে বাড়ে। পুরনো term-এর leader-এর কথা কেউ মানে না।'}
          - {term: 'Committed', meaning: 'সংখ্যাগরিষ্ঠ নোডে লেখা হয়ে গেছে, তাই আর হারাবে না।'}
      - type: when
        use:
          - 'ছোট কিন্তু গুরুত্বপূর্ণ ডেটা: config, কে leader, লক (etcd, ZooKeeper বা Consul দিয়ে)'
        avoid:
          - 'বড় ডেটা বা অনেক বেশি লেখা: প্রতিটা লেখা সংখ্যাগরিষ্ঠের সাড়ার অপেক্ষা করে, আর সব লেখা এক leader-এর ঘাড়ে'
          - 'নিজে Raft লেখা: সূক্ষ্ম ভুলের জায়গা অনেক, তৈরি সেবা ব্যবহার করুন'
      - type: refs
        items:
          - {to: 'data/consistency-models', label: 'Linearizable ও অন্য consistency'}
    check:
      q: 'Raft-এ একই term-এ দুজন leader কেন হতে পারে না?'
      a: 'প্রতি সদস্য প্রতি term-এ একটাই ভোট দেয়, আর leader হতে সংখ্যাগরিষ্ঠ ভোট লাগে। দুটো আলাদা সংখ্যাগরিষ্ঠ একই ভোট দিতে পারে না।'

  - slug: distributed-lock
    title: 'Symfony Lock দিয়ে "একজনই চালাবে"'
    kind: howto
    tldr: 'সাধারণ ক্ষেত্রে Symfony Lock-এর LockFactory দিয়ে একটা কাজ একবারে একজনকে দিন। লকে ছোট TTL দিন, লম্বা কাজে refresh() করুন, শেষে release()।'
    keywords: ['Symfony Lock', 'LockFactory', 'distributed lock', 'TTL', 'refresh', 'cron', 'mutual exclusion']
    blocks:
      - type: text
        body: |
          পুরনো বেতনের cron-এ ফিরে যাই। প্রতি মাসের কাজের জন্য একটা নামওয়ালা লক নিন, পেলে কাজ করুন, না পেলে ফিরে যান। DSN বদলালেই একই কোড Redis, PostgreSQL বা ZooKeeper-এর লকে চলে।
      - type: code
        lang: yaml
        file: 'config/packages/lock.yaml'
        code: |
          framework:
              lock: '%env(LOCK_DSN)%'
              # LOCK_DSN=redis://redis:6379
              # LOCK_DSN=postgresql+advisory://app:secret@db/shop
              # LOCK_DSN=zookeeper://zk1:2181,zk2:2181,zk3:2181
        marks:
          - {line: 2, tip: 'একটা DSN-ই store ঠিক করে। কোড না বদলে Redis থেকে অন্য store-এ যাওয়া যায়।'}
      - type: code
        lang: php
        file: 'src/Payroll/PayrollRunner.php'
        variant: good
        code: |
          public function run(string $month): void
          {
              $lock = $this->lockFactory->createLock('payroll:'.$month, ttl: 60);

              if (!$lock->acquire()) {
                  return;                       // অন্য সার্ভার এই মাসের বেতন চালাচ্ছে
              }

              try {
                  foreach ($this->employees->unpaidFor($month) as $employee) {
                      $this->payroll->pay($employee, $month);
                      $lock->refresh();         // কাজ চলছে — মেয়াদ আবার ৬০ সেকেন্ড
                  }
              } finally {
                  $lock->release();
              }
          }
        marks:
          - {line: 3, tip: 'ttl থাকায় কাজ চলার মাঝে সার্ভার মরলেও ৬০ সেকেন্ড পরে লক নিজে থেকে ছুটে যায়। ttl না দিলে Symfony ধরে ৩০০ সেকেন্ড, তাই crash হলে বেতন ৫ মিনিট আটকে থাকত।'}
          - {line: 12, tip: 'প্রতি ধাপে মেয়াদ বাড়ানো হচ্ছে। কিন্তু এটাই নিরাপত্তা নয় — pause হলে লক তবু হারাতে পারে (পরের স্লাইড)।'}
    aside:
      - type: tips
        items:
          - 'এই লক "কাজ দুইবার না হোক" ধরনের সুবিধার জন্য। টাকা বা স্টকের মতো ভুল হলে ক্ষতি, এমন জায়গায় শুধু লকে ভরসা করবেন না।'
          - 'বেতন প্রতি কর্মীর জন্য idempotent রাখুন: (employee_id, month)-এ unique constraint দিলে লক ফসকালেও দ্বিতীয়বার দেওয়া যাবে না।'
      - type: refs
        items:
          - {to: 'concurrency/locking', label: 'Lock-এর ধরন ও ব্যবহার'}
          - {to: 'payments/idempotency-keys', label: 'Idempotency key'}
    check:
      q: 'লকের ttl খুব বড় হলে, বা কাজের চেয়ে ছোট হলে কী গোলমাল হয়?'
      a: 'বড় হলে সার্ভার মরলে ttl শেষ না হওয়া পর্যন্ত কেউ কাজটা ধরতে পারে না। ছোট হলে কাজের মাঝেই লক ছুটে দ্বিতীয় সার্ভার শুরু করে। তাই ছোট ttl দিন আর কাজ চলার সময় refresh() করুন।'

  - slug: fencing-token
