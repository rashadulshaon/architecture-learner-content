          - {line: 3, tip: 'token লকের grant-এর সাথেই বাড়ে। লক পাওয়ার পরে আলাদা করে sequence থেকে নিলে pause-এর ফাঁকে ভুল ক্রম হতে পারে।'}
          - {line: 10, tip: '<= কারণ একই leader একই token দিয়ে একাধিকবার লিখতে পারে। কম token এলে row আপডেট হয় না।'}
      - type: quote
        body: 'লক মেয়াদে ছাড়ে, আর লকধারী তা জানে না। তাই শেষ প্রহরী লকধারী নয়, সংরক্ষণ ব্যবস্থা।'
    aside:
      - type: pitfalls
        items:
          - 'একটা Redis-এর লক failover-এ হারাতে পারে: replica-তে লেখা পৌঁছানোর আগে primary মরলে নতুন primary লক চেনে না।'
          - 'etcd-র revision বা ZooKeeper-এর zxid আর sequence node স্বাভাবিকভাবেই ক্রমবর্ধমান token দেয়; সংরক্ষণ ব্যবস্থাকে সেটা যাচাই করতে হবে।'
          - 'Symfony Lock কোনো token দেয় না। fencing চাইলে উপরের মতো নিজের টেবিলে counter রাখুন, অথবা etcd-র revision নিন।'
      - type: when
        use:
          - 'কাজ দুইবার হলে শুধু খরচ বাড়ে: সাধারণ Symfony Lock যথেষ্ট'
        avoid:
          - 'টাকা বা স্টক বদলায়: fencing token বা idempotency ছাড়া শুধু লকে ভরসা'
          - 'বাইরের সেবা (ইমেইল, পেমেন্ট) token যাচাই করতে পারে না: সেখানে idempotency key ব্যবহার করুন'
      - type: refs
        items:
          - {to: 'time/clocks-lie', label: 'কেন ঘড়ি দিয়ে মেয়াদ বিশ্বাস করা যায় না'}
    check:
      q: 'লকধারী নিজেই কেন নিশ্চিত হতে পারে না যে তার লক এখনো বৈধ?'
      a: 'pause বা নেটওয়ার্কে আটকে থাকার সময় সে ঘুমিয়ে ছিল, মেয়াদ শেষ হয়ে অন্যজন লক পেয়ে গেছে। ফিরে এসে সে বুঝতেই পারে না, তাই সংরক্ষণ ব্যবস্থার token যাচাই লাগে।'

flashcards:
  - q: 'Leader election কেন লাগে, আর split brain কী?'
    a: 'একটা কাজ একজনই করবে এমন হলে একজনকে বাছতে হয়। নেটওয়ার্ক ভাগ হলে দুই দলই নিজেকে নেতা ভাবলে তার নাম split brain।'
    more: |
      সার্ভার মরেছে নাকি শুধু আটকে আছে, বাইরে থেকে বোঝা যায় না। তাই একা সিদ্ধান্ত না নিয়ে সংখ্যাগরিষ্ঠের ভোটে নেতা বাছতে হয়। না হলে একই বেতন, একই ইমেইল বা একই কাজ দুইবার হয়ে যায়।
    ref: two-leaders
  - q: 'Quorum কী এবং N নোডে সেটা কত?'
    a: 'সংখ্যাগরিষ্ঠ: N/2 + 1 (পূর্ণসংখ্যা)। ৩ নোডে ২, ৫ নোডে ৩, ৭ নোডে ৪।'
    more: |
      সিদ্ধান্ত পাস হতে quorum-এর সম্মতি লাগে। নেটওয়ার্ক দুই ভাগ হলে দুই ভাগ একসাথে সংখ্যাগরিষ্ঠ হতে পারে না, ফলে একই সময়ে দুই নেতা হয় না।
    ref: quorum-majority
  - q: 'Consensus cluster কেন ৩ বা ৫ নোডের বেজোড় সংখ্যায় রাখা হয়?'
    a: 'জোড় সংখ্যায় বাড়তি নোডে সহ্যক্ষমতা বাড়ে না। ৪ নোডেও ১টা মরলে চলে, ৩ নোডের মতোই, কিন্তু খরচ বেশি।'
    more: |
      ৩ নোডে quorum ২, ১টা মরলেও চলে। ৪ নোডে quorum ৩, তবু ১টাই মরতে পারে। ৫ নোডে quorum ৩, ২টা মরলেও চলে। বেশি নোড মানে প্রতিটা সিদ্ধান্তে বেশি জনের সাথে কথা, তাই ধীর।
    ref: quorum-majority
  - q: 'Raft এক কথায় কীভাবে কাজ করে?'
    a: 'একজন leader সব লেখা নেয়, follower-দের লগ পাঠায়, সংখ্যাগরিষ্ঠ ack দিলে লেখা পাকা। leader চুপ থাকলে ভোটে নতুন leader।'
    more: |
      প্রতি নির্বাচনের একটা term-নম্বর থাকে, আর প্রতি term-এ একজন সদস্য একটাই ভোট দেয়। Paxos একই ধরনের নিশ্চয়তা দেয়, তবে Raft বোঝার ও বানানোর সুবিধার জন্য ডিজাইন করা। বিস্তারিত: [[data/consistency-models|consistency model]]।
    ref: raft-election
  - q: 'etcd আর ZooKeeper কী কাজে লাগে?'
    a: 'ছোট কিন্তু গুরুত্বপূর্ণ ডেটা (config, leader, লক) নির্ভরযোগ্যভাবে রাখার consensus-ভিত্তিক সেবা। etcd Raft, ZooKeeper Zab ব্যবহার করে।'
    more: |
      Kubernetes তার সব অবস্থা etcd-তে রাখে। আপনি নিজে Raft লিখবেন না; এগুলো ব্যবহার করে leader election, লক আর service discovery করবেন। বড় ডেটা রাখার জায়গা এগুলো নয়, অল্প ডেটা, বেশি নির্ভরযোগ্যতা।
    ref: raft-election
  - q: 'Symfony Lock ব্যবহারের তিন নিয়ম কী?'
    a: 'TTL দিন, লম্বা কাজে refresh() করুন, finally-তে release() করুন। TTL না দিলে Symfony ধরে ৩০০ সেকেন্ড, তাই সার্ভার মরলে কাজটা ৫ মিনিট আটকে থাকে।'
    more: |
      `$factory->createLock($name, ttl: 60)` দিয়ে লক বানান, `acquire()` ব্যর্থ হলে ফিরে যান। লক শুধু "কাজ দুইবার না হোক" সুবিধার জন্য; টাকা বা স্টকের মতো জায়গায় fencing token বা idempotency লাগে।
    ref: distributed-lock
  - q: 'Fencing token কী কাজে লাগে?'
    a: 'লকের সাথে ক্রমবর্ধমান নম্বর দেওয়া হয়, আর সংরক্ষণ ব্যবস্থা পুরনো (কম) নম্বর ফিরিয়ে দেয়। ফলে মেয়াদ-শেষ লকধারী ক্ষতি করতে পারে না।'
    more: |
      লকধারী pause-এ আটকে থাকলে সে জানে না লক চলে গেছে। তাই শেষ যাচাই সংরক্ষণ ব্যবস্থায়: `WHERE last_token <= :token`। token অবশ্যই লক grant-এর সাথে একই atomic ধাপে বাড়াতে হয়। etcd-র revision বা ZooKeeper-এর zxid এমন token-ই দেয়।
    ref: fencing-token
  - q: 'Consensus cluster সংখ্যাগরিষ্ঠ নোড হারালে কী হয়?'
    a: 'সে লেখা নেওয়া বন্ধ করে দেয়। দুই নেতার ঝুঁকির চেয়ে অচল থাকাকেই বেছে নেয়, তাই ৫ নোডের cluster-এ অন্তত ৩টা নোড চালু থাকতে হয়।'
    more: |
      এটাই quorum নিয়মের দাম। ৫ নোডে ২টা মরলেও চলে। ৩টা মরলে বাকি ২ জন সংখ্যাগরিষ্ঠ হতে পারে না, তাই যথেষ্ট নোড ফেরা পর্যন্ত অপেক্ষা করে। থেমে থাকা নিরাপদ; একা সিদ্ধান্ত নিলে split brain-এর ঝুঁকি।
    ref: quorum-majority

quiz:
  - q: '৫ নোডের etcd cluster নেটওয়ার্ক সমস্যায় ৩ আর ২ নোডের দুই ভাগ হয়ে গেল। কী ঘটবে?'
    hint: 'quorum = N/2 + 1। দুই ভাগের কোনটার কাছে সেটা আছে?'
    options:
      - text: '৩ নোডের ভাগ leader বাছে ও লেখা নেয়; ২ নোডের ভাগ লেখা নিতে পারে না'
        correct: true
        why: '৩ নোডের ভাগ quorum (৩) পায়। ২ নোডের ভাগ কোনো সিদ্ধান্ত পাস করতে পারে না, ফলে split brain হয় না।'
      - text: 'দুই ভাগেই আলাদা leader হয়ে দুই ভাগ আলাদা লেখা নেয়'
        correct: false
        why: 'এটাই quorum আটকায়। দুই ভাগ একসাথে সংখ্যাগরিষ্ঠ হতে পারে না।'
      - text: 'পুরো cluster বন্ধ হয়ে যায়'
        correct: false
        why: '৩ নোডের ভাগ চালু থাকে; শুধু ২ নোডের ভাগ অচল।'
      - text: '২ নোডের ভাগ leader হয়, কারণ ছোট ভাগ দ্রুত ভোট দেয়'
        correct: false
