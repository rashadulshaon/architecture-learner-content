          - 'প্রোটোটাইপ বা ছোট অভ্যন্তরীণ টুল: এক বাক্স আর সস্তা নিয়মেই চলে'
          - 'bottleneck এখনো মাপা হয়নি: আগে সেটা খুঁজুন'
