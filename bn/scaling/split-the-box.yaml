        items:
          - {to: 'scaling/load-latency', label: 'আসল bottleneck খোঁজা'}
          - {to: 'scaling/horizontal-vertical', label: 'Vertical বনাম horizontal scaling'}
    check:
      q: 'ডেটাবেস নিজের হোস্টে সরানোর পর ২০০ query-র একটা তালিকা-পাতা ধীর লাগছে। কী হয়েছে, আর সবচেয়ে ভালো সমাধান কী?'
      a: 'প্রতিটা query এখন প্রায় ১ ms নেটওয়ার্ক সময় দেয়, তাই ২০০ query-তে প্রায় ২০০ ms বাড়ে। প্রতি সারিতে একটা করে নয়, সারিগুলো একটাই JOIN-query-তে আনুন।'

flashcards:
  - q: 'সিস্টেম ডিজাইনে "blast radius" কী?'
    a: 'একটা ব্যর্থতা বা একটা break-in সিস্টেমের কতটা ক্ষতি করতে পারে। আলাদা মেশিন, নেটওয়ার্ক আর credential-এ অংশ ভাগ করলে এটা ছোট হয়।'
    more: |
      অ্যাপ, ডেটাবেস, ছবি আর ব্যাকআপ এক বাক্সে থাকলে আপলোড ফর্মের একটা ফুটোই সবকিছুতে পৌঁছায়। ভাগ করার পর অ্যাপে ঢুকলেও আক্রমণকারীকে ডেটাবেস, storage আর ব্যাকআপে আলাদা করে ঢুকতে হয়।
    ref: blast-radius-and-split
  - q: 'ডেটাবেসের ডিস্কেই রাখা ব্যাকআপ আসল ব্যাকআপ নয় কেন?'
    a: 'যে ডিস্ক নষ্ট, break-in বা ভুল মোছা ডেটাবেসকে মারে, সেটা ব্যাকআপকেও মারে। ব্যাকআপ থাকতে হবে অন্য কোথাও।'
    more: |
      এক ডিস্ক মানে এক ব্যর্থতা। ব্যাকআপ পাঠান অন্য জায়গায়, ফাইল যোগ করতে পারে কিন্তু মুছতে পারে না এমন key দিয়ে, আর versioning বা Object Lock চালু রাখুন। দেখুন [[recovery/backups-restore|ব্যাকআপ ও 3-2-1 নিয়ম]]।
    ref: uploads-and-backups
  - q: 'অ্যাপ, ডেটাবেস আর ফাইলের মধ্যে এক সার্ভার কোন তিনটে জিনিস ভাগাভাগি করে?'
    a: 'দরজা (একটা break-in সবাইকে ধরে), CPU-RAM (একটা ভারী কাজ সবাইকে ধীর করে) আর ডিস্ক (একটা ভরা বা মরা ডিস্ক সবাইকে টানে)।'
    more: |
      চতুর্থটা সময়সূচি: একটা অংশ patch বা scale করতে গেলে বাকিগুলোও ছুঁতে হয়। ভাগ করলে প্রতিটা অংশ পায় নিজের দরজা, নিজের সম্পদ আর নিজের ব্যর্থতা।
    ref: blast-radius-and-split
  - q: 'MySQL বা PostgreSQL-কে নিজের config-এ ইন্টারনেট থেকে কীভাবে আড়াল করবেন?'
    a: 'MySQL-এ `bind-address` private IP-তে। PostgreSQL-এ `listen_addresses` private IP-তে, আর `pg_hba.conf`-এ app subnet-এ সীমিত একটা লাইন।'
    more: |
      firewall বা security group-এও ডেটাবেসের port বন্ধ রাখুন। বাইরে থেকে `nc -vz <public-ip> 3306` চালিয়ে দেখুন: ব্যর্থ হতে হবে। Managed ডেটাবেসে "not publicly accessible" বেছে শুধু অ্যাপের security group-কে ঢুকতে দিন।
    ref: private-database
  - q: 'চলতি অ্যাপের ডেটাবেস ইউজারের কী কী অধিকার থাকা উচিত?'
    a: 'শুধু চলার সময় কোড যা করে: নিজের ডেটাবেসে SELECT, INSERT, UPDATE, DELETE। DROP, ALTER, CREATE নয়, global অধিকারও নয়।'
    more: |
      অ্যাপে ঢোকা web shell অ্যাপের ডেটাবেস-অধিকার পায়। `shop_app` হলে সে সারি পড়তে-বদলাতে পারে, কিন্তু টেবিল drop বা alter করতে পারে না। Least privilege ক্ষতি সীমিত করে, মুছে দেয় না।
    ref: least-privilege-user
  - q: 'migration চালাতে অ্যাপের চেয়ে আলাদা ডেটাবেস ইউজার কেন?'
    a: 'Migration-এ schema বদলাতে হয়, অ্যাপের হয় না। ক্ষমতাবান ইউজার deploy pipeline-এ রাখলে অ্যাপের ভেতরের স্ক্রিপ্ট তাকে কাজে লাগাতে পারে না।'
    more: |
      Deploy-এর ধাপ চালায় `DATABASE_URL="$MIGRATE_DATABASE_URL" php bin/console doctrine:migrations:migrate --no-interaction`। দাম: দ্বিতীয় একজন ইউজার আর পাসওয়ার্ড রাখা ও বদলানো।
    ref: least-privilege-user
  - q: '"Defence in depth" মানে কী?'
    a: 'পরপর কয়েকটা স্বাধীন তালা, যার প্রতিটা ধরে নিয়ে বানানো যে আগেরটা ইতিমধ্যে ভেঙেছে।'
    more: |
      নিরাপদ আপলোড shell আটকায়। Private ডেটাবেস বাইরের দুনিয়া আটকায়। Least privilege ঢুকে পড়া shell-এর ক্ষমতা কমায়। বাক্সের বাইরের ব্যাকআপ সবকিছু ব্যর্থ হলে ফেরার পথ দেয়। যেকোনো একটা তালা একদিন ভাঙবে, তাই বাকিগুলো টিকতে হবে।
    ref: least-privilege-user
  - q: 'nginx-এ আপলোড করা `shell.php`-কে চলা থেকে কীভাবে আটকাবেন?'
    a: '`/uploads/`-কে `location ^~` দিয়ে আটকে তার ভেতরে `.php` deny করুন, PHP-FPM-কে শুধু `index.php` দিন, অথবা uploads রাখুন `public/`-এর বাইরে।'
    more: |
      সার্ভারে আসল ধরন ও আকারও যাচাই করুন, আর দর্শকের নামে নয়, `Uuid::v7()`-এর মতো এলোমেলো নামে রাখুন। আপলোডের সবচেয়ে নিরাপদ জায়গা object storage, যেখানে কিছুই কোড হয়ে চলে না।
    ref: uploads-and-backups
  - q: 'ডেটাবেস নিজের হোস্টে সরালে প্রতি query-তে কী দাম পড়ে?'
    a: 'নেটওয়ার্কের একটা ধাপ: একই data centre-এ সাধারণত প্রায় ১ ms, একই বাক্সে ০.১ ms-এর অনেক নিচে। ২০০ query-তে প্রায় ২০০ ms বাড়ে।'
    more: |
      একটা query নিরীহ, কিন্তু N+1 পাতা ধাপটাকে গুণ করে। সারিগুলো একটা JOIN-এ আনুন। ভাগ করায় আরও আছে: চালানোর অংশ বেশি, নতুন ব্যর্থতা (tier-দের মাঝের নেটওয়ার্ক) আর বড় মাসিক বিল। এক বাক্স কখন ঠিক, দেখুন [[scaling/horizontal-vertical|vertical বনাম horizontal scaling]]।
    ref: price-and-when-one-box

quiz:
  - q: 'নাদিয়ার গল্পে ডেটাবেস চুরির সাথে সাথে ব্যাকআপও মুছে গেল কেন?'
    hint: 'ব্যাকআপ কোথায় ছিল, আর সেখানে কে লিখতে পারত?'
    options:
      - text: 'সেগুলো একই ডিস্কে ছিল, এমন ফোল্ডারে যেখানে অ্যাপের ইউজার লিখতে পারে'
        correct: true
        why: 'স্ক্রিপ্ট অ্যাপ হয়ে চলছিল, তাই অ্যাপ যা মুছতে পারে সে-ও পারে। যে ব্যাকআপ মেশিন ভাগ করে, সে মেশিনের ভাগ্যও ভাগ করে।'
      - text: 'MySQL ডাম্প নিলেই পুরনো ব্যাকআপ মুছে দেয়'
        correct: false
        why: 'ডাম্প কিছু মোছে না। কোনো মানুষ বা স্ক্রিপ্টকেই ফাইল মুছতে হয়েছে।'
      - text: 'ব্যাকআপ compress করা ছিল না'
        correct: false
        why: 'Compress করলে আকার বদলায়, ফাইলে কে পৌঁছাতে পারে তা বদলায় না।'
      - text: 'nginx এক সপ্তাহের পুরনো ফাইল মুছে দেয়'
        correct: false
        why: 'nginx ফাইল পরিবেশন করে, ফোল্ডার সাফ করে না।'
    ref: one-box-one-break-in
  - q: 'প্রতিদিন সকাল ৯টায় একটা ভারী বিক্রির রিপোর্ট চলে, আর শেষ না হওয়া পর্যন্ত দোকানের পাতা হামাগুড়ি দেয়। এক বাক্সের কোন সমস্যা এটা?'
    hint: 'কেউ ঢোকেনি। দুটো কাজ কিছু একটা নিয়ে কাড়াকাড়ি করছে।'
    options:
      - text: 'Resource contention: রিপোর্ট আর ওয়েব request একই CPU ও RAM ভাগ করছে'
        correct: true
        why: 'দুটোই এক মেশিনে, তাই রিপোর্ট যা নেয় ওয়েব request তা হারায়। ডেটাবেস আলাদা হোস্টে গেলে ওয়েব সার্ভারের CPU তার নিজের থাকে।'
      - text: 'বড় blast radius, কারণ আক্রমণকারী ঢুকেছে'
        correct: false
        why: 'Blast radius মানে একটা break-in কতদূর পৌঁছায়। এখানে কেউ ঢোকেনি।'
      - text: 'N+1 query সমস্যা'
        correct: false
        why: 'N+1 মানে এক পাতা থেকে অনেক ছোট query। এখানে একটা বড় কাজ অন্য কাজের সাথে কাড়াকাড়ি করছে।'
      - text: 'Replication lag'
        correct: false
        why: 'এই সেটআপে replica-ই নেই, তাই পিছিয়ে পড়ার কিছু নেই।'
    ref: blast-radius-and-split
  - q: 'পাবলিক IP-ওয়ালা ডেটাবেস হোস্টে নিচের সেটিংয়ে ভুলটা কী?'
    lang: text
    code: |
      # postgresql.conf
      listen_addresses = '*'

      # pg_hba.conf
      host    all       all       0.0.0.0/0    scram-sha-256
    hint: 'কে ঢুকতে পারবে, আর কোথা থেকে, সেটা পড়ুন।'
    options:
      - text: 'সব ঠিকানায় শোনে আর যেকোনো জায়গা থেকে login নেয়, তাই পুরো ইন্টারনেট connect করার চেষ্টা করতে পারে'
        correct: true
        why: '`listen_addresses` private ঠিকানায় আর `pg_hba.conf` একজন ইউজার, একটা ডেটাবেস আর app subnet-এ সীমিত করুন।'
      - text: 'কিছুই নয়, scram-sha-256 শক্ত পদ্ধতি'
        correct: false
        why: 'শক্ত পাসওয়ার্ড-যাচাই একটাই তালা। ইন্টারনেটের যে কেউ তবুও কড়া নাড়তে পারে, আর bot সারাদিন পাসওয়ার্ড আর জানা bug ঠোকে।'
      - text: 'পদ্ধতিটা `trust` হওয়া উচিত'
        correct: false
        why: '`trust` পাসওয়ার্ড ছাড়াই ঢুকতে দেয়। এতে অবস্থা আরও খারাপ।'
      - text: 'ডেটাবেসকে port 80-তে শুনতে হবে'
        correct: false
        why: 'port নম্বর সমস্যা নয়। সমস্যা হলো ঠিকানা আর কাদের ঢুকতে দেওয়া হচ্ছে।'
    ref: private-database
  - q: 'অ্যাপ `shop_app` (SELECT, INSERT, UPDATE, DELETE) ব্যবহার করে। app সার্ভারে আক্রমণকারী একটা web shell পেল। সে এখনো কী কী পারে?'
    hint: 'অ্যাপ নিজে কী পারে ভাবুন।'
    options:
      - text: 'অ্যাপ যে টেবিল পড়তে পারে, সেগুলো পড়তে'
        correct: true
        why: 'Shell অ্যাপের অধিকার পায়, আর অ্যাপ এই টেবিল পড়ে। Least privilege ক্ষতি কমায়, মুছে দেয় না।'
      - text: 'সারি মুছতে বা বদলাতে'
        correct: true
        why: 'অ্যাপের DELETE আর UPDATE আছে, তাই shell-এরও আছে। এজন্যই আপলোডের ফুটোও বন্ধ করতে হয়।'
      - text: 'orders টেবিলে DROP TABLE চালাতে'
        correct: false
        why: 'shop_app-কে DROP কখনো দেওয়া হয়নি, তাই ডেটাবেস কমান্ডটা ফিরিয়ে দেয়।'
      - text: 'টেবিলের গঠন ALTER করতে বা অন্য ডেটাবেস পড়তে'
        correct: false
        why: 'grant শুধু `shop.*`-এ SELECT, INSERT, UPDATE, DELETE-এর। schema বদল আর অন্য ডেটাবেস নাগালের বাইরে।'
    ref: least-privilege-user
  - q: 'আপলোড করা `shell.php`-কে কোড হিসেবে চলা থেকে আসলে কোন বদলটা আটকায়?'
    hint: 'সমাধানকে বদলাতে হবে ফাইলটা নিয়ে সার্ভার কী করে।'
    options:
      - text: '`/uploads/`-এ `.php` চালানো নিষেধ করা (বা uploads `public/`-এর বাইরে বা object storage-এ রাখা)'
        correct: true
        why: 'যাচাই পার হয়ে ঢুকলেও ফাইলটা শুধু ডেটা, কখনো চলে না। আক্রমণকারীর ঠিক সেই পথটাই বন্ধ হয়।'
      - text: 'uploads ফোল্ডারের নাম গোপন কিছু করে দেওয়া'
        correct: false
        why: 'নাম লুকানো তালা নয়। আক্রমণকারী ফাইল আপলোড করে URL ফেরত পায়, নয়তো পাতা থেকে খুঁজে নেয়।'
      - text: 'আপলোডের আগে JavaScript-এ extension যাচাই'
        correct: false
        why: 'আক্রমণকারী আপনার ফর্ম ব্যবহারই করে না। ব্রাউজারের যাচাই শুধু ভালো ব্যবহারকারীর জন্য।'
      - text: 'আপলোড ২ MB-তে সীমিত করা'
        correct: false
        why: 'Web shell কয়েকশো byte-ও হতে পারে। আকারের সীমা বন্যা ঠেকায়, স্ক্রিপ্ট নয়।'
    ref: uploads-and-backups
  - q: 'গল্পের আক্রমণকারীর হাত থেকে রাতের ব্যাকআপ বাঁচায় এর মধ্যে কোনগুলো?'
    hint: 'আক্রমণকারীর হাতে বাক্সের ফাইল আর key দুটোই।'
    options:
      - text: 'কপি বাক্সের বাইরের bucket-এ পাঠানো, এমন key দিয়ে যার শুধু s3:PutObject আছে'
        correct: true
        why: 'ব্যাকআপ অন্য মেশিনে, আর বাক্সের key পুরনো কপি মুছতে পারে না, তাই আক্রমণকারী সেগুলো সাফ করতে পারে না।'
      - text: 'সেই bucket-এ versioning বা Object Lock চালু করা'
        correct: true
        why: 'ওপরে লেখা বা মোছা object-ও ফেরত আনা যায়, বা একেবারেই মোছা যায় না, তাই ইতিহাস টিকে থাকে।'
      - text: 'একই ডিস্কের আরেকটা ফোল্ডারে দ্বিতীয় কপি রাখা'
        correct: false
        why: 'একই ডিস্ক, একই ইউজার, একই অনুপ্রবেশকারী। এক ডিস্কের দুই কপিও একটাই ব্যর্থতা।'
      - text: 'ডাম্পে পাসওয়ার্ড দিয়ে zip করা, পাসওয়ার্ড একই বাক্সের `.env`-এ'
        correct: false
        why: 'আক্রমণকারী `.env` পড়ে, আর ফাইল তবুও মুছতে পারে। পাসওয়ার্ড কাজের কিছু আটকায় না।'
    ref: uploads-and-backups
  - q: 'ডেটাবেস নিজের হোস্টে সরানোর পর (প্রতি query-তে প্রায় ১ ms) ২০০ query-র একটা তালিকা-পাতা ধীর লাগছে। সবচেয়ে ভালো সমাধান কী?'
    hint: 'বাড়তি সময়টা এল কোথা থেকে?'
    options:
      - text: 'সারিগুলো একটা JOIN-query-তে আনা, যাতে নেটওয়ার্কের ধাপের দাম একবারই পড়ে'
        correct: true
        why: 'ধাপের সময় × ২০০টা query = প্রায় ২০০ ms। একটা query ধাপের দাম দেয় একবার।'
      - text: 'ডেটাবেস আবার app সার্ভারে ফিরিয়ে আনা'
        correct: false
        why: 'এতে ভাগ করে পাওয়া নিরাপত্তা চলে যায়। ভুলটা পাতার, স্থাপত্যের নয়।'
      - text: 'আরও app সার্ভার যোগ করা'
        correct: false
        why: 'বেশি সার্ভার একসাথে বেশি request সামলায়, কিন্তু প্রতিটা request-কে এখনো ২০০ ধাপের অপেক্ষা করতে হয়।'
      - text: 'কিছু না, নেটওয়ার্ক বিনা পয়সার'
        correct: false
        why: 'নেটওয়ার্ক প্রতিটা query-তে latency যোগ করে। ভাগ করার এটাই সৎ দাম।'
    ref: price-and-when-one-box
