slides:
  - slug: line-cut-bank
    title: 'শাখার ফোন লাইন কাটা: টাকা দেবে, না দেবে না?'
    kind: story
    tldr: 'দুই জায়গায় থাকা ডেটার মাঝের যোগাযোগ কেটে গেলে সিস্টেমকে বাছতে হয়: ভুল হতে পারে জেনেও উত্তর দেবে, নাকি নিশ্চিত না হয়ে উত্তরই দেবে না।'
    keywords: ['CAP theorem', 'partition', 'consistency', 'availability', 'দুই শাখা', 'নেটওয়ার্ক ভাগ']
    blocks:
      - type: metaphor
        icon: bank
        title: 'ঢাকা আর সিলেট শাখার একই অ্যাকাউন্ট'
        body: |
          রহিমের অ্যাকাউন্টে ৫০০০ টাকা, আর ঢাকা ও সিলেট দুই শাখাই ব্যালেন্স জানে। দুই শাখার ফোন লাইন কেটে গেল। এখন রহিম ঢাকায়, তার স্ত্রী সিলেটে — দুজনেই ৪০০০ তুলতে চান। শাখা দুটোর সামনে মাত্র দুটো পথ।
      - type: visual
        kind: sequence
        caption: 'লাইন কাটা অবস্থায় দুই শাখাই "হ্যাঁ" বলল'
        actors:
          - {id: rahim, label: 'রহিম (ঢাকা)', icon: user, tip: 'ঢাকা শাখায় ৪০০০ টাকা তুলতে এসেছে।'}
          - {id: dhaka, label: 'ঢাকা শাখা', icon: bank, tip: 'নিজের কাছে ব্যালেন্স ৫০০০ দেখছে। সিলেটের খবর জানে না।'}
          - {id: sylhet, label: 'সিলেট শাখা', icon: bank, tip: 'নিজের কাছেও ব্যালেন্স ৫০০০। ঢাকার খবর জানে না।'}
          - {id: wife, label: 'স্ত্রী (সিলেট)', icon: user, tip: 'একই অ্যাকাউন্ট থেকে একই সময়ে সিলেটে ৪০০০ তুলতে এসেছে।'}
        messages:
          - {at: dhaka, note: 'ঢাকা–সিলেট লাইন কাটা (partition)', tone: warn, tip: 'কেউ জানে না অন্য শাখা মরেছে, নাকি শুধু লাইন কাটা।'}
          - {from: rahim, to: dhaka, label: '৪০০০ তুলব'}
          - {from: dhaka, to: rahim, label: 'নিন, ৪০০০', dashed: true}
          - {from: wife, to: sylhet, label: '৪০০০ তুলব'}
          - {from: sylhet, to: wife, label: 'নিন, ৪০০০', dashed: true}
          - {at: sylhet, note: 'অ্যাকাউন্টে ৫০০০, তোলা ৮০০০', tone: bad, tip: 'দুজনকেই উত্তর দেওয়া হলো (available), কিন্তু হিসাব আর মিলল না (inconsistent)।'}
      - type: points
        title: 'শাখার সামনে দুই পথ'
        style: dot
        items:
          - 'টাকা দিয়ে দেওয়া: লাইন ঠিক হলে হিসাব মেলাব (সবাই উত্তর পায়, কিন্তু ভুল হতে পারে)।'
          - 'টাকা না দেওয়া: লাইন না আসা পর্যন্ত অপেক্ষা (হিসাব সঠিক, কিন্তু কেউ কাজ পায় না)।'
    aside:
      - type: problem
        body: 'নেটওয়ার্ক ভাগ হলে কোনো সিস্টেমই ঠিক উত্তর আর সবসময় উত্তর — দুটোই একসাথে দিতে পারে না। এই বাছাইটা আগে থেকে ঠিক না করলে সংকটের মুহূর্তে এলোমেলোভাবে ঠিক হয়ে যায়।'
      - type: refs
        items:
          - {to: 'data/consistency-models', label: 'Linearizable ও eventual consistency'}
    check:
      q: 'লাইন কাটা অবস্থায় দুই শাখাই টাকা দিলে কী নষ্ট হলো, আর না দিলে কী নষ্ট হতো?'
      a: 'দিলে consistency (হিসাবের সঠিকতা) নষ্ট। না দিলে availability (সবসময় উত্তর পাওয়া) নষ্ট। দুটো একসাথে বাঁচানো যেত না।'

  - slug: cap-in-practice
    title: 'CAP: ভাগ হবেই, তখন C না A বেছে নিন'
    kind: concept
    tldr: 'নেটওয়ার্ক ভাগ (partition) এড়ানো যায় না। তাই CAP আসলে বলে: partition-এর সময় consistent থাকবে (CP), নাকি available থাকবে (AP)। এটা একটা ডেটাবেস নয়, ফিচারের বাছাই।'
    keywords: ['CAP', 'CP', 'AP', 'partition tolerance', 'linearizability', 'consistency vs availability', 'সিপি এপি']
    blocks:
      - type: visual
        kind: compare
        caption: 'Partition-এর সময় দুই পথ'
        columns:
          - title: 'CP — ঠিক উত্তর, নইলে অপেক্ষা'
            tone: accent
            icon: lock
            tip: 'ভুল উত্তরের চেয়ে উত্তর না দেওয়া ভালো, এমন ফিচারের পথ। সংখ্যাগরিষ্ঠ পাশ চলে, ছোট পাশ থামে।'
            items:
              - 'লাইন কাটলে টাকা তোলা বন্ধ'
              - 'ছোট পাশ error বা timeout দেয়'
              - 'ব্যালেন্স, স্টক, সিট, লক, leader'
              - 'etcd, ZooKeeper এই পথে'
          - title: 'AP — উত্তর দেবই, পরে মেলাব'
            tone: good
            icon: wifi
            tip: 'সবসময় সাড়া দেওয়া জরুরি, সামান্য পুরনো ডেটা চলে এমন ফিচারের পথ। পরে হিসাব মেলাতে হয়।'
            items:
              - 'দুই পাশই উত্তর দেয়'
              - 'কিছু উত্তর পুরনো হতে পারে'
              - 'লাইক, feed, cart, view count'
              - 'লাইন ঠিক হলে বদলগুলো মেলানো হয়'
      - type: points
        title: 'Partition আসলে কী'
        style: dot
        items:
          - 'দুই নোড একে অপরের কাছে পৌঁছাতে পারছে না। তার কাটা, switch বিকল, ফায়ারওয়ালের ভুলও এর মধ্যে পড়ে।'
          - 'ধীর মানে মৃত: ৩০ সেকেন্ডের GC pause-এ নোডটা timeout-এর পর অন্যদের চোখে হারিয়ে যায়।'
          - 'বিরল, কিন্তু হয়। একটা বড় সিস্টেমে বছরে অন্তত কয়েকবার, তাই "ঘটবে না" ধরে ডিজাইন চলে না।'
      - type: quote
        body: 'CAP-এ "তিনের দুটো" বাছা নয়। Partition হবেই; তখন বাছতে হয় ঠিক উত্তর (C), নাকি উত্তর দেওয়া (A)।'
    aside:
      - type: terms
        items:
          - {term: 'C (consistency)', meaning: 'প্রতিটা পড়া সর্বশেষ লেখা দেখে, যেন ডেটা একটাই কপি। ACID-এর C (নিয়ম মানা) থেকে আলাদা জিনিস।'}
          - {term: 'A (availability)', meaning: 'যে নোড জীবিত, সে প্রতিটা request-এর উত্তর দেয়, error বা চিরকাল অপেক্ষা নয়।'}
          - {term: 'P (partition)', meaning: 'নোডদের মাঝের বার্তা হারানো বা দেরি হওয়া।'}
          - {term: 'GC pause', meaning: 'মেমরি পরিষ্কার করতে প্রোগ্রামের কিছুক্ষণ থেমে যাওয়া। অন্যদের চোখে তাকে মৃত মনে হয়।'}
      - type: remember
        body: 'Partition নেই তো C আর A দুটোই থাকে। Partition এলে একটা ছাড়তে হয়।'
    check:
      q: '"আমরা CA ডেটাবেস বেছেছি, partition নিয়ে ভাবি না" — কথাটার ভুল কোথায়?'
      a: 'Partition বাছার জিনিস নয়, ঘটে যাওয়া জিনিস। একাধিক নোডের সিস্টেমে নেটওয়ার্ক ভাগ হতেই পারে, তখন C আর A-র মধ্যে একটা ছাড়তেই হয়।'

  - slug: pacelc-latency
    title: 'PACELC: লাইন ঠিক থাকলেও দাম দিতে হয়'
    kind: concept
    tldr: 'Partition না থাকলেও (Else) দুই জায়গায় সবার সম্মতি নিয়ে লিখলে latency বাড়ে। PACELC বলে: partition-এ A না C, নইলে L (latency) না C।'
    keywords: ['PACELC', 'latency vs consistency', 'synchronous replication', 'quorum', 'eventual consistency', 'সিঙ্ক রেপ্লিকেশন']
    blocks:
      - type: metaphor
        icon: phone
        title: 'প্রতিবার সিলেটকে ফোন করে নেওয়া'
        body: |
          লাইন ঠিক আছে। ঢাকা শাখা চাইলে প্রতিটা টাকা তোলার আগে সিলেটকে ফোন করে হিসাব মিলিয়ে নিতে পারে — নিখুঁত, কিন্তু ১ মিনিট লাগে। আবার না জিজ্ঞেস করে নিজেই দিয়ে দিতে পারে — ১০ সেকেন্ড, কিন্তু সিলেটের খবর একটু পুরনো থাকতে পারে। লাইন ভালো থাকলেও এই দাম দিতে হয়।
      - type: visual
        kind: bars
        caption: 'এক লেখার আনুমানিক সময়, কতজনের সম্মতি লাগে তার ওপর'
        items:
          - {label: 'এক সার্ভারে লেখা', value: 2, display: '2ms', tone: good, tip: 'কারো সাথে কথা বলতে হয় না, তাই দ্রুত। কিন্তু সার্ভার মরলে ডেটা হারাতে পারে।'}
          - {label: '৩ AZ-তে quorum', value: 6, display: '6ms', tip: 'একই শহরের তিন ডেটা সেন্টারে সংখ্যাগরিষ্ঠের সম্মতি। দেরি সামান্য, নিরাপত্তা অনেক।'}
          - {label: '৩ মহাদেশে quorum', value: 130, display: '130ms', tone: warn, tip: 'আলো-গতির সীমা: দূরের region-এর সম্মতি আসতে সময় লাগেই। প্রতিটা লেখায় এই দেরি।'}
      - type: visual
        kind: table
        caption: 'কোথায় কেমন ঝোঁক (ডিফল্ট কনফিগে; বদলানো যায়)'
        headers: ['সিস্টেম', 'Partition-এ', 'নইলে (Else)']
        rows:
          - cells: ['Cassandra, DynamoDB (ডিফল্ট পড়া)', 'A', 'L (latency)']
            tip: 'দ্রুত উত্তর আর সবসময় চালু থাকাকেই আগে রাখে। পড়া সামান্য পুরনো হতে পারে। quorum পড়ায় বদলানো যায়।'
          - cells: ['Spanner, etcd, ZooKeeper', 'C', 'C (consistency)']
            tip: 'সবসময় সংখ্যাগরিষ্ঠের সম্মতি নেয়, তাই লেখায় কিছু বেশি সময় লাগে, কিন্তু উত্তর সঠিক।'
          - cells: ['PostgreSQL + sync replica', 'C', 'C']
            tip: 'sync replica ফেরত না দেওয়া পর্যন্ত commit হয় না। নিরাপদ, কিন্তু প্রতিটা লেখায় নেটওয়ার্কের দেরি যোগ হয়।'
          - cells: ['PostgreSQL + async replica থেকে পড়া', 'পড়ায় A', 'পড়ায় L']
            tip: 'দ্রুত পড়া, কিন্তু replication lag-এর ফলে পুরনো ডেটা দেখতে পারে।'
    aside:
      - type: terms
        items:
          - {term: 'Quorum', meaning: 'কপিগুলোর সংখ্যাগরিষ্ঠ অংশ, যেমন ৩-এর মধ্যে ২। সংখ্যাগরিষ্ঠ পেলেই লেখাটা ধরা হয়।'}
          - {term: 'AZ', meaning: 'Availability zone: একই শহরের আলাদা data center, নিজস্ব বিদ্যুৎ আর নেটওয়ার্কসহ।'}
          - {term: 'Sync replica', meaning: 'যে কপি প্রতিটা লেখার নিশ্চিতকরণ দিলে তবেই commit ফেরে। Async কপি পরে ধরে নেয়।'}
      - type: remember
        body: 'PACELC = If Partition then A or C; Else Latency or Consistency।'
      - type: refs
        items:
          - {to: 'scaling/data-movement', label: 'Replication lag ও read-your-writes'}
          - {to: 'resilience/disaster-recovery', label: 'Multi-region-এর দাম'}
    check:
      q: 'সব লেখা তিন মহাদেশের সংখ্যাগরিষ্ঠের সম্মতিতে করলে নেটওয়ার্ক ঠিক থাকলেও কেন ধীর?'
      a: 'দূরের region-এর সম্মতি আসতে আলোর গতির সীমার কারণে সময় লাগে। পুরো সময়টাই consistency কিনতে latency-র খরচ — PACELC-র "Else" অংশ।'

  - slug: choose-per-feature
    title: 'একটা অ্যাপে ফিচার ধরে CP বা AP বেছে নিন'
    kind: howto
    tldr: 'পুরো ডেটাবেস নয়, প্রতিটা ফিচারের জন্য জিজ্ঞেস করুন: ভুল ডেটা বেশি ক্ষতিকর, না উত্তর না পাওয়া? টাকা ও স্টকে CP, লাইক ও feed-এ AP।'
    keywords: ['CP vs AP', 'per feature', 'stale read', 'Retry-After', 'graceful degradation', 'ফিচার ধরে বাছাই']
    blocks:
      - type: visual
        kind: table
        caption: 'কোন ফিচারে কোন পথ, আর ব্যবহারকারী কী দেখে'
        headers: ['ফিচার', 'পথ', 'Partition-এ কী দেখে']
        rows:
          - cells: ['ব্যালেন্স তোলা', 'CP', '"পরে চেষ্টা করুন" (503)']
            tip: 'ভুল ব্যালেন্সে টাকা গেলে ফেরানো কঠিন। তাই নিশ্চিত না হলে না-করাই ভালো।'
          - cells: ['স্টক ও সিট বুকিং', 'CP', 'অপেক্ষা বা "এখন বুক করা যাচ্ছে না"']
            tip: 'এক সিট দুজনকে বেচার ক্ষতি, কিছুক্ষণ অপেক্ষার চেয়ে অনেক বেশি।'
          - cells: ['লাইক, view count', 'AP', 'সামান্য পুরনো সংখ্যা']
            tip: 'কয়েকটা লাইকের ভুলে কারো ক্ষতি নেই; সবসময় উত্তর দেওয়াই জরুরি।'
          - cells: ['Feed, প্রোডাক্ট তালিকা', 'AP', 'ক্যাশ থেকে একটু পুরনো পাতা']
            tip: 'বাসি তালিকাও না থাকার চেয়ে ভালো। কিছুক্ষণ পর নিজে ঠিক হয়ে যায়।'
          - cells: ['Shopping cart', 'AP', 'সবসময় যোগ করা যায়, পরে মেলানো হয়']
            tip: 'Amazon-এর Dynamo-র বিখ্যাত উদাহরণ: cart-এ যোগ করা কখনো ব্যর্থ হবে না, দুই কপি পরে মেলানো হয়।'
      - type: code
        lang: php
        file: 'src/Controller/WithdrawController.php (CP)'
        variant: good
        code: |
          #[Route('/accounts/{id}/withdraw', methods: ['POST'])]
          public function withdraw(
              string $id,
              #[MapRequestPayload] WithdrawRequest $req,
          ): JsonResponse {
              try {
                  // primary-তে, সংখ্যাগরিষ্ঠ সহ; key থাকায় retry নিরাপদ
                  $this->ledger->withdraw($id, $req->amountCents, $req->idempotencyKey);
              } catch (ConnectionException) {
                  // CP: নিশ্চিত না হলে টাকা দেব না
                  return $this->json(['error' => 'try_later'], 503, ['Retry-After' => '5']);
              }

              return $this->json(['ok' => true]);
          }
        marks:
          - {line: 8, tip: 'টাকার লেখা সবসময় primary-তে, কোনো পুরনো কপিতে নয়। idempotency key থাকায় উত্তর হারিয়ে গিয়ে retry হলেও দুইবার টাকা যায় না।'}
          - {line: 11, tip: 'নিশ্চিত হতে না পারলে ৫০৩ আর Retry-After। ব্যবহারকারীকে বলা হয় পরে চেষ্টা করতে, ভুল হিসাব করা হয় না।'}
      - type: code
        lang: php
        file: 'src/Controller/LikesController.php (AP)'
        variant: good
        code: |
          #[Route('/posts/{id}/likes', methods: ['GET'])]
          public function likes(int $id): JsonResponse
          {
              $count = $this->cache->get('likes:'.$id, function (ItemInterface $item) use ($id): int {
                  $item->expiresAfter(30);              // ৩০ সেকেন্ড বাসি হলেও চলবে
                  return $this->likes->countFromReplica($id);
              });

              return $this->json(['likes' => $count])->setPublic()->setMaxAge(30);
          }
        marks:
          - {line: 5, tip: 'ইচ্ছাকৃতভাবে ৩০ সেকেন্ডের পুরনো সংখ্যা। বিনিময়ে কাছের replica primary-র সাথে লাইন কাটা থাকলেও উত্তর দিয়ে যায়।'}
          - {line: 9, tip: 'ব্রাউজার আর CDN-ও ৩০ সেকেন্ড রাখতে পারে, তাই ডেটাবেস প্রায় ছোঁয়াই লাগে না।'}
    aside:
      - type: when
        use:
          - 'CP: ভুল হলে টাকা, স্টক বা আইনি ক্ষতি'
          - 'AP: পুরনো ডেটায় কারো ক্ষতি নেই, উত্তর না পাওয়াই বেশি খারাপ'
        avoid:
          - 'AP-তে ব্যালেন্স বা সিট'
          - 'CP-তে feed, লাইক'
      - type: pitfalls
        items:
          - 'CP-র দাম availability: ভাগ হলে ব্যবহারকারী error দেখে। পরিষ্কার বার্তা দেখান, আর idempotency key দিয়ে retry নিরাপদ করুন।'
      - type: terms
        items:
          - {term: '503', meaning: 'HTTP status: "সার্ভিস এখন পাওয়া যাচ্ছে না, পরে চেষ্টা করুন"।'}
          - {term: 'Retry-After', meaning: 'response header, যা বলে client কত সেকেন্ড পরে আবার চেষ্টা করবে।'}
          - {term: 'Idempotency key', meaning: 'request-এর সাথে পাঠানো অনন্য id, যাতে একই request দ্বিতীয়বার এলে চিনে নিয়ে দুইবার করা না হয়।'}
      - type: refs
        items:
          - {to: 'resilience/graceful-degradation', label: 'Dependency ভাঙলে কী দেখাবে'}
    check:
      q: 'ফ্লাইটের সিট বুকিং আর "এই পোস্টে কতজন লাইক দিয়েছে" — কোনটা CP, কোনটা AP, কেন?'
      a: 'সিট বুকিং CP: এক সিট দুজনকে বেচলে ক্ষতি বড়, তাই নিশ্চিত না হলে অপেক্ষা। লাইক AP: সামান্য পুরনো সংখ্যায় কারো ক্ষতি নেই, সবসময় উত্তর পাওয়াই জরুরি।'

  - slug: ap-conflicts
    title: 'AP বাছলে পরে মেলানোর দায়'
    kind: pitfall
    tldr: 'AP-তে দুই পাশে একই ডেটা আলাদাভাবে বদলায়। "শেষ লেখা জেতে" ঘড়ির ওপর নির্ভর করে একটা বদল চুপচাপ হারায়। বদলগুলো মেলানোর নিয়ম আগে থেকে বানাতে হয়।'
    keywords: ['last write wins', 'LWW', 'conflict resolution', 'merge', 'CRDT', 'eventual consistency', 'clock skew']
    blocks:
      - type: visual
        kind: compare
        caption: 'দুই পাশে cart বদলালে দুই রকম মেলানো'
        columns:
          - title: 'Last write wins'
            tone: bad
            icon: cross
            tip: 'শেষ সময়ের ছাপওয়ালা লেখাটাই রাখে, বাকিটা ফেলে দেয়। সহজ, কিন্তু চুপচাপ ডেটা হারায়।'
            items:
              - 'ঢাকায় cart-এ জুতা যোগ'
              - 'সিলেটে একই সময়ে ঘড়ি যোগ'
              - 'যার ঘড়ি বেশি এগিয়ে, সেটাই জেতে'
              - 'অন্যটা কেউ না জেনেই হারায়'
          - title: 'মেলানো (merge)'
            tone: good
            icon: check
            tip: 'দুই পাশের বদলই ধরে একটা ফল বানায়। ডেটা হারায় না, তবে ফিচার অনুযায়ী নিয়ম বানাতে হয়।'
            items:
              - 'জুতা আর ঘড়ি দুটোই থাকে'
              - 'একই পণ্য দুই পাশে থাকলে বেশি পরিমাণটা'
              - 'নিয়ম ফিচার অনুযায়ী ঠিক করা'
              - 'জটিল হলে CRDT ব্যবহার'
      - type: code
        lang: sql
        file: 'যা সহজ কিন্তু বিপজ্জনক'
        variant: bad
        code: |
          UPDATE profiles
             SET bio = :bio, updated_at = :client_ts
           WHERE user_id = :id AND updated_at < :client_ts;
        marks:
          - {line: 3, tip: 'client_ts ব্যবহারকারীর ফোনের ঘড়ি। ঘড়ি কয়েক মিনিট এগিয়ে থাকলে সে চিরকাল জিতে যায়, আর অন্যের নতুন বদল ঢুকতেই পারে না।'}
      - type: code
        lang: php
        file: 'src/Cart/CartMerger.php'
        variant: good
        code: |
          public function merge(Cart $left, Cart $right): Cart
          {
              $qty = [];
              foreach ([...$left->lines(), ...$right->lines()] as $line) {
                  $qty[$line->sku] = max($qty[$line->sku] ?? 0, $line->qty);
              }

              // tombstone: যেকোনো পাশে মোছা sku মোছাই থাকে
              foreach ([...$left->removedSkus(), ...$right->removedSkus()] as $sku) {
                  unset($qty[$sku]);
              }

              return Cart::fromQuantities($qty);        // ভুল করে কিছু হারায় না
          }
        marks:
          - {line: 5, tip: 'দুই পাশের একই sku-র মধ্যে বেশি পরিমাণ রাখুন। ফিচার অনুযায়ী নিয়ম বদলায়।'}
          - {line: 10, tip: 'tombstone না থাকলে মোছা জিনিস ফিরে আসে, যেমন Dynamo-র cart-এ আসত। দাম: মোছাটাই জেতে, তাই আবার যোগ করা জিনিসের নতুন line id লাগে।'}
      - type: quote
        body: 'AP মানে "পরে মিলিয়ে নেব"। মেলানোর নিয়ম না থাকলে সেটা AP নয়, চুপচাপ ডেটা হারানো।'
    aside:
      - type: pitfalls
        items:
          - 'সার্ভারের ঘড়িও নির্ভুল নয়; LWW-তে ঘড়ি ব্যবহার করলে সামান্য skew-এও বদল হারায়।'
          - 'AP বেছে ফেলার পর বাইরে থেকে "ফেরত দেওয়া" বা চিঠি-ইমেইলের মতো কাজ জুড়লে সেগুলোও দুইবার হতে পারে — idempotency রাখুন।'
      - type: terms
        items:
          - {term: 'LWW', meaning: 'Last write wins: দুই কপি না মিললে যেটার timestamp সবচেয়ে নতুন, সেটা রাখা।'}
          - {term: 'CRDT', meaning: 'এমন ডেটা ধরন, যার কপিগুলো আলাদাভাবে বদলালেও মেলালে সবসময় একই ফল আসে।'}
          - {term: 'Tombstone', meaning: '"এটা মোছা হয়েছে" চিহ্ন, যাতে merge-এ জিনিসটা ফিরে না আসে।'}
      - type: refs
        items:
          - {to: 'time/clocks-lie', label: 'কেন ঘড়ি দিয়ে ক্রম ঠিক করা যায় না'}
          - {to: 'time/ordering-events', label: 'ঘটনার ক্রম ঠিক রাখা'}
    check:
      q: 'AP সিস্টেমে "শেষ লেখা জেতে" নিয়ম কখন বিপজ্জনক, আর বিকল্প কী?'
      a: 'দুই পাশে একই সময়ে বদল হলে একটা চুপচাপ হারায়, আর ঘড়ির skew-এ ভুল পাশ জেতে। বিকল্প: ফিচার অনুযায়ী merge নিয়ম বা CRDT।'

flashcards:
  - q: 'CAP-এর C, A, P কী?'
    a: 'C: প্রতিটা পড়া সর্বশেষ লেখা দেখে। A: জীবিত নোড প্রতিটা request-এর উত্তর দেয়। P: নোডদের মাঝের যোগাযোগ কাটা পড়লেও সিস্টেম চলে।'
    more: |
      এখানে C হলো linearizable consistency, ACID-এর C (নিয়ম মানা) নয়। Partition এলে C আর A একসাথে রাখা যায় না, একটা ছাড়তে হয়। Partition না থাকলে দুটোই থাকে।
    ref: cap-in-practice
  - q: 'Partition আসলে কী?'
    a: 'নোডরা একে অপরের কাছে পৌঁছাতে পারছে না। তার কাটা, switch বিকল, বা এত ধীর যে timeout হয়ে যায়, সবই partition।'
    more: |
      ৩০ সেকেন্ডের GC pause-এ একটা সার্ভার অন্যদের চোখে মৃত। ধীর আর মৃত আলাদা করা যায় না, তাই এটাকেও partition ধরে ডিজাইন করতে হয়। বিরল হলেও বড় সিস্টেমে এটা ঘটেই।
    ref: cap-in-practice
  - q: 'CP আর AP-র আচরণ কেমন, উদাহরণসহ?'
    a: 'CP: partition-এ ঠিক উত্তর না দিতে পারলে error বা অপেক্ষা (ব্যালেন্স, স্টক)। AP: সবসময় উত্তর, কিছু পুরনো হতে পারে (লাইক, feed)।'
    more: |
      CP-তে সংখ্যাগরিষ্ঠ পাশ চালু থাকে, ছোট পাশ থামে। AP-তে দুই পাশই লেখা নেয়, লাইন ঠিক হলে মিলিয়ে নেয়। বাছাই করা হয় ফিচার ধরে, পুরো ডেটাবেস ধরে নয়। বিস্তারিত: [[data/consistency-models|consistency model]]।
    ref: cap-in-practice
  - q: 'PACELC কী বলে?'
    a: 'Partition হলে Availability না Consistency; নইলে (Else) Latency না Consistency।'
    more: |
      CAP শুধু ভাগ হওয়ার সময়ের কথা বলে। কিন্তু বেশির ভাগ সময় নেটওয়ার্ক ঠিক থাকে, আর তখনও সবার সম্মতি নিয়ে লিখলে latency বাড়ে। PACELC এই দ্বিতীয় বাছাইটাও নাম দেয়।
    ref: pacelc-latency
  - q: 'নেটওয়ার্ক ঠিক থাকলেও multi-region quorum লেখা ধীর কেন?'
    a: 'দূরের region-এর সম্মতি আসতে আলোর গতির কারণে সময় লাগে। উত্তর সঠিক রাখার দাম দেওয়া হয় latency দিয়ে।'
    more: |
      একই শহরের তিন AZ-এ quorum-এ ৬ms-এর মতো, কিন্তু তিন মহাদেশে ১০০ms-এর বেশি লাগতে পারে। তাই ব্যবহারকারী যে region-এ, সেখানেই তার লেখা রাখার কৌশল নেওয়া হয়।
    ref: pacelc-latency
  - q: 'কোন ফিচারে CP, কোনটায় AP বাছবেন?'
    a: 'ভুল ডেটায় টাকা, স্টক বা আইনি ক্ষতি হলে CP। সামান্য পুরনো ডেটায় ক্ষতি নেই, উত্তর না পাওয়া বেশি খারাপ হলে AP।'
    more: |
      একই অ্যাপে ব্যালেন্স তোলা CP (নিশ্চিত না হলে ৫০৩ আর Retry-After), আর লাইক-সংখ্যা AP (৩০ সেকেন্ড বাসি cache)। প্রশ্ন একটাই: "ভুল উত্তর বেশি ক্ষতিকর, নাকি কোনো উত্তর না পাওয়া?"
    ref: choose-per-feature
  - q: 'CP withdraw endpoint-এ কেন idempotency key লাগে?'
    a: 'connection error হলে বোঝা যায় না টাকা তোলা হয়েছে কি না। client retry করে, আর key না থাকলে দুইবার টাকা যেতে পারে।'
    more: |
      Retry-After-সহ ৫০৩ client-কে আবার চেষ্টা করতে বলে, আর ঠিক তখনই দুইবার টাকা যাওয়ার ফাঁক খুলে যায়। key থাকলে ledger repeat-টাকে চিনে আবার টাকা না দিয়ে প্রথম ফলটাই ফেরত দেয়।
    ref: choose-per-feature
  - q: 'AP-তে "শেষ লেখা জেতে" (LWW) কেন বিপজ্জনক?'
    a: 'দুই পাশে একই সময়ে বদল হলে একটা চুপচাপ হারায়, আর ঘড়ি এগিয়ে থাকা পাশই জেতে — ঘড়ি নির্ভুল নয়।'
    more: |
      সমাধান ফিচার অনুযায়ী merge নিয়ম (যেমন cart-এ দুই পাশের জিনিস মিলিয়ে নেওয়া) বা CRDT-র মতো বদলগুলো স্বাভাবিকভাবে মেলে এমন ডেটা কাঠামো। AP মানে "পরে মিলিয়ে নেব", তাই নিয়মটা আগে থেকে ঠিক রাখতে হয়।
    ref: ap-conflicts
  - q: 'Merge নিয়মে tombstone কী, আর কেন লাগে?'
    a: 'জিনিস মোছা হয়েছে, এই চিহ্ন। না থাকলে যে পাশে জিনিসটা আছে তাকে merge করলে মোছা জিনিস ফিরে আসে।'
    more: |
      শুধু প্রতি পণ্যের বেশি পরিমাণ রাখলে merge কেবল যোগই করতে পারে। tombstone মোছাকে merge-এর পরেও টিকিয়ে রাখে। দাম: মোছাটাই জেতে, তাই আবার যোগ করা পণ্যের নতুন line id লাগে।
    ref: ap-conflicts

quiz:
  - q: 'নিচের কোন ঘটনাগুলো "partition" হিসেবে ধরা হয়?'
    hint: 'প্রশ্নটা হলো: নোডরা কি একে অপরের সাথে কথা বলতে পারছে?'
    options:
      - text: 'দুই ডেটা সেন্টারের মধ্যে ISP-র লিংক কেটে গেছে'
        correct: true
        why: 'দুই পাশ জীবিত, কিন্তু একে অপরের কাছে পৌঁছাতে পারছে না — এটাই ক্লাসিক partition।'
      - text: 'leader ৪০ সেকেন্ডের GC pause-এ আটকে, follower-রা timeout করে ফেলেছে'
        correct: true
        why: 'follower-দের চোখে leader হারিয়ে গেছে। ধীর আর মৃত আলাদা করা যায় না, তাই এটাও partition-এর মতো সামলাতে হয়।'
      - text: 'একটা সার্ভারের ডিস্ক খারাপ হয়ে সার্ভার বন্ধ'
        correct: false
        why: 'এটা নোডের নিজের ব্যর্থতা (crash)। নেটওয়ার্ক ভাগ হয়নি, বাকিরা একে অপরের সাথে কথা বলতে পারছে।'
      - text: 'ডেভেলপার ভুল SQL চালিয়েছে'
        correct: false
        why: 'এটা অ্যাপের ভুল, নেটওয়ার্ক বা নোডের সমস্যা নয়।'
    ref: cap-in-practice
  - q: 'সিনেমার টিকিট অ্যাপে অর্ডার সার্ভার আর সিট-ডেটাবেসের মধ্যে নেটওয়ার্ক সমস্যা হলো। সিটের অবস্থা নিশ্চিত করা যাচ্ছে না। কী করা উচিত?'
    hint: 'এক সিট দুজনকে বেচলে কী হবে, আর কিছুক্ষণ অপেক্ষা করলে কী হবে?'
    options:
      - text: '৫০৩ ও Retry-After দিয়ে ব্যবহারকারীকে পরে চেষ্টা করতে বলা (CP পথ)'
        correct: true
        why: 'এক সিট দুজনকে বেচলে ক্ষতি অনেক বড়, তাই নিশ্চিত না হয়ে বিক্রি নয়।'
      - text: 'পুরনো cache দেখে সিট "খালি" ধরে বিক্রি করে দেওয়া'
        correct: false
        why: 'এটা AP পথ। পুরনো তথ্যে দুজনকে একই সিট বেচা হতে পারে, যা এই ফিচারে মেনে নেওয়া যায় না।'
      - text: 'সব অর্ডার নীরবে চালিয়ে যাওয়া, পরে মেলানো'
        correct: false
        why: 'পরে মেলানোর সময় একজনকে "দুঃখিত, সিট নেই" বলতে হয় — টাকা কেটে নেওয়ার পরে। ক্ষতি বেশি।'
      - text: 'অ্যাপ বন্ধ করে দেওয়া'
        correct: false
        why: 'পুরো অ্যাপ বন্ধ অকারণ; শুধু বুকিং আটকান, সিনেমার তালিকা ইত্যাদি চলতে পারে।'
    ref: choose-per-feature
  - q: 'নিচের কোডে CP ফিচারে কী ভুল?'
    lang: php
    code: |
      $balance = $this->cache->get('balance:'.$id, function (ItemInterface $i) use ($id) {
          $i->expiresAfter(300);
          return $this->replica->fetchOne('SELECT balance FROM accounts WHERE id = ?', [$id]);
      });

      if ($balance >= $amount) {
          $this->ledger->withdraw($id, $amount);
      }
    hint: 'ব্যালেন্স-এর মতো সংখ্যা ৫ মিনিট আগের হলে কী হতে পারে?'
    options:
      - text: '৫ মিনিটের পুরনো, replica-র cache করা ব্যালেন্স দেখে টাকা তোলার সিদ্ধান্ত নেওয়া হচ্ছে — এটা primary থেকে পড়া উচিত'
        correct: true
        why: 'ব্যালেন্স CP ফিচার। পুরনো সংখ্যায় ইতিমধ্যে তোলা টাকা দেখা যায় না, ফলে overdraft হতে পারে।'
      - text: 'fetchOne-এর বদলে fetchAllAssociative ব্যবহার করা উচিত'
        correct: false
        why: 'পড়ার পদ্ধতির সমস্যা নয়; সমস্যা কোথা থেকে আর কতটা পুরনো ডেটা পড়া হচ্ছে।'
      - text: 'expiresAfter(300) আরও বাড়ানো উচিত, cache-এর hit বাড়বে'
        correct: false
        why: 'আরও পুরনো ডেটা মানে ঝুঁকি আরও বেশি।'
      - text: 'কোনো ভুল নেই, cache থাকাই ভালো'
        correct: false
        why: 'cache লাইক-সংখ্যার মতো AP ফিচারে চমৎকার, টাকার সিদ্ধান্তে নয়।'
    ref: choose-per-feature
  - q: 'টাকা তোলার call connection error-এর পর ৫০৩ ফেরায়। অ্যাপ retry করে, পরে অ্যাকাউন্টে দুবার টাকা তোলা দেখা যায়। কী বাদ পড়েছিল?'
    hint: 'connection ভাঙার সময় প্রথম তোলাটা হয়েছিল কি না?'
    options:
      - text: 'idempotency key, যাতে ledger retry চিনে প্রথম ফলটাই ফেরত দেয়'
        correct: true
        why: 'উত্তর হারানো মানে লেখা ব্যর্থ হওয়া নয়। key থাকলে repeat চেনা যায়, আবার প্রয়োগ হয় না।'
      - text: 'আরও বড় Retry-After মান'
        correct: false
        why: 'বেশিক্ষণ অপেক্ষা ledger-কে জানায় না যে retry-টা একই request। দেরিতে retry হলেও দুবার টাকা যেতে পারে।'
      - text: 'retry-র আগে replica থেকে ব্যালেন্স পড়া'
        correct: false
        why: 'replica-য় প্রথম তোলাটা হয়তো এখনো পৌঁছায়নি, তাই সে "টাকা যায়নি" বলতে পারে, যখন গেছে।'
      - text: 'কখনো retry না করা, শুধু error দেখানো'
        correct: false
        why: 'ব্যবহারকারী আন্দাজে থাকবে টাকা গেল কি না। নিরাপদ retry-ই ভালো উত্তর।'
    ref: choose-per-feature
  - q: 'নেটওয়ার্ক সম্পূর্ণ ঠিক আছে, কোনো partition নেই। তবু ডেটাবেস ঠিক করে নিয়েছে প্রতিটা লেখা তিন region-এর সম্মতিতে হবে, আর লেখা ধীর হয়ে গেছে। এটা PACELC-র কোন অংশ?'
    hint: 'PACELC-তে "Else" অংশ কী বাছাইয়ের কথা বলে?'
    options:
      - text: 'Else-র Consistency: latency দিয়ে সঠিকতা কেনা'
        correct: true
        why: 'partition নেই, তবু সবার সম্মতি নেওয়ার দাম latency। এটাই EC।'
      - text: 'Partition-এর Availability বাছাই'
        correct: false
        why: 'এখানে কোনো partition নেই, তাই P-অংশ খাটছে না।'
      - text: 'এটা CAP-এর ব্যর্থতা, PACELC-র সাথে সম্পর্কহীন'
        correct: false
        why: 'CAP শুধু partition-এর সময়ের কথা বলে; PACELC ঠিক এই "লাইন ঠিক থাকা" অবস্থার বাছাইটা নাম দেয়।'
      - text: 'ডেটাবেসের bug'
        correct: false
        why: 'এটা ডিজাইনের স্বাভাবিক দাম, bug নয়।'
    ref: pacelc-latency
  - q: 'AP ধরনের সিস্টেমে দুই পাশে একই প্রোফাইল-bio আলাদা বদলানো হলো, আর সিস্টেম "শেষ লেখা জেতে" (ফোনের ঘড়ির সময়) নিয়ম চালায়। কোন সমস্যাগুলো হতে পারে?'
    hint: 'যার ফোনের ঘড়ি কয়েক মিনিট এগিয়ে, তার কী হয়?'
    options:
      - text: 'যার ঘড়ি এগিয়ে, তার বদল ভবিষ্যতেও জিততে থাকে আর অন্যের নতুন বদল চুপচাপ বাদ পড়ে'
        correct: true
        why: 'সময়ের ছাপ ঘড়ির ওপর নির্ভর করে। ঘড়ির skew ভুল পাশকে জেতায়।'
      - text: 'দুই পাশের একটা বদল কেউ না জেনেই হারিয়ে যায়'
        correct: true
        why: 'LWW মেলায় না, একটা রাখে আর বাকিটা ফেলে দেয়।'
      - text: 'লাইন ঠিক হলে দুই বদলই নিজে থেকে মিশে যায়'
        correct: false
        why: 'LWW মেশায় না। মেশাতে চাইলে merge নিয়ম বা CRDT লাগে।'
      - text: 'সিস্টেম তখন CP হয়ে যায়'
        correct: false
        why: 'সবাই উত্তর দিচ্ছে, তাই এটা AP-ই; শুধু মেলানোর নিয়মটা খারাপ।'
    ref: ap-conflicts
