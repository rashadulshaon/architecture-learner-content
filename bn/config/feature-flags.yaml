slides:
  - slug: bad-release-night
    title: 'রাত ১১টায় ভুল release, ফেরানোর সুইচ নেই'
    kind: story
    tldr: 'কোড deploy করা আর ফিচার ব্যবহারকারীর সামনে খোলা আলাদা কাজ; feature flag এই দুটোকে আলাদা করে, তাই ভুল হলে deploy ছাড়াই ফিচার বন্ধ করা যায়।'
    keywords: ['feature flag', 'feature toggle', 'rollback', 'deploy vs release', 'ফিচার ফ্ল্যাগ', 'kill switch']
    blocks:
      - type: metaphor
        icon: switch
        title: 'বাড়ির সুইচ বোর্ড'
        body: |
          বাড়িতে নতুন একটা ঘরের লাইন টানা হলো। শর্ট সার্কিট হলে পুরো এলাকার লাইন কাটতে হয় না, শুধু ওই ঘরের সুইচটা off করলেই চলে। তার টানা হলো deploy, আর সুইচ অন করা হলো release। দুটো আলাদা হলে ভুল হলে তুমি তার খোলো না, শুধু সুইচ off করো।
      - type: text
        body: |
          রহিমের টিম রাত ১১টায় নতুন checkout deploy করল, আর তাতে একটা bug। পুরনো কোডে ফেরাতে গেলে rollback deploy লাগবে, যা ২০ মিনিটের কাজ আর নিজেই ঝুঁকিপূর্ণ। এই ২০ মিনিটে ক্রেতারা অর্ডার দিতে পারছে না।
      - type: visual
        kind: compare
        caption: 'ভুল release-এর পর ঠিক করার দুই পথ'
        columns:
          - title: 'ফ্ল্যাগ ছাড়া'
            tone: bad
            icon: cross
            tip: 'ফিচার আর কোড এক জিনিস, তাই ফিচার ফেরাতে কোডই ফেরাতে হয়।'
            items:
              - 'rollback deploy: ২০ মিনিট'
              - 'rollback-এও নতুন ভুলের ঝুঁকি'
              - 'অন্য টিমের ভালো কোডও ফিরে যায়'
          - title: 'ফ্ল্যাগ সহ'
            tone: good
            icon: check
            tip: 'কোড আগেই deploy হয়ে বসে আছে, শুধু সুইচ বন্ধ। কোনো deploy লাগে না।'
            items:
              - 'সুইচ off: ৫ সেকেন্ড'
              - 'কোড বদলায় না, তাই নতুন ঝুঁকিও নেই'
              - 'শুধু ওই ফিচার বন্ধ, বাকি সব চালু'
      - type: quote
        body: 'Deploy মানে কোড সার্ভারে রাখা। Release মানে ব্যবহারকারীর সামনে খোলা। দুটো আলাদা সিদ্ধান্ত।'
    aside:
      - type: problem
        body: 'ঝুঁকিপূর্ণ বদল ধীরে খোলা আর ভুল হলে এক সেকেন্ডে বন্ধ করা — কোড ফেরানো ছাড়াই।'
      - type: terms
        items:
          - {term: 'Feature flag', meaning: 'কোডে একটা শর্ত, যার চালু বা বন্ধ থাকা কনফিগ বা ডেটা থেকে ঠিক হয়, কোড বদলে নয়।'}
          - {term: 'Rollback', meaning: 'নতুন সংস্করণ ফিরিয়ে আগেরটা চালু করা।'}
    check:
      q: 'Feature flag থাকলে ভুল checkout ফেরাতে কেন deploy লাগে না?'
      a: 'কারণ নতুন কোড আগেই সার্ভারে আছে, শুধু flag দিয়ে বন্ধ রাখা। ভুল হলে flag off করলেই পুরনো পথ চলে, কোড বদলাতে হয় না।'

  - slug: four-kinds-of-flags
    title: 'চার ধরনের flag: কাজ আর আয়ু আলাদা'
    kind: concept
    tldr: 'Flag চার ধরনের: release (ধীরে ফিচার খোলা), ops/kill switch (জরুরি বন্ধ), experiment (A/B), permission (কে পাবে)। ধরন ঠিক হলে আয়ু আর মালিক ঠিক হয়।'
    keywords: ['release flag', 'ops flag', 'kill switch', 'experiment flag', 'permission flag', 'A/B test', 'flag types']
    blocks:
      - type: text
        body: |
          সব সুইচ এক নয়। বাড়ির মেইন সুইচ বছরের পর বছর থাকে, কিন্তু নতুন ঘরের অস্থায়ী সুইচ কাজ শেষে খুলে ফেলা হয়। Flag-ও তাই। আগে ঠিক করো এটা কোন ধরনের, কারণ ধরনই বলে দেয় কত দিন বাঁচবে আর কে বদলাবে।
      - type: visual
        kind: table
        caption: 'চার ধরনের feature flag'
        headers: ['ধরন', 'কী কাজে', 'আয়ু', 'কে বদলায়']
        rows:
          - cells: ['Release', 'নতুন ফিচার ধীরে খোলা', 'কয়েক দিন-সপ্তাহ', 'ডেভেলপার']
            tip: 'কাজ শেষ হলেই মুছে ফেলার flag। এটাই সবচেয়ে বেশি জমে।'
          - cells: ['Ops / kill switch', 'জরুরিতে ফিচার বন্ধ', 'বছরের পর বছর', 'অন-কল, ops']
            tip: 'পেমেন্ট গেটওয়ে ধীর হলে সেই অংশ বন্ধ করে বাকিটা চালু রাখার সুইচ।'
          - cells: ['Experiment', 'A/B পরীক্ষা', 'পরীক্ষা শেষ পর্যন্ত', 'প্রোডাক্ট টিম']
            tip: 'ব্যবহারকারীরা দুই দলে ভাগ হয়; ফল দেখে একটা বেছে নিয়ে flag সরানো হয়।'
          - cells: ['Permission', 'কে পাবে (প্ল্যান, দল)', 'দীর্ঘ, কখনো স্থায়ী', 'প্রোডাক্ট, সাপোর্ট']
            tip: 'যেমন "প্রিমিয়াম গ্রাহকদের রিপোর্ট"। এটা আসলে ব্যবসার নিয়ম, অস্থায়ী নয়।'
      - type: points
        title: 'Kill switch-এর তিন শর্ত'
        style: check
        items:
          - 'deploy ছাড়া বদলানো যায় (ডেটাবেস বা কনফিগ সার্ভিস থেকে)।'
          - 'অন-কল ইঞ্জিনিয়ার এক মিনিটে খুঁজে পায় আর বদলাতে পারে।'
          - 'বন্ধ থাকলে অ্যাপ ভেঙে পড়ে না, বিকল্প পথে চলে (যেমন "পরে চেষ্টা করুন" বার্তা)।'
    aside:
      - type: tips
        items:
          - 'প্রতিটা flag-এ লেখো: ধরন, মালিক, আর কখন সরানো হবে। permission ও kill switch ছাড়া সবগুলোর মেয়াদ থাকা দরকার।'
          - 'Permission flag আসলে অনুমতির নিয়ম; সেটা security-র আলোচনায় authorization-এর অংশ।'
      - type: refs
        items:
          - {to: 'security/authorization-models', label: 'Permission আর authorization'}
          - {to: 'resilience/graceful-degradation', label: 'Kill switch আর graceful degradation'}
    check:
      q: 'পেমেন্ট গেটওয়ে হঠাৎ ধীর হলে অন-কলকে এক মিনিটে সেই অংশ বন্ধ করার জন্য কোন ধরনের flag দরকার?'
      a: 'Ops flag বা kill switch। এটা deploy ছাড়া বদলানো যায় আর বন্ধ থাকলে অ্যাপ বিকল্প পথে চলে।'

  - slug: flag-service-symfony
    title: 'Symfony-তে সাধারণ flag service ও শতাংশ rollout'
    kind: howto
    tldr: 'Flag-এর অবস্থা ডেটাবেসে রাখো, ছোট TTL দিয়ে cache করো; শতাংশ rollout-এ ব্যবহারকারীর আইডি hash করে ০ থেকে ৯৯ বের করো, যাতে একই ব্যবহারকারী সবসময় একই ফল পায়।'
    keywords: ['FeatureFlags service', 'percentage rollout', 'gradual rollout', 'crc32', 'sticky bucketing', 'Symfony']
    blocks:
      - type: text
        body: |
          ফিচার একবারে সবাইকে নয়, ধাপে ধাপে খোলো। ১% দিয়ে শুরু করে সব ঠিক থাকলে বাড়াও। মূল কৌশল: ব্যবহারকারীর আইডি আর flag-এর নাম মিলিয়ে একটা hash বের করে ০–৯৯ সংখ্যায় নামাও। সংখ্যাটা শতাংশের চেয়ে ছোট হলে ফিচার চালু। একই আইডি সবসময় একই সংখ্যা পায়, তাই ব্যবহারকারী একবার চালু পেলে চালুই থাকে।
      - type: visual
        kind: steps
        caption: 'একটা নতুন checkout-এর ধাপে ধাপে rollout'
        steps:
          - {title: '১. শুধু টিম', body: 'allow list-এ নিজেদের আইডি; শতাংশ ০।', tip: 'আসল ব্যবহারকারীর আগে নিজেরা প্রোডাকশনে ব্যবহার করে দেখো।'}
          - {title: '২. ১% ব্যবহারকারী', body: 'error rate আর অর্ডার সংখ্যা মেলাও।', tip: 'খারাপ হলে মাত্র ১% ক্ষতিগ্রস্ত। flag off করলেই ফিরে।'}
          - {title: '৩. ২৫%', body: 'এক দিন চালিয়ে দেখো, লোড আর error ঠিক আছে কি না।', tip: 'পূর্ণ লোডে ধরা পড়ে এমন সমস্যা এখানে বেরিয়ে আসে।'}
          - {title: '৪. ১০০%', body: 'সবার জন্য চালু।', tip: 'এখনো flag মোছা হয়নি; কয়েক দিন চোখ রাখো।'}
          - {title: '৫. flag আর পুরনো কোড মোছো', body: 'শর্ত সরিয়ে শুধু নতুন পথ রাখো।', tone: accent, tip: 'এই ধাপ বাদ পড়লে flag ঋণ জমে। পরের স্লাইডে আরও।'}
      - type: code
        lang: php
        file: 'src/Flag/FeatureFlags.php'
        variant: good
        code: |
          final readonly class FeatureFlags
          {
              public function __construct(
                  private FlagRepository $flags,
                  private CacheInterface $cache,
              ) {
              }

              public function isOn(string $name, ?User $user = null): bool
              {
                  $flag = $this->cache->get("flag.$name", function (ItemInterface $item) use ($name) {
                      $item->expiresAfter(30);     // ৩০ সেকেন্ডে সুইচ বদল সবখানে পৌঁছায়

                      return $this->flags->snapshot($name);   // না থাকলে ['enabled' => false, ...]
                  });

                  if (!$flag['enabled'] || null === $user) {
                      return $flag['enabled'] && 100 === $flag['percent'];
                  }

                  return \in_array($user->getId(), $flag['allow'], true)
                      || crc32($name.':'.$user->getId()) % 100 < $flag['percent'];
              }
          }
        marks:
          - {line: 12, tip: 'ছোট TTL: ডেটাবেসে flag বদলালে সর্বোচ্চ ৩০ সেকেন্ডে সব সার্ভার জেনে যায়।'}
          - {line: 14, tip: 'flag-ই নেই বা ডেটাবেস থেকে আনা গেল না? নিরাপদ ডিফল্ট হলো false: নতুন ফিচার বন্ধ।'}
          - {line: 22, tip: 'flag-এর নামও hash-এ ঢোকে, তাই প্রতিটা flag-এর জন্য আলাদা ১% ব্যবহারকারী বাছাই হয়।'}
    aside:
      - type: tips
        items:
          - 'একটা ব্যবহারকারীকে প্রথমে চালু, পরে বন্ধ দেখানো এড়াও; তাই hash-ই ব্যবহার করো, random() নয়।'
          - 'লগে লেখো কোন request-এ কোন flag কী ছিল; ভুল খুঁজতে তা অমূল্য।'
      - type: pitfalls
        items:
          - 'flag-এর অবস্থা কনফিগ ফাইলে রাখলে বদলাতে deploy লাগে — সেটা তো আসল উদ্দেশ্যই মারে।'
    check:
      q: 'শতাংশ rollout-এ random() না লাগিয়ে আইডির hash কেন ব্যবহার করা হয়?'
      a: 'random() প্রতি request-এ আলাদা ফল দেয়, তাই একই ব্যবহারকারী একবার নতুন, একবার পুরনো পথ দেখে। hash একই আইডিকে সবসময় একই ফল দেয়।'

  - slug: flag-in-vue
    title: 'Vue-তে flag: সার্ভার ঠিক করে, ক্লায়েন্ট দেখায়'
    kind: howto
    tldr: 'Flag-এর সিদ্ধান্ত সার্ভারে নাও, ব্যবহারকারীর জন্য মূল্যায়ন করা ফল API থেকে Vue-তে পাঠাও; Vue শুধু দেখানো বা লুকানোর কাজ করে, সুরক্ষা সার্ভারেই।'
    keywords: ['Vue feature flag', 'Pinia', 'flags endpoint', 'client side flag', 'server enforcement', 'UI toggle']
    blocks:
      - type: text
        body: |
          Vue অ্যাপ নিজে flag-এর সিদ্ধান্ত নেয় না। সার্ভার ব্যবহারকারীর জন্য প্রতিটা flag মূল্যায়ন করে একটা ছোট JSON দেয়। Vue সেটা Pinia store-এ রেখে `v-if`-এ ব্যবহার করে। তবে মনে রাখো, ব্রাউজারে সব কিছু দেখা যায়: UI লুকালেই কিছু নিরাপদ হয় না। নতুন checkout-এর API-ও সার্ভারে একই flag দিয়ে আটকাতে হবে।
      - type: code
        lang: php
        file: 'src/Controller/FlagController.php'
        variant: good
        code: |
          #[Route('/api/flags', methods: ['GET'])]
          public function index(): JsonResponse
          {
              $user = $this->getUser();
              $response = $this->json([
                  'new-checkout' => $this->flags->isOn('new-checkout', $user),
                  'new-search' => $this->flags->isOn('new-search', $user),
              ]);
              $response->setPrivate();           // ব্যবহারকারীভেদে আলাদা, CDN রাখবে না

              return $response;
          }
        marks:
          - {line: 5, tip: 'ক্লায়েন্টকে শুধু true/false ফল দাও। শতাংশ বা allow list দেখাবে না।'}
          - {line: 9, tip: 'উত্তরটা ব্যবহারকারীর ওপর নির্ভর করে, তাই private।'}
      - type: code
        lang: vue
        file: 'src/pages/CheckoutPage.vue'
        variant: good
        code: |
          <script setup lang="ts">
          import { useFlagsStore } from '@/stores/flags'
          import NewCheckout from '@/components/NewCheckout.vue'
          import OldCheckout from '@/components/OldCheckout.vue'

          const flags = useFlagsStore()
          </script>

          <template>
            <NewCheckout v-if="flags.isOn('new-checkout')" />
            <OldCheckout v-else />
          </template>
        marks:
          - {line: 11, tip: 'ফিচার বন্ধ থাকলে আগের পথই দেখা যায়। ফেরার রাস্তা ঠিক থাকে।'}
    aside:
      - type: tips
        items:
          - 'পাতা খোলার সময়ই একবার /api/flags ডেকে store-এ রাখো; প্রতিটা component আলাদা করে ডেকো না।'
          - 'flag না এলে বা request ব্যর্থ হলে isOn() false ফেরাক: নতুন ফিচার বন্ধ।'
      - type: pitfalls
        items:
          - 'শুধু Vue-তে বাটন লুকিয়ে API খোলা রাখলে যে কেউ সরাসরি request পাঠিয়ে বন্ধ ফিচার ব্যবহার করতে পারে।'
    check:
      q: 'Vue-তে বাটন লুকালে ফিচার নিরাপদ হয় না কেন?'
      a: 'ব্রাউজারের কোড আর request ব্যবহারকারীর হাতে। সে সরাসরি API ডাকতে পারে। তাই সার্ভারে একই flag দিয়ে আটকাতে হয়।'

  - slug: flag-debt
    title: 'Flag ঋণ: যে সুইচ কেউ খোলে না'
    kind: pitfall
    tldr: 'মুছে ফেলা হয়নি এমন পুরনো release flag কোডে দুই পথ বাঁচিয়ে রাখে, test দ্বিগুণ করে আর ভয়ের জায়গা বানায়; প্রতিটা flag-এর মালিক আর মুছে ফেলার তারিখ রাখো।'
    keywords: ['flag debt', 'flag cleanup', 'stale flags', 'technical debt', 'flag registry', 'remove_by']
    blocks:
