      q: 'একটা ১০০% চালু release flag দুই মাস কোডে থেকে গেলে কোন কোন ক্ষতি হয়?'
      a: 'কোডে দুটো পথ বাঁচিয়ে রাখতে হয়, test দ্বিগুণ লাগে, আর কেউ ভুল করে flag বদলালে পুরনো ভাঙা পথ চালু হয়ে যায়।'

flashcards:
  - q: 'Feature flag কী?'
    a: 'কোডের একটা শর্ত, যার চালু বা বন্ধ থাকা কনফিগ বা ডেটা থেকে ঠিক হয়; কোড বদলাতে বা deploy করতে হয় না।'
    more: |
      এতে নতুন কোড আগে থেকেই সার্ভারে বন্ধ অবস্থায় থাকে। চাইলে ধীরে খোলা যায়, ভুল হলে সাথে সাথে বন্ধ। বাড়ির সুইচ বোর্ডের মতো: তার টানা আর সুইচ অন করা আলাদা।
    ref: bad-release-night
  - q: 'Deploy আর release-এর তফাত কী?'
    a: 'Deploy: কোড সার্ভারে পৌঁছানো। Release: ফিচার ব্যবহারকারীর সামনে খোলা। Flag এই দুটোকে আলাদা করে।'
    more: |
      আলাদা হলে deploy ঝুঁকিহীন হয়ে ওঠে, কারণ নতুন কোড বন্ধ থাকে। ঝুঁকি যায় release-এ, আর সেটা ধীরে, শতাংশ ধরে, আর এক সুইচে ফেরানো যায়।
    ref: bad-release-night
  - q: 'Feature flag-এর চার ধরন কী কী?'
    a: 'Release (ধীরে খোলা), ops/kill switch (জরুরি বন্ধ), experiment (A/B), permission (কে পাবে)।'
    more: |
      ধরন ঠিক করলেই আয়ু আর মালিক ঠিক হয়। release আর experiment অস্থায়ী: কাজ শেষে মুছতে হয়। kill switch দীর্ঘস্থায়ী, সাথে runbook রাখা ভালো। permission আসলে ব্যবসার নিয়ম, তাই সেটাকে authorization-এর অংশ ভাবো।
    ref: four-kinds-of-flags
  - q: 'Kill switch কী আর কেন লাগে?'
    a: 'জরুরিতে deploy ছাড়া কোনো ফিচার বা নির্ভরতা বন্ধ করার flag। যেমন ধীর পেমেন্ট গেটওয়ে বন্ধ করা।'
    more: |
      বন্ধ থাকলে অ্যাপ বিকল্প পথে চলতে হবে, যেমন "এখন এই পদ্ধতি পাওয়া যাচ্ছে না" বার্তা। অন-কল ইঞ্জিনিয়ার এক মিনিটে খুঁজে বদলাতে পারে, এমন জায়গায় রাখো, সাথে runbook।
    ref: four-kinds-of-flags
  - q: 'শতাংশ rollout-এ কীভাবে ঠিক হয় কে নতুন ফিচার পাবে?'
    a: 'ব্যবহারকারীর আইডি আর flag-এর নাম মিলিয়ে hash করে ০–৯৯ বের করা হয়; শতাংশের চেয়ে ছোট হলে ফিচার চালু।'
    more: |
      যেমন `crc32($name.':'.$userId) % 100 < $percent`। একই আইডি সবসময় একই সংখ্যা পায়, তাই ব্যবহারকারী একবার চালু পেলে ২৫% থেকে ১০০%-এ যাওয়া পর্যন্ত চালুই থাকে। random() হলে সে কখনো নতুন, কখনো পুরনো পথ দেখত।
    ref: flag-service-symfony
  - q: 'Flag-এর অবস্থা কনফিগ ফাইলে না রেখে ডেটাবেসে রাখি কেন?'
    a: 'ফাইল বদলাতে deploy লাগে, ডেটাবেসের মান বদলাতে লাগে না। তাই ভুলে সাথে সাথে বন্ধ করা যায়।'
    more: |
      ডেটাবেস থেকে পড়ে ছোট TTL (যেমন ৩০ সেকেন্ড) দিয়ে cache করলে প্রতি request-এ ডেটাবেসে যাওয়া লাগে না, আবার বদল দ্রুত পৌঁছায়। flag-ই না পেলে ডিফল্ট হবে false।
    ref: flag-service-symfony
  - q: 'Flag ঋণ (flag debt) কী, আর কীভাবে এড়ানো যায়?'
    a: 'কাজ শেষ হওয়া flag কোডে থেকে যাওয়া। এড়াতে প্রতিটা flag-এ মালিক আর মুছে ফেলার তারিখ রাখো।'
    more: |
      পুরনো flag দুই পথ বাঁচিয়ে রাখে, test দ্বিগুণ করে আর ভুল করে বদলালে ভাঙা পথ চালু হয়। ফিচার ১০০% হলে এক সপ্তাহে flag আর পুরনো কোড মুছে ফেলো। এটা release-এর অংশ।
    ref: flag-debt
  - q: 'Vue-তে flag দিয়ে বাটন লুকালেই কি ফিচার সুরক্ষিত?'
    a: 'না। ব্যবহারকারী সরাসরি API ডাকতে পারে, তাই সার্ভারেও একই flag দিয়ে আটকাতে হবে।'
    more: |
      Vue শুধু দেখানো বা লুকানোর কাজ করে। সিদ্ধান্ত নেয় সার্ভার, আর সে ব্যবহারকারীর জন্য ফল (true/false) একটা API দিয়ে পাঠায়। flag-এর শতাংশ বা allow list ক্লায়েন্টকে জানানোর দরকার নেই।
    ref: flag-in-vue

quiz:
  - q: 'রাত ১১টায় নতুন ফিচারে bug পাওয়া গেল। ফিচারটি flag-এর পেছনে ছিল। সবচেয়ে দ্রুত আর নিরাপদ পদক্ষেপ কী?'
    hint: 'কোড কি বদলাতে হবে, নাকি কেবল সুইচ?'
    options:
      - text: 'flag off করা'
        correct: true
        why: 'কোড বদলায় না, তাই নতুন ঝুঁকি নেই, আর কাজটা সেকেন্ডের।'
      - text: 'আগের সংস্করণে rollback deploy করা'
        correct: false
        why: 'কাজ করবে, কিন্তু ধীর, আর rollback নিজেও ঝুঁকিপূর্ণ। flag-এর উদ্দেশ্যই এটা এড়ানো।'
      - text: 'সকাল পর্যন্ত অপেক্ষা করে hotfix লেখা'
        correct: false
        why: 'ক্রেতারা সারা রাত ভুগবে।'
      - text: 'সার্ভার restart করা'
        correct: false
        why: 'restart-এ bug-যুক্ত কোড একই থেকে যায়।'
    ref: bad-release-night
  - q: 'নিচের কোনটি kill switch হওয়ার জন্য সঠিক বর্ণনা?'
    hint: 'জরুরিতে কে বদলাবে, কীভাবে?'
    options:
      - text: 'deploy ছাড়া বদলানো যায় আর বন্ধ থাকলে অ্যাপ বিকল্প পথে চলে'
        correct: true
        why: 'জরুরি বন্ধের জন্য এই দুটোই মূল শর্ত।'
      - text: 'কনফিগ ফাইলে লেখা, বদলাতে পুরো deploy লাগে'
        correct: false
        why: 'জরুরিতে deploy-এর অপেক্ষা করা যায় না।'
      - text: 'ফিচার ১০০% হলে মুছে ফেলার flag'
        correct: false
        why: 'এটা release flag। kill switch স্থায়ী, কারণ ভবিষ্যতেও দরকার হবে।'
      - text: 'শুধু Vue-তে লুকিয়ে রাখা বাটন'
        correct: false
        why: 'সার্ভারে API খোলা থাকলে বন্ধ করা হলো না।'
    ref: four-kinds-of-flags
  - q: 'নিচের কোডে ব্যবহারকারীরা মাঝে মাঝে নতুন, মাঝে মাঝে পুরনো checkout পাচ্ছে। কেন?'
    lang: php
    code: |
      public function isOn(string $name, User $user): bool
      {
          $percent = $this->flags->percent($name);

          return random_int(0, 99) < $percent;
      }
    hint: 'একই ব্যবহারকারী দ্বিতীয়বার এলে কী সংখ্যা পাবে?'
    options:
      - text: 'প্রতি request-এ নতুন এলোমেলো সংখ্যা, তাই একই ব্যবহারকারীর ফল বদলায়'
        correct: true
        why: 'ব্যবহারকারীর আইডি আর flag-এর নামের hash নিলে ফল স্থির থাকত।'
      - text: 'random_int() ধীর বলে'
        correct: false
        why: 'গতি এখানে সমস্যা নয়, ফলের স্থিরতা।'
      - text: '$percent-এর মান ভুল'
        correct: false
        why: 'শতাংশ ঠিক থাকলেও এলোমেলো সংখ্যা প্রতিবার আলাদা।'
      - text: 'flag-এর নাম ইংরেজিতে না হলে'
        correct: false
        why: 'নামের ভাষা বিষয় নয়।'
    ref: flag-service-symfony
  - q: 'নতুন checkout ধীরে খোলার ঠিক নিয়মগুলো কোনগুলো?'
    hint: 'প্রথমে কারা, তারপর কত শতাংশ?'
    options:
      - text: 'প্রথমে শুধু টিম, তারপর ১%, ২৫%, শেষে ১০০%'
        correct: true
        why: 'প্রতি ধাপে error rate আর অর্ডার দেখে এগোলে ক্ষতি ছোট থাকে।'
      - text: 'প্রতি ধাপে মেট্রিক দেখে খারাপ হলে flag off করা'
        correct: true
        why: 'ধীরে খোলার মূল উদ্দেশ্য এটাই: সীমিত ক্ষতিতে ধরা।'
      - text: '১০০% হওয়ার পর flag আর পুরনো কোড মুছে ফেলা'
        correct: true
        why: 'না মুছলে flag ঋণ জমে।'
      - text: 'সব ব্যবহারকারীকে একসাথে খুলে সমস্যা হলে তারপর flag ব্যবহার করা'
        correct: false
        why: 'ক্ষতি তখন সবাইকে ছোঁয়; ধীরে খোলার সুবিধাই হারায়।'
    ref: flag-service-symfony
  - q: 'দুই মাস আগে ১০০% হওয়া release flag এখনো কোডে আছে। এখন কী করা উচিত?'
    hint: 'flag-এর কাজ ফুরিয়েছে; তাহলে কোডে তার জায়গা আছে কি?'
    options:
