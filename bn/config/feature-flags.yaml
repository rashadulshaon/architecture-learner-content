  - q: 'নিচের কোডে ব্যবহারকারীরা মাঝে মাঝে নতুন, মাঝে মাঝে পুরনো checkout পাচ্ছে। কেন?'
    lang: php
    code: |
      public function isOn(string $name, User $user): bool
      {
          $percent = $this->flags->percent($name);

          return random_int(0, 99) < $percent;
      }
