        correct: true
        why: 'ধাপের ফল অজানা, তাই তাকেও ফেরানো হয়। বুকিং থাকুক বা না থাকুক cancel কাজ করে, আর দেরিতে আসা বুকিং ফিরে যায়।'
      - text: 'courier ধাপ ব্যর্থ ধরে শুধু stock ছাড়া আর টাকা ফেরত'
        correct: false
        why: 'ধাপটা ব্যর্থ হয়েছে এমন নয়। ছয় মিনিটে ভ্যান বুক হলে মরা অর্ডারের জন্য courier এসে হাজির হবে।'
      - text: 'courier যত দেরিতেই উত্তর দিক, তার অপেক্ষায় থাকা'
        correct: false
        why: 'Saga চিরকাল ঝুলে থাকে আর ক্রেতার টাকা কাটা থেকে যায়। Deadline ঠিক এটা ঠেকাতেই।'
      - text: 'নতুন key দিয়ে আবার BookCourier পাঠানো, যেটা সফল হয় হোক'
        correct: false
