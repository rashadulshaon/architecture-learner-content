slides:
  - slug: save-then-crash
    title: 'অর্ডার সংরক্ষিত, কিন্তু খবর হারিয়ে গেল'
    kind: story
    tldr: 'ডেটাবেসে লেখা আর message পাঠানো দুটো আলাদা সিস্টেম, তাই এক transaction-এ বাঁধা যায় না; মাঝখানে crash হলে একটা হয় আর অন্যটা হয় না (dual write)।'
    keywords: ['dual write', 'lost event', 'crash between', 'publish after commit', 'ডুয়াল রাইট', 'হারানো event']
    blocks:
      - type: text
        body: |
          রহিমের অর্ডার সার্ভিস অর্ডার ১০১ ডেটাবেসে সংরক্ষণ করল, তারপর `OrderPlaced` message broker-এ (সার্ভিসদের মধ্যে message বয়ে নেওয়া ডাকঘর) পাঠানোর কথা, যাতে stock সার্ভিস মাল আলাদা করে। ঠিক commit আর publish-এর মাঝখানে সার্ভার crash করল। অর্ডার আছে, কিন্তু খবর নেই — stock কখনো reserve হলো না, আর ক্রেতা পণ্য পাবে না। একে বলে **dual write**: একটা কাজ দুই জায়গায় লেখা, অথচ দুটোকে এক সাথে বাঁধার উপায় নেই।
      - type: visual
        kind: sequence
        caption: 'Commit হলো, কিন্তু publish-এর আগেই crash'
        actors:
          - {id: app, label: 'অর্ডার সার্ভিস', icon: server, tip: 'অর্ডার সংরক্ষণ আর event পাঠানো — দুটোই এর দায়িত্ব, কিন্তু দুটো আলাদা সিস্টেমে।'}
          - {id: db, label: 'ডেটাবেস', icon: db, tip: 'নিজের transaction আছে, কিন্তু broker-এর ব্যাপারে কিছু জানে না।'}
          - {id: broker, label: 'Message broker', icon: queue, tip: 'event পেলে stock সার্ভিসকে জানায়। না পেলে কাউকে কিছু জানায় না।'}
        messages:
          - {from: app, to: db, label: 'অর্ডার ১০১ সংরক্ষণ, COMMIT'}
          - {from: db, to: app, label: 'ঠিক আছে', dashed: true}
          - {at: app, note: 'crash! publish পর্যন্ত পৌঁছাইনি', tone: bad, tip: 'ডেটাবেসের কাজ শেষ, কিন্তু broker-এর কাজ বাকি। এই ফাঁক সব সময় থাকে।'}
          - {at: broker, note: 'OrderPlaced কখনো আসেনি', tone: bad, tip: 'stock কখনো reserve হবে না, কারণ কেউ জানেই না।'}
      - type: quote
        body: 'ডেটাবেসে লেখা আর message পাঠানো কখনোই এক transaction-এ হয় না — মাঝখানে ফাঁক থাকেই।'
    aside:
      - type: pitfalls
        items:
          - 'উল্টো ক্রমে (আগে publish, পরে commit) করলে commit ব্যর্থ হলে এমন event যায় যার অর্ডারই নেই।'
          - '`try/catch` দিয়ে এই ফাঁক বন্ধ হয় না, কারণ crash-এ catch-ও চলে না।'
      - type: terms
        items:
          - {term: 'Dual write', meaning: 'একই ঘটনার জন্য দুটো আলাদা সিস্টেমে লেখা, যাদের মধ্যে atomic transaction নেই।'}
          - {term: 'Transaction', meaning: 'ডেটাবেসের একদল বদল, যা হয় সবটা একসাথে সফল হয়, নয়তো সবটা ফিরে যায় (rollback)।'}
    check:
      q: 'আগে publish করে তারপর commit করলে কোন উল্টো সমস্যা হয়?'
      a: 'commit ব্যর্থ হলে event চলে গেছে অথচ অর্ডার নেই। stock সার্ভিস এমন অর্ডারের মাল আলাদা করে রাখবে, যা কখনো ছিলই না।'

  - slug: outbox-register
    title: 'পাঠানোর খাতা: transactional outbox'
    kind: concept
    tldr: 'Event আগে একই transaction-এ নিজের ডেটাবেসের outbox টেবিলে লিখুন; আলাদা relay পরে সেটা broker-এ পাঠায়, তাই ঘটনা আর খবর কখনো আলাদা হয় না।'
    keywords: ['transactional outbox', 'relay', 'publisher', 'outbox table', 'at-least-once', 'আউটবক্স']
    blocks:
      - type: metaphor
        icon: book
        title: 'দোকানের "পাঠাতে হবে" খাতা'
        body: |
          দোকানদার বিক্রির খাতায় লেখে "রিনাকে ১০ কেজি চাল", আর **একই পাতায়, একই কলমে** লেখে "গুদামে খবর দাও"। এক সাথে লেখা, তাই একটা আছে আর অন্যটা নেই — এমন হয় না। পরে ডাকপিয়ন ঘুরে ঘুরে ওই "খবর দাও" লাইনগুলো গুদামে পৌঁছে দেয়, আর পৌঁছালে টিক দেয়। পিয়ন মাঝপথে মরে গেলেও লাইন থেকে যায়, কেউ আবার পাঠাবে।
      - type: visual
        kind: flow
        caption: 'অর্ডার আর event এক transaction-এ, পাঠানো relay-র কাজ'
        nodes:
          - {id: app, label: 'অর্ডার সার্ভিস', sub: 'Symfony', icon: server, col: 0, row: 1, tip: 'অর্ডার আর event একই transaction-এ লেখে। broker-কে সরাসরি ডাকে না।'}
          - {id: db, label: 'ডেটাবেস', sub: 'orders + outbox', icon: db, tone: accent, col: 2, row: 0, tip: 'এক transaction-এ দুটো টেবিলেই লেখা হয়, তাই হয় দুটোই থাকে, নয় কোনোটাই না।'}
          - {id: relay, label: 'Relay', sub: 'ডাকপিয়ন', icon: truck, col: 2, row: 2, tip: 'আলাদা একটা প্রসেস, যা outbox-এ না-পাঠানো লাইন খুঁজে broker-এ পৌঁছে দেয়।'}
          - {id: broker, label: 'Message broker', sub: 'RabbitMQ', icon: queue, col: 4, row: 1, tip: 'event গ্রহণ করে consumer-দের কাছে পৌঁছে দেয়।'}
        edges:
          - {from: app, to: db, label: 'অর্ডার আর outbox-এর লাইন একই transaction-এ লেখা হয়', tone: good}
          - {from: relay, to: db, label: 'Relay outbox-এ না-পাঠানো লাইন খোঁজে'}
          - {from: db, to: relay, label: 'ডেটাবেস সেই লাইনগুলো ফেরত দেয়', dashed: true}
          - {from: relay, to: broker, label: 'Relay লাইনগুলো broker-এ publish করে'}
          - {from: relay, to: db, label: 'পাঠানো লাইনে sent_at বসায়', tone: good}
      - type: text
        body: |
          Relay publish করার পর `sent_at` বসানোর আগে crash করলে সেই event আবার যাবে। তাই outbox দেয় **at-least-once** delivery: কখনো হারায় না, কিন্তু কখনো দুইবার যেতে পারে। এই দুইবারের জন্য consumer-এ লাগে **inbox**। দাম: event যেতে এক-দুই সেকেন্ড দেরি হয়, আর relay চালাতে ও টেবিল পরিষ্কার রাখতে হয়।
    aside:
      - type: terms
        items:
          - {term: 'Outbox', meaning: 'নিজের ডেটাবেসে একটা টেবিল, যেখানে বাইরে পাঠানোর event আগে লিখে রাখা হয়।'}
          - {term: 'Relay', meaning: 'যে প্রসেস outbox পড়ে event বাইরে পাঠায়।'}
      - type: remember
        body: 'আগে খাতায় লিখুন, পরে পিয়ন পাঠাবে। ঘটনা আর খবর এক কলমে।'
    check:
      q: 'Outbox-এ event আর অর্ডার একই transaction-এ লেখায় কোন সমস্যাটা মিটে যায়?'
      a: 'অর্ডার আছে অথচ event নেই (বা উল্টোটা) — এই অমিল। দুটো একসাথে commit বা একসাথে rollback হয়।'

  - slug: outbox-and-relay
    title: 'Outbox লেখা আর relay চালানো: Doctrine ও Messenger'
    kind: howto
    tldr: 'এক flush-এ Order আর OutboxMessage persist করুন; relay FOR UPDATE SKIP LOCKED দিয়ে batch তুলে Messenger bus-এ dispatch করে sent_at বসায়।'
    keywords: ['Doctrine', 'Messenger', 'SKIP LOCKED', 'relay command', 'outbox entity', 'wrapInTransaction']
    blocks:
      - type: code
        lang: php
        file: 'src/Order/PlaceOrderHandler.php'
        variant: good
        code: |
          public function __invoke(PlaceOrder $cmd): void
          {
              $this->em->wrapInTransaction(function () use ($cmd): void {
                  $order = Order::place($cmd->customerId, $cmd->lines);
                  $this->em->persist($order);

                  $event = new OrderPlaced((string) Uuid::v7(), $order->getId(), $cmd->lines);
                  $this->em->persist(new OutboxMessage(
                      id: $event->messageId,
                      type: OrderPlaced::class,
                      payload: $this->serializer->serialize($event, 'json'),
                  ));
              });                                  // দুটোই একসাথে commit
          }
        marks:
          - {line: 3, tip: 'পুরো ব্লক এক transaction। exception উঠলে অর্ডার আর outbox লাইন দুটোই rollback হয়।'}
          - {line: 7, tip: 'message id এখানেই বানানো। consumer পরে এই id দিয়ে duplicate চিনবে।'}
          - {line: 8, tip: 'event-টা সরাসরি broker-এ যায় না — শুধু outbox টেবিলে একটা লাইন হয়।'}
      - type: code
        lang: php
        file: 'src/Outbox/OutboxRelay.php'
        variant: good
        code: |
          public function publishBatch(int $limit = 50): int
          {
              return $this->db->transactional(function () use ($limit): int {
                  $rows = $this->db->fetchAllAssociative(
                      "SELECT id, type, payload FROM outbox WHERE sent_at IS NULL
                       ORDER BY created_at LIMIT $limit FOR UPDATE SKIP LOCKED"
                  );
                  foreach ($rows as $r) {
                      $message = $this->serializer->deserialize($r['payload'], $r['type'], 'json');
                      $this->bus->dispatch($message);          // সত্যিকারের broker transport
                      $this->db->update('outbox', ['sent_at' => date('c')], ['id' => $r['id']]);
                  }

                  return count($rows);
              });
          }
        marks:
          - {line: 6, tip: 'SKIP LOCKED: একাধিক relay একসাথে চললে একে অপরের নেওয়া লাইন এড়িয়ে যায়, তাই কাজ ভাগ হয় অথচ জট লাগে না।'}
          - {line: 10, tip: 'আসল publish। exception উঠলে transaction rollback হয়: এই লাইন আর batch-এর আগে পাঠানো লাইনগুলোও unsent থেকে আবার যায়। inbox সেটা সামলায়।'}
          - {line: 11, tip: 'dispatch সফল, কিন্তু এখানে লেখার আগে crash হলে event আবার যাবে। at-least-once এর দাম এটাই।'}
    aside:
      - type: tips
        items:
          - 'Relay চালান একটা command বা Scheduler task দিয়ে, প্রতি সেকেন্ডে বা কয়েক সেকেন্ডে একবার। পুরনো sent লাইন সপ্তাহখানেক পর মুছে দিন।'
          - 'হালকা বিকল্প: Messenger-এর Doctrine transport একই কানেকশনে চললে `dispatch()` নিজেই outbox-এর মতো কাজ করে। আলাদা broker-এ পাঠাতে হলে ওপরের relay লাগে।'
      - type: commands
        items:
          - {cmd: 'php bin/console messenger:consume async -vv', desc: 'consumer worker চালু করুন'}
          - {cmd: 'php bin/console app:outbox:relay', desc: 'আপনার নিজের command: প্রায় প্রতি সেকেন্ডে publishBatch() ঘোরায়'}
      - type: refs
        items:
          - {to: 'messaging/delivery-guarantees', label: 'At-least-once ও exactly-once'}
    check:
      q: 'Relay-তে `FOR UPDATE SKIP LOCKED` কেন দেওয়া হয়?'
      a: 'দুটো relay একসাথে চললে একই লাইন দুজনে না নিয়ে ভাগ করে নেয়। যে লাইন অন্য relay lock করেছে, সেটা এড়িয়ে পরের লাইনে যায়।'

  - slug: outbox-inbox-tables
    title: 'দুটো টেবিল: outbox আর inbox'
    kind: howto
    tldr: 'Outbox-এ না-পাঠানো লাইনের index আর পুরনো লাইন মোছা লাগে; inbox-এ (message_id, handler)-এ unique key আর যথেষ্ট লম্বা মেয়াদ লাগে।'
    keywords: ['outbox table', 'inbox table', 'partial index', 'retention', 'migration', 'unique constraint', 'আউটবক্স টেবিল']
    blocks:
      - type: text
        body: |
          দুটো প্যাটার্নই দুটো ছোট টেবিলের ওপর দাঁড়ানো। না-পাঠানো লাইনের index না থাকলে relay প্রতিবার সব পুরনো লাইন ঘাঁটে: দিনে ১ লাখ event হলে এক বছরে ৩ কোটি ৬৫ লাখ লাইন, অথচ দরকার মাত্র ৫০টা। মুছে না ফেললে দুটো টেবিলই বাড়তে থাকে। টেবিল দুটো Doctrine Migration দিয়ে বানান।
      - type: code
        lang: sql
        file: 'outbox টেবিল (PostgreSQL)'
        variant: good
        code: |
          CREATE TABLE outbox (
              id          uuid PRIMARY KEY,
              type        varchar(255) NOT NULL,
              payload     jsonb NOT NULL,
              created_at  timestamptz NOT NULL DEFAULT now(),
              sent_at     timestamptz NULL
          );
          -- relay শুধু না-পাঠানো লাইন চায়
          CREATE INDEX outbox_unsent ON outbox (created_at) WHERE sent_at IS NULL;

          -- রোজ পরিষ্কার: পাঠানো লাইন এখন শুধু ইতিহাস
          DELETE FROM outbox WHERE sent_at < now() - interval '7 days';
        marks:
          - {line: 9, tip: 'index-এ শুধু না-পাঠানো লাইন থাকে, তাই পুরনো লাইন যত জমুক এটা ছোটই থাকে। relay পুরো টেবিল না পড়ে এটাই পড়ে।'}
          - {line: 12, tip: 'Scheduler task দিয়ে রোজ চালান। লাইন পাঠানো হয়ে গেলে সেটা শুধু ইতিহাস।'}
      - type: code
        lang: sql
        file: 'inbox টেবিল (PostgreSQL)'
        variant: good
        code: |
          CREATE TABLE inbox (
              message_id  uuid NOT NULL,
              handler     varchar(255) NOT NULL,
              received_at timestamptz NOT NULL DEFAULT now(),
              PRIMARY KEY (message_id, handler)
          );
          -- রোজ পরিষ্কার: duplicate আসার সর্বোচ্চ সময়ের পুরনো id ভুলে যান
          DELETE FROM inbox WHERE received_at < now() - interval '14 days';
        marks:
          - {line: 5, tip: '`ON CONFLICT (message_id, handler)` এই key-র ওপর নির্ভর করে। এটা না থাকলে insert কখনো conflict করে না, আর সব duplicate পার পেয়ে যায়।'}
          - {line: 8, tip: 'duplicate আসার সর্বোচ্চ সময়ের চেয়ে বেশি দিন লাইন রাখুন। আগে মুছলে দেরিতে আসা duplicate নতুন বলে মনে হয়।'}
    aside:
      - type: tips
        items:
          - 'MySQL-এ partial index নেই: বদলে `(sent_at, created_at)`-এ index দিন, আর `ON CONFLICT`-এর জায়গায় `INSERT IGNORE` ব্যবহার করুন।'
          - 'Inbox-এর মেয়াদ ঠিক করুন broker-এর সবচেয়ে দেরির redelivery থেকে, আন্দাজে নয়।'
    check:
      q: 'এক বছর পর relay ধীর, অথচ না-পাঠানো লাইন মাত্র ৫০টা। প্রথমে কী দেখবেন?'
      a: 'index। না-পাঠানো লাইনে index না থাকলে প্রতি poll-এ লক্ষ লক্ষ পুরনো লাইন ঘাঁটতে হয়। `sent_at IS NULL`-এর partial index শুধু ওই ৫০টা পড়ে।'

  - slug: inbox-dedup
    title: 'দুইবার এলেও একবার: inbox দিয়ে dedup'
    kind: pitfall
    tldr: 'Outbox at-least-once, তাই consumer-এ একই message দুইবার আসবে; handler একই transaction-এ inbox টেবিলে message id ঢুকিয়ে duplicate এড়ায়।'
    keywords: ['inbox pattern', 'idempotent consumer', 'dedup', 'message id', 'ON CONFLICT', 'ইনবক্স']
    blocks:
      - type: text
        body: |
          Relay crash করে একই `OrderPlaced` দুইবার পাঠালে, সরল handler দুইবারই stock কমায়। সমাধান: গ্রহণকারী একটা **চালান খাতা** (inbox) রাখে। প্রতিটা message id প্রথমবার এলে খাতায় তোলে আর কাজ করে, দ্বিতীয়বার এলে দেখে "এই চালান আগেই নেওয়া" আর ফিরিয়ে দেয়।
      - type: code
        lang: php
        file: 'src/Stock/ReserveStockHandler.php (ভুল)'
        variant: bad
        code: |
          #[AsMessageHandler]
          public function __invoke(OrderPlaced $m): void
          {
              $this->stock->reserve($m->orderId, $m->lines);   // দুইবার এলে দুইবার কমে
          }
        marks:
          - {line: 4, tip: 'handler জানে না এই message আগে এসেছে কি না। at-least-once-এ এটা ভুল।'}
      - type: code
        lang: php
        file: 'src/Stock/ReserveStockHandler.php'
        variant: good
        code: |
          #[AsMessageHandler]
          public function __invoke(OrderPlaced $m): void
          {
              $this->db->transactional(function () use ($m): void {
                  $isNew = $this->db->executeStatement(
                      'INSERT INTO inbox (message_id, handler, received_at)
                       VALUES (?, ?, now()) ON CONFLICT (message_id, handler) DO NOTHING',
                      [$m->messageId, self::class],
                  );
                  if (0 === $isNew) {
                      return;                       // আগেই সারা
                  }
                  $this->stock->reserve($m->orderId, $m->lines);
              });
          }
        marks:
          - {line: 6, tip: '(message_id, handler)-এ unique constraint। একই message-এর জন্য এই handler-এর সারি দুইবার ঢুকবে না।'}
          - {line: 10, tip: '০ সারি মানে আগেই হয়েছে। কিছু না করে ফিরে যান; exception ছুঁড়লে Messenger বৃথা retry করবে।'}
          - {line: 13, tip: 'inbox লেখা আর stock কমানো একই transaction-এ, তাই কাজ ব্যর্থ হলে inbox লাইনও rollback।'}
      - type: quote
        body: 'Outbox পাঠানোর দিকে নিশ্চয়তা দেয়, inbox গ্রহণের দিকে। দুটো মিলেই "কার্যত একবার"।'
    aside:
      - type: terms
        items:
          - {term: 'Idempotent', meaning: 'দুইবার চালালেও নিরাপদ: দ্বিতীয়বারে কিছু বদলায় না।'}
          - {term: 'Unique constraint', meaning: 'ডেটাবেসের নিয়ম, যা একই key-র দ্বিতীয় লাইন ঢুকতে দেয় না।'}
      - type: remember
        body: 'Outbox = হারাবে না। Inbox = দুইবার চলবে না।'
      - type: when
        use: ['ডেটাবেসে লেখা আর event পাঠানো দুটোই একসাথে জরুরি হলে', 'consumer-এর কাজ দুইবার হলে ক্ষতি (stock, টাকা, ইমেইল)']
        avoid: ['কাজ স্বভাবতই idempotent হলে (যেমন "status বসানো"), তখন আলাদা inbox না লাগলেও চলে']
    check:
      q: 'Inbox-এর insert আর আসল কাজ আলাদা transaction-এ করলে কী ভুল হবে?'
      a: 'insert-এর পর আসল কাজের আগে crash হলে message "সারা" হয়ে যায় অথচ কাজ হয়নি। retry এসে inbox-এ আগের লাইন দেখে ফিরে যাবে, কাজ আর হবে না।'

flashcards:
  - q: 'Dual write সমস্যা কী?'
    a: 'একই ঘটনা দুটো আলাদা সিস্টেমে (যেমন ডেটাবেস আর message broker) লেখা, যাদের মধ্যে atomic transaction নেই। একটা সফল, অন্যটা ব্যর্থ হতে পারে।'
    more: |
      অর্ডার commit হলো, কিন্তু event পাঠানোর আগে সার্ভার crash করল — অর্ডার আছে, খবর নেই। উল্টো করলেও সমস্যা: event গেছে, অথচ commit ব্যর্থ। দুই সিস্টেম এক transaction-এ বাঁধা যায় না, তাই আলাদা কৌশল লাগে।
    ref: save-then-crash
  - q: 'Transactional outbox কীভাবে কাজ করে?'
    a: 'Event বাইরে না পাঠিয়ে আগে নিজের ডেটাবেসের outbox টেবিলে, ঘটনার সাথে একই transaction-এ লেখা হয়। আলাদা relay পরে সেটা পাঠায়।'
    more: |
      অর্ডার আর outbox লাইন একসাথে commit বা rollback হয়, তাই ঘটনা আর খবর কখনো আলাদা হয় না। পাঠানোর ব্যর্থতা এখন retry-যোগ্য একটা আলাদা কাজ, আর crash-এ কোনো event হারায় না।
    ref: outbox-register
  - q: 'Outbox relay কী কাজ করে?'
    a: 'আলাদা প্রসেস, যা outbox টেবিল থেকে না-পাঠানো লাইন তুলে broker-এ publish করে, তারপর লাইনে sent চিহ্ন বসায়।'
    more: |
      Relay একটা command, Scheduler task বা loop হতে পারে। একাধিক relay চালালে `FOR UPDATE SKIP LOCKED` দিয়ে একে অপরকে এড়িয়ে লাইন ভাগ করে নেয়।
    ref: outbox-and-relay
  - q: 'Outbox কোন delivery guarantee দেয়, আর তার ফল কী?'
    a: 'At-least-once: event কখনো হারায় না, কিন্তু একই event দুইবার যেতে পারে। তাই consumer-কে duplicate সামলাতে হয়।'
    more: |
      Relay publish করার পর sent চিহ্ন বসানোর আগে crash করলে event আবার যায়। এই দুইবারের ঝুঁকি এড়ানো যায় না, তাই গ্রহণকারী দিকে inbox বা অন্য কোনো idempotency ব্যবস্থা অপরিহার্য।
    ref: outbox-register
  - q: 'Inbox pattern কী?'
    a: 'Consumer প্রতিটা message id একটা টেবিলে (unique constraint-সহ) ঢুকিয়ে কাজ করে। দ্বিতীয়বার একই id এলে insert ০ সারি দেয়, আর কাজ বাদ যায়।'
    more: |
      Inbox-এর insert আর আসল কাজ একই transaction-এ থাকতে হয়। তাহলে কাজ ব্যর্থ হলে inbox লাইনও ফিরে যায়, আর retry আবার কাজটা করার সুযোগ পায়।
    ref: inbox-dedup
  - q: 'Outbox আর inbox একসাথে কেন লাগে?'
    a: 'Outbox পাঠানোর দিকে নিশ্চিত করে event হারাবে না। Inbox নিশ্চিত করে duplicate event দুইবার কাজ করবে না।'
    more: |
      একটা ছাড়া অন্যটা অর্ধেক সমাধান। Outbox ছাড়া event হারায়, inbox ছাড়া event দুইবার কাজ করে। দুটো মিলে ফল দাঁড়ায় "কার্যত একবারই" (effectively once)।
    ref: inbox-dedup
  - q: 'Relay-তে `SKIP LOCKED` কেন?'
    a: 'একাধিক relay একসাথে চললে একজন যে লাইন lock করেছে, অন্যজন সেটা এড়িয়ে পরের লাইন নেয়। ফলে কাজ ভাগ হয়, জট লাগে না।'
    more: |
      `SKIP LOCKED` ছাড়া দ্বিতীয় relay lock-এর জন্য অপেক্ষা করত, নয়তো একই লাইন দুইবার পাঠাত। PostgreSQL আর MySQL 8 দুটোই এটা সমর্থন করে।
    ref: outbox-and-relay

  - q: 'Outbox টেবিলে শুধু না-পাঠানো লাইনের index কেন?'
    a: 'Relay শুধু `sent_at IS NULL` লাইন চায়। partial index-এ শুধু সেগুলোই থাকে, তাই লক্ষ লক্ষ পুরনো লাইন জমলেও poll দ্রুত থাকে।'
    more: |
      index না থাকলে প্রতি poll পুরো টেবিল ঘাঁটে। দিনে ১ লাখ event হলে এক বছরে প্রায় ৩ কোটি ৬৫ লাখ লাইন, খুঁজতে মাত্র ৫০টা। MySQL-এ partial index নেই, তাই সেখানে `(sent_at, created_at)`-এ index দিতে হয়।
    ref: outbox-inbox-tables
  - q: 'Inbox-এর লাইন কত দিন রাখতে হয়?'
    a: 'duplicate আসার সর্বোচ্চ সময়ের চেয়ে বেশি দিন, যেমন ১৪ দিন। আগে মুছলে দেরিতে আসা duplicate নতুন বলে মনে হয়।'
    more: |
      চিরকাল রাখলে টেবিল সীমাহীন বাড়ে। broker যত দেরিতে আবার পাঠাতে পারে তার আগে মুছলে পুরনো duplicate ফসকে গিয়ে কাজ দুইবার করে ফেলে। মেয়াদ ঠিক করুন broker-এর redelivery-র সীমা থেকে।
    ref: outbox-inbox-tables

quiz:
  - q: 'Order সার্ভিস অর্ডার সংরক্ষণ করে `$bus->dispatch(new OrderPlaced(...))` ডাকে (RabbitMQ transport)। কোন পরিস্থিতিতে সমস্যা হয়?'
    hint: 'commit আর dispatch-এর মাঝখানে কিছু ঘটলে?'
    options:
      - text: 'Commit-এর পর dispatch-এর আগে সার্ভার crash করলে event হারিয়ে যায়'
        correct: true
        why: 'ডেটাবেস আর broker এক transaction-এ নেই। মাঝখানের ফাঁকে ঘটনা আর খবর আলাদা হয়ে যায়।'
      - text: 'RabbitMQ ধীর বলে অর্ডার সংরক্ষণ ব্যর্থ হয়'
        correct: false
        why: 'dispatch commit-এর পরে, তাই ধীর হলেও সংরক্ষণ আটকায় না। সমস্যা হারানোর, গতির নয়।'
      - text: 'Messenger একই message দুইবার serialize করে'
        correct: false
        why: 'এমন কিছু ঘটে না; সমস্যাটা দুই সিস্টেম এক transaction-এ না থাকার।'
      - text: 'কোনো সমস্যা নেই, কারণ Messenger নিজেই atomic'
        correct: false
        why: 'Messenger-এর বাইরের broker আর ডেটাবেস আলাদা, atomic নয়।'
    ref: save-then-crash
  - q: 'Outbox-এর সঠিক কাজের ক্রম কোনটা?'
    hint: 'প্রথমে কী লেখা হয়, আর কে broker-এ পাঠায়?'
    options:
      - text: 'অর্ডার commit → সার্ভিস সরাসরি broker-এ publish → outbox-এ লগ'
        correct: false
        why: 'এখানে আগের মতো ফাঁক আছে; outbox কিছু বাঁচায় না।'
      - text: 'অর্ডার ও outbox লাইন এক transaction-এ → relay লাইন তুলে publish → sent চিহ্ন'
        correct: true
        why: 'লেখা atomic, পাঠানো আলাদা কাজ। crash হলে লাইন unsent থাকে, relay আবার পাঠায়।'
      - text: 'Relay আগে publish → অর্ডার সংরক্ষণ'
        correct: false
        why: 'অর্ডার সংরক্ষণ ব্যর্থ হলে এমন event চলে যায় যার অর্ডারই নেই।'
      - text: 'দুটো আলাদা transaction-এ outbox আর অর্ডার, তারপর publish'
        correct: false
        why: 'আলাদা transaction মানে মাঝখানে ফাঁক, যেটা এড়াতেই outbox।'
    ref: outbox-register
  - q: 'Relay নিচের কোডে dispatch করার পর `sent_at` বসানোর আগে crash করল। এরপর কী হবে?'
    lang: php
    code: |
      foreach ($rows as $r) {
          $this->bus->dispatch($this->decode($r));
          $this->db->update('outbox', ['sent_at' => date('c')], ['id' => $r['id']]);
      }
    hint: 'sent_at না বসলে relay পরের বার লাইনটাকে কী ভাববে?'
    options:
      - text: 'লাইনটা unsent থাকবে, relay আবার পাঠাবে, তাই consumer-এ duplicate আসবে'
        correct: true
        why: 'at-least-once-এর দাম। এই কারণেই consumer-এ inbox লাগে।'
      - text: 'Event চিরতরে হারিয়ে যাবে'
        correct: false
        why: 'lost হতো যদি outbox না থাকত। এখানে লাইন থেকে গেছে।'
      - text: 'অর্ডারটা rollback হয়ে যাবে'
        correct: false
        why: 'অর্ডার অনেক আগেই commit হয়ে গেছে; relay-র ব্যর্থতা তাকে ছোঁয় না।'
    ref: outbox-and-relay
  - q: 'Stock handler-এ inbox ব্যবহার করলে নিচের কোন আচরণগুলো ঠিক?'
    hint: 'inbox লেখা আর stock কমানো — কোন transaction-এ?'
    options:
      - text: 'Inbox insert আর stock reserve একই transaction-এ'
        correct: true
        why: 'কাজ ব্যর্থ হলে inbox লাইনও rollback হয়, তাই retry আবার কাজটা করতে পারে।'
      - text: '`(message_id, handler)`-এ unique constraint'
        correct: true
        why: 'একই message এই handler-এর জন্য দ্বিতীয়বার ঢুকতে পারে না, আর ০ সারি duplicate চিনিয়ে দেয়।'
      - text: 'Insert আগেই commit করে তারপর stock reserve'
        correct: false
        why: 'মাঝখানে crash হলে message "সারা" হয়ে যায় অথচ stock কমেনি।'
      - text: 'Duplicate চিনলে exception ছুঁড়ে Messenger-কে retry করতে দেওয়া'
        correct: false
        why: 'এতে শুধু বৃথা retry চলে, আর শেষে failure queue-তে যায়। চুপচাপ ফিরে যাওয়াই ঠিক।'
    ref: inbox-dedup
  - q: 'রহিম বলল, "আমাদের outbox আছে, তাই consumer-এ আর idempotency লাগবে না।" এটা ঠিক কি?'
    hint: 'Outbox কোন delivery guarantee দেয়?'
    options:
      - text: 'ঠিক, outbox exactly-once দেয়'
