          - {term: 'Projection', meaning: 'event থেকে বানানো টেবিল, যা এক ধরনের প্রশ্নের উত্তর দেয়, যেমন ব্যালেন্স।'}
          - {term: 'Eventual consistency', meaning: 'পড়ার দিক লেখার ঠিক সাথে সাথে নয়, একটু পরে ধরে ফেলে।'}
