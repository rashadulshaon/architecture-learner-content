slides:
  - slug: why-is-it-200
    title: 'ব্যালেন্স ২০০ কেন? টেবিল কিছু বলে না'
    kind: story
    tldr: 'CRUD টেবিলে শুধু বর্তমান মান থাকে, তাই "কীভাবে এই অবস্থায় এলাম" প্রশ্নের উত্তর থাকে না; সেই প্রশ্ন যেখানে মূল, সেখানে event sourcing কাজে আসে।'
    keywords: ['event sourcing', 'audit history', 'current state', 'CRUD limitation', 'ইতিহাস', 'ইভেন্ট সোর্সিং']
    blocks:
      - type: text
        body: |
          রিনা অভিযোগ করল, "আমার অ্যাকাউন্টে ৫০০ ছিল, এখন ২০০ কেন?" রহিম `account` টেবিল খুলে দেখল শুধু একটা সংখ্যা: `balance = 200`। কে কমাল, কখন, কোন কারণে — টেবিলে কিছুই নেই। রহিম লগ ঘেঁটে অনুমান করার চেষ্টা করল, কারণ আগের মানগুলো প্রতিবার আপডেটে মুছে গেছে।
      - type: visual
        kind: compare
        caption: 'শুধু বর্তমান মান বনাম প্রতিটা ঘটনার খাতা'
        columns:
          - title: 'CRUD টেবিল'
            tone: bad
            icon: cross
            tip: 'প্রতিটা UPDATE আগের মান মুছে নতুন মান বসায়, তাই ইতিহাস থাকে না।'
            items: ['balance = ২০০', 'আগে কত ছিল? জানা নেই', 'কমল কেন, কে কমাল? জানা নেই']
          - title: 'Event-এর খাতা'
            tone: good
            icon: check
            tip: 'প্রতিটা ঘটনা একটা লাইন হয়ে চিরকাল থাকে। বর্তমান মান হলো সব লাইনের যোগফল।'
            items: ['জমা ৫০০ (প্রথম দিন)', 'তোলা ৩০০ (শনিবার, ATM)', 'ব্যালেন্স = ২০০, কারণসহ']
      - type: quote
        body: 'Event sourcing-এ ঘটনাই সত্য। বর্তমান অবস্থা শুধু সেই ঘটনাগুলোর যোগফল।'
    aside:
      - type: problem
        body: 'ব্যাংক, লেজার, বিমা — যেখানে "কীভাবে এই অবস্থায় এলাম" আইনত বা ব্যবসায়ে জরুরি, সেখানে বর্তমান মান যথেষ্ট নয়। ঘটনার ধারাটাই আসল তথ্য।'
      - type: terms
        items:
          - {term: 'Event', meaning: 'অতীতে যা ঘটে গেছে তার অপরিবর্তনীয় রেকর্ড, যেমন MoneyWithdrawn।'}
          - {term: 'Event sourcing', meaning: 'অবস্থা সরাসরি না রেখে ঘটনাগুলো রাখা, আর অবস্থা তাদের থেকে বের করা।'}
    check:
      q: 'CRUD টেবিলে `UPDATE balance = 200` চালালে কোন তথ্যটা চিরতরে চলে যায়?'
      a: 'আগের মান (৫০০) আর বদলের কারণ। সাধারণ টেবিলে প্রতিটা UPDATE পুরনো মানের ওপর লেখে, তাই ইতিহাস রাখতে আলাদা ব্যবস্থা না করলে হারিয়ে যায়।'

  - slug: baki-khata-replay
    title: 'বাকির খাতা: event append আর replay'
    kind: concept
    tldr: 'Event store শুধু যোগ হয়, কখনো বদলায় না; অবস্থা জানতে সব event আবার চালানো (replay) হয়, আর ধীর হলে সম্প্রতি টানা জের (snapshot) থেকে শুরু করা হয়।'
    keywords: ['event store', 'append only', 'replay', 'snapshot', 'aggregate', 'বাকির খাতা']
    blocks:
      - type: metaphor
        icon: book
        title: 'মুদি দোকানের বাকির খাতা'
        body: |
          খাতায় কখনো আগের লাইন কেটে নতুন সংখ্যা বসানো হয় না; শুধু নিচে নতুন লাইন যোগ হয়। কত বাকি, তা জানতে সব লাইন যোগ করতে হয়। পাতা ভরে গেলে শেষে "জের টানা" হয়, যাতে পরের পাতায় শুধু সেই জের থেকে শুরু করা যায়। ভুল লেখা হলে কাটা হয় না, উল্টো একটা লাইন যোগ হয়।
      - type: visual
        kind: flow
        caption: 'কমান্ড এলে আগের event চালিয়ে অবস্থা জানা, তারপর নতুন event যোগ'
        nodes:
          - {id: client, label: 'কমান্ড', sub: 'টাকা তোলা ৩০০', icon: send, col: 0, row: 1, tip: 'ব্যবহারকারী বা অন্য কোড যা করতে চায়, সেই অনুরোধ।'}
          - {id: agg, label: 'Account', sub: 'aggregate', icon: puzzle, tone: accent, col: 2, row: 0, tip: 'ব্যবসার নিয়মের মালিক। আগের event দেখে ঠিক করে নতুন event বৈধ কি না।'}
          - {id: store, label: 'Event store', sub: 'শুধু যোগ হয়', icon: archive, col: 4, row: 1, tip: 'সব event ক্রমানুসারে সংরক্ষিত। কখনো UPDATE বা DELETE হয় না।'}
        edges:
          - {from: client, to: agg, label: 'কমান্ড Account aggregate-এর কাছে আসে'}
          - {from: store, to: agg, label: 'Account আগের সব event ফিরে পায় (replay)', dashed: true}
          - {from: agg, to: store, label: 'ব্যালেন্স যথেষ্ট থাকলে MoneyWithdrawn event যোগ হয়', tone: good}
      - type: text
        body: |
          ১০,০০০ event-এর একটা Account প্রতিবার লোড করতে ১০,০০০ সারি পড়তে হয়। তাই প্রতি ১০০ event পরপর **snapshot** নেওয়া হয়, মানে সেই মুহূর্তের অবস্থার একটা কপি। পরের বার সর্বশেষ snapshot তুলে শুধু তার পরের event চালানো হয়: ১০০-র কম, ১০,০০০ নয়।
    aside:
      - type: terms
        items:
          - {term: 'Aggregate', meaning: 'যে জিনিসের নিয়ম একসাথে রক্ষা করা হয়, যেমন একটা Account।'}
          - {term: 'Snapshot', meaning: 'কোনো মুহূর্তে aggregate-এর অবস্থার সংরক্ষিত কপি, replay ছোট করার জন্য।'}
      - type: remember
        body: 'ঘটনা যোগ হয়, বদলায় না। ভুল শোধরাতে উল্টো ঘটনা।'
    check:
      q: 'Snapshot না থাকলেও কি অবস্থা ঠিক থাকে? তাহলে snapshot কেন নেওয়া হয়?'
      a: 'হ্যাঁ, সব event replay করলেই অবস্থা মেলে। Snapshot শুধু গতির জন্য: অনেক event হলে প্রতিবার সবটা না চালিয়ে শেষ snapshot থেকে শুরু করা যায়।'

  - slug: store-and-aggregate
    title: 'Event store আর aggregate কোডে'
    kind: howto
    tldr: 'event_store টেবিলের (aggregate_id, version) primary key দিয়ে সমান্তরাল লেখা আটকান; aggregate fromHistory() দিয়ে event চালিয়ে অবস্থা বানায় আর নতুন event জমা রাখে।'
    keywords: ['event store table', 'optimistic concurrency', 'aggregate', 'Doctrine DBAL', 'fromHistory', 'version']
    blocks:
      - type: visual
        kind: table
        caption: 'event_store টেবিলের কলাম'
        headers: ['কলাম', 'কাজ']
        rows:
          - cells: ['aggregate_id', 'কোন Account-এর event']
            tip: 'একই aggregate-এর সব event একই id-তে জমা হয়, তাই একসাথে পড়া যায়।'
          - cells: ['version (১, ২, ৩…)', 'ঐ aggregate-এ event-এর ক্রম']
            tip: '(aggregate_id, version) primary key। একই version দুইবার ঢোকানো যায় না — সমান্তরাল লেখার সুরক্ষা।'
          - cells: ['type, schema_v', 'event-এর নাম আর কাঠামোর সংস্করণ']
            tip: 'schema_v না রাখলে পুরনো event পরে বদলাতে গেলে বোঝা যায় না কোনটা কোন কাঠামোর।'
          - cells: ['payload (JSON), occurred_at', 'তথ্য আর সময়']
            tip: 'event-এর আসল তথ্য। occurred_at ডেটাবেসে ডিফল্ট now()। এই সারি কখনো UPDATE বা DELETE হয় না।'
      - type: code
        lang: php
        file: 'src/Account/Account.php'
        variant: good
        code: |
          final class Account
          {
              private int $balance = 0;
              private int $version = 0;
              private array $pending = [];

              public static function fromHistory(iterable $events): self
              {
                  $a = new self();
                  foreach ($events as $e) { $a->apply($e); }     // শুধু অবস্থা বানায়

                  return $a;
              }

              public function withdraw(int $amount): void
              {
                  if ($amount > $this->balance) {
                      throw new InsufficientFunds($this->balance);
                  }
                  $this->apply($e = new MoneyWithdrawn($amount));
                  $this->pending[] = $e;                         // সংরক্ষণের অপেক্ষায়
              }

              private function apply(object $e): void
              {
                  match ($e::class) {
                      MoneyDeposited::class => $this->balance += $e->amount,
                      MoneyWithdrawn::class => $this->balance -= $e->amount,
                  };
                  ++$this->version;
              }
          }
        marks:
          - {line: 10, tip: 'অতীতের event থেকে অবস্থা পুনর্গঠন। এখানে কোনো নিয়ম খাটানো হয় না, কারণ event আগেই ঘটে গেছে।'}
          - {line: 17, tip: 'নিয়ম খাটে নতুন কমান্ডের সময়: ব্যালেন্সের চেয়ে বেশি তোলা যাবে না।'}
          - {line: 21, tip: 'নতুন event এখনো সংরক্ষিত নয়; pending তালিকায় রাখা হলো।'}
      - type: code
        lang: php
        file: 'src/Account/EventStore.php'
        variant: good
        code: |
          public function append(Uuid $id, int $expectedVersion, array $events): void
          {
              try {
                  $this->db->transactional(function () use ($id, $expectedVersion, $events): void {
                      foreach (array_values($events) as $i => $e) {
                          $this->db->insert('event_store', [
                              'aggregate_id' => $id->toRfc4122(),
                              'version' => $expectedVersion + $i + 1,
                              'type' => $e::class,
                              'schema_v' => 1,
                              'payload' => $this->serializer->serialize($e, 'json'),
                          ]);
                      }
                  });
              } catch (UniqueConstraintViolationException) {
                  throw new ConcurrentModification($id);   // অন্য কেউ আগে লিখেছে
              }
          }
        marks:
          - {line: 8, tip: 'expectedVersion হলো পড়ার সময় যে version দেখেছিলেন। এর পর থেকেই লেখা শুরু।'}
          - {line: 15, tip: 'দুজন একসাথে একই version-এ লিখতে গেলে primary key একজনকে আটকায়। lock ছাড়াই optimistic concurrency।'}
    aside:
      - type: story
        title: 'একই সময়ে দুই তোলা'
        body: |
          রিনা আর তার স্বামী দুজনেই ৫০০ ব্যালেন্সে ৩০০ তোলার বোতাম চাপলেন। দুজনেই version ৫ পড়েন, দুজনেই দেখেন ৩০০ তোলা চলে, দুজনেই version ৬ লিখতে যান। Primary key না থাকলে দুটোই সংরক্ষিত হতো, ব্যালেন্স হতো -১০০। থাকলে দ্বিতীয় লেখা ব্যর্থ হয়, কমান্ড নতুন অবস্থায় (ব্যালেন্স ২০০) আবার চলে, আর InsufficientFunds পায়।
      - type: tips
        items:
          - 'Event-এর নাম অতীত কালে: `MoneyWithdrawn`, `OrderShipped`। ঘটে গেছে বলেই এগুলো বদলানো যায় না।'
          - 'ConcurrentModification-এ কমান্ডটা আবার পড়ে নতুন করে চেষ্টা করুন, কারণ ব্যালেন্স হয়তো এর মধ্যে বদলেছে।'
      - type: refs
        items:
          - {to: 'concurrency/locking', label: 'Optimistic locking'}
    check:
      q: 'দুজন একই সময়ে একই Account-এ version ৫ লিখতে গেলে কী ঘটে, আর কেন সেটা ভালো?'
      a: 'Primary key (aggregate_id, version) একজনকে আটকায়, সে ConcurrentModification পায়। ভালো, কারণ দুজনের একজন এমন ব্যালেন্সের ওপর কাজ করছিল যা ইতিমধ্যে বদলেছে।'

  - slug: snapshots-in-code
    title: 'কোডে snapshot: দ্রুত লোড, কম replay'
    kind: howto
    tldr: 'প্রতি ১০০ event-এ অবস্থা সংরক্ষণ; load() সর্বশেষ snapshot তুলে শুধু তার পরের event চালায়। দাম: আরেকটা টেবিল, আর নিয়ম বদলালে snapshot ফেলতে হয়।'
    keywords: ['snapshot', 'load aggregate', 'restore', 'replay', 'snapshot interval', 'স্ন্যাপশট']
    blocks:
      - type: text
        body: |
          Snapshot না থাকলে ১০,০০০ event-এর একটা Account লোড করতে প্রতিবার ১০,০০০ সারি পড়তে হয়। প্রতি ১০০ event-এ একটা snapshot থাকলে `load()` পড়ে একটা snapshot-সারি আর ১০০-র কম পরের event। Snapshot শুধু শর্টকাট: মুছে ফেললেও event থেকে ঠিক অবস্থা পাওয়া যায়।
      - type: code
        lang: php
        file: 'src/Account/AccountRepository.php'
        variant: good
        code: |
          public function load(Uuid $id): Account
          {
              $snap = $this->db->fetchAssociative(
                  'SELECT version, balance FROM account_snapshot WHERE aggregate_id = ?',
                  [$id->toRfc4122()],
              ) ?: ['version' => 0, 'balance' => 0];

              $later = $this->store->eventsAfter($id, (int) $snap['version']);

              return Account::restore((int) $snap['balance'], (int) $snap['version'], $later);
          }

          public function saveSnapshot(Uuid $id, Account $a): void     // প্রতি ১০০তম event-এ
          {
              $this->db->executeStatement(
                  'INSERT INTO account_snapshot (aggregate_id, version, balance) VALUES (?, ?, ?)
                   ON CONFLICT (aggregate_id) DO UPDATE
                   SET version = EXCLUDED.version, balance = EXCLUDED.balance',
                  [$id->toRfc4122(), $a->version(), $a->balance()],
              );
          }
        marks:
          - {line: 8, tip: 'শুধু snapshot-এর পরের version-এর event পড়া হয়: ১০,০০০ নয়, ১০০-র কম সারি।'}
          - {line: 10, tip: 'restore() সংরক্ষিত balance আর version থেকে শুরু করে, তারপর পরের event চালায়।'}
          - {line: 13, tip: '১০০-র গুণিতক version-এ append সফল হলে এটা ডাকুন। ব্যর্থ হলেও কিছু হারায় না: event-ই সত্য।'}
      - type: code
        lang: php
        file: 'src/Account/Account.php (যোগ)'
        variant: good
        code: |
          public static function restore(int $balance, int $version, iterable $later): self
          {
              $a = new self();
              $a->balance = $balance;
              $a->version = $version;
              foreach ($later as $e) { $a->apply($e); }    // আগের সেই apply()-ই

              return $a;
          }
      - type: points
        title: 'এর দাম'
        style: cross
        items:
          - 'আরেকটা টেবিল, আর তাকে হালনাগাদ রাখার কোড।'
          - '`apply()`-এর নিয়ম বদলালে পুরনো snapshot ভুল হয়ে যায়: মুছে event থেকে আবার বানান।'
          - 'প্রতি aggregate-এ কয়েকশো event-এর কম হলে replay-ই দ্রুত: snapshot লাগে না।'
    aside:
      - type: tips
        items:
          - 'চাইলে snapshot ব্যাকগ্রাউন্ড job-এ নিন। এটা event যা বলে, তারই একটা cache মাত্র।'
    check:
      q: 'একটা Account-এ ১০,০০০ event, আর সর্বশেষ snapshot version ৯,৯০০-তে। `load()` কয়টা event replay করে?'
      a: '১০০টা: শুধু ৯,৯০০-র পরের version-এর event। Snapshot-এ ৯,৯০০ পর্যন্ত অবস্থা আগেই আছে, তাই সেগুলো আবার চালানো বৃথা।'

  - slug: projections-lag
    title: 'পড়ার জন্য আলাদা টেবিল: projection ও দেরি'
    kind: howto
    tldr: 'CQRS-এ লেখার মডেল আর পড়ার মডেল আলাদা; projector event শুনে read model আপডেট করে, তাই read model কিছুটা পিছিয়ে থাকে (eventual consistency) আর UI-কে তা সামলাতে হয়।'
