        code: |
          final class MoneyDepositedUpcaster
          {
              public function upcast(array $payload, int $schemaV): array
              {
                  if (1 === $schemaV) {            // v1-এ currency ছিল না: সবই টাকা
                      $payload['currency'] = 'BDT';
                      $schemaV = 2;
                  }
                  // v2 → v3 এলে আরেকটা if এখানে

                  return $payload;                 // সবসময় সর্বশেষ কাঠামোয়
              }
          }
        marks:
          - {line: 5, tip: 'পুরনো schema_v দেখে ধাপে ধাপে নতুনে তোলা হয়। মূল event ডেটাবেসে অপরিবর্তিত থাকে।'}
          - {line: 11, tip: 'aggregate সবসময় সর্বশেষ কাঠামো পায়, তাই তার কোডে পুরনো সংস্করণের চিন্তা ঢোকে না।'}
      - type: quote
        body: 'যদি শুধু বর্তমান মানই দরকার হয়, event sourcing বাড়তি বোঝা। ইতিহাসই যখন মূল পণ্য, তখনই এর দাম পোষায়।'
    aside:
      - type: when
        use: ['অডিট ও ইতিহাস আইনত বা ব্যবসায়ে জরুরি (লেজার, বিমা)', 'বিভিন্ন রকম read model দরকার, বা অতীতের অবস্থা দেখা দরকার']
        avoid: ['সাধারণ CRUD (প্রোফাইল, ব্লগ, সেটিংস)', 'টিম ছোট আর এই জটিলতা সামলানোর সময় নেই']
      - type: tips
        items:
          - 'পুরো সিস্টেমে নয়, শুধু যে অংশে ইতিহাস মূল (যেমন ledger), সেখানে ব্যবহার করুন। বাকিটা CRUD-ই রাখুন।'
          - 'শুধু audit trail লাগলে CRUD টেবিলের পাশে শুধু-যোগ-হয় `account_history` টেবিল অনেক সস্তা। event-ই যখন অবস্থা চালায়, তখনই event sourcing।'
          - 'ব্যক্তিগত তথ্য event-এ রাখবেন না: customer id রাখুন, তথ্য থাকুক মোছা যায় এমন সাধারণ টেবিলে। নইলে আইনি মুছে ফেলার দায় (GDPR) মেটানো যাবে না।'
    check:
      q: 'আগের event বদলানো যায় না, তাহলে event-এর কাঠামো বদলালে পুরনো event কীভাবে নতুন কোডে চলে?'
      a: 'পড়ার সময় upcaster পুরনো schema_v-র event-কে সর্বশেষ কাঠামোয় রূপান্তর করে দেয়। ডেটাবেসের মূল event অপরিবর্তিত থাকে, কিন্তু upcaster-এর কোড বছরের পর বছর জমে।'

flashcards:
  - q: 'Event sourcing কী?'
    a: 'বর্তমান অবস্থা সরাসরি না রেখে অতীতের সব ঘটনা (event) অপরিবর্তনীয়ভাবে রাখা, আর অবস্থা সেগুলো থেকে বের করা।'
    more: |
      ব্যাংকের খাতার মতো: ব্যালেন্স আলাদা করে লেখা থাকে না, জমা আর তোলার লাইনগুলো যোগ করলে ব্যালেন্স পাওয়া যায়। ফলে কেন এই ব্যালেন্স, তার উত্তর পুরোটাই খাতায় আছে।
    ref: why-is-it-200
  - q: 'Event store-এ কেন কখনো UPDATE বা DELETE করা হয় না?'
    a: 'Event মানে অতীতে ঘটে যাওয়া ঘটনা, যা বদলায় না। ভুল শোধরাতে উল্টো একটা নতুন event যোগ করা হয়।'
    more: |
      সারি বদলালে ইতিহাস মিথ্যা হয়ে যায়, আর সেই ইতিহাসের ওপর দাঁড়ানো সব projection ভুল হবে। তাই খাতার মতোই শুধু নিচে নতুন লাইন যোগ হয়।
    ref: baki-khata-replay
  - q: 'Replay কী, আর snapshot কেন লাগে?'
    a: 'Replay মানে সব event ক্রমানুসারে চালিয়ে অবস্থা বানানো। Snapshot হলো সেই অবস্থার সংরক্ষিত কপি, যাতে সব event না চালিয়ে শেষ snapshot থেকে শুরু করা যায়।'
    more: |
      হাজার হাজার event হলে প্রতিবার replay ধীর। প্রতি ১০০ বা ১,০০০ event-এ snapshot নিলে পরের লোড শুধু সর্বশেষ snapshot আর তার পরের অল্প event চালালেই হয়। Snapshot শুধু গতির জন্য; হারালেও event থেকে আবার বানানো যায়।
    ref: baki-khata-replay
  - q: 'Event store-এ optimistic concurrency কীভাবে কাজ করে?'
    a: '(aggregate_id, version)-এ primary key। একই version-এ দুজন লিখতে গেলে একজন constraint violation পায় এবং কমান্ড আবার চেষ্টা করে।'
    more: |
      প্রতিটা লেখক নিজের পড়া version-এর পরের version-এ লেখে। কেউ আগে লিখে ফেললে ঐ version দখল হয়ে যায়, তাই দ্বিতীয়জন ব্যর্থ হয়। এতে lock ছাড়াই নিশ্চিত হয় যে প্রতিটা সিদ্ধান্ত সর্বশেষ অবস্থার ওপর নেওয়া।
    ref: store-and-aggregate
  - q: 'Projection বা read model কী?'
    a: 'Event থেকে বানানো একটা পড়ার-উপযোগী টেবিল (যেমন account_balance), যা দ্রুত query-র জন্য। এটা ফেলে দিয়ে event থেকে আবার বানানো যায়।'
    more: |
      Event store সত্যের উৎস, কিন্তু পড়ার জন্য অসুবিধাজনক। একটা projector event শুনে সহজ টেবিল আপডেট করে। প্রয়োজনে নতুন projection বানিয়ে শুরু থেকে সব event replay করে নতুন ধরনের read model পাওয়া যায়।
    ref: projections-lag
  - q: 'CQRS কী, আর event sourcing-এর সাথে এর সম্পর্ক কী?'
    a: 'CQRS মানে লেখার মডেল আর পড়ার মডেল আলাদা করা। Event sourcing-এ লেখা হয় event store-এ, পড়া হয় projection থেকে।'
    more: |
      CQRS আর event sourcing আলাদা ধারণা; একটা ছাড়া অন্যটা চলে। কিন্তু event sourcing-এ পড়ার জন্য projection লাগে বলে দুটো প্রায়ই একসাথে আসে। [[thinking/event-driven-cqrs|CQRS-এর মূল ধারণা]] আলাদা segment-এ আছে।
    ref: projections-lag
  - q: 'Read model-এ eventual consistency বলতে কী বোঝায়?'
    a: 'Event লেখার সাথে সাথে read model আপডেট হয় না, কিছু পরে হয়। তাই লেখার ঠিক পরে পড়লে পুরনো মান দেখা যেতে পারে।'
    more: |
      UI-তে এটা সামলাতে: লেখার উত্তরে পাওয়া version নিয়ে read model সেই version-এ না পৌঁছানো পর্যন্ত অপেক্ষা করুন, বা অ্যাপে নিজের হিসাবের মান দেখান। কিছুক্ষণ পরে ঠিক মান ফিরে আসে।
    ref: projections-lag
  - q: 'Upcasting কী, আর কেন এটা event sourcing-এর বড় খরচ?'
    a: 'পুরনো event-কে পড়ার সময় নতুন কাঠামোয় রূপান্তর করা। Event বদলানো যায় না, তাই কাঠামো বদলালেই upcaster জমতে থাকে।'
    more: |
      একটা event-এর কাঠামো বছরে একবার বদলালে পাঁচ বছরে পাঁচ ধাপের upcaster জমে। প্রতিটা পরীক্ষা করতে ও রাখতে হয়। তাই event-এর নকশা আগে ভালো করে ভাবা দরকার, আর বদলানোর খরচ হিসাবে ধরা দরকার।
    ref: worth-it-and-upcasting
  - q: 'কোন ক্ষেত্রে event sourcing বেছে নেওয়া উচিত নয়?'
    a: 'সাধারণ CRUD-তে, যেখানে শুধু বর্তমান মান দরকার আর ইতিহাস মূল চাহিদা নয়। জটিলতার দাম তখন পোষায় না।'
    more: |
      Event sourcing-এ projection, replay, snapshot আর upcasting-এর জটিলতা আসে। তাই ব্যাংকের লেজার বা অডিট-নির্ভর অংশে লাগান, আর বাকি অংশ সাধারণ CRUD রাখুন। পুরো সিস্টেমে ছড়ানো সাধারণত ভুল সিদ্ধান্ত।
    ref: worth-it-and-upcasting

  - q: 'Snapshot আছে এমন aggregate কীভাবে লোড হয়?'
    a: 'সর্বশেষ snapshot পড়ে শুধু তার চেয়ে বড় version-এর event চালানো হয়। ১০,০০০-এর মধ্যে ৯,৯০০-তে snapshot থাকলে চালাতে হয় ১০০টা, ১০,০০০ নয়।'
    more: |
      Snapshot শর্টকাট, সত্য নয়। হারিয়ে গেলে বা `apply()`-এর নিয়ম বদলালে সেটা মুছে event থেকে আবার বানাতে হয়। প্রতি aggregate-এ মাত্র কয়েকশো event থাকলে replay-ই যথেষ্ট দ্রুত, তখন snapshot বাদ দেওয়া যায়।
    ref: snapshots-in-code

quiz:
  - q: 'কোন পরিস্থিতিতে event sourcing সবচেয়ে বেশি যুক্তিসঙ্গত?'
