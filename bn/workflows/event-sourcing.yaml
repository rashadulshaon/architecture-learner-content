  - q: 'নিচের event store কোডে কোন কারণে দুইজন একই সময়ে লিখলেও দুটো event একই version পাবে না?'
    lang: sql
    code: |
      CREATE TABLE event_store (
        aggregate_id uuid        NOT NULL,
        version      int         NOT NULL,
        type         varchar(80) NOT NULL,
        payload      jsonb       NOT NULL,
        PRIMARY KEY (aggregate_id, version)
      );
    hint: 'দুই সারি একই primary key-তে ঢুকতে পারে কি?'
    options:
      - text: '(aggregate_id, version) primary key একই জোড়ার দ্বিতীয় সারি ঢুকতে দেয় না'
        correct: true
        why: 'ডেটাবেস নিজেই একজনকে আটকায়, আর সে ConcurrentModification পায়।'
      - text: '`jsonb` কলাম একই মান দুইবার সংরক্ষণ করে না'
        correct: false
        why: 'payload-এর সাথে এর কোনো সম্পর্ক নেই।'
      - text: '`uuid` টাইপ আপনা-আপনি version বাড়ায়'
        correct: false
        why: 'uuid শুধু একটা পরিচয়; version বাড়ানো আমাদের কোডের দায়িত্ব।'
      - text: 'কোনো কিছুই আটকায় না, দুই সারিই সংরক্ষিত হবে'
        correct: false
        why: 'primary key ঠিক সেটাই আটকায়।'
    ref: store-and-aggregate
  - q: 'Account aggregate-এ `fromHistory()` আর `withdraw()`-এর ভূমিকা সঠিকভাবে কোনগুলো?'
    hint: 'অতীতের event-এ কি নিয়ম খাটানো হয়?'
    options:
      - text: '`fromHistory()` অতীতের event চালিয়ে অবস্থা বানায়, নিয়ম খাটায় না'
        correct: true
        why: 'event আগেই ঘটে গেছে, তাই তা বৈধ কি না আবার যাচাই করার কিছু নেই।'
      - text: '`withdraw()` ব্যালেন্সের নিয়ম দেখে নতুন event pending-এ রাখে'
        correct: true
        why: 'নিয়ম খাটে নতুন কমান্ডের সময়, আর ফল হিসেবে event জন্মায়।'
