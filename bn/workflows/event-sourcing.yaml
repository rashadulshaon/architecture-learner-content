      - type: text
        body: |
          পুরনো event কখনো বদলানো যায় না, কিন্তু কাঠামো বদলায়: ধরুন আগে `MoneyDeposited`-এ শুধু `amount` ছিল, এখন `currency`-ও লাগে। পড়ার সময় পুরনো event-কে নতুন কাঠামোয় রূপান্তরের কোডকে বলে **upcaster**। ভবিষ্যতে এই কোড জমতে থাকে, এটাই event sourcing-এর সবচেয়ে বড় লুকানো খরচ।
