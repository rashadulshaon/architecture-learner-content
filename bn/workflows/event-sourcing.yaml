      a: 'Bug নয়, eventual consistency: read model একটু পরে আপডেট হয়। লেখার উত্তরে পাওয়া version দিয়ে read model সেই version পর্যন্ত না পৌঁছানো অবধি অপেক্ষা বা নিজের হিসাবের মান দেখানো যায়।'

  - slug: worth-it-and-upcasting
