slides:
  - slug: checkout-calls-everyone
    title: 'চেকআউট যখন সবাইকে ডেকে বেড়ায়'
    kind: story
    tldr: 'একটা কাজ শেষে যদি আপনি নিজেই বাকি সবাইকে একে একে ডাকেন, নতুন কিছু যোগ করতে চেকআউটে হাত পড়ে, আর একজন ধীর হলে সবাই ধীর।'
    keywords: ['coupling', 'synchronous calls', 'orchestration', 'ডাকাডাকি', 'ধীর নির্ভরতা', 'checkout']
    blocks:
      - type: metaphor
        icon: school
        title: 'প্রধান শিক্ষকের ঘরে ঘরে ঘোষণা'
        body: |
          স্কুলে ছুটির খবর দিতে প্রধান শিক্ষক প্রতিটা ক্লাসে গিয়ে একে একে জানান। নতুন একটা ক্লাস খুললে তাঁকে মনে রাখতে হয় সেখানেও যেতে। আর একটা ক্লাসে আটকে গেলে বাকি ক্লাস অপেক্ষা করে। এখানে প্রধান শিক্ষক হলো চেকআউট কোড, আর ক্লাসগুলো হলো Inventory, ইমেইল আর Loyalty।
      - type: visual
        kind: flow
        caption: 'চেকআউট নিজেই তিন জায়গায় ডাকে, একজন ফেল করলে সবাই ফেল'
        nodes:
          - {id: checkout, label: 'Checkout', sub: 'অর্ডার নেওয়ার কোড', icon: cart, tone: accent, col: 0, row: 1, tip: 'অর্ডার নেওয়াই তার আসল কাজ, কিন্তু সে বাকি সবার খবর রাখতে বাধ্য হয়েছে।'}
          - {id: inv, label: 'Inventory', sub: 'stock কমায়', icon: box, col: 2, row: 0, tip: 'অর্ডার হলে stock বদলাতে হয়। চেকআউট নিজেই তাকে ডাকে।'}
          - {id: mail, label: 'ইমেইল সার্ভিস', sub: 'রসিদ পাঠায়', icon: mail, col: 2, row: 1, tip: 'ধীর হতে পারে, বন্ধও থাকতে পারে। তবু চেকআউট তার জন্য অপেক্ষা করে।'}
          - {id: loyal, label: 'Loyalty', sub: 'পয়েন্ট যোগ করে', icon: star, tone: bad, col: 2, row: 2, tip: 'কম গুরুত্বপূর্ণ ফিচার, কিন্তু এর ধীরতা বা ভাঙন পুরো অর্ডার আটকে দেয়।'}
        edges:
          - {from: checkout, to: inv, label: 'চেকআউট নিজে Inventory-কে ডাকে'}
          - {from: checkout, to: mail, label: 'তারপর ইমেইল সার্ভিসকে ডাকে'}
          - {from: checkout, to: loyal, label: 'তারপর Loyalty-কে ডাকে', tone: warn}
          - {from: loyal, to: checkout, label: 'Loyalty ফেল করলে অর্ডারই আটকে যায়', tone: bad, dashed: true}
      - type: text
        body: |
          ব্যবসা এখন চায় "অর্ডার হলে analytics-কেও জানাও"। চেকআউট ফাইল আবার খুলতে হবে, আবার test করতে হবে। কাজ বাড়ে, আর প্রতিবার ঝুঁকি বাড়ে। গ্রাহকের অপেক্ষাও যোগ করুন: Inventory ৫০ ms, ইমেইল সার্ভিস ৮০০ ms, খারাপ দিনে Loyalty ৩ সেকেন্ড। অনেক আগে সেভ হয়ে যাওয়া অর্ডারের জন্য গ্রাহক প্রায় ৪ সেকেন্ড ঘুরন্ত চাকার দিকে তাকিয়ে থাকে।
    aside:
      - type: problem
        body: 'যে কাজ শেষ করে সে যদি সবাইকে নিজে ডাকে, তাহলে সবাই তার সাথে বাঁধা: নতুন কিছু যোগ করা কঠিন, আর একজনের ধীরতা সবার ধীরতা।'
    check:
      q: 'Analytics যোগ করতে চেকআউট ফাইল খুলতে হচ্ছে কেন, আর এটা সমস্যা কেন?'
      a: 'কারণ চেকআউট সবাইকে নিজে ডাকে। নতুন কিছু মানেই আবার মূল কোডে হাত, আর অর্ডারের মতো গুরুত্বপূর্ণ কাজে প্রতিবার ঝুঁকি।'

  - slug: events-as-notices
    title: 'Event-driven: নোটিশ বোর্ডে ঝুলিয়ে দিন'
    kind: concept
    tldr: 'Event-driven মানে কাজ শেষ হলে শুধু "কী ঘটেছে" ঘোষণা করা; যার দরকার সে নিজে শুনে নিজের কাজ করে, ঘোষকের তাদের খবর রাখতে হয় না।'
    keywords: ['event-driven architecture', 'domain event', 'publish subscribe', 'নোটিশ বোর্ড', 'decoupling', 'pub/sub']
    blocks:
      - type: text
        body: |
          এবার প্রধান শিক্ষক নোটিশ বোর্ডে লিখে দিলেন: "কাল ছুটি।" যার দরকার সে বোর্ড দেখে নিজের কাজ করে — ক্লাস টিচার অভিভাবকদের জানায়, অফিস রুটিন বদলায়। নতুন ক্লাস খুললে প্রধান শিক্ষকের কিছু করতে হয় না। সফটওয়্যারে এই নোটিশের নাম **event**: অতীতকালে লেখা একটা তথ্য, যেমন `OrderPlaced`, যা বলে "ঘটনাটা ঘটে গেছে।"
      - type: visual
        kind: flow
        caption: 'Sales শুধু ঘোষণা করে, শ্রোতারা নিজেদের কাজ নিজেরা করে'
        nodes:
          - {id: sales, label: 'Sales', sub: 'অর্ডার নেয়', icon: cart, tone: accent, col: 0, row: 1, tip: 'শুধু নিজের কাজ করে, আর শেষে একটা ঘোষণা দেয়। কে শুনছে সে জানে না।'}
          - {id: event, label: 'OrderPlaced', sub: 'ঘটে-যাওয়া ঘটনা', icon: megaphone, tone: warn, col: 1.5, row: 1, tip: 'নোটিশ বোর্ড। নাম অতীতকালে, কারণ এটা তথ্য, আদেশ নয়।'}
          - {id: inv, label: 'Inventory', sub: 'নিজে শোনে', icon: box, col: 3, row: 0, tip: 'ঘোষণা শুনে নিজে stock আলাদা করে রাখে।'}
          - {id: mail, label: 'Notification', sub: 'নিজে শোনে', icon: mail, col: 3, row: 1, tip: 'ঘোষণা শুনে নিজে ইমেইল পাঠায়। ইমেইল ফেল করলে Sales-এর কিছু যায় আসে না।'}
          - {id: loyal, label: 'Loyalty', sub: 'নিজে শোনে', icon: star, col: 3, row: 2, tip: 'ঘোষণা শুনে নিজে পয়েন্ট দেয়। নতুন এমন শ্রোতা যোগ করতে Sales-এ হাত দিতে হয় না।'}
        edges:
          - {from: sales, to: event, label: 'Sales ঘোষণা করে: অর্ডার হয়েছে'}
          - {from: event, to: inv, label: 'Inventory ঘোষণা শুনে stock আলাদা করে'}
          - {from: event, to: mail, label: 'Notification শুনে ইমেইল পাঠায়'}
          - {from: event, to: loyal, label: 'Loyalty শুনে পয়েন্ট যোগ করে'}
      - type: quote
        body: 'Event মানে অতীতের সত্য: "অর্ডার হয়েছে", আদেশ নয়: "ইমেইল পাঠাও"।'
      - type: text
        body: |
          এবার গ্রাহকের অপেক্ষা গুনুন। আগে: ৫০ ms + ৮০০ ms + ৩ সেকেন্ড, প্রায় ৪ সেকেন্ড। এখন: শুধু অর্ডার সেভ, প্রায় ৫০ ms। তিনটা কাজ পেছনে চলে worker-এ (আলাদা একটা প্রোগ্রাম, যে কাজ তুলে নিয়ে করে), আর কোনোটা ব্যর্থ হলে কেউ ঘুরন্ত চাকা না দেখেই আবার চেষ্টা হয়।
    aside:
      - type: terms
        items:
          - {term: 'Event', meaning: 'অতীতকালে লেখা ঘটনা (OrderPlaced), যা ঘটে গেছে আর বদলানো যায় না।'}
          - {term: 'Consumer / handler', meaning: 'যে event শুনে নিজের কাজ করে।'}
          - {term: 'Eventual consistency', meaning: 'সব অংশ এখনই মেলে না, কিছুক্ষণ পরে মেলে।'}
      - type: refs
        items:
          - {to: 'messaging/events-vs-commands', label: 'Event আর command-এর পার্থক্য বিস্তারিত'}
    check:
      q: 'Event-driven হলে Loyalty-র নতুন নিয়ম বদলাতে Sales কোডে হাত দিতে হয় কি, আর কেন?'
      a: 'না। Sales শুধু OrderPlaced ঘোষণা করে, কে শুনছে জানে না। Loyalty নিজের handler বদলালেই চলে।'

  - slug: cqrs-split
    title: 'CQRS: লেখার খাতা আর পড়ার ক্যাটালগ'
    kind: concept
    tldr: 'CQRS লেখা (নিয়ম) আর পড়া (গতি)-কে আলাদা মডেলে ভাগ করে। যে তালিকা-পাতায় ২১টা query লাগত, তা হয় একটাই সমতল query।'
    keywords: ['CQRS', 'command query responsibility segregation', 'read model', 'write model', 'denormalized', 'query side']
    blocks:
      - type: metaphor
        icon: book
        title: 'লাইব্রেরির ইস্যু খাতা আর ক্যাটালগ কার্ড'
        body: |
          লাইব্রেরিতে বই দেওয়া-নেওয়া হয় ইস্যু খাতায়, যেখানে নিয়ম কড়া: কার্ড আছে কি না, আগের বই ফেরত এসেছে কি না। কিন্তু পাঠক বই খুঁজতে যায় ক্যাটালগ কার্ডে — বিষয় ধরে সাজানো, দ্রুত খোঁজা যায়। দুটোর কাজ আলাদা, তাই সাজানোও আলাদা। এটাই CQRS: **Command** (লেখা) নিয়ম মানায়, **Query** (পড়া) দ্রুত দেখায়।
      - type: visual
        kind: compare
        caption: 'লেখা নিয়ম পাহারা দেয়; পড়ার শুধু দ্রুত হলেই চলে'
        columns:
          - title: 'Command: লেখার দিক'
            tone: warn
            icon: pencil
            tip: 'এখানে নিয়ম আর invariant গুরুত্বপূর্ণ। গতির চেয়ে সঠিকতা আগে।'
            items:
              - 'অর্ডার নেওয়া, বাতিল, confirm'
              - 'Order object-এ নিয়ম মানা'
              - 'ফেরত দেয় শুধু সফল বা ব্যর্থ'
          - title: 'Query: পড়ার দিক'
            tone: good
            icon: eye
            tip: 'এখানে গতি আর সুবিধা গুরুত্বপূর্ণ। নিয়ম মানানোর কাজ নেই, তাই সরল ও সমতল।'
            items:
              - 'অর্ডারের তালিকা, ড্যাশবোর্ড'
              - 'পাতার জন্য আগে থেকে সাজানো'
              - 'কোনো ডেটা বদলায় না'
      - type: code
        lang: php
        file: 'src/Sales/Query/SlowOrderList.php'
        variant: bad
        code: |
          // এক মডেলে দুই কাজ: তালিকার পাতা ২০টা পুরো Order object গড়ে
          $orders = $this->orders->findBy(
              ['customerId' => $customerId],
              ['placedAt' => 'DESC'],
              20,
          );

          return array_map(fn (Order $o) => [
              'id' => (string) $o->id(),
              'total' => $o->total(), // lines যোগ করে: প্রতি অর্ডারে একটা বাড়তি query
              'status' => $o->status()->value,
          ], $orders);
        marks:
          - {line: 9, tip: 'মোট দাম বের করতে order lines lazy-load হয়। অর্ডারের ১টা query + lines-এর ২০টা = ২০ সারি দেখাতে ২১টা query।'}
      - type: code
        lang: php
        file: 'src/Sales/Query/OrderSummaryQuery.php'
        variant: good
        code: |
          final readonly class OrderSummaryQuery
          {
              public function __construct(private Connection $db)
              {
              }

              /** @return list<array{id: string, total: int, status: string}> */
              public function forCustomer(string $customerId): array
              {
                  return $this->db->fetchAllAssociative(<<<'SQL'
                      SELECT id, total_paisa AS total, status
                      FROM order_summary
                      WHERE customer_id = :customer
                      ORDER BY placed_at DESC
                      LIMIT 20
                      SQL, ['customer' => $customerId]);
              }
          }
        marks:
          - {line: 3, tip: 'Doctrine ORM-এর entity নয়, সরাসরি DBAL Connection। পড়ার জন্য নিয়ম-ভরা object গড়ার ঝামেলা লাগে না।'}
          - {line: 12, tip: 'order_summary হলো আগে থেকে তৈরি সমতল read model, যেখানে join ছাড়াই পাতার দরকারি সব কলাম আছে। ২১টার বদলে একটাই query।'}
      - type: text
        body: |
          দাম: একটা ছোট handler `OrderPlaced` শুনে `order_summary` মিলিয়ে রাখে, আর অর্ডারের পরের একটা মুহূর্ত তালিকায় সেটা না-ও দেখা যেতে পারে। ছোট অ্যাপে একটা সাধারণ query-ই যথেষ্ট; কোনো পাতা মেপে ধীর প্রমাণ হলে তখন ভাগ করুন।
    aside:
      - type: remember
        body: 'CQRS হলো ভাগ করা: লেখার মডেল নিয়মের জন্য, পড়ার মডেল গতির জন্য।'
      - type: tips
        items:
          - 'সবচেয়ে সহজ ধাপ: একই ডেটাবেস, কিন্তু command handler আর query ক্লাস আলাদা। এতেই বেশিরভাগ লাভ মেলে।'
          - 'পরের ধাপ: আলাদা read table, event শুনে হালনাগাদ হয়। তখন eventual consistency আসে।'
    check:
      q: 'CQRS-এ পড়ার দিক কেন নিয়ম-ভরা Order object না গড়ে সরাসরি সমতল table পড়ে?'
      a: 'পড়ার সময় কোনো নিয়ম মানাতে হয় না। সমতল, আগে সাজানো table থেকে সরাসরি পড়লে join আর object-গড়ার খরচ বাঁচে, তাই দ্রুত হয়।'

  - slug: events-in-symfony
    title: 'Symfony-তে event আর handler'
    kind: howto
    tldr: 'Messenger-এ আলাদা command.bus ও event.bus বানান, event-কে অতীতকালের ছোট readonly ক্লাস করুন, আর শ্রোতারা #[AsMessageHandler] দিয়ে শোনে।'
    keywords: ['Messenger', 'event bus', 'AsMessageHandler', 'allow_no_handlers', 'domain event', 'async']
    blocks:
      - type: text
        body: |
          প্রথমে দুটো bus আর async transport (event যে queue-তে অপেক্ষা করে)। event bus-এ শ্রোতা না থাকলেও চলবে (`allow_no_handlers`), কারণ ঘোষণা দেওয়ার সময় কে শুনছে তা জানার দরকার নেই। `OrderPlaced`-কে `async`-এ route করলে তার handler-গুলো এমন worker-এ চলে, যা শুরু করতে হয় `php bin/console messenger:consume async` দিয়ে। worker না চললে event শুধু table-এ জমে থাকে।
      - type: code
        lang: yaml
        file: 'config/packages/messenger.yaml'
        code: |
          framework:
            messenger:
              default_bus: command.bus
              buses:
                command.bus: ~
                event.bus:
                  default_middleware:
                    enabled: true
                    allow_no_handlers: true
              transports:
                async:
                  dsn: '%env(MESSENGER_TRANSPORT_DSN)%' # .env: doctrine://default?auto_setup=0
                  retry_strategy: {max_retries: 3, delay: 1000, multiplier: 2}
                failed: 'doctrine://default?queue_name=failed'
              failure_transport: failed
              routing:
                'App\Sales\Event\OrderPlaced': async
        marks:
          - {line: 9, tip: 'event bus-এ কোনো শ্রোতা না থাকলে error নয়। ঘোষণা দিলেই ঘোষকের কাজ শেষ।'}
          - {line: 11, tip: 'async transport: এখানে আপনার ডেটাবেসেই রাখা queue। ৩ বার retry করে, অপেক্ষা ১ সেকেন্ড, ২ সেকেন্ড, ৪ সেকেন্ড।'}
          - {line: 14, tip: 'সব retry-তে ব্যর্থ event এখানে জমে, তাই চুপচাপ হারায় না। messenger:failed:show দিয়ে দেখুন।'}
          - {line: 17, tip: 'OrderPlaced যায় async transport-এ, তাই ঘোষক সাথে সাথে ব্যবহারকারীকে উত্তর দেয়।'}
      - type: code
        lang: php
        file: 'src/Sales + src/Inventory'
        variant: good
        code: |
          final readonly class OrderPlaced
          {
              public function __construct(public string $orderId)
              {
              }
          }

          #[AsMessageHandler(bus: 'command.bus')]
          final readonly class PlaceOrderHandler
          {
              public function __construct(
                  private OrderRepository $orders,
                  private MessageBusInterface $eventBus,
              ) {
              }

              public function __invoke(PlaceOrder $command): void
              {
                  $this->orders->save(Order::place($command->orderId, $command->items));
                  $this->eventBus->dispatch(new OrderPlaced($command->orderId));
              }
          }

          // Inventory: নিজে শোনে, Sales-কে চেনে না
          #[AsMessageHandler(bus: 'event.bus')]
          final readonly class ReserveStockWhenOrderPlaced
          {
              public function __construct(private StockService $stock)
              {
              }

              public function __invoke(OrderPlaced $event): void
              {
                  $this->stock->reserveFor($event->orderId);
              }
          }
        marks:
          - {line: 1, tip: 'নামটা OrderPlaced, PlaceOrder নয়। event তথ্য দেয়, আদেশ দেয় না।'}
          - {line: 20, tip: 'Sales এখানে শুধু ঘোষণা করে। কোন কোন handler আছে সে জানে না, আর জানার দরকারও নেই।'}
          - {line: 26, tip: 'Inventory নিজের handler লিখেছে। নতুন শ্রোতা যোগ করতে Sales ফাইল বদলাতে হয় না।'}
    aside:
      - type: pitfalls
        items:
          - 'event-এ সব ডেটা ঢুকিয়ে বিশাল বানানো। শুধু id আর দরকারি তথ্য রাখুন, বাকিটা শ্রোতা নিজে খুঁজে নেবে।'
          - 'async-এ একই event দুইবার পৌঁছাতে পারে; handler-কে idempotent করতে হবে।'
      - type: refs
        items:
          - {to: 'messaging/delivery-guarantees', label: 'দুইবার পৌঁছানো ও idempotent handler'}
    check:
      q: '"OrderPlaced" নামটা অতীতকালে কেন, "PlaceOrder"-এর মতো আদেশ-ধাঁচে নয়?'
      a: 'Event একটা ঘটে-যাওয়া সত্য, যা শ্রোতারা মানতে বাধ্য নয় কিন্তু জানতে পারে। "PlaceOrder" হলো আদেশ বা command, যার নির্দিষ্ট একজন গ্রাহক থাকে।'

  - slug: event-lost-on-crash
    title: 'সেভ আর ঘোষণার মাঝে ক্র্যাশ করলে event হারায়'
    kind: pitfall
    tldr: 'অর্ডার সেভ করে event dispatch করার আগেই সার্ভার মরলে কোনো ঘোষণা হয় না। event-কে একই database transaction-এ রাখুন, আর worker দিয়ে পাঠান।'
    keywords: ['transactional outbox', 'lost event', 'doctrine_transaction', 'at least once', 'Messenger Doctrine transport', 'ক্র্যাশ']
    blocks:
      - type: text
        body: |
          `PlaceOrderHandler` আবার দেখুন: সে অর্ডার সেভ করে, তারপর `OrderPlaced` dispatch করে। দুই ধাপ, আর মাঝখানে সার্ভার মরতে পারে (deploy, মেমরি শেষ হয়ে কিল)। ৪৮২১ নম্বর অর্ডার সেভ হয়েছে, কিন্তু stock আলাদা হয়নি, ইমেইলও যায়নি। কোথাও error log নেই, কারণ যে লাইনটা ব্যর্থ হলো সেটা চলেইনি।
      - type: visual
        kind: sequence
        caption: 'ভাঙা: অর্ডার সেভ হলো, তারপর process মরল'
        actors:
          - {id: handler, label: 'Order handler', icon: code, tip: 'ওয়েব request-এর ভেতরে চলা PlaceOrderHandler।'}
          - {id: db, label: 'ডেটাবেস', icon: db, tip: 'যেখানে অর্ডারের সারি জমা হয়।'}
          - {id: bus, label: 'Event bus', icon: megaphone, tip: 'যেখানে OrderPlaced পাঠানোর কথা ছিল।'}
        messages:
          - {from: handler, to: db, label: '৪৮২১ নম্বর অর্ডার সেভ'}
          - {from: db, to: handler, label: 'সেভ হয়েছে', dashed: true}
          - {at: handler, note: 'সার্ভার এখানে মরল', tone: bad}
          - {at: bus, note: 'OrderPlaced কখনো গেল না', tone: bad}
      - type: visual
        kind: sequence
        caption: 'ঠিক: event অর্ডারের সাথেই জমা থাকে, worker তা পাঠায়'
        actors:
          - {id: handler, label: 'Order handler', icon: code, tip: 'একই handler, একই কোড।'}
          - {id: db, label: 'ডেটাবেস', icon: db, tip: 'একই connection-এ orders table আর messenger_messages table দুটোই রাখে।'}
          - {id: worker, label: 'Worker', icon: worker, tip: 'messenger:consume দিয়ে চালানো আলাদা process। জমা event পৌঁছে দেয়।'}
        messages:
          - {from: handler, to: db, label: 'এক transaction: অর্ডার সেভ, OrderPlaced জমা', tip: 'দুটো সারিই একই BEGIN ... COMMIT-এর ভেতরে লেখা হয়।'}
          - {at: db, note: 'COMMIT: দুটোই থাকে, নয়তো কোনোটাই নয়', tone: good}
          - {from: worker, to: db, label: 'জমা OrderPlaced তুলে আনে'}
          - {from: db, to: worker, label: 'OrderPlaced', dashed: true}
          - {at: worker, note: 'stock আলাদা, ইমেইল গেল। মরলে message আবার চেষ্টা হয়', tone: good}
      - type: code
        lang: yaml
        file: 'config/packages/messenger.yaml'
        variant: good
        code: |
          framework:
              messenger:
                  buses:
                      command.bus:
                          middleware:
                              - doctrine_transaction
        marks:
          - {line: 6, tip: 'পুরো handler-কে একটা database transaction-এ মোড়ায়। async transport একই connection (doctrine://default) ব্যবহার করে, তাই জমা event অর্ডারের সাথেই commit বা rollback হয়।'}
      - type: text
        body: |
          দাম: delivery হয় অন্তত একবার, তাই handler দুইবার চলতে পারে এবং idempotent হতে হবে। event এখন worker-এর একটু দেরিতে পৌঁছায়। এটা চলে কারণ queue অর্ডারের ডেটাবেসেই; RabbitMQ বা SQS হলে সেভ আর পাঠানো দুটো আলাদা সিস্টেম, তখন আসল outbox table আর একটা relay লাগে। event হারালে ক্ষতি নেই (যেমন analytics), সেখানে সাধারণ dispatch-ই চলে।
    aside:
      - type: commands
        items:
          - {cmd: 'php bin/console messenger:setup-transports', desc: 'messenger_messages table বানায়'}
          - {cmd: 'php bin/console messenger:consume async -vv', desc: 'event পৌঁছানো worker চালু করে'}
          - {cmd: 'php bin/console messenger:failed:show', desc: 'সব retry-তে ব্যর্থ event দেখায়'}
    check:
      q: 'অর্ডারের সাথে একই transaction-এ event রাখলে event হারায় না কেন?'
      a: 'অর্ডার আর event একসাথে commit হয়, নয়তো কোনোটাই হয় না, তাই event ছাড়া সেভ-হওয়া অর্ডার কখনো থাকে না। worker পরে তা পৌঁছে দেয়, ব্যর্থ হলে আবার চেষ্টা করে।'

  - slug: worth-the-cost
    title: 'কখন এর দাম পোষায়, আর দাম কত'
    kind: compare
    tldr: 'Event-driven আর CQRS সীমানা ঢিলা করে ও গতি দেয়, বিনিময়ে debug কঠিন, eventual consistency আর বেশি কোড; দরকার প্রমাণ হলে তবেই নিন।'
    keywords: ['trade-offs', 'eventual consistency', 'complexity', 'when to use CQRS', 'event sourcing', 'খরচ ও লাভ']
    blocks:
      - type: visual
        kind: table
        caption: 'দুই ধারার লাভ, খরচ আর কখন নেবে'
        headers: ['', 'Event-driven', 'CQRS']
        rows:
          - cells: ['কী দেয়', 'ঢিলা সংযোগ, সহজে নতুন শ্রোতা', 'পড়া ও লেখা আলাদাভাবে বাড়ানো ও সাজানো']
            tip: 'দুটোই "আলাদা করার" কৌশল। একটা কাজ থেকে কাজকে, আরেকটা পড়া থেকে লেখাকে।'
          - cells: ['প্রধান খরচ', 'কে কী শুনছে বোঝা ও debug কঠিন', 'দুই মডেল সিঙ্কে রাখা, বেশি কোড']
            tip: 'একটা বাটন চাপলে কোথায় কী ঘটল তা এক জায়গায় আর দেখা যায় না। log আর tracing ছাড়া চলে না।'
          - cells: ['সামঞ্জস্য', 'ফল পরে মেলে (eventual)', 'read model সামান্য পিছিয়ে থাকে']
            tip: 'অর্ডার দেওয়ার পরই তালিকায় না-ও দেখা যেতে পারে। UI-কে সেই অপেক্ষা সামলাতে হয়।'
          - cells: ['নতুন দায়', 'event দুইবার আসা, ক্রম, schema বদল', 'read table হালনাগাদের ভুলে অমিল']
            tip: 'handler-কে idempotent আর event-এর গঠনকে সাবধানে বদলাতে হয়, কারণ অন্য টিম এর ওপর নির্ভর করে।'
          - cells: ['কখন নেবে', 'অনেক পক্ষ একই ঘটনায় কাজ করে', 'পড়ার চাপ লেখার চেয়ে অনেক বেশি']
            tip: 'প্রমাণ থাকা চাই: যেমন চেকআউটে ৫টা শ্রোতা, বা তালিকার query ধীর হয়ে গেছে।'
          - cells: ['কখন নেবে না', 'দুই-তিনটা সরল ধাপের কাজ', 'সরল CRUD, কম ডেটা']
            tip: 'শুরুতেই নিলে বাড়তি জটিলতার দাম দিতে হয়, অথচ লাভ আসে না।'
      - type: points
        title: 'নেওয়ার আগে তিন প্রশ্ন'
        style: check
        items:
          - 'একটা ঘটনায় কি সত্যিই একাধিক পক্ষ আলাদা আলাদা কাজ করে?'
          - 'সরল ধাপ (যেমন একই ডেটাবেসে আলাদা query ক্লাস) কি যথেষ্ট নয়?'
          - 'eventual consistency আর debug-এর খরচ আমাদের টিম সামলাতে পারবে?'
      - type: quote
        body: 'Event-driven আর CQRS বিনা খরচের জাদু নয়। ব্যথা প্রমাণ হলে তবেই নিন।'
    aside:
      - type: when
        use: ['একই ঘটনায় অনেক পক্ষ আলাদা কাজ করে', 'পড়ার চাপ আর লেখার চাপ ভিন্ন গতিতে বাড়ে']
        avoid: ['সরল CRUD অ্যাপ, ছোট টিম', 'তাৎক্ষণিক সামঞ্জস্য অপরিহার্য (যেমন ব্যালেন্স)']
      - type: story
        title: 'Event sourcing আলাদা জিনিস'
        body: |
          অনেকে ভাবে CQRS মানেই event sourcing। না: event sourcing মানে ডেটা রাখা হয় ঘটনার তালিকা হিসেবে, বর্তমান অবস্থা হিসেবে নয়। CQRS ও event-driven একা একাই ব্যবহার করা যায়। event sourcing-এর বিস্তারিত: [[workflows/event-sourcing|Event sourcing]]।
      - type: refs
        items:
          - {to: 'messaging/events-vs-commands', label: 'Event vs command'}
          - {to: 'workflows/event-sourcing', label: 'Event sourcing'}
    check:
      q: 'ছোট একটা CRUD অ্যাপে কেন CQRS আর event-driven বসানো ঠিক নয়?'
      a: 'কারণ লাভের জায়গা নেই (একটাই পক্ষ, কম চাপ), অথচ eventual consistency, বেশি কোড আর debug-এর খরচ প্রথম দিন থেকেই দিতে হয়।'

flashcards:
  - q: 'Event-driven architecture কী?'
    a: 'কাজ শেষে শুধু ঘটনা (event) ঘোষণা করা; যার দরকার সে নিজে শুনে নিজের কাজ করে।'
    more: |
      নোটিশ বোর্ডের মতো: প্রধান শিক্ষক ঘোষণা টাঙান, কে পড়বে তা জানেন না। ফলে ঘোষকের কাজ সরল, নতুন শ্রোতা যোগ করতে তাঁর কোডে হাত লাগে না, আর একজন শ্রোতার ভাঙন তাঁকে আটকায় না।
    ref: events-as-notices
  - q: 'Event আর command-এর মূল পার্থক্য কী?'
    a: 'Event অতীতের ঘটে-যাওয়া সত্য (OrderPlaced); command ভবিষ্যতের আদেশ (PlaceOrder), যার নির্দিষ্ট একজন গ্রাহক থাকে।'
    more: |
      Event কাউকে কিছু করতে বাধ্য করে না; যে শুনতে চায় সে শোনে। Command একজন নির্দিষ্ট handler-কে কাজ করতে বলে, আর ফল জানতে চাইতে পারে। বিস্তারিত: [[messaging/events-vs-commands|event vs command]]।
    ref: events-as-notices
  - q: 'CQRS বলতে কী বোঝায়?'
    a: 'Command (লেখা) আর Query (পড়া)-কে আলাদা মডেলে ভাগ করা, যাতে প্রতিটা নিজের কাজের জন্য সাজানো যায়।'
    more: |
      লাইব্রেরিতে ইস্যু খাতা (নিয়ম) আর ক্যাটালগ কার্ড (গতি) আলাদা। CQRS-এও লেখার মডেল নিয়ম মানায়, পড়ার মডেল দ্রুত ও সমতল। সবচেয়ে সরল রূপ: একই ডেটাবেস, কিন্তু command handler আর query ক্লাস আলাদা।
    ref: cqrs-split
  - q: 'CQRS আর event sourcing কি এক?'
    a: 'না। CQRS হলো পড়া-লেখা ভাগ; event sourcing হলো ঘটনার তালিকাকে আসল ডেটা হিসেবে রাখা। একটা ছাড়া অন্যটা চলে।'
    more: |
      অনেকে দুটো একসাথে ব্যবহার করে, তাই গুলিয়ে ফেলে। কিন্তু CQRS সাধারণ SQL ডেটাবেসেও চলে, আর event-driven সিস্টেমেও event sourcing লাগে না। প্রতিটা আলাদা দাম আর আলাদা সুবিধার জিনিস। বিস্তারিত: [[workflows/event-sourcing|event sourcing]]।
    ref: worth-the-cost
  - q: 'Event-driven সিস্টেমে প্রধান খরচ কী কী?'
    a: 'debug কঠিন (কে কী শুনছে), eventual consistency, event দুইবার আসার ঝুঁকি, আর event-এর গঠন বদলানোর সতর্কতা।'
    more: |
      একটা কাজের ফল এখন একাধিক জায়গায় ছড়ানো, তাই log আর tracing অপরিহার্য। handler-কে idempotent করতে হয়, কারণ message দুইবার পৌঁছাতে পারে। event-এর ফিল্ড বদলালে শ্রোতারা ভাঙতে পারে।
    ref: worth-the-cost
  - q: 'CQRS-এ read model "পিছিয়ে" থাকা মানে কী?'
    a: 'লেখার পরই read model হালনাগাদ নাও হতে পারে; কয়েক মুহূর্ত পরে মেলে। একে বলে eventual consistency।'
    more: |
      অর্ডার দেওয়ার পরই তালিকায় নতুন অর্ডার না-ও দেখা যেতে পারে। UI-তে "প্রক্রিয়াধীন" দেখানো বা নিজের লেখা সাথে সাথে দেখানোর কৌশলে এটা সামলাতে হয়। ব্যালেন্সের মতো জায়গায় যেখানে সাথে সাথে সঠিক চাই, সেখানে সাবধান।
    ref: worth-the-cost
  - q: 'Symfony Messenger-এ command আর event কীভাবে আলাদা রাখা হয়?'
    a: 'আলাদা দুটো bus: command.bus আর event.bus। event bus-এ `allow_no_handlers: true` দেওয়া হয়।'
    more: |
      handler-এ `#[AsMessageHandler(bus: 'event.bus')]` লিখলে handler সেই bus-এ বসে। `MessageBusInterface $eventBus` ইনজেক্ট করলে Symfony event.bus-টাই দেয়। event bus-এ শ্রোতা না থাকাটা ভুল নয়।
    ref: events-in-symfony
  - q: 'অর্ডার সেভ আর event dispatch-এর মাঝে কী ভুল হতে পারে?'
    a: 'দুইয়ের মাঝে সার্ভার মরলে অর্ডার থাকে কিন্তু event যায় না, তাই stock নেই, ইমেইল নেই, error-ও নেই।'
    more: |
      যে লাইন ব্যর্থ হলো সেটা চলেইনি, তাই কিছু log হয় না। সমাধান: event-কে অর্ডারের সাথে একই database transaction-এ জমা রাখা, আর worker দিয়ে পৌঁছানো।
    ref: event-lost-on-crash
  - q: 'সার্ভার ক্র্যাশ করলেও Messenger কীভাবে event হারানো ঠেকায়?'
    a: '`doctrine_transaction` middleware আর Doctrine transport event-কে ডেটার সাথে একই transaction-এ জমা রাখে। worker পরে পৌঁছে দেয়।'
    more: |
      দাম হলো অন্তত-একবার delivery, তাই handler-কে idempotent হতে হয়। এটা চলে কারণ queue আর ডেটা একই connection-এ; RabbitMQ বা SQS হলে আসল outbox table আর relay লাগে। event হারালে ক্ষতি না হলে সাধারণ dispatch-ই চলে।
    ref: event-lost-on-crash
  - q: 'তালিকার পাতায় CQRS কোন আসল ব্যথা সারায়?'
    a: '২০টা পুরো Order object গড়লে লাগে ১টা query আর প্রতি অর্ডারে lines-এর জন্য একটা করে: ২১টা। সমতল read table-এ লাগে ১টা।'
    more: |
      লেখার মডেল নিয়মের জন্য সাজানো, দেখানোর জন্য নয়, তাই তার ভেতর দিয়ে পড়া ধীর আর ভারী। পড়ার দিক object বাদ দিয়ে প্রতি অর্ডারের আগে-সাজানো একটা সারি পড়ে। দাম হলো table-টা মিলিয়ে রাখা, সামান্য পিছিয়ে থাকা সহ।
    ref: cqrs-split

quiz:
  - q: 'চেকআউটের পর Inventory, ইমেইল, Loyalty আর Analytics — সবাইকে জানাতে হয়। প্রতিবার নতুন কিছু যোগ করতে চেকআউট ফাইল বদলাতে হচ্ছে, আর Loyalty ধীর হলে অর্ডারও ধীর। সবচেয়ে ভালো ডিজাইন কোনটা?'
    hint: 'ঘোষণা দেওয়া আর প্রত্যেককে ডাকার পার্থক্য ভাবুন।'
    options:
      - text: 'চেকআউট শুধু OrderPlaced event ঘোষণা করবে; বাকিরা নিজে শুনে async-এ কাজ করবে'
        correct: true
        why: 'ঘোষকের সংযোগ ঢিলা হয়, নতুন শ্রোতা যোগ করতে চেকআউট বদলাতে হয় না, আর ধীর শ্রোতা অর্ডার আটকায় না।'
      - text: 'চেকআউটে আরও timeout বসানো আর ডাকাডাকি আগের মতোই রাখা'
        correct: false
        why: 'timeout ধীরতার ক্ষতি কমায়, কিন্তু নতুন কিছু যোগ করতে চেকআউটে হাত লাগার সমস্যা থেকেই যায়।'
      - text: 'সব সার্ভিস চেকআউটের ভেতর এক ক্লাসে ঢুকিয়ে দেওয়া'
        correct: false
        why: 'এতে আরও জড়িয়ে যাবে, আর একটা ক্লাস সবকিছু জানবে।'
      - text: 'প্রতিটা সার্ভিস প্রতি সেকেন্ডে চেকআউটের ডেটাবেস polling করা'
        correct: false
        why: 'ডেটাবেসে চাপ বাড়ে আর সীমানা ভেঙে যায়; event-ই ঠিক পথ।'
    ref: checkout-calls-everyone
  - q: 'নিচের কোনগুলো event হিসেবে ভালো নাম?'
    hint: 'event অতীতকালের তথ্য, আদেশ নয়।'
    options:
      - text: 'OrderPlaced'
        correct: true
        why: 'অতীতকাল, একটা ঘটে-যাওয়া সত্য।'
      - text: 'PaymentReceived'
        correct: true
        why: 'অতীতকালে লেখা, কে শুনবে সে বলে না।'
      - text: 'SendConfirmationEmail'
        correct: false
        why: 'এটা আদেশ (command): একজন নির্দিষ্ট গ্রাহককে কাজ করতে বলছে।'
      - text: 'ReserveStock'
        correct: false
        why: 'এটাও আদেশ। event হতো StockReserved।'
    ref: events-as-notices
  - q: 'নিচের handler-এর নামকরণ ও ব্যবহারে কী সমস্যা?'
    lang: php
    code: |
      #[AsMessageHandler(bus: 'event.bus')]
      final readonly class SendReceiptEmail
      {
          public function __invoke(SendReceipt $message): void
          {
              // ...
          }
      }

      // Sales-এ
      $this->eventBus->dispatch(new SendReceipt($orderId));
    hint: 'Sales কাকে কী করতে বলছে — ঘটনা জানাচ্ছে, না আদেশ দিচ্ছে?'
    options:
      - text: '`SendReceipt` আসলে আদেশ (command); event bus-এ ঘটনার নাম, যেমন OrderPlaced, পাঠানো উচিত'
        correct: true
        why: 'Sales ইমেইল সার্ভিসের কাজ নির্দিষ্ট করে দিচ্ছে, ফলে সংযোগ আবার শক্ত। ঘটনা জানালে ইমেইল সার্ভিস নিজেই ঠিক করবে কী করবে।'
      - text: 'handler-টা final readonly হওয়া উচিত নয়'
        correct: false
        why: 'final readonly এখানে নির্দোষ; সমস্যা নামকরণে আর ধারণায়।'
      - text: 'event.bus ব্যবহার করা ভুল, সবই command.bus দিয়ে হওয়া উচিত'
        correct: false
        why: 'ঘটনা ঘোষণা করতে event bus-ই ঠিক; ভুলটা বার্তাটা আদেশ হওয়ায়।'
      - text: 'dispatch() না করে সরাসরি ইমেইল class ডাকা উচিত'
        correct: false
        why: 'তাতে আবার আগের শক্ত সংযোগে ফেরা হয়।'
    ref: events-in-symfony
  - q: 'অর্ডারের তালিকা পাতা ধীর, কারণ ৬টা join লাগে। লেখার দিক ঠিক আছে। CQRS-এর কোন ধাপ দিয়ে শুরু করা সবচেয়ে সুবিবেচনা?'
    hint: 'কম খরচে বেশিরভাগ লাভ কোথায়?'
    options:
      - text: 'একই ডেটাবেসে আলাদা query ক্লাস আর দরকারে সমতল read table (order_summary)'
        correct: true
        why: 'ছোট ধাপ, কম খরচ, আর ধীর পাতাটার সমস্যা সরাসরি মেটে। eventual consistency সীমিত থাকে।'
      - text: 'পুরো সিস্টেমে event sourcing বসানো'
        correct: false
        why: 'সমস্যা শুধু একটা তালিকার গতি। event sourcing বিশাল, অপ্রয়োজনীয় পরিবর্তন।'
      - text: 'প্রতিটা ক্লাসের জন্য আলাদা microservice বানানো'
        correct: false
        why: 'এটা CQRS-ই নয়, আর খরচ অনেক বেশি।'
      - text: 'কিছু না করে ব্যবহারকারীকে অপেক্ষা করতে বলা'
        correct: false
        why: 'মাপা সমস্যা আছে, আর সরল সমাধানও আছে। উপেক্ষা করার কারণ নেই।'
    ref: cqrs-split
  - q: 'নিচের কোন অবস্থাগুলোতে event-driven বা CQRS-এর দাম পোষায় না?'
    hint: 'লাভের জায়গা আছে কি না ভাবুন।'
    options:
      - text: 'একজন ডেভেলপার, সরল CRUD অ্যাপ, দিনে কয়েক শ ব্যবহারকারী'
        correct: true
        why: 'একটাই পক্ষ, কম চাপ, তাই বাড়তি খরচ বিনা লাভে।'
      - text: 'ব্যালেন্স দেখানো, যেখানে লেনদেনের সাথে সাথে সঠিক সংখ্যা চাই'
        correct: true
        why: 'eventual consistency-তে সংখ্যা সাময়িক ভুল দেখাতে পারে, যা এখানে অগ্রহণযোগ্য।'
      - text: 'একটা অর্ডারের ঘটনায় ৫টা আলাদা টিম আলাদা কাজ করে'
        correct: false
        why: 'এটাই event-driven-এর আদর্শ জায়গা: অনেক পক্ষ, একই ঘটনা।'
      - text: 'পড়ার request লেখার চেয়ে ১০০ গুণ বেশি আর পাতা ধীর'
        correct: false
        why: 'এখানে পড়ার দিক আলাদা সাজানোর (CQRS) লাভ স্পষ্ট।'
    ref: worth-the-cost
  - q: 'করিমের handler অর্ডার সেভ করে, তারপর OrderPlaced RabbitMQ-তে dispatch করে। দুই লাইনের মাঝে একটা deploy process কিল করে দিল। সবচেয়ে ভালো সমাধান কোনটা?'
    hint: 'process মরে গেলে কোনো exception ধরার সুযোগ থাকে না। কী কী একসাথে সেভ হওয়া দরকার?'
    options:
      - text: 'dispatch-টা try/catch-এ মুড়ে error log করা'
        correct: false
        why: 'কিল হওয়া process কোনো exception ছোড়ে না। dispatch লাইনটা শুধু চলেই না।'
      - text: 'অর্ডার সেভের আগেই event dispatch করা'
        correct: false
        why: 'তখন ক্র্যাশে এমন অর্ডারের ঘোষণা যেতে পারে যা সেভই হয়নি, আর শ্রোতারা অস্তিত্বহীন জিনিসে কাজ করে।'
      - text: 'অর্ডারের সাথে একই transaction-এ event outbox table-এ রাখা, আর relay তা RabbitMQ-তে পাঠায়'
        correct: true
        why: 'অর্ডার আর event একসাথে commit হয়, নয়তো কোনোটাই নয়। relay জমা event পৌঁছায়, সফল না হওয়া পর্যন্ত আবার চেষ্টা করে।'
      - text: '৩ সেকেন্ড পরে পুরো ওয়েব request আবার চালানো'
        correct: false
        why: 'অর্ডার আগেই সেভ হয়েছে, তাই আবার চালালে ডুপ্লিকেট অর্ডার হয়, আর event-এর নিশ্চয়তাও মেলে না।'
    ref: event-lost-on-crash
