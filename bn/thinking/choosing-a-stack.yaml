slides:
  - slug: two-teams-two-habits
    title: 'দুই টিম, দুই stack, দুই রকম ভোগান্তি'
    kind: story
    tldr: 'দুই টিমই কাজ না বুঝে ফ্যাশন বা অভ্যাসে stack বেছেছিল, আর দাম দিয়েছে সিস্টেমের সবচেয়ে জরুরি অংশে।'
    keywords: ['choosing a stack', 'framework বাছাই', 'language বাছাই', 'ফ্যাশন', 'অভ্যাস', 'বিমা সিস্টেম', 'ভিডিও স্ট্রিমিং']
    blocks:
      - type: metaphor
        icon: truck
        title: 'রুট বুঝে গাড়ি বাছা'
        body: |
          ঢাকার এক পরিবহন-মালিক প্রতিবেশীর দেখাদেখি ঠিক সেই গাড়িটাই কিনে ফেললেন। পুরান ঢাকার সরু গলিতে রিকশাই সেরা, কিন্তু দশ টন চাল চট্টগ্রামে নিতে পারে না। ট্রাক সেটা পারে, কিন্তু গলিতে ঢোকে না।
      - type: text
        body: |
          কোনো গাড়িই খারাপ নয়। মাল আর রাস্তা ঠিক করে দেয় কোনটা চলবে। রহিমের টিম একটা বিমা কোম্পানির পলিসি ও ক্লেইম সিস্টেম বানাচ্ছে, আর নাদিয়ার টিম একটা ভিডিও-স্ট্রিমিং সাইট। দুজনেই stack বেছেছে ওই মালিকের মতো করে।
      - type: visual
        kind: compare
        caption: 'একই ভুল, ভিন্ন ভোগান্তি: কাজ না বুঝেই stack বাছা হয়েছিল'
        columns:
          - title: 'রহিম: বিমা, বাছা হলো ফ্যাশনে'
            tone: bad
            icon: warning
            tip: 'কনফারেন্সের বক্তৃতায় একটা হালকা, চালু-হাওয়ার toolkit দ্রুত লেগেছিল। কিন্তু বিমা সিস্টেম টাকার নিয়ম, অনুমতি আর রেকর্ডের ওপর চলে — toolkit সেসব টিমের ঘাড়ে ছেড়ে দিয়েছিল।'
            items:
              - 'কনফারেন্সের বক্তৃতা শুনে হালকা, ফ্যাশনের toolkit নেওয়া'
              - 'ভূমিকা-অনুমতি, audit trail, রাতের batch — কিছুই তৈরি নেই'
              - 'প্রিমিয়াম float সংখ্যায় রাখা; মোটে কয়েক পয়সা গরমিল'
              - 'অন্য stack-এ তৈরি ও পরীক্ষিত জিনিস হাতে বানাতে মাসের পর মাস'
          - title: 'নাদিয়া: ভিডিও, বাছা হলো অভ্যাসে'
            tone: warn
            icon: warning
            tip: 'ব্যাংকের প্রজেক্টে চেনা stack বলে কেউ জিজ্ঞেসই করেনি ভিডিও সাইটের আসল খাটুনি কোথায়। আসল কাজ বড় ফাইল রূপান্তর আর পৌঁছানো, পেজ সাজানো নয়।'
            items:
              - 'ব্যাংকের প্রজেক্টে চেনা stack-টাই বেছে নেওয়া'
              - 'আপলোড করা ভিডিও রূপান্তর হচ্ছিল request-এর ভেতরেই, সাইট আটকে যেত'
              - 'প্রতিটা ভিডিও অ্যাপ সার্ভার থেকেই চালানো; ধীর গতি আর বিল বাড়ল'
              - 'ওয়েব framework কখনোই বাধা ছিল না'
    aside:
      - type: story
        title: 'যে পয়সাটা মিলল না'
        body: |
          মাসশেষে অডিটররা দেখলেন, প্রিমিয়াম রিপোর্টের মোট আর আলাদা আলাদা পলিসির যোগফলে কয়েক টাকার ফারাক। টাকা রাখা হয়েছিল float সংখ্যায়, যা ০.১-এর মতো মান ঠিকঠাক ধরে রাখতে পারে না, আর হিসাবের ভিন্ন ভিন্ন জায়গায় round হয়েছিল। audit trail না থাকায় কোন সংখ্যাটা ঠিক, তা কেউ প্রমাণ করতে পারল না।
      - type: terms
        items:
          - {term: 'Stack', meaning: 'যে language, framework, ডেটাবেস আর সহায়ক টুলের ওপর অ্যাপ দাঁড়ায়, তার সব মিলিয়ে।'}
          - {term: 'Audit trail', meaning: 'কে, কবে, কী বদলাল তার লিখিত রেকর্ড, যাতে পরে যেকোনো বদল খুঁজে বের করা যায়।'}
          - {term: 'Transcoding', meaning: 'আপলোড করা ভিডিওকে নানা মাপ ও ফরম্যাটে রূপান্তর, যাতে যেকোনো ফোন বা পর্দায় চলে।'}
    check:
      q: 'কোনো stack-ই খারাপ ছিল না। তাহলে দুই টিমই বিপাকে পড়ল কেন?'
      a: 'দুজনেই কাজের চাহিদা না দেখে ফ্যাশন বা অভ্যাসে বেছেছে। বিমা টিম টাকা ও audit-এর তৈরি নিরাপত্তা পায়নি; ভিডিও টিম ভারী কাজটা ভুল জায়গায় রেখেছে।'

  - slug: start-from-the-job
    title: 'কাজ দিয়ে শুরু: ছয়টা প্রশ্ন'
    kind: concept
    tldr: 'আগে লিখুন অ্যাপের কী লাগে (কাজের ধরন, নির্ভুলতা, built-in, জোড়া লাগানো, মানুষ, সাপোর্ট), তারপর দেখুন কোন stack মেলে — উল্টোটা নয়।'
    keywords: ['stack বাছাই', 'workload shape', 'নির্ভুলতা', 'টিমের দক্ষতা', 'hiring', 'long-term support', 'integration']
    blocks:
      - type: text
        body: |
          পরিবহন-মালিক জিজ্ঞেস করেন কী বইবেন, কোন রাস্তায়, চালাবে কে। stack বাছাইয়েরও ঠিক এই প্রশ্নগুলোই। কোনো framework দেখার আগে এগুলোর উত্তর লিখে ফেলুন, তাহলে ছোট তালিকা প্রায় আপনাআপনি বেরিয়ে আসে।
      - type: visual
        kind: table
        caption: 'গাড়ির ছয় প্রশ্ন, stack-এর ছয় প্রশ্ন'
        headers: ['গাড়ির প্রশ্ন', 'stack-এর প্রশ্ন', 'উদাহরণ']
        rows:
          - cells: ['কী বইব?', 'কাজের ধরন (workload)', 'বড় ভিডিও ফাইল, নাকি অসংখ্য ছোট টাকার লেনদেন']
            tip: 'সিস্টেমের সময় আসলে কোথায় যায়: বড় ফাইল সরানো, অন্য সার্ভিসের অপেক্ষা, অনেক নিয়ম খাটানো, নাকি অসংখ্য ছোট বদল নিরাপদে লেখা।'
          - cells: ['মালটা কতটা নাজুক?', 'নির্ভুলতার চাহিদা', 'ঠিকঠাক দশমিক, কড়া transaction, audit trail']
            tip: 'টাকা আর আইনি রেকর্ডে ভুল মান মানে সত্যিকারের ক্ষতি; ভিডিওর thumbnail-এ নয়। মাল যত নাজুক, তৈরি ও পরীক্ষিত সুরক্ষা তত দরকার।'
          - cells: ['গাড়ির সাথে কী ফিটিং আসে?', 'Framework-এ যা তৈরি পাওয়া যায়', 'transaction, নিরাপত্তা, batch, scheduler, ORM']
            tip: 'framework যা আগেই দেয়, তা আপনাকে লিখতে, পরীক্ষা করতে, patch করতে বা প্রতিটা নতুন লোককে বোঝাতে হয় না।'
          - cells: ['কোন কোন রাস্তায় উঠতে হবে?', 'চালু সিস্টেমের সাথে জোড়া', 'পুরনো (legacy) সিস্টেম, ব্যাংক, ফাইল ফরম্যাট']
            tip: 'যে stack আপনার চালু সিস্টেমের সাথে সহজে কথা বলে, সেটা সবখানে জোড়াতালির কোড লাগা দ্রুত stack-এর চেয়ে বেশি বাঁচায়।'
          - cells: ['চালাবে আর সারাবে কে?', 'টিমের দক্ষতা ও লোক পাওয়া', 'টিম যা জানে, বাজারে যাদের পাওয়া যায়']
            tip: 'চমৎকার stack, যা টিমের কেউ চেনে না, সেটা ঝুঁকি। কেউ চলে গেলে আপনার শহরে কাকে নিয়োগ দেবেন, সেটাও ভাবুন।'
          - cells: ['যন্ত্রাংশ কত দিন মিলবে?', 'সাপোর্ট ও স্থিতিশীলতা', 'release-এর ছন্দ, দীর্ঘমেয়াদি সাপোর্ট']
            tip: 'অ্যাপ দশ বছরও চলতে পারে। দেখুন একটা version কত দিন security fix পায়, আর upgrade সাধারণত কত ঝামেলার।'
      - type: quote
        body: 'কাজ ঠিক করবে stack কী হবে। stack কখনো ঠিক করবে না কাজ কী হবে।'
    aside:
      - type: terms
        items:
          - {term: 'Workload shape', meaning: 'সিস্টেম মূলত কী করে: বড় ফাইল সরায়, অন্য সার্ভিসের জন্য অপেক্ষা করে, হিসাব কষে, নাকি অসংখ্য ছোট বদল নিরাপদে লেখে।'}
          - {term: 'Operational maturity', meaning: 'এটা কীভাবে deploy, monitor, backup আর মেরামত করতে হয়, তা কতটা সুপরিচিত।'}
      - type: when
        use:
          - 'কাজের স্পষ্ট চাহিদা আছে — যেমন টাকা, audit বা ভারী মিডিয়া — যা কোনো stack ভালো মেটায়, কোনোটা মেটায় না।'
        avoid:
          - 'চাহিদা সাধারণ CRUD আর টিম একটা পরিণত stack ভালো জানে। তখন টিমের দক্ষতাই ঠিক করে, এখানেই থামতে পারেন।'
      - type: refs
        items:
          - {to: 'thinking/build-vs-buy', label: 'জটিলতার বাজেট'}
    check:
      q: 'কোনো framework বাছাইয়ের আগে কাজ সম্পর্কে কোন তিনটা বিষয় ঠিক করে নেবেন?'
      a: 'যেমন: কাজের ধরন, নির্ভুলতার কড়াকড়ি (টাকা, audit), আর framework আগে থেকে কী দেয়। বাকি তিনটা: জোড়া লাগানো, টিমের দক্ষতা আর সাপোর্টের মেয়াদ।'

  - slug: two-jobs-worked-example
    title: 'হাতে-কলমে: ভিডিও সাইট আর বিমা সিস্টেম'
    kind: howto
    tldr: 'দুই কাজে একই ছয় প্রশ্ন করুন। উত্তর আলাদা, তাই খোঁজার জিনিসও আলাদা — আর তবু একাধিক stack-ই দুটোতে মানাতে পারে।'
    keywords: ['worked example', 'ভিডিও স্ট্রিমিং', 'বিমা', 'হিসাবরক্ষণ', 'transcoding', 'CDN', 'object storage']
    blocks:
      - type: text
        body: |
          দুই টিমের জন্য ছয় প্রশ্নের উত্তর নিচে। প্রতিটা সারি আড়াআড়ি পড়ুন: একই প্রশ্নে উত্তর আলাদা, তাই কেনাকাটার তালিকাও আলাদা।
      - type: visual
        kind: table
        caption: 'একই প্রশ্ন, দুই কাজ, দুই রকম কেনাকাটার তালিকা'
        headers: ['প্রশ্ন', 'ভিডিও স্ট্রিমিং', 'বিমা ও হিসাবরক্ষণ']
        rows:
          - cells: ['কাজের ধরন', 'বড় ফাইল, বহু দর্শক, I/O-র অপেক্ষা বেশি', 'অসংখ্য ছোট লেখা, নিয়ম, রিপোর্ট, মাসশেষের batch']
            tip: 'ভিডিও মূলত বাইট সরানোর কাজ। বিমা মূলত রেকর্ডের ওপর নিয়ম খাটানো — নিরাপদে, বারবার।'
          - cells: ['নির্ভুলতা', 'একটা frame পড়ে গেলে বিরক্তি, ক্ষতি নয়', 'এক পয়সার ভুল বা হারানো রেকর্ড মানে আইনি ঝামেলা']
            tip: 'এই সারি ঠিক করে, টাকা ও রেকর্ডের জন্য তৈরি, বহুদিন পরীক্ষিত সুরক্ষাকে আপনি কতটা দাম দেবেন।'
          - cells: ['কাজে লাগা built-in', 'upload সামলানো, queue, background worker', 'transaction, ভূমিকা, batch, scheduler, audit']
            tip: 'যে ফিচারগুলো নইলে হাতে লিখতে হতো, সেগুলোর তালিকা করুন। framework-এ ঠিক সেগুলোই খুঁজুন।'
          - cells: ['জোড়া লাগানো', 'object storage, CDN, ffmpeg-ধাঁচের converter', 'পুরনো কোর সিস্টেম, ব্যাংক, নিয়ন্ত্রক সংস্থা']
            tip: 'ভিডিও জোড়া লাগে অবকাঠামো-টুলের সাথে। বিমা জোড়া লাগে পুরনো সিস্টেম আর বাইরের প্রতিষ্ঠানের সাথে।'
          - cells: ['মানুষ', 'যেকোনো ভালো ওয়েব টিম; পাইপলাইন বেশির ভাগই টুল', 'নিয়ম আর পুরনো সিস্টেম চেনা ইঞ্জিনিয়ার']
            tip: 'ভিডিওতে টিম পাইপলাইনের টুল শিখে নিতে পারে। বিমায় ব্যবসার নিয়ম বছরের পর বছর চেনা মানুষই দুর্লভ।'
          - cells: ['কী খুঁজবেন', 'অনেক ভাষাতেই চলে; জোর দিন পাইপলাইনে', 'পরিণত transaction, নিরাপত্তা, typing, দীর্ঘ সাপোর্ট']
            tip: 'সিদ্ধান্তটা কোনো একজন বিজয়ী stack নয়। এটা কিছু গুণের তালিকা, আর একাধিক stack-এ সেগুলো থাকতে পারে।'
      - type: visual
        kind: flow
        caption: 'ভিডিওর আসল কাজ কোথায় হয়: ওয়েব backend শুধু ফাইল হাতবদল করে'
        nodes:
          - {id: creator, label: 'নির্মাতা', sub: 'ভিডিও আপলোড করেন', icon: user, col: 0, row: 0, tip: 'যিনি নতুন ভিডিও আপলোড করেন।'}
          - {id: app, label: 'ওয়েব অ্যাপ', sub: 'যেকোনো ওয়েব ভাষা', icon: api, col: 1, row: 0, tip: 'ওয়েব backend। এটা আপলোড আর login নেয়, তারপর ভারী কাজ অন্যদের হাতে দেয়।'}
          - {id: store, label: 'Object storage', sub: 'ফাইলের গুদাম', icon: storage, col: 2, row: 0, tip: 'বড় ফাইল সস্তায় রাখার সেবা: আসল ফাইল আর রূপান্তরিত প্রতিটা সংস্করণ এখানে থাকে।'}
          - {id: worker, label: 'রূপান্তরকারী', sub: 'ffmpeg-ধাঁচের worker', icon: worker, tone: accent, col: 2, row: 1, tip: 'background worker, যে প্রতিটা ভিডিও নানা মাপে রূপান্তর করে। আসল খাটুনি এখানে।'}
          - {id: cdn, label: 'CDN', sub: 'দর্শকের কাছে কপি', icon: cdn, col: 3, row: 0, tip: 'Content delivery network: সারা দুনিয়ায় ছড়ানো সার্ভার, যা জনপ্রিয় ফাইলের কপি দর্শকের কাছাকাছি রাখে।'}
          - {id: viewer, label: 'দর্শক', sub: 'দেখছেন', icon: mobile, col: 4, row: 0, tip: 'ফোনে বা ল্যাপটপে যিনি ভিডিও দেখছেন।'}
        edges:
          - {from: creator, to: app, label: 'নির্মাতা ভিডিও আপলোড করেন, ওয়েব অ্যাপ তা নেয়।'}
          - {from: app, to: store, label: 'অ্যাপ আসল ফাইল object storage-এ রেখে সাথে সাথে উত্তর দেয়।'}
          - {from: store, to: worker, label: 'background worker ফাইলটা তুলে নানা মাপে রূপান্তর করে।'}
          - {from: worker, to: store, label: 'রূপান্তরিত সংস্করণগুলো আবার storage-এ জমা পড়ে।', dashed: true}
          - {from: store, to: cdn, label: 'CDN জনপ্রিয় ফাইলের কপি দর্শকের কাছাকাছি রাখে।'}
          - {from: cdn, to: viewer, label: 'দর্শক ভিডিও দেখেন CDN থেকে, অ্যাপ সার্ভার থেকে নয়।', tone: good}
    aside:
      - type: tips
        items:
          - 'ভিডিও সাইটে বাজেট যায় queue, storage, CDN আর পৌঁছানোর খরচে। ওয়েব অংশ হালকা থাকতে পারে।'
          - 'বিমা সিস্টেমে উল্টো: নিয়মগুলো framework-এর কাঁধেই থাকে, তাই তার built-in ফিচারই সবচেয়ে জরুরি।'
      - type: pitfalls
        items:
          - 'দুই তালিকাকে একটা রায় ধরে নেওয়া। টেবিল বলে কী খুঁজবেন, কোন ব্র্যান্ড কিনবেন তা নয়।'
      - type: refs
        items:
          - {to: 'thinking/quality-attributes', label: 'Quality attribute: সিস্টেমকে কীসে ভালো হতে হবে'}
    check:
      q: 'বিমা সিস্টেমের চেয়ে ভিডিও সাইটে ওয়েব backend-এর ভাষা কম জরুরি কেন?'
      a: 'ভিডিও সাইটের ভারী কাজ (ফাইল রূপান্তর ও পৌঁছানো) চলে storage, worker আর CDN-এ, ওয়েব framework-এ নয়। বিমা সিস্টেমের মূল কাজ, টাকার নিয়ম নিরাপদে চালানো, চলে framework-এর ভেতরেই।'

  - slug: what-the-framework-gives
    title: 'তৈরি পাওয়া যায়, নাকি নিজে বানাবেন?'
    kind: compare
    tldr: 'পরিণত stack-এ transaction, নিরাপত্তা, batch আর scheduling তৈরিই আসে। হাতে বানানোর আগে দেখুন আপনারটা কী দেয়, আর সেই সুবিধার দামও জানুন।'
    keywords: ['Spring Boot', '.NET', 'Symfony', 'Django', 'built-in ফিচার', 'declarative transaction', 'enterprise']
    blocks:
      - type: text
        body: |
          যে ফিচার লিখতে হয় না, তা পরীক্ষা, patch বা প্রতিটা নতুন লোককে বোঝাতেও হয় না। তাই ব্যাংক-বিমায় Java-র Spring Boot আর C#-এর .NET এত চলে: টাকার কাজের জন্য বছরের পর বছর পরীক্ষিত সমাধান তাদের সাথেই আসে। কিন্তু এরাই একমাত্র সমাধান নয়। Django-তেও হিসাবরক্ষণ সফটওয়্যার চলে, Symfony-তেও — যেটা এই কোর্সে ব্যবহার হয়।
      - type: visual
        kind: compare
        caption: 'তিনটা stack, আর প্রত্যেকে তৈরি অবস্থায় কিছু কী দেয়'
        columns:
          - title: 'Java + Spring Boot'
            tone: default
            icon: code
            tip: 'বিশাল, পরিণত ecosystem, enterprise সিস্টেমে বহুল ব্যবহৃত। strongly typed, আর Java-র long-term-support release আছে।'
            items:
              - '@Transactional দিয়ে declarative transaction'
              - 'login ও অনুমতির জন্য Spring Security'
              - 'বড়, আবার চালু করা যায় এমন কাজে Spring Batch'
              - 'কড়া typing; long-term-support release'
          - title: 'C# + .NET'
            tone: default
            icon: code
            tip: 'Microsoft-এর stack, enterprise-এও প্রচলিত। strongly typed, long-term-support release আর ভালো টুলিং আছে।'
            items:
              - 'Entity Framework Core: ORM ও migration'
              - 'প্ল্যাটফর্মেই বসানো dependency injection'
              - 'ব্যবহারকারী ও ভূমিকার জন্য ASP.NET Core Identity'
              - 'কড়া typing; long-term-support release'
          - title: 'PHP + Symfony'
            tone: accent
            icon: code
            tip: 'এই কোর্সের stack। প্রায় একই বিল্ডিং ব্লক তৈরি আসে, তাই CRUD ডেভেলপার ভাষা না বদলেই টাকার ভারী কাজে বেড়ে উঠতে পারেন।'
            items:
              - 'Doctrine ORM: transaction ও migration'
              - 'সূক্ষ্ম অনুমতির জন্য Security voter'
              - 'queue-এর জন্য Messenger, state-নিয়মে Workflow'
              - 'এক-জনের-অধিকারে Lock, সময়মতো কাজে Scheduler'
      - type: text
        body: |
          এই built-in না থাকলে নিজেকেই লিখতে হয়: transaction সামলানো, অনুমতি যাচাই, ফিরে চালানো যায় এমন batch। প্রতিটাই পরীক্ষা করার কোড, আর এতে bug মানে টাকায় আঘাত। এগুলো ব্যবহারের দাম: framework-এর নিজস্ব ধরন শেখা, ছোট কাজেও বাড়তি আনুষ্ঠানিকতা, আর তার ecosystem-এর দিকে টান। সবটাই [[thinking/build-vs-buy|complexity budget]] থেকে খরচ।
    aside:
      - type: terms
        items:
          - {term: 'Declarative transaction', meaning: 'আপনি শুধু method-টা চিহ্নিত করেন; ডেটাবেস transaction খোলা, commit করা বা rollback করা framework নিজে করে।'}
          - {term: 'Batch job', meaning: 'সময় ধরে চালানো বড় কাজ, যেমন মাসশেষের প্রিমিয়াম হিসাব, যা ব্যর্থ হলে আবার চালু করা যায়।'}
      - type: when
        use:
          - 'টাকা, audit আর দীর্ঘ আয়ুর নিয়ম প্রধান: পরিণত built-in, কড়া typing আর দীর্ঘ সাপোর্ট বেছে নিন।'
          - 'টিম এমন stack ভালো জানে যা চাহিদা মেটায়: সেটাই ব্যবহার করুন।'
        avoid:
          - 'শুধু ব্যাংক বা বিখ্যাত কোম্পানি ব্যবহার করে বলে stack বেছে নেওয়া।'
          - 'বাছাইয়ের সময় নিজের শহরে কাদের নিয়োগ দেওয়া যাবে, সেটা না ভাবা।'
    check:
      q: 'Django-তে কি হিসাবরক্ষণ সফটওয়্যার চলে? তবু অনেক বিমা কোম্পানি Spring বা .NET বাছে কেন?'
      a: 'চলে, যদি যা নেই তা যোগ করে পরীক্ষা করেন। Spring আর .NET প্রচলিত, কারণ transaction, নিরাপত্তা আর batch তৈরি আসে, এগুলো কড়া typing-এর, আর release অনেক দিন সাপোর্ট পায়।'

  - slug: fashion-and-benchmarks
    title: 'ফাঁদ: ফ্যাশনের rewrite বা benchmark-জেতা stack'
    kind: pitfall
    tldr: 'চালু সিস্টেম ফ্যাশনের stack-এ নতুন করে লেখা, বা একটা গতির benchmark দেখে বাছা — না-মাপা সমস্যার পেছনে complexity budget খরচ করা।'
    keywords: ['rewrite', 'benchmark', 'ফ্যাশন', 'প্রযুক্তির হুজুগ', 'সিদ্ধান্তের চেকলিস্ট', 'complexity budget']
    blocks:
      - type: text
        body: |
          করিম ভাইয়ের পুরনো বিমা সিস্টেম মাসশেষে ধীর। নতুন এক ডেভেলপার বললেন, "চলুন benchmark-এর চার্টে জেতা stack-এ নতুন করে লিখি।" এক বছর পর টিম দুটো সিস্টেম চালাচ্ছে, পুরনো নিয়ম অর্ধেক ফিরে এসেছে, আর মাসশেষ তখনও ধীর। কারণ ছিল একটা না-থাকা ডেটাবেস index।
      - type: visual
        kind: compare
        caption: 'ফ্যাশনের rewrite কী করে, আর মাপা সমস্যা সারালে কী হয়'
        columns:
          - title: 'ফ্যাশনে rewrite'
            tone: bad
            icon: cross
            tip: 'শুনতে সাহসী, কিন্তু আসল কারণ ছোঁয়ার আগেই বিপুল খাটুনি খরচ হয়ে যায়।'
            items:
              - 'বছরের পর বছর ঠিক করা নিয়ম আবার নতুন করে বানানো'
              - 'অনেক দিন ধরে দুটো সিস্টেম পাশাপাশি চলা'
              - 'টিম নতুন stack শিখছে, কিছুই ডেলিভারি হচ্ছে না'
              - 'আসল কারণ, একটা ধীর query, কখনো মাপাই হয় না'
          - title: 'মাপা সমস্যাটা সারান'
            tone: good
            icon: check
            tip: 'কাজটা ছোট, ঝটপট চেষ্টা করা যায়, ফেরানোও সহজ — আর নিয়ম ও মানুষ যে stack-এ আছে, সেটাই থাকে।'
            items:
              - 'আগে মাপুন: ধীর query বা ধাপটা খুঁজে বের করুন'
              - 'ছোট অংশ বদলান: index দিন, কাজটা queue-তে পাঠান'
              - 'যে stack-এ টিম ও নিয়ম আছে, সেটাই রাখুন'
              - 'অন্য উপায় না থাকলে, মাপা সীমা পেরোলে তবেই rewrite'
      - type: points
        title: 'stack বাছা বা বদলানোর আগে'
        style: check
        items:
          - 'চাহিদা লিখুন: কাজের ধরন, নির্ভুলতা, built-in, জোড়া লাগানো।'
          - 'stack কী তৈরি দেয় আর কতটা পরিণত, দেখে নিন।'
          - 'টিম গুনুন: আজকের দক্ষতা, কালকের নিয়োগ, on-call কে।'
          - 'একটা version কত দিন সাপোর্ট পায় আর upgrade কেমন, দেখুন।'
          - 'চেনা বিকল্পে চাহিদা মিটলে সেটাই রাখুন। বাজেট খরচ করুন শুধু মাপা ঘাটতিতে।'
      - type: quote
        body: 'Benchmark একটা প্রশ্নের উত্তর দেয়। stack-এর সিদ্ধান্তে প্রশ্ন ছয়টা।'
    aside:
      - type: story
        title: 'rewrite কেন লম্বা হয়'
        body: |
          চালু সিস্টেম নতুন করে লিখতে গিয়ে অনেক টিম দেখে, সময় ভাবনার চেয়ে অনেক বেশি লাগছে। পুরনো কোডে বছরের পর বছর জমা ছোট ছোট নিয়ম কেউ লিখে রাখেনি, আর নতুন সিস্টেম ভুল করলে তবেই সেগুলো ধরা পড়ে।
      - type: when
        use:
          - 'stack-এর security সাপোর্ট বন্ধ হয়ে গেছে আর upgrade অসম্ভব।'
          - 'মাপা কোনো সীমা বর্তমান stack-এর ভেতরে সারানো যাচ্ছে না।'
        avoid:
          - 'একঘেয়েমি, ফ্যাশন, বা একটা benchmark চার্ট।'
      - type: refs
        items:
          - {to: 'thinking/build-vs-buy', label: 'জটিলতার বাজেট ও boring technology'}
          - {to: 'thinking/reversible-decisions', label: 'ফেরানো যায় এমন সিদ্ধান্ত নেওয়া'}
    check:
      q: 'মাসশেষের রিপোর্ট ধীর। নতুন stack-এর প্রস্তাবের আগে কী করবেন?'
      a: 'মাপুন সময় কোথায় যাচ্ছে, আর আগে সেই অংশটা সারান। stack বদলান শুধু তখন, যখন মাপা কোনো সীমা বর্তমান stack-এর ভেতরে সারানো যায় না।'

flashcards:
  - q: 'ভাষা আর framework বাছাই কীসের ওপর নির্ভর করা উচিত?'
    a: 'অ্যাপের কী লাগে তার ওপর: কাজের ধরন, নির্ভুলতা, built-in ফিচার, জোড়া লাগানো, টিমের দক্ষতা আর সাপোর্টের মেয়াদ। ফ্যাশন বা অভ্যাসের ওপর নয়।'
    more: |
      stack একটা কাজের যন্ত্র। আগে কাজের চাহিদা লিখুন, তারপর দেখুন কোন stack মেলে। ফ্যাশন বা টিম যা চেনে তা দেখে বাছলে খরচ পরে আসে — ডেলিভারি ধীর হয়, নইলে সবচেয়ে জরুরি অংশেই bug দেখা দেয়।
    ref: start-from-the-job
  - q: 'stack বাছার আগে কোন ছয়টা প্রশ্নের উত্তর খুঁজবেন?'
    a: 'কাজের ধরন, নির্ভুলতার চাহিদা, built-in ফিচার, জোড়া লাগানো, টিম ও নিয়োগ, আর সাপোর্ট ও স্থিতিশীলতা।'
    more: |
      গাড়ির কথা ভাবুন: কী বইবেন, মাল কতটা নাজুক, গাড়ির সাথে কী ফিটিং আসে, কোন রাস্তায় উঠতে হবে, চালাবে ও সারাবে কে, আর যন্ত্রাংশ কত দিন মিলবে। উত্তরগুলো গুণের একটা তালিকা তৈরি করে — কোনো একটা বিজয়ী ব্র্যান্ড নয়।
    ref: start-from-the-job
  - q: 'Workload shape বলতে কী বোঝায়?'
    a: 'সিস্টেম মূলত কী করে: বড় ফাইল সরায়, অন্য সার্ভিসের অপেক্ষা করে, অনেক নিয়ম খাটায়, নাকি অসংখ্য ছোট বদল নিরাপদে লেখে।'
    more: |
      ভিডিও সাইট মূলত বাইট সরানো আর background রূপান্তরের কাজ। বিমা সিস্টেম মূলত কড়া নিয়মে অসংখ্য ছোট, সাবধানী লেখা। এই আকৃতি বলে দেয়, কাজের জন্য stack-এর কোন অংশটা সবচেয়ে বেশি জরুরি।
    ref: start-from-the-job
  - q: 'ভিডিও স্ট্রিমিংয়ে ওয়েব backend-এর ভাষা কম জরুরি কেন?'
    a: 'ভারী কাজ, অর্থাৎ ভিডিও রূপান্তর ও পৌঁছানো, চলে storage, ffmpeg-ধাঁচের background worker আর CDN-এ — ওয়েব framework-এ নয়।'
    more: |
      ওয়েব অ্যাপ মূলত আপলোড আর login নেয়, তারপর ফাইল দেয় object storage ও রূপান্তরকারীর হাতে। দর্শক ভিডিও দেখেন CDN থেকে। তাই অনেক ওয়েব ভাষাতেই চলে, আর খাটুনি যায় পাইপলাইন, queue ও পৌঁছানোর খরচে।
    ref: two-jobs-worked-example
  - q: 'বিমা বা হিসাবরক্ষণ সিস্টেম stack-এর ওপর কী কী চাহিদা চাপায়?'
    a: 'ঠিকঠাক দশমিক, কড়া transaction, audit trail, অনুমতির নিয়ম, batch আর দীর্ঘ সাপোর্ট — কারণ ভুল মান আইনি সমস্যা হয়ে দাঁড়ায়।'
    more: |
      টাকা আর রেকর্ড এক পয়সা পর্যন্ত মিলতে হবে, আর প্রতিটা বদল খুঁজে বের করা যেতে হবে। যে stack-এ transaction, নিরাপত্তা, batch ও scheduling তৈরি আসে, সেখানে টিম নল-নর্দমা না বানিয়ে বিমার নিয়মে সময় দিতে পারে।
    ref: two-jobs-worked-example
  - q: 'এন্টারপ্রাইজ বিমা-হিসাবে Spring Boot আর .NET এত প্রচলিত কেন?'
    a: 'এদের সাথে পরীক্ষিত transaction, নিরাপত্তা ও batch টুল তৈরি আসে, এগুলো কড়া typing-এর, আর long-term-support release আছে।'
    more: |
      Spring-এ আছে declarative `@Transactional`, Spring Security আর Spring Batch। .NET-এ আছে Entity Framework Core, বসানো dependency injection আর ASP.NET Core Identity। দীর্ঘ সাপোর্টের মেয়াদ দশ বছর চলা সিস্টেমের সাথে মানায়। তবে এতে এরাই একমাত্র ভালো পছন্দ হয়ে যায় না।
    ref: what-the-framework-gives
  - q: 'Django বা Symfony-তে কি হিসাবরক্ষণ সফটওয়্যার চলে?'
    a: 'চলে। কোনো stack-ই ভুল নয়। দেখে নিন যা লাগবে তা আছে ও পরিণত কি না; যা নেই তা যোগ করে পরীক্ষা করুন।'
    more: |
      এই কোর্সের stack Symfony-র সাথে আসে Doctrine transaction, Security voter, Messenger, Workflow, Lock ও Scheduler। Django-তে ঠিকঠাক decimal ফিল্ড আর ডেটাবেস transaction ব্যবহার করা যায়। আসল প্রশ্ন কোন ভাষা নয় — প্রশ্ন, যা নেই সেটা কে লিখবে আর পরীক্ষা করবে।
    ref: what-the-framework-gives
  - q: 'অনেক built-in ফিচারওয়ালা framework নেওয়ার দাম কী?'
    a: 'শেখার ভার বেশি, ছোট কাজেও আনুষ্ঠানিকতা, আর তার ecosystem-এর দিকে টান। এতে complexity budgetও খরচ হয়।'
    more: |
      উল্টো দিকটাও সত্যি। built-in না থাকলে transaction সামলানো, অনুমতি যাচাই আর ফিরে চালানো যায় এমন batch নিজেকেই লিখতে হয়, আর সেখানে bug মানে টাকায় আঘাত। যে দাম দিতে পারবেন সেটাই বাছুন: টাকার ভারী কাজে framework শেখার খরচ সাধারণত হাতে বানানোর চেয়ে কম।
    ref: what-the-framework-gives
  - q: 'চালু সিস্টেম ফ্যাশনের stack-এ নতুন করে লেখা ঝুঁকির কেন?'
    a: 'বছরের পর বছরের লুকানো নিয়ম আবার বানাতে হয়, অনেক দিন দুটো সিস্টেম চলে, আর না-মাপা আসল সমস্যা প্রায়ই থেকেই যায়।'
    more: |
      আগে মাপুন। একটা ধীর রিপোর্টে হয়তো দরকার একটা index, নতুন ভাষা নয়। rewrite করুন শুধু তখন, যখন মাপা কোনো সীমা চালু stack-এ সারানো যায় না — যেমন তার security সাপোর্ট বন্ধ হয়ে গেছে। নইলে আন্দাজের পেছনে [[thinking/build-vs-buy|complexity budget]] খরচ হয়।
    ref: fashion-and-benchmarks

quiz:
  - q: 'নাদিয়ার ভিডিও সাইট কেউ ভিডিও আপলোড করলেই আটকে যায়, কারণ রূপান্তর চলছে ওয়েব request-এর ভেতরেই। সবচেয়ে ভালো সমাধান কোনটা?'
    hint: 'ভিডিও পাইপলাইনে ভারী কাজ কোথায় থাকার কথা?'
    options:
      - text: 'benchmark-এ দ্রুত এমন ভাষায় ওয়েব অ্যাপ নতুন করে লেখা'
        correct: false
        why: 'ওয়েব ভাষা বাধা ছিল না। অন্য ভাষায়ও রূপান্তর request আটকে রাখত।'
      - text: 'আপলোড object storage-এ রেখে রূপান্তর background worker-এ করানো'
        correct: true
        why: 'request সাথে সাথে ফিরে আসে, আর ধীর রূপান্তর worker সামলায়। ওয়েব অ্যাপ যে ভাষারই হোক, সাড়া দেয়।'
      - text: 'রূপান্তর দ্রুত শেষ করতে আরও বড় সার্ভার কেনা'
        correct: false
        why: 'এতে সমস্যা শুধু পিছোয়। একসাথে দশটা আপলোড এলে দশটা ওয়েব request তখনও আটকে থাকবে।'
      - text: 'নির্মাতাদের ছোট ভিডিও আপলোড করতে বলা'
        correct: false
        why: 'এতে নকশার ত্রুটি ব্যবহারকারীর নিয়মের আড়ালে লুকায়, আর পণ্যের ক্ষতি হয়।'
    ref: two-teams-two-habits
  - q: 'কোনো framework তালিকায় তোলার আগে কাজ সম্পর্কে নিচের কোন প্রশ্নগুলোর উত্তর ঠিক করা উচিত?'
    hint: 'কাজ, টিম আর সাপোর্ট নিয়ে প্রশ্নগুলো বাছুন; জনপ্রিয়তা নিয়ে নয়।'
    options:
      - text: 'টাকা আর audit-এর মতো নির্ভুলতার চাহিদা কতটা কড়া?'
        correct: true
        why: 'এটা ঠিক করে, তৈরি ও পরীক্ষিত সুরক্ষাকে আপনি কতটা দাম দেবেন।'
      - text: 'এই মাসে কোন stack GitHub-এ সবচেয়ে বেশি star পেয়েছে?'
        correct: false
        why: 'জনপ্রিয়তা আপনার কাজ বা টিম সম্পর্কে কিছুই বলে না, আর প্রতি মাসেই বদলায়।'
      - text: 'টিম কী চালাতে পারে, আর কাদের নিয়োগ দেওয়া যাবে?'
        correct: true
        why: 'যত ভালোই হোক, যে stack কেউ সামলাতে পারে না তা ঝুঁকি।'
      - text: 'framework আগে থেকে কী কী তৈরি দেয়?'
        correct: true
        why: 'প্রতিটা built-in মানে একটা কোড যা আপনাকে লিখতে, পরীক্ষা করতে বা patch করতে হয় না।'
      - text: 'শেষ কনফারেন্সের বক্তা কোন stack ব্যবহার করেন?'
        correct: false
        why: 'এটা ফ্যাশন। বক্তার কাজ আপনার কাজ নয়।'
    ref: start-from-the-job
  - q: 'একটা ক্লেইম সিস্টেমকে ছাড় হিসাব করতে হয় এক পয়সা পর্যন্ত ঠিকঠাক, আর প্রতিটা বদল খুঁজে বের করা যেতে হয়। stack বাছতে কোনটা সবচেয়ে ভারী হওয়া উচিত?'
    hint: 'মালটা কতটা নাজুক, সেই প্রশ্নটা ভাবুন।'
    options:
      - text: 'benchmark-এ প্রতি সেকেন্ডে কত request'
        correct: false
        why: 'মোট ভুল হলে গতিতে কিছু আসে-যায় না। এই কাজে নির্ভুলতা সবার আগে।'
      - text: 'ঠিকঠাক দশমিক, কড়া transaction আর audit trail — সম্ভব হলে তৈরি ও পরীক্ষিত'
        correct: true
        why: 'এগুলো ফেল করলে সত্যিকারের টাকা যায়, আর পরিণত stack এগুলো পরীক্ষিত অবস্থায় আপনাকে দেয়।'
      - text: 'ভিডিও চালাতে stack কতটা ভালো'
        correct: false
        why: 'এটা অন্য কাজ, অন্য workload shape।'
      - text: 'syntax কতটা নতুন আর চমকপ্রদ'
        correct: false
        why: 'নতুনত্বে শেখার খরচ আর অজানা ব্যর্থতার ঝুঁকি বাড়ে, যা এই কাজ সইতে পারে না।'
    ref: two-jobs-worked-example
  - q: 'একটা ভিডিও সাইটের কোন অংশগুলো সাধারণত ওয়েব framework-এর বাইরে সামলানো হয়?'
    hint: 'আপলোড থেকে দর্শকের ফোন পর্যন্ত ফাইলটার পথ অনুসরণ করুন।'
    options:
      - text: 'background worker-এ ভিডিওকে নানা মাপে রূপান্তর করা'
        correct: true
        why: 'কাজটা ধীর, তাই ffmpeg-র মতো converter নিয়ে worker-এ চলে, request-এর ভেতরে নয়।'
      - text: 'CDN থেকে জনপ্রিয় ভিডিও পৌঁছানো'
        correct: true
        why: 'CDN দর্শকের কাছে কপি রাখে, তাই অ্যাপ সার্ভারকে ভিডিওর ট্র্যাফিক বইতে হয় না।'
      - text: 'আসল ও রূপান্তরিত ফাইল object storage-এ রাখা'
        correct: true
        why: 'বড় ফাইল যায় তার জন্য বানানো গুদামে, অ্যাপের ডেটাবেসে নয়।'
      - text: 'লগইন করা ব্যবহারকারী চ্যানেল বদলাতে পারবেন কি না ঠিক করা'
        correct: false
        why: 'এই অনুমতি যাচাই business logic। এটা ওয়েব backend-এই থাকে।'
    ref: two-jobs-worked-example
