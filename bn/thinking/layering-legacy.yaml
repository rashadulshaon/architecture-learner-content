flashcards:
  - q: 'Controller, service আর repository-র কাজ আলাদা করে বলো।'
    a: 'Controller HTTP সামলায়, service ব্যবসার নিয়ম চালায়, repository ডেটা আনে-রাখে।'
    more: |
      রেস্টুরেন্টে ওয়েটার, বাবুর্চি আর ভাঁড়ারি যেমন আলাদা। এতে একটার বদল (যেমন HTTP থেকে queue handler) বাকিদের ছোঁয় না, আর প্রতিটাকে আলাদা করে টেস্ট করা যায়।
    ref: layers-and-direction
  - q: 'স্তরের মধ্যে নির্ভরতার দিক কোনটা?'
    a: 'ওপর থেকে নিচে। Controller service-কে চেনে, service repository-কে চেনে, কিন্তু উল্টোটা কখনো নয়।'
    more: |
      নিচের স্তর ওপরকে চিনলে (যেমন service-এর ভেতরে `Request`), তখন একই নিয়ম অন্য জায়গায় (কনসোল কমান্ড, queue) আর কাজে লাগে না। আরও এক ধাপ এগোলে নির্ভরতা পুরো উল্টে দেওয়া যায়, সেটাই [[thinking/hexagonal|hexagonal]]।
    ref: layers-and-direction
  - q: 'Fat controller কেন সমস্যা?'
    a: 'ব্যবসার নিয়ম controller-এ আটকা থাকে, তাই অন্য জায়গায় ব্যবহার, আলাদা টেস্ট বা নিরাপদ বদল কিছুই করা যায় না।'
    more: |
      একই নিয়ম কপি করতে হয়, আর কপিগুলো কালক্রমে ভিন্ন হয়ে যায়। নিয়ম service-এ নিয়ে এলে এক জায়গায় বদলালেই সব জায়গায় বদলে যায়।
    ref: fat-controller
  - q: 'Service-এর ভেতরে `Request` object ধরা কেন ভুল?'
    a: 'তাতে ব্যবসার নিয়ম HTTP-র সাথে বাঁধা পড়ে, আর কনসোল কমান্ড বা queue handler-এ সেই নিয়ম ব্যবহার করা যায় না।'
    more: |
      Controller `Request` থেকে দরকারি মানগুলো তুলে service-কে সাধারণ মান বা DTO হিসেবে দেয়। তাহলে service জানে না কে তাকে ডাকছে: ব্রাউজার, কমান্ড নাকি টেস্ট।
    ref: layers-and-direction
  - q: 'Strangler fig কৌশল কী?'
    a: 'পুরনো অ্যাপ বন্ধ না করে সামনে router বসিয়ে এক এক পথ নতুন কোডে সরানো, শেষে পুরনোটা মুছে ফেলা।'
    more: |
      নাম এসেছে সেই গাছ থেকে, যে অন্য গাছের গা বেয়ে বেড়ে ধীরে তার জায়গা নেয়। পুরো সিস্টেম একদিনে নতুন করে লেখার ঝুঁকির চেয়ে এর ঝুঁকি অনেক কম, কারণ প্রতিটা ধাপ ছোট ও ফেরানো যায়।
    ref: strangler-fig
  - q: 'Strangler fig-এর চার ধাপ কী?'
    a: 'সামনে router বসাও, একটা ছোট পথ নতুন করে লেখো, পাশাপাশি চালিয়ে মেলাও, ট্রাফিক সরিয়ে পুরনো কোড মুছো।'
    more: |
      প্রথম পথ বাছার সময় কম ঝুঁকির, কম নির্ভরতার পথ নাও (যেমন একটা রিপোর্ট)। শেষ ধাপে পুরনো কোড মুছতে ভুলো না, নইলে দুই সিস্টেমই চিরকাল চলতে থাকে।
    ref: strangler-fig
  - q: 'Anti-corruption layer কী কাজে লাগে?'
    a: 'পুরনো সিস্টেমের অদ্ভুত নাম ও ফরম্যাট একটা অনুবাদক class-এ আটকে রাখে, যাতে নতুন কোড পরিষ্কার থাকে।'
    more: |
      অনুবাদক পুরনোর `st = A` কে নতুন কোডের `active: true` বানায়। পুরনো সিস্টেম বদলালে শুধু অনুবাদক class বদলাতে হয়। এটা hexagonal-এর adapter-এরই একটা রূপ।
    ref: anti-corruption-layer
  - q: 'লিগ্যাসি সিস্টেম নতুন করে একবারে লিখে ফেলা কেন ঝুঁকির?'
    a: 'পুরনো কোডে বছরের পর বছরের লুকানো নিয়ম আছে, যেগুলো নতুন লেখায় হারায়, আর কাজ শেষ হতে অনুমানের চেয়ে অনেক বেশি সময় লাগে।'
    more: |
      লেখার পুরো সময়ে পুরনো সিস্টেম আলাদা করে বদলাতে থাকে, তাই নতুনটা সবসময় পিছিয়ে থাকে। ধাপে ধাপে সরালে প্রতিটা ধাপ সত্যিকারের ব্যবহারকারী দিয়ে যাচাই হয়।
    ref: strangler-fig

quiz:
  - q: 'নিচের কোড কোন স্তরের নিয়ম ভাঙছে?'
    lang: php
    code: |
      final readonly class ApplyDiscount
      {
          public function __invoke(Request $request): float
          {
              $total = (float) $request->query->get('total');

              return $total > 5000 ? $total * 0.9 : $total;
          }
      }
    hint: 'ব্যবসার নিয়ম কী জানছে যা তার জানার কথা নয়?'
    options:
      - text: 'Service HTTP-র `Request` চেনে, তাই নির্ভরতা নিচ থেকে ওপরে গেছে'
        correct: true
        why: 'নিয়মটা HTTP ছাড়া ব্যবহার করা যাবে না। Controller মান তুলে সাধারণ `float` বা DTO দিয়ে service ডাকবে।'
      - text: 'ছাড় ৯০% দেওয়া ঠিক হয়নি'
        correct: false
        why: 'হিসাবের মান ঠিক আছে কি না আলাদা বিষয়; স্তরের ভুল হলো `Request` ধরা।'
      - text: 'readonly class-এ __invoke রাখা যায় না'
        correct: false
        why: 'readonly class-এ __invoke নির্বিঘ্নে রাখা যায়।'
      - text: 'এই কোডে কোনো ভুল নেই'
        correct: false
        why: 'নিয়মটা HTTP-র সাথে জড়িয়ে গেছে, তাই কনসোল কমান্ড বা queue handler-এ কাজে লাগবে না।'
    ref: layers-and-direction
  - q: 'ডেভেলপাররা ঠিক করল পুরো পুরনো অ্যাপ বন্ধ রেখে ছয় মাসে নতুন করে লিখবে। strangler fig পদ্ধতির তুলনায় এতে কোন সমস্যাগুলো আছে?'
    hint: 'ছয় মাসে পুরনো অ্যাপ কি থেমে থাকে?'
    options:
      - text: 'লেখার সময় পুরনো অ্যাপেও বদল চলতে থাকে, তাই নতুনটা সবসময় পিছিয়ে থাকে'
        correct: true
        why: 'দুই কোডবেস সমান তালে রাখা কঠিন, আর নতুনটা শেষ হলেও আগের চেয়ে পিছিয়ে থাকে।'
      - text: 'পুরনো কোডের লুকানো নিয়মগুলো হারিয়ে যেতে পারে'
        correct: true
        why: 'বছরের পর বছরের bug-fix কোডে আছে, নথিতে নেই। নতুন লেখায় এগুলো বাদ পড়ে।'
      - text: 'ব্যবহারকারীরা ধাপে ধাপে নতুন সিস্টেম পাবে'
        correct: false
        why: 'এটা strangler fig-এর সুবিধা। পুরো পুনর্লিখনে সবাই একসাথে নতুন সিস্টেম পায়, তাই ভুল ধরা পড়ে দেরিতে।'
      - text: 'রাউটার বসাতে হয়'
        correct: false
        why: 'router বসানো strangler fig-এর ধাপ, পুরো পুনর্লিখনের নয়।'
    ref: strangler-fig
  - q: 'লিগ্যাসি API ব্যালেন্স দেয় স্ট্রিং "1250.50" হিসেবে। নতুন কোডে কোথায় এটাকে পয়সার integer-এ বদলানো উচিত?'
    hint: 'পুরনোর ভাষা কোথায় আটকে রাখবে?'
    options:
      - text: 'একটা অনুবাদক (ACL) class-এ, যাতে নতুন কোড শুধু `balancePaisa` দেখে'
        correct: true
        why: 'অনুবাদ এক জায়গায় থাকে, আর পুরনো ফরম্যাট বদলালে শুধু সেটা বদলাতে হয়।'
      - text: 'প্রতিটা controller-এ যেখানে ব্যালেন্স লাগে'
        correct: false
        why: 'অনুবাদ ছড়ালে পুরনোর ভাষা নতুন কোডে ঢুকে যায়, আর পরিবর্তন সব জায়গায় করতে হয়।'
      - text: 'Twig টেমপ্লেটে ফরম্যাট করার সময়'
        correct: false
        why: 'টেমপ্লেট দেখানোর জায়গা, ডেটা রূপান্তরের নয়।'
      - text: 'বদলানোর দরকার নেই, string দিয়েই হিসাব চালানো যায়'
        correct: false
        why: 'টাকার হিসাব string বা float দিয়ে করলে গোলমাল হয়; পয়সার integer নিরাপদ।'
    ref: anti-corruption-layer
  - q: 'নিচের কোনগুলো controller-এর কাজ?'
    hint: 'ওয়েটারের কাজ ভাবো: নেয়, ডাকে, ফেরত দেয়।'
    options:
      - text: 'DTO-তে request বাঁধা আর যাচাই করা'
        correct: true
        why: 'HTTP-র ভাষা ধরা controller-এর কাজ।'
      - text: 'service ডাকা আর উত্তরের status ঠিক করা'
        correct: true
        why: 'কাজ ডাকা আর HTTP উত্তর সাজানো controller-এর দায়িত্ব।'
      - text: '৫০০০ টাকার ওপরে ছাড়ের হিসাব করা'
        correct: false
        why: 'ব্যবসার নিয়ম service বা domain-এ থাকবে।'
      - text: 'SQL দিয়ে সরাসরি টেবিলে লেখা'
        correct: false
