slides:
  - slug: fat-controller
    title: '৬০০ লাইনের controller: ছাড়ের নিয়ম বদলাতে ভয়'
    kind: story
    tldr: 'HTTP, SQL, ব্যবসার নিয়ম আর ইমেইল এক controller-এ মিশে গেলে ছোট একটা নিয়ম বদলাতেও পুরো ফাইল বুঝতে হয়।'
    keywords: ['fat controller', 'layering', 'separation of concerns', 'business logic', 'ফ্যাট কন্ট্রোলার', 'লেয়ার']
    blocks:
      - type: text
        body: |
          রহিমের অ্যাপে অর্ডারের পুরো কাজ একটা controller-এ: JSON পড়া, SQL চালানো, ছাড়ের হিসাব আর ইমেইল পাঠানো। নিয়মটা "৫০০০ টাকার ওপরে ১০% ছাড়", আর একই নিয়ম আরেকটা API আর অ্যাডমিন পেজেও লাগে। নিয়মটা controller-এর ভেতরে আটকা, তাই রহিম প্রতিটায় কপি করে। ছয় মাস পরে প্রথম অর্ডারে ১৫% ছাড় যোগ হলো। সে দুই কপি বদলাল, তৃতীয়টা ভুলে গেল; ফলে ৬০০০ টাকার প্রথম অর্ডারে ৫,১০০ টাকা কাটা হয়, কিন্তু অ্যাডমিন পেজে দেখায় ৫,৪০০।
      - type: code
        lang: php
        file: 'src/Controller/OrderController.php'
        variant: bad
        code: |
          #[Route('/orders', methods: ['POST'])]
          public function create(Request $r, Connection $db, MailerInterface $mailer): Response
          {
              $data = json_decode($r->getContent(), true);
              $price = $db->fetchOne('SELECT price FROM product WHERE id = ?', [$data['id']]);
              $total = $price * $data['qty'];

              if ($total > 5000) {
                  $total = $total * 0.9; // ছাড়ের নিয়ম controller-এর ভেতরে
              }

              $db->insert('orders', ['user_id' => $this->getUser()->getId(), 'total' => $total]);
              $mailer->send(new Email());

              return new Response('ok');
          }
        marks:
          - {line: 4, tip: 'HTTP-র কাজ: request পড়া। এটা controller-এরই কাজ, কিন্তু এর বেশি কিছু নয়।'}
          - {line: 9, tip: 'ব্যবসার নিয়ম। অন্য কোথাও লাগলে কপি করতে হবে, আর কপিগুলো কখনো সমান থাকে না।'}
          - {line: 12, tip: 'সরাসরি SQL। টেবিলের নাম বদলালে controller-ও ভাঙবে।'}
    aside:
      - type: problem
        body: 'একই ফাইলে চার ধরনের কাজ থাকলে কোনোটা আলাদা করে বদলানো, টেস্ট করা বা অন্য জায়গায় ব্যবহার করা যায় না।'
      - type: remember
        body: 'একটা নিয়ম বদলাতে যত ফাইলে হাত দিতে হয়, গোছানো ততই কম।'
    check:
      q: 'ছাড়ের নিয়ম controller-এর ভেতরে থাকলে আরেকটা API-তে সেটা লাগলে কী হয়?'
      a: 'কপি করতে হয়, আর পরে নিয়ম বদলালে সব কপি আলাদাভাবে বদলাতে হয়। একটা ভুলে গেলে দুই জায়গায় দুই দাম দেখায়।'

  - slug: layers-and-direction
    title: 'তিন স্তর, আর নির্ভরতার একটাই দিক'
    kind: concept
    tldr: 'Controller শুধু HTTP বোঝে, service ব্যবসার নিয়ম, repository ডেটা আনা-নেওয়া; আর নির্ভরতা চলে কেবল ওপর থেকে নিচে।'
    keywords: ['controller service repository', 'dependency direction', 'layered architecture', 'use case', 'স্তর', 'নির্ভরতার দিক']
    blocks:
      - type: metaphor
        icon: shop
        title: 'রেস্টুরেন্টের ওয়েটার, বাবুর্চি, ভাঁড়ার'
        body: |
          ওয়েটার অর্ডার নেয় আর খাবার পৌঁছে দেয়, রান্না করে না। বাবুর্চি রেসিপি জানে, কিন্তু কাস্টমারের টেবিল চেনে না। ভাঁড়ারি শুধু মাল আনে-রাখে, রেসিপি জানে না। এই তিন কাজ আলাদা বলেই ওয়েটার বদলালেও (ফুডপান্ডা থেকে ফোন অর্ডার) বাবুর্চির রান্না বদলাতে হয় না।
      - type: visual
        kind: layers
        caption: 'তিন স্তর, ওপর থেকে নিচে'
        layers:
          - {label: 'Controller', sub: 'HTTP বোঝে: request, response, status', tone: default, tip: 'ওয়েটার। কেবল input নেয়, service ডাকে, উত্তর সাজায়। কোনো ব্যবসার নিয়ম এখানে নয়।'}
          - {label: 'Service / Use case', sub: 'ব্যবসার নিয়ম: ছাড়, যাচাই, কাজের ক্রম', tone: accent, tip: 'বাবুর্চি। এখানেই আসল নিয়ম থাকে, আর এটা HTTP বা SQL কিছুই জানে না।'}
          - {label: 'Repository', sub: 'ডেটা আনা ও রাখা', tone: default, tip: 'ভাঁড়ারি। কীভাবে ডেটা পাওয়া যায় (Doctrine, SQL) এই স্তর জানে, নিয়ম জানে না।'}
          - {label: 'ডেটাবেস', sub: 'আসল ডেটা', tone: muted, tip: 'সবার নিচে। ওপরের সবাই এর ওপর ভর দেয়, কিন্তু এ কাউকে চেনে না।'}
      - type: points
        title: 'কোন স্তর কী জানবে না'
        style: cross
        items:
          - 'Service `Request` বা `Response` চেনে না, কারণ HTTP বদলালেও নিয়ম একই থাকে।'
          - 'Repository কোনো ছাড় বা ব্যবসার নিয়ম জানে না।'
          - 'Controller SQL লেখে না, আর নিয়মও হিসাব করে না।'
      - type: quote
        body: 'নির্ভরতা চলে শুধু নিচের দিকে। নিচের স্তর কখনো ওপরের স্তরকে চেনে না।'
    aside:
      - type: tips
        items:
          - 'টেস্ট করার সময় বোঝা যায় স্তর ঠিক আছে কি না: service-এর টেস্টে HTTP request বানাতে হলে স্তর ঠিক নেই।'
      - type: refs
        items:
          - {to: 'thinking/hexagonal', label: 'Hexagonal: নির্ভরতা আরও উল্টে দেওয়া'}
    check:
      q: 'Service-এর ভেতরে `Request` ধরলে স্তরের কোন নিয়ম ভাঙে?'
      a: 'নির্ভরতা নিচ থেকে ওপরে গেল: ব্যবসার নিয়ম HTTP-কে চেনে। তখন একই নিয়ম কনসোল কমান্ড বা queue handler-এ আর ব্যবহার করা যায় না।'

  - slug: layered-symfony
    title: 'Symfony-তে তিন স্তর সাজানো'
    kind: howto
    tldr: 'Controller শুধু DTO বাঁধে আর service ডাকে; service নিয়ম চালায় ও repository interface ব্যবহার করে, Doctrine থাকে তার নিচে।'
    keywords: ['MapRequestPayload', 'service class', 'repository interface', 'Doctrine', 'PlaceOrder', 'কন্ট্রোলার']
    blocks:
      - type: code
        lang: php
        file: 'src/Controller/OrderController.php'
        variant: good
        code: |
          final readonly class PlaceOrderRequest
          {
              public function __construct(
                  #[Assert\NotBlank] public string $productId,
                  #[Assert\Positive] public int $quantity,
              ) {
              }
          }

          // controller-এর action
          #[Route('/orders', methods: ['POST'])]
          #[IsGranted('ROLE_USER')]
          public function create(
              #[MapRequestPayload] PlaceOrderRequest $in,
              PlaceOrder $placeOrder,
          ): JsonResponse {
              $order = $placeOrder($this->getUser()->getUserIdentifier(), $in->productId, $in->quantity);

              return $this->json(['id' => (string) $order->getId()], 201);
          }
        marks:
          - {line: 4, tip: 'যাচাইয়ের নিয়ম DTO-তেই। controller-এ if-else লাগে না।'}
          - {line: 17, tip: 'controller শুধু একটা service ডাকছে আর উত্তর সাজাচ্ছে। এটাই তার পুরো কাজ।'}
      - type: code
        lang: php
        file: 'src/Order/DiscountPolicy.php + PlaceOrder.php'
        variant: good
        code: |
          // src/Order/DiscountPolicy.php: নিয়মটা একবারই লেখা
          final readonly class DiscountPolicy
          {
              public function apply(int $subtotalPaisa, bool $firstOrder): int
              {
                  $percent = match (true) {
                      $firstOrder => 15,
                      $subtotalPaisa > 500_000 => 10,   // ৫,০০০ টাকার ওপরে
                      default => 0,
                  };

                  return $subtotalPaisa - intdiv($subtotalPaisa * $percent, 100);
              }
          }

          // src/Order/PlaceOrder.php: constructor-এ দুটো repository interface,
          // DiscountPolicy আর message bus ইনজেক্ট হয়
          public function __invoke(string $userId, string $productId, int $qty): Order
          {
              $product = $this->products->get($productId);
              $first = !$this->orders->hasAnyFor($userId);
              $total = $this->discounts->apply($product->priceFor($qty), $first);

              $order = Order::place($userId, $product, $qty, $total);
              $this->orders->save($order);
              $this->bus->dispatch(new OrderPlaced((string) $order->getId()));

              return $order;
          }

          // অন্য API আর অ্যাডমিন পেজও একই এক লাইন ডাকে:
          // $total = $this->discounts->apply($subtotal, $first);
        marks:
          - {line: 7, tip: 'প্রথম অর্ডারে ১৫%, অঙ্ক যা-ই হোক। নতুন নিয়ম এখানেই, আর কোথাও নেই।'}
          - {line: 8, tip: '৫,০০০ টাকার (৫,০০,০০০ পয়সা) ওপরে ছাড় ১০%। বাকিদের ছাড় নেই।'}
          - {line: 20, tip: 'products আর orders হলো interface। Doctrine-এর রূপ থাকে নিচের স্তরে, এই ক্লাস তা দেখেই না।'}
          - {line: 22, tip: 'service মোট দাম চায় DiscountPolicy-র কাছে, তাই নিজের কোনো ছাড়ের নিয়ম রাখে না। ২য় আর ৩য় caller-ও তা-ই করে।'}
          - {line: 26, tip: 'এখানে ইমেইল নেই। OrderPlaced শোনা আলাদা handler তা পাঠায়, তাই এই ক্লাসে HTTP বা mailer নেই।'}
      - type: visual
        kind: compare
        caption: '৬০০০ টাকার একটা প্রথম অর্ডার: নিয়ম সরানোর আগে ও পরে'
        columns:
          - title: 'আগে: তিনটা কপি'
            tone: bad
            icon: cross
            tip: 'প্রতিটা জায়গা নিজে ছাড় হিসাব করত, তাই প্রতিটা হাতে হাতে বদলাতে হতো।'
            items:
              - 'Checkout ১৫%-এ বদলানো: ৫,১০০ টাকা কাটে'
              - 'অ্যাডমিন পেজে বদল বাদ পড়েছে: দেখায় ৫,৪০০'
              - 'একই অর্ডারের দুই রকম দাম'
          - title: 'পরে: DiscountPolicy'
            tone: good
            icon: check
            tip: 'নিয়ম থাকে এক ক্লাসে, আর প্রতিটা জায়গা তাকেই জিজ্ঞেস করে।'
            items:
              - 'নিয়ম এক ক্লাসে, নিজের test-সহ'
              - 'Checkout, অন্য API আর অ্যাডমিন পেজ সবাই apply() ডাকে'
              - 'পরের বদলে হাত পড়ে এক ফাইলে, আর তিনটাই একমত থাকে'
    aside:
      - type: tips
        items:
          - 'service-এর নাম রাখুন কাজ ধরে (`PlaceOrder`, `CancelOrder`), `OrderManager` ধরনের অস্পষ্ট নাম নয়।'
          - 'একটা service-এ একটাই কাজ রাখলে টেস্ট লেখা সহজ হয়।'
      - type: terms
        items:
          - {term: 'DTO', meaning: 'Data Transfer Object: শুধু তথ্য বহনকারী সাধারণ object, এখানে যাচাই-করা request-এর ফিল্ড।'}
          - {term: 'Event', meaning: 'কিছু ঘটে গেছে তার বার্তা, যেমন OrderPlaced। আগ্রহী যে কেউ শুনে নিজের কাজ করে।'}
      - type: when
        use:
          - 'যে নিয়ম দুই বা তার বেশি জায়গায় লাগে, বা প্রায়ই বদলায়।'
        avoid:
          - 'এক জায়গায় ব্যবহৃত একবারের যাচাই: private method-ই যথেষ্ট।'
          - 'দাম: খুঁজে পেতে আর গুছিয়ে রাখতে আরেকটা ক্লাস।'
      - type: refs
        items:
          - {to: 'messaging/background-jobs', label: 'পরে করার কাজ queue-তে'}
    check:
      q: 'ইমেইল পাঠানো `PlaceOrder` service-এ না রেখে event দিয়ে কেন আলাদা করা হলো?'
      a: 'অর্ডার সাজানোর নিয়ম আর ইমেইল দুই আলাদা কাজ। আলাদা রাখলে একটা বদলালে আরেকটা ছুঁতে হয় না, আর ইমেইল ধীর হলেও অর্ডারের গতি কমে না।'

  - slug: strangler-fig
    title: 'লিগ্যাসি সরানো: strangler fig, এক টুকরো এক টুকরো'
    kind: howto
    tldr: 'পুরনো অ্যাপ বন্ধ না করে সামনে একটা router বসান, তারপর এক এক করে পথ নতুন কোডে সরান, শেষে পুরনোটা মুছুন।'
    keywords: ['strangler fig', 'legacy migration', 'incremental rewrite', 'nginx routing', 'লিগ্যাসি', 'ধাপে ধাপে বদল']
    blocks:
      - type: metaphor
        icon: building
        title: 'পুরনো সেতুর পাশে নতুন সেতু'
        body: |
          ব্যস্ত সেতু মেরামতের সময় সেটা বন্ধ রাখা যায় না। তাই পাশে নতুন সেতু বানানো হয়, আর এক এক লেন করে গাড়ি সরানো হয়। নতুন লেন ঠিক চললে পুরনো লেন ভেঙে ফেলা হয়। লিগ্যাসি সরানোও একই: একটা router সামনে বসে, আর পথ ধরে ধরে ট্রাফিক সরে।
      - type: visual
        kind: compare
        caption: 'একই পুনর্লিখন, দুই পথে: ক্যালেন্ডারে কী দাঁড়ায়'
        columns:
          - title: 'একবারে সব নতুন করে লেখা'
            tone: bad
            icon: cross
            tip: 'বড় এক ধাক্কার পুনর্লিখন সাধারণত যেভাবে শেষ হয়। সংখ্যাগুলো উদাহরণ, পরিসংখ্যান নয়।'
            items:
              - 'পরিকল্পনা ৬ মাস। বাস্তবে ১৪ মাস, কারণ পুরনো অ্যাপে বদল চলতেই থাকে'
              - 'এতদিন ব্যবহারকারীর কাছে কিছুই পৌঁছায় না'
