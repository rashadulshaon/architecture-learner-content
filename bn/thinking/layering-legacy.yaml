  - slug: shared-database-session
    title: 'দুই অ্যাপ, এক ডেটাবেস, এক login'
    kind: pitfall
    tldr: 'দুই অ্যাপ চলার সময় তারা ডেটাবেস আর login cookie ভাগ করে। ভাগ করা ডেটা আগে যোগ করে পরে সরান, আর নতুন অ্যাপ পুরনোকে জিজ্ঞেস করুক কে login করেছে।'
    keywords: ['shared database', 'expand and contract', 'session', 'strangler fig', 'migration', 'ডেটাবেস ভাগ']
    blocks:
      - type: text
        body: |
          দুই অ্যাপ একসাথে চলার সময় তারা দুটো জিনিস ভাগ করে। **ডেটাবেস**: দুজনেই একই টেবিল পড়ে-লেখে, তাই নতুন অ্যাপের জন্য একটা কলামের নাম বদলালে পুরনোটা সাথে সাথে ভেঙে যায়। **login**: ব্রাউজারে থাকে একটাই session cookie, কিন্তু প্রতিটা অ্যাপ নিজের session রাখে, তাই পুরনো অ্যাপে login করা ব্যবহারকারী নতুনটার কাছে অচেনা।
      - type: code
        lang: sql
        file: 'db/migration.sql'
        variant: bad
        code: |
          -- নতুন অ্যাপ পূর্ণসংখ্যার পয়সা চায়, তাই কলামের নাম বদলানো হলো
          ALTER TABLE orders RENAME COLUMN total TO total_paisa;

          -- পুরনো অ্যাপ এখনো চলছে, আর এখন প্রতিটা অর্ডার-পেজে ব্যর্থ:
          -- SELECT total FROM orders  ->  ERROR: unknown column 'total'
        marks:
          - {line: 2, tip: 'পুরনো অ্যাপ এখনো `total` চায়, তাই এটা চালানোর মুহূর্তেই অর্ডার দেখানো প্রতিটা পেজ ভেঙে যায়।'}
      - type: code
        lang: sql
        file: 'db/migration.sql'
        variant: good
        code: |
          -- ১. Expand: নতুন কলাম যোগ করুন। পুরনো অ্যাপ তা দেখেই না।
          ALTER TABLE orders ADD COLUMN total_paisa BIGINT NULL;

          -- ২. আগের সারিগুলো backfill করুন।
          UPDATE orders SET total_paisa = ROUND(total * 100) WHERE total_paisa IS NULL;

          -- ৩. পুরনো অ্যাপ যাওয়া পর্যন্ত নতুন অ্যাপ দুই কলামেই লেখে।

          -- ৪. Contract: পুরনো অ্যাপ মুছে ফেলার পরেই।
          ALTER TABLE orders DROP COLUMN total;
        marks:
          - {line: 2, tip: 'nullable কলাম যোগ করলে কারও কিছু ভাঙে না, কারণ পুরনো অ্যাপ তা select করে না।'}
          - {line: 5, tip: 'পুরনো সারিগুলো পয়সার মান পায়, তাই নতুন অ্যাপ প্রতিটা অর্ডার পড়তে পারে।'}
          - {line: 10, tip: 'drop-ই একমাত্র ধাপ যা ফেরানো যায় না। কোনো পুরনো কোড `total` না পড়া পর্যন্ত তা অপেক্ষা করে।'}
      - type: visual
        kind: steps
        caption: 'দুই অ্যাপ চলার সময় login ভাগ করা'
        steps:
          - {title: '১. এক ঠিকানা', body: 'Router দুই অ্যাপকে এক domain-এ দেয়, তাই ব্রাউজার দুটোতেই একই cookie পাঠায়।', tip: 'Cookie থাকে domain-এর, অ্যাপের নয়। সামনে এক domain থাকলে ব্যবহারকারীকে দ্বিতীয়বার login করতে হয় না।'}
          - {title: '২. পুরনোকে জিজ্ঞেস', body: 'নতুন অ্যাপ cookie-টা পুরনো অ্যাপের গোপন /internal/whoami-তে পাঠায়, আর user id ফেরত পায়।', tip: 'নিজের session পুরনো অ্যাপই চেনে। তাকে জিজ্ঞেস করলে দুই অ্যাপের মাঝে session-এর ডেটা কপি করতে হয় না।'}
          - {title: '৩. গোপন রাখুন', body: 'ওই endpoint শুধু আপনার নেটওয়ার্কের ভেতর থেকে ডাকা যাবে, ইন্টারনেট থেকে কখনো নয়।', tip: 'চুরি-হওয়া cookie নিয়ে কেউ এটা ডাকতে পারলে জেনে ফেলবে cookie কার, তাই এটা ইন্টারনেটের মুখোমুখি হওয়া চলবে না।'}
          - {title: '৪. login শেষে সরান', body: '/login নিজেই নতুন অ্যাপে এলে whoami-র ডাক মুছে দিন।', tip: 'নতুন অ্যাপ নিজেই session বানালে তার আর জিজ্ঞেস করার দরকার নেই।'}
      - type: quote
        body: 'দুই অ্যাপ চলার সময় ভাগ করা ডেটায় শুধু যোগ করুন। মুছুন পুরনো অ্যাপ যাওয়ার পরে।'
    aside:
      - type: terms
        items:
          - {term: 'Session cookie', meaning: 'ব্রাউজার প্রতি request-এ যে ছোট টোকেন পাঠায়, যাতে সার্ভার বোঝে কোন login-করা ব্যবহারকারী।'}
          - {term: 'Expand and contract', meaning: 'ভাগ করা টেবিল দুই নিরাপদ ধাপে বদলানো: আগে নতুনটা যোগ, পুরনোটা সরানো অনেক পরে।'}
      - type: pitfalls
        items:
          - 'whoami প্রতি request-এ একটা বাড়তি নেটওয়ার্ক-ডাক। উত্তর অল্প সময় cache করুন, নইলে পুরনো অ্যাপই বোতলের গলা হয়ে যায়।'
    check:
      q: 'পুরনো অ্যাপ চলা অবস্থায় `total` কলামের নাম সোজা বদলে ফেললে কী ভুল?'
      a: 'পুরনো অ্যাপ এখনো `total` select করে, তাই সাথে সাথে ভেঙে যায়। আগে নতুন কলাম যোগ করুন, backfill করুন, নতুন অ্যাপ সরান, আর পুরনোটা drop করুন পুরনো অ্যাপ যাওয়ার পরে।'

  - slug: anti-corruption-layer
