          - {line: 2, tip: 'পুরনো row যে-ই পড়ে, তাকে জানতে হয় "A" মানে active। নামটা একবার বদলালে সব জায়গায় খুঁজতে হয়।'}
          - {line: 3, tip: 'ব্যালেন্স এখনো "1250.50" স্ট্রিং, তাই টাকার ওপর float হিসাব চলছে।'}
      - type: code
        lang: php
        file: 'src/Customer/Infrastructure/LegacyCustomerGateway.php'
        variant: good
        code: |
          final readonly class LegacyCustomerGateway implements CustomerDirectory
          {
              public function __construct(private HttpClientInterface $legacy)
              {
              }

              public function find(string $id): Customer
              {
                  $row = $this->legacy
                      ->request('GET', '/cust.php', ['query' => ['cid' => $id]])
                      ->toArray();

                  return new Customer(
                      id: $row['cid'],
                      name: trim($row['nm']),
                      active: 'A' === $row['st'],
                      balancePaisa: (int) round((float) $row['bal'] * 100),
                  );
              }
          }
        marks:
          - {line: 16, tip: 'পুরনোর `st` মান নতুন কোডের `active` bool-এ রূপ নিল। এই অনুবাদ শুধু এখানেই হয়।'}
          - {line: 17, tip: 'দশমিকের টাকা পয়সায় integer করা হলো, কারণ নতুন কোড টাকায় float ব্যবহার করে না।'}
      - type: quote
        body: 'পুরনো সিস্টেমের ভাষা নতুন কোডে ঢুকতে দেবেন না; সীমান্তে অনুবাদ করে ঢোকান।'
