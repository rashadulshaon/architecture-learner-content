slides:
  - slug: wedding-rice
    title: '৫০০ অতিথির বিয়েতে কত চাল লাগবে?'
    kind: story
    tldr: 'নির্ভুল হিসাব দরকার নেই; খাতার পাতায় দুই মিনিটের গোল হিসাব ১০ গুণ ভুল ধরে ফেলে, আর সেটাই সিদ্ধান্তের জন্য যথেষ্ট।'
    keywords: ['back of envelope', 'estimation', 'capacity planning', 'order of magnitude', 'আনুমানিক হিসাব', 'ক্যাপাসিটি']
    blocks:
      - type: text
        body: |
          ক্লায়েন্ট রহিমকে বলল, "১০ লাখ ব্যবহারকারী আসবে, কয়টা সার্ভার লাগবে?" রহিম অনুমানে বলল "৫০টা", আরেকজন বলল "একটাই যথেষ্ট"। দুজনের কেউ হিসাব করেনি। খাতা-কলম নিয়ে পাঁচ মিনিট বসলেই দেখা যেত, দুজনই ভুল।
      - type: metaphor
        icon: pencil
        title: 'বিয়েবাড়ির চালের হিসাব'
        body: |
          ৫০০ অতিথির বিয়েতে বাবুর্চি খাতায় লেখে: অতিথি ৫০০ × মাথাপিছু ২০০ গ্রাম = ১০০ কেজি, আর বাড়তি ১৫ কেজি। এটা নিখুঁত নয়, কিন্তু ১০ কেজি বা ১০০০ কেজি আনার ভুল থেকে বাঁচায়। সিস্টেমের ক্ষমতার হিসাবও ঠিক তেমন: সংখ্যা গোল করুন, গুণ করুন, আর ১০ গুণ ভুলটা ধরুন।
      - type: visual
        kind: compare
        caption: 'হিসাব ছাড়া সিদ্ধান্ত আর খাতার পাতার হিসাব'
        columns:
          - title: 'অনুমানে সিদ্ধান্ত'
            tone: bad
            icon: cross
            tip: 'হিসাব ছাড়া সংখ্যা মানে অন্ধকারে ঢিল। ১০ গুণ বেশি বা কম, দুটোই সম্ভব।'
            items:
              - '"৫০টা সার্ভার" বললে টাকা অপচয়'
              - '"একটাই যথেষ্ট" বললে সেলের দিনে সাইট বন্ধ'
              - 'কেউ জানে না কোন সংখ্যা কোথা থেকে এল'
          - title: 'খাতার পাতায় হিসাব'
            tone: good
            icon: check
            tip: 'পাঁচ মিনিটের গোল হিসাব বলে দেয় কত সার্ভার লাগে, আর কোন অনুমান ঠিক না হলে উত্তর বদলায়।'
            items:
              - 'ধাপে ধাপে গুণ-ভাগ, প্রতিটা অনুমান লেখা'
              - 'উত্তর: প্রায় ৩টা, ৫০টা নয়, ১টাও নয়'
              - 'যেকোনো অনুমান বদলালে সহজে আবার হিসাব'
    aside:
      - type: problem
        body: 'সিস্টেম কেমন হবে তা ঠিক করার আগে জানতে হয় সংখ্যাটা ১০টার, ১০ হাজারের, না ১০ লাখের। অনুমান সেই মাত্রা (order of magnitude) বলে দেয়।'
      - type: terms
        items:
          - {term: 'QPS', meaning: 'Queries/requests per second: প্রতি সেকেন্ডে কয়টা request আসে।'}
          - {term: 'DAU', meaning: 'Daily active users: দিনে যত জন সত্যিই ব্যবহার করে।'}
    check:
      q: 'অনুমান নির্ভুল না হলেও কেন কাজের?'
      a: 'এর কাজ ১০ গুণ ভুল ধরা: সিস্টেমটা ১টা সার্ভারের, ১০টার না ১০০টার সেটা জানা। সঠিক সংখ্যা পরে মেপে নেওয়া যায়।'

  - slug: qps-chain
    title: 'ব্যবহারকারী থেকে সার্ভার: গুণ-ভাগের চেইন'
    kind: concept
    tldr: 'ব্যবহারকারীকে প্রতিজনের request দিয়ে গুণ করুন, ৮৬,৪০০ দিয়ে ভাগ করে QPS পান, peak-এর গুণক বসান, আর এক সার্ভারের ক্ষমতা দিয়ে ভাগ করুন।'
    keywords: ['QPS', 'peak load', 'requests per day', 'server count', 'DAU', 'প্রতি সেকেন্ডে request']
    blocks:
      - type: visual
        kind: flow
        caption: 'এক কুরিয়ার-ট্র্যাকিং অ্যাপের হিসাবের চেইন'
        nodes:
          - {id: dau, label: '১০ লাখ DAU', sub: 'দিনে সক্রিয় ব্যবহারকারী', icon: users, col: 0, row: 1, tip: 'শুরুর অনুমান। মোট ব্যবহারকারী নয়, দিনে যত জন আসলে ঢোকে।'}
          - {id: perday, label: '৫০ লাখ/দিন', sub: 'মোট request', icon: calendar, col: 1, row: 1, tip: 'প্রতিজন দিনে ৫ বার ট্র্যাকিং দেখে ধরে, ১০ লাখ গুণ ৫।'}
          - {id: qps, label: '≈ ৬০ QPS', sub: 'গড় প্রতি সেকেন্ডে', icon: clock, col: 2, row: 1, tip: '৫০ লাখ ভাগ ৮৬,৪০০ সেকেন্ডে প্রায় ৫৮। গোল করে ৬০।'}
          - {id: peak, label: '≈ ৩০০ QPS', sub: 'ব্যস্ত সময়', icon: bolt, tone: accent, col: 3, row: 1, tip: 'গড়ের ৫ গুণ। ব্যস্ত সময়ের জন্যই সার্ভার বানাতে হয়, গড়ের জন্য নয়।'}
          - {id: servers, label: '৩টা সার্ভার', sub: '২টা + ১টা বাড়তি', icon: server, tone: good, col: 4, row: 1, tip: '৩০০ ভাগ ১৫০ (এক সার্ভারের ধরে নেওয়া ক্ষমতা) = ২টা, একটা মরলে সামলাতে আরেকটা।'}
        edges:
          - {from: dau, to: perday, label: 'প্রতিজন দিনে ৫টা request করলে ৫০ লাখ হয়'}
          - {from: perday, to: qps, label: 'দিনের ৮৬,৪০০ সেকেন্ড দিয়ে ভাগ করে গড় QPS মেলে'}
          - {from: qps, to: peak, label: 'ব্যস্ত সময়ের জন্য গড়কে ৫ দিয়ে গুণ করা হয়'}
          - {from: peak, to: servers, label: 'এক সার্ভারের ক্ষমতা দিয়ে ভাগ, আর একটা বাড়তি রাখা'}
      - type: text
        body: |
          ৩০০ QPS মানে ৩০০ জন ঠিক একই সেকেন্ডে "আমার পার্সেল কোথায়" বোতাম টিপছে, যেন ভরা ক্রিকেট স্টেডিয়ামের সবাই একসঙ্গে দরজায় কড়া নাড়ছে। এক সার্ভার সেকেন্ডে প্রায় ১৫০ জনকে উত্তর দিতে পারলে (এটা ধরে নেওয়া সংখ্যা, মেপে নিতে হবে) লাগে ২টা, সঙ্গে ১টা বাড়তি।
      - type: code
        lang: text
        file: 'হিসাবের সূত্র'
        code: |
          request/দিন  = DAU × প্রতিজনের request
          QPS (গড়)    = request/দিন ÷ ৮৬,৪০০      (সহজে: ÷ ১ লাখ)
          QPS (peak)   = গড় × ৩ থেকে ১০           (সাধারণত ৫)
          সার্ভার      = peak ÷ এক সার্ভারের ক্ষমতা + ১টা বাড়তি
        marks:
          - {line: 2, tip: '১ লাখ দিয়ে ভাগ করা সহজ আর মাত্র ১৫% ভুল। অনুমানের জন্য এটা যথেষ্ট।'}
          - {line: 3, tip: 'গুণকটা ব্যবসা অনুযায়ী। সেল বা খেলার রাতে ১০ গুণও হতে পারে, তাই নিজের পুরনো ডেটা দেখুন।'}
      - type: quote
        body: 'সংখ্যা গোল করুন। ১০ গুণ ভুল ধরা পড়া জরুরি, ১০% ভুল নয়।'
    aside:
      - type: tips
        items:
          - 'এক সার্ভারের ক্ষমতা ধরে না নিয়ে একটা ছোট load test দিয়ে মাপুন। হিসাবে সংখ্যাটা বসবে মাপা মান থেকে।'
          - 'Peak-এর গুণক জানতে access log থেকে সবচেয়ে ব্যস্ত ঘণ্টার request দেখুন।'
      - type: refs
        items:
          - {to: 'scaling/load-latency', label: 'Load আর latency মাপা'}
    check:
      q: 'দিনে ৮৬ লক্ষ request এলে গড় QPS কত, আর এটা সার্ভারের হিসাবে সরাসরি ব্যবহার করা ভুল কেন?'
      a: 'প্রায় ১০০ QPS। কিন্তু ব্যস্ত সময়ে এর কয়েক গুণ আসে, তাই সার্ভার বানাতে হয় peak QPS ধরে, গড় ধরে নয়।'

  - slug: numbers-to-memorise
    title: 'যে কয়টা সংখ্যা মুখস্থ রাখলে হিসাব সহজ'
    kind: concept
    tldr: 'সময়ের রূপান্তর (১ দিন ≈ ১ লাখ সেকেন্ড), সাইজের মাপ আর কয়েকটা latency-র মাত্রা জানা থাকলে হিসাব মাথায় মাথায় হয়।'
    keywords: ['latency numbers', 'powers of two', 'seconds in a day', 'bytes', 'KB MB GB', 'মুখস্থ সংখ্যা']
    blocks:
      - type: visual
        kind: table
        caption: 'সময় আর আকারের রূপান্তর'
        headers: ['জিনিস', 'আনুমানিক মান']
        rows:
          - cells: ['১ দিন', '৮৬,৪০০ সেকেন্ড ≈ ১ লাখ']
            tip: 'প্রতি দিনের request-কে QPS-এ বদলাতে এই সংখ্যাই লাগে।'
          - cells: ['১ মাস / ১ বছর', '≈ ২৫ লাখ / ≈ ৩ কোটি সেকেন্ড']
            tip: 'মাসিক বা বার্ষিক হিসাব মাথায় রাখতে কাজে লাগে।'
          - cells: ['১০ লাখ request/দিন', '≈ ১২ QPS']
            tip: 'অর্থাৎ ১ কোটি request/দিন মানে মোটে প্রায় ১২০ QPS, যা একটা ভালো সার্ভার সামলায়।'
          - cells: ['১ KB / ১ MB / ১ GB', '১০^৩ / ১০^৬ / ১০^৯ বাইট']
            tip: 'অনুমানের জন্য হাজারের ধাপই যথেষ্ট; ১০২৪ ধরতে হয় না।'
          - cells: ['একটা টেবিলের সারি', '≈ ১ KB (index সহ আরও বেশি)']
            tip: 'বেশিরভাগ সাধারণ সারি আনুমানিক এত। ১০ কোটি সারি মানে মোটামুটি ১০০ GB।'
          - cells: ['একটা ছবি (সংকুচিত)', '≈ ২০০ KB থেকে ২ MB']
            tip: 'মোবাইলে তোলা ছবি আরও বড়। অনুমানে ধরুন ১ MB।'
      - type: visual
        kind: table
        caption: 'কিছু কাজে কত সময় লাগে'
        headers: ['কাজ', 'আনুমানিক সময়']
        rows:
          - cells: ['RAM থেকে পড়া', '≈ ১০০ ন্যানোসেকেন্ড']
            tip: 'সবচেয়ে দ্রুত। এজন্য cache RAM-এ রাখা হয়।'
          - cells: ['SSD থেকে random পড়া', '≈ ০.১ মিলিসেকেন্ড']
            tip: 'RAM-এর চেয়ে প্রায় হাজার গুণ ধীর, কিন্তু আগের HDD-র চেয়ে অনেক দ্রুত।'
          - cells: ['একই data-centre-এ network round trip', '≈ ০.৫ মিলিসেকেন্ড']
            tip: 'প্রতিটা সার্ভিস call-এর ন্যূনতম দাম। অনেক call জুড়লে এটাই বড় হয়ে ওঠে।'
          - cells: ['HDD seek', '≈ ১০ মিলিসেকেন্ড']
            tip: 'ঘোরানো ডিস্ক। এখন প্রধানত backup-এ ব্যবহার হয়।'
          - cells: ['এক মহাদেশ থেকে আরেকটায় round trip', '≈ ১৫০ মিলিসেকেন্ড']
            tip: 'আলো-গতির সীমা। এজন্য CDN ও কাছের data-centre দরকার।'
    aside:
      - type: remember
        body: 'RAM লাগে ন্যানোসেকেন্ড, SSD আর কাছের network মিলিসেকেন্ডের ভগ্নাংশ, মহাদেশ পেরোতে কয়েক শ মিলিসেকেন্ড।'
      - type: tips
        items:
          - 'সংখ্যাগুলো সময়ের সাথে বদলায়। মাত্রাটা জানা জরুরি, নির্ভুল সংখ্যা নয়।'
    check:
      q: 'দিনে ১ কোটি request এলে গড় QPS প্রায় কত, মুখস্থ সংখ্যায়?'
      a: 'প্রায় ১২০। ১০ লাখ request/দিন ≈ ১২ QPS, তাই ১ কোটি হলে ১০ গুণ, অর্থাৎ ≈ ১২০।'

  - slug: worked-example
    title: 'পুরো হিসাব একবার: কুরিয়ার ট্র্যাকিং অ্যাপ'
    kind: howto
    tldr: 'এক অ্যাপের জন্য QPS, সার্ভার, storage, bandwidth, memory আর খরচ, সব একই খাতায়: ফল মাঝারি, অর্থাৎ ৫০টা নয়, ১টাও নয়, প্রায় ৩টা।'
    keywords: ['capacity example', 'storage estimate', 'bandwidth', 'cache memory', 'cost estimate', 'কুরিয়ার অ্যাপ', 'worked example']
    blocks:
      - type: text
        body: |
          অনুমান: ১০ লাখ DAU, প্রতিজন দিনে ৫ বার পার্সেল দেখে। দিনে ২ লাখ নতুন পার্সেল, প্রতিটার ৮টা status event, প্রতিটা ২০০ বাইট। একটা Symfony সার্ভার ব্যস্ত সময়ে প্রায় ১৫০ QPS সামলায় (এটা পরে load test দিয়ে মেপে নেবেন)। প্রতিটা মেশিনের (app সার্ভার, ডেটাবেস বা Redis) মাসিক খরচ ধরা হলো প্রায় ৮,০০০ টাকা, এটাও অনুমান। এখন প্রতিটা ধাপ আলাদা করে হিসাব করুন।
      - type: visual
        kind: table
        caption: 'কুরিয়ার ট্র্যাকিং অ্যাপের পুরো হিসাব'
        headers: ['হিসাব', 'ধাপ', 'ফল']
        rows:
          - cells: ['গড় QPS', '৫০ লাখ ÷ ৮৬,৪০০', '≈ ৬০/সেকেন্ড']
            tip: '১০ লাখ × ৫ = ৫০ লাখ request প্রতিদিন। সেটাকে সেকেন্ডে ভাগ করা হলো।'
          - cells: ['Peak QPS', '৬০ × ৫ (ব্যস্ত সময়ের গুণক)', '≈ ৩০০/সেকেন্ড']
            tip: 'পণ্য ডেলিভারির সকালে বা ছুটির আগে চাপ বাড়ে। গুণক ৫ ধরা হলো।'
          - cells: ['সার্ভার', '৩০০ ÷ ১৫০ + ১টা বাড়তি', '৩টা']
            tip: '২টা ক্ষমতার জন্য, আর ১টা বাড়তি, যাতে একটা মরলেও বাকি দুটো চাপ সামলাতে পারে।'
          - cells: ['Storage', '২ লাখ × ৮ event × ২০০ বাইট', '≈ ৩২০ MB/দিন, ≈ ১২০ GB/বছর']
            tip: 'এখানে index আর replica ধরা হয়নি। বাস্তবে ২-৩ গুণ ধরুন, তবু এক ডেটাবেসে ধরে।'
          - cells: ['Bandwidth', '৩০০ QPS × ২ KB', '≈ ৬০০ KB/s ≈ ৫ Mbps']
            tip: 'খুব ছোট। এই অ্যাপের জন্য network কোনো সমস্যাই নয়, ছবি বাদ দিয়েছি বলে।'
          - cells: ['Cache memory', '২ লাখ সক্রিয় পার্সেল × ২ KB', '≈ ৪০০ MB']
            tip: 'যে পার্সেল এখন চলমান, শুধু সেগুলো cache-এ রাখলেই চলে। একটা ছোট Redis-এই ধরে।'
          - cells: ['মাসিক খরচ', '(৩ app + ১ DB + ১ Redis) × ৮,০০০', '≈ ৪০,০০০ টাকা']
            tip: 'সার্ভার-সারির ৩টা শুধু app সার্ভার। ডেটাবেস আর Redis আরও ২টা মেশিন, মোট ৫টা। দামটা ধরে নেওয়া; আসল দামে বসান।'
      - type: quote
        body: 'হিসাবের শেষে একটা প্রশ্ন: "উত্তর কি বাস্তবের সাথে মেলে?" ৫ Mbps আর ৩ সার্ভার? হ্যাঁ, মেলে।'
    aside:
      - type: story
        title: 'হিসাব বদলে দিল সিদ্ধান্ত'
        body: |
          একটা টিম ধরে নিয়েছিল ডেটার জন্য sharding লাগবে। হিসাব করে দেখা গেল, বছরে ১২০ GB, যা একটা সাধারণ ডেটাবেস দিব্যি সামলায়। sharding-এর কয়েক মাসের জটিলতা বেঁচে গেল।
      - type: refs
        items:
          - {to: 'data/sharding', label: 'কখন sharding লাগে'}
    check:
      q: 'এই হিসাবে bandwidth ৫ Mbps হওয়ায় কী সিদ্ধান্ত নেওয়া যায়?'
      a: 'network নিয়ে চিন্তা করা অপ্রয়োজনীয়। সময় দিন সার্ভারের সংখ্যা আর ডেটাবেস নিয়ে, যেগুলো এই অ্যাপের আসল সীমা।'

  - slug: estimation-pitfalls
    title: 'অনুমানের চারটা ফাঁদ'
    kind: pitfall
    tldr: 'peak ভুলে যাওয়া, replica ও index ধরতে ভোলা, অনুমানকে সত্য ধরা আর অতি-নিখুঁত দেখানো, এই চারটাই অনুমান নষ্ট করে।'
    keywords: ['estimation mistakes', 'peak', 'assumptions', 'false precision', 'overhead', 'ভুল অনুমান']
    blocks:
      - type: visual
        kind: compare
        caption: 'ভুল অভ্যাস আর তার ঠিক রূপ'
        columns:
          - title: 'ভুল অভ্যাস'
            tone: bad
            icon: cross
            tip: 'এই চারটা ভুলে সংখ্যা ছোট মনে হয় বা অন্ধ বিশ্বাস তৈরি হয়।'
            items:
              - 'শুধু গড় QPS ধরা, peak বাদ'
              - 'storage-এ index ও replica ভুলে যাওয়া'
              - 'অনুমানকে নির্ভুল সত্যের মতো দেখানো'
              - '"৫৭.৩ সার্ভার" লেখা'
          - title: 'ঠিক অভ্যাস'
            tone: good
            icon: check
            tip: 'প্রতিটা ফাঁদের উল্টো অভ্যাসই সেটা ঠেকায়।'
            items:
              - 'গড় × peak-এর গুণক, গুণকের উৎস লেখা'
              - 'storage × ২-৩ (index আর replica-র জন্য)'
              - 'প্রতিটা অনুমান আলাদা করে লিখে রাখা'
              - '"প্রায় ৩টা", গোল সংখ্যায় উত্তর'
      - type: text
        body: |
          কুরিয়ার অ্যাপে দুটো ফাঁদ দেখুন। শুধু গড়: ৬০ QPS দেখে মনে হয় ১৫০ QPS-এর একটা সার্ভারই যথেষ্ট, কিন্তু ব্যস্ত সময়ে আসে ৩০০, ক্ষমতার দ্বিগুণ, তাই উত্তর হামাগুড়ি দেয় বা timeout হয়। শুধু মূল storage: ১২০ GB ২০০ GB ডিস্কে ধরে, কিন্তু index আর replica সহ লাগে ২৪০-৩৬০ GB, আর বছর শেষের আগেই ডিস্ক ভরে যায়।
      - type: points
        title: 'হিসাবের পর তিনটা কাজ'
        style: check
        items:
          - 'অনুমানগুলোর তালিকা করুন, কোনটা বদলালে উত্তর সবচেয়ে বেশি বদলায় সেটা চিহ্নিত করুন।'
          - 'সেই অনুমান আগে মেপে দেখুন: load test করুন বা access log খুলুন।'
          - 'একটা সীমা (range) দিন: "২ থেকে ৫টা সার্ভার"। এক সংখ্যার চেয়ে এটা সৎ।'
      - type: quote
        body: 'অনুমান একটা প্রশ্নের মাত্রা বলে, উত্তর নয়। ভুল ধরা পড়লে সংখ্যা বদলান, নিয়ম নয়।'
    aside:
      - type: pitfalls
        items:
          - 'পুরনো ডেটা থাকলে অনুমান না করে সেটা ব্যবহার করুন। অনুমান শুধু যেখানে ডেটা নেই।'
          - 'অনুমান লিখে রাখুন, নইলে ছয় মাস পরে কেউ জানবে না কোন ধারণার ওপর সিস্টেম দাঁড়িয়ে।'
      - type: refs
        items:
          - {to: 'thinking/design-review', label: 'ডিজাইন রিভিউতে অনুমান যাচাই'}
    check:
      q: 'অনুমানের হিসাব বিশ্বাসযোগ্য করতে সবচেয়ে বেশি কাজে লাগে কোন দুইটা অভ্যাস?'
      a: 'প্রতিটা অনুমান আলাদা করে লিখে রাখা, আর যেটা বদলালে উত্তর সবচেয়ে বেশি বদলায় সেটা আগে মেপে দেখা। আর উত্তর দেওয়া একটা সীমা হিসেবে।'

flashcards:
  - q: 'Back-of-envelope estimation কী?'
    a: 'দ্রুত, গোল সংখ্যায় করা হিসাব, যা সিস্টেমের মাত্রা (১০টা, ১০ হাজার, না ১০ লাখ) বলে দেয়।'
    more: |
      লক্ষ্য নির্ভুলতা নয়, ১০ গুণ ভুল ধরা। কয়েক মিনিটের হিসাব দেখিয়ে দেয় একটা সার্ভার যথেষ্ট কি না, sharding লাগবে কি না, আর কোন অংশ নিয়ে সবচেয়ে বেশি ভাবতে হবে।
    ref: wedding-rice
  - q: 'গড় QPS কীভাবে বের করবেন?'
    a: 'দিনের মোট request ÷ ৮৬,৪০০ (সহজে ÷ ১ লাখ)।'
    more: |
      যেমন ৫০ লাখ request/দিন ÷ ১ লাখ ≈ ৫০ QPS। সংখ্যাটা গড়, তাই সার্ভার বানাতে peak-এর গুণক বসাতে হয়।
    ref: qps-chain
  - q: 'সার্ভার গোনার সময় গড়ের বদলে peak QPS ধরা হয় কেন?'
    a: 'কারণ সিস্টেম ব্যস্ততম সময়ে ভাঙে। গড়ের জন্য বানালে সেল বা ছুটির রাতে সাইট বন্ধ হয়।'
    more: |
      গুণকটা সাধারণত ৩ থেকে ১০ গুণ, ব্যবসার ধরন অনুযায়ী। নিজের access log থেকে সবচেয়ে ব্যস্ত ঘণ্টা দেখলেই আসল গুণক জানা যায়।
    ref: qps-chain
  - q: '১০ লাখ request/দিন মোটামুটি কত QPS?'
    a: 'প্রায় ১২ QPS। তাই ১ কোটি request/দিন মানে মোটে প্রায় ১২০ QPS।'
    more: |
      অনেকের ধারণা, লাখ-কোটি request মানে বিশাল সার্ভার। কিন্তু দিনের মধ্যে ছড়িয়ে থাকায় সংখ্যাটা অনেক ছোট হয়ে যায়। ভয় পাওয়ার আগে ভাগ করুন।
    ref: numbers-to-memorise
  - q: 'RAM, SSD আর network round trip-এর মোটামুটি সময় কত?'
    a: 'RAM ≈ ১০০ ন্যানোসেকেন্ড, SSD random পড়া ≈ ০.১ ms, একই data-centre-এ network ≈ ০.৫ ms।'
    more: |
      RAM থেকে SSD প্রায় হাজার গুণ ধীর, আর network round trip তার চেয়ে আরও কয়েক গুণ ধীর। এজন্য cache RAM-এ রাখা হয়, আর অনেক ছোট ছোট সার্ভিস call জুড়লে network সময়ই বড় হয়ে ওঠে।
    ref: numbers-to-memorise
  - q: 'Storage হিসাবে মোট ডেটার সাথে আর কী ধরতে হয়?'
    a: 'Index আর replica। সাধারণ হিসাবে মূল ডেটার ২-৩ গুণ জায়গা লাগে।'
    more: |
      মূল ডেটা ১২০ GB হলেও index-এ বাড়তি জায়গা যায়, আর replica রাখলে কপি আরও বাড়ে। এসব না ধরলে ডিস্ক ভরে যাওয়ার খবর আসে হঠাৎ।
    ref: estimation-pitfalls
  - q: 'অনুমানের উত্তর কীভাবে জানানো উচিত?'
    a: 'গোল সংখ্যায় বা সীমা হিসেবে, যেমন "প্রায় ৩টা" বা "২ থেকে ৫টা", আর অনুমানগুলো সাথে লিখে।'
    more: |
      "৫৭.৩ সার্ভার" লেখা ভুয়া নির্ভুলতা। সীমা আর অনুমানের তালিকা দিলে যে কেউ বুঝতে পারে কোন ধারণা বদলালে উত্তর কতটা বদলায়। এটাই আলোচনা সহজ করে।
    ref: estimation-pitfalls
  - q: 'হিসাবে সার্ভার ৩টা, তাহলে কুরিয়ারের খরচের সারিতে ৫টা মেশিন কেন?'
    a: 'ওই ৩টা শুধু app সার্ভার। ডেটাবেস আর Redis-এরও একটা করে মেশিন লাগে, তাই ৩ + ১ + ১ = ৫টা।'
    more: |
      খরচের হিসাবে QPS-এর সূত্রে পাওয়া সার্ভারই নয়, সব মেশিন গুনতে হয়। প্রতি মেশিন ৮,০০০ টাকা (ধরে নেওয়া দাম) হলে ৫টায় মাসে প্রায় ৪০,০০০ টাকা।
    ref: worked-example
  - q: 'হিসাবের পরের ধাপ কী: অনুমান, না মাপা?'
    a: 'যে অনুমান বদলালে উত্তর সবচেয়ে বেশি বদলায়, সেটা মেপে নিন, যেমন load test বা access log থেকে।'
    more: |
      অনুমান দিয়ে শুরু, কিন্তু যেখানে মাপা সম্ভব সেখানে মাপাই ভালো। এক সার্ভারের ক্ষমতা ১৫০ QPS ধরে নেওয়া যায়, কিন্তু ৩০ মিনিটের load test সেটা সত্যিকারের সংখ্যা দেয়।
    ref: estimation-pitfalls

quiz:
  - q: 'একটা অ্যাপে ২০ লাখ DAU, প্রতিজন দিনে ১০টা request করে। ব্যস্ত সময়ের গুণক ৫। peak QPS প্রায় কত?'
    hint: 'প্রথমে request/দিন, তারপর ÷ ১ লাখ, তারপর গুণক।'
    options:
      - text: 'প্রায় ১,০০০ QPS'
        correct: true
        why: '২০ লাখ × ১০ = ২ কোটি/দিন। ÷ ১ লাখ = ২০০ গড় QPS। × ৫ = ১,০০০ peak।'
      - text: 'প্রায় ২০০ QPS'
        correct: false
        why: 'এটা গড় QPS। peak-এর গুণক ভুলে গেছেন।'
