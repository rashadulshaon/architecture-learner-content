slides:
  - slug: two-languages
    title: 'ব্যবসা এক ভাষায় বলে, কোড আরেক ভাষায়'
    kind: story
    tldr: 'ব্যবসা আর ডেভেলপার যদি একই শব্দে কথা না বলে, ভুল বোঝাবুঝি কোডে ঢুকে যায়; Ubiquitous language হলো দুই পক্ষের এক ভাষা, আর কোডেও সেই শব্দ।'
    keywords: ['ubiquitous language', 'DDD', 'domain-driven design', 'ব্যবসার ভাষা', 'ভুল বোঝাবুঝি', 'domain expert']
    blocks:
      - type: text
        body: |
          ব্যবসার প্রধান বললেন, "অর্ডার বাতিল হলে টাকা ফেরত নয়, শুধু ক্রেডিট দেব।" রহিম refund বানাল। দুই সপ্তাহ পরে বোঝা গেল, "বাতিল" শব্দটা ব্যবসা দুই অর্থে ব্যবহার করে: ক্রেতা বাতিল করলে ক্রেডিট, আর আমরা বাতিল করলে ফেরত। কোডে লেখা ছিল শুধু `setStatus(3)` — কেউ জানত না ৩ মানে কোন বাতিল।
      - type: visual
        kind: table
        caption: 'ব্যবসা যা বলে আর কোডে যা লেখা থাকে'
        headers: ['ব্যবসায়ী বলে', 'কোডে লেখা', 'ভুল কোথায়']
        rows:
          - cells: ['ক্রেতা অর্ডার বাতিল করেছে', 'setStatus(3)', '৩ মানে কী, শুধু লেখক জানে']
            tip: 'ব্যবসার বাক্য আর কোডের বাক্যে মিল নেই, তাই নতুন সদস্য আর ব্যবসা দুজনেই কোড পড়তে পারে না।'
          - cells: ['ক্রেতার ক্রেডিট ব্যালেন্স', 'balance < 0', 'ঋণাত্মক ব্যালেন্স মানে কী?']
            tip: 'একই সংখ্যাকে ব্যবসা ক্রেডিট বলে, কোড ঋণ বলে। শব্দ মেলে না বলে নিয়মও ভুল হয়।'
          - cells: ['কুপন ব্যবহার হয়ে গেছে', 'used_cnt++', 'কতবার ব্যবহার হলে "শেষ"?']
            tip: 'নিয়ম ("একবারই ব্যবহার করা যাবে") কোডে নেই, আছে শুধু একটা কাউন্টার।'
          - cells: ['আমরা অর্ডার প্রত্যাখ্যান করলাম', 'flag2 = true', 'flag2 আসলে কী?']
            tip: 'অর্থহীন নামের flag জমে জমে কোড ধাঁধার মতো হয়ে যায়।'
    aside:
      - type: story
        title: 'দুই "বাতিল"-এর দাম'
        body: |
          ভুল refund-এর কারণে প্রায় ৩০০ ক্রেতা টাকা ফেরত পেয়ে গেল, যাদের পাওয়ার কথা ছিল না। কোডে কোনো bug ছিল না — কোড ঠিক সেটাই করেছে যা ডেভেলপার বুঝেছিল। ভুলটা ছিল বোঝাবুঝিতে।
      - type: terms
        items:
          - {term: 'Domain', meaning: 'যে ব্যবসা বা কাজের জগতের জন্য সফটওয়্যারটা বানানো হচ্ছে।'}
          - {term: 'Domain expert', meaning: 'যিনি ওই ব্যবসা সবচেয়ে ভালো বোঝেন, সাধারণত কর্মী বা ব্যবসায়ী, ডেভেলপার নয়।'}
    check:
      q: 'কোড ঠিকঠাক চলেও ৩০০ ক্রেতা ভুল টাকা ফেরত পেল কেন?'
      a: 'কারণ "বাতিল" শব্দের দুটো অর্থ ছিল আর কেউ আলাদা করেনি। কোড ডেভেলপারের বোঝা অনুযায়ী চলেছে, ব্যবসার প্রয়োজন অনুযায়ী নয়।'

  - slug: words-in-code
    title: 'ব্যবসার বাক্যকে method-এর নাম বানান'
    kind: howto
    tldr: 'প্রতিটা ব্যবসায়িক বাক্যের জন্য আলাদা method, নাম ব্যবসার শব্দে, নিয়ম তার ভেতরে। তাহলে ক্রেতা বাতিল করার পর refund এক নজরেই চোখে পড়ে।'
    keywords: ['ubiquitous language', 'refactoring', 'rename', 'domain method', 'cancelByCustomer', 'ব্যবসার ভাষা কোডে']
    blocks:
      - type: text
        body: |
          রহিমের অর্ডারে ফিরে যাই। ব্যবসার দুটো বাক্য: "ক্রেতা বাতিল করলে সে store credit পায়" আর "আমরা বাতিল করলে টাকা ফেরত (refund) যায়"। Store credit মানে ক্রেতার অ্যাকাউন্টে জমা থাকা টাকা, যা পরের কেনাকাটায় খরচ হয়; refund মানে টাকা হাতে ফেরত। সমাধান: প্রতি বাক্যের জন্য একটা method, নামটা ব্যবসার ঠিক সেই শব্দে।
      - type: code
        lang: php
        file: 'src/Sales/CancelOrderHandler.php'
        variant: bad
        code: |
          // আগে: দুই বাতিলের একই সংখ্যা, তাই দুটোতেই refund চলে যায়
          $order->setStatus(3);
          $payments->refund($order);
          // ব্যবসায় এখানে দুটো নিয়ম; এই লাইনগুলো তাদের আলাদা করে না।
        marks:
          - {line: 2, tip: '৩ মানে "ক্রেতা বাতিল" না "আমরা বাতিল"? লেখক ছাড়া কেউ জানে না, এক মাস পরে লেখকও ভুলে যেতে পারে।'}
          - {line: 3, tip: 'সবসময় refund এক বাতিলে ঠিক, অন্যটায় ভুল। এভাবেই প্রায় ৩০০ ক্রেতা অন্যায্য টাকা পেয়েছিল।'}
      - type: code
        lang: php
        file: 'src/Sales/Order.php'
        variant: good
        code: |
          final class Order
          {
              public function cancelByCustomer(): void
              {
                  $this->cancel(OrderStatus::CancelledByCustomer);
              }

              public function cancelByUs(): void
              {
                  $this->cancel(OrderStatus::CancelledByUs);
              }

              private function cancel(OrderStatus $to): void
              {
                  if ($this->status !== OrderStatus::Placed) {
                      throw new OrderCannotBeCancelled($this->id);
                  }
                  $this->status = $to;
              }
          }

          // handler-এ এখন প্রতিটা ব্যবসায়িক বাক্য পড়ার মতো দুই লাইন:
          $order->cancelByCustomer();
          $customer->addCredit($order->total());   // store credit, refund নয়

          $order->cancelByUs();
          $payments->refund($order);               // আমরা বাতিল: টাকা ফেরত যায়
        marks:
          - {line: 3, tip: 'ব্যবসার বাক্য "ক্রেতা বাতিল করে" এখন একটা method। কোড যিনি পড়েন, তিনি ব্যবসার মুখের শব্দই পড়েন।'}
          - {line: 15, tip: 'দুই বাতিলের একই পাহারা: যে অর্ডার আগেই বাতিল বা পাঠানো হয়ে গেছে, তা আবার বাতিল করা যায় না।'}
          - {line: 24, tip: 'এখানে store credit যোগ হয়, refund-এর ডাক নেই। এই পথে refund থাকলে review-তেই চোখে পড়ত।'}
      - type: quote
        body: 'ব্যবসা বাক্যটা যেভাবে বলে, method-এর নামও সেভাবে রাখুন।'
    aside:
      - type: pitfalls
        items:
          - 'শব্দ নিজে বানানো। ব্যবসার লোকের কাছ থেকে নিন, নইলে তৃতীয় একটা ভাষা তৈরি হয়।'
          - 'পুরো কোডবেস একবারে বদলানো। নতুন method যোগ করুন, caller একটা একটা করে সরান, শেষে `setStatus()` মুছুন।'
      - type: when
        use:
          - 'যে নিয়ম নিয়ে ব্যবসা মুখে কথা বলে: বাতিল, refund, অনুমোদন, মেয়াদ শেষ।'
        avoid:
          - 'নিয়মহীন সাধারণ CRUD পর্দা, যেখানে `setName()` বেশ চলে।'
          - 'দাম: শুরুতে domain expert-এর সময়, আর পুরনো কোড নতুন নামে বদলানো।'
    check:
      q: 'নতুন কোডে ঠিক কোথায় একজন reviewer দেখতে পান যে ক্রেতার বাতিল করা অর্ডারে refund চলবে না?'
      a: 'handler-এ: `cancelByCustomer()`-এর পরে আসে `addCredit()`, কখনো `refund()` নয়। Method-এর নামই ব্যবসার নিয়ম বহন করে, তাই ভুল refund এক নজরেই চোখে পড়ে।'

  - slug: bounded-contexts
    title: 'Bounded context: এক শব্দ, এক অর্থ, এক সীমানা'
    kind: concept
    tldr: 'বড় সিস্টেমে একই শব্দের অর্থ জায়গাভেদে আলাদা; প্রতিটা অর্থের জন্য আলাদা সীমানা (bounded context) টানুন, আর ভেতরে শব্দটার একটাই মানে রাখুন।'
    keywords: ['bounded context', 'ubiquitous language', 'context map', 'DDD', 'সীমানা', 'একই শব্দ ভিন্ন অর্থ']
    blocks:
      - type: metaphor
        icon: shop
        title: 'বিরিয়ানির হোটেলে তিন রকম "অর্ডার"'
        body: |
          ক্যাশ কাউন্টারে "অর্ডার" মানে দাম আর পেমেন্টসহ বিল। রান্নাঘরে একই "অর্ডার" মানে কোন ডেকচিতে কী রান্না হবে তার তালিকা। ডেলিভারির ছেলের কাছে "অর্ডার" মানে ঠিকানাসহ প্যাকেট। তিনজনই ঠিক, কারণ প্রত্যেকে নিজের কাজের ভেতরে একটাই অর্থ ধরে। ভুল হয় তখন, যখন তিন অর্থ এক টেবিলে ঠাসা থাকে: রান্নাঘর ডেকচির কলাম বদলালে ক্যাশ কাউন্টারের বিল ভেঙে যায়।
      - type: visual
        kind: table
        caption: 'একই "অর্ডার" শব্দ, তিন context-এ তিন অর্থ'
        headers: ['', 'Sales', 'Kitchen', 'Delivery']
        rows:
          - cells: ['"অর্ডার" মানে', 'দাম, কুপন, পেমেন্ট', 'কী রান্না হবে', 'ঠিকানাসহ প্যাকেট']
            tip: 'প্রতিটা context তার কাজের জন্য যেটুকু দরকার, শুধু সেটুকুই "অর্ডার"-এর ভেতরে রাখে।'
          - cells: ['মূল তথ্য', 'আইটেম, মোট দাম', 'আইটেম, সময়', 'ঠিকানা, ফোন']
            tip: '৬০ কলামের এক বিশাল Order টেবিলের বদলে তিন context-এর তিনটা ছোট আর স্পষ্ট মডেল।'
          - cells: ['বদলায় যখন', 'দামের নিয়ম বদলায়', 'মেনু বদলায়', 'রুট বদলায়']
            tip: 'বদলের কারণ আলাদা বলে আলাদা context-এ থাকলে একটার বদল অন্যটাকে ভাঙে না।'
          - cells: ['Symfony-তে', 'src/Sales/', 'src/Kitchen/', 'src/Delivery/']
            tip: 'সহজ শুরু: প্রতিটা context আলাদা ফোল্ডার ও namespace, নিজস্ব Order ক্লাস নিয়ে। তারা শুধু id বা event দিয়ে কথা বলে।'
      - type: code
        lang: php
        file: 'src/Sales/OrderPlaced.php + src/Kitchen/StartCooking.php'
        variant: good
        code: |
          // Sales শুধু তা-ই জানায় যা অন্যের দরকার: id আর পদের নাম, দাম নয়
          final readonly class OrderPlaced
          {
              public function __construct(public string $orderId, public array $dishes)
              {
              }
          }

          // Kitchen ওই বার্তা থেকে নিজের অনেক ছোট Order বানায়
          #[AsMessageHandler]
          final class StartCooking
          {
              public function __construct(private KitchenOrders $kitchen)
              {
              }

              public function __invoke(OrderPlaced $event): void
              {
                  $this->kitchen->add(Order::fromDishes($event->orderId, $event->dishes));
              }
          }
        marks:
          - {line: 1, tip: 'বার্তা সীমানা পেরোয় শুধু id আর পদের নাম নিয়ে। দাম ও কুপন Sales-এর ভেতরেই থাকে।'}
          - {line: 19, tip: 'Kitchen বার্তাটাকে নিজের Order বানায়, শুধু রান্নার জন্য যা লাগে তা নিয়ে। Sales-এর টেবিল সে পড়ে না।'}
      - type: quote
        body: 'একটা শব্দের একটাই অর্থ — একটা context-এর ভেতরে। context বদলালে অর্থও বদলাতে পারে।'
    aside:
      - type: remember
        body: 'এক বিশাল Order না বানিয়ে প্রতিটা context-এ তার নিজের ছোট Order।'
      - type: tips
        items:
          - 'ব্যবসার লোকের সাথে বসে তাদের নিজের শব্দ লিখে নিন, আর সেই শব্দই ক্লাস ও method-এর নাম করুন।'
          - 'context-গুলো কথা বলবে id বা event দিয়ে, একে অপরের ডেটাবেস টেবিল ছুঁয়ে নয়।'
      - type: when
        use:
          - 'একই শব্দ আলাদা দল বা আলাদা কাজে আলাদা অর্থে চলে।'
        avoid:
          - 'ছোট অ্যাপ, এক দল, শব্দের একটাই মানে: একটা মডেলই সহজ।'
          - 'দাম: কিছু ডেটা দুই জায়গায় থাকে, আর context-এর মাঝে হাতবদলের কোড লিখতে হয়।'
      - type: refs
        items:
          - {to: 'messaging/events-vs-commands', label: 'context-এর মাঝে event দিয়ে কথা'}
    check:
      q: 'Sales আর Kitchen যদি একটাই Order ক্লাস ভাগ করে, ভবিষ্যতে কী সমস্যা হবে?'
      a: 'প্রতিটা দল নিজের প্রয়োজনে ক্লাস বদলাবে, আর একজনের বদল অন্যজনের কোড ভাঙবে। ক্লাসে সব অর্থের ফিল্ড জমে বিশাল আর বিভ্রান্তিকর হবে।'

  - slug: entity-and-value-object
    title: 'Entity আর value object'
    kind: howto
    tldr: 'Entity চেনা যায় পরিচয় (id) দিয়ে, আর value object চেনা যায় মান দিয়ে; টাকা, ঠিকানার মতো জিনিসকে value object করলে নিয়ম নিজে থেকেই নিরাপদ।'
    keywords: ['entity', 'value object', 'Embeddable', 'Money', 'immutable', 'Doctrine embedded']
    blocks:
      - type: text
        body: |
          দশ টাকার একটা নোট আরেকটা দশ টাকার নোটের বদলে চালানো যায় — কারণ আপনি শুধু মান দেখেন। এটা **value object**: পরিচয় নেই, মান সমান মানে একই, আর একবার বানানোর পর বদলায় না। কিন্তু আপনার NID নম্বর আর আমার নম্বর আলাদা, দুজনের নাম একই হলেও — এটা **entity**: পরিচয় (id) আছে, আর অন্য সব তথ্য বদলালেও সে একই মানুষ।
      - type: code
        lang: php
        file: 'src/Sales/Money.php'
        variant: good
        code: |
          #[ORM\Embeddable]
          final class Money
          {
              private function __construct(
                  #[ORM\Column(type: 'integer')]
                  private int $paisa,
                  #[ORM\Column(length: 3)]
                  private string $currency,
              ) {
              }

              public static function paisa(int $paisa): self
              {
                  return new self($paisa, 'BDT');
              }

              public static function taka(int $taka): self
              {
                  return self::paisa($taka * 100);
              }

              public function plus(self $other): self
              {
                  if ($other->currency !== $this->currency) {
                      throw new \DomainException('ভিন্ন মুদ্রা যোগ করা যায় না');
                  }

                  return new self($this->paisa + $other->paisa, $this->currency);
              }

              public function equals(self $other): bool
              {
                  return $this->paisa === $other->paisa
                      && $this->currency === $other->currency;
              }
          }
        marks:
          - {line: 4, tip: 'private constructor: ইচ্ছামতো যেকোনো মান ঢুকিয়ে ফেলা যায় না, বানাতে হয় নামওয়ালা static method দিয়ে।'}
          - {line: 6, tip: 'টাকা পয়সায় (পূর্ণসংখ্যায়) রাখা হয়। float-এ ০.১ + ০.২ ঠিক ০.৩ হয় না, টাকার হিসাবে তা ভয়ানক।'}
          - {line: 28, tip: 'plus() নিজেকে বদলায় না, নতুন Money ফেরত দেয়। এটাই immutable: একবার বানালে মান আর বদলায় না।'}
      - type: code
        lang: php
        file: 'src/Sales/Customer.php'
        variant: good
        code: |
          #[ORM\Entity]
          class Customer
          {
              #[ORM\Id]
              #[ORM\Column(type: 'uuid')]
              private Uuid $id;

              #[ORM\Embedded(columnPrefix: 'credit_')]
              private Money $credit;

              public function equals(self $other): bool
              {
                  return $this->id->equals($other->id);   // পরিচয় দেখুন, মান নয়
              }
          }
        marks:
          - {line: 6, tip: 'id একবার ঠিক হয়, আর কখনো বদলায় না। নাম, ফোন বদলালেও Customer একই থাকে।'}
          - {line: 9, tip: 'Money এখানে customer টেবিলেই credit_paisa ও credit_currency কলামে সংরক্ষিত হয়। আলাদা টেবিল বা id লাগে না।'}
    aside:
      - type: tips
        items:
          - 'টাকা, ঠিকানা, তারিখ-সীমা, ইমেইল — এসব সাধারণত value object। "দুটো সমান কি না" মান দেখে ঠিক হলে value object।'
          - 'primitive obsession এড়িয়ে চলুন: `string $email`-এর জায়গায় `Email` ক্লাস, যাতে ভুল মান বানানোই যায় না।'
      - type: pitfalls
        items:
          - 'টাকাকে float-এ রাখা। পয়সায় int রাখুন, অথবা আলাদা money library ব্যবহার করুন।'
    check:
      q: 'দুটো Customer-এর নাম, ফোন, সবকিছু একই। তারা কি একই entity, আর Money(৫০০) আর Money(৫০০)?'
      a: 'Customer: না, id আলাদা হলে আলাদা entity। Money: হ্যাঁ, মান সমান মানে একই value object।'

  - slug: money-as-primitive
    title: 'float টাকা আর কাঁচা string-এ কী ভুল হয়'
    kind: pitfall
    tldr: 'float বা কাঁচা string সবই মেনে নেয়, তাই ভুল চুপচাপ ঢুকে পড়ে। Money বা Email object ভুল মান দরজাতেই ফিরিয়ে দেয়।'
    keywords: ['primitive obsession', 'float money', 'rounding error', 'Money', 'Email', 'টাকার হিসাব']
    blocks:
      - type: text
        body: |
          **float** হলো ১৯.৯৯-এর মতো দশমিক সংখ্যা রাখার কম্পিউটারি উপায়: খুব কাছাকাছি, কিন্তু প্রায় কখনোই নিখুঁত নয়। ১৯.৯৯ টাকাকে পয়সায় বদলাতে `19.99 * 100` লিখলে পান 1998.9999999999998, আর `(int)` সেটাকে কেটে করে ১৯৯৮। ওই পণ্য বিক্রি হলেই এক পয়সা উধাও। ১,০০,০০০ বিক্রিতে তা ১,০০০ টাকা, অথচ কোথাও কোনো error আসে না।
      - type: code
        lang: php
        file: 'src/Sales/Checkout.php'
        variant: bad
        code: |
          // ১৯.৯৯ টাকার দাম, ডেটাবেসের জন্য পয়সায় বদলানো হচ্ছে
          $paisa = (int) (19.99 * 100);             // 1998, 1999 নয়: এক পয়সা হারাল

          // টাকা আর ডলার দুটোই "শুধু সংখ্যা", তাই PHP হাসিমুখে যোগ করে
          $total = $creditInTaka + $feeInDollars;   // 500 + 5 = 505 কীসের?

          // ইমেইল "শুধু string", তাই ভাঙা ঠিকানাও ঢুকে যায়
          $customer->setEmail('rahim@');
        marks:
          - {line: 2, tip: 'float 19.99 আসলে কাছাকাছি একটা মান, তাই ১০০ দিয়ে গুণ করলে ১৯৯৯-এর সামান্য নিচে নামে আর (int) বাকিটা ফেলে দেয়।'}
          - {line: 5, tip: 'কোন সংখ্যা টাকা, কোনটা ডলার, তা কোথাও লেখা নেই। যোগফল অর্থহীন, অথচ PHP কোনো error দেয় না।'}
          - {line: 8, tip: 'কাঁচা string সবই মানে। ভাঙা ঠিকানা সংরক্ষিত হয়, আর প্রথম welcome ইমেইল পাঠাতে গিয়ে অনেক পরে, অনেক দূরে ব্যর্থ হয়।'}
      - type: code
        lang: php
        file: 'src/Sales/Checkout.php'
        variant: good
        code: |
          $price = Money::paisa(1999);            // শুরু থেকেই পূর্ণসংখ্যা: নিখুঁত
          $total = $price->plus(Money::taka(5));  // 2499 পয়সা, নিখুঁত

          $total->plus($feeInDollars);            // DomainException: $feeInDollars USD

          Email::fromString('rahim@');            // InvalidArgumentException: বানানোই যায় না
        marks:
          - {line: 1, tip: 'দাম ঢোকে পূর্ণ পয়সায়, তাই float নেই, আর ভুল হওয়ার মতো রূপান্তরও নেই।'}
          - {line: 4, tip: 'ভিন্ন মুদ্রা যোগ করা আটকায় Money::plus()-এর ভেতরেই, নিয়মটা ঠিক যেখানে থাকার কথা।'}
          - {line: 6, tip: 'Email value object নিজের constructor-এই ফরম্যাট দেখে নেয়, তাই ভুল ইমেইল তৈরিই হতে পারে না।'}
      - type: quote
        body: 'টাকা কখনো float-এ নয়। পূর্ণ পয়সায়, Money-র ভেতরে রাখুন।'
    aside:
      - type: pitfalls
        items:
          - 'শতাংশে এখনো rounding-এর নিয়ম লাগে: ১,৯৯৯ পয়সার ৫% হলো ৯৯.৯৫ পয়সা। কীভাবে round হবে ঠিক করুন, আর test লিখুন।'
          - 'একাধিক মুদ্রা, কর, বিনিময় হার থাকলে নিজে না বানিয়ে moneyphp/money-র মতো library নিন।'
      - type: when
        use:
          - 'যে অঙ্ক আপনি যোগ, তুলনা বা সংরক্ষণ করেন: দাম, ব্যালেন্স, ফি।'
        avoid:
          - 'যে সংখ্যা নিয়ে কোনো হিসাব হয় না, যেমন লাইক গণনা: সাধারণ int-ই যথেষ্ট।'
    check:
      q: '`(int) (19.99 * 100)` কেন ১৯৯৮ দেয়, আর সমাধান কী?'
      a: 'float 19.99 নিখুঁতভাবে রাখা হয় না, তাই ১০০ দিয়ে গুণ ১৯৯৯-এর সামান্য নিচে নামে আর `(int)` কেটে দেয়। শুরু থেকেই পূর্ণ পয়সায়, Money object-এর ভেতরে রাখুন।'

  - slug: aggregate-boundary
    title: 'Aggregate: নিয়ম পাহারা দেওয়ার সীমানা'
    kind: pitfall
    tldr: 'একসাথে বদলানো জিনিসগুলোকে একটা aggregate বানান, তার root-টা নিয়ম পাহারা দিক; বাইরের কেউ ভেতরের অংশ সরাসরি বদলালে নিয়ম ভাঙে।'
    keywords: ['aggregate', 'aggregate root', 'invariant', 'encapsulation', 'Doctrine collection', 'transaction boundary']
    blocks:
      - type: text
        body: |
          অর্ডারে নিয়ম আছে: সর্বোচ্চ ২০টা আইটেম, confirm হওয়ার পর কিছু বদলানো যাবে না। এই নিয়মগুলোকে বলে **invariant** — যা সবসময় সত্য থাকতে হবে। নিচের কোডে নিয়মগুলো controller-এ ছড়ানো, তাই অন্য কোথাও থেকে ভাঙা সহজ।
      - type: code
        lang: php
        file: 'src/Controller/OrderController.php'
        variant: bad
        code: |
          // অর্ডারে আগেই ২০ লাইন। ভেতরের collection সরাসরি বদলানো হচ্ছে, কোনো নিয়ম ছাড়াই
          $order->getLines()->add(new OrderLine($order, $productId, 1, $price));

          // status-ও যেকোনো কোড থেকে বদলানো যায়
          $order->setStatus(OrderStatus::Confirmed);
        marks:
          - {line: 2, tip: 'অর্ডারে আগেই ২০ লাইন ছিল, এটা ২১তম বানাল: সীমা কেউ দেখল না। অন্য controller বা command-ও একই কাজ করলে নিয়ম ভাঙবেই।'}
          - {line: 5, tip: 'খালি অর্ডারও confirm হয়ে যেতে পারে। নিয়ম পাহারা দেওয়ার কেউ নেই।'}
      - type: code
        lang: php
        file: 'src/Sales/Order.php'
        variant: good
        code: |
          #[ORM\Entity]
          class Order
          {
              private const MAX_LINES = 20;

              #[ORM\OneToMany(targetEntity: OrderLine::class, mappedBy: 'order',
                  cascade: ['persist'], orphanRemoval: true)]
              private Collection $lines;

              #[ORM\Column(enumType: OrderStatus::class)]
              private OrderStatus $status = OrderStatus::Draft;

              public function addLine(ProductId $product, int $qty, Money $price): void
              {
                  if ($this->status !== OrderStatus::Draft) {
                      throw new OrderAlreadyConfirmed($this->id);
                  }
                  if ($this->lines->count() >= self::MAX_LINES) {
                      throw new TooManyLines(self::MAX_LINES);
                  }
                  $this->lines->add(new OrderLine($this, $product, $qty, $price));
              }

              public function confirm(): void
              {
                  if ($this->lines->isEmpty()) {
                      throw new CannotConfirmEmptyOrder($this->id);
                  }
                  $this->status = OrderStatus::Confirmed;
              }
          }

          // ঠিক করার পর controller: ২১তম লাইন ফিরিয়ে দেওয়া হয়
          $order->addLine($productId, 1, $price);   // TooManyLines ছোড়ে
        marks:
          - {line: 13, tip: 'আইটেম যোগ করার একমাত্র পথ। নিয়মগুলো এই method-এর ভেতরে, তাই সবাইকে মানতে হয়।'}
          - {line: 21, tip: 'Product-কে সরাসরি ধরার বদলে শুধু ProductId রাখা হয়েছে; অন্য aggregate-এর ভেতরে ঢোকার দরকার নেই।'}
          - {line: 26, tip: 'confirm() নিজেই দেখে নেয় অর্ডার খালি কি না। setStatus() নেই বলে এই পাহারা এড়ানো যায় না।'}
      - type: visual
        kind: flow
        caption: 'বাইরে থেকে শুধু root-এর দরজা দিয়ে ঢোকা যায়'
        nodes:
          - {id: ctrl, label: 'Controller', sub: 'বাইরের কোড', icon: browser, col: 0, row: 1, tip: 'শুধু aggregate root-এর public method ডাকে। ভেতরের OrderLine সরাসরি ছোঁয় না।'}
          - {id: order, label: 'Order', sub: 'aggregate root', icon: shield, tone: accent, col: 2, row: 1, tip: 'নিয়মের পাহারাদার। সব বদল এর method দিয়ে যায়।'}
          - {id: line, label: 'OrderLine', sub: 'ভেতরের অংশ', icon: list, col: 4, row: 0, tip: 'Order ছাড়া এর আলাদা অস্তিত্ব নেই। শুধু Order এটাকে বানায় ও বদলায়।'}
          - {id: product, label: 'Product', sub: 'আলাদা aggregate', icon: box, col: 4, row: 2, tip: 'আলাদা সীমানা। Order শুধু এর id রাখে, পুরো object নয়।'}
        edges:
          - {from: ctrl, to: order, label: 'addLine() ডাকে, নিয়ম মানা হয়'}
          - {from: order, to: line, label: 'নিয়ম মেনে OrderLine বানায়'}
          - {from: order, to: product, label: 'শুধু ProductId ধরে রাখে', dashed: true}
      - type: quote
        body: 'ভেতরের অংশ বদলাতে হলে root-এর দরজা দিয়ে যান। এক লেনদেনে একটাই aggregate বদলান।'
    aside:
      - type: pitfalls
        items:
          - 'বিশাল aggregate: সব কিছু একটা root-এর নিচে রাখলে লেনদেন বড় হয় আর lock-এর ঝামেলা বাড়ে। ছোট রাখুন।'
          - 'প্রতিটা ছোট ক্লাসে DDD ঢোকানো। জটিল নিয়ম থাকলে তবেই aggregate; সাধারণ CRUD-এ দরকার নেই।'
      - type: refs
        items:
          - {to: 'thinking/hexagonal', label: 'Repository যেভাবে port হয়'}
    check:
      q: 'কোডে `setStatus()` নেই, আছে `confirm()` — এতে invariant কীভাবে রক্ষা পায়?'
      a: 'confirm() ভেতরে শর্ত যাচাই করে (খালি অর্ডার নয়), আর status বদলানোর একমাত্র পথ ওটাই। বাইরের কেউ শর্ত এড়িয়ে status বদলাতে পারে না।'

flashcards:
  - q: 'Ubiquitous language কী?'
    a: 'ব্যবসার লোক আর ডেভেলপারের একই শব্দভাণ্ডার, যা কথায়, ডকুমেন্টে আর কোডের ক্লাস-method-এর নামেও এক।'
    more: |
      `setStatus(3)`-এর বদলে `cancelByCustomer()` লিখলে ব্যবসার লোক কোড পড়েই ভুল ধরতে পারে। ভাষার ভুল বোঝাবুঝি কমে, নতুন সদস্য দ্রুত শেখে। শব্দগুলো ব্যবসার লোকের কাছ থেকে নিন, নিজে বানাবেন না।
    ref: two-languages
  - q: '"ক্রেতা বাতিল করলে store credit" বাক্যটা কোডে কীভাবে আনবেন?'
    a: 'বাক্যটার জন্য ব্যবসার শব্দে আলাদা method বানান, যেমন `cancelByCustomer()`, আর নিয়মটা status-সংখ্যার বদলে তার ভেতরে রাখুন।'
    more: |
      `setStatus(3)`-এর জায়গায় আসে `cancelByCustomer()` আর `cancelByUs()`। প্রতিটার পরে নিজের ধাপ, credit বা refund, তাই ভুল refund এক নজরেই চোখে পড়ে। ধীরে ধীরে করুন: নতুন method যোগ করুন, caller একটা একটা করে সরান, শেষে setter মুছুন।
    ref: words-in-code
  - q: 'Bounded context কী?'
    a: 'একটা সীমানা, যার ভেতরে প্রতিটা শব্দের একটাই নির্দিষ্ট অর্থ এবং একটাই মডেল।'
    more: |
      একই "অর্ডার" Sales-এ বিল, Kitchen-এ রান্নার তালিকা, Delivery-তে প্যাকেট। প্রতিটার জন্য আলাদা সীমানা (প্রায়ই আলাদা ফোল্ডার বা module) আর আলাদা ক্লাস রাখলে বিশাল বিভ্রান্তিকর মডেল আটকায়।
    ref: bounded-contexts
  - q: 'Bounded context-গুলো কীভাবে পরস্পরের সাথে কথা বলে?'
    a: 'id, API বা event দিয়ে। একে অপরের ডেটাবেস টেবিল বা ভেতরের ক্লাস সরাসরি ছুঁয়ে নয়।'
    more: |
      সীমানা তখনই কাজ করে যখন বাইরে থেকে তা ভাঙা যায় না। Sales ordered-এর event ছাড়লে Kitchen সেটা শুনে নিজের ভাষায় রান্নার তালিকা বানায়। বিস্তারিত: [[messaging/events-vs-commands|event ও command]]।
    ref: bounded-contexts
  - q: 'Bounded context-এ ভাগ করার দাম কী, আর কখন তা পোষায় না?'
    a: 'কিছু ডেটা দুই জায়গায় থাকে আর context-এর মাঝে হাতবদলের কোড লিখতে হয়। এক দল আর শব্দের একটাই মানে হলে একটা মডেলই সহজ।'
    more: |
      Sales আর Kitchen দুজনই অর্ডার id আর পদের নাম জানে, একটা event তা এপার-ওপার করে। অর্থ সত্যিই আলাদা হলে এটা ছোট দাম। যে ছোট অ্যাপে প্রতিটা শব্দের একটাই মানে, সেখানে এটা শুধু বাড়তি কোড।
    ref: bounded-contexts
  - q: 'Entity আর value object-এর মূল পার্থক্য কী?'
    a: 'Entity-র পরিচয় (id) আছে এবং তথ্য বদলালেও সে একই; value object-এর পরিচয় নেই, মান সমান মানেই এক।'
    more: |
      Customer entity: নাম বদলালেও একই id, একই ব্যক্তি। Money value object: ৫০০ টাকা আর ৫০০ টাকা বদলাবদলি করা যায়। value object সাধারণত immutable।
    ref: entity-and-value-object
  - q: 'টাকা কেন float নয়, পয়সায় int বা Money object-এ রাখা হয়?'
    a: 'কারণ float-এ হিসাব সামান্য ভুল হয় (০.১ + ০.২ ≠ ০.৩), যা টাকার হিসাবে অগ্রহণযোগ্য।'
    more: |
      পয়সায় পূর্ণসংখ্যা রাখলে যোগ-বিয়োগ নিখুঁত থাকে। Money value object মুদ্রাও সাথে রাখে, আর ভিন্ন মুদ্রা যোগ করতে গেলে exception ছুড়ে ভুল ধরে ফেলে।
    ref: entity-and-value-object
  - q: 'PHP-তে `(int) (19.99 * 100)` কী ভুল করে?'
    a: 'ফল ১৯৯৯ নয়, ১৯৯৮। float 19.99 নিখুঁত নয়, তাই এক পয়সা উধাও হয়। টাকা শুরু থেকেই পূর্ণ পয়সায় রাখুন।'
    more: |
      প্রতি বিক্রিতে এক পয়সা ক্ষতি নিরীহ মনে হয়, কিন্তু ১,০০,০০০ বিক্রিতে তা ১,০০০ টাকা, আর কোনো error আসেই না। পূর্ণ পয়সা থেকে বানানো Money object এই রূপান্তর কখনো করে না।
    ref: money-as-primitive
  - q: 'Aggregate আর aggregate root কী?'
    a: 'একসাথে বদলানো এবং একসাথে নিয়ম মানা ক্লাসের গুচ্ছ। Root হলো সেই গুচ্ছের একমাত্র দরজা।'
    more: |
      Order হলো root, OrderLine তার ভেতরের অংশ। বাইরের কেউ OrderLine সরাসরি বদলায় না, Order-এর method (`addLine`) দিয়ে বদলায়। repository-ও থাকে শুধু root-এর জন্য।
    ref: aggregate-boundary
  - q: 'Invariant কী, আর aggregate তা কীভাবে রক্ষা করে?'
    a: 'Invariant হলো যে নিয়ম সবসময় সত্য থাকতে হবে। Aggregate root নিজের method-এর ভেতরে তা যাচাই করে আর setter লুকিয়ে রাখে।'
    more: |
      উদাহরণ: "অর্ডারে সর্বোচ্চ ২০ আইটেম।" `addLine()` এই শর্ত দেখে, তাই কোনো পথেই ২১তম আইটেম ঢোকে না। নিয়ম controller-এ ছড়ানো থাকলে একজন ভুলে গেলেই ভাঙে।
    ref: aggregate-boundary

quiz:
  - q: 'ব্যবসা বলে "ক্রেতা অর্ডার বাতিল করেছে", কোডে `$order->setStatus(3)`। Ubiquitous language-এর দৃষ্টিতে কোন বদলটা সবচেয়ে ভালো?'
    hint: 'ব্যবসার বাক্যটা কোডে প্রায় হুবহু দেখা উচিত।'
    options:
      - text: '`$order->cancelByCustomer()`'
        correct: true
        why: 'ব্যবসার শব্দ কোডে এসেছে; ব্যবসার লোকও পড়ে বুঝতে পারে, আর "আমরা বাতিল" আলাদা method হতে পারে।'
      - text: '`$order->setStatus(OrderStatus::CANCELLED)`'
        correct: false
        why: 'সংখ্যার চেয়ে ভালো, কিন্তু "কে বাতিল করল" তা আলাদা হচ্ছে না, আর নিয়ম বাইরে থেকে ভাঙা সহজ থাকে।'
      - text: '`$order->setStatus(3); // 3 = বাতিল`'
        correct: false
        why: 'comment দিয়ে ভাষা ঠিক হয় না, আর "৩" কোন বাতিল তা-ও বলে না।'
      - text: '`$order->flag3 = true;`'
        correct: false
        why: 'অর্থহীন নাম ব্যবসার ভাষা থেকে আরও দূরে সরায়।'
    ref: two-languages
  - q: 'ব্যবসা বলে: "ক্রেতা বাতিল করলে store credit, আমরা বাতিল করলে refund।" কোন নকশায় ভুল refund-এর ভুলটা সবচেয়ে কঠিন হয়?'
    hint: 'কোন নকশায় শুধু method-এর নাম দেখেই নিয়মটা পড়া যায়?'
    options:
      - text: 'একটাই `cancel(bool $byCustomer)` method'
        correct: false
        why: 'সংখ্যার চেয়ে ভালো, কিন্তু call-এর জায়গায় `cancel(true)` কিছুই বলে না, আর দুই নিয়ম এক method-এ জট পাকায়।'
      - text: '`cancelByCustomer()` আর `cancelByUs()` দুটো আলাদা method, প্রতিটার পরে নিজের ধাপ (credit বা refund)'
        correct: true
        why: 'প্রতিটা ব্যবসায়িক বাক্য একটা method-এর নাম, তাই `cancelByCustomer()`-এর পরে refund এক নজরেই ভুল লাগে।'
      - text: 'একটাই `cancel(int $type)`, যেখানে ১ মানে ক্রেতা, ২ মানে আমরা'
        correct: false
        why: 'আবার সংখ্যা: প্রতিটা caller-কে মনে রাখতে হয় ১ আর ২ কী, মূল সমস্যাটাই থেকে গেল।'
      - text: '`setStatus(3)` রেখে সংখ্যাগুলোর মানে wiki-তে লিখে রাখা'
        correct: false
        why: 'wiki আর কোড আলাদা হয়ে যায়, আর লাইনটা লেখার সময় কেউ wiki খোলে না।'
    ref: words-in-code
  - q: 'একটা ই-কমার্সে Sales আর Support দুই দলই "Customer" শব্দ ব্যবহার করে, কিন্তু প্রয়োজন আলাদা। সবচেয়ে ভালো সিদ্ধান্ত কোনটা?'
    hint: 'একই ক্লাস দুই দলের প্রয়োজনে বদলাতে থাকলে কী হয়?'
    options:
      - text: 'দুই context-এ আলাদা Customer ক্লাস রাখা, id দিয়ে সংযোগ'
        correct: true
        why: 'প্রতিটা context নিজের কাজের জন্য যেটুকু দরকার সেটুকুই মডেল করে; একজনের বদল অন্যকে ভাঙে না।'
      - text: 'এক বিশাল Customer ক্লাসে দুই দলের সব ফিল্ড রাখা'
        correct: false
        why: 'ক্লাস বিশাল আর বিভ্রান্তিকর হয়, আর দুই দলের বদল একে অপরকে ভাঙে।'
      - text: 'এক দলকে অন্য দলের শব্দ ব্যবহার করতে বাধ্য করা'
        correct: false
        why: 'প্রয়োজন আলাদা বলেই অর্থ আলাদা। জোর করলে একদলের কাজ ব্যাহত হবে।'
      - text: 'Customer শব্দটাই বাদ দিয়ে সংখ্যা দিয়ে চালানো'
        correct: false
        why: 'ভাষা কেড়ে নিলে বোঝাবুঝির সমস্যা আরও বাড়ে।'
    ref: bounded-contexts
  - q: 'নিচের কোনগুলো সাধারণত value object?'
    hint: '"সমান কি না" কীসে ঠিক হয়: id দিয়ে, না মান দিয়ে?'
    options:
      - text: 'Money (৫০০ টাকা, BDT)'
        correct: true
        why: 'মান সমান মানেই একই; নিজস্ব পরিচয়ের দরকার নেই।'
      - text: 'Email (user@example.com)'
        correct: true
        why: 'একই ঠিকানা মানেই একই ইমেইল। ক্লাসে রাখলে ভুল ফরম্যাট বানানোই যায় না।'
      - text: 'Customer (id সহ)'
        correct: false
        why: 'নাম-ঠিকানা বদলালেও একই Customer থাকে — পরিচয় আছে, তাই entity।'
      - text: 'Order (id সহ)'
        correct: false
        why: 'আইটেম বদলালেও অর্ডার একই — পরিচয় (id) আছে, তাই entity।'
    ref: entity-and-value-object
  - q: 'এক ডেভেলপার `$price = 19.99` নিয়ে লিখল `$paisa = (int) ($price * 100);`। কোনটা সত্য?'
    hint: 'float-কে (int) করলে দশমিক অংশ গোল হয়, না কাটা পড়ে?'
    options:
      - text: 'ফল সবসময় ১৯৯৯, কারণ float থেকে int করলে PHP round করে'
        correct: false
        why: 'float থেকে int করলে PHP দশমিক কেটে ফেলে, round করে না।'
      - text: 'ফল ১৯৯৮ হতে পারে, কারণ 19.99 * 100 হয় 1998.9999999999998 আর (int) দশমিক কেটে দেয়'
        correct: true
        why: 'float নিখুঁত নয়, তাই গুণফল ১৯৯৯-এর সামান্য নিচে নামে আর cast বাকিটা ফেলে দেয়।'
      - text: 'ভুলটা শুধু দশ লাখ টাকার বেশি অঙ্কে হয়'
        correct: false
        why: 'অঙ্কের বড়-ছোটতে কিছু আসে যায় না। ছোট অঙ্কেও এই সামান্য ফারাক দেখা দেয়।'
      - text: 'দাম শুরু থেকেই পূর্ণ পয়সায় (১৯৯৯) রাখলে রূপান্তরই লাগে না'
        correct: true
        why: 'পূর্ণ পয়সায় float নেই, গুণও নেই, তাই কিছু হারানোর উপায় নেই।'
    ref: money-as-primitive
  - q: 'নিচের কোডে aggregate-এর নিয়ম কোথায় ভাঙছে?'
    lang: php
    code: |
      #[Route('/orders/{id}/lines', methods: ['POST'])]
      public function add(Order $order, Request $request, EntityManagerInterface $em): Response
      {
          $line = new OrderLine($order, new ProductId($request->get('p')), 5, $price);
          $order->getLines()->add($line);
          $em->flush();

          return new Response(status: 201);
      }
    hint: 'আইটেমের সর্বোচ্চ সংখ্যা বা confirmed অর্ডারের নিয়ম কে দেখছে?'
    options:
      - text: 'controller সরাসরি ভেতরের collection বদলাচ্ছে; Order-এর কোনো নিয়ম (সীমা, status) যাচাই হচ্ছে না'
