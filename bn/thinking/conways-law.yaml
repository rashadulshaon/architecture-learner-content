slides:
  - slug: three-team-queue
    title: 'একটা কুপন ফিচার, তিন টিমের লাইন'
    kind: story
    tldr: 'টিম ভাগ হলে কাজও সেই ভাগ ধরে চলে — layer ধরে টিম হলে ছোট ফিচারও তিন লাইনে দাঁড়িয়ে থাকে।'
    keywords: ['Conway', 'team structure', 'handoff', 'টিমের কাঠামো', 'লাইন', 'ফিচারের গতি']
    blocks:
      - type: text
        body: |
          একটা কোম্পানিতে টিম ভাগ করা হয়েছে layer ধরে: UI টিম, Backend টিম আর Database টিম। "কুপন কোড" ফিচারে মাত্র তিনটা জিনিস বদলাতে হবে — একটা ফর্ম, একটা API আর একটা টেবিল। কিন্তু তিনটা বদলই তিন টিমের মালিকানায়, তাই ticket একজনের লাইন শেষ করে আরেকজনের লাইনে দাঁড়ায়। ২ দিনের কাজ শেষ হয় ৩ সপ্তাহে। একই তিনজনকে এমন এক টিমে রাখুন, যার হাতে ফর্ম, API আর টেবিল তিনটাই, তাহলে ticket-এর সময় লাগে আসল কাজের ২ দিনের মতো: হাত বদল নেই, লাইনও নেই। এই পাঠের বাকিটা সেখানে পৌঁছানোর পথ।
      - type: visual
        kind: flow
        caption: 'কুপন ফিচারের ticket তিন টিমের লাইন পেরিয়ে যায়'
        nodes:
          - {id: ticket, label: 'কুপন ticket', sub: 'ফিচারের অনুরোধ', icon: ticket, col: 0, row: 1, tip: 'ব্যবসার চাওয়া: কুপন কোড দিলে দাম কমবে। কাজটা আসলে একটাই।'}
          - {id: ui, label: 'UI টিম', sub: 'Vue ফর্ম', icon: browser, col: 1, row: 1, tip: 'শুধু ফ্রন্টএন্ড দেখে। API না থাকলে ফর্ম বানিয়েও কিছু করার নেই।'}
          - {id: api, label: 'Backend টিম', sub: 'Symfony API', icon: api, col: 2, row: 1, tip: 'শুধু API আর business কোড দেখে। টেবিলে কলাম না থাকলে আটকে যায়।'}
          - {id: dbt, label: 'Database টিম', sub: 'টেবিল ও migration', icon: db, col: 3, row: 1, tip: 'schema আর migration এই টিমের হাতে। তাদের নিজেদের লাইনে আরও ১২টা ticket আছে।'}
          - {id: done, label: 'চালু', sub: '৩ সপ্তাহ পরে', icon: flag, tone: bad, col: 4, row: 1, tip: 'কাজ ২ দিনের, অপেক্ষা ৩ সপ্তাহের। দেরিটা কোডে নয়, হাত বদলে।'}
        edges:
          - {from: ticket, to: ui, label: 'ticket প্রথমে UI টিমের লাইনে দাঁড়ায়'}
          - {from: ui, to: api, label: 'UI টিম ফর্ম বানিয়ে API-র জন্য Backend-কে ticket দেয়', tone: warn}
          - {from: api, to: dbt, label: 'Backend টিম কলাম চেয়ে Database টিমকে ticket দেয়', tone: warn}
          - {from: dbt, to: done, label: 'লাইন পেরিয়ে ৩ সপ্তাহ পর ফিচার চালু হয়', tone: bad}
    aside:
      - type: story
        title: 'কেউ ভুল করেনি, তবু দেরি'
        body: |
          প্রতিটা টিম নিজের কাজ ঠিকঠাক আর দ্রুতই করেছে। দেরি হয়েছে কারণ প্রতিটা হাত বদলে অনুরোধ লিখতে হয়, অপেক্ষা করতে হয়, আর অন্য টিমের অগ্রাধিকার মানতে হয়। সমস্যা মানুষে নয়, ভাগের ধরনে।
      - type: problem
        body: 'এই স্লাইড দেখায় টিম ভাগের ধরন কীভাবে কাজের গতি ঠিক করে। কেন এমন হয় তা পরের স্লাইডে।'
    check:
      q: 'কুপন ফিচারের কাজ ২ দিনের হলেও ৩ সপ্তাহ লাগল কেন?'
      a: 'ফিচারটা তিন টিমের মালিকানায় ভাগ হয়ে ছিল। প্রতিটা হাত বদলে ticket লাইনে দাঁড়িয়েছে, আর সেই অপেক্ষাতেই সময় গেছে।'

  - slug: conway-mirror
    title: 'টিম যেমন, সিস্টেম তেমন'
    kind: concept
    tldr: 'Conway-এর সূত্র: সংগঠন যে ভাগে কথা বলে, সিস্টেমও সেই ভাগেই তৈরি হয় — সিস্টেমের সীমানা টিমের সীমানার ছায়া।'
    keywords: ["Conway's Law", 'organizational boundaries', 'communication', 'কনওয়ের সূত্র', 'টিম ও সিস্টেম']
    blocks:
      - type: metaphor
        icon: users
        title: 'বিয়েবাড়ির তিন বাবুর্চি'
        body: |
          বিয়েবাড়িতে পোলাও, রেজালা আর বোরহানি রাঁধে তিনজন আলাদা বাবুর্চি। তারা নিজেদের মধ্যে কম কথা বলে, তাই পোলাওয়ের স্বাদের সাথে রেজালার ঝাল মেলে না — জোড়ার জায়গাটাই এলোমেলো। আর যে দুজন একই চুলার পাশে দাঁড়ায়, তাদের রান্না মিশে একটাই পদ হয়ে যায়। খাবারের ভাগ বাবুর্চির ভাগ অনুসরণ করে।
      - type: quote
        body: 'সিস্টেমের কাঠামো হয় সেই সংগঠনের যোগাযোগ-কাঠামোর নকল, যে সংগঠন সেটা বানায়।'
        by: 'Conway''s Law'
      - type: visual
        kind: table
        caption: 'টিমের যোগাযোগ যেমন, কোডের গঠন তেমন'
        headers: ['টিমের অবস্থা', 'সিস্টেমে যা দেখা যায়']
        rows:
          - cells: ['দুই টিম রোজ একসাথে কাজ করে', 'কোড একই module-এ মিশে যায়']
            tip: 'ঘন যোগাযোগ থাকলে মানুষ সীমানা মানার দরকার বোধ করে না, তাই কোডেও সীমানা থাকে না।'
          - cells: ['দুই টিম কম কথা বলে', 'মাঝখানে স্পষ্ট API আর চুক্তি']
            tip: 'কথা কম বলতে হয় বলেই চুক্তি লিখিত আর পরিষ্কার হতে হয়। এই চাপেই API জন্মায়।'
          - cells: ['টিম layer ধরে ভাগ (UI, Backend, DB)', 'সিস্টেমও layer ধরে ভাগ']
            tip: 'প্রথম স্লাইডের ঘটনা। প্রতিটা ফিচার সব layer ছুঁয়ে যায় বলে প্রতিটা ফিচার সব টিমকে জড়ায়।'
          - cells: ['একটা অংশের কোনো মালিক টিম নেই', 'সেই অংশ সবার, তাই কারো না']
            tip: 'মালিকহীন কোডে কেউ refactor করে না, কেউ test লেখে না। সময়ের সাথে সেটাই সবচেয়ে নোংরা হয়।'
    aside:
      - type: story
        title: 'চার দলের কম্পাইলার'
        body: |
          লোকে প্রায়ই বলে: চারটা দল কম্পাইলার বানালে চার ধাপের কম্পাইলার হয়। কথাটা পরের যুগের সারাংশ। Melvin Conway-র ১৯৬৮ সালের লেখার আসল কথা আরও সাধারণ: নকশা তার পেছনের সংগঠনের যোগাযোগের নকল হয়। তিনি এটাকে নিয়ম হিসেবে বলেননি, পর্যবেক্ষণ হিসেবে বলেছিলেন, আর দশকের পর দশক ধরে এটা মিলে গেছে।
      - type: terms
        items:
          - {term: 'Boundary', meaning: 'দুই অংশের মাঝের রেখা, যেখানে একটা অংশের দায় শেষ আর অন্যটার শুরু।'}
          - {term: 'Handoff', meaning: 'কাজ এক টিম থেকে আরেক টিমের হাতে যাওয়া, সাথে অপেক্ষা আর ভুল বোঝার ঝুঁকি।'}
    check:
      q: 'দুই টিম রোজ একসাথে একই ফাইলে কাজ করলে দুই টিমের মাঝে পরিষ্কার সীমানা তৈরি হবে কি?'
      a: 'না। ঘন যোগাযোগে সীমানার দরকার পড়ে না, তাই কোড মিশে যায়। সীমানা তৈরি হয় তখনই, যখন দুই টিমকে চুক্তির মাধ্যমে কথা বলতে হয়।'

  - slug: inverse-conway
    title: 'উল্টো পথে: আগে চাওয়া সিস্টেম, তারপর টিম'
    kind: howto
    tldr: 'Inverse Conway maneuver: যে আর্কিটেকচার চান, আগে সেই ভাগে টিম সাজান; প্রতিটা সীমানার একজন মালিক আর একটা লিখিত চুক্তি রাখুন।'
    keywords: ['inverse Conway maneuver', 'team topology', 'CODEOWNERS', 'module ownership', 'টিম সাজানো', 'মালিকানা']
    blocks:
      - type: text
        body: |
          সূত্র যদি সত্যি হয়, তাহলে উল্টোটাও কাজে লাগানো যায়: আগে ঠিক করুন সিস্টেম কোন ভাগে চান, তারপর টিম সেই ভাগে সাজান। একে বলে **inverse Conway maneuver**। বিয়েবাড়ির মতো করে বললে: আগে ঠিক করুন কোন কোন পদ লাগবে, তারপর প্রতিটা পদের জন্য একজন বাবুর্চি ঠিক করুন — পদের পুরো দায় তার।
      - type: visual
        kind: steps
        caption: 'চাওয়া আর্কিটেকচার থেকে টিম সাজানোর পাঁচ ধাপ'
        steps:
          - {title: '১. সীমানা আঁকুন', body: 'ব্যবসার ভাগ ধরে: Catalog, Checkout, Billing', tip: 'layer ধরে নয়, ব্যবসার ক্ষমতা ধরে ভাগ করুন। ফিচার যেন একটা ভাগের ভেতরেই শেষ হয়।'}
          - {title: '২. টিমকে মালিক বানান', body: 'প্রতিটা সীমানার একটা টিম', tip: 'একটা সীমানার দুই মালিক মানে কারো মালিকানা না। একটা টিম একাধিক সীমানা নিতে পারে, উল্টোটা নয়।'}
          - {title: '৩. টিমকে full-stack করুন', body: 'UI থেকে টেবিল পর্যন্ত একই টিম', tip: 'টিমের ভেতরে ফ্রন্টএন্ড, backend আর ডেটা জানা মানুষ থাকলে ফিচার হাত না বদলেই শেষ হয়।'}
          - {title: '৪. চুক্তি লিখুন', body: 'সীমানায় interface বা API', tip: 'অন্য টিম আপনার ভেতরের কোড ছোঁবে না, শুধু চুক্তি ধরে কথা বলবে।'}
          - {title: '৫. মাপুন', body: 'ফিচার শেষ হতে কত দিন লাগে', tip: 'lead time কমছে কি না দেখুন। না কমলে সীমানা ভুল জায়গায় টানা হয়েছে।'}
      - type: code
        lang: text
        file: '.github/CODEOWNERS'
        code: |
          # প্রতিটা module-এর একজনই মালিক টিম
          /src/Catalog/    @shop/catalog-team
          /src/Checkout/   @shop/checkout-team
          /src/Billing/    @shop/billing-team
        marks:
          - {line: 2, tip: 'এই path-এ pull request (রিভিউয়ের অপেক্ষায় থাকা বদলের প্রস্তাব) এলে Catalog টিমের review ছাড়া merge হয় না। মালিকানা এখানে কোডেই লেখা।'}
      - type: text
        body: |
          চুক্তি কেন দরকার: Checkout যদি সরাসরি Catalog-এর `Product` entity পড়ে, আর Catalog তার `price` কলামের নাম বদলায়, তাহলে Checkout ভাঙে এবং দুই টিমকে একসাথে বদলাতে হয়, মানে সেই হাত বদলই ফিরে এল। সমাধানের দাম: চুক্তি টেকসই রাখা বাড়তি কোড, আর টিম নতুন করে সাজানো ঝামেলার। ৫ জনের কম ইঞ্জিনিয়ার থাকলে এক টিম আর একটা modular monolith-ই যথেষ্ট।
      - type: code
        lang: php
        file: 'src/Checkout/Cart/AddToCart.php'
        variant: good
        code: |
          // src/Catalog/Api/CatalogApi.php — Catalog টিমের প্রকাশ করা চুক্তি
          interface CatalogApi
          {
              public function priceOf(string $sku): Money;
          }

          // Checkout টিম শুধু চুক্তি চেনে, Catalog-এর Doctrine entity নয়
          final class AddToCart
          {
              public function __construct(private CatalogApi $catalog)
              {
              }

              public function __invoke(Cart $cart, string $sku): void
              {
                  $cart->add($sku, $this->catalog->priceOf($sku));
              }
          }
        marks:
          - {line: 4, tip: 'Catalog টিম চাইলে ভেতরের টেবিল বদলাতে পারে; যত দিন এই method একই থাকে, Checkout জানবেও না।'}
          - {line: 10, tip: 'নির্ভরতা interface-এ। Catalog-এর entity বা repository এখানে ঢুকলে সীমানা ভেঙে যেত।'}
    aside:
      - type: tips
        items:
          - 'বড় reorganization-এর আগে এক-দুই টিম দিয়ে ছোট পরীক্ষা চালান।'
          - 'একটা টিম সামলাতে পারে এমন আকারের (সাধারণত ৫–৯ জন) সীমানা টানুন; এর চেয়ে বড় হলে সীমানা ভাগ করুন।'
      - type: refs
        items:
          - {to: 'thinking/monolith-microservices', label: 'টিম বড় হলে monolith নাকি microservices'}
          - {to: 'thinking/hexagonal', label: 'সীমানায় port আর adapter'}
    check:
      q: 'Inverse Conway maneuver-এ কোনটা আগে ঠিক হয় — টিম, নাকি চাওয়া সিস্টেমের ভাগ?'
      a: 'চাওয়া সিস্টেমের ভাগ। সেই ভাগ ধরে টিম সাজানো হয়, যাতে টিমের স্বাভাবিক যোগাযোগই কাঙ্ক্ষিত আর্কিটেকচার তৈরি করে।'

  - slug: team-service-mismatch
    title: 'টিম আর সার্ভিস না মিললে'
    kind: pitfall
    tldr: 'এক সার্ভিসে তিন টিম, বা এক টিমের ঘাড়ে আটটা সার্ভিস — দুটোই ভুল; আর শুধু organization chart বদলালে কোড বদলায় না।'
    keywords: ['service ownership', 'reorg', 'team size', 'cognitive load', 'সার্ভিসের মালিক', 'টিম আকার']
    blocks:
      - type: text
        body: |
          অনেকে ভাবে টিম ভাগ করলেই সমস্যা শেষ। কিন্তু টিমের ভাগ আর কোডের ভাগ না মিললে ঘর্ষণ থেকেই যায়। যেমন তিন বাবুর্চি একই ডেকচিতে রাঁধতে গেলে একজনের মশলা অন্যজনের স্বাদ নষ্ট করে। নিচে চারটা অমিলের নমুনা আর প্রতিটার সমাধান।
      - type: visual
        kind: compare
        caption: 'অমিল বনাম মিল: টিম আর কোডের সীমানা'
        columns:
          - title: 'যা মেলে না'
            tone: bad
            icon: cross
            tip: 'এই চার অবস্থায় টিমের ভাগ আর কোডের ভাগ আলাদা রেখায় চলে, ফলে কাজ আর দায় ছড়িয়ে যায়।'
            items:
              - 'এক সার্ভিসে তিন টিম commit করে'
              - 'এক ছোট টিমের হাতে আটটা সার্ভিস'
              - 'org chart বদলেছে, কোড যেমন ছিল তেমন'
              - 'মালিকহীন shared library সবাই বদলায়'
          - title: 'যা মেলে'
            tone: good
            icon: check
            tip: 'প্রতিটা সীমানার একজন মালিক, আর মালিকের সামর্থ্যের মধ্যেই সীমানার আকার।'
            items:
              - 'এক সার্ভিস বা module, এক মালিক টিম'
              - 'টিম যতটা বুঝতে পারে, সার্ভিস ততটাই'
              - 'টিম বদলালে সীমানাও নতুন করে টানা'
              - 'shared code-এরও মালিক টিম আছে'
      - type: quote
        body: 'একটা সীমানা, একজন মালিক। টিম বদলালে সীমানাও বদলান।'
    aside:
      - type: pitfalls
        items:
          - 'microservice বানিয়ে ভাবা টিম স্বাধীন হয়ে গেছে। এক টিম সব সার্ভিস বদলালে কেবল network বেড়েছে।'
          - 'টিমের সামর্থ্য না দেখে সার্ভিস ভাগ করা। ৩ জনের টিমের ১০টা সার্ভিস চালানো কঠিন।'
      - type: when
        use: ['টিম বড় হয়ে একে অপরের পায়ে পা পড়ছে', 'ফিচারের lead time বারবার হাত বদলে আটকাচ্ছে']
        avoid: ['টিম ৫ জনের কম, একটা modular monolith-ই যথেষ্ট']
    check:
      q: 'আটটা সার্ভিস বানানোর পর দেখা গেল সব ফিচারে একই টিমকে সব সার্ভিস বদলাতে হচ্ছে। কী ভুল হয়েছে?'
      a: 'সার্ভিসের সীমানা টিমের কাজের ধরনের সাথে মেলেনি। এক টিমের কাজ একাধিক সার্ভিসে ছড়ালে সেগুলো আসলে একটাই সীমানা, তাই একসাথে রাখা বা সীমানা নতুন করে টানা উচিত।'

  - slug: redraw-boundaries
    title: 'সীমানা নতুন করে টানা: আটটা সার্ভিস, তিনটা module'
    kind: howto
    tldr: 'সীমানা নতুন করে টানতে দেখুন সাম্প্রতিক প্রতিটা ফিচার কোন সার্ভিস ছুঁয়েছে; যেগুলো সবসময় একসাথে বদলায়, সেগুলো এক মালিকের এক module।'
    keywords: ['redraw boundaries', 'merge services', 'change together', 'modular monolith', 'সীমানা নতুন করে টানা', 'সার্ভিস মেলানো']
    blocks:
      - type: text
        body: |
          রহিমের তিনজনের টিম আটটা সার্ভিস চালায়, আর প্রতিটা ফিচারে কয়েকটা সার্ভিসে pull request (রিভিউয়ের অপেক্ষায় থাকা কোড-বদলের প্রস্তাব) লাগে। আসল সীমানা কোথায়, তা আন্দাজ করবেন না; ইতিহাস থেকে পড়ে নিন। শেষ কয়েকটা ফিচার কোন কোন সার্ভিস ছুঁয়েছে, লিখে ফেলুন।
      - type: visual
        kind: table
        caption: 'প্রতিটা ফিচার কোন সার্ভিস ছুঁয়েছে, আর কোন module-এ যাবে'
        headers: ['ফিচার', 'যে সার্ভিস ছুঁয়েছে', 'যাবে']
        rows:
          - cells: ['কুপন কোড', 'cart, price, coupon, order', 'Checkout']
            tip: 'একটা ছোট ফিচার চারটা সার্ভিস বদলেছে, মানে চারটা pull request আর চারটা deploy।'
          - cells: ['ফ্রি ডেলিভারি', 'cart, price, order', 'Checkout']
            tip: 'একই দল আবার একসাথে নড়েছে।'
          - cells: ['গিফট র‍্যাপ', 'cart, price', 'Checkout']
            tip: 'আবারও। যে সার্ভিসগুলো প্রতিবার একসাথে বদলায়, সেগুলো ভুল জায়গায় ভাগ করা একটাই সীমানা।'
          - cells: ['রসিদের ইমেইল', 'invoice, mail', 'Notifications']
            tip: 'একসাথে নড়া দ্বিতীয় দল।'
          - cells: ['অর্ডারের SMS', 'mail, sms', 'Notifications']
            tip: 'mail-এ রসিদের ইমেইলের সাথে মিলে যায়, তাই invoice, mail আর sms একই দল।'
          - cells: ['পাসওয়ার্ডের নিয়ম', 'auth', 'Accounts']
            tip: 'auth একা বদলায়, তাই এটা আগেই ভালো সীমানা। ছোঁবেন না।'
      - type: code
        lang: text
        file: 'repository layout'
        variant: good
        code: |
          # আগে: ৮টা সার্ভিস, ৩ জনের ১ টিম। কুপন ফিচার = ৪টা pull request, ৪টা deploy
          cart-service/    price-service/   coupon-service/  order-service/
          invoice-service/ mail-service/    sms-service/     auth-service/

          # পরে: ৩টা module, একই ৩ জন। কুপন ফিচার = ১টা pull request
          src/Checkout/        <- cart + price + coupon + order
          src/Notifications/   <- invoice + mail + sms
          src/Accounts/        <- auth
        marks:
          - {line: 6, tip: 'যে চারটা সার্ভিস সবসময় একসাথে বদলাত, সেগুলো এখন এক module, network call-এর বদলে সাধারণ method call-এ জোড়া।'}
      - type: text
        body: |
          এর দাম: মেলাতে কয়েক সপ্তাহের আসল কাজ লাগে (ডেটা জোড়া, call নতুন করে সাজানো), আর module-গুলো এখন একসাথে deploy হয়। কোনো অংশকে আলাদা রাখুন শুধু তখনই, যখন তার সত্যিই আলাদা scaling বা আলাদা টিম লাগে। কয়েক মাস পরপর এই হিসাব আবার করুন, কারণ টিম বদলালে উত্তরও সরে যায়।
    aside:
      - type: tips
        items:
          - 'git-এর ইতিহাস বিনা পয়সার প্রমাণ: গত তিন মাসে `git log --name-only` দেখালে কোন ফোল্ডার একসাথে নড়ে।'
          - 'মেলানো module এক টিমের বোঝার বাইরে গেলে সেখানে ভাগ করুন যেখানে বদল কম পার হয়, layer ধরে নয়।'
    check:
      q: 'কয়েক মাস ধরে প্রতিটা ফিচারে cart, price আর order একসাথে বদলাচ্ছে। এটা কী বলে?'
      a: 'ওরা আসলে একটাই সীমানা। এক মালিকের এক module-এ মেলান, তাহলে ফিচার তিন pull request-এর বদলে এক pull request হয়।'

flashcards:
  - q: 'Conway-এর সূত্র এক লাইনে কী?'
    a: 'যে সংগঠন সিস্টেম বানায়, সিস্টেমের কাঠামো হয় সেই সংগঠনের যোগাযোগ-কাঠামোর নকল।'
    more: |
      টিমগুলো যে ভাগে কথা বলে, কোডও সেই ভাগেই তৈরি হয়। তিন টিম মানে সাধারণত তিন অংশের সিস্টেম। এটা আইন নয়, বহুবার মিলে যাওয়া পর্যবেক্ষণ।
    ref: conway-mirror
  - q: 'Layer ধরে টিম ভাগ (UI, Backend, DB) করলে কী সমস্যা?'
    a: 'প্রতিটা ফিচার সব layer ছোঁয়, তাই প্রতিটা ফিচার সব টিমকে জড়ায়। ফলে ticket-এর হাত বদল আর অপেক্ষা বাড়ে।'
    more: |
      ২ দিনের কাজ তিন টিমের লাইনে দাঁড়িয়ে ৩ সপ্তাহ হয়ে যায়। প্রতিটা টিম ঠিকঠাক কাজ করলেও দেরি হয়, কারণ দেরিটা হাত বদলের। সমাধান হলো ব্যবসার ক্ষমতা ধরে ভাগ করা full-stack টিম।
    ref: three-team-queue
  - q: 'Inverse Conway maneuver কী?'
    a: 'যে আর্কিটেকচার চান, আগে সেই ভাগে টিম সাজানো, যাতে টিমের স্বাভাবিক যোগাযোগই সেই আর্কিটেকচার তৈরি করে।'
    more: |
      সাধারণত টিম আগে থাকে, সিস্টেম তার ছাঁচে গড়ে। এখানে ক্রম উল্টে দেওয়া হয়: আগে কাঙ্ক্ষিত সীমানা আঁকা, তারপর প্রতিটা সীমানার জন্য মালিক টিম বসানো। বিস্তারিত: [[inverse-conway|পাঁচ ধাপ]]।
    ref: inverse-conway
  - q: 'টিম আর সার্ভিস কীভাবে মেলানো উচিত?'
    a: 'প্রতিটা সার্ভিস বা module-এর একজন মালিক টিম, আর টিমের সামর্থ্যের মধ্যে থাকা সীমানা।'
    more: |
      একটা সার্ভিসে তিন টিম commit করলে কারো দায় থাকে না। এক ছোট টিমের হাতে আটটা সার্ভিস থাকলে সে কোনোটাই ভালো করে চালাতে পারে না। দুই দিকেই ঘর্ষণ বাড়ে।
    ref: team-service-mismatch
  - q: 'Module-এর মালিকানা কোডে কীভাবে লিখে রাখা যায়?'
    a: 'CODEOWNERS ফাইলে path ধরে মালিক টিম লিখে, যাতে সেই path-এর pull request মালিকের review ছাড়া merge না হয়।'
    more: |
      GitHub বা GitLab-এ `/src/Billing/ @shop/billing-team` লিখে দিলে Billing-এর কোডে বদল এলে Billing টিম অটোমেটিক reviewer হয়। মালিকানা আর মুখের কথা থাকে না, ধরা-ছোঁয়ার জিনিস হয়।
    ref: inverse-conway
  - q: 'অন্য টিমের module থেকে কী নেওয়া উচিত?'
    a: 'শুধু তাদের প্রকাশ করা interface বা API। তাদের Doctrine entity বা ভেতরের class সরাসরি নয়।'
    more: |
      ভেতরের class ধরলে মালিক টিম কিছু বদলাতে গেলেই আপনার কোড ভাঙে। interface ধরলে তারা ভেতরে যা খুশি বদলাতে পারে, যত দিন চুক্তি ঠিক থাকে। এটাই সীমানার মূল কাজ।
    ref: inverse-conway
  - q: 'সীমানা নতুন করে টানার সময় কোন সার্ভিসগুলো মেলাবেন, কীভাবে বুঝবেন?'
    a: 'সাম্প্রতিক ফিচারগুলো কোন সার্ভিস ছুঁয়েছে তার তালিকা করুন। যেগুলো বারবার একসাথে বদলায়, সেগুলো এক সীমানা: এক মালিকের নিচে মেলান।'
    more: |
      যেমন কুপন, ফ্রি ডেলিভারি আর গিফট র‍্যাপ ফিচার সবই cart, price আর order বদলালে ওই তিনটা এক Checkout module-এর। দাম হলো আসল মেলানোর কাজ আর একসাথে deploy, তাই কোনো অংশকে আলাদা রাখুন শুধু যদি তার সত্যিই আলাদা scaling লাগে।
    ref: redraw-boundaries
  - q: 'শুধু organization chart বদলালে কেন লাভ হয় না?'
    a: 'কারণ কোডের সীমানা আগের মতোই থাকে। টিম নতুন, কোড পুরনো ভাগে, ফলে ঘর্ষণ থেকে যায়।'
    more: |
      Conway-এর সূত্র দুই দিকেই খাটে: টিম বদলালে সিস্টেম ধীরে বদলায়, আর সিস্টেম না বদলালে টিমও আবার পুরনো ছাঁচে ফিরে যায়। reorg-এর সাথে কোডের সীমানা আর মালিকানাও নতুন করে টানতে হয়।
    ref: team-service-mismatch

quiz:
  - q: 'তিনটা layer-টিমের (UI, Backend, DB) কোম্পানিতে প্রতিটা ফিচার ৩ সপ্তাহ লাগছে। সবচেয়ে ভালো পদক্ষেপ কোনটা?'
    hint: 'দেরিটা কোথায় হচ্ছে — কোড লেখায়, নাকি হাত বদলে?'
    options:
      - text: 'ব্যবসার ক্ষমতা (যেমন Catalog, Checkout) ধরে full-stack টিম বানানো'
        correct: true
        why: 'ফিচার একটা টিমের ভেতরেই শেষ হয়, তাই হাত বদল আর অপেক্ষা কমে যায়।'
      - text: 'প্রতিটা টিমে আরও ২ জন করে লোক নেওয়া'
        correct: false
        why: 'লোক বাড়লে লাইন ছোট হয় না; দেরি হয় হাত বদল আর অপেক্ষায়, কাজের পরিমাণে নয়।'
      - text: 'ticket-এর জন্য আরও বিস্তারিত টেমপ্লেট বানানো'
        correct: false
        why: 'ভালো ticket ভুল বোঝা কমায়, কিন্তু তিন লাইনে দাঁড়ানোর অপেক্ষা কমায় না।'
      - text: 'সব কোড একটা মাত্র repository-তে সরানো'
        correct: false
        why: 'repository এক হলেও টিমের মালিকানার ভাগ থাকে, তাই হাত বদল একই থাকে।'
    ref: three-team-queue
  - q: 'নিচের কোনগুলো inverse Conway maneuver-এর অংশ?'
    hint: 'ক্রমটা মনে করুন: আগে সিস্টেমের ভাগ, তারপর টিম।'
    options:
      - text: 'কাঙ্ক্ষিত module-এর সীমানা আগে আঁকা'
        correct: true
        why: 'এটাই প্রথম ধাপ — চাওয়া আর্কিটেকচার ঠিক না থাকলে টিম সাজানোর কোনো মাপকাঠি থাকে না।'
      - text: 'প্রতিটা সীমানার জন্য একজন মালিক টিম ঠিক করা'
        correct: true
        why: 'মালিক ছাড়া সীমানা টেকে না। মালিক টিমের স্বাভাবিক যোগাযোগই সীমানাটাকে রক্ষা করে।'
      - text: 'বিদ্যমান টিম যেমন আছে তেমন রেখে তাদের ছাঁচে সিস্টেম বানানো'
        correct: false
        why: 'এটা Conway-এর সূত্রকে নিজের মতো কাজ করতে দেওয়া, কাজে লাগানো নয়।'
      - text: 'টিমের মাঝে চুক্তি (interface বা API) লিখে রাখা'
        correct: true
        why: 'সীমানা মানে শুধু রেখা নয়, কীভাবে পার হওয়া যাবে তার নিয়মও।'
    ref: inverse-conway
  - q: 'কোম্পানি ২টা বড় টিমে ভাগ হলো, কিন্তু কোড যেমন ছিল তেমনই — সবাই একই ফোল্ডারে কাজ করে। কয়েক মাস পরে কী দেখা যাবে?'
    hint: 'সীমানা কোডে না থাকলে টিমের ভাগ কিসে টিকবে?'
    options:
      - text: 'দুই টিম একে অপরের কোডে হাত দেবে, merge conflict আর অপ্রত্যাশিত ভাঙন বাড়বে'
        correct: true
        why: 'কোডে সীমানা নেই, তাই টিমের ভাগ শুধু কাগজে। ঘর্ষণ আগের মতোই থাকে।'
      - text: 'কোড নিজে থেকে দুই ভাগ হয়ে যাবে'
        correct: false
        why: 'কোড নিজে ভাগ হয় না; ভাগ করতে হয় ইচ্ছা করে, সীমানা আর মালিকানা ঠিক করে।'
      - text: 'সব সমস্যা মিটে যাবে, কারণ টিম ছোট হয়েছে'
        correct: false
        why: 'টিম ছোট হলেও কোড একই জায়গায় ভাগাভাগি হলে দুজনের কাজ সংঘর্ষ করবেই।'
      - text: 'কিছুই বদলাবে না, সংগঠন আর কোডের কোনো সম্পর্ক নেই'
        correct: false
        why: 'Conway-এর সূত্রই বলে সম্পর্ক আছে। অমিল থাকলে ঘর্ষণ বাড়ে।'
    ref: team-service-mismatch
  - q: 'Checkout টিমের নিচের কোডে সীমানার দিক থেকে সমস্যা কী?'
    lang: php
    code: |
      use App\Catalog\Entity\Product;

      final class AddToCart
      {
          public function __construct(private EntityManagerInterface $em)
          {
          }

          public function __invoke(Cart $cart, string $sku): void
          {
              $product = $this->em->getRepository(Product::class)
                  ->findOneBy(['sku' => $sku]);
              $cart->add($sku, $product->getPrice());
          }
      }
    hint: 'Catalog টিম টেবিলের কলামের নাম বদলালে কী ঘটবে?'
    options:
      - text: 'Checkout সরাসরি Catalog-এর entity ধরেছে, তাই Catalog বদলালে Checkout ভাঙবে'
        correct: true
        why: 'ভেতরের entity আসলে Catalog টিমের গোপন জিনিস। চুক্তি (interface) ছাড়া ধরলে সীমানা থাকে না।'
      - text: 'findOneBy ধীর, তাই find ব্যবহার করা উচিত ছিল'
        correct: false
        why: 'গতি এখানে সমস্যা নয়; সমস্যা হলো কার কোড কার ভেতরে ঢুকেছে।'
      - text: 'class-টা final হওয়ায় test করা যাবে না'
        correct: false
        why: 'final test আটকায় না; এখানে সীমানা ভাঙাটাই আসল সমস্যা।'
      - text: 'কোনো সমস্যা নেই, দুই module একই ডেটাবেসে আছে'
        correct: false
        why: 'ডেটাবেস এক হলেও কোডের মালিকানা আলাদা; এক হলে ভাঙনের ঝুঁকি আরও বাড়ে।'
    ref: inverse-conway
  - q: 'কোন অবস্থায় টিম আর সার্ভিসের ভাগ ঠিকভাবে মিলেছে বলা যায়?'
    hint: 'মালিকানা আর সামর্থ্য — দুটোই দেখুন।'
    options:
      - text: 'প্রতিটা সার্ভিসের একটা মালিক টিম আছে, আর টিম সেটা সামলাতে পারে'
        correct: true
        why: 'দায় পরিষ্কার, আর সীমানা টিমের সামর্থ্যের মধ্যে — দুটোই দরকার।'
      - text: 'প্রতিটা সার্ভিসে তিন টিমই commit করতে পারে, যাতে কেউ আটকে না থাকে'
        correct: false
        why: 'সবার মালিকানা মানে কারো দায় নয়; এভাবে কোড দ্রুত এলোমেলো হয়।'
      - text: 'সার্ভিসের সংখ্যা টিমের সংখ্যার দ্বিগুণ'
        correct: false
        why: 'সংখ্যা নয়, মালিকানা আর টিমের সামর্থ্যই মাপকাঠি।'
      - text: 'একটা টিম সব সার্ভিস দেখে, যাতে সবকিছু এক জায়গায় থাকে'
        correct: false
        why: 'টিম বড় আর বোঝা ভারী হলে কোনো সার্ভিসই ভালো চলে না; আর তখন তো সার্ভিস ভাগের মানেই থাকে না।'
    ref: team-service-mismatch
  - q: 'তিন মাস ধরে একটা টিমের প্রতিটা ফিচারে cart, price আর order সার্ভিস একসাথে বদলেছে, কখনো একা নয়। তাদের কী করা উচিত?'
    hint: 'যে সার্ভিসগুলো সবসময় একসাথে বদলায়, সেগুলো আসলে কী?'
    options:
      - text: 'তিন সার্ভিসের মাঝে আরও retry আর timeout বসানো'
        correct: false
        why: 'এতে call ভরসাযোগ্য হয়, কিন্তু তিনটাতেই প্রতিবার বদল আর deploy লাগেই।'
      - text: 'এগুলোকে একটাই সীমানা ধরে এক মালিকের এক module-এ মেলানো'
        correct: true
        why: 'ইতিহাস বলছে সীমানা ভুল জায়গায় টানা ছিল। এক module মানে প্রতি ফিচারে এক pull request আর এক deploy।'
      - text: 'গতি বাড়াতে প্রতিটা সার্ভিস আলাদা টিমকে দেওয়া'
        correct: false
        why: 'তাহলে প্রতিটা ফিচার তিন টিম আর তিন লাইন পার হবে, প্রথম স্লাইডের সমস্যাটাই।'
      - text: 'কিছুই না, কারণ আলাদা সার্ভিস সবসময়ই ভালো'
        correct: false
        why: 'আলাদা সার্ভিসের লাভ তখনই, যখন তারা আলাদাভাবে বদলাতে পারে। এগুলো পারে না।'
    ref: redraw-boundaries
