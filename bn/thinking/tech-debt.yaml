slides:
  - slug: interest-grows
    title: 'ঈদের তাড়ায় নেওয়া ধার, ছয় মাস পরে সুদসহ'
    kind: story
    tldr: 'তাড়ার কাজ ঠিকমতো না করলে সেটা ধারের মতো জমে, আর সুদ হিসেবে প্রতিটা নতুন ফিচার একটু একটু ধীর হয়।'
    keywords: ['technical debt', 'interest', 'shortcut', 'টেক ডেট', 'সুদ', 'copy paste']
    blocks:
      - type: text
        body: |
          রহিমের টিম ঈদের অফারের জন্য তিন দিনে একটা ফিচার বানাল। সময় ছিল না, তাই পুরনো checkout-এর কোড কপি করে অর্ধেক বদলে বসানো হলো। ঈদে বিক্রি দারুণ হলো, সবাই খুশি। কিন্তু এরপর checkout-এ যেকোনো বদল দুই জায়গায় করতে হয়, আর একটা জায়গা প্রায়ই ভুলে যায়।
      - type: visual
        kind: bars
        caption: 'একই মাপের ফিচার বানাতে লাগা সময়, মাস ধরে'
        items:
          - {label: 'ঈদের আগে', value: 2, display: '২ দিন', tone: good, tip: 'তখন কোড ছিল পরিষ্কার, একটা বদল একটা জায়গাতেই করতে হতো।'}
          - {label: 'মাস ১ পরে', value: 3, display: '৩ দিন', tip: 'কপি করা কোড দুই জায়গায় বদলাতে হচ্ছে, তাই কাজ একটু বাড়ল।'}
          - {label: 'মাস ৩ পরে', value: 6, display: '৬ দিন', tone: warn, tip: 'ভুলে যাওয়া জায়গার bug ধরতে আর প্রতিটা বদল যাচাই করতে সময় যায়।'}
          - {label: 'মাস ৬ পরে', value: 10, display: '১০ দিন', tone: bad, tip: 'কেউ আর নিশ্চিত নয় কোথায় হাত দিলে কী ভাঙবে, তাই সবাই ভয়ে ধীরে চলে।'}
      - type: quote
        body: 'টেক ডেট শূন্য খরচে আসে না। দাম দেওয়া হয় সুদে, প্রতিটা ফিচারের বাড়তি সময়ে।'
    aside:
      - type: story
        title: 'মুদি দোকানের বাকির খাতা'
        body: |
          দোকানি বাকিতে মাল দিলে দিনের বিক্রি বাড়ে, আর সেটা ভালো বুদ্ধিও হতে পারে। কিন্তু বাকির খাতা না লিখে রাখলে, কে কত দেবে তা কেউ মনে রাখে না। ধার তখন আর ধার থাকে না, হারিয়ে যাওয়া টাকা হয়ে যায়।
      - type: refs
        items:
          - {to: 'thinking/evolutionary-architecture', label: 'বদলাতে পারা আর্কিটেকচার'}
    check:
      q: 'কপি করা কোডে তিন দিনে ফিচার বেরিয়ে গেলে "সুদ" কোথায় দিতে হয়?'
      a: 'পরের প্রতিটা বদলে। একই কাজ দুই জায়গায় করতে হয়, ভুল হয় আর যাচাইয়ে সময় যায়, ফলে প্রতিটা ফিচার একটু ধীর হয়ে যায়।'

  - slug: debt-quadrants
    title: 'ধার দুই রকম: জেনেশুনে, আর না জেনে'
    kind: concept
    tldr: 'জেনেশুনে শোধের পরিকল্পনাসহ নেওয়া ধার একটা কৌশল; না জেনে বা পাত্তা না দিয়ে জমা ধারই আসল বিপদ।'
    keywords: ['deliberate debt', 'accidental debt', 'prudent', 'reckless', 'Ward Cunningham', 'Martin Fowler', 'জেনেশুনে']
    blocks:
      - type: metaphor
        icon: bank
        title: 'ব্যাংক ঋণ আর মহাজনের ধার'
        body: |
          ব্যবসা বাড়াতে ব্যাংক থেকে ঋণ নেওয়া বুদ্ধিমানের কাজ: টাকার অঙ্ক, সুদ আর শোধের কিস্তি আগে থেকে জানা। কিন্তু হিসাব না করে মহাজনের কাছে ধার নিলে সুদ বাড়তেই থাকে। কোডের ধারও একই: নিজে জেনে ও লিখে রেখে নিলে ঋণ, না জেনে জমতে দিলে ফাঁদ।
      - type: visual
        kind: table
        caption: 'টেক ডেটের চার ঘর: ইচ্ছাকৃত না অনিচ্ছাকৃত, সতর্ক না বেপরোয়া'
        headers: ['', 'ইচ্ছাকৃত', 'অনিচ্ছাকৃত']
        rows:
          - cells: ['সতর্ক', '"আজ বের করি, পরের স্প্রিন্টে শুধরাব"', '"এখন বুঝছি, তখন আরও ভালো উপায় ছিল"']
            tip: 'দুটোই স্বাভাবিক। প্রথমটায় আপনি জেনেই ধার নিয়েছেন, দ্বিতীয়টায় শেখার ফলে আগের কোড পুরনো মনে হচ্ছে।'
          - cells: ['বেপরোয়া', '"ডিজাইনের সময় নেই, যেভাবে হয় করো"', '"layering কী? আমরা তো জানতামই না"']
            tip: 'এই ঘরটাই বিপদের। প্রথমটায় সবাই জেনেও শোধের চিন্তা করে না, দ্বিতীয়টায় ঋণের কথা কেউ জানেই না।'
      - type: points
        title: 'ভালো ধারের তিন শর্ত'
        style: check
        items:
          - 'টাকার অঙ্ক জানা: ঠিক কোন শর্টকাট কাটলাম, তা লেখা আছে।'
          - 'সুদ জানা: না শুধরালে কোথায় কী কষ্ট বাড়বে, তা বলা আছে।'
          - 'শোধের তারিখ আছে: কে, কবে, কতটা সময় নিয়ে শুধরাবে।'
    aside:
      - type: remember
        body: 'ধার নেওয়া দোষ নয়। দোষ হলো লিখে না রাখা আর শোধের কথা ভুলে যাওয়া।'
      - type: terms
        items:
          - {term: 'Principal', meaning: 'শর্টকাট শুধরাতে যে কাজটা এখন করতে হবে।'}
          - {term: 'Interest', meaning: 'শুধরানো পর্যন্ত প্রতিটা বদলে যে বাড়তি সময় আর ঝুঁকি যায়।'}
          - {term: 'Sprint', meaning: 'কাজের নির্দিষ্ট চক্র, সাধারণত ১ বা ২ সপ্তাহ; শেষে টিম পরের চক্রের পরিকল্পনা করে।'}
      - type: when
        use:
          - 'আসল ডেডলাইন আর আসল লাভ আছে, যেমন ঈদের বিক্রি, আর ধারটা লিখে রাখা যায়'
        avoid:
          - 'security, টাকা বা ডেটার সঠিকতার কোডে শর্টকাট: সেখানে সুদ দিতে হয় বাড়তি দিনে নয়, বিপর্যয়ে'
          - 'যে শর্টকাটের শোধের তারিখ দেওয়া যায় না'
    check:
      q: 'কখন টেক ডেট একটা ভালো কৌশল, আর কখন ফাঁদ?'
      a: 'জেনেশুনে, লিখে রেখে, শোধের তারিখসহ নিলে কৌশল। না জেনে বা পাত্তা না দিয়ে জমতে দিলে আর শোধের কথা কেউ না ভাবলে ফাঁদ।'

  - slug: debt-register
    title: 'ঋণের খাতা: কোথায় লিখবেন, কীভাবে'
    kind: howto
    tldr: 'প্রতিটা ধারের জন্য এক পাতার এন্ট্রি লিখুন: কী, কেন, সুদ, শোধের শর্ত ও তারিখ; কোডে ticket নম্বরসহ marker রাখুন।'
    keywords: ['debt register', 'tech debt backlog', 'TODO ticket', 'ঋণের খাতা', 'ADR', 'deadline test']
    blocks:
      - type: text
        body: |
          ধার চিনতে হলে আগে লিখতে হবে। একটা সাধারণ ফাইল বা ticket তালিকাই যথেষ্ট, যদি প্রতিটা এন্ট্রিতে কী, কেন, সুদ কত আর কবে শোধ, এই চারটা প্রশ্নের উত্তর থাকে। কোডে `TODO` লিখলে ticket নম্বরসহ লিখুন, নইলে সেটা কেউ কখনো খুঁজে পাবে না।
      - type: code
        lang: yaml
        file: 'docs/tech-debt.yaml'
        variant: good
        code: |
          - id: DEBT-12
            what: 'Eid checkout কপি করা: CheckoutService আর EidCheckoutService প্রায় এক'
            why: 'ঈদের ৩ দিনের ডেডলাইন, ডিজাইনের সময় ছিল না'
            interest: 'প্রতিটা checkout বদল দুই জায়গায়, মাসে ২-৩টা বাড়তি bug'
            repay: 'দুইটা এক class-এ এনে strategy দিয়ে আলাদা করা, আনুমানিক ৩ দিন'
            owner: 'রহিম'
            due: '2027-02-01'
            trigger: 'তৃতীয় প্রচারণার আগেই'
        marks:
          - {line: 4, tip: 'সুদ লেখা মানে ঋণের খরচ গণনা করা। এটা না লিখলে ঋণ শোধের গুরুত্ব কেউ বুঝবে না।'}
          - {line: 7, tip: 'owner আর due না থাকলে এন্ট্রিটা শুধু একটা অভিযোগ হয়ে থাকে। কারও নাম আর তারিখ বসান।'}
      - type: code
        lang: php
        file: 'src/Checkout/EidCheckoutService.php'
        variant: good
        code: |
          // DEBT-12: CheckoutService-এর কপি। 2027-02-01-এর মধ্যে এক করুন।
          // বিবরণ ও মালিক: docs/tech-debt.yaml
          final readonly class EidCheckoutService
          {
              public function pay(Cart $cart): Receipt
              {
                  return new Receipt($cart->total());
              }
          }

          // tests/DebtDeadlineTest.php
          public function testDebt12IsRepaidByDeadline(): void
          {
              $deadline = new \DateTimeImmutable('2027-02-01');
              self::assertLessThan($deadline, new \DateTimeImmutable('now'),
                  'DEBT-12-এর শোধের তারিখ পার হয়েছে');
          }
        marks:
          - {line: 1, tip: 'ticket নম্বরসহ marker। grep করলে এক নিমেষে সব ধার পাওয়া যায়।'}
          - {line: 16, tip: 'তারিখ পার হলে test লাল হয়। এটা কড়া কৌশল, তাই টিমের সম্মতি নিয়ে শুধু গুরুত্বপূর্ণ ধারে রাখুন।'}
    aside:
      - type: tips
        items:
          - 'লেখা এক পাতায় রাখুন; লম্বা রচনা কেউ পড়ে না। ADR-এর মতো ছোট আর নিয়মিত ছক ব্যবহার করুন।'
          - 'প্রতি স্প্রিন্টের শুরুতে ৫ মিনিট register দেখুন: কোনটা তারিখ পার করল?'
      - type: terms
        items:
          - {term: 'Ticket', meaning: 'কাজের বোর্ডে নম্বর দেওয়া একটা কাজ, যাতে তাকে খুঁজে পাওয়া ও কাউকে দেওয়া যায়।'}
          - {term: 'ADR', meaning: 'Architecture Decision Record: কী সিদ্ধান্ত হলো আর কেন, তার এক পাতার নোট।'}
          - {term: 'grep', meaning: 'ফাইলে লেখা খোঁজার কমান্ড। `grep -r DEBT- src/` সব marker দেখায়।'}
      - type: refs
        items:
          - {to: 'thinking/documentation', label: 'ADR ও ডিজাইন লিখে রাখা'}
    check:
      q: 'ঋণের খাতার প্রতিটা এন্ট্রিতে কোন চারটা প্রশ্নের উত্তর থাকা দরকার?'
      a: 'কী শর্টকাট কাটা হলো, কেন, না শুধরালে সুদ (খরচ) কী, আর শোধ হবে কীভাবে ও কবে, কার হাতে।'

  - slug: paying-down
    title: 'ধার শোধের তিন অভ্যাস'
    kind: howto
    tldr: 'ছোট ধার ছুঁলেই শুধরান (boy-scout), বড় ধারের জন্য প্রতি sprint-এ নির্দিষ্ট সময় রাখুন, আর বেছে নিন যেটার সুদ সবচেয়ে বেশি।'
    keywords: ['boy scout rule', 'sprint budget', 'refactoring', 'repay', 'দেনা শোধ', 'রিফ্যাক্টরিং']
    blocks:
      - type: text
        body: |
          ধার শোধে "সব ফেলে নতুন করে লিখি" চলে না। পুরনো কোডে বছরের পর বছরের ছোট ছোট bug-fix আর নিয়ম থাকে, যা কেউ লিখে রাখেনি; নতুন করে লিখলে অনেকগুলো নীরবে হারায়, আর সময়ও পরিকল্পনার চেয়ে বেশি লাগে। বরং ছোট ছোট কিস্তিতে শোধ করুন। যেখানে হাত দেবেন সেখানে একটু পরিষ্কার করে যান, প্রতি sprint-এ কিছু সময় ঋণের জন্য আলাদা রাখুন, আর সবার আগে সেই ধার শোধ করুন যার সুদ সবচেয়ে বেশি।
      - type: code
        lang: php
        file: 'src/Order/OrderService.php'
        variant: good
        code: |
          // bug ঠিক করতে এসে যেটুকু ছুঁলাম, সেটুকুই পরিষ্কার করলাম
          // আগে: if ($order->getTotalInTaka() >= 5000) { ... }  // ৫০০০ কী?
          private const FREE_DELIVERY_FROM_TAKA = 5000;

          public function deliveryFee(Order $order): int
          {
              return $order->getTotalInTaka() >= self::FREE_DELIVERY_FROM_TAKA
                  ? 0
                  : 80;
          }
        marks:
          - {line: 3, tip: 'magic number-এর নাম দেওয়া হলো। পাঁচ মিনিটের কাজ, কিন্তু পরের জন আর অনুমান করবে না।'}
      - type: visual
        kind: bars
        caption: 'দশ দিনের sprint-এ সময় ভাগ: ঋণের জন্য আলাদা কিস্তি'
        items:
          - {label: 'নতুন ফিচার', value: 70, display: '৭ দিন', tone: good, tip: 'ব্যবসার মূল কাজ। সময়ের বেশিরভাগ এখানেই যাবে।'}
          - {label: 'ঋণ শোধ', value: 20, display: '২ দিন', tone: accent, tip: 'প্রতি sprint-এ নিয়মিত কিস্তি। বড় ধার ছোট ছোট কিস্তিতে ভেঙে শোধ হয়।'}
          - {label: 'বাফার', value: 10, display: '১ দিন', tone: muted, tip: 'হঠাৎ আসা bug ও জরুরি কাজের জন্য। এটা না রাখলে ঋণের সময়ই প্রথমে কাটা যায়।'}
      - type: quote
        body: 'যে ফাইলে হাত দেবেন, সেটাকে আগের চেয়ে একটু পরিষ্কার রেখে যান।'
        by: 'Boy-scout rule'
    aside:
      - type: when
        use:
          - 'কোনো ধার প্রতি সপ্তাহে ব্যথা দিলে, সবার আগে সেটা শোধ করুন।'
          - 'যে কোড প্রায়ই বদলান, সেখানের ঋণ আগে শোধ করুন।'
        avoid:
          - 'যে কোডে কেউ কখনো হাত দেয় না, সেটা শুধু কুৎসিত বলে শুধরাতে যাবেন না।'
      - type: terms
        items:
          - {term: 'Refactoring', meaning: 'কোড কী করে তা না বদলে, কীভাবে সাজানো তা বদলানো।'}
          - {term: 'Magic number', meaning: 'কোডে খালি একটা সংখ্যা, যার মানে গোপন, যেমন ৫০০০। একটা নামওয়ালা constant দিন।'}
      - type: pitfalls
        items:
          - 'টেস্ট ছাড়া বড় refactoring: শোধ করতে গিয়ে নতুন bug ঢোকে। পরের slide-এ আগে লেখার টেস্টটা দেখানো হয়েছে।'
          - 'ঋণ শোধের সময় "পরের sprint-এ" বলে বারবার পিছিয়ে দেওয়া।'
    check:
      q: 'কোন ধারটা সবার আগে শোধ করবেন: যে কোড প্রতি সপ্তাহে বদলান, না যেটা বছরে একবার?'
      a: 'প্রতি সপ্তাহে বদলানোটা। সুদ দিতে হয় প্রতিবার হাত দেওয়ায়, তাই যত বেশি হাত পড়ে সেখানের ঋণ তত বেশি ব্যয়বহুল।'

  - slug: merge-the-copy
    title: 'DEBT-12 শোধ: কপিটাকে এক class-এ মেলানো'
    kind: howto
    tldr: 'আজকের মোট টাকা একটা test-এ বেঁধে দিন, তারপর দুই class এক করুন: একমাত্র আসল তফাত হয় ছোট একটা policy, বাকি নিয়ম থাকে একবারই।'
    keywords: ['strategy pattern', 'duplicate code', 'refactoring', 'DiscountPolicy', 'কপি করা কোড', 'characterization test']
    blocks:
      - type: text
        body: |
          ঈদের কপির দাম দেখুন। জানুয়ারিতে `CheckoutService`-এ VAT-এর হার ১৫% করা হলো, কিন্তু `EidCheckoutService`-এর কথা কারও মনে পড়ল না। ঈদের order-এ পুরনো ১০% হারেই VAT কাটা চলতে থাকল।
      - type: code
        lang: php
        file: 'src/Checkout/ (আগে)'
        variant: bad
        code: |
          final readonly class CheckoutService
          {
              public function total(Cart $cart): int
              {
                  return intdiv($cart->subtotal() * 115, 100);   // VAT 15%, জানুয়ারিতে ঠিক হলো
              }
          }

          // ঈদের তাড়ায় লেখা কপি
          final readonly class EidCheckoutService
          {
              public function total(Cart $cart): int
              {
                  return intdiv(($cart->subtotal() - 200) * 110, 100);   // এখনো পুরনো ১০%
              }
          }
        marks:
          - {line: 5, tip: 'জানুয়ারির সংশোধন শুধু এখানে পড়ল।'}
          - {line: 14, tip: 'একই কাজ দুইবার লেখা। এই কপি ভুলে যাওয়া হলো, তাই ঈদের প্রতিটা order পুরনো হারে কাটল।'}
      - type: text
        body: |
          শোধের দুই চাল। আগে একটা test লিখুন, যা একটা নির্দিষ্ট cart দুই class-এ চালিয়ে আজকের মোট টাকা লিখে রাখে, যাতে মেলানোর সময় আচরণ ভুলে বদলে না যায়। তারপর একটাই `CheckoutService` রাখুন, আর একমাত্র আসল তফাত, ঈদের ছাড়, বানান একটা বদলানো-যায় এমন অংশ: **strategy**, যে object একটা প্রশ্নেরই উত্তর দেয়।
      - type: code
        lang: php
        file: 'src/Checkout/ (পরে)'
        variant: good
        code: |
          interface DiscountPolicy
          {
              public function discountFor(Cart $cart): int;   // টাকায়
          }

          final readonly class EidOffer implements DiscountPolicy
          {
              public function discountFor(Cart $cart): int
              {
                  return 200;
              }
          }

          final readonly class CheckoutService
          {
              public function __construct(
                  #[Autowire(service: EidOffer::class)]
                  private DiscountPolicy $discount,
              ) {
              }

              public function total(Cart $cart): int
              {
                  $net = $cart->subtotal() - $this->discount->discountFor($cart);

                  return intdiv($net * 115, 100);   // VAT-এর নিয়ম একবারই
              }
          }
        marks:
          - {line: 17, tip: 'প্রচারণা শেষ হলে এটাকে NoDiscount class-এ ঘোরান। এক লাইন বদলায়, ভুলে যাওয়ার মতো কোনো কপিই থাকে না।'}
          - {line: 26, tip: 'সবার নিয়ম একবারই লেখা। পরের VAT বদল একটা জায়গাতেই হাত দেয়।'}
    aside:
      - type: when
        use:
          - 'একই বদল ইতিমধ্যে একাধিকবার দুই জায়গায় করতে হয়েছে'
        avoid:
          - 'যে দুই কোড শুধু দেখতে এক, কিন্তু বদলায় আলাদা কারণে: এক করলে তারা জড়িয়ে যায়'
          - 'যে কোডে কেউ হাত দেয় না: সেখানে সুদ নেই, রেখে দিন'
      - type: pitfalls
        items:
          - 'বেঁধে-দেওয়া test ছাড়া মেলানো: মোট টাকা এখনো মেলে কি না বোঝার উপায় থাকে না।'
          - 'policy-কে অতি সাধারণ বানানো। একটা তফাতের জন্য একটা ছোট interface-ই যথেষ্ট, দশটা option নয়।'
    check:
      q: 'দুই checkout class মেলানোর আগে কেন test লিখবেন, আর সেটা কী লিখে রাখবে?'
      a: 'প্রমাণ করতে যে মেলানোয় আচরণ ভুলে বদলায়নি। এটা একটা নির্দিষ্ট cart দুই class-এ চালিয়ে আজকের মোট টাকা লিখে রাখে, আর পরেও সবুজ থাকতে হয়।'

flashcards:
  - q: 'টেক ডেট কী?'
    a: 'আজকের তাড়ায় কাটা শর্টকাট, যার দাম পরে প্রতিটা বদলে বাড়তি সময় আর ঝুঁকি হিসেবে দিতে হয়।'
    more: |
      শর্টকাট নিলে এখন সময় বাঁচে, কিন্তু কোড ঠিক না হওয়া পর্যন্ত প্রতিটা নতুন কাজ ধীর হয়। এই ধীরগতিই সুদ। ঋণ শুধরালে সুদ বন্ধ হয়।
    ref: interest-grows
  - q: 'টেক ডেটের "principal" আর "interest" কী?'
    a: 'Principal: শর্টকাট শুধরাতে এখন যে কাজটা করতে হবে। Interest: শুধরানো পর্যন্ত প্রতিটা বদলে যে বাড়তি খরচ।'
    more: |
      মূল ঋণ ছোট হলেও সুদ বড় হতে পারে, যদি সেই কোডে প্রায়ই হাত পড়ে। আবার মূল ঋণ বড় হলেও সুদ কম, যদি কোডটা কেউ ছোঁয় না। শোধের ক্রম ঠিক করতে সুদ মাপাই কাজের।
    ref: debt-quadrants
  - q: 'জেনেশুনে আর না জেনে জমা টেক ডেটের পার্থক্য কী?'
    a: 'জেনেশুনে নেওয়া ধার লিখে রাখা হয় ও শোধের পরিকল্পনা থাকে; না জেনে জমা ধারের কথা কেউ জানেই না।'
    more: |
      প্রথমটা কৌশল, কারণ ব্যবসা সময়ের সাথে দৌড়ায়। দ্বিতীয়টা আসে জ্ঞানের অভাবে বা অবহেলায়। তাই শেখা আর code review-ই অনিচ্ছাকৃত ধারের প্রধান প্রতিষেধক।
    ref: debt-quadrants
  - q: 'ভালো টেক ডেটের তিন শর্ত কী?'
    a: 'কী কাটা হলো তা জানা আছে, সুদ কী হবে তা জানা আছে, আর শোধের তারিখ ও মালিক আছে।'
    more: |
      এই তিনটার কোনোটা না থাকলে ধারটা নিয়ন্ত্রণ থেকে বেরিয়ে যায়। সবচেয়ে বেশি ভোলা হয় তৃতীয়টা, আর সেজন্যই "পরে শুধরাব" কখনো আসে না।
    ref: debt-quadrants
  - q: 'Debt register-এর এন্ট্রিতে কী কী থাকা উচিত?'
    a: 'কী, কেন নেওয়া হলো, সুদ কী, শোধের পথ, মালিক আর শোধের তারিখ।'
    more: |
      এক পাতার এন্ট্রি যথেষ্ট। এর ওপর কোডে ticket নম্বরসহ marker রাখলে grep করেই সব ঋণ পাওয়া যায়। প্রতি sprint-এ register-এ চোখ বোলালে তারিখ পার হওয়া ধার চোখে পড়ে।
    ref: debt-register
  - q: 'Boy-scout rule কী?'
    a: 'যে ফাইলে হাত দেন, সেটা আগের চেয়ে একটু পরিষ্কার রেখে যান, যেমন একটা magic number-এর নাম দেওয়া।'
    more: |
      এতে বড় refactoring-এর আলাদা সময় লাগে না, আর যেসব কোডে সবচেয়ে বেশি হাত পড়ে সেগুলোই বেশি পরিষ্কার হয়। শর্ত: বদলটা ছোট ও নিরাপদ হতে হবে, আর টেস্ট থাকতে হবে।
    ref: paying-down
  - q: 'কপি করা কোড ব্যয়বহুল কেন?'
    a: 'পরের প্রতিটা বদল প্রতিটা কপিতে করতে হয়, আর ভুলে যাওয়া কপি পুরনো আচরণ ধরে রাখে: সেখানেই শুধু bug দেখা দেয়।'
    more: |
      ঈদের উদাহরণে VAT-এর হার `CheckoutService`-এ বদলাল, কপিতে নয়, তাই ঈদের order পুরনো হারে কাটল। প্রতিটা বাড়তি কপি এই ঝুঁকিকে গুণ করে।
    ref: merge-the-copy
  - q: 'প্রায় একই দুই class নিরাপদে মেলাবেন কীভাবে?'
    a: 'আগে একটা test-এ দুই class-এর আজকের ফল লিখে রাখুন, তারপর মেলান; একমাত্র আসল তফাতটা হয় ছোট একটা injected strategy।'
    more: |
      test-ই আপনার নিরাপত্তা-জাল। strategy তফাতটাকে (যেমন ঈদের ছাড়) ভাগ করা কোডের বাইরে রাখে, তাই ভাগ করা নিয়ম থাকে এক জায়গায়।
    ref: merge-the-copy
  - q: '"সব বন্ধ রেখে নতুন করে লিখি" কেন ঋণ শোধের খারাপ উপায়?'
    a: 'পুরনো কোডে বছরের অলিখিত নিয়ম আর bug-fix থাকে। নতুন করে লিখলে অনেকগুলো হারায়, আর সময়ও পরিকল্পনার চেয়ে বেশি লাগে।'
    more: |
      বরং ছোট কিস্তিতে শোধ করুন: যা ছোঁন তা পরিষ্কার করুন, প্রতি sprint-এ কিছু সময় রাখুন, আর সবচেয়ে বেশি সুদের ধার দিয়ে শুরু করুন।
    ref: paying-down
  - q: 'ঋণ শোধের জন্য sprint-এ কত সময় রাখা যুক্তিসংগত?'
    a: 'অনেক টিম প্রায় ১৫-২০ শতাংশ সময় ঋণের জন্য আলাদা রাখে। সংখ্যা টিমভেদে বদলায়, নিয়মিত থাকাটাই জরুরি।'
    more: |
      নির্দিষ্ট ভাগ রাখলে ঋণ শোধ ব্যবসার চাপে প্রতিবার বাদ পড়ে না। সময়টা কম হলেও প্রতি sprint-এ থাকুক, কারণ একবার বড় করে শোধ করার চেয়ে নিয়মিত ছোট কিস্তি অনেক নিরাপদ।
    ref: paying-down

quiz:
  - q: 'রহিমের টিম ডেডলাইনের চাপে একটা শর্টকাট নিতে চায়। নিচের কোনগুলো করলে ধারটা "ভালো ধার" হবে?'
    hint: 'ভালো ধারে কী কী জানা থাকে আর কী কী ঠিক করা থাকে?'
    options:
      - text: 'শর্টকাটটা debt register-এ লিখে রাখা, সুদসহ'
        correct: true
        why: 'লিখলে ধারটা সবার চোখে থাকে আর সুদ জানা থাকলে শোধের গুরুত্ব বোঝা যায়।'
