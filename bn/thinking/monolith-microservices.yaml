slides:
  - slug: twelve-kitchens
    title: '১০ জনের টিম, ১২টা সার্ভিস'
    kind: story
    tldr: 'ছোট টিম প্রথম দিনেই ১২টা সার্ভিস বানালে সুবিধা পায় না, উল্টে network, deploy আর ডিবাগের বাড়তি বোঝা টানে।'
    keywords: ['microservices', 'monolith', 'distributed monolith', 'মাইক্রোসার্ভিস', 'মনোলিথ', 'premature split']
    blocks:
      - type: text
        body: |
          একটা স্টার্টআপে ১০ জন ডেভেলপার, আর তারা "আধুনিক" হতে প্রথম মাসেই অ্যাপ ১২টা সার্ভিসে ভাগ করল। এখন "অর্ডার করুন" ফিচারে পাঁচটা সার্ভিসের ভেতর দিয়ে request যায়। একটা সার্ভিস ধীর হলে সবাই ধীর, আর bug কোথায় তা খুঁজতে ঘণ্টা কাটে। ডেভেলপাররা ফিচারের চেয়ে সার্ভিসের জোড়া নিয়েই বেশি ব্যস্ত।
      - type: visual
        kind: compare
        caption: 'এক অ্যাপ থেকে বারো সার্ভিস: কী বদলাল'
        columns:
          - title: 'একটাই অ্যাপ'
            tone: good
            icon: box
            tip: 'এক প্রসেসের ভেতর method call দ্রুত ও নিরাপদ, আর পুরো অ্যাপ একসাথে বোঝা যায়।'
            items:
              - 'একটা method call, মাইক্রোসেকেন্ডে'
              - 'একটা deploy, একটা log'
              - 'এক transaction-এ ডেটা ঠিক থাকে'
              - 'স্থানীয় মেশিনে পুরোটা চালানো যায়'
          - title: '১২টা সার্ভিস'
            tone: bad
            icon: puzzle
            tip: 'প্রতিটা সার্ভিসের মাঝের network call ধীর, ব্যর্থ হতে পারে, আর বাড়তি কোড চায়।'
            items:
              - 'পরপর পাঁচ call, প্রতিটা ৯৯.৯% ভরসার: হাজারে প্রায় ৫টা অর্ডার ব্যর্থ, একটার বদলে'
              - '১২টা deploy, ১২টা log, ১২টা জায়গা খোঁজা'
              - 'transaction ভেঙে যায়, ডেটা মেলানো কঠিন'
              - 'পুরো সিস্টেম চালাতে docker-এ ১২টা container'
      - type: quote
        body: 'মাইক্রোসার্ভিস সংগঠনের সমস্যার সমাধান, কোডের নয়। টিম ছোট হলে সমস্যাটাই নেই।'
    aside:
      - type: story
        title: 'বিয়েবাড়ির রান্নাঘর'
        body: |
          ২০০ অতিথির বিয়েতে একটা বড় রান্নাঘরে বাবুর্চিরা একসাথে কাজ করে, কথা বলে, নুন-ঝালের ভাগাভাগি করে নেয়। ঠিক এই কাজটাই ১২টা ছোট রান্নাঘরে ভাগ করলে প্রতিটাকে ফোনে সমন্বয় করতে হয়, আর একটা দেরি করলে পুরো খাবার দেরি হয়।
      - type: terms
        items:
          - {term: 'Microservice', meaning: 'ছোট আলাদা অ্যাপ, যা একটা কাজ করে আর বাকি সার্ভিসের সাথে network দিয়ে কথা বলে।'}
          - {term: 'Deploy', meaning: 'অ্যাপের নতুন সংস্করণ আসল সার্ভারে বসানো।'}
          - {term: 'Transaction', meaning: 'একগুচ্ছ ডেটাবেস-বদল, যা হয় সব হয়, নয়তো একটাও হয় না।'}
      - type: refs
        items:
          - {to: 'thinking/conways-law', label: 'Conway-এর সূত্র'}
    check:
      q: 'ছোট টিমের জন্য প্রথম থেকেই ১২টা সার্ভিস কেন ঝামেলার?'
      a: 'প্রতিটা call network পেরোয় বলে ধীর ও ভঙ্গুর, আর deploy, log, ডেটা-মেলানো সবই বারো গুণ বাড়ে, অথচ আলাদা টিমের সুবিধা পাওয়া যায় না।'

  - slug: three-shapes
    title: 'তিন আকৃতি: মনোলিথ, মডুলার মনোলিথ, মাইক্রোসার্ভিস'
    kind: concept
    tldr: 'মনোলিথ এক দলা, মডুলার মনোলিথ এক বাড়িতে আলাদা ঘর, আর মাইক্রোসার্ভিস আলাদা বাড়ি; আসল পার্থক্য সীমানা কত শক্ত।'
    keywords: ['modular monolith', 'monolith', 'microservices', 'module boundary', 'মডুলার মনোলিথ', 'সার্ভিস']
    blocks:
      - type: metaphor
        icon: building
        title: 'বাড়ি, ফ্ল্যাট আর আলাদা বাসা'
        body: |
          মনোলিথ একটা বড় হলঘর, যেখানে সবাই সব জিনিস ছুঁতে পারে। মডুলার মনোলিথ একই বিল্ডিংয়ের আলাদা ফ্ল্যাট: দেয়াল আছে, দরজা দিয়ে ঢুকতে হয়, কিন্তু ভিত্তি আর ছাদ এক। মাইক্রোসার্ভিস আলাদা আলাদা বাসা, যেখানে যেতে রাস্তা পেরোতে হয়।
      - type: visual
        kind: table
        caption: 'তিন আকৃতির তুলনা'
        headers: ['', 'মনোলিথ', 'মডুলার মনোলিথ', 'মাইক্রোসার্ভিস']
        rows:
          - cells: ['Deploy', 'একটা', 'একটা', 'প্রতিটা আলাদা']
            tip: 'মডুলার মনোলিথেও deploy একটাই। এটাই মাইক্রোসার্ভিসের জটিলতা থেকে বাঁচিয়ে দেয়।'
          - cells: ['কোডের সীমানা', 'নেই, সবাই সব ডাকে', 'module ও পাবলিক API', 'process আর network']
            tip: 'মনোলিথের সমস্যা মনোলিথ হওয়া নয়, সীমানাহীন হওয়া। মডুলার মনোলিথ সীমানাটা ফিরিয়ে আনে।'
          - cells: ['ডেটাবেস', 'একটা, সবাই সব টেবিল ছোঁয়', 'একটা, প্রতি module-এর নিজের টেবিল', 'প্রতি সার্ভিসের নিজের']
            tip: 'মডুলার মনোলিথে অন্যের টেবিল সরাসরি পড়া নিষেধ, অন্য module-এর API দিয়ে চাইতে হয়।'
          - cells: ['Module-এর call', 'method call', 'method call', 'HTTP বা message']
            tip: 'মডুলার মনোলিথে call এখনো সস্তা ও নিরাপদ। network-এর খরচ আসে শুধু মাইক্রোসার্ভিসে।'
          - cells: ['টিম', '১-২০ জন একসাথে', 'একসাথে বা কয়েকটা দল', 'বড়, স্বাধীন দল']
            tip: 'টিমের আকারই সবচেয়ে বড় নির্ধারক। স্বাধীন deploy তখনই কাজে আসে যখন স্বাধীন টিম আছে।'
    aside:
      - type: remember
        body: 'মনোলিথ মানে খারাপ নয়। খারাপ হলো সীমানাহীন মনোলিথ।'
      - type: terms
        items:
          - {term: 'Module', meaning: 'এক ব্যবসায়িক কাজের কোড, নিজের ডেটা আর পাবলিক দরজা নিয়ে।'}
          - {term: 'Distributed monolith', meaning: 'সার্ভিসে ভাগ করা, কিন্তু এমনভাবে জোড়া যে একসাথে ছাড়া deploy হয় না।'}
    check:
      q: 'মডুলার মনোলিথ আর মাইক্রোসার্ভিসের মূল পার্থক্য কী?'
      a: 'মডুলার মনোলিথে সীমানা আছে কিন্তু সবকিছু এক প্রসেসে ও এক deploy-তে চলে। মাইক্রোসার্ভিসে প্রতিটা সীমানা network পেরোয় আর আলাদা deploy হয়।'

  - slug: modular-monolith-symfony
    title: 'Symfony-তে মডুলার মনোলিথ বানানো'
    kind: howto
    tldr: 'src/-এর নিচে ব্যবসার কাজ ধরে ফোল্ডার করুন, প্রতিটার একটা Api interface রাখুন, আর অন্যের entity না ধরে শুধু ID ধরুন।'
    keywords: ['Symfony modules', 'public API', 'facade', 'deptrac', 'bounded context', 'module boundary']
    blocks:
      - type: text
        body: |
          মডুলার মনোলিথে `src/`-এর ভেতরে প্রতিটা ফোল্ডার একটা ব্যবসায়িক কাজ। প্রতিটা module-এর একটাই পাবলিক দরজা, `Api/` ফোল্ডারের interface। অন্য module সেই interface-ই ডাকবে, ভেতরের entity বা repository নয়। আর অন্যের entity-র সাথে Doctrine relation না করে শুধু তার ID রাখুন।
      - type: code
        lang: text
        file: 'src/'
        code: |
          src/
            Billing/
              Api/BillingApi.php             <- অন্যরা শুধু এটা ডাকে
              Domain/Invoice.php
              Infrastructure/DoctrineInvoiceRepository.php
            Shipping/
              Api/ShippingApi.php
              Application/ScheduleDelivery.php
              Domain/Delivery.php
            Catalog/
              Api/CatalogApi.php
              Domain/Product.php
        marks:
          - {line: 3, tip: 'পাবলিক দরজা। এর বাইরের সবকিছু module-এর ভেতরের ব্যাপার, বাইরের কেউ ছুঁতে পারবে না।'}
      - type: code
        lang: php
        file: 'src/Shipping/Application/ScheduleDelivery.php'
        variant: good
        code: |
          final readonly class ScheduleDelivery
          {
              public function __construct(
                  private BillingApi $billing,
                  private DeliveryRepository $deliveries,
              ) {
              }

              public function __invoke(string $orderId): void
              {
                  if (!$this->billing->isPaid($orderId)) {
                      throw new \DomainException('বিল শোধ হয়নি');
                  }

                  // Delivery শুধু orderId স্ট্রিং রাখে, Billing-এর entity নয়
                  $this->deliveries->save(Delivery::forOrder($orderId));
              }
          }
        marks:
          - {line: 4, tip: 'Billing-এর কোন class আছে তা Shipping জানে না। সে শুধু BillingApi interface চেনে।'}
          - {line: 15, tip: 'ID দিয়ে বাঁধা মানে পরে Billing আলাদা সার্ভিস হলেও Shipping-এর টেবিলে কিছু বদলাবে না।'}
    aside:
      - type: commands
        title: 'সীমানা পাহারা'
        items:
          - {cmd: 'vendor/bin/deptrac analyse', desc: 'কোন module অন্যের ভেতরের class ডাকছে, ধরে দেয়'}
      - type: pitfalls
        items:
          - 'অন্য module-এর Doctrine entity-তে `ManyToOne` রাখলে সীমানাটা শুধু ফোল্ডারের নামেই থেকে যায়।'
          - 'Api interface-এ entity ফেরত দেবেন না; ছোট DTO বা সাধারণ মান দিন।'
      - type: refs
        items:
          - {to: 'thinking/evolutionary-architecture', label: 'Deptrac দিয়ে সীমানা পাহারা'}
    check:
      q: 'Shipping module Billing-এর Invoice entity-তে `ManyToOne` রাখলে কী ক্ষতি?'
      a: 'দুই module তখন একই টেবিল-গঠনে বাঁধা পড়ে। Billing-এর ভেতরে বদল করলে Shipping ভাঙে, আর ভবিষ্যতে সার্ভিসে ভাগ করা অসম্ভবের কাছাকাছি হয়।'

  - slug: boundary-leak
    title: 'যে শর্টকাট চুপচাপ মডুলার মনোলিথ শেষ করে দেয়'
    kind: pitfall
    tldr: 'module-এর মাঝে Doctrine relation বা repository ডাক তাদের জুড়ে দেয়। শুধু ID রাখুন, Api দিয়ে জিজ্ঞেস করুন, আর শর্টকাটে build ফেল করান একটা টুল দিয়ে।'
    keywords: ['module boundary', 'ManyToOne', 'deptrac', 'coupling', 'modular monolith', 'সীমানা ভাঙা']
    blocks:
      - type: text
        body: |
          শর্টকাটটা লোভনীয়। Shipping জানতে চায় অর্ডারের টাকা শোধ হয়েছে কি না, তাই সে সোজা Billing-এর `Invoice`-এ লিংক করে ফেলে। আজ এটা কাজ করে। কিন্তু এখন Shipping বাঁধা পড়ল Billing-এর টেবিল আর তার ভেতরের status-লেখায়, তাই Billing-এর ভেতরে বদল Shipping ভাঙে, আর Billing কখনো আলাদা সার্ভিস হতে পারে না। ঠিকভাবে করার দাম সামান্য শৃঙ্খলা: একটা বাড়তি interface, আর এমন একটা টুল যা কেউ শর্টকাট নিলে build ফেল করায়।
      - type: code
        lang: php
        file: 'src/Shipping/Domain/Delivery.php'
        variant: bad
        code: |
          // src/Shipping/Domain/Delivery.php
          #[ORM\Entity]
          class Delivery
          {
              #[ORM\ManyToOne(targetEntity: \App\Billing\Domain\Invoice::class)]
              private Invoice $invoice;   // Billing-এর টেবিলে একটা link

              public function isReady(): bool
              {
                  return 'paid' === $this->invoice->getStatus();   // Billing-এর ভেতরের status-লেখা
              }
          }
        marks:
          - {line: 5, tip: 'অন্য module-এর দিকে Doctrine relation। Billing-এর একটা কলামের নাম বদলালে Shipping-এর mapping-ও ভাঙে।'}
          - {line: 10, tip: 'Shipping এখন জানে Billing status রাখে "paid" লেখা হিসেবে। Shipping না দেখে Billing এটা বদলাতে পারে না।'}
      - type: code
        lang: php
        file: 'src/Shipping/Domain/Delivery.php'
        variant: good
        code: |
          #[ORM\Entity]
          class Delivery
          {
              public function __construct(
                  #[ORM\Id, ORM\Column(length: 36)]
                  private string $id,
                  #[ORM\Column(length: 36)]
                  private string $orderId,   // শুধু Billing-এর order ID, আর কিছু নয়
              ) {
              }

              public static function forOrder(string $orderId): self
              {
                  return new self(Uuid::v7()->toRfc4122(), $orderId);
              }
          }

          // "শোধ হয়েছে?" জানা যায় Billing-এর পাবলিক দরজা দিয়ে, ScheduleDelivery-তে:
          // if (!$this->billing->isPaid($orderId)) { throw new \DomainException(); }
        marks:
          - {line: 8, tip: 'শুধু ID রাখা হয়। Billing টেবিলের নাম বদলালে বা সার্ভিস হলেও এই কলাম একই থাকে।'}
          - {line: 18, tip: 'শোধের প্রশ্ন যায় BillingApi দিয়ে, তাই উত্তর কীভাবে দেবে তা Billing-এরই হাতে থাকে।'}
    aside:
      - type: tips
        items:
          - 'CI-তে `vendor/bin/deptrac analyse` চালান, যাতে প্রথমটার মতো শর্টকাট review পার না হয়ে build-এই ফেল করে।'
      - type: terms
        items:
          - {term: 'Deptrac', meaning: 'এমন একটা টুল, যা কোড পড়ে আর এক ফোল্ডার অনুমতি-না-পাওয়া অন্য ফোল্ডার ব্যবহার করলে ফেল করায়।'}
    check:
      q: 'Shipping Billing-এর অর্ডার সম্পর্কে কী রাখে, আর টাকা শোধ হয়েছে কি না কীভাবে জানে?'
      a: 'শুধু order ID রাখে, আর পাবলিক দরজা দিয়ে `BillingApi::isPaid()` ডাকে। Billing-এর entity-তে লিংক করে না, তার status-লেখাও পড়ে না।'

  - slug: where-to-cut
    title: 'সীমানা কোথায় টানবেন, আর কখন সার্ভিসে ভাঙবেন'
    kind: compare
    tldr: 'সীমানা টানুন ব্যবসার কাজ আর ডেটার মালিকানা ধরে, প্রযুক্তির স্তর ধরে নয়; আলাদা সার্ভিস তখনই, যখন আলাদা টিম আর আলাদা scale-এর দরকার।'
    keywords: ['business capability', 'data ownership', 'service boundary', 'when to split', 'সীমানা', 'ডেটার মালিকানা']
    blocks:
      - type: text
        body: |
          সীমানা ভুল জায়গায় টানলে প্রতিটা ফিচারে দুই-তিন module-এ হাত দিতে হয়। দুইটা প্রশ্নে সীমানা ঠিক রাখা যায়: এটা কোন ব্যবসায়িক কাজ (পেমেন্ট, ডেলিভারি, ক্যাটালগ), আর এই ডেটার মালিক কে। প্রযুক্তির স্তর ধরে ভাগ, যেমন "ডেটাবেস সার্ভিস", একদম ভুল পথ।
      - type: visual
        kind: compare
        caption: 'সীমানা টানার ভালো ও খারাপ উপায়'
        columns:
          - title: 'ব্যবসার কাজ ধরে'
            tone: good
            icon: check
            tip: 'একটা ফিচার সাধারণত এক ব্যবসায়িক কাজেই পড়ে, তাই বদলও এক module-এ আটকে থাকে।'
            items:
              - 'Billing, Shipping, Catalog'
              - 'প্রতিটা তার ডেটার একমাত্র মালিক'
              - 'অন্যরা শুধু পাবলিক API দিয়ে চায়'
              - 'নতুন ফিচার সাধারণত এক module-এ'
          - title: 'প্রযুক্তি ধরে'
            tone: bad
            icon: cross
            tip: 'প্রতিটা ফিচার সব স্তরের ভেতর দিয়ে যায়, তাই একটা বদলে সব সার্ভিসে হাত পড়ে।'
            items:
              - 'ControllerService, DatabaseService'
              - 'সবাই একই টেবিলে লেখে'
              - 'এক ফিচারে সব সার্ভিসে বদল'
              - 'সার্ভিস আলাদা, কিন্তু একসাথে deploy'
      - type: points
        title: 'আলাদা সার্ভিসে ভাঙার আগে যাচাই করুন'
        style: check
        items:
          - 'আলাদা টিম আছে, যারা অন্যের অপেক্ষা না করে deploy করতে চায়।'
          - 'এই অংশের scale বা নিরাপত্তার চাহিদা বাকিটার চেয়ে আলাদা।'
          - 'সীমানা মডুলার মনোলিথে মাসের পর মাস স্থির আছে, বারবার সরছে না।'
          - 'রাখার খরচ (monitoring, CI, ডেটা-মেলানো) সামলানোর লোক আছে।'
      - type: quote
        body: 'প্রথমে মডুলার মনোলিথ বানান। সীমানা টেকসই হলে, আর কারণ থাকলে, তবেই কাটুন।'
    aside:
      - type: when
        use:
          - 'মডুলার মনোলিথ: বেশিরভাগ নতুন প্রজেক্ট আর ছোট-মাঝারি টিম।'
          - 'মাইক্রোসার্ভিস: অনেক টিম, আলাদা scale আর আলাদা release-এর প্রয়োজন।'
        avoid:
          - 'শুধু "সবাই করছে" বলে বা CV-র জন্য সার্ভিসে ভাঙা।'
      - type: terms
        items:
          - {term: 'Scaling', meaning: 'চাপ বাড়লে সার্ভার বাড়ানো। কোনো অংশ, যেমন ছবি ছোট করা, দশটা সার্ভার চাইতে পারে, যখন বাকিটার একটাই যথেষ্ট।'}
          - {term: 'CI', meaning: 'প্রতিটা কোড-বদলে নিজে নিজে চলা build আর test ধাপ।'}
          - {term: 'Monitoring', meaning: 'যে dashboard আর alert জানায় কোন সার্ভিস ধীর বা বন্ধ।'}
      - type: refs
        items:
          - {to: 'thinking/ddd', label: 'DDD: bounded context'}
          - {to: 'data/schema-design', label: 'ডেটার মালিকানা ও schema'}
    check:
      q: 'সার্ভিসের সীমানা টানার সময় কোন দুইটা প্রশ্ন সবচেয়ে কাজের?'
      a: 'এটা কোন ব্যবসায়িক কাজ, আর এই ডেটার একমাত্র মালিক কে। উত্তর স্পষ্ট হলে সীমানা টেকসই হয়, বদলও এক module-এ আটকে থাকে।'

flashcards:
  - q: 'মাইক্রোসার্ভিস আসলে কোন সমস্যার সমাধান?'
    a: 'সংগঠনের সমস্যা: অনেক টিম যাতে একে অপরের অপেক্ষা ছাড়া স্বাধীনভাবে বদলাতে ও deploy করতে পারে।'
    more: |
      কোডের গোছানো ভাব বা গতির জন্য মাইক্রোসার্ভিস দরকার হয় না; সেটা মডুলার মনোলিথেও আসে। ছোট টিমে সমস্যাটাই নেই, তাই সমাধানটা শুধু বাড়তি বোঝা হয়ে দাঁড়ায়।
    ref: twelve-kitchens
  - q: 'মাইক্রোসার্ভিসের চারটা আসল খরচ কী?'
    a: 'Network call-এর ধীরগতি ও ব্যর্থতা, আলাদা deploy ও log, ভাঙা transaction, আর পুরো সিস্টেম চালানোর জটিলতা।'
    more: |
      এক প্রসেসের method call প্রায় বিনামূল্যে ও ব্যর্থ হয় না। সার্ভিসের মাঝের call timeout, retry আর আংশিক ব্যর্থতার ঝামেলা আনে। ডেটা কয়েকটা ডেটাবেসে ভাগ হলে এক transaction-এ সব ঠিক রাখা যায় না।
    ref: twelve-kitchens
  - q: 'একটা request ৫টা সার্ভিসের ভেতর দিয়ে যায়, প্রতিটা ৯৯.৯% ভরসার। কতবার ব্যর্থ হয়?'
    a: 'হাজারে প্রায় ৫ বার (০.৯৯৯-এর পাঁচ ঘাত প্রায় ০.৯৯৫), অথচ একটাই অ্যাপে হাজারে ১ বার। প্রতিটা বাড়তি ধাপ ব্যর্থতার সুযোগ বাড়ায়।'
    more: |
      অর্থাৎ প্রতি হাজারে ১টার বদলে ৫টা অর্ডার ব্যর্থ, কোনো bug ছাড়াই, শুধু অঙ্কের কারণে। তার ওপর timeout আর retry সামলানোর কোডও বাড়ে। একটাই অ্যাপের ভেতরে method call-এ এই হিসাব নেই।
    ref: twelve-kitchens
  - q: 'মডুলার মনোলিথ কী?'
    a: 'এক অ্যাপ, এক deploy, কিন্তু ভেতরে ব্যবসার কাজ ধরে শক্ত সীমানার module, প্রতিটার নিজের পাবলিক API ও নিজের ডেটা।'
    more: |
      এতে মনোলিথের সরলতা থাকে (একটা deploy, method call, এক transaction) আর মাইক্রোসার্ভিসের গোছানো সীমানাও আসে। আর সীমানাগুলো ঠিক হলে পরে কোনো module আলাদা সার্ভিস করা সহজ।
    ref: three-shapes
  - q: 'Distributed monolith কী?'
    a: 'সার্ভিসে ভাগ করা অ্যাপ, যা এমনভাবে জোড়া যে একটা বদলাতে হলে সবকটা একসাথে deploy করতে হয়।'
    more: |
      এতে মাইক্রোসার্ভিসের সব খরচ আছে, অথচ স্বাধীনতার কোনো সুবিধা নেই। সাধারণত ভুল সীমানা বা সবার একই ডেটাবেস ব্যবহারের ফল। এর চেয়ে সীমানাসহ মডুলার মনোলিথ অনেক ভালো।
    ref: three-shapes
  - q: 'এক module অন্য module-এর সাথে কীভাবে কথা বলবে?'
    a: 'অন্য module-এর পাবলিক `Api` interface দিয়ে, আর অন্যের entity না ধরে শুধু তার ID রেখে।'
    more: |
      অন্যের entity-তে Doctrine relation বা তার repository সরাসরি ডাকলে সীমানা শুধু নামেই থাকে। interface আর ID ধরলে পরে module আলাদা সার্ভিস হলেও বাকি কোড প্রায় একই থাকে। Deptrac দিয়ে এটা CI-তে পাহারা দেওয়া যায়।
    ref: modular-monolith-symfony
  - q: 'মডুলার মনোলিথের দাম কী?'
    a: 'শৃঙ্খলা: Deptrac-এর মতো টুল build ফেল না করালে module-এর মাঝে শর্টকাট আটকায় না। আর একটা module আলাদা করে scale বা deploy করা যায় না।'
    more: |
      কেউ জোর না করালে সীমানা শুধু ফোল্ডারই। CI-তে Deptrac চালালে অন্য module-এর দিকে `ManyToOne` build ফেল করায়। আর deploy একটাই বলে যে module-এর দশটা সার্ভার লাগে, সে বাকিদেরও টেনে নেয়।
    ref: boundary-leak
  - q: 'সার্ভিসের সীমানা কোন নিয়মে টানা উচিত?'
    a: 'ব্যবসায়িক কাজ আর ডেটার মালিকানা ধরে, যাতে প্রতিটা সার্ভিস তার ডেটার একমাত্র মালিক হয়।'
    more: |
      প্রযুক্তির স্তর ধরে ভাগ (Controller, Database) ভুল, কারণ প্রতিটা ফিচার সব স্তর ছুঁয়ে যায়। ব্যবসার কাজ ধরে ভাগ করলে বেশিরভাগ ফিচার এক জায়গায় আটকে থাকে। বিস্তারিত: [[thinking/ddd|DDD ও bounded context]]।
    ref: where-to-cut
  - q: 'কখন একটা module আলাদা সার্ভিস করা যুক্তিসংগত?'
    a: 'যখন আলাদা টিম স্বাধীনভাবে deploy করতে চায়, আলাদা scale লাগে, আর সীমানা মাসের পর মাস স্থির।'
    more: |
      শুধু "বড় অ্যাপ" বা "সবাই করছে" কারণ নয়। আর সার্ভিস চালানোর খরচ (monitoring, CI, ডেটা-মেলানো) সামলানোর লোকও লাগে। এই শর্তগুলো না মিললে মডুলার মনোলিথেই থাকা ভালো।
    ref: where-to-cut

quiz:
  - q: 'নিচের কোনগুলো মাইক্রোসার্ভিসের সত্যিকারের খরচ?'
    hint: 'এক প্রসেসের method call আর network call-এর পার্থক্য ভাবুন।'
    options:
      - text: 'প্রতিটা সার্ভিসের মাঝের call ধীর ও ব্যর্থ হতে পারে'
        correct: true
        why: 'network-এ timeout, retry আর আংশিক ব্যর্থতার বাড়তি কোড লাগে, যা method call-এ লাগত না।'
      - text: 'একই ফিচারের ডেটা কয়েকটা ডেটাবেসে ভাগ হয়, তাই transaction ভেঙে যায়'
        correct: true
        why: 'এক ডেটাবেসের ACID transaction সার্ভিসের সীমা পেরোয় না, ডেটা মেলানো আলাদা কাজ হয়ে যায়।'
      - text: 'কোড লেখা সবসময় PHP থেকে অন্য ভাষায় করতে হয়'
        correct: false
        why: 'ভাষা বদলানো বাধ্যতামূলক নয়। এটা সুবিধা, খরচ নয়।'
      - text: 'প্রতিটা সার্ভিসের জন্য আলাদা deploy, log আর monitoring লাগে'
        correct: true
        why: 'যত সার্ভিস, তত deploy pipeline আর তত জায়গা খুঁজতে হয়।'
    ref: twelve-kitchens
  - q: 'নিচের কোড কোন সমস্যা তৈরি করছে?'
    lang: php
    code: |
      // src/Shipping/Domain/Delivery.php
      #[ORM\Entity]
      class Delivery
      {
          #[ORM\ManyToOne(targetEntity: \App\Billing\Domain\Invoice::class)]
          private Invoice $invoice;
      }
    hint: 'Shipping module Billing-এর ভেতরের কোন জিনিস ধরে আছে?'
    options:
      - text: 'Shipping Billing-এর entity-তে বাঁধা, তাই সীমানা শুধু ফোল্ডারের নামে'
        correct: true
        why: 'Invoice-এর টেবিল বদলালে Shipping ভাঙে, আর পরে Billing আলাদা সার্ভিস করাও কঠিন।'
      - text: 'ManyToOne-এর বদলে OneToMany হওয়া উচিত'
        correct: false
        why: 'সম্পর্কের দিক সমস্যা নয়; সমস্যা হলো module-এর সীমানা পেরিয়ে relation।'
      - text: 'Doctrine annotation পুরনো, তাই ভুল'
        correct: false
        why: 'এটা attribute, যা আধুনিক Doctrine-এ ঠিক।'
      - text: 'কোনো সমস্যা নেই, দুটো তো একই অ্যাপে'
