slides:
  - slug: too-many-machines
    title: 'পাঁচশো ব্যবহারকারী, ছয়টা প্রযুক্তি'
    kind: story
    tldr: 'প্রতিটা নতুন প্রযুক্তি বসানোর খরচের সাথে সারা জীবন চালানোর খরচও আনে — ছোট টিম সেই ভারেই ডোবে।'
    keywords: ['complexity', 'tech stack', 'over-engineering', 'জটিলতা', 'নতুন প্রযুক্তি', 'চালানোর খরচ']
    blocks:
      - type: metaphor
        icon: shop
        title: 'বিরিয়ানির হোটেলে নতুন নতুন যন্ত্র'
        body: |
          করিম ভাইয়ের বিরিয়ানির হোটেলে দুইটা চুলা আর তিনজন কর্মী। বড় রেস্টুরেন্ট দেখে তিনি তন্দুর, কফি মেশিন আর আইসক্রিম মেশিন কিনে ফেললেন। এখন প্রতিটা যন্ত্রের আলাদা মিস্ত্রি, আলাদা যন্ত্রাংশ, আলাদা প্রশিক্ষণ লাগে। শুক্রবার দুপুরের ভিড়ে তন্দুর বিগড়ে গেল — হোটেলের কেউ সেটা সারাতে জানে না।
      - type: text
        body: |
          তিনজনের একটা টিম ঠিক এটাই করে, যখন ৫০০ ব্যবহারকারীর অ্যাপে MongoDB, Kafka, Elasticsearch আর Kubernetes বসায় — "বড় কোম্পানিরা তো এগুলোই চালায়" ভেবে।
      - type: visual
        kind: compare
        caption: 'একই অ্যাপ, দুই রকম stack — কোনটায় রাত জাগতে হবে বেশি?'
        columns:
          - title: 'যা দিয়ে দিব্যি চলত'
            tone: good
            icon: check
            tip: 'দুইটা চেনা প্রযুক্তি। তিনজনের প্রত্যেকে দুটোই ভালো চেনে, তাই যে-কেউ যেকোনো সমস্যা সারাতে পারে।'
            items:
              - 'Symfony — একটাই অ্যাপ'
              - 'PostgreSQL — ডেটা, সার্চ আর queue তিনটাই'
              - 'একটা সার্ভার, সহজ deploy'
          - title: 'যা বসানো হলো'
            tone: bad
            icon: warning
            tip: 'ছয়টা প্রযুক্তি, তিনজন মানুষ। প্রতিটার আলাদা deploy, backup, monitoring আর upgrade — কেউই সবগুলো গভীরভাবে চেনে না।'
            items:
              - 'Symfony + PostgreSQL (আগের মতোই)'
              - 'MongoDB — "দ্রুত" শুনে'
              - 'Kafka — "পরে scale লাগবে" ভেবে'
              - 'Elasticsearch — সার্চের জন্য'
              - 'Kubernetes — এত কিছু চালানোর জন্য'
    aside:
      - type: story
        title: 'রাত তিনটার ফোন'
        body: |
          এক স্টার্টআপে Kafka যিনি বসিয়েছিলেন, তিনি চাকরি ছেড়ে গেলেন। তিন মাস পর এক রাতে message আটকে গিয়ে অর্ডার জমতে থাকল। বাকি দুজন সারা রাত ডকুমেন্টেশন পড়ে কাটাল — কারণ প্রযুক্তিটা টিমের জানা ছিল না, ছিল একজনের মাথায়।
      - type: terms
        items:
          - {term: 'Stack', meaning: 'একটা অ্যাপ চালাতে যত প্রযুক্তি লাগে, সব মিলিয়ে।'}
          - {term: 'Over-engineering', meaning: 'সমস্যার চেয়ে বড় আর জটিল সমাধান বানানো।'}
          - {term: 'MongoDB, Kafka ইত্যাদি', meaning: 'যথাক্রমে document ডেটাবেস, বিপুল message বওয়ার পাইপলাইন, সার্চ ইঞ্জিন আর container-এর বহর সামলানোর ব্যবস্থা। সবই আসল টুল, কিন্তু ৫০০ জনের চেয়ে বহু গুণ বড় চাপের জন্য বানানো।'}
    check:
      q: 'একটা প্রযুক্তি বিনা পয়সায় পাওয়া গেলেও টিমকে কোথায় কোথায় দাম দিতে হয়?'
      a: 'শেখা, deploy, monitoring, backup, upgrade আর বিগড়ালে সারানো — প্রতিটায় টিমের সময় যায়, আর যত দিন প্রযুক্তিটা থাকে তত দিন এই খরচ চলে।'

  - slug: complexity-budget
    title: 'জটিলতার বাজেট আর boring technology'
    kind: concept
    tldr: 'টিমের মনোযোগ সীমিত বাজেটের মতো: নতুন প্রযুক্তিতে খরচ করুন শুধু যেখানে ব্যবসা এগিয়ে যায়, বাকি সবখানে চেনা জিনিস।'
    keywords: ['complexity budget', 'boring technology', 'innovation token', 'জটিলতার বাজেট', 'চেনা প্রযুক্তি']
    blocks:
      - type: text
        body: |
          হোটেলের তিনজন কর্মী যেমন অল্প কয়টা যন্ত্রই ভালো করে চালাতে শেখে, একটা টিমও অল্প কয়টা প্রযুক্তিই গভীরভাবে চিনতে পারে। এই সীমার নাম **complexity budget** — জটিলতা খরচ করার বাজেট। প্রতিটা নতুন ডেটাবেস, queue বা language সেই বাজেট থেকে কাটে। **Boring technology** মানে পুরনো বা দুর্বল নয়; মানে এমন প্রযুক্তি, যেটা কীভাবে ভাঙে তা সবার আগে থেকেই জানা।
      - type: visual
        kind: table
        caption: 'একটা নতুন প্রযুক্তি সাথে করে যে পাঁচটা খরচ আনে'
        headers: ['খরচের খাত', 'কাজটা কী', 'কত দিন চলে']
        rows:
          - cells: ['শেখা', 'পুরো টিমকে চেনানো', 'নতুন লোক এলেই আবার']
            tip: 'একজন জানলে হয় না। সে ছুটিতে গেলে বা চাকরি ছাড়লে বাকিরা অসহায় — তাই সবাইকে শিখতে হয়।'
          - cells: ['চালানো', 'deploy, monitoring, backup, alert', 'প্রতিদিন']
            tip: 'প্রতিটা প্রযুক্তির নিজস্ব dashboard, নিজস্ব backup পদ্ধতি আর নিজস্ব alert বানাতে ও দেখতে হয়।'
          - cells: ['হালনাগাদ', 'version upgrade, security patch', 'বছরে কয়েকবার']
            tip: 'upgrade ফেলে রাখলে নিরাপত্তার ফাঁক থাকে; করলে কিছু না কিছু ভাঙার ঝুঁকি থাকে। দুটোই সময় খায়।'
          - cells: ['বিগড়ানো', 'অচেনা error, মাঝরাতের outage', 'যখন-তখন']
            tip: 'চেনা প্রযুক্তির error-এর সমাধান এক সার্চে মেলে। অচেনা প্রযুক্তিতে একই সমস্যায় পুরো রাত যায়।'
          - cells: ['বিদায়', 'ডেটা সরিয়ে অন্য কিছুতে যাওয়া', 'একবার, তবে সবচেয়ে দামি']
            tip: 'বসানো সহজ, তোলা কঠিন। ডেটা জমে গেলে প্রযুক্তি বাদ দেওয়াটাই আলাদা একটা প্রজেক্ট হয়ে দাঁড়ায়।'
      - type: points
        title: 'বাজেট খরচের নিয়ম'
        style: check
        items:
          - 'আগে জিজ্ঞেস করুন: হাতে যা আছে তা দিয়ে কি কাজটা চলে? চললে নতুন কিছু নয়।'
          - 'একসাথে একটার বেশি অচেনা প্রযুক্তি নয়; আগেরটা টিমের চেনা হলে তবে পরেরটা।'
          - 'নতুন প্রযুক্তি নিন শুধু সেখানে, যেখানে সেটা ব্যবসাকে প্রতিযোগীর চেয়ে এগিয়ে দেয়।'
      - type: quote
        body: 'নতুন প্রযুক্তি কেনা একবারের খরচ, চালানো সারা জীবনের।'
    aside:
      - type: story
        title: 'তিনটা innovation token'
        body: |
          Dan McKinley তাঁর বিখ্যাত লেখা "Choose Boring Technology"-তে বলেন: ধরে নিন প্রতিটা কোম্পানির হাতে মোটে তিনটার মতো "innovation token" আছে। অচেনা ডেটাবেস নিলে একটা খরচ, অচেনা language নিলে আরেকটা। তাই token খরচ করুন ভেবেচিন্তে — যেখানে লাভ সবচেয়ে বেশি।
      - type: remember
        body: 'Boring মানে খারাপ নয় — boring মানে চমক নেই। প্রোডাকশনে চমক না থাকাই ভালো।'
      - type: refs
        items:
          - {to: 'soft-skills/discipline', label: 'Hype নয়, বাস্তবতা'}
      - type: when
        use:
          - 'মাপা এমন দরকার, যা হাতের টুলে মেটে না — যেমন tuning-এর পরও সার্চ ধীর।'
          - 'যে ফিচার ব্যবসাকে আলাদা করে আর সত্যিই নতুন টুল চায়।'
        avoid:
          - '"বড় কোম্পানি চালায়" বা "পরে লাগবে" — কোনো সংখ্যা ছাড়া।'
          - 'প্রথম অচেনা প্রযুক্তি টিমের রপ্ত হওয়ার আগেই দ্বিতীয়টা আনা।'
    check:
      q: '"Boring technology" বলতে আসলে কী বোঝায়?'
      a: 'পুরনো বা দুর্বল প্রযুক্তি নয় — এমন প্রযুক্তি, যার ভাঙার ধরনগুলো বহু বছরের ব্যবহারে জানা হয়ে গেছে। তাই চমক কম, আর সমস্যার সমাধান সহজে মেলে।'

  - slug: three-roads
    title: 'তিন রাস্তা: বানানো, কেনা, ওপেন সোর্স'
    kind: compare
    tldr: 'যা ব্যবসাকে আলাদা করে তা বানান, যা সবার একই রকম লাগে তা কিনুন, আর পরিণত টুল চালাতে পারলে ওপেন সোর্স নিন।'
    keywords: ['build vs buy', 'open source', 'SaaS', 'বানানো নাকি কেনা', 'ওপেন সোর্স', 'core domain']
    blocks:
      - type: metaphor
        icon: shop
        title: 'হোটেলের ফিরনি তিনভাবে আসতে পারে'
        body: |
          করিম ভাই নিজের রেসিপি দাঁড় করিয়ে ফিরনি **বানাতে** পারেন — স্বাদ পুরো নিজের হাতে, কিন্তু মাসখানেক পরীক্ষা আর রোজকার রান্না লাগবে। মিষ্টির দোকান থেকে রোজ **কিনে** আনতে পারেন — কাল থেকেই চালু, তবে দাম আর স্বাদ দোকানের হাতে। অথবা নামী বাবুর্চির ছাপানো **ফ্রি রেসিপি** নিতে পারেন — রেসিপির দাম শূন্য, কিন্তু বাজার, রান্না আর নষ্ট হলে দায় তাঁরই। ওপেন সোর্স এই তৃতীয়টা।
      - type: visual
        kind: table
        caption: 'তিন রাস্তায় কী পান আর কী দেন'
        headers: ['', 'বানানো', 'কেনা (SaaS)', 'ওপেন সোর্স']
        rows:
          - cells: ['শুরুর খরচ', 'বেশি — সপ্তাহ থেকে মাস', 'কম — কয়েক দিনে চালু', 'মাঝারি — বসানো ও শেখা']
            tip: 'কিনলে সবচেয়ে দ্রুত শুরু হয়। বানাতে গেলে প্রথম দিন থেকে লাভ পাওয়া যায় না।'
          - cells: ['চলতি খরচ', 'নিজের টিমের রক্ষণাবেক্ষণ', 'মাসিক বিল, ব্যবহারে বাড়ে', 'সার্ভার + চালানোর লোক']
            tip: 'কোনো রাস্তাই বিনা খরচে চলে না — শুধু খরচটা ভিন্ন জায়গায় পড়ে: কোথাও বিলে, কোথাও মানুষের সময়ে।'
          - cells: ['নিয়ন্ত্রণ', 'পুরোটা নিজের', 'vendor যতটুকু দেয়', 'কোড খোলা, বদলানো যায়']
            tip: 'কেনা জিনিসে নতুন ফিচার চাইলে vendor-এর অপেক্ষায় থাকতে হয়। নিজের বা খোলা কোডে নিজেই বদলানো যায়।'
          - cells: ['বড় ঝুঁকি', 'সময় বেশি লাগা, সব bug নিজের', 'দাম বাড়া, lock-in, বন্ধ হওয়া', 'চালানোর দক্ষতা না থাকা']
            tip: 'প্রতিটা রাস্তার ঝুঁকি আলাদা। সিদ্ধান্তের আগে জিজ্ঞেস করুন: এই ঝুঁকিটা আমার টিম সামলাতে পারবে তো?'
          - cells: ['মানায় যখন', 'এটাই ব্যবসার আসল শক্তি', 'কাজটা সবার একই রকম', 'টুল পরিণত, চালানোর লোক আছে']
            tip: 'উদাহরণ: দাম ঠিক করার নিজস্ব নিয়ম বানান; পেমেন্ট, SMS, ইমেইল কিনুন; framework আর ডেটাবেস ওপেন সোর্স নিন।'
      - type: quote
        body: 'যা আপনাকে প্রতিযোগীর থেকে আলাদা করে তা বানান। যা সবার একই রকম লাগে, তা কিনুন বা তৈরি জিনিস নিন।'
    aside:
      - type: terms
        items:
          - {term: 'SaaS', meaning: 'অন্যের সার্ভারে চলা সেবা, যা মাসিক বিল দিয়ে ব্যবহার করা হয় — নিজে কিছু চালাতে হয় না।'}
          - {term: 'Core domain', meaning: 'ব্যবসার সেই অংশ, যেটা ভালো করার জন্যই ক্রেতা আপনার কাছে আসে।'}
          - {term: 'Not Invented Here', meaning: 'তৈরি ভালো সমাধান থাকতেও "নিজেরাই বানাব" বলে জেদ করা।'}
      - type: pitfalls
        items:
          - 'নিজের login, payment বা encryption বানানো — এগুলোতে ছোট ভুলের দাম বিশাল, আর পরীক্ষিত সমাধান হাতের কাছেই আছে।'
          - 'একজন মানুষের শখের ওপেন সোর্স প্রজেক্টের ওপর প্রোডাকশন দাঁড় করানো।'
    check:
      q: 'ফুড ডেলিভারি অ্যাপে কোনটা বানানো উচিত আর কোনটা কেনা — রাইডার বণ্টনের নিয়ম, নাকি SMS পাঠানো?'
      a: 'রাইডার বণ্টনের নিয়ম বানান, কারণ ওটাই ব্যবসাকে অন্যদের থেকে আলাদা করে। SMS পাঠানো সবার একই রকম, তাই কিনুন।'

  - slug: tco-worked-example
    title: 'TCO: তিন বছরের আসল দাম হিসাব করা'
    kind: howto
    tldr: 'দাম মানে শুধু license বা মাসিক বিল নয়: বসানো + চালানো + মানুষের সময় + বেরোনোর খরচ — তিন বছরের যোগফল দেখে বাছুন।'
    keywords: ['TCO', 'total cost of ownership', 'মোট খরচ', 'engineer time', 'হিসাব', 'exit cost']
    blocks:
      - type: text
        body: |
          **TCO** (total cost of ownership) মানে একটা জিনিস যত দিন রাখবেন, তত দিনে মোট খরচ। এতে সবচেয়ে বড় আর সবচেয়ে লুকানো খাত হলো ইঞ্জিনিয়ারের সময়। নিচে একটা দোকানের অ্যাপে পণ্য সার্চ যোগ করার হিসাব: **বানানো** = PostgreSQL-এর full-text search দিয়ে নিজে লেখা, **কেনা** = SaaS সার্চ সেবা, **ওপেন সোর্স** = নিজের সার্ভারে OpenSearch। ধরা হয়েছে একজন ইঞ্জিনিয়ারের এক দিনের খরচ ৫ হাজার টাকা।
      - type: visual
        kind: table
        caption: 'পণ্য সার্চ: তিন বছরের খরচ, হাজার টাকায় (উদাহরণের জন্য ধরে নেওয়া সংখ্যা)'
        headers: ['খরচের খাত', 'বানানো', 'কেনা', 'ওপেন সোর্স']
        rows:
          - cells: ['শুরুতে বানানো বা বসানো', '৩০ দিন = ১৫০', '৫ দিন = ২৫', '১৫ দিন = ৭৫']
            tip: 'ইঞ্জিনিয়ার-দিন × ৫ হাজার টাকা। কিনলে শুধু API জুড়তে হয়, তাই শুরুটা সবচেয়ে সস্তা।'
          - cells: ['৩৬ মাসের বিল বা সার্ভার', '০ (চালু ডেটাবেসেই)', '১৫ × ৩৬ = ৫৪০', '২০ × ৩৬ = ৭২০']
            tip: 'OpenSearch-এর license ফ্রি, কিন্তু তার জন্য আলাদা সার্ভার লাগে — মাসে ২০ হাজার ধরা হয়েছে। SaaS-এর বিল মাসে ১৫ হাজার।'
          - cells: ['৩৬ মাসের রক্ষণাবেক্ষণ', 'মাসে ২ দিন = ৩৬০', 'মাসে আধা দিন = ৯০', 'মাসে ৩ দিন = ৫৪০']
            tip: 'upgrade, backup, monitoring, সমস্যা সারানো — মাসে যত দিন যায় × ৫ হাজার × ৩৬। এই লাইনটাই সবাই ভুলে যায়।'
          - cells: ['তিন বছরে মোট', '৫১০', '৬৫৫', '১,৩৩৫']
            tip: 'এই উদাহরণে "ফ্রি" ওপেন সোর্সই সবচেয়ে দামি, কারণ সার্ভার আর চালানোর সময় দুটোই লাগছে। আপনার সংখ্যায় ফল অন্য রকম হতে পারে।'
          - cells: ['বেরোনোর খাটুনি (যোগফলে নেই)', '৫ দিন — নিজের সার্চ কোড বদলানো', '১০ দিন — ডেটা export, কোড নতুন করে জোড়া', '৮ দিন — ডেটা সরানো, query নতুন করে লেখা']
            tip: 'পরে এটা বাদ দিতে কত দিন লাগবে, দিনে ৫ হাজার টাকা ধরে। যোগফলে ধরা হয়নি, কারণ হয়তো কখনো দিতেই হবে না — তবে মত বদলানোর দাম এটাই।'
      - type: visual
        kind: bars
        caption: 'তিন বছরের মোট খরচ পাশাপাশি'
        items:
          - {label: 'বানানো', value: 510, display: '৫.১ লাখ', tone: good, tip: 'শুরুতে ৩০ দিন খাটুনি, কিন্তু নতুন সার্ভার বা বিল নেই। তবে আরও উন্নত সার্চ ফিচার চাইলে পরে আরও সময় লাগবে।'}
          - {label: 'কেনা', value: 655, display: '৬.৫৫ লাখ', tip: 'বেশিরভাগ খরচ মাসিক বিলে। ব্যবহার দশ গুণ হয়ে বিলও সেই হারে বাড়লে ১৫০ × ৩৬ = ৫,৪০০ হাজার — তখন বানানোই অনেক এগিয়ে। এটা আলাদা করে হিসাব করে নিন।'}
          - {label: 'ওপেন সোর্স', value: 1335, display: '১৩.৩৫ লাখ', tone: bad, tip: 'license শূন্য টাকা, তবু মোট খরচ সবচেয়ে বেশি: ৭.২ লাখ সার্ভারে আর ৫.৪ লাখ চালানোর সময়ে।'}
      - type: points
        title: 'হিসাবের চার ধাপ'
        style: number
        items:
          - 'শুরুর খরচ: বানাতে বা বসাতে কত ইঞ্জিনিয়ার-দিন × এক দিনের খরচ।'
          - 'চলতি খরচ: মাসিক বিল বা সার্ভার + মাসে রক্ষণাবেক্ষণের দিন — ৩৬ মাসের জন্য।'
          - 'বেরোনোর খরচ: কাল এটা বাদ দিতে হলে কত দিন লাগবে, সেটাও লিখুন।'
          - 'যোগ করে তুলনা করুন, তারপর ঝুঁকি আর টিমের দক্ষতা মিলিয়ে সিদ্ধান্ত নিন।'
    aside:
      - type: pitfalls
        items:
          - 'ইঞ্জিনিয়ারের সময়কে শূন্য টাকা ধরা — সবচেয়ে সাধারণ ভুল।'
          - 'শুধু প্রথম মাসের বিল দেখা; ব্যবহার দশ গুণ হলে বিল কত দাঁড়াবে তা না দেখা।'
          - 'সংখ্যা সমান-সমান হলে চেনা প্রযুক্তি না বেছে চকচকে নতুনটা বেছে নেওয়া।'
      - type: remember
        body: 'দাম = বসানো + চালানো + বেরোনো। License সেখানে শুধু একটা লাইন।'
      - type: refs
        items:
          - {to: 'thinking/estimation', label: 'খাতার পাতায় দ্রুত হিসাব'}
          - {to: 'infra/finops', label: 'FinOps: খরচের হিসাব'}
    check:
      q: 'একটা ওপেন সোর্স টুলের license ফ্রি হলে তার TCO-তে কোন কোন খরচ থেকে যায়?'
      a: 'বসানো ও শেখার সময়, সার্ভারের বিল, প্রতি মাসের upgrade–backup–monitoring-এর সময়, আর পরে অন্য কিছুতে সরে যাওয়ার খরচ।'

  - slug: no-exit-door
    title: 'কিনেছেন ঠিকই, কিন্তু বেরোনোর দরজা রাখেননি'
    kind: pitfall
    tldr: 'vendor-এর SDK সারা কোডে ছড়ালে vendor বদলানো প্রায় অসম্ভব; একটা interface-এর পেছনে রাখলে বদল হয় এক জায়গায়।'
    keywords: ['vendor lock-in', 'exit plan', 'interface', 'Notifier', 'vendor বদলানো', 'lock-in']
    blocks:
      - type: text
        body: |
          কেনা ভুল নয়; ভুল হলো vendor-কে কোডের সব জায়গায় ঢুকতে দেওয়া। করিম ভাইয়ের মেনু, বিল আর সাইনবোর্ড — সবখানে যদি মিষ্টির দোকানের নাম ছাপা থাকে, দোকান দাম দ্বিগুণ করলেও তিনি সরতে পারবেন না। সফটওয়্যারে এর নাম **vendor lock-in**। নিচের কোডে SMS vendor-এর class সরাসরি business কোডে বসে আছে।
      - type: code
        lang: php
        file: 'src/Service/OrderService.php'
        variant: bad
        code: |
          // এমন কোড আরও ৪০টা service-এ ছড়িয়ে আছে
          public function confirm(Order $order): void
          {
              $order->confirm();
              $this->em->flush();

              $twilio = new \Twilio\Rest\Client($this->sid, $this->token);
              $twilio->messages->create($order->getPhone(), [
                  'from' => $this->from,
                  'body' => 'আপনার অর্ডার নিশ্চিত হয়েছে',
              ]);
          }
        marks:
          - {line: 7, tip: 'vendor-এর নাম business কোডের ভেতরে। vendor বদলালে এই ৪০ জায়গার প্রতিটা নতুন করে লিখতে আর টেস্ট করতে হবে।'}
          - {line: 8, tip: 'ডাকার ধরনটাও vendor-এর নিজস্ব। অন্য vendor-এর SDK-তে method আর option-এর নাম আলাদা হবে।'}
      - type: code
        lang: php
        file: 'src/Service/OrderService.php'
        variant: good
        code: |
          public function __construct(
              private EntityManagerInterface $em,
              private TexterInterface $texter,   // Symfony Notifier-এর interface
          ) {
          }

          public function confirm(Order $order): void
          {
              $order->confirm();
              $this->em->flush();

              $this->texter->send(
                  new SmsMessage($order->getPhone(), 'আপনার অর্ডার নিশ্চিত হয়েছে'),
              );
          }
        marks:
          - {line: 3, tip: 'কোড শুধু interface চেনে। কোন vendor দিয়ে SMS যাবে, তা ঠিক হয় config-এর একটা DSN-এ — এই class জানেই না।'}
          - {line: 12, tip: 'vendor বদলাতে DSN, notifier.yaml-এর সংশ্লিষ্ট লাইন আর একটা composer package বদলাবে; এই লাইন যেমন আছে তেমনই থাকবে।'}
      - type: quote
        body: 'Vendor-কে চিনবে শুধু একটা জায়গা। বাকি কোড চিনবে শুধু interface।'
    aside:
      - type: commands
        title: 'vendor বদলের পুরো কাজ'
        items:
          - {cmd: 'composer require symfony/twilio-notifier', desc: 'যে vendor চাই তার Notifier bridge বসান'}
          - {cmd: 'TWILIO_DSN=twilio://SID:TOKEN@default?from=FROM', desc: '.env.local-এ DSN — vendor-এর নাম শুধু এখানেই থাকে'}
          - {cmd: 'texter_transports: {twilio: ''%env(TWILIO_DSN)%''}', desc: 'config/packages/notifier.yaml-এর সেই একটা লাইন'}
      - type: tips
        items:
          - 'vendor-এর জন্য Symfony-র তৈরি bridge না থাকলে নিজের ছোট interface লিখুন, আর vendor-এর কোড রাখুন একটাই adapter class-এ।'
          - 'চুক্তির আগে জিজ্ঞেস করুন: আমার ডেটা কোন ফরম্যাটে, কত সহজে বের করে আনা যাবে?'
          - 'interface-এর দামও আছে: সব vendor যা দেয় শুধু তা-ই ব্যবহার করা যায়। যে টুল কখনো বদলাবেন না, তাতে এটা লাগে না।'
      - type: refs
        items:
          - {to: 'thinking/hexagonal', label: 'Port ও adapter দিয়ে vendor আলাদা রাখা'}
          - {to: 'ledgers/third-party-integrations', label: 'বাইরের সার্ভিসের সাথে ইন্টিগ্রেশন'}
    check:
      q: 'ভালো ডিজাইনে SMS vendor বদলাতে কয় জায়গায় হাত দিতে হয়, আর কেন?'
      a: 'এক জায়গায় — config বা একটা adapter class-এ। বাকি কোড শুধু interface চেনে, vendor-এর নাম জানেই না।'

flashcards:
  - q: 'Complexity budget কী?'
    a: 'একটা টিম একসাথে যতটুকু জটিলতা সামলাতে পারে তার সীমা। প্রতিটা নতুন প্রযুক্তি এই বাজেট থেকে খরচ করে।'
    more: |
      টিমের মনোযোগ আর সময় সীমিত। প্রতিটা নতুন ডেটাবেস, queue বা language শেখা, চালানো আর সারানোর দায় আনে। বাজেট ফুরিয়ে গেলে টিম আর ফিচার বানাতে পারে না, শুধু যন্ত্রপাতি সামলায়। তাই নতুন প্রযুক্তি আনার আগে দেখুন, হাতে যা আছে তা দিয়ে কাজটা চলে কি না।
    ref: complexity-budget
  - q: '"Boring technology" মানে কী?'
    a: 'এমন পরিণত, বহুল ব্যবহৃত প্রযুক্তি, যার ভাঙার ধরন আর সমাধান আগে থেকেই জানা — যেমন PostgreSQL।'
    more: |
      Boring মানে পুরনো বা দুর্বল নয়। মানে হলো এতে চমক কম: error-এর সমাধান সহজে মেলে, অভিজ্ঞ লোক পাওয়া যায়, টুলগুলো পরিণত। নতুন প্রযুক্তিতে অজানা সমস্যা বেশি থাকে, আর সেগুলো ধরা পড়ে প্রোডাকশনে গিয়ে।
    ref: complexity-budget
  - q: 'একটা নতুন প্রযুক্তি কোন কোন চলতি খরচ আনে?'
    a: 'শেখা, চালানো (deploy, monitoring, backup), হালনাগাদ (upgrade, patch), বিগড়ালে সারানো, আর শেষে সরিয়ে ফেলার খরচ।'
    more: |
      বসানোর খরচ একবারের, কিন্তু এই পাঁচটা চলে যত দিন প্রযুক্তিটা থাকে। এর বেশিরভাগই টাকায় নয়, টিমের সময়ে দিতে হয় — তাই বিলে চোখে পড়ে না। প্রযুক্তিটা একজনের মাথায় থাকলে সে চলে গেলে পুরো টিম বিপদে পড়ে।
    ref: complexity-budget
  - q: 'কোন জিনিস নিজে বানানো উচিত, আর কোনটা কেনা?'
    a: 'যা ব্যবসাকে প্রতিযোগীর থেকে আলাদা করে তা বানান। যা সবার একই রকম লাগে (পেমেন্ট, SMS, ইমেইল) তা কিনুন।'
    more: |
      বানাতে সময় আর মনোযোগ লাগে, তাই সেটা খরচ করুন ব্যবসার আসল শক্তির জায়গায় — যাকে core domain বলে। সবার একই রকম লাগা কাজে অন্যরা বছরের পর বছর খেটে ভালো সমাধান বানিয়ে রেখেছে; সেটা নতুন করে বানানো সময়ের অপচয়। বিস্তারিত তুলনা: [[three-roads|তিন রাস্তা]]।
    ref: three-roads
  - q: 'ওপেন সোর্স সফটওয়্যার "ফ্রি" হলেও খরচ কোথায়?'
    a: 'License ফ্রি, কিন্তু সার্ভার, বসানো, upgrade, backup, monitoring আর সমস্যা সারানোর দায় পুরোটাই নিজের।'
    more: |
      এটা ফ্রি রেসিপির মতো: রেসিপির দাম শূন্য, কিন্তু বাজার, রান্না আর নষ্ট হলে দায় আপনার। নিজে চালানো ওপেন সোর্স টুলের মোট খরচ অনেক সময় SaaS-এর চেয়েও বেশি দাঁড়ায়, কারণ মানুষের সময় সবচেয়ে দামি। তবে পরিণত টুল আর চালানোর দক্ষ লোক থাকলে এটাই সবচেয়ে ভালো রাস্তা হতে পারে।
    ref: three-roads
  - q: 'TCO (total cost of ownership) কী?'
    a: 'একটা জিনিস যত দিন রাখবেন তত দিনের মোট খরচ: বসানো + চালানো + মানুষের সময় + শেষে বেরিয়ে আসা।'
    more: |
      শুধু license বা প্রথম মাসের বিল দেখে সিদ্ধান্ত নিলে ভুল হয়। সাধারণত তিন বছরের হিসাব করা হয়: শুরুর ইঞ্জিনিয়ার-দিন, ৩৬ মাসের বিল বা সার্ভার, প্রতি মাসের রক্ষণাবেক্ষণের দিন, আর সরে যাওয়ার খরচ। সব যোগ করে তবেই তুলনা।
    ref: tco-worked-example
  - q: 'TCO হিসাবে কোন খরচটা সবচেয়ে বেশি বাদ পড়ে?'
    a: 'ইঞ্জিনিয়ারের সময় — বসানো, শেখা আর প্রতি মাসের রক্ষণাবেক্ষণে যত দিন যায়।'
    more: |
      বিল চোখে দেখা যায়, কিন্তু মানুষের সময় কোনো invoice-এ আসে না। অথচ মাসে মাত্র ৩ দিন রক্ষণাবেক্ষণ, দিনে ৫ হাজার টাকা ধরলে, তিন বছরে ৫.৪ লাখ টাকা। আর ওই সময়ে যে ফিচারগুলো বানানো গেল না, সেই ক্ষতি তো আলাদা।
    ref: tco-worked-example
  - q: 'Vendor lock-in কী, আর ঠেকানোর উপায় কী?'
    a: 'vendor-এর ওপর এতটা নির্ভরতা যে সরে আসা প্রায় অসম্ভব। ঠেকাতে vendor-কে একটা interface-এর পেছনে রাখুন।'
    more: |
      vendor-এর SDK সারা কোডে ছড়িয়ে থাকলে vendor দাম বাড়ালে বা বন্ধ হলে পুরো কোড নতুন করে লিখতে হয়। business কোড যদি শুধু একটা interface চেনে, তাহলে বদল হয় একটা adapter বা config-এ। সাথে নিশ্চিত হোন, আপনার ডেটা export করার উপায় আছে। আরও: [[thinking/hexagonal|ports ও adapters]]।
    ref: no-exit-door
  - q: 'vendor-কে interface-এর পেছনে রাখার দাম কী?'
    a: 'একটু বাড়তি কোড, আর শুধু সেই ফিচারই চলে যা সব vendor দেয়। যে টুল কখনো বদলাবেন না, তাতে এটা বাদ দিন।'
    more: |
      Twilio আর অন্য SMS vendor-এর মাঝে মানানসই interface শুধু সাধারণ SMS-ই দিতে পারে। যে ফিচার একটা vendor-এরই আছে, তার জন্য আলাদা adapter বা vendor-নির্দিষ্ট option লাগে। তাই যেগুলো বদলাতে বা দামি হয়ে উঠতে পারে — SMS, payment — সেগুলো মুড়ে রাখুন; দশ বছর যে framework নিয়ে থাকবেন, তাকে নয়।
    ref: no-exit-door

quiz:
  - q: 'চারজনের টিম, ২ হাজার ব্যবহারকারী। ইমেইল পাঠানোর মতো কিছু কাজ background-এ করা দরকার। একজন বলল, "Kafka বসাই, পরে scale লাগবে।" সবচেয়ে ভালো সিদ্ধান্ত কোনটা?'
    hint: 'হাতে যা আছে তা দিয়ে কাজটা চলে কি না, আগে সেটা দেখুন।'
    options:
      - text: 'Symfony Messenger দিয়ে চালু PostgreSQL বা Redis-কেই queue হিসেবে ব্যবহার করা'
        correct: true
        why: 'নতুন কোনো প্রযুক্তি চালাতে হচ্ছে না, অথচ কাজটা হয়ে যাচ্ছে। পরে সত্যিই দরকার হলে Messenger-এর transport বদলানো যায়।'
      - text: 'Kafka বসানো, কারণ পরে বদলানো কঠিন হবে'
        correct: false
        why: 'এই চাপে Kafka-র কোনো দরকার নেই, অথচ চালানোর ভার আজ থেকেই বইতে হবে। Messenger ব্যবহার করলে পরে transport বদলানোও কঠিন নয়।'
      - text: 'নিজেরা একটা queue সিস্টেম লিখে ফেলা'
        correct: false
        why: 'queue সবার একই রকম লাগে, আর পরীক্ষিত সমাধান হাতের কাছেই আছে। এটা বানানো সময়ের অপচয়, bug-ও নিজেদের ঘাড়ে।'
      - text: 'ইমেইল request-এর ভেতরেই পাঠানো, কারণ যেকোনো queue-ই জটিলতা'
        correct: false
        why: 'চালু ডেটাবেসে Messenger বসানো প্রায় বিনা খরচের জটিলতা, আর ব্যবহারকারীকে অপেক্ষা করানোর সমস্যাটা সত্যিই মেটায়।'
    ref: complexity-budget
  - q: 'নিজের সার্ভারে একটা ওপেন সোর্স সার্চ ইঞ্জিন চালালে নিচের কোন খরচগুলো আপনাকে দিতে হবে?'
    hint: 'ফ্রি রেসিপির কথা ভাবুন: কোনটা ফ্রি, আর কোনগুলো আপনার দায়?'
    options:
      - text: 'সার্ভারের মাসিক বিল'
        correct: true
        why: 'সফটওয়্যার ফ্রি হলেও সেটা চালানোর যন্ত্র ফ্রি নয়।'
      - text: 'version upgrade আর security patch বসানোর সময়'
        correct: true
        why: 'নিজে চালালে হালনাগাদ রাখার দায়ও নিজের; ফেলে রাখলে নিরাপত্তার ফাঁক তৈরি হয়।'
      - text: 'সফটওয়্যারের license ফি'
        correct: false
        why: 'ওপেন সোর্সে এই একটা খরচই সাধারণত শূন্য — আর শুধু এটা দেখেই মানুষ ভাবে পুরোটা ফ্রি।'
      - text: 'মাঝরাতে বিগড়ালে নিজের টিমের সারানোর সময়'
        correct: true
        why: 'SaaS-এ এটা vendor-এর দায়। নিজে চালালে ফোনটা আপনার টিমের কাছেই আসবে।'
    ref: three-roads
  - q: 'রিপোর্ট বানানোর জন্য দুই রাস্তা: SaaS — মাসে ২০ হাজার টাকা; অথবা নিজে বানানো — ৬০ ইঞ্জিনিয়ার-দিন, তারপর মাসে ৩ দিন রক্ষণাবেক্ষণ। এক দিনের খরচ ৫ হাজার টাকা। তিন বছরের হিসাবে কোনটা ঠিক?'
    hint: 'বানানো = শুরুর দিন × ৫ হাজার + মাসের দিন × ৫ হাজার × ৩৬। SaaS = মাসিক বিল × ৩৬।'
    options:
      - text: 'SaaS সস্তা: ৭.২ লাখ বনাম বানানোর ৮.৪ লাখ'
        correct: true
        why: 'SaaS: ২০ হাজার × ৩৬ = ৭.২ লাখ। বানানো: ৬০ × ৫ হাজার = ৩ লাখ, সাথে ৩ × ৫ হাজার × ৩৬ = ৫.৪ লাখ, মোট ৮.৪ লাখ।'
      - text: 'বানানো সস্তা: ৩ লাখ বনাম SaaS-এর ৭.২ লাখ'
        correct: false
        why: '৩ লাখ শুধু শুরুর খরচ। ৩৬ মাসের রক্ষণাবেক্ষণের ৫.৪ লাখ বাদ পড়েছে — TCO-র সবচেয়ে পরিচিত ভুল।'
      - text: 'বানানো সস্তা, কারণ এতে কোনো মাসিক বিল নেই'
        correct: false
        why: 'বিল নেই, কিন্তু ইঞ্জিনিয়ারের সময় আছে — আর সেটাই সবচেয়ে বড় খরচ।'
      - text: 'দুটোই সমান, তাই যেটা বেশি আধুনিক সেটা নেওয়া উচিত'
        correct: false
        why: 'সংখ্যা সমান নয়। আর সমান হলেও সিদ্ধান্ত হতো ঝুঁকি আর টিমের দক্ষতা দেখে, আধুনিকতা দেখে নয়।'
    ref: tco-worked-example
  - q: 'নিচের কোডে দীর্ঘমেয়াদি সমস্যাটা কী?'
    lang: php
    code: |
      final class InvoiceService
      {
          public function send(Invoice $invoice): void
          {
              $pdf = (new \AcmePdf\Client($_ENV['ACME_PDF_KEY']))
                  ->render('invoice', $invoice->toArray());

              (new \AcmeMail\Client($_ENV['ACME_MAIL_KEY']))
                  ->send($invoice->getEmail(), 'Invoice', $pdf);
          }
      }
    hint: 'AcmePdf কাল দাম তিন গুণ করলে কয়টা ফাইল বদলাতে হবে?'
    options:
      - text: 'vendor-এর class সরাসরি business কোডে বসানো — vendor বদলালে এমন প্রতিটা জায়গা নতুন করে লিখতে হবে'
        correct: true
        why: 'কোনো interface মাঝখানে নেই, তাই vendor-এর নাম আর ডাকার ধরন সারা কোডে ছড়িয়ে পড়বে। এটাই lock-in।'
      - text: 'দুইটা vendor একসাথে ব্যবহার করা হয়েছে, একটাই যথেষ্ট ছিল'
        correct: false
        why: 'ভিন্ন কাজে ভিন্ন vendor নেওয়া স্বাভাবিক। সমস্যা সংখ্যায় নয়, কোডের সাথে জড়িয়ে যাওয়ায়।'
      - text: 'PDF আর ইমেইল কেনাটাই ভুল; নিজে বানানো উচিত ছিল'
        correct: false
        why: 'দুটোই সবার একই রকম লাগা কাজ — কেনাই ঠিক সিদ্ধান্ত। ভুলটা কেনায় নয়, বেরোনোর দরজা না রাখায়।'
      - text: 'class-টা final হওয়ায় vendor বদলানো যাবে না'
        correct: false
        why: 'final শুধু inheritance আটকায়। vendor বদলানোর বাধা হলো ভেতরে সরাসরি বসানো vendor-এর class।'
    ref: no-exit-door
  - q: 'একটা অনলাইন বইয়ের দোকানের জন্য নিচের কোনগুলো নিজে বানানো যুক্তিসঙ্গত?'
    hint: 'কোন কাজগুলো এই দোকানকে অন্য দোকান থেকে আলাদা করে?'
    options:
      - text: 'পাঠকের পড়ার ইতিহাস দেখে বই সাজেস্ট করার নিজস্ব নিয়ম'
        correct: true
        why: 'এটাই দোকানের আলাদা শক্তি হতে পারে; তৈরি সমাধান এই ব্যবসার বিশেষ জ্ঞান জানে না।'
      - text: 'পাসওয়ার্ড hash করার নিজস্ব algorithm'
        correct: false
        why: 'নিরাপত্তার জিনিস নিজে বানানো বিপজ্জনক। Symfony-র password hasher বছরের পর বছর পরীক্ষিত।'
      - text: 'কার্ডে টাকা নেওয়ার নিজস্ব payment gateway'
