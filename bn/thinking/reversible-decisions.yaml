      - text: 'শুধু নতুন ব্যবহারকারীদের সমস্যা হবে'
        correct: false
        why: 'পুরনো কোড যে-ই `phone` পড়তে চাইবে সে-ই সমস্যায় পড়বে, নতুন-পুরনো ভেদ নেই।'
