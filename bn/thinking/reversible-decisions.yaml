slides:
  - slug: two-doors
    title: 'ব্যানারের রং নিয়ে তিন দিন, কলাম ফেলা এক মিনিটে'
    kind: story
    tldr: 'টিম সহজে ফেরানো যায় এমন সিদ্ধান্তে সময় খরচ করে, আর যা আর ফেরানো যায় না সেটা এক মিনিটে সেরে ফেলে।'
    keywords: ['reversible decision', 'one-way door', 'two-way door', 'ফেরার দরজা', 'সিদ্ধান্ত']
    blocks:
      - type: text
        body: |
          সুমির টিম এক সপ্তাহে দুইটা কাজ পেল: হোমপেজ ব্যানারের রং ঠিক করা, আর ডেটাবেস থেকে পুরনো `phone` কলামটা ফেলে দেওয়া। ব্যানার নিয়ে তিন দিন তর্ক চলল। কলামটা ফেলা হলো এক মিনিটে, একটা migration দিয়ে, কোনো backup ছাড়াই। পরদিন জানা গেল, পুরনো ক্রেতাদের ফোন নম্বর শুধু ওই কলামেই ছিল।
      - type: visual
        kind: compare
        caption: 'দুই রকম দরজা: ফিরে আসা যায়, আর যায় না'
        columns:
          - title: 'ফেরার দরজা'
            tone: good
            icon: repeat
            tip: 'ভুল হলে দরজা দিয়ে ফিরে এসে আবার চেষ্টা করা যায়। ভুলের দাম ছোট, তাই গতিই এখানে সম্পদ।'
            items:
              - 'ব্যানারের রং বদলানো'
              - 'নতুন feature flag চালু করা'
              - 'একটা কলাম যোগ করা'
              - 'ভুল হলে এক deploy-তেই আগের অবস্থা'
          - title: 'একমুখী দরজা'
            tone: bad
            icon: warning
            tip: 'একবার ঢুকলে আর ফেরা যায় না। ভুলের দাম বড় আর স্থায়ী, তাই এখানে ধীরে ও যাচাই করে এগোতে হয়।'
            items:
              - 'কলাম বা টেবিল ফেলে দেওয়া'
              - 'পাবলিক API-র field মুছে ফেলা'
              - 'ক্রেতাকে টাকা পাঠানো বা ইমেইল করা'
              - 'ভুল হলে ফেরানোর উপায় নেই'
    aside:
      - type: story
        title: 'ফিরতে না পারা ইমেইল'
        body: |
          একটা টিম টেস্ট ডেটাবেসের বদলে প্রোডাকশনের ঠিকানায় "অফার শেষ" ইমেইল ছেড়ে দিয়েছিল। কোড ঠিক করা গেল এক ঘণ্টায়, কিন্তু ইমেইল তো ফেরানো যায় না। ক্ষমা চেয়ে নতুন ইমেইল পাঠানোই একমাত্র পথ ছিল।
      - type: terms
        items:
          - {term: 'Migration', meaning: 'ছোট একটা script, একবার চালানো হয়, ডেটাবেসের কাঠামো বদলায়: যেমন কলাম যোগ বা ফেলা।'}
          - {term: 'Deploy', meaning: 'কোডের নতুন ভার্সন লাইভ সার্ভারে তুলে দেওয়া।'}
          - {term: 'Backup', meaning: 'ডেটার সংরক্ষিত কপি; কিছু মুছে গেলে এখান থেকে ফেরানো যায়।'}
          - {term: 'Public API', meaning: 'যে দরজা দিয়ে অন্য কোম্পানির অ্যাপ আপনার সাথে কথা বলে। তাদের কোড আপনি দেখতে বা ঠিক করতে পারেন না।'}
      - type: refs
        items:
          - {to: 'thinking/what-is-architectural', label: 'কোন সিদ্ধান্তটা আর্কিটেকচারাল?'}
    check:
      q: 'সুমির টিমের সময় ভাগে আসল গোলমালটা কোথায় ছিল?'
      a: 'সহজে ফেরানো যায় এমন ব্যানারে তিন দিন গেছে, আর ফেরানো যায় না এমন কলাম-মোছা এক মিনিটে, কোনো নিরাপত্তা ছাড়া হয়েছে।'

  - slug: one-way-vs-two-way
    title: 'কোন দরজা কোন রকম — আর কত গতিতে এগোবেন'
    kind: concept
    tldr: 'ফেরানো যায় এমন সিদ্ধান্ত দ্রুত নিন, না যায় এমন সিদ্ধান্তে ধীরে ও লিখে নিন; কোনটা কী, তা ঠিক করে ফেরার খরচ।'
    keywords: ['two-way door', 'one-way door', 'irreversible', 'decision speed', 'অপরিবর্তনীয়', 'দ্রুত সিদ্ধান্ত']
    blocks:
      - type: metaphor
        icon: home
        title: 'ভাড়া বাসা আর জমি কেনা'
        body: |
          ভাড়া বাসা পছন্দ না হলে মাস শেষে নোটিস দিয়ে চলে যাওয়া যায়, তাই সেখানে দ্রুত সিদ্ধান্ত নেওয়াই ঠিক। কিন্তু জমি কিনে বাড়ি তুলে ফেললে ফেরার পথ নেই, তাই কেনার আগে দলিল, নকশা আর প্রতিবেশী সব যাচাই করতে হয়। সফটওয়্যারেও কিছু সিদ্ধান্ত ভাড়া বাসা, কিছু জমি কেনা।
      - type: visual
        kind: table
        caption: 'সফটওয়্যারের সিদ্ধান্ত: কোনটা কোন দরজা'
        headers: ['সিদ্ধান্ত', 'দরজা', 'ফেরার উপায়']
        rows:
          - cells: ['নতুন feature flag চালু', 'ফেরার', 'flag বন্ধ করলেই আগের অবস্থা']
            tip: 'কোড আগে থেকেই আছে, শুধু সুইচ উল্টানো হচ্ছে। এর চেয়ে সস্তা পিছু হটা আর হয় না।'
          - cells: ['একটা নতুন nullable কলাম যোগ', 'ফেরার', 'পরে ফেলে দেওয়া যায়']
            tip: 'কলাম nullable (বা default-সহ) হলে পুরনো কোড তা টেরই পায় না, তাই কিছু ভাঙে না। যোগ করা নিরাপদ, মোছা বিপজ্জনক।'
          - cells: ['SMS কোম্পানি বাছাই', 'ফেরার', 'interface থাকলে একটা class বদল']
            tip: 'বাকি কোড শুধু interface চেনে, তাই কোম্পানি বদলানো মানে একটা class নতুন করে লেখা।'
          - cells: ['কলাম বা ডেটা ফেলে দেওয়া', 'একমুখী', 'শুধু backup থেকে']
            tip: 'backup না থাকলে ডেটা চিরতরে গেল। মোছার আগে সবসময় জিজ্ঞেস করুন, কে এটা এখনো পড়ে?'
          - cells: ['পাবলিক API-র field সরানো', 'একমুখী', 'client-দের আবার রাজি করানো']
            tip: 'বাইরের অ্যাপ এই field-এর ওপর কোড লিখেছে। সরালে তাদের অ্যাপ ভাঙে, আর সেটা আপনার হাতে নেই।'
          - cells: ['ক্রেতাকে ইমেইল, SMS বা টাকা পাঠানো', 'একমুখী', 'ফেরানো যায় না, শুধু সংশোধনী']
            tip: 'বার্তা একবার বেরোলে সেটা আর ফেরত আনা যায় না। তাই পাঠানোর আগে ঠিকানা আর পরিবেশ যাচাই করতে হয়।'
      - type: quote
        body: 'ফেরানো যায় এমন সিদ্ধান্ত দ্রুত নিন; ফেরানো যায় না এমন সিদ্ধান্তে ধীরে, লিখে, দুই জোড়া চোখে।'
    aside:
      - type: remember
        body: 'প্রশ্ন একটাই: "ভুল হলে ফিরব কীভাবে, আর কত খরচে?" উত্তর "এক ক্লিকে" হলে এগোন; "পারব না" হলে থামুন।'
      - type: terms
        items:
          - {term: 'Two-way door', meaning: 'যে সিদ্ধান্ত ভুল হলে সহজে ফেরানো যায়।'}
          - {term: 'One-way door', meaning: 'যে সিদ্ধান্ত একবার নিলে ফেরা কঠিন বা অসম্ভব।'}
    check:
      q: 'কলাম যোগ করা আর কলাম ফেলা — কোনটা কোন দরজা, কেন?'
      a: 'যোগ করা ফেরার দরজা, কারণ পুরনো কোড কিছু টের পায় না আর পরে ফেলা যায়। ফেলা একমুখী, কারণ ডেটা backup ছাড়া ফেরে না।'

  - slug: keep-door-open
    title: 'একমুখী দরজাকে দুইমুখী বানান'
    kind: howto
    tldr: 'বড় সিদ্ধান্তকে interface আর feature flag-এর পেছনে রাখুন, যাতে ভুল হলে আগের কোড-পথে ফেরা যায়। flag ডেটা ফেরায় না।'
    keywords: ['interface', 'feature flag', 'abstraction', 'AsAlias', 'Autowire env', 'ইন্টারফেস', 'ফ্ল্যাগ']
    blocks:
      - type: text
        body: |
          কিছু সিদ্ধান্ত একমুখী দেখালেও তাকে দুইমুখী করা যায়। কোনো vendor-এর SDK কোডে ছড়িয়ে দেবেন না। সেটা রাখুন একটা `interface`-এর পেছনে (যে চুক্তি বলে কী চাওয়া যায়, উত্তর কে দেয় তা বলে না), আর নতুন পথ রাখুন **feature flag**-এর পেছনে (কনফিগারেশন থেকে পড়া একটা অন/অফ সুইচ)। তাহলে একটা class বদলালে বা flag উল্টালে পুরনো পথ ফেরে। তবে flag ফেরায় কোড, ডেটা নয়: নতুন পথ যা লিখে ফেলেছে তা লেখাই থাকে।
      - type: visual
        kind: compare
        caption: 'SMS কোম্পানি বদল: interface ছাড়া আর interface-সহ'
        columns:
          - title: 'সব জায়গায় SDK'
            tone: bad
            icon: cross
            tip: 'SMS পাঠানো প্রতিটা ফাইল কোম্পানির class চেনে। নির্ভরতা ছড়ানো, তাই ছেড়ে আসা বিশাল কাজ।'
            items:
              - '৩০টা ফাইল সরাসরি কোম্পানির SDK ডাকে'
              - 'কোম্পানি বদল: ৩০টা ফাইল বদলে আবার test'
              - 'নতুন কোম্পানি পরখ করার সাহসই হয় না'
          - title: 'SmsGateway-এর পেছনে'
            tone: good
            icon: check
            tip: '৩০টা ফাইল শুধু interface চেনে। কোম্পানি লুকিয়ে এক adapter class-এ, তাই নির্ভরতা এক জায়গায়।'
            items:
              - '৩০টা ফাইল SmsGateway interface ডাকে'
              - 'কোম্পানি বদল: ১টা নতুন class লেখা'
              - 'পুরনো class রাখলে ফেরা এক লাইনের কাজ'
      - type: code
        lang: php
        file: 'src/Sms/SmsGateway.php + BulkSmsGateway.php'
        variant: good
        code: |
          interface SmsGateway
          {
              public function send(string $to, string $text): void;
          }

          #[AsAlias(SmsGateway::class)]
          final readonly class BulkSmsGateway implements SmsGateway
          {
              public function __construct(
                  private HttpClientInterface $http,
                  #[Autowire(env: 'SMS_API_KEY')] private string $apiKey,
              ) {
              }

              public function send(string $to, string $text): void
              {
                  $this->http->request('POST', 'https://sms.example.test/v1/send', [
                      'auth_bearer' => $this->apiKey,
                      'json' => ['to' => $to, 'text' => $text],
                  ])->getContent(); // 4xx/5xx হলে exception ছোড়ে
              }
          }
        marks:
          - {line: 1, tip: 'বাকি কোড শুধু এই interface চেনে। কোম্পানি কে, সেটা তার জানার দরকার নেই।'}
          - {line: 6, tip: '#[AsAlias] বলছে, SmsGateway চাইলে এই class-টাই দিন। কোম্পানি বদলালে শুধু এই এক লাইন সরবে।'}
      - type: code
        lang: php
        file: 'src/Checkout/CheckoutService.php'
        variant: good
        code: |
          final readonly class CheckoutService
          {
              public function __construct(
                  private LegacyCheckout $legacy,
                  private NewCheckout $new,
                  #[Autowire(env: 'bool:FEATURE_NEW_CHECKOUT')]
                  private bool $newCheckoutOn,
              ) {
              }

              public function pay(Cart $cart): Receipt
              {
                  return $this->newCheckoutOn
                      ? $this->new->pay($cart)
                      : $this->legacy->pay($cart);
              }
          }
        marks:
          - {line: 6, tip: '`bool:` env processor "true"/"1" লেখাকে সত্যিকারের bool বানায়। flag-টা পরিবেশ থেকে আসছে, কোডে বাঁধা নয়।'}
          - {line: 13, tip: 'দুই পথ পাশাপাশি আছে। নতুন পথে সমস্যা হলে flag বন্ধ করলেই পুরনো পথে ফেরা যায়।'}
    aside:
      - type: tips
        items:
          - 'interface বানান সেই জিনিসের জন্য যা বাইরের (SMS, পেমেন্ট, ফাইল স্টোরেজ)। প্রতিটা class-এর জন্য নয়।'
          - 'flag-এর পাশে মুছে ফেলার তারিখ লিখে রাখুন। পুরনো flag জমতে থাকলে সেটাই নতুন জঞ্জাল।'
          - 'env var পড়া হয় process চালুর সময়, তাই সেটা উল্টাতে restart বা deploy লাগে। তাৎক্ষণিক সুইচ চাইলে flag ডেটাবেসে রাখুন।'
          - 'দুই পথ মানে test দ্বিগুণ, আর খাটুনিও আসল। ঝুঁকিপূর্ণ, ফেরানো কঠিন বদলে এটা লাগান; প্রতিটা ছোট বদলে নয়।'
      - type: refs
        items:
          - {to: 'config/feature-flags', label: 'Feature flag ঠিকভাবে চালানো'}
          - {to: 'thinking/hexagonal', label: 'Hexagonal: বাইরের জিনিস আড়ালে'}
    check:
      q: 'নতুন SMS কোম্পানি ভালো না হলে পুরনোটায় ফিরতে কোডে কী বদলাতে হয়?'
      a: 'শুধু interface-এর যে class-টা alias হয়ে আছে সেটা। বাকি সব কোড SmsGateway চেনে, কোম্পানি চেনে না।'

  - slug: drop-column-trap
    title: 'কলাম ফেলার ফাঁদ: এক ধাপের বদলে চার ধাপ'
    kind: pitfall
    tldr: 'কোড বদল আর কলাম মোছা একই deploy-তে করলে ফেরার পথ কাটা পড়ে; expand, migrate, switch, contract — চার ধাপে মুছুন।'
    keywords: ['expand contract', 'drop column', 'migration', 'backup', 'কলাম মোছা', 'Doctrine Migrations']
    blocks:
      - type: text
        body: |
          সুমির টিমের ভুল ছিল: কোড বদলানো আর কলাম মোছা একই deploy-তে। নতুন কোডে bug ধরা পড়লে পুরনো কোডে ফিরলেও কলাম আর নেই। সমাধান হলো মোছার কাজটা সবার শেষে আলাদা deploy-তে নেওয়া, যখন নিশ্চিত যে কেউ আর কলামটা পড়ছে না।
      - type: code
        lang: php
        file: 'migrations/Version20261124100000.php'
        variant: bad
        code: |
          // এক deploy-তে কোড বদল আর কলাম মোছা একসাথে
          public function up(Schema $schema): void
          {
              $this->addSql('ALTER TABLE customer DROP COLUMN phone');
          }

          // down() কলাম ফেরায়, কিন্তু খালি: ডেটা তো আর ফেরে না
          public function down(Schema $schema): void
          {
              $this->addSql('ALTER TABLE customer ADD phone VARCHAR(20) DEFAULT NULL');
          }
        marks:
          - {line: 4, tip: 'মুহূর্তেই ডেটা চিরতরে গেল। কোডে bug পেলে পুরনো কোডে ফিরলেও এই কলাম আর ফিরবে না।'}
          - {line: 10, tip: 'down() কলামের কাঠামো ফেরায়, ডেটা নয়। কলাম ফিরলেও তা খালি।'}
      - type: visual
        kind: steps
        caption: 'কলাম নিরাপদে সরানোর চার ধাপ, প্রতিটা আলাদা deploy'
        steps:
          - {title: '১. Expand', body: 'নতুন কলাম `mobile_number` যোগ করুন। পুরনো কোড কিছুই টের পায় না।', tip: 'শুধু যোগ করা ফেরার দরজা। এই ধাপে কিছু ভাঙার সুযোগই নেই।'}
          - {title: '২. Migrate', body: 'পুরনো `phone` থেকে ডেটা নতুন কলামে কপি করুন, দুই কলামেই লিখুন।', tip: 'দুই জায়গায় লেখায় যেকোনো কোড ভার্সনই ঠিক ডেটা পায়, তাই যেকোনো সময় পিছু হটা যায়।'}
          - {title: '৩. Switch', body: 'কোড শুধু নতুন কলাম পড়ুক। কিছুদিন দেখুন, সব ঠিক কি না।', tip: 'পুরনো কলাম এখনো অক্ষত, তাই সমস্যা হলে কোড আগের ভার্সনে ফেরালেই চলে।'}
          - {title: '৪. Contract', body: 'নিশ্চিত হয়ে, backup নিয়ে, তারপর পুরনো `phone` কলাম ফেলুন।', tip: 'এই একমাত্র একমুখী ধাপ। এখানে পৌঁছানো পর্যন্ত বাকি তিন ধাপ আপনাকে ফেরার সুযোগ দিয়ে এসেছে।'}
      - type: quote
        body: 'মোছা সবসময় সবার শেষে, আলাদা deploy-তে, backup নিয়ে।'
    aside:
      - type: problem
        body: 'একমুখী কাজকে কয়েকটা ছোট ফেরার ধাপে ভেঙে ফেললে, ঝুঁকি শুধু শেষ ধাপে জমে। বাকি ধাপগুলো সস্তা আর নিরাপদ।'
      - type: refs
        items:
          - {to: 'data/zero-downtime-migrations', label: 'Zero-downtime migration'}
    check:
      q: 'কলাম ফেলার ধাপটা সবার শেষে আর আলাদা deploy-তে কেন রাখা হয়?'
      a: 'কারণ ওটাই একমাত্র একমুখী ধাপ। আগের সব ধাপে পুরনো কলাম অক্ষত থাকে, তাই কোডে সমস্যা হলে নিরাপদে ফেরা যায়।'

  - slug: expand-contract-in-code
    title: 'Expand আর contract, আসল কোডে'
    kind: howto
    tldr: 'ধাপ ১-২ হলো একটা যোগ-করা migration আর entity-তে দুই কলামে লেখা; মোছা যায় নিজের deploy-তে, শূন্য-সারির check-এর পর।'
    keywords: ['expand contract', 'dual write', 'Doctrine Migrations', 'backfill', 'কলাম মোছা', 'zero rows check']
    blocks:
      - type: text
        body: |
          সুমির টিমে ফিরি। প্রথম migration শুধু `mobile_number` যোগ করে আর পুরনো নম্বরগুলো তাতে কপি করে, তাই "পুরনো ক্রেতাদের নম্বর শুধু এক কলামে" থাকার পরিস্থিতি আর থাকে না। এটা ফেরানো যায়, কারণ `down()` শুধু নতুন কলামটা ফেলে, `phone` অক্ষত থাকে।
      - type: code
        lang: php
        file: 'migrations/Version20261124100000.php'
        variant: good
        code: |
          // Deploy 1: expand + migrate। কিছু হারায় না, তাই down() সৎ।
          public function up(Schema $schema): void
          {
              $this->addSql('ALTER TABLE customer ADD mobile_number VARCHAR(20) DEFAULT NULL');
              $this->addSql('UPDATE customer SET mobile_number = phone');
          }

          public function down(Schema $schema): void
          {
              $this->addSql('ALTER TABLE customer DROP COLUMN mobile_number');
          }

          // Deploy 4, কয়েক সপ্তাহ পরে; নিচের check ০ আসলে আর backup থাকলেই:
          //   ALTER TABLE customer DROP COLUMN phone
          //
          // check (production-এ চালান, ফল ০ হতে হবে):
          //   SELECT COUNT(*) FROM customer
          //   WHERE phone IS NOT NULL AND mobile_number IS NULL;
        marks:
          - {line: 5, tip: 'কোটি সারির টেবিলে ব্যাচে ব্যাচে কপি করুন। এক বিশাল UPDATE টেবিল lock করে লাইভ traffic আটকে দিতে পারে।'}
          - {line: 16, tip: 'শূন্য সারি মানে পুরনো প্রতিটা নম্বর নতুন কলামে আছে। এখন এসেই একমুখী ধাপটা নিরাপদ।'}
      - type: text
        body: |
          Deploy ১ আর ৪-এর মাঝে কোডকে দুই কলাম মিলিয়ে রাখতে হয়। পুরনো আর নতুন কোড-ভার্সন পাশাপাশি চললে যেকোনোটা পড়তে পারে, তাই প্রতিটা লেখা যায় দুই কলামেই।
      - type: code
        lang: php
        file: 'src/Entity/Customer.php'
        variant: good
        code: |
          public function changeMobile(string $number): void
          {
              $this->mobileNumber = $number;
              $this->phone = $number;   // ধাপ ২: ধাপ ৪-এ এই লাইন মুছবেন
          }

          public function mobile(): ?string
          {
              // ধাপ ৩: নতুন কলাম পড়ুন, না থাকলে পুরনোটা
              return $this->mobileNumber ?? $this->phone;
          }
        marks:
          - {line: 4, tip: 'পুরনো কলামও ঠিক থাকে, তাই আগের কোডে rollback করলেও সঠিক নম্বর মেলে।'}
          - {line: 10, tip: 'পড়ায় নতুন কলামকে অগ্রাধিকার। শূন্য-সারির check কিছুদিন পাশ করলে এই fallback আর পুরনো কলাম যেতে পারে।'}
    aside:
      - type: when
        use:
          - 'যে কলাম বা টেবিলে আসল ডেটা আছে, তার জন্য'
        avoid:
          - 'dev ডেটাবেসের scratch ডেটা: সোজা ফেলে দিন'
          - 'মিনিটে আবার বানানো যায় এমন ছোট internal টেবিল: চার deploy-র খরচ ঝুঁকির চেয়ে বেশি'
      - type: pitfalls
        items:
          - 'দাম: এক deploy-র বদলে চার, আর কিছুদিন দুই কলাম সমান রাখার ঝামেলা।'
    check:
      q: 'শেষ মোছার আগে কোন query প্রমাণ করে কোনো নম্বর হারাবে না, আর কী ফল দরকার?'
      a: 'phone-এ মান আছে কিন্তু mobile_number NULL, এমন সারি গুনুন। ফল ০ হতে হবে, আর backup থাকতে হবে, তারপর phone মুছুন।'

flashcards:
  - q: 'Two-way door সিদ্ধান্ত কী?'
    a: 'যে সিদ্ধান্ত ভুল হলে সহজে ও কম খরচে ফেরানো যায়, যেমন feature flag চালু করা বা ব্যানারের রং বদলানো।'
    more: |
      এমন সিদ্ধান্তে বেশি আলোচনা সময়ের অপচয়। একজন ঠিক করে এগিয়ে যাক, ভুল হলে ফিরে এসে শোধরানো যাবে। গতিই এখানে আসল সুবিধা।
    ref: one-way-vs-two-way
  - q: 'One-way door সিদ্ধান্ত কী?'
    a: 'যে সিদ্ধান্ত একবার নিলে আর ফেরা যায় না বা ফেরার খরচ বিশাল, যেমন ডেটা মোছা, পাবলিক API-র field সরানো।'
    more: |
      এমন সিদ্ধান্তে থামতে হয়: বিকল্প ভাবুন, ঝুঁকি লিখুন, আরেকজনকে দিয়ে দেখান। ভুলের দাম বড় আর স্থায়ী, তাই কয়েক ঘণ্টার বাড়তি ভাবনা সার্থক।
    ref: one-way-vs-two-way
  - q: 'ফেরার দরজা আর একমুখী দরজা চেনার প্রশ্ন কোনটা?'
    a: '"ভুল হলে ফিরব কীভাবে, আর কত খরচে?" উত্তর "এক ক্লিকে" হলে ফেরার দরজা, "পারব না" হলে একমুখী।'
    more: |
      প্রশ্নটা সিদ্ধান্তের আকারের নয়, ফেরার খরচের। একটা ছোট migration-ও একমুখী হতে পারে (কলাম ফেলা), আবার বড় দেখতে কাজও ফেরার দরজা হতে পারে (flag-এর পেছনের নতুন checkout)।
    ref: one-way-vs-two-way
  - q: 'কোড বদল আর কলাম মোছা একই deploy-তে করলে সমস্যা কী?'
    a: 'নতুন কোডে bug পেলে পুরনো কোডে ফিরলেও কলামটা আর নেই, তাই ফেরার পথ কাটা পড়ে।'
    more: |
      rollback কাজ করে শুধু কোডের জন্য, ডেটার জন্য নয়। তাই মোছার ধাপটা কোড বদলের পরে, আলাদা deploy-তে, backup নিয়ে করতে হয়।
    ref: drop-column-trap
  - q: 'Expand-contract migration-এর চার ধাপ কী?'
    a: 'Expand (নতুন যোগ), migrate (ডেটা কপি), switch (কোড নতুনটা পড়ে), contract (পুরনোটা মোছা)।'
    more: |
      প্রতিটা ধাপ আলাদা deploy। শুধু শেষ ধাপটা একমুখী, বাকি তিনটায় পুরনো কলাম অক্ষত থাকে, তাই যেকোনো সময় আগের অবস্থায় ফেরা যায়।
    ref: drop-column-trap
  - q: 'শেষ DROP COLUMN-এর আগে কোন check প্রমাণ করে ডেটা হারাবে না?'
    a: 'পুরনো কলামে মান আছে কিন্তু নতুনটা NULL, এমন সারি গুনুন। ফল ০ হতে হবে, আর backup থাকতে হবে।'
    more: |
      উদাহরণে: `SELECT COUNT(*) FROM customer WHERE phone IS NOT NULL AND mobile_number IS NULL;`। ফল ০ না হলে কিছু নম্বর শুধু পুরনো কলামে আছে, ঠিক যেভাবে সুমির টিম তাদের নম্বর হারিয়েছিল।
    ref: expand-contract-in-code
  - q: 'Expand-contract-এর দাম কী, আর কখন তা বাড়াবাড়ি?'
    a: 'এক deploy-র বদলে চার, আর কিছুদিন দুই কলামে লেখা। scratch ডেটা বা মিনিটে বানানো যায় এমন ছোট টেবিলে বাড়াবাড়ি।'
    more: |
      এই দামে নিরাপদে ফেরার পথ কেনা হয়। আসল ক্রেতার ডেটা থাকা কলামে এটা সার্থক; dev ডেটাবেসে নয়।
    ref: expand-contract-in-code
  - q: 'Feature flag বন্ধ করলে কী ফেরে না?'
    a: 'নতুন পথ যা আগেই লিখেছে বা পাঠিয়েছে। flag পুরনো কোড-পথ ফেরায়, ডেটা বা ইমেইল নয়।'
    more: |
      flag উল্টানোর আগে নতুন checkout ৪০ জনের টাকা কাটলে সেই ৪০টা কাটা থেকেই যায়। ঝুঁকিপূর্ণ কোডে flag ব্যবহার করুন, কিন্তু নতুন পথ যা করে ফেলেছে তা শোধরানোর পরিকল্পনাও রাখুন।
    ref: keep-door-open
  - q: 'একমুখী দরজাকে দুইমুখী করার দুইটা সাধারণ উপায় কী?'
    a: 'বাইরের জিনিস interface-এর পেছনে রাখা, আর নতুন পথ feature flag-এর পেছনে রাখা।'
    more: |
      interface থাকলে vendor বদলানো একটা class-এর কাজ। flag থাকলে নতুন পথে সমস্যা হলে সুইচ উল্টালেই পুরনো পথ ফেরে। দুটোতেই আগে থেকে সামান্য খাটুনি দিয়ে পরে বড় খরচ বাঁচে।
    ref: keep-door-open
  - q: 'Feature flag কেন বেশিদিন রেখে দেওয়া ঠিক নয়?'
    a: 'পুরনো flag কোডে দুই পথ রেখে দেয়, ফলে জটিলতা বাড়ে। তাই flag-এর সাথে মুছে ফেলার তারিখ রাখতে হয়।'
    more: |
      flag একটা অস্থায়ী মই। কাজ শেষ হলে দুই পথের একটা মুছে flag সরিয়ে ফেলুন। নইলে একসময় কেউ জানে না কোন flag কী করে, আর সেটাই নতুন জঞ্জাল।
    ref: keep-door-open

quiz:
  - q: 'নিচের কোনগুলো একমুখী দরজার সিদ্ধান্ত, যেখানে থেমে ভাবা উচিত?'
