slides:
  - slug: two-doors
    title: 'ব্যানারের রং নিয়ে তিন দিন, কলাম ফেলা এক মিনিটে'
    kind: story
    tldr: 'টিম সহজে ফেরানো যায় এমন সিদ্ধান্তে সময় খরচ করে, আর যা আর ফেরানো যায় না সেটা এক মিনিটে সেরে ফেলে।'
    keywords: ['reversible decision', 'one-way door', 'two-way door', 'ফেরার দরজা', 'সিদ্ধান্ত']
    blocks:
      - type: text
        body: |
          সুমির টিম এক সপ্তাহে দুইটা কাজ পেল: হোমপেজ ব্যানারের রং ঠিক করা, আর ডেটাবেস থেকে পুরনো `phone` কলামটা ফেলে দেওয়া। ব্যানার নিয়ে তিন দিন তর্ক চলল। কলামটা ফেলা হলো এক মিনিটে, একটা migration দিয়ে, কোনো backup ছাড়াই। পরদিন জানা গেল, পুরনো ক্রেতাদের ফোন নম্বর শুধু ওই কলামেই ছিল।
      - type: visual
        kind: compare
        caption: 'দুই রকম দরজা: ফিরে আসা যায়, আর যায় না'
        columns:
          - title: 'ফেরার দরজা'
            tone: good
            icon: repeat
            tip: 'ভুল হলে দরজা দিয়ে ফিরে এসে আবার চেষ্টা করা যায়। ভুলের দাম ছোট, তাই গতিই এখানে সম্পদ।'
            items:
              - 'ব্যানারের রং বদলানো'
              - 'নতুন feature flag চালু করা'
              - 'একটা কলাম যোগ করা'
              - 'ভুল হলে এক deploy-তেই আগের অবস্থা'
          - title: 'একমুখী দরজা'
            tone: bad
            icon: warning
            tip: 'একবার ঢুকলে আর ফেরা যায় না। ভুলের দাম বড় আর স্থায়ী, তাই এখানে ধীরে ও যাচাই করে এগোতে হয়।'
            items:
              - 'কলাম বা টেবিল ফেলে দেওয়া'
              - 'পাবলিক API-র field মুছে ফেলা'
              - 'ক্রেতাকে টাকা পাঠানো বা ইমেইল করা'
              - 'ভুল হলে ফেরানোর উপায় নেই'
    aside:
      - type: story
        title: 'ফিরতে না পারা ইমেইল'
        body: |
          একটা টিম টেস্ট ডেটাবেসের বদলে প্রোডাকশনের ঠিকানায় "অফার শেষ" ইমেইল ছেড়ে দিয়েছিল। কোড ঠিক করা গেল এক ঘণ্টায়, কিন্তু ইমেইল তো ফেরানো যায় না। ক্ষমা চেয়ে নতুন ইমেইল পাঠানোই একমাত্র পথ ছিল।
      - type: refs
        items:
          - {to: 'thinking/what-is-architectural', label: 'কোন সিদ্ধান্তটা আর্কিটেকচারাল?'}
    check:
      q: 'সুমির টিমের সময় ভাগে আসল গোলমালটা কোথায় ছিল?'
      a: 'সহজে ফেরানো যায় এমন ব্যানারে তিন দিন গেছে, আর ফেরানো যায় না এমন কলাম-মোছা এক মিনিটে, কোনো নিরাপত্তা ছাড়া হয়েছে।'

  - slug: one-way-vs-two-way
    title: 'কোন দরজা কোন রকম — আর কত গতিতে এগোবে'
    kind: concept
    tldr: 'ফেরানো যায় এমন সিদ্ধান্ত দ্রুত নাও, না যায় এমন সিদ্ধান্তে ধীরে ও লিখে নাও; কোনটা কী, তা ঠিক করে ফেরার খরচ।'
    keywords: ['two-way door', 'one-way door', 'irreversible', 'decision speed', 'অপরিবর্তনীয়', 'দ্রুত সিদ্ধান্ত']
    blocks:
      - type: metaphor
        icon: home
        title: 'ভাড়া বাসা আর জমি কেনা'
        body: |
          ভাড়া বাসা পছন্দ না হলে মাস শেষে নোটিস দিয়ে চলে যাওয়া যায়, তাই সেখানে দ্রুত সিদ্ধান্ত নেওয়াই ঠিক। কিন্তু জমি কিনে বাড়ি তুলে ফেললে ফেরার পথ নেই, তাই কেনার আগে দলিল, নকশা আর প্রতিবেশী সব যাচাই করতে হয়। সফটওয়্যারেও কিছু সিদ্ধান্ত ভাড়া বাসা, কিছু জমি কেনা।
      - type: visual
        kind: table
        caption: 'সফটওয়্যারের সিদ্ধান্ত: কোনটা কোন দরজা'
        headers: ['সিদ্ধান্ত', 'দরজা', 'ফেরার উপায়']
        rows:
          - cells: ['নতুন feature flag চালু', 'ফেরার', 'flag বন্ধ করলেই আগের অবস্থা']
            tip: 'কোড আগে থেকেই আছে, শুধু সুইচ উল্টানো হচ্ছে। এর চেয়ে সস্তা পিছু হটা আর হয় না।'
          - cells: ['একটা নতুন কলাম যোগ', 'ফেরার', 'পরে ফেলে দেওয়া যায়']
            tip: 'পুরনো কোড নতুন কলাম চেনে না, তাই কিছু ভাঙে না। যোগ করা নিরাপদ, মোছা বিপজ্জনক।'
          - cells: ['SMS কোম্পানি বাছাই', 'ফেরার', 'interface থাকলে একটা class বদল']
            tip: 'বাকি কোড শুধু interface চেনে, তাই কোম্পানি বদলানো মানে একটা class নতুন করে লেখা।'
          - cells: ['কলাম বা ডেটা ফেলে দেওয়া', 'একমুখী', 'শুধু backup থেকে']
            tip: 'backup না থাকলে ডেটা চিরতরে গেল। মোছার আগে সবসময় জিজ্ঞেস করো, কে এটা এখনো পড়ে?'
          - cells: ['পাবলিক API-র field সরানো', 'একমুখী', 'client-দের আবার রাজি করানো']
            tip: 'বাইরের অ্যাপ এই field-এর ওপর কোড লিখেছে। সরালে তাদের অ্যাপ ভাঙে, আর সেটা তোমার হাতে নেই।'
          - cells: ['ক্রেতাকে ইমেইল, SMS বা টাকা পাঠানো', 'একমুখী', 'ফেরানো যায় না, শুধু সংশোধনী']
            tip: 'বার্তা একবার বেরোলে সেটা আর ফেরত আনা যায় না। তাই পাঠানোর আগে ঠিকানা আর পরিবেশ যাচাই করতে হয়।'
      - type: quote
        body: 'ফেরানো যায় এমন সিদ্ধান্ত দ্রুত নাও; ফেরানো যায় না এমন সিদ্ধান্তে ধীরে, লিখে, দুই জোড়া চোখে।'
    aside:
      - type: remember
        body: 'প্রশ্ন একটাই: "ভুল হলে ফিরব কীভাবে, আর কত খরচে?" উত্তর "এক ক্লিকে" হলে এগোও; "পারব না" হলে থামো।'
      - type: terms
        items:
          - {term: 'Two-way door', meaning: 'যে সিদ্ধান্ত ভুল হলে সহজে ফেরানো যায়।'}
          - {term: 'One-way door', meaning: 'যে সিদ্ধান্ত একবার নিলে ফেরা কঠিন বা অসম্ভব।'}
    check:
      q: 'কলাম যোগ করা আর কলাম ফেলা — কোনটা কোন দরজা, কেন?'
      a: 'যোগ করা ফেরার দরজা, কারণ পুরনো কোড কিছু টের পায় না আর পরে ফেলা যায়। ফেলা একমুখী, কারণ ডেটা backup ছাড়া ফেরে না।'

  - slug: keep-door-open
    title: 'একমুখী দরজাকে দুইমুখী বানাও'
    kind: howto
    tldr: 'interface আর feature flag দিয়ে বড় সিদ্ধান্তের ওপর একটা পাতলা স্তর বসাও, যাতে ভুল হলে আগের পথে ফেরা যায়।'
    keywords: ['interface', 'feature flag', 'abstraction', 'AsAlias', 'Autowire env', 'ইন্টারফেস', 'ফ্ল্যাগ']
    blocks:
      - type: text
        body: |
          কিছু সিদ্ধান্ত একমুখী দেখালেও তাকে দুইমুখী করা যায়। কোনো vendor বা library সরাসরি ছড়িয়ে না দিয়ে একটা `interface`-এর পেছনে রাখো, আর নতুন পথ একটা flag-এর পেছনে রাখো। তাহলে ভুল হলে একটা class বদলালেই বা flag উল্টালেই পুরনো অবস্থা ফেরে।
      - type: code
        lang: php
        file: 'src/Sms/SmsGateway.php + BulkSmsGateway.php'
        variant: good
        code: |
          interface SmsGateway
          {
              public function send(string $to, string $text): void;
          }

          #[AsAlias(SmsGateway::class)]
          final readonly class BulkSmsGateway implements SmsGateway
          {
              public function __construct(
                  private HttpClientInterface $http,
                  #[Autowire(env: 'SMS_API_KEY')] private string $apiKey,
              ) {
              }

              public function send(string $to, string $text): void
              {
                  $this->http->request('POST', 'https://sms.example.test/v1/send', [
                      'auth_bearer' => $this->apiKey,
                      'json' => ['to' => $to, 'text' => $text],
                  ])->getContent(); // 4xx/5xx হলে exception ছোড়ে
              }
          }
        marks:
          - {line: 1, tip: 'বাকি কোড শুধু এই interface চেনে। কোম্পানি কে, সেটা তার জানার দরকার নেই।'}
          - {line: 6, tip: '#[AsAlias] বলছে, SmsGateway চাইলে এই class-টাই দাও। কোম্পানি বদলালে শুধু এই এক লাইন সরবে।'}
      - type: code
        lang: php
        file: 'src/Checkout/CheckoutService.php'
        variant: good
        code: |
          final readonly class CheckoutService
          {
              public function __construct(
                  private LegacyCheckout $legacy,
                  private NewCheckout $new,
                  #[Autowire(env: 'bool:FEATURE_NEW_CHECKOUT')]
                  private bool $newCheckoutOn,
              ) {
              }

              public function pay(Cart $cart): Receipt
              {
                  return $this->newCheckoutOn
                      ? $this->new->pay($cart)
                      : $this->legacy->pay($cart);
              }
          }
        marks:
          - {line: 6, tip: '`bool:` env processor "true"/"1" লেখাকে সত্যিকারের bool বানায়। flag-টা পরিবেশ থেকে আসছে, কোডে বাঁধা নয়।'}
          - {line: 13, tip: 'দুই পথ পাশাপাশি আছে। নতুন পথে সমস্যা হলে flag বন্ধ করলেই পুরনো পথে ফেরা যায়।'}
    aside:
      - type: tips
        items:
          - 'interface বানাও সেই জিনিসের জন্য যা বাইরের (SMS, পেমেন্ট, ফাইল স্টোরেজ)। প্রতিটা class-এর জন্য নয়।'
          - 'flag-এর পাশে মুছে ফেলার তারিখ লিখে রাখো। পুরনো flag জমতে থাকলে সেটাই নতুন জঞ্জাল।'
      - type: refs
        items:
          - {to: 'config/feature-flags', label: 'Feature flag ঠিকভাবে চালানো'}
          - {to: 'thinking/hexagonal', label: 'Hexagonal: বাইরের জিনিস আড়ালে'}
    check:
      q: 'নতুন SMS কোম্পানি ভালো না হলে পুরনোটায় ফিরতে কোডে কী বদলাতে হয়?'
      a: 'শুধু interface-এর যে class-টা alias হয়ে আছে সেটা। বাকি সব কোড SmsGateway চেনে, কোম্পানি চেনে না।'

  - slug: drop-column-trap
    title: 'কলাম ফেলার ফাঁদ: এক ধাপের বদলে চার ধাপ'
    kind: pitfall
    tldr: 'কোড বদল আর কলাম মোছা একই deploy-তে করলে ফেরার পথ কাটা পড়ে; expand, migrate, switch, contract — চার ধাপে মোছো।'
    keywords: ['expand contract', 'drop column', 'migration', 'backup', 'কলাম মোছা', 'Doctrine Migrations']
    blocks:
      - type: text
        body: |
          সুমির টিমের ভুল ছিল: কোড বদলানো আর কলাম মোছা একই deploy-তে। নতুন কোডে bug ধরা পড়লে পুরনো কোডে ফিরলেও কলাম আর নেই। সমাধান হলো মোছার কাজটা সবার শেষে আলাদা deploy-তে নেওয়া, যখন নিশ্চিত যে কেউ আর কলামটা পড়ছে না।
      - type: code
        lang: php
        file: 'migrations/Version20261124100000.php'
        variant: bad
        code: |
          // এক deploy-তে কোড বদল আর কলাম মোছা একসাথে
          public function up(Schema $schema): void
          {
              $this->addSql('ALTER TABLE customer DROP COLUMN phone');
          }

          // down() খালি বা মিথ্যা: ডেটা তো আর ফেরে না
          public function down(Schema $schema): void
          {
              $this->addSql('ALTER TABLE customer ADD phone VARCHAR(20) DEFAULT NULL');
          }
        marks:
          - {line: 4, tip: 'মুহূর্তেই ডেটা চিরতরে গেল। কোডে bug পেলে পুরনো কোডে ফিরলেও এই কলাম আর ফিরবে না।'}
          - {line: 10, tip: 'down() কলামের কাঠামো ফেরায়, ডেটা নয়। কলাম ফিরলেও তা খালি।'}
      - type: visual
        kind: steps
        caption: 'কলাম নিরাপদে সরানোর চার ধাপ, প্রতিটা আলাদা deploy'
        steps:
          - {title: '১. Expand', body: 'নতুন কলাম `mobile_number` যোগ করো। পুরনো কোড কিছুই টের পায় না।', tip: 'শুধু যোগ করা ফেরার দরজা। এই ধাপে কিছু ভাঙার সুযোগই নেই।'}
          - {title: '২. Migrate', body: 'পুরনো `phone` থেকে ডেটা নতুন কলামে কপি করো, দুই কলামেই লেখো।', tip: 'দুই জায়গায় লেখায় যেকোনো কোড ভার্সনই ঠিক ডেটা পায়, তাই যেকোনো সময় পিছু হটা যায়।'}
          - {title: '৩. Switch', body: 'কোড শুধু নতুন কলাম পড়ুক। কিছুদিন দেখো, সব ঠিক কি না।', tip: 'পুরনো কলাম এখনো অক্ষত, তাই সমস্যা হলে কোড আগের ভার্সনে ফেরালেই চলে।'}
          - {title: '৪. Contract', body: 'নিশ্চিত হয়ে, backup নিয়ে, তারপর পুরনো `phone` কলাম ফেলো।', tip: 'এই একমাত্র একমুখী ধাপ। এখানে পৌঁছানো পর্যন্ত বাকি তিন ধাপ তোমাকে ফেরার সুযোগ দিয়ে এসেছে।'}
      - type: quote
        body: 'মোছা সবসময় সবার শেষে, আলাদা deploy-তে, backup নিয়ে।'
    aside:
      - type: problem
        body: 'একমুখী কাজকে কয়েকটা ছোট ফেরার ধাপে ভেঙে ফেললে, ঝুঁকি শুধু শেষ ধাপে জমে। বাকি ধাপগুলো সস্তা আর নিরাপদ।'
      - type: refs
        items:
          - {to: 'data/zero-downtime-migrations', label: 'Zero-downtime migration'}
    check:
      q: 'কলাম ফেলার ধাপটা সবার শেষে আর আলাদা deploy-তে কেন রাখা হয়?'
      a: 'কারণ ওটাই একমাত্র একমুখী ধাপ। আগের সব ধাপে পুরনো কলাম অক্ষত থাকে, তাই কোডে সমস্যা হলে নিরাপদে ফেরা যায়।'

flashcards:
  - q: 'Two-way door সিদ্ধান্ত কী?'
    a: 'যে সিদ্ধান্ত ভুল হলে সহজে ও কম খরচে ফেরানো যায়, যেমন feature flag চালু করা বা ব্যানারের রং বদলানো।'
    more: |
      এমন সিদ্ধান্তে বেশি আলোচনা সময়ের অপচয়। একজন ঠিক করে এগিয়ে যাক, ভুল হলে ফিরে এসে শোধরানো যাবে। গতিই এখানে আসল সুবিধা।
    ref: one-way-vs-two-way
  - q: 'One-way door সিদ্ধান্ত কী?'
    a: 'যে সিদ্ধান্ত একবার নিলে আর ফেরা যায় না বা ফেরার খরচ বিশাল, যেমন ডেটা মোছা, পাবলিক API-র field সরানো।'
    more: |
      এমন সিদ্ধান্তে থামতে হয়: বিকল্প ভাবো, ঝুঁকি লেখো, আরেকজনকে দিয়ে দেখাও। ভুলের দাম বড় আর স্থায়ী, তাই কয়েক ঘণ্টার বাড়তি ভাবনা সার্থক।
    ref: one-way-vs-two-way
  - q: 'ফেরার দরজা আর একমুখী দরজা চেনার প্রশ্ন কোনটা?'
    a: '"ভুল হলে ফিরব কীভাবে, আর কত খরচে?" উত্তর "এক ক্লিকে" হলে ফেরার দরজা, "পারব না" হলে একমুখী।'
    more: |
      প্রশ্নটা সিদ্ধান্তের আকারের নয়, ফেরার খরচের। একটা ছোট migration-ও একমুখী হতে পারে (কলাম ফেলা), আবার বড় দেখতে কাজও ফেরার দরজা হতে পারে (flag-এর পেছনের নতুন checkout)।
    ref: one-way-vs-two-way
  - q: 'কোড বদল আর কলাম মোছা একই deploy-তে করলে সমস্যা কী?'
    a: 'নতুন কোডে bug পেলে পুরনো কোডে ফিরলেও কলামটা আর নেই, তাই ফেরার পথ কাটা পড়ে।'
    more: |
      rollback কাজ করে শুধু কোডের জন্য, ডেটার জন্য নয়। তাই মোছার ধাপটা কোড বদলের পরে, আলাদা deploy-তে, backup নিয়ে করতে হয়।
    ref: drop-column-trap
  - q: 'Expand-contract migration-এর চার ধাপ কী?'
    a: 'Expand (নতুন যোগ), migrate (ডেটা কপি), switch (কোড নতুনটা পড়ে), contract (পুরনোটা মোছা)।'
    more: |
      প্রতিটা ধাপ আলাদা deploy। শুধু শেষ ধাপটা একমুখী, বাকি তিনটায় পুরনো কলাম অক্ষত থাকে, তাই যেকোনো সময় আগের অবস্থায় ফেরা যায়।
    ref: drop-column-trap
  - q: 'একমুখী দরজাকে দুইমুখী করার দুইটা সাধারণ উপায় কী?'
    a: 'বাইরের জিনিস interface-এর পেছনে রাখা, আর নতুন পথ feature flag-এর পেছনে রাখা।'
    more: |
      interface থাকলে vendor বদলানো একটা class-এর কাজ। flag থাকলে নতুন পথে সমস্যা হলে সুইচ উল্টালেই পুরনো পথ ফেরে। দুটোতেই আগে থেকে সামান্য খাটুনি দিয়ে পরে বড় খরচ বাঁচে।
    ref: keep-door-open
  - q: 'Feature flag কেন বেশিদিন রেখে দেওয়া ঠিক নয়?'
    a: 'পুরনো flag কোডে দুই পথ রেখে দেয়, ফলে জটিলতা বাড়ে। তাই flag-এর সাথে মুছে ফেলার তারিখ রাখতে হয়।'
    more: |
      flag একটা অস্থায়ী মই। কাজ শেষ হলে দুই পথের একটা মুছে flag সরিয়ে ফেলো। নইলে একসময় কেউ জানে না কোন flag কী করে, আর সেটাই নতুন জঞ্জাল।
    ref: keep-door-open

quiz:
  - q: 'নিচের কোনগুলো একমুখী দরজার সিদ্ধান্ত, যেখানে থেমে ভাবা উচিত?'
    hint: 'ভুল হলে কোনটা ফেরানো যায় না বা ফেরানোর খরচ অনেক?'
    options:
      - text: 'প্রোডাকশন ডেটাবেস থেকে একটা কলাম ফেলে দেওয়া'
        correct: true
        why: 'মোছা ডেটা backup ছাড়া ফেরে না, আর কোড rollback করলেও কলাম ফেরে না।'
      - text: 'পাবলিক API থেকে একটা field সরিয়ে ফেলা'
        correct: true
        why: 'বাইরের client সেই field-এর ওপর কোড লিখেছে। সরালে তাদের অ্যাপ ভাঙে, আর সেটা তোমার হাতে নেই।'
      - text: 'নতুন checkout-কে একটা feature flag-এর পেছনে রাখা'
        correct: false
        why: 'flag বন্ধ করলেই পুরনো পথ ফিরে আসে, এটা ফেরার দরজা।'
      - text: 'একটা নতুন nullable কলাম যোগ করা'
        correct: false
        why: 'পুরনো কোড নতুন কলাম চেনে না, কিছু ভাঙে না; পরে ফেলেও দেওয়া যায়।'
    ref: one-way-vs-two-way
  - q: 'নিচের migration আর কোড একই deploy-তে গেল। কোডে bug ধরা পড়ল, তুমি আগের ভার্সনে rollback করলে। কী হবে?'
    lang: php
    code: |
      public function up(Schema $schema): void
      {
          $this->addSql('ALTER TABLE customer DROP COLUMN phone');
      }
    hint: 'rollback কোডকে ফেরায়। ডেটাবেসের অবস্থা কি সাথে সাথে ফেরে?'
    options:
      - text: 'পুরনো কোড আবার `phone` কলাম চাইবে, কিন্তু কলাম আর নেই, তাই error হবে'
        correct: true
        why: 'কোড rollback হলেও migration আপনাআপনি উল্টে যায় না। আর উল্টালেও কলামের ডেটা ফেরে না।'
      - text: 'সব ঠিকঠাক চলবে, কারণ rollback ডেটাবেসও আগের অবস্থায় ফেরায়'
        correct: false
        why: 'deploy rollback কেবল কোড ফেরায়। ডেটাবেসের পরিবর্তন আলাদাভাবে ফেরাতে হয়।'
      - text: 'শুধু নতুন ব্যবহারকারীদের সমস্যা হবে'
        correct: false
        why: 'পুরনো কোড যে-ই `phone` পড়তে চাইবে সে-ই সমস্যায় পড়বে, নতুন-পুরনো ভেদ নেই।'
    ref: drop-column-trap
  - q: 'রহিমের টিম SMS কোম্পানি বদলাতে চায়, কিন্তু SDK-র class ৩০টা ফাইলে ছড়ানো। ভবিষ্যতের জন্য সবচেয়ে ভালো পদক্ষেপ কী?'
    hint: 'কীভাবে বদলানোর জায়গা ৩০টা থেকে ১টায় আনা যায়?'
    options:
      - text: 'SDK-র ব্যবহার একটা `SmsGateway` interface-এর পেছনে এনে, সব কোড সেটাকে ডাকবে'
        correct: true
        why: 'তখন কোম্পানি বদলানো মানে শুধু একটা adapter class নতুন করে লেখা।'
      - text: 'নতুন কোম্পানির SDK-ও পাশাপাশি ৩০ ফাইলে বসিয়ে দেওয়া'
        correct: false
        why: 'এতে নির্ভরতা দ্বিগুণ হয়, দরজা আরও আটকে যায়।'
      - text: 'কোম্পানি বদলানোর চিন্তা বাদ দেওয়া, যেহেতু ফেরা কঠিন'
        correct: false
        why: 'কঠিন হলে সহজ করার উপায় আছে, আর interface সেই উপায়।'
      - text: 'সব ফাইলে find-replace চালানো'
        correct: false
        why: 'ঝুঁকিপূর্ণ আর বারবার করতে হবে; আসল সমস্যা, অর্থাৎ নির্ভরতা ছড়ানো, থেকেই যায়।'
    ref: keep-door-open
  - q: 'কোন সিদ্ধান্তে কতটা সময় দেবে, তার সবচেয়ে ভালো নিয়ম কোনটা?'
    hint: 'সিদ্ধান্তের আকার নয়, ভুলের পরিণতি ভাবো।'
    options:
      - text: 'ফেরানো যায় এমন সিদ্ধান্ত দ্রুত, ফেরানো যায় না এমনটা ধীরে ও লিখে'
        correct: true
        why: 'ভুলের দাম যেখানে ছোট সেখানে গতি জেতে, আর যেখানে স্থায়ী সেখানে যাচাই জেতে।'
      - text: 'সব সিদ্ধান্তে সমান সময় দেওয়া, যাতে কিছু বাদ না পড়ে'
        correct: false
        why: 'এতে দামি সিদ্ধান্ত যথেষ্ট সময় পায় না, আর সস্তাগুলো টিমকে ধীর করে দেয়।'
      - text: 'যে সিদ্ধান্ত দেখতে বড়, তাতেই বেশি সময়'
        correct: false
        why: 'ছোট দেখতে migration-ও একমুখী হতে পারে; বড় দেখতে কাজও flag-এর পেছনে ফেরার দরজা হতে পারে।'
      - text: 'সব সিদ্ধান্ত দ্রুত নেওয়া, পরে শোধরানো যাবে'
        correct: false
        why: 'শোধরানো যায় না এমন সিদ্ধান্তে এই নিয়ম ডেটা বা বিশ্বাস চিরতরে নষ্ট করে।'
    ref: one-way-vs-two-way
  - q: 'সঠিক expand-contract ক্রম কোনটা?'
    hint: 'নতুন জিনিস আগে আসে, পুরনো মোছা সবার শেষে।'
    options:
      - text: 'নতুন কলাম যোগ, ডেটা কপি, কোড নতুনটা পড়ুক, তারপর পুরনো কলাম মোছা'
        correct: true
        why: 'প্রতিটা ধাপে পুরনো কলাম অক্ষত থাকে, তাই শেষ ধাপের আগে পর্যন্ত নিরাপদে ফেরা যায়।'
      - text: 'পুরনো কলাম মোছা, তারপর নতুন কলাম যোগ করে ডেটা কপি'
        correct: false
        why: 'কপি করার আগেই পুরনো ডেটা মুছে গেলে কপি করার কিছুই থাকে না।'
      - text: 'কোডে নতুন কলাম পড়া শুরু, তারপর কলাম যোগ'
        correct: false
        why: 'যে কলাম এখনো নেই তা পড়তে গেলে সাথে সাথে error।'
      - text: 'সব একটা migration-এ একসাথে'
        correct: false
        why: 'একসাথে করলে মাঝপথে কোনো ফেরার সুযোগ থাকে না, আর সেটাই ফাঁদ।'
    ref: drop-column-trap
