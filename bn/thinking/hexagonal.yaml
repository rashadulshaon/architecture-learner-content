slides:
  - slug: wired-to-everything
    title: 'যে service সবকিছুর সাথে তার দিয়ে বাঁধা'
    kind: story
    tldr: 'ব্যবসার নিয়ম যদি সরাসরি Doctrine, SMS vendor আর পেমেন্ট client-এর সাথে জড়ানো থাকে, তাহলে test ধীর আর vendor বদলানো যন্ত্রণা।'
    keywords: ['coupling', 'testability', 'vendor lock-in', 'tight coupling', 'service class', 'টেস্ট করা কঠিন']
    blocks:
      - type: text
        body: |
          করিমের `OrderService`-এ অর্ডার confirm করার নিয়ম, ডেটাবেসে save, SMS পাঠানো আর পেমেন্ট ডাকা — সব এক ক্লাসে। একটা ছোট নিয়ম (কুপন থাকলে দাম কমবে) test করতে গেলে ডেটাবেস, SMS vendor আর পেমেন্ট সার্ভার সবই লাগে। test চলতে ৪ সেকেন্ড লাগে, আর SMS vendor বদলানোর অনুরোধ এলে ৪০টা ফাইলে হাত দিতে হয়।
      - type: visual
        kind: flow
        caption: 'একটা নিয়ম test করতে চারটা জিনিস লাগে'
        nodes:
          - {id: test, label: 'নিয়মের test', sub: 'কুপন কাজ করে কি না', icon: bug, col: 0, row: 1, tip: 'আমরা শুধু একটা ব্যবসার নিয়ম যাচাই করতে চাই, কিন্তু বাকি সব এসে ঢুকে পড়ছে।'}
          - {id: svc, label: 'OrderService', sub: 'নিয়ম + সব যন্ত্র একসাথে', icon: code, tone: bad, col: 1, row: 1, tip: 'নিয়ম আর যন্ত্রপাতির কোড একই ক্লাসে। একটা বদলালে অন্যটাও ভাঙে।'}
          - {id: db, label: 'Doctrine', sub: 'আসল ডেটাবেস', icon: db, col: 3, row: 0, tip: 'service সরাসরি EntityManager ডাকে। test-এ আসল বা সমতুল্য ডেটাবেস না থাকলে চলে না।'}
          - {id: sms, label: 'Twilio client', sub: 'vendor-এর SDK', icon: phone, col: 3, row: 1, tip: 'vendor-এর নাম business কোডের ভেতরে। vendor বদলানো মানে এই ক্লাস নতুন করে লেখা।'}
          - {id: pay, label: 'Payment client', sub: 'বাইরের সার্ভার', icon: card, col: 3, row: 2, tip: 'test চালালে আসল নেটওয়ার্ক-ডাক হয়ে যায়: ধীর, আর কখনো টাকাও কাটে।'}
        edges:
          - {from: test, to: svc, label: 'test শুধু একটা নিয়ম চালাতে চায়'}
          - {from: svc, to: db, label: 'নিয়ম চালাতে গিয়ে ডেটাবেসে ঢোকে', tone: warn}
          - {from: svc, to: sms, label: 'তারপর SMS vendor-এর SDK ডাকে', tone: warn}
          - {from: svc, to: pay, label: 'তারপর পেমেন্ট সার্ভারেও নেটওয়ার্ক-ডাক যায়', tone: bad}
    aside:
      - type: story
        title: '৪০ ফাইলের SMS বদল'
        body: |
          দাম কমাতে SMS vendor বদলের সিদ্ধান্ত হলো। কাজটা এক বিকেলের হওয়ার কথা, কিন্তু vendor-এর SDK ৪০টা service-এ ছড়ানো ছিল। দুই সপ্তাহ লাগল, আর বদলের মাঝে দুটো পুরনো নিয়মও ভেঙে গেল।
      - type: problem
        body: 'ব্যবসার নিয়ম আর যন্ত্রপাতির কোড একসাথে জড়ালে test ধীর হয়, vendor বদলানো কঠিন হয়, আর নিয়ম বোঝা কঠিন হয়।'
      - type: terms
        items:
          - {term: 'Vendor', meaning: 'বাইরের যে কোম্পানির সেবা আপনি টাকা দিয়ে নেন, যেমন SMS বা পেমেন্ট প্রদানকারী।'}
          - {term: 'SDK', meaning: 'vendor-এর দেওয়া তৈরি কোডের সেট, যা দিয়ে নিজের প্রোগ্রাম থেকে তার সেবা ডাকা যায়।'}
    check:
      q: 'কুপনের নিয়ম test করতে ডেটাবেস, SMS আর পেমেন্ট সার্ভার লাগছে কেন?'
      a: 'কারণ নিয়মের কোড সরাসরি এই তিনটার সাথে জড়ানো। নিয়ম আলাদা থাকলে শুধু সেটুকু চালিয়েই test করা যেত।'

  - slug: ports-adapters
    title: 'Port আর adapter: ফোনের চার্জিং পোর্ট'
    kind: concept
    tldr: 'নিয়ম থাকে মাঝখানে, সে interface (port) দিয়ে বাইরের কাছে চায়; ডেটাবেস, SMS, HTTP হলো সেই interface-এর adapter, আর নির্ভরতা চলে বাইরে থেকে ভেতরে।'
    keywords: ['hexagonal architecture', 'ports and adapters', 'dependency inversion', 'clean architecture', 'port', 'adapter']
    blocks:
      - type: metaphor
        icon: plug
        title: 'ফোনের চার্জিং পোর্ট'
        body: |
          ফোনের ভেতরের কাজ আর বিদ্যুৎ কোথা থেকে আসছে — এই দুটো আলাদা। ফোন শুধু ঠিক করে তার পোর্ট কেমন (USB-C)। চার্জার, পাওয়ার ব্যাংক বা ল্যাপটপ সবাই সেই আকারে নিজেকে বানায়। ফোন জানেই না দেয়ালের বিদ্যুৎ কোন কোম্পানির। পোর্টের আকার ঠিক করে ভেতর, বাইরের যন্ত্র মানিয়ে নেয়।
      - type: visual
        kind: flow
        animate: false
        caption: 'নিয়ম মাঝখানে, বাইরের যন্ত্র port-এর গায়ে লাগানো adapter'
        nodes:
          - {id: ctrl, label: 'Controller', sub: 'HTTP adapter', icon: browser, col: 0, row: 1, tip: 'বাইরের জগৎ থেকে নিয়মকে ডাকে। এটাকে বলে driving adapter।'}
          - {id: core, label: 'Domain + use case', sub: 'ব্যবসার নিয়ম', icon: home, tone: accent, col: 1, row: 1, tip: 'মাঝখানের সবচেয়ে গুরুত্বপূর্ণ অংশ। Doctrine, Symfony বা vendor-এর নাম এখানে নেই।'}
          - {id: repo, label: 'OrderRepository', sub: 'port (interface)', icon: plug, tone: warn, col: 2, row: 0, tip: 'নিয়ম ঠিক করে দেয় সে কী চায়, ব্যবসার ভাষায়। কে দেবে তা সে জানে না।'}
          - {id: notif, label: 'CustomerNotifier', sub: 'port (interface)', icon: plug, tone: warn, col: 2, row: 2, tip: 'কাউকে জানানোর চুক্তি। SMS, ইমেইল বা push — নিয়মের কাছে সব এক।'}
          - {id: doctrine, label: 'DoctrineOrderRepo', sub: 'DB adapter', icon: db, col: 3, row: 0, tip: 'port-এর চুক্তি Doctrine দিয়ে পূরণ করে। এই ক্লাস port চেনে, কিন্তু নিয়ম এই ক্লাসকে চেনে না।'}
          - {id: sms, label: 'SmsNotifier', sub: 'vendor adapter', icon: phone, col: 3, row: 2, tip: 'port-এর চুক্তি Symfony Notifier দিয়ে পূরণ করে। vendor বদলালে শুধু এই ক্লাস বদলায়।'}
        edges:
          - {from: ctrl, to: core, label: 'ডাকে'}
          - {from: core, to: repo, label: 'interface-এ চায়'}
          - {from: doctrine, to: repo, label: 'implements', tone: good}
          - {from: core, to: notif, label: 'interface-এ চায়'}
          - {from: sms, to: notif, label: 'implements', tone: good}
      - type: quote
        body: 'নির্ভরতার তীর চলে বাইরে থেকে ভেতরে। নিয়ম কখনো যন্ত্রকে চেনে না।'
    aside:
      - type: terms
        items:
          - {term: 'Port', meaning: 'ভেতরের নিয়মের লেখা interface: "আমার এই কাজটা কেউ করে দিক", ব্যবসার ভাষায়।'}
          - {term: 'Adapter', meaning: 'port-এর interface পূরণ করা ক্লাস, যা Doctrine, SMS বা HTTP-র সাথে কথা বলে।'}
          - {term: 'Dependency inversion', meaning: 'ভেতরের নিয়ম বাইরের ক্লাসের ওপর নির্ভর না করে, বাইরের ক্লাস ভেতরের interface-এর ওপর নির্ভর করে।'}
          - {term: 'Use case', meaning: 'ব্যবহারকারীর একটা চাওয়া, যেমন অর্ডার confirm করা, সম্পন্ন করার ক্লাস; সে নিয়ম আর port-কে ক্রমানুসারে ডাকে।'}
      - type: remember
        body: 'নিয়ম interface বানায়, যন্ত্র সেটা পূরণ করে — উল্টোটা নয়।'
    check:
      q: 'Dependency inversion-এ কে কার ওপর নির্ভর করে, আর সেটা সাধারণ ধারণার উল্টো কেন?'
      a: 'Adapter নির্ভর করে port-এর ওপর, নিয়ম নয়। সাধারণ ভাবনায় নিয়ম ডেটাবেসের ওপর নির্ভর করে; এখানে নির্ভরতা ঘুরিয়ে দেওয়া হয়েছে।'

  - slug: hexagonal-in-symfony
    title: 'Symfony-তে port, use case আর adapter'
    kind: howto
    tldr: 'interface লিখুন ভেতরে, use case-এ ওই interface ইনজেক্ট করুন, আর Doctrine বা Notifier-এর adapter লিখুন বাইরে — `#[AsAlias]` autowiring মেলায়।'
    keywords: ['AsAlias', 'repository interface', 'use case', 'Symfony autowiring', 'adapter', 'readonly class']
    blocks:
      - type: text
        body: |
          প্রথমে নিয়মের পক্ষের কোড: দুটো port আর একটা use case। এখানে Doctrine বা Symfony-র কিছুই `use` করা নেই।
      - type: code
        lang: php
        file: 'src/Domain + src/Application'
        variant: good
        code: |
          // src/Domain/Order/OrderRepository.php — port, ব্যবসার ভাষায়
          interface OrderRepository
          {
              public function get(OrderId $id): Order;

              public function save(Order $order): void;
          }

          // src/Application/Order/CustomerNotifier.php — আরেকটা port
          interface CustomerNotifier
          {
              public function orderConfirmed(Order $order): void;
          }

          // src/Application/Order/ConfirmOrderHandler.php — use case
          final readonly class ConfirmOrderHandler
          {
              public function __construct(
                  private OrderRepository $orders,
                  private CustomerNotifier $notifier,
              ) {
              }

              public function __invoke(ConfirmOrder $command): void
              {
                  $order = $this->orders->get($command->orderId);
                  $order->confirm();
                  $this->orders->save($order);
                  $this->notifier->orderConfirmed($order);
              }
          }
        marks:
          - {line: 2, tip: 'ভেতরের ভাষায় লেখা: get আর save। এখানে QueryBuilder বা EntityManager-এর কোনো নাম নেই।'}
          - {line: 19, tip: 'use case শুধু interface চেনে। কে সংরক্ষণ করছে বা কে SMS পাঠাচ্ছে — এই ক্লাস জানেই না।'}
          - {line: 27, tip: 'নিয়ম confirm() ভেতরের Order-এ। use case শুধু ক্রম ঠিক করে: আনুন, বদলান, save করুন, জানান।'}
      - type: text
        body: |
          এবার বাইরের পক্ষ। দুটো adapter port-এর চুক্তি পূরণ করে, আর `#[AsAlias]` Symfony-কে বলে দেয় কোন interface-এর জন্য কোন ক্লাস।
      - type: code
        lang: php
        file: 'src/Infrastructure'
        variant: good
        code: |
          // src/Infrastructure/Persistence/DoctrineOrderRepository.php
          #[AsAlias(OrderRepository::class)]
          final readonly class DoctrineOrderRepository implements OrderRepository
          {
              public function __construct(private EntityManagerInterface $em)
              {
              }

              public function get(OrderId $id): Order
              {
                  return $this->em->find(Order::class, $id->value)
                      ?? throw new OrderNotFound($id);
              }

              public function save(Order $order): void
              {
                  $this->em->persist($order);
                  $this->em->flush();
              }
          }

          // src/Infrastructure/Notification/SmsCustomerNotifier.php
          #[AsAlias(CustomerNotifier::class)]
          final readonly class SmsCustomerNotifier implements CustomerNotifier
          {
              public function __construct(private TexterInterface $texter)
              {
              }

              public function orderConfirmed(Order $order): void
              {
                  $text = 'আপনার অর্ডার নিশ্চিত হয়েছে';
                  $this->texter->send(new SmsMessage($order->phone(), $text));
              }
          }
        marks:
          - {line: 2, tip: 'এই এক লাইনেই autowiring শিখে যায়: OrderRepository চাইলে এই ক্লাস দিতে হবে। YAML লাগে না।'}
          - {line: 12, tip: 'ডেটা না পেলে ব্যবসার ভাষার exception (OrderNotFound), Doctrine-এর null বা error নয়।'}
          - {line: 33, tip: 'SMS পাঠানো Symfony Notifier-এর TexterInterface দিয়ে। vendor বদলাতে DSN বদলালেই চলে।'}
    aside:
      - type: tips
        items:
          - 'Doctrine-এর mapping attribute Domain entity-তে থাকলে ব্যবহারিক আপস। পুরোপুরি পরিষ্কার চাইলে XML mapping ব্যবহার করে entity-কে attribute-মুক্ত রাখা যায়।'
          - 'Controller বা Messenger handler হলো driving adapter: তারা শুধু request/message থেকে command বানিয়ে use case ডাকে।'
          - 'দাম: বাইরের প্রতিটা জিনিসের জন্য একটা interface আর একটা adapter লাগে। এখানে একটা use case-এর জন্য বাড়তি ৪টা ক্লাস। জটিল নিয়ম বা বদলানো vendor থাকলে পোষায়, সোজা CRUD-এ নয়।'
      - type: refs
        items:
          - {to: 'thinking/layering-legacy', label: 'layer ভাগের আগের ধরন'}
    check:
      q: 'ConfirmOrderHandler-এ OrderRepository কে ইনজেক্ট করছে, আর কীভাবে?'
      a: 'Symfony-র autowiring। interface-এর জন্য Doctrine adapter-এ `#[AsAlias(OrderRepository::class)]` লেখা আছে, তাই container সেটাই দেয়।'

  - slug: test-and-swap
    title: 'বিনা ডেটাবেসে test, এক ক্লাসে vendor বদল'
    kind: howto
    tldr: 'port-এর in-memory নকল বানালে নিয়মের test মিলিসেকেন্ডে চলে, আর নতুন vendor মানে শুধু নতুন একটা adapter ক্লাস।'
    keywords: ['unit test', 'in-memory fake', 'test double', 'swap vendor', 'PHPUnit', 'adapter বদল']
    blocks:
      - type: text
        body: |
          port আছে বলে test-এর জন্য আসল ডেটাবেস লাগে না: একটা সাধারণ array-ভরা নকল ক্লাসই যথেষ্ট। ফোনের উদাহরণে: পরীক্ষার সময় দেয়ালের সকেটের বদলে ছোট ব্যাটারি ধরিয়ে দিলেই ফোন চলে।
      - type: code
        lang: php
        file: 'tests/Support/Fakes.php'
        code: |
          final class InMemoryOrderRepository implements OrderRepository
          {
              /** @var array<string, Order> */
              private array $orders = [];

              public function get(OrderId $id): Order
              {
                  return $this->orders[$id->value] ?? throw new OrderNotFound($id);
              }

              public function save(Order $order): void
              {
                  $this->orders[$order->id()->value] = $order;
              }
          }

          final class SpyNotifier implements CustomerNotifier
          {
              /** @var list<string> */
              public array $sent = [];

              public function orderConfirmed(Order $order): void
              {
                  $this->sent[] = $order->id()->value;
              }
          }
        marks:
          - {line: 4, tip: 'ডেটাবেসের জায়গায় সাধারণ একটা array। save করলে array-তে ঢোকে, get করলে বেরোয়।'}
          - {line: 24, tip: 'spy শুধু মনে রাখে কাকে জানানো হলো, যাতে test পরে তা যাচাই করতে পারে। আসলে SMS যায় না।'}
      - type: code
        lang: php
        file: 'tests/Application/ConfirmOrderHandlerTest.php'
        code: |
          public function testConfirmingOrderSavesAndNotifies(): void
          {
              $orders = new InMemoryOrderRepository();
              $notifier = new SpyNotifier();
              $id = new OrderId('o-1');
              $orders->save(Order::place($id, '01711000000'));

              $handler = new ConfirmOrderHandler($orders, $notifier);
              $handler(new ConfirmOrder($id));

              self::assertTrue($orders->get($id)->isConfirmed());
              self::assertSame(['o-1'], $notifier->sent);
          }
        marks:
          - {line: 8, tip: 'কোনো ডেটাবেস, container বা network নেই। শুধু নিয়ম চালানো হচ্ছে, তাই test মিলিসেকেন্ডে শেষ হয়।'}
      - type: visual
        kind: compare
        caption: 'SMS vendor বদল: কী বদলায়, কী বদলায় না'
