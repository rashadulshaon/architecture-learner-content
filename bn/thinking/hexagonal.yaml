      - type: tips
        items:
          - 'adapter-এর নিজের একটা integration test থাকা চাই (যেমন Doctrine adapter আসল ডেটাবেসে), যাতে port-এর চুক্তি সত্যিই পূরণ হচ্ছে তা জানা যায়।'
      - type: terms
        items:
          - {term: 'Fake', meaning: 'ছোট কাজের মতো কোডওয়ালা বদলি, যেমন ডেটাবেসের জায়গায় array।'}
          - {term: 'Spy', meaning: 'যে বদলি মনে রাখে তাকে কী করতে বলা হলো, যাতে test পরে তা যাচাই করতে পারে।'}
          - {term: 'DSN', meaning: 'এক লাইনের ঠিকানা-স্ট্রিং, যেমন twilio://ID:TOKEN@default, যা Symfony-কে বলে কোন বাইরের সেবা ব্যবহার করবে।'}
    check:
      q: 'নিয়মের test-এ আসল ডেটাবেসের বদলে InMemoryOrderRepository চললে লাভ কী, আর কী হারায়?'
      a: 'test মিলিসেকেন্ডে চলে, ডেটাবেস লাগে না। হারায় শুধু আসল Doctrine-এর আচরণ যাচাই; সেটা adapter-এর আলাদা integration test-এ দেখা হয়।'

  - slug: leaky-port
    title: 'যে port যন্ত্রের নাম ফাঁস করে'
    kind: pitfall
    tldr: 'port-এ QueryBuilder বা vendor-এর টাইপ দেখা দিলে ভেতর আবার যন্ত্রের সাথে জড়িয়ে যায়; port-এর নাম ও টাইপ হোক ব্যবসার ভাষায়।'
    keywords: ['leaky abstraction', 'over-engineering', 'port design', 'QueryBuilder', 'ফাঁস হওয়া interface']
    blocks:
      - type: text
        body: |
          interface বানালেই hexagonal হয় না। interface-এর ভেতরে যদি ডেটাবেসের ভাষা ঢুকে যায়, তাহলে সে শুধু নামেই port। ফোনের পোর্টে যদি লেখা থাকে "শুধু এই কোম্পানির চার্জার", সেটা আর পোর্ট নয়।
      - type: code
        lang: php
        file: 'src/Domain/Order/OrderRepository.php'
        variant: bad
        code: |
          interface OrderRepository
          {
              // Doctrine-এর টাইপ ফাঁস: ডাকলেই ডেটাবেসের ভাষা শিখতে হয়
              public function queryBuilder(): QueryBuilder;

              // Twilio-র ধারণা ফাঁস: নিয়ম vendor-এর স্ট্যাটাস চেনে
              public function findByTwilioStatus(string $status): array;
          }
        marks:
          - {line: 4, tip: 'QueryBuilder ফেরত দিলে use case নিজেই query বানায়। নিয়মের ভেতরে আবার Doctrine ঢুকে পড়ল।'}
          - {line: 7, tip: 'SMS vendor বদলালে এই method-ই অচল। port-এ vendor-এর নাম থাকলে সে আর স্বাধীন থাকে না।'}
      - type: code
        lang: php
        file: 'src/Domain/Order/OrderRepository.php'
        variant: good
        code: |
          interface OrderRepository
          {
              /** @return list<Order> */
              public function awaitingPaymentSince(DateTimeImmutable $time): array;

              /** @return list<Order> */
              public function pendingConfirmationFor(CustomerId $id): array;
          }
        marks:
          - {line: 4, tip: 'নামটা ব্যবসার ভাষা: "পেমেন্টের অপেক্ষায়"। query কীভাবে হবে, তা adapter-এর ভেতরের ব্যাপার।'}
      - type: quote
        body: 'Port-এর নাম আর টাইপ ব্যবসার ভাষায় লিখুন, যন্ত্রের ভাষায় নয়।'
    aside:
      - type: pitfalls
        items:
          - 'প্রতিটা ক্লাসের জন্য interface বানানো। যেখানে বদলের সম্ভাবনা নেই আর test সহজ, সেখানে সরাসরি ক্লাসই যথেষ্ট।'
          - 'ছোট CRUD অ্যাপে পুরো hexagonal বসানো। জটিল নিয়ম বা বদলানো-হওয়া vendor থাকলেই এর দাম পোষায়।'
      - type: when
        use: ['জটিল ব্যবসার নিয়ম আছে আর তা বারবার বদলায়', 'vendor বদলের বা একাধিক vendor-এর সম্ভাবনা আছে']
        avoid: ['সোজা CRUD, যেখানে কোনো নিয়মই নেই']
    check:
      q: 'port-এ `QueryBuilder` ফেরত দিলে hexagonal-এর কোন উদ্দেশ্য ব্যর্থ হয়?'
      a: 'নিয়মকে যন্ত্র থেকে আলাদা রাখার উদ্দেশ্য। use case Doctrine-এর টাইপ নিয়ে কাজ করলে আবার সে Doctrine-এর সাথে জড়িয়ে যায়।'

flashcards:
  - q: 'Hexagonal architecture (ports and adapters) কী?'
    a: 'ব্যবসার নিয়ম মাঝখানে, বাইরের যন্ত্র (ডেটাবেস, HTTP, SMS) interface (port) দিয়ে সংযুক্ত adapter-এর মাধ্যমে।'
    more: |
      ফোনের USB-C পোর্টের মতো: ফোন তার পোর্ট ঠিক করে, বাইরের চার্জার সেই আকারে বানানো হয়। নিয়ম জানে না ডেটাবেস কোনটা বা SMS কে পাঠাচ্ছে। নির্ভরতা চলে বাইরে থেকে ভেতরে।
    ref: ports-adapters
  - q: 'Port কী আর adapter কী?'
    a: 'Port হলো ভেতরের নিয়মের লেখা interface। Adapter হলো সেই interface পূরণ করা ক্লাস, যা বাইরের যন্ত্রের সাথে কথা বলে।'
    more: |
      উদাহরণ: `OrderRepository` একটা port। `DoctrineOrderRepository` তার adapter। `CustomerNotifier` আরেকটা port, `SmsCustomerNotifier` তার adapter। একই port-এর একাধিক adapter থাকতে পারে (আসল আর in-memory)।
    ref: ports-adapters
  - q: 'Dependency inversion কী?'
    a: 'ভেতরের নিয়ম বাইরের ক্লাসের ওপর নির্ভর না করে interface বানায়, আর বাইরের ক্লাস সেই interface-এর ওপর নির্ভর করে।'
    more: |
      সাধারণ ভাবনায় নিয়ম ডেটাবেসের ক্লাস ডাকে, অর্থাৎ নির্ভর করে তার ওপর। এখানে নিয়ম interface লেখে, আর Doctrine adapter সেটা পূরণ করে। তীর তাই বাইরে থেকে ভেতরে ঘুরে যায়। বিস্তারিত: [[ports-adapters|port ও adapter]]।
    ref: ports-adapters
  - q: 'Symfony-তে interface-কে তার implementation-এর সাথে কীভাবে জোড়া হয়?'
    a: 'Implementation ক্লাসের ওপর `#[AsAlias(Interface::class)]` লিখে; autowiring তখন ওই interface চাইলেই সেটা দেয়।'
    more: |
      একটাই implementation থাকলে Symfony নিজেও interface autowire করতে পারে, তবে `#[AsAlias]` ইচ্ছাটা স্পষ্ট করে। একাধিক implementation থাকলে `#[Target]` বা আলাদা alias দিয়ে বেছে নিতে হয়।
    ref: hexagonal-in-symfony
  - q: 'Hexagonal architecture-এর দাম কী, আর কখন তা পোষায় না?'
    a: 'বাইরের প্রতিটা জিনিসের জন্য একটা interface আর একটা adapter লাগে, ক্লাস বাড়ে। জটিল নিয়ম বা বদলানো vendor থাকলে পোষায়, সোজা CRUD-এ নয়।'
    more: |
      অর্ডার confirm-এর উদাহরণে একটা জড়ানো service হলো দুটো port, দুটো adapter আর একটা use case। নিয়ম জটিল হলে বা vendor বদলের সম্ভাবনা থাকলে এটা ন্যায্য দাম; ছোট CRUD অ্যাপে এটা বৃথা পরিশ্রম।
    ref: hexagonal-in-symfony
  - q: 'Hexagonal-এ business নিয়মের test সহজ হয় কেন?'
    a: 'কারণ port-এর in-memory নকল দিয়ে ডেটাবেস বা network ছাড়াই নিয়ম চালানো যায়, তাই test মিলিসেকেন্ডে শেষ হয়।'
    more: |
      `InMemoryOrderRepository` একটা array-তে অর্ডার রাখে, `SpyNotifier` শুধু মনে রাখে কাকে জানানো হলো। use case-কে এই দুটো ধরালেই পুরো নিয়ম চলে। আসল adapter-এর test আলাদা integration test-এ।
    ref: test-and-swap
  - q: 'vendor বদলাতে hexagonal-এ কী কী বদলাতে হয়?'
    a: 'শুধু নতুন adapter ক্লাস (বা DSN)। নিয়ম, use case আর নিয়মের test বদলায় না।'
    more: |
      SMS vendor বদলের সময় Notifier-এর নতুন bridge বসে আর `.env`-এর DSN বদলায়। `Order`, `ConfirmOrderHandler` আর নিয়মের test যেমন ছিল তেমন থাকে।
    ref: test-and-swap
  - q: 'Port-এর বদনাম কখন হয় "leaky"?'
    a: 'যখন port-এর method বা টাইপে যন্ত্রের নাম ঢোকে, যেমন QueryBuilder বা vendor-এর স্ট্যাটাস।'
    more: |
      এতে ভেতরের নিয়ম আবার যন্ত্রের সাথে জড়িয়ে যায়। ভালো port-এর নাম ব্যবসার ভাষায়: `awaitingPaymentSince()`, `QueryBuilder` নয়। query কীভাবে হবে সেটা adapter-এর গোপন ব্যাপার।
    ref: leaky-port

quiz:
  - q: 'নিচের use case-এ hexagonal-এর দৃষ্টিতে সমস্যা কী?'
    lang: php
    code: |
      final class ConfirmOrderHandler
      {
          public function __construct(
              private EntityManagerInterface $em,
              private \Twilio\Rest\Client $twilio,
          ) {
          }

          public function __invoke(ConfirmOrder $command): void
          {
              $order = $this->em->find(Order::class, $command->orderId);
              $order->confirm();
              $this->em->flush();
              $this->twilio->messages->create($order->phone(), ['body' => 'Confirmed']);
          }
      }
    hint: 'use case কার ওপর নির্ভর করছে — interface, না আসল যন্ত্রের ক্লাস?'
    options:
      - text: 'নিয়ম সরাসরি Doctrine আর Twilio-র ওপর নির্ভরশীল; port নেই, তাই test ধীর আর vendor বদলানো কঠিন'
        correct: true
        why: 'use case-এর কনস্ট্রাক্টরে আসল যন্ত্র ঢুকেছে। interface (port) থাকলে এগুলো adapter-এ থাকত।'
      - text: 'class-টা `final` হওয়ায় বাড়ানো যাবে না'
        correct: false
        why: 'final এখানে সমস্যা নয়। সমস্যা নির্ভরতার দিকে।'
      - text: '`__invoke` ব্যবহার করা ঠিক হয়নি, handle() নাম হওয়া উচিত'
        correct: false
        why: 'method-এর নাম নান্দনিক ব্যাপার; আর্কিটেকচারের সমস্যা অন্য জায়গায়।'
      - text: 'confirm() Order-এর ভেতরে না থেকে বাইরে থাকা উচিত'
        correct: false
        why: 'নিয়ম Order-এর ভেতরে থাকাই ভালো; উল্টোটা করলে আরও জড়িয়ে যাবে।'
    ref: wired-to-everything
  - q: 'নিচের কোন ক্লাসগুলো "adapter" হিসেবে বাইরের দিকে (Infrastructure-এ) থাকা উচিত?'
    hint: 'কে বাইরের যন্ত্রের সাথে কথা বলে?'
    options:
      - text: 'DoctrineOrderRepository'
        correct: true
        why: 'Doctrine-এর সাথে কথা বলে port-এর চুক্তি পূরণ করে, তাই এটা adapter।'
      - text: 'SmsCustomerNotifier'
        correct: true
        why: 'Symfony Notifier ব্যবহার করে SMS পাঠায়; vendor-এর ব্যাপার এখানেই আটকে থাকে।'
      - text: 'Order এর confirm() নিয়ম'
        correct: false
        why: 'এটা ব্যবসার নিয়ম, ভেতরের অংশ। যন্ত্রের সাথে কোনো সম্পর্ক নেই।'
      - text: 'CustomerNotifier interface'
        correct: false
        why: 'এটা port, adapter নয়। ভেতর থেকে লেখা হয়, বাইরের পক্ষ এটাকে পূরণ করে।'
    ref: ports-adapters
  - q: 'দাম কমাতে SMS vendor বদলাতে হবে। hexagonal ডিজাইনে সবচেয়ে সঠিক কাজ কী?'
    hint: 'কোন ক্লাস vendor-এর নাম জানে?'
    options:
      - text: 'নতুন vendor-এর adapter লেখা (বা Notifier DSN বদলানো); use case ও নিয়ম অপরিবর্তিত'
        correct: true
        why: 'vendor-এর জ্ঞান একটা adapter-এ আটকে আছে বলেই বদলটা ছোট।'
      - text: 'সব use case খুঁজে vendor-এর SDK বদলানো'
        correct: false
        why: 'এটা hexagonal-এর অভাবে ঘটে, তার ফলে নয়। এখানে SDK শুধু adapter-এ আছে।'
      - text: 'port interface-এর নাম বদলে নতুন vendor-এর নামে রাখা'
        correct: false
        why: 'port ব্যবসার ভাষায় থাকে, vendor-এর নামে নয়; নাম বদলালে সবখানে বদলাতে হবে।'
