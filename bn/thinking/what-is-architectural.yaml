            tip: 'পাবলিক contract-এর অংশ। একবার গ্রাহকের হাতে গেলে আর ফেরানো যায় না।'
          - cells: ['পার্টনার API-র response', 'মাস — পার্টনার আপনার হাতে নেই', 'থামুন, বিকল্প লিখুন']
            tip: 'অন্য কোম্পানি এর ওপর কোড লিখবে। পরে একটা field সরালেও তাদের সিস্টেম ভাঙবে।'
          - cells: ['status কোন টেবিলে, কী ছাঁচে', 'সপ্তাহ — জমা ডেটা সরাতে হয়', 'থামুন, বিকল্প লিখুন']
            tip: 'ডেটা মডেল। প্রতিদিন লাখো status সারি জমবে, তাই ভুল ছাঁচ শোধরানো দিন দিন দামি হবে।'
          - cells: ['SMS কোন কোম্পানি দিয়ে', 'দিন — interface-এর আড়ালে', 'একজন ঠিক করুক']
            tip: 'SMS পাঠানোর কোড একটা interface-এর পেছনে থাকলে কোম্পানি বদলানো মানে একটা class নতুন করে লেখা।'
          - cells: ['ম্যাপ দেখানোর library', 'দিন — এক component-এ আটকে', 'একজন ঠিক করুক']
            tip: 'শুধু একটা Vue component এটা ব্যবহার করে, তাই বদলের ধাক্কা ওই এক ফাইলেই থামে।'
          - cells: ['controller ও class-এর নাম', 'মিনিট', 'যে লিখছে, সে-ই']
            tip: 'IDE-র rename দিয়ে নিরাপদে বদলানো যায়। রিভিউতে একটা মন্তব্যই যথেষ্ট।'
          - cells: ['status-এর রং', 'মিনিট', 'ডিজাইনার']
            tip: 'CSS-এর এক লাইন। ভুল হলে পরের deploy-তেই ঠিক হয়ে যাবে।'
      - type: points
        title: 'পাঁচ মিনিটের রুটিন'
        style: number
        items:
          - 'ফিচারের সব সিদ্ধান্ত এক তালিকায় লিখুন।'
          - 'প্রতিটার পাশে বদলানোর খরচ বসান: মিনিট, দিন, সপ্তাহ, নাকি মাস।'
          - '“সপ্তাহ” আর “মাস” লেখাগুলোয় দুইটা বিকল্প ও কারণ লিখে রিভিউ করান।'
          - 'বাকিগুলো একজন ঠিক করে এগিয়ে যাক — ভুল হলে পরে বদলানো সস্তা।'
    aside:
      - type: remember
        body: 'মিনিট-দিন: একা ঠিক করুন। সপ্তাহ-মাস: থামুন, লিখুন, দেখান।'
      - type: pitfalls
        items:
          - 'সব সিদ্ধান্তে সমান সময় দেওয়া — তখন আসল তিনটার জন্য সময়ই থাকে না।'
          - '“পরে দেখা যাবে” বলে ফাউন্ডেশন-সিদ্ধান্ত না ভেবেই নিয়ে ফেলা।'
    check:
      q: 'ট্র্যাকিং ফিচারে SMS কোম্পানি বাছাই কেন “দিন”-এর ঘরে পড়ল, “মাস”-এর ঘরে নয়?'
      a: 'কারণ SMS পাঠানোর কোড একটা interface-এর আড়ালে। কোম্পানি বদলালে শুধু একটা class নতুন করে লিখতে হয়; বাকি কোড, ডেটা বা বাইরের কেউ টেরই পায় না।'

  - slug: accidental-architecture
    title: 'অজান্তে রংকে ফাউন্ডেশন বানিয়ে ফেলা'
    kind: pitfall
    tldr: 'Entity সরাসরি JSON করে পাঠালে টেবিলের কলামই পাবলিক contract হয়ে যায়; আলাদা response class রাখলে ভেতরটা সস্তা থাকে।'
    keywords: ['response DTO', 'leaky abstraction', 'entity exposure', 'API contract', 'entity ফাঁস', 'DTO']
    blocks:
      - type: text
        body: |
          সবচেয়ে চেনা ভুল: controller থেকে Doctrine entity সরাসরি JSON করে পাঠানো। তখন টেবিলের প্রতিটা কলামের নাম পাবলিক API-র অংশ হয়ে যায়। কলামের নাম বদলানো ছিল রঙের মতো সস্তা কাজ; এখন সেটা মোবাইল অ্যাপ ভাঙে — মানে রং নিজেই ফাউন্ডেশন হয়ে গেছে। সমাধান: বাইরে যা যাবে, তার জন্য আলাদা একটা response class।
      - type: code
        lang: php
        file: 'src/Controller/ParcelController.php'
        variant: bad
        code: |
          #[Route('/api/parcels/{id}', methods: ['GET'])]
          public function show(Parcel $parcel): JsonResponse
          {
              // entity-র সব property সোজা বাইরে চলে যাচ্ছে
              return $this->json($parcel);
          }
        marks:
          - {line: 1, tip: 'ডেটাবেসের id এখন URL-এর অংশ। এই id-র ধরন বদলালে পুরনো সব লিংক আর client ভাঙবে।'}
          - {line: 5, tip: 'কাল কলামের নাম বদলালে বা নতুন কোনো গোপন কলাম যোগ করলে সেটা সোজা সব client-এর কাছে পৌঁছে যাবে।'}
      - type: code
        lang: php
        file: 'src/Api/ParcelResponse.php + ParcelController.php'
        variant: good
        code: |
          final readonly class ParcelResponse
          {
              public function __construct(
                  public string $trackingCode,
                  public string $status,
                  public string $updatedAt,
              ) {
              }

              public static function fromEntity(Parcel $parcel): self
              {
                  return new self(
                      $parcel->getTrackingCode(),
                      $parcel->getStatus()->value,
                      $parcel->getUpdatedAt()->format(\DATE_ATOM),
                  );
              }
          }

          // controller-এ
          #[Route('/api/parcels/{trackingCode:parcel}', methods: ['GET'])]
          public function show(Parcel $parcel): JsonResponse
          {
              return $this->json(ParcelResponse::fromEntity($parcel));
          }
        marks:
          - {line: 4, tip: 'client শুধু এই তিনটা field দেখে — এটাই contract। টেবিলে যা খুশি বদলান, এই class না বদলালে কেউ ভাঙবে না।'}
          - {line: 21, tip: '`{trackingCode:parcel}` মানে: URL-এর মান দিয়ে Parcel-এর trackingCode property ধরে খুঁজুন। ভেতরের id আর বাইরে যাচ্ছে না।'}
          - {line: 24, tip: 'entity নয়, response class পাঠানো হচ্ছে। ভেতরের গঠন আর বাইরের প্রতিশ্রুতি এখন আলাদা।'}
      - type: quote
        body: 'ভেতরের গঠন আর বাইরের প্রতিশ্রুতি আলাদা রাখুন — তাহলে ভেতরটা রঙের মতো সস্তা থাকে।'
    aside:
      - type: problem
        body: 'সস্তা সিদ্ধান্ত নিজে থেকেই দামি হয়ে যায়, যখন অনেক কিছু সরাসরি তার ওপর ভর দেয়। মাঝখানে একটা পাতলা স্তর রাখলে বদলের ধাক্কা সেখানেই থেমে যায়।'
      - type: pitfalls
        items:
          - 'দুইটা আলাদা অ্যাপ একই টেবিল সরাসরি পড়লে পুরো schema-ই দুই অ্যাপের মাঝের contract হয়ে যায়।'
          - 'vendor-এর SDK class সারা কোডে ছড়ালে vendor বদলানো “দিন” থেকে “মাস” হয়ে যায়।'
      - type: when
        use: ['বাইরে যা কিছু যায়: পাবলিক API, পার্টনার ফিড, মোবাইল অ্যাপের response']
        avoid: ['শুধু নিজের টিমের ব্যবহারের স্ক্রিন: সেখানে বাড়তি class আর mapping কোড কোনো লাভ দেয় না']
      - type: refs
        items:
          - {to: 'api/contracts-versioning', label: 'Contract ভাঙা ছাড়া API বদলানো'}
          - {to: 'thinking/hexagonal', label: 'Hexagonal: বাইরের জিনিস আড়ালে রাখা'}
    check:
      q: 'Entity সরাসরি JSON করে পাঠালে কলামের নাম বদলানো কেন দামি হয়ে যায়?'
      a: 'তখন কলামের নামই API-র field। মোবাইল অ্যাপ আর পার্টনাররা সেই নাম ধরে কোড লিখেছে, তাই নাম বদলালে তাদের সবকিছু ভাঙে — অথচ তাদের কোড আপনার হাতে নেই।'

flashcards:
  - q: 'কোন সিদ্ধান্তকে আর্কিটেকচারাল বলা হয়?'
    a: 'যেটা পরে বদলাতে অনেক সময়, টাকা আর ঝুঁকি লাগে — যেমন ডেটা মডেল বা পাবলিক API contract।'
    more: |
      সিদ্ধান্তটা দেখতে কত বড় বা কত টেকনিক্যাল, তা দিয়ে মাপা হয় না; মাপা হয় বদলানোর খরচ দিয়ে। বাড়ির রং আর গ্রিল যতবার খুশি বদলানো যায়, কিন্তু ফাউন্ডেশন বদলাতে বাড়ি ভাঙতে হয়। সফটওয়্যারের ফাউন্ডেশনগুলো চিনে সেখানেই বেশি সময় দেওয়া আর্কিটেক্টের কাজ।
    ref: cost-of-change-test
  - q: 'একটা সিদ্ধান্ত বদলানো দামি হবে কি না — কোন তিন প্রশ্নে বোঝা যায়?'
    a: 'কত কিছু এর ওপর দাঁড়িয়ে? ডেটা জমে গেছে? নিয়ন্ত্রণের বাইরের কেউ ব্যবহার করে?'
    more: |
      প্রথম প্রশ্ন মাপে বদলের ধাক্কা কতদূর ছড়াবে। দ্বিতীয়টা মাপে কত ডেটা নতুন ছাঁচে সরাতে হবে। তৃতীয়টা মাপে আপনি একা বদলাতে পারবেন, নাকি অন্যের অপেক্ষায় থাকতে হবে। যত বেশি উত্তর "হ্যাঁ", সিদ্ধান্তটা তত বেশি ফাউন্ডেশনের মতো।
    ref: cost-of-change-test
  - q: 'চারটা চেনা আর্কিটেকচারাল সিদ্ধান্ত কী কী?'
    a: 'ডেটাবেস বাছাই, ডেটা মডেল, সার্ভিসের সীমানা আর পাবলিক API contract।'
    more: |
      চারটাতেই জমা ডেটা অথবা বাইরের কারো নির্ভরতা জড়িয়ে থাকে, তাই পরে বদলাতে সপ্তাহ বা মাস লাগে। এগুলোর সামনে পড়লে থেমে অন্তত দুইটা বিকল্প ভাবতে হয় আর কারণ লিখে রাখতে হয়। ভাষা, framework আর login-এর পদ্ধতিও প্রায়ই এই দলে পড়ে।
    ref: four-pillars
  - q: 'Bikeshedding কী?'
    a: 'তুচ্ছ, সহজ বিষয়ে লম্বা তর্ক করা — আর কঠিন, দামি সিদ্ধান্ত তাড়াহুড়োয় পার করে দেওয়া।'
    more: |
      সহজ বিষয় সবাই বোঝে, তাই সবারই একটা মত থাকে; কঠিন বিষয়ে লোকে চুপ থাকে। ফলে ফোল্ডারের নাম নিয়ে দুই ঘণ্টা যায়, আর ডেটা মডেল পাঁচ মিনিটে পাস হয়। প্রতিকার: আলোচনার আগে জিজ্ঞেস করুন, "এটা পরে বদলাতে কত খরচ?"
    ref: wrong-meeting
  - q: 'পাবলিক API contract বদলানো এত কঠিন কেন?'
    a: 'কারণ client-রা আপনার হাতে নেই: পুরনো মোবাইল অ্যাপ আর পার্টনারের সিস্টেম নিজেদের সময়ে বদলায়, আপনার সময়ে নয়।'
    more: |
      নিজের কোড আপনি এক deploy-তে বদলাতে পারেন। কিন্তু ব্যবহারকারীর ফোনের পুরনো অ্যাপ মাসের পর মাস পুরনো field-ই চাইবে। তাই contract বদলাতে হলে পুরনো আর নতুন দুটোই অনেক দিন একসাথে চালু রাখতে হয়। বিস্তারিত: [[api/contracts-versioning|contract ও versioning]]।
    ref: four-pillars
  - q: 'জমা ডেটা একটা সিদ্ধান্তকে দামি করে তোলে কেন?'
    a: 'শুধু কোড বদলালে হয় না — কোটি সারি নতুন ছাঁচে সরাতে হয়, তাও চালু সিস্টেম বন্ধ না করে।'
    more: |
      প্রথম দিনে টেবিল খালি, তাই ডেটা মডেল বদলানো এক মিনিটের কাজ। দুই বছর পরে একই বদলে লাগে migration, ধাপে ধাপে ডেটা সরানো আর যাচাই। এজন্য ডেটা মডেলের ভুল যত দেরিতে ধরা পড়ে, তত দামি হয়।
    ref: cost-of-change-test
  - q: 'Controller থেকে Doctrine entity সরাসরি JSON করে পাঠালে কী বিপদ?'
    a: 'টেবিলের কলামই API-র field হয়ে যায়: কলাম বদলালে client ভাঙে, আর গোপন কলামও বাইরে চলে যেতে পারে।'
    more: |
      এতে একটা সস্তা সিদ্ধান্ত (কলামের নাম) অজান্তে দামি হয়ে যায়, কারণ বাইরের সবাই তার ওপর নির্ভর করতে শুরু করে। সমাধান হলো আলাদা response class (DTO), যেখানে শুধু সেই field থাকে যা আপনি বাইরে দেওয়ার প্রতিশ্রুতি দিচ্ছেন।
    ref: accidental-architecture
  - q: 'নতুন ফিচারের সিদ্ধান্তগুলোয় সময় কীভাবে ভাগ করবেন?'
    a: 'সব সিদ্ধান্ত লিখে পাশে বদলানোর খরচ বসান: মিনিট, দিন, সপ্তাহ, মাস। রিভিউয়ের সময় দিন শুধু সপ্তাহ-মাসেরগুলোয়।'
    more: |
      একটা ফিচারে সাধারণত অনেক সিদ্ধান্ত থাকে, কিন্তু ফাউন্ডেশনের মতো হয় মাত্র দুই-তিনটা। সেগুলোতে দুইটা বিকল্প আর কারণ লিখে রিভিউ করান। বাকিগুলো একজন ঠিক করে এগিয়ে যাক, কারণ ভুল হলেও পরে শোধরানো সস্তা।
    ref: triage-a-feature
  - q: 'সস্তা সিদ্ধান্তকে সস্তা রাখার কৌশল কী?'
    a: 'ভেতরের গঠন আর বাইরের প্রতিশ্রুতির মাঝে একটা পাতলা স্তর রাখা — response class, interface বা adapter।'
    more: |
      অনেক কিছু সরাসরি একটা জিনিসের ওপর ভর দিলে সেটা নাড়ানো কঠিন হয়ে যায়। মাঝের স্তরটা ধাক্কা আটকে দেয়: ভেতরে কলাম বা vendor বদলালে শুধু ওই স্তরের একটা class বদলাতে হয়, বাইরের কেউ টের পায় না। দাম হলো বাড়তি একটা class আর কিছু mapping কোড, তাই শুধু নিজের টিমের ব্যবহারের স্ক্রিনে এটা বাদ দিন।
    ref: accidental-architecture

quiz:
  - q: 'সুমির টিম একটা হোস্টেল বুকিং অ্যাপ বানাচ্ছে। নিচের কোন সিদ্ধান্তগুলোয় থেমে, বিকল্প লিখে রিভিউ করানো উচিত?'
    hint: 'কোনগুলোয় জমা ডেটা বা বাইরের কোনো সিস্টেম জড়িয়ে আছে?'
    options:
      - text: 'বুকিংয়ের টাকা ডেটাবেসে কোন টাইপে জমা হবে'
        correct: true
        why: 'এটা ডেটা মডেল। লাখো বুকিং জমার পরে টাইপ বদলাতে হলে সব সারি সরাতে হবে, আর ভুল টাইপে টাকার হিসাবও গোলমাল হয়।'
      - text: 'পার্টনার হোস্টেলদের দেওয়া API-র response-এর গঠন'
        correct: true
        why: 'পাবলিক contract। পার্টনাররা এর ওপর কোড লিখবে, তাই পরে আপনি একা বদলাতে পারবেন না।'
      - text: 'টেস্ট ফাইলগুলো কোন ফোল্ডারে থাকবে'
        correct: false
        why: 'ফোল্ডার যেকোনো দিন এক ঘণ্টায় সরানো যায়, বাইরের কেউ টেরও পায় না।'
      - text: 'তারিখ বাছাইয়ের জন্য কোন Vue component ব্যবহার হবে'
        correct: false
        why: 'এক-দুইটা ফাইলে আটকে থাকা বাছাই; ভুল হলে এক-দুই দিনে বদলে ফেলা যায়।'
    ref: triage-a-feature
  - q: 'নিচের কোডে দীর্ঘমেয়াদি সমস্যাটা কী?'
    lang: php
    code: |
      #[Route('/api/users/{id}', methods: ['GET'])]
      public function show(User $user): JsonResponse
      {
          return $this->json($user);
      }
    hint: 'client ঠিক কোন কোন field পাচ্ছে, আর সেই তালিকাটা কে ঠিক করছে?'
    options:
      - text: '`$this->json()` ধীর; `new JsonResponse()` ব্যবহার করা উচিত'
        correct: false
        why: 'দুটো প্রায় একই কাজ করে। গতি এখানে সমস্যা নয়।'
      - text: 'User টেবিলের গঠনই পাবলিক contract হয়ে যাচ্ছে — কলাম বদলালে client ভাঙবে'
        correct: true
        why: 'entity-র property-গুলোই JSON-এর field হচ্ছে। তাই ভেতরের প্রতিটা বদল বাইরে পৌঁছে যায়, এমনকি গোপন field-ও ফাঁস হতে পারে।'
      - text: 'GET-এর বদলে POST হওয়া উচিত ছিল'
        correct: false
        why: 'ডেটা পড়ার জন্য GET-ই ঠিক method।'
      - text: 'কোনো সমস্যা নেই — কোড যত কম, তত ভালো'
        correct: false
        why: 'আজ কম কোড, কিন্তু কাল একটা কলাম বদলাতে গেলেই সব client-এর সাথে সমন্বয় করতে হবে।'
    ref: accidental-architecture
  - q: '"কোন ডেটাবেস ব্যবহার হবে" — এই সিদ্ধান্ত প্রথম দিনে বদলানো সস্তা, দুই বছর পরে খুব দামি। মূল কারণ কী?'
    hint: 'দুই বছরে সিদ্ধান্তটার ওপর কী কী উঠে গেছে?'
    options:
      - text: 'ডেটাবেস সফটওয়্যারটা পুরনো হয়ে যায়'
        correct: false
        why: 'ভার্সন আপগ্রেড আলাদা, তুলনামূলক সহজ কাজ। খরচের মূল উৎস সেটা নয়।'
      - text: 'দুই বছরে লাইসেন্সের দাম বেড়ে যায়'
        correct: false
        why: 'দাম বাড়তে পারে, কিন্তু বদলানোর খাটুনি আসে অন্য জায়গা থেকে।'
      - text: 'দুই বছরে জমা ডেটা, আর সেই ডেটাবেসের ছাঁচে লেখা শত শত query'
        correct: true
        why: 'সিদ্ধান্তের ওপর যত বেশি কিছু দাঁড়ায় আর যত ডেটা জমে, বদল তত দামি হয়।'
      - text: 'ডেভেলপাররা অন্য ডেটাবেস শিখতে চায় না'
        correct: false
        why: 'শেখা কয়েক সপ্তাহের ব্যাপার; ডেটা আর query সরানো মাসের পর মাসের কাজ।'
    ref: cost-of-change-test
  - q: 'টিম লিড বললেন: "সব সিদ্ধান্তই গুরুত্বপূর্ণ, প্রতিটা নিয়ে মিটিং হবে।" এতে আসল ক্ষতি কী?'
    hint: 'সময় সীমিত। সব সিদ্ধান্ত সমান ভাগ পেলে দামিগুলো কতটুকু পায়?'
    options:
      - text: 'দামি সিদ্ধান্তগুলো আলাদা মনোযোগ পায় না, আর পুরো টিমের গতি কমে'
        correct: true
        why: 'ফোল্ডারের নাম আর ডেটা মডেল সমান সময় পেলে আসলে ডেটা মডেলই ঠকে — অথচ ভুলের দাম সেখানেই সবচেয়ে বেশি।'
      - text: 'কোনো ক্ষতি নেই — বেশি আলোচনা মানেই ভালো সিদ্ধান্ত'
        correct: false
        why: 'সস্তা সিদ্ধান্তে লম্বা আলোচনা কিছুই বাঁচায় না, কারণ ভুল হলেও এক ঘণ্টায় শোধরানো যায়।'
      - text: 'মিটিং বেশি হলে কোডের মান খারাপ হয়'
        correct: false
        why: 'মিটিংয়ের সংখ্যা নয়, সমস্যা হলো সময়টা ভুল জায়গায় খরচ হওয়া।'
    ref: wrong-meeting
  - q: 'নিচের কোনগুলো একটা সস্তা সিদ্ধান্তকে অজান্তে দামি বানিয়ে ফেলে?'
    hint: 'কোন ক্ষেত্রে অনেক কিছু সরাসরি একটা ভেতরের জিনিসের ওপর ভর দিচ্ছে?'
    options:
      - text: 'দুইটা আলাদা অ্যাপ একই টেবিল সরাসরি পড়ে ও লেখে'
        correct: true
        why: 'তখন টেবিলের গঠন দুই অ্যাপের মাঝের contract — একটা কলাম বদলাতেও দুই টিমকে একসাথে deploy করতে হয়।'
      - text: 'vendor-এর SDK class ৪০টা ফাইলে সরাসরি ব্যবহার করা'
        correct: true
        why: 'vendor বদলাতে ৪০ জায়গায় হাত দিতে হবে। interface-এর আড়ালে রাখলে লাগত একটা class।'
      - text: 'একটা private method-কে তিনটা ছোট method-এ ভাগ করা'
        correct: false
        why: 'private method বাইরে থেকে কেউ দেখে না; এটা class-এর ভেতরের গোছগাছ, যা যখন খুশি বদলানো যায়।'
      - text: 'পাবলিক URL-এ ডেটাবেসের auto-increment id ব্যবহার করা'
        correct: true
        why: 'ভেতরের id তখন বাইরের প্রতিশ্রুতি হয়ে যায়; id-র ধরন বদলালে সব পুরনো লিংক আর client ভাঙে।'
    ref: accidental-architecture
  - q: 'নিচের কোনটা সাধারণত আর্কিটেকচারাল সিদ্ধান্ত নয়?'
    hint: 'কোনটা বদলালে শুধু একটা class-এ হাত দিলেই চলে?'
    options:
      - text: 'অর্ডার আর পেমেন্ট এক সার্ভিসে থাকবে, না আলাদা'
        correct: false
        why: 'এটা সার্ভিসের সীমানা — চার ফাউন্ডেশনের একটা। ভুল হলে কোড, ডেটা আর টিম আবার ভাগ করতে হয়।'
      - text: 'টাকার অঙ্ক float হবে, না পয়সায় integer'
        correct: false
        why: 'এটা ডেটা মডেল। ডেটা জমার পরে বদলানো কঠিন, আর ভুল টাইপে হিসাবও ভুল হয়।'
      - text: 'interface-এর আড়ালে থাকা ইমেইল পাঠানোর library কোনটা হবে'
        correct: true
        why: 'বাকি কোড শুধু interface চেনে। library বদলালে একটা class নতুন করে লিখলেই হয় — এটা রঙের মতো সিদ্ধান্ত।'
      - text: 'মোবাইল অ্যাপকে দেওয়া API-র field-এর নাম'
        correct: false
        why: 'পাবলিক contract। ফোনে বসানো পুরনো অ্যাপ আপনি জোর করে বদলাতে পারেন না।'
    ref: four-pillars
