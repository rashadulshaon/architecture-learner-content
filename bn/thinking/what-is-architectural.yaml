slides:
  - slug: wrong-meeting
    title: 'দুই ঘণ্টার তর্ক, পাঁচ মিনিটের সিদ্ধান্ত'
    kind: story
    tldr: 'টিম সস্তা সিদ্ধান্তে ঘণ্টা খরচ করে আর দামি সিদ্ধান্ত পাঁচ মিনিটে নেয় — কারণ কোনটা দামি, তা চিনতে শেখেনি।'
    keywords: ['architectural decision', 'bikeshedding', 'cost of change', 'আর্কিটেকচারাল সিদ্ধান্ত', 'বদলানোর খরচ']
    blocks:
      - type: text
        body: |
          রহিমের টিম একটা কুরিয়ার অ্যাপ শুরু করল। প্রথম দিন দুই ঘণ্টা তর্ক হলো — ফোল্ডারের নাম `Service` হবে, না `Services`। আর পার্সেলের ID কেমন হবে, তা ঠিক হলো পাঁচ মিনিটে: ডেটাবেসের ১, ২, ৩ করে বাড়া সংখ্যাই চলবে। এক বছর পরে দেখা গেল, পাশের সংখ্যা বসালেই অন্যের পার্সেল খোলা যায়, আর এক প্রতিদ্বন্দ্বী সংখ্যা গুনে রহিমের দৈনিক পার্সেলের হিসাবও জেনে যাচ্ছে। মালিকানা-check এক বিকেলে প্রথম ফাঁস আটকাল। কিন্তু হিসাব আড়াল করতে অনুমান-করা-যায়-না ID লাগে, অর্থাৎ ID-র ধরন বদলাতে হবে — আর সেই ID ততদিনে লাখো রসিদে ছাপা, মোবাইল অ্যাপে বসানো, তিন পার্টনারের সিস্টেমে জমা। শুরুতে পাঁচ মিনিট বেশি ভেবে দেখলেই তিন মাস বাঁচত।
      - type: visual
        kind: bars
        caption: 'এক বছর পরে কোন সিদ্ধান্ত বদলাতে কত সময় লাগল'
        items:
          - {label: 'ফোল্ডারের নাম', value: 0.2, display: '১ ঘণ্টা', tone: good, tip: 'IDE-র rename এক ক্লিকে সব ফাইল ঠিক করে দেয়। অথচ এটা নিয়েই দুই ঘণ্টা তর্ক হয়েছিল।'}
          - {label: 'লগ লেখার library', value: 3, display: '৩ দিন', tip: 'কোডের কয়েক জায়গায় হাত দিতে হয়, কিন্তু বাইরের কেউ টের পায় না — তাই খাটুনি দিনেই শেষ।'}
          - {label: 'পার্সেল ID-র ধরন', value: 90, display: '৩ মাস', tone: bad, tip: 'পাঁচ মিনিটে নেওয়া সিদ্ধান্ত। বদলাতে গিয়ে পুরনো আর নতুন ID মাসের পর মাস একসাথে চালাতে হয়েছে।'}
      - type: quote
        body: 'যে সিদ্ধান্ত বদলাতে সবচেয়ে বেশি দাম দিতে হবে, সবচেয়ে বেশি ভাবনা তারই পাওনা।'
    aside:
      - type: story
        title: 'ID বদলাতে তিন মাস কেন?'
        body: |
          পুরনো মোবাইল অ্যাপ এখনো সংখ্যার ID পাঠায়, আর সবাইকে জোর করে আপডেট করানো যায় না। পার্টনাররা নিজেদের ডেটাবেসে পুরনো ID জমিয়েছে। ছাপানো রসিদ তো ফেরানোই যায় না। তাই দুই রকম ID একসাথে চালু রেখে ধীরে ধীরে সরতে হয়েছে।
      - type: terms
        items:
          - {term: 'Bikeshedding', meaning: 'তুচ্ছ, সহজ বিষয়ে লম্বা তর্ক — কারণ সেটা সবাই বোঝে, তাই সবারই একটা মত থাকে।'}
          - {term: 'Cost of change', meaning: 'একটা সিদ্ধান্ত পরে বদলাতে যত সময়, টাকা আর ঝুঁকি লাগে।'}
      - type: refs
        items:
          - {to: 'data/id-generation', label: 'ID বানানোর উপায়গুলো'}
    check:
      q: 'রহিমের টিমের আসল ভুলটা কোথায় — ID-র ধরন বাছাইয়ে, নাকি সময় ভাগ করায়?'
      a: 'সময় ভাগ করায়। যেটা এক ঘণ্টায় বদলানো যায় তাতে গেছে দুই ঘণ্টা, আর যেটা বদলাতে তিন মাস লাগে সেটা ঠিক হয়েছে পাঁচ মিনিটে, কোনো বিকল্প না ভেবে।'

  - slug: cost-of-change-test
    title: 'কষ্টিপাথর: পরে বদলাতে কত খরচ?'
    kind: concept
    tldr: 'সিদ্ধান্ত আর্কিটেকচারাল কি না বোঝা যায় তিন প্রশ্নে: কত কিছু এর ওপর দাঁড়িয়ে, ডেটা জমেছে কি না, বাইরের কেউ ব্যবহার করে কি না।'
    keywords: ['cost of change', 'blast radius', 'significant decision', 'ফাউন্ডেশন', 'নির্ভরতা', 'কষ্টিপাথর']
    blocks:
      - type: metaphor
        icon: building
        title: 'দোতলার ফাউন্ডেশনে ছয়তলা'
        body: |
          চাচা দোতলার হিসাবে ফাউন্ডেশন দিয়ে বাড়ি তুললেন। দশ বছর পরে ছয়তলা করতে চাইলেন — ইঞ্জিনিয়ার বললেন, পুরোটা ভাঙতে হবে। অথচ জানালার গ্রিল, টাইলস আর রং তিনি যতবার খুশি বদলেছেন। ফাউন্ডেশন দামি, কারণ বাকি সবকিছু তার ওপর দাঁড়িয়ে আছে।
      - type: points
        title: 'তিন প্রশ্নে ফাউন্ডেশন চেনা'
        style: number
        items:
          - '**কত কিছু এর ওপর দাঁড়িয়ে?** যত বেশি কোড, টিম আর সিস্টেম নির্ভর করে, বদল তত দামি।'
          - '**ডেটা জমে গেছে?** জমা ডেটাকে নতুন ছাঁচে ঢালতে হয় — সেটা কোড বদলানোর চেয়ে ঢের কঠিন।'
          - '**নিয়ন্ত্রণের বাইরের কেউ ব্যবহার করে?** পুরনো মোবাইল অ্যাপ বা পার্টনারকে আপনি জোর করে বদলাতে পারেন না।'
      - type: visual
        kind: flow
        caption: 'রহিমের পার্সেল ID-র ওপর যা যা দাঁড়িয়ে ছিল'
        nodes:
          - {id: parcel_id, label: 'পার্সেল ID-র ধরন', sub: 'পাঁচ মিনিটের সিদ্ধান্ত', icon: id, tone: accent, col: 2, row: 1, tip: 'এটাই ফাউন্ডেশন। চারদিক থেকে চারটা জিনিস এর ওপর ভর দিয়ে আছে, তাই একে নাড়ালে সবগুলো নড়ে।'}
          - {id: mobile, label: 'মোবাইল অ্যাপ', sub: 'পুরনো ভার্সন চালু', icon: mobile, col: 0, row: 0, tip: 'ব্যবহারকারীর ফোনে বসানো অ্যাপ আপনার নিয়ন্ত্রণের বাইরে — কেউ এক বছরেও আপডেট করে না।'}
          - {id: partner, label: 'পার্টনার সিস্টেম', sub: 'তিনটা কোম্পানি', icon: building, col: 4, row: 0, tip: 'অন্য কোম্পানির কোড। তারা নিজেদের সময়সূচিতে বদলায়, আপনার সময়সূচিতে নয়।'}
          - {id: receipt, label: 'ছাপানো রসিদ', sub: 'লাখো কপি', icon: receipt, col: 0, row: 2, tip: 'কাগজে ছাপা ID আর বদলানো যায় না। গ্রাহক সেই পুরনো নম্বর দিয়েই খোঁজ করবে।'}
          - {id: tables, label: 'ডেটাবেস', sub: '১২টা টেবিল', icon: db, col: 4, row: 2, tip: 'জমা ডেটা। প্রতিটা সারি নতুন ID-র সাথে মিলিয়ে সরাতে হয়, চালু সিস্টেম বন্ধ না করে।'}
        edges:
          - {from: mobile, to: parcel_id, label: 'পুরনো অ্যাপ এখনো সংখ্যার ID পাঠায়', tip: 'প্রশ্ন ৩: নিয়ন্ত্রণের বাইরের ব্যবহারকারী।'}
          - {from: partner, to: parcel_id, label: 'পার্টনাররা নিজেদের ডেটাবেসে এই ID জমিয়েছে', tip: 'প্রশ্ন ৩ আবার — এবার অন্য কোম্পানি।'}
          - {from: receipt, to: parcel_id, label: 'ছাপানো রসিদের ID আর ফেরানো যায় না', tone: bad}
          - {from: tables, to: parcel_id, label: '১২টা টেবিলের কোটি সারি এই ID দিয়ে জোড়া', tip: 'প্রশ্ন ১ ও ২: অনেক কিছু দাঁড়িয়ে, আর ডেটা জমে গেছে।'}
      - type: quote
        body: 'আর্কিটেকচার হলো সিস্টেমের আকার দেওয়া সেই গুরুত্বপূর্ণ ডিজাইন-সিদ্ধান্তগুলো, যেখানে গুরুত্ব মাপা হয় বদলানোর খরচ দিয়ে।'
        by: 'Grady Booch'
    aside:
      - type: remember
        body: 'নিজেকে জিজ্ঞেস করুন: "এক বছর পরে এটা বদলাতে কত দিন লাগবে, আর কাকে কাকে রাজি করাতে হবে?"'
      - type: tips
        items:
          - 'সিদ্ধান্তটা এক ফাইলে আটকে থাকলে সস্তা; যত বেশি জায়গায় ছড়ায়, তত দামি।'
          - 'একই সিদ্ধান্ত প্রথম দিনে সস্তা, দুই বছর পরে দামি — কারণ এর মধ্যে তার ওপর অনেক কিছু উঠে গেছে।'
          - 'এটা বিচারের সহায়ক, হিসাবের যন্ত্র নয়। "দিন, নাকি মাস?" জানাই যথেষ্ট; আন্দাজ কষতে মিটিং করবেন না।'
      - type: refs
        items:
          - {to: 'thinking/reversible-decisions', label: 'ফেরার দরজা আছে, না নেই?'}
    check:
      q: 'একটা সিদ্ধান্ত আর্কিটেকচারাল কি না বোঝার তিনটা প্রশ্ন কী?'
      a: 'কত কিছু এর ওপর দাঁড়িয়ে, ডেটা জমে গেছে কি না, আর নিয়ন্ত্রণের বাইরের কেউ এটা ব্যবহার করে কি না। যত বেশি "হ্যাঁ", বদল তত দামি।'

  - slug: four-pillars
    title: 'চারটা চেনা ফাউন্ডেশন — আর যেগুলো শুধুই রং'
    kind: concept
    tldr: 'ডেটাবেস বাছাই, ডেটা মডেল, সার্ভিসের সীমানা আর পাবলিক API contract — এই চারটায় থামুন; বাকি বেশিরভাগ সিদ্ধান্তে দ্রুত এগোন।'
    keywords: ['database choice', 'data model', 'service boundary', 'API contract', 'ডেটা মডেল', 'সার্ভিসের সীমানা']
    blocks:
      - type: text
        body: |
          প্রায় সব প্রজেক্টে চার ধরনের সিদ্ধান্ত ফাউন্ডেশনের মতো আচরণ করে। এগুলোর সামনে পড়লে থামতে হবে, অন্তত দুইটা বিকল্প ভাবতে হবে, আর কারণটা লিখে রাখতে হবে। বাকি বেশিরভাগ সিদ্ধান্ত গ্রিল আর রঙের মতো — একজন ঠিক করুক, টিম এগিয়ে যাক।
      - type: visual
        kind: table
        caption: 'চার ফাউন্ডেশন: কেন বদলানো কঠিন'
        headers: ['সিদ্ধান্ত', 'কেন বদলানো কঠিন', 'উদাহরণ']
        rows:
          - cells: ['কোন ডেটাবেস', 'সব query আর জমা ডেটা এর ছাঁচে বাঁধা', 'PostgreSQL, নাকি MongoDB']
            tip: 'বদলাতে হলে প্রতিটা query নতুন করে লিখতে হয়, আর পুরো ডেটা এক ডেটাবেস থেকে আরেকটায় সরাতে হয়।'
          - cells: ['ডেটা মডেল', 'কোটি সারি নতুন ছাঁচে ঢালতে হয়', 'টাকা float, নাকি পয়সায় integer']
            tip: 'কোন টেবিল, কোন কলাম, কী টাইপ, কার সাথে কার সম্পর্ক। ডেটা জমার পরে এর ভুল শোধরানো সবচেয়ে কষ্টের।'
          - cells: ['সার্ভিসের সীমানা', 'কোড, ডেটা আর টিম — তিনটাই আবার ভাগ হয়', 'অর্ডার ও পেমেন্ট একসাথে, না আলাদা']
            tip: 'সিস্টেম কোথায় কোথায় আলাদা টুকরো হবে। ভুল জায়গায় কাটলে প্রতিটা ফিচারে দুই টুকরোতেই হাত দিতে হয়।'
          - cells: ['পাবলিক API contract', 'বাইরের client আপনার হাতে নেই', 'field-এর নাম, ID-র ধরন, URL']
            tip: 'বাইরের দুনিয়াকে দেওয়া প্রতিশ্রুতি। একবার কেউ এর ওপর কোড লিখলে আপনি আর একা বদলাতে পারেন না।'
      - type: points
        title: 'এগুলো রং — লম্বা মিটিং নয়'
        items:
          - 'ভেরিয়েবল, method আর ফোল্ডারের নাম — IDE এক মিনিটে বদলে দেয়।'
          - 'কোডের ফরম্যাট — `php-cs-fixer`-কে ঠিক করতে দিন।'
          - 'একটা class-এর ভেতরের গঠন — বাইরে থেকে কেউ দেখে না।'
          - 'interface-এর আড়ালে থাকা library — একটা class বদলালেই হয়।'
    aside:
      - type: tips
        items:
          - 'আরও কয়েকটা প্রায়ই ফাউন্ডেশন হয়: ভাষা ও framework, login-এর পদ্ধতি, আর এক সিস্টেমে অনেক ক্রেতার ডেটা আলাদা রাখার উপায়।'
          - 'ফাউন্ডেশন-সিদ্ধান্তের কারণ এক পাতায় লিখে রাখুন ([[thinking/documentation|ADR]]) — ছয় মাস পরে কেউ জিজ্ঞেস করবেই, "এটা কেন?"'
          - 'থামারও দাম আছে। যে প্রোটোটাইপ ফেলে দেবেন বলে ঠিক করেছেন, তাতে আনুষ্ঠানিকতা বাদ দিন: বদলানোর খরচ সেখানে কখনো আসেই না।'
      - type: refs
        items:
          - {to: 'data/choosing-database', label: 'কোন কাজে কোন ডেটাবেস?'}
          - {to: 'api/contracts-versioning', label: 'API contract ও versioning'}
    check:
      q: 'চারটা চেনা আর্কিটেকচারাল সিদ্ধান্ত কী কী, আর চারটার মিল কোথায়?'
      a: 'ডেটাবেস বাছাই, ডেটা মডেল, সার্ভিসের সীমানা আর পাবলিক API contract। চারটাতেই জমা ডেটা অথবা বাইরের কারো নির্ভরতা জড়িয়ে থাকে।'

  - slug: triage-a-feature
    title: 'একটা ফিচারের সিদ্ধান্তগুলো বাছাই করা'
    kind: howto
    tldr: 'ফিচারের সব সিদ্ধান্ত লিখে প্রতিটার পাশে বদলানোর খরচ বসান — মিনিট, দিন, সপ্তাহ, মাস। সময় দিন শুধু সপ্তাহ-মাসেরগুলোয়।'
    keywords: ['decision triage', 'checklist', 'সিদ্ধান্ত বাছাই', 'চেকলিস্ট', 'ফিচার পরিকল্পনা']
    blocks:
      - type: text
        body: |
          নতুন ফিচার এলে আগে সব সিদ্ধান্তের একটা তালিকা করুন, তারপর প্রতিটার পাশে লিখুন: পরে বদলাতে কত খরচ। উদাহরণ: কুরিয়ার অ্যাপের “পার্সেল ট্র্যাকিং” ফিচার। নিচে রহিমের টিমের তালিকা — সাতটার মধ্যে মাত্র তিনটা ফাউন্ডেশন, তাই রিভিউ মিটিংয়ের পুরো সময় ওই তিনটাই পেল।
      - type: visual
