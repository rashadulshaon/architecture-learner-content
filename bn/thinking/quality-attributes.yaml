slides:
  - slug: everything-at-once
    title: '"দ্রুত, সবসময় চালু, নিরাপদ, আর সস্তা চাই"'
    kind: story
    tldr: 'সবকিছু সর্বোচ্চ চাওয়া কোনো প্রয়োজন নয়, এড়িয়ে যাওয়া সিদ্ধান্ত; আর অস্পষ্ট চাওয়া মাপা যায় না বলে কেউ জানে না কখন কাজ শেষ।'
    keywords: ['quality attributes', 'non-functional requirements', 'NFR', 'vague requirements', 'গুণাবলি', 'অস্পষ্ট চাহিদা']
    blocks:
      - type: text
        body: |
          একটা ই-কমার্স ক্লায়েন্ট রহিমের টিমকে বলল, "অ্যাপ দ্রুত হতে হবে, সবসময় চালু থাকবে, সবচেয়ে নিরাপদ হবে, আর খরচ কম।" টিম বলল, "ঠিক আছে।" ছয় মাস পরে সেলের দিন সাইট ধীর হলো, আর ক্লায়েন্ট বলল, "বলেছিলাম না দ্রুত?" টিম বলল, "কতটা দ্রুত, তা তো কেউ বলেনি।"
      - type: visual
        kind: compare
        caption: 'ক্লায়েন্ট যা চাইল, আর যে প্রশ্নের উত্তর কেউ জানত না'
        columns:
          - title: 'যা চাওয়া হলো'
            tone: warn
            icon: star
            tip: 'পাঁচটাই "সবচেয়ে ভালো" চাওয়া হলো। কিন্তু বাস্তবে এগুলো একটা আরেকটার সাথে টানাটানি করে।'
            items:
              - 'দ্রুত'
              - 'সবসময় চালু'
              - 'একদম নিরাপদ'
              - 'সস্তা'
              - 'সহজে বদলানো যায়'
          - title: 'যে প্রশ্নের উত্তর নেই'
            tone: bad
            icon: warning
            tip: 'প্রতিটা চাওয়ার পেছনে একটা সংখ্যা লুকিয়ে আছে, যেটা কেউ জিজ্ঞেস করেনি।'
            items:
              - 'কতটা দ্রুত: ২০০ms না ২ সেকেন্ড?'
              - 'কতটা চালু: ৯৯% না ৯৯.৯৯%?'
              - 'কত বাজেট, মাসে কত টাকা?'
              - 'কত লোক একসাথে ঢুকবে, কখন?'
    aside:
      - type: problem
        body: 'অস্পষ্ট চাওয়া মাপা যায় না, আর মাপা না গেলে বলা যায় না কাজ শেষ হলো কি না। ফলে ঝগড়া হয় রিলিজের পরে, যখন বদলাতে সবচেয়ে বেশি খরচ।'
      - type: terms
        items:
          - {term: 'Quality attribute', meaning: 'সিস্টেম কী করে নয়, কতটা ভালোভাবে করে: গতি, চালু থাকা, নিরাপত্তা ইত্যাদি।'}
          - {term: 'NFR', meaning: 'Non-functional requirement: ওপরের গুণাবলির আরেক নাম।'}
    check:
      q: 'রহিমের টিম কোন ভুলটা করল, যখন ক্লায়েন্ট "দ্রুত চাই" বলল?'
      a: 'তারা জিজ্ঞেস করেনি "কতটা দ্রুত, কোন পরিস্থিতিতে?"। সংখ্যা ছাড়া "দ্রুত" মাপা যায় না, তাই কেউ জানে না কখন লক্ষ্য পূরণ হলো।'

  - slug: five-attributes-tradeoff
    title: 'পাঁচ গুণ, আর একটার দাম আরেকটা দেয়'
    kind: concept
    tldr: 'গতি, availability, নিরাপত্তা, maintainability আর খরচ একসাথে সর্বোচ্চ হয় না; একটা বাড়াতে গেলে আরেকটা কমে।'
    keywords: ['performance', 'availability', 'security', 'maintainability', 'cost', 'trade-off', 'গতি', 'নিরাপত্তা']
    blocks:
      - type: metaphor
        icon: truck
        title: 'বাসের টিকিট: দ্রুত, আরামদায়ক, সস্তা'
        body: |
          ঢাকা থেকে চট্টগ্রামে যেতে চাইলে দ্রুত, আরামদায়ক আর সস্তা, তিনটা একসাথে পাওয়া যায় না। এসি কোচ আরামদায়ক কিন্তু দামি, লোকাল বাস সস্তা কিন্তু ধীর। সফটওয়্যারেও প্রতিটা গুণের একটা দাম আছে, আর সেই দাম দিতে হয় অন্য গুণ থেকে।
      - type: visual
        kind: table
        caption: 'একটা গুণ বাড়ালে কোথায় কী কমে'
        headers: ['গুণ', 'বাড়াতে যা করো', 'যা কমে বা বাড়ে']
        rows:
          - cells: ['গতি', 'cache, বেশি RAM', 'বাসি ডেটার ঝুঁকি, খরচ']
            tip: 'cache মানে জমানো উত্তর। তা বাসি হতে পারে, আর তাকে পরিষ্কার রাখাই একটা নতুন কাজ।'
          - cells: ['Availability', 'দুইটা সার্ভার, replica', 'খরচ আর জটিলতা দ্বিগুণ']
            tip: 'কিছু ভাঙলেও চালু থাকতে হলে বাড়তি সবকিছু রাখতে হয়, আর বাড়তি জিনিসের নিজের সমস্যা আছে।'
          - cells: ['নিরাপত্তা', 'বেশি যাচাই, 2FA, encryption', 'ধীর গতি, ব্যবহারে ঝামেলা']
            tip: 'প্রতিটা বাড়তি পাহারা ব্যবহারকারীর একটা বাড়তি ধাপ বা ডেটাবেসের একটা বাড়তি কাজ।'
          - cells: ['Maintainability', 'পরিষ্কার স্তর, টেস্ট', 'এখনকার গতি কমে']
            tip: 'আজকের তাড়ায় এটা ছাড়া যায়। কিন্তু পরের প্রতিটা ফিচারে সুদ গুনতে হয়।'
          - cells: ['কম খরচ', 'ছোট সার্ভার, কম কপি', 'গতি আর availability কমে']
            tip: 'টাকা বাঁচানো মানে সাধারণত কম রিসোর্স। তা কম গতি বা কম নিরাপত্তা বোঝাতে পারে।'
      - type: quote
        body: 'সব গুণ একসাথে সর্বোচ্চ হয় না। কোনটাকে কতটা দাম দেবে, সেটাই আর্কিটেকচারের সিদ্ধান্ত।'
    aside:
      - type: remember
        body: 'প্রতিবার জিজ্ঞেস করো: "এই গুণটা বাড়াতে গিয়ে আমি কোন গুণকে ছোট করছি?"'
      - type: refs
        items:
          - {to: 'scaling/load-latency', label: 'গতি আর load মাপা'}
          - {to: 'observability/metrics-slos', label: 'SLO দিয়ে লক্ষ্য মাপা'}
    check:
      q: 'Availability বাড়াতে দুইটা সার্ভার রাখলে কোন কোন গুণে কী পড়ে?'
      a: 'খরচ প্রায় দ্বিগুণ হয় আর জটিলতা বাড়ে: load balancer, ডেটা সিঙ্ক, আর দুই সার্ভারের মধ্যে ডেটা-মেলানো। বিনিময়ে একটা মরলেও সিস্টেম চালু থাকে।'

  - slug: measurable-requirements
    title: 'অস্পষ্ট ইচ্ছাকে সংখ্যায় বদলাও'
    kind: howto
    tldr: 'প্রতিটা গুণকে একটা পরিস্থিতি, একটা মাপকাঠি আর একটা লক্ষ্যমাত্রায় লেখো, তাহলে কাজ শেষ হয়েছে কি না, সবাই বলতে পারবে।'
    keywords: ['quality attribute scenario', 'SLO', 'p95', 'uptime', 'measurable requirement', 'মাপযোগ্য চাহিদা']
    blocks:
      - type: text
        body: |
          অস্পষ্ট শব্দ মাপযোগ্য করার ছক: কোন পরিস্থিতিতে, কী মাপব, আর কত হলে ঠিক। "দ্রুত" বদলে হয় "সেলের সময় ১০০ জন একসাথে checkout করলে p95 latency ৩০০ms-এর কম"। p95 মানে ১০০টা request-এর ৯৫টা এর চেয়ে দ্রুত। এই লক্ষ্যই পরে টেস্ট আর monitoring-এ যাচাই হয়।
      - type: visual
        kind: table
        caption: 'অস্পষ্ট চাওয়া থেকে মাপযোগ্য লক্ষ্য'
        headers: ['অস্পষ্ট', 'মাপযোগ্য']
        rows:
          - cells: ['দ্রুত', 'checkout-এর p95 < 300ms, ১০০ জনের একসাথে চাপে']
            tip: 'পরিস্থিতি, মাপকাঠি আর সংখ্যা তিনটাই আছে। এখন load test দিয়ে সত্যিই যাচাই করা যায়।'
          - cells: ['সবসময় চালু', 'মাসিক uptime >= ৯৯.৯% (মাসে প্রায় ৪৩ মিনিটের বেশি বন্ধ নয়)']
            tip: '৯৯.৯% মানে মাসে সর্বোচ্চ প্রায় ৪৩ মিনিট বন্ধ থাকা চলে। এই সংখ্যা জানলেই খরচের হিসাব হয়।'
          - cells: ['নিরাপদ', '৫ বার ভুল পাসওয়ার্ডে ১৫ মিনিট লগইন বন্ধ; critical CVE ৭ দিনে ঠিক']
            tip: 'কয়েকটা নির্দিষ্ট, যাচাইযোগ্য নিয়ম। "একদম নিরাপদ" বলা মানে কিছুই বলা নয়।'
          - cells: ['সস্তা', 'মাসিক infra খরচ <= ৩০,০০০ টাকা']
            tip: 'বাজেটের সীমা থাকলে বাকি গুণ সেই সীমার ভেতরে বেছে নিতে হয়।'
          - cells: ['সহজে বদলানো', 'নতুন payment gateway যোগ করতে <= ৩ দিন']
            tip: 'পরীক্ষা: সত্যিই এই কাজটা কয়দিনে হয়, সেটা মেপে দেখো। বেশি লাগলে structure-এ ভুল।'
      - type: code
        lang: yaml
        file: 'docs/quality-requirements.yaml'
        code: |
          - id: QA-1
            attribute: performance
            scenario: 'সেলের সময় ১০০ জন একসাথে checkout চাপলে'
            measure: 'checkout API-র p95 latency'
            target: '< 300ms'
            verify: 'k6 load test, প্রতি release-এর আগে CI-তে'

          - id: QA-2
            attribute: availability
            scenario: 'একটা app সার্ভার মরে গেলে'
            measure: 'মাসিক uptime'
            target: '>= 99.9%'
            verify: 'health check + বাইরের uptime monitor'
        marks:
          - {line: 6, tip: 'verify লাইন না থাকলে লক্ষ্যটা শুধু কাগুজে। কীভাবে যাচাই হবে সেটাও লিখে রাখো।'}
    aside:
      - type: commands
        title: 'গতি মেপে দেখা'
        items:
          - {cmd: 'k6 run checkout-test.js', desc: 'load test চালিয়ে p95 পাওয়া'}
      - type: refs
        items:
          - {to: 'observability/metrics-slos', label: 'SLI, SLO ও error budget'}
    check:
      q: '"সিস্টেম দ্রুত হবে" বাক্যটাকে মাপযোগ্য করতে কোন তিনটা জিনিস যোগ করবে?'
      a: 'একটা পরিস্থিতি (কত জন, কখন), একটা মাপকাঠি (যেমন p95 latency) আর একটা লক্ষ্যমাত্রা (যেমন ৩০০ms-এর কম)।'

  - slug: choose-the-top-two
    title: 'সবার আগে দুইটা বেছে নাও, বাকিদের সীমা বাঁধো'
    kind: howto
    tldr: 'প্রতিটা সিস্টেমের জন্য সবচেয়ে গুরুত্বপূর্ণ দুইটা গুণ বাছো, বাকিদের একটা ন্যূনতম সীমা ঠিক করো, আর "nines"-এর দাম মাথায় রাখো।'
    keywords: ['prioritize quality attributes', 'nines', 'availability cost', 'trade-off decision', 'অগ্রাধিকার', 'ADR']
    blocks:
      - type: text
        body: |
          সব গুণকে সমান গুরুত্ব দেওয়া যায় না। বিকাশের মতো টাকার অ্যাপে নিরাপত্তা আর availability আগে, খরচ শেষে। ব্যক্তিগত ব্লগে খরচ আর maintainability আগে, availability শেষে। সিদ্ধান্তটা লিখে রাখো, কারণ ছয় মাস পরে কেউ জিজ্ঞেস করবেই, "কেন আমরা ৯৯.৯৯% চাইনি?"
      - type: visual
        kind: steps
        caption: 'গুণের অগ্রাধিকার ঠিক করার চার ধাপ'
        steps:
          - {title: '১. পাঁচটা লিখো', body: 'গতি, availability, নিরাপত্তা, maintainability, খরচ।', tip: 'সবগুলো সামনে রাখলে কোনটা ভুলে যাচ্ছ তা চোখে পড়ে।'}
          - {title: '২. দুইটা বাছো', body: 'ব্যবসার জন্য কোন দুইটা ভাঙলে সবচেয়ে বড় ক্ষতি?', tip: 'ক্ষতির দিক থেকে ভাবো: কোন গুণ ভাঙলে ব্যবসা বা বিশ্বাস নষ্ট হবে।'}
          - {title: '৩. বাকিদের সীমা', body: 'প্রতিটার একটা ন্যূনতম মাপযোগ্য সীমা ঠিক করো।', tip: 'বাকিগুলো বাদ নয়, শুধু কম অগ্রাধিকার। তবু একটা সীমার নিচে নামা চলবে না।'}
          - {title: '৪. লিখে রাখো', body: 'সিদ্ধান্ত আর কারণ ADR-এ লেখো।', tip: 'ছোট ADR দিয়েই যথেষ্ট। কারণটা না লিখলে পরে আবার একই তর্ক হবে।'}
      - type: visual
        kind: bars
        caption: 'মাসে সর্বোচ্চ কত সময় বন্ধ থাকা চলে (মিনিটে, প্রায়)'
        items:
          - {label: '৯৯%', value: 432, display: '~৭ ঘণ্টা', tone: warn, tip: 'ছোট বা অভ্যন্তরীণ সিস্টেমের জন্য চলে। সস্তা, কিন্তু কয়েক ঘণ্টা বন্ধ থাকা মেনে নিতে হয়।'}
          - {label: '৯৯.৯%', value: 43, display: '~৪৩ মিনিট', tone: good, tip: 'বেশিরভাগ ব্যবসায়িক সিস্টেমের যুক্তিসংগত লক্ষ্য। এর জন্য একটা চালু backup সার্ভার লাগে।'}
          - {label: '৯৯.৯৯%', value: 4.3, display: '~৪ মিনিট', tone: accent, tip: 'এতে মানুষের দেখে ঠিক করার সময় থাকে না, সবকিছু স্বয়ংক্রিয় হতে হয়। খরচ অনেক বাড়ে।'}
          - {label: '৯৯.৯৯৯%', value: 0.4, display: '~২৬ সেকেন্ড', tone: bad, tip: 'প্রায় সব ক্ষেত্রেই অতিরিক্ত। ব্যাংক বা টেলিকমের মতো বিশেষ সিস্টেম ছাড়া এর দাম পোষায় না।'}
      - type: quote
        body: 'প্রতিটা অতিরিক্ত "নাইন" আগের চেয়ে বহুগুণ দামি। বাস্তব প্রয়োজনের বেশি চেয়ো না।'
    aside:
      - type: tips
        items:
          - 'ব্যবহারকারীকে জিজ্ঞেস করো: "১ ঘণ্টা বন্ধ থাকলে কী ক্ষতি?" উত্তরই বলে দেবে কতটা availability লাগবে।'
          - 'দুই-তিন মাস পর পর অগ্রাধিকার আবার দেখো; ব্যবসা বদলালে লক্ষ্যও বদলায়।'
      - type: refs
        items:
          - {to: 'thinking/documentation', label: 'ADR লেখা'}
    check:
      q: '৯৯.৯৯৯% availability কেন সবসময় ভালো লক্ষ্য নয়?'
      a: 'প্রতিটা বাড়তি নাইনের খরচ বহুগুণ বাড়ে, আর বেশিরভাগ ব্যবসার তা দরকার হয় না। সম্ভাব্য ক্ষতির চেয়ে খরচ বেশি হলে সেটা অপচয়।'

flashcards:
  - q: 'Quality attribute কী?'
    a: 'সিস্টেম কী করে তা নয়, কতটা ভালোভাবে করে তার গুণ: গতি, availability, নিরাপত্তা, maintainability, খরচ।'
    more: |
      একই ফিচার ধীর বা দ্রুত, নিরাপদ বা অনিরাপদ হতে পারে। এই গুণগুলোই আর্কিটেকচারের সিদ্ধান্ত নিয়ন্ত্রণ করে, কারণ এগুলো পরে বদলানো সবচেয়ে কঠিন।
    ref: five-attributes-tradeoff
  - q: 'পাঁচটা প্রধান quality attribute কী কী?'
    a: 'Performance (গতি), availability, security, maintainability আর cost।'
    more: |
      আরও গুণ আছে: scalability, observability, usability। কিন্তু এই পাঁচটা দিয়ে বেশিরভাগ আলোচনা শুরু করা যায়। মূল কথা হলো, প্রতিটার একটা দাম আছে, আর সেই দাম অন্য গুণ থেকে কাটা যায়।
    ref: five-attributes-tradeoff
  - q: 'Availability বাড়ালে কোন কোন জিনিস বাড়ে?'
    a: 'খরচ ও জটিলতা, কারণ বাড়তি সার্ভার, replica, load balancer আর ডেটা-মেলানোর কাজ লাগে।'
    more: |
      একটা জিনিস মরলেও চালু থাকতে হলে একটা অতিরিক্ত জিনিস রাখতে হয়। সেই অতিরিক্ত জিনিসটার নিজেরও রক্ষণাবেক্ষণ, নজরদারি আর ডেটা সিঙ্কের ঝামেলা থাকে।
    ref: five-attributes-tradeoff
  - q: 'কেন "সিস্টেম দ্রুত হবে" বাক্যটা ভালো requirement নয়?'
    a: 'কারণ এটা মাপা যায় না। কতটা দ্রুত, কোন পরিস্থিতিতে, তা না জানলে কখন কাজ শেষ হলো কেউ বলতে পারে না।'
    more: |
      ভালো requirement-এ পরিস্থিতি, মাপকাঠি আর লক্ষ্যমাত্রা থাকে: "১০০ জন একসাথে checkout করলে p95 latency ৩০০ms-এর কম।" তখন load test দিয়ে সত্যি যাচাই করা যায়।
    ref: measurable-requirements
  - q: 'p95 latency মানে কী?'
    a: 'প্রতি ১০০টা request-এর ৯৫টা যে সময়ের মধ্যে শেষ হয়। বাকি ৫টা তার চেয়ে ধীর।'
    more: |
      গড় সময় ধীর request-গুলো লুকিয়ে ফেলে। p95 বা p99 দেখায় সবচেয়ে খারাপ অভিজ্ঞতাগুলো কেমন, আর ব্যবহারকারী ঠিক সেই ধীর request-গুলোই মনে রাখে। বিস্তারিত: [[observability/metrics-slos|metrics ও SLO]]।
    ref: measurable-requirements
  - q: '৯৯.৯% availability মানে মাসে কত সময় বন্ধ থাকা চলে?'
    a: 'প্রায় ৪৩ মিনিট। ৯৯% হলে প্রায় ৭ ঘণ্টা, ৯৯.৯৯% হলে প্রায় ৪ মিনিট।'
    more: |
      প্রতিটা বাড়তি নাইনে অনুমোদিত বন্ধের সময় দশ ভাগের এক ভাগ হয়, কিন্তু খরচ বহুগুণ বাড়ে। তাই আগে জানতে হবে ব্যবসার জন্য এক ঘণ্টা বন্ধ থাকার ক্ষতি কত।
    ref: choose-the-top-two
  - q: 'সব quality attribute-কে কেন সমান গুরুত্ব দেওয়া যায় না?'
    a: 'কারণ একটা বাড়াতে গেলে আরেকটা কমে। তাই ব্যবসার জন্য সবচেয়ে গুরুত্বপূর্ণ দুইটা আগে বেছে বাকিদের সীমা বাঁধতে হয়।'
    more: |
      যেমন টাকার অ্যাপে নিরাপত্তা আর availability আগে, ব্যক্তিগত ব্লগে খরচ আর maintainability আগে। বাছাইয়ের কারণ লিখে রাখাই আসল কাজ, কারণ পরে সবাই জানতে চাইবে "কেন এটা, ওটা নয়?"
    ref: choose-the-top-two

quiz:
  - q: 'নিচের কোনগুলো ভালো, মাপযোগ্য requirement?'
    hint: 'পরিস্থিতি, মাপকাঠি আর সংখ্যা তিনটাই আছে কি?'
    options:
      - text: '"ফ্ল্যাশ সেলে ৫০০ জন একসাথে ঢুকলে product page-এর p95 < ৪০০ms"'
        correct: true
        why: 'পরিস্থিতি, মাপকাঠি আর লক্ষ্য তিনটাই আছে। load test দিয়ে যাচাই করা যায়।'
      - text: '"মাসিক uptime >= ৯৯.৯%"'
        correct: true
        why: 'মাপকাঠি আর সংখ্যা আছে। মাসে প্রায় ৪৩ মিনিটের বেশি বন্ধ থাকা চলবে না।'
      - text: '"সিস্টেম খুব নিরাপদ হবে"'
        correct: false
        why: 'কীভাবে মাপা হবে, বা কত হলে "খুব" বলা যাবে, কিছুই নেই।'
      - text: '"সাইট যেন কখনো ধীর না হয়"'
        correct: false
        why: '"কখনো" আর "ধীর" দুটোই অস্পষ্ট; কতটা ধীর, কোন পরিস্থিতিতে, বলা নেই।'
    ref: measurable-requirements
  - q: 'নিচের requirement-এ কী অনুপস্থিত?'
    lang: yaml
    code: |
      - id: QA-3
        attribute: performance
        scenario: 'ব্যবহারকারী সার্চ করলে'
        target: 'দ্রুত উত্তর'
    hint: 'কতটা দ্রুত? কী মাপা হবে?'
    options:
      - text: 'মাপকাঠি (যেমন p95 latency) আর সংখ্যায় লক্ষ্য (যেমন < ২০০ms)'
        correct: true
        why: '"দ্রুত উত্তর" মাপা যায় না। সংখ্যা না থাকলে কাজ শেষ হলো কি না কেউ বলতে পারে না।'
      - text: 'আরও বড় একটা scenario বর্ণনা'
        correct: false
        why: 'বর্ণনা লম্বা হলেও মাপকাঠি ছাড়া কাজ হয় না।'
      - text: 'id-র ফরম্যাট'
        correct: false
        why: 'id এখানে সমস্যা নয়।'
      - text: 'কিছুই না, এটা ঠিক আছে'
        correct: false
        why: '"দ্রুত" শব্দটা পাঁচজনের কাছে পাঁচ রকম, তাই যাচাইয়ের উপায় নেই।'
    ref: measurable-requirements
  - q: 'ক্লায়েন্ট বলল, "৯৯.৯৯৯% uptime চাই।" তাকে সবচেয়ে ভালো কী বলবে?'
    hint: 'ক্লায়েন্টকে ব্যবসার ক্ষতির দিক থেকে ভাবাও।'
    options:
      - text: 'জিজ্ঞেস করবে "১ ঘণ্টা বন্ধ থাকলে ব্যবসার কত ক্ষতি?", আর সেই ক্ষতির সাথে খরচ মিলিয়ে লক্ষ্য ঠিক করবে'
        correct: true
        why: 'প্রতিটা বাড়তি নাইন বহুগুণ দামি। ক্ষতির চেয়ে খরচ বেশি হলে সেটা অপচয়।'
      - text: '"ঠিক আছে" বলে এগিয়ে যাবে'
        correct: false
        why: 'খরচ আর জটিলতা কয়েক গুণ বাড়বে, আর ক্লায়েন্ট তা জানে না।'
      - text: 'বলবে "এটা অসম্ভব", আর কথা শেষ'
        correct: false
        why: 'অসম্ভব নয়, অতি ব্যয়বহুল। আলোচনা দরকার।'
      - text: 'নিজে থেকে ৯৯% ঠিক করে দেবে'
        correct: false
        why: 'ক্লায়েন্টের ক্ষতি না জেনে সংখ্যা বসানো এলোমেলো অনুমান।'
    ref: choose-the-top-two
  - q: 'ইমরান cache যোগ করে পণ্যের পাতা ১০ গুণ দ্রুত করল। কোন গুণে কী দাম দিতে হতে পারে?'
    hint: 'cache কী জমিয়ে রাখে, আর জমানো জিনিস কখন পুরনো হয়?'
    options:
      - text: 'ডেটা বাসি হওয়ার ঝুঁকি আর cache চালানোর খরচ ও জটিলতা'
        correct: true
        why: 'cache জমানো উত্তর দেয়, তাই দাম বদলালেও পুরনো দাম দেখাতে পারে। সঠিকভাবে বাসি করার কাজ আলাদা জটিলতা।'
      - text: 'নিরাপত্তা বেড়ে যায়'
        correct: false
        why: 'cache নিজে নিরাপত্তা বাড়ায় না; ভুল cache-এ অন্যের ডেটাও দেখাতে পারে।'
      - text: 'কোনো দাম নেই, শুধু লাভ'
        correct: false
        why: 'প্রতিটা গুণের একটা দাম আছে; cache-এর দাম বাসি ডেটা ও জটিলতা।'
      - text: 'availability কমে, কারণ cache পুরো সার্ভার বন্ধ করে'
        correct: false
        why: 'cache সাধারণত availability বাড়ায় বা অপরিবর্তিত রাখে; ক্ষতি অন্য জায়গায়।'
    ref: five-attributes-tradeoff
  - q: 'একটা ব্যক্তিগত ব্লগ আর একটা মোবাইল ব্যাংকিং অ্যাপের জন্য গুণের অগ্রাধিকার কীভাবে আলাদা হওয়া উচিত?'
    hint: 'কোনটার ভাঙলে ক্ষতি বেশি?'
    options:
      - text: 'ব্যাংকিংয়ে নিরাপত্তা আর availability আগে; ব্লগে খরচ আর maintainability আগে'
        correct: true
        why: 'ক্ষতির মাত্রা আলাদা। টাকার অ্যাপের ভাঙনে বিশ্বাস ও টাকা দুটোই যায়, ব্লগে কয়েক ঘণ্টা বন্ধ চলে।'
      - text: 'দুটোতেই সব গুণ সর্বোচ্চ'
        correct: false
        why: 'ব্লগের জন্য সর্বোচ্চ availability-র খরচ অপচয়।'
      - text: 'ব্লগে নিরাপত্তা আগে, ব্যাংকিংয়ে খরচ আগে'
        correct: false
        why: 'উল্টো। টাকার অ্যাপে খরচ বাঁচাতে গিয়ে নিরাপত্তায় ছাড় চলে না।'
      - text: 'অগ্রাধিকার ঠিক করার দরকারই নেই'
        correct: false
        why: 'ঠিক না করলে ঝগড়া হয় রিলিজের পরে, যখন বদলানো সবচেয়ে দামি।'
    ref: choose-the-top-two
