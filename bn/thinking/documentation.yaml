      - type: code
        lang: text
        file: 'docs/adr/0021-email-queue-rabbitmq.md'
        code: |
          # ADR-0021: ইমেইলের queue RabbitMQ-তে সরানো

          তারিখ: ২০২৭-০৪-০৯
          অবস্থা: Accepted
          প্রতিস্থাপন করে: ADR-0007

          ## প্রসঙ্গ
          ADR-0007 বলেছিল মিনিটে ১০০০ message হলে আবার ভাবতে (সেকেন্ডে
          প্রায় ১৭টা)। এখন আসছে মিনিটে ১২০০।

          ## সিদ্ধান্ত
          ইমেইল RabbitMQ দিয়ে যাবে। Messenger-এর message class যেমন আছে থাকবে।

          ## ফলাফল
          - আরও একটা সার্ভিস চালাতে ও দেখতে হবে।
          + চাপ সামলায়; বদলটা শুধু transport config-এর।

          --- আর docs/adr/0007-email-via-messenger.md-এ বদলায় শুধু এটুকু:
          অবস্থা: Superseded by ADR-0021
        marks:
