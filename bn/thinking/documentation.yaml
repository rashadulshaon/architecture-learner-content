          - {line: 19, tip: 'পুরনো ফাইলে একমাত্র বদল এটুকু। প্রসঙ্গ আর কারণ থেকে যায়, তাই ইতিহাস পড়া যায়: তখন doctrine transport, এখন RabbitMQ।'}
