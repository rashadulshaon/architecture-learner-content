slides:
  - slug: nobody-remembers-why
    title: 'নতুন সদস্যের প্রশ্ন, যার উত্তর কারো মনে নেই'
    kind: story
    tldr: 'সিস্টেমের গঠন আর সিদ্ধান্তের কারণ যদি শুধু মানুষের মাথায় থাকে, তাহলে মানুষ গেলেই জ্ঞান হারায়; লিখে রাখার তিনটা সরঞ্জাম: C4, sequence, ADR।'
    keywords: ['documentation', 'architecture documentation', 'onboarding', 'knowledge loss', 'ডকুমেন্টেশন', 'নতুন সদস্য']
    blocks:
      - type: text
        body: |
          করিম কোম্পানিতে নতুন। সে জিজ্ঞেস করল, "রিপোর্ট সার্ভিসে কেন আলাদা MongoDB, বাকি সব তো PostgreSQL?" টিমের কেউ নিশ্চিত নয়: যিনি সিদ্ধান্ত নিয়েছিলেন তিনি দুই বছর আগে চলে গেছেন। হোয়াইটবোর্ডের একটা ছবি আছে, কিন্তু বাক্সগুলো কী, তীরগুলো কী — কেউ জানে না। করিম ভাবল, "এটা সরিয়ে দিলে কী ভাঙবে?" আর উত্তর খুঁজতে সপ্তাহ গেল।
      - type: visual
        kind: compare
        caption: 'কোড কী করে তা কোডে থাকে; এই তিনটা থাকে না'
        columns:
          - title: 'যা মাথায় থাকে, লেখা নেই'
            tone: bad
            icon: warning
            tip: 'এই তিনটা কোড পড়ে বোঝা যায় না, আর মানুষ চলে গেলে সাথে চলে যায়।'
            items:
              - 'সিস্টেম কোন কোন অংশ দিয়ে গড়া'
              - 'কে কাকে কীভাবে ডাকে'
              - 'কোন সিদ্ধান্ত কেন নেওয়া হলো'
          - title: 'যা লিখে রাখলে বাঁচে'
            tone: good
            icon: check
            tip: 'প্রতিটা প্রশ্নের জন্য একটা নির্দিষ্ট সরঞ্জাম আছে। তিনটাই ছোট, আর repository-তে থাকতে পারে।'
            items:
              - 'C4 ছবি: অংশগুলো ও তাদের সম্পর্ক'
              - 'Sequence diagram: ক্রমে কী ঘটে'
              - 'ADR: কেন এই সিদ্ধান্ত'
    aside:
      - type: story
        title: 'সরিয়ে দেওয়ার পর'
        body: |
          শেষে কেউ একজন MongoDB সরিয়ে PostgreSQL-এ নিল। দুই সপ্তাহ পরে ধরা পড়ল, রিপোর্টের একটা query MongoDB-র aggregation pipeline-এর জন্যই বানানো ছিল, আর পুরো রিপোর্ট ১২ গুণ ধীর হয়ে গেছে। কারণটা কোনো ADR-এ লেখা থাকলে সপ্তাহের খোঁজ এক মিনিটে মিটত।
      - type: remember
        body: 'কোড বলে সিস্টেম কী করে। কেন করে, তা বলে শুধু লেখা।'
    check:
      q: 'কোড পড়েই কেন সিদ্ধান্তের কারণ বোঝা যায় না?'
      a: 'কোড দেখায় কী করা হয়েছে, কেন করা হয়েছে তা দেখায় না। কারণ, বিকল্প আর বাধ্যবাধকতা মানুষের মাথায় থাকে, তাই আলাদা করে লিখে রাখতে হয়।'

  - slug: c4-zoom
    title: 'C4: মানচিত্রের মতো চার zoom'
    kind: concept
    tldr: 'C4 ছবি আঁকে চার স্তরে: Context, Container, Component, Code — মানচিত্রে zoom করার মতো, আর প্রতিটা ছবির একটাই zoom।'
    keywords: ['C4 model', 'context diagram', 'container diagram', 'component diagram', 'Simon Brown', 'architecture diagram']
    blocks:
      - type: metaphor
        icon: map
        title: 'মানচিত্রে zoom করা'
        body: |
          বাংলাদেশের মানচিত্রে প্রথমে দেখুন দেশ আর তার প্রতিবেশী। zoom করলে জেলা আর মহাসড়ক, আরও zoom করলে এলাকার রাস্তা, শেষে একটা বাড়ির ভেতরের নকশা। প্রতিটা zoom আলাদা প্রশ্নের উত্তর দেয়, আর একটা মানচিত্রে সব স্তর একসাথে ঠেসে দিলে কিছুই পড়া যায় না। C4-ও এমন।
      - type: visual
        kind: layers
        caption: 'C4-র চার স্তর, ওপর থেকে নিচে zoom'
        layers:
          - {label: 'Level 1 — Context', sub: 'সিস্টেম, তার ব্যবহারকারী ও বাইরের সিস্টেম', tone: accent, tip: 'দেশের মানচিত্র। নন-টেকনিক্যাল মানুষও বোঝে: আমাদের সিস্টেম কী, কার সাথে কথা বলে।'}
          - {label: 'Level 2 — Container', sub: 'চালানো যায় এমন অংশ: অ্যাপ, ডেটাবেস, queue', tip: 'জেলা-শহরের মানচিত্র। "Container" মানে আলাদাভাবে চালু হওয়া অংশ, Docker-ই হতে হবে এমন নয়।'}
          - {label: 'Level 3 — Component', sub: 'একটা container-এর ভেতরের মূল অংশ', tip: 'এলাকার মানচিত্র। যেমন Symfony API-র ভেতরে Catalog, Checkout, Billing module।'}
          - {label: 'Level 4 — Code', sub: 'class diagram, সাধারণত না আঁকলেও চলে', tone: muted, tip: 'বাড়ির ভেতরের নকশা। কোড বদলায় দ্রুত, তাই এই ছবি পুরনো হয়ে যায়। দরকার পড়লে IDE থেকে বের করুন।'}
      - type: visual
        kind: table
        caption: 'একটা অনলাইন দোকানের উদাহরণে প্রতিটা স্তর'
        headers: ['স্তর', 'কার জন্য', 'দোকানের ছবিতে কী থাকবে']
        rows:
          - cells: ['Context', 'সবাই, PM, নতুন সদস্য', 'ক্রেতা, অ্যাডমিন, Payment gateway, SMS vendor']
            tip: 'ভেতরের প্রযুক্তি এখানে দেখানো হয় না। শুধু বাইরের সম্পর্ক।'
          - cells: ['Container', 'ডেভেলপার, ops', 'Vue অ্যাপ, Symfony API, PostgreSQL, Redis, worker']
            tip: 'প্রতিটা বাক্সে প্রযুক্তির নাম আর তীরে প্রোটোকল (JSON/HTTPS, SQL) লেখা থাকে।'
          - cells: ['Component', 'যে টিম ওই container-এ কাজ করে', 'API-র ভেতরে Catalog, Checkout, Billing']
            tip: 'আগে ঠিক করা module সীমানাগুলো এখানে দেখা যায়।'
          - cells: ['Code', 'কদাচিৎ', 'class diagram — প্রয়োজনে স্বয়ংক্রিয়ভাবে বানান']
            tip: 'হাতে আঁকা class diagram কয়েক সপ্তাহেই বাসি। আঁকলে tool থেকে generate করুন।'
      - type: quote
        body: 'একটা ছবিতে একটাই zoom। আর প্রতিটা বাক্সে নাম, দায়িত্ব আর প্রযুক্তি।'
    aside:
      - type: tips
        items:
          - 'বেশিরভাগ টিমের জন্য Context আর Container ছবি দুটোই যথেষ্ট। Component আঁকুন শুধু যেখানে ভেতরটা জটিল।'
          - 'প্রতিটা তীরে একটা ক্রিয়া লিখুন ("পড়ে ও লেখে", "অর্ডারের event পাঠায়"), শুধু কালি-টানা তীর নয়।'
      - type: refs
        items:
          - {to: 'thinking/conways-law', label: 'Component-এর সীমানা আর টিম'}
    check:
      q: 'নতুন PM-কে সিস্টেম বোঝাতে C4-র কোন স্তরটা আগে দেখাবেন, আর কেন?'
      a: 'Context। সেখানে ভেতরের প্রযুক্তি নেই, শুধু আমাদের সিস্টেম, তার ব্যবহারকারী আর বাইরের সিস্টেম — তাই প্রযুক্তি না জেনেও বোঝা যায়।'

  - slug: sequence-diagram
    title: 'Sequence diagram: ক্রমে কী ঘটে'
    kind: howto
    tldr: 'C4 বলে কে কাকে চেনে; sequence diagram বলে কোন ক্রমে কী ঘটে — বিশেষ করে ব্যর্থতার শাখা সহ, যেটা বাক্স-তীরের ছবিতে ধরা পড়ে না।'
    keywords: ['sequence diagram', 'Mermaid', 'failure path', 'timeline', 'ক্রম', 'diagram as code']
    blocks:
      - type: text
        body: |
          C4 ছবি একটা মানচিত্র, তাতে সময় নেই। কিন্তু "টাকা কেটে timeout হলে কী হয়?" প্রশ্নের উত্তর সময়ের ক্রমে। তাই চেকআউটের একটা ঘটনার জন্য একটা sequence diagram আঁকুন, আর সুখী পথের পাশাপাশি ব্যর্থতার শাখাও দেখান।
      - type: visual
        kind: sequence
        caption: 'চেকআউট: সফল পথ আর timeout-এর পথ'
        actors:
          - {id: ui, label: 'Vue অ্যাপ', icon: browser, tip: 'ব্যবহারকারীর ব্রাউজারে চলা অংশ।'}
          - {id: api, label: 'Symfony API', icon: api, tip: 'চেকআউটের নিয়ম চালায় আর Payment API ডাকে।'}
          - {id: pay, label: 'Payment API', icon: card, tip: 'বাইরের সেবা। তার উত্তরের ওপর আমাদের নিয়ন্ত্রণ নেই।'}
        messages:
          - {from: ui, to: api, label: 'POST /checkout'}
          - {from: api, to: pay, label: 'charge + Idempotency-Key', tip: 'প্রতিটা order-এর একটা স্থির key, যাতে retry-তে দুইবার টাকা না কাটে।'}
          - {from: pay, to: api, label: 'সফল: 200 paid', dashed: true, tone: good}
          - {from: api, to: ui, label: '201 অর্ডার নিশ্চিত', dashed: true, tone: good}
          - {at: pay, note: 'timeout হলে উত্তরই আসে না', tone: warn, tip: 'এই শাখাই বাক্স-তীরের ছবিতে ধরা পড়ে না। এখানেই বেশিরভাগ ভুল লুকিয়ে থাকে।'}
          - {from: api, to: ui, label: '202 যাচাই চলছে', dashed: true, tone: warn, tip: 'টাকা কাটল কি না অজানা, তাই "নিশ্চিত" না বলে "যাচাই চলছে" বলা হয়।'}
      - type: code
        lang: text
        file: 'docs/sequences/checkout.md (Mermaid)'
        code: |
          sequenceDiagram
              participant U as Vue অ্যাপ
              participant A as Symfony API
              participant P as Payment API
              U->>A: POST /checkout
              A->>P: charge + Idempotency-Key
              alt সফল
                  P-->>A: 200 paid
                  A-->>U: 201 অর্ডার নিশ্চিত
              else timeout
                  P--xA: কোনো উত্তর নেই
                  A-->>U: 202 যাচাই চলছে
              end
        marks:
          - {line: 7, tip: '`alt` ... `else` ... `end` একটা পথের বিকল্প শাখা দেখায়। সুখী ও ব্যর্থ — দুটোই একই ছবিতে।'}
          - {line: 11, tip: '`--x` মানে এমন তীর, যা গন্তব্যে পৌঁছায়নি: উত্তর আসেনি।'}
    aside:
      - type: tips
        items:
          - 'একটা diagram, একটা ঘটনা। চার-পাঁচটার বেশি অংশগ্রহণকারী হলে ভেঙে দুই ছবি করুন।'
          - 'বার্তার নামে আসল API-র নাম লিখুন (`POST /checkout`), "অর্ডার প্রক্রিয়া" ধরনের অস্পষ্ট নাম নয়।'
          - 'Mermaid text হিসেবে repository-তে থাকে, GitHub বা GitLab নিজেই ছবি বানিয়ে দেখায়, আর pull request-এ বদল দেখা যায়।'
    check:
      q: 'C4 container ছবি থাকতেও আলাদা sequence diagram কেন লাগে?'
      a: 'Container ছবিতে সময় নেই; কে কাকে চেনে তা দেখা যায়, ক্রম আর ব্যর্থতার শাখা দেখা যায় না। timeout বা retry-র মতো প্রশ্নের উত্তর ক্রমে।'

  - slug: adr
    title: 'ADR: সিদ্ধান্তের দলিল'
    kind: howto
    tldr: 'ADR (Architecture Decision Record) একটা ছোট ফাইল: প্রসঙ্গ, সিদ্ধান্ত, বিকল্প আর ফলাফল; একবার লেখা হলে বদলানো হয় না, নতুন ADR পুরনোটাকে বাতিল করে।'
    keywords: ['ADR', 'architecture decision record', 'decision log', 'supersede', 'সিদ্ধান্তের নথি', 'Michael Nygard']
    blocks:
      - type: text
        body: |
          আদালতের রায়ের মতো ভাবুন: পুরনো রায় মুছে ফেলা হয় না, নতুন রায় আগেরটাকে বাতিল করে দেয়। ADR ঠিক এমন। প্রতিটা বড় সিদ্ধান্তের জন্য এক পাতার একটা ফাইল, `docs/adr/0007-email-via-messenger.md`-এর মতো নম্বরসহ। পরে কেউ জানতে চাইলে কারণটা সেখানেই পাবেন।
      - type: code
        lang: text
        file: 'docs/adr/0007-email-via-messenger.md'
        code: |
          # ADR-0007: ইমেইল পাঠানো Messenger দিয়ে async

          তারিখ: ২০২৬-০৩-১৪
          অবস্থা: Accepted

          ## প্রসঙ্গ
          চেকআউটে ইমেইল পাঠাতে গড়ে ৪ সেকেন্ড লাগে। ইমেইল সার্ভিস
          ধীর বা বন্ধ হলে অর্ডারও ফেল করে। টিম ৪ জন, আলাদা queue
          সার্ভিস চালানোর লোক নেই।

          ## সিদ্ধান্ত
          Symfony Messenger-এর doctrine transport দিয়ে ইমেইল worker-এ পাঠাব।

          ## বিকল্প যা বাদ গেল
          - RabbitMQ: এখনই দরকার নেই, চালানোর খরচ বেশি।
          - request-এর ভেতরেই পাঠানো: ধীরতা ও ফেল থেকে যায়।

          ## ফলাফল
          + অর্ডার আর ইমেইলের ধীরতার ওপর নির্ভর করে না।
          - ইমেইল কয়েক সেকেন্ড দেরিতে পৌঁছায়; worker চালু রাখতে হয়।
          পুনর্বিবেচনা: মিনিটে ১০০০ message ছাড়ালে RabbitMQ দেখব।
        marks:
