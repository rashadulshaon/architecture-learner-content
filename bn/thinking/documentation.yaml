  - slug: docs-that-rot
    title: 'বাসি হয়ে যাওয়া ডকুমেন্ট'
    kind: pitfall
    tldr: 'wiki-র ছবি কোডের সাথে মেলে না বলে দুই বছরে বাসি; diagram আর ADR কোডের পাশে repository-তে রাখলে pull request-এই হালনাগাদ হয়।'
    keywords: ['docs as code', 'stale documentation', 'Structurizr', 'wiki', 'repository docs', 'বাসি ডকুমেন্ট']
    blocks:
      - type: text
        body: |
          সবচেয়ে সাধারণ ভুল: সুন্দর ছবি Confluence বা Google Slides-এ আঁকা, কোডের কাছে নয়। কোড বদলায়, ছবি বদলায় না, আর দুই বছরে সেটা মিথ্যা বলা শুরু করে। বাসি ডকুমেন্ট না-থাকার চেয়ে খারাপ, কারণ মানুষ সেটা বিশ্বাস করে। সমাধান: ছবিকেও কোডের মতো ফাইল বানিয়ে repository-তে রাখুন।
      - type: code
        lang: text
        file: 'docs/architecture/workspace.dsl (Structurizr)'
        variant: good
        code: |
          workspace {
              model {
                  customer = person "ক্রেতা"
                  shop = softwareSystem "Online Shop" {
                      spa = container "Vue অ্যাপ" "UI" "Vue 3"
                      api = container "Symfony API" "চেকআউটের নিয়ম" "PHP 8.3, Symfony"
                      db = container "ডেটাবেস" "অর্ডার ও পণ্য" "PostgreSQL"
                  }
                  pay = softwareSystem "Payment gateway" "বাইরের সেবা"

                  customer -> spa "ব্রাউজ ও অর্ডার করে"
                  spa -> api "JSON/HTTPS"
                  api -> db "পড়ে ও লেখে"
                  api -> pay "charge পাঠায়"
              }
              views {
                  container shop {
                      include *
                      autoLayout lr
                  }
              }
          }
        marks:
          - {line: 4, tip: 'softwareSystem-এর ভেতরে container: C4-র দ্বিতীয় স্তর। বাক্সগুলোর নাম, দায়িত্ব আর প্রযুক্তি ফাইলেই লেখা।'}
          - {line: 11, tip: 'সম্পর্কের ক্রিয়াও ফাইলে। তীর বদলাতে ফাইলের এক লাইন বদলালেই ছবি নিজে বদলায়।'}
          - {line: 17, tip: 'এই view থেকে tool নিজে ছবি বানিয়ে দেয়, হাতে বাক্স টানতে হয় না।'}
      - type: code
        lang: text
        file: 'একটা pull request, দুটো ফাইল'
        variant: good
        code: |
          # PR #482: "অর্ডার পাঠানো হলে SMS যাবে"
          src/Service/ShipmentNotifier.php
          + $this->texter->send(new SmsMessage($order->getPhone(), $text));
          docs/architecture/workspace.dsl
          + sms = softwareSystem "SMS vendor" "বাইরের সেবা"
          + api -> sms "ডেলিভারির SMS পাঠায়"
        marks:
          - {line: 5, tip: 'ছবির বদল কোডের pull request-এই। রিভিউয়ার দুটো একসাথে দেখে বলতে পারেন: "কোড SMS vendor ডাকছে, কিন্তু ছবিতে নেই"।'}
      - type: points
        title: 'ডকুমেন্ট তাজা রাখার নিয়ম'
        style: check
        items:
          - 'ছবি আর ADR থাকবে কোডের repository-তে, `docs/` ফোল্ডারে।'
          - 'কোডের বদলের সাথে ছবির বদল একই pull request-এ, একই review-তে।'
          - 'CI-তে diagram file validate করুন, যাতে ভাঙা ফাইল merge না হয়।'
    aside:
      - type: commands
        title: 'Structurizr CLI'
        items:
          - {cmd: 'structurizr.sh validate -workspace docs/architecture/workspace.dsl', desc: 'DSL ফাইল ঠিক আছে কি না যাচাই'}
          - {cmd: 'structurizr.sh export -workspace docs/architecture/workspace.dsl -format mermaid', desc: 'diagram Mermaid-এ রপ্তানি'}
      - type: remember
        body: 'যে ডকুমেন্ট কোডের পাশে নেই, সে কোডের সাথে বাঁচে না।'
      - type: tips
        items:
          - 'দাম আছে: CI ফাইল ঠিক আছে কি না দেখে, সত্যি কি না দেখে না। review-তে জিজ্ঞেস করুন: "এই বদল কি ছবিতেও হাত দিয়েছে?"'
          - 'ছোট টিম Mermaid ফাইল দিয়ে শুরু করতে পারে: GitHub ছবি দেখায়, বাড়তি tool বসাতে হয় না।'
      - type: terms
        items:
          - {term: 'Wiki', meaning: 'টিমের সবাই মিলে পাতা লেখার ওয়েবসাইট, যেমন Confluence। কোড থেকে আলাদা, তাই কোড বদলালে এটাও বদলাবে এমন কোনো বাধ্যতা নেই।'}
    check:
      q: 'Wiki-তে আঁকা ছবি repository-তে diagram-as-code-এর চেয়ে বাসি হয় কেন?'
      a: 'কোড বদলানোর সময় কেউ wiki খুলে ছবি বদলানোর কথা মনে রাখে না। repository-তে একই pull request-এ ছবির ফাইলও review হয়, তাই কম বাসি হয়।'

flashcards:
  - q: 'C4 model কী?'
    a: 'সফটওয়্যার আর্কিটেকচার আঁকার চার স্তর: Context, Container, Component, Code — মানচিত্রে zoom করার মতো।'
    more: |
      প্রতিটা স্তর আলাদা প্রশ্নের উত্তর দেয়, আর একটা ছবিতে একটাই স্তর থাকে। বেশিরভাগ টিমের জন্য Context আর Container ছবি যথেষ্ট। Simon Brown এই পদ্ধতি জনপ্রিয় করেছেন।
    ref: c4-zoom
  - q: 'C4-র Context diagram কী দেখায়, আর কার জন্য?'
    a: 'আমাদের সিস্টেম, তার ব্যবহারকারী আর বাইরের সিস্টেম। প্রযুক্তি নয়, সম্পর্ক। সবার জন্য, নন-টেকনিক্যাল মানুষের জন্যও।'
    more: |
      যেমন অনলাইন দোকানের Context-এ থাকবে ক্রেতা, অ্যাডমিন, Payment gateway আর SMS vendor। ভেতরে কী প্রযুক্তি তা এখানে লেখা হয় না। নতুন সদস্য বা PM-কে প্রথমে এই ছবিটাই দেখানো হয়।
    ref: c4-zoom
  - q: 'C4-তে "Container" বলতে কী বোঝায়?'
    a: 'আলাদাভাবে চালু হওয়া ও deploy হওয়া একটা অংশ: Vue অ্যাপ, Symfony API, ডেটাবেস, worker। Docker container-ই হতে হবে এমন নয়।'
    more: |
      নামটা বিভ্রান্তিকর। এখানে container মানে "ডেটা রাখে বা কোড চালায়" এমন যেকোনো আলাদা অংশ। প্রতিটা বাক্সে নাম, দায়িত্ব আর প্রযুক্তি লেখা থাকে, আর তীরে প্রোটোকল।
    ref: c4-zoom
  - q: 'Sequence diagram কখন আঁকবেন?'
    a: 'যখন ক্রম আর ব্যর্থতার শাখা গুরুত্বপূর্ণ: চেকআউট, retry, timeout, webhook-এর মতো ঘটনা।'
    more: |
      C4 ছবিতে সময় নেই, তাই "টাকা কেটে timeout হলে কী হয়?" তাতে ধরা পড়ে না। একটা ঘটনার জন্য একটা diagram, সুখী ও ব্যর্থ — দুটো পথই, আর বার্তার নামে আসল API-র নাম। Mermaid text হিসেবে repository-তে রাখা যায়।
    ref: sequence-diagram
  - q: 'ADR (Architecture Decision Record) কী?'
    a: 'একটা বড় সিদ্ধান্তের ছোট নথি: প্রসঙ্গ, সিদ্ধান্ত, বাদ-যাওয়া বিকল্প আর ফলাফল।'
    more: |
      `docs/adr/0007-...md`-এর মতো নম্বর দিয়ে repository-তে থাকে। পরে কেউ "কেন এভাবে?" জিজ্ঞেস করলে উত্তর পাবেন। শুধু কঠিন-বদলানো বা বিতর্কিত সিদ্ধান্তের জন্য লিখুন।
    ref: adr
  - q: 'একটা সিদ্ধান্ত বদলালে ADR-এর কী হয়?'
    a: 'পুরনো ADR সম্পাদনা হয় না। নতুন ADR লেখা হয়, আর পুরনোটার অবস্থা "Superseded by ..." হয়।'
    more: |
      আদালতের রায়ের মতো, ইতিহাস মুছে ফেলা হয় না। ফলে ভবিষ্যতে কেউ দেখতে পারে কখন কী কারণে সিদ্ধান্ত বদলাল। অবস্থাগুলো: Proposed, Accepted, Superseded (বা Deprecated)।
    ref: adr
  - q: 'কেন diagram আর ADR repository-তে কোডের পাশে রাখা ভালো?'
    a: 'কারণ কোডের বদলের সাথে একই pull request-এ ছবি বা সিদ্ধান্তও হালনাগাদ ও review হয়, তাই বাসি হয় কম।'
    more: |
      wiki-র ছবি কেউ কোড বদলানোর সময় মনে রাখে না, আর কয়েক বছরে মিথ্যা বলে। Mermaid বা Structurizr DSL ফাইল হিসেবে রাখলে diff দেখা যায়, CI-তে validate করা যায়, আর GitHub নিজেই ছবি বানিয়ে দেখায়।
    ref: docs-that-rot
  - q: 'ছবি repository-তে রাখলেই কি তা সত্য থাকে?'
    a: 'না। CI দেখে ফাইল বৈধ কি না, সত্য কি না নয়। রিভিউয়ারকে তবু জিজ্ঞেস করতে হয়: এই বদল কি ছবিতে হাত দিয়েছে?'
    more: |
      repository শুধু সমাধানটাকে সস্তা করে: কোডের pull request-এই ছবি বদলায়, আর diff-এ সেটা দেখা যায়। তবু কাউকে দেখতে হয়। প্রশ্নটা pull request-এর checklist-এ রেখে দিন, যাতে প্রতিবার জিজ্ঞাসা হয়।
    ref: docs-that-rot

quiz:
  - q: 'নতুন প্রোডাক্ট ম্যানেজারকে ১০ মিনিটে বোঝাতে হবে আমাদের সিস্টেম কী, কার সাথে কথা বলে। কোন ছবি সবচেয়ে ভালো?'
    hint: 'সে প্রযুক্তি জানে না।'
    options:
      - text: 'C4 Context diagram'
        correct: true
        why: 'ভেতরের প্রযুক্তি ছাড়াই দেখায় সিস্টেম, ব্যবহারকারী ও বাইরের সিস্টেম।'
      - text: 'C4 Code diagram (class diagram)'
        correct: false
        why: 'এটা সবচেয়ে ভেতরের স্তর, নতুন PM-এর জন্য অতি খুঁটিনাটি।'
      - text: 'Component diagram'
        correct: false
        why: 'এটা container-এর ভেতরের অংশ দেখায়, যা PM-এর প্রয়োজনে অনেক বেশি।'
      - text: 'ডেটাবেসের পুরো schema'
        correct: false
        why: 'schema ভেতরের বিস্তারিত; সিস্টেমের বাইরের সম্পর্ক এতে বোঝা যায় না।'
    ref: c4-zoom
  - q: 'চেকআউটে Payment API-র timeout হলে কী হয় — এই প্রশ্নের উত্তর দেওয়ার জন্য কোন ছবি সবচেয়ে উপযুক্ত?'
    hint: 'প্রশ্নটা কোন জিনিস নিয়ে: কাঠামো, না ক্রম?'
    options:
      - text: 'সুখী ও timeout-এর দুই শাখাসহ sequence diagram'
        correct: true
        why: 'প্রশ্নটা সময়ের ক্রম আর ব্যর্থতার শাখা নিয়ে, যা sequence diagram-এ সরাসরি দেখা যায়।'
      - text: 'C4 Container diagram'
        correct: false
        why: 'কে কাকে ডাকে দেখায়, কিন্তু ক্রম বা timeout-এ কী ঘটে তা দেখায় না।'
      - text: 'C4 Context diagram'
        correct: false
        why: 'এটা আরও ওপরের স্তর; ব্যর্থতার ক্রম এতে নেই।'
      - text: 'টিমের org chart'
        correct: false
        why: 'টিম কাঠামো, সিস্টেমের ক্রম নয়।'
    ref: sequence-diagram
  - q: 'একটা ভালো ADR-এ নিচের কোনগুলো থাকে?'
    hint: 'কারণ, বিকল্প আর মূল্য — তিনটাই চাই।'
    options:
      - text: 'প্রসঙ্গ: কোন সমস্যা ও কোন বাধ্যবাধকতা, সংখ্যা সহ'
        correct: true
        why: 'প্রসঙ্গ ছাড়া ভবিষ্যতের পাঠক বোঝে না সিদ্ধান্ত কেন নেওয়া হয়েছিল।'
      - text: 'যে বিকল্পগুলো বাদ গেল ও কেন'
        correct: true
        why: 'একই প্রস্তাব আবার উঠলে উত্তর এখানেই থাকে।'
      - text: 'ফলাফল: ভালো ও মন্দ দুটোই, আর পুনর্বিবেচনার trigger'
        correct: true
        why: 'কোনো সিদ্ধান্তই বিনা মূল্যে নয়; মূল্যটা লেখা থাকলে পরে সৎ আলোচনা হয়।'
      - text: 'পুরো কোড, যাতে সিদ্ধান্ত হুবহু পুনরুৎপাদন করা যায়'
        correct: false
        why: 'ADR সিদ্ধান্তের কারণ লেখে, কোডের কপি নয়। কোড repository-তে আছেই।'
    ref: adr
  - q: 'ADR-0007 বলছে "ইমেইল Messenger-এর doctrine transport দিয়ে"। এক বছর পরে মিনিটে ১২০০ message আসছে, তাই RabbitMQ-তে যাওয়া হলো। কী করা উচিত?'
    hint: 'ইতিহাস মুছবে না।'
    options:
      - text: 'নতুন ADR-0021 লিখে ADR-0007-এর অবস্থা "Superseded by ADR-0021" করা'
        correct: true
        why: 'ইতিহাস থাকে: আগে কেন doctrine transport ছিল, আর এখন কেন RabbitMQ।'
      - text: 'ADR-0007-এর লেখা মুছে RabbitMQ লিখে দেওয়া'
        correct: false
        why: 'পুরনো প্রসঙ্গ আর কারণ হারিয়ে যায়; ভবিষ্যতে কেউ বুঝবে না কেন বদলাল।'
      - text: 'কিছু না করা, কোডই তো সত্য'
        correct: false
        why: 'কোড বলে কী আছে, কেন তা নয়; আর ADR-0007 এখন ভুল তথ্য দেবে।'
      - text: 'ADR-0007 মুছে ফেলা'
        correct: false
        why: 'ইতিহাস মুছে ফেললে "কেন বদলালাম" প্রশ্নের উত্তরও মুছে যায়।'
    ref: adr
  - q: 'দুই বছর আগে Confluence-এ আঁকা architecture diagram-এ একটা সার্ভিস আছে যা কোডে আর নেই। মূল সমস্যা কী, আর প্রতিকার কী?'
    hint: 'ছবি কোডের কাছে নেই, তাই কে হালনাগাদ করবে?'
    options:
      - text: 'ছবি কোড থেকে দূরে, তাই হালনাগাদ হয়নি; ছবি diagram-as-code হয়ে repository-তে থেকে PR-এ বদলাক'
        correct: true
        why: 'কোডের বদলের সাথে ছবির বদল একই review-তে এলে বাসি হওয়া কমে।'
      - text: 'Confluence ধীর; অন্য wiki tool বেছে নেওয়া'
        correct: false
        why: 'যে wiki-ই হোক, কোড থেকে দূরে থাকলে একই বাসি হওয়ার সমস্যা থাকবে।'
      - text: 'ছবি আঁকাই ভুল; শুধু কোড পড়াই যথেষ্ট'
        correct: false
        why: 'কোড কাঠামো, সম্পর্ক বা সিদ্ধান্তের কারণ দ্রুত দেখায় না। ছবি দরকার, শুধু সতেজ রাখতে হবে।'
      - text: 'প্রতি বছর একবার সব ছবি নতুন করে আঁকা'
        correct: false
        why: 'বছরে একবার হালনাগাদে বাকি এগারো মাস ছবি মিথ্যা বলে।'
    ref: docs-that-rot
