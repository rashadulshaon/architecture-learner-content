          - 'দেরির পেমেন্টে সিটটা এখনো খালি থাকলে confirm করা বৈধ কি না, সেটা বিজনেস সিদ্ধান্ত। করলেও CAS দিয়ে করুন, শুধু `status` দেখে নয়।'
          - 'hold-এর মেয়াদ পেমেন্ট-সময়ের চেয়ে ছোট হলে এমন ঘটনা রোজ ঘটবে। গেটওয়ের সর্বোচ্চ সময়ের চেয়ে বড় মেয়াদ রাখুন।'
