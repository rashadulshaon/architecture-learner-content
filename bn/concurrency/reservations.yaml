        title: 'দেরির পেমেন্ট এলে'
        style: check
        items:
          - 'confirm আগের মতো CAS দিয়ে করুন; ০ এলে সিট আর নেই।'
          - 'সিট না থাকলে গেটওয়েতে স্বয়ংক্রিয় refund পাঠান।'
          - 'ব্যবহারকারীকে বলুন কী হয়েছে, আর নতুন সিট বেছে নিতে দিন।'
      - type: code
        lang: php
        file: 'src/MessageHandler/PaymentSucceededHandler.php'
        variant: good
        code: |
          #[AsMessageHandler]
          final readonly class PaymentSucceededHandler
          {
              public function __construct(
                  private SeatHolder $holder,
                  private PaymentGateway $gateway,
                  private NotifierInterface $notifier,
              ) {
              }

              public function __invoke(PaymentSucceeded $event): void
              {
                  try {
                      $this->holder->confirm($event->reservationId);
                  } catch (HoldExpired) {
                      // সিট আর নেই: refund-এর key payment id থেকে, তাই retry হলেও দুবার refund হয় না
                      $this->gateway->refund(
                          $event->paymentId,
                          idempotencyKey: 'refund-'.$event->paymentId,
                      );
                      $this->notifier->send(
                          new SeatLostNotification($event->reservationId),
                          $event->recipient,
                      );
                  }
              }
          }
        marks:
          - {line: 15, tip: 'confirm() HoldExpired ছুড়েছে, মানে ০টা সারি বদলেছে: সিটটা আর রহিমের নয়।'}
          - {line: 19, tip: 'key বানানো payment id থেকে, তাই message দুবার এলেও গেটওয়ে একবারই refund করে।'}
