      a: 'confirm ব্যর্থ হয় (০টা সারি), সিস্টেম গেটওয়েতে refund পাঠায় আর রহিমকে পরিষ্কার জানিয়ে অন্য সিট বেছে নিতে দেয়। চুপচাপ দুজনকে একই সিট দেওয়া চলবে না।'

flashcards:
  - q: 'Reservation (hold) কী?'
    a: 'মেয়াদসহ কিছু সময়ের জন্য কারো নামে সিট, slot বা স্টক ধরে রাখা। মেয়াদের মধ্যে confirm না হলে আবার ছাড়া পড়ে।'
    more: |
      পেমেন্ট বা সিদ্ধান্তের সময়টুকু জিনিসটা অন্য কেউ নিতে পারে না, কিন্তু চিরকালও আটকে থাকে না। ট্রেনের ই-টিকিটের ১০ মিনিটের মতো।
    ref: seat-in-limbo
  - q: 'পেমেন্টের পরে সিট বুক করা কেন ঝুঁকিপূর্ণ?'
    a: 'পেমেন্টের মাঝে অন্য কেউ সিট নিয়ে নিতে পারে। তখন টাকা কাটার পরে ব্যবহারকারী “সিট শেষ” শোনে, আর refund লাগে।'
    more: |
      তাই সিট আগে hold করুন, তারপর পেমেন্ট। hold পেমেন্টের সময়টুকু সিট নিশ্চিত রাখে। পেমেন্ট ব্যর্থ বা বাতিল হলে hold-এর মেয়াদ ফুরায় বা নিজে ছাড়া যায়।
    ref: seat-in-limbo
  - q: 'মেয়াদ ছাড়া hold-এ কী সমস্যা?'
    a: 'যারা পেমেন্ট না করে চলে গেছে, তাদের hold চিরকাল সিট আটকে রাখে। অন্যরা “শেষ” দেখে, অথচ সিট আসলে খালি।'
    more: |
      ছেড়ে-যাওয়া কার্ট খুবই সাধারণ। মেয়াদ থাকলে অব্যবহৃত hold নিজে থেকে ফুরায় আর সিট বিক্রির আওতায় ফেরে।
    ref: seat-in-limbo
  - q: 'Reservation রেকর্ডের কোন অবস্থাগুলো আছে?'
    a: 'held (মেয়াদসহ ধরা), confirmed (পাকা), expired (মেয়াদ শেষ) আর cancelled (নিজে ছেড়েছে)। শেষ তিনটা থেকে আর ফেরা নেই।'
    more: |
      সবই একটা কলামে (status) থাকে, সাথে expires_at। অবৈধ transition (যেমন expired থেকে confirmed) আটকাতে প্রতিটা বদল UPDATE-এর WHERE-এ আগের অবস্থা শর্ত করা হয়।
    ref: reservation-states
  - q: 'দুজন একই সিটে একসাথে hold চাইলে কীভাবে একজনই পায়?'
    a: 'reservation table-এ `UNIQUE (seat_id) WHERE status IN (''held'', ''confirmed'')`। দ্বিতীয় insert unique constraint-এ ব্যর্থ হয়।'
    more: |
      Partial unique index শুধু সক্রিয় দাবির ওপর নিয়ম বসায়; expired আর cancelled সারি যত খুশি থাকতে পারে। ব্যর্থ insert-এর UniqueConstraintViolationException ধরে SeatTaken দেখান।
    ref: hold-implementation
  - q: 'মেয়াদ-পেরোনো পুরনো hold কেন নতুন hold-এর আগে সরাতে হয়?'
    a: 'রেকর্ডে এখনো status ‘held’ থাকে, তাই unique index সেটাকে সক্রিয় ধরে নতুন hold আটকে দেয়। আগে সেটাকে expired করুন।'
    more: |
      নতুন hold-এর transaction-এ আগে `UPDATE … SET status = 'expired' WHERE seat_id = :seat AND status = 'held' AND expires_at <= :now` চালান। এতে cleanup job দেরি করলেও সিট খালি হয়ে যায়।
    ref: hold-implementation
  - q: 'পণ্যের স্টকের জন্য reservation কীভাবে চলে?'
    a: 'স্টক কলামের পাশে `reserved` রাখুন। hold-এ `UPDATE … SET reserved = reserved + n WHERE stock - reserved >= n`, মেয়াদ ফুরালে কমান।'
    more: |
      সিটের মতো আলাদা সারির বদলে এখানে সংখ্যা গোনা হয়। তবু প্রতিটা hold-এর আলাদা reservation সারি রাখতে হয়, নইলে মেয়াদ ফুরালে কতটা ফেরত যাবে জানা যায় না।
    ref: hold-implementation
  - q: 'Confirm করার সময় কী কী শর্ত দেখতে হয়?'
    a: 'অবস্থা এখনো held, আর expires_at এখনো ভবিষ্যতে। দুটো এক UPDATE-এর WHERE-এ; ০টা সারি বদলালে confirm হয়নি।'
    more: |
      এটা compare-and-swap। এতে মেয়াদ পেরোনো বা বাতিল hold-এ confirm আটকে যায়। ০ এলে HoldExpired ছুড়ে refund বা নতুন সিট বাছাইয়ের পথ দেখান।
    ref: confirm-and-cleanup
  - q: 'Cleanup job বন্ধ থাকলে কি hold-এর শুদ্ধতা নষ্ট হয়?'
    a: 'না। confirm আর নতুন hold দুটোই নিজে expires_at দেখে। cleanup শুধু রেকর্ড পরিষ্কার রাখে, শুদ্ধতার ভার তার ওপর নেই।'
    more: |
      নিয়ম: মেয়াদ যাচাই হয় ব্যবহারের মুহূর্তে। Symfony Scheduler-এর `#[AsPeriodicTask]` দিয়ে প্রতি মিনিটে expired করার কাজ চালানো যায়, কিন্তু সেটা শুধু ঝাড়ু।
    ref: confirm-and-cleanup
  - q: 'মেয়াদ পেরিয়ে পেমেন্ট এলে কী করবেন?'
    a: 'confirm CAS দিয়ে করুন; ০ এলে সিট নেই, তাই গেটওয়েতে refund পাঠান আর ব্যবহারকারীকে জানান। চুপচাপ একই সিট দুজনকে দেবেন না।'
    more: |
      ধীর গেটওয়ের কারণে এমন ঘটবেই। hold-এর মেয়াদ পেমেন্টের সর্বোচ্চ সময়ের চেয়ে বড় রাখলে ঘটনা কমে, কিন্তু শূন্য হয় না। তাই refund-এর পথ সবসময় তৈরি রাখুন।
    ref: late-payment
  - q: 'Refund-এর অনুরোধে payment id থেকে বানানো idempotency key দেওয়া হয় কেন?'
    a: 'পেমেন্টের message দুবার পৌঁছাতে পারে। একই key থাকলে গেটওয়ে একবার refund করে, পুনরাবৃত্তি উপেক্ষা করে।'
    more: |
      Message queue অন্তত একবার পৌঁছে দেয়, তাই একই পেমেন্টের জন্য handler দুবার চলতে পারে। key না থাকলে ক্রেতা দুবার refund পেয়ে যেতে পারেন। `refund-<payment id>` key থাকলে দ্বিতীয় অনুরোধটা পুনরাবৃত্তি বলে চেনা যায় আর কিছুই করে না।
    ref: late-payment

quiz:
  - q: 'পেমেন্টের ১০ মিনিটে সিট সামলানোর সবচেয়ে ভালো উপায় কোনটা?'
    hint: 'দুই দিকের সমস্যাই ভাবুন: পেমেন্টের মাঝে সিট হারানো আর ছেড়ে যাওয়া ব্যবহারকারীর সিট আটকা।'
    options:
      - text: 'পেমেন্ট সফল হলে তারপর সিট বুক করা'
        correct: false
        why: 'পেমেন্ট চলাকালে অন্য কেউ সিট নিয়ে নিতে পারে; টাকা কেটে “শেষ” শুনতে হয়।'
      - text: 'সিট বেছে নেওয়ামাত্র চিরকালের জন্য আটকে দেওয়া'
        correct: false
        why: 'পেমেন্ট না করে চলে যাওয়াদের সিট কখনো ছাড়বে না।'
      - text: '১০ মিনিটের মেয়াদী hold, মেয়াদে confirm না হলে সিট খালি'
        correct: true
        why: 'পেমেন্টের সময়ে সিট নিশ্চিত, আর ছেড়ে-যাওয়া hold নিজে ফুরায়।'
      - text: 'ব্রাউজারে একটা টাইমার দিয়ে সিট ধরে রাখা'
        correct: false
        why: 'ব্রাউজারে কিছু নেই সার্ভারে; ক্লায়েন্টের টাইমার সিট ধরে রাখে না, শুধু ব্যবহারকারীকে সময় দেখায়।'
    ref: seat-in-limbo
  - q: 'নিচের কোন কোন অবস্থা থেকে একটা reservation আর ফেরে না?'
    hint: 'held-এর তিন পথ ভাবুন।'
    options:
      - text: 'confirmed'
        correct: true
        why: 'পাকা বুকিং; এটা শেষ অবস্থা।'
      - text: 'expired'
        correct: true
        why: 'মেয়াদ ফুরিয়েছে, সিট ছাড়া পড়েছে; আগের hold আর জীবিত হয় না, নতুন hold বানাতে হয়।'
      - text: 'cancelled'
        correct: true
        why: 'ব্যবহারকারী নিজে ছেড়েছে, এটাও শেষ অবস্থা।'
      - text: 'held'
        correct: false
        why: 'held-ই একমাত্র চলমান অবস্থা; এখান থেকে তিন দিকে যাওয়া যায়।'
    ref: reservation-states
  - q: 'নিচের index কী নিশ্চিত করে?'
    lang: sql
    code: |
      CREATE UNIQUE INDEX one_active_reservation
          ON reservation (seat_id) WHERE status IN ('held', 'confirmed');
    hint: 'WHERE অংশটা কোন সারিগুলোর ওপর নিয়ম বসায়?'
    options:
      - text: 'একটা সিটে একসাথে একটাই সক্রিয় (held বা confirmed) reservation থাকতে পারে'
        correct: true
        why: 'expired বা cancelled সারি unique-র আওতার বাইরে, তাই ইতিহাস রাখা যায়।'
      - text: 'প্রতিটা সিটে সারা জীবনে একটাই reservation থাকবে'
        correct: false
        why: 'WHERE শর্তের কারণে শুধু সক্রিয় সারিগুলো গোনা হয়; বাকিরা যত খুশি।'
      - text: 'একজন ব্যবহারকারী একটাই সিট ধরতে পারবে'
        correct: false
        why: 'index শুধু seat_id-র ওপর, user_id-র ওপর নয়।'
      - text: 'মেয়াদ-পেরোনো hold নিজে থেকে expired হয়ে যাবে'
        correct: false
        why: 'index কিছুই বদলায় না; মেয়াদ-পেরোনো সারি আগে expired করতে হয়।'
    ref: hold-implementation
  - q: 'নতুন hold বানাতে গিয়ে ব্যবহারকারী বারবার “সিট নেই” পাচ্ছে, অথচ সিটের পুরনো hold-এর মেয়াদ কবেই গেছে। কেন হতে পারে?'
    hint: 'মেয়াদ পেরোলে রেকর্ডের status নিজে বদলায় কি?'
    options:
      - text: 'রেকর্ডে এখনো status = held, তাই unique index সেটাকে সক্রিয় ধরছে; আগে expired না করায়'
        correct: true
        why: 'মেয়াদ নিজে status বদলায় না। নতুন hold-এর আগে মেয়াদ-পেরোনোগুলো expired করতে হয়।'
      - text: 'ডেটাবেসের ঘড়ি ভুল'
        correct: false
        why: 'ঘড়ি ঠিক থাকলেও এই সমস্যা হতো; কারণ status বদলায়নি।'
      - text: 'unique index-এ WHERE থাকা উচিত নয়'
        correct: false
        why: 'partial index-ই সঠিক নকশা; এটা সরালে expired সারিই বাধা দেবে।'
    ref: hold-implementation
  - q: 'নিচের কোডে confirm করা কেন নিরাপদ, আর `=== 0` হলে কী বোঝায়?'
    lang: php
    code: |
      $confirmed = $em->createQuery(
          "UPDATE App\Entity\Reservation r SET r.status = 'confirmed'
           WHERE r.id = :id AND r.status = 'held' AND r.expiresAt > :now"
      )->setParameter('id', $id)->setParameter('now', $now)->execute();
    hint: 'WHERE-এ দুইটা শর্ত আছে।'
    options:
      - text: '০ মানে hold আর বৈধ নেই: মেয়াদ গেছে বা বাতিল হয়েছে'
        correct: true
        why: 'শর্ত দুটো না মিললে কোনো সারি বদলায় না। তখন confirm করা যাবে না।'
      - text: '০ মানে ডেটাবেস ব্যস্ত ছিল, আবার চেষ্টা করলেই হবে'
        correct: false
        why: 'কারণটা ব্যস্ততা নয়; শর্ত মেলেনি। একই মেয়াদে আবার চেষ্টা করলে একই ফল।'
      - text: '০ মানে confirm সফল, শুধু নতুন কিছু বদলানোর ছিল না'
        correct: false
        why: '০ মানে কোনো সারি confirmed হয়নি। এটাকে সফলতা ধরলে মেয়াদ-পেরোনো hold-ও “সফল” দেখাত।'
    ref: confirm-and-cleanup
  - q: 'Hold ছাড়ার cleanup job নিয়ে কোনগুলো সত্যি?'
    hint: 'শুদ্ধতা কার ঘাড়ে?'
    options:
      - text: 'confirm আর নতুন hold নিজেই expires_at দেখে নেয়, তাই job দেরি করলেও শুদ্ধতা ঠিক'
        correct: true
        why: 'মেয়াদ যাচাই ব্যবহারের মুহূর্তে হয়; job শুধু ঝাড়ু।'
      - text: 'Symfony Scheduler-এ `#[AsPeriodicTask]` দিয়ে এটা নিয়মিত চালানো যায়'
        correct: true
        why: 'ক্লাসটা invokable হলে attribute দিলেই schedule হয়, শুধু scheduler worker চালু রাখতে হয়।'
      - text: 'job একবার না চললে সিট চিরকাল আটকে যায়'
        correct: false
        why: 'নতুন hold আগে মেয়াদ-পেরোনোগুলো সরায়, তাই সিট আটকে যায় না।'
      - text: 'job ছাড়া expires_at কলাম বেকার'
        correct: false
        why: 'expires_at-ই মেয়াদের সত্য; job-ছাড়াও এটা confirm আর hold-এ কাজ করে।'
    ref: confirm-and-cleanup
  - q: 'রহিমের hold-এর মেয়াদ ফুরানোর ২ মিনিট পরে তার পেমেন্ট সফল হলো; ইতিমধ্যে করিম সিটটা hold করেছে। সিস্টেম কী করবে?'
