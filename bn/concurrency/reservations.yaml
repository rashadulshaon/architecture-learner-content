slides:
  - slug: seat-in-limbo
    title: 'পেমেন্টের ১০ মিনিট: সিটটা তখন কার?'
    kind: story
    tldr: 'পেমেন্টের আগে সিট না ধরলে টাকা দিয়ে “শেষ” শোনা লাগে; ধরে রেখে না ছাড়লে সিট চিরকাল আটকে থাকে। সমাধান: সময়সীমা-ওয়ালা hold।'
    keywords: ['reservation', 'hold', 'seat', 'ticket', 'expiry', 'ঈদের টিকিট']
    blocks:
      - type: metaphor
        icon: ticket
        title: 'ট্রেনের ই-টিকিটের ১০ মিনিট'
        body: |
          ঈদের ট্রেনের ই-টিকিটে সিট বেছে নিলে সেটা আপনার নামে ১০ মিনিট ধরা থাকে। এই সময়ে অন্য কেউ সিটটা নিতে পারে না। ১০ মিনিটে পেমেন্ট না করলে সিটটা আবার খালি হয়ে যায়। এটাই hold: দাবি আছে, তবে মেয়াদসহ।
      - type: visual
        kind: compare
        caption: 'পেমেন্টের সময় সিট সামলানোর তিন উপায়'
        columns:
          - title: 'পেমেন্টের পরে বুক'
            tone: bad
            icon: cross
            tip: 'ব্যবহারকারী টাকা দিয়ে ফেলার পর জানল সিট আর নেই। সবচেয়ে খারাপ অভিজ্ঞতা, আবার refund-এর ঝামেলা।'
            items:
              - 'পেমেন্ট চলাকালে সিট খোলা'
              - 'টাকা দিয়ে “সিট শেষ” শোনা'
              - 'refund-এর ঝামেলা'
          - title: 'ধরে রাখা, কিন্তু ছাড়া নয়'
            tone: bad
            icon: warning
            tip: 'সিট ধরা হয়, কিন্তু যারা পেমেন্ট না করে চলে গেল তাদের সিট চিরকাল আটকে থাকে।'
            items:
              - 'অর্ধেক ছেড়ে যাওয়া কার্টে সিট আটকা'
              - 'সিট খালি, কিন্তু দেখায় “শেষ”'
              - 'বিক্রি কমে যায়'
          - title: 'মেয়াদী hold'
            tone: good
            icon: check
            tip: 'পেমেন্টের সময়টুকু সিট নিশ্চিত, আর সময় ফুরালে নিজে থেকে খালি। দুই সমস্যারই সমাধান।'
            items:
              - 'কাউকে টাকা দেওয়ার পর ফিরতে হয় না'
              - 'অব্যবহৃত hold নিজে থেকে ছাড়ে'
              - 'সিট পুরো সময় বিক্রির আওতায়'
    aside:
      - type: story
        title: 'ঈদের টিকিটের রাত'
        body: |
          কেউ পাঁচটা সিট ধরে রেখে পেমেন্ট না করে ঘুমিয়ে পড়েছে, আর হাজার জন “শেষ” দেখছে। মেয়াদ না থাকলে প্রতি রাতেই এমন হতো। মেয়াদী hold ঠিক এই জন্যই। এর দাম: ধরা সিট সর্বোচ্চ ১০ মিনিট বাকিদের নাগালের বাইরে থাকে, তাই একজনের একসাথে সক্রিয় hold-এর সংখ্যাও (ধরুন ৪) সীমিত রাখুন।
      - type: terms
        items:
          - {term: 'Hold', meaning: 'কিছু সময়ের জন্য কারো নামে জিনিসটা আটকে রাখা, যতক্ষণ না confirm হয় বা মেয়াদ ফুরায়।'}
          - {term: 'Reservation', meaning: 'hold আর পরের confirm-সহ পুরো দাবির রেকর্ড।'}
    check:
      q: 'পেমেন্ট চলাকালে সিটের জন্য কেন একটা মেয়াদী hold লাগে? শুধু ধরে রাখলে বা শুধু পেমেন্টের পরে বুক করলে কী ভুল?'
      a: 'পেমেন্টের পরে বুক করলে টাকা দিয়েও সিট না-ও মিলতে পারে। শুধু ধরে রাখলে ছেড়ে-যাওয়া ব্যবহারকারীরা সিট চিরকাল আটকে রাখে। মেয়াদ দুটোই ঠিক করে।'

  - slug: reservation-states
    title: 'Hold-এর জীবনচক্র: চারটা অবস্থা'
    kind: concept
    tldr: 'প্রতিটা hold একটা রেকর্ড: held থেকে হয় confirmed, নয় expired বা cancelled। মেয়াদ রেকর্ডের expires_at কলামে।'
    keywords: ['state machine', 'held', 'confirmed', 'expired', 'expires_at', 'অবস্থা']
    blocks:
      - type: text
        body: |
          সিটের গায়ে “ধরা আছে” লেখার বদলে একটা আলাদা **reservation রেকর্ড** বানান। তাতে থাকে কোন সিট, কার জন্য, কী অবস্থা আর `expires_at`। অবস্থা তিন পথে বদলায়: পেমেন্ট এলে confirmed, মেয়াদ ফুরালে expired, নিজে ছেড়ে দিলে cancelled। পণ্যের স্টকের বেলায়ও একই ধারণা: সিটের বদলে `reserved` গোনা হয়।
      - type: visual
        kind: flow
        animate: false
        caption: 'Reservation রেকর্ডের চার অবস্থা ও তাদের মধ্যকার পথ'
        nodes:
          - {id: held, label: 'held', sub: 'মেয়াদসহ ধরা', icon: hourglass, tone: accent, col: 0, row: 1, tip: 'hold তৈরি হয়েছে। সিট এখন এই ব্যবহারকারীর, expires_at পর্যন্ত।'}
          - {id: confirmed, label: 'confirmed', sub: 'পাকা বুকিং', icon: check, tone: good, col: 2, row: 0, tip: 'পেমেন্ট এসেছে। এটা শেষ অবস্থা, এখান থেকে আর বদলায় না।'}
          - {id: expired, label: 'expired', sub: 'মেয়াদ শেষ', icon: clock, tone: muted, col: 2, row: 1, tip: 'সময় ফুরিয়েছে, সিট আবার খালি। এটাও শেষ অবস্থা।'}
          - {id: cancelled, label: 'cancelled', sub: 'নিজে ছেড়েছে', icon: cross, tone: muted, col: 2, row: 2, tip: 'ব্যবহারকারী নিজে বাতিল করেছে। সিট সঙ্গে সঙ্গে খালি।'}
        edges:
          - {from: held, to: confirmed, label: 'পেমেন্ট সফল', tone: good, tip: 'মেয়াদ থাকতে পেমেন্ট এলে তবেই এই পথ।'}
          - {from: held, to: expired, label: 'সময় শেষ', tone: warn, tip: 'expires_at পার হয়ে গেছে।'}
          - {from: held, to: cancelled, label: 'বাতিল', tip: 'ব্যবহারকারী “ছেড়ে দিন” চেপেছে।'}
      - type: quote
        body: 'Hold মানে মেয়াদসহ দাবি। মেয়াদের সত্যটা থাকে expires_at-এ।'
    aside:
      - type: remember
        body: 'held থেকে তিন দিকে যাওয়া যায়; confirmed, expired বা cancelled থেকে আর ফেরা নেই।'
      - type: refs
        items:
          - {to: 'payments/payment-state-machine', label: 'বৈধ transition আর state machine'}
    check:
      q: 'কোন তিনটা ঘটনা একটা `held` রেকর্ডকে শেষ অবস্থায় নিয়ে যায়?'
      a: 'পেমেন্ট সফল হলে confirmed, expires_at পেরোলে expired, ব্যবহারকারী নিজে ছেড়ে দিলে cancelled। এই তিনটা শেষ অবস্থা থেকে আর ফেরা নেই।'

  - slug: hold-implementation
    title: 'Hold বানানো: unique index আর মেয়াদী সারি'
    kind: howto
    tldr: 'সক্রিয় hold-এ partial unique index দিন; নতুন hold-এর আগে পুরনো মেয়াদ-পেরোনোগুলো expired করে দিন; unique ভাঙলে সিট নেই।'
    keywords: ['hold seat', 'partial unique index', 'UniqueConstraintViolationException', 'Clock', 'DQL']
    blocks:
      - type: text
        body: |
          আগে দেখে তারপর insert করলে হয় না। ১০:০০:০০-তে রহিম আর করিম দুজনেই সিট ১২ চাইল: দুটো SELECT-ই বলল “খালি”, দুটো INSERT-ই চলল, আর সিটটার দুটো hold হয়ে গেল। নিচের index দ্বিতীয় insert-টা ডেটাবেস নিজেই ফিরিয়ে দেয়।
      - type: code
        lang: sql
        file: 'migration (PostgreSQL)'
        code: |
          CREATE TABLE reservation (
              id          BIGSERIAL PRIMARY KEY,
              seat_id     INT NOT NULL REFERENCES seat (id),
              user_id     INT NOT NULL,
              status      VARCHAR(12) NOT NULL DEFAULT 'held',
              expires_at  TIMESTAMPTZ NOT NULL
          );

          -- এক সিটে একসাথে একটাই সক্রিয় দাবি; expired/cancelled যত খুশি
          CREATE UNIQUE INDEX one_active_reservation
              ON reservation (seat_id) WHERE status IN ('held', 'confirmed');
        marks:
          - {line: 10, tip: 'এই এক index-ই double-booking আটকায়। দুই request একসাথে insert করলে একটাই টেকে।'}
          - {line: 6, tip: 'মেয়াদের সময় সারিতেই রাখা হয়। কোন সময় পর্যন্ত hold, সেটা এখান থেকেই জানা যায়।'}
      - type: code
        lang: php
        file: 'src/Service/SeatHolder.php'
        code: |
          public function hold(int $seatId, int $userId): Reservation
          {
              $now = $this->clock->now();

              try {
                  return $this->em->wrapInTransaction(function () use ($seatId, $userId, $now) {
                      // মেয়াদ-পেরোনো পুরনো hold আগে সরান, নইলে সিট চিরকাল আটকা
                      $this->em->createQuery(
                          "UPDATE App\Entity\Reservation r SET r.status = 'expired'
                           WHERE r.seatId = :seat AND r.status = 'held' AND r.expiresAt <= :now"
                      )->setParameter('seat', $seatId)->setParameter('now', $now)->execute();

                      $r = new Reservation($seatId, $userId, $now->modify('+10 minutes'));
                      $this->em->persist($r);

                      return $r;   // flush() হতেই unique index পরীক্ষা হয়
                  });
              } catch (UniqueConstraintViolationException) {
                  throw new SeatTaken($seatId);   // অন্য কারো hold বা বুকিং আছে
              }
          }
        marks:
          - {line: 3, tip: 'সময় ClockInterface থেকে নিন। এতে টেস্টে সময় নিজের হাতে চালানো যায়।'}
          - {line: 8, tip: 'আসল hold ফুরিয়ে গেলেও রেকর্ডে ‘held’ লেখা থাকে। unique index সেটাকে সক্রিয় ধরবে, তাই আগে expired করতে হয়।'}
          - {line: 18, tip: 'কেউ আগে hold নিয়ে ফেললে এখানে exception আসে, মানে এই সিট এখন আর খালি নয়।'}
    aside:
      - type: tips
        items:
          - 'পণ্যের স্টকে সিটের বদলে `reserved` কলাম: `UPDATE product SET reserved = reserved + :n WHERE id = :id AND stock - reserved >= :n`।'
          - 'স্টকে hold-এর প্রতিটা অনুরোধের জন্য আলাদা reservation সারি রাখুন, নইলে মেয়াদ শেষে কতটা ফেরত যাবে জানা যায় না।'
          - 'MySQL-এ partial index নেই। বিকল্প: nullable `active_seat_id` কলাম, hold সক্রিয় থাকলে seat id, মেয়াদ বা cancel-এর পর NULL; তার ওপর UNIQUE index।'
      - type: refs
        items:
          - {to: 'concurrency/atomic-operations', label: 'Unique index আর atomic UPDATE'}
    check:
      q: 'দুই ব্যবহারকারী একসাথে একই সিটে hold চাইলে কে জেতে, আর অন্যজন কী পায়?'
      a: 'partial unique index যার insert আগে পৌঁছায় তাকে টিকতে দেয়। অন্যজন UniqueConstraintViolationException পায়, যা SeatTaken error হিসেবে দেখানো হয়।'

  - slug: confirm-and-cleanup
    title: 'Confirm আর পরিষ্কার: মেয়াদের সত্য, cleanup শুধু ঝাড়ু'
    kind: howto
    tldr: 'confirm করার সময় expires_at এখনো ভবিষ্যতে কি না যাচাই করুন; cleanup job শুধু পরিষ্কার রাখে, শুদ্ধতার ভার তার ওপর নয়।'
    keywords: ['confirm reservation', 'Scheduler', 'AsPeriodicTask', 'cleanup job', 'expires_at', 'compare and swap']
    blocks:
      - type: code
        lang: php
        file: 'src/Service/SeatHolder.php'
        code: |
          public function confirm(int $reservationId): void
          {
              $confirmed = $this->em->createQuery(
                  "UPDATE App\Entity\Reservation r SET r.status = 'confirmed'
                   WHERE r.id = :id AND r.status = 'held' AND r.expiresAt > :now"
              )
                  ->setParameter('id', $reservationId)
                  ->setParameter('now', $this->clock->now())
                  ->execute();

              if ($confirmed === 0) {
                  throw new HoldExpired($reservationId);   // refund বা নতুন করে চেষ্টা
              }
          }
        marks:
          - {line: 5, tip: 'আগের অবস্থা held আর মেয়াদ ভবিষ্যতে, দুটোই এক শর্তে। এটা compare-and-swap।'}
          - {line: 11, tip: '০ মানে hold আর নেই: মেয়াদ গেছে, নয়তো বাতিল। যে-ই হোক, confirm করা যাবে না।'}
      - type: code
        lang: php
        file: 'src/Scheduler/ReleaseExpiredHolds.php'
        code: |
          #[AsPeriodicTask(frequency: '1 minute', jitter: 5)]
          final readonly class ReleaseExpiredHolds
          {
              public function __construct(
                  private EntityManagerInterface $em,
                  private ClockInterface $clock,
              ) {
              }

              public function __invoke(): void
              {
                  $this->em->createQuery(
                      "UPDATE App\Entity\Reservation r SET r.status = 'expired'
                       WHERE r.status = 'held' AND r.expiresAt <= :now"
                  )->setParameter('now', $this->clock->now())->execute();
              }
          }
        marks:
          - {line: 1, tip: 'প্রতি মিনিটে চলে। চালাতে `php bin/console messenger:consume scheduler_default` worker লাগে।'}
          - {line: 13, tip: 'শুধু ঝাড়ু: report ও ড্যাশবোর্ড পরিষ্কার রাখে। confirm বা নতুন hold এর ওপর নির্ভর করে না।'}
      - type: quote
        body: 'মেয়াদ যাচাই হয় ব্যবহারের মুহূর্তে। cleanup job শুধু ঝাড়ু।'
    aside:
      - type: problem
        body: 'cleanup job বন্ধ থাকলে, দেরি করলে বা দুইবার চললেও hold-এর শুদ্ধতা নষ্ট হয় না, কারণ confirm আর নতুন hold দুটোই নিজে মেয়াদ দেখে নেয়।'
      - type: commands
        items:
          - {cmd: 'php bin/console debug:scheduler', desc: 'চালু schedule-গুলোর তালিকা'}
          - {cmd: 'php bin/console messenger:consume scheduler_default', desc: 'scheduler worker চালু করুন'}
    check:
      q: 'cleanup job এক ঘণ্টা বন্ধ ছিল। মেয়াদ-পেরোনো hold-এ কি তখনো confirm করা যাবে? কেন?'
      a: 'না। confirm-এর UPDATE-এ `expires_at > now` শর্ত আছে, তাই মেয়াদ পেরোলে ০টা সারি বদলায় আর HoldExpired আসে। cleanup না চললেও শুদ্ধতা অটুট।'

  - slug: late-payment
    title: 'মেয়াদ পেরিয়ে এল পেমেন্ট: এখন কী?'
    kind: pitfall
