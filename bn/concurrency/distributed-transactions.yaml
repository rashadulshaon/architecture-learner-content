slides:
  - slug: dual-write
    title: 'ডেটাবেসে লিখলাম, কিন্তু খবর গেল না'
    kind: story
    tldr: 'ডেটাবেস আর অন্য সিস্টেমে (queue, ইমেইল, অন্য সার্ভিস) পরপর লিখলে মাঝপথে ব্যর্থতায় একটা হয়, আরেকটা হয় না। একে dual-write সমস্যা বলে।'
    keywords: ['dual write', 'distributed transaction', 'message broker', 'inconsistency', 'অর্ডার']
    blocks:
      - type: metaphor
        icon: truck
        title: 'খাতায় লেখা আর কুরিয়ারকে ফোন'
        body: |
          দোকানদার অর্ডারটা খাতায় লিখল, তারপর কুরিয়ারকে ফোন করে মাল তুলতে বলবে। খাতায় লিখে সে ফোন করতে ভুলে গেল, বা ফোনের লাইন কেটে গেল। ক্রেতার অর্ডার আছে, কিন্তু মাল কখনো যাবে না। দুটো আলাদা জায়গায় লেখা কখনো একসাথে ঘটে না।
      - type: code
        lang: php
        file: 'src/Service/OrderService.php'
        variant: bad
        code: |
          public function place(PlaceOrder $cmd): Order
          {
              $order = Order::place($cmd->customerId, $cmd->items);
              $this->em->persist($order);
              $this->em->flush();                 // ১. ডেটাবেসে পাকা

              // এখানে process মরলে বা broker বন্ধ থাকলে?
              $this->bus->dispatch(new OrderPlaced($order->getId()));   // ২. খবর

              return $order;
          }
        marks:
          - {line: 5, tip: 'এখানেই COMMIT। এরপর যা-ই হোক, অর্ডার ডেটাবেসে থেকে যায়।'}
          - {line: 8, tip: 'এই লাইন না চললে অর্ডার আছে, অথচ গুদাম আর ইমেইল সার্ভিস কিছুই জানে না। উল্টো ক্রমে লিখলে হয় ভূতুড়ে খবর।'}
      - type: visual
        kind: sequence
        caption: 'দুই ধাপের মাঝে ব্যর্থতা: অর্ডার সংরক্ষিত, খবর হারাল'
        actors:
          - {id: app, label: 'Symfony অ্যাপ', icon: api, tip: 'দুই জায়গায় পরপর লেখে: আগে ডেটাবেস, পরে queue।'}
          - {id: db, label: 'ডেটাবেস', icon: db, tip: 'অর্ডারটা ঠিকঠাক পাকা করল।'}
          - {id: mq, label: 'Message broker', icon: queue, tip: 'গুদাম, ইমেইল আর অন্য সার্ভিসকে খবর পৌঁছায়। এখানে খবরটা কখনো পৌঁছায়নি।'}
        messages:
          - {from: app, to: db, label: 'অর্ডার #১০১ COMMIT'}
          - {from: db, to: app, label: 'পাকা হলো', dashed: true, tone: good}
          - {at: app, note: 'process crash বা deploy', tone: bad, tip: 'ঠিক এই মুহূর্তে অ্যাপ বন্ধ হলে দ্বিতীয় লেখাটা হয়ই না। কেউ কোনো error-ও দেখে না।'}
          - {from: app, to: mq, label: 'OrderPlaced পাঠানো হলো না', tone: bad, dashed: true}
          - {at: mq, note: 'গুদাম জানেই না অর্ডার আছে', tone: bad, tip: 'ক্রেতা টাকা দিয়েছে, মাল পাঠানো হবে না। কয়েক দিন পরে অভিযোগে ধরা পড়ে।'}
      - type: text
        body: |
          বেরোনোর দুটো পথ। হয় দুই সিস্টেমকে একসাথে পাকা করানো (two-phase commit, পরের slide), যা প্রায়ই ঝামেলার তুলনায় লাভজনক নয়। নয়তো খবরটা অর্ডারের একই ডেটাবেস transaction-এ লিখে রাখা (outbox, তার পরের slide)।
    aside:
      - type: terms
        items:
          - {term: 'Dual-write', meaning: 'একই ঘটনা দুই আলাদা সিস্টেমে (ডেটাবেস ও queue) পরপর লেখা, যেখানে দুটো একসাথে পাকা হওয়ার উপায় নেই।'}
          - {term: 'Distributed transaction', meaning: 'একাধিক আলাদা সিস্টেম জুড়ে একটাই “সব অথবা কিছুই না” কাজ।'}
      - type: story
        title: 'হারানো অর্ডারের অভিযোগ'
        body: |
          এক ই-কমার্সে মাসে ১০-১৫টা অর্ডার “পেমেন্ট হয়েছে কিন্তু মাল আসেনি” অভিযোগ আসত। দেখা গেল, deploy-এর মুহূর্তে কয়েকটা অর্ডার ডেটাবেসে ঢুকেছে, কিন্তু queue-তে খবর যায়নি।
    check:
      q: 'ডেটাবেসে COMMIT করার পরে queue-তে dispatch করা হয়। dispatch-এর আগে process মরলে কী হয়?'
      a: 'অর্ডার ডেটাবেসে থেকে যায়, কিন্তু OrderPlaced খবর কখনো যায় না। গুদাম বা ইমেইল সার্ভিস জানেই না, কেউ error-ও দেখে না।'

  - slug: two-phase-commit
    title: 'Two-phase commit: কবুল বলিয়ে নেওয়া, আর কেন এড়ানো হয়'
    kind: concept
    tldr: '2PC-তে একজন সমন্বয়কারী আগে সবাইকে জিজ্ঞেস করে “প্রস্তুত?”, সবাই হ্যাঁ বললে commit; কিন্তু সমন্বয়কারী মরলে সবাই আটকে যায়।'
    keywords: ['2PC', 'two phase commit', 'XA', 'coordinator', 'prepare', 'blocking']
    blocks:
      - type: metaphor
        icon: users
        title: 'কাজীর সামনে কবুল'
        body: |
          বিয়েতে কাজী সাহেব আগে পাত্র আর পাত্রী দুজনকেই জিজ্ঞেস করেন “কবুল?” দুজন হ্যাঁ বললে তবেই বিয়ে পাকা, একজন না বললে কিছুই না। এটাই 2PC: প্রথম ধাপ prepare (কবুল নেওয়া), দ্বিতীয় ধাপ commit (পাকা ঘোষণা)। কাজী যদি কবুলের পর ঘোষণার আগে অজ্ঞান হয়ে যান, দুজনেই “হয়েছে কি না” না জেনে আটকে থাকে।
      - type: visual
        kind: sequence
        caption: 'Two-phase commit: আগে সবার সম্মতি, তারপর একসাথে পাকা'
        actors:
          - {id: coord, label: 'কাজী (coordinator)', icon: flag, tip: 'পুরো কাজ সমন্বয় করে; সিদ্ধান্তের ভার তার একার।'}
          - {id: a, label: 'ডেটাবেস A', icon: db, tip: 'অর্ডারের ডেটাবেস।'}
          - {id: b, label: 'ডেটাবেস B', icon: db, tip: 'ইনভেন্টরির ডেটাবেস।'}
        messages:
          - {from: coord, to: a, label: 'PREPARE: প্রস্তুত?', tip: 'ধাপ ১: A নিজের কাজ তৈরি রাখে, lock ধরে রাখে, আর কথা দেয় যে commit করতে পারবে।'}
          - {from: coord, to: b, label: 'PREPARE: প্রস্তুত?'}
          - {from: a, to: coord, label: 'হ্যাঁ, কবুল', dashed: true, tone: good}
          - {from: b, to: coord, label: 'হ্যাঁ, কবুল', dashed: true, tone: good, tip: 'এই “হ্যাঁ” ফিরিয়ে নেওয়া যায় না। এখন B শুধু সমন্বয়কারীর অপেক্ষা করে।'}
          - {from: coord, to: a, label: 'COMMIT', tip: 'ধাপ ২: সবাই হ্যাঁ বলেছে, তাই এখন পাকা।'}
          - {from: coord, to: b, label: 'COMMIT'}
      - type: points
        title: 'কেন সাধারণত এড়ানো হয়'
        style: cross
        items:
          - 'কাজী বা নেটওয়ার্ক মাঝপথে ফেল করলে A আর B lock ধরে আটকে থাকে (blocking)।'
          - 'প্রতিটা ধাপে নেটওয়ার্ক round trip, তাই ধীর; lock বেশি সময় ধরা।'
          - 'ইমেইল, SMS বা বাইরের HTTP API 2PC বোঝে না। সবাই XA-সমর্থিত নয়।'
      - type: quote
        body: 'বাইরের সিস্টেম জুড়লে 2PC নয়; outbox, saga আর idempotency।'
    aside:
      - type: when
        use: ['একই কোম্পানির দুইটা XA-সমর্থিত ডেটাবেস, কম ট্রাফিক, অভিজ্ঞ দল']
        avoid: ['বাইরের API, queue, ইমেইল বা অনেক সার্ভিস জড়িত', 'বেশি ট্রাফিক বা দ্রুত উত্তর দরকার']
      - type: terms
        items:
          - {term: 'XA', meaning: 'ডেটাবেস আর transaction manager-এর মধ্যে 2PC-র প্রচলিত মানদণ্ড।'}
    check:
      q: 'সব অংশগ্রহণকারী PREPARE-এ “হ্যাঁ” বলার পরে সমন্বয়কারী মরে গেলে কী হয়?'
      a: 'অংশগ্রহণকারীরা commit না rollback জানে না, তাই lock ধরে আটকে থাকে। সমন্বয়কারী ফিরে না আসা পর্যন্ত এই সারিগুলোতে অন্য কেউ কাজ করতে পারে না।'

  - slug: outbox-pattern
    title: 'Outbox: খবরটাও একই transaction-এ লিখুন'
    kind: howto
    tldr: 'অর্ডারের সাথে একই transaction-এ outbox টেবিলে খবরটাও লিখুন; আলাদা relay সেটা পরে queue-তে পাঠায়। এতে খবর হারায় না।'
    keywords: ['outbox pattern', 'transactional outbox', 'relay', 'Messenger', 'Scheduler', 'at-least-once']
    blocks:
      - type: text
        body: |
          সমাধান: দুই জায়গায় না লিখে একই ডেটাবেসে লিখুন। অর্ডার আর “এই খবরটা পাঠাতে হবে” একই transaction-এ যায়, তাই দুটো একসাথে পাকা হয় বা একসাথেই বাতিল। তারপর একটা আলাদা relay outbox পড়ে খবর broker-এ পাঠায় আর “পাঠানো হয়েছে” চিহ্ন দেয়। ডাকপিয়নের তালিকার মতো।
      - type: code
        lang: php
        file: 'src/Service/OrderService.php'
        variant: good
        code: |
          public function place(PlaceOrder $cmd): Order
          {
              return $this->em->wrapInTransaction(function () use ($cmd): Order {
                  $order = Order::place($cmd->customerId, $cmd->items);
                  $this->em->persist($order);

                  // একই transaction: অর্ডার আর খবর একসাথে পাকা, নয়তো কোনোটাই না
                  $this->em->persist(new OutboxMessage(
                      type: 'order.placed',
                      payload: json_encode(['orderId' => (string) $order->getId()]),
                  ));

                  return $order;
              });
          }
        marks:
          - {line: 8, tip: 'outbox সারিটা orders-এর সাথেই একই ডেটাবেসে। COMMIT হলে দুটোই থাকে, ROLLBACK হলে দুটোই যায়।'}
      - type: code
        lang: php
        file: 'src/Scheduler/OutboxRelay.php'
        code: |
          #[AsPeriodicTask(frequency: '5 seconds')]
          final readonly class OutboxRelay
          {
              public function __invoke(): void
              {
                  $this->em->wrapInTransaction(function (): void {
                      $rows = $this->em->getConnection()->fetchAllAssociative(
                          'SELECT id, type, payload FROM outbox_message
                           WHERE published_at IS NULL ORDER BY created_at
                           LIMIT 100 FOR UPDATE SKIP LOCKED'
                      );
                      foreach ($rows as $row) {
                          $this->bus->dispatch(
                              new PublishEvent($row['id'], $row['type'], $row['payload'])
                          );
                          $this->em->getConnection()->executeStatement(
                              'UPDATE outbox_message SET published_at = NOW() WHERE id = :id',
                              ['id' => $row['id']],
                          );
                      }
                  });
              }
          }
        marks:
          - {line: 10, tip: 'SKIP LOCKED: একাধিক relay চললে একই সারি দুজন তোলে না।'}
          - {line: 13, tip: 'dispatch সফল হলো কিন্তু এর পরে UPDATE/COMMIT ব্যর্থ হলে খবর আবার যাবে। অর্থাৎ at-least-once; গ্রাহকের হাতে idempotency লাগবে।'}
    aside:
      - type: pitfalls
        items:
          - 'outbox কখনো exactly-once দেয় না; সে খবর হারাতে দেয় না, কিন্তু দুইবার পাঠাতে পারে। তাই পরের slide-এর idempotent consumer অপরিহার্য।'
          - 'পুরনো প্রকাশিত সারি মুছে ফেলার কাজ রাখুন, নইলে outbox টেবিল ফুলে ওঠে।'
          - 'দাম হলো দেরি। relay ৫ সেকেন্ড পরপর চললে গুদাম ৫ সেকেন্ড পর্যন্ত দেরিতে জানতে পারে। অর্ডার বা ইমেইলে চলে, তবে যা সঙ্গে সঙ্গে সাড়া দেওয়ার দরকার, সেখানে ভুল।'
          - 'একটাই ডেটাবেসে সব থাকলে, বা খবর হারালে ক্ষতি নেই (যেমন “পেজ দেখা” গোনা), তখন outbox লাগে না।'
      - type: tips
        items:
          - 'ছোট অ্যাপে Messenger-এর Doctrine transport একই connection-এ থাকলে dispatch নিজেই ওই transaction-এর অংশ হয়ে যায়; এভাবেই সরল outbox মেলে।'
      - type: refs
        items:
          - {to: 'workflows/outbox-inbox', label: 'Outbox ও inbox বিস্তারিত'}
    check:
      q: 'outbox-এ খবর রাখলে অর্ডার COMMIT আর খবর হারানোর ফাঁক কেন বন্ধ হয়?'
      a: 'অর্ডার আর খবর একই transaction-এ লেখা হয়, তাই দুটোই পাকা হয় বা দুটোই বাতিল। relay পরে outbox থেকে পাঠায়, তাই pending খবর কখনো হারায় না।'

  - slug: saga-compensation
    title: 'Saga: প্রতিটা ধাপের একটা “উল্টো ধাপ”'
    kind: concept
    tldr: 'অনেক সার্ভিস জুড়ে কাজটা ছোট ধাপে ভাঙুন; কোনো ধাপ ফেল করলে আগের সফল ধাপগুলো উল্টো ক্রমে compensation দিয়ে ফেরানো হয়।'
    keywords: ['saga', 'compensation', 'orchestration', 'choreography', 'rollback', 'ধাপ']
    blocks:
      - type: text
        body: |
          অনলাইনে অর্ডারে চারটা সার্ভিস জড়িত: অর্ডার, পেমেন্ট, স্টক, কুরিয়ার। সবাই আলাদা, একসাথে rollback সম্ভব নয়। তাই প্রতিটা সার্ভিস নিজের transaction শেষ করে পরের ধাপকে খবর দেয়। কোথাও আটকে গেলে আগের ধাপগুলো নিজের **compensation** চালায়, যেমন টাকা ফেরত। ডেটাবেসের rollback-এর বদলে এটা “ক্ষতিপূরণের উল্টো কাজ”। কে ফেল ধরে উল্টো কাজ শুরু করে, আর উল্টো কাজ নিজেই ফেল করলে কী হয়? পরের slide-এ দেখুন।
      - type: visual
        kind: table
        caption: 'চার ধাপের saga, আর প্রতিটার উল্টো ধাপ'
        headers: ['ধাপ', 'কী করে', 'পরে ফেল হলে উল্টো কাজ']
        rows:
          - cells: ['১. অর্ডার তৈরি', 'অর্ডার pending বানায়', 'অর্ডার cancelled করুন']
            tip: 'প্রথম ধাপ সফল। পরে কোনো ধাপ ফেল করলে অর্ডার বাতিল হিসেবে চিহ্নিত হয়।'
          - cells: ['২. পেমেন্ট নেওয়া', 'ক্রেতার টাকা কাটে', 'টাকা ফেরত (refund)']
            tip: 'টাকা কাটা অন্য ডেটাবেসে পাকা হয়ে গেছে। মুছে ফেলা যায় না, তাই উল্টো একটা refund লেনদেন লাগে।'
          - cells: ['৩. স্টক আটকানো', 'স্টকে hold রাখে', 'hold ছেড়ে দিন']
            tip: 'কুরিয়ার ফেল হলে স্টক আবার খালি করে দিতে হয়।'
          - cells: ['৪. কুরিয়ার বুক', 'কুরিয়ারে পিকআপ বলে', 'পিকআপ বাতিল']
            tip: 'শেষ ধাপ। এটা নিজে ফেল করলে ফেরানোর মতো নিজের কিছু নেই, তাই saga আগের তিনটা উল্টো ক্রমে (৩, ২, ১) ফেরায়।'
      - type: quote
        body: 'Saga-য় rollback নেই; আছে প্রতিটা ধাপের নিজস্ব উল্টো কাজ।'
    aside:
      - type: remember
