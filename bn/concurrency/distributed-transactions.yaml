      q: 'কুরিয়ার বুক ফেল করল। saga কোন কোন ধাপ কোন ক্রমে ফেরায়?'
      a: 'উল্টো ক্রমে: আগে স্টকের hold ছাড়ে (৩), তারপর টাকা refund করে (২), শেষে অর্ডার cancelled করে (১)।'

  - slug: saga-orchestrator
    title: 'উল্টো ধাপ চালু করা, আর উল্টো ধাপই ফেল করলে'
    kind: howto
    tldr: 'orchestrator শেষ হওয়া প্রতিটা ধাপ লিখে রাখে; ফেল হলে শেষ থেকে একটা একটা message-এ ধাপ ফেরায়। উল্টো ধাপ ফেল করলে সফল না হওয়া পর্যন্ত retry হয়, তাই তা বারবার চালানো নিরাপদ হতে হবে।'
    keywords: ['saga orchestrator', 'compensation failure', 'Messenger retry', 'failure transport', 'idempotent compensation', 'উল্টো কাজ']
    blocks:
      - type: text
        body: |
          ফেল ধরে উল্টো কাজ শুরু করার একজন লোক লাগে। এখানে একটা ছোট orchestrator ধাপগুলো চালায় আর শেষ হওয়া প্রতিটা ধাপ `saga` টেবিলে লিখে রাখে। কোনো ধাপ ফেল করলে সে saga-কে “compensating” করে একটা `CompensateNext` message পাঠায়। handler সবচেয়ে সাম্প্রতিক শেষ-হওয়া ধাপটা ফেরায়, তারপর পরের message পাঠায়; তাই ক্রম থাকে ৩, ২, ১। কোনো উল্টো কাজ exception ছুড়লে (পেমেন্ট প্রদানকারী বন্ধ) Messenger সেটা retry করে, আর সফল না হওয়া পর্যন্ত পরেরটা নড়ে না।
      - type: code
        lang: php
        file: 'src/Saga/PlaceOrderSaga.php'
        variant: good
        code: |
          public function run(string $sagaId, PlaceOrder $cmd): void
          {
              foreach ($this->steps as $step) {       // অর্ডার, পেমেন্ট, স্টক, কুরিয়ার
                  try {
                      $step->execute($sagaId, $cmd);  // saga id-ই idempotency key
                  } catch (\Throwable) {
                      $this->sagas->markCompensating($sagaId);
                      $this->bus->dispatch(new CompensateNext($sagaId));

                      return;
                  }
                  $this->sagas->recordDone($sagaId, $step::class);
              }
              $this->sagas->markCompleted($sagaId);
          }
        marks:
          - {line: 7, tip: 'কিছু ফেরানোর আগেই এটা লেখা হয়। অ্যাপ এখন মরলেও restart-এর পরে “compensating” দেখে ফেরানো চালিয়ে যায়।'}
          - {line: 8, tip: 'উল্টো ধাপের শিকল শুরু করে: একটাই message, যা শুধু সাম্প্রতিক শেষ-হওয়া ধাপটা ফেরায়।'}
      - type: code
        lang: php
        file: 'src/Saga/CompensateNextHandler.php'
        variant: good
        code: |
          #[AsMessageHandler]
          final readonly class CompensateNextHandler
          {
              public function __invoke(CompensateNext $m): void
              {
                  $stepClass = $this->sagas->lastDoneStep($m->sagaId);  // ৩, তারপর ২, তারপর ১
                  if ($stepClass === null) {
                      $this->sagas->markCancelled($m->sagaId);          // সব ফেরানো শেষ
                      return;
                  }

                  // refund, hold ছাড়া... exception ছুড়লে Messenger message-টা retry করে
                  $this->steps->get($stepClass)->compensate($m->sagaId);

                  $this->sagas->removeDone($m->sagaId, $stepClass);
                  $this->bus->dispatch(new CompensateNext($m->sagaId));
              }
          }
        marks:
          - {line: 12, tip: 'এটা দুইবার চলতে পারে (এর ঠিক পরে, removeDone-এর আগে crash হলে)। তাই refund-এ saga id-কে idempotency key ধরুন, যাতে টাকা একবারই ফেরত যায়।'}
          - {line: 14, tip: 'উল্টো কাজ সফল হওয়ার পরেই ধাপটা তালিকা থেকে কাটা হয়, তাই ফেল হলেও কোনো ধাপ বাদ যায় না।'}
      - type: quote
        body: 'উল্টো কাজও ফেল করতে পারে: সফল না হওয়া পর্যন্ত retry করুন, আর তা বারবার চালানো নিরাপদ রাখুন।'
    aside:
      - type: pitfalls
        items:
          - '`retry_strategy` দিন (max_retries ৫, multiplier ৩: অপেক্ষা ১, ৩, ৯, ২৭, ৮১ সেকেন্ড) আর `failure_transport`; সেখানে message পড়লে মানুষকে জানান। আটকে থাকা refund অদেখা রাখা চলবে না।'
          - 'উল্টো কাজ পুরো ফেরত নয়: পাঠানো ইমেইল ফেরানো যায় না, তাই সংশোধনী পাঠাতে হয়। আর saga চলার সময় অন্যরা আধা-করা অবস্থা দেখতে পায় (অর্ডার pending, স্টক hold)।'
      - type: when
        use: ['অনেক সার্ভিস জুড়ে একটা ব্যবসায়িক কাজ, প্রতিটার নিজের ডেটাবেস']
        avoid: ['একটা ডেটাবেসের transaction-এই সবটা ধরে: সেটাই সরল, সেটাই করুন']
    check:
      q: 'পেমেন্ট প্রদানকারী বন্ধ থাকায় refund-এর উল্টো কাজ exception ছুড়ল। saga-র কী হয়?'
      a: 'CompensateNext message বাড়তে থাকা অপেক্ষায় retry হয় আর saga “compensating”-এ থাকে, তাই পরের কোনো উল্টো কাজ চলে না। retry শেষ হলে message failure transport-এ যায় আর একজন মানুষ খবর পান।'

  - slug: idempotent-consumer
    title: 'দুইবার এলেও একবারই কাজ: idempotent consumer'
    kind: pitfall
    tldr: 'outbox, retry আর broker একই খবর একাধিকবার পাঠাতে পারে। গ্রাহক handler প্রতিটা message-id মনে রেখে দ্বিতীয়বার কিছু না করলেই নিরাপদ।'
    keywords: ['idempotency', 'idempotent consumer', 'inbox', 'at least once', 'duplicate', 'ON CONFLICT']
    blocks:
      - type: text
        body: |
          Outbox আর retry-র কারণে খবর **অন্তত একবার** আসে, কখনো দুইবার। সাধারণ handler তখন দুইবার পয়েন্ট দেয় বা দুইবার ইমেইল পাঠায়। সমাধান: প্রতিটা message-এর একটা id আছে, handler আগে সেই id একটা টেবিলে বসায়। বসানো না গেলে (আগেই আছে) কাজটা আগে হয়ে গেছে, সে চুপচাপ ফিরে যায়।
      - type: code
        lang: php
        file: 'src/MessageHandler/AwardPointsHandler.php'
        variant: bad
        code: |
          #[AsMessageHandler]
          final readonly class AwardPointsHandler
          {
              public function __invoke(OrderPlaced $event): void
              {
                  // একই event দুইবার এলে ক্রেতা দ্বিগুণ পয়েন্ট পায়
                  $this->points->award($event->customerId, 50);
              }
          }
        marks:
          - {line: 7, tip: 'কোনো ডুপ্লিকেট পরীক্ষা নেই। broker-এর retry বা relay-এর দ্বিতীয় পাঠানো সরাসরি টাকা বা পয়েন্টে গড়ায়।'}
      - type: code
        lang: php
        file: 'src/MessageHandler/AwardPointsHandler.php'
        variant: good
        code: |
          #[AsMessageHandler]
          final readonly class AwardPointsHandler
          {
              public function __invoke(OrderPlaced $event): void
              {
                  $this->em->wrapInTransaction(function () use ($event): void {
                      $fresh = $this->em->getConnection()->executeStatement(
                          'INSERT INTO processed_message (message_id, handler)
                           VALUES (:id, :h) ON CONFLICT DO NOTHING',
                          ['id' => $event->messageId, 'h' => 'award-points'],
                      );
                      if ($fresh === 0) {
                          return;                   // আগেই হয়েছে, কিছু করবেন না
                      }
                      $this->points->award($event->customerId, 50);
                  });
              }
          }
        marks:
          - {line: 9, tip: 'processed_message-এর (message_id, handler) জোড়ায় unique constraint থাকে। দুই worker একসাথে এলেও একজনই ঢোকে।'}
          - {line: 13, tip: '০ মানে এই id আগেই বসানো। পয়েন্ট দেওয়ার কাজ একই transaction-এ বলে, কাজ ও “করা হয়েছে” চিহ্ন একসাথে পাকা হয়।'}
    aside:
      - type: pitfalls
        items:
          - 'ইমেইলের মতো বাইরের কাজ transaction-এর ভেতরে দিলে ডুপ্লিকেট আটকানো কঠিন। সম্ভব হলে প্রদানকারীর idempotency key ব্যবহার করুন।'
          - 'message-id প্রতিটা ঘটনার জন্য একবার বানান (outbox সারির id), প্রতিবার পাঠানোর সময় নয়।'
      - type: refs
        items:
          - {to: 'payments/idempotency-keys', label: 'Idempotency key পূর্ণ নকশা'}
          - {to: 'concurrency/atomic-operations', label: 'ON CONFLICT আর unique constraint'}
    check:
      q: 'একই OrderPlaced event দুইবার এলে handler কীভাবে পয়েন্ট একবারই দেয়?'
      a: 'প্রথমবার message_id বসাতে পারে, তাই পয়েন্ট দেয়। দ্বিতীয়বার ON CONFLICT-এ affected rows ০ আসে, তাই কিছু না করে ফিরে যায়।'

flashcards:
  - q: 'Dual-write সমস্যা কী?'
    a: 'একই ঘটনা দুই আলাদা সিস্টেমে (যেমন ডেটাবেস ও queue) পরপর লেখা, যেখানে মাঝপথে ফেল করলে একটা হয়, আরেকটা হয় না।'
    more: |
      ডেটাবেসে COMMIT-এর পর queue-তে dispatch-এর আগে process মরলে অর্ডার আছে কিন্তু খবর নেই। উল্টো ক্রমেও বিপদ: খবর গেল, ডেটাবেসে কিছু নেই। দুটো আলাদা সিস্টেম একসাথে পাকা করার সোজা উপায় নেই।
    ref: dual-write
  - q: 'Two-phase commit (2PC) কীভাবে কাজ করে?'
    a: 'সমন্বয়কারী আগে সবাইকে PREPARE জিজ্ঞেস করে। সবাই হ্যাঁ বললে সবাইকে COMMIT বলে; কেউ না বললে সবাই ROLLBACK।'
    more: |
      প্রথম ধাপে অংশগ্রহণকারীরা নিজেদের কাজ তৈরি রেখে lock ধরে আর কথা দেয়। দ্বিতীয় ধাপে সমন্বয়কারী চূড়ান্ত সিদ্ধান্ত জানায়। বিয়েতে কাজীর “কবুল?” এরপর “পাকা”র মতো।
    ref: two-phase-commit
  - q: '2PC কেন সাধারণত এড়ানো হয়?'
    a: 'সমন্বয়কারী মরলে সবাই lock ধরে আটকে যায়, নেটওয়ার্ক round trip বেশি, আর ইমেইল বা বাইরের API 2PC বোঝে না।'
    more: |
      সবাই “হ্যাঁ” বলার পরে সমন্বয়কারী না ফিরলে অংশগ্রহণকারীরা আটকে থাকে। তাই ধীর, ভঙ্গুর আর অনেক সিস্টেমে অসম্ভব। একই কোম্পানির দুটো XA-সমর্থিত ডেটাবেসে কখনো কাজে লাগে, কিন্তু আধুনিক সিস্টেমে প্রায় ব্যবহার হয় না।
    ref: two-phase-commit
  - q: 'Transactional outbox কী?'
    a: 'ডেটার সাথে একই transaction-এ “পাঠাতে হবে” খবরটাও একটা outbox টেবিলে লেখা হয়; আলাদা relay পরে সেটা queue-তে পাঠায়।'
    more: |
      দুই সিস্টেমে লেখার বদলে একই ডেটাবেসে দুটো লেখা, তাই একসাথে পাকা বা একসাথে বাতিল। relay outbox থেকে পাঠায় আর `published_at` বসায়। খবর কখনো হারায় না।
    ref: outbox-pattern
  - q: 'Outbox কি exactly-once দেয়?'
    a: 'না। সে খবর হারাতে দেয় না, কিন্তু একই খবর দুইবার পাঠাতে পারে (at-least-once)। গ্রাহককে idempotent হতে হয়।'
    more: |
      relay পাঠানোর পরে `published_at` বসানোর আগে crash করলে পরের দফায় আবার পাঠায়। তাই outbox সবসময় idempotent consumer-এর সাথে জোড়া বাঁধে।
    ref: outbox-pattern
  - q: 'Outbox relay-এ SKIP LOCKED কেন?'
    a: 'একাধিক relay একসাথে চললে একই সারি দুজন না তুলে ভাগ করে নেয়। যে সারি অন্যজন আটকে রেখেছে, সেটা এড়িয়ে যায়।'
    more: |
      `SELECT … FOR UPDATE SKIP LOCKED` দিয়ে প্রতিটা relay আলাদা আলাদা সারির ব্যাচ পায়। এতে ক্ষমতা বাড়ানো যায়, আর বাড়তি ডুপ্লিকেট পাঠানোর ঝুঁকিও কমে।
    ref: outbox-pattern
  - q: 'Saga বলতে কী বোঝায়?'
    a: 'অনেক সার্ভিস জুড়ে একটা কাজকে ছোট ধাপে ভাঙা, যেখানে প্রতিটা ধাপের নিজস্ব transaction আর ফেল হলে একটা উল্টো (compensation) কাজ আছে।'
    more: |
      অর্ডার, পেমেন্ট, স্টক, কুরিয়ার: প্রতিটা নিজের ডেটাবেসে কাজ পাকা করে। কুরিয়ার ফেল করলে স্টক hold ছাড়ে, টাকা refund হয়, অর্ডার cancelled হয়।
    ref: saga-compensation
  - q: 'Compensation আর rollback-এ পার্থক্য কী?'
    a: 'Rollback অপাকা পরিবর্তন মুছে দেয়। Compensation পাকা হয়ে যাওয়া কাজের উল্টো একটা নতুন কাজ করে, যেমন refund।'
    more: |
      সার্ভিস নিজের transaction আগেই COMMIT করেছে, তাই মুছে ফেলা যায় না। refund একটা নতুন লেনদেন, ইতিহাসে দুটোই থাকে। তাই compensation-ও সফল না-ও হতে পারে, তাকেও retry আর নজরদারি লাগে।
    ref: saga-compensation
  - q: 'Saga কীভাবে উল্টো ধাপ চালু করে?'
    a: 'orchestrator ফেল-হওয়া ধাপ ধরে saga-কে “compensating” করে, তারপর একটা message পাঠায় যা সাম্প্রতিক শেষ-হওয়া ধাপ ফেরায়; এভাবে শেষ থেকে শুরু পর্যন্ত চলে।'
    more: |
      orchestrator শেষ হওয়া প্রতিটা ধাপ saga টেবিলে লিখে রাখে। ফেল হলে একটা `CompensateNext` handler মাত্র একটা ধাপ ফেরায়, তারপর পরের message পাঠায়। অবস্থা লেখা থাকে বলে মাঝপথে crash হলেও ফেরানো সেখান থেকেই চলে।
    ref: saga-orchestrator
  - q: 'Saga-র উল্টো কাজ (compensation) নিজেই ফেল করলে কী হয়?'
    a: 'সফল না হওয়া পর্যন্ত বাড়তে থাকা অপেক্ষায় retry হয়, retry শেষ হলে একজন মানুষকে জানানো হয়। তাই প্রতিটা উল্টো কাজ বারবার চালানো নিরাপদ (idempotent) হতে হয়।'
    more: |
      refund ফেল হলে চুপ করে থাকা যায় না, ক্রেতার টাকা আটকে থাকে। Messenger-এর `retry_strategy` message আবার চালায়, আর যা কখনো সফল হয় না তা `failure_transport`-এ জমা থাকে। saga id-কে idempotency key ধরলে refund দুইবার চললেও টাকা একবারই যায়।
    ref: saga-orchestrator
  - q: 'Idempotent consumer কীভাবে বানাবেন?'
    a: 'প্রতিটা message-id একটা unique টেবিলে বসান; বসানো না গেলে (আগেই আছে) কিছু না করে ফিরে যান।'
    more: |
      `INSERT … ON CONFLICT DO NOTHING` দিয়ে affected rows দেখুন: ১ মানে প্রথমবার, ০ মানে ডুপ্লিকেট। কাজটা ডেটাবেসের হলে একই transaction-এ করুন, যাতে “করা হয়েছে” চিহ্ন আর কাজ একসাথে পাকা হয়।
    ref: idempotent-consumer

