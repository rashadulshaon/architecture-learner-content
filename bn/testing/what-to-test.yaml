slides:
  - slug: green-but-broken
    title: '৯৫% কভারেজ, তবু production-এ ভাঙল'
    kind: story
    tldr: 'কভারেজ বলে কোন লাইন চলেছে, কোন লাইন ঠিক আছে তা নয়। বেশিরভাগ টেস্ট যদি সহজ কোডে থাকে, তবে বাগ জমে থাকে ঝুঁকির জায়গাগুলোতে।'
    keywords: ['code coverage', 'risk based testing', 'test value', 'কভারেজ', 'টেস্ট', 'বাগ']
    blocks:
      - type: metaphor
        icon: lock
        title: 'বাসার তালা'
        body: |
          বাসায় সিন্দুকে গয়না, আর বারান্দায় ঝাড়ু। বুদ্ধিমান মানুষ সিন্দুকে মজবুত তালা দেয়, ঝাড়ুতে নয়। কিন্তু একজন "সব জিনিসে সমান তালা লাগাব" ঠিক করে ৪০০ বাক্সে তালা লাগাল, আর সিন্দুকে লাগাল একটা পুরোনো তালা। টেস্টও তাই: যেখানে ভাঙলে সবচেয়ে ক্ষতি, সেখানে বেশি টেস্ট। সহজ জায়গায় বেশি টেস্ট লিখে কভারেজ বাড়ালে কাজ হয় না।
      - type: visual
        kind: table
        caption: 'কভারেজ ৯৫%, কিন্তু টেস্ট আর বাগের বন্টন একেবারে উল্টো; শেষ কলাম চেষ্টা সরায়'
        headers: ['কোড', 'এখনকার টেস্ট', 'গত বছরের বাগ', 'ভালো ভাগ']
        rows:
          - cells: ['Entity-র getter/setter', '৪০০টা', '০টা', 'কয়েকটা']
            tip: 'এই কোডে ভাঙার কিছুই নেই। লাইনের সংখ্যায় এটাই সবচেয়ে বেশি, তাই কভারেজ ফুলে ওঠে। কয়েকটা রেখে বাকি চেষ্টা সরিয়ে নিন।'
          - cells: ['দাম ও ডিসকাউন্টের হিসাব', '৩টা', '৭টা', 'ডজনখানেক সীমার কেস']
            tip: 'এখানে সীমা, শতাংশ আর শর্ত জড়ানো, আর টাকা সরাসরি জড়িত। প্রতিটা সীমার দুই পাশে সস্তা unit test।'
          - cells: ['পেমেন্ট webhook', '০টা', '৪টা', 'প্রতিটা ফলের একটা টেস্ট']
            tip: 'বাইরের সার্ভিসের সাথে জোড়ার জায়গা। কেউ লেখেনি, কারণ mock করা কঠিন মনে হয়েছিল। সফল, ব্যর্থ আর দ্বিতীয়বার আসা (duplicate) ডেলিভারি, তিনটাই টেস্ট করুন।'
          - cells: ['ডেটাবেস migration', '০টা', '৩টা', 'পুরোনো ধাঁচের ডেটায় চালান']
            tip: 'একটা migration-এর ভুলে পুরো ডেটাবেস ঝুঁকিতে। প্রতিটা চালান পুরোনো, এলোমেলো ডেটার ওপর।'
      - type: quote
        body: 'কভারেজ বলে কোন লাইন চলেছে, কোন লাইন নিরাপদ তা নয়।'
    aside:
      - type: story
        title: 'সবুজ CI, ভুল দাম'
        body: |
          একটা টিম কভারেজ ৯০%-এর নিচে নামলে merge আটকে দিত। সবাই সহজ ক্লাসে টেস্ট যোগ করে সংখ্যা ঠিক রাখত। এদিকে ডিসকাউন্টের সীমার একটা `>` আসলে `>=` হওয়ার কথা ছিল। এক সপ্তাহ ধরে ঠিক সীমার অর্ডারে ছাড় মিলছিল না, কেউ টেস্টে ধরেনি।
      - type: terms
        items:
          - {term: 'Code coverage', meaning: 'টেস্ট চালানোর সময় কত শতাংশ কোড-লাইন অন্তত একবার চলেছে। সঠিকভাবে চলেছে কি না তা বলে না।'}
          - {term: 'Regression', meaning: 'আগে ঠিক ছিল, নতুন বদলে ভেঙে যাওয়া কাজ।'}
    check:
      q: 'কভারেজ ৯৫%, তবু দামের হিসাবে বাগ থেকে গেল। কভারেজ সংখ্যা এখানে কী বলতে পারেনি?'
      a: 'দামের কোডের লাইন হয়তো একবার চলেছে, কিন্তু সীমার মান, শতাংশ বা শর্ত ঠিক কি না কেউ যাচাই করেনি। সংখ্যা শুধু "চলেছে" গোনে, "ঠিক আছে" নয়।'

  - slug: risk-pyramid
    title: 'ঝুঁকি দেখে টেস্ট: পিরামিডের তিন স্তর'
    kind: concept
    tldr: 'অনেক দ্রুত unit test, কিছু integration test, কয়েকটা end-to-end। কোথায় বেশি দেবেন তা ঠিক হবে ঝুঁকি দিয়ে: ক্ষতি যত বড় আর ভাঙার সম্ভাবনা যত বেশি, টেস্ট তত।'
    keywords: ['test pyramid', 'unit test', 'integration test', 'end-to-end', 'risk', 'টেস্ট পিরামিড']
    blocks:
      - type: text
        body: |
          টেস্ট তিন ধরনের। **Unit test** একটা ছোট অংশ আলাদাভাবে যাচাই করে, ডেটাবেস বা নেটওয়ার্ক ছাড়া, তাই মিলিসেকেন্ডে চলে। **Integration test** কয়েকটা অংশ জুড়ে চালায়, সত্যিকারের ডেটাবেস বা HTTP সহ। **End-to-end (E2E)** ব্রাউজার থেকে ডেটাবেস পর্যন্ত পুরো যাত্রা ঘুরে আসে। ওপরে উঠলে টেস্ট বাস্তবের কাছে আসে, কিন্তু ধীর ও ভঙ্গুর হয় (ভঙ্গুর: ছোট, সম্পর্কহীন কারণেও ভাঙে)।
      - type: visual
        kind: layers
        caption: 'পিরামিড: নিচে অনেক, ওপরে কম'
        layers:
          - {label: 'End-to-end', sub: 'কয়েকটা: শুধু মূল যাত্রা', tone: bad, tip: 'যেমন লগইন থেকে অর্ডার পর্যন্ত একটা পথ। ধীর (সেকেন্ড থেকে মিনিট), আর ছোট UI বদলেও ভাঙে।'}
          - {label: 'Integration', sub: 'কিছু: সত্যিকারের ডেটাবেস ও HTTP', tone: warn, tip: 'query, config, controller-এর জোড়ার জায়গা। unit test যা ধরতে পারে না, এখানে তা ধরা পড়ে।'}
          - {label: 'Unit', sub: 'অনেক: হিসাব ও নিয়ম, মিলিসেকেন্ডে', tone: good, tip: 'দামের হিসাব, তারিখের নিয়ম, সীমার মান। সস্তা, দ্রুত, তাই সীমার কাছাকাছি প্রতিটা মান এখানে যাচাই করুন।'}
      - type: points
        title: 'কোথায় আগে টেস্ট বসাবেন'
        style: check
        items:
          - 'ক্ষতি বড়: টাকা, ডেটা হারানো, নিরাপত্তা (পেমেন্ট, ডিসকাউন্ট, অনুমতি)'
          - 'বারবার বদলায়: যে নিয়মে সবাই হাত দেয়'
          - 'জটিল: অনেক শর্ত বা সীমার কাছাকাছি মান'
          - 'জোড়ার জায়গা (যেখানে দুই অংশ জোড়া লাগে): query, config, বাইরের API'
      - type: quote
        body: 'টেস্ট লিখুন ঝুঁকির অনুপাতে, কোডের লাইনের অনুপাতে নয়।'
    aside:
      - type: remember
        body: 'যত ওপরে, তত বাস্তব কিন্তু তত ধীর। তাই ওপরে কম, নিচে বেশি।'
      - type: problem
        body: 'সব কিছু E2E-তে টেস্ট করলে suite ঘণ্টাখানেক লাগে, বারবার ভাঙে, কেউ চালায় না। শুধু unit test হলে জোড়ার ভুল (ভুল query, ভুল config) ধরা পড়ে না।'
      - type: when
        use:
          - 'যুক্তি-ভারী কোড (দাম, নিয়ম, হিসাব): অনেক unit test, কিছু integration test।'
        avoid:
          - 'যুক্তি কম, শুধু জোড়া দেওয়া কোড, যেমন সাধারণ CRUD: সেখানে unit test বেশিরভাগ mock-ই টেস্ট করে, তাই integration test-এ ঝুঁকুন।'
      - type: refs
        items:
          - {to: 'testing/test-types', label: 'Contract, load ও chaos test'}
    check:
      q: 'দামের হিসাবে ১০টা সীমার মান যাচাই করতে চান। কোন স্তরে লিখবেন, আর কেন?'
      a: 'Unit স্তরে: মিলিসেকেন্ডে চলে, ডেটাবেস লাগে না, তাই ডজন ডজন মান সস্তায় যাচাই করা যায়। E2E-তে একই কাজ ধীর ও ভঙ্গুর হত।'

  - slug: unit-and-kernel-tests
    title: 'PHPUnit: unit test আর KernelTestCase'
    kind: howto
    tldr: 'সুদ্ধ হিসাবের জন্য সাধারণ TestCase আর DataProvider। ডেটাবেস query বা service জোড়ার জন্য KernelTestCase: সত্যিকারের কনটেইনার ও ডেটাবেস নিয়ে।'
    keywords: ['PHPUnit', 'DataProvider', 'KernelTestCase', 'unit test', 'Doctrine', 'getContainer']
    blocks:
      - type: text
        body: |
          দামের নিয়ম একটা সাধারণ ক্লাস, তাই কোনো framework ছাড়াই টেস্ট হয়। সীমার কাছাকাছি মানগুলো `DataProvider`-এ লিখুন, যাতে একটা টেস্ট ফাংশন ডজন ডজন কেস চালায়। আর Doctrine query-র মতো জিনিস যেখানে কনটেইনার (যে বাক্সে আপনার সব service থাকে) ও ডেটাবেস লাগে, সেখানে `KernelTestCase`। সীমার কেসই সবচেয়ে জরুরি: নিয়ম "১০০,০০০ বা তার বেশি" হলে কোডে ভুল করে `>` লিখলে ঠিক ১০০,০০০ টাকার অর্ডারে ছাড় মেলে না। নিচের ১০০,০০০-এর কেস তখন `Failed asserting that 0 is identical to 10000` বলে ব্যর্থ হয়; ৫০,০০০ আর ২০০,০০০ দিয়ে টেস্ট করলে দুই কোডেই পাশ।
      - type: code
        lang: php
        file: 'tests/Unit/DiscountCalculatorTest.php'
        variant: good
        code: |
          final class DiscountCalculatorTest extends TestCase
          {
              #[DataProvider('cases')]
              public function testDiscount(int $subtotalPaisa, bool $isVip, int $expected): void
              {
                  $calculator = new DiscountCalculator();

                  self::assertSame($expected, $calculator->discountFor($subtotalPaisa, $isVip));
              }

              public static function cases(): iterable
              {
                  yield 'সীমার এক পয়সা নিচে, ছাড় নেই' => [99_999, false, 0];
                  yield 'ঠিক সীমায় ১০% ছাড়' => [100_000, false, 10_000];
                  yield 'VIP-র বাড়তি ৫%' => [100_000, true, 15_000];
                  yield 'শূন্য টাকার কার্ট' => [0, true, 0];
              }
          }
        marks:
          - {line: 3, tip: 'PHPUnit ১০+ এ DataProvider attribute। provider মেথড অবশ্যই static।'}
          - {line: 13, tip: '99_999 আর 100_000: সীমার ঠিক দুই পাশ। বেশিরভাগ বাগ এই সীমাতেই লুকিয়ে থাকে (> বনাম >=)।'}
          - {line: 16, tip: 'কেসের নাম বাংলায় লিখুন। ব্যর্থ হলে PHPUnit ওই নামটাই দেখায়, বোঝা সহজ হয়।'}
      - type: code
        lang: php
        file: 'tests/Integration/OrderRepositoryTest.php'
        variant: good
        code: |
          final class OrderRepositoryTest extends KernelTestCase
          {
              public function testFindsOnlyPendingOrdersOlderThanOneDay(): void
              {
                  self::bootKernel();
                  $em = self::getContainer()->get(EntityManagerInterface::class);

                  $t = static fn (string $ago) => new \DateTimeImmutable($ago);
                  $em->persist(new Order('ORD-1', OrderStatus::Pending, $t('-2 days')));
                  $em->persist(new Order('ORD-2', OrderStatus::Pending, $t('-1 hour')));
                  $em->persist(new Order('ORD-3', OrderStatus::Paid, $t('-3 days')));
                  $em->flush();

                  $stale = self::getContainer()->get(OrderRepository::class)
                      ->findStalePending(new \DateTimeImmutable('-1 day'));

                  self::assertSame(['ORD-1'], array_map(fn (Order $o) => $o->number(), $stale));
              }
          }
        marks:
          - {line: 5, tip: 'bootKernel() test environment-এ আসল কনটেইনার ও Doctrine তোলে।'}
          - {line: 6, tip: 'self::getContainer() টেস্টের বিশেষ কনটেইনার, যেখান থেকে private service-ও পাওয়া যায়।'}
          - {line: 9, tip: 'তিনটা অর্ডার তিন ধরনের: পুরোনো pending (পাওয়া উচিত), নতুন pending, পুরোনো paid। দুটো না-পাওয়ারও যাচাই এখানেই।'}
    aside:
      - type: commands
        title: 'PHPUnit ও টেস্ট ডেটাবেস'
        items:
          - {cmd: 'php bin/phpunit', desc: 'সব টেস্ট চালান'}
          - {cmd: 'php bin/phpunit --filter DiscountCalculatorTest', desc: 'শুধু একটা ক্লাস'}
          - {cmd: 'php bin/console doctrine:database:create --env=test', desc: 'আলাদা টেস্ট ডেটাবেস বানান'}
          - {cmd: 'php bin/console doctrine:migrations:migrate --env=test -n', desc: 'টেস্ট ডেটাবেসে migration চালান'}
      - type: tips
        items:
          - 'dama/doctrine-test-bundle প্রতিটা টেস্টকে transaction-এ মুড়ে শেষে rollback করে, ফলে ডেটা পরিষ্কার থাকে ও টেস্ট দ্রুত চলে।'
          - 'টেস্টের ডেটাবেস production-এর মতোই হওয়া উচিত (PostgreSQL), SQLite নয়। পরের বিষয়ে বিস্তারিত।'
      - type: refs
        items:
          - {to: 'testing/test-types', label: 'সত্যিকারের ডেটাবেসে integration test'}
    check:
      q: 'দাম হিসাবের টেস্টে ঠিক সীমার এক পয়সা নিচে ও ঠিক সীমায়, দুই মানই কেন যাচাই করছেন?'
      a: 'বেশিরভাগ হিসাবের ভুল হয় সীমায়: `>` ও `>=` গুলিয়ে ফেলা। সীমার দুই পাশের মান না দিলে এই ভুল টেস্টে ধরা পড়ে না।'

  - slug: web-test-case
    title: 'WebTestCase: HTTP পথ কাজ করছে কি না'
    kind: howto
    tldr: 'WebTestCase দিয়ে অ্যাপে আসল HTTP request পাঠান: routing, validation, serialization, security সব এক টেস্টে। E2E ব্রাউজার টেস্ট রাখুন শুধু মূল যাত্রার জন্য।'
    keywords: ['WebTestCase', 'functional test', 'HTTP test', 'Panther', 'assertResponseStatusCodeSame', 'jsonRequest']
    blocks:
      - type: text
        body: |
          ক্লায়েন্ট যা দেখে, সেটাই টেস্ট করার সবচেয়ে ভালো জায়গা: HTTP। `WebTestCase`-এর client ব্রাউজার ছাড়াই অ্যাপের ভেতরে request পাঠায়, তাই দ্রুত, কিন্তু routing, validation, serializer ও security সবই আসল। তিন স্তরের পার্থক্য নিচের table-এ।
      - type: code
        lang: php
        file: 'tests/Functional/CheckoutApiTest.php'
        variant: good
        code: |
          final class CheckoutApiTest extends WebTestCase
          {
              public function testEmptyCartIsRejected(): void
              {
                  $client = static::createClient();
                  $client->jsonRequest('POST', '/api/checkout', ['cartId' => 'empty-cart']);

                  self::assertResponseStatusCodeSame(422);
                  $json = $client->getResponse()->getContent();
                  $body = json_decode($json, true, flags: JSON_THROW_ON_ERROR);
                  self::assertArrayHasKey('violations', $body);
              }

              public function testValidCartCreatesOrder(): void
              {
                  $client = static::createClient();
                  $client->jsonRequest('POST', '/api/checkout', ['cartId' => 'cart-with-2-items']);

                  self::assertResponseStatusCodeSame(201);
                  self::assertResponseHeaderSame('content-type', 'application/json');
              }
          }
        marks:
          - {line: 5, tip: 'createClient() প্রতিটা টেস্টে নতুন kernel তোলে। জ্ঞাত অবস্থা দিয়ে শুরু, আগের টেস্টের ছাপ নেই।'}
          - {line: 10, tip: 'শুধু status নয়, উত্তরের ভেতরটাও দেখুন। 422 পেলেই কাজ শেষ নয়, কোন ভুল জানানো হলো সেটাও যাচাই।'}
      - type: visual
        kind: table
        caption: 'তিন ধরনের টেস্ট Symfony-তে'
        headers: ['', 'Unit', 'Integration', 'End-to-end']
        rows:
          - cells: ['Symfony-তে', 'TestCase', 'KernelTestCase, WebTestCase', 'Panther বা Playwright']
            tip: 'Panther আসল ব্রাউজার চালায়। Playwright আলাদা টুল, কিন্তু অনেকে এটাই ব্যবহার করে।'
          - cells: ['কী ছোঁয়', 'একটা ক্লাস, I/O ছাড়া', 'কনটেইনার, ডেটাবেস, HTTP', 'ব্রাউজার থেকে ডেটাবেস']
            tip: 'যত বেশি অংশ ছোঁয়, টেস্ট তত বাস্তব, কিন্তু তত ধীর ও ভঙ্গুর।'
          - cells: ['গতি', 'মিলিসেকেন্ড', 'দশ থেকে শত ms', 'সেকেন্ড বা বেশি']
            tip: 'এই কারণেই পিরামিডে নিচের স্তর বেশি।'
          - cells: ['কী ধরে', 'হিসাব ও নিয়মের ভুল', 'query, config, validation-এর ভুল', 'মূল যাত্রা ভাঙা']
            tip: 'প্রতিটা স্তর অন্য ধরনের ভুল ধরে। তাই একটা অন্যটার বিকল্প নয়।'
      - type: quote
        body: 'HTTP স্তরে টেস্ট করুন ক্লায়েন্ট যা দেখে, তা-ই: status, header ও body।'
    aside:
      - type: tips
        items:
          - 'E2E রাখুন মাত্র কয়েকটা: লগইন, অর্ডার দেওয়া, পেমেন্ট। বাকি সব নিচের স্তরে।'
          - 'WebTestCase-এ বাইরের API-র জন্য test environment-এ MockHttpClient বসান, নইলে আসল সার্ভিসে ডাক যাবে।'
          - '`empty-cart`-এর মতো cart id আসলে fixture: টেস্টেই বানান (বা fixture লোড করুন), যাতে প্রতিটা টেস্ট নিজের দরকারি ডেটা নিজেই সাজায়।'
      - type: refs
        items:
          - {to: 'api/error-design', label: 'Error response-এর নকশা'}
    check:
      q: 'checkout API-তে খালি কার্ট পাঠালে শুধু `assertResponseStatusCodeSame(422)` যথেষ্ট কেন নয়?'
      a: 'যেকোনো কারণেই 422 আসতে পারে। body-তে violations আছে কি না দেখলে বোঝা যায় ঠিক কেন ব্যর্থ হলো, আর ভুল কারণে পাশ করা টেস্ট ধরা পড়ে।'

  - slug: coverage-and-mocks-trap
    title: 'ফাঁদ: mock-ভরা টেস্ট আর কভারেজের লক্ষ্য'
    kind: pitfall
    tldr: 'যে টেস্ট শুধু "মেথড ডাকা হলো কি না" দেখে, সে ভুল দাম নিয়েও পাশ করে। ফল (outcome) যাচাই করুন, fake ব্যবহার করুন, আর কভারেজকে লক্ষ্য নয়, সংকেত মনে করুন।'
    keywords: ['mock', 'fake', 'test double', 'Infection', 'mutation testing', 'coverage target']
    blocks:
      - type: text
        body: |
          নিচের টেস্টে সব কিছু mock। সে শুধু দেখে `save()` একবার ডাকা হয়েছে। কিন্তু দাম ভুল হলেও `save()` ডাকা হয়, তাই ভাঙা কোডেও টেস্ট সবুজ। আবার ভেতরটা refactor করলে আচরণ ঠিক থাকলেও টেস্ট ভাঙে: দুইটাই ক্ষতি।
      - type: code
        lang: php
        file: 'tests/Unit/PlaceOrderTest.php'
        variant: bad
        code: |
          public function testPlaceSavesOrder(): void
          {
              $repo = $this->createMock(OrderRepository::class);
              $repo->expects($this->once())->method('save');   // শুধু "save ডাকা হলো"

              $service = new PlaceOrder($repo, new DiscountCalculator());
              $service(new PlaceOrderCommand('cart-1', 100_000));
              // মোট দাম ভুল হলেও টেস্ট পাশ
          }
        marks:
          - {line: 4, tip: 'এই লাইন কোডের ভেতরকার কাজের ধরন (কোন মেথড ডাকে) আটকে দেয়। refactor করলে সঠিক কোডেও টেস্ট ভাঙে।'}
          - {line: 8, tip: 'আসল প্রশ্ন, মোট দাম ঠিক কি না, এখানে কেউ করছেই না।'}
      - type: code
        lang: php
        file: 'tests/Unit/PlaceOrderTest.php'
        variant: good
        code: |
          // tests/Support/InMemoryOrderRepository.php: fake, ছোট কিন্তু সত্যিই কাজ করে
          final class InMemoryOrderRepository implements OrderRepository
          {
              private array $orders = [];

              public function save(Order $order): void
              {
                  $this->orders[] = $order;
              }

              public function last(): Order
              {
                  return end($this->orders) ?: throw new \LogicException('nothing saved');
              }
          }

          // tests/Unit/PlaceOrderTest.php
          public function testPlaceOrderAppliesTenPercentDiscount(): void
          {
              $repo = new InMemoryOrderRepository();

              $service = new PlaceOrder($repo, new DiscountCalculator());
              $service(new PlaceOrderCommand('cart-1', 100_000));

              self::assertSame(90_000, $repo->last()->totalPaisa());   // ফল যাচাই
          }
        marks:
          - {line: 20, tip: 'fake ছোট একটা আসল বাস্তবায়ন। কীভাবে কাজ হয় সে আপনার চিন্তা নয়, ফল ঠিক কি না সেটাই।'}
          - {line: 26, tip: '১০০,০০০ - ১০% = ৯০,০০০। দাম ভুল হলে এই লাইনে টেস্ট ব্যর্থ হবে, ঠিক যেমনটা দরকার।'}
      - type: points
        title: 'কভারেজকে কীভাবে দেখবেন'
        style: dot
        items:
          - 'কভারেজ কমে যাওয়া সতর্কসংকেত, কিন্তু উঁচু কভারেজ নিরাপত্তার প্রমাণ নয়'
          - 'কভারেজের লক্ষ্য বেঁধে দিলে মানুষ সহজ কোডে অকাজের টেস্ট বাড়ায়'
          - 'ভালো প্রশ্ন: "এই লাইন ভাঙলে কোনো টেস্ট কি ব্যর্থ হবে?"'
    aside:
      - type: tips
        items:
          - 'Infection (mutation testing) কোডে ইচ্ছা করে ছোট ভুল বসিয়ে দেখে টেস্ট ধরছে কি না। সবচেয়ে দামি জায়গায় মাঝে মাঝে চালান।'
          - 'Mock দরকার তখন, যখন ডাকাটাই ফল (যেমন ইমেইল পাঠানো ঠিক একবার)। সেখানেও পারলে fake।'
          - 'fake-এর দাম: সে আসল বাস্তবায়ন থেকে সরে যেতে পারে। তাই আসল repository-র একটা integration test রাখুন (KernelTestCase slide), যাতে দুটো একসাথে চলে।'
      - type: when
        use: ['fake: repository, clock, ইমেইল ইনবক্সের মতো সরল নির্ভরতায়']
        avoid: ['mock দিয়ে প্রতিটা ভেতরের মেথডকল আটকে দেওয়া', 'কভারেজ ৯০% ধরে merge আটকানো']
    check:
      q: 'কোডের ভেতরের কাজ পাল্টে (refactor) আচরণ একই রেখেছেন, কিন্তু টেস্ট ভেঙে গেল। এর সম্ভাব্য কারণ কী?'
      a: 'টেস্ট ফল নয়, বাস্তবায়ন আটকে রেখেছিল: কোন মেথড কতবার ডাকা হয়, সেটা। ফল (outcome) যাচাই করলে refactor-এ টেস্ট ভাঙত না।'

flashcards:
  - q: 'Risk-based testing কী?'
    a: 'টেস্টের চেষ্টা ঝুঁকির অনুপাতে ভাগ করা: যেখানে ভাঙলে ক্ষতি বড় ও ভাঙার সম্ভাবনা বেশি, সেখানে বেশি টেস্ট।'
    more: |
      টাকা, ডেটা হারানো, নিরাপত্তা, জটিল শর্ত ও জোড়ার জায়গা (query, বাইরের API) সবচেয়ে ঝুঁকিপূর্ণ। getter-setter বা সরল কোডে টেস্টের লাভ কম। ঝুঁকি দেখেই ঠিক হয় কোথায় সময় দেবেন।
    ref: risk-pyramid
  - q: 'Test pyramid কী বলে?'
    a: 'নিচে অনেক দ্রুত unit test, মাঝে কিছু integration, ওপরে কয়েকটা ধীর end-to-end।'
    more: |
      ওপরে উঠলে টেস্ট বাস্তবের কাছে আসে, কিন্তু ধীর ও ভঙ্গুর হয়। তাই সীমার মানের মতো অনেক কেস unit স্তরে, জোড়ার ভুল integration-এ, আর শুধু মূল যাত্রা E2E-তে।
    ref: risk-pyramid
  - q: 'কভারেজ কেন নিরাপত্তার প্রমাণ নয়?'
    a: 'কভারেজ গোনে কোন লাইন চলেছে, কোন লাইন ঠিক আছে তা যাচাই হয়েছে কি না নয়।'
    more: |
      assertion ছাড়া টেস্টও কোড চালিয়ে কভারেজ বাড়ায়। কভারেজের লক্ষ্য বেঁধে দিলে মানুষ সহজ কোডে অকাজের টেস্ট লেখে। Infection দিয়ে mutation testing করলে দেখা যায় টেস্ট সত্যিই ভুল ধরছে কি না।
    ref: green-but-broken
  - q: 'PHPUnit-এ DataProvider কখন কাজে লাগে?'
    a: 'একই যুক্তির অনেক ইনপুট-আউটপুট কেস থাকলে: একটা টেস্ট মেথড ডজন ডজন কেস চালায়, বিশেষ করে সীমার মানে।'
    more: |
      `#[DataProvider('cases')]` attribute দিয়ে static মেথড যুক্ত করুন। `yield 'নাম' => [ইনপুট..., প্রত্যাশিত]` দিলে ব্যর্থ কেসের নামও দেখা যায়। সীমার ঠিক দুই পাশের মান (যেমন ৯৯,৯৯৯ ও ১০০,০০০) অবশ্যই দিন। `>=`-এর জায়গায় ভুল `>` লিখলে শুধু ঠিক সীমার কেসটাই ব্যর্থ হয়।
    ref: unit-and-kernel-tests
  - q: 'KernelTestCase আর WebTestCase-এর পার্থক্য কী?'
    a: 'KernelTestCase কনটেইনার তুলে service সরাসরি টেস্ট করে। WebTestCase তার ওপর HTTP request পাঠানোর client দেয়।'
    more: |
      Doctrine query বা service জোড়ার জন্য KernelTestCase। routing, validation, serializer ও security সহ পুরো HTTP পথের জন্য WebTestCase। দুটোই আসল কনটেইনার ব্যবহার করে, তাই unit test-এর চেয়ে ধীর কিন্তু বাস্তবের কাছাকাছি।
    ref: web-test-case
  - q: 'Mock আর fake-এর পার্থক্য কী, কোনটা পছন্দ করবেন?'
    a: 'Mock যাচাই করে কোন মেথড ডাকা হলো। Fake ছোট একটা আসল বাস্তবায়ন। সাধারণত fake ভালো, কারণ ফল যাচাই করা যায়।'
    more: |
      InMemoryOrderRepository-র মতো fake সত্যিকারের কাজ করে, শুধু মেমোরিতে। টেস্ট শেষে ফল দেখে, কীভাবে হলো তা নয়, তাই refactor করলেও টেস্ট টেকে। Mock দরকার তখন, যখন ডাকাটাই ফল, যেমন ঠিক একবার ইমেইল পাঠানো।
    ref: coverage-and-mocks-trap
  - q: 'আসল repository-র বদলে fake ব্যবহারে কী ঝুঁকি, আর তা কীভাবে ঢাকবেন?'
    a: 'fake আসল বাস্তবায়ন থেকে সরে যেতে পারে। আসলটার আলাদা integration test (KernelTestCase) দিয়ে ঢাকুন।'
    more: |
      fake-সহ unit test দ্রুত ব্যবসায়িক ফল যাচাই করে। আসল repository-র integration test যাচাই করে আসল query fake-এর ভান অনুযায়ীই চলে কি না। দুটো মিলে সেই ফাঁক বন্ধ হয়, যা একা কেউ বন্ধ করতে পারে না।
    ref: coverage-and-mocks-trap

quiz:
  - q: 'সুমনের টিম কভারেজ ৯০% রাখার নিয়ম করেছে। নতুন সদস্য রবি সহজে লক্ষ্য ছুঁতে Entity-র getter-setter-এর ওপর ৫০টা টেস্ট লিখল। এতে কী হলো?'
    hint: 'যেখানে বাগ হয়, সেখানে কি টেস্ট বাড়ল?'
    options:
      - text: 'কভারেজ বাড়ল, কিন্তু ঝুঁকির জায়গায় সুরক্ষা বাড়ল না'
        correct: true
        why: 'getter-setter-এ ভাঙার কিছু নেই। কভারেজের সংখ্যা ফুলল, কিন্তু দাম, পেমেন্ট বা migration-এর সুরক্ষা আগের মতোই।'
      - text: 'সিস্টেম আরও নিরাপদ হলো, কারণ বেশি কোড টেস্ট হলো'
        correct: false
        why: 'টেস্টের সংখ্যায় নিরাপত্তা বাড়ে না। বাড়ে ঝুঁকির জায়গা যাচাই হলে।'
      - text: 'কভারেজ কমল, কারণ বেশি কোড যোগ হয়েছে'
        correct: false
        why: 'getter-setter-এ টেস্ট যোগ করলে কভারেজ বরং বাড়ে।'
      - text: 'টেস্ট দ্রুত হলো'
        correct: false
        why: 'টেস্ট সংখ্যায় বাড়লে সময়ও সামান্য বাড়ে, আর এটাই এখানকার মূল লাভ বা লক্ষ্য নয়।'
    ref: green-but-broken
  - q: 'কোন কোন কোডে বেশি টেস্ট বসানো সবচেয়ে বেশি লাভজনক?'
    hint: 'ক্ষতি কোথায় বড়, আর ভুল কোথায় বেশি হয়?'
    options:
      - text: 'ডিসকাউন্ট ও ট্যাক্সের হিসাব'
        correct: true
        why: 'টাকা সরাসরি জড়িত, সীমা ও শতাংশ জটিল, আর ভুল সহজেই চোখ এড়ায়।'
      - text: 'বাইরের পেমেন্ট webhook-এর handler'
        correct: true
        why: 'বাইরের সিস্টেমের সাথে জোড়ার জায়গা, ক্ষতি বড় (টাকা), আর ভুলের সম্ভাবনা বেশি।'
      - text: 'Entity-র সরল getter-setter'
        correct: false
        why: 'ভাঙার কিছুই নেই, টেস্ট লিখে সময়ের অপচয়।'
      - text: 'শুধু log লেখার ছোট helper'
        correct: false
        why: 'ক্ষতি ও জটিলতা দুটোই কম। ঝুঁকিপূর্ণ জায়গার পরে আসে।'
    ref: risk-pyramid
  - q: 'নিচের টেস্টে ঠিক কী সমস্যা?'
    lang: php
    code: |
      $repo = $this->createMock(OrderRepository::class);
      $repo->expects($this->once())->method('save');
      $service = new PlaceOrder($repo, new DiscountCalculator());
      $service(new PlaceOrderCommand('cart-1', 100_000));
    hint: 'দাম ভুল হলেও এই টেস্ট কি ব্যর্থ হবে?'
    options:
      - text: 'শুধু save ডাকা হয়েছে কি না দেখে; মোট দাম ভুল হলেও পাশ করবে'
        correct: true
        why: 'ফল যাচাই নেই। refactor করে ভেতরের কাঠামো বদলালেও এই টেস্ট ভেঙে যায়, অথচ আসল বাগ ধরে না।'
      - text: 'DiscountCalculator mock করা উচিত ছিল'
        correct: false
        why: 'এতে টেস্ট আরও ফাঁপা হত। বরং সত্যিকারের calculator রাখাই ভালো।'
      - text: 'টেস্টে $this->once() ব্যবহার নিষিদ্ধ'
        correct: false
        why: 'নিষিদ্ধ নয়। সমস্যা হলো শুধু এটুকুই যাচাই করা, ফল নয়।'
      - text: 'কোনো সমস্যা নেই'
        correct: false
        why: 'আছে: টেস্টটা বাগ ধরে না, আবার অকারণে ভঙ্গুর।'
    ref: coverage-and-mocks-trap
  - q: 'KernelTestCase দিয়ে নিচের কোনটা সবচেয়ে ভালোভাবে যাচাই হয়?'
    hint: 'কোথায় সত্যিকারের কনটেইনার ও ডেটাবেস দরকার?'
    options:
      - text: 'একটা Doctrine repository-র query সঠিক সারি ফিরিয়ে আনছে কি না'
        correct: true
        why: 'query-র ভুল শুধু আসল ডেটাবেসে ধরা পড়ে। unit test-এ mock করলে এটা যাচাই হয় না।'
      - text: 'একটা তারিখ-ফরম্যাট helper-এর আউটপুট'
        correct: false
        why: 'সুদ্ধ ফাংশন, কনটেইনার লাগে না। সাধারণ unit test যথেষ্ট ও দ্রুত।'
      - text: 'লগইন থেকে অর্ডার পর্যন্ত ব্রাউজারে সম্পূর্ণ যাত্রা'
        correct: false
        why: 'এটা E2E-র কাজ (Panther বা Playwright)।'
      - text: 'দামের শতাংশের সীমার ১০টা কেস'
        correct: false
        why: 'এটা unit test আর DataProvider-এর কাজ, মিলিসেকেন্ডে চলে।'
    ref: unit-and-kernel-tests
  - q: 'নিয়ম: "১০০,০০০ পয়সা থেকে ১০% ছাড়"। কোডে ভুল করে `>=`-এর বদলে `>` লেখা। কোন টেস্ট-মান এই ভুল ধরবে?'
    hint: 'কোন মানে `>` আর `>=` একই উত্তর দেয়?'
    options:
      - text: '৫০,০০০ আর ২০০,০০০'
        correct: false
        why: 'এই দুই মানের প্রতিটায় দুই সংস্করণ একই উত্তর দেয়, তাই ভুল লুকিয়ে থাকে।'
      - text: '১০০,০০১ আর ৫০০,০০০'
        correct: false
        why: 'দুটোই সীমার ওপরে, তাই `>` আর `>=` একমত।'
      - text: '৯৯,৯৯৯ আর ১০০,০০০'
        correct: true
        why: 'ঠিক ১০০,০০০-এ সঠিক কোড ১০,০০০ ছাড় দেয়, ভুল কোড দেয় ০, তাই টেস্ট ব্যর্থ হয়।'
      - text: 'দশটা এলোমেলো অঙ্ক'
        correct: false
        why: 'ঠিক ১০০,০০০ পড়ার সম্ভাবনা খুব কম। সীমার মান ইচ্ছা করে বেছে নিতে হয়।'
    ref: unit-and-kernel-tests
  - q: 'টিমে সব টেস্ট E2E (ব্রাউজার) হিসেবে লেখা হয়েছে। suite ৪৫ মিনিট লাগে, প্রায়ই অকারণে ভাঙে। কোন কোন সিদ্ধান্ত ঠিক?'
    hint: 'পিরামিডটা মনে করুন।'
    options:
      - text: 'সীমার মানের মতো হিসাবের কেসগুলো unit test-এ সরানো'
        correct: true
        why: 'unit test মিলিসেকেন্ডে চলে, আর শত শত কেস সস্তায় যাচাই করা যায়।'
      - text: 'E2E শুধু ২-৩টা মূল যাত্রায় সীমিত রাখা'
        correct: true
        why: 'ধীর ও ভঙ্গুর টেস্ট কম হলে suite দ্রুত ও নির্ভরযোগ্য হয়।'
      - text: 'আরও E2E যোগ করা, কারণ এগুলোই সবচেয়ে বাস্তব'
        correct: false
        why: 'বাস্তব, কিন্তু ধীর ও ভঙ্গুর। আরও যোগ করলে সমস্যা বাড়বে।'
      - text: 'টেস্ট ভাঙলে বন্ধ করে দেওয়া'
        correct: false
        why: 'টেস্ট বন্ধ করলে সুরক্ষাই যায়। ঠিক জায়গায় সরিয়ে আনাই সমাধান।'
    ref: web-test-case
