      - text: 'schema ও example `charge` করা, unit test ব্যর্থ হতে দেখা, তারপর provider-কে `charge` পড়ানো'
        correct: true
        why: 'চুক্তি এখন আসল API-র সাথে মেলে, ব্যর্থ unit test দেখিয়ে দেয় কোন কোড বদলাতে হবে, আর দুটোই একসাথে সবুজ হয়।'
      - text: 'শুধু provider বদলানো, schema যেমন আছে থাকুক'
