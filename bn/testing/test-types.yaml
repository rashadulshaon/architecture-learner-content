        why: 'schema তখনো পুরোনো API বর্ণনা করে, তাই রাতের রান ব্যর্থই থাকে, আর পুরোনো example থেকে বানানো mock বদলটা লুকিয়ে রাখে।'
    ref: contract-failure-loop
  - q: 'কুরিয়ার 503 ফেরত দিলে checkout-এ error পাতা আসে। ভুল কোথায়, আর সমাধান কী?'
    lang: php
    code: |
      public function chargeFor(string $district, int $grams): ?int
      {
          $data = $this->client->request('GET', '/v1/rates', [
              'query' => ['district' => $district, 'weight' => $grams],
          ])->toArray();

          return $data['charge_paisa'];
      }
    hint: '5xx উত্তরে toArray() কী করে?'
    options:
      - text: 'toArray() 503-এ exception ছোড়ে, আর কেউ ধরে না; কলটা ExceptionInterface-এর try/catch-এ মুড়ে log করে null ফেরান'
        correct: true
        why: 'ExceptionInterface 5xx উত্তর, timeout ও ভাঙা JSON, সবই ধরে, তাই একটা catch-ই checkout বাঁচায়।'
      - text: 'কিছু ভুল নেই: HttpClient নিজেই 503 হলে সফল হওয়া পর্যন্ত retry করে'
        correct: false
        why: 'সাধারণ HttpClient retry করে না; শুধু RetryableHttpClient করে, আর সে-ও একসময় হাল ছাড়ে।'
      - text: 'শুধু TransportExceptionInterface ধরলেই সব ব্যর্থতা সামলানো যায়'
        correct: false
        why: 'সে timeout ও সংযোগ-ভাঙা ধরে, কিন্তু 503 আসে ServerException হয়ে, আর তা ফসকে যায়।'
      - text: '`$data[''charge_paisa'']`-র পরে `?? 0` বসানো'
        correct: false
        why: 'exception ছোড়া হয় আগেই, toArray()-তে, তাই এই লাইনে পৌঁছানোই হয় না। আর নীরব শূন্যই তো আসল বাগ।'
    ref: chaos-failure-injection
  - q: 'টিম প্রথমবার chaos test চালাবে। কোন কোন পদক্ষেপ ঠিক?'
