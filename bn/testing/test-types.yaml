        items:
          - {to: 'resilience/circuit-breakers', label: 'Circuit breaker ও retry'}
          - {to: 'resilience/disaster-recovery', label: 'Game day'}
    check:
      q: 'MockResponse-এ `http_code => 503` আর `error => ...` দুইটাই কেন দরকার?'
      a: 'দুইটা আলাদা ব্যর্থতা: ৫০৩ মানে সার্ভার উত্তর দিল কিন্তু অসুস্থ; error মানে নেটওয়ার্ক বা timeout, উত্তরই এল না। কোড দুই ক্ষেত্রেই ঠিক আচরণ করে কি না দেখা দরকার।'

flashcards:
  - q: 'Contract test কী যাচাই করে?'
    a: 'বাইরের API-র কাছে আমরা যা আশা করি (ফিল্ড ও ধরন) আর সে আসলে যা দেয়, তাদের মিল।'
    more: |
      আশা করা উত্তর একটা schema ফাইলে লেখা থাকে। আমাদের টেস্টের mock এই ফাইলের উদাহরণ থেকে তৈরি, আর রাতের টেস্টে আসল sandbox-এর উত্তর একই schema-র সাথে মেলানো হয়। অন্য পক্ষ নীরবে ফিল্ড বদলালে আমরা আগে জানতে পারি।
    ref: contract-tests
  - q: 'Unit test কেন বাইরের API-র ফিল্ড বদল ধরে না?'
    a: 'কারণ mock আমাদের কল্পনার পুরোনো উত্তরই দেয়, আসল API কী পাঠাচ্ছে সে জানেই না।'
    more: |
      mock-এর উত্তর নিজে হাতে লেখা। বাইরের পক্ষ উত্তর বদলালেও সে বদলায় না, তাই টেস্ট সবুজ থাকে আর production ভাঙে। সমাধান contract test, যেখানে mock চুক্তির উদাহরণ থেকে আসে আর আসল উত্তর চুক্তির সাথে যাচাই হয়।
    ref: different-tests-different-bugs
  - q: 'Integration test কেন SQLite নয়, আসল PostgreSQL-এ চালানো উচিত?'
    a: 'কারণ unique index, FOR UPDATE, JSONB ও migration-এর আচরণ ডেটাবেসভেদে আলাদা। শুধু আসলটাই production-এর আচরণ দেখায়।'
    more: |
      SQLite-এ টেস্ট সবুজ, production-এ ভাঙা: সবচেয়ে বিরক্তিকর অভিজ্ঞতার একটা। compose.test.yaml দিয়ে production-এর একই major version-এর PostgreSQL চালান, tmpfs-এ ডেটা রাখলে দ্রুতও হয়।
    ref: integration-real-deps
  - q: 'k6 টেস্টে threshold কী কাজে লাগে?'
    a: 'সীমা পেরোলে টেস্ট নিজেই ব্যর্থ হয় (exit code ≠ 0), তাই CI-তে load test স্বয়ংক্রিয়ভাবে পাশ-ফেল ঠিক করতে পারে।'
    more: |
      যেমন `http_req_duration: ['p(95)<500']` মানে ৯৫% request ৫০০ms-এর নিচে, `http_req_failed: ['rate<0.01']` মানে ব্যর্থতা ১%-এর কম। সংখ্যাগুলো আপনার SLO থেকে ঠিক করুন, আন্দাজে নয়।
    ref: load-testing-k6
  - q: 'Load, stress, spike ও soak test-এর পার্থক্য কী?'
    a: 'Load: প্রত্যাশিত ভিড়। Stress: ভাঙা পর্যন্ত বাড়ানো। Spike: হঠাৎ ধাক্কা। Soak: ঘণ্টার পর ঘণ্টা চালানো।'
    more: |
      Load ভিত্তি। Stress জানায় ভাঙার সীমা ও ভাঙার ধরন। Spike পরীক্ষা করে autoscaling ও queue সীমা। Soak ধরে memory leak আর connection ফাঁসের মতো ধীর সমস্যা, যা ছোট টেস্টে দেখা যায় না।
    ref: load-testing-k6
  - q: 'Chaos test কী, আর কেন লাগে?'
    a: 'ইচ্ছা করে একটা নির্ভরতা ভেঙে দেখা সিস্টেম প্রত্যাশামতো আচরণ করে কি না। fallback ও breaker কাগজে নয়, কাজে প্রমাণ হয়।'
    more: |
      পাঁচ ধাপ: স্বাভাবিক অবস্থা মাপা, অনুমান লেখা, ছোট করে ভাঙা, পর্যবেক্ষণ, ঠিক করা। শুরু করুন কোডের টেস্টে (MockHttpClient দিয়ে 503 বা timeout), তারপর staging-এ Toxiproxy দিয়ে।
    ref: chaos-failure-injection
  - q: 'MockHttpClient দিয়ে timeout কীভাবে নকল করবেন?'
    a: '`error` option দিয়ে MockResponse বানান: উত্তর পড়ার সময় TransportException ছুড়বে, ঠিক আসল timeout-এর মতো।'
    more: |
      `['http_code' => 503]` দিলে সার্ভার-অসুস্থ ধরনের ব্যর্থতা পাওয়া যায়, আর `error` দিলে নেটওয়ার্ক-ব্যর্থতা। MockHttpClient-এ একাধিক MockResponse একটা array-তে দিলে ক্রমানুসারে প্রতিটা request-এর জন্য একটা করে ফেরত যায়।
    ref: chaos-failure-injection
  - q: 'Contract schema-তে যে ফিল্ড পড়া হয় তা `required` করা কেন?'
    a: 'যাতে নাম বদল বা ফিল্ড হারানোয় রাতের রান ব্যর্থ হয়ে ফিল্ডের নাম বলে দেয়, কোড `?? 0`-এর মতো fallback-এ নীরবে চলে না যায়।'
    more: |
      `required` না থাকলে হারানো ফিল্ডও বৈধ ধরা হয়। শুধু কোড যা সত্যিই পড়ে তাই লিখুন, তাহলে অন্য পক্ষের নিরীহ বাড়তি ফিল্ডে রান ব্যর্থ হবে না। দাম: বদলের খবর আসে এক দিন পর্যন্ত দেরিতে, তাই production-এ alert-ও রাখুন।
    ref: contract-failure-loop
  - q: 'বাইরের API ডাকা কোড 503 বা timeout সামলাতে কী করবে?'
    a: 'HttpClient-এর `ExceptionInterface` ধরবে, log করবে, null ফেরাবে, যাতে ডাকনেওয়ালা ক্র্যাশ না করে ডেফল্ট ব্যবহার করতে পারে।'
    more: |
      `ExceptionInterface` 5xx উত্তর, timeout ও ভাঙা JSON, সবই ধরে। শুধু `TransportExceptionInterface` ধরলে timeout সামলানো যায়, কিন্তু 503 ফসকে যায়। ফ্ল্যাট ডেলিভারি চার্জের মতো ডেফল্ট একটা ব্যবসায়িক সিদ্ধান্ত, তাই ব্যবহার হলে log ও alert রাখুন।
    ref: chaos-failure-injection

quiz:
  - q: 'রাশেদের অ্যাপ বাইরের একটা exchange-rate API ডাকে। API নীরবে `rate`-কে `exchange_rate` বানাল। রাশেদের সব unit test সবুজ। কোন টেস্ট এটা ধরত?'
    hint: 'যে টেস্ট আসল API-র উত্তর যাচাই করে।'
    options:
      - text: 'Contract test: আসল sandbox-এর উত্তর schema-র সাথে মিলিয়ে'
        correct: true
        why: 'schema-তে `rate` লেখা, আসল উত্তরে `exchange_rate`: মিল নেই, টেস্ট ব্যর্থ।'
      - text: 'আরও unit test লেখা'
        correct: false
        why: 'unit test-এ mock আমাদের লেখা পুরোনো উত্তরই দেয়, নতুন বদল সে দেখেই না।'
      - text: 'Load test'
        correct: false
        why: 'load test ভিড়ে ধীরতা ও ব্যর্থতা দেখে, উত্তরের ধরন নয়।'
      - text: 'কোড coverage বাড়ানো'
        correct: false
        why: 'কোডের লাইন চললেও উত্তরের ফিল্ড ঠিক কি না যাচাই হয় না।'
    ref: contract-tests
  - q: 'নিচের কোন কোন ভুল শুধু আসল PostgreSQL-এ চালানো integration test-ই ধরতে পারে?'
    hint: 'যে আচরণ ডেটাবেসের নিজের, mock বা SQLite-এর নয়।'
    options:
      - text: 'LOWER(email)-এর unique index বড়-ছোট হাতের ডুপ্লিকেট আটকাচ্ছে কি না'
        correct: true
        why: 'index-এর আচরণ ডেটাবেসের নিজের। SQLite বা mock-এ সে আলাদা বা অনুপস্থিত।'
      - text: 'SELECT ... FOR UPDATE সারি lock করছে কি না'
        correct: true
        why: 'lock PostgreSQL-এর বৈশিষ্ট্য। mock-এ এটা যাচাই করার উপায়ই নেই।'
      - text: '`discountFor()` মেথড ১০% সঠিক হিসাব করছে কি না'
        correct: false
        why: 'সুদ্ধ হিসাব, ডেটাবেস লাগে না। unit test-ই যথেষ্ট ও দ্রুত।'
      - text: 'একটা ক্লাসের getter ঠিক মান ফেরায় কি না'
        correct: false
        why: 'এখানে ডেটাবেসের কিছু নেই।'
    ref: integration-real-deps
  - q: 'তানিয়ার k6 স্ক্রিপ্ট ১০০ virtual user-এ চালিয়ে সাইট ভেঙে দিল, কিন্তু স্ক্রিপ্টে sleep নেই। ফল নিয়ে কী বলা সবচেয়ে সঠিক?'
    hint: 'আসল ব্যবহারকারী কি বিরতি ছাড়া request ছোড়ে?'
    options:
      - text: 'ফল বিভ্রান্তিকর: বিরতিহীন request আসল আচরণের চেয়ে অনেক বেশি চাপ দেয়, "১০০ user"-এর সংখ্যা তাই বাস্তব নয়'
        correct: true
        why: 'আসল user পাতা পড়ে, ভাবে, ক্লিক করে। ২০ms-এর উত্তরে sleep ছাড়া virtual user সেকেন্ডে প্রায় ৫০টা request পাঠায়, আসল user পাঠায় প্রায় ১টা। তাই ১০০ জন হাজার হাজার আসল user-এর মতো ঠেলা দেয়।'
      - text: 'ফল নির্ভুল, কারণ বেশি চাপ মানে বেশি নিরাপদ'
        correct: false
        why: 'ভুল সংখ্যায় ক্ষমতার সীমা ভুল অনুমান হয়, সার্ভার অকারণে বাড়ানো বা কমানো হতে পারে।'
      - text: 'sleep শুধু স্ক্রিপ্ট ধীর করে, ফলে কোনো পার্থক্য নেই'
        correct: false
        why: 'পার্থক্য বিশাল: প্রতি সেকেন্ডে কতগুলো request যায়, তা সরাসরি sleep-এর ওপর নির্ভর করে।'
      - text: 'শুধু staging-এ নয়, production-এ সরাসরি চালাতে হত'
        correct: false
        why: 'production-এ অপরীক্ষিত ভিড় ঢোকানো বিপজ্জনক। সমস্যা staging-এ করা টেস্টের নকশায়।'
    ref: load-testing-k6
  - q: 'এই টেস্টের উদ্দেশ্য কী, আর কী ঘটলে ব্যর্থ হবে?'
    lang: php
    code: |
      $client = new MockHttpClient([
          new MockResponse('', ['http_code' => 503]),
          new MockResponse('', ['error' => 'connection timed out']),
      ], 'https://api.courier.example');

      $provider = new CourierRateProvider($client, new NullLogger());

      self::assertNull($provider->chargeFor('dhaka', 500));
      self::assertNull($provider->chargeFor('dhaka', 500));
    hint: 'দুটো mock উত্তর আসলে কী ধরনের ব্যর্থতা?'
    options:
