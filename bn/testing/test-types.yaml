slides:
  - slug: different-tests-different-bugs
    title: 'সব unit test সবুজ, তবু কুরিয়ার API ভাঙল'
    kind: story
    tldr: 'প্রতিটা ধরনের টেস্ট আলাদা ধরনের ভুল ধরে। কুরিয়ার API-র ফিল্ড বদলালে unit test সবুজই থাকে, কারণ mock পুরোনো উত্তরই দেয়। তাই পাঁচ ধরন দরকার।'
    keywords: ['contract test', 'integration test', 'load test', 'chaos test', 'test types', 'টেস্টের ধরন']
    blocks:
      - type: metaphor
        icon: building
        title: 'হাসপাতালের পরীক্ষা'
        body: |
          একজন রোগীর জন্য ডাক্তার একটা পরীক্ষাই করান না। রক্ত পরীক্ষা এক রোগ ধরে, এক্স-রে আরেক রোগ, আর ট্রেডমিল স্ট্রেস টেস্ট ধরে হৃদয় পরিশ্রম সইতে পারে কি না। একটাতে সুস্থ মানে বাকিগুলোতেও সুস্থ নয়। সফটওয়্যারেও তাই: প্রতিটা ধরনের টেস্ট নিজের ধরনের ভুল ধরে, বাকিগুলো ধরে না।
      - type: text
        body: |
          আমাদের শিপিং কোড কুরিয়ার API-র `charge_paisa` ফিল্ড পড়ে। কুরিয়ার নীরবে ফিল্ডের নাম `charge` করে দিল। আমাদের unit test **mock** (আসল API না ডেকে তৈরি করা নকল উত্তর) দিয়ে পুরোনো উত্তরই পাচ্ছে, তাই সব সবুজ, কিন্তু production-এ ডেলিভারি চার্জ শূন্য আসছে।
      - type: visual
        kind: table
        caption: 'পাঁচ ধরনের টেস্ট: কী ধরে, কী ধরে না'
        headers: ['টেস্ট', 'কী ধরে', 'কী ধরে না']
        rows:
          - cells: ['Unit', 'হিসাব ও নিয়মের ভুল', 'জোড়া ও বাইরের বদল']
            tip: 'দ্রুত, কিন্তু mock-এর বাইরের জগৎ সম্পর্কে অন্ধ।'
          - cells: ['Contract', 'বাইরের API-র ফিল্ড বা ধরন বদল', 'ধীর বা ভারী ট্রাফিক']
            tip: 'আমরা যা আশা করি আর অন্যপক্ষ যা দেয়, তাদের মিল যাচাই করে।'
          - cells: ['Integration', 'query, config, migration-এর ভুল', 'ভিড়ের চাপ']
            tip: 'আসল ডেটাবেস বা কিউয়ের সাথে চালিয়ে জোড়ার (যেখানে দুই অংশ মেলে) ভুল ধরে।'
          - cells: ['Load', 'ধীরতা, ভিড়ে ভাঙন', 'হিসাবের ভুল']
            tip: 'ভিড় দিয়ে দেখে কোন অংশ আগে হাঁপিয়ে ওঠে।'
          - cells: ['Chaos', 'ব্যর্থতায় ব্যবহার ঠিক কি না', 'স্বাভাবিক অবস্থার ভুল']
            tip: 'ইচ্ছা করে নির্ভরতা ভেঙে দেখে fallback (বিকল্প পথ) ও breaker (অসুস্থ সার্ভিসে ডাক বন্ধ করা সুইচ) সত্যিই কাজ করে কি না।'
      - type: quote
        body: 'প্রতিটা টেস্টের ধরন নিজের ভুল ধরে। একটা সবুজ মানে সবকিছু সবুজ নয়।'
    aside:
      - type: story
        title: 'নীরবে বদলানো ফিল্ড'
        body: |
          একটা ই-কমার্স টিমের কুরিয়ার সার্ভিস একদিন ফিল্ডের নাম বদলে নতুন সংস্করণে গিয়েছিল। টিমের সব টেস্ট পাশ। সাত ঘণ্টা ধরে অর্ডারে ডেলিভারি চার্জ ০ গেছে, কারণ কোডে `?? 0` ছিল। কেউ বুঝতে পারেনি কোথাও কিছু ভাঙল।
      - type: refs
        items:
          - {to: 'testing/what-to-test', label: 'কী টেস্ট করার মতো'}
    check:
      q: 'কুরিয়ার API-র একটা ফিল্ডের নাম বদলে গেল। কোন ধরনের টেস্ট এটা ধরত, আর unit test কেন ধরেনি?'
      a: 'Contract test ধরত, কারণ সে আমাদের প্রত্যাশা (schema) আসল উত্তরের সাথে মেলায়। unit test-এ mock পুরোনো উত্তরই ফেরায়, তাই বদল তার চোখেই পড়ে না।'

  - slug: contract-tests
    title: 'Contract test: দুই পক্ষের চুক্তি যাচাই'
    kind: howto
    tldr: 'বাইরের API-র কাছে আমরা কী আশা করি তা একটা schema ফাইলে লিখে রাখুন। আমাদের টেস্ট mock বানায় সেই ফাইল থেকে, আর রাতে আসল sandbox-এর উত্তর একই schema-র সাথে মেলানো হয়।'
    keywords: ['contract testing', 'consumer-driven', 'JSON schema', 'MockHttpClient', 'sandbox', 'Pact']
    blocks:
      - type: text
        body: |
          দুই পক্ষ একটা লিখিত চুক্তি রাখে: "উত্তরে `charge_paisa` নামে একটা পূর্ণসংখ্যা থাকবে।" **Contract test** এই চুক্তি দুই দিকেই যাচাই করে। আমাদের দিকে: কোড চুক্তি মেনে পড়ে কি না। অন্য দিকে: আসল API এখনো চুক্তি মেনে চলছে কি না। এখানে আমরা consumer (ব্যবহারকারী), কুরিয়ার provider (সরবরাহকারী)।
      - type: visual
        kind: flow
        caption: 'চুক্তি ফাইল দুই পক্ষকেই বাঁধে'
        nodes:
          - {id: app, label: 'আমাদের অ্যাপ', sub: 'consumer', icon: code, col: 0, row: 1, tip: 'আমাদের টেস্ট mock বানায় ঠিক এই চুক্তি থেকে, ফলে mock কখনো কল্পনার উত্তর দেয় না।'}
          - {id: contract, label: 'চুক্তি (schema)', sub: 'courier-rates.schema.json', icon: file, tone: accent, col: 2, row: 1, tip: 'আমরা যা আশা করি তা লেখা: কোন ফিল্ড, কী ধরন। repository-তে থাকে।'}
          - {id: courier, label: 'কুরিয়ার sandbox', sub: 'provider', icon: truck, col: 4, row: 1, tip: 'কুরিয়ারের পরীক্ষার পরিবেশ। আসল টাকা বা আসল ডেলিভারি জড়িত নয়।'}
        edges:
          - {from: app, to: contract, label: 'আমরা যা আশা করি, লিখে রাখি'}
          - {from: contract, to: app, label: 'আমাদের টেস্টের mock এই চুক্তি থেকে তৈরি', dashed: true}
          - {from: courier, to: contract, label: 'রাতের টেস্টে আসল উত্তর চুক্তির সাথে মেলানো হয়', tone: warn}
          - {from: contract, to: courier, label: 'মিল না থাকলে টেস্ট ব্যর্থ, আমরা আগেই জানি', tone: bad, dashed: true}
      - type: code
        lang: php
        file: 'tests/Contract/CourierContractTest.php'
        variant: good
        code: |
          #[Group('contract')]   // রাতের পাইপলাইনে চলে, প্রতি commit-এ নয়
          final class CourierContractTest extends TestCase
          {
              public function testSandboxResponseMatchesOurSchema(): void
              {
                  $client = HttpClient::createForBaseUri(getenv('COURIER_SANDBOX_URL'), [
                      'auth_bearer' => getenv('COURIER_SANDBOX_TOKEN'),
                      'timeout' => 5,
                  ]);

                  $body = $client->request('GET', '/v1/rates?district=dhaka&weight=500')->getContent();

                  $validator = new Validator();
                  $schema = json_decode(file_get_contents(__DIR__.'/courier-rates.schema.json'));
                  $validator->validate(json_decode($body), $schema);

                  self::assertTrue($validator->isValid(), json_encode($validator->getErrors()));
              }
          }
        marks:
          - {line: 1, tip: 'ধীর ও বাইরের নেটওয়ার্কে নির্ভরশীল বলে আলাদা group। প্রতি commit-এ চালালে CI ভঙ্গুর হবে।'}
          - {line: 6, tip: 'আসল sandbox, প্রোডাকশন নয়। টোকেন environment variable থেকে, কোডে বসানো নয়।'}
          - {line: 17, tip: 'ব্যর্থ হলে getErrors() ঠিক কোন ফিল্ড মেলেনি তা বলে দেয়, আন্দাজ করতে হয় না।'}
      - type: code
        lang: php
        file: 'tests/Unit/CourierRateProviderTest.php'
        variant: good
        code: |
          public function testReadsChargeFromExampleOfTheContract(): void
          {
              // mock-এর উত্তর কল্পনা থেকে নয়, চুক্তির উদাহরণ ফাইল থেকে
              $example = file_get_contents(__DIR__.'/../Contract/courier-rates.example.json');
              $client = new MockHttpClient(new MockResponse($example), 'https://api.courier.example');

              $provider = new CourierRateProvider($client, new NullLogger());

              self::assertSame(12_000, $provider->chargeFor('dhaka', 500));
          }
        marks:
          - {line: 4, tip: 'এই example ফাইল আর schema পাশাপাশি থাকে। schema বদলালে example-ও বদলাতে হয়, না হলে রাতের টেস্ট ধরে ফেলে।'}
    aside:
      - type: terms
        items:
          - {term: 'Consumer', meaning: 'যে পক্ষ অন্যের API ডাকে এবং তার উত্তরের ওপর নির্ভর করে।'}
          - {term: 'Provider', meaning: 'যে পক্ষ API দেয়। কোনো ফিল্ড বদলালে consumer-এর ভাঙে।'}
      - type: tips
        items:
          - 'নিজের API অন্যদের দিলে উল্টোটাও করুন: consumer-দের প্রত্যাশা (Pact বা OpenAPI) আপনার CI-তে যাচাই করুন।'
          - 'sandbox সবসময় production-এর মতো চলে না। তাই এই টেস্ট সংকেত, প্রমাণ নয়; ব্যর্থ হলে তদন্ত করুন।'
      - type: refs
        items:
          - {to: 'api/contracts-versioning', label: 'API চুক্তি ও ভার্সনিং'}
          - {to: 'ledgers/third-party-integrations', label: 'বাইরের সার্ভিস ইন্টিগ্রেশন'}
    check:
      q: 'Contract test-এর mock উত্তর চুক্তির example ফাইল থেকে নেওয়া হয় কেন, নিজের লেখা JSON থেকে নয়?'
      a: 'নিজে লেখা mock কল্পনা, বাস্তবের সাথে মিলছে কি না কেউ জানে না। চুক্তির example যদি রাতের টেস্টে আসল উত্তরের সাথে মেলানো হয়, তবে mock-ও বাস্তবের সাথে সংযুক্ত থাকে।'

  - slug: contract-failure-loop
    title: 'চুক্তির ফাইল, আর ফিল্ডের নাম বদলালে কী দেখা যায়'
    kind: howto
    tldr: 'schema-তে যে ফিল্ড পড়েন তা required করে রাখুন। কুরিয়ার নাম বদলালে রাতের টেস্ট ব্যর্থ হয়ে ফিল্ডের নাম বলে দেয়, অর্ডার ০ চার্জে যায় না। দাম: খবর আসে এক দিন দেরিতে।'
    keywords: ['JSON schema', 'required field', 'contract failure', 'nightly test', 'কনট্র্যাক্ট ব্যর্থ', 'schema example']
    blocks:
      - type: text
        body: |
          চুক্তিটা একটা ছোট **JSON Schema** ফাইল: JSON উত্তর দেখতে কেমন হতে হবে তার বর্ণনা। সেখানে `charge_paisa` **required** আর পূর্ণসংখ্যা। এই একটা শব্দই গল্পের `?? 0`-কে নাম বদল লুকাতে দেয় না, কারণ ফিল্ড না থাকা এখন ব্যর্থতা, শূন্য নয়। পাশের example ফাইল `{"charge_paisa": 12000, "currency": "BDT"}` unit test ব্যবহার করে (১২,০০০ পয়সা মানে ১২০ টাকা)।
      - type: code
        lang: json
        file: 'tests/Contract/courier-rates.schema.json'
        variant: good
        code: |
          {
            "$schema": "http://json-schema.org/draft-04/schema#",
            "type": "object",
            "required": ["charge_paisa", "currency"],
            "properties": {
              "charge_paisa": {"type": "integer", "minimum": 0},
              "currency": {"type": "string", "enum": ["BDT"]}
            }
          }
        marks:
          - {line: 4, tip: 'এই লাইন না থাকলে ফিল্ড হারিয়ে গেলেও যাচাই নীরবে পাশ করে, আর কোডের fallback তাকে শূন্য চার্জ বানায়।'}
          - {line: 5, tip: 'শুধু যে ফিল্ড আমরা সত্যিই পড়ি তা লিখুন। কুরিয়ার পরে বাড়তি ফিল্ড যোগ করলে নিরীহ বদলে রান ব্যর্থ হয় না।'}
      - type: code
        lang: text
        file: 'নাম বদলের পরদিন সকালে রাতের রান'
        variant: bad
        code: |
          1) CourierContractTest::testSandboxResponseMatchesOurSchema
          [{"property":"charge_paisa","message":"The property charge_paisa is required"}]
        marks:
          - {line: 2, tip: 'ব্যর্থতা ঠিক ফিল্ডের নাম বলে দেয়। আমরা সেদিন সকালেই জানি, সাত ঘণ্টা শূন্য চার্জের পর নয়।'}
      - type: points
        title: 'রাতের টেস্ট লাল হলে'
        style: number
        items:
          - 'বার্তায় ফিল্ডের নাম পড়ুন: কুরিয়ার `charge_paisa` বদলেছে।'
          - 'schema আর example ফাইল নতুন নাম `charge` দিয়ে বদলান।'
          - 'এবার unit test ব্যর্থ হবে, কারণ `CourierRateProvider` এখনো পুরোনো নাম পড়ে।'
          - 'provider ঠিক করুন, যতক্ষণ unit test আর রাতের রান দুটোই সবুজ না হয়।'
    aside:
      - type: when
        use:
          - 'বাইরের যে API আপনার হাতে নেই তার ওপর নির্ভর করেন, আর ভুল ফিল্ডে টাকার ক্ষতি হয়।'
        avoid:
          - 'একমাত্র সুরক্ষা হিসেবে নয়: এটা এক দিন পর্যন্ত দেরিতে ধরে, আর sandbox production-এর থেকে আলাদা হতে পারে। production-এ চার্জ ০ হলে alert-ও রাখুন।'
      - type: pitfalls
        items:
          - 'সব ফিল্ড `required` করবেন না: কোড যা পড়ে শুধু তা রাখুন, নইলে কুরিয়ার একটা ফিল্ড যোগ করলেই অকারণে build ভাঙবে।'
    check:
      q: 'কুরিয়ার নাম বদলালে `charge_paisa`-কে required করে রাখা কেন জরুরি?'
      a: 'না রাখলে ফিল্ড হারিয়ে গেলেও যাচাই পাশ করে, আর কোডের `?? 0` নীরবে চার্জ শূন্য বানায়। required থাকলে রাতের রান ব্যর্থ হয়ে ফিল্ডের নাম বলে দেয়।'

  - slug: integration-real-deps
    title: 'Integration test: mock নয়, আসল ডেটাবেস'
    kind: howto
    tldr: 'টেস্টে production-এর মতো PostgreSQL চালান। SQLite বা mock-এ unique index, JSONB, FOR UPDATE ও migration-এর আসল আচরণ ধরা পড়ে না।'
    keywords: ['integration test', 'PostgreSQL', 'docker compose', 'SQLite', 'unique index', 'Testcontainers']
    blocks:
      - type: text
        body: |
          অনেক টিম টেস্ট দ্রুত করতে SQLite বা in-memory ডেটাবেস বসায়। কিন্তু production PostgreSQL। পার্থক্যগুলো ঠিক সেই জায়গায়, যেখানে বাগ থাকে। নিচের টেস্ট যাচাই করে PostgreSQL-এর নিজের index-এর একটা নিয়ম: বড়-ছোট হাতের অক্ষরে লেখা একই email আটকাতে হবে। index ঠিক কি না, আসল PostgreSQL-এ চালালেই শুধু বোঝা যায়।
      - type: visual
        kind: table
        caption: 'যেসব ভুল শুধু আসল ডেটাবেসেই ধরা পড়ে'
        headers: ['বিষয়', 'SQLite বা mock-এ', 'আসল PostgreSQL-এ']
        rows:
          - cells: ['LOWER(email)-এর unique index', 'নেই বা আলাদা আচরণ', 'বড়-ছোট হাতের একই email আটকায়']
            tip: 'কোড ভাবে email ইউনিক। কিন্তু indexটা আসলেই case-insensitive কি না, শুধু আসল ডেটাবেসই জানে।'
          - cells: ['SELECT ... FOR UPDATE', 'সমর্থিত নয়', 'সারি lock করে, অন্যরা অপেক্ষা করে']
            tip: 'pessimistic lock-এর পুরো ভিত্তি এটা। SQLite-এ টেস্ট করলে lock কাজ করছে কি না কখনো জানা যাবে না।'
          - cells: ['JSONB ও তার operator', 'নেই', 'আসল সমর্থন']
            tip: 'JSON ফিল্ডে query-র ভুল ও index-এর ব্যবহার শুধু এখানেই পরীক্ষা হয়।'
          - cells: ['Migration-এর SQL', 'আলাদা dialect', 'যা production চালাবে ঠিক তা']
            tip: 'migration যে SQL লিখেছেন তা production-এর ডেটাবেসেই চলবে, তাই সেখানেই টেস্ট করুন।'
      - type: code
        lang: yaml
        file: 'compose.test.yaml'
        variant: good
        code: |
          services:
            database_test:
              image: postgres:16-alpine
              environment:
                POSTGRES_DB: app_test
                POSTGRES_USER: app
                POSTGRES_PASSWORD: test_only
              ports: ['5433:5432']
              tmpfs: ['/var/lib/postgresql/data']   # মেমোরিতে: দ্রুত, বন্ধ হলে সব মুছে যায়
        marks:
          - {line: 3, tip: 'production-এর ঠিক একই major version। ১৫-তে টেস্ট করে ১৬-তে চালালে ছোট পার্থক্যও বিপদ।'}
          - {line: 9, tip: 'ডেটাবেস ফাইল RAM-এ থাকে, তাই টেস্ট অনেক দ্রুত। এই ডেটা রাখার জন্য নয়, তাই ঠিক আছে।'}
      - type: code
        lang: php
        file: 'tests/Integration/UserEmailUniquenessTest.php'
        variant: good
        code: |
          // নির্ভর করে: CREATE UNIQUE INDEX uniq_user_email ON "user" (LOWER(email)) -- migration থেকে
          final class UserEmailUniquenessTest extends KernelTestCase
          {
              public function testEmailUniquenessIgnoresCase(): void
              {
                  self::bootKernel();
                  $em = self::getContainer()->get(EntityManagerInterface::class);

                  $em->persist(new User('rahim@example.com'));
                  $em->flush();

                  $this->expectException(UniqueConstraintViolationException::class);
                  $em->persist(new User('RAHIM@example.com'));
                  $em->flush();
              }
          }
        marks:
          - {line: 12, tip: 'টেস্ট প্রত্যাশা করে একটা নির্দিষ্ট exception। এটা না এলে মানে unique index ঠিকমতো বসেনি।'}
    aside:
      - type: tips
        items:
          - '.env.test-এ DATABASE_URL বসান postgresql://app:test_only@127.0.0.1:5433/app_test?serverVersion=16। এটা শুধু টেস্টের জন্য, কোনো আসল পাসওয়ার্ড নয়।'
          - 'CI-তে একই compose.test.yaml চালান, যাতে নিজের মেশিন ও CI-র ডেটাবেস এক হয়।'
          - 'RabbitMQ বা Redis-এর জন্যও একই কথা: যে নির্ভরতার আচরণ নিয়ে ভরসা, তার আসলটাই টেস্টে রাখুন।'
          - 'দাম: unit test-এর চেয়ে ধীর, আর Docker লাগে। শুধু হিসাবের জন্য unit test-ই রাখুন; integration test রাখুন জোড়ার জায়গায়: query, index, lock, migration।'
      - type: refs
        items:
          - {to: 'data/zero-downtime-migrations', label: 'Migration নিরাপদ রাখার নিয়ম'}
    check:
      q: 'টেস্ট SQLite-এ সবুজ, কিন্তু production PostgreSQL-এ ডুপ্লিকেট email ঢুকে যায়। সম্ভাব্য কারণ কী?'
      a: 'SQLite-এ LOWER(email)-এর unique index আলাদাভাবে আচরণ করে, বা বসেই না। PostgreSQL-এর আসল আচরণ শুধু আসল PostgreSQL-এ চালালেই ধরা পড়ে।'

  - slug: load-testing-k6
    title: 'Load test: k6 দিয়ে ভিড় বানিয়ে দেখুন'
    kind: howto
    tldr: 'k6 স্ক্রিপ্টে ভিড় বাড়ানোর ধাপ লিখুন, আর সীমা বসান (p95 < ৫০০ms, ব্যর্থ < ১%)। সীমা পেরোলে টেস্ট নিজেই ব্যর্থ হয়, তাই CI-তে বসানো যায়।'
    keywords: ['k6', 'load test', 'stress test', 'spike', 'soak', 'thresholds', 'p95']
    blocks:
      - type: text
        body: |
          হাসপাতালের ট্রেডমিলের মতো: সুস্থ অবস্থায় হৃদয় ঠিক চলে, কিন্তু দৌড়ালে কী হয়? Load test একটা কৃত্রিম ভিড় বানায় (**virtual users**), আর দেখে ধীরতা বা ব্যর্থতা কোথায় শুরু হয়। ৫০ জন virtual user, যারা প্রতি ক্লিকের মাঝে ১ সেকেন্ড থামে, পাঠায় সেকেন্ডে প্রায় ৫০টা request, যেন ৫০ জন প্রতি সেকেন্ডে একবার refresh চাপছে। k6 স্ক্রিপ্ট সাধারণ JavaScript, তাই সহজে repository-তে রাখা যায়।
      - type: code
        lang: js
        file: 'load/products.js'
        variant: good
        code: |
          import http from 'k6/http';
          import { check, sleep } from 'k6';

          export const options = {
            stages: [
              { duration: '2m', target: 50 },   // ২ মিনিটে ধীরে ৫০ জনে
              { duration: '5m', target: 50 },   // ৫ মিনিট ধরে রাখুন
              { duration: '1m', target: 0 },    // নামিয়ে আনুন
            ],
            thresholds: {
              http_req_duration: ['p(95)<500'],  // ৯৫% request ৫০০ms-এর নিচে
              http_req_failed: ['rate<0.01'],    // ব্যর্থ ১%-এর কম
            },
          };

          export default function () {
            const res = http.get(`${__ENV.BASE_URL}/api/products?page=1`);
            check(res, { 'status is 200': (r) => r.status === 200 });
            sleep(1);   // আসল ব্যবহারকারী পাতা পড়ে, বিরতি দেয়
          }
        marks:
          - {line: 5, tip: 'stages ভিড় ধাপে ধাপে বাড়ায়, হঠাৎ নয়। এতে দেখা যায় কোন সংখ্যায় ধীরতা শুরু।'}
          - {line: 11, tip: 'threshold পেরোলে k6 exit code ≠ 0 দেয়, মানে CI-তে টেস্ট ব্যর্থ। সংখ্যা আপনার SLO (ব্যবহারকারীকে দেওয়া গতির প্রতিশ্রুতি) থেকে ঠিক করুন।'}
          - {line: 19, tip: 'sleep ছাড়া virtual user যন্ত্রের গতিতে request ছোড়ে। ২০ms-এর উত্তরে সে সেকেন্ডে প্রায় ৫০টা পাঠায়, তাই ৫০ জন হয়ে যায় সেকেন্ডে প্রায় ২,৫০০, আসল ৫০-এর বদলে।'}
      - type: visual
        kind: table
        caption: 'ভিড়ের চার ধরনের টেস্ট'
        headers: ['ধরন', 'কী করে', 'কী খোঁজে']
        rows:
          - cells: ['Load', 'প্রত্যাশিত ভিড় ধরে রাখে', 'স্বাভাবিক দিনে ঠিক চলে কি না']
            tip: 'ভিত্তি। প্রথমে এটা পাশ না করলে বাকিগুলোর দরকার নেই।'
          - cells: ['Stress', 'ভাঙা পর্যন্ত ভিড় বাড়ায়', 'ভাঙার সীমা, কী আগে ভাঙে']
            tip: 'জানা যায় কতজন সামলানো যায়। আর সীমা পেরোলে সিস্টেম কেমন ভাঙে: ভদ্রভাবে না হুড়মুড় করে?'
          - cells: ['Spike', 'হঠাৎ কয়েকগুণ বাড়ায়', 'সেল বা বিজ্ঞাপনের ধাক্কা']
            tip: 'autoscaling ও queue-র সীমা এখানে পরীক্ষা হয়। ধীরে বাড়া ভিড়ে এগুলো ধরা পড়ে না।'
          - cells: ['Soak', 'কয়েক ঘণ্টা ধরে চালায়', 'memory leak, connection ফাঁস']
            tip: 'ধীর সমস্যা, যা ১০ মিনিটের টেস্টে কখনো দেখা যায় না।'
      - type: quote
        body: 'Load test চালান staging-এ (production-এর মহড়া-কপি), production-এর মতো করে: আসল ডেটার আকার, আসল সার্ভার সাইজ।'
    aside:
      - type: commands
        title: 'k6 চালানো'
        items:
          - {cmd: 'k6 run -e BASE_URL=https://staging.example.com load/products.js', desc: 'স্ক্রিপ্ট চালান, threshold ব্যর্থ হলে exit code ≠ 0'}
          - {cmd: 'k6 run --vus 10 --duration 30s load/products.js', desc: 'দ্রুত smoke: ১০ জন, ৩০ সেকেন্ড'}
      - type: pitfalls
        items:
          - 'খালি ডেটাবেসে টেস্ট করলে সব দ্রুত দেখায়। staging-এ production-এর মতো ডেটা রাখুন, নইলে ফল মিথ্যা।'
          - 'প্রথম মিনিটের ধীরতা (cache ঠান্ডা) ফলে মিশে যায়। ওয়ার্ম-আপ ধাপ রাখুন বা আলাদা করে দেখুন।'
          - 'তৃতীয় পক্ষের API-তে, বা আগে না জানিয়ে production-এ load test চালাবেন না: তাদের চোখে সেটা আক্রমণের মতো দেখায়।'
      - type: refs
        items:
          - {to: 'scaling/load-latency', label: 'Load আর latency-র সম্পর্ক'}
          - {to: 'observability/metrics-slos', label: 'SLO থেকে threshold ঠিক করা'}
    check:
      q: 'k6 স্ক্রিপ্টে `sleep(1)` নেই। এতে ফল কেন বিভ্রান্তিকর হয়?'
      a: 'প্রতিটা virtual user বিরতিহীনভাবে request ছোড়ে, যা আসল ব্যবহারকারীর আচরণ নয়: সেকেন্ডে প্রায় ৫০টা, আসলে ১টার বদলে। ফলে অল্প user-এই সিস্টেম ভেঙে পড়ে, আর "কত user সামলায়" সংখ্যাটা ভুল আসে।'

  - slug: chaos-failure-injection
    title: 'Chaos test: ইচ্ছা করে ভেঙে দেখুন fallback কাজ করে কি না'
    kind: howto
    tldr: 'Fallback আর breaker কাগজে লেখা থাকলে তা বিশ্বাস করা যায় না। MockHttpClient দিয়ে 503 বা timeout ঢুকিয়ে টেস্ট করুন, আর staging-এ Toxiproxy দিয়ে আসল ধীরতা বানান।'
    keywords: ['chaos engineering', 'failure injection', 'MockHttpClient', 'Toxiproxy', 'steady state', 'ব্যর্থতার পরীক্ষা']
    blocks:
      - type: text
        body: |
          হাসপাতালে আরেক পরীক্ষা: টায়ার ফাটলে বাস কী করে? **Chaos test** ইচ্ছা করে একটা নির্ভরতা ভেঙে দেখে সিস্টেম প্রত্যাশামতো ব্যবহার করছে কি না। শুরু করুন ছোট থেকে: প্রথমে কোডের টেস্টে ব্যর্থতা ঢোকান, তারপর staging-এ (সাইটের মহড়া-কপিতে) আসল নেটওয়ার্কে। provider ব্যর্থতা না সামলানো পর্যন্ত কোডের টেস্ট ব্যর্থ হয়, আর দ্বিতীয় code block-এ সেই সামলানোটা দেখানো আছে।
      - type: visual
        kind: steps
        caption: 'একটা chaos experiment-এর পাঁচ ধাপ'
        steps:
          - {title: '১. স্বাভাবিক অবস্থা', body: 'সুস্থ অবস্থায় কী মাপা যায়: যেমন চেকআউট সফলতা ৯৯%।', tip: 'steady state মাপা না থাকলে পরে বোঝা যাবে না সত্যিই কিছু বদলেছে কি না।'}
          - {title: '২. অনুমান লিখুন', body: 'কুরিয়ার বন্ধ হলে চেকআউট তবু সফল, শুধু ডেফল্ট চার্জ।', tip: 'টেস্টের আগেই লিখে রাখুন কী ঘটবে বলে আশা করেন। না মিললে সেটাই শেখা।'}
          - {title: '৩. ছোট করে ভাঙো', body: 'একটা নির্ভরতা, ছোট সময়, ছোট অংশে।', tone: warn, tip: 'প্রথমে শুধু একটা বিষয় বদলান, নইলে ফল কীসের কারণে বোঝা যায় না।'}
          - {title: '৪. পর্যবেক্ষণ', body: 'মাপুন: error rate, latency, breaker অবস্থা।', tip: 'dashboard খোলা রাখুন। যা দেখলে থামাতে হবে, তাও আগে ঠিক করুন।'}
          - {title: '৫. ঠিক করুন', body: 'অনুমান না মিললে বাগ লিখুন, সারান, আবার চালান।', tone: good, tip: 'আবিষ্কারের চেয়ে সারানোই আসল লাভ। না সারালে পরের বার একই ঘটবে।'}
      - type: code
        lang: php
        file: 'tests/Chaos/CourierFailureTest.php'
        variant: good
        code: |
          public function testShippingFallsBackWhenCourierFails(): void
          {
              $client = new MockHttpClient([
                  new MockResponse('', ['http_code' => 503]),            // সার্ভার অসুস্থ
                  new MockResponse('', ['error' => 'connection timed out']),   // নেটওয়ার্ক ব্যর্থ
              ], 'https://api.courier.example');

              $provider = new CourierRateProvider($client, new NullLogger());

              self::assertNull($provider->chargeFor('dhaka', 500));   // 503: null, ক্র্যাশ নয়
              self::assertNull($provider->chargeFor('dhaka', 500));   // timeout: null, ক্র্যাশ নয়
          }
        marks:
          - {line: 4, tip: 'বাস্তবে 503 পেলে HttpClient ServerException ছোড়ে।'}
          - {line: 5, tip: '''error'' দিলে MockResponse উত্তর পড়ার সময় TransportException ছোড়ে, ঠিক আসল timeout বা সংযোগ-ভাঙার মতো।'}
          - {line: 11, tip: 'টেস্টের প্রশ্ন: ব্যর্থতায় অ্যাপ ক্র্যাশ করে, না ভদ্রভাবে null ফেরত দেয়?'}
      - type: code
        lang: php
        file: 'src/Shipping/CourierRateProvider.php'
        variant: good
        code: |
          public function chargeFor(string $district, int $grams): ?int
          {
              try {
                  $data = $this->client->request('GET', '/v1/rates', [
                      'query' => ['district' => $district, 'weight' => $grams],
                      'timeout' => 2,
                  ])->toArray();   // 4xx/5xx, timeout ও ভাঙা JSON-এ exception ছোড়ে
              } catch (ExceptionInterface $e) {
                  $this->logger->warning('Courier rate lookup failed', ['error' => $e->getMessage()]);

                  return null;   // দাম নেই, কিন্তু ক্র্যাশও নেই
              }

              return $data['charge_paisa'];
          }

          public function chargeOrDefault(string $district, int $grams): int
          {
              return $this->chargeFor($district, $grams) ?? self::DEFAULT_CHARGE_PAISA;   // 8000
          }
        marks:
          - {line: 8, tip: 'ExceptionInterface (Symfony Contracts) সার্ভার error, transport error ও ভাঙা JSON-এর সবার parent। এই catch না থাকলে ওপরের টেস্ট ServerException-এ ব্যর্থ হয়, আর checkout-এ error পাতা দেখা যেত।'}
          - {line: 18, tip: 'ধাপ ২-এর অনুমান কোডে: কুরিয়ার বন্ধ থাকলে checkout ডেফল্ট চার্জ (৮০ টাকা) নিয়ে চলে।'}
    aside:
      - type: commands
        title: 'staging-এ Toxiproxy'
        items:
          - {cmd: 'toxiproxy-cli create --listen 0.0.0.0:18080 --upstream courier-sandbox:8080 courier', desc: 'কুরিয়ারের সামনে proxy বসান; অ্যাপের কুরিয়ার URL ১৮০৮০ পোর্টে দিন'}
          - {cmd: 'toxiproxy-cli toxic add -t latency -a latency=3000 courier', desc: 'সব উত্তরে ৩ সেকেন্ড দেরি যোগ করুন। timeout ২ সেকেন্ড হলে প্রতিটা ডাক timeout হবে, breaker খুলবে'}
          - {cmd: 'toxiproxy-cli toxic remove -n latency_downstream courier', desc: 'পরীক্ষা শেষে toxic সরান'}
      - type: pitfalls
        items:
          - 'production-এ প্রথম দিনেই chaos নয়। আগে unit ও staging, তারপর কম ট্রাফিকের সময় ছোট পরিসরে।'
          - 'থামানোর সুইচ ছাড়া chaos চালাবেন না: কী দেখলে অবিলম্বে থামাবেন, আগে থেকে ঠিক করুন।'
          - 'ডেফল্ট একটা ব্যবসায়িক সিদ্ধান্ত: ফ্ল্যাট ৮০ টাকা দূরের জেলায় কম নেওয়া হতে পারে। fallback ব্যবহার হলেই log ও alert রাখুন।'
