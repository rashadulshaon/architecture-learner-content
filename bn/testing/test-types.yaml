slides:
  - slug: different-tests-different-bugs
    title: 'সব unit test সবুজ, তবু কুরিয়ার API ভাঙল'
    kind: story
    tldr: 'প্রতিটা ধরনের টেস্ট আলাদা ধরনের ভুল ধরে। কুরিয়ার API-র ফিল্ড বদলালে unit test সবুজই থাকে, কারণ mock পুরোনো উত্তরই দেয়। তাই পাঁচ ধরন দরকার।'
    keywords: ['contract test', 'integration test', 'load test', 'chaos test', 'test types', 'টেস্টের ধরন']
    blocks:
      - type: metaphor
        icon: building
        title: 'হাসপাতালের পরীক্ষা'
        body: |
          একজন রোগীর জন্য ডাক্তার একটা পরীক্ষাই করান না। রক্ত পরীক্ষা এক রোগ ধরে, এক্স-রে আরেক রোগ, আর ট্রেডমিল স্ট্রেস টেস্ট ধরে হৃদয় পরিশ্রম সইতে পারে কি না। একটাতে সুস্থ মানে বাকিগুলোতেও সুস্থ নয়। সফটওয়্যারেও তাই: প্রতিটা ধরনের টেস্ট নিজের ধরনের ভুল ধরে, বাকিগুলো ধরে না।
      - type: text
        body: |
          আমাদের শিপিং কোড কুরিয়ার API-র `charge_paisa` ফিল্ড পড়ে। কুরিয়ার নীরবে ফিল্ডের নাম `charge` করে দিল। আমাদের unit test mock দিয়ে পুরোনো উত্তরই পাচ্ছে, তাই সব সবুজ, কিন্তু production-এ ডেলিভারি চার্জ শূন্য আসছে।
      - type: visual
        kind: table
        caption: 'পাঁচ ধরনের টেস্ট: কী ধরে, কী ধরে না'
        headers: ['টেস্ট', 'কী ধরে', 'কী ধরে না']
        rows:
          - cells: ['Unit', 'হিসাব ও নিয়মের ভুল', 'জোড়া ও বাইরের বদল']
            tip: 'দ্রুত, কিন্তু mock-এর বাইরের জগৎ সম্পর্কে অন্ধ।'
          - cells: ['Contract', 'বাইরের API-র ফিল্ড বা ধরন বদল', 'ধীর বা ভারী ট্রাফিক']
            tip: 'আমরা যা আশা করি আর অন্যপক্ষ যা দেয়, তাদের মিল যাচাই করে।'
          - cells: ['Integration', 'query, config, migration-এর ভুল', 'ভিড়ের চাপ']
            tip: 'আসল ডেটাবেস বা কিউয়ের সাথে চালিয়ে জোড়ার ভুল ধরে।'
          - cells: ['Load', 'ধীরতা, ভিড়ে ভাঙন', 'হিসাবের ভুল']
            tip: 'ভিড় দিয়ে দেখে কোন অংশ আগে হাঁপিয়ে ওঠে।'
          - cells: ['Chaos', 'ব্যর্থতায় ব্যবহার ঠিক কি না', 'স্বাভাবিক অবস্থার ভুল']
            tip: 'ইচ্ছা করে নির্ভরতা ভেঙে দেখে fallback ও breaker সত্যিই কাজ করে কি না।'
      - type: quote
        body: 'প্রতিটা টেস্টের ধরন নিজের ভুল ধরে। একটা সবুজ মানে সবকিছু সবুজ নয়।'
    aside:
      - type: story
        title: 'নীরবে বদলানো ফিল্ড'
        body: |
          একটা ই-কমার্স টিমের কুরিয়ার সার্ভিস একদিন ফিল্ডের নাম বদলে নতুন সংস্করণে গিয়েছিল। টিমের সব টেস্ট পাশ। সাত ঘণ্টা ধরে অর্ডারে ডেলিভারি চার্জ ০ গেছে, কারণ কোডে `?? 0` ছিল। কেউ বুঝতে পারেনি কোথাও কিছু ভাঙল।
      - type: refs
        items:
          - {to: 'testing/what-to-test', label: 'কী টেস্ট করার মতো'}
    check:
      q: 'কুরিয়ার API-র একটা ফিল্ডের নাম বদলে গেল। কোন ধরনের টেস্ট এটা ধরত, আর unit test কেন ধরেনি?'
      a: 'Contract test ধরত, কারণ সে আমাদের প্রত্যাশা (schema) আসল উত্তরের সাথে মেলায়। unit test-এ mock পুরোনো উত্তরই ফেরায়, তাই বদল তার চোখেই পড়ে না।'

  - slug: contract-tests
    title: 'Contract test: দুই পক্ষের চুক্তি যাচাই'
    kind: howto
    tldr: 'বাইরের API-র কাছে আমরা কী আশা করি তা একটা schema ফাইলে লিখে রাখো। আমাদের টেস্ট mock বানায় সেই ফাইল থেকে, আর রাতে আসল sandbox-এর উত্তর একই schema-র সাথে মেলানো হয়।'
    keywords: ['contract testing', 'consumer-driven', 'JSON schema', 'MockHttpClient', 'sandbox', 'Pact']
    blocks:
      - type: text
        body: |
          দুই পক্ষ একটা লিখিত চুক্তি রাখে: "উত্তরে `charge_paisa` নামে একটা পূর্ণসংখ্যা থাকবে।" **Contract test** এই চুক্তি দুই দিকেই যাচাই করে। আমাদের দিকে: কোড চুক্তি মেনে পড়ে কি না। অন্য দিকে: আসল API এখনো চুক্তি মেনে চলছে কি না। এখানে আমরা consumer (ব্যবহারকারী), কুরিয়ার provider (সরবরাহকারী)।
      - type: visual
        kind: flow
        caption: 'চুক্তি ফাইল দুই পক্ষকেই বাঁধে'
        nodes:
          - {id: app, label: 'আমাদের অ্যাপ', sub: 'consumer', icon: code, col: 0, row: 1, tip: 'আমাদের টেস্ট mock বানায় ঠিক এই চুক্তি থেকে, ফলে mock কখনো কল্পনার উত্তর দেয় না।'}
          - {id: contract, label: 'চুক্তি (schema)', sub: 'courier-rates.schema.json', icon: file, tone: accent, col: 2, row: 1, tip: 'আমরা যা আশা করি তা লেখা: কোন ফিল্ড, কী ধরন। repository-তে থাকে।'}
          - {id: courier, label: 'কুরিয়ার sandbox', sub: 'provider', icon: truck, col: 4, row: 1, tip: 'কুরিয়ারের পরীক্ষার পরিবেশ। আসল টাকা বা আসল ডেলিভারি জড়িত নয়।'}
        edges:
          - {from: app, to: contract, label: 'আমরা যা আশা করি, লিখে রাখি'}
          - {from: contract, to: app, label: 'আমাদের টেস্টের mock এই চুক্তি থেকে তৈরি', dashed: true}
          - {from: courier, to: contract, label: 'রাতের টেস্টে আসল উত্তর চুক্তির সাথে মেলানো হয়', tone: warn}
          - {from: contract, to: courier, label: 'মিল না থাকলে টেস্ট ব্যর্থ, আমরা আগেই জানি', tone: bad, dashed: true}
      - type: code
        lang: php
        file: 'tests/Contract/CourierContractTest.php'
        variant: good
        code: |
          #[Group('contract')]   // রাতের পাইপলাইনে চলে, প্রতি commit-এ নয়
          final class CourierContractTest extends TestCase
          {
              public function testSandboxResponseMatchesOurSchema(): void
              {
                  $client = HttpClient::createForBaseUri(getenv('COURIER_SANDBOX_URL'), [
                      'auth_bearer' => getenv('COURIER_SANDBOX_TOKEN'),
                      'timeout' => 5,
                  ]);

                  $body = $client->request('GET', '/v1/rates?district=dhaka&weight=500')->getContent();

                  $validator = new Validator();
                  $schema = json_decode(file_get_contents(__DIR__.'/courier-rates.schema.json'));
                  $validator->validate($data = json_decode($body), $schema);

                  self::assertTrue($validator->isValid(), json_encode($validator->getErrors()));
              }
          }
        marks:
          - {line: 1, tip: 'ধীর ও বাইরের নেটওয়ার্কে নির্ভরশীল বলে আলাদা group। প্রতি commit-এ চালালে CI ভঙ্গুর হবে।'}
          - {line: 6, tip: 'আসল sandbox, প্রোডাকশন নয়। টোকেন environment variable থেকে, কোডে বসানো নয়।'}
          - {line: 17, tip: 'ব্যর্থ হলে getErrors() ঠিক কোন ফিল্ড মেলেনি তা বলে দেয়, আন্দাজ করতে হয় না।'}
      - type: code
        lang: php
        file: 'tests/Unit/CourierRateProviderTest.php'
        variant: good
        code: |
          public function testReadsChargeFromExampleOfTheContract(): void
          {
              // mock-এর উত্তর কল্পনা থেকে নয়, চুক্তির উদাহরণ ফাইল থেকে
              $example = file_get_contents(__DIR__.'/../Contract/courier-rates.example.json');
              $client = new MockHttpClient(new MockResponse($example), 'https://api.courier.example');

              $provider = new CourierRateProvider($client, new NullLogger());

              self::assertSame(12_000, $provider->chargeFor('dhaka', 500));
          }
        marks:
          - {line: 4, tip: 'এই example ফাইল আর schema পাশাপাশি থাকে। schema বদলালে example-ও বদলাতে হয়, না হলে রাতের টেস্ট ধরে ফেলে।'}
    aside:
      - type: terms
        items:
          - {term: 'Consumer', meaning: 'যে পক্ষ অন্যের API ডাকে এবং তার উত্তরের ওপর নির্ভর করে।'}
          - {term: 'Provider', meaning: 'যে পক্ষ API দেয়। কোনো ফিল্ড বদলালে consumer-এর ভাঙে।'}
      - type: tips
        items:
          - 'নিজের API অন্যদের দিলে উল্টোটাও করো: consumer-দের প্রত্যাশা (Pact বা OpenAPI) তোমার CI-তে যাচাই করো।'
          - 'sandbox সবসময় production-এর মতো চলে না। তাই এই টেস্ট সংকেত, প্রমাণ নয়; ব্যর্থ হলে তদন্ত করো।'
      - type: refs
        items:
          - {to: 'api/contracts-versioning', label: 'API চুক্তি ও ভার্সনিং'}
          - {to: 'ledgers/third-party-integrations', label: 'বাইরের সার্ভিস ইন্টিগ্রেশন'}
    check:
      q: 'Contract test-এর mock উত্তর চুক্তির example ফাইল থেকে নেওয়া হয় কেন, নিজের লেখা JSON থেকে নয়?'
      a: 'নিজে লেখা mock কল্পনা, বাস্তবের সাথে মিলছে কি না কেউ জানে না। চুক্তির example যদি রাতের টেস্টে আসল উত্তরের সাথে মেলানো হয়, তবে mock-ও বাস্তবের সাথে সংযুক্ত থাকে।'

  - slug: integration-real-deps
    title: 'Integration test: mock নয়, আসল ডেটাবেস'
    kind: howto
    tldr: 'টেস্টে production-এর মতো PostgreSQL চালাও। SQLite বা mock-এ unique index, JSONB, FOR UPDATE ও migration-এর আসল আচরণ ধরা পড়ে না।'
    keywords: ['integration test', 'PostgreSQL', 'docker compose', 'SQLite', 'unique index', 'Testcontainers']
    blocks:
      - type: text
        body: |
          অনেক টিম টেস্ট দ্রুত করতে SQLite বা in-memory ডেটাবেস বসায়। কিন্তু production PostgreSQL। পার্থক্যগুলো ঠিক সেই জায়গায়, যেখানে বাগ থাকে। নিচের টেস্ট একটা PostgreSQL-সুনির্দিষ্ট নিয়ম যাচাই করে, যা SQLite-এ কখনো ব্যর্থ হতো না।
      - type: visual
        kind: table
        caption: 'যেসব ভুল শুধু আসল ডেটাবেসেই ধরা পড়ে'
        headers: ['বিষয়', 'SQLite বা mock-এ', 'আসল PostgreSQL-এ']
        rows:
          - cells: ['LOWER(email)-এর unique index', 'নেই বা আলাদা আচরণ', 'বড়-ছোট হাতের একই email আটকায়']
            tip: 'কোড ভাবে email ইউনিক। কিন্তু indexটা আসলেই case-insensitive কি না, শুধু আসল ডেটাবেসই জানে।'
          - cells: ['SELECT ... FOR UPDATE', 'সমর্থিত নয়', 'সারি lock করে, অন্যরা অপেক্ষা করে']
            tip: 'pessimistic lock-এর পুরো ভিত্তি এটা। SQLite-এ টেস্ট করলে lock কাজ করছে কি না কখনো জানা যাবে না।'
          - cells: ['JSONB ও তার operator', 'নেই', 'আসল সমর্থন']
            tip: 'JSON ফিল্ডে query-র ভুল ও index-এর ব্যবহার শুধু এখানেই পরীক্ষা হয়।'
          - cells: ['Migration-এর SQL', 'আলাদা dialect', 'যা production চালাবে ঠিক তা']
            tip: 'migration যে SQL লিখেছ তা production-এর ডেটাবেসেই চলবে, তাই সেখানেই টেস্ট করো।'
      - type: code
        lang: yaml
        file: 'compose.test.yaml'
        variant: good
        code: |
          services:
            database_test:
              image: postgres:16-alpine
              environment:
                POSTGRES_DB: app_test
                POSTGRES_USER: app
                POSTGRES_PASSWORD: test_only
              ports: ['5433:5432']
              tmpfs: ['/var/lib/postgresql/data']   # মেমোরিতে: দ্রুত, বন্ধ হলে সব মুছে যায়
        marks:
          - {line: 3, tip: 'production-এর ঠিক একই major version। ১৫-তে টেস্ট করে ১৬-তে চালালে ছোট পার্থক্যও বিপদ।'}
          - {line: 9, tip: 'ডেটাবেস ফাইল RAM-এ থাকে, তাই টেস্ট অনেক দ্রুত। এই ডেটা রাখার জন্য নয়, তাই ঠিক আছে।'}
      - type: code
        lang: php
        file: 'tests/Integration/UserEmailUniquenessTest.php'
        variant: good
        code: |
          final class UserEmailUniquenessTest extends KernelTestCase
          {
              public function testEmailUniquenessIgnoresCase(): void
              {
                  self::bootKernel();
                  $em = self::getContainer()->get(EntityManagerInterface::class);

                  $em->persist(new User('rahim@example.com'));
                  $em->flush();

                  $this->expectException(UniqueConstraintViolationException::class);
                  $em->persist(new User('RAHIM@example.com'));
                  $em->flush();
              }
          }
        marks:
          - {line: 11, tip: 'টেস্ট প্রত্যাশা করে একটা নির্দিষ্ট exception। এটা না এলে মানে unique index ঠিকমতো বসেনি।'}
    aside:
      - type: tips
        items:
          - '.env.test-এ DATABASE_URL বসাও postgresql://app:test_only@127.0.0.1:5433/app_test?serverVersion=16। এটা শুধু টেস্টের জন্য, কোনো আসল পাসওয়ার্ড নয়।'
          - 'CI-তে একই compose.test.yaml চালাও, যাতে নিজের মেশিন ও CI-র ডেটাবেস এক হয়।'
          - 'RabbitMQ বা Redis-এর জন্যও একই কথা: যে নির্ভরতার আচরণ নিয়ে ভরসা, তার আসলটাই টেস্টে রাখো।'
      - type: refs
        items:
          - {to: 'data/zero-downtime-migrations', label: 'Migration নিরাপদ রাখার নিয়ম'}
    check:
      q: 'টেস্ট SQLite-এ সবুজ, কিন্তু production PostgreSQL-এ ডুপ্লিকেট email ঢুকে যায়। সম্ভাব্য কারণ কী?'
      a: 'SQLite-এ LOWER(email)-এর unique index আলাদাভাবে আচরণ করে, বা বসেই না। PostgreSQL-এর আসল আচরণ শুধু আসল PostgreSQL-এ চালালেই ধরা পড়ে।'

  - slug: load-testing-k6
    title: 'Load test: k6 দিয়ে ভিড় বানিয়ে দেখো'
    kind: howto
    tldr: 'k6 স্ক্রিপ্টে ভিড় বাড়ানোর ধাপ লেখো, আর সীমা বসাও (p95 < ৫০০ms, ব্যর্থ < ১%)। সীমা পেরোলে টেস্ট নিজেই ব্যর্থ হয়, তাই CI-তে বসানো যায়।'
    keywords: ['k6', 'load test', 'stress test', 'spike', 'soak', 'thresholds', 'p95']
    blocks:
      - type: text
        body: |
          হাসপাতালের ট্রেডমিলের মতো: সুস্থ অবস্থায় হৃদয় ঠিক চলে, কিন্তু দৌড়ালে কী হয়? Load test একটা কৃত্রিম ভিড় বানায় (**virtual users**), আর দেখে ধীরতা বা ব্যর্থতা কোথায় শুরু হয়। k6 স্ক্রিপ্ট সাধারণ JavaScript, তাই সহজে repository-তে রাখা যায়।
      - type: code
        lang: js
        file: 'load/products.js'
        variant: good
        code: |
          import http from 'k6/http';
          import { check, sleep } from 'k6';

          export const options = {
            stages: [
              { duration: '2m', target: 50 },   // ২ মিনিটে ধীরে ৫০ জনে
              { duration: '5m', target: 50 },   // ৫ মিনিট ধরে রাখো
              { duration: '1m', target: 0 },    // নামিয়ে আনো
            ],
            thresholds: {
              http_req_duration: ['p(95)<500'],  // ৯৫% request ৫০০ms-এর নিচে
              http_req_failed: ['rate<0.01'],    // ব্যর্থ ১%-এর কম
            },
          };

          export default function () {
            const res = http.get(`${__ENV.BASE_URL}/api/products?page=1`);
            check(res, { 'status is 200': (r) => r.status === 200 });
            sleep(1);   // আসল ব্যবহারকারী পাতা পড়ে, বিরতি দেয়
          }
        marks:
          - {line: 5, tip: 'stages ভিড় ধাপে ধাপে বাড়ায়, হঠাৎ নয়। এতে দেখা যায় কোন সংখ্যায় ধীরতা শুরু।'}
          - {line: 11, tip: 'threshold পেরোলে k6 exit code ≠ 0 দেয়, মানে CI-তে টেস্ট ব্যর্থ। সংখ্যা তোমার SLO থেকে ঠিক করো।'}
          - {line: 19, tip: 'sleep ছাড়া প্রতিটা virtual user যন্ত্রের গতিতে request ছোড়ে, যা কোনো আসল ব্যবহারকারীর আচরণ নয়।'}
      - type: visual
        kind: table
        caption: 'ভিড়ের চার ধরনের টেস্ট'
        headers: ['ধরন', 'কী করে', 'কী খোঁজে']
        rows:
          - cells: ['Load', 'প্রত্যাশিত ভিড় ধরে রাখে', 'স্বাভাবিক দিনে ঠিক চলে কি না']
            tip: 'ভিত্তি। প্রথমে এটা পাশ না করলে বাকিগুলোর দরকার নেই।'
          - cells: ['Stress', 'ভাঙা পর্যন্ত ভিড় বাড়ায়', 'ভাঙার সীমা, কী আগে ভাঙে']
            tip: 'জানো কতজন সামলাতে পারো। আর সীমা পেরোলে সিস্টেম কেমন ভাঙে: ভদ্রভাবে না হুড়মুড় করে?'
          - cells: ['Spike', 'হঠাৎ কয়েকগুণ বাড়ায়', 'সেল বা বিজ্ঞাপনের ধাক্কা']
            tip: 'autoscaling ও queue-র সীমা এখানে পরীক্ষা হয়। ধীরে বাড়া ভিড়ে এগুলো ধরা পড়ে না।'
          - cells: ['Soak', 'কয়েক ঘণ্টা ধরে চালায়', 'memory leak, connection ফাঁস']
            tip: 'ধীর সমস্যা, যা ১০ মিনিটের টেস্টে কখনো দেখা যায় না।'
      - type: quote
        body: 'Load test staging-এ চালাও, production-এর মতো করে: আসল ডেটার আকার, আসল সার্ভার সাইজ।'
    aside:
      - type: commands
        title: 'k6 চালানো'
        items:
          - {cmd: 'k6 run -e BASE_URL=https://staging.example.com load/products.js', desc: 'স্ক্রিপ্ট চালাও, threshold ব্যর্থ হলে exit code ≠ 0'}
          - {cmd: 'k6 run --vus 10 --duration 30s load/products.js', desc: 'দ্রুত smoke: ১০ জন, ৩০ সেকেন্ড'}
      - type: pitfalls
        items:
          - 'খালি ডেটাবেসে টেস্ট করলে সব দ্রুত দেখায়। staging-এ production-এর মতো ডেটা রাখো, নইলে ফল মিথ্যা।'
          - 'প্রথম মিনিটের ধীরতা (cache ঠান্ডা) ফলে মিশে যায়। ওয়ার্ম-আপ ধাপ রাখো বা আলাদা করে দেখো।'
      - type: refs
        items:
          - {to: 'scaling/load-latency', label: 'Load আর latency-র সম্পর্ক'}
          - {to: 'observability/metrics-slos', label: 'SLO থেকে threshold ঠিক করা'}
    check:
      q: 'k6 স্ক্রিপ্টে `sleep(1)` নেই। এতে ফল কেন বিভ্রান্তিকর হয়?'
      a: 'প্রতিটা virtual user বিরতিহীনভাবে request ছোড়ে, যা আসল ব্যবহারকারীর আচরণ নয়। ফলে অল্প user-এই সিস্টেম ভেঙে পড়ে, আর "কত user সামলায়" সংখ্যাটা ভুল আসে।'

  - slug: chaos-failure-injection
    title: 'Chaos test: ইচ্ছা করে ভেঙে দেখো fallback কাজ করে কি না'
    kind: howto
    tldr: 'Fallback আর breaker কাগজে লেখা থাকলে তা বিশ্বাস করা যায় না। MockHttpClient দিয়ে 503 বা timeout ঢুকিয়ে টেস্ট করো, আর staging-এ Toxiproxy দিয়ে আসল ধীরতা বানাও।'
    keywords: ['chaos engineering', 'failure injection', 'MockHttpClient', 'Toxiproxy', 'steady state', 'ব্যর্থতার পরীক্ষা']
    blocks:
      - type: text
        body: |
          হাসপাতালে আরেক পরীক্ষা: টায়ার ফাটলে বাস কী করে? **Chaos test** ইচ্ছা করে একটা নির্ভরতা ভেঙে দেখে সিস্টেম প্রত্যাশামতো ব্যবহার করছে কি না। শুরু করো ছোট থেকে: প্রথমে কোডের টেস্টে ব্যর্থতা ঢোকাও, তারপর staging-এ আসল নেটওয়ার্কে।
      - type: visual
        kind: steps
        caption: 'একটা chaos experiment-এর পাঁচ ধাপ'
        steps:
          - {title: '১. স্বাভাবিক অবস্থা', body: 'সুস্থ অবস্থায় কী মাপা যায়: যেমন চেকআউট সফলতা ৯৯%।', tip: 'steady state মাপা না থাকলে পরে বোঝা যাবে না সত্যিই কিছু বদলেছে কি না।'}
          - {title: '২. অনুমান লেখো', body: 'কুরিয়ার বন্ধ হলে চেকআউট তবু সফল, শুধু ডেফল্ট চার্জ।', tip: 'টেস্টের আগেই লিখে রাখো কী ঘটবে বলে আশা করো। না মিললে সেটাই শেখা।'}
          - {title: '৩. ছোট করে ভাঙো', body: 'একটা নির্ভরতা, ছোট সময়, ছোট অংশে।', tone: warn, tip: 'প্রথমে শুধু একটা বিষয় বদলাও, নইলে ফল কীসের কারণে বোঝা যায় না।'}
          - {title: '৪. পর্যবেক্ষণ', body: 'মাপো: error rate, latency, breaker অবস্থা।', tip: 'dashboard খোলা রাখো। যা দেখলে থামাতে হবে, তাও আগে ঠিক করো।'}
          - {title: '৫. ঠিক করো', body: 'অনুমান না মিললে বাগ লেখো, সারাও, আবার চালাও।', tone: good, tip: 'আবিষ্কারের চেয়ে সারানোই আসল লাভ। না সারালে পরের বার একই ঘটবে।'}
      - type: code
        lang: php
        file: 'tests/Chaos/CourierFailureTest.php'
        variant: good
        code: |
          public function testShippingFallsBackWhenCourierFails(): void
          {
              $client = new MockHttpClient([
                  new MockResponse('', ['http_code' => 503]),            // সার্ভার অসুস্থ
                  new MockResponse('', ['error' => 'connection timed out']),   // নেটওয়ার্ক ব্যর্থ
              ], 'https://api.courier.example');

              $provider = new CourierRateProvider($client, new NullLogger());

              self::assertNull($provider->chargeFor('dhaka', 500));   // 503: null, ক্র্যাশ নয়
              self::assertNull($provider->chargeFor('dhaka', 500));   // timeout: null, ক্র্যাশ নয়
          }
        marks:
          - {line: 4, tip: 'বাস্তবে 503 পেলে HttpClient ServerException ছোড়ে।'}
          - {line: 5, tip: '''error'' দিলে MockResponse উত্তর পড়ার সময় TransportException ছোড়ে, ঠিক আসল timeout বা সংযোগ-ভাঙার মতো।'}
          - {line: 11, tip: 'টেস্টের প্রশ্ন: ব্যর্থতায় অ্যাপ ক্র্যাশ করে, না ভদ্রভাবে null ফেরত দেয়?'}
      - type: code
        lang: bash
        file: 'staging: Toxiproxy'
        variant: good
        code: |
          # কুরিয়ারের সামনে proxy বসিয়ে ইচ্ছামতো ধীর বা বিচ্ছিন্ন করা যায়
          toxiproxy-cli create --listen 0.0.0.0:8474 --upstream api.courier.example:443 courier

          # সব উত্তরে ৩ সেকেন্ড দেরি যোগ করো
          toxiproxy-cli toxic add -t latency -a latency=3000 courier

          # অ্যাপের breaker খুলল কি না, checkout চলল কি না, দেখো
          # পরীক্ষা শেষে toxic সরাও
          toxiproxy-cli toxic remove -n latency_downstream courier
        marks:
          - {line: 5, tip: 'প্রতিটা timeout ২ সেকেন্ডে সেট থাকলে এই ৩ সেকেন্ডের দেরিতে প্রতিটা ডাক timeout হওয়ার কথা। breaker খুলল কি না এখানেই বোঝা যায়।'}
    aside:
      - type: pitfalls
        items:
          - 'production-এ প্রথম দিনেই chaos নয়। আগে unit ও staging, তারপর কম ট্রাফিকের সময় ছোট পরিসরে।'
          - 'থামানোর সুইচ ছাড়া chaos চালিও না: কী দেখলে অবিলম্বে থামাবে, আগে থেকে ঠিক করো।'
      - type: refs
        items:
          - {to: 'resilience/circuit-breakers', label: 'Circuit breaker ও retry'}
          - {to: 'resilience/disaster-recovery', label: 'Game day'}
    check:
      q: 'MockResponse-এ `http_code => 503` আর `error => ...` দুইটাই কেন দরকার?'
      a: 'দুইটা আলাদা ব্যর্থতা: ৫০৩ মানে সার্ভার উত্তর দিল কিন্তু অসুস্থ; error মানে নেটওয়ার্ক বা timeout, উত্তরই এল না। কোড দুই ক্ষেত্রেই ঠিক আচরণ করে কি না দেখা দরকার।'

flashcards:
  - q: 'Contract test কী যাচাই করে?'
    a: 'বাইরের API-র কাছে আমরা যা আশা করি (ফিল্ড ও ধরন) আর সে আসলে যা দেয়, তাদের মিল।'
    more: |
      আশা করা উত্তর একটা schema ফাইলে লেখা থাকে। আমাদের টেস্টের mock এই ফাইলের উদাহরণ থেকে তৈরি, আর রাতের টেস্টে আসল sandbox-এর উত্তর একই schema-র সাথে মেলানো হয়। অন্য পক্ষ নীরবে ফিল্ড বদলালে আমরা আগে জানতে পারি।
    ref: contract-tests
  - q: 'Unit test কেন বাইরের API-র ফিল্ড বদল ধরে না?'
    a: 'কারণ mock আমাদের কল্পনার পুরোনো উত্তরই দেয়, আসল API কী পাঠাচ্ছে সে জানেই না।'
    more: |
      mock-এর উত্তর নিজে হাতে লেখা। বাইরের পক্ষ উত্তর বদলালেও সে বদলায় না, তাই টেস্ট সবুজ থাকে আর production ভাঙে। সমাধান contract test, যেখানে mock চুক্তির উদাহরণ থেকে আসে আর আসল উত্তর চুক্তির সাথে যাচাই হয়।
    ref: different-tests-different-bugs
  - q: 'Integration test কেন SQLite নয়, আসল PostgreSQL-এ চালানো উচিত?'
    a: 'কারণ unique index, FOR UPDATE, JSONB ও migration-এর আচরণ ডেটাবেসভেদে আলাদা। শুধু আসলটাই production-এর আচরণ দেখায়।'
    more: |
      SQLite-এ টেস্ট সবুজ, production-এ ভাঙা: সবচেয়ে বিরক্তিকর অভিজ্ঞতার একটা। compose.test.yaml দিয়ে production-এর একই major version-এর PostgreSQL চালাও, tmpfs-এ ডেটা রাখলে দ্রুতও হয়।
    ref: integration-real-deps
  - q: 'k6 টেস্টে threshold কী কাজে লাগে?'
    a: 'সীমা পেরোলে টেস্ট নিজেই ব্যর্থ হয় (exit code ≠ 0), তাই CI-তে load test স্বয়ংক্রিয়ভাবে পাশ-ফেল ঠিক করতে পারে।'
    more: |
      যেমন `http_req_duration: ['p(95)<500']` মানে ৯৫% request ৫০০ms-এর নিচে, `http_req_failed: ['rate<0.01']` মানে ব্যর্থতা ১%-এর কম। সংখ্যাগুলো তোমার SLO থেকে ঠিক করো, আন্দাজে নয়।
    ref: load-testing-k6
  - q: 'Load, stress, spike ও soak test-এর পার্থক্য কী?'
    a: 'Load: প্রত্যাশিত ভিড়। Stress: ভাঙা পর্যন্ত বাড়ানো। Spike: হঠাৎ ধাক্কা। Soak: ঘণ্টার পর ঘণ্টা চালানো।'
    more: |
      Load ভিত্তি। Stress জানায় ভাঙার সীমা ও ভাঙার ধরন। Spike পরীক্ষা করে autoscaling ও queue সীমা। Soak ধরে memory leak আর connection ফাঁসের মতো ধীর সমস্যা, যা ছোট টেস্টে দেখা যায় না।
    ref: load-testing-k6
  - q: 'Chaos test কী, আর কেন লাগে?'
    a: 'ইচ্ছা করে একটা নির্ভরতা ভেঙে দেখা সিস্টেম প্রত্যাশামতো আচরণ করে কি না। fallback ও breaker কাগজে নয়, কাজে প্রমাণ হয়।'
    more: |
      পাঁচ ধাপ: স্বাভাবিক অবস্থা মাপা, অনুমান লেখা, ছোট করে ভাঙা, পর্যবেক্ষণ, ঠিক করা। শুরু করো কোডের টেস্টে (MockHttpClient দিয়ে 503 বা timeout), তারপর staging-এ Toxiproxy দিয়ে।
    ref: chaos-failure-injection
  - q: 'MockHttpClient দিয়ে timeout কীভাবে নকল করবে?'
    a: '`error` option দিয়ে MockResponse বানাও: উত্তর পড়ার সময় TransportException ছুড়বে, ঠিক আসল timeout-এর মতো।'
    more: |
      `['http_code' => 503]` দিলে সার্ভার-অসুস্থ ধরনের ব্যর্থতা পাওয়া যায়, আর `error` দিলে নেটওয়ার্ক-ব্যর্থতা। MockHttpClient-এ একাধিক MockResponse একটা array-তে দিলে ক্রমানুসারে প্রতিটা request-এর জন্য একটা করে ফেরত যায়।
    ref: chaos-failure-injection

quiz:
  - q: 'রাশেদের অ্যাপ বাইরের একটা exchange-rate API ডাকে। API নীরবে `rate`-কে `exchange_rate` বানাল। রাশেদের সব unit test সবুজ। কোন টেস্ট এটা ধরত?'
    hint: 'যে টেস্ট আসল API-র উত্তর যাচাই করে।'
    options:
      - text: 'Contract test: আসল sandbox-এর উত্তর schema-র সাথে মিলিয়ে'
        correct: true
        why: 'schema-তে `rate` লেখা, আসল উত্তরে `exchange_rate`: মিল নেই, টেস্ট ব্যর্থ।'
      - text: 'আরও unit test লেখা'
        correct: false
        why: 'unit test-এ mock আমাদের লেখা পুরোনো উত্তরই দেয়, নতুন বদল সে দেখেই না।'
      - text: 'Load test'
        correct: false
        why: 'load test ভিড়ে ধীরতা ও ব্যর্থতা দেখে, উত্তরের ধরন নয়।'
      - text: 'কোড coverage বাড়ানো'
        correct: false
        why: 'কোডের লাইন চললেও উত্তরের ফিল্ড ঠিক কি না যাচাই হয় না।'
    ref: contract-tests
  - q: 'নিচের কোন কোন ভুল শুধু আসল PostgreSQL-এ চালানো integration test-ই ধরতে পারে?'
    hint: 'যে আচরণ ডেটাবেসের নিজের, mock বা SQLite-এর নয়।'
    options:
      - text: 'LOWER(email)-এর unique index বড়-ছোট হাতের ডুপ্লিকেট আটকাচ্ছে কি না'
        correct: true
        why: 'index-এর আচরণ ডেটাবেসের নিজের। SQLite বা mock-এ সে আলাদা বা অনুপস্থিত।'
      - text: 'SELECT ... FOR UPDATE সারি lock করছে কি না'
        correct: true
        why: 'lock PostgreSQL-এর বৈশিষ্ট্য। mock-এ এটা যাচাই করার উপায়ই নেই।'
      - text: '`discountFor()` মেথড ১০% সঠিক হিসাব করছে কি না'
        correct: false
        why: 'সুদ্ধ হিসাব, ডেটাবেস লাগে না। unit test-ই যথেষ্ট ও দ্রুত।'
      - text: 'একটা ক্লাসের getter ঠিক মান ফেরায় কি না'
        correct: false
        why: 'এখানে ডেটাবেসের কিছু নেই।'
    ref: integration-real-deps
  - q: 'তানিয়ার k6 স্ক্রিপ্ট ১০০ virtual user-এ চালিয়ে সাইট ভেঙে দিল, কিন্তু স্ক্রিপ্টে sleep নেই। ফল নিয়ে কী বলা সবচেয়ে সঠিক?'
    hint: 'আসল ব্যবহারকারী কি বিরতি ছাড়া request ছোড়ে?'
    options:
      - text: 'ফল বিভ্রান্তিকর: বিরতিহীন request আসল আচরণের চেয়ে অনেক বেশি চাপ দেয়, "১০০ user"-এর সংখ্যা তাই বাস্তব নয়'
        correct: true
        why: 'আসল user পাতা পড়ে, ভাবে, ক্লিক করে। sleep ছাড়া ১০০ virtual user হয়তো ১,০০০ আসল user-এর সমান ঠেলা দেয়।'
      - text: 'ফল নির্ভুল, কারণ বেশি চাপ মানে বেশি নিরাপদ'
        correct: false
        why: 'ভুল সংখ্যায় ক্ষমতার সীমা ভুল অনুমান হয়, সার্ভার অকারণে বাড়ানো বা কমানো হতে পারে।'
      - text: 'sleep শুধু স্ক্রিপ্ট ধীর করে, ফলে কোনো পার্থক্য নেই'
        correct: false
        why: 'পার্থক্য বিশাল: প্রতি সেকেন্ডে কতগুলো request যায়, তা সরাসরি sleep-এর ওপর নির্ভর করে।'
      - text: 'শুধু staging-এ নয়, production-এ সরাসরি চালাতে হত'
        correct: false
        why: 'production-এ অপরীক্ষিত ভিড় ঢোকানো বিপজ্জনক। সমস্যা staging-এ করা টেস্টের নকশায়।'
    ref: load-testing-k6
  - q: 'এই টেস্টের উদ্দেশ্য কী, আর কী ঘটলে ব্যর্থ হবে?'
    lang: php
    code: |
      $client = new MockHttpClient([
          new MockResponse('', ['http_code' => 503]),
          new MockResponse('', ['error' => 'connection timed out']),
      ], 'https://api.courier.example');

      $provider = new CourierRateProvider($client, new NullLogger());

      self::assertNull($provider->chargeFor('dhaka', 500));
      self::assertNull($provider->chargeFor('dhaka', 500));
    hint: 'দুটো mock উত্তর আসলে কী ধরনের ব্যর্থতা?'
    options:
      - text: 'দুই ধরনের ব্যর্থতায় (503 ও timeout) provider ক্র্যাশ না করে null ফেরায় কি না দেখা; exception বেরোলে ব্যর্থ'
        correct: true
        why: 'এটা failure-injection test: ব্যর্থতায় কোড ভদ্রভাবে সামলায় কি না, সেটাই যাচাই।'
      - text: 'কুরিয়ার API-র সঠিক হার ফেরত আসছে কি না যাচাই'
        correct: false
        why: 'এখানে কোনো সফল উত্তর নেই, শুধু দুই ধরনের ব্যর্থতা।'
      - text: 'ভিড়ে কুরিয়ার API কত ধীর হয় তা মাপা'
        correct: false
        why: 'ভিড় বা মাপামাপি এখানে নেই, শুধু দুটো ব্যর্থ উত্তর।'
      - text: 'শুধু 503-এর জন্য কোড, timeout টেস্টে অপ্রাসঙ্গিক'
        correct: false
        why: 'দ্বিতীয় mock-ই timeout নকল করে, আর দুটো ভিন্ন exception পথে যায়।'
    ref: chaos-failure-injection
  - q: 'টিম প্রথমবার chaos test চালাবে। কোন কোন পদক্ষেপ ঠিক?'
    hint: 'ঝুঁকি আর শেখার সুযোগের ভারসাম্য।'
    options:
      - text: 'আগে unit test ও staging-এ শুরু করা, একটা নির্ভরতা একবারে ভাঙা'
        correct: true
        why: 'ছোট শুরুতে ঝুঁকি কম, আর একটা পরিবর্তনে ফলের কারণ বোঝা সহজ।'
      - text: 'পরীক্ষার আগে steady state মাপা ও অনুমান লিখে রাখা'
        correct: true
        why: 'না মাপলে বোঝা যায় না সত্যিই কিছু বদলেছে কি না, আর অনুমান ছাড়া ভুল ধরা পড়লেও শেখা হয় না।'
      - text: 'প্রথম দিনেই production-এ একসাথে কয়েকটা সার্ভিস বন্ধ করা'
        correct: false
        why: 'একসাথে অনেক কিছু ভাঙলে কারণ বোঝা যায় না, আর ঝুঁকিও বিশাল।'
      - text: 'থামানোর শর্ত ঠিক না করেই শুরু করা, দরকার হলে দেখা যাবে'
        correct: false
        why: 'শুরুর আগেই ঠিক করো কী দেখলে থামাবে। ঘটনার মধ্যে সিদ্ধান্ত নেওয়া কঠিন।'
    ref: chaos-failure-injection
