      - text: 'শুধু 503-এর জন্য কোড, timeout টেস্টে অপ্রাসঙ্গিক'
        correct: false
        why: 'দ্বিতীয় mock-ই timeout নকল করে, আর দুটো ভিন্ন exception পথে যায়।'
    ref: chaos-failure-injection
  - q: 'রাতের contract রান "The property charge_paisa is required" বলে ব্যর্থ, আর কুরিয়ার এখন `charge` পাঠায়। সঠিক পরের পদক্ষেপ কী?'
    hint: 'চুক্তি এখনকার API-কে বর্ণনা করবে, আর কোড চুক্তিকে অনুসরণ করবে।'
    options:
      - text: 'schema থেকে `required` সরিয়ে রানকে আবার সবুজ করা'
