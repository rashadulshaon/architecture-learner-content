      - text: 'থামানোর শর্ত ঠিক না করেই শুরু করা, দরকার হলে দেখা যাবে'
        correct: false
        why: 'শুরুর আগেই ঠিক করুন কী দেখলে থামাবেন। ঘটনার মধ্যে সিদ্ধান্ত নেওয়া কঠিন।'
    ref: chaos-failure-injection
