  - slug: migration-test
    title: 'Migration টেস্ট: আসল ডেটার ওপর চালিয়ে দেখুন'
    kind: howto
    tldr: 'আগের ভার্সনে যান, পুরোনো ধাঁচের (কোণার কেস সহ) ডেটা বসান, migration চালান, তারপর ডেটা অক্ষত আছে ও পুরোনো কোডের query এখনো চলে কি না দেখুন।'
    keywords: ['migration test', 'Doctrine Migrations', 'backward compatible', 'expand', 'edge case data', 'মাইগ্রেশন']
    blocks:
      - type: text
        body: |
          খালি টেস্ট ডেটাবেসে migration সবসময় পাশ করে। production-এ সমস্যা হয় ডেটায়: NULL, ডুপ্লিকেট, অদ্ভুত মান। ধরুন `user` টেবিলে একটা `mobile` কলাম যোগ হচ্ছে। প্রথম খসড়ায় সেটা NOT NULL করলে phone নেই এমন যেকোনো user-এ migration ভাঙে, আর পুরোনো সার্ভারের INSERT-ও ভাঙে। তাই migration টেস্টের ছক: আগের অবস্থায় আসল ধাঁচের ডেটা বসান, migration চালান, তারপর দুটো প্রশ্ন করুন। ডেটা বেঁচে আছে? পুরোনো কোড এখনো চলে?
      - type: visual
        kind: steps
        caption: 'Migration টেস্টের পাঁচ ধাপ'
        steps:
          - {title: '১. আগের ভার্সনে যান', body: 'ডেটাবেসকে migration-এর ঠিক আগের অবস্থায় আনুন।', tip: 'doctrine:migrations:migrate <আগের version> দিয়ে, আলাদা টেস্ট ডেটাবেসে।'}
          - {title: '২. পুরোনো ডেটা বসান', body: 'স্বাভাবিক সারির সাথে NULL ও কোণার কেসও।', tip: 'production-এর ডেটায় যা আছে বলে সন্দেহ: খালি স্ট্রিং, ডুপ্লিকেট, অনেক বড় মান।'}
          - {title: '৩. migration চালান', body: 'এখন নতুন ভার্সনে migrate।', tip: 'ব্যর্থ হলে error বার্তাই বলে দেবে কোন ডেটা সমস্যা করল।'}
          - {title: '৪. ডেটা অক্ষত', body: 'সারি সংখ্যা ও মান আগের মতোই কি না।', tone: good, tip: 'হারিয়ে যাওয়া বা বদলে যাওয়া ডেটা সবচেয়ে ভয়ংকর, কারণ নীরবে ঘটে।'}
          - {title: '৫. পুরোনো কোড চলে', body: 'পুরোনো ধাঁচের INSERT এখনো কাজ করে।', tone: good, tip: 'deploy-এর সময় পুরোনো সার্ভার চলে। তাদের query ভাঙলে কিছু ব্যবহারকারী error পায়।'}
      - type: code
        lang: php
        file: 'migrations/Version20261120100000.php'
        variant: good
        code: |
          public function up(Schema $schema): void
          {
              // expand: কলামটা nullable যোগ করুন, যা আছে কপি করুন, আর কিছু বদলাবেন না
              $this->addSql('ALTER TABLE "user" ADD mobile VARCHAR(20) DEFAULT NULL');
              $this->addSql('UPDATE "user" SET mobile = phone WHERE phone IS NOT NULL');

              // এটা নয়: ALTER TABLE "user" ALTER mobile SET NOT NULL
              // phone-হীন user-এ এটা ভাঙে, আর পুরোনো কোডের INSERT-ও ভাঙে।
              // এটা করুন পরের "contract" migration-এ, যখন সব সার্ভার নতুন কোড চালাচ্ছে।
          }
        marks:
          - {line: 3, tip: 'আগে expand: নতুন কিছু বাধ্যতামূলক নয়, তাই পুরোনো সারি আর পুরোনো কোড চলতেই থাকে।'}
          - {line: 7, tip: 'লোভনীয় সংস্করণ। নিচের টেস্টের কোণার-কেস সারিটা একে ব্যর্থ করে দেয়, টেস্টের কাজই এটা।'}
      - type: code
        lang: php
        file: 'tests/Migration/UserMobileMigrationTest.php'
        variant: good
        code: |
          final class UserMobileMigrationTest extends KernelTestCase
          {
              private const BEFORE = 'DoctrineMigrations\Version20261120090000';
              private const AFTER = 'DoctrineMigrations\Version20261120100000';

              public function testExpandKeepsDataAndOldCodeWorking(): void
              {
                  $this->migrateTo(self::BEFORE);
                  $db = self::getContainer()->get(Connection::class);
                  $db->insert('"user"', ['id' => 1, 'phone' => '01711111111']);
                  $db->insert('"user"', ['id' => 2, 'phone' => null]);   // কোণার কেস

                  $this->migrateTo(self::AFTER);

                  self::assertSame(2, (int) $db->fetchOne('SELECT COUNT(*) FROM "user"'));
                  self::assertSame('01711111111', $db->fetchOne('SELECT phone FROM "user" WHERE id = 1'));
              self::assertSame('01711111111', $db->fetchOne('SELECT mobile FROM "user" WHERE id = 1'));

                  // পুরোনো কোড mobile জানে না: তবু INSERT কাজ করতে হবে
                  $db->insert('"user"', ['id' => 3, 'phone' => '01822222222']);
                  self::assertNull($db->fetchOne('SELECT mobile FROM "user" WHERE id = 3'));
              }

              private function migrateTo(string $version): void
              {
                  (new Process([PHP_BINARY, 'bin/console', 'doctrine:migrations:migrate', $version,
                      '--no-interaction', '--env=test']))->mustRun();
              }
          }
        marks:
          - {line: 11, tip: 'NULL, খালি, ভুল ধাঁচের মান। migration যদি NOT NULL বা UNIQUE বসায়, এখানেই ভাঙে।'}
          - {line: 20, tip: 'পুরোনো কোডের ধরন অনুকরণ: নতুন কলাম ছাড়া INSERT। ফেল করলে expand ধাপ আসলে backward compatible নয়।'}
      - type: quote
        body: 'Migration টেস্ট হবে খালি ডেটাবেসে নয়, production-এর মতো নোংরা ডেটায়।'
    aside:
      - type: tips
        items:
          - 'migration কতক্ষণ লাগে তা আলাদাভাবে মাপুন: staging-এ production-এর মতো বড় ডেটা নিয়ে। ছোট টেস্ট ডেটায় সময় ও lock দেখা যায় না।'
          - 'CI-তে "migrate up, তারপর down, তারপর আবার up" চালান, ভাঙা down() তাড়াতাড়ি ধরা পড়বে।'
      - type: refs
        items:
          - {to: 'resilience/zero-downtime-deploys', label: 'Expand-contract'}
          - {to: 'data/zero-downtime-migrations', label: 'Zero-downtime migration'}
    check:
      q: 'Migration টেস্টে আগে পুরোনো ধাঁচের ডেটা বসিয়ে তারপর migrate করা হয় কেন, migrate করে ডেটা বসালে কী হারাতো?'
      a: 'আসল ঝুঁকি হলো পুরোনো ডেটা (NULL, ডুপ্লিকেট) migration-এ ভাঙবে কি না। migrate করে ডেটা বসালে সেই পুরোনো ডেটাই কখনো পরীক্ষা হত না।'

  - slug: flaky-race-tests
    title: 'ফাঁদ: sleep দিয়ে রেস বানানো টেস্ট সবসময় সবুজ'
    kind: pitfall
    tldr: 'sleep() দিয়ে সময় মেলানো রেস টেস্ট আসলে রেস ঘটায় না, তাই সবসময় সবুজ। শুরুর barrier রাখুন, একবার নয় অনেকবার চালান, আর আসল PostgreSQL ব্যবহার করুন।'
    keywords: ['flaky test', 'sleep', 'barrier', 'repeat', 'DAMA', 'SQLite']
    blocks:
      - type: text
        body: |
          রেস টেস্ট লেখার সহজ চেষ্টা: দুটো process ছাড়ুন, মাঝে ছোট `usleep`। মেশিন দ্রুত হলে প্রথমটা দ্বিতীয়টা শুরুর আগেই শেষ হয়ে যায়, ফলে রেস কখনো ঘটেই না। টেস্ট সবসময় সবুজ, অথচ বাগ রয়ে গেছে। এটা সবচেয়ে ভয়ংকর টেস্ট: নিরাপদ ভাবের মিথ্যা অনুভূতি দেয়।
      - type: code
        lang: php
        file: 'tests/Concurrency/StockConcurrencyTest.php'
        variant: bad
        code: |
          $a = new Process([PHP_BINARY, 'bin/console', 'app:buy', 'SKU-1', '--buyer=1']);
          $b = new Process([PHP_BINARY, 'bin/console', 'app:buy', 'SKU-1', '--buyer=2']);

          $a->start();
          usleep(50_000);        // "একটু দেরিতে দ্বিতীয়টা" — আন্দাজ
          $b->start();

          $a->wait();
          $b->wait();
          // দ্রুত মেশিনে $a আগেই শেষ: দৌড় ঘটেনি, টেস্ট সবুজ
        marks:
          - {line: 5, tip: 'sleep একটা আন্দাজ। সঠিক সময় মেশিন, load আর PHP ওয়ার্ম-আপের ওপর নির্ভর করে: আজ কাজ করে, কাল না।'}
      - type: code
        lang: php
        file: 'tests/Concurrency/StockConcurrencyTest.php'
        variant: good
        code: |
          public function testNeverOversellsAcrossManyRounds(): void
          {
              for ($round = 1; $round <= 20; ++$round) {
                  $this->resetDatabase();                 // নিজে TRUNCATE
                  $this->seedProduct('SKU-1', stock: 1);

                  $this->runBuyersTogether(10);           // --start-at barrier সহ

                  self::assertSame(1, $this->ordersOf('SKU-1'), "round $round: oversell");
              }
          }
        marks:
          - {line: 3, tip: 'একবার সবুজ মানে কিছু না। বাগ যদি তিন round-এর একটায় ধরা পড়ে, ২০ round-এ তা ফসকাতে পারে মাত্র প্রায় ৩,০০০ বারে একবার।'}
          - {line: 4, tip: 'প্রতিটা round পরিষ্কার অবস্থা থেকে শুরু। আগের round-এর ডেটা পরেরটাকে প্রভাবিত করে না।'}
      - type: points
        title: 'আরও তিন ভুল যা টেস্টকে দুর্বল করে'
        style: cross
        items:
          - 'SQLite-এ রেস টেস্ট: ডেটাবেসের নিজের lock ও isolation আচরণই আলাদা'
          - 'transaction-এ মোড়া টেস্টে আলাদা process-এর ডেটা দেখা: অন্য process commit না হওয়া ডেটা দেখে না'
          - 'শুধু শেষ ফলাফল দেখে "একবার চলল, তাই ঠিক" ধরে নেওয়া'
    aside:
      - type: remember
        body: 'রেস টেস্টে সময় আন্দাজ নয়, সংকেত দিয়ে মেলান। আর একবার নয়, বারবার চালান।'
      - type: pitfalls
        items:
          - 'ঠিক করার পর পুরোনো বাগি কোডে টেস্ট চালিয়ে ব্যর্থ হওয়া দেখুন। যে টেস্ট কখনো ব্যর্থ হয়নি, তাকে বিশ্বাস করা যায় না।'
      - type: refs
        items:
          - {to: 'testing/test-types', label: 'আসল ডেটাবেসে integration test'}
    check:
      q: 'রেস টেস্টে বাগি কোডেও টেস্ট সবুজ এলে আপনি কী সিদ্ধান্ত নেবেন?'
      a: 'টেস্ট দুর্বল: সে রেস ঘটাতেই পারছে না। barrier দিয়ে সবাইকে একই মুহূর্তে শুরু করান, অনেক round চালান, আর বাগি কোডে ব্যর্থ হওয়া দেখুন।'

flashcards:
  - q: 'কেন সাধারণ টেস্ট race condition ধরে না?'
    a: 'টেস্ট ক্রমানুসারে, একা একা চলে। race ঘটে দুই কাজ একই মুহূর্তে একই ডেটা ছুঁলে, যে অবস্থা টেস্ট কখনো বানায় না।'
    more: |
      দুজন ক্রেতা একসাথে stock পড়ে ১ দেখলে দুজনই কিনে ফেলে। এক ক্রেতার টেস্টে এই ঘটনা ঘটেই না। তাই আলাদা process বা thread-এ সত্যিই সমান্তরালে চালাতে হয়।
    ref: bugs-tests-never-see
  - q: 'Concurrency টেস্টে সব process একই মুহূর্তে শুরু করানো হয় কীভাবে?'
    a: 'সবাইকে একই শুরুর সময় (--start-at) দেওয়া হয়, তার আগে প্রত্যেকে অপেক্ষা করে। একে barrier বলে।'
    more: |
      process চালু হতে ভিন্ন সময় লাগে, তাই ছাড়ামাত্র শুরু করলে রেস ঘটে না। `microtime(true) + 3` দিয়ে সবার জন্য একই ভবিষ্যৎ সময় ঠিক করুন। সময় এলে সবাই একসাথে ছোটে।
    ref: concurrency-test
  - q: 'Oversell আটকানোর সবচেয়ে সরল atomic উপায় কী?'
    a: 'একটা SQL-এ শর্ত ও কমানো: UPDATE product SET stock = stock - 1 WHERE sku = :sku AND stock > 0। ০টা সারি বদলালে stock নেই।'
    more: |
      পড়া আর লেখা আলাদা করলে মাঝখানে অন্য কেউ ঢুকে পড়ে: চারজন ক্রেতা stock ১ পড়ে, সবাই যাচাই পেরোয়, আর stock নামে -৩-এ। এক SQL-এ করলে ডেটাবেস নিজে ক্রম ঠিক রাখে। affected rows ০ হলে বোঝা যায় কেউ আগে পৌঁছেছে, তখন OutOfStock দিন। দাম: এটা শুধু একটা সারি বাঁচায়; একাধিক সারির নিয়মে lock লাগে।
    ref: atomic-stock-fix
  - q: 'Idempotency টেস্টে কোন দুটো জিনিস যাচাই করবেন?'
    a: 'একই key দিয়ে দুইবার পাঠালে উত্তর হুবহু এক, আর প্রভাব (চার্জ) একবারই। ভিন্ন তথ্য দিলে প্রত্যাখ্যান।'
    more: |
      প্রথম অনুরোধে উত্তর সংরক্ষিত থাকে, দ্বিতীয়টায় সেই সংরক্ষিত উত্তর ফেরে। একই key দিয়ে ভিন্ন টাকা পাঠালে সেটা ক্লায়েন্টের ভুল, তাই 422 দেওয়াই ভালো। একসাথে দুটো একই-key request পাঠিয়েও টেস্ট করুন।
    ref: idempotency-test
  - q: 'Migration টেস্টের নিয়মিত ছক কী?'
    a: 'আগের ভার্সনে যান, পুরোনো ধাঁচের ডেটা বসান, migrate করুন, তারপর ডেটা অক্ষত ও পুরোনো কোড চলে কি না যাচাই।'
    more: |
      খালি ডেটাবেসে migration প্রায় সবসময় পাশ করে, ডেটার কারণে ভাঙে। তাই NULL, খালি স্ট্রিং, ডুপ্লিকেটের মতো কোণার কেস আগে থেকে বসান। আর পুরোনো কোডের INSERT-ও চালান, কারণ deploy-এর সময় পুরোনো সার্ভার চলে।
    ref: migration-test
  - q: 'Sleep দিয়ে সময় মেলানো রেস টেস্ট কেন ভালো নয়?'
    a: 'মেশিনের গতির ওপর নির্ভর করে: দ্রুত মেশিনে রেস আসলে ঘটেই না, তাই বাগি কোডেও টেস্ট সবুজ থাকে।'
    more: |
      সমাধান: সবাইকে একই শুরুর সময় দিন (barrier), একবার নয় ২০ বার চালান, আর পুরোনো বাগি কোডে একবার চালিয়ে দেখুন টেস্ট ব্যর্থ হয়। না হলে টেস্ট রেস ঘটাতেই পারছে না।
    ref: flaky-race-tests
  - q: 'একই Idempotency-Key নিয়ে একই মুহূর্তে আসা দুটো request দুইবার চার্জ করা কীভাবে আটকাবেন?'
    a: 'আগে UNIQUE index দিয়ে key দাবি করুন: শুধু একটা INSERT জেতে ও চার্জ করে, অন্যটা ব্যর্থ হয়ে সংরক্ষিত ফল ফেরায়, বা প্রথমটা চলার সময় 409 দেয়।'
    more: |
      "এই key কি আগে দেখেছি?" দেখে তারপর চার্জ করলে মাঝখানে ফাঁক থাকে, stock-এ পড়ে-তারপর-লেখার মতোই। unique index ফাঁক বন্ধ করে, কারণ ডেটাবেস শুধু একটা INSERT-কে ঢুকতে দেয়। Process কৌশলে একসাথে দুটো request পাঠিয়ে টেস্ট করুন।
    ref: idempotency-test
  - q: 'প্রথম migration-এ নতুন কলাম nullable যোগ করা কেন?'
    a: 'পুরোনো সারিতে এখনো মান নেই, আর পুরোনো সার্ভার কলাম ছাড়াই INSERT করে। NOT NULL দুটোকেই ভাঙত। কড়া করুন পরের contract ধাপে।'
    more: |
      এটা expand-contract-এর expand ধাপ। NULL সারি আর পুরোনো ধাঁচের INSERT সহ migration টেস্ট production-এর আগেই NOT NULL-এর ভুল ধরে ফেলে।
    ref: migration-test
  - q: 'Concurrency টেস্ট transaction-এ মোড়া টেস্টে (DAMA) চালানো যায় না কেন?'
    a: 'DAMA প্রতিটা টেস্টকে একটা transaction-এ মোড়ে, তাই commit-না-হওয়া ডেটা অন্য process দেখতে পায় না।'
    more: |
      আলাদা process-এর টেস্টে ডেটা আসলে commit হতে হয়। তাই concurrency টেস্ট আলাদা suite-এ রাখুন যেখানে DAMA extension নেই, আর শুরুতে নিজে ডেটাবেস পরিষ্কার (TRUNCATE) করুন।
    ref: concurrency-test

quiz:
  - q: 'সেলিমের টেস্ট দুইটা Process ছাড়ে, মাঝে usleep(50_000)। বাগি কোডেও টেস্ট সবুজ আসছে। সবচেয়ে সম্ভাব্য কারণ কী?'
    hint: 'প্রথমটা দ্বিতীয়টা শুরুর আগেই শেষ হয়ে গেলে কী হয়?'
    options:
      - text: 'প্রথম process দ্বিতীয়টা শুরুর আগেই শেষ হয়ে যায়, তাই দৌড়ই ঘটে না'
        correct: true
        why: 'sleep আন্দাজ। দ্রুত মেশিনে ৫০ms-এর মধ্যে পুরো কাজ শেষ, ক্রম হয়ে যায় একটার পর একটা।'
      - text: 'কোডে আসলে কোনো বাগ নেই'
        correct: false
        why: 'টেস্ট যা করছে তা রেস ঘটাচ্ছে না, তাই বাগ আছে কি না এই টেস্ট থেকে বলা যায় না।'
      - text: 'Process ব্যবহারই ভুল'
        correct: false
        why: 'আলাদা process-ই ঠিক উপায়। ভুল হলো শুরুর সময় মেলানোর পদ্ধতিতে।'
      - text: 'PHPUnit রেস টেস্ট সমর্থন করে না'
        correct: false
        why: 'PHPUnit শুধু টেস্ট চালায়, রেস বানানো আপনার টেস্টের দায়িত্ব। Process দিয়ে এটা সম্ভব।'
    ref: flaky-race-tests
  - q: 'নিচের কোন কোন কাজ একটা ভালো concurrency টেস্টের অংশ?'
    hint: 'সত্যিই সমান্তরাল ঘটনা আর শেষ অবস্থার যাচাই।'
    options:
      - text: 'সবাইকে একই শুরুর সময় দেওয়া (barrier)'
        correct: true
        why: 'process-গুলো ভিন্ন সময়ে চালু হয়। barrier ছাড়া তারা একসাথে ছোটে না।'
      - text: 'শেষে stock ও অর্ডারের সংখ্যা যাচাই করা'
        correct: true
        why: 'বাগি ক্রম যাই হোক, শেষ অবস্থা (stock ≥ 0, বিক্রি ≤ পণ্যসংখ্যা) ধরা পড়ে।'
      - text: 'প্রতিটা process শেষ হওয়ার জন্য অপেক্ষা করে তবেই পরেরটা ছাড়া'
        correct: false
        why: 'এতে ক্রেতারা একটার পর একটা আসে, রেস কখনো ঘটে না।'
      - text: 'SQLite ব্যবহার করা, কারণ দ্রুত'
        correct: false
        why: 'SQLite-এর lock ও isolation আচরণ আলাদা, production-এর রেস পুনরুৎপাদন হবে না।'
    ref: concurrency-test
  - q: 'একজন ক্লায়েন্ট একই Idempotency-Key দিয়ে দুইবার একই পেমেন্ট পাঠাল। সঠিক আচরণ কোনটা?'
    hint: 'লিফটের বোতাম পাঁচবার চাপলে লিফট কয়বার আসে?'
    options:
      - text: 'দ্বিতীয়বার আগের উত্তরই ফেরত, নতুন চার্জ হয় না'
        correct: true
        why: 'এটাই idempotency: একই অনুরোধ যতবারই আসুক, প্রভাব একবার, আর উত্তরও এক।'
      - text: 'দুইবারই চার্জ করা, কারণ দুইটা অনুরোধ এসেছে'
        correct: false
        why: 'এতে গ্রাহকের দুইবার টাকা কাটে, যা আটকানোই key-র উদ্দেশ্য।'
      - text: 'দ্বিতীয়বার সবসময় error দেওয়া'
        correct: false
        why: 'ক্লায়েন্ট যে উত্তর হারিয়েছে, তা ফিরে পেতে চায়। error দিলে সে আটকে যায়।'
      - text: 'নতুন key বানিয়ে দ্বিতীয়বার চার্জ করা'
        correct: false
        why: 'সার্ভার নিজে নতুন key বানালে duplicate প্রতিরোধই নষ্ট হয়।'
    ref: idempotency-test
  - q: 'নিচের migration টেস্টে একটা গুরুত্বপূর্ণ ঘাটতি আছে। কোনটা?'
    lang: php
    code: |
      $this->migrateTo(self::AFTER);
      $db->insert('"user"', ['id' => 1, 'phone' => '01711111111']);
      self::assertSame('01711111111', $db->fetchOne('SELECT phone FROM "user" WHERE id = 1'));
    hint: 'পুরোনো ডেটা কখন বসানো হচ্ছে?'
    options:
      - text: 'ডেটা বসানো হচ্ছে migrate করার পরে, তাই migration পুরোনো ডেটার ওপর কেমন চলল তা কখনো পরীক্ষা হয়নি'
        correct: true
        why: 'ঝুঁকি হলো আগের ডেটা migration-এ ভাঙে কি না। তাই আগের ভার্সনে ডেটা বসিয়ে তারপর migrate করতে হয়।'
      - text: 'fetchOne ব্যবহার করা ভুল'
        correct: false
        why: 'একটা মান পড়তে fetchOne ঠিক আছে। সমস্যা ডেটা বসানোর সময়ে।'
      - text: 'phone নম্বরটা বাস্তবসম্মত নয়'
        correct: false
        why: 'নম্বর ঠিকই আছে। ঘাটতি টেস্টের ক্রমে।'
      - text: 'Migration টেস্ট আলাদা ডেটাবেসে চালানো ভুল'
        correct: false
        why: 'আলাদা টেস্ট ডেটাবেসেই চালানো উচিত, production-এ নয়।'
    ref: migration-test
  - q: 'শেষ পণ্যটার জন্য দশজন ক্রেতা এই কোড চালাল, আর stock নামল -৩-এ। কেন?'
    lang: php
    code: |
      $stock = (int) $this->connection->fetchOne(
          'SELECT stock FROM product WHERE sku = :sku', ['sku' => $sku],
      );
      if ($stock < 1) {
          throw new OutOfStock($sku);
      }
      $this->connection->executeStatement(
          'UPDATE product SET stock = stock - 1 WHERE sku = :sku', ['sku' => $sku],
      );
    hint: 'SELECT আর UPDATE-এর মাঝখানে কী ঘটতে পারে?'
    options:
      - text: 'যাচাই আর লেখা আলাদা ধাপ, তাই কমানোর আগেই কয়েকজন ক্রেতা `< 1` যাচাই পেরিয়ে যায়'
        correct: true
        why: 'সবাই stock = ১ পড়ে। সমাধান: `AND stock > 0` সহ একটাই UPDATE আর affected rows যাচাই।'
      - text: 'UPDATE-এ `stock - 1`-এর বদলে `SET stock = :stock` লেখা উচিত'
        correct: false
        why: 'প্রতিজন নিজের পড়া মান ফেরত লিখলে stock ০-তে থামত ঠিকই, কিন্তু পণ্যটা সবার কাছেই বিক্রি হয়ে যেত।'
      - text: 'OutOfStock কখনো ছোড়াই হয় না'
        correct: false
