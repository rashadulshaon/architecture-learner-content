    check:
      q: 'Stock কমানোর টেস্ট একটা ক্রেতা নিয়ে সবসময় পাশ করে, তবু production-এ oversell হয়। টেস্টের কোন ঘাটতি এর কারণ?'
      a: 'টেস্ট একজন ক্রেতা নিয়ে, ক্রমানুসারে চলে। দুজন একসাথে stock পড়লে যে ভুল ঘটে, সেই অবস্থা টেস্টে কখনো তৈরিই হয়নি।'

  - slug: concurrency-test
    title: 'একসাথে ১০ ক্রেতা: concurrency টেস্ট লেখা'
    kind: howto
    tldr: 'আলাদা process-এ একসাথে অনেক ক্রেতা চালান, সবাইকে একই মুহূর্তে শুরু করান, তারপর যাচাই করুন stock ঋণাত্মক হয়নি আর বিক্রি ঠিক একটাই। কোন বাগ ধরা পড়ে, তা পরের slide-এ।'
    keywords: ['concurrency test', 'Symfony Process', 'atomic update', 'barrier', 'overselling', 'parallel']
    blocks:
      - type: text
        body: |
          আসল ভিড় বানাতে ১০টা আলাদা PHP process একসাথে ছাড়ুন। প্রতিটা নিজের ডেটাবেস connection দিয়ে কিনতে চায়। সবাই যেন একই মুহূর্তে শুরু করে, তাই সবাইকে একটা শুরুর সময় (`--start-at`) দেওয়া হয়। প্রতিটা process কেনার আগে `time_sleep_until($startAt)` চালায়, যেন দৌড়ের মাঠে শুরুর বাঁশির অপেক্ষা। এই ভাগ করা শুরুকে বলে **barrier**। শেষে ডেটাবেসের অবস্থা যাচাই করুন, কে কী করল তা নয়।
      - type: code
        lang: php
        file: 'tests/Concurrency/StockConcurrencyTest.php'
        variant: good
        code: |
          #[Group('concurrency')]
          final class StockConcurrencyTest extends KernelTestCase
          {
              public function testTenBuyersSellExactlyOneItem(): void
              {
                  $this->seedProduct('SKU-1', stock: 1);
                  $startAt = microtime(true) + 3;       // সবার একই শুরুর মুহূর্ত

                  $buyers = [];
                  for ($i = 1; $i <= 10; ++$i) {
                      $buyers[] = $p = new Process([
                          PHP_BINARY, 'bin/console', 'app:buy', 'SKU-1',
                          "--buyer=$i", "--start-at=$startAt", '--env=test',
                      ]);
                      $p->start();                      // অপেক্ষা না করে ছাড়ুন
                  }
                  foreach ($buyers as $p) {
                      $p->wait();
                  }

                  self::assertSame(0, $this->stockOf('SKU-1'));      // ঋণাত্মক নয়
                  self::assertSame(1, $this->ordersOf('SKU-1'));     // ঠিক একটা বিক্রি
              }
          }
        marks:
          - {line: 7, tip: 'প্রতিটা process আলাদা, তাই শুরু হতে ভিন্ন সময় লাগে। এই সময় পর্যন্ত অপেক্ষা করলে সবাই একসাথে ছোটে।'}
          - {line: 15, tip: 'start() অপেক্ষা করে না, ১০টা process প্রায় একই সাথে চলে। run() বা mustRun() দিলে একটার পর একটা চলত।'}
          - {line: 21, tip: 'প্রশ্নটা "কে জিতল" নয়, "শেষ অবস্থা ঠিক কি না": কোনো বাগি ক্রম থাকলেও এই দুই সংখ্যা ধরবে।'}
      - type: quote
        body: 'Concurrency টেস্টে শেষ অবস্থা যাচাই করুন: stock কখনো ঋণাত্মক নয়, বিক্রি পণ্যের সংখ্যার বেশি নয়।'
    aside:
      - type: pitfalls
        items:
          - 'এই টেস্ট transaction-এ মোড়া টেস্টের (DAMA) ভেতরে চালানো যায় না। অন্য process commit না হওয়া ডেটা দেখে না। আলাদা suite রাখুন, শুরুতে নিজে TRUNCATE করুন।'
          - 'পুরোনো, ভাঙা কোডে এই টেস্ট চালিয়ে দেখুন তা ব্যর্থ হয় কি না। না হলে টেস্ট নিজেই দুর্বল।'
      - type: terms
        items:
          - {term: 'Barrier', meaning: 'সবার জন্য একটা ভাগ করা শুরুর সময়, যার জন্য সবাই অপেক্ষা করে, যাতে একসাথে শুরু হয়।'}
          - {term: 'DAMA', meaning: 'একটা টেস্ট bundle: প্রতিটা টেস্টকে transaction-এ মুড়ে শেষে rollback করে, যাতে প্রতিটা টেস্ট পরিষ্কার অবস্থা থেকে শুরু হয়।'}
      - type: commands
        items:
          - {cmd: 'php bin/phpunit --group concurrency', desc: 'শুধু concurrency টেস্ট চালান'}
    check:
      q: 'টেস্টে প্রতিটা Process কেন `start()` দিয়ে ছাড়া হয়, `mustRun()` দিয়ে নয়?'
      a: '`mustRun()` একটা শেষ না হওয়া পর্যন্ত অপেক্ষা করে, ফলে ক্রেতারা একটার পর একটা আসে, দৌড়ই হয় না। `start()` সবাইকে প্রায় একই সাথে ছাড়ে।'

  - slug: atomic-stock-fix
    title: 'আগে পড়ে পরে লিখলে oversell: একটা atomic UPDATE-ই সমাধান'
    kind: pitfall
    tldr: 'এক statement-এ stock দেখে আরেক statement-এ কমালে মাঝখানে ফাঁক থাকে, অন্য ক্রেতা ঢুকে পড়ে। `stock > 0` সহ একটা UPDATE ফাঁক বন্ধ করে, কিন্তু শুধু একটা সারির জন্য; বড় নিয়মে lock লাগে।'
    keywords: ['atomic update', 'overselling', 'check then act', 'read then write', 'OutOfStock', 'stock', 'ওভারসেল']
    blocks:
      - type: text
        body: |
          আগের concurrency টেস্ট নিচের প্রথম-খসড়া কোডে চালালে সে ব্যর্থ হয়, ধরুন `stock = -3` দেখিয়ে: একটা পণ্যের জন্য চারটা অর্ডার গেছে। সংখ্যাটা প্রতিবার আলাদা হয়, কিন্তু ০ ছাড়া যা-ই আসুক, বোঝা যায় টেস্ট বাগ ধরেছে। ফাঁকটা SELECT আর UPDATE-এর মাঝখানে: যে মুহূর্তে দুই ভাই ATM-এর পর্দায় ১,০০০ দেখেছে, কিন্তু কেউ এখনো টাকা তোলেনি।
      - type: code
        lang: php
        file: 'src/Stock/StockService.php'
        variant: bad
        code: |
          public function buy(string $sku, int $buyerId): void
          {
              $stock = (int) $this->connection->fetchOne(
                  'SELECT stock FROM product WHERE sku = :sku', ['sku' => $sku],
              );
              if ($stock < 1) {
                  throw new OutOfStock($sku);
              }
              // ফাঁক: ততক্ষণে অন্য ক্রেতারাও stock = 1 পড়ে ফেলেছে
              $this->connection->executeStatement(
                  'UPDATE product SET stock = stock - 1 WHERE sku = :sku', ['sku' => $sku],
              );
              $this->connection->insert('orders', ['sku' => $sku, 'buyer_id' => $buyerId]);
          }
        marks:
          - {line: 6, tip: 'লেখার মুহূর্তে এই যাচাইয়ের মান ততক্ষণে পুরোনো হয়ে গেছে।'}
          - {line: 11, tip: 'এখানে stock আর কেউ যাচাই করে না, তাই যে ক্রেতা যাচাই পেরিয়েছে সে-ই কমায়: stock নামে -৩-এ।'}
      - type: code
        lang: php
        file: 'src/Stock/StockService.php'
        variant: good
        code: |
          public function buy(string $sku, int $buyerId): void
          {
              $this->connection->beginTransaction();
              try {
                  $updated = $this->connection->executeStatement(
                      'UPDATE product SET stock = stock - 1 WHERE sku = :sku AND stock > 0',
                      ['sku' => $sku],
                  );
                  if (0 === $updated) {
                      throw new OutOfStock($sku);   // stock নেই: কেউ জিতেছে আগে
                  }

                  $this->connection->insert('orders', ['sku' => $sku, 'buyer_id' => $buyerId]);
                  $this->connection->commit();
              } catch (\Throwable $e) {
                  $this->connection->rollBack();
                  throw $e;
              }
          }
        marks:
          - {line: 3, tip: 'transaction কমানো আর অর্ডারকে একটা একক কাজ বানায়: INSERT ব্যর্থ হলে কমানোও ফেরত যায়।'}
          - {line: 6, tip: 'পড়া আর লেখা এক SQL-এ: stock > 0 শর্ত ও কমানো একসাথে, মাঝখানে অন্য কেউ ঢুকতে পারে না। এটাই atomic।'}
          - {line: 9, tip: '০টা সারি বদলেছে মানে শর্ত মেলেনি, অর্থাৎ stock নেই। এভাবেই আমরা জানি দৌড়ে কে হারল।'}
    aside:
      - type: when
        use:
          - 'এক সারিতে রাখা counter বা stock: শর্তটা UPDATE-এর ভেতরেই রাখুন।'
        avoid:
          - 'একাধিক সারি বা টেবিল জুড়ে নিয়ম (সিট, wallet ও coupon একসাথে): lock বা unique constraint লাগবে।'
          - 'একটাই অতি-ব্যস্ত সারি: ক্রেতারা তাতে লাইন ধরে, তাই transaction ছোট রাখুন।'
      - type: refs
        items:
          - {to: 'concurrency/atomic-operations', label: 'Atomic অপারেশন'}
          - {to: 'concurrency/locking', label: 'Lock দিয়ে সামলানো'}
    check:
      q: 'SELECT-এর পর UPDATE করলে oversell হয়, অথচ `UPDATE ... WHERE stock > 0` করে না কেন?'
      a: 'যাচাই আর কমানো ডেটাবেসের ভেতরে একটাই ধাপে হয়, মাঝখানে অন্য ক্রেতা ঢুকতে পারে না। ০টা সারি বদলালে মানে stock আগেই শেষ।'

  - slug: idempotency-test
    title: 'লিফটের বোতাম বারবার চাপলে: idempotency টেস্ট'
    kind: howto
    tldr: 'একই Idempotency-Key দিয়ে দুইবার পাঠান: উত্তর একই, চার্জ একটাই। আর একই key দিয়ে ভিন্ন তথ্য পাঠালে প্রত্যাখ্যান। retry ও দুইবার ক্লিক এভাবেই টেস্ট হয়।'
    keywords: ['idempotency test', 'Idempotency-Key', 'WebTestCase', 'duplicate request', 'retry', 'দুইবার চার্জ']
    blocks:
      - type: metaphor
        icon: building
        title: 'লিফটের বোতাম'
        body: |
          লিফটের বোতাম পাঁচবার চাপলেও লিফট একবারই আসে, পাঁচটা নয়। ধরুন, বোতামের মতোই পেমেন্ট API: নেটওয়ার্ক কেটে ক্লায়েন্ট একই অনুরোধ আবার পাঠাল। একই key থাকলে সার্ভার বোঝে "এটা আগের অনুরোধই" এবং আগের উত্তর ফেরত দেয়, নতুন চার্জ না করে।
      - type: visual
        kind: sequence
        caption: 'Retry-তে একই key: একই উত্তর, নতুন চার্জ নেই'
        actors:
          - {id: client, label: 'ক্লায়েন্ট', icon: browser, tip: 'নেটওয়ার্ক কেটে গেলে আবার চেষ্টা করে, একই key নিয়ে।'}
          - {id: api, label: 'পেমেন্ট API', icon: api, tip: 'key মনে রাখে, দ্বিতীয় অনুরোধে নতুন চার্জ করে না।'}
          - {id: db, label: 'ডেটাবেস', icon: db, tip: 'key আর তার ফল সংরক্ষিত থাকে।'}
        messages:
