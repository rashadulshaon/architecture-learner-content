      - type: story
        title: 'ফ্ল্যাশ সেলে ১২০টা বেশি অর্ডার'
        body: |
          একটা সেলে ১০০টা ফোন ছিল, বিক্রি হয়ে গেল ২২০টা। টিমের টেস্টে stock ঠিকঠাক কমছিল। কারণ টেস্ট একজন ক্রেতা নিয়ে, একটার পর একটা চলত। হাজারো ক্রেতা একসাথে এলে বাগটা সামনে এল।
      - type: terms
        items:
          - {term: 'Race condition', meaning: 'দুই কাজ একসাথে চললে ফল নির্ভর করে কে আগে পৌঁছাল তার ওপর।'}
          - {term: 'Idempotent', meaning: 'একই কাজ একাধিকবার করলেও ফল একবারের সমান।'}
      - type: refs
