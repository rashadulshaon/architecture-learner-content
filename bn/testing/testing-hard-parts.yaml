slides:
  - slug: bugs-tests-never-see
    title: 'যে বাগ একা একা টেস্টে কখনো আসে না'
    kind: story
    tldr: 'Concurrency, idempotency আর migration-এর বাগ সাধারণ টেস্টে দেখা যায় না, কারণ টেস্ট একটার পর একটা চলে, একা। অথচ production-এ ঠিক এগুলোই ভাঙে। এগুলো বিশেষভাবে টেস্ট করতে হয়।'
    keywords: ['concurrency test', 'race condition', 'idempotency test', 'migration test', 'overselling', 'রেস কন্ডিশন']
    blocks:
      - type: metaphor
        icon: bank
        title: 'দুই ভাইয়ের ATM'
        body: |
          দুই ভাইয়ের যৌথ অ্যাকাউন্টে ১,০০০ টাকা। দুজন একই মুহূর্তে দুই ATM-এ গিয়ে ১,০০০ টাকা তুলতে চাইল। ATM দুটোই আগে ব্যালেন্স দেখল (১,০০০), তারপর দুজনকেই টাকা দিল। একা একা পরীক্ষা করলে ATM ঠিকই চলে। ভুল ধরা পড়ে শুধু দুজন একসাথে এলে। কোডের টেস্টও সাধারণত "একা একা" চলে।
      - type: visual
        kind: sequence
        caption: 'শেষ একটা পণ্য, দুই ক্রেতা, দুইটা অর্ডার'
        actors:
          - {id: rahim, label: 'ক্রেতা রহিম', icon: user, tip: 'অর্ডার দিচ্ছে, মনে করছে সে-ই একমাত্র ক্রেতা।'}
