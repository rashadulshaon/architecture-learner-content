      - type: code
        lang: php
        file: 'tests/Functional/PaymentIdempotencyTest.php'
        variant: good
        code: |
          public function testSameKeyTwiceChargesOnce(): void
          {
              $client = static::createClient();
              $key = ['HTTP_IDEMPOTENCY_KEY' => 'order-42-attempt-1'];
              $payload = ['orderId' => 42, 'amount' => 50_000];

              $client->jsonRequest('POST', '/api/payments', $payload, $key);
              $first = $client->getResponse()->getContent();

              $client->jsonRequest('POST', '/api/payments', $payload, $key);

              self::assertSame($first, $client->getResponse()->getContent());   // একই উত্তর
              self::assertSame(1, $this->paymentCount(42));                     // চার্জ একটাই
          }

          public function testSameKeyWithDifferentPayloadIsRejected(): void
          {
              $client = static::createClient();
              $key = ['HTTP_IDEMPOTENCY_KEY' => 'order-42-attempt-1'];

              $client->jsonRequest('POST', '/api/payments', ['orderId' => 42, 'amount' => 50_000], $key);
              $client->jsonRequest('POST', '/api/payments', ['orderId' => 42, 'amount' => 99_000], $key);

              self::assertResponseStatusCodeSame(422);   // আমাদের API-র নিয়ম
          }
        marks:
          - {line: 4, tip: 'HTTP header Idempotency-Key টেস্ট ক্লায়েন্টে HTTP_IDEMPOTENCY_KEY হয়ে যায় (বড় হাতের, - বদলে _, আগে HTTP_)।'}
          - {line: 12, tip: 'শুধু চার্জ গোনা যথেষ্ট নয়, উত্তরও হুবহু এক হতে হবে: নইলে ক্লায়েন্ট দ্বিতীয়বার বিভ্রান্ত হয়।'}
          - {line: 13, tip: 'key সামলানো নেই এমন API-তে দ্বিতীয় POST আবার চার্জ করে, এই গণনা ২ হয়, আর টেস্ট ব্যর্থ হয়।'}
          - {line: 24, tip: 'একই key দিয়ে ভিন্ন টাকা মানে ক্লায়েন্টের ভুল। চুপচাপ আগেরটা ফেরালে ভুল লুকিয়ে যায়, তাই প্রত্যাখ্যান।'}
      - type: code
        lang: sql
        file: 'migrations: unique key'
        variant: good
        code: |
          CREATE UNIQUE INDEX uniq_payment_idempotency_key ON payment (idempotency_key);

          -- অনুরোধ A: INSERT (idempotency_key = 'order-42-attempt-1') সফল, তাই A চার্জ করে
