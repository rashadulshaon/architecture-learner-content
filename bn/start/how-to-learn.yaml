slides:
  - slug: why-we-forget
    title: 'পড়লাম, বুঝলাম… তারপর ভুলে গেলাম'
    kind: story
    tldr: 'শুধু পড়ে রাখলে এক সপ্তাহে বেশিরভাগই হারিয়ে যায়; মনে রাখতে হলে নিজেকে বারবার প্রশ্ন করতে হয়।'
    keywords: ['forgetting curve', 'active recall', 'ভুলে যাওয়া', 'মনে রাখা', 'শেখার কৌশল']
    blocks:
      - type: metaphor
        icon: pencil
        title: 'বালুর ওপর লেখা'
        body: |
          সমুদ্রের পাড়ে বালুতে নাম লিখলে প্রথম ঢেউয়েই অর্ধেক মুছে যায়। নতুন শেখা জিনিসও তেমন — মস্তিষ্ক যেটা আর কাজে লাগছে না, সেটা মুছে ফেলে। কিন্তু একই জায়গায় বারবার লিখলে দাগ গভীর হয়, তখন ঢেউ আর মুছতে পারে না।
      - type: visual
        kind: bars
        caption: 'একবার পড়ে রেখে দিলে কতটুকু মনে থাকে (আনুমানিক)'
        items:
          - {label: 'পড়ার ঠিক পরে', value: 100, display: '১০০%', tone: good, tip: 'সদ্য পড়েছ, তাই সবই মনে আছে — কিন্তু এই অনুভূতিটাই ধোঁকা দেয়।'}
          - {label: '২০ মিনিট পরে', value: 58, display: '~৬০%', tip: 'আধা ঘণ্টাও যায়নি, অথচ প্রায় অর্ধেক ঝাপসা হয়ে গেছে।'}
          - {label: '১ দিন পরে', value: 33, display: '~৩৫%', tone: warn, tip: 'পরদিন তিন ভাগের দুই ভাগই নেই। ঝালাইয়ের সেরা সময় এটাই।'}
          - {label: '১ সপ্তাহ পরে', value: 25, display: '~২৫%', tone: bad, tip: 'ঝালাই না করলে এক সপ্তাহে শুধু মোটা দাগের ধারণাটুকু টিকে থাকে।'}
      - type: quote
        body: 'পড়া মানে শেখা নয়। মনে করার চেষ্টাই শেখা।'
    aside:
      - type: problem
        body: 'টিউটোরিয়াল দেখে মনে হয় সব বুঝেছ, কিন্তু কাজের সময় কিছুই মনে পড়ে না। এই প্ল্যাটফর্মের পুরো নকশা সেই সমস্যা মেটানোর জন্য।'
      - type: terms
        items:
          - {term: 'Forgetting curve', meaning: 'সময়ের সাথে শেখা জিনিস কত দ্রুত ভুলে যাই, তার গ্রাফ।'}
          - {term: 'Active recall', meaning: 'উত্তর না দেখে নিজে মনে করার চেষ্টা।'}
    check:
      q: 'একটা জিনিস মনে গেঁথে রাখার সবচেয়ে কার্যকর উপায় কী?'
      a: 'আবার পড়া নয় — উত্তর না দেখে নিজে মনে করার চেষ্টা করা, এবং কয়েক দিন পরপর সেটা আবার করা।'

  - slug: learning-loop
    title: 'শেখার চার ধাপের চক্র'
    kind: concept
    tldr: 'দেখো → মনে করো → যাচাই করো → ফিরে এসো। এই চক্রই ছোট ছোট জ্ঞানকে স্থায়ী করে।'
    keywords: ['spaced repetition', 'learning loop', 'শেখার চক্র', 'ঝালাই', 'interleaving']
    blocks:
      - type: text
        body: |
          এখানে প্রতিটা বিষয় চারটা ছোট ধাপে শেখানো হয়। প্রতি ধাপে মস্তিষ্ক আলাদা কাজ করে, তাই একটা ধাপ বাদ দিলে চক্রটা ভেঙে যায়। এক বসায় একটা ছোট ধাপ (sub-segment) শেষ করাই যথেষ্ট — বেশি নয়।
      - type: visual
        kind: steps
        caption: 'একটা বিষয় মাথায় বসানোর চার ধাপ'
        steps:
          - {title: '১. দেখো', body: 'স্লাইডে ছবি আর উদাহরণ দিয়ে একটাই আইডিয়া বোঝো।', tip: 'ছবি আর লেখা একসাথে দেখলে মস্তিষ্ক দুই পথে মনে রাখে — একে বলে dual coding।'}
          - {title: '২. মনে করো', body: 'ফ্ল্যাশ কার্ডে উত্তর না দেখে নিজে বলার চেষ্টা করো।', tip: 'মনে করতে যত কষ্ট হয়, স্মৃতি তত পোক্ত হয়। এটাই active recall।'}
          - {title: '৩. যাচাই করো', body: 'কুইজে ভুল করো, ব্যাখ্যা পড়ো। ভুল থেকেই সবচেয়ে বেশি শেখা হয়।', tip: 'ভুল উত্তরের পরে পাওয়া ব্যাখ্যা মস্তিষ্ক অনেক বেশি গুরুত্ব দিয়ে জমা রাখে।'}
          - {title: '৪. ফিরে এসো', body: 'কঠিন জিনিস বুকমার্ক করো, কয়েক দিন পর আবার দেখো।', tone: accent, tip: 'কয়েক দিন বিরতি দিয়ে ঝালাই করাকে বলে spaced repetition — ভুলে যাওয়া ঠেকানোর সেরা অস্ত্র।'}
      - type: points
        title: 'প্রতিদিনের নিয়ম'
        style: check
        items:
          - 'একবারে একটা sub-segment — ১০ থেকে ১৫ মিনিট।'
          - 'স্লাইডের নিচের “নিজেকে জিজ্ঞেস করো” প্রশ্নের উত্তর আগে নিজে ভাবো।'
          - 'নতুন কিছু শুরুর আগে আগের দিনের ফ্ল্যাশ কার্ড এক রাউন্ড।'
    aside:
      - type: remember
        body: 'দেখো → মনে করো → যাচাই করো → ফিরে এসো। শুধু প্রথম ধাপে আটকে থাকলে শেখা হয় না।'
      - type: tips
        items:
          - 'ক্লান্ত লাগলে থামো। ছোট ছোট বিরতি দিয়ে পড়লে বেশি মনে থাকে।'
          - 'কুইজে প্রশ্ন এলোমেলো ক্রমে আসে ইচ্ছা করেই — এতে মনে রাখা আরও পোক্ত হয় (interleaving)।'
    check:
      q: 'চার ধাপের কোনগুলোয় সবচেয়ে বেশি শেখা হয়, আর কেন?'
      a: '“মনে করো” আর “যাচাই করো” ধাপে — কারণ সেখানে মস্তিষ্ককে খাটতে হয়। শুধু দেখায় খাটুনি নেই।'

  - slug: four-rooms
    title: 'প্ল্যাটফর্মের চার ঘর'
    kind: concept
    tldr: 'স্লাইড শেখায়, ফ্ল্যাশ কার্ড মনে করায়, কুইজ যাচাই করে, বুকমার্ক ফিরিয়ে আনে।'
    keywords: ['slides', 'flashcards', 'quiz', 'bookmarks', 'প্ল্যাটফর্ম ব্যবহার', 'সার্চ']
    blocks:
      - type: text
        body: |
          উপরের মেনুতে চারটা ঘর আছে। প্রতিটা ঘরের কাজ আলাদা, কিন্তু সবগুলো একই বিষয়ের তালিকা (A থেকে U) ধরে সাজানো। তাই এক ঘরে যা শিখলে, পাশের ঘরে গিয়ে ঠিক সেটাই ঝালাই করতে পারবে।
      - type: visual
        kind: table
        caption: 'কোন ঘরে কী হয়, আর কখন যাবে'
        headers: ['ঘর', 'কী আছে', 'কখন যাবে']
        rows:
          - cells: ['শেখো', 'ছবি, কোড আর উদাহরণসহ স্লাইড', 'নতুন বিষয় শুরু করতে']
            tip: 'বামে তালিকা, মাঝে স্লাইড, ডানে বাড়তি প্রসঙ্গ — পাওয়ারপয়েন্টের মতো।'
          - cells: ['ফ্ল্যাশ কার্ড', '১৫ সেকেন্ডের প্রশ্ন–উত্তর কার্ড', 'শেখার পরে, ফাঁকা সময়ে']
            tip: 'স্টোরির মতো একটার পর একটা কার্ড আসে। কার্ডে চাপ দিলে উল্টে উত্তর দেখায়।'
          - cells: ['কুইজ', 'ব্যাখ্যাসহ MCQ, সময়ের সীমা নেই', 'নিজেকে যাচাই করতে']
            tip: 'ভুল হলে ডান পাশে দেখায় কেন ভুল আর কোনটা ঠিক — সাথে স্লাইডের লিংক।'
          - cells: ['বুকমার্ক', 'তোমার জমানো স্লাইড ও কার্ড', 'কাজের ফাঁকে ঝালাই করতে']
            tip: 'যা কঠিন লাগে তা জমিয়ে রাখো; বিষয় ধরে সাজানো থাকে বলে পরে সহজে পাবে।'
    aside:
      - type: tips
        items:
          - 'কাজের মাঝে কিছু মনে না পড়লে সার্চ খোলো (Ctrl/⌘ + K), বাংলা বা ইংরেজি — যেকোনো শব্দ লিখে খোঁজো।'
          - 'প্রতিটা লিংক নতুন ট্যাবে খোলা যায়। এক ট্যাবে স্লাইড, আরেক ট্যাবে কুইজ রাখতে পারো।'
      - type: refs
        items:
          - {to: learning-loop, label: 'শেখার চার ধাপের চক্র'}
    check:
      q: 'কাজের মাঝে idempotency key কী তা ভুলে গেলে সবচেয়ে দ্রুত কোথায় পাবে?'
      a: 'সার্চ (Ctrl/⌘ + K) খুলে "idempotency" লিখলে সরাসরি ওই স্লাইডে চলে যাবে।'

  - slug: read-a-slide
    title: 'একটা স্লাইড কীভাবে পড়বে'
    kind: howto
    tldr: 'বামে তালিকা, মাঝে মূল আইডিয়া, ডানে বাড়তি প্রসঙ্গ; ছবির যেকোনো অংশে মাউস রাখলেই ব্যাখ্যা।'
    keywords: ['how to use', 'shortcut', 'tooltip', 'স্লাইড পড়া', 'কিবোর্ড শর্টকাট']
    blocks:
      - type: visual
        kind: flow
        caption: 'স্লাইড পাতার তিন অংশ আর নিচের প্রশ্ন'
        nodes:
          - {id: outline, label: 'বামে: তালিকা', sub: 'বিষয় → ধাপ → স্লাইড', icon: list, col: 0, row: 0, tip: 'পুরো কোর্সের মানচিত্র। যেকোনো স্লাইডে এক ক্লিকে যাওয়া যায়; পড়া স্লাইডে টিক পড়ে।'}
          - {id: slide, label: 'মাঝে: স্লাইড', sub: 'একটাই আইডিয়া', icon: book, tone: accent, col: 2, row: 0, tip: 'ছোট লেখা, ছবি আর কোড। ছবির প্রতিটা অংশে মাউস রাখলে ছোট ব্যাখ্যা ভেসে ওঠে।'}
          - {id: notes, label: 'ডানে: প্রসঙ্গ', sub: 'গল্প, কমান্ড, লিংক', icon: lightbulb, col: 4, row: 0, tip: 'মূল আইডিয়ার বাইরের দরকারি কথা: কোন সমস্যা মেটায়, কাজের কমান্ড, সংশ্লিষ্ট স্লাইডের লিংক।'}
          - {id: recall, label: 'নিচে: প্রশ্ন', sub: 'নিজেকে জিজ্ঞেস করো', icon: target, col: 2, row: 1.5, tip: 'প্রতিটা স্লাইডের শেষে একটা প্রশ্ন। উত্তর লুকানো থাকে — আগে নিজে ভাবো, তারপর খোলো।'}
        edges:
          - {from: outline, to: slide, label: 'তালিকা থেকে একটা স্লাইড বেছে নাও'}
          - {from: slide, to: notes, label: 'আরও জানতে চাইলে ডান পাশে তাকাও'}
          - {from: slide, to: recall, label: 'শেষে উত্তর না দেখে প্রশ্নটার জবাব দাও'}
          - {from: recall, to: outline, label: 'পারলে পরের স্লাইডে যাও, না পারলে আবার পড়ো', tone: good}
      - type: code
        lang: php
        file: 'চিহ্নিত লাইনে মাউস রাখো'
        code: |
          $order = $orders->find($id);

          // এই লাইনটা চিহ্নিত — ওপরে মাউস রাখলেই কারণটা দেখাবে
          $this->denyAccessUnlessGranted('view', $order);

          return $this->json($order);
        marks:
          - {line: 4, tip: 'এই এক লাইন না থাকলে যে কেউ URL-এ id বদলে অন্যের অর্ডার দেখে ফেলত।'}
      - type: points
        title: 'পড়ার ক্রম'
        style: number
        items:
          - 'আগে ছবিটা দেখো, তারপর লেখা পড়ো।'
          - 'মোটা দাগে আলাদা করা উক্তিগুলো অলঙ্ঘনীয় নিয়ম — হুবহু মনে রাখো।'
          - 'শেষে নিচের প্রশ্নের উত্তর নিজে দাও, তারপর মিলিয়ে দেখো।'
    aside:
      - type: commands
        title: 'কিবোর্ড শর্টকাট'
        items:
          - {cmd: '→   ←', desc: 'পরের বা আগের স্লাইড'}
          - {cmd: 'B', desc: 'স্লাইড বুকমার্ক করা বা তুলে ফেলা'}
          - {cmd: 'Ctrl + K   অথবা   /', desc: 'সার্চ খোলা'}
      - type: remember
        body: 'ছবি → লেখা → কোড → প্রশ্ন। এই ক্রমে পড়লে মাথায় সবচেয়ে ভালো বসে।'
    check:
      q: 'ছবির কোনো বাক্সের মানে না বুঝলে কী করবে?'
      a: 'বাক্সটার ওপর মাউস রাখবে (মোবাইলে টোকা দেবে) — ছোট ব্যাখ্যা ভেসে উঠবে।'

flashcards:
  - q: 'Forgetting curve কী বলে?'
    a: 'নতুন শেখা জিনিস ঝালাই না করলে এক দিনের মধ্যেই বেশিরভাগ ভুলে যাই।'
    more: |
      মস্তিষ্ক সব তথ্য জমিয়ে রাখে না — যেটা আবার কাজে লাগে না, সেটা দ্রুত মুছে ফেলে। প্রথম এক দিনেই পতন সবচেয়ে খাড়া। তাই শেখার পরদিন অল্প একটু ঝালাই সবচেয়ে বেশি লাভ দেয়।
    ref: why-we-forget
  - q: 'Active recall মানে কী?'
    a: 'উত্তর না দেখে নিজে মনে করার চেষ্টা করা।'
    more: |
      আবার পড়লে জিনিসটা শুধু চেনা চেনা লাগে, কিন্তু মস্তিষ্ককে খাটতে হয় না। নিজে মনে করতে গেলে মস্তিষ্ক তথ্যটা খুঁজে বের করে, আর সেই খোঁজার পথটাই পোক্ত হয়। ফ্ল্যাশ কার্ড আর কুইজ ঠিক এই কাজটা করায়।
    ref: why-we-forget
  - q: 'Spaced repetition মানে কী?'
    a: 'একই জিনিস এক দিনে দশবার নয় — কয়েক দিন পরপর অল্প অল্প করে ঝালাই।'
    more: |
      প্রায় ভুলে যাওয়ার মুহূর্তে ঝালাই করলে স্মৃতি সবচেয়ে বেশি শক্ত হয়। তাই আজ, কাল, তিন দিন পর, এক সপ্তাহ পর — এভাবে ফাঁক বাড়িয়ে ঝালাই করো। বুকমার্ক ঘরটা এই কাজের জন্যই।
    ref: learning-loop
  - q: 'শেখার চার ধাপ কী কী?'
    a: 'দেখো → মনে করো → যাচাই করো → ফিরে এসো।'
    more: |
      স্লাইডে দেখো, ফ্ল্যাশ কার্ডে মনে করো, কুইজে যাচাই করো, আর বুকমার্ক দিয়ে কয়েক দিন পর ফিরে এসো। বেশিরভাগ মানুষ শুধু প্রথম ধাপে থেমে যায়, তাই ভুলে যায়।
    ref: learning-loop
  - q: 'Dual coding কী?'
    a: 'একই আইডিয়া ছবি আর লেখা — দুইভাবে দেখা।'
    more: |
      মস্তিষ্ক ছবি আর শব্দ আলাদা পথে জমা রাখে। দুই পথেই জমা থাকলে একটা ভুলে গেলেও অন্যটা ধরে টেনে আনা যায়। এজন্য এখানে প্রায় প্রতিটা স্লাইডে একটা ছবি আছে।
    ref: learning-loop
  - q: 'নিজের জমানো স্লাইড ও কার্ড কোন ঘরে পাবে?'
    a: 'বুকমার্ক ঘরে — বিষয় অনুযায়ী সাজানো।'
    more: |
      বুকমার্ক ঘরে দুইটা ট্যাব: স্লাইড আর ফ্ল্যাশ কার্ড। বাম পাশে বিষয়ের নাম আর কয়টা জমানো আছে তা দেখায়। কাজের ফাঁকে পাঁচ মিনিট পেলে এখান থেকে ঝালাই করো।
    ref: four-rooms
  - q: 'সার্চ খোলার শর্টকাট কী?'
    a: 'Ctrl + K (ম্যাকে ⌘ + K), অথবা শুধু / চাপো।'
    more: |
      সার্চে বাংলা বা ইংরেজি — যেকোনো শব্দ লেখা যায়, যেমন "cache" বা "টাকা"। ফলাফল বিষয় ধরে সাজানো থাকে, আর প্রতিটার নিচে এক লাইনের সারকথা দেখায়, তাই না খুলেই বোঝা যায় কোনটা দরকার।
    ref: read-a-slide

quiz:
  - q: 'রাতুল একটা টিউটোরিয়াল তিনবার পড়েছে, তবু কাজের সময় মনে পড়ে না। সবচেয়ে কার্যকর পরিবর্তন কোনটা?'
    hint: 'কোন কাজে মস্তিষ্ককে সবচেয়ে বেশি খাটতে হয়?'
    options:
      - text: 'চতুর্থবার আরও মন দিয়ে পড়া'
        correct: false
        why: 'বারবার পড়লে চেনা চেনা লাগে, কিন্তু মস্তিষ্ককে খাটতে হয় না — তাই স্মৃতি পোক্ত হয় না।'
      - text: 'বই বন্ধ করে নিজে মনে করার চেষ্টা করা'
        correct: true
        why: 'মনে করার খাটুনিই (active recall) স্মৃতিকে শক্ত করে।'
      - text: 'পুরোটা খাতায় হুবহু টুকে রাখা'
        correct: false
        why: 'টোকা মানে আরেকবার পড়াই — নিজে থেকে মনে করা হচ্ছে না।'
      - text: 'আরও লম্বা টিউটোরিয়াল খোঁজা'
        correct: false
        why: 'সমস্যা তথ্যের অভাব নয়, ঝালাইয়ের অভাব।'
    ref: why-we-forget
  - q: 'নিচের কোনগুলো মনে রাখতে সত্যিই সাহায্য করে?'
    hint: 'একটা বাদে বাকি সবগুলোই কাজ করে। কোনটায় মস্তিষ্ক বিশ্রামের সুযোগ পায় না?'
    options:
      - text: 'কয়েক দিন পরপর ঝালাই করা'
        correct: true
        why: 'ফাঁক দিয়ে ঝালাই (spaced repetition) ভুলে যাওয়ার গতি কমিয়ে দেয়।'
      - text: 'উত্তর দেখার আগে নিজে ভাবা'
        correct: true
        why: 'এটাই active recall — শেখার সবচেয়ে শক্তিশালী কৌশল।'
      - text: 'এক রাতে পুরো বিষয় শেষ করা'
        correct: false
        why: 'এক বসায় ঠাসলে পরদিনই বেশিরভাগ উধাও হয়ে যায়; মস্তিষ্ক গোছানোর সময় পায় না।'
      - text: 'ছবি আর লেখা একসাথে দেখা'
        correct: true
        why: 'দুই পথে জমা হয় (dual coding), তাই মনে করার দুইটা সূত্র থাকে।'
    ref: learning-loop
  - q: 'কুইজে একটা প্রশ্ন ভুল হলো। এরপর সবচেয়ে ভালো কাজ কোনটা?'
    hint: 'ভুলটা কেন হলো তা না জানলে পরেরবারও একই ভুল হবে।'
    options:
      - text: 'ডান পাশের ব্যাখ্যা পড়ে সংশ্লিষ্ট স্লাইডটা দেখা'
        correct: true
        why: 'ভুলের ঠিক পরে পাওয়া ব্যাখ্যা সবচেয়ে ভালো মনে থাকে।'
      - text: 'তাড়াতাড়ি পরের প্রশ্নে চলে যাওয়া'
        correct: false
        why: 'কারণ না জেনে এগোলে ভুল ধারণাটাই মাথায় থেকে যায়।'
      - text: 'মন খারাপ করে কুইজ বন্ধ করে দেওয়া'
        correct: false
        why: 'ভুল হওয়াই তো কুইজের উদ্দেশ্য — কোথায় ফাঁক আছে তা ধরিয়ে দেওয়া।'
    ref: learning-loop
  - q: 'এক বসায় কতটুকু শেখা সবচেয়ে কার্যকর?'
    hint: 'ছোট টুকরো মনে রাখা সহজ।'
    options:
      - text: 'একটা sub-segment — ১০ থেকে ১৫ মিনিট'
        correct: true
        why: 'ছোট টুকরো মস্তিষ্ক সহজে গুছিয়ে রাখতে পারে, ক্লান্তিও আসে না।'
      - text: 'একটা পুরো বিষয়, শুরু থেকে শেষ'
        correct: false
        why: 'একসাথে এত তথ্য ঢুকলে নতুনগুলো পুরনোগুলোকে ঠেলে বের করে দেয়।'
      - text: 'যতক্ষণ না ঘুম পায়'
        correct: false
        why: 'ক্লান্ত মস্তিষ্ক কিছুই জমা রাখে না; শুধু সময় নষ্ট হয়।'
    ref: learning-loop
  - q: 'স্লাইডের নিচের “নিজেকে জিজ্ঞেস করো” অংশে উত্তরটা লুকানো থাকে কেন?'
    hint: 'উত্তর চোখের সামনে থাকলে তুমি কি নিজে ভাবতে?'
    options:
      - text: 'যাতে আগে নিজে মনে করার চেষ্টা করো'
        correct: true
        why: 'উত্তর দেখার আগে ভাবলেই active recall হয়; সামনে থাকলে চোখ সরাসরি উত্তরে চলে যেত।'
      - text: 'পাতায় জায়গা বাঁচানোর জন্য'
        correct: false
        why: 'জায়গার অভাব নেই — এটা শেখার কৌশল, নকশার সীমাবদ্ধতা নয়।'
      - text: 'উত্তরটা জরুরি নয় বলে'
        correct: false
        why: 'উল্টো — ওটাই স্লাইডের সবচেয়ে জরুরি অংশ, তাই তোমাকে দিয়েই বের করানো হয়।'
    ref: read-a-slide
