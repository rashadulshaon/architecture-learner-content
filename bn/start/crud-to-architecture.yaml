slides:
  - slug: tea-stall-to-restaurant
    title: 'চায়ের দোকান থেকে বড় রেস্টুরেন্ট'
    kind: story
    tldr: '১০ জন ব্যবহারকারীতে যে কোড দিব্যি চলে, ১০ হাজারে সেটাই ভাঙে — কোড ভুল বলে নয়, চাপ বদলেছে বলে।'
    keywords: ['scale', 'CRUD', 'production', 'স্কেল', 'কেন ভাঙে']
    blocks:
      - type: metaphor
        icon: shop
        title: 'মামার চায়ের দোকান'
        body: |
          মামা একাই চা বানান, টাকা নেন, বাকির হিসাব মাথায় রাখেন — দিনে ৫০ জন খদ্দেরে দিব্যি চলে। এখন দোকানটা ৫০০ সিটের রেস্টুরেন্ট হলে? এক মানুষ, এক চুলা আর মাথার হিসাব দিয়ে আর চলবে না। তোমার CRUD অ্যাপটাই সেই চায়ের দোকান।
      - type: visual
        kind: compare
        caption: 'একই অ্যাপ, দুই রকম চাপ'
        columns:
          - title: '১০ জন ব্যবহারকারী'
            tone: good
            icon: user
            tip: 'ছোট অবস্থায় প্রায় কোনো সমস্যাই চোখে পড়ে না — তাই মনে হয় কোড নিখুঁত।'
            items:
              - 'সবকিছু এক সার্ভারে, কোনো ঝামেলা নেই'
              - 'একই বাটনে দুজন একসাথে চাপে না'
              - 'সার্ভার একটু বন্ধ থাকলে কেউ টের পায় না'
              - 'ধীর query-ও চোখে পড়ে না'
          - title: '১০ হাজার ব্যবহারকারী'
            tone: bad
            icon: users
            tip: 'চাপ বাড়লে লুকিয়ে থাকা দুর্বলতাগুলো একসাথে বেরিয়ে আসে।'
            items:
              - 'এক সার্ভার আর টানতে পারে না'
              - 'একই সিট দুজনের কাছে বিক্রি হয়ে যায়'
              - '৫ মিনিট বন্ধ মানেই টাকার ক্ষতি'
              - 'একটা ধীর query পুরো সাইট আটকে দেয়'
      - type: quote
        body: 'কোড একই থাকে, বদলায় চাপ। আর চাপ বদলালে নিয়মও বদলায়।'
    aside:
      - type: story
        title: 'ঈদের রাতের ঘটনা'
        body: |
          ঈদের অফারের রাতে একটা ছোট ই-কমার্স সাইটে হঠাৎ দশ গুণ ক্রেতা এল। স্টকে ছিল ২০টা ফোন, অর্ডার পড়ল ৩৫টা। কোডে কোনো bug ছিল না — শুধু কেউ ভাবেনি, দুজন একই মুহূর্তে "কিনুন" চাপলে কী হবে।
      - type: refs
        items:
          - {to: 'concurrency/race-conditions', label: 'Race condition চেনা'}
    check:
      q: 'ছোট অ্যাপ বড় হলে ভাঙে কেন — কোড খারাপ বলে?'
      a: 'না। ব্যবহারকারী, ডেটা আর একসাথে আসা request বাড়লে এমন পরিস্থিতি তৈরি হয়, যা ছোট অবস্থায় কখনো ঘটেনি।'

  - slug: the-last-ticket
    title: 'শেষ টিকিটটা দুজনের কাছে বিক্রি'
    kind: pitfall
    tldr: '"আগে দেখি, তারপর বদলাই" ধরনের কোড একসাথে দুইটা request এলে ভুল করে — CRUD অ্যাপের সবচেয়ে পরিচিত ফাঁদ।'
    keywords: ['race condition', 'check then act', 'double booking', 'টিকিট', 'concurrency']
    blocks:
      - type: text
        body: |
          নিচের কোডটা দেখতে একদম নিরীহ: সিট খালি থাকলে বুক করো। একা একা টেস্ট করলে প্রতিবার ঠিক কাজ করে। কিন্তু রহিম আর করিম **একই মুহূর্তে** চাপলে দুজনেই "খালি" দেখে, দুজনেই বুক করে ফেলে।
      - type: code
        lang: php
        file: 'src/Controller/BookingController.php'
        variant: bad
        code: |
          #[Route('/seats/{id}/book', methods: ['POST'])]
          public function book(Seat $seat, EntityManagerInterface $em): JsonResponse
          {
              if ($seat->isBooked()) {            // ১. আগে দেখি
                  return $this->json(['error' => 'সিট নেই'], 409);
              }

              $seat->bookFor($this->getUser());   // ২. তারপর বদলাই
              $em->flush();

              return $this->json(['ok' => true]);
          }
        marks:
          - {line: 4, tip: 'দুইটা request-ই এখানে "খালি" দেখে — কারণ তখনো কেউ save করেনি।'}
          - {line: 8, tip: 'দেখা আর বদলানোর মাঝের ফাঁকটুকু দিয়েই বিপদ ঢোকে।'}
      - type: visual
        kind: sequence
        caption: 'এক সিট, দুই request — কে কখন কী দেখল'
        actors:
          - {id: rahim, label: 'রহিম', icon: user, tip: 'সিট ১২ বুক করতে চায়।'}
          - {id: db, label: 'ডেটাবেস', icon: db, tip: 'সিটের আসল অবস্থা এখানে জমা থাকে।'}
          - {id: karim, label: 'করিম', icon: user, tip: 'ঠিক একই মুহূর্তে একই সিট চায়।'}
        messages:
          - {from: rahim, to: db, label: 'সিট ১২ খালি?'}
          - {from: karim, to: db, label: 'সিট ১২ খালি?'}
          - {from: db, to: rahim, label: 'হ্যাঁ, খালি', dashed: true}
          - {from: db, to: karim, label: 'হ্যাঁ, খালি', dashed: true, tip: 'রহিম এখনো save করেনি, তাই করিমও খালি দেখছে।'}
          - {from: rahim, to: db, label: 'আমার নামে বুক করো'}
          - {from: karim, to: db, label: 'আমার নামে বুক করো', tone: bad, tip: 'ডেটাবেস আপত্তি করে না — সে শুধু শেষ লেখাটা রেখে দেয়।'}
          - {at: db, note: 'এক সিট, দুই মালিক', tone: bad, tip: 'দুজনের কাছেই "বুকিং সফল" বার্তা গেছে। স্টেশনে গিয়ে ঝগড়া।'}
    aside:
      - type: problem
        body: 'এই স্লাইড সমাধান দেয় না — শুধু ফাঁদটা চেনায়। সমাধান (lock, atomic update, unique constraint) আছে "ট্রানজ্যাকশন ও কনকারেন্সি" বিষয়ে।'
      - type: remember
        body: 'দেখা আর বদলানোর মাঝে ফাঁক থাকলে, সেই ফাঁকে অন্য কেউ ঢুকবেই।'
      - type: refs
        items:
          - {to: 'concurrency/atomic-operations', label: 'Atomic operation দিয়ে সমাধান'}
    check:
      q: 'কোডটা একা টেস্ট করলে ঠিক চলে, তবু প্রোডাকশনে ভুল করে কেন?'
      a: 'একা টেস্টে request আসে একটার পর একটা। প্রোডাকশনে দুইটা একসাথে আসে, আর দুটোই পুরনো অবস্থা দেখে সিদ্ধান্ত নেয়।'

  - slug: what-is-architecture
    title: 'তাহলে আর্কিটেকচার জিনিসটা কী?'
    kind: concept
    tldr: 'আর্কিটেকচার = সেই সিদ্ধান্তগুলো, যা পরে বদলাতে গেলে সবচেয়ে বেশি দাম দিতে হয়।'
    keywords: ['architecture', 'system design', 'আর্কিটেকচার', 'সিদ্ধান্ত', 'বদলানো কঠিন']
    blocks:
      - type: metaphor
        icon: home
        title: 'বাড়ির পিলার আর দেয়ালের রং'
        body: |
          দেয়ালের রং অপছন্দ হলে এক বিকেলে বদলে ফেলা যায়। কিন্তু পিলার ভুল জায়গায় বসলে পুরো বাড়ি ভাঙতে হয়। সফটওয়্যারেও কিছু সিদ্ধান্ত রঙের মতো, কিছু পিলারের মতো। পিলারগুলো চিনে আগে থেকে ভেবে বসানোই আর্কিটেকচার।
      - type: visual
        kind: layers
        caption: 'ওপরের স্তর সহজে বদলায়, নিচের স্তর বদলানো সবচেয়ে কঠিন'
        layers:
          - {label: 'রং ও আসবাব', sub: 'বাটনের রং, ভেরিয়েবলের নাম', tone: muted, tip: 'যখন খুশি বদলাও। এগুলো নিয়ে লম্বা মিটিং করা সময়ের অপচয়।'}
          - {label: 'ঘরের দেয়াল', sub: 'কোন library, কোডের ভাগ', tip: 'বদলানো যায়, তবে খাটুনি আছে — কয়েক দিন থেকে কয়েক সপ্তাহের কাজ।'}
          - {label: 'পিলার ও ভিত্তি', sub: 'ডেটা মডেল, সার্ভিসের সীমানা, API contract', tone: accent, tip: 'এগুলোর ওপর বাকি সব দাঁড়িয়ে। বদলাতে মাসের পর মাস লাগে, ঝুঁকিও বিশাল।'}
      - type: quote
        body: 'সব সিদ্ধান্ত সমান নয়। যেটা বদলানো কঠিন, সেটাতেই বেশি সময় দাও।'
    aside:
      - type: tips
        items:
          - 'নতুন সিদ্ধান্তের সামনে নিজেকে জিজ্ঞেস করো: "ছয় মাস পরে এটা বদলাতে কত দিন লাগবে?"'
          - 'উত্তর "এক বিকেল" হলে দ্রুত সিদ্ধান্ত নাও। "কয়েক মাস" হলে থামো, ভাবো, অন্যদের জিজ্ঞেস করো।'
      - type: refs
        items:
          - {to: 'thinking/what-is-architectural', label: 'কোন সিদ্ধান্তটা আর্কিটেকচারাল?'}
          - {to: 'thinking/reversible-decisions', label: 'ফেরার দরজা আছে, না নেই?'}
    check:
      q: 'ভেরিয়েবলের নাম আর ডেটাবেসের টেবিল ডিজাইন — কোনটা আর্কিটেকচারাল সিদ্ধান্ত, কেন?'
      a: 'টেবিল ডিজাইন। নাম এক মিনিটে বদলানো যায়, কিন্তু ডেটাভর্তি টেবিলের গঠন বদলাতে গেলে পুরো সিস্টেমে হাত দিতে হয়।'

  - slug: the-map
    title: 'পুরো কোর্সের মানচিত্র'
    kind: recap
    tldr: 'একটা request ব্যবহারকারী থেকে ডেটাবেস পর্যন্ত যে পথে যায়, কোর্সের প্রতিটা বিষয় সেই পথের একেকটা জায়গা নিয়ে।'
    keywords: ['roadmap', 'overview', 'মানচিত্র', 'কোর্সের তালিকা', 'কোথা থেকে শুরু']
    blocks:
      - type: text
        body: |
          ভয় পেয়ো না — সব একসাথে শিখতে হবে না। নিচের ছবিতে একটা সাধারণ সিস্টেম; প্রতিটা বাক্সে মাউস রাখলে দেখবে কোন বিষয়ে সেটা শেখানো হয়েছে। A থেকে U পর্যন্ত ক্রমে গেলেই চলবে, আর কাজের দরকারে যেকোনো বিষয়ে সরাসরি ঝাঁপ দিতে পারো।
      - type: visual
        kind: flow
        caption: 'একটা সাধারণ সিস্টেম — আর কোন অংশ কোন বিষয়ে'
        nodes:
          - {id: user, label: 'ব্যবহারকারী', sub: 'ব্রাউজার বা মোবাইল', icon: user, col: 0, row: 1, tip: 'সবকিছুর শুরু এখানে। Vue অ্যাপ কীভাবে API-র সাথে কথা বলবে — বিষয় B ও Q।'}
          - {id: api, label: 'API', sub: 'Symfony controller', icon: api, tone: accent, col: 1.5, row: 1, tip: 'request ঢোকার দরজা। API ডিজাইন (B) আর সিকিউরিটি (J) এখানে।'}
          - {id: cache, label: 'Cache', sub: 'জমিয়ে রাখা উত্তর', icon: cache, col: 3, row: 0, tip: 'একই উত্তর বারবার না বানিয়ে জমিয়ে রাখা — বিষয় D।'}
          - {id: db, label: 'ডেটাবেস', sub: 'আসল সত্য এখানে', icon: db, col: 3, row: 1, tip: 'ডেটা (C), ট্রানজ্যাকশন (F) আর টাকার হিসাব (K) — কোর্সের সবচেয়ে বড় অংশ।'}
          - {id: queue, label: 'Queue', sub: 'পরে করার কাজ', icon: queue, col: 3, row: 2, tip: 'ইমেইল, রিপোর্টের মতো ধীর কাজ জমা রাখার লাইন — বিষয় G ও L।'}
          - {id: worker, label: 'Worker', sub: 'পেছনের কর্মী', icon: worker, col: 4, row: 2, tip: 'queue থেকে কাজ তুলে পেছনে বসে সেরে ফেলে; ব্যবহারকারীকে অপেক্ষা করতে হয় না।'}
        edges:
          - {from: user, to: api, label: 'ব্যবহারকারী একটা request পাঠায়'}
          - {from: api, to: cache, label: 'আগে cache-এ খোঁজে — থাকলে সাথে সাথে উত্তর'}
          - {from: api, to: db, label: 'না থাকলে ডেটাবেস থেকে পড়ে বা লেখে'}
          - {from: api, to: queue, label: 'ধীর কাজগুলো queue-তে ফেলে রাখে'}
          - {from: queue, to: worker, label: 'worker পরে সেগুলো এক এক করে সারে'}
          - {from: api, to: user, label: 'ব্যবহারকারী দ্রুত উত্তর পেয়ে যায়', tone: good}
      - type: points
        title: 'কোন পথে এগোবে'
        style: number
        items:
          - 'প্রথমে A (ভাবনার ধরন) আর B (API) — ভিত্তি তৈরি হবে।'
          - 'তারপর C, D, F, G — রোজকার কাজে সবচেয়ে বেশি লাগে।'
          - 'বাকিগুলো যখন কাজে দরকার পড়বে, তখন।'
    aside:
      - type: remember
        body: 'প্রতিটা বাক্সের সামনে একই প্রশ্ন: "এটা ভাঙলে কী হবে?" পুরো কোর্স এই এক প্রশ্নের উত্তর।'
      - type: refs
        items:
          - {to: 'api/request-path', label: 'একটা request-এর পুরো যাত্রা'}
          - {to: 'thinking/what-is-architectural', label: 'আর্কিটেক্টের মতো ভাবা শুরু করো'}
    check:
      q: 'ইমেইল পাঠানোর মতো ধীর কাজ request-এর ভেতরে না করে কোথায় পাঠানো হয়?'
      a: 'Queue-তে। API সাথে সাথে উত্তর দিয়ে দেয়, আর worker পেছনে কাজটা সেরে ফেলে।'

flashcards:
  - q: 'আর্কিটেকচার এক লাইনে কী?'
    a: 'যে সিদ্ধান্তগুলো পরে বদলানো সবচেয়ে কঠিন ও ব্যয়বহুল।'
    more: |
      বাড়ির রং বদলানো সহজ, পিলার সরানো প্রায় অসম্ভব। সফটওয়্যারে ডেটা মডেল, সার্ভিসের সীমানা আর পাবলিক API হলো পিলার। এগুলো আগে থেকে ভেবে ঠিক করাই আর্কিটেক্টের কাজ।
    ref: what-is-architecture
  - q: 'ছোট অ্যাপ বড় হলে ভাঙার মূল কারণ কী?'
    a: 'কোড নয়, চাপ বদলায়: বেশি ব্যবহারকারী, বেশি ডেটা, একসাথে আসা request।'
    more: |
      ১০ জন ব্যবহারকারীতে দুজন কখনো একই মুহূর্তে একই বাটন চাপে না, তাই সমস্যাগুলো লুকিয়ে থাকে। ১০ হাজারে প্রতি সেকেন্ডে সেটাই ঘটে। তখন লুকানো দুর্বলতাগুলো একসাথে বেরিয়ে আসে।
    ref: tea-stall-to-restaurant
  - q: 'Check-then-act কী?'
    a: 'আগে অবস্থা দেখা, পরে আলাদা ধাপে বদলানো — মাঝের ফাঁকে অন্য request ঢুকে পড়তে পারে।'
    more: |
      যেমন: "সিট খালি? তাহলে বুক করো।" দেখা আর বদলানো আলাদা দুই ধাপ হওয়ায় দুইটা request-ই "খালি" দেখে ফেলতে পারে। সমাধান হলো দুই ধাপকে এক অবিভাজ্য ধাপে পরিণত করা। বিস্তারিত: [[concurrency/atomic-operations|atomic operation]]।
    ref: the-last-ticket
  - q: 'Race condition কখন ঘটে?'
    a: 'যখন একাধিক request একই ডেটা একসাথে পড়ে ও বদলায়, আর ফল নির্ভর করে কে আগে পৌঁছাল তার ওপর।'
    more: |
      একা টেস্ট করলে এটা কখনো ধরা পড়ে না, কারণ তখন request আসে একটার পর একটা। প্রোডাকশনে চাপ বাড়লেই এটা দেখা দেয়, আর ফল হয় দুইবার বিক্রি বা ভুল ব্যালেন্স।
    ref: the-last-ticket
  - q: 'ধীর কাজ (ইমেইল, রিপোর্ট) কোথায় সরানো হয়?'
    a: 'Queue-তে; worker পরে পেছনে বসে সেটা করে।'
    more: |
      ব্যবহারকারীকে ৪ সেকেন্ড বসিয়ে রেখে ইমেইল পাঠানোর দরকার নেই। API শুধু "কাজটা করতে হবে" লিখে queue-তে রাখে আর সাথে সাথে উত্তর দেয়। worker নিজের সময়ে কাজটা সারে।
    ref: the-map
  - q: 'বাটনের রং আর ডেটা মডেল — কোনটায় বেশি ভাবতে হবে?'
    a: 'ডেটা মডেলে। রং এক বিকেলে বদলায়, ডেটা মডেল বদলাতে মাস লাগে।'
    more: |
      সিদ্ধান্তে কতটা সময় দেবে তা ঠিক হয় একটাই প্রশ্নে: "পরে বদলাতে কত খরচ?" সস্তা সিদ্ধান্ত দ্রুত নাও, দামি সিদ্ধান্তে থামো। সব সিদ্ধান্তে সমান সময় দেওয়াই নতুনদের সবচেয়ে বড় ভুল।
    ref: what-is-architecture
  - q: 'Cache-এর কাজ কী?'
    a: 'একই উত্তর বারবার না বানিয়ে জমিয়ে রেখে দ্রুত দেওয়া।'
    more: |
      ডেটাবেস থেকে হিসাব করে আনা ধীর, মেমোরি থেকে তুলে দেওয়া অনেক দ্রুত। তাই যে উত্তর বারবার লাগে, সেটা cache-এ জমিয়ে রাখা হয়। তবে জমানো উত্তর কখন বাসি হলো, তা ঠিক করাই আসল কঠিন কাজ।
    ref: the-map

quiz:
  - q: 'নিচের কোডে সমস্যাটা কোথায়?'
    lang: php
    code: |
      $product = $products->find($id);

      if ($product->getStock() > 0) {
          $product->setStock($product->getStock() - 1);
          $em->flush();
      }
    hint: 'দুজন ক্রেতা একই মিলিসেকেন্ডে এই কোডে ঢুকলে প্রত্যেকে stock কত দেখবে?'
    options:
      - text: 'একসাথে দুইটা request এলে দুটোই stock > 0 দেখে, তাই বেশি বিক্রি হয়ে যায়'
        correct: true
        why: 'দেখা আর কমানো আলাদা ধাপ — মাঝের ফাঁকে দ্বিতীয় request পুরনো stock দেখে ফেলে।'
      - text: 'flush() দুইবার ডাকা দরকার ছিল'
        correct: false
        why: 'flush() যতবারই ডাকো, দুই request-এর একসাথে পুরনো মান পড়ার সমস্যা যায় না।'
      - text: 'find() ধীর, findOneBy() ব্যবহার করা উচিত'
        correct: false
        why: 'গতি এখানে সমস্যা নয়; সমস্যা হলো দুই ধাপের মাঝের ফাঁক।'
      - text: 'কোনো সমস্যা নেই — একা টেস্টে তো ঠিকই চলে'
        correct: false
        why: 'একা টেস্টে request আসে একটার পর একটা, তাই এই ফাঁদ কখনো ধরা পড়ে না।'
    ref: the-last-ticket
  - q: 'নিচের কোনগুলো আর্কিটেকচারাল সিদ্ধান্ত?'
    hint: 'কোনগুলো ছয় মাস পরে বদলাতে গেলে সপ্তাহ বা মাস লেগে যাবে?'
    options:
      - text: 'কোন ডেটাবেস ব্যবহার হবে'
        correct: true
        why: 'ডেটাভর্তি সিস্টেমে ডেটাবেস বদলানো বিশাল ও ঝুঁকিপূর্ণ কাজ।'
      - text: 'সার্ভিসগুলো কোথায় আলাদা হবে'
        correct: true
        why: 'সীমানা ভুল হলে পরে কোড, ডেটা আর টিম — তিনটাই নতুন করে ভাগ করতে হয়।'
      - text: 'একটা private method-এর নাম'
        correct: false
        why: 'এক মিনিটে বদলানো যায়, আর কারো কিছু ভাঙে না।'
      - text: 'পাবলিক API-র response-এর গঠন'
        correct: true
        why: 'মোবাইল অ্যাপ আর পার্টনাররা এর ওপর নির্ভর করে; বদলালে তাদের সবকিছু ভাঙে।'
    ref: what-is-architecture
  - q: 'একটা সিদ্ধান্তে কতটা সময় দেবে, তা ঠিক করার সবচেয়ে ভালো প্রশ্ন কোনটা?'
    hint: 'বাড়ির রং আর পিলারের পার্থক্যটা মনে করো।'
    options:
      - text: 'পরে এটা বদলাতে কত খরচ হবে?'
        correct: true
        why: 'বদলানোর খরচই বলে দেয় সিদ্ধান্তটা রং, নাকি পিলার।'
      - text: 'এটা কি সবচেয়ে নতুন প্রযুক্তি?'
        correct: false
        why: 'নতুন মানেই ভালো নয়; নতুন প্রযুক্তির অজানা সমস্যা বেশি থাকে।'
      - text: 'বড় কোম্পানিগুলো কী ব্যবহার করে?'
        correct: false
        why: 'তাদের সমস্যা আর তোমার সমস্যা এক নয়; তাদের সমাধান তোমার জন্য বাড়তি বোঝা হতে পারে।'
      - text: 'কোনটায় সবচেয়ে কম লাইন কোড লাগে?'
        correct: false
        why: 'কম লাইন মানেই সঠিক সিদ্ধান্ত নয়; দেখার বিষয় হলো পরিণতি।'
    ref: what-is-architecture
  - q: 'ঈদের রাতে ২০টা ফোনের জায়গায় ৩৫টা অর্ডার পড়ল। এটা কোন ধরনের সমস্যা?'
    hint: 'অনেকে একই মুহূর্তে "কিনুন" চেপেছিল।'
    options:
      - text: 'Race condition — একসাথে আসা request পুরনো stock দেখে সিদ্ধান্ত নিয়েছে'
        correct: true
        why: 'প্রত্যেক request দেখেছে stock আছে, তারপর আলাদাভাবে কমিয়েছে — তাই হিসাব মেলেনি।'
      - text: 'সার্ভারের RAM কম ছিল'
        correct: false
        why: 'RAM কম হলে সাইট ধীর বা বন্ধ হতো, ভুল সংখ্যায় বিক্রি হতো না।'
      - text: 'ডেটাবেস খুব ধীর ছিল'
        correct: false
        why: 'ধীর হলে অপেক্ষা বাড়ে; কিন্তু হিসাব ভুল হয় দুই ধাপের মাঝের ফাঁকের কারণে।'
      - text: 'Vue অ্যাপের বাটনে bug ছিল'
        correct: false
        why: 'আলাদা আলাদা ক্রেতা একবার করেই চেপেছে; সমস্যা সার্ভারের হিসাবে।'
    ref: tea-stall-to-restaurant
  - q: '"অর্ডার করুন" চাপার পর ইমেইল পাঠাতে ৪ সেকেন্ড লাগে, ব্যবহারকারী ততক্ষণ বসে থাকে। ভালো সমাধান কোনটা?'
    hint: 'ইমেইলটা কি এই মুহূর্তেই পৌঁছানো জরুরি?'
    options:
      - text: 'ইমেইলের কাজ queue-তে দিয়ে সাথে সাথে উত্তর ফেরত দেওয়া'
        correct: true
        why: 'অর্ডার সাথে সাথে নিশ্চিত হয়, আর worker পেছনে ইমেইল পাঠিয়ে দেয়।'
      - text: 'আরও শক্তিশালী সার্ভার কেনা'
        correct: false
        why: 'দেরিটা ইমেইল সার্ভিসের উত্তরের অপেক্ষায়; তোমার সার্ভার যত শক্তিশালীই হোক, তা কমবে না।'
      - text: 'ইমেইল পাঠানো বন্ধ করে দেওয়া'
        correct: false
        why: 'ক্রেতার ইমেইল দরকার; কাজটা বাদ নয়, শুধু পরে করতে হবে।'
      - text: 'একটা loading spinner দেখানো'
        correct: false
        why: 'spinner অপেক্ষাকে সুন্দর করে, কমায় না।'
    ref: the-map
