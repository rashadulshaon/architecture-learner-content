slides:
  - slug: works-on-my-machine
    title: 'আমার ল্যাপটপে তো চলে!'
    kind: story
    tldr: 'ল্যাপটপে একবার চলা আর প্রোডাকশনে খারাপ দিনেও হাজারবার ঠিক চলা — দুটো আলাদা মানের কোড।'
    keywords: ['production ready', 'works on my machine', 'happy path', 'প্রোডাকশন কোড', 'কুরিয়ার বুকিং']
    blocks:
      - type: text
        body: |
          রহিম কুরিয়ারে পার্সেল বুক করার একটা endpoint লিখল। ল্যাপটপে দশবার চালাল, দশবারই ঠিক। চিহ্নিত লাইনগুলোয় মাউস রাখলে দেখবে, প্রোডাকশনের খারাপ দিনে কোডটা কোথায় কোথায় ভাঙে।
      - type: code
        lang: php
        file: 'src/Controller/ShipmentController.php'
        variant: bad
        code: |
          #[Route('/api/shipments', methods: ['POST'])]
          public function create(Request $request, EntityManagerInterface $em): JsonResponse
          {
              $data = json_decode($request->getContent(), true);
              $order = $em->getRepository(Order::class)->find($data['orderId']);

              $json = file_get_contents(
                  'https://api.courier.example/v1/shipments?ref='.$order->getNumber()
              );
              $order->setTrackingCode(json_decode($json, true)['tracking']);
              $em->flush();

              return $this->json(['tracking' => $order->getTrackingCode()]);
          }
        marks:
          - {line: 4, tip: 'কোনো validation নেই। orderId না থাকলে বা JSON ভাঙা হলে ব্যবহারকারী পায় সরাসরি 500 error।'}
          - {line: 5, tip: 'অর্ডারটা কার, তা দেখা হয়নি — যে কেউ অন্যের অর্ডারে পার্সেল বুক করতে পারে। অর্ডার না পেলে null-এ method ডেকে crash।'}
          - {line: 7, tip: 'timeout নেই: কুরিয়ার ধীর হলে এই worker ৬০ সেকেন্ড পর্যন্ত আটকে থাকে। ব্যর্থ হলে false ফেরে, কোথাও কোনো log নেই।'}
          - {line: 10, tip: 'অধৈর্য ক্রেতা দুইবার চাপলে পুরো পথটা দুইবার চলে — একই অর্ডারে দুইটা পার্সেল।'}
      - type: points
        title: 'প্রথম সপ্তাহেই প্রোডাকশনে যা ঘটল'
        style: cross
        items:
          - 'কুরিয়ারের সার্ভার ধীর হলো; সব worker ঝুলে থেকে পুরো সাইট বন্ধ।'
          - 'জোড়া ক্লিকে একই অর্ডারে দুইটা পার্সেল, দুইবার খরচ।'
          - 'কোন অর্ডারে ভুল হলো, log দেখে কেউ বলতে পারল না।'
      - type: metaphor
        icon: fire
        title: 'ঘরের রান্না আর বিয়েবাড়ির রান্না'
        body: |
          বাসায় চারজনের বিরিয়ানিতে লবণ একটু কম হলে ক্ষতি নেই। বিয়েবাড়িতে ৫০০ অতিথির রান্নায় বাবুর্চিকে আগে ভাবতে হয় — গ্যাস ফুরালে কী হবে, মাংস দেরিতে এলে কী হবে, পরিবেশনের আগে কে চেখে দেখবে। রেসিপি একই, প্রস্তুতি আলাদা।
      - type: quote
        body: 'চলে মানেই তৈরি নয়। প্রোডাকশন-রেডি কোড খারাপ দিনেও জানে কী করতে হবে।'
    aside:
      - type: story
        title: 'কুরিয়ারের দোষে দোকান বন্ধ'
        body: |
          একটা অনলাইন দোকানে কুরিয়ার কোম্পানির সার্ভার এক সন্ধ্যায় ধীর হয়ে গেল। দোকানের কোডে timeout ছিল না, তাই প্রতিটা request ঝুলে থেকে সব PHP worker দখল করে ফেলল। সমস্যা কুরিয়ারের, অথচ দোকানে পণ্য দেখাও বন্ধ হয়ে গেল।
      - type: terms
        items:
          - {term: 'Happy path', meaning: 'যে পথে সব ঠিকঠাক: ইনপুট ঠিক, নেটওয়ার্ক ভালো, কেউ দুইবার চাপে না।'}
          - {term: 'Worker', meaning: 'সার্ভারের যে process একটা request সামলায়; সংখ্যায় সীমিত।'}
      - type: refs
        items:
          - {to: 'resilience/containing-failure', label: 'ভাঙন আটকে রাখা: timeout কেন'}
    check:
      q: 'রহিমের কোড ল্যাপটপে প্রতিবার চলেছে, তবু প্রোডাকশনে ভাঙল কেন?'
      a: 'ল্যাপটপে শুধু ভালো দিনের পথটা চলেছে। প্রোডাকশনে ধীর API, ভুল ইনপুট আর জোড়া ক্লিক আসে — কোডে সেগুলোর কোনো প্রস্তুতি ছিল না।'

  - slug: production-ready-means
    title: 'প্রোডাকশন-রেডি মানে সাত প্রশ্নের উত্তর'
    kind: concept
    tldr: 'প্রোডাকশন-রেডি কোড সাত প্রশ্নের জবাব দেয়: ভুল ইনপুট, ব্যর্থতা, পুনরাবৃত্তি, অনুমতি, নজর, ফেরার পথ আর প্রমাণ।'
    keywords: ['production readiness', 'definition of done', 'প্রোডাকশন রেডি', 'চেকলিস্ট', 'observability', 'rollback']
    blocks:
      - type: text
        body: |
          বিয়েবাড়ির বাবুর্চি চুলা ধরানোর আগে নিজেকে কিছু প্রশ্ন করে। কোডের বেলায় সেই প্রশ্ন সাতটা। প্রতিটার উত্তর কোডে **দেখানো** যেতে হবে — "মনে হয় ঠিক আছে" কোনো উত্তর নয়।
      - type: visual
        kind: table
        caption: 'সাত প্রশ্ন: বাবুর্চির প্রস্তুতি আর কোডে তার রূপ'
        headers: ['প্রশ্ন', 'বাবুর্চির প্রস্তুতি', 'কোডে যা থাকে']
        rows:
          - cells: ['ভুল ইনপুট এলে?', 'পচা মাংস দরজা থেকেই ফেরত', 'টাইপ করা DTO, Validator, 422 উত্তর']
            tip: 'বাইরে থেকে আসা সবকিছু সন্দেহের চোখে দেখুন। ভুল ইনপুট দরজাতেই আটকান, যাতে ভেতরের কোড পর্যন্ত না পৌঁছায়।'
          - cells: ['বাইরের কিছু ভাঙলে?', 'গ্যাস ফুরালে বাড়তি সিলিন্ডার', 'timeout, exception ধরা, পরিষ্কার error']
            tip: 'অন্য সার্ভিস ধীর বা বন্ধ হবেই। তখন আপনার কোড যেন অনন্তকাল অপেক্ষা না করে, আর ব্যবহারকারীকে বোধগম্য উত্তর দেয়।'
          - cells: ['একই কাজ দুইবার এলে?', 'এক অতিথিকে দুইবার রোস্ট নয়', 'idempotency key, unique constraint']
            tip: 'জোড়া ক্লিক, retry আর নেটওয়ার্কের গোলমালে একই request বারবার আসে। ফল যেন একবারের মতোই থাকে।'
          - cells: ['এ কাজের অনুমতি আছে?', 'অচেনা লোক রান্নাঘরে ঢোকে না', '#[IsGranted], voter-এ মালিকানা যাচাই']
            tip: 'শুধু login করা যথেষ্ট নয় — এই ব্যবহারকারী ঠিক এই অর্ডারটা ছুঁতে পারে কি না, সেটাও দেখতে হয়।'
          - cells: ['ভুল হলে জানব কী করে?', 'কোন ডেকচিতে কী গেল, লেখা', 'order_id-সহ log, metric, alert']
            tip: 'প্রোডাকশনে আপনি পর্দার সামনে বসে নেই। log আর metric-ই আপনার চোখ; প্রসঙ্গ (কোন অর্ডার, কোন ব্যবহারকারী) ছাড়া log অন্ধ।'
          - cells: ['খারাপ হলে ফিরব কী করে?', 'পদ নষ্ট হলে বিকল্প তৈরি', 'feature flag, উল্টানো যায় এমন migration']
            tip: 'নতুন কোড চালু করার আগে জানুন সেটা কত দ্রুত বন্ধ করা যাবে। এক সুইচে বন্ধ করা গেলে ভুলের দাম অনেক কমে।'
          - cells: ['প্রমাণ কী যে চলে?', 'পরিবেশনের আগে চেখে দেখা', 'খারাপ পথেরও automated test']
            tip: 'আগের ছয় প্রশ্নের উত্তর মুখের কথা নয় — প্রতিটার জন্য একটা টেস্ট থাকলে তবেই সেটা প্রমাণ।'
      - type: quote
        body: 'প্রোডাকশন-রেডি মানে খারাপ দিনের পথগুলোও লেখা, টেস্ট করা আর বাইরে থেকে দেখা যায়।'
    aside:
      - type: remember
        body: 'ইনপুট, ব্যর্থতা, পুনরাবৃত্তি, অনুমতি, নজর, ফেরা, প্রমাণ — সাতটায় টিক না পড়লে কাজ "done" নয়।'
      - type: terms
        items:
          - {term: 'Idempotent', meaning: 'একই কাজ একবার করলে যা ফল, দশবার করলেও তা-ই।'}
          - {term: 'Observability', meaning: 'বাইরে থেকে log আর metric দেখে ভেতরে কী ঘটছে তা বুঝতে পারা।'}
          - {term: 'Rollback', meaning: 'নতুন পরিবর্তন তুলে আগের ভালো অবস্থায় ফিরে যাওয়া।'}
      - type: refs
        items:
          - {to: 'payments/idempotency-keys', label: 'Idempotency key বিস্তারিত'}
          - {to: 'observability/logging-tracing', label: 'কাজের log কীভাবে লেখে'}
    check:
      q: 'একটা নতুন endpoint প্রোডাকশন-রেডি কি না বুঝতে কোন কোন প্রশ্ন করবেন?'
      a: 'ভুল ইনপুটে কী হয়, বাইরের সার্ভিস ভাঙলে কী হয়, দুইবার এলে কী হয়, অনুমতি যাচাই হয় কি না, ভুল log-এ ধরা পড়ে কি না, ফেরানো যায় কি না — আর এসবের টেস্ট আছে কি না।'

  - slug: from-works-to-ready
    title: '"চলে" থেকে "তৈরি": একই endpoint নতুন করে'
    kind: howto
    tldr: 'একই কুরিয়ার বুকিং, এবার দরজায় validation ও অনুমতি, ভেতরে timeout, idempotency key আর প্রসঙ্গসহ log।'
    keywords: ['MapRequestPayload', 'HttpClient timeout', 'IsGranted', 'voter', 'idempotency key', 'logger context', 'প্রোডাকশন কোড উদাহরণ']
    blocks:
      - type: text
        body: |
          রহিমের endpoint এবার দুই ভাগে। Controller শুধু দরজার কাজ করে: ইনপুট আর অনুমতি যাচাই। আসল কাজটা একটা service-এ, যেখানে ব্যর্থতা আর পুনরাবৃত্তির প্রস্তুতি আছে।
      - type: code
        lang: php
        file: 'src/Controller/ShipmentController.php'
        variant: good
        code: |
          #[Route('/api/shipments', methods: ['POST'])]
          #[IsGranted('ROLE_MERCHANT')]
          public function create(
              #[MapRequestPayload] CreateShipment $input,
              OrderRepository $orders,
              ShipmentBooker $booker,
          ): JsonResponse {
              $order = $orders->find($input->orderId)
                  ?? throw $this->createNotFoundException('Order not found');

              $this->denyAccessUnlessGranted('SHIP', $order);

              return $this->json(['tracking' => $booker->book($order)]);
          }
        marks:
          - {line: 4, tip: 'CreateShipment একটা readonly DTO, যার orderId-তে #[Assert\Positive] আছে। ভুল বা অনুপস্থিত ইনপুটে Symfony নিজেই 422 ফেরত দেয়।'}
          - {line: 9, tip: 'অর্ডার না পেলে crash নয় — পরিষ্কার 404।'}
          - {line: 11, tip: 'OrderVoter দেখে অর্ডারটা এই merchant-এরই কি না। না হলে 403; অন্যের অর্ডার ছোঁয়া যায় না।'}
      - type: code
        lang: php
        file: 'src/Shipping/ShipmentBooker.php'
        variant: good
        code: |
          final readonly class ShipmentBooker
          {
              public function __construct(
                  private HttpClientInterface $courierClient,
                  private EntityManagerInterface $em,
                  private LoggerInterface $logger,
              ) {
              }

              public function book(Order $order): string
              {
                  if (null !== $order->getTrackingCode()) {
                      return $order->getTrackingCode();   // আগেই বুক হয়েছে — আবার নয়
                  }

                  try {
                      $tracking = $this->courierClient->request('POST', '/v1/shipments', [
                          'headers' => ['Idempotency-Key' => 'order-'.$order->getId()],
                          'json' => ['reference' => $order->getNumber()],
                          'timeout' => 3,
                          'max_duration' => 8,
                      ])->toArray()['tracking'];
                  } catch (ExceptionInterface $e) {
                      $this->logger->error('Courier booking failed', [
                          'order_id' => $order->getId(), 'exception' => $e,
                      ]);

                      throw new CourierUnavailableException(previous: $e);
                  }

                  $order->setTrackingCode($tracking);
                  $this->em->flush();

                  return $tracking;
              }
          }
        marks:
          - {line: 12, tip: 'একই অর্ডারে দ্বিতীয়বার এলে নতুন পার্সেল নয় — আগের tracking code-ই ফেরত যায়।'}
          - {line: 18, tip: 'দুইটা request একদম একসাথে ঢুকলেও কুরিয়ার একই key দেখে একটাই পার্সেল বানায় (কুরিয়ারের API idempotency key মানলে)।'}
          - {line: 20, tip: 'timeout: ৩ সেকেন্ড কোনো সাড়া না এলে ছেড়ে দিন। max_duration: পুরো call মিলিয়ে সর্বোচ্চ ৮ সেকেন্ড।'}
          - {line: 24, tip: 'order_id-সহ log — পরে ঠিক এই অর্ডারের ঘটনাটা খুঁজে বের করা যাবে।'}
          - {line: 28, tip: 'নিজের ভাষার exception; একটা listener এটাকে 503 আর "একটু পরে চেষ্টা করুন" বার্তায় বদলায়। ক্রেতা stack trace দেখে না।'}
      - type: quote
        body: 'বাইরের প্রতিটা call-এ timeout, প্রতিটা write-এ "দুইবার এলে কী হবে" — এ দুটোর উত্তর ছাড়া কোড merge হয় না।'
    aside:
      - type: tips
        items:
          - '`framework.http_client.scoped_clients`-এ `courier.client` নামে client বানালে সেটা `HttpClientInterface $courierClient` নামে autowire হয়।'
          - 'timeout মানে "হয়নি" নয়, মানে "জানি না"। তাই পরের চেষ্টায় একই idempotency key পাঠান।'
          - 'ধীর কুরিয়ারের জন্য ক্রেতাকে বসিয়ে রাখতে না চাইলে কাজটা Messenger দিয়ে queue-তে পাঠান।'
      - type: commands
        title: 'merge-এর আগে নিজে চালান'
        items:
          - {cmd: 'php bin/phpunit', desc: 'খারাপ পথের টেস্টসহ সব টেস্ট'}
          - {cmd: 'vendor/bin/phpstan analyse', desc: 'null আর টাইপের ভুল আগেই ধরা'}
          - {cmd: 'php bin/console lint:container', desc: 'service wiring ঠিক আছে কি না'}
      - type: refs
        items:
          - {to: 'payments/unknown-outcomes', label: '"হলো কি না জানি না" সামলানো'}
    check:
      q: 'নতুন কোডে জোড়া ক্লিকের বিরুদ্ধে কোন দুইটা সুরক্ষা আছে?'
      a: 'এক: tracking code আগে থেকে থাকলে সেটাই ফেরত দেয়। দুই: কুরিয়ারকে অর্ডার-ভিত্তিক একই Idempotency-Key পাঠায়, তাই একসাথে আসা দুই request-এও একটাই পার্সেল হয়।'

  - slug: review-checklist
    title: 'Code review: কোন ক্রমে কী দেখবেন'
    kind: howto
    tldr: 'রিভিউ বানান ধরা নয়: আগে উদ্দেশ্য ও নকশা, তারপর ব্যর্থতার পথ, নিরাপত্তা, টেস্ট — সবশেষে নাম আর স্টাইল।'
    keywords: ['code review', 'pull request', 'review checklist', 'কোড রিভিউ', 'চেকলিস্ট', 'LGTM', 'PR size']
    blocks:
      - type: metaphor
        icon: check
        title: 'পরিবেশনের আগে চেখে দেখা'
        body: |
          বিয়েবাড়িতে খাবার টেবিলে যাওয়ার আগে আরেকজন বাবুর্চি চেখে দেখে। সে আগে প্লেটের সাজ দেখে না — দেখে মাংস সেদ্ধ হয়েছে কি না, লবণ ঠিক আছে কি না। Code review-ও তাই: যে ভুলে অতিথি অসুস্থ হবে, সেটা আগে; সাজসজ্জা সবার শেষে।
      - type: visual
        kind: steps
        caption: 'রিভিউয়ের ছয় ধাপ — দামি ভুল থেকে সস্তা ভুলের দিকে'
        steps:
          - {title: '১. উদ্দেশ্য', body: 'PR-এর বর্ণনা পড়ুন: কোন সমস্যা, কেন এই সমাধান?', tip: 'কোড খোলার আগে জানুন এটার কী করার কথা। উদ্দেশ্য না জানলে "ঠিক আছে কি না" বিচার করা যায় না।'}
          - {title: '২. নকশা', body: 'logic কি ঠিক জায়গায়? নতুন টেবিল বা নির্ভরতা কি সত্যিই দরকার?', tone: accent, tip: 'সবচেয়ে দামি ভুল এখানে। ভুল জায়গার logic বা ভুল ডেটা মডেল merge-এর পরে বদলানো কঠিন।'}
          - {title: '৩. সঠিকতা ও ব্যর্থতা', body: 'null, খালি তালিকা, জোড়া request, timeout, মাঝপথে ভাঙা — কী হয়?', tip: 'লেখক সাধারণত ভালো দিনের পথটাই ভেবেছে। রিভিউয়ারের কাজ খারাপ দিনের প্রশ্নগুলো তোলা।'}
          - {title: '৪. নিরাপত্তা ও ডেটা', body: 'অনুমতি যাচাই, ইনপুট validation, migration টেবিল lock করবে কি না।', tip: 'এই ভুলগুলো টেস্টে ধরা পড়ে না, কিন্তু প্রোডাকশনে সবচেয়ে বড় ক্ষতি করে।'}
          - {title: '৫. টেস্ট ও নজর', body: 'খারাপ পথের টেস্ট আছে? ভুল হলে log দেখে বোঝা যাবে?', tip: 'টেস্ট শুধু আছে কি না নয় — সেটা ভুল কোডে সত্যিই fail করত কি না, তা-ও দেখুন।'}
          - {title: '৬. পড়ার সুবিধা', body: 'নাম, function-এর আকার, বাড়তি জটিলতা। স্টাইল ধরবে linter।', tone: muted, tip: 'গুরুত্বপূর্ণ, কিন্তু সবার শেষে। ফাঁকা জায়গা আর বন্ধনীর তর্ক মানুষের নয়, যন্ত্রের কাজ।'}
      - type: code
        lang: text
        file: 'ভালো review comment-এর চার ধরন'
        variant: good
        code: |
          blocker: এই HTTP call-এ timeout নেই। কুরিয়ার ধীর হলে সব worker
                   আটকে যাবে। 'timeout' => 3 দিলে কেমন হয়?

          question: একই অর্ডারে দুইবার request এলে কি দুইটা পার্সেল বুক হবে?

          suggestion (না করলেও চলবে): এই ৪০ লাইন আলাদা private method
                   হলে পড়তে সহজ হতো।

          praise: ব্যর্থতার টেস্টটা দারুণ — ঠিক এই case-টাই খুঁজছিলাম।
        marks:
          - {line: 1, tip: 'blocker = এটা ঠিক না হলে merge নয়। সাথে কারণ আর একটা প্রস্তাব — শুধু "ভুল" বলা নয়।'}
          - {line: 4, tip: 'অভিযোগ নয়, প্রশ্ন। লেখক হয়তো ভেবেছে, হয়তো ভাবেনি — দুই ক্ষেত্রেই আলোচনা শুরু হয়।'}
          - {line: 6, tip: 'কোনটা বাধ্যতামূলক আর কোনটা শুধু মতামত — লেবেল দিলে লেখককে আন্দাজ করতে হয় না।'}
      - type: quote
        body: 'রিভিউতে বিচার হয় কোডের, মানুষের নয় — আর প্রতিটা আপত্তির সাথে কারণ থাকে।'
    aside:
      - type: pitfalls
        items:
          - 'কোড না ভেবেই "LGTM" লিখে approve করা।'
          - '১,৫০০ লাইনের PR: কেউ মন দিয়ে পড়ে না। ২০০–৪০০ লাইনের মধ্যে রাখুন।'
          - 'নাম আর ফাঁকা জায়গা নিয়ে ২০টা comment, অথচ হারানো timeout কারো চোখে পড়ল না।'
          - 'রিভিউ দুই দিন ফেলে রাখা — লেখক ততক্ষণে প্রসঙ্গ ভুলে গেছে।'
      - type: tips
        items:
          - 'স্টাইলের তর্ক যন্ত্রকে দিন: php-cs-fixer, PHPStan আর ESLint CI-তে চালান।'
          - 'নিজের PR আগে নিজে একবার রিভিউ করুন — অর্ধেক ভুল সেখানেই ধরা পড়ে।'
      - type: refs
        items:
          - {to: 'thinking/design-review', label: 'কোডের আগে ডিজাইন রিভিউ'}
    check:
      q: 'রিভিউতে নাম আর স্টাইলের আগে নকশা আর ব্যর্থতার পথ দেখা হয় কেন?'
      a: 'ওগুলো ভুল হলে প্রোডাকশনে ক্ষতি হয় আর পরে বদলানো দামি। স্টাইল যন্ত্র দিয়ে ধরা যায় এবং যেকোনো সময় সস্তায় ঠিক করা যায়।'

  - slug: second-ecosystem
    title: 'দ্বিতীয় ecosystem কেন শিখবেন'
    kind: compare
    tldr: 'একটাই ভাষা জানলে তার অভ্যাসকে নিয়ম ভাবেন। দ্বিতীয়টা শিখলে বোঝা যায় কোনটা সার্বজনীন নীতি আর কোনটা framework-এর রীতি।'
    keywords: ['second ecosystem', 'polyglot', 'PHP vs Node', 'event loop', 'shared nothing', 'দ্বিতীয় ভাষা', 'AbortSignal']
    blocks:
      - type: text
        body: |
          যে বাবুর্চি শুধু বিরিয়ানি রেঁধেছে, সে ভাবে রান্না মানেই দম দেওয়া। চাইনিজ রান্নাঘরে এক মাস কাজ করলে সে শেখে — সব উপকরণ আগে কেটে সাজিয়ে রাখা যায়, আর সেই অভ্যাস বিরিয়ানিতেও কাজে লাগে। PHP-র পাশে Node.js (বা Go, Java) শিখলেও তা-ই হয়: নীতি একই থাকে, বদলায় চেহারা আর ফাঁদ।
      - type: visual
        kind: table
        caption: 'একই প্রশ্ন, দুই ecosystem-এ দুই রকম উত্তর'
        headers: ['বিষয়', 'PHP + Symfony', 'Node.js + TypeScript']
        rows:
          - cells: ['প্রতিটা request', 'নতুন করে শুরু, শেষে সব মুছে যায়', 'একটাই process একটানা চলতে থাকে']
            tip: 'PHP-FPM-এ এক request-এর memory বা static ডেটা পরের request-এ যায় না। Node-এ process বেঁচে থাকে, তাই leak জমতে থাকে আর global ডেটা সবাই ভাগ করে।'
          - cells: ['একসাথে অনেক request', 'প্রতিটার জন্য আলাদা worker', 'এক thread-এর event loop পালা করে']
            tip: 'PHP-তে ধীর call একটা worker আটকায়; worker ফুরালে সাইট বন্ধ। Node-এ I/O-র অপেক্ষা কাউকে আটকায় না, কিন্তু ভারী CPU-র হিসাব পুরো event loop থামিয়ে দেয়।'
          - cells: ['বাইরের call-এ timeout', 'HttpClient-এর timeout option', 'fetch-এ AbortSignal.timeout()']
            tip: 'নীতি একই: কোনো network call অনির্দিষ্টকাল অপেক্ষা করবে না। বদলেছে শুধু লেখার ধরন।'
          - cells: ['ভুল ধরা', 'exception, try/catch', 'rejected Promise, await + try/catch']
            tip: 'Node-এ await ছাড়া ফেলে রাখা Promise-এর ভুল catch-এ ধরা পড়ে না। PHP ডেভেলপারের কাছে এটা একদম নতুন ধরনের ফাঁদ।'
          - cells: ['নির্ভরতা', 'Composer, composer.lock', 'npm, package-lock.json']
            tip: 'দুই জায়গাতেই lock file commit করতে হয়, যাতে সবার মেশিনে আর প্রোডাকশনে হুবহু একই সংস্করণ বসে।'
      - type: code
        lang: ts
        file: 'src/shipping/bookShipment.ts'
        variant: good
        code: |
          async function bookShipment(order: Order): Promise<string> {
            if (order.trackingCode) return order.trackingCode // already booked: don't book again

            try {
              const response = await fetch(`${COURIER_URL}/v1/shipments`, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Idempotency-Key': `order-${order.id}`,
                },
                body: JSON.stringify({ reference: order.number }),
                signal: AbortSignal.timeout(3000),
              })
              if (!response.ok) throw new Error(`Courier answered ${response.status}`)

              const { tracking } = (await response.json()) as { tracking: string }
              return tracking
            } catch (error) {
              logger.error({ orderId: order.id, err: error }, 'Courier booking failed')
              throw new CourierUnavailableError({ cause: error })
            }
          }
        marks:
          - {line: 9, tip: 'একই idempotency key — ভাষা বদলেছে, নীতি বদলায়নি।'}
          - {line: 12, tip: '৩ সেকেন্ডে সাড়া না এলে fetch নিজেই বাতিল হয়ে TimeoutError ছোড়ে। Symfony-র timeout option-এর জায়গায় এখানে এটা।'}
          - {line: 14, tip: 'PHP-র toArray()-র মতো নয়: fetch ৫০০ বা ৪০৪ পেলেও exception ছোড়ে না। এই check না থাকলে error পেজকেই booking ভেবে পড়া হতো।'}
          - {line: 18, tip: 'একটাই catch ধরে timeout, কেটে যাওয়া সংযোগ, খারাপ status আর ভাঙা JSON। প্রসঙ্গসহ log লেখে (Monolog-এর context array-র মতো) এবং PHP সংস্করণের মতোই নিজের error ছোড়ে।'}
      - type: points
        title: 'দ্বিতীয় ecosystem যা দেয়'
        style: check
        items:
          - 'নীতি আর রীতি আলাদা করতে পারেন: timeout নীতি, `HttpClient` রীতি।'
          - 'mobile, frontend বা data টিমের কোড রিভিউ করতে আর তাদের ভাষায় কথা বলতে পারেন।'
          - 'কোন কাজে কোন যন্ত্র মানায়, তা নিজের অভিজ্ঞতা থেকে বলতে পারেন — শোনা কথায় নয়।'
    aside:
      - type: when
        use:
          - 'প্রথম ecosystem-এ প্রোডাকশনে কোড চালানোর অভিজ্ঞতা হয়ে গেছে।'
          - 'টিমে অন্য ভাষার সার্ভিস আছে, যার সাথে আপনার কোড কথা বলে।'
        avoid:
          - 'প্রথমটাই এখনো নড়বড়ে — তখন দ্বিতীয়টা শুধু বিভ্রান্তি বাড়ায়।'
          - 'শুধু syntax শিখে থামা: ছোট একটা সার্ভিস deploy না করলে শেখা হয় না।'
      - type: remember
        body: 'একটা ভাষা জানলে আপনি তার ভেতর থেকে দেখেন; দুইটা জানলে ওপর থেকে।'
    check:
      q: 'PHP থেকে Node.js-এ গেলে কোন নীতি একই থাকে, আর কী নতুন করে ভাবতে হয়?'
      a: 'timeout, idempotency, validation, log — নীতি একই। নতুন করে ভাবতে হয় process মডেল: Node-এ process বেঁচে থাকে, তাই memory leak, ভাগ করা state আর event loop আটকে যাওয়া নতুন ঝুঁকি।'

flashcards:
  - q: '"চলে" এমন কোড আর প্রোডাকশন-রেডি কোডের পার্থক্য কী?'
    a: 'প্রোডাকশন-রেডি কোড খারাপ দিনের পথও সামলায়: ভুল ইনপুট, ধীর বা বন্ধ সার্ভিস, জোড়া request — আর ভুল হলে তা log-এ ধরা পড়ে।'
    more: |
      ল্যাপটপে আমরা শুধু happy path চালাই: ইনপুট ঠিক, নেটওয়ার্ক ভালো, একজনই ব্যবহারকারী। প্রোডাকশনে বাকি সব পথও ঘটে, এবং প্রতিদিন ঘটে। তাই "done" বলার আগে সাত প্রশ্ন: ইনপুট, ব্যর্থতা, পুনরাবৃত্তি, অনুমতি, নজর, ফেরার পথ, প্রমাণ।
    ref: production-ready-means
  - q: 'বাইরের সার্ভিসে HTTP call করলে কোন জিনিসটা কখনো বাদ দেওয়া যাবে না?'
    a: 'timeout। না থাকলে একটা ধীর সার্ভিস আপনার সব worker আটকে রেখে পুরো সাইট নামিয়ে দেয়।'
    more: |
      PHP-তে আলাদা করে না বললে একটা call ৬০ সেকেন্ড পর্যন্ত অপেক্ষা করতে পারে। ততক্ষণ ওই worker আর কোনো request নিতে পারে না। কয়েক ডজন request এভাবে ঝুললেই সব worker শেষ, আর সাইটের সম্পর্কহীন পাতাগুলোও বন্ধ হয়ে যায়। বিস্তারিত: [[resilience/containing-failure|ভাঙন আটকে রাখা]]।
    ref: from-works-to-ready
  - q: 'Symfony HttpClient-এ timeout আর max_duration-এর পার্থক্য কী?'
    a: 'timeout = কোনো ডেটা না এসে কতক্ষণ চুপ থাকা চলবে। max_duration = পুরো request আর response মিলিয়ে সর্বোচ্চ কত সময়।'
    more: |
      শুধু timeout দিলে একটা সার্ভার প্রতি ২ সেকেন্ডে এক ফোঁটা করে ডেটা পাঠিয়ে আপনাকে মিনিটের পর মিনিট আটকে রাখতে পারে, কারণ সে কখনো পুরোপুরি চুপ হচ্ছে না। max_duration সেই ফাঁক বন্ধ করে। গুরুত্বপূর্ণ call-এ দুটোই দিন।
    ref: from-works-to-ready
  - q: 'timeout হলে কি ধরে নেওয়া যায় কাজটা হয়নি?'
    a: 'না। timeout মানে "জানি না" — কাজটা ওপাশে হয়ে থাকতে পারে। তাই একই idempotency key দিয়ে আবার চেষ্টা করতে হয়।'
    more: |
      আপনার request হয়তো পৌঁছেছে, কাজও হয়েছে, শুধু উত্তরটা ফেরার পথে দেরি করেছে। তখন নতুন key দিয়ে আবার পাঠালে একই কাজ দুইবার হয় — দুইটা পার্সেল, দুইবার টাকা কাটা। একই key পাঠালে ওপাশ বুঝতে পারে এটা পুরনো request-এরই পুনরাবৃত্তি।
    ref: from-works-to-ready
  - q: 'Symfony-র #[MapRequestPayload] কী করে দেয়?'
    a: 'request-এর JSON-কে টাইপ করা DTO-তে বদলায় আর Validator চালায়; ভুল হলে নিজে থেকেই 422 উত্তর দেয়।'
    more: |
      হাতে `json_decode()` করলে প্রতিটা field আছে কি না, টাইপ ঠিক কি না — সব নিজে দেখতে হয়, আর একটা ভুলে গেলেই 500 error। DTO-র property-তে `#[Assert\...]` লিখে দিলে নিয়মগুলো এক জায়গায় থাকে, আর controller-এ শুধু বৈধ ডেটাই ঢোকে।
    ref: from-works-to-ready
  - q: 'Code review-এ কোন ক্রমে দেখা উচিত?'
    a: 'উদ্দেশ্য → নকশা → সঠিকতা ও ব্যর্থতার পথ → নিরাপত্তা ও ডেটা → টেস্ট ও log → সবশেষে নাম ও স্টাইল।'
    more: |
      ক্রমটা দামি ভুল থেকে সস্তা ভুলের দিকে। ভুল নকশা বা হারানো অনুমতি-যাচাই প্রোডাকশনে বড় ক্ষতি করে আর পরে বদলানো কঠিন। নাম বা স্টাইল যেকোনো দিন পাঁচ মিনিটে ঠিক করা যায়, আর তার বেশিরভাগ linter নিজেই ধরে।
    ref: review-checklist
  - q: 'একটা pull request কত বড় হলে রিভিউয়ের মান পড়ে যায়?'
    a: 'মোটামুটি ২০০–৪০০ লাইনের বেশি হলে। বড় কাজ ছোট ছোট স্বতন্ত্র PR-এ ভাগ করুন।'
    more: |
      বড় PR-এ রিভিউয়ার ক্লান্ত হয়ে চোখ বুলিয়ে approve করে দেয়, তাই আসল ভুলগুলো পার পেয়ে যায়। ছোট PR দ্রুত রিভিউ হয়, দ্রুত merge হয়, আর কোনো সমস্যা হলে কোন পরিবর্তনে হলো তা খুঁজে পাওয়াও সহজ।
    ref: review-checklist
  - q: 'PHP-FPM আর Node.js-এর process মডেলে মূল পার্থক্য কী?'
    a: 'PHP প্রতিটা request নতুন করে শুরু করে, শেষে সব মুছে যায়। Node-এ একটাই process একটানা চলে, আর এক event loop সব request সামলায়।'
    more: |
      এজন্য PHP-তে static variable-এ কিছু রাখলে পরের request সেটা পায় না, memory leak-ও request শেষে মুছে যায়। Node-এ সেই একই অভ্যাসে ডেটা এক ব্যবহারকারী থেকে আরেকজনের কাছে চলে যেতে পারে, আর memory দিনের পর দিন বাড়তে থাকে।
    ref: second-ecosystem
  - q: 'দ্বিতীয় একটা ecosystem শেখার সবচেয়ে বড় লাভ কী?'
    a: 'কোনটা সার্বজনীন নীতি (timeout, idempotency, validation) আর কোনটা শুধু এক framework-এর রীতি — তা আলাদা করতে পারা।'
    more: |
      একটাই framework জানলে তার প্রতিটা অভ্যাসকে "এভাবেই করতে হয়" মনে হয়। দ্বিতীয়টায় একই সমস্যার অন্য সমাধান দেখলে বোঝা যায় আসল নীতিটা কী ছিল। তখন অন্য টিমের কোডও রিভিউ করা যায়, আর যন্ত্র বাছাইয়ের তর্কে অভিজ্ঞতা থেকে কথা বলা যায়।
    ref: second-ecosystem
  - q: 'Node-এ fetch() কি সার্ভার ৫০০ বা ৪০৪ দিলে error ছোড়ে?'
    a: 'না। fetch শুধু network ব্যর্থ হলে বা timeout হলে reject করে। ৫০০ বা ৪০৪ এলেও সে সফল ধরে, তাই `response.ok` নিজে দেখতে হয়।'
    more: |
      PHP-র `toArray()` খারাপ status পেলে exception ছোড়ে, তাই PHP ডেভেলপার ভুল exception হয়ে আসাতেই অভ্যস্ত। Node-এ `response.ok` না দেখলে error পেজকেই booking-এর উত্তর ভেবে পড়া হবে। তারপর পুরো call একটা try/catch-এ মুড়ে প্রসঙ্গসহ log লিখে নিজের error ছোড়ুন।
    ref: second-ecosystem

quiz:
  - q: 'নিচের method-এ প্রোডাকশনের জন্য কী কী ঘাটতি আছে?'
    lang: php
    code: |
      public function sendConfirmation(Order $order): void
      {
          $this->smsClient->request('POST', '/send', [
              'json' => [
                  'to' => $order->getPhone(),
                  'text' => 'আপনার অর্ডার নিশ্চিত হয়েছে',
              ],
          ]);
      }
    hint: 'SMS সার্ভিস ধীর হলে কী হবে? আর ব্যর্থ হলে আপনি জানবেন কীভাবে?'
    options:
      - text: 'timeout নেই — SMS সার্ভিস ধীর হলে request অনেকক্ষণ ঝুলে থাকবে'
        correct: true
        why: 'আলাদা করে না দিলে HttpClient PHP-র default_socket_timeout (সাধারণত ৬০ সেকেন্ড) পর্যন্ত অপেক্ষা করে, আর ততক্ষণ worker আটকে থাকে।'
      - text: 'ব্যর্থ হলে কোন অর্ডারের SMS গেল না, তা জানার মতো কোনো log নেই'
        correct: true
        why: 'exception ধরে order_id-সহ log না লিখলে পরে কেউ বলতে পারবে না কার SMS হারিয়েছে।'
      - text: 'POST-এর বদলে GET ব্যবহার করা উচিত ছিল'
        correct: false
        why: 'SMS পাঠানো একটা পরিবর্তন ঘটায়; GET শুধু পড়ার জন্য। POST-ই ঠিক।'
      - text: 'json option-এর বদলে হাতে json_encode() করা উচিত ছিল'
        correct: false
        why: 'json option নিজেই encode করে আর সঠিক Content-Type বসায় — এটাই প্রচলিত পথ।'
    ref: from-works-to-ready
  - q: 'কুরিয়ারের API-তে পার্সেল বুকের request পাঠানোর ৩ সেকেন্ড পর timeout হলো। কোডের এখন কী ধরে নেওয়া উচিত?'
    hint: 'request পৌঁছেছে কি না আর উত্তরটা পথে হারিয়েছে কি না — দুটো কি আপনি আলাদা করতে পারছেন?'
    options:
      - text: 'পার্সেল বুক হয়নি — নতুন key দিয়ে আবার পাঠান'
        correct: false
        why: 'বুক হয়ে থাকতে পারে, শুধু উত্তরটা ফেরেনি। নতুন key দিলে কুরিয়ার এটাকে নতুন পার্সেল ভাববে — দুইটা বুক হবে।'
      - text: 'ফল অজানা — একই idempotency key দিয়ে আবার চেষ্টা করুন'
        correct: true
        why: 'একই key দেখে কুরিয়ার বোঝে এটা আগের request-এরই পুনরাবৃত্তি, তাই যতবারই পাঠান পার্সেল একটাই হয়।'
      - text: 'পার্সেল বুক হয়ে গেছে — tracking code ছাড়াই এগিয়ে যান'
        correct: false
        why: 'হয়তো request পৌঁছায়ইনি। ধরে নিলে ক্রেতা এমন পার্সেলের অপেক্ষায় থাকবে যা কখনো বুকই হয়নি।'
      - text: 'ক্রেতাকে বলুন পুরো অর্ডারটা নতুন করে দিতে'
        correct: false
        why: 'সিস্টেমের অনিশ্চয়তা ক্রেতার ঘাড়ে চাপানো হলো, আর এতে জোড়া অর্ডারের ঝুঁকিও বাড়ে।'
    ref: from-works-to-ready
  - q: 'নিচের কোনগুলো একটা endpoint-কে প্রোডাকশন-রেডি করার অংশ?'
    hint: 'সাত প্রশ্ন মনে করুন। কোনটা কোনো প্রশ্নেরই উত্তর নয়?'
    options:
      - text: 'ভুল ইনপুটে 500 নয়, বোধগম্য 422 ফেরত দেওয়া'
        correct: true
        why: 'এটা "ভুল ইনপুট এলে?" প্রশ্নের উত্তর — ভুলটা দরজাতেই ধরা পড়ে।'
      - text: 'ব্যর্থ হলে order_id-সহ log লেখা'
        correct: true
        why: 'এটা "ভুল হলে জানব কী করে?" প্রশ্নের উত্তর; প্রসঙ্গ ছাড়া log দিয়ে কিছু খোঁজা যায় না।'
      - text: 'যত বেশি সম্ভব design pattern আর interface যোগ করা'
        correct: false
        why: 'pattern-এর সংখ্যা সাত প্রশ্নের কোনোটারই উত্তর নয়; অকারণ স্তর শুধু পড়া কঠিন করে।'
      - text: 'নতুন আচরণটা feature flag দিয়ে বন্ধ করার উপায় রাখা'
        correct: true
        why: 'এটা "খারাপ হলে ফিরব কী করে?" প্রশ্নের উত্তর — নতুন deploy ছাড়াই ভুল কোড থামানো যায়।'
    ref: production-ready-means
  - q: 'সুমির PR-এ ৩০টা comment এল — সবই নাম আর ফাঁকা জায়গা নিয়ে। merge-এর পর দেখা গেল অনুমতি যাচাই ছিল না, যে কেউ অন্যের অর্ডার বাতিল করতে পারত। প্রক্রিয়ায় কী বদলানো উচিত?'
    hint: 'রিভিউয়ারের মনোযোগ সীমিত। সেটা কোথায় খরচ হলো?'
    options:
      - text: 'প্রতিটা PR-এ আরও দুইজন রিভিউয়ার যোগ করা'
        correct: false
        why: 'সবাই একই ভুল ক্রমে দেখলে পাঁচজনও আগে চোখে পড়া স্টাইলেই আটকাবে; শুধু সময় বেশি লাগবে।'
      - text: 'স্টাইল linter-কে দিয়ে রিভিউয়ারকে নকশা, ব্যর্থতা, নিরাপত্তা — এই ক্রমে দেখতে বলা'
        correct: true
        why: 'যন্ত্র স্টাইল সামলালে মানুষের মনোযোগ দামি ভুলগুলোয় যায়, আর চেকলিস্টের ক্রম অনুমতি-যাচাইয়ের প্রশ্নটা আগে তোলে।'
