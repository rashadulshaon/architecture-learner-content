  - q: 'এক পাতার মানচিত্রে কোন কোন বিষয় রাখা উচিত?'
    hint: 'প্রবেশ থেকে ডেটা পর্যন্ত, আর যা জানেন না।'
    options:
      - text: 'প্রবেশ-পথ আর মূল service'
        correct: true
        why: 'কাজ কোথা দিয়ে ঢোকে আর আসল নিয়ম কোথায়, এটা কাঠামোর মূল।'
      - text: 'ডেটা কোথায় থাকে আর বাইরের নির্ভরতা'
        correct: true
        why: 'ব্যর্থতা সাধারণত ডেটা ও বাইরের সিস্টেমের সীমানায় ঘটে।'
      - text: 'প্রতিটা ফাইলের প্রতিটা method'
        correct: false
        why: 'এত বিস্তারিত মানচিত্র আর মানচিত্র থাকে না; ৩–৫টা মূল অংশই যথেষ্ট।'
      - text: 'যা এখনও বুঝিনি তার প্রশ্ন'
        correct: true
        why: 'প্রশ্নের তালিকা পরের অনুসন্ধান আর সহকর্মীকে জিজ্ঞেসের ভিত্তি।'
    ref: draw-the-map
