slides:
  - slug: lost-in-five-hundred-files
    title: 'প্রথম দিনে ৫০০ ফাইলের সামনে'
    kind: story
    tldr: 'অচেনা codebase ফাইলের পর ফাইল ধরে পড়লে হারিয়ে যাবে; একটা প্রবেশ-পথ ধরে একটা কাজ শেষ পর্যন্ত অনুসরণ করাই দ্রুত পথ।'
    keywords: ['legacy code', 'onboarding', 'codebase', 'unfamiliar code', 'নতুন প্রজেক্ট', 'কোড পড়া']
    blocks:
      - type: text
        body: |
          সুমি নতুন কোম্পানিতে যোগ দিল। প্রজেক্টে ৫০০টার বেশি PHP ফাইল, আর প্রথম কাজ: "পেমেন্ট ব্যর্থ হলে রিফান্ড ইমেইল যাচ্ছে না, দেখুন তো।" সে `src/`-এর প্রথম ফাইল থেকে বর্ণানুক্রমে পড়া শুরু করল। তিন ঘণ্টা পরে ২০টা ফাইল পড়া হলো, মাথা ভারী, আর রিফান্ডের কোড কোথায় সেটা এখনও জানে না।
      - type: visual
        kind: compare
        caption: 'সুমির প্রথম পথ বনাম অভিজ্ঞদের পথ'
        columns:
          - title: 'ফাইল ধরে ধরে পড়া'
            tone: bad
            icon: cross
            tip: 'কোড বর্ণানুক্রমে লেখা হয়নি; ফাইলের ক্রম আর কাজের ক্রম আলাদা।'
            items: ['বর্ণানুক্রমে, শুরু থেকে শেষ', 'সব বুঝে তারপর কাজ', 'তিন ঘণ্টায় ২০ ফাইল, জানা নেই কোথায়', 'ক্লান্ত, বিভ্রান্ত']
          - title: 'প্রবেশ-পথ ধরে একটা কাজ'
            tone: good
            icon: check
            tip: 'রিফান্ডের পথে যে ফাইলগুলো পড়ে, শুধু ততটুকুই পড়ুন।'
            items: ['প্রবেশ-পথ (route/command/handler) খুঁজুন', 'একটা request শেষ পর্যন্ত অনুসরণ', '১৫ মিনিটে ৫টা ফাইল, পথ পরিষ্কার', 'প্রশ্নের উত্তরের কাছাকাছি']
    aside:
      - type: problem
        body: 'কোডবেস বইয়ের মতো শুরু থেকে পড়ার জিনিস নয়, শহরের মতো পথ ধরে চেনার জিনিস। আগে প্রধান সড়ক, পরে গলি।'
    check:
      q: 'সুমির ফাইল-ধরে-পড়া পদ্ধতি কেন কাজ করেনি?'
      a: 'ফাইলের ক্রম আর কাজের পথ এক নয়। তিন ঘণ্টায় সে এমন ফাইল পড়েছে যেগুলো রিফান্ডের পথে নেই। প্রবেশ-পথ থেকে একটা কাজ অনুসরণ করলে শুধু দরকারি ফাইলই আসে।'

  - slug: entry-points-one-request
    title: 'প্রবেশ-পথ খুঁজুন, একটা বাস ধরে শেষ পর্যন্ত যান'
    kind: concept
    tldr: 'প্রবেশ-পথ: route, console command, message handler, event listener, scheduler; একটা প্রবেশ-পথ ধরে request শেষ পর্যন্ত অনুসরণ করলে পুরো কাঠামো বোঝা যায়।'
    keywords: ['entry points', 'follow a request', 'route', 'console command', 'message handler', 'trace', 'প্রবেশ-পথ']
    blocks:
      - type: metaphor
        icon: map
        title: 'অচেনা শহরে বাস-রুট'
        body: |
          ঢাকায় নতুন এসে গলি ধরে ঘুরলে হারাবেন। বরং **বড় সড়কগুলো** চিনে নিন (প্রবেশ-পথ), তারপর একটা বাসে উঠে মিরপুর থেকে মতিঝিল **শেষ পর্যন্ত** যান (একটা request অনুসরণ)। পথের প্রতিটা স্টপ হলো একটা ফাইল: router, controller, service, ডেটাবেস। একটা রুট জানলে শহরের কাঠামো বোঝা শুরু হয়।
      - type: visual
        kind: flow
        caption: 'একটা Symfony request যে স্টপগুলো পেরোয়'
        nodes:
          - {id: front, label: 'public/index.php', sub: 'প্রবেশ', icon: home, col: 0, row: 0, tip: 'ওয়েব request-এর একমাত্র প্রবেশ-দ্বার। এখান থেকে Kernel চালু হয়।'}
          - {id: router, label: 'Router', sub: 'URL → controller', icon: map, col: 1, row: 0, tip: 'URL দেখে ঠিক করে কোন controller চলবে। `debug:router` এই তালিকাই দেখায়।'}
          - {id: ctrl, label: 'Controller', sub: 'পাতলা', icon: code, col: 2, row: 0, tip: 'ব্যবহারকারীর অনুরোধ নিয়ে service-কে ডাকে। এখান থেকেই পড়া শুরু করুন।'}
          - {id: svc, label: 'Service', sub: 'আসল কাজ', icon: gear, tone: accent, col: 3, row: 0, tip: 'ব্যবসার নিয়ম এখানে। বেশিরভাগ প্রশ্নের উত্তর এখানে মিলবে।'}
          - {id: db, label: 'Doctrine / DB', sub: 'ডেটা', icon: db, col: 4, row: 0, tip: 'ডেটা পড়া ও লেখা। entity আর repository এখানে।'}
          - {id: resp, label: 'JSON response', sub: 'ফেরত', icon: send, tone: good, col: 3, row: 1.5, tip: 'ফলাফল JSON হয়ে ব্রাউজারে ফেরে।'}
        edges:
          - {from: front, to: router, label: 'request ঢুকে Router-এর কাছে যায়'}
          - {from: router, to: ctrl, label: 'URL মিলিয়ে controller বাছা হয়'}
          - {from: ctrl, to: svc, label: 'controller service-কে কাজ দেয়'}
          - {from: svc, to: db, label: 'service ডেটা পড়ে বা লেখে'}
          - {from: svc, to: resp, label: 'ফলাফল JSON হয়ে ফেরত যায়', dashed: true, tone: good}
      - type: points
        title: 'Symfony অ্যাপের প্রবেশ-পথগুলো'
        style: dot
        items: ['HTTP route — `#[Route]` দেওয়া controller', 'Console command — `#[AsCommand]`, cron থেকে ডাকা', 'Message handler — `#[AsMessageHandler]`, queue থেকে', 'Event listener — `#[AsEventListener]`, কিছু ঘটলে চলে', 'Scheduler — `#[AsSchedule]`, ঘড়ি-ধরা কাজ']
    aside:
      - type: tips
        items:
          - 'প্রশ্নটা হোক নির্দিষ্ট: "রিফান্ড ইমেইল কখন যায়?" তারপর ইমেইল পাঠানোর কোড থেকে উল্টো পথে (কে ডাকছে) উঠলেও চলে।'
          - 'প্রতি স্টপে একটা প্রশ্ন: এই ফাইল কী নেয়, কী ফেরত দেয়, আর কাকে ডাকে?'
    check:
      q: 'রিফান্ড ইমেইল না যাওয়ার কারণ খুঁজতে কোন দুইটা পথে শুরু করা যায়?'
      a: 'সামনে থেকে: রিফান্ডের route/command ধরে এগোনো। অথবা পেছন থেকে: ইমেইল পাঠানোর কোড খুঁজে দেখা কে ডাকে (handler বা listener)। দুই পথই একই পথের দুই প্রান্ত।'

  - slug: debug-commands
    title: 'Symfony নিজেই বলে দেয়: debug কমান্ড'
    kind: howto
    tldr: '`debug:router`, `debug:container`, `debug:autowiring`, `debug:event-dispatcher`, `debug:messenger` — কোড না পড়েই অ্যাপের কাঠামোর তালিকা পাওয়া যায়।'
    keywords: ['debug:router', 'debug:container', 'debug:autowiring', 'debug:event-dispatcher', 'debug:messenger', 'bin/console', 'service container']
    blocks:
      - type: text
        body: |
          অচেনা শহরে গুগল ম্যাপ থাকলে কেউ রাস্তা খোঁজে হাঁটাহাঁটি করে না। Symfony-র `debug:*` কমান্ডগুলো সেই ম্যাপ: কোন URL কোন controller-এ, কোন service কার ওপর নির্ভর করে, কোন event-এ কে শুনছে, কোন message-এর handler কে। আগে এগুলো চালান, তারপর কোড খুলুন।
      - type: visual
        kind: table
        caption: 'কোন প্রশ্নে কোন কমান্ড'
        headers: ['প্রশ্ন', 'কমান্ড']
        rows:
          - cells: ['এই URL কোন controller চালায়?', 'debug:router --show-controllers']
            tip: 'সব route-এর তালিকা, path, method আর controller-সহ। নির্দিষ্ট route-এ `debug:router app_refund` দিলে বিস্তারিত।'
          - cells: ['এই service কার কাছ থেকে কী পায়?', 'debug:container PaymentService']
            tip: 'service-এর class, তার কনফিগ, tag আর alias দেখায়।'
          - cells: ['কোন type inject করা যায়?', 'debug:autowiring Mailer']
            tip: 'নাম দিয়ে খুঁজলে autowire করার মতো interface/class-এর তালিকা মেলে।'
          - cells: ['এই event-এ কে শোনে?', 'debug:event-dispatcher kernel.request']
            tip: 'listener-গুলো priority ক্রমে। কোন কোড request-এর আগে-পরে চলে তা ধরা পড়ে।'
          - cells: ['এই message কে সামলায়?', 'debug:messenger']
            tip: 'প্রতিটা bus-এ কোন message-এর কোন handler আছে তার তালিকা।'
      - type: code
        lang: bash
        file: 'terminal'
        code: |
          php bin/console debug:router --show-controllers | grep -i refund
          php bin/console debug:container 'App\Service\RefundService'
          php bin/console debug:event-dispatcher App\Event\RefundIssued
          php bin/console debug:messenger
          php bin/console list app          # প্রজেক্টের নিজের console command
          php bin/console debug:config security access_control
        marks:
          - {line: 1, tip: 'grep দিয়ে শুধু রিফান্ড-সংক্রান্ত route ছেঁকে নিন। দেখে নিন কোন controller, কোন method।'}
          - {line: 3, tip: 'RefundIssued event ঘটলে কোন কোন listener চলে (ইমেইল পাঠানো সম্ভবত এখানেই)।'}
          - {line: 5, tip: 'cron বা background থেকে যেসব command ডাকা হয়, সেগুলো প্রবেশ-পথ।'}
      - type: code
        lang: text
        file: 'terminal output'
        code: |
          "App\Event\RefundIssued" event
          ------------------------------
           ------- ------------------------------------------------ ----------
            Order   Callable                                         Priority
           ------- ------------------------------------------------ ----------
            #1      App\Listener\SendRefundEmailListener::__invoke()   0
           ------- ------------------------------------------------ ----------
        marks:
          - {line: 6, tip: 'একটা listener-ই সুমির প্রশ্নের উত্তর দিল, কোড না পড়েই: রিফান্ডের ইমেইল যায় SendRefundEmailListener-এ। এবার শুধু ওই ফাইলটা খুলুন।'}
    aside:
      - type: commands
        items:
          - {cmd: 'php bin/console debug:scheduler', desc: 'ঘড়ি-ধরা (scheduled) কাজের তালিকা'}
          - {cmd: 'php bin/console debug:twig', desc: 'Twig function, filter আর template path'}
          - {cmd: 'php bin/console about', desc: 'Symfony/PHP সংস্করণ ও পরিবেশ'}
    check:
      q: 'রিফান্ড শেষ হলে কোন কোন listener চলে, কোড না পড়ে কীভাবে জানবেন?'
      a: '`php bin/console debug:event-dispatcher App\Event\RefundIssued` চালান। event-এর ওপর শুনছে এমন সব listener priority ক্রমে বেরিয়ে আসবে।'

  - slug: tests-and-history
    title: 'Test আর git history: কোডের লিখিত স্মৃতি'
    kind: howto
    tldr: 'Test পড়লে জানা যায় কোড কী করে বলে ধরা হয়; git blame ও log -S জানায় কেন এমন হলো এবং কে জানে — সাথে চালিয়ে দেখলেই নিশ্চিত।'
    keywords: ['git blame', 'git log -S', 'testdox', 'tests as documentation', 'git history', 'pickaxe', 'hot files']
    blocks:
      - type: text
        body: |
          কোড বলে *কী* হচ্ছে, কিন্তু *কেন* বলে না। সেই "কেন"-র উত্তর দুই জায়গায়: **test** (কোডটা কী আচরণ করবে বলে কথা) আর **git history** (কে, কখন, কোন কারণে বদলাল)। আর কোডের আচরণ নিয়ে সন্দেহ হলে সবচেয়ে সৎ উত্তর হলো সেটা চালিয়ে দেখা।
      - type: code
        lang: bash
        file: 'terminal'
        code: |
          # test পড়ে আচরণের তালিকা পান
          php bin/phpunit --testdox --filter RefundService

          # কোন ফাইল সবচেয়ে বেশি বদলায় (ঝুঁকি আর জটিলতার ইঙ্গিত)
          git log --since='6 months ago' --name-only --pretty=format: | sort | uniq -c | sort -rn | head

          # এই লাইনটা কে, কেন লিখেছিল
          git blame -L 40,60 src/Service/RefundService.php

          # `retryCount` শব্দটা যে commit-এ এসেছিল বা সরেছিল
          git log -S'retryCount' --oneline -- src/

          # কে এই এলাকা সবচেয়ে ভালো জানে
          git shortlog -sn HEAD -- src/Billing
        marks:
          - {line: 2, tip: '--testdox test-এর নামগুলো সাধারণ ভাষায় বসায়: "refund fails when already refunded"। এটাই আচরণের জীবন্ত নথি।'}
          - {line: 5, tip: 'যে ফাইল সবচেয়ে ঘন ঘন বদলায়, সেখানেই বাগ আর জটিলতা জমে।'}
          - {line: 8, tip: 'blame থেকে commit পান, তারপর `git show <hash>` দিয়ে commit message ও PR-তে "কেন" খুঁজুন।'}
          - {line: 11, tip: 'pickaxe (-S): কোনো শব্দ কখন যোগ বা বাদ হয়েছিল। বিস্ময়কর "কেন এই retry?"-র উত্তর এখানে।'}
    aside:
      - type: tips
        items:
          - 'একটা ছোট test লিখে বা বদলে দেখুন — বদলাতে ভয় লাগলে বোঝা যায় কোডের কোথায় নির্ভরতা।'
          - 'Xdebug বা `dump()` দিয়ে একটা request-এর মাঝে মান দেখুন; অনুমানের চেয়ে মান বেশি বিশ্বাসযোগ্য।'
      - type: pitfalls
        items:
          - 'Commit message বা comment-কে সত্য ধরুন না; কোড বদলেছে, comment পুরনো থাকতে পারে। শেষ কথা কোডই।'
    check:
      q: 'একটা অদ্ভুত `sleep(2)` কোডে দেখলে কেন আছে খুঁজতে কোন git কমান্ড ব্যবহার করবেন?'
      a: '`git blame` লাইনের commit পেতে, তারপর `git show` বা `git log -S"sleep(2)"` দিয়ে কখন যোগ হয়েছিল ও commit message-এ কারণ পড়বেন।'

  - slug: draw-the-map
    title: 'এক পাতার মানচিত্র আঁকুন'
    kind: recap
    tldr: 'যা বুঝলে খাতায় লিখে রাখুন: প্রবেশ-পথ, মূল service, ডেটা কোথায় থাকে, বাইরের নির্ভরতা — নিজের মানচিত্র আঁকলেই সত্যিই বোঝা হয়।'
    keywords: ['architecture map', 'sketch', 'mental model', 'diagram', 'onboarding notes', 'মানচিত্র']
    blocks:
      - type: text
        body: |
          যা বুঝেছেন তা হাতে আঁকুন। আঁকতে গিয়ে যেখানে আটকে যাবেন, সেটাই আপনার বোঝার ফাঁক, আর সেখানেই পরের প্রশ্ন। মানচিত্র বড় হওয়ার দরকার নেই; এক পাতায় বাক্স আর তীর যথেষ্ট।
      - type: visual
        kind: steps
        caption: 'মানচিত্র আঁকার পাঁচ ধাপ'
        steps:
          - {title: '১. প্রবেশ-পথ', body: 'route, command, handler, cron', tip: 'কে কে সিস্টেমে কাজ ঢোকায়, সেগুলো বাঁ দিকে বসান।'}
          - {title: '২. মূল service', body: 'ব্যবসার নিয়ম কোথায়', tip: 'সবচেয়ে বেশি ডাক-পাওয়া ৩–৫টা class বাছুন, সব নয়।'}
          - {title: '৩. ডেটা', body: 'কোন টেবিল, কোন cache, কোন ফাইল', tip: 'কোথায় সত্য রাখা হয় (source of truth) তা চিহ্নিত করুন।'}
          - {title: '৪. বাইরের নির্ভরতা', body: 'পেমেন্ট, ইমেইল, অন্য সার্ভিস', tip: 'এগুলোয় ব্যর্থতা সবচেয়ে বেশি। আলাদা রঙে আঁকো।'}
          - {title: '৫. প্রশ্ন লিখুন', body: 'যা বুঝিনি তার তালিকা', tip: 'পাশে লেখা প্রশ্ন সহকর্মীকে জিজ্ঞেস করার প্রস্তুতি; বিনা প্রস্তুতিতে জিজ্ঞেস করার চেয়ে ভালো।'}
      - type: code
        lang: text
        file: 'notes/refund-map.txt'
        code: |
          প্রবেশ:   POST /api/refunds (RefundController)    cron: app:refund:retry
          মূল:      RefundService -> PaymentGateway, RefundRepository
          ডেটা:     refunds (Postgres), idempotency key (Redis)
          বাইরে:    bKash gateway (ব্যর্থ হলে retry), Mailer
          ঘটনা:     RefundIssued -> SendRefundEmailListener  <-- ইমেইল এখানে
          প্রশ্ন:   RefundIssued কি queue-তে যায়, নাকি সরাসরি?
        marks:
          - {line: 5, tip: 'এই এক লাইন সুমির আসল প্রশ্নের উত্তর: ইমেইল পাঠানো একটা listener-এ।'}
          - {line: 6, tip: 'এখনও না-বোঝা প্রশ্ন লিখে রাখুন; পরের debug:messenger চালানোর কারণ হিসেবে।'}
      - type: quote
        body: 'কোড পড়ুন প্রশ্ন নিয়ে, প্রবেশ-পথ থেকে, একটা request শেষ পর্যন্ত — আর যা বুঝলে তা আঁকো।'
    aside:
      - type: pitfalls
        items:
          - 'সব বোঝার আগে কোড বদলাতে নামা। আগে মানচিত্র আর একটা ছোট test, তারপর বদল।'
          - 'নাম আর comment-কে সত্য ধরা। `PaymentService` আসলে শুধু ইমেইল পাঠাতেও পারে; চালিয়ে বা debug কমান্ডে মিলিয়ে নিন।'
      - type: refs
        items:
          - {to: 'thinking/documentation', label: 'মানচিত্রকে স্থায়ী নথি করা'}
    check:
      q: 'মানচিত্র আঁকতে গিয়ে একটা তীর কোথা থেকে কোথায় যাবে ঠিক করতে পারলেন না। কী করবেন?'
      a: 'ঐটাই বোঝার ফাঁক। সেখান থেকে একটা request অনুসরণ করুন বা debug কমান্ড চালান, তারপর তীরটা এঁকে প্রশ্নটা কাটুন।'

flashcards:
  - q: 'অচেনা codebase পড়া শুরু করবেন কোথা থেকে?'
    a: 'প্রবেশ-পথ থেকে: route, console command, message handler, listener, scheduler। ফাইলের বর্ণানুক্রম থেকে নয়।'
    more: |
      কাজের পথ আর ফাইলের ক্রম আলাদা। একটা প্রবেশ-পথ ধরে একটা request শেষ পর্যন্ত গেলে দরকারি ফাইল নিজেই বেরিয়ে আসে।
    ref: entry-points-one-request
  - q: 'Symfony অ্যাপে প্রবেশ-পথ কী কী?'
    a: 'HTTP route (`#[Route]`), console command (`#[AsCommand]`), message handler (`#[AsMessageHandler]`), event listener আর scheduler।'
    more: |
      সবগুলোতে PHP attribute আছে, তাই `grep -R "AsMessageHandler" src/` দিয়েও খোঁজা যায়। কিন্তু debug কমান্ড তালিকাটা সরাসরি দিয়ে দেয়।
    ref: entry-points-one-request
  - q: 'কোন URL কোন controller চালায় তা কীভাবে জানবেন?'
    a: '`php bin/console debug:router --show-controllers`। নির্দিষ্ট route-এ `debug:router <নাম>` দিলে বিস্তারিত।'
    more: |
      `grep` দিয়ে ছেঁকে নিলে (`| grep -i refund`) শুধু প্রাসঙ্গিক route পাওয়া যায়। পাশে path, method আর controller class দেখা যায়।
    ref: debug-commands
  - q: 'একটা service সম্পর্কে কী জানতে `debug:container` কাজে লাগে?'
    a: 'Service-এর class, নির্ভরতা (arguments), tag ও alias। `debug:autowiring` বলে কোন type inject করা যায়।'
    more: |
      `php bin/console debug:container 'App\Service\RefundService'` চালালে কনফিগ দেখা যায়। `debug:autowiring Mailer` ধরনের কমান্ড কোন interface autowire হবে তা বলে।
    ref: debug-commands
  - q: 'কোন event-এ কোন কোন listener চলে, কীভাবে দেখবেন?'
    a: '`php bin/console debug:event-dispatcher <event-নাম>`। priority ক্রমে listener তালিকা আসে।'
    more: |
      "রিফান্ড হলে ইমেইল কে পাঠায়" ধরনের প্রশ্নের উত্তর সাধারণত এখানেই। message handler খুঁজতে `debug:messenger`।
    ref: debug-commands
  - q: 'Test পড়ে কী লাভ?'
    a: 'কোডটা কী আচরণ করবে বলে ধরা হয় তার তালিকা পাওয়া যায়। `phpunit --testdox` সেটা সাধারণ ভাষায় দেখায়।'
    more: |
      Test হলো জীবন্ত নথি: comment পুরনো হয়, কিন্তু চলতে থাকা test সত্য কথা বলে। test না থাকলে সেটাও একটা তথ্য: এই অংশ বদলাতে সাবধান।
    ref: tests-and-history
  - q: 'কোনো লাইন কেন লেখা হয়েছিল তা git দিয়ে কীভাবে খুঁজবেন?'
    a: '`git blame -L শুরু,শেষ ফাইল` দিয়ে commit পান, তারপর `git show`। শব্দ কখন এসেছিল তা `git log -S''শব্দ''`।'
    more: |
      Commit message আর PR-এর আলোচনায় "কেন" থাকে। `git log -S` (pickaxe) কোনো শব্দ কোন commit-এ যোগ বা বাদ হয়েছিল বলে দেয়।
    ref: tests-and-history
  - q: 'কেন নিজের হাতে মানচিত্র আঁকা ভালো?'
    a: 'আঁকতে গিয়ে যেখানে আটকে যান সেটাই আপনার বোঝার ফাঁক। তাই মানচিত্র বোঝার পরীক্ষাও।'
    more: |
      এক পাতায় প্রবেশ-পথ, মূল service, ডেটা, বাইরের নির্ভরতা আর না-বোঝা প্রশ্ন। এই মানচিত্র সহকর্মীকে জিজ্ঞেস করার প্রস্তুতিও।
    ref: draw-the-map

quiz:
  - q: 'নতুন প্রজেক্টে "রিফান্ড ইমেইল যাচ্ছে না" দেখতে বলা হলো। সবচেয়ে ভালো প্রথম পদক্ষেপ কী?'
    hint: 'পুরো কোড নয়, একটা নির্দিষ্ট পথ।'
    options:
      - text: '`src/` ফোল্ডারের সব ফাইল শুরু থেকে পড়া'
        correct: false
        why: 'ফাইলের ক্রম কাজের পথ নয়; অনেক সময় যাবে, দরকারি অংশ আলাদা করা যাবে না।'
      - text: 'রিফান্ডের route বা command খুঁজে সেখান থেকে একটা request অনুসরণ করা'
        correct: true
        why: 'প্রবেশ-পথ থেকে শুরু করলে শুধু ঐ কাজের ফাইলগুলো পড়া হয়।'
      - text: 'ইমেইল পাঠানোর কোড বদলে দেখা'
        correct: false
        why: 'বোঝার আগে বদল করলে ভুল জায়গায় হাত পড়ে।'
      - text: 'আগের ডেভেলপারকে ডেকে পুরো ব্যাখ্যা চাওয়া'
        correct: false
        why: 'আগে নিজে মানচিত্র আর নির্দিষ্ট প্রশ্ন বানান; তারপর সহকর্মীকে জিজ্ঞেস করলে সময় বাঁচে।'
    ref: lost-in-five-hundred-files
  - q: 'কোন কমান্ড বলবে `App\Event\RefundIssued` ঘটলে কোন listener চলে?'
    hint: 'event আর listener — কোন debug কমান্ড?'
    options:
      - text: 'php bin/console debug:router'
        correct: false
        why: 'এটা URL ও controller-এর তালিকা, event নয়।'
      - text: 'php bin/console debug:event-dispatcher App\Event\RefundIssued'
        correct: true
        why: 'event-এর ওপর শুনছে এমন সব listener priority ক্রমে দেখায়।'
      - text: 'php bin/console debug:autowiring'
        correct: false
        why: 'এটা autowire করার মতো type-এর তালিকা দেখায়।'
      - text: 'php bin/console about'
        correct: false
        why: 'এটা Symfony ও পরিবেশের সংস্করণ দেখায়।'
    ref: debug-commands
  - q: 'কোডে একটা অদ্ভুত `usleep(500000)` আছে, comment-এ লেখা "gateway rate limit এড়াতে"। এখন কী করা ভালো?'
    hint: 'comment কি সবসময় সত্য?'
    options:
      - text: 'comment বিশ্বাস করে হাত না দেওয়া'
        correct: false
        why: 'comment পুরনো হতে পারে; এখন gateway-র নিয়ম বদলে গিয়ে থাকতে পারে।'
      - text: '`git blame` ও `git show` দিয়ে কেন যোগ হয়েছিল পড়া, আর এখনও দরকার কি না যাচাই করা'
        correct: true
        why: 'ইতিহাস কারণ জানায়, আর চালিয়ে বা test-এ যাচাই করলে এখনকার সত্য মেলে।'
      - text: 'সাথে সাথে মুছে ফেলা'
        correct: false
        why: 'না জেনে মুছলে rate limit আবার ভেঙে যেতে পারে।'
    ref: tests-and-history
  - q: 'নিচের কোন কাজগুলো অচেনা codebase বোঝার ভালো উপায়?'
    hint: 'প্রবেশ-পথ, চালানো, ইতিহাস, মানচিত্র।'
    options:
      - text: '`php bin/phpunit --testdox` চালিয়ে আচরণের তালিকা পড়া'
        correct: true
        why: 'test-এর নামগুলো কোডের প্রত্যাশিত আচরণ সহজ ভাষায় বলে।'
      - text: 'এক পাতায় প্রবেশ-পথ, service, ডেটা ও নির্ভরতার মানচিত্র আঁকা'
        correct: true
        why: 'আঁকতে গিয়ে বোঝার ফাঁক ধরা পড়ে।'
      - text: 'সব ক্লাসের নাম দেখে ধরে নেওয়া কে কী করে'
        correct: false
        why: 'নাম বিভ্রান্তিকর হতে পারে; কোড বা debug কমান্ডে মিলিয়ে নিন।'
      - text: 'বোঝার আগেই বড় refactor শুরু করা'
        correct: false
        why: 'না বুঝে refactor করলে আচরণ ভাঙে।'
    ref: tests-and-history
  - q: 'নিচের কোন প্রশ্নের উত্তর `debug:messenger` দেয়?'
    hint: 'queue আর handler।'
    options:
      - text: 'কোন URL কোন controller চালায়'
        correct: false
