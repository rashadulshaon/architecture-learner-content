slides:
  - slug: timeout-not-failure
    title: 'Timeout হলো, টাকা গেছে কি না কেউ জানে না'
    kind: story
    tldr: 'Gateway কল timeout হলে ফল তিন রকম হতে পারে: সফল, ব্যর্থ, বা অজানা; timeout-কে ব্যর্থ ধরে নতুন করে চেষ্টা করলে ক্রেতার টাকা দুইবার কাটে।'
    keywords: ['timeout', 'unknown outcome', 'assume failure', 'double charge', 'টাইমআউট', 'অজানা ফল']
    blocks:
      - type: text
        body: |
          রহিমের অ্যাপ gateway-কে বলল "রিনার কার্ড থেকে ১২০০ টাকা কাটো"। gateway টাকা কেটে ফেলল, কিন্তু উত্তর ফেরার পথে নেটওয়ার্ক আটকে গেল, আর রহিমের অ্যাপ ৫ সেকেন্ড পরে timeout পেল। অ্যাপ ধরে নিল "ব্যর্থ", payment `failed` করল, আর রিনাকে বলল "আবার চেষ্টা করো"। রিনা আবার চাপল, আর ১২০০ টাকা দুইবার কাটা গেল।
      - type: visual
        kind: sequence
        caption: 'Timeout-কে ব্যর্থ ধরে নিলে টাকা দুইবার কাটে'
        actors:
          - {id: app, label: 'রহিমের অ্যাপ', icon: server, tip: 'gateway-কে কল করে। উত্তর না এলে নিজেই সিদ্ধান্ত নিয়ে ফেলে — এখানেই ভুল।'}
          - {id: gw, label: 'Gateway', icon: bank, tip: 'টাকা কাটার আসল মালিক। সে জানে আসলে কী হয়েছে, কিন্তু অ্যাপকে তা জানাতে পারেনি।'}
          - {id: rina, label: 'রিনা', icon: user, tip: 'ক্রেতা। অ্যাপ যা দেখায় তা-ই বিশ্বাস করে।'}
        messages:
          - {from: app, to: gw, label: 'charge ১২০০ টাকা'}
          - {at: gw, note: 'টাকা কাটা হয়ে গেছে', tone: warn, tip: 'কাজ ঠিকমতো হয়েছে, কিন্তু অ্যাপ এখনো জানে না।'}
          - {from: gw, to: app, label: 'সফল (পথে হারাল)', dashed: true, tone: bad}
          - {at: app, note: '৫ সেকেন্ড পর timeout → "ব্যর্থ"', tone: bad, tip: 'timeout শুধু বলে উত্তর আসেনি; কাজ ব্যর্থ হয়েছে কি না তা বলে না।'}
          - {from: app, to: rina, label: '"ব্যর্থ, আবার চেষ্টা করো"', tone: bad}
          - {from: rina, to: app, label: 'আবার চাপল'}
          - {from: app, to: gw, label: 'নতুন charge ১২০০ টাকা', tone: bad}
          - {at: gw, note: 'মোট কাটা ২৪০০ টাকা', tone: bad}
      - type: quote
        body: 'Timeout মানে ব্যর্থ নয়, মানে "জানি না"। জানার আগে ব্যর্থও বোলো না, সফলও না।'
    aside:
      - type: problem
        body: 'নেটওয়ার্কে কাজ দুই ধাপে হয়: চলে যাওয়া আর উত্তর আসা। যেকোনো ধাপে হারালে অ্যাপ বাইরে থেকে একই দৃশ্য দেখে — শুধু নীরবতা।'
      - type: terms
        items:
          - {term: 'Unknown outcome', meaning: 'কাজটা হয়েছে কি না, তা না জানা অবস্থা — সাধারণত timeout বা সংযোগ কাটার পর।'}
    check:
      q: 'Timeout পাওয়ার পর কাজটার ফল কয় রকম হতে পারে, আর অ্যাপ কোনটা বেছে নিয়ে ভুল করল?'
      a: 'তিন রকম: সফল, ব্যর্থ বা অজানা। অ্যাপ অজানাকে ব্যর্থ ধরে নিয়েছিল, অথচ টাকা আসলে কাটা হয়ে গিয়েছিল।'

  - slug: bkash-sms-missing
    title: 'SMS আসেনি, কিন্তু ব্যালেন্স কমেছে'
    kind: concept
    tldr: 'অজানা অবস্থাকে নিজস্ব state (pending) দাও, তারপর সময় নিয়ে সত্যটা gateway-কে জিজ্ঞেস করো বা webhook-এর জন্য অপেক্ষা করো; অনুমান নয়।'
    keywords: ['pending state', 'status query', 'reconciliation', 'source of truth', 'অজানা অবস্থা', 'যাচাই']
    blocks:
      - type: metaphor
        icon: phone
        title: 'বিকাশের পেমেন্ট, কিন্তু SMS আসেনি'
        body: |
          রিনা দোকানে বিকাশে টাকা দিল, কিন্তু দোকানদারের ফোনে SMS এল না। দোকানদার "টাকা পাইনি" বলে না, "পেয়েছি"ও বলে না। সে বলে "একটু দাঁড়াও", আর ট্রানজ্যাকশন আইডি দিয়ে বিকাশের অ্যাপে মিলিয়ে দেখে। এই "দাঁড়াও" হলো **pending**, আর অ্যাপে মিলিয়ে দেখা হলো **status query**, আসল সত্য বিকাশের খাতায়।
      - type: visual
        kind: flow
        caption: 'অজানা হলে pending রাখো, তারপর gateway-কে জিজ্ঞেস করো'
        nodes:
          - {id: app, label: 'আমাদের অ্যাপ', sub: 'Symfony', icon: server, col: 0, row: 1, tip: 'charge পাঠায়, উত্তর না পেলে সিদ্ধান্ত নেয় না — অপেক্ষা করে আর যাচাই করে।'}
          - {id: gw, label: 'Gateway', sub: 'সত্যের উৎস', icon: bank, tone: accent, col: 2, row: 0, tip: 'টাকা আসলে কাটা হয়েছে কি না এই খাতাই বলতে পারে, আমাদের ডেটাবেস নয়।'}
          - {id: pending, label: 'pending', sub: 'জানি না', icon: hourglass, tone: warn, col: 2, row: 2, tip: 'অজানা অবস্থার নিজস্ব জায়গা। ব্যর্থ বা সফল নয়, তাই কোনো ভুল সিদ্ধান্ত নেওয়া হয় না।'}
          - {id: done, label: 'succeeded / failed', sub: 'জানা অবস্থা', icon: check, tone: good, col: 4, row: 1, tip: 'gateway-র আসল উত্তর পাওয়ার পরই payment এখানে আসে।'}
        edges:
          - {from: app, to: gw, label: 'অ্যাপ charge পাঠায়, উত্তর আসে না (timeout)', tone: warn}
          - {from: app, to: pending, label: 'অ্যাপ payment-কে pending রাখে, ব্যর্থ বলে না'}
          - {from: pending, to: gw, label: 'পরে একই reference দিয়ে gateway-র কাছে অবস্থা জানতে চায়'}
          - {from: gw, to: done, label: 'gateway আসল ফল জানায়: succeeded বা failed', tone: good}
          - {from: done, to: app, label: 'অ্যাপ সেই ফল অনুযায়ী payment-এর অবস্থা বদলায়', dashed: true, tone: good}
      - type: text
        body: |
          ফল জানার তিনটা পথ: gateway-র **webhook** আসা, নিজে **status query** করা, আর নিয়মিত একটা **reconciliation** job, যা আটকে থাকা pending-গুলো ধরে ধরে মেলায়। তিনটাই রাখো, কারণ যেকোনোটা ব্যর্থ হতে পারে।
    aside:
      - type: terms
        items:
          - {term: 'Source of truth', meaning: 'যার খাতাকে শেষ কথা মানা হয়; এখানে gateway।'}
          - {term: 'Reconciliation', meaning: 'নিজের খাতা আর বাইরের খাতা মিলিয়ে অমিল ধরা ও ঠিক করা।'}
      - type: refs
        items:
          - {to: 'ledgers/reconciliation', label: 'Reconciliation বিস্তারিত'}
          - {to: 'payments/webhooks', label: 'Webhook-এ ফল আসা'}
    check:
      q: 'Pending state না রেখে timeout-এ সরাসরি failed বসালে কোন তথ্যটা হারিয়ে যায়?'
      a: 'জানা যায় না যে ফল আসলে অজানা। পরে gateway থেকে সফল খবর এলে আমরা failed payment-কে আর ঠিক করার পথ পাই না।'

  - slug: same-key-retry
    title: 'Pending রাখো, আর retry করলে একই key দিয়ে'
    kind: howto
    tldr: 'Gateway কল করার আগে payment-কে pending-এ commit করো; transport error বা ৫xx-এ failed না করে পরে যাচাই করো; retry-তে আগের idempotency key-ই পাঠাও।'
    keywords: ['HttpClient timeout', 'TransportExceptionInterface', 'DelayStamp', 'safe retry', 'idempotency key', 'নিরাপদ retry']
    blocks:
      - type: code
        lang: php
        file: 'src/Payment/ChargeService.php (ভুল)'
        variant: bad
        code: |
          try {
              $res = $this->gateway->request('POST', '/charges', [
                  'headers' => ['Idempotency-Key' => (string) Uuid::v4()],   // প্রতিবার নতুন
                  'json' => ['amount' => $payment->getAmount()],
                  'timeout' => 5,
              ]);
              $res->getStatusCode();
              $payment->markSucceeded();
          } catch (\Throwable) {
              $payment->markFailed();              // timeout = ব্যর্থ?
          }
        marks:
          - {line: 3, tip: 'প্রতিবার নতুন key মানে gateway প্রতিটা চেষ্টা আলাদা কাজ ভাবে; retry-তে আবার টাকা কাটবে।'}
          - {line: 10, tip: 'সব exception-কে ব্যর্থ ধরা হচ্ছে। timeout হলে টাকা কেটে গেলেও payment failed থাকে।'}
      - type: code
        lang: php
        file: 'src/Payment/ChargeService.php'
        variant: good
        code: |
          public function charge(Payment $payment): void
          {
              $this->transitions->apply($payment->getId(), 'submit');   // আগে pending, commit
              try {
                  $res = $this->gateway->request('POST', '/charges', [
                      'headers' => ['Idempotency-Key' => $payment->getIdempotencyKey()],
                      'json' => [
                          'reference' => $payment->getReference(),
                          'amount' => $payment->getAmount(),
                      ],
                      'timeout' => 5,
                  ]);
                  $code = $res->getStatusCode();
              } catch (TransportExceptionInterface) {       // timeout বা সংযোগ কাটা: ফল অজানা
                  $this->checkLater($payment);
                  return;
              }
              match (true) {
                  $code < 300 => $this->transitions->apply($payment->getId(), 'succeed'),
                  $code === 408 || $code === 429 || $code >= 500 => $this->checkLater($payment),
                  default => $this->transitions->apply($payment->getId(), 'fail'),   // স্পষ্ট না
              };
          }

          private function checkLater(Payment $payment): void
          {
              $this->bus->dispatch(
                  new CheckPaymentStatus($payment->getId()), [new DelayStamp(30_000)]);
          }
        marks:
          - {line: 3, tip: 'কল করার আগেই pending commit হয়। crash হলেও খাতায় লেখা থাকে যে একটা কল চলছিল।'}
          - {line: 6, tip: 'key payment তৈরির সময় একবারই বানানো হয়েছে, তাই প্রতিটা চেষ্টায় এই একই key যায়।'}
          - {line: 14, tip: 'TransportExceptionInterface-এ timeout-ও পড়ে। এখানে failed বসানো হয় না — শুধু পরে যাচাইয়ের কাজ রাখা হয়।'}
          - {line: 20, tip: '৫xx, 408 আর 429 মানে gateway এখনো চূড়ান্ত কিছু বলেনি। অন্য ৪xx হলো স্পষ্ট "না"।'}
          - {line: 28, tip: '৩০ সেকেন্ড দেরিতে যাচাই। gateway-কে সময় দাও কাজ শেষ করতে।'}
      - type: quote
        body: 'Retry করলে সবসময় একই idempotency key। নতুন key মানে নতুন কাজ।'
    aside:
      - type: tips
        items:
          - 'HttpClient lazy: আসল ত্রুটি তখনই আসে যখন `getStatusCode()` বা `getContent()` ডাকো, `request()`-এ নয়।'
          - 'সবসময় `timeout` দাও। না দিলে অ্যাপই অনির্দিষ্টকাল ঝুলে থাকবে।'
      - type: refs
        items:
          - {to: 'payments/idempotency-keys', label: 'Idempotency key গড়া'}
          - {to: 'resilience/circuit-breakers', label: 'Retry, backoff ও jitter'}
    check:
      q: 'কোন কোন ক্ষেত্রে `charge()` payment-কে `failed` করে, আর কোনগুলোতে করে না?'
      a: 'শুধু স্পষ্ট প্রত্যাখ্যানে (৪xx, ৪০৮ ও ৪২৯ বাদে) failed। timeout, সংযোগ কাটা, ৪০৮, ৪২৯ বা ৫xx হলে pending-ই থাকে, পরে যাচাই হয়।'

  - slug: resolve-by-asking
    title: 'সত্য জিজ্ঞেস করে নাও: status query আর sweeper'
    kind: howto
    tldr: 'CheckPaymentStatus handler gateway-কে reference দিয়ে জিজ্ঞেস করে payment ঠিক করে; আর periodic sweeper পুরনো pending-গুলো ধরে আবার যাচাইয়ে পাঠায়।'
    keywords: ['status query', 'sweeper', 'AsPeriodicTask', 'reconciliation job', 'stale pending', 'আটকে থাকা পেমেন্ট']
    blocks:
      - type: text
        body: |
          যাচাই দুই ভাবে চলে: সময়মতো একবার (পরে করার message), আর সময় পেরিয়ে যাওয়া pending-দের জন্য নিয়মিত sweeper। দুটোই `reference` ধরে gateway-কে জিজ্ঞেস করে, নিজের অনুমানে কিছু করে না।
      - type: code
        lang: php
        file: 'src/MessageHandler/CheckPaymentStatusHandler.php'
        variant: good
        code: |
          public function __invoke(CheckPaymentStatus $m): void
          {
              $payment = $this->repo->find($m->paymentId);
              if ('pending' !== $payment->getStatus()) {
                  return;                                   // webhook আগেই ফয়সালা করেছে
              }
              $res = $this->gateway->request('GET', '/charges', [
                  'query' => ['reference' => $payment->getReference()],
              ]);
              if (404 === $res->getStatusCode()) {
                  $this->bus->dispatch(new RetryCharge($payment->getId()));   // একই key-তে
                  return;                                   // gateway কখনো কল পায়নি
              }
              match ($res->toArray()['status']) {
                  'succeeded' => $this->transitions->apply($payment->getId(), 'succeed'),
                  'failed' => $this->transitions->apply($payment->getId(), 'fail'),
                  default => $this->bus->dispatch(          // এখনো চলছে: পরে আবার
                      new CheckPaymentStatus($payment->getId()), [new DelayStamp(60_000)]),
              };
          }
        marks:
          - {line: 4, tip: 'pending না থাকলে কাজ নেই: webhook এসে গেছে। এই চেক handler-কে idempotent করে।'}
          - {line: 8, tip: 'আমাদের নিজের reference দিয়ে খোঁজা হচ্ছে, কারণ gateway-র id আমরা হয়তো কখনো পাইইনি।'}
          - {line: 11, tip: '৪০৪ মানে gateway-র কাছে কল পৌঁছায়ইনি। তখন একই key দিয়ে আবার charge পাঠানো নিরাপদ।'}
          - {line: 17, tip: 'gateway নিজেই এখনো "processing" বললে অপেক্ষা: আবার ৬০ সেকেন্ড পরে জিজ্ঞেস।'}
      - type: code
        lang: php
        file: 'src/Scheduler/StalePendingSweeper.php'
        variant: good
        code: |
          #[AsPeriodicTask(frequency: '10 minutes', schedule: 'default')]
          final readonly class StalePendingSweeper
          {
              public function __construct(private Connection $db, private MessageBusInterface $bus) {}

              public function __invoke(): void
              {
                  $ids = $this->db->fetchFirstColumn(
                      "SELECT id FROM payment
                       WHERE status = 'pending' AND updated_at < now() - interval '15 minutes'"
                  );
                  foreach ($ids as $id) {
                      $this->bus->dispatch(new CheckPaymentStatus((int) $id));
                  }
              }
          }
        marks:
          - {line: 1, tip: 'Symfony Scheduler-এর attribute। worker চালাতে হয়: messenger:consume scheduler_default।'}
          - {line: 9, tip: '১৫ মিনিটের বেশি pending থাকা মানে webhook বা পুরনো query কোনোটাই কাজ করেনি। এদের আবার ধরো।'}
    aside:
      - type: commands
        title: 'Scheduler চালু'
        items:
          - {cmd: 'php bin/console messenger:consume scheduler_default', desc: 'Scheduler-এর task চালানোর worker'}
          - {cmd: 'php bin/console debug:scheduler', desc: 'নিবন্ধিত periodic task দেখো'}
      - type: tips
        items:
          - 'অনেকক্ষণ pending থাকলে (যেমন ২৪ ঘণ্টা) মানুষকে alert পাঠাও। অনন্তকাল নিজে নিজে চেষ্টা চালিয়ে যেয়ো না।'
    check:
      q: 'Status query-তে gateway "এই reference-ই চিনি না" (৪০৪) বললে কী করা নিরাপদ, আর কেন?'
      a: 'একই idempotency key দিয়ে আবার charge পাঠানো। কল gateway-তে কখনো পৌঁছায়নি, আর পৌঁছে থাকলেও একই key দিয়ে দ্বিতীয়বার কাজ হবে না।'

flashcards:
  - q: 'Timeout পেলে একটা payment কল কয় রকম ফল পেতে পারে?'
    a: 'তিন রকম: কাজ সফল হয়েছে, ব্যর্থ হয়েছে, বা আমরা জানি না। Timeout শুধু বলে উত্তর আসেনি।'
    more: |
      উত্তর হারানোর কারণ দুই রকম: অনুরোধই পৌঁছায়নি, অথবা পৌঁছে কাজ হয়ে গেছে কিন্তু উত্তর পথে হারিয়েছে। বাইরে থেকে দুটো একই দেখায়, তাই timeout থেকে সিদ্ধান্ত নেওয়া যায় না।
    ref: timeout-not-failure
  - q: 'Timeout-কে "ব্যর্থ" ধরে নিলে কী ঘটতে পারে?'
    a: 'টাকা কেটে থাকলেও অ্যাপ failed রাখে, ক্রেতা আবার চেষ্টা করে, আর টাকা দুইবার কাটে। অথবা কেটে থাকা টাকার কোনো হিসাব থাকে না।'
    more: |
      দুটো ক্ষতি: ক্রেতার টাকা দুইবার কাটা, আর ব্যবসার খাতায় "ব্যর্থ" থাকলেও gateway-র খাতায় "সফল" — এই অমিল পরে reconciliation-এ ধরা পড়ে, কিন্তু ততক্ষণে অভিযোগ এসে যায়।
    ref: timeout-not-failure
  - q: 'Timeout-কে "সফল" ধরে নিলে কী ঘটতে পারে?'
    a: 'টাকা আসলে না কাটলেও পণ্য বা সেবা চলে যায়, আর ব্যবসার লোকসান হয়।'
    more: |
      request gateway-তে পৌঁছায়নি বা কার্ড প্রত্যাখ্যাত হয়েছে, অথচ অ্যাপ "সফল" ধরে অর্ডার পাঠিয়ে দিয়েছে — এটা বিনা মূল্যে পণ্য দেওয়ার সমান। তাই সফল বা ব্যর্থ বলার জন্য gateway-র নিশ্চিত উত্তর লাগে।
    ref: timeout-not-failure
  - q: 'Payment-এ `pending` state কেন লাগে?'
    a: 'এটা "জানি না" অবস্থার নিজস্ব জায়গা। এতে সফল বা ব্যর্থ কোনো ভুল সিদ্ধান্ত নেওয়া হয় না, আর পরে যাচাই করা যায়।'
    more: |
      Pending না থাকলে অজানা অবস্থাকে জোর করে succeeded বা failed-এ ঢোকাতে হয়। pending থাকলে শুধু "অপেক্ষা" বোঝায়, আর কোন কোন payment যাচাইয়ের অপেক্ষায় আছে তা সহজে query করা যায়।
    ref: bkash-sms-missing
  - q: 'অজানা payment-এর আসল ফল জানার তিনটা উপায় কী?'
    a: 'Gateway-র webhook, নিজে status query করা, আর নিয়মিত reconciliation job। তিনটাই রাখো।'
    more: |
      Webhook দ্রুত, কিন্তু হারাতে পারে। Status query নিজের নিয়ন্ত্রণে। Reconciliation বা sweeper বাকি সব ফাঁক ধরে। একটার ওপর নির্ভর না করে তিনটা রাখলে কোনো payment অনন্তকাল pending থাকে না।
    ref: bkash-sms-missing
  - q: 'Unknown outcome-এর পরে retry করলে idempotency key কেমন হবে?'
    a: 'আগের চেষ্টার একই key। নতুন key মানে gateway-র কাছে নতুন কাজ, তাই টাকা আবার কাটতে পারে।'
    more: |
      Key payment তৈরির সময় একবার বানিয়ে ডেটাবেসে রাখতে হয়, চেষ্টার সময় বানালে চলবে না। একই key-তে প্রথম চেষ্টা সফল হয়ে থাকলে gateway আগের উত্তর ফেরত দেয়, আর না হয়ে থাকলে এবার একবার করে।
    ref: same-key-retry
  - q: 'Gateway কল করার আগে payment-কে pending-এ commit করা হয় কেন?'
    a: 'যাতে কল চলার মাঝে crash হলেও খাতায় লেখা থাকে যে একটা কল চলছিল, আর পরে যাচাইয়ের জন্য payment খুঁজে পাওয়া যায়।'
    more: |
      আগে কল করে পরে লিখলে crash হলে gateway-তে টাকা কাটা আছে অথচ আমাদের খাতায় কিছুই নেই — এই payment আর কেউ খুঁজে পায় না। আগে লিখে রাখলে sweeper তাকে ধরে ফেলে।
    ref: same-key-retry
  - q: 'Status query-তে gateway "এই reference চিনি না" বললে কী করবে?'
    a: 'কল gateway-তে পৌঁছায়নি। একই idempotency key দিয়ে আবার charge পাঠানো নিরাপদ।'
    more: |
      Gateway যদি সত্যিই কল না পেয়ে থাকে তাহলে এবার প্রথমবার কাজ হবে। আর যদি অন্য কোনো দেরিতে এসে থাকে, একই key থাকায় gateway দ্বিতীয়বার কাজ করবে না। দুই ক্ষেত্রেই ফল একই, তাই নিরাপদ।
    ref: resolve-by-asking

quiz:
  - q: 'Gateway কল ৫ সেকেন্ডে timeout হলো। অ্যাপের সঠিক পরবর্তী পদক্ষেপ কোনটা?'
    hint: 'Timeout কী প্রমাণ করে — কাজ হয়নি, নাকি উত্তর আসেনি?'
    options:
      - text: 'payment failed করে ক্রেতাকে আবার চেষ্টা করতে বলা'
        correct: false
        why: 'টাকা হয়তো কেটে গেছে। ক্রেতা আবার চেষ্টা করলে দ্বিতীয়বার কাটতে পারে।'
      - text: 'payment succeeded করে অর্ডার পাঠিয়ে দেওয়া'
        correct: false
        why: 'টাকা কাটা না হয়ে থাকলেও পণ্য চলে যাবে। timeout সফলতার প্রমাণ নয়।'
      - text: 'payment pending রেখে পরে gateway-কে জিজ্ঞেস করা'
        correct: true
        why: 'অজানা অবস্থার সঠিক জায়গা pending। তারপর status query বা webhook থেকে আসল ফল আসে।'
      - text: 'একই request নতুন key দিয়ে সাথে সাথে আবার পাঠানো'
        correct: false
        why: 'নতুন key মানে নতুন কাজ। প্রথমটা সফল হয়ে থাকলে টাকা দুইবার কাটবে।'
    ref: timeout-not-failure
  - q: 'নিচের কোডে কী কী ভুল আছে?'
    lang: php
    code: |
      try {
          $res = $gateway->request('POST', '/charges', [
              'headers' => ['Idempotency-Key' => (string) Uuid::v4()],
              'json' => ['amount' => 1200],
          ]);
          $res->getStatusCode();
          $payment->markSucceeded();
      } catch (\Throwable) {
          $payment->markFailed();
      }
    hint: 'key কখন বানানো হচ্ছে? timeout পেলে কোন অবস্থা বসছে? আর timeout option আছে কি?'
    options:
      - text: 'প্রতিবার নতুন key, তাই retry-তে gateway আবার টাকা কাটবে'
        correct: true
        why: 'key payment-এর সাথে বাঁধা থাকতে হয়, চেষ্টার সাথে নয়।'
      - text: 'সব exception-এ failed বসানো হচ্ছে, timeout-ও ব্যর্থ গণ্য হচ্ছে'
        correct: true
        why: 'timeout-এর ফল অজানা। এটাকে failed করলে কেটে যাওয়া টাকা আর ধরা পড়ে না।'
      - text: '`timeout` option নেই, তাই কল অনির্দিষ্টকাল ঝুলতে পারে'
        correct: true
        why: 'প্রতিটা বাইরের কলে timeout দেওয়া উচিত, না হলে অ্যাপের worker আটকে থাকে।'
      - text: 'HttpClient দিয়ে POST করাই উচিত নয়'
        correct: false
        why: 'HttpClient ঠিক জিনিসই; সমস্যা key, exception আর timeout-এর ব্যবস্থাপনায়।'
    ref: same-key-retry
  - q: 'Gateway থেকে ৪০২ (প্রত্যাখ্যাত কার্ড) এল, আর আরেকটা কলে ৫০৩ এল। দুই payment-এর কী অবস্থা হবে?'
    hint: '৪xx আর ৫xx — কোনটা চূড়ান্ত "না", কোনটা "এখন পারছি না"?'
    options:
      - text: 'দুটোই failed'
        correct: false
        why: '৫০৩ মানে gateway এখন সাড়া দিতে পারছে না; টাকা কেটেছে কি না বলা যায় না।'
      - text: 'দুটোই pending'
        correct: false
        why: '৪০২ স্পষ্ট প্রত্যাখ্যান, এটাকে pending রাখার কারণ নেই।'
      - text: '৪০২ → failed, ৫০৩ → pending'
        correct: true
        why: 'স্পষ্ট প্রত্যাখ্যান চূড়ান্ত, ৫xx অজানা।'
      - text: '৪০২ → pending, ৫০৩ → failed'
        correct: false
        why: 'ঠিক উল্টো: ৪০২ চূড়ান্ত, ৫০৩ অজানা।'
    ref: same-key-retry
  - q: 'রহিম ঠিক করল payment pending থাকলে কোনো webhook বা query-র অপেক্ষা না করে অ্যাপ নিজেই ১ ঘণ্টা পর "ব্যর্থ" করে দেবে। সমস্যা কী?'
    hint: 'টাকা কি সময় পেরোলেই ফেরত চলে যায়?'
    options:
      - text: 'সময় পেরোলেই টাকা না কাটার প্রমাণ হয় না। gateway-তে কাটা থাকতে পারে'
        correct: true
        why: 'সত্য gateway-র কাছে। timer নয়, gateway-র কাছে জিজ্ঞেস করে ফল জানতে হয়।'
      - text: 'এক ঘণ্টা খুব কম, ২৪ ঘণ্টা দিলেই নিরাপদ'
        correct: false
        why: 'সময় যাই হোক, অনুমান অনুমানই। gateway-র কাছে জিজ্ঞেস না করে ব্যর্থ বলা যাবে না।'
      - text: 'কোনো সমস্যা নেই, এক ঘণ্টা যথেষ্ট'
        correct: false
        why: 'পরে gateway-র খাতায় "সফল" থেকে গেলে ক্রেতার টাকা কাটা, কিন্তু অর্ডার বাতিল।'
    ref: bkash-sms-missing
  - q: 'কোন কোন ব্যবস্থা অনন্তকাল pending থেকে যাওয়া payment আটকাতে সাহায্য করে?'
    hint: 'যেকোনো এক পথ ব্যর্থ হলে বাকিগুলো কী করবে?'
    options:
      - text: 'নিয়মিত sweeper, যা ১৫ মিনিটের বেশি পুরনো pending ধরে আবার query করে'
        correct: true
        why: 'webhook বা পুরনো query হারালে এই sweeper-ই শেষ জাল।'
      - text: 'কোনো pending দেখলেই ৫ মিনিট পর CheckPaymentStatus message রাখা'
        correct: true
        why: 'সময়মতো যাচাই হলে অধিকাংশ payment দ্রুত ঠিক হয়ে যায়।'
      - text: 'শুধু webhook-এর ওপর ভরসা'
        correct: false
        why: 'webhook হারাতে পারে বা অনেক দেরিতে আসতে পারে; একা যথেষ্ট নয়।'
      - text: 'ক্রেতাকে বলা সে নিজেই ব্যাংকে ফোন করুক'
        correct: false
        why: 'সমস্যাটা আমাদের সিস্টেমের, ক্রেতার ঘাড়ে চাপানো সমাধান নয়।'
    ref: resolve-by-asking
  - q: 'Status query-তে gateway "এই reference-ই চিনি না" বলল। সবচেয়ে নিরাপদ পদক্ষেপ কোনটা?'
    hint: 'আবার charge পাঠালে gateway কাকে বোঝে — পুরনো key, নাকি নতুন?'
    options:
      - text: 'নতুন key বানিয়ে আবার charge পাঠানো'
        correct: false
        why: 'আগের কলটা দেরিতে পৌঁছালে নতুন key-র কারণে দুইবার কাজ হবে।'
      - text: 'payment-কে succeeded করে দেওয়া'
        correct: false
        why: 'gateway চেনেই না, তাহলে টাকা কাটা হয়নি। সফল ধরা ভুল।'
      - text: 'আগের একই idempotency key দিয়ে আবার charge পাঠানো'
        correct: true
        why: 'কল পৌঁছে না থাকলে এবার একবার হবে; পৌঁছে থাকলে gateway আগের ফলই দেবে।'
    ref: resolve-by-asking
