          - {id: api, label: 'API', sub: 'ক্যাশিয়ার', icon: api, tone: accent, col: 2, row: 1, tip: 'কাজে হাত দেওয়ার আগে রেজিস্টারে key-টা দেখে নেয় — নতুন হলে কাজ, পুরনো হলে শুধু রসিদ।'}
          - {id: store, label: 'key রেজিস্টার', sub: 'idempotency_key টেবিল', icon: book, col: 4, row: 0, tip: 'কোন key-তে কী উত্তর দেওয়া হয়েছিল তার খাতা। একই key দুইবার এখানে উঠতে পারে না।'}
          - {id: work, label: 'আসল কাজ', sub: 'টাকা পাঠানো', icon: money, col: 4, row: 2, tip: 'যে কাজটা দুইবার হলে ক্ষতি। একটা key-র জন্য এটা ঠিক একবারই চলে।'}
        edges:
          - {from: client, to: api, label: 'Client request-এর সাথে Idempotency-Key পাঠায়'}
          - {from: api, to: store, label: 'সার্ভার রেজিস্টারে key-টা তোলে — নতুন key'}
          - {from: api, to: work, label: 'নতুন বলে আসল কাজটা একবার করে'}
          - {from: api, to: store, label: 'কাজের উত্তরটা key-র পাশে জমা রাখে'}
          - {from: api, to: client, label: 'উত্তর যায় — ধরো পথে হারিয়ে গেল', dashed: true, tone: warn}
          - {from: client, to: api, label: 'Client একই key দিয়ে আবার পাঠায়'}
          - {from: store, to: api, label: 'key চেনা — কাজ না করে জমানো উত্তরটাই ফেরত', dashed: true, tone: good}
      - type: text
        body: |
          যে কাজ একবার করলে যা ফল, দশবার করলেও তা-ই, তাকে বলে **idempotent**। `GET`, `PUT`, `DELETE` স্বভাবতই তেমন; `POST` নয় — তাই `POST`-এ এই key লাগে।
    aside:
      - type: terms
        items:
          - {term: 'Idempotent', meaning: 'যে কাজ একবার করা আর বহুবার করার চূড়ান্ত ফল একই।'}
          - {term: 'Idempotency key', meaning: 'একটা কাজের অনন্য পরিচয়, সাধারণত UUID; client বানায়, header-এ পাঠায়।'}
      - type: remember
        body: 'নতুন কাজ = নতুন key। একই কাজের আবার চেষ্টা = একই key।'
      - type: refs
        items:
          - {to: 'api/error-design', label: 'কোন error-এ retry করা যায়'}
    check:
      q: 'একই idempotency key দিয়ে দ্বিতীয় request এলে সার্ভার কী করে, আর কী করে না?'
      a: 'আসল কাজটা আবার করে না। রেজিস্টার থেকে প্রথমবারের জমানো উত্তরটাই হুবহু ফেরত দেয়।'

  - slug: key-table-and-fingerprint
    title: 'রেজিস্টার বানানো: key, fingerprint আর জমানো উত্তর'
    kind: howto
    tldr: 'একটা টেবিলে (scope, key) unique রেখে request-এর fingerprint আর response জমাও; controller header থেকে key নিয়ে গার্ডকে দেয়।'
    keywords: ['idempotency table', 'request fingerprint', 'unique constraint', 'key storage', 'রেজিস্টার', 'scope']
    blocks:
      - type: text
        body: |
          রেজিস্টারের প্রতি লাইনে চারটা জিনিস: key কার (**scope**), key নিজে, request-এর **fingerprint** (body-র hash — চেকে লেখা অঙ্কের মতো), আর প্রথমবারের উত্তর। `(scope, idem_key)`-র ওপর unique constraint-ই নিশ্চিত করে যে একই চেক নম্বর খাতায় দুইবার উঠবে না।
      - type: code
        lang: php
        file: 'src/Entity/IdempotencyKey.php'
        variant: good
        code: |
          #[ORM\Entity]
          #[ORM\Table(name: 'idempotency_key')]
          #[ORM\UniqueConstraint(name: 'uniq_scope_key', columns: ['scope', 'idem_key'])]
          class IdempotencyKey
          {
              #[ORM\Id, ORM\GeneratedValue, ORM\Column]
              private ?int $id = null;

              #[ORM\Column(length: 80)]
              private string $scope;                  // কার key: 'user:42'

              #[ORM\Column(length: 36)]
              private string $idemKey;                // client-এর পাঠানো UUID

              #[ORM\Column(length: 64)]
              private string $fingerprint;            // request-এর sha256

              #[ORM\Column(nullable: true)]
              private ?int $responseStatus = null;    // কাজ শেষ হলে ভরা হয়

              #[ORM\Column(type: Types::TEXT, nullable: true)]
              private ?string $responseBody = null;

              #[ORM\Column]
              private \DateTimeImmutable $createdAt;  // পুরনো key মোছার জন্য
          }
        marks:
          - {line: 3, tip: 'পুরো ব্যবস্থার মেরুদণ্ড। একই scope-এ একই key-র দ্বিতীয় সারি ডেটাবেস নিজেই ঢুকতে দেবে না — কোড ভুল করলেও।'}
          - {line: 16, tip: 'একই key দিয়ে অন্য অঙ্ক বা অন্য প্রাপক এলে এই hash মিলবে না, আর আমরা request ফিরিয়ে দেব।'}
      - type: code
        lang: php
        file: 'src/Controller/TransferController.php'
        variant: good
        code: |
          #[Route('/api/transfers', methods: ['POST'])]
          #[IsGranted('ROLE_USER')]
          public function create(
              #[MapRequestPayload] TransferRequest $dto,
              Request $request,
              IdempotencyGuard $guard,
              TransferService $transfers,
          ): JsonResponse {
              $key = (string) $request->headers->get('Idempotency-Key');
              if (!Uuid::isValid($key)) {
                  throw new BadRequestHttpException('Idempotency-Key header-এ একটা UUID লাগবে');
              }

              $hash = hash('sha256', implode('|', [
                  $request->getMethod(), $request->getPathInfo(), $request->getContent(),
              ]));

              return $guard->run(
                  scope: 'user:'.$this->getUser()->getUserIdentifier(),
                  key: $key,
                  hash: $hash,
                  work: fn () => $this->json($transfers->send($dto), 201),
              );
          }
        marks:
          - {line: 10, tip: 'key ছাড়া টাকা সরানোর request নেওয়াই হবে না। header বাধ্যতামূলক করলে কোনো client ভুলে key বাদ দিতে পারে না।'}
          - {line: 14, tip: 'fingerprint: method, path আর raw body-র hash। একই retry হুবহু একই byte পাঠায়, তাই hash মিলে যায়।'}
          - {line: 22, tip: 'আসল কাজটা একটা closure। গার্ড ঠিক করবে এটা চালাবে, নাকি জমানো উত্তর ফেরত দেবে।'}
    aside:
      - type: tips
        items:
          - 'key অন্তত ২৪ ঘণ্টা রাখো — client-এর retry যত দিন চলতে পারে তার চেয়ে বেশি। তারপর `created_at` দেখে পুরনো সারি মোছার job চালাও।'
          - 'scope-এ user id রাখো। নইলে একজনের key অন্যজনের জমানো উত্তর ফেরত দিয়ে ফেলতে পারে।'
      - type: terms
        items:
          - {term: 'Fingerprint', meaning: 'request-এর বিষয়বস্তুর hash; একই key-তে ভিন্ন request এলে ধরিয়ে দেয়।'}
          - {term: 'Scope', meaning: 'key-টা কার — সাধারণত লগইন করা user বা API client।'}
    check:
      q: 'টেবিলে fingerprint কলামটা না রাখলে কোন ভুলটা ধরা পড়বে না?'
      a: 'একই key দিয়ে ভিন্ন request (যেমন ৫০০-র জায়গায় ৫০০০ টাকা) এলে সার্ভার বুঝবে না, আর পুরনো ৫০০ টাকার উত্তরটাই "সফল" বলে ফেরত দেবে।'

  - slug: claim-run-replay
    title: 'দাবি করো, কাজ করো, উত্তর জমাও — এক transaction-এ'
    kind: howto
    tldr: 'key-র সারি INSERT, আসল কাজ আর উত্তর জমানো একই transaction-এ; INSERT-এ ০ সারি মানে কাজ না করে জমানো উত্তর replay।'
    keywords: ['replay response', 'ON CONFLICT DO NOTHING', 'concurrency', 'atomic claim', 'একসাথে দুই request', 'transaction']
    blocks:
      - type: text
        body: |
          গার্ডের কাজ তিন ধাপ, আর তিনটাই **একই transaction**-এ: key-র সারি ঢোকাও, আসল কাজ চালাও, উত্তরটা সারিতে লিখে রাখো। মাঝপথে কিছু ভাঙলে তিনটাই একসাথে rollback হয় — key-ও মুছে যায়, তাই client নিশ্চিন্তে আবার চেষ্টা করতে পারে। একই key একসাথে দুইবার এলে unique constraint দ্বিতীয়টাকে অপেক্ষা করায়, তারপর সে শুধু জমানো উত্তরটা পায়।
      - type: code
        lang: php
        file: 'src/Idempotency/IdempotencyGuard.php'
        variant: good
        code: |
          final readonly class IdempotencyGuard
          {
              public function __construct(private Connection $db) {}

              /** @param \Closure(): JsonResponse $work */
              public function run(string $scope, string $key, string $hash, \Closure $work): JsonResponse
              {
                  return $this->db->transactional(function () use ($scope, $key, $hash, $work) {
                      $claimed = $this->db->executeStatement(
                          'INSERT INTO idempotency_key (scope, idem_key, fingerprint, created_at)
                           VALUES (?, ?, ?, now()) ON CONFLICT (scope, idem_key) DO NOTHING',
                          [$scope, $key, $hash],
                      );
                      if (0 === $claimed) {
                          return $this->replay($scope, $key, $hash);   // key আগেই এসেছে
                      }
                      $response = $work();                             // আসল কাজ, একবারই
                      $this->db->update('idempotency_key', [
                          'response_status' => $response->getStatusCode(),
                          'response_body' => $response->getContent(),
                      ], ['scope' => $scope, 'idem_key' => $key]);
                      return $response;
                  });
              }

              private function replay(string $scope, string $key, string $hash): JsonResponse
              {
                  $row = $this->db->fetchAssociative('SELECT fingerprint, response_status, response_body
                      FROM idempotency_key WHERE scope = ? AND idem_key = ?', [$scope, $key]);
                  if (!hash_equals($row['fingerprint'], $hash)) {
                      throw new UnprocessableEntityHttpException('একই key, কিন্তু request আলাদা');
                  }
                  return JsonResponse::fromJsonString(
                      $row['response_body'], (int) $row['response_status']);
              }
          }
        marks:
          - {line: 8, tip: 'এই closure-এর ভেতরের সবকিছু এক transaction। exception উঠলে key-র সারিসহ সব rollback হয়।'}
          - {line: 11, tip: 'আগে SELECT করে দেখা নয় — সরাসরি INSERT। একই key অন্য চলমান transaction-এ থাকলে ডেটাবেস এখানে অপেক্ষা করায়, তারপর ০ সারি ফেরত দেয়।'}
          - {line: 14, tip: '০ সারি মানে এই key-র কাজ অন্য কেউ আগেই শেষ করেছে। আসল কাজে আর হাত দেওয়া হবে না।'}
          - {line: 30, tip: 'একই চেক নম্বরে অঙ্ক বদলে আনলে ব্যাংক ফিরিয়ে দেয়। এখানে সেটা 422 — client-এর কোডে bug আছে, তাকে জানানো দরকার।'}
