  - slug: new-key-every-retry
    title: 'প্রতি চেষ্টায় নতুন key — সবচেয়ে পরিচিত ভুল'
    kind: pitfall
    tldr: 'Key বাঁধা থাকে ব্যবহারকারীর ইচ্ছার সাথে, চেষ্টার সাথে নয়: retry-তে একই key, ফর্ম বদলালে নতুন key।'
    keywords: ['client retry', 'crypto.randomUUID', 'Vue', 'double click', 'একই key', 'ফ্রন্টএন্ড']
    blocks:
      - type: text
        body: |
          সার্ভার যত নিখুঁতই হোক, client প্রতি ক্লিকে নতুন key বানালে প্রতিটা retry সার্ভারের চোখে নতুন চেক — আবার টাকা কাটবে। Key বাঁধা থাকবে ব্যবহারকারীর **ইচ্ছার** সাথে: "করিমকে ৫০০ টাকা" একটাই ইচ্ছা, যতবারই বাটন চাপা হোক। প্রাপক বা অঙ্ক বদলালে সেটা নতুন ইচ্ছা, তখন নতুন key।
      - type: code
        lang: ts
        file: 'src/components/SendMoney.vue (ভুল)'
        variant: bad
        code: |
          async function send(): Promise<void> {
            await fetch('/api/transfers', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Idempotency-Key': crypto.randomUUID(),   // প্রতি চেষ্টায় নতুন চেক!
              },
              body: JSON.stringify({ to: props.to, amount: props.amount }),
            })
          }
        marks:
          - {line: 6, tip: 'key তৈরি হচ্ছে পাঠানোর মুহূর্তে। তাই দ্বিতীয় ক্লিক বা retry-তে সার্ভার সম্পূর্ণ নতুন key দেখে আর আবার কাজ করে।'}
      - type: code
        lang: vue
        file: 'src/components/SendMoney.vue'
        variant: good
        code: |
          <script setup lang="ts">
          import { ref, watch } from 'vue'

          const props = defineProps<{ to: string; amount: number }>()
          const sending = ref(false)
          const message = ref('')
          let key = crypto.randomUUID()                  // এই ইচ্ছার জন্য একটাই key

          watch(() => [props.to, props.amount], () => {  // ফর্ম বদলাল = নতুন ইচ্ছা
            key = crypto.randomUUID()
          })

          async function send(): Promise<void> {
            if (sending.value) return
            sending.value = true
            try {
              const res = await fetch('/api/transfers', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Idempotency-Key': key },
                body: JSON.stringify({ to: props.to, amount: props.amount }),
              })
              if (res.status >= 500) throw new Error('server error')
              message.value = res.ok ? 'টাকা পাঠানো হয়েছে' : 'পাঠানো যায়নি'
              key = crypto.randomUUID()                  // চূড়ান্ত উত্তর এসেছে
            } catch {
              message.value = 'নিশ্চিত হওয়া যায়নি। আবার চাপো — টাকা দুইবার কাটবে না।'
            } finally {
              sending.value = false
            }
          }
          </script>

          <template>
            <button :disabled="sending" @click="send">টাকা পাঠাও</button>
            <p>{{ message }}</p>
          </template>
        marks:
          - {line: 7, tip: 'key তৈরি হয় ফর্ম খোলার সময়, একবার। এরপর যতবার send() চলুক, একই key যায়।'}
          - {line: 9, tip: 'প্রাপক বা অঙ্ক বদলালে পুরনো key রাখলে fingerprint মিলবে না, সার্ভার 422 দেবে। তাই নতুন ইচ্ছায় নতুন key।'}
          - {line: 24, tip: 'সার্ভার স্পষ্ট হ্যাঁ বা না বলেছে, কাজটার ফয়সালা হয়ে গেছে। পরের লেনদেন যেন নতুন key পায়।'}
          - {line: 25, tip: 'network error বা 5xx মানে "জানি না"। key অপরিবর্তিত থাকে, তাই আবার চাপলে সার্ভার একই কাজ বলে চিনবে।'}
    aside:
      - type: tips
        items:
          - 'বাটন disable করা ভালো অভ্যাস, কিন্তু যথেষ্ট নয় — পাতা refresh, দুই ট্যাব বা auto-retry আটকায় শুধু সার্ভারের key-চেক।'
          - '`crypto.randomUUID()` শুধু HTTPS বা localhost-এ চলে।'
          - 'পাতা reload-এর পরেও একই কাজ চালিয়ে যেতে চাইলে key-টা `sessionStorage`-এ রাখো।'
      - type: remember
        body: 'Key বানাও ফর্ম খোলার সময়, পাঠানোর সময় নয়।'
    check:
      q: 'ব্যবহারকারী অঙ্ক ৫০০ থেকে ৭০০ করে আবার "পাঠাও" চাপল। key কি একই থাকবে? কেন?'
      a: 'না, নতুন key। অঙ্ক বদলানো মানে নতুন ইচ্ছা। পুরনো key রাখলে fingerprint মিলত না, আর সার্ভার 422 দিয়ে ফিরিয়ে দিত।'

