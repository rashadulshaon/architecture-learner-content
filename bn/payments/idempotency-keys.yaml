slides:
  - slug: double-charge
    title: 'একবার চাপল, দুইবার টাকা কাটল'
    kind: story
    tldr: 'উত্তর পথে হারালে client আবার পাঠায়; সার্ভার দুই request আলাদা করে চিনতে না পারলে একই লেনদেন দুইবার ঘটে।'
    keywords: ['double charge', 'duplicate request', 'retry', 'দুইবার টাকা কাটা', 'ডাবল পেমেন্ট']
    blocks:
      - type: text
        body: |
          রহিমা অ্যাপে করিমকে ৫০০ টাকা পাঠাতে "পাঠাও" চাপল। সার্ভার টাকা কাটল, কিন্তু উত্তরটা ফেরার পথে নেটওয়ার্কে হারিয়ে গেল। রহিমা দেখল শুধু একটা ঘুরন্ত চাকা, তাই আবার চাপল। সার্ভারের চোখে এটা একদম নতুন request — সে আবার ৫০০ টাকা কাটল।
      - type: visual
        kind: sequence
        caption: 'একটা ইচ্ছা, দুইটা request, দুইবার টাকা কাটা'
        actors:
          - {id: rahima, label: 'রহিমার ফোন', icon: mobile, tip: 'রহিমা একবারই ৫০০ টাকা পাঠাতে চায়। উত্তর না পেয়ে সে আবার চাপে।'}
          - {id: api, label: 'সার্ভার', icon: api, tip: 'প্রতিটা POST-কে নতুন কাজ ধরে নেয় — আগেরটার সাথে মেলানোর কোনো চিহ্ন তার কাছে নেই।'}
          - {id: db, label: 'ডেটাবেস', icon: db, tip: 'সার্ভার যা বলে তা-ই করে; একই লেনদেন দুইবার এলে দুইবারই লেখে।'}
        messages:
          - {from: rahima, to: api, label: 'POST /transfers — ৫০০ টাকা'}
          - {from: api, to: db, label: 'ব্যালেন্স থেকে ৫০০ কাটো'}
          - {from: api, to: rahima, label: 'সফল (উত্তরটা পথে হারাল)', dashed: true, tone: bad, tip: 'কাজ হয়ে গেছে, কিন্তু খবরটা রহিমার কাছে পৌঁছায়নি। রহিমার দিক থেকে এটা "কিছুই হয়নি"-র মতো দেখায়।'}
          - {at: rahima, note: 'উত্তর নেই — আবার চাপল', tone: warn}
          - {from: rahima, to: api, label: 'POST /transfers — ৫০০ টাকা'}
          - {from: api, to: db, label: 'আবার ৫০০ কাটো', tone: bad, tip: 'সার্ভার জানে না এটা আগের কাজেরই দ্বিতীয় চেষ্টা।'}
          - {at: db, note: 'মোট কাটা গেল ১০০০ টাকা', tone: bad, tip: 'রহিমা চেয়েছিল ৫০০ পাঠাতে। কারো কোডে কোনো exception হয়নি, তবু হিসাব ভুল।'}
      - type: quote
        body: 'যে request একবার পাঠাও, তা দুইবারও পৌঁছাতে পারে। প্রতিটা write এমন বানাও যেন দুইবার এলেও একবারই ঘটে।'
    aside:
      - type: story
        title: 'কে কে আবার পাঠায়?'
        body: |
          শুধু অধৈর্য আঙুল নয়। মোবাইল অ্যাপের auto-retry, load balancer, queue-র worker, payment gateway-র webhook — সবাই উত্তর না পেলে আবার পাঠায়। তাই duplicate request কোনো ব্যতিক্রম নয়, রোজকার ঘটনা।
      - type: terms
        items:
          - {term: 'Retry', meaning: 'উত্তর না পেয়ে একই request আবার পাঠানো।'}
          - {term: 'Duplicate request', meaning: 'একই কাজের request, যা সার্ভারে একাধিকবার পৌঁছেছে।'}
    check:
      q: 'সার্ভার তো টাকা ঠিকই কেটেছিল — তবু দ্বিতীয়বার কাটল কেন?'
      a: 'উত্তর হারিয়ে যাওয়ায় রহিমা জানতেই পারেনি কাজ হয়েছে, তাই আবার পাঠিয়েছে। আর সার্ভারের কাছে দুই request-কে একই কাজ বলে চেনার কোনো চিহ্ন ছিল না।'

  - slug: cheque-number
    title: 'চেকের নম্বর: একই চেক দুইবার ভাঙানো যায় না'
    kind: concept
    tldr: 'Client প্রতিটা কাজের সাথে একটা অনন্য key পাঠায়; সার্ভার key টুকে রাখে, আর একই key আবার এলে আগের উত্তরটাই ফেরত দেয়।'
    keywords: ['idempotency key', 'idempotent', 'Idempotency-Key header', 'চেক নম্বর', 'একবারই ঘটে']
    blocks:
      - type: metaphor
        icon: bank
        title: 'ব্যাংকের চেক বই'
        body: |
          চেক বইয়ের প্রতিটা পাতায় আলাদা নম্বর ছাপা থাকে। ব্যাংক টাকা দেওয়ার সময় নম্বরটা রেজিস্টারে টুকে রাখে। একই চেক আবার কাউন্টারে এলে ক্যাশিয়ার নতুন করে টাকা দেন না — রেজিস্টার দেখে বলেন, "এটা তো আগেই দেওয়া হয়েছে, এই যে রসিদ।" **Idempotency key** হলো request-এর সেই চেক নম্বর।
      - type: visual
        kind: flow
        caption: 'প্রথমবার কাজ হয়, দ্বিতীয়বার শুধু জমানো উত্তর ফেরে'
        nodes:
