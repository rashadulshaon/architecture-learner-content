flashcards:
  - q: 'Idempotent operation কাকে বলে?'
    a: 'যে কাজ একবার করা আর একই কাজ বারবার করার চূড়ান্ত ফল একই।'
    more: |
      `status = 'paid'` বসানো idempotent — দশবার বসালেও status একই থাকে। `balance = balance - 500` idempotent নয় — প্রতিবার আরও কমে। নেটওয়ার্কে request দুইবার পৌঁছানো স্বাভাবিক ঘটনা, তাই প্রতিটা write-কে idempotent বানানোই লক্ষ্য।
    ref: cheque-number
  - q: 'Idempotency key কী, আর কে বানায়?'
    a: 'একটা কাজের অনন্য পরিচয় (সাধারণত UUID)। Client বানায় আর `Idempotency-Key` header-এ পাঠায়।'
    more: |
      এটা চেকের নম্বরের মতো। সার্ভার key-টা টুকে রাখে, আর একই key আবার এলে বোঝে এটা নতুন কাজ নয়, আগের কাজেরই আরেক চেষ্টা। key সার্ভার বানালে চলবে না — কারণ উত্তর হারিয়ে গেলে client সেই key জানতেই পারবে না।
    ref: cheque-number
  - q: 'একই idempotency key দিয়ে request আবার এলে সার্ভার কী ফেরত দেয়?'
    a: 'কাজটা আবার না করে প্রথমবারের জমানো status code আর body হুবহু ফেরত দেয়।'
    more: |
      একে বলে response replay। Client-এর দিক থেকে মনে হয় request-টা এইমাত্র সফল হলো, অথচ সার্ভারে আসল কাজ একবারই হয়েছে। এজন্য key-র সারিতে প্রথম উত্তরের status আর body জমা রাখতে হয়।
    ref: claim-run-replay
  - q: 'Request fingerprint কেন জমা রাখা হয়?'
    a: 'একই key দিয়ে ভিন্ন request (অন্য অঙ্ক বা প্রাপক) এলে ধরার জন্য; তখন 422 দিয়ে ফিরিয়ে দেওয়া হয়।'
    more: |
      Fingerprint হলো method, path আর body-র hash। এটা না থাকলে client-এর bug-এ একই key দিয়ে ৫০০০ টাকার request এলে সার্ভার পুরনো ৫০০ টাকার "সফল" উত্তর ফেরত দিত, আর client ভাবত ৫০০০ টাকা চলে গেছে।
    ref: key-table-and-fingerprint
  - q: 'একই key-র দুইটা request একসাথে এলে কোন জিনিসটা কাজ দুইবার হওয়া ঠেকায়?'
    a: '`(scope, key)`-র ওপর unique constraint: একটাই INSERT সফল হয়; অন্যটা অপেক্ষা করে জমানো উত্তর পায়।'
    more: |
      আগে SELECT করে "key নেই" দেখে পরে INSERT করলে দুই request-ই "নেই" দেখে ফেলে। তাই সরাসরি `INSERT … ON CONFLICT DO NOTHING` করা হয়: ১ সারি ঢুকলে তুমি মালিক, ০ সারি হলে অন্য কেউ আগেই করেছে। বিস্তারিত: [[concurrency/atomic-operations|atomic operation]]।
    ref: claim-run-replay
  - q: 'Idempotency key-র সারি আর আসল কাজ একই transaction-এ রাখা হয় কেন?'
    a: 'কাজ ভাঙলে key-ও rollback হয়, তাই retry আবার চেষ্টা করতে পারে; কাজ সফল হলে key আর উত্তর একসাথে টেকে।'
    more: |
      key আগে আলাদা করে commit করলে, কাজ মাঝপথে ভাঙার পর key-টা উত্তর ছাড়াই পড়ে থাকে। তখন retry দেখে "key আছে", অথচ কাজ হয়নি — লেনদেনটা চিরকালের জন্য আটকে যায়। এক transaction-এ রাখলে এই মাঝামাঝি অবস্থাটা তৈরিই হয় না।
    ref: claim-run-replay
  - q: 'Client কখন নতুন idempotency key বানাবে, কখন পুরনোটা রাখবে?'
    a: 'নতুন কাজ বা বদলানো ফর্মে নতুন key। একই কাজের retry-তে (timeout, network error, 5xx) পুরনো key।'
    more: |
      Key বাঁধা থাকে ব্যবহারকারীর ইচ্ছার সাথে, চেষ্টার সাথে নয়। সবচেয়ে পরিচিত ভুল হলো `fetch`-এর ভেতরেই `crypto.randomUUID()` ডাকা — তাতে প্রতিটা retry নতুন key পায় আর সার্ভারের সব সুরক্ষা অকেজো হয়ে যায়।
    ref: new-key-every-retry
  - q: 'Idempotency key কত দিন জমা রাখা উচিত?'
    a: 'অন্তত ২৪ ঘণ্টা — client-এর retry যত দিন চলতে পারে তার চেয়ে বেশি। তারপর পুরনো সারি মুছে ফেলো।'
    more: |
      খুব তাড়াতাড়ি মুছলে দেরিতে আসা retry নতুন কাজ হিসেবে চলে যাবে। চিরকাল রাখলে টেবিল অকারণে বড় হবে। `created_at` কলাম দেখে একটা নিয়মিত cleanup job পুরনো সারি সরায়।
    ref: key-table-and-fingerprint
  - q: 'কোন HTTP method-গুলো স্বভাবতই idempotent, আর কোনটায় idempotency key লাগে?'
    a: '`GET`, `PUT`, `DELETE` স্বভাবতই idempotent। `POST` নয় — তাই `POST`-এ key লাগে।'
    more: |
      `PUT` পুরো মান বসায়, `DELETE` মুছে ফেলে — দ্বিতীয়বার করলেও অবস্থা একই থাকে। `POST` প্রতিবার নতুন কিছু তৈরি করে। `PATCH` নির্ভর করে কী করছ তার ওপর: "মান বসাও" নিরাপদ, "বাড়াও" নিরাপদ নয়।
    ref: cheque-number

quiz:
  - q: 'রহিমার অ্যাপে ধীর নেটওয়ার্কে "পাঠাও" দুইবার চাপলে টাকা দুইবার কাটে। কোন সমাধানটা সমস্যার গোড়ায় হাত দেয়?'
    hint: 'পাতা refresh করলে বা মোবাইল অ্যাপ নিজে থেকে retry করলেও কি সমাধানটা টিকবে?'
    options:
      - text: 'প্রথম ক্লিকের পর বাটন disable করে দেওয়া'
        correct: false
        why: 'ভালো অভ্যাস, কিন্তু refresh, দ্বিতীয় ট্যাব বা auto-retry-কে আটকায় না। সার্ভার এখনো দুই request আলাদা করে চিনতে পারে না।'
      - text: 'Client একটা idempotency key পাঠাবে, সার্ভার key চিনে একই key-তে আগের উত্তর ফেরত দেবে'
        correct: true
        why: 'request যে পথেই দুইবার আসুক, সার্ভার বুঝবে এটা একই কাজ — আর কাজটা একবারই করবে।'
      - text: 'সার্ভারের timeout বাড়িয়ে ৬০ সেকেন্ড করা'
        correct: false
        why: 'উত্তর পথে হারিয়ে গেলে timeout যতই বড় হোক, client জানবে না কাজ হয়েছে কি না।'
      - text: 'এক মিনিটের মধ্যে একই অঙ্কের দ্বিতীয় লেনদেন আটকে দেওয়া'
        correct: false
        why: 'অনুমাননির্ভর: কেউ সত্যিই একই অঙ্ক দুইবার পাঠাতে চাইলে আটকে যাবে, আর এক মিনিট পরের retry পার পেয়ে যাবে।'
    ref: cheque-number
  - q: 'নিচের গার্ড কোডে কী কী সমস্যা আছে?'
    lang: php
    code: |
      if ($keys->findOneBy(['idemKey' => $key])) {
          return $this->replay($key);
      }

      $response = $work();          // ভেতরে নিজের flush() আছে

      $keys->save(new IdempotencyKey($key, $response));

      return $response;
    hint: 'দুইটা জায়গা খেয়াল করো: দেখা আর লেখার মাঝের ফাঁক, আর কাজ ও key জমার মাঝের ফাঁক।'
    options:
      - text: 'একই key-র দুই request একসাথে এলে দুজনেই "key নেই" দেখে কাজ চালাবে'
        correct: true
        why: 'দেখা (SELECT) আর লেখা (INSERT) আলাদা ধাপ। মাঝের ফাঁকে দ্বিতীয় request ঢুকে পড়ে — সমাধান unique constraint-সহ সরাসরি INSERT।'
      - text: 'কাজ শেষ হওয়ার পর, key জমার আগে crash করলে retry আবার পুরো কাজ করবে'
        correct: true
        why: 'কাজ আর key আলাদা transaction-এ commit হচ্ছে। দুটো একই transaction-এ না থাকলে মাঝখানে এই ফাঁক থাকবেই।'
      - text: 'findOneBy() ধীর; find() ব্যবহার করলেই ঠিক হয়ে যাবে'
        correct: false
        why: 'গতি এখানে সমস্যা নয়। যত দ্রুতই খোঁজো, দেখা আর লেখার মাঝের ফাঁক থেকেই যায়।'
      - text: 'key হিসেবে UUID না নিয়ে auto-increment সংখ্যা নেওয়া উচিত ছিল'
        correct: false
        why: 'key বানায় client, আর তাকে সার্ভারের সাহায্য ছাড়াই অনন্য মান বানাতে হয় — UUID ঠিক সেজন্যই।'
    ref: claim-run-replay
  - q: 'একই idempotency key দিয়ে প্রথমে এল ৫০০ টাকার request, কিছুক্ষণ পর এল ৫০০০ টাকার request। সার্ভারের কী করা উচিত?'
    hint: 'একই চেক নম্বরে অঙ্ক বদলে আনলে ব্যাংক কী করে?'
    options:
      - text: 'পুরনো ৫০০ টাকার জমানো উত্তরটাই ফেরত দেওয়া'
        correct: false
        why: 'client তখন ভাববে ৫০০০ টাকা সফলভাবে গেছে, অথচ গেছে ৫০০। ভুলটা চাপা পড়ে যাবে।'
      - text: 'নতুন request ধরে ৫০০০ টাকা পাঠিয়ে দেওয়া'
        correct: false
        why: 'তাহলে key-র আর কোনো মানে থাকে না — একই key-তে দুইটা আলাদা লেনদেন হয়ে গেল।'
      - text: 'fingerprint মেলেনি বলে 422 দিয়ে ফিরিয়ে দেওয়া'
        correct: true
        why: 'একই key-তে ভিন্ন request মানে client-এর কোডে bug। স্পষ্ট error দিলে তবেই সেটা ধরা পড়বে।'
      - text: 'চুপচাপ 200 দিয়ে request-টা উপেক্ষা করা'
        correct: false
        why: '200 মানে "কাজ হয়েছে"। কিছু না করে 200 দেওয়া client-কে মিথ্যা বলা।'
    ref: key-table-and-fingerprint
  - q: 'Vue অ্যাপ টাকা পাঠানোর request দিল, ১০ সেকেন্ডেও উত্তর এল না (timeout)। এরপর client-এর সঠিক আচরণ কোনটা?'
    hint: 'টাকা গেছে কি যায়নি — client কি এই মুহূর্তে তা জানে?'
    options:
      - text: 'নতুন key বানিয়ে আবার পাঠানো'
        correct: false
        why: 'প্রথম request সফল হয়ে থাকলে নতুন key-র request দ্বিতীয়বার টাকা কাটবে।'
      - text: 'একই key দিয়ে আবার পাঠানো'
        correct: true
        why: 'প্রথমটা হয়ে থাকলে জমানো উত্তর ফিরবে, না হয়ে থাকলে এবার একবার হবে — দুই ক্ষেত্রেই নিরাপদ।'
      - text: '"ব্যর্থ হয়েছে" দেখিয়ে থেমে যাওয়া'
        correct: false
        why: 'timeout মানে ব্যর্থ নয়, মানে "জানি না"। টাকা হয়তো চলে গেছে, আর ব্যবহারকারী ভুল তথ্য পাচ্ছে।'
      - text: '"সফল হয়েছে" ধরে নিয়ে পরের পাতায় চলে যাওয়া'
        correct: false
        why: 'request হয়তো সার্ভারে পৌঁছায়ইনি। না জেনে সফল দেখানোও সমান ভুল।'
    ref: new-key-every-retry
  - q: 'নিচের কোন write-গুলো idempotency key ছাড়াই দুইবার চললে নিরাপদ?'
    hint: 'কোনগুলো "এই মান বসাও" ধরনের, আর কোনগুলো "আরেকটা যোগ করো" ধরনের?'
    options:
      - text: 'PUT /users/7 — পুরো প্রোফাইল নতুন মান দিয়ে বসানো'
        correct: true
        why: 'একই মান দুইবার বসালে প্রোফাইল একই থাকে।'
      - text: 'UPDATE orders SET status = ''paid'' WHERE id = 9'
        correct: true
        why: 'status আগে থেকেই paid থাকলে আবার paid বসালে কিছু বদলায় না।'
      - text: 'POST /transfers — নতুন একটা লেনদেন তৈরি'
        correct: false
        why: 'প্রতিবার নতুন লেনদেন তৈরি হয়; দুইবার এলে দুইবার টাকা যায়।'
      - text: 'UPDATE wallet SET balance = balance + 100'
        correct: false
        why: 'প্রতিবার চললে আরও ১০০ যোগ হয় — এটা "বাড়াও" ধরনের write।'
      - text: 'DELETE /cart/items/5'
        correct: true
        why: 'জিনিসটা একবার মুছে গেলে দ্বিতীয়বার মোছার চেষ্টায় অবস্থা একই থাকে (বড়জোর 404 আসে)।'
    ref: every-write-repeatable
  - q: 'IdempotencyGuard-এ key-র সারি, টাকা পাঠানো আর উত্তর জমানো এক transaction-এ। টাকা পাঠানোর মাঝখানে exception উঠল। এরপর একই key-র retry কী পাবে?'
    hint: 'rollback হলে key-র সারিটার কী হয়?'
    options:
      - text: 'জমানো "সফল" উত্তর, যদিও টাকা যায়নি'
        correct: false
        why: 'উত্তর জমার আগেই সব rollback হয়েছে; জমানো কোনো উত্তরই নেই।'
      - text: 'চিরকাল "key ব্যবহৃত" error'
        correct: false
        why: 'এটা হতো যদি key আলাদা transaction-এ আগে commit করা হতো। এখানে key-ও rollback হয়ে গেছে।'
      - text: 'নতুন করে পুরো কাজটা চলবে, কারণ key-র সারিও rollback হয়ে গেছে'
        correct: true
        why: 'এক transaction-এ থাকার সুবিধা এটাই: কাজ না হলে key-ও থাকে না, তাই retry পরিষ্কার অবস্থা থেকে শুরু করে।'
    ref: claim-run-replay
  - q: 'idempotency টেবিলে scope (যেমন user id) না রেখে শুধু key-র ওপর unique constraint দিলে কী ঝুঁকি?'
    hint: 'দুজন আলাদা ব্যবহারকারী একই key পাঠালে কী হবে?'
    options:
      - text: 'একজনের key অন্যজনের সাথে মিলে গেলে সে অন্যের জমানো উত্তর পেয়ে যেতে পারে'
