      - slug: event-sourcing
        title: {en: 'Event sourcing and CQRS', bn: 'Event sourcing ও CQRS'}
        scope: "Event sourcing and CQRS in depth: when it is worth it, event store, snapshots, replay, projections, eventual consistency of read models, the schema-evolution (upcasting) cost."

  - slug: scaling
    code: 'M'
    title:
      en: 'Scaling Distributed Systems'
      bn: 'ডিস্ট্রিবিউটেড সিস্টেম স্কেলিং'
    icon: graph
    summary:
      en: 'What breaks when your users grow tenfold? Find the real bottleneck and scale the right part.'
      bn: 'ব্যবহারকারী দশ গুণ হলে কী ভাঙবে? আসল bottleneck খোঁজা আর ঠিক জায়গায় স্কেল করা।'
    segments:
      - slug: load-latency
        title: {en: 'Load, latency and bottlenecks', bn: 'Load, latency ও bottleneck'}
        scope: "Load, latency percentiles (p50/p95/p99, tail latency), throughput, Little's Law, finding the actual bottleneck before scaling."
      - slug: horizontal-vertical
        title: {en: 'Vertical vs horizontal scaling', bn: 'Vertical বনাম horizontal scaling'}
        scope: 'Vertical vs horizontal scaling, what must be true to scale horizontally, autoscaling and its lag, scaling the database last.'
      - slug: load-balancing
        title: {en: 'Load balancing and removing SPOFs', bn: 'Load balancing ও SPOF দূর করা'}
