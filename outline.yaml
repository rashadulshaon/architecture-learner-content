      - slug: sagas
        title: {en: 'Sagas: step by step, and back on failure', bn: 'Saga: ধাপে ধাপে, ভুল হলে উল্টো পথে'}
        scope: 'Sagas: orchestration vs choreography, compensating actions, timeouts, saga state persistence, semantic (not real) rollback.'
      - slug: refunds-reversals
        title: {en: 'Refunds, reversals and partial work', bn: 'Refund, reversal ও আংশিক কাজ'}
