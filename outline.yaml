      en: 'Resilience'
      bn: 'রেজিলিয়েন্স'
    icon: heart
    summary:
      en: 'Something will always break. Keep the damage contained and keep the system limping along.'
      bn: 'কিছু না কিছু ভাঙবেই। ভাঙন যেন ছড়িয়ে না পড়ে, আর সিস্টেম যেন খুঁড়িয়ে হলেও চলে।'
    segments:
      - slug: containing-failure
