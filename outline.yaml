# Master outline of Easy Architecture.
# Every segment listed here has one content file: content/<topic-slug>/<segment-slug>.yaml
# "scope" is a note for content authors only; it is never shown to learners.

topics:
  - slug: start
    code: '00'
    title: 'শুরুর কথা'
    titleEn: 'Start Here'
    icon: compass
    summary: 'CRUD বানাতে পারো, এরপর কী? এই প্ল্যাটফর্ম কীভাবে কাজে লাগাবে আর আর্কিটেকচার আসলে কী — পাঁচ মিনিটে।'
    segments:
      - slug: how-to-learn
        title: 'এখানে কীভাবে শিখবে'
        scope: 'How the platform works: slides, flashcards, quiz, bookmarks; the learning method (small chunks, recall, spaced repetition).'
      - slug: crud-to-architecture
        title: 'CRUD-এর পরে কী?'
        scope: 'Why a working CRUD app breaks in production over time; what architecture is; the map of all topics.'

  - slug: thinking
    code: 'A'
    title: 'আর্কিটেক্টের মতো ভাবা'
    titleEn: 'Architectural Thinking'
    icon: lightbulb
    summary: 'কোন সিদ্ধান্ত বদলানো কঠিন, কোনটা সহজ — আর কীভাবে trade-off মেপে সিদ্ধান্ত নিতে হয়।'
    segments:
      - slug: what-is-architectural
        title: 'কোন সিদ্ধান্তটা আর্কিটেকচারাল?'
        scope: 'Recognizing what counts as architectural: the decisions that are expensive to change (database choice, service boundaries, public API contracts, data model) vs. cheap details.'
      - slug: reversible-decisions
        title: 'ফেরার দরজা আছে, না নেই?'
        scope: 'Reversible vs irreversible decisions (two-way vs one-way doors): decide fast on the first, slowly on the second; how to make a one-way door two-way (interfaces, feature flags, abstraction).'
      - slug: tech-debt
        title: 'টেক ডেট: জেনেশুনে ধার নেওয়া'
        scope: 'Cruft vs speed: taking on debt deliberately with a repayment plan; deliberate vs accidental debt; tracking and paying it down (debt register, boy-scout rule, budget per sprint).'
      - slug: monolith-microservices
        title: 'মনোলিথ, মডুলার মনোলিথ, মাইক্রোসার্ভিস'
        scope: 'Monolith vs modular monolith vs microservices, the real costs of microservices, where to draw boundaries (by business capability, by data ownership), start with a modular monolith in Symfony.'
      - slug: layering-legacy
        title: 'লেয়ার, লিগ্যাসি আর ধীরে ধীরে বদল'
        scope: 'Layering (controller/service/repository, dependency direction), living with legacy systems, strangler-fig migration step by step, anti-corruption layer.'
      - slug: serverless-stateless
        title: 'স্টেটলেস ও সার্ভারলেস'
        scope: 'Stateless design (no local session/files, state in DB/Redis/object storage) and why it enables scaling; serverless: what it is, cold starts, when it fits and when it does not.'
      - slug: quality-attributes
        title: 'কোয়ালিটি অ্যাট্রিবিউট ও trade-off'
        scope: 'Quality attributes (performance, availability, security, maintainability, cost), how they trade off against each other, how to turn vague wishes into measurable requirements.'
      - slug: estimation
        title: 'খাতার পাতায় হিসাব'
        scope: 'Back-of-envelope estimation: QPS, storage, bandwidth, memory, cost; useful numbers to memorise; a fully worked example.'
      - slug: build-vs-buy
        title: 'বানাবো, কিনবো, নাকি ওপেন সোর্স?'
        scope: 'Complexity budgeting (every new technology costs), build vs buy vs open source, total cost of ownership, "boring technology".'
      - slug: conways-law
        title: 'Conway-এর সূত্র: টিম যেমন, সিস্টেম তেমন'
        scope: "Conway's Law, organizational boundaries shaping system boundaries, inverse Conway maneuver, aligning services with teams."
      - slug: evolutionary-architecture
        title: 'বদলাতে পারা আর্কিটেকচার'
        scope: 'Evolutionary architecture, fitness functions as automated architecture tests (deptrac / PHPUnit architecture tests, performance budgets in CI), last responsible moment.'
      - slug: design-review
        title: 'অন্যের ডিজাইন রিভিউ করা'
        scope: 'Critically reviewing a design: finding unstated assumptions and failure paths, a checklist of questions (what if it fails, doubles, is slow, is retried), pre-mortem.'
      - slug: hexagonal
        title: 'Hexagonal: ভেতরে নিয়ম, বাইরে যন্ত্রপাতি'
        scope: 'Hexagonal / ports and adapters in Symfony: domain in the middle, interfaces as ports, adapters for DB/HTTP/mail, dependency inversion, how it makes testing and swapping vendors easy.'
      - slug: ddd
        title: 'DDD: ব্যবসার ভাষায় কোড'
        scope: 'Domain-driven design essentials: ubiquitous language, bounded contexts, aggregates and invariants, entities vs value objects; with Symfony/Doctrine examples.'
      - slug: event-driven-cqrs
        title: 'Event-driven ও CQRS এক নজরে'
        scope: 'Event-driven architecture and CQRS as architectural styles: what they are, when they are worth it, the costs; a short overview that links to the detailed topics.'
      - slug: documentation
        title: 'ডিজাইন লিখে রাখা: C4, sequence, ADR'
        scope: 'Documentation: C4 model (context, container, component), sequence diagrams, Architecture Decision Records with a real ADR template.'

  - slug: api
    code: 'B'
    title: 'API ডিজাইন'
    titleEn: 'API Design'
    icon: plug
    summary: 'একটা request কোন পথে যায়, কোথায় ভাঙে — আর এমন API কীভাবে বানাবে যা বছরের পর বছর টেকে।'
    segments:
      - slug: request-path
        title: 'একটা request-এর পুরো যাত্রা'
        scope: 'The full request path: client, DNS, CDN, load balancer/gateway, service, datastore, and where each hop can fail and what the user sees.'
      - slug: contracts-versioning
        title: 'Contract ও versioning'
        scope: 'API contracts and evolution: versioning strategies, backward and forward compatibility, additive changes, deprecation, contract testing overview.'
      - slug: api-styles
        title: 'REST, GraphQL, gRPC নাকি message?'
        scope: 'Choosing an API style: REST, GraphQL, gRPC, async messaging; strengths, costs and a decision guide.'
      - slug: pagination
        title: 'Pagination: offset বনাম cursor'
        scope: 'Pagination: offset vs cursor/keyset, stable ordering with a tie-breaker, the cost of deep pages, implementing keyset pagination in Symfony/Doctrine and consuming it in Vue.'
      - slug: error-design
        title: 'Error ডিজাইন ও retry-র নিয়ম'
        scope: 'Error design (status codes, problem+json, machine-readable codes, validation errors), retry semantics: which errors are retryable, idempotent methods.'
      - slug: rate-limiting
        title: 'Rate limit, quota ও backoff'
        scope: 'Rate limiting and quotas (token bucket, fixed/sliding window), Symfony RateLimiter, 429 + Retry-After, client backoff with jitter.'
      - slug: thin-clients
        title: 'Business logic থাকবে সার্ভারে'
        scope: 'Keeping business logic out of clients so it is not duplicated across web, mobile and partners; server computes prices/permissions, clients render; BFF briefly.'

  - slug: data
    code: 'C'
    title: 'ডেটাবেস ও ডেটা'
    titleEn: 'Databases & Data'
    icon: db
    summary: 'কোন ডেটাবেস কখন, index কীভাবে কাজ করে, ডেটা বড় হলে কী হয় — আর ডাউনটাইম ছাড়া schema বদলানো।'
    segments:
      - slug: choosing-database
        title: 'কোন কাজে কোন ডেটাবেস?'
        scope: 'Choosing a database by access pattern: relational, document, key-value, wide-column, graph, time-series; default to relational, when to add another.'
      - slug: schema-design
        title: 'Schema ডিজাইন: normalize নাকি denormalize?'
        scope: 'Schema design, normalization vs denormalization, constraints as protection (NOT NULL, FK, UNIQUE, CHECK), when duplication is justified.'
      - slug: indexing
        title: 'Index ও query plan পড়া'
        scope: 'Indexing: how a B-tree index speeds queries, composite index column order (leftmost prefix), covering and partial indexes, reading EXPLAIN, the write cost of indexes; Doctrine index attributes.'
      - slug: storage-engines
        title: 'ভেতরের ইঞ্জিন: B-tree বনাম LSM'
        scope: 'Storage engines: B-tree vs LSM-tree, read vs write trade-offs, WAL, compaction; which databases use which.'
      - slug: id-generation
        title: 'ID বানানো: UUID, ULID, Snowflake, sequence'
        scope: 'Unique ID generation: auto-increment sequences, UUIDv4, UUIDv7, ULID, Snowflake; trade-offs (index locality, guessability, coordination); Symfony Uid component.'
      - slug: replication
        title: 'Replication: ডেটার কপি রাখা'
        scope: 'Replication: leader/follower, sync vs async, replication lag and read-your-own-writes, failover and split brain; Doctrine primary/replica connections.'
      - slug: sharding
        title: 'Sharding: ডেটা ভাগ করা'
        scope: 'Sharding/partitioning: choosing a shard key, hot shards, cross-shard queries, resharding; exhaust simpler options first.'
      - slug: consistency-models
        title: 'Consistency model: কে কখন কী দেখে'
        scope: 'Consistency models: strong, eventual, read-your-writes, monotonic reads, causal; what users notice and how to design around each.'
      - slug: n-plus-one
        title: 'N+1 query ও query-র আকার'
        scope: 'N+1 queries and query shape with Doctrine: detecting them, fetch joins, batch loading, selecting only needed columns, pagination with joins.'
      - slug: oltp-olap
        title: 'OLTP, OLAP ও derived data'
        scope: 'OLTP vs OLAP, derived data, materialized views, change data capture (CDC), keeping reports off the transactional database.'
      - slug: files-blobs
        title: 'ফাইল ও blob রাখা'
        scope: 'Files and blobs: object storage instead of DB or local disk, signed (presigned) URLs, direct-to-storage and multipart/resumable large uploads; Symfony + Flysystem/S3, Vue upload.'
      - slug: serialization
        title: 'Serialization ও schema evolution'
        scope: 'Serialization formats (JSON, Protobuf, Avro) and schema evolution: adding/removing fields safely, required vs optional, schema registry idea.'
      - slug: zero-downtime-migrations
        title: 'ডাউনটাইম ছাড়া migration'
        scope: 'Zero-downtime database migrations: expand–migrate–contract, backfills in batches, avoiding long locks, Doctrine Migrations done safely.'
      - slug: temporal-data
        title: 'সময়ের সাথে বদলানো ডেটা'
        scope: 'Changing data over time: audit history, temporal/versioned tables, effective dating, soft vs hard deletes and their pitfalls (unique constraints, filters).'
      - slug: data-lifecycle
        title: 'ডেটার জীবনচক্র ও privacy'
        scope: 'Data lifecycle: retention policies, archival, deletion (right to be forgotten), privacy and compliance, data minimisation, purging jobs.'
      - slug: data-platforms
        title: 'Warehouse, lakehouse ও pipeline'
        scope: 'Data warehousing, data lake / lakehouse, batch vs streaming pipelines (ETL/ELT), data governance: ownership, quality, catalog.'

  - slug: caching
    code: 'D'
    title: 'সার্চ ও ক্যাশিং'
    titleEn: 'Search & Caching'
    icon: bolt
    summary: 'দ্রুত খুঁজে পাওয়া আর একই কাজ বারবার না করা — search index থেকে cache stampede পর্যন্ত।'
    segments:
      - slug: search-basics
        title: 'Search ভেতরে কীভাবে কাজ করে'
        scope: 'Search: why LIKE %x% fails, inverted indexes, analyzers/tokenizers, relevance scoring, faceting, Elasticsearch/OpenSearch trade-offs.'
      - slug: search-pipeline
        title: 'Search index আপডেট রাখা'
        scope: 'Read-heavy search design: indexing pipelines from the source-of-truth database to the search index, eventual consistency, reindexing, with Symfony Messenger.'
      - slug: cache-strategies
        title: 'Cache-এর চার কৌশল'
        scope: 'Cache strategies: cache-aside, read-through, write-through, write-behind; Symfony Cache contracts with Redis; what to cache and what not to.'
      - slug: cache-invalidation
        title: 'Invalidation ও TTL'
        scope: 'Cache invalidation, TTL design, cache keys and versioned keys, tag-based invalidation in Symfony, stale data risks.'
      - slug: cache-stampede
        title: 'Cache stampede ঠেকানো'
        scope: 'Stampede / thundering-herd protection: locks, request coalescing, jittered expiry, probabilistic early expiration (Symfony beta), stale-while-revalidate.'
      - slug: http-caching
        title: 'HTTP caching ও CDN'
        scope: 'HTTP caching: Cache-Control, ETag / If-None-Match, stale-while-revalidate, private vs public, CDN behaviour and cache keys, cache busting of assets.'

  - slug: config
    code: 'E'
    title: 'রুলস, কনফিগ ও ফিচার ফ্ল্যাগ'
    titleEn: 'Rules, Config & Feature Flags'
    icon: switch
    summary: 'কোড না বদলে আচরণ বদলানো: ফিচার ফ্ল্যাগ, কনফিগ আর business rule কোথায় রাখবে।'
    segments:
      - slug: feature-flags
        title: 'ফিচার ফ্ল্যাগ'
        scope: 'Feature toggles: release vs ops vs experiment vs permission flags, kill switches, gradual percentage rollout, flag debt and cleanup; a simple implementation in Symfony and Vue.'
      - slug: configuration
        title: 'কনফিগ ও environment'
        scope: 'Configuration and environment management (12-factor), env vars in Symfony, separating secrets from config, config drift between environments.'
      - slug: rules-engines
        title: 'Business rule: কোডে নাকি ডেটায়?'
        scope: 'Rules engines: when business rules belong in data rather than code, Symfony ExpressionLanguage, versioning and testing rules, the cost of getting it wrong.'

  - slug: concurrency
    code: 'F'
    title: 'ট্রানজ্যাকশন ও কনকারেন্সি'
    titleEn: 'Transactions & Concurrency'
    icon: lock
    summary: 'দুজন একসাথে একই জিনিস বদলালে কী হয় — আর টাকা, টিকিট, স্টক কীভাবে নিরাপদ রাখবে।'
    segments:
      - slug: acid
        title: 'ACID: ট্রানজ্যাকশনের চার প্রতিশ্রুতি'
        scope: 'ACID explained simply, transactions in Doctrine (wrapInTransaction, flush), what a transaction does and does not protect.'
      - slug: isolation-levels
        title: 'Isolation level ও anomaly'
        scope: 'Isolation levels (read uncommitted, read committed, repeatable read, serializable) and the anomalies each permits: dirty read, non-repeatable read, lost update, write skew, phantom.'
      - slug: race-conditions
        title: 'Race condition চেনা'
        scope: 'Race conditions: check-then-act, read-modify-write, double-spend, double-booking; how to spot them in ordinary Symfony code.'
      - slug: locking
        title: 'Lock: pessimistic, optimistic ও অন্যরা'
        scope: 'Locking: pessimistic (SELECT … FOR UPDATE), optimistic (version column), advisory locks, distributed locks (Symfony Lock), deadlocks and lock ordering.'
      - slug: atomic-operations
        title: 'Atomic operation ও unique constraint'
        scope: 'Compare-and-swap, atomic SQL updates (UPDATE … WHERE stock >= n), unique constraints as a correctness tool, upserts.'
      - slug: reservations
        title: 'Reservation ও hold'
        scope: 'Reservations and holds: inventory, seats and slots held with an expiry and released on timeout; state machine and cleanup job.'
      - slug: distributed-transactions
        title: 'Distributed transaction ও 2PC'
        scope: 'Distributed transactions: the dual-write problem, how two-phase commit works and why it is avoided, what replaces it (outbox, saga, idempotency).'

  - slug: messaging
    code: 'G'
    title: 'কিউ, ইভেন্ট ও ব্যাকগ্রাউন্ড কাজ'
    titleEn: 'Queues, Events & Background Work'
    icon: queue
    summary: 'সব কাজ request-এর ভেতরে করতে নেই। কিউ, ইভেন্ট আর worker দিয়ে পরে, নিরাপদে করা।'
    segments:
      - slug: events-vs-commands
        title: 'Event বনাম command, queue বনাম stream'
        scope: 'Events vs commands, queues (RabbitMQ/SQS) vs streams/logs (Kafka), when to go async; Symfony Messenger basics.'
      - slug: delivery-guarantees
        title: 'Delivery guarantee, ordering ও partition'
        scope: 'Delivery guarantees: at-most-once, at-least-once, why exactly-once is really effectively-once; ordering and partitioning by key.'
      - slug: dlq-retries
        title: 'Retry, DLQ ও idempotent consumer'
        scope: 'Retries with backoff, dead-letter queues, poison messages, consumer idempotency (processed-message table); Messenger retry strategy and failure transport.'
      - slug: background-jobs
        title: 'ব্যাকগ্রাউন্ড জব'
        scope: 'Background jobs: scheduling (Symfony Scheduler/cron), priorities, visibility timeouts, long-running work in chunks with checkpoints, job observability.'
      - slug: notifications
        title: 'নোটিফিকেশন সিস্টেম'
        scope: 'Notifications: multi-channel delivery (email, SMS, push), user preferences, deduplication, throttling/digest, provider failover; Symfony Notifier.'

  - slug: time
    code: 'H'
    title: 'সময়'
    titleEn: 'Time'
    icon: clock
    summary: 'ঘড়ি মিথ্যা বলে। timestamp, time zone, DST আর timeout নিয়ে যে ভুলগুলো সবাই করে।'
    segments:
      - slug: clocks-lie
        title: 'ঘড়ি মিথ্যা বলে'
        scope: 'Clocks lie: skew, drift, NTP jumps, leap seconds; wall clock vs monotonic clock; Symfony Clock component for testable time.'
      - slug: ordering-events
        title: 'কোনটা আগে ঘটেছে?'
        scope: 'Why wall-clock timestamps cannot order events across machines; logical clocks (Lamport), version numbers/sequences, hybrid logical clocks; last-write-wins danger.'
      - slug: time-zones
        title: 'Time zone, DST ও scheduling'
        scope: 'Time zones, DST gaps and overlaps, scheduling across regions; store UTC for past instants, store local time + zone for future events; PHP DateTimeImmutable and Vue display.'
      - slug: expiry-timeouts
        title: 'Expiry, TTL ও timeout'
        scope: 'Expiry, TTL and timeout design that survives clock errors: deadlines vs durations, monotonic timers, server-side authority, grace periods, timeout budgets.'

  - slug: payments
    code: 'I'
    title: 'পেমেন্ট'
    titleEn: 'Payments'
    icon: card
    summary: 'টাকা দুইবার কাটা যাবে না, হারানোও যাবে না। idempotency, webhook আর "জানি না হলো কি না"।'
    segments:
      - slug: idempotency-keys
        title: 'Idempotency key'
        scope: 'Idempotency keys and designing every write to be safely repeatable: key storage, request fingerprint, replaying the stored response, concurrency; full Symfony implementation and Vue client.'
      - slug: webhooks
        title: 'Webhook নিরাপদে ধরা'
        scope: 'Webhooks: signature verification (HMAC), replay protection, out-of-order and duplicate delivery, respond fast then process async, retry handling.'
      - slug: payment-state-machine
        title: 'Payment state machine'
        scope: 'Payment state machines: legal transitions, terminal states, guarding transitions atomically; Symfony Workflow component.'
      - slug: unknown-outcomes
        title: '"হলো কি না জানি না" সামলানো'
        scope: 'Handling unknown outcomes (timeouts): never assume failure or success, pending state, status query and reconciliation, safe retry with the same idempotency key.'

  - slug: security
    code: 'J'
    title: 'অথেনটিকেশন ও সিকিউরিটি'
    titleEn: 'Authentication & Security'
    icon: shield
    summary: 'তুমি কে, আর তুমি কী করতে পারো — সাথে ইনপুট, secret আর ডেটা সুরক্ষার অলঙ্ঘনীয় নিয়ম।'
    segments:
      - slug: authn-authz
        title: 'AuthN বনাম AuthZ'
        scope: 'Authentication vs authorization, the classic mistakes (IDOR / missing object-level checks), where each lives in Symfony Security.'
      - slug: sessions-tokens
        title: 'Session নাকি token (JWT)?'
        scope: 'Sessions vs tokens: server-side sessions, JWT trade-offs, revocation problem, short-lived access + refresh tokens, where to store tokens in the browser.'
      - slug: oauth-oidc
        title: 'OAuth2, OIDC ও SAML'
        scope: 'OAuth2 (authorization code + PKCE), OpenID Connect, SAML; who the actors are, what each is for, common mistakes.'
      - slug: authorization-models
        title: 'RBAC, ABAC, ReBAC ও policy'
        scope: 'Authorization models: RBAC, ABAC, ReBAC, policy engines; implementing with Symfony voters and #[IsGranted].'
      - slug: multi-tenancy
        title: 'Multi-tenancy: এক সিস্টেমে অনেক ক্রেতা'
        scope: 'Multi-tenancy isolation: row-level, schema-level, database-level; tenant scoping with Doctrine filters; noisy-neighbour control.'
      - slug: account-recovery
        title: 'Account recovery: পেছনের দরজা'
        scope: 'Account recovery as an attack surface: reset tokens (random, hashed, expiring, single-use), user enumeration, rate limits, MFA reset, session invalidation.'
      - slug: secrets-management
        title: 'Secret সামলানো'
        scope: 'Secrets management, rotation and least privilege: never in git, Symfony secrets vault / env, rotation without downtime, scoped credentials.'
      - slug: threat-modeling
        title: 'Trust boundary ও threat modeling'
        scope: 'Trust boundaries and threat modeling with STRIDE: how to run a lightweight threat model on a feature.'
      - slug: input-validation
        title: 'ইনপুটকে কখনো বিশ্বাস নয়'
        scope: 'Never trusting input: validation (Symfony Validator / MapRequestPayload), SQL injection, XSS, SSRF, unsafe deserialization, file uploads.'
      - slug: data-protection
        title: 'জমা রাখা ডেটার সুরক্ষা'
        scope: 'Protecting held data: encryption in transit and at rest, password hashing, tokenization, masking, key management (KMS, envelope encryption), PII handling and logs.'
      - slug: supply-chain-compliance
        title: 'Supply chain ও compliance'
        scope: 'Supply-chain security (dependencies, lock files, composer audit, CI secrets) and compliance overview: SOC 2, PCI DSS, GDPR, HIPAA as design inputs.'

  - slug: ledgers
    code: 'K'
    title: 'লেজার ও ইন্টিগ্রেশন'
    titleEn: 'Ledgers & Integration'
    icon: receipt
    summary: 'টাকার হিসাব এমনভাবে রাখা যাতে এক পয়সাও না হারায় — আর বাইরের সিস্টেমের সাথে নিরাপদে কথা বলা।'
    segments:
      - slug: modeling-money
        title: 'টাকা মডেল করা'
        scope: 'Modeling money: integer minor units, currency always attached, rounding rules and allocation of remainders, never floats; a Money value object in PHP/Doctrine.'
      - slug: double-entry
        title: 'Double-entry ledger'
        scope: 'Double-entry ledgers: immutable entries, debits = credits, balances derived from entries, corrections via reversing entries; schema and Symfony posting service.'
      - slug: reconciliation
        title: 'Reconciliation: হিসাব মেলানো'
        scope: 'Reconciliation: detecting and resolving mismatches against external systems (bank/gateway statements), matching keys, break categories, daily job.'
      - slug: third-party-integrations
        title: 'বাইরের সার্ভিসের সাথে ইন্টিগ্রেশন'
        scope: 'Third-party integrations: timeouts, retries, rate limits, sandbox vs production differences, wrapping the vendor behind your own interface, vendor lock-in and exit plans; Symfony HttpClient.'
      - slug: batch-files
        title: 'Batch ফাইল ইন্টিগ্রেশন'
        scope: 'Batch file integration: SFTP, CSV/fixed-width formats, checksums and control totals, partial failures, idempotent reprocessing, quarantine of bad rows.'
      - slug: integration-styles
        title: 'ইন্টিগ্রেশনের চার স্টাইল'
        scope: 'Integration styles: shared database, RPC, messaging, file transfer, and their coupling costs; how to choose.'

  - slug: workflows
    code: 'L'
    title: 'ওয়ার্কফ্লো ও ডিস্ট্রিবিউটেড কনসিস্টেন্সি'
    titleEn: 'Workflows & Distributed Consistency'
    icon: shuffle
    summary: 'অনেক ধাপের কাজ, অনেক সার্ভিস — মাঝপথে ভাঙলেও ডেটা কীভাবে ঠিক রাখবে।'
    segments:
      - slug: outbox-inbox
        title: 'Outbox ও inbox প্যাটার্ন'
        scope: 'Transactional outbox and inbox patterns: solving dual writes, the relay/publisher, dedup on the consumer; Doctrine + Messenger implementation.'
      - slug: sagas
        title: 'Saga: ধাপে ধাপে, ভুল হলে উল্টো পথে'
        scope: 'Sagas: orchestration vs choreography, compensating actions, timeouts, saga state persistence, semantic (not real) rollback.'
      - slug: refunds-reversals
        title: 'Refund, reversal ও আংশিক কাজ'
        scope: 'Refunds, reversals, partial operations (partial refund/capture/shipment) and rule-driven fees; never mutate the original, model as new linked records.'
      - slug: event-sourcing
        title: 'Event sourcing ও CQRS'
        scope: "Event sourcing and CQRS in depth: when it is worth it, event store, snapshots, replay, projections, eventual consistency of read models, the schema-evolution (upcasting) cost."

  - slug: scaling
    code: 'M'
    title: 'ডিস্ট্রিবিউটেড সিস্টেম স্কেলিং'
    titleEn: 'Scaling Distributed Systems'
    icon: graph
    summary: 'ব্যবহারকারী দশ গুণ হলে কী ভাঙবে? আসল bottleneck খোঁজা আর ঠিক জায়গায় স্কেল করা।'
    segments:
      - slug: load-latency
        title: 'Load, latency ও bottleneck'
        scope: "Load, latency percentiles (p50/p95/p99, tail latency), throughput, Little's Law, finding the actual bottleneck before scaling."
      - slug: horizontal-vertical
        title: 'Vertical বনাম horizontal scaling'
        scope: 'Vertical vs horizontal scaling, what must be true to scale horizontally, autoscaling and its lag, scaling the database last.'
      - slug: load-balancing
        title: 'Load balancing ও SPOF দূর করা'
        scope: 'Eliminating single points of failure, load balancing algorithms (round robin, least connections, weighted), health checks, L4 vs L7, sticky sessions.'
      - slug: consistent-hashing
        title: 'Consistent hashing'
        scope: 'Consistent hashing: why hash mod N breaks on resize, the ring, virtual nodes, where it is used (caches, sharded stores).'
      - slug: coordination
        title: 'Leader, consensus ও distributed lock'
        scope: 'Coordination: leader election, consensus (Raft/Paxos conceptually), quorum, distributed locks and their pitfalls (fencing tokens), the role of ZooKeeper/etcd.'
      - slug: data-movement
        title: 'বড় ডেটা সরানো'
        scope: 'Data movement at scale: replication lag effects, rebalancing, backfills, large migrations with dual writes, verification and throttling.'
      - slug: cap-pacelc
        title: 'CAP ও PACELC বাস্তবে'
        scope: 'CAP and PACELC and consistency trade-offs in practice: what partition really means, CP vs AP choices per feature, latency vs consistency.'

  - slug: resilience
    code: 'N'
    title: 'রেজিলিয়েন্স'
    titleEn: 'Resilience'
    icon: heart
    summary: 'কিছু না কিছু ভাঙবেই। ভাঙন যেন ছড়িয়ে না পড়ে, আর সিস্টেম যেন খুঁড়িয়ে হলেও চলে।'
    segments:
      - slug: containing-failure
        title: 'ভাঙন আটকে রাখা'
        scope: 'Containing failure: timeouts on every network call, bulkheads, isolation of resources (separate pools/queues), cascading failure explained.'
      - slug: load-shedding
        title: 'Load shedding ও back-pressure'
        scope: 'Load shedding and back-pressure: bounded queues, rejecting early with 429/503, prioritising critical traffic, protecting yourself from overload.'
      - slug: circuit-breakers
        title: 'Circuit breaker ও retry storm'
        scope: 'Partial failure, circuit breakers (closed/open/half-open), retry storms, retry budgets, exponential backoff with jitter; Symfony HttpClient retry and a simple breaker.'
      - slug: graceful-degradation
        title: 'Graceful degradation'
        scope: 'Graceful degradation: serving something useful when dependencies fail — fallbacks, cached/stale data, feature shut-off, degraded UI in Vue.'
      - slug: zero-downtime-deploys
        title: 'ডাউনটাইম ছাড়া deploy'
        scope: 'Zero-downtime deployment: rolling, blue/green, canary; backward-compatible releases, expand-contract with the database, graceful shutdown, rollback plans.'
      - slug: disaster-recovery
        title: 'Multi-region ও disaster recovery'
        scope: 'Multi-region (active-passive, active-active), disaster recovery, RPO and RTO, and actually testing failover (game days).'

  - slug: observability
    code: 'O'
    title: 'অবজার্ভেবিলিটি'
    titleEn: 'Observability'
    icon: eye
    summary: 'প্রোডাকশনে কী হচ্ছে তা না দেখতে পেলে ঠিক করবে কী করে? log, metric, trace আর incident।'
    segments:
      - slug: logging-tracing
        title: 'Structured log, correlation ID ও trace'
        scope: 'Structured logging (JSON, context), correlation/request IDs through services and queues, distributed tracing with spans; Monolog processors.'
      - slug: metrics-slos
        title: 'Metric, SLI, SLO ও error budget'
        scope: 'Metrics (RED/USE, counters/gauges/histograms), SLIs, SLOs and error budgets, and how they drive decisions.'
      - slug: health-alerts
        title: 'Health check ও alert'
        scope: 'Meaningful health checks (liveness vs readiness, shallow vs deep), alert design that avoids alert fatigue: alert on symptoms, actionable, with runbook.'
      - slug: incident-response
        title: 'লাইভ outage সামলানো'
        scope: 'Debugging a live outage: triage, hypothesis, mitigate first and root-cause second, communication and roles, blameless postmortems.'

  - slug: recovery
    code: 'P'
    title: 'ফেইলিওর ম্যানেজমেন্ট'
    titleEn: 'Failure Management'
    icon: history
    summary: 'ভুল হয়ে গেছে — এখন? backup থেকে ফেরা, নিরাপদে আবার চালানো আর ডেটা শুধরে নেওয়া।'
    segments:
      - slug: backups-restore
        title: 'Backup, restore ও runbook'
        scope: 'Recovery: restore procedures, backups you have actually tested, point-in-time recovery, the 3-2-1 rule, runbooks.'
      - slug: bulk-reprocessing
        title: 'Bulk reprocessing ও replay'
        scope: 'Bulk reprocessing: replaying events or jobs safely, idempotent replays, throttling the recovery itself, dry runs, progress checkpoints; a Symfony console command.'
      - slug: corrective-actions
        title: 'ভুল ডেটা শুধরানো'
        scope: 'Compensation for bad data or bad deploys: corrective entries instead of silent edits, audited data-fix scripts, roll forward vs roll back.'

  - slug: interaction
    code: 'Q'
    title: 'ইন্টার‍্যাকশন প্যাটার্ন'
    titleEn: 'Interaction Patterns'
    icon: wifi
    summary: 'অফলাইনে কাজ, লাইভ আপডেট আর ফিড — ব্যবহারকারীর সাথে সিস্টেমের কথা বলার তিন কঠিন ধরন।'
    segments:
      - slug: offline-sync
        title: 'Offline sync ও conflict'
        scope: 'Offline sync: local-first writes, conflict detection and resolution (last-write-wins, version vectors, CRDTs), sync protocols; Vue + Symfony sketch.'
      - slug: realtime-delivery
        title: 'Real-time: WebSocket, SSE, polling'
        scope: 'Real-time delivery: long-polling, SSE, WebSockets, push notifications, presence, connection scaling; Symfony Mercure and Vue EventSource.'
      - slug: fan-out
        title: 'Fan-out ও feed ডিজাইন'
        scope: 'Fan-out: write-time vs read-time feed design, the celebrity / hot-key problem, hybrid approach, ordering and delivery guarantees.'

  - slug: testing
    code: 'R'
    title: 'টেস্টিং'
    titleEn: 'Testing'
    icon: check
    summary: 'সব কিছু টেস্ট করা যায় না। কোথায় ভাঙলে সবচেয়ে ক্ষতি — সেখানেই আগে টেস্ট।'
    segments:
      - slug: what-to-test
        title: 'কী টেস্ট করার মতো?'
        scope: 'Deciding what is worth testing: the risk-based test pyramid, not coverage targets; unit vs integration vs end-to-end in Symfony (PHPUnit, WebTestCase).'
      - slug: test-types
        title: 'Contract, integration, load ও chaos test'
        scope: 'Contract testing, integration testing with real dependencies, load testing (k6), chaos / failure-injection testing; what each one catches.'
      - slug: testing-hard-parts
        title: 'Concurrency, idempotency ও migration টেস্ট'
        scope: 'Testing concurrency, idempotency and migrations specifically, since these are where production breaks; concrete PHPUnit examples.'

  - slug: infra
    code: 'S'
    title: 'ইনফ্রা, ডেলিভারি ও খরচ'
    titleEn: 'Infrastructure, Delivery & Cost'
    icon: cloud
    summary: 'কোড কোথায় চলে, কীভাবে সেখানে পৌঁছায়, আর মাস শেষে বিল কত আসে।'
    segments:
      - slug: cloud-primitives
        title: 'Cloud-এর মূল ইটগুলো'
        scope: 'Cloud primitives: compute, networking (VPC, subnets, security groups), IAM, managed services; shared responsibility.'
      - slug: containers-k8s
        title: 'Container, Kubernetes ও IaC'
        scope: 'Containers (a Dockerfile for Symfony), Kubernetes core objects, infrastructure as code (Terraform) and why click-ops fails.'
      - slug: ci-cd
        title: 'CI/CD ও নিরাপদ deploy'
        scope: 'CI/CD pipelines, environment parity, deployment safety (build once, promote the same artifact, automated checks, quick rollback).'
      - slug: finops
        title: 'FinOps: খরচের হিসাব'
        scope: 'FinOps: cost modeling, unit economics (cost per order/user), reducing spend without reducing reliability, tagging and budgets.'
      - slug: ml-llm-components
        title: 'সিস্টেমে ML/LLM বসানো'
        scope: 'ML/LLM components in a system: evaluation, non-determinism, latency and cost, data leakage and prompt injection, fallbacks and guardrails.'

  - slug: hands-on
    code: 'T'
    title: 'হাতে-কলমে ইঞ্জিনিয়ারিং'
    titleEn: 'Hands-on Engineering'
    icon: terminal
    summary: 'আর্কিটেক্ট শুধু ছবি আঁকে না — কোড লেখে, পড়ে, মাপে।'
    segments:
      - slug: production-code
        title: 'প্রোডাকশন কোড লেখা ও রিভিউ'
        scope: 'Writing and reviewing production code (in at least two ecosystems): what production-ready means, a code-review checklist, why knowing a second ecosystem helps.'
      - slug: prototyping-profiling
        title: 'Prototype ও profiling'
        scope: 'Prototyping (spikes, throwaway code) to de-risk decisions, and profiling: measure before optimising, Symfony Profiler/Stopwatch, Blackfire, EXPLAIN.'
      - slug: reading-codebases
        title: 'অচেনা codebase পড়া'
        scope: 'Reading unfamiliar codebases: start from entry points, follow one request, use tests and git history, debug:router / debug:container, drawing a map.'

  - slug: soft-skills
    code: 'U'
    title: 'নন-টেকনিক্যাল স্কিল'
    titleEn: 'Non-technical Skills'
    icon: users
    summary: 'সেরা ডিজাইনও হেরে যায় যদি কাউকে বোঝাতে না পারো। সিদ্ধান্ত, যোগাযোগ, নেতৃত্ব।'
    segments:
      - slug: decision-making
        title: 'সিদ্ধান্ত নেওয়া'
        scope: 'Decision-making: trade-off analysis (decision matrix), deciding under uncertainty, risk prioritization (impact × likelihood), admitting error fast.'
      - slug: communication
        title: 'যোগাযোগ: এক ডিজাইন, চার শ্রোতা'
        scope: 'Communication: tailoring one design to engineers, product, finance and regulators; clear design docs and RFCs; running reviews without turning them into trials.'
      - slug: influence-leadership
        title: 'প্রভাব ও নেতৃত্ব'
        scope: 'Influence and leadership: persuading without authority, mentoring, consensus-building, knowing when to cut debate and decide (disagree and commit).'
      - slug: business-domain
        title: 'ব্যবসা ও ডোমেইন বোঝা'
        scope: 'Business and domain: translating business goals into architectural constraints, ROI, time-to-market vs quality, regulatory constraints as design inputs.'
      - slug: organizational
        title: 'টিম, রোডম্যাপ ও vendor'
        scope: 'Organizational skills: team topologies, roadmapping and dependency management, estimation, vendor and contract negotiation, hiring.'
      - slug: discipline
        title: 'শৃঙ্খলা: hype নয়, বাস্তবতা'
        scope: 'Discipline: continuous learning with skepticism toward hype, pragmatism over purity, ownership of long-term consequences.'
