slides:
  - slug: one-balance-column
    title: 'Just a balance column: "Where did my money go?"'
    kind: story
    tldr: 'With only a balance number there is no history. When something is wrong, you can''t tell who changed it, when, or why.'
    keywords: ['balance column', 'audit trail', 'UPDATE balance', 'ledger', 'history', 'bookkeeping']
    blocks:
      - type: text
        body: |
          Rebecca calls support: "My wallet is $50 short. Who took it?" All the database holds is `balance = 1200`. Who lowered it, why, and when? None of that is written down. You can't even tell whether two concurrent requests overwrote each other. Forget getting the right figure; you can't find where the mistake happened.
      - type: code
        lang: sql
        file: 'What a CRUD app naturally writes'
        variant: bad
        code: |
          UPDATE wallet
             SET balance = balance - 50
           WHERE id = 7;
          -- The old amount? The reason? Who did it? All gone.
        marks:
          - {line: 2, tip: 'This line wipes the old number and writes the new one in its place. No history is left.'}
      - type: visual
        kind: compare
        caption: 'A balance column alone vs a book of entries'
        columns:
          - title: 'Balance column only'
            tone: bad
            icon: cross
            tip: 'Simple, but every change erases the information that came before it.'
            items:
              - 'You can''t tell who lowered it'
              - 'After an error, you can''t work out the right amount'
              - 'You have nothing to show an auditor'
          - title: 'A book of entries (ledger)'
            tone: good
            icon: check
            tip: 'Each transaction is a new line; the balance is the sum of those lines.'
            items:
              - 'Every change has its own line'
              - 'You can recompute the balance for any day'
              - 'An auditor can check it line by line'
    aside:
      - type: story
        title: 'Two bugs that canceled out'
        body: |
          In one app, a bug charged $20 too much and another charged $20 too little. Together they left the balance looking correct. With only a balance, nobody would ever have caught either one. Because entries existed, an auditor found both.
      - type: remember
        body: 'A balance is an answer, not history. Without history you can''t check the answer.'
    check:
      q: 'After `UPDATE ... SET balance = balance - 50` runs, what information is lost?'
      a: 'The old amount, why it dropped, which transaction caused it and who did it. Only the new number remains, so nothing can be checked.'

  - slug: two-sides-of-every-move
    title: 'Money moves from one account to another'
    kind: concept
    tldr: 'Every transaction has at least two entries: total debits always equal total credits; entries never change; the balance is computed from entries.'
    keywords: ['double-entry', 'debit', 'credit', 'immutable', 'derived balance', 'bookkeeping']
    blocks:
      - type: metaphor
        icon: book
        title: 'The bank passbook'
        body: |
          Every line in a passbook is written in ink; nobody crosses one out and writes a new number. Each deposit or withdrawal also has a line on the other side, in someone else's book: money comes from somewhere and goes somewhere, and it never just evaporates. The current balance isn't written anywhere separately. It is whatever you get by adding up all the lines.
      - type: visual
        kind: table
        caption: 'Ryan sends Kevin $50 with a $1 fee (all amounts in dollars)'
        headers: ['Account', 'Debit', 'Credit']
        rows:
          - cells: ['Ryan''s wallet', '51', '—']
            tip: '$51 leaves Ryan''s wallet ($50 sent plus the $1 fee). A wallet is a liability for us, so a debit means the balance goes down.'
          - cells: ['Kevin''s wallet', '—', '50']
            tip: '$50 arrives in Kevin''s wallet. The liability grows, so it is a credit.'
          - cells: ['Fee income', '—', '1']
            tip: '$1 is added to our income book. Income also grows on the credit side.'
          - cells: ['Total', '51', '51']
            tip: 'If the two sides don''t add up to the same number, the transaction is not accepted at all.'
      - type: quote
        body: 'In every transaction, total debits = total credits. Entries are written, never edited or deleted.'
    aside:
      - type: terms
        items:
          - {term: 'Entry', meaning: 'One line on one side of an account: the account, debit or credit, and an amount.'}
          - {term: 'Debit / Credit', meaning: 'The two sides of the book. On accounts like a wallet (our liability) or fee income, credit increases the balance and debit decreases it.'}
          - {term: 'Derived balance', meaning: 'Not a separate number but one computed from the sum of the entries.'}
      - type: problem
        body: 'Every amount has a source and a destination, so money that vanishes or appears from nowhere gets caught.'
    check:
      q: 'Ryan''s wallet loses 51 and Kevin''s gains 50. Where is the other 1 dollar, and why must it be written down?'
      a: 'In the fee income account, as a 1 credit. Without it, debits are 51 and credits 50, which is unbalanced, and nothing explains where the dollar went.'

  - slug: ledger-schema
    title: 'Building the tables: account, transaction, entry'
    kind: howto
    tldr: 'Three tables: account, transaction, entry. CHECK, a currency foreign key and REVOKE block bad amounts, wrong-currency entries and edits; balance = SUM of entries.'
    keywords: ['ledger schema', 'SQL', 'CHECK constraint', 'REVOKE', 'SUM', 'ledger_entry']
    blocks:
      - type: text
        body: |
          Three tables are enough. An **account** is a page in the book, in one currency; a **transaction** is one event (one transfer), and an **entry** is each line of that event. The amount is always a positive integer; the `side` column says which direction. And the app's database user is never granted UPDATE or DELETE at all. The price: a mistake can only be fixed by a new reversing transaction, never by an edit.
      - type: code
        lang: sql
        file: 'migrations — ledger schema'
        variant: good
        code: |
          CREATE TABLE ledger_account (
            id       bigserial PRIMARY KEY,
            code     text UNIQUE NOT NULL,      -- 'wallet:ryan', 'income:fees'
            currency char(3) NOT NULL,
            UNIQUE (id, currency)
          );
          CREATE TABLE ledger_transaction (
            id          uuid PRIMARY KEY,
            memo        text NOT NULL,
            reverses_id uuid UNIQUE REFERENCES ledger_transaction (id),
            posted_at   timestamptz NOT NULL DEFAULT now()
          );
          CREATE TABLE ledger_entry (
            id             bigserial PRIMARY KEY,
            transaction_id uuid    NOT NULL REFERENCES ledger_transaction (id),
            account_id     bigint  NOT NULL,
            side           char(1) NOT NULL CHECK (side IN ('D', 'C')),
            amount_minor   bigint  NOT NULL CHECK (amount_minor > 0),
            currency       char(3) NOT NULL,
            FOREIGN KEY (account_id, currency) REFERENCES ledger_account (id, currency)
          );
          CREATE INDEX ON ledger_entry (account_id);

          REVOKE UPDATE, DELETE
            ON ledger_entry, ledger_transaction FROM app_user;
        marks:
          - {line: 10, tip: '`UNIQUE` means a transaction can be reversed at most once, which prevents a double reversal.'}
          - {line: 18, tip: 'The amount is always above 0. The `side` decides whether the balance goes up or down, not a negative number.'}
          - {line: 20, tip: 'The entry''s currency must match its account''s currency. An EUR entry on a USD wallet is rejected by the database itself.'}
          - {line: 24, tip: 'The app''s user can''t change an entry, whether by mistake or through a bug. It''s like a page written in ink.'}
      - type: code
        lang: sql
        file: 'Computing the balance'
        variant: good
        code: |
          -- A wallet is our liability: credit increases it, debit decreases it
          SELECT COALESCE(SUM(
                   CASE side WHEN 'C' THEN amount_minor ELSE -amount_minor END
                 ), 0) AS balance_minor
            FROM ledger_entry
           WHERE account_id = 7;
        marks:
          - {line: 3, tip: 'Credit adds, debit subtracts. The sum is the balance, and no separate number is stored anywhere.'}
    aside:
      - type: tips
        items:
          - 'If you need the balance fast, keep a cached column, but treat it as a figure computed from entries, not the source of truth. If they disagree, the entries are right.'
          - 'To enforce the "both sides are equal" rule in the database, use a `DEFERRABLE INITIALLY DEFERRED` constraint trigger in PostgreSQL.'
      - type: refs
        items:
          - {to: 'concurrency/atomic-operations', label: 'All entries in one transaction'}
    check:
      q: 'Why does ledger_entry have a `side` column instead of allowing a negative `amount_minor`?'
      a: 'To avoid mistakes about direction (such as a negative debit). The amount is always a positive integer, and the direction is written explicitly as D or C.'

  - slug: posting-service
    title: 'The posting service: unbalanced means not written'
    kind: howto
    tldr: 'One service writes all entries in one transaction after checking debits = credits in each currency. A mistake is never deleted; you write a reversing transaction.'
    keywords: ['posting service', 'reversing entry', 'Symfony', 'DBAL transactional', 'Uuid::v7', 'reversal']
    blocks:
      - type: text
        body: |
          Every write goes through one door: `LedgerService::post()`. It first checks that the two sides add up in each currency, then writes the transaction and its entries in a single DB transaction. A wrong transaction can't be deleted or edited. Instead you write a **reversing entry**: a new transaction with every line on the opposite side.
      - type: code
        lang: php
        file: 'src/Ledger/LedgerService.php'
        variant: good
        code: |
          /** @param list<Posting> $postings */
          public function post(string $memo, array $postings, ?Uuid $reverses = null): Uuid
          {
              $net = [];                                    // currency => debits minus credits
              foreach ($postings as $p) {
                  $signed = Side::Debit === $p->side ? $p->money->amount : -$p->money->amount;
                  $net[$p->money->currency] = ($net[$p->money->currency] ?? 0) + $signed;
              }
              if ([] === $net || [] !== array_filter($net)) {
                  throw new \DomainException('Debits and credits must be equal in every currency');
              }

              return $this->db->transactional(function () use ($memo, $postings, $reverses) {
                  $id = Uuid::v7();
                  $this->db->insert('ledger_transaction', [
                      'id' => $id->toRfc4122(), 'memo' => $memo,
                      'reverses_id' => $reverses?->toRfc4122(),
                  ]);
                  foreach ($postings as $p) {
                      $this->db->insert('ledger_entry', [
                          'transaction_id' => $id->toRfc4122(),
                          'account_id' => $p->accountId,
                          'side' => $p->side->value,
                          'amount_minor' => $p->money->amount,
                          'currency' => $p->money->currency,
                      ]);
                  }

                  return $id;
              });
          }
        marks:
          - {line: 9, tip: 'Every currency must net to exactly zero on its own. 500 USD debited against 500 GBP credited leaves USD at +500 and GBP at -500, so it is refused. See the next slide.'}
          - {line: 13, tip: 'The transaction and all its entries go in together. If it fails halfway, nothing is written and no half transaction is left behind.'}
          - {line: 17, tip: 'For a reversal, the original transaction''s id goes here; the UNIQUE constraint prevents reversing it twice.'}
      - type: code
        lang: php
        file: 'Reversing: an opposite entry, not a delete'
        variant: good
        code: |
          public function reverse(Uuid $txId): Uuid
          {
              $original = $this->entries->forTransaction($txId);   // list<Posting>

              return $this->post(
                  memo: "Reversal of {$txId->toRfc4122()}",
                  postings: array_map(fn (Posting $p) => $p->reversed(), $original),
                  reverses: $txId,
              );
          }
        marks:
          - {line: 7, tip: '`reversed()` turns each line''s debit into a credit and its credit into a debit. The amounts stay the same.'}
          - {line: 8, tip: 'The link to the original transaction is recorded, so an auditor can see the two as a pair.'}
      - type: visual
        kind: table
        caption: 'Effect on Ryan''s wallet, Kevin''s wallet and fee income (in dollars)'
        headers: ['Transaction', 'Ryan', 'Kevin', 'Fee income']
        rows:
          - cells: ['#1 Transfer', '−51', '+50', '+1']
            tip: 'The original transaction, which was a mistake. It stays in the book forever.'
          - cells: ['#2 Reversal (of #1)', '+51', '−50', '−1']
            tip: 'Every line is the opposite. #1 is not deleted; its effect is canceled out.'
          - cells: ['Total', '0', '0', '0']
            tip: 'After both transactions everyone''s balance is as before, and history still shows both lines.'
    aside:
      - type: pitfalls
        items:
          - 'Never run UPDATE or DELETE on a wrong entry. Nobody will ever know what really happened.'
          - 'After a reversal, write the corrected transaction separately; reversing and correcting are two steps, not one.'
      - type: refs
        items:
          - {to: 'workflows/refunds-reversals', label: 'Refunds and reversals'}
          - {to: 'recovery/corrective-actions', label: 'Correcting bad data'}
    check:
      q: 'What is the benefit of writing an opposite entry instead of deleting a wrong transaction?'
      a: 'History stays intact: both the original mistake and its reversal are visible. An auditor can see what happened, when, and how it was corrected.'

  - slug: each-currency-balances
    title: 'Debits equal credits in every currency'
    kind: pitfall
    tldr: 'Adding amounts without looking at the currency lets a 500 USD debit and a 500 GBP credit pass as balanced. Each currency must balance alone; a conversion goes through FX accounts.'
    keywords: ['multi-currency', 'FX', 'currency check', 'balanced', 'conversion', 'clearing account']
    blocks:
      - type: text
        body: |
          A transfer is posted as 500 USD debited from Ryan and 500 GBP credited to Kevin. A check that only adds the plain numbers sees 50000 = 50000 and accepts it. But 500 GBP is about 625 USD at 1.25 dollars to the pound, so the bank just handed over 125 dollars for nothing. You can't add a dollar bill to a pound note and call it a total.
      - type: code
        lang: php
        file: 'Wrong: the check ignores currency'
        variant: bad
        code: |
          // 500 USD out, 500 GBP in: the plain numbers match, so it "balances"
          $this->post('Send money', [
              new Posting($ryanUsd, Side::Debit,  new Money(50000, 'USD')),
              new Posting($kevinGbp, Side::Credit, new Money(50000, 'GBP')),
          ]);
        marks:
          - {line: 4, tip: 'Two different currencies. With a total that ignores the currency, this is accepted and money appears from nowhere.'}
      - type: visual
        kind: table
        caption: 'The right way: Ryan pays 625 USD, Kevin receives 500 GBP (1 GBP = 1.25 USD)'
        headers: ['Account', 'Debit', 'Credit']
        rows:
          - cells: ['Ryan''s wallet (USD)', '625 USD', '—']
            tip: 'Ryan''s dollars leave his wallet.'
          - cells: ['FX clearing (USD)', '—', '625 USD']
            tip: 'The bank''s own dollar account takes the dollars in. Now the USD side has both a debit and a credit.'
          - cells: ['FX clearing (GBP)', '500 GBP', '—']
            tip: 'The bank''s own pound account gives the pounds out.'
          - cells: ['Kevin''s wallet (GBP)', '—', '500 GBP']
            tip: 'Kevin''s wallet receives the pounds.'
          - cells: ['USD total', '625', '625']
            tip: 'The USD entries balance on their own.'
          - cells: ['GBP total', '500', '500']
            tip: 'The GBP entries balance on their own. Both currencies pass the check.'
      - type: quote
        body: 'Debits equal credits in every currency, not in total.'
    aside:
      - type: pitfalls
        items:
          - 'The price: you need an FX clearing account per currency, and the rate used must be stored with the transaction (for example in the memo), or nobody can audit the conversion later.'
          - 'The database backs this up: an entry''s currency must equal its account''s currency, so a GBP entry can never land on a USD wallet.'
    check:
      q: 'Why is a USD 500 debit with a GBP 500 credit refused, and how do you post a real conversion?'
      a: 'USD nets to +500 and GBP to -500, so neither balances. Post four entries through FX clearing accounts, so each currency has its own debit and credit that match.'

flashcards:
  - q: 'What is the core rule of a double-entry ledger?'
    a: 'Every transaction has at least two entries, and total debits always equal total credits.'
    more: |
      Money leaves one account and enters another; it never just disappears. If the two sides don't match, the transaction isn't written at all, so "lost money" gets caught.
    ref: two-sides-of-every-move
  - q: 'What exactly goes wrong if you keep only a balance column?'
    a: 'Each UPDATE erases the old amount, so you can''t tell who changed it, when or why, and you can''t verify mistakes.'
    more: |
      In a book of entries, every change is a new line, so the balance for any date can be recomputed. That history is the real asset when auditing or hunting for a mismatch.
    ref: one-balance-column
  - q: 'Why are ledger entries never edited or deleted?'
    a: 'To keep history intact. When something is wrong, you write a new reversing transaction instead of editing.'
    more: |
      You can't cross out an ink line in a passbook and write a new number. Using `REVOKE UPDATE, DELETE` in the database means nobody can change an entry, even through a bug or in a rush.
    ref: ledger-schema
  - q: 'How is the balance computed in a ledger?'
    a: 'From the sum of all the account''s entries: credits added, debits subtracted (for liability-type accounts).'
    more: |
      The balance isn't a separate truth; it is the result of the entries. You can keep a cached column for speed, but if the two disagree, the entries are treated as correct, not the cache.
    ref: ledger-schema
  - q: 'Why does a ledger use a side (D/C) instead of a negative amount?'
    a: 'The amount is always a positive integer (CHECK amount > 0), and the direction is written explicitly as D or C. No confusion over negative numbers.'
    more: |
      What does "-500 debit" mean: does the balance go down or up? Keeping amount and direction apart avoids that doubt. The CHECK constraint stops bad amounts right in the DB.
    ref: ledger-schema
  - q: 'What is the right way to fix a wrong transaction?'
    a: 'Write a new transaction with every line of the original on the opposite side (a reversing entry). Never delete the old one.'
    more: |
      A UNIQUE constraint on `reverses_id` means the same transaction can't be reversed twice. After the reversal, write the corrected transaction separately.
    ref: posting-service
  - q: 'Why must debits equal credits in each currency, not just in total?'
    a: 'Plain numbers hide the currency: 500 USD out and 500 GBP in look equal, yet they are not the same money. Each currency must balance on its own.'
    more: |
      The service adds up debits minus credits per currency and refuses unless every currency is exactly zero. The database also insists that an entry's currency matches its account's currency.
    ref: each-currency-balances
  - q: 'How do you post a currency conversion in a ledger?'
    a: 'Four entries: customer wallet and FX clearing account in the old currency, then FX clearing account and customer wallet in the new one.'
    more: |
      Example: Ryan pays 625 USD, Kevin gets 500 GBP. USD: Ryan debit 625, FX clearing credit 625. GBP: FX clearing debit 500, Kevin credit 500. Each currency balances, and the rate is stored with the transaction.
    ref: each-currency-balances
  - q: 'Why does LedgerService write all entries in one DB transaction?'
    a: 'If it fails halfway, everything rolls back. So you never have a half-written transaction with a debit but no credit.'
    more: |
      Before writing, the service checks that the two sides add up. Then the transaction and all its entries go into one DB transaction: either everything is written or nothing is.
    ref: posting-service

quiz:
  - q: 'Rebecca sees her wallet is $50 short. With only a `wallet.balance` column, what can support do?'
    hint: 'What information would support use to find what was deducted?'
    options:
      - text: 'Prove nothing; only the current amount exists, with no history'
        correct: true
        why: 'Each UPDATE erased the previous amount. Who lowered it, when and why can no longer be known.'
      - text: 'Read the balance column''s log to reconstruct the full history'
        correct: false
        why: 'A column has no log. If you add a separate log, that log is a ledger.'
      - text: 'Look at the database''s `updated_at` to learn the reason'
        correct: false
        why: 'It only tells you the time of the last change, not the reason or the amount.'
      - text: 'Compare against the previous day''s backup and find everything'
        correct: false
        why: 'A backup is a once-a-day snapshot; it doesn''t contain what happened within the day.'
    ref: one-balance-column
  - q: 'Kevin sends Ryan $50 with a $1 fee. Which set of entries is correct?'
    hint: 'The two sides must add up to the same total.'
    options:
      - text: 'Kevin D 51, Ryan C 50'
        correct: false
        why: 'Debit 51 and credit 50 don''t match. There is no place for the $1.'
      - text: 'Kevin D 50, Ryan C 50, with the fee in a separate note'
        correct: false
        why: 'The fee is taken from Kevin''s wallet but no entry is written for it, so the books won''t balance.'
      - text: 'Kevin D 51, Ryan C 50, fee income C 1'
        correct: true
        why: 'Debit 51 = credit 51. The $1 fee is credited to income.'
      - text: 'Kevin D 51, Ryan C 51'
        correct: false
        why: 'It balances, but Ryan would receive $1 too much and there is no place for the fee.'
    ref: two-sides-of-every-move
  - q: 'Why is the code below dangerous in a ledger?'
    lang: php
    code: |
      $entry = $repo->find($entryId);
      $entry->setAmountMinor(5000);   // it was wrong, so I fixed it
      $em->flush();
    hint: 'Will anyone later know what the amount was before?'
    options:
      - text: 'The old amount is erased, and the two sides may no longer add up'
        correct: true
        why: 'Editing an entry destroys history, and changing one side can break debit = credit.'
      - text: '`flush()` is always slow'
        correct: false
        why: 'Speed isn''t the issue here; the problem is breaking the immutability rule.'
      - text: 'It should use `findOneBy()` instead of `find()`'
        correct: false
        why: 'Which method does the lookup makes no difference.'
      - text: 'It''s fine, because it put in the correct amount'
        correct: false
        why: 'Even with the right amount, editing entries is forbidden; you write a reversing entry and then a new correct transaction.'
    ref: posting-service
  - q: 'Which of these are sound ledger design choices?'
    hint: 'Think about history, direction and the sum.'
    options:
      - text: 'The amount is always positive, with the direction in a separate `side` column'
        correct: true
        why: 'It avoids confusion over the direction of a negative amount.'
      - text: 'The app''s DB user is not granted UPDATE/DELETE on the entry table'
        correct: true
        why: 'History can''t change, even through a bug or a rush.'
      - text: 'The balance is checked against the entries regularly'
        correct: true
        why: 'If a cached balance and the sum of entries differ, the error is caught; the entries are the right ones.'
      - text: 'The balance column is the source of truth and entries are just a log'
        correct: false
        why: 'The opposite. Entries are the source of truth; the balance is a figure computed from them.'
    ref: ledger-schema
  - q: 'What is wrong with this posting check?'
    lang: php
    code: |
      $debits  = array_sum(array_map(fn (Posting $p) =>
          Side::Debit === $p->side ? $p->money->amount : 0, $postings));
      $credits = array_sum(array_map(fn (Posting $p) =>
          Side::Credit === $p->side ? $p->money->amount : 0, $postings));
      if ($debits !== $credits) {
          throw new \DomainException('Not balanced');
      }
    hint: 'What if one debit is in USD and one credit is in GBP?'
    options:
      - text: 'It adds amounts of different currencies together, so 500 USD against 500 GBP passes'
        correct: true
        why: 'The check must total each currency separately and require every currency to net to zero.'
      - text: 'It should compare with `==` instead of `!==`'
        correct: false
        why: 'The comparison operator is not the problem; what is being compared is.'
      - text: 'It should throw only when `$debits` is larger than `$credits`'
        correct: false
        why: 'A credit larger than the debit is just as unbalanced.'
      - text: 'Nothing; equal totals always mean a balanced transaction'
        correct: false
        why: 'Equal totals mean balanced only when everything is in one currency.'
    ref: each-currency-balances
  - q: 'Ryan pays 625 USD and Kevin must receive 500 GBP. Which posting is correct?'
    hint: 'Each currency needs its own matching pair.'
    options:
      - text: 'Ryan D 625 USD, FX USD C 625 USD, FX GBP D 500 GBP, Kevin C 500 GBP'
        correct: true
        why: 'USD: 625 = 625. GBP: 500 = 500. Each currency balances on its own.'
      - text: 'Ryan D 625 USD, Kevin C 500 GBP'
        correct: false
        why: 'USD nets to +625 and GBP to -500; neither balances.'
      - text: 'Ryan D 625 USD, Kevin C 625 GBP'
        correct: false
        why: 'It balances as plain numbers, but Kevin would receive 625 pounds, not 500.'
      - text: 'Convert 500 GBP to USD in the code and post one 625 USD entry to Kevin''s GBP wallet'
        correct: false
        why: 'The entry''s currency must match the wallet''s currency, and the conversion would leave no trace in the books.'
    ref: each-currency-balances
  - q: 'To cancel a wrong transaction #1, reverse() is run twice. What happens?'
    hint: 'What constraint does the reverses_id column have in the schema?'
    options:
      - text: 'The second run hits the UNIQUE constraint; the same transaction can''t be reversed twice'
        correct: true
        why: 'Because of `reverses_id UNIQUE`, a transaction can have only one reversal.'
      - text: 'It is reversed twice, so the balance is correct again'
        correct: false
        why: 'Reversing twice would do the damage twice, which is why UNIQUE prevents it.'
      - text: 'The first reversal is deleted and the new one takes its place'
        correct: false
        why: 'Nothing in a ledger is deleted or edited.'
      - text: 'Nothing happens, because the service quietly ignores the second call'
        correct: false
        why: 'There is no code that ignores it silently; the DB constraint stops it with an error, which is exactly what you want.'
    ref: posting-service
