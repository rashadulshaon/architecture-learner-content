slides:
  - slug: one-balance-column
    title: 'শুধু balance কলাম: "আমার টাকা কই?"'
    kind: story
    tldr: 'শুধু একটা balance সংখ্যা রাখলে ইতিহাস থাকে না; ভুল হলে কে, কখন, কেন বদলাল জানার উপায় নেই।'
    keywords: ['balance column', 'audit trail', 'UPDATE balance', 'ledger', 'ইতিহাস', 'হিসাবের খাতা']
    blocks:
      - type: text
        body: |
          রহিমা সাপোর্টে ফোন করল: "আমার ওয়ালেটে ৫০০ টাকা কম, কে কাটল?" ডেটাবেসে আছে শুধু `balance = 1200`। কে কমাল, কেন, কখন — কিছুই লেখা নেই। দুইটা request একসাথে এসে একটা ঢাকা পড়ল কি না, তাও বোঝার উপায় নেই। ঠিক হিসাব তো দূরের কথা, ভুলটা কোথায় তা-ই ধরা যায় না।
      - type: code
        lang: sql
        file: 'যা CRUD অ্যাপ স্বভাবতই লেখে'
        variant: bad
        code: |
          UPDATE wallet
             SET balance = balance - 500
           WHERE id = 7;
          -- আগের অঙ্ক? কারণ? কে করল? সব হারিয়ে গেল।
        marks:
          - {line: 2, tip: 'পুরনো অঙ্কটা এই লাইনে মুছে নতুন অঙ্ক বসে। ইতিহাস বলে কিছু বাকি থাকে না।'}
      - type: visual
        kind: compare
        caption: 'শুধু balance বনাম entry-র খাতা'
        columns:
          - title: 'শুধু balance কলাম'
            tone: bad
            icon: cross
            tip: 'সহজ, কিন্তু প্রতিটা বদল আগের তথ্য মুছে দেয়।'
            items:
              - 'কে কমাল জানা যায় না'
              - 'ভুল হলে ঠিক অঙ্ক বের করা যায় না'
              - 'অডিটরকে দেখানোর কিছু নেই'
          - title: 'Entry-র খাতা (ledger)'
            tone: good
            icon: check
            tip: 'প্রতিটা লেনদেন একটা নতুন লাইন; balance সেই লাইনগুলোর যোগফল।'
            items:
              - 'প্রতিটা বদলের লাইন আছে'
              - 'balance যেকোনো দিনে নতুন করে হিসাব করা যায়'
              - 'অডিটর লাইন ধরে ধরে মেলাতে পারে'
    aside:
      - type: story
        title: 'দুই ভুলে একটা শূন্য'
        body: |
          এক অ্যাপে একটা bug ২০০ টাকা বেশি কেটেছিল, আরেকটা ২০০ টাকা কম। দুটো মিলে balance ঠিক দেখাচ্ছিল। শুধু balance থাকলে ভুল দুটো কেউ কখনো ধরত না; entry থাকায় একজন অডিটর দুটোই পেল।
      - type: remember
        body: 'balance একটা উত্তর, ইতিহাস নয়। ইতিহাস না থাকলে উত্তর যাচাই করা যায় না।'
    check:
      q: '`UPDATE ... SET balance = balance - 500` চালানোর পর কোন তথ্যটা হারিয়ে যায়?'
      a: 'পুরনো অঙ্ক, কেন কমল, কোন লেনদেনে কমল আর কে করল। থাকে শুধু নতুন অঙ্ক, তাই কিছু যাচাই করা যায় না।'

  - slug: two-sides-of-every-move
    title: 'টাকা একজনের ঘর থেকে আরেকজনের ঘরে'
    kind: concept
    tldr: 'প্রতিটা লেনদেন কমপক্ষে দুই entry: মোট debit সবসময় মোট credit-এর সমান; entry বদলায় না; balance entry থেকে হিসাব হয়।'
    keywords: ['double-entry', 'debit', 'credit', 'immutable', 'derived balance', 'ডাবল এন্ট্রি']
    blocks:
      - type: metaphor
        icon: book
        title: 'ব্যাংকের পাসবই'
        body: |
          পাসবইয়ে প্রতিটা লাইন কলমে লেখা — কেউ কেটে নতুন অঙ্ক বসায় না। জমা বা তোলা প্রতিটা লাইনের উল্টো পাশে আরেকজনের খাতায়ও একটা লাইন থাকে: টাকা কোথাও থেকে আসে, কোথাও যায়, উবে যায় না। বর্তমান ব্যালেন্স আলাদা কোথাও লেখা থাকে না; সব লাইন যোগ করলে যা আসে, সেটাই।
      - type: visual
        kind: table
        caption: 'রহিম করিমকে ৫০০ টাকা পাঠাল, ফি ১০ টাকা (সব অঙ্ক টাকায়)'
        headers: ['অ্যাকাউন্ট', 'Debit', 'Credit']
        rows:
          - cells: ['রহিমের ওয়ালেট', '৫১০', '—']
            tip: 'রহিমের ওয়ালেট থেকে ৫১০ টাকা বেরোল (৫০০ পাঠানো আর ১০ ফি)। ওয়ালেট আমাদের দায়, তাই debit মানে কমা।'
          - cells: ['করিমের ওয়ালেট', '—', '৫০০']
            tip: 'করিমের ওয়ালেটে ৫০০ টাকা ঢুকল। দায় বেড়েছে, তাই credit।'
          - cells: ['ফি আয়', '—', '১০']
            tip: 'আমাদের আয়ের খাতায় ১০ টাকা জমা। আয়ও credit দিকে বাড়ে।'
          - cells: ['মোট', '৫১০', '৫১০']
            tip: 'দুই পাশের যোগফল সমান না হলে লেনদেনটা নেওয়াই হয় না।'
      - type: quote
        body: 'প্রতিটা লেনদেনে মোট debit = মোট credit। entry লেখা হয়, বদলানো বা মোছা হয় না।'
    aside:
      - type: terms
        items:
          - {term: 'Entry', meaning: 'কোনো অ্যাকাউন্টে এক দিকের এক লাইন: অ্যাকাউন্ট, debit বা credit, অঙ্ক।'}
          - {term: 'Debit / Credit', meaning: 'খাতার দুই পাশ। ওয়ালেট বা আয়ের মতো দায়-ধরনের অ্যাকাউন্টে credit বাড়ায়, debit কমায়।'}
          - {term: 'Derived balance', meaning: 'আলাদা সংখ্যা নয়; entry-র যোগফল থেকে হিসাব করা অঙ্ক।'}
      - type: problem
        body: 'প্রতিটা টাকার উৎস আর গন্তব্য থাকে, তাই টাকা উবে যাওয়া বা শূন্য থেকে তৈরি হওয়া ধরা পড়ে।'
    check:
      q: 'রহিমের ওয়ালেট থেকে ৫১০ কেটে করিমের ওয়ালেটে ৫০০ গেল। বাকি ১০ টাকা কোথায়, আর কেন সেটা লিখতেই হবে?'
      a: 'ফি আয়ের অ্যাকাউন্টে ১০ credit হিসেবে। লেখা না হলে debit ৫১০ আর credit ৫০০ থাকে — অসমান, আর ১০ টাকা কোথায় গেল তার উত্তর নেই।'

  - slug: ledger-schema
    title: 'টেবিল বানানো: account, transaction, entry'
    kind: howto
    tldr: 'তিনটা টেবিল: account, transaction, entry; CHECK আর REVOKE দিয়ে ভুল অঙ্ক আর বদল আটকাও; balance = entry-র SUM।'
    keywords: ['ledger schema', 'SQL', 'CHECK constraint', 'REVOKE', 'SUM', 'ledger_entry']
    blocks:
      - type: text
        body: |
          তিনটা টেবিল যথেষ্ট। **account** হলো খাতার পাতা, **transaction** একটা ঘটনা (একটা পাঠানো), আর **entry** সেই ঘটনার প্রতিটা লাইন। অঙ্ক সবসময় ধনাত্মক integer, দিকটা `side` কলাম বলে। আর অ্যাপের ডেটাবেস user-কে UPDATE/DELETE-এর অধিকারই দেওয়া হয় না।
      - type: code
        lang: sql
        file: 'migrations — ledger schema'
        variant: good
        code: |
          CREATE TABLE ledger_account (
            id       bigserial PRIMARY KEY,
            code     text UNIQUE NOT NULL,      -- 'wallet:rahim', 'income:fees'
            currency char(3) NOT NULL
          );
          CREATE TABLE ledger_transaction (
            id          uuid PRIMARY KEY,
            memo        text NOT NULL,
            reverses_id uuid UNIQUE REFERENCES ledger_transaction (id),
            posted_at   timestamptz NOT NULL DEFAULT now()
          );
          CREATE TABLE ledger_entry (
            id             bigserial PRIMARY KEY,
            transaction_id uuid    NOT NULL REFERENCES ledger_transaction (id),
            account_id     bigint  NOT NULL REFERENCES ledger_account (id),
            side           char(1) NOT NULL CHECK (side IN ('D', 'C')),
            amount_minor   bigint  NOT NULL CHECK (amount_minor > 0),
            currency       char(3) NOT NULL
          );
          CREATE INDEX ON ledger_entry (account_id);

          REVOKE UPDATE, DELETE
            ON ledger_entry, ledger_transaction FROM app_user;
        marks:
          - {line: 9, tip: '`UNIQUE` মানে একটা লেনদেন একবারের বেশি বাতিল করা যায় না — ডবল reversal ঠেকায়।'}
          - {line: 17, tip: 'অঙ্ক সবসময় ০-র বেশি। কমা-বাড়ার দিক `side` ঠিক করে, ঋণাত্মক সংখ্যা নয়।'}
          - {line: 22, tip: 'অ্যাপের user ভুল করে বা bug-এ entry বদলাতেই পারে না। কলম দিয়ে লেখা পাতার মতো।'}
      - type: code
        lang: sql
        file: 'balance বের করা'
        variant: good
        code: |
          -- ওয়ালেট আমাদের দায়: credit বাড়ায়, debit কমায়
          SELECT COALESCE(SUM(
                   CASE side WHEN 'C' THEN amount_minor ELSE -amount_minor END
                 ), 0) AS balance_minor
            FROM ledger_entry
           WHERE account_id = 7;
        marks:
          - {line: 3, tip: 'credit যোগ, debit বিয়োগ। যোগফলই balance — কোথাও আলাদা সংখ্যা সংরক্ষিত নেই।'}
    aside:
      - type: tips
        items:
          - 'balance দ্রুত লাগলে একটা cache কলাম রাখো, কিন্তু সেটা entry থেকে বানানো হিসাব, সত্যের উৎস নয়। অমিল হলে entry-ই ঠিক।'
          - 'দুই-দিকের সমান হওয়ার নিয়মটা DB-তে বসাতে চাইলে PostgreSQL-এ `DEFERRABLE INITIALLY DEFERRED` constraint trigger দাও।'
      - type: refs
        items:
          - {to: 'concurrency/atomic-operations', label: 'এক transaction-এ সব entry'}
    check:
      q: 'ledger_entry-তে `amount_minor` ঋণাত্মক না রেখে `side` কলাম রাখা হলো কেন?'
      a: 'অঙ্কের দিক নিয়ে ভুল (যেমন ঋণাত্মক debit) এড়াতে। অঙ্ক সবসময় ধনাত্মক, আর দিকটা D বা C নামে স্পষ্ট লেখা থাকে।'

  - slug: posting-service
    title: 'Posting service: সমান না হলে লেখাই হবে না'
    kind: howto
    tldr: 'একটা service সব entry এক transaction-এ লেখে, আগে debit = credit মেলায়; ভুল হলে মোছে না, উল্টো entry-র একটা লেনদেন লেখে।'
    keywords: ['posting service', 'reversing entry', 'Symfony', 'DBAL transactional', 'Uuid::v7', 'reversal']
    blocks:
      - type: text
        body: |
          সব লেখা একটাই দরজা দিয়ে ঢুকবে: `LedgerService::post()`। সে আগে দুই পাশের যোগফল মেলায়, তারপর transaction আর entry একই DB transaction-এ লেখে। লেনদেন ভুল হলে মোছা বা বদলানো যায় না — তখন **reversing entry**, মানে প্রতিটা লাইনের উল্টো দিকের একটা নতুন লেনদেন লেখা হয়।
      - type: code
        lang: php
        file: 'src/Ledger/LedgerService.php'
        variant: good
        code: |
          /** @param list<Posting> $postings */
          public function post(string $memo, array $postings, ?Uuid $reverses = null): Uuid
          {
              $sum = fn (Side $s) => array_sum(array_map(
                  fn (Posting $p) => $p->side === $s ? $p->money->amount : 0, $postings));
              if ($sum(Side::Debit) !== $sum(Side::Credit) || 0 === $sum(Side::Debit)) {
                  throw new \DomainException('debit আর credit সমান নয়');
              }

              return $this->db->transactional(function () use ($memo, $postings, $reverses) {
                  $id = Uuid::v7();
                  $this->db->insert('ledger_transaction', [
                      'id' => $id->toRfc4122(), 'memo' => $memo,
                      'reverses_id' => $reverses?->toRfc4122(),
                  ]);
                  foreach ($postings as $p) {
                      $this->db->insert('ledger_entry', [
                          'transaction_id' => $id->toRfc4122(),
                          'account_id' => $p->accountId,
                          'side' => $p->side->value,
                          'amount_minor' => $p->money->amount,
                          'currency' => $p->money->currency,
                      ]);
                  }

                  return $id;
              });
          }
        marks:
          - {line: 6, tip: 'দুই পাশ না মিললে DB-র কাছে যাওয়ার আগেই থামে। অসমান লেনদেন কখনো লেখাই হয় না।'}
          - {line: 10, tip: 'transaction আর সব entry একসাথে। মাঝপথে ভাঙলে কিছুই লেখা থাকে না, অর্ধেক লেনদেন থাকে না।'}
          - {line: 14, tip: 'বাতিলের ক্ষেত্রে এখানে মূল লেনদেনের id বসে; UNIQUE থাকায় ডবল বাতিল হয় না।'}
      - type: code
        lang: php
        file: 'বাতিল করা: মোছা নয়, উল্টো entry'
        variant: good
        code: |
          public function reverse(Uuid $txId): Uuid
          {
              $original = $this->entries->forTransaction($txId);   // list<Posting>

              return $this->post(
                  memo: "বাতিল: {$txId->toRfc4122()}",
                  postings: array_map(fn (Posting $p) => $p->reversed(), $original),
                  reverses: $txId,
              );
          }
        marks:
          - {line: 7, tip: '`reversed()` প্রতিটা লাইনের debit-কে credit আর credit-কে debit করে। অঙ্ক একই থাকে।'}
          - {line: 8, tip: 'মূল লেনদেনের সাথে সম্পর্কটা লেখা থাকে, তাই অডিটর দুটোকে জোড়ায় দেখতে পায়।'}
      - type: visual
        kind: table
        caption: 'রহিমের ওয়ালেট, করিমের ওয়ালেট আর ফি আয়ে প্রভাব (টাকায়)'
        headers: ['লেনদেন', 'রহিম', 'করিম', 'ফি আয়']
        rows:
          - cells: ['#১ পাঠানো', '−৫১০', '+৫০০', '+১০']
            tip: 'মূল লেনদেন, যা ভুল ছিল। এটা সারা জীবন খাতায় থাকবে।'
          - cells: ['#২ বাতিল (#১-এর)', '+৫১০', '−৫০০', '−১০']
            tip: 'প্রতিটা লাইনের উল্টো। #১ মোছা হয়নি, তার প্রভাব কেটে দেওয়া হয়েছে।'
          - cells: ['মোট', '০', '০', '০']
            tip: 'দুই লেনদেন মিলিয়ে সবার balance আগের মতো, আর ইতিহাসে দুটো লাইনই আছে।'
    aside:
      - type: pitfalls
        items:
          - 'ভুল entry-তে UPDATE বা DELETE চালিও না। পরে কেউ জানবে না আসলে কী ঘটেছিল।'
          - 'বাতিলের পর সঠিক অঙ্কের নতুন লেনদেন আলাদা করে লেখো; বাতিলটা আর "ঠিক করা" একসাথে নয়।'
      - type: refs
        items:
          - {to: 'workflows/refunds-reversals', label: 'Refund আর reversal'}
          - {to: 'recovery/corrective-actions', label: 'ভুল ডেটা শুধরানো'}
    check:
      q: 'ভুল লেনদেন মুছে না দিয়ে উল্টো entry লেখার সুবিধা কী?'
      a: 'ইতিহাস অটুট থাকে: মূল ভুল আর তার বাতিল দুটোই দেখা যায়। অডিটর বুঝতে পারে কী ঘটেছিল, কখন, আর কীভাবে শোধরানো হলো।'

flashcards:
  - q: 'Double-entry ledger-এর মূল নিয়ম কী?'
    a: 'প্রতিটা লেনদেনে কমপক্ষে দুই entry; মোট debit সবসময় মোট credit-এর সমান।'
    more: |
      টাকা এক অ্যাকাউন্ট থেকে বেরিয়ে অন্য অ্যাকাউন্টে ঢোকে, কোথাও উবে যায় না। দুই পাশ না মিললে লেনদেনটা লেখাই হয় না, তাই "টাকা হারানো" ধরা পড়ে।
    ref: two-sides-of-every-move
  - q: 'শুধু balance কলাম রাখলে ঠিক কোন সমস্যা হয়?'
    a: 'প্রতিটা UPDATE পুরনো অঙ্ক মুছে দেয়, তাই কে, কখন, কেন বদলাল জানা যায় না; ভুলও যাচাই করা যায় না।'
    more: |
      Entry-র খাতায় প্রতিটা বদল একটা নতুন লাইন, তাই যেকোনো তারিখের balance আবার হিসাব করা যায়। অডিট আর অমিল খোঁজার জন্য এই ইতিহাসই আসল সম্পদ।
    ref: one-balance-column
  - q: 'Ledger-এর entry কেন বদলানো বা মোছা হয় না?'
    a: 'ইতিহাস অটুট রাখতে। ভুল হলে বদলানো নয়, উল্টো entry-র নতুন লেনদেন লেখা হয়।'
    more: |
      পাসবইয়ের কালির লাইন কেটে নতুন অঙ্ক বসানো যায় না। ডেটাবেসে `REVOKE UPDATE, DELETE` দিলে bug বা তাড়াহুড়োয়ও কেউ entry বদলাতে পারে না।
    ref: ledger-schema
  - q: 'Ledger-এ balance কীভাবে বের হয়?'
    a: 'অ্যাকাউন্টের সব entry-র যোগফল থেকে: credit যোগ, debit বিয়োগ (দায়-ধরনের অ্যাকাউন্টে)।'
    more: |
      balance আলাদা সত্য নয়, entry-র ফল। গতির জন্য cache কলাম রাখা যায়, কিন্তু অমিল হলে entry-ই ঠিক ধরা হয়, cache নয়।
    ref: ledger-schema
  - q: 'Ledger-এ amount ঋণাত্মক না রেখে side (D/C) রাখা হয় কেন?'
    a: 'অঙ্ক সবসময় ধনাত্মক integer থাকে (CHECK amount > 0), আর দিক স্পষ্টভাবে D বা C লেখা হয়। ঋণাত্মক সংখ্যার দিক নিয়ে ভুল হয় না।'
    more: |
      "−৫০০ debit" মানে কী — কমল না বাড়ল? এই দ্বিধা এড়াতেই অঙ্ক আর দিক আলাদা রাখা হয়। CHECK constraint ভুল অঙ্ক DB-তেই আটকে দেয়।
    ref: ledger-schema
  - q: 'ভুল লেনদেন ঠিক করার সঠিক উপায় কী?'
    a: 'মূল লেনদেনের প্রতিটা লাইনের উল্টো দিকের একটা নতুন লেনদেন (reversing entry) লেখা; পুরনোটা মোছা নয়।'
    more: |
      `reverses_id`-তে UNIQUE দিলে একই লেনদেন দুইবার বাতিল করা যায় না। বাতিলের পর সঠিক অঙ্কের নতুন লেনদেন আলাদা করে লিখতে হয়।
    ref: posting-service
  - q: 'LedgerService কেন সব entry একই DB transaction-এ লেখে?'
    a: 'মাঝপথে ভাঙলে সব rollback হয়। তাই অর্ধেক লেখা লেনদেন থাকে না, যেখানে debit আছে কিন্তু credit নেই।'
    more: |
      লেখার আগে service দুই পাশের যোগফল মেলায়। তারপর transaction আর তার সব entry এক DB transaction-এ ঢোকে — হয় সব লেখা হয়, নয় কিছুই না।
    ref: posting-service

quiz:
  - q: 'রহিমা দেখল তার ওয়ালেটে ৫০০ টাকা কম। শুধু `wallet.balance` কলাম থাকলে সাপোর্ট কী করতে পারে?'
    hint: 'কোন তথ্য দিয়ে সাপোর্ট খুঁজবে কী কাটা গেছে?'
    options:
      - text: 'কিছুই প্রমাণ করতে পারে না; শুধু বর্তমান অঙ্ক আছে, ইতিহাস নেই'
        correct: true
        why: 'প্রতিটা UPDATE আগের অঙ্ক মুছে ফেলেছে। কে, কখন, কেন কমাল তা আর জানা যায় না।'
      - text: 'balance কলামের log দেখে পুরো ইতিহাস বের করতে পারে'
        correct: false
        why: 'কলামের কোনো log থাকে না। আলাদা log যোগ করলে সেটাই তো ledger হয়ে গেল।'
      - text: 'ডেটাবেসের `updated_at` দেখে কারণ জানতে পারে'
        correct: false
        why: 'এটা শুধু শেষ বদলের সময় বলে; কারণ বা অঙ্ক বলে না।'
      - text: 'আগের দিনের backup মিলিয়ে সব খুঁজে পায়'
        correct: false
        why: 'backup দিনে একবারের ছবি; এক দিনের মধ্যে কী ঘটেছে তা তাতে থাকে না।'
    ref: one-balance-column
  - q: 'করিম ৫০০ টাকা রহিমকে পাঠাল, ফি ১০ টাকা। কোন entry-সেটটা সঠিক?'
    hint: 'দুই পাশের যোগফল সমান হতে হবে।'
    options:
      - text: 'করিম D ৫১০, রহিম C ৫০০'
        correct: false
        why: 'debit ৫১০, credit ৫০০ — অসমান। ১০ টাকার ঘর নেই।'
      - text: 'করিম D ৫০০, রহিম C ৫০০, আর ফি আলাদা নোটে'
        correct: false
        why: 'ফি করিমের ওয়ালেট থেকে কাটছে, কিন্তু কোনো entry লেখা নেই; হিসাব মিলবে না।'
      - text: 'করিম D ৫১০, রহিম C ৫০০, ফি আয় C ১০'
        correct: true
        why: 'debit ৫১০ = credit ৫১০। ১০ টাকা ফি আয়ে জমা হলো।'
      - text: 'করিম D ৫১০, রহিম C ৫১০'
        correct: false
        why: 'সমান ঠিকই, কিন্তু রহিম ১০ টাকা বেশি পেল, ফি-র কোনো ঘর নেই।'
    ref: two-sides-of-every-move
  - q: 'নিচের কোড কেন একটা ledger-এর জন্য বিপজ্জনক?'
    lang: php
    code: |
      $entry = $repo->find($entryId);
      $entry->setAmountMinor(5000);   // ভুল ছিল, ঠিক করে দিলাম
      $em->flush();
    hint: 'পরে কেউ জানবে কি আগে কত ছিল?'
    options:
      - text: 'আগের অঙ্ক মুছে যায়, আর দুই পাশের যোগফলও মিলে না থাকতে পারে'
        correct: true
        why: 'entry বদলালে ইতিহাস যায়, আর এক পাশ বদলালে debit = credit ভেঙে যেতে পারে।'
      - text: '`flush()` সবসময় ধীর'
        correct: false
        why: 'গতি এখানে সমস্যা নয়; সমস্যা immutable নিয়ম ভাঙা।'
      - text: '`find()` ব্যবহার না করে `findOneBy()` লাগে'
        correct: false
        why: 'কোন method দিয়ে খোঁজা হলো তাতে কিছু আসে-যায় না।'
      - text: 'ঠিক আছে, সঠিক অঙ্ক বসিয়েছে বলে'
        correct: false
        why: 'অঙ্ক ঠিক হলেও entry বদলানো নিষিদ্ধ; reversing entry লিখে নতুন সঠিক লেনদেন লিখতে হয়।'
    ref: posting-service
  - q: 'ledger-এ কোনগুলো সঠিক নকশা?'
    hint: 'ইতিহাস, দিক আর যোগফল ভাবো।'
    options:
      - text: 'amount সবসময় ধনাত্মক, দিক আলাদা `side` কলামে'
        correct: true
        why: 'ঋণাত্মক অঙ্কের দিক নিয়ে ভুল এড়ায়।'
      - text: 'অ্যাপের DB user-কে entry টেবিলে UPDATE/DELETE দেওয়া হয় না'
        correct: true
        why: 'bug বা তাড়াহুড়োয়ও ইতিহাস বদলায় না।'
      - text: 'balance নিয়মিত entry-র সাথে মিলিয়ে দেখা যায়'
        correct: true
        why: 'cache balance আর entry-র যোগফল আলাদা হলে ভুল ধরা পড়ে; তখন entry-ই ঠিক।'
      - text: 'balance কলামটাই সত্যের উৎস, entry শুধু log'
        correct: false
        why: 'উল্টো। entry সত্যের উৎস; balance তার হিসাব করা ফল।'
    ref: ledger-schema
  - q: 'একটা ভুল লেনদেন #১ বাতিল করতে গিয়ে reverse() দুইবার চালানো হলো। কী হবে?'
    hint: 'schema-তে reverses_id কলামে কী constraint আছে?'
    options:
      - text: 'দ্বিতীয়বার UNIQUE constraint-এ আটকে যায়; একই লেনদেন দুইবার বাতিল হয় না'
        correct: true
        why: '`reverses_id UNIQUE` থাকায় একটা লেনদেনের একটাই বাতিল থাকতে পারে।'
      - text: 'দুইবার বাতিল হয়, তাই balance আবার ঠিক হয়ে যায়'
        correct: false
        why: 'দুইবার উল্টালে ডাবল ক্ষতি হতো; তাই UNIQUE দিয়ে ঠেকানো হয়েছে।'
      - text: 'প্রথম বাতিলটা মুছে নতুনটা বসে'
        correct: false
        why: 'ledger-এ কিছু মোছা বা বদলানো হয় না।'
      - text: 'কিছু ঘটে না, কারণ service নিজে চুপচাপ দ্বিতীয়বার উপেক্ষা করে'
        correct: false
        why: 'চুপচাপ উপেক্ষা করার কোনো কোড নেই; DB constraint error দিয়ে থামায়, আর সেটাই চাওয়া।'
    ref: posting-service
